[flake8]
max-line-length = 120
extend-ignore = E203, W503, E501
exclude = .git,__pycache__,docs/conf.py,old,build,dist,.venv,venv,.tox
per-file-ignores =
    __init__.py:F401

[isort]
profile = black
line_length = 120

[tool:pytest]
testpaths = tests
python_files = test_*.py
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    sqlite: marks tests that require SQLite
