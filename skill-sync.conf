# Skills for BenchBox. See tools/skill-sync and the upstream README.
#
# Sources are local Git checkouts: skill-sync never fetches. Point these at
# wherever these repositories are cloned on this machine. CI clones the
# canonical https URLs below to these same paths before applying.
#
# To ship a catalog edit, commit it in skill-sync-skills and bump `rev` below.
# To ship a todo-db skill edit, commit it in todo-db and bump `rev` below.
# There is no dependency resolver: every skill, including shared
# prerequisites the old tool materialized implicitly (shared-agent-execution
# for bossmode), is listed explicitly.

target = .claude/skills
target = .agents/skills

# Canonical shared catalog: joeharris76/skill-sync-skills
source = ~/Developer/skill-sync-skills
rev    = 872689923e9f707a44e0aff0c71ac7a7e98d28be
dir    = skills
skill  = bossmode
# Curated out of the committed snapshot but still materialized locally (the
# old claude-target `ignore: [blog]`): cloud is Claude-only and `blog` is
# published separately. `.claude/skills/blog/` stays gitignored (see
# .gitignore), and scripts/check_untracked_skill_mirrors.sh fails the build
# if it ever becomes git-tracked. Note the old `ignore` never hid the skill
# from local agents either: it was always present on disk after a sync, and
# it still is. What changed is verification: the old `verify` skipped
# `ignore`d paths, while `skill-sync verify` checks every selected skill's
# bytes, including blog.
skill  = blog
skill  = code
skill  = test
skill  = docs
skill  = benchbox
skill  = tidy-perms
# Shared prerequisites of the skills above. There is no dependency resolver,
# so every prerequisite is listed.
skill  = shared-agent-execution
skill  = shared-change-framework
skill  = shared-investigation-framework
skill  = shared-review-protocol

# The todo-db skill is owned by the todo-db repository.
source = ~/Developer/todo-db
rev    = 5151458a1535426272007ae32911d8fbb54988e6
dir    = skills
skill  = todo-db

# The skill-sync operator skill is owned by the product repository.
source = ~/Developer/skill-sync
rev    = 25e1e47693d8b0b2aba91d3ad3dbc0c14b8d3c4c
dir    = skills
skill  = skill-sync
