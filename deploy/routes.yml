version: 1
renderer: auto
refs:
  release:
    kind: release-tag
  trunk:
    kind: trunk
routes:
  - path: /
    ref: trunk
    builder: landing
  - path: /docs/
    ref: trunk
    builder: docs
  - path: /docs/dev/
    ref: trunk
    builder: docs
  - path: /blog/
    ref: trunk
    builder: blog
  - path: /results/
    ref: trunk
    builder: explorer
    corpus: results-data
root_files:
  ref: trunk
  files:
    - CNAME
    - .nojekyll
    - 404.html
