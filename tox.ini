[tox]
envlist = py{39,310,311,312,313,314}, lint, docs
isolated_build = True

[gh-actions]
python =
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314, lint, docs

[testenv]
deps =
    pytest>=8.0.0
    pytest-cov>=4.1.0
commands =
    pytest {posargs:tests} --cov=benchbox --cov-report=xml --cov-report=term

[testenv:lint]
deps =
    ruff>=0.5.0
    ty>=0.0.1a14
commands =
    ruff format --check .
    ruff check .
    ty check

[testenv:docs]
deps =
    sphinx>=7.2.0
    sphinx-rtd-theme>=2.0.0
    myst-parser>=2.0.0
commands =
    sphinx-build -b html docs docs/_build/html
    sphinx-build -b linkcheck docs docs/_build/linkcheck
