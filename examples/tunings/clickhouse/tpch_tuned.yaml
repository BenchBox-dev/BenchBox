    table_name: LINEITEM
    partitioning:
    - name: L_SHIPDATE
      type: DATE
      order: 1
    sorting:
    - name: L_SHIPDATE
      type: DATE
      order: 1
    - name: L_ORDERKEY
      type: INTEGER
      order: 2
    - name: L_LINENUMBER
      type: INTEGER
      order: 3

  ORDERS:
    table_name: ORDERS
    partitioning:
    - name: O_ORDERDATE
      type: DATE
      order: 1
    sorting:
    - name: O_ORDERDATE
      type: DATE
      order: 1
    - name: O_ORDERKEY
      type: INTEGER
      order: 2
