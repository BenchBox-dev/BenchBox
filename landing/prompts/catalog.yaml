# Source data for the /prompts/ landing route.
#
# This file is consumed by scripts/generate_landing_quickstarts.py, which
# emits landing/prompts/catalog.generated.js. Do not hand-edit the .js
# include; edit this YAML and re-run the generator.
#
# Validation rules (see scripts/generate_landing_quickstarts.py):
# - prompt platforms are derived from PlatformRegistry, not listed here
# - optional `platform_overrides` keys must match real promptable
#   PlatformRegistry ids and may only correct presentation/safety metadata
# - every `benchmarks[].id` must exist in BENCHMARK_METADATA
# - `deployments[].id` must be in {local, self-hosted, managed}
# - `mcp.run_tool`, `mcp.list_tool`, `mcp.prompts.*` must reference real
#   MCP tools/prompts registered in benchbox/mcp/
# - the compare CLI template must include two `--platform` flags

defaults:
  goal: test_one
  surface: cli
  interface: sql
  deployment: local
  platform: duckdb
  benchmark: tpch
  scale: "0.01"

surfaces:
  - { id: cli, label: "CLI" }
  - { id: mcp, label: "MCP" }

goals:
  - { id: test_one, label: "Test one platform" }
  - { id: compare, label: "Compare platforms" }

interfaces:
  - { id: sql, label: "SQL" }
  - { id: dataframe, label: "DataFrame" }

deployments:
  - { id: local, label: "Local" }
  - { id: self-hosted, label: "Self-hosted" }
  - { id: managed, label: "Managed cloud" }

# Optional presentation/safety corrections for registry-derived platforms.
# This is intentionally not an inclusion list: supported platform ids come
# from PlatformRegistry at generation time. Interface and deployment filter
# membership also remains registry-derived.
platform_overrides:
  doris:
    platform_option_hints:
      - "--platform-option port=9030"
      - "--platform-option http_port=8030"
  questdb:
    platform_option_hints:
      - "--platform-option http_port=9000  # REST endpoint, distinct from SQL port 8812"
  singlestore:
    platform_option_hints:
      - "--platform-option port=3306  # adapter default; override if local Docker maps a different host port"
      - "--platform-option password=<value>  # local/self-managed password"
  starrocks:
    platform_option_hints:
      - "--platform-option port=9030"
      - "--platform-option http_port=8040"
  velox:
    platform_option_hints:
      - "--platform-option deployment=remote"
      - "--platform-option endpoint=sc://host:50051  # Spark Connect"

# Curated benchmark subset for MVP. Validator confirms IDs exist in
# BENCHMARK_METADATA.
benchmarks:
  - id: tpch
    label: "TPC-H"
    interfaces: [sql, dataframe]
  - id: tpcds
    label: "TPC-DS"
    interfaces: [sql, dataframe]
    requires_bundled_dsdgen_below: "1.0"
  - id: clickbench
    label: "ClickBench"
    interfaces: [sql]
  - id: ssb
    label: "SSB"
    interfaces: [sql]

scales:
  - "0.01"
  - "0.1"
  - "1.0"
  - "10.0"

runtime_hints:
  log_dir: "/tmp"
  log_slug_template: "bench_{platform}_{benchmark}_{scale}"
  long_run_threshold_scale: "0.1"

# Command templates rendered into copyable blocks. Validator checks the
# compare template uses two `--platform` flags so the page never emits a
# malformed compare command.
templates:
  cli:
    test_one: "uv run benchbox run --platform {platform} --benchmark {benchmark} --scale {scale} --non-interactive"
    compare: "uv run benchbox compare --platform {platform_a} --platform {platform_b} --benchmark {benchmark} --scale {scale} --non-interactive"
    dependency_check: "uv run benchbox check-deps --platform {platform}"
    dry_run: "uv run benchbox run --dry-run {dry_run_dir} --platform {platform} --benchmark {benchmark} --scale {scale}"
    results_paths: "uv run benchbox results --paths --limit 1"
    show_cli: "uv run benchbox results show-cli <result-json>"
    provenance_snapshot: |
      mkdir -p <bundle-dir>/_provenance
      uv run benchbox --version-json > <bundle-dir>/_provenance/version.json
      uv run benchbox profile > <bundle-dir>/_provenance/system.txt
      echo "<exact command line used>" > <bundle-dir>/_provenance/command.txt
    force_datagen_footer: "If the load phase fails partway, re-run with `--force datagen` appended."
    capture_plans_footer: "To capture EXPLAIN plans, add `--capture-plans` to the live command and inspect with `benchbox show-plan --run <result-json> --query-id Q1`."

# References to existing MCP surfaces. The generator validates each name
# resolves to a real tool/prompt in benchbox/mcp/.
mcp:
  run_tool: run_benchmark
  list_tool: list_available
  system_profile_tool: system_profile
  prompts:
    benchmark_run: benchmark_run
    compare_platforms: compare_platforms
    analyze_results: analyze_results
