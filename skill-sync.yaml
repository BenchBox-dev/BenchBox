version: 1
sources:
  - name: canonical
    type: git
    url: https://github.com/joeharris76/skill-sync-skills.git
    ref: e377ff3e74377e54c2ffbbfcdd5e67bbfd728f19
    subdir: skills
skills:
  - blog
  - code
  - test
  - docs
  - todo
  - todo-db
  - benchbox
  - SHARED/review-protocol
  - SHARED/change-framework
  - SHARED/investigation-framework
  - skill-sync
  - tidy-perms
targets:
  claude:
    dir: .claude/skills
    tracked: true
    ignore: [blog]
  codex: .codex/skills
  gemini: .gemini/skills
  antigravity: .antigravity/skills
install_mode: mirror
config:
  code:
    lint: "uv run ruff check ."
    lint_fix: "uv run ruff check --fix ."
    format: "uv run ruff format ."
    typecheck: "uv run ty check"
    fast_test: "uv run -- python -m pytest -m fast -q"
    verify: "uv run ruff check . && uv run ty check && uv run -- python -m pytest -m fast -q"
    line_length: 120
  test:
    runner: pytest
    coverage: "uv run -- python -m pytest --cov=benchbox --cov-report=term-missing"
