version: 1
sources:
  - name: canonical
    type: git
    url: https://github.com/joeharris76/skill-sync-skills.git
    ref: d22ea7fab6b7b9608e54a3910ab4dfa9bb407d42
    subdir: skills
  - name: todo-db
    type: git
    url: https://github.com/joeharris76/todo-db.git
    ref: b8dda65c53f4a8fa443ec09a7419576ea8362e90
    subdir: skills
  - name: product
    type: git
    url: https://github.com/joeharris76/skill-sync.git
    ref: 6139085a35455fe90c8d6c94d7567e131a24db96
    subdir: skills
skills:
  - bossmode
  - blog
  - code
  - test
  - docs
  - todo-db
  - benchbox
  - shared-review-protocol
  - shared-change-framework
  - shared-investigation-framework
  - skill-sync
  - tidy-perms
targets:
  claude:
    dir: .claude/skills
    tracked: true
    ignore: [blog]
  # .agents/skills is the interoperable workspace root used by Codex, Gemini,
  # and Antigravity. Keep one generated mirror instead of three copies.
  agents: .agents/skills
install_mode: mirror
overrides:
  skill-sync:
    source_name: product
  todo-db:
    source_name: todo-db
config:
  code:
    lint: "uv run ruff check ."
    lint_fix: "uv run ruff check --fix ."
    format: "uv run ruff format ."
    typecheck: "uv run ty check"
    fast_test: "uv run -- python -m pytest -m fast -q"
    verify: "uv run ruff check . && uv run ty check && uv run -- python -m pytest -m fast -q"
    line_length: 120
    # Project-specific review checks. The shared five-axis rubric deliberately
    # carries no BenchBox-specific items and only applies these when this key is
    # set, so a check dropped from the rubric without landing here is simply lost.
    review_checklist:
      - >-
        For TODOs claiming to retire a SQL-translation post-fixup from a harness
        PASS, grep the helper call site and confirm the harness probe matches the
        wrapper's `read=` argument. A single-dialect PASS cannot retire a helper
        invoked with SQLGlot cross-dialect translation.
  test:
    runner: pytest
    coverage: "uv run -- python -m pytest --cov=benchbox --cov-report=term-missing"
