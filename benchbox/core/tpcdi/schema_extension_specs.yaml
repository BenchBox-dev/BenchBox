extension_tables:
- id: DIMBROKER
  key: DimBroker
  schema:
    name: DimBroker
    columns:
    - name: SK_BrokerID
      type: BIGINT
      primary_key: true
    - name: BrokerID
      type: BIGINT
    - name: ManagerID
      type: BIGINT
    - name: FirstName
      type: VARCHAR(50)
    - name: LastName
      type: VARCHAR(50)
    - name: MiddleInitial
      type: VARCHAR(1)
    - name: Branch
      type: VARCHAR(50)
    - name: Office
      type: VARCHAR(50)
    - name: Phone
      type: VARCHAR(30)
    - name: IsCurrent
      type: BOOLEAN
    - name: BatchID
      type: BIGINT
    - name: EffectiveDate
      type: DATE
    - name: EndDate
      type: DATE
- id: FACTCASHBALANCES
  key: FactCashBalances
  schema:
    name: FactCashBalances
    columns:
    - name: SK_CustomerID
      type: BIGINT
    - name: SK_AccountID
      type: BIGINT
    - name: SK_DateID
      type: BIGINT
    - name: Cash
      type: DECIMAL(15,2)
    - name: BatchID
      type: BIGINT
    primary_key:
    - SK_CustomerID
    - SK_AccountID
    - SK_DateID
- id: FACTHOLDINGS
  key: FactHoldings
  schema:
    name: FactHoldings
    columns:
    - name: SK_CustomerID
      type: BIGINT
    - name: SK_AccountID
      type: BIGINT
    - name: SK_SecurityID
      type: BIGINT
    - name: SK_CompanyID
      type: BIGINT
    - name: SK_DateID
      type: BIGINT
    - name: SK_TimeID
      type: BIGINT
    - name: CurrentPrice
      type: DECIMAL(8,2)
    - name: CurrentHolding
      type: BIGINT
    - name: BatchID
      type: BIGINT
    primary_key:
    - SK_CustomerID
    - SK_AccountID
    - SK_SecurityID
    - SK_DateID
- id: FACTMARKETHISTORY
  key: FactMarketHistory
  schema:
    name: FactMarketHistory
    columns:
    - name: SK_SecurityID
      type: BIGINT
    - name: SK_CompanyID
      type: BIGINT
    - name: SK_DateID
      type: BIGINT
    - name: PERatio
      type: DECIMAL(10,2)
    - name: Yield
      type: DECIMAL(5,4)
    - name: FiftyTwoWeekHigh
      type: DECIMAL(8,2)
    - name: SK_FiftyTwoWeekHighDate
      type: BIGINT
    - name: FiftyTwoWeekLow
      type: DECIMAL(8,2)
    - name: SK_FiftyTwoWeekLowDate
      type: BIGINT
    - name: DividendPerShare
      type: DECIMAL(8,4)
    - name: ClosePrice
      type: DECIMAL(8,2)
    - name: DayHigh
      type: DECIMAL(8,2)
    - name: DayLow
      type: DECIMAL(8,2)
    - name: Volume
      type: BIGINT
    - name: BatchID
      type: BIGINT
    primary_key:
    - SK_SecurityID
    - SK_DateID
- id: FACTWATCHES
  key: FactWatches
  schema:
    name: FactWatches
    columns:
    - name: SK_CustomerID
      type: BIGINT
    - name: SK_SecurityID
      type: BIGINT
    - name: SK_DateID_DatePlaced
      type: BIGINT
    - name: SK_DateID_DateRemoved
      type: BIGINT
    - name: BatchID
      type: BIGINT
    primary_key:
    - SK_CustomerID
    - SK_SecurityID
    - SK_DateID_DatePlaced
- id: INDUSTRY
  key: Industry
  schema:
    name: Industry
    columns:
    - name: IN_ID
      type: VARCHAR(2)
      primary_key: true
    - name: IN_NAME
      type: VARCHAR(50)
    - name: IN_SC_ID
      type: VARCHAR(4)
- id: STATUSTYPE
  key: StatusType
  schema:
    name: StatusType
    columns:
    - name: ST_ID
      type: VARCHAR(4)
      primary_key: true
    - name: ST_NAME
      type: VARCHAR(10)
- id: TAXRATE
  key: TaxRate
  schema:
    name: TaxRate
    columns:
    - name: TX_ID
      type: VARCHAR(4)
      primary_key: true
    - name: TX_NAME
      type: VARCHAR(50)
    - name: TX_RATE
      type: DECIMAL(6,5)
- id: TRADETYPE
  key: TradeType
  schema:
    name: TradeType
    columns:
    - name: TT_ID
      type: VARCHAR(3)
      primary_key: true
    - name: TT_NAME
      type: VARCHAR(12)
    - name: TT_IS_SELL
      type: BOOLEAN
    - name: TT_IS_MRKT
      type: BOOLEAN
table_order:
- Industry
- StatusType
- TaxRate
- TradeType
- DimBroker
- FactCashBalances
- FactHoldings
- FactMarketHistory
- FactWatches
foreign_key_constraints:
  DimBroker:
  - column: ManagerID
    references_table: DimBroker
    references_column: BrokerID
    constraint_name: FK_DimBroker_Manager
  FactCashBalances:
  - column: SK_CustomerID
    references_table: DimCustomer
    references_column: SK_CustomerID
    constraint_name: FK_FactCashBalances_Customer
  - column: SK_AccountID
    references_table: DimAccount
    references_column: SK_AccountID
    constraint_name: FK_FactCashBalances_Account
  - column: SK_DateID
    references_table: DimDate
    references_column: SK_DateID
    constraint_name: FK_FactCashBalances_Date
  FactHoldings:
  - column: SK_CustomerID
    references_table: DimCustomer
    references_column: SK_CustomerID
    constraint_name: FK_FactHoldings_Customer
  - column: SK_AccountID
    references_table: DimAccount
    references_column: SK_AccountID
    constraint_name: FK_FactHoldings_Account
  - column: SK_SecurityID
    references_table: DimSecurity
    references_column: SK_SecurityID
    constraint_name: FK_FactHoldings_Security
  - column: SK_CompanyID
    references_table: DimCompany
    references_column: SK_CompanyID
    constraint_name: FK_FactHoldings_Company
  - column: SK_DateID
    references_table: DimDate
    references_column: SK_DateID
    constraint_name: FK_FactHoldings_Date
  - column: SK_TimeID
    references_table: DimTime
    references_column: SK_TimeID
    constraint_name: FK_FactHoldings_Time
  FactMarketHistory:
  - column: SK_SecurityID
    references_table: DimSecurity
    references_column: SK_SecurityID
    constraint_name: FK_FactMarketHistory_Security
  - column: SK_CompanyID
    references_table: DimCompany
    references_column: SK_CompanyID
    constraint_name: FK_FactMarketHistory_Company
  - column: SK_DateID
    references_table: DimDate
    references_column: SK_DateID
    constraint_name: FK_FactMarketHistory_Date
  - column: SK_FiftyTwoWeekHighDate
    references_table: DimDate
    references_column: SK_DateID
    constraint_name: FK_FactMarketHistory_HighDate
  - column: SK_FiftyTwoWeekLowDate
    references_table: DimDate
    references_column: SK_DateID
    constraint_name: FK_FactMarketHistory_LowDate
  FactWatches:
  - column: SK_CustomerID
    references_table: DimCustomer
    references_column: SK_CustomerID
    constraint_name: FK_FactWatches_Customer
  - column: SK_SecurityID
    references_table: DimSecurity
    references_column: SK_SecurityID
    constraint_name: FK_FactWatches_Security
  - column: SK_DateID_DatePlaced
    references_table: DimDate
    references_column: SK_DateID
    constraint_name: FK_FactWatches_DatePlaced
  - column: SK_DateID_DateRemoved
    references_table: DimDate
    references_column: SK_DateID
    constraint_name: FK_FactWatches_DateRemoved
