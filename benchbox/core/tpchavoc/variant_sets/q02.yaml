variants:
- id: 1
  description: 'Scalar subqueries: Use scalar subqueries for min cost calculation'
  sql: |2

    select
        s_acctbal,
        s_name,
        n_name,
        p_partkey,
        p_mfgr,
        s_address,
        s_phone,
        s_comment
    from
        part,
        supplier,
        partsupp,
        nation,
        region
    where
        p_partkey = ps_partkey
        and s_suppkey = ps_suppkey
        and p_size = 15
        and p_type like '%BRASS'
        and s_nationkey = n_nationkey
        and n_regionkey = r_regionkey
        and r_name = 'EUROPE'
        and ps_supplycost = (
            select min(ps_supplycost)
            from partsupp ps2, supplier s2, nation n2, region r2
            where p_partkey = ps2.ps_partkey
              and s2.s_suppkey = ps2.ps_suppkey
              and s2.s_nationkey = n2.n_nationkey
              and n2.n_regionkey = r2.r_regionkey
              and r2.r_name = 'EUROPE'
        )
    order by
        s_acctbal desc,
        n_name,
        s_name,
        p_partkey
- id: 2
  description: 'HAVING clause: Add HAVING clause on cost aggregation'
  sql: |2

    select
        s_acctbal,
        s_name,
        n_name,
        p_partkey,
        p_mfgr,
        s_address,
        s_phone,
        s_comment
    from
        part,
        supplier,
        partsupp,
        nation,
        region
    where
        p_partkey = ps_partkey
        and s_suppkey = ps_suppkey
        and p_size = 15
        and p_type like '%BRASS'
        and s_nationkey = n_nationkey
        and n_regionkey = r_regionkey
        and r_name = 'EUROPE'
        and ps_supplycost = (
            select min(ps_supplycost)
            from partsupp, supplier, nation, region
            where p_partkey = ps_partkey
              and s_suppkey = ps_suppkey
              and s_nationkey = n_nationkey
              and n_regionkey = r_regionkey
              and r_name = 'EUROPE'
            group by ps_partkey
            having min(ps_supplycost) > 0
        )
    order by
        s_acctbal desc,
        n_name,
        s_name,
        p_partkey
- id: 3
  description: 'Explicit JOINs: Use explicit JOIN syntax for all relationships'
  sql: |2

    select
        s_acctbal,
        s_name,
        n_name,
        p_partkey,
        p_mfgr,
        s_address,
        s_phone,
        s_comment
    from
        part p
        inner join partsupp ps on p.p_partkey = ps.ps_partkey
        inner join supplier s on s.s_suppkey = ps.ps_suppkey
        inner join nation n on s.s_nationkey = n.n_nationkey
        inner join region r on n.n_regionkey = r.r_regionkey
    where
        p.p_size = 15
        and p.p_type like '%BRASS'
        and r.r_name = 'EUROPE'
        and ps.ps_supplycost = (
            select min(ps2.ps_supplycost)
            from partsupp ps2
            inner join supplier s2 on s2.s_suppkey = ps2.ps_suppkey
            inner join nation n2 on s2.s_nationkey = n2.n_nationkey
            inner join region r2 on n2.n_regionkey = r2.r_regionkey
            where p.p_partkey = ps2.ps_partkey
              and r2.r_name = 'EUROPE'
        )
    order by
        s.s_acctbal desc,
        n.n_name,
        s.s_name,
        p.p_partkey
- id: 4
  description: 'UNION ALL: Split by region combinations'
  sql: |2

    select
        s_acctbal,
        s_name,
        n_name,
        p_partkey,
        p_mfgr,
        s_address,
        s_phone,
        s_comment
    from (
        select
            s_acctbal,
            s_name,
            n_name,
            p_partkey,
            p_mfgr,
            s_address,
            s_phone,
            s_comment,
            ps_supplycost
        from
            part,
            supplier,
            partsupp,
            nation,
            region
        where
            p_partkey = ps_partkey
            and s_suppkey = ps_suppkey
            and p_size = 15
            and p_type like '%BRASS'
            and s_nationkey = n_nationkey
            and n_regionkey = r_regionkey
            and r_name = 'EUROPE'

        union all

        select
            null as s_acctbal,
            null as s_name,
            null as n_name,
            p_partkey,
            null as p_mfgr,
            null as s_address,
            null as s_phone,
            null as s_comment,
            min(ps_supplycost) as ps_supplycost
        from
            part,
            supplier,
            partsupp,
            nation,
            region
        where
            p_partkey = ps_partkey
            and s_suppkey = ps_suppkey
            and p_size = 15
            and p_type like '%BRASS'
            and s_nationkey = n_nationkey
            and n_regionkey = r_regionkey
            and r_name = 'EUROPE'
        group by p_partkey
    ) combined
    where combined.s_acctbal is not null
      and combined.ps_supplycost = (
        select min(c2.ps_supplycost)
        from (
            select p_partkey, min(ps_supplycost) as ps_supplycost
            from part, supplier, partsupp, nation, region
            where p_partkey = ps_partkey
              and s_suppkey = ps_suppkey
              and p_size = 15
              and p_type like '%BRASS'
              and s_nationkey = n_nationkey
              and n_regionkey = r_regionkey
              and r_name = 'EUROPE'
            group by p_partkey
        ) c2
        where c2.p_partkey = combined.p_partkey
      )
    order by
        s_acctbal desc,
        n_name,
        s_name,
        p_partkey
- id: 5
  description: 'CTE: Pre-compute minimum costs'
  sql: |2

    with min_costs as (
        select
            ps_partkey as min_ps_partkey,
            min(ps_supplycost) as min_cost
        from
            partsupp,
            supplier,
            nation,
            region
        where
            s_suppkey = ps_suppkey
            and s_nationkey = n_nationkey
            and n_regionkey = r_regionkey
            and r_name = 'EUROPE'
        group by
            ps_partkey
    )
    select
        s_acctbal,
        s_name,
        n_name,
        p_partkey,
        p_mfgr,
        s_address,
        s_phone,
        s_comment
    from
        part,
        supplier,
        partsupp,
        nation,
        region,
        min_costs mc
    where
        p_partkey = ps_partkey
        and s_suppkey = ps_suppkey
        and p_size = 15
        and p_type like '%BRASS'
        and s_nationkey = n_nationkey
        and n_regionkey = r_regionkey
        and r_name = 'EUROPE'
        and p_partkey = mc.min_ps_partkey
        and ps_supplycost = mc.min_cost
    order by
        s_acctbal desc,
        n_name,
        s_name,
        p_partkey
