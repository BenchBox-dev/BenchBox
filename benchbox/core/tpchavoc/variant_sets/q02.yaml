- id: 7
  description: 'FILTER clause: Use FILTER for conditional aggregation'
  sql: |2

    with cost_analysis as (
        select
            p_partkey,
            s_suppkey,
            s_acctbal,
            s_name,
            n_name,
            p_mfgr,
            s_address,
            s_phone,
            s_comment,
            ps_supplycost,
            min(ps_supplycost) filter (where r_name = 'EUROPE') over (partition by p_partkey) as min_cost
        from
            part,
            supplier,
            partsupp,
            nation,
            region
        where
            p_partkey = ps_partkey
            and s_suppkey = ps_suppkey
            and p_size = 15
            and p_type like '%BRASS'
            and s_nationkey = n_nationkey
            and n_regionkey = r_regionkey
            and r_name = 'EUROPE'
    )
    select
        s_acctbal,
        s_name,
        n_name,
        p_partkey,
        p_mfgr,
        s_address,
        s_phone,
        s_comment
    from cost_analysis
    where ps_supplycost = min_cost
    order by
        s_acctbal desc,
        n_name,
        s_name,
        p_partkey
- id: 8
  description: 'EXISTS: Convert correlated subquery to EXISTS'
  sql: |2

    select
        s_acctbal,
        s_name,
        n_name,
        p_partkey,
        p_mfgr,
        s_address,
        s_phone,
        s_comment
    from
        part,
        supplier,
        partsupp,
        nation,
        region
    where
        p_partkey = ps_partkey
        and s_suppkey = ps_suppkey
        and p_size = 15
        and p_type like '%BRASS'
        and s_nationkey = n_nationkey
        and n_regionkey = r_regionkey
        and r_name = 'EUROPE'
        and not exists (
            select 1
            from partsupp ps2, supplier s2, nation n2, region r2
            where p_partkey = ps2.ps_partkey
              and s2.s_suppkey = ps2.ps_suppkey
              and s2.s_nationkey = n2.n_nationkey
              and n2.n_regionkey = r2.r_regionkey
              and r2.r_name = 'EUROPE'
              and ps2.ps_supplycost < partsupp.ps_supplycost
        )
    order by
        s_acctbal desc,
        n_name,
        s_name,
        p_partkey
- id: 9
  description: 'Window functions: Use RANK() for minimum selection'
  sql: |2

    with ranked_suppliers as (
        select
            s_acctbal,
            s_name,
            n_name,
            p_partkey,
            p_mfgr,
            s_address,
            s_phone,
            s_comment,
            ps_supplycost,
            rank() over (partition by p_partkey order by ps_supplycost) as cost_rank
        from
            part,
            supplier,
            partsupp,
            nation,
            region
        where
            p_partkey = ps_partkey
            and s_suppkey = ps_suppkey
            and p_size = 15
            and p_type like '%BRASS'
            and s_nationkey = n_nationkey
            and n_regionkey = r_regionkey
            and r_name = 'EUROPE'
    )
    select
        s_acctbal,
        s_name,
        n_name,
        p_partkey,
        p_mfgr,
        s_address,
        s_phone,
        s_comment
    from ranked_suppliers
    where cost_rank = 1
    order by
        s_acctbal desc,
        n_name,
        s_name,
        p_partkey
- id: 10
  description: 'CASE expressions: Add conditional logic for cost selection'
  sql: |2

    select
        s_acctbal,
        case when s_name is not null then s_name else 'UNKNOWN' end as s_name,
        case when n_name is not null then n_name else 'UNKNOWN' end as n_name,
        p_partkey,
        case when p_mfgr is not null then p_mfgr else 'UNKNOWN' end as p_mfgr,
        case when s_address is not null then s_address else 'UNKNOWN' end as s_address,
        case when s_phone is not null then s_phone else 'UNKNOWN' end as s_phone,
        case when s_comment is not null then s_comment else '' end as s_comment
    from
        part,
        supplier,
        partsupp,
        nation,
        region
    where
        p_partkey = ps_partkey
        and s_suppkey = ps_suppkey
        and p_size = case when 15 > 0 then 15 else 1 end
        and p_type like case when '%BRASS' is not null then '%BRASS' else '%' end
        and s_nationkey = n_nationkey
        and n_regionkey = r_regionkey
        and r_name = case when 'EUROPE' is not null then 'EUROPE' else r_name end
        and ps_supplycost = (
            select min(case when ps_supplycost > 0 then ps_supplycost else 999999 end)
            from partsupp, supplier, nation, region
            where p_partkey = ps_partkey
              and s_suppkey = ps_suppkey
              and s_nationkey = n_nationkey
              and n_regionkey = r_regionkey
              and r_name = 'EUROPE'
        )
    order by
        s_acctbal desc,
        case when n_name is not null then n_name else 'ZZZZZ' end,
        case when s_name is not null then s_name else 'ZZZZZ' end,
        p_partkey
