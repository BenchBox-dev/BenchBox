variants:
- id: 1
  description: 'Scalar subqueries: Use scalar subqueries for conditional aggregation'
  sql: |2

    select
        (select sum(l2.l_extendedprice * l2.l_discount)
         from lineitem l2
         where l2.l_shipdate >= date '1994-01-01'
           and l2.l_shipdate < date '1994-01-01' + interval '1' year
           and l2.l_discount between 0.06 - 0.01 and 0.06 + 0.01
           and l2.l_quantity < 24) as revenue
- id: 2
  description: 'HAVING clause: Use GROUP BY with HAVING for filtering'
  sql: |2

    select
        sum(l_extendedprice * l_discount) as revenue
    from
        lineitem
    where
        l_shipdate >= date '1994-01-01'
        and l_shipdate < date '1994-01-01' + interval '1' year
        and l_discount between 0.06 - 0.01 and 0.06 + 0.01
        and l_quantity < 24
    group by
        ()
    having
        sum(l_extendedprice * l_discount) is not null
- id: 3
  description: 'Multiple FROM clauses: Use redundant FROM for syntax variation'
  sql: |2

    select
        sum(l1.l_extendedprice * l1.l_discount) as revenue
    from
        lineitem l1,
        (select 1 as dummy) dummy_table
    where
        l1.l_shipdate >= date '1994-01-01'
        and l1.l_shipdate < date '1994-01-01' + interval '1' year
        and l1.l_discount between 0.06 - 0.01 and 0.06 + 0.01
        and l1.l_quantity < 24
- id: 4
  description: 'UNION ALL: Split aggregation by date ranges'
  sql: |2

    select
        sum(revenue) as revenue
    from (
        select
            sum(l_extendedprice * l_discount) as revenue
        from lineitem
        where l_shipdate >= date '1994-01-01'
          and l_shipdate < date '1994-07-01'
          and l_discount between 0.06 - 0.01 and 0.06 + 0.01
          and l_quantity < 24

        union all

        select
            sum(l_extendedprice * l_discount) as revenue
        from lineitem
        where l_shipdate >= date '1994-07-01'
          and l_shipdate < date '1994-01-01' + interval '1' year
          and l_discount between 0.06 - 0.01 and 0.06 + 0.01
          and l_quantity < 24
    ) combined
- id: 5
  description: 'Common Table Expression: Use CTE to pre-filter data'
  sql: |2

    with qualified_lineitems as (
        select l_extendedprice, l_discount
        from lineitem
        where l_shipdate >= date '1994-01-01'
          and l_shipdate < date '1994-01-01' + interval '1' year
          and l_discount between 0.06 - 0.01 and 0.06 + 0.01
          and l_quantity < 24
    )
    select
        sum(l_extendedprice * l_discount) as revenue
    from qualified_lineitems
- id: 6
  description: 'Derived table: Wrap main logic in derived table'
  sql: |2

    select
        total_revenue
    from (
        select
            sum(l_extendedprice * l_discount) as total_revenue
        from
            lineitem
        where
            l_shipdate >= date '1994-01-01'
            and l_shipdate < date '1994-01-01' + interval '1' year
            and l_discount between 0.06 - 0.01 and 0.06 + 0.01
            and l_quantity < 24
    ) revenue_summary
- id: 7
  description: 'FILTER clause: Use FILTER for conditional aggregation (OLAP)'
  sql: |2

    select
        sum(l_extendedprice * l_discount)
            filter (where l_shipdate >= date '1994-01-01'
                       and l_shipdate < date '1994-01-01' + interval '1' year
                       and l_discount between 0.06 - 0.01 and 0.06 + 0.01
                       and l_quantity < 24) as revenue
    from
        lineitem
- id: 8
  description: 'EXISTS pattern: Use EXISTS for conditional filtering'
  sql: |2

    select
        sum(l_extendedprice * l_discount) as revenue
    from
        lineitem l1
    where
        l1.l_shipdate >= date '1994-01-01'
        and l1.l_shipdate < date '1994-01-01' + interval '1' year
        and l1.l_discount between 0.06 - 0.01 and 0.06 + 0.01
        and l1.l_quantity < 24
        and exists (
            select 1
            from lineitem l2
            where l2.l_orderkey = l1.l_orderkey
              and l2.l_linenumber = l1.l_linenumber
        )
- id: 9
  description: 'Window functions: Use window functions for aggregation (OLAP)'
  sql: |2

    select distinct
        sum(l_extendedprice * l_discount) over () as revenue
    from
        lineitem
    where
        l_shipdate >= date '1994-01-01'
        and l_shipdate < date '1994-01-01' + interval '1' year
        and l_discount between 0.06 - 0.01 and 0.06 + 0.01
        and l_quantity < 24
- id: 10
  description: 'CASE expressions: Add extensive CASE logic for conditional processing'
  sql: |2

    select
        sum(
            case
                when l_shipdate >= date '1994-01-01'
                     and l_shipdate < date '1994-01-01' + interval '1' year
                     and l_discount between 0.06 - 0.01 and 0.06 + 0.01
                     and l_quantity < 24
                then case
                    when l_discount between 0.05 and 0.07 then l_extendedprice * l_discount
                    when l_discount < 0.05 then l_extendedprice * l_discount
                    when l_discount > 0.07 then l_extendedprice * l_discount
                    else l_extendedprice * l_discount
                end
                else 0
            end
        ) as revenue
    from
        lineitem
    where
        case
            when l_shipdate >= date '1994-01-01' then 1
            else 0
        end = 1
        and case
            when l_shipdate < date '1994-01-01' + interval '1' year then 1
            else 0
        end = 1
