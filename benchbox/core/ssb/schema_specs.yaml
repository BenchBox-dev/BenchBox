tables:
- id: DATE
  key: date
  schema:
    name: date
    columns:
    - name: d_datekey
      type: INTEGER
      primary_key: true
    - name: d_date
      type: VARCHAR(18)
    - name: d_dayofweek
      type: VARCHAR(9)
    - name: d_month
      type: VARCHAR(9)
    - name: d_year
      type: INTEGER
    - name: d_yearmonthnum
      type: INTEGER
    - name: d_yearmonth
      type: VARCHAR(7)
    - name: d_daynuminweek
      type: INTEGER
    - name: d_daynuminmonth
      type: INTEGER
    - name: d_daynuminyear
      type: INTEGER
    - name: d_monthnuminyear
      type: INTEGER
    - name: d_weeknuminyear
      type: INTEGER
    - name: d_sellingseason
      type: VARCHAR(12)
    - name: d_lastdayinweekfl
      type: INTEGER
    - name: d_lastdayinmonthfl
      type: INTEGER
    - name: d_holidayfl
      type: INTEGER
    - name: d_weekdayfl
      type: INTEGER
- id: CUSTOMER
  key: customer
  schema:
    name: customer
    columns:
    - name: c_custkey
      type: INTEGER
      primary_key: true
    - name: c_name
      type: VARCHAR(25)
    - name: c_address
      type: VARCHAR(25)
    - name: c_city
      type: VARCHAR(10)
    - name: c_nation
      type: VARCHAR(15)
    - name: c_region
      type: VARCHAR(12)
    - name: c_phone
      type: VARCHAR(15)
    - name: c_mktsegment
      type: VARCHAR(10)
- id: SUPPLIER
  key: supplier
  schema:
    name: supplier
    columns:
    - name: s_suppkey
      type: INTEGER
      primary_key: true
    - name: s_name
      type: VARCHAR(25)
    - name: s_address
      type: VARCHAR(25)
    - name: s_city
      type: VARCHAR(10)
    - name: s_nation
      type: VARCHAR(15)
    - name: s_region
      type: VARCHAR(12)
    - name: s_phone
      type: VARCHAR(15)
- id: PART
  key: part
  schema:
    name: part
    columns:
    - name: p_partkey
      type: INTEGER
      primary_key: true
    - name: p_name
      type: VARCHAR(22)
    - name: p_mfgr
      type: VARCHAR(6)
    - name: p_category
      type: VARCHAR(7)
    - name: p_brand1
      type: VARCHAR(9)
    - name: p_color
      type: VARCHAR(11)
    - name: p_type
      type: VARCHAR(25)
    - name: p_size
      type: INTEGER
    - name: p_container
      type: VARCHAR(10)
- id: LINEORDER
  key: lineorder
  schema:
    name: lineorder
    columns:
    - name: lo_orderkey
      type: INTEGER
    - name: lo_linenumber
      type: INTEGER
    - name: lo_custkey
      type: INTEGER
      foreign_key: customer.c_custkey
    - name: lo_partkey
      type: INTEGER
      foreign_key: part.p_partkey
    - name: lo_suppkey
      type: INTEGER
      foreign_key: supplier.s_suppkey
    - name: lo_orderdate
      type: INTEGER
      foreign_key: date.d_datekey
    - name: lo_orderpriority
      type: VARCHAR(15)
    - name: lo_shippriority
      type: INTEGER
    - name: lo_quantity
      type: INTEGER
    - name: lo_extendedprice
      type: INTEGER
    - name: lo_ordtotalprice
      type: INTEGER
    - name: lo_discount
      type: INTEGER
    - name: lo_revenue
      type: INTEGER
    - name: lo_supplycost
      type: INTEGER
    - name: lo_tax
      type: INTEGER
    - name: lo_commitdate
      type: INTEGER
    - name: lo_shipmode
      type: VARCHAR(10)
    primary_key:
    - lo_orderkey
    - lo_linenumber
table_order:
- date
- customer
- supplier
- part
- lineorder
