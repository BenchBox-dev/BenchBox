joined_aggregate:
  - query_id: 19
    title: Store Sales Item/Customer Analysis
    base: date_dim
    joins:
      - [store_sales, d_date_sk, ss_sold_date_sk]
      - [item, ss_item_sk, i_item_sk]
      - [customer, ss_customer_sk, c_customer_sk]
      - [customer_address, c_current_addr_sk, ca_address_sk]
      - [store, ss_store_sk, s_store_sk]
    filters:
      - [eq, i_manager_id, {param: manager_id, default: 7}]
      - [eq, d_moy, {param: month, default: 11}]
      - [eq, d_year, {param: year, default: 1999}]
      - [prefix_ne_cols, ca_zip, s_zip, 5]
    group_by: [i_brand_id, i_brand, i_manufact_id, i_manufact]
    aggs:
      - [ext_price, ss_ext_sales_price, sum]
    sort_by: [ext_price, i_brand, i_brand_id, i_manufact_id, i_manufact]
    descending: [true, false, false, false, false]
  - query_id: 15
    title: Catalog Sales Analysis
    base: catalog_sales
    joins:
      - [customer, cs_bill_customer_sk, c_customer_sk]
      - [customer_address, c_current_addr_sk, ca_address_sk]
      - [date_dim, cs_sold_date_sk, d_date_sk]
    filters:
      - [eq, d_qoy, {param: quarter, default: 2}]
      - [eq, d_year, {param: year, default: 2000}]
      - [or, [substr_in, ca_zip, 5, {param: zip_codes, default: ["85669", "86197", "88274", "83405", "86475", "85392", "85460", "80348", "81792"]}], [in, ca_state, {param: states, default: [CA, WA, GA]}], [gt, cs_sales_price, {param: min_price, default: 500}]]
    group_by: [ca_zip]
    aggs:
      - [total_sales, cs_sales_price, sum]
    sort_by: [ca_zip]
  - query_id: 73
    title: Store Sales Household Vehicle
    base: store_sales
    joins:
      - [date_dim, ss_sold_date_sk, d_date_sk]
      - [store, ss_store_sk, s_store_sk]
      - [household_demographics, ss_hdemo_sk, hd_demo_sk]
      - [customer, ss_customer_sk, c_customer_sk]
    filters:
      - [in, d_year, {param: year, default: 1998, offsets: [0, 1, 2]}]
      - [between, d_dom, 1, 2]
      - [eq, s_county, {param: county, default: Williamson County}]
      - [in, hd_buy_potential, [">10000", Unknown]]
      - [gt, hd_vehicle_count, 0]
      - [ratio_gt, hd_dep_count, hd_vehicle_count, 1]
    group_by: [c_last_name, c_first_name, c_salutation, c_preferred_cust_flag, ss_ticket_number]
    aggs:
      - [cnt, ss_ticket_number, count]
    post_filter: [between, cnt, 1, 5]
    sort_by: [cnt, c_last_name]
    descending: [true, false]
    limit:
  - query_id: 91
    title: Call Center Returns Analysis
    base: catalog_returns
    joins:
      - [call_center, cr_call_center_sk, cc_call_center_sk]
      - [date_dim, cr_returned_date_sk, d_date_sk]
      - [customer, cr_returning_customer_sk, c_customer_sk]
      - [customer_demographics, c_current_cdemo_sk, cd_demo_sk]
      - [household_demographics, c_current_hdemo_sk, hd_demo_sk]
      - [customer_address, c_current_addr_sk, ca_address_sk]
    filters:
      - [eq, d_year, {param: year, default: 1999}]
      - [eq, d_moy, {param: month, default: 11}]
      - [or, [and, [eq, cd_marital_status, M], [eq, cd_education_status, Unknown]], [and, [eq, cd_marital_status, W], [eq, cd_education_status, "Advanced Degree"]]]
      - [starts_with, hd_buy_potential, {param: buy_potential, default: 0-500}]
      - [eq, ca_gmt_offset, {param: gmt_offset, default: -7}]
    group_by: [cc_call_center_id, cc_name, cc_manager, cd_marital_status, cd_education_status]
    aggs:
      - [returns_loss, cr_net_loss, sum]
    sort_by: [returns_loss]
    descending: [true]
    limit:
    select: [cc_call_center_id, cc_name, cc_manager, returns_loss]

state_average_returns:
  - query_id: 30
    title: Web Returns Customer Analysis
    return_table: web_returns
    return_date_key: wr_returned_date_sk
    return_addr_key: wr_returning_addr_sk
    return_customer_key: wr_returning_customer_sk
    return_amount: wr_return_amt
    year_default: 2002
    state_default: IL
    expression_select: [c_customer_id, c_salutation, c_first_name, c_last_name, c_preferred_cust_flag, c_birth_day, c_birth_month, c_birth_year, c_birth_country, c_login, c_email_address, c_last_review_date_sk, ctr_total_return]
    pandas_select: [c_customer_id, c_salutation, c_first_name, c_last_name, c_preferred_cust_flag, c_birth_day, c_birth_month, c_birth_year, c_birth_country, c_login, c_email_address, c_last_review_date_sk, ctr_total_return]
  - query_id: 81
    title: Catalog Returns Customer Analysis
    return_table: catalog_returns
    return_date_key: cr_returned_date_sk
    return_addr_key: cr_returning_addr_sk
    return_customer_key: cr_returning_customer_sk
    return_amount: cr_return_amt_inc_tax
    year_default: 1998
    state_default: IL
    expression_select:
      - c_customer_id
      - c_salutation
      - c_first_name
      - c_last_name
      - ca_street_number
      - ca_street_name
      - ca_street_type
      - ca_suite_number
      - ca_city
      - ca_county
      - ca_state
      - ca_zip
      - ca_country
      - ca_gmt_offset
      - ca_location_type
      - ctr_total_return
    pandas_select: [c_customer_id, c_salutation, c_first_name, c_last_name, ca_street_number, ca_street_name, ca_street_type, ca_suite_number, ca_city, ca_county, ca_state, ca_zip, ca_country, ca_gmt_offset, ca_location_type, ctr_total_return]
