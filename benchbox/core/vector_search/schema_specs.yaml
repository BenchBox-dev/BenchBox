tables:
- id: VECTORS
  key: vectors
  schema:
    name: vectors
    columns:
    - name: id
      type: BIGINT
      primary_key: true
    - name: embedding
      type: FLOAT_ARRAY
    - name: category
      type: VARCHAR(50)
    - name: doc_id
      type: VARCHAR(100)
- id: VECTOR_QUERIES
  key: vector_queries
  schema:
    name: vector_queries
    columns:
    - name: query_id
      type: INTEGER
      primary_key: true
    - name: query_vector
      type: FLOAT_ARRAY
table_order:
- vectors
- vector_queries
embedding_type_map:
  duckdb: FLOAT[{dim}]
  postgresql: VECTOR({dim})
  postgres: VECTOR({dim})
  snowflake: VECTOR(FLOAT, {dim})
  clickhouse: Array(Float32)
  bigquery: ARRAY<FLOAT64>
  starrocks: ARRAY<FLOAT>
  doris: ARRAY<FLOAT>
  spark: ARRAY<FLOAT>
  lakesail: ARRAY<FLOAT>
  pyspark: ARRAY<FLOAT>
  velox: ARRAY<FLOAT>
  databricks: ARRAY<FLOAT>
  mysql: VECTOR({dim}, F32)
  default: FLOAT[{dim}]
