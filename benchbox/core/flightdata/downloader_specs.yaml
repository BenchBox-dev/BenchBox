- FlightDate
- Year
- Month
- DayofMonth
- DayOfWeek
- Reporting_Airline
- Flight_Number_Reporting_Airline
- Origin
- Dest
- CRSDepTime
- DepTime
- DepDelay
- CRSArrTime
- ArrTime
- ArrDelay
- Cancelled
- CancellationCode
- Diverted
- CRSElapsedTime
- ActualElapsedTime
- AirTime
- Distance
- CarrierDelay
- WeatherDelay
- NASDelay
- SecurityDelay
- LateAircraftDelay
