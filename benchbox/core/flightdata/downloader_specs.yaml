bts_base_url: https://transtats.bts.gov/PREZIP/On_Time_Reporting_Carrier_On_Time_Performance_1987_present_{year}_{month}.zip
# BTS publishes legacy CSV exports using Windows-1252. This is part of the
# pinned source contract because decoding changes affect generated values.
csv_encoding: cp1252
# Pinned reproducible source contract: scale-factor month windows always end at
# this month. Bumping the pin is an explicit, reviewed change - the window must
# never slide forward as BTS publishes new months.
pinned_source:
  end_year: 2024
  end_month: 12
  # Populated only with independently reviewed provider artifacts. Until every
  # selected month has a digest, generated corpora are not promotion-eligible.
  sha256: {}
data_coverage:
  first_available_year: 1987
  last_available_year: 2024
  approximate_monthly_flights: 600000
  months_per_scale_factor: 41
  # BTS PREZIP archives verified 2026-09-25: Jan 1990 - Dec 1999 return
  # HTTP 404 for every probed month while 1987-10..1989-12 and 2000-01
  # onward return 200. Windows must skip this gap instead of failing.
  unavailable_months:
  - [1990, 1, 1999, 12]
flight_shards:
  row_target: 1000000
  dirname: flights
  prefix: flights_
bts_field_names:
- FlightDate
- Year
- Month
- DayofMonth
- DayOfWeek
- Reporting_Airline
- Flight_Number_Reporting_Airline
- Origin
- Dest
- CRSDepTime
- DepTime
- DepDelay
- CRSArrTime
- ArrTime
- ArrDelay
- Cancelled
- CancellationCode
- Diverted
- CRSElapsedTime
- ActualElapsedTime
- AirTime
- Distance
- CarrierDelay
- WeatherDelay
- NASDelay
- SecurityDelay
- LateAircraftDelay
