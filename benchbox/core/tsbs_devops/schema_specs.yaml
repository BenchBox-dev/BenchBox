schema:
  tags:
    description: Host metadata and tags
    columns:
      hostname:
        type: VARCHAR(255)
        description: Host identifier
      region:
        type: VARCHAR(64)
        description: Cloud region
      datacenter:
        type: VARCHAR(64)
        description: Datacenter name
      rack:
        type: VARCHAR(64)
        description: Rack identifier
      os:
        type: VARCHAR(64)
        description: Operating system
      arch:
        type: VARCHAR(32)
        description: CPU architecture
      team:
        type: VARCHAR(64)
        description: Team owner
      service:
        type: VARCHAR(64)
        description: Service name
      service_version:
        type: VARCHAR(32)
        description: Service version
      service_environment:
        type: VARCHAR(32)
        description: Environment (prod, staging, dev)
    primary_key:
    - hostname
    indexes:
    - region
    - datacenter
    - service
  cpu:
    description: CPU metrics per host at regular intervals
    columns:
      time:
        type: TIMESTAMP
        description: Measurement timestamp
      hostname:
        type: VARCHAR(255)
        description: Host identifier
      usage_user:
        type: DOUBLE
        description: CPU % in user space
      usage_system:
        type: DOUBLE
        description: CPU % in kernel space
      usage_idle:
        type: DOUBLE
        description: CPU % idle
      usage_nice:
        type: DOUBLE
        description: CPU % nice priority
      usage_iowait:
        type: DOUBLE
        description: CPU % waiting for I/O
      usage_irq:
        type: DOUBLE
        description: CPU % hardware interrupts
      usage_softirq:
        type: DOUBLE
        description: CPU % software interrupts
      usage_steal:
        type: DOUBLE
        description: CPU % stolen by hypervisor
      usage_guest:
        type: DOUBLE
        description: CPU % running guest VMs
      usage_guest_nice:
        type: DOUBLE
        description: CPU % guest nice priority
    primary_key:
    - time
    - hostname
    partition_by: time
    order_by:
    - hostname
    - time
  mem:
    description: Memory metrics per host
    columns:
      time:
        type: TIMESTAMP
        description: Measurement timestamp
      hostname:
        type: VARCHAR(255)
        description: Host identifier
      total:
        type: BIGINT
        description: Total memory bytes
      available:
        type: BIGINT
        description: Available memory bytes
      used:
        type: BIGINT
        description: Used memory bytes
      free:
        type: BIGINT
        description: Free memory bytes
      cached:
        type: BIGINT
        description: Cached memory bytes
      buffered:
        type: BIGINT
        description: Buffered memory bytes
      used_percent:
        type: DOUBLE
        description: Memory usage percent
      available_percent:
        type: DOUBLE
        description: Available memory percent
    primary_key:
    - time
    - hostname
    partition_by: time
    order_by:
    - hostname
    - time
  disk:
    description: Disk I/O metrics per host and device
    columns:
      time:
        type: TIMESTAMP
        description: Measurement timestamp
      hostname:
        type: VARCHAR(255)
        description: Host identifier
      device:
        type: VARCHAR(64)
        description: Disk device name
      reads_completed:
        type: BIGINT
        description: Total read operations
      reads_merged:
        type: BIGINT
        description: Merged read operations
      sectors_read:
        type: BIGINT
        description: Sectors read
      read_time_ms:
        type: BIGINT
        description: Read time in milliseconds
      writes_completed:
        type: BIGINT
        description: Total write operations
      writes_merged:
        type: BIGINT
        description: Merged write operations
      sectors_written:
        type: BIGINT
        description: Sectors written
      write_time_ms:
        type: BIGINT
        description: Write time in milliseconds
      io_in_progress:
        type: INTEGER
        description: Current I/O operations
      io_time_ms:
        type: BIGINT
        description: Total I/O time
      weighted_io_time_ms:
        type: BIGINT
        description: Weighted I/O time
    primary_key:
    - time
    - hostname
    - device
    partition_by: time
    order_by:
    - hostname
    - device
    - time
  net:
    description: Network metrics per host and interface
    columns:
      time:
        type: TIMESTAMP
        description: Measurement timestamp
      hostname:
        type: VARCHAR(255)
        description: Host identifier
      interface:
        type: VARCHAR(64)
        description: Network interface name
      bytes_recv:
        type: BIGINT
        description: Bytes received
      bytes_sent:
        type: BIGINT
        description: Bytes sent
      packets_recv:
        type: BIGINT
        description: Packets received
      packets_sent:
        type: BIGINT
        description: Packets sent
      err_in:
        type: BIGINT
        description: Receive errors
      err_out:
        type: BIGINT
        description: Send errors
      drop_in:
        type: BIGINT
        description: Dropped incoming packets
      drop_out:
        type: BIGINT
        description: Dropped outgoing packets
    primary_key:
    - time
    - hostname
    - interface
    partition_by: time
    order_by:
    - hostname
    - interface
    - time
table_order:
- tags
- cpu
- mem
- disk
- net
type_mappings:
  clickhouse:
    TIMESTAMP: DateTime64(3)
    BIGINT: Int64
    INTEGER: Int32
    DOUBLE: Float64
    VARCHAR(255): String
    VARCHAR(64): String
    VARCHAR(32): String
  duckdb:
    TIMESTAMP: TIMESTAMP
    BIGINT: BIGINT
    INTEGER: INTEGER
    DOUBLE: DOUBLE
    VARCHAR(255): VARCHAR
    VARCHAR(64): VARCHAR
    VARCHAR(32): VARCHAR
  timescale:
    TIMESTAMP: TIMESTAMPTZ
    BIGINT: BIGINT
    INTEGER: INTEGER
    DOUBLE: DOUBLE PRECISION
    VARCHAR(255): TEXT
    VARCHAR(64): TEXT
    VARCHAR(32): TEXT
  influxdb:
    TIMESTAMP: TIMESTAMP
    BIGINT: BIGINT
    INTEGER: INTEGER
    DOUBLE: DOUBLE
    VARCHAR(255): STRING
    VARCHAR(64): STRING
    VARCHAR(32): STRING
