# ClickHouse SSB Tuned Configuration
# Sort keys and partitions are rendered into MergeTree DDL at CREATE TABLE time.
# Constraints are disabled: ClickHouse has no enforced constraints and the sort key
# is the primary index, so nothing here needs a primary key that matches it.

primary_keys:
  enabled: false

foreign_keys:
  enabled: false

unique_constraints:
  enabled: false

check_constraints:
  enabled: false

platform_optimizations:
  z_ordering_enabled: false
  z_ordering_columns: []
  auto_optimize_enabled: false
  auto_compact_enabled: false
  bloom_filters_enabled: false
  bloom_filter_columns: []
  materialized_views_enabled: false

table_tunings:
  lineorder:
    table_name: lineorder
    sorting:
    - name: lo_orderdate
      type: INTEGER
      order: 1
    - name: lo_orderkey
      type: INTEGER
      order: 2
    - name: lo_linenumber
      type: INTEGER
      order: 3
