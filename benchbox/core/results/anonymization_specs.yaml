# secret_key_parts intentionally lives in code, not here: both the internal
# capture path and this public anonymization path read the single list in
# benchbox/core/results/platform_options.py (_SECRET_KEY_PARTS). A second
# hand-synced copy in this file diverged within a month of being split out.
#
# Keys listed here are omitted entirely from public payloads rather than
# hashed. See docs/development/adr/adr-published-identifier-field-set.md:
# they have no reader in the publication pipeline, Explorer, or contract,
# and a pseudonym would still be a confirmation oracle with the empty
# default salt. Compact forms match ``_compact_key`` (lowercase, non-alnum
# stripped). Retained identifiers (endpoint, database_name, submission_path)
# stay under identifier_keys / path / endpoint rules below.
public_drop_keys:
- machineid
- workingdir
- driverruntimepythonexecutable
- databasepath
- datapath
- enginehost
identifier_keys:
  account: account
  accountid: account
  accountname: account
  org: organization
  orgid: organization
  orgname: organization
  organization: organization
  organizationid: organization
  organizationname: organization
  project: project
  projectid: project
  workspace: workspace
  workspaceid: workspace
  workspacename: workspace
  warehouse: warehouse
  warehousename: warehouse
  workgroup: workgroup
  workgroupname: workgroup
  cluster: cluster
  clusterid: cluster
  clustername: cluster
  database: database
  databasename: database
  db: database
  dbname: database
  schema: schema
  schemaname: schema
  bucket: bucket
  bucketname: bucket
  prefix: prefix
  containerid: container
  containername: container
  username: user
  user: user
  userid: user
  pguser: user
  dbuser: user
  tenant: tenant
  tenantid: tenant
  role: role
  rolename: role
  rolearn: role
  iamrole: role
  iamrolearn: role
  jobrole: role
  arn: arn
  engine: engine
  enginename: engine
  clientid: client
  machineid: machine
  applicationid: application
  serviceaccount: serviceaccount
endpoint_keys:
- apiendpoint
- endpoint
- host
- hostname
- server
- serviceendpoint
- url
- workspacehost
- workspaceurl
path_keys:
- credentialfile
- databasepath
# libpq spelling (redshift.py): no underscore, so the *path/*file suffix
# rules never fire and the raw local path (home-dir username) leaked.
- sslrootcert
- datadirectory
- datapath
- filepath
- httppath
- outputdirectory
- outputlocation
- outputpath
- path
- s3stagingurl
- sourceroot
- staginglocation
- stagingurl
- datadir
- workingdir
- workingdirectory
- workdir
- workingroot
- outputdir
- resultdir
- resultpath
- logpath
- logfile
- pythonexecutable
- driverruntimepythonexecutable
mount_collection_keys:
- bindmounts
- mounts
- volumes
mount_path_keys:
- destination
- source
- target
local_endpoint_values:
- 0.0.0.0
- 127.0.0.1
- ::1
- '[::1]'
- localhost
message_keys:
- collectionerrormessage
- errormessage
- exception
- message
- stderr
- stdout
