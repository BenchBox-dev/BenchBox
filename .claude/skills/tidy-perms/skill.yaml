tags:
  - workflow
  - permissions
category: workflow
targets:
  claude: true
  codex: true
  gemini: true
# Documentary paths (where each CLI stores global config) — these are prose/table
# references, not runtime paths, so they are exempt from the portability scanner.
# A real ~/ leak sharing a line with one of these still fails.
portability_allow:
  - "~/.codex/config.toml"
  - "~/.gemini/*.json"
