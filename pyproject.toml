# MCP (Model Context Protocol) server for AI agent integration
# Note: mcp requires Python 3.10+, so this extra only works on 3.10+
# Includes visualization deps since MCP server exposes chart generation tools
mcp = [
    # MCP SDK 2 migration is complete; keep future majors behind explicit review.
    "mcp>=2,<3",
    # The MCP surface advertises DuckDB as its local executable default.
    "duckdb>=1.3.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
    "opentelemetry-sdk>=1.44,<2",
