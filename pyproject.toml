    "boto3>=1.34.0",
]
cloud-spark-gcp = [
    "google-cloud-dataproc>=5.0.0",
    "google-cloud-storage>=2.0.0",
]
cloud-spark-azure = [
    "azure-identity>=1.15.0",
    "azure-storage-file-datalake>=12.14.0",
    "requests>=2.31.0",
]
cloud-spark-snowflake = [
    "snowflake-snowpark-python>=1.11.0",
