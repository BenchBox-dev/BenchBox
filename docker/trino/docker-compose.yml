services:
  trino:
    image: trinodb/trino:480
    ports:
      - "${TRINO_HOST_PORT:-18080}:8080"
    volumes:
      - ./catalog:/etc/trino/catalog:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped
