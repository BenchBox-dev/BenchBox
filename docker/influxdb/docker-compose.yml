services:
  influxdb:
    image: influxdb:3-core
    ports:
      - "8181:8181"
    command: >
      influxdb3 serve
        --node-id=benchbox-node
        --object-store=memory
        --without-auth
    volumes:
      - influxdb-data:/tmp/influxdb3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  influxdb-data:
    driver: local
