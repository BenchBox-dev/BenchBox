services:
  presto:
    image: prestodb/presto:0.297
    ports:
      - "${PRESTO_HOST_PORT:-18081}:8080"
    volumes:
      - ./catalog:/opt/presto-server/etc/catalog:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped
