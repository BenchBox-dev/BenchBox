services:
  cedardb:
    image: cedardb/cedardb:latest
    mem_limit: 2g
    ports:
      - "5435:5432"
    environment:
      CEDAR_USER: benchbox
      CEDAR_PASSWORD: Benchbox1!
      CEDAR_DB: benchbox_test
    volumes:
      - cedardb-data:/var/lib/cedardb/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U benchbox -d benchbox_test || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  cedardb-data:
    driver: local
