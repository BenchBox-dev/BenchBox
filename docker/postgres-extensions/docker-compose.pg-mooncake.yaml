# pg_mooncake Docker Compose
# PostgreSQL with pg_mooncake extension for columnstore analytics
#
# Usage:
#   docker compose -f docker-compose.pg-mooncake.yaml up -d
#   benchbox run --platform pg-mooncake --benchmark tpch --scale 0.01 \
#     --platform-option host=localhost --platform-option password=benchbox
#
# Ports:
#   5432 - PostgreSQL with pg_mooncake
#
# NOTE: pg_mooncake conflicts with standalone pg_duckdb (shared libduckdb.so).
#       Do NOT run both containers on the same port simultaneously.
#
# NOTE: The current pg_mooncake image is built on a PG18-backed pg_duckdb base.
# It intentionally uses a fresh named volume mounted at /var/lib/postgresql;
# migrate manually from the old `pg-mooncake-data` volume if you need to
# preserve local data across the PG18 layout change.

services:
  pg-mooncake:
    image: mooncakelabs/pg_mooncake:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: benchbox
      POSTGRES_DB: benchbox
    ports:
      - "5432:5432"
    volumes:
      - pg-mooncake18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    shm_size: "256mb"

volumes:
  pg-mooncake18-data:
    driver: local
