services:
  pg-duckdb:
    image: pgduckdb/pgduckdb:18-v1.1.1
    container_name: benchbox-pg-duckdb-test
    environment:
      POSTGRES_USER: benchbox
      POSTGRES_PASSWORD: benchbox
      POSTGRES_DB: benchbox_test
    ports:
      - "${PG_DUCKDB_PORT:-5432}:5432"
    volumes:
      - pg-duckdb18-test-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchbox -d benchbox_test"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    shm_size: "256mb"

  pg-mooncake:
    image: mooncakelabs/pg_mooncake:latest
    container_name: benchbox-pg-mooncake-test
    environment:
      POSTGRES_USER: benchbox
      POSTGRES_PASSWORD: benchbox
      POSTGRES_DB: benchbox_test
    ports:
      - "${PG_MOONCAKE_PORT:-5433}:5432"
    volumes:
      - pg-mooncake18-test-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchbox -d benchbox_test"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    shm_size: "256mb"

volumes:
  pg-duckdb18-test-data:
    driver: local
  pg-mooncake18-test-data:
    driver: local
