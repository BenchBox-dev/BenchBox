# Databend + MinIO Docker Compose
# Cloud-native OLAP warehouse with S3-compatible object storage backend
#
# Usage:
#   docker compose -f docker-compose.yml up -d
#   benchbox run --platform databend --benchmark tpch --scale 0.01 \
#     --platform-option host=localhost --platform-option password=benchbox \
#     --platform-option ssl=false
#
# Ports:
#   8000 - Databend HTTP handler (query API)
#   3307 - Databend MySQL-compatible handler
#   19000 (default host) -> 9000 - MinIO S3 API
#   19001 (default host) -> 9001 - MinIO Console (web UI)
#
# Default credentials:
#   Databend: benchbox / benchbox
#   MinIO:    minioadmin / minioadmin

services:
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Create the default bucket for Databend storage
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/databend --ignore-existing;
      exit 0;
      "

  databend:
    image: datafuselabs/databend:latest
    depends_on:
      minio-setup:
        condition: service_completed_successfully
    environment:
      # Storage configuration: use MinIO as S3 backend
      STORAGE_TYPE: s3
      STORAGE_S3_BUCKET: databend
      STORAGE_S3_ENDPOINT_URL: http://minio:9000
      STORAGE_S3_ACCESS_KEY_ID: minioadmin
      STORAGE_S3_SECRET_ACCESS_KEY: minioadmin
      STORAGE_S3_REGION: us-east-1
      # Query node configuration
      QUERY_DEFAULT_USER: benchbox
      QUERY_DEFAULT_PASSWORD: benchbox
    ports:
      - "8000:8000"
      - "3307:3307"
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  minio-data:
    driver: local
