name: benchbox-lakesail

services:
  lakesail-connect:
    image: benchbox-lakesail:${LAKESAIL_IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: docker/lakesail/Dockerfile
      args:
        PYSAIL_VERSION: ${PYSAIL_VERSION:-0.7.1}
        PYSPARK_CLIENT_VERSION: ${PYSPARK_CLIENT_VERSION:-4.2.0}
    command: ["spark", "server", "--ip", "0.0.0.0", "--port", "50051"]
    ports:
      - "${SPARK_CONNECT_PORT:-50051}:50051"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - "${BENCHBOX_DATA_DIR}:${BENCHBOX_DATA_DIR}:ro"
    tmpfs:
      - /tmp:size=2g
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost', 50051)); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
