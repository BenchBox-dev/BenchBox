# ClickHouse Server Docker Compose
# Single-node ClickHouse for integration testing (server mode)
#
# Usage:
#   docker compose -f docker-compose.yml up -d
#   benchbox run --platform clickhouse --benchmark tpch --scale 0.01 \
#     --platform-option host=localhost --platform-option port=9000
#
# Ports:
#   9000 - Native TCP protocol (clickhouse-driver)
#   8123 - HTTP interface (clickhouse-connect)
#
# Default credentials:
#   Username: default
#   Password: benchbox

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_PASSWORD: benchbox
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${CLICKHOUSE_HOST_PORT:-9000}:9000"
      - "${CLICKHOUSE_HTTP_HOST_PORT:-8123}:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./init-default-database.sql:/docker-entrypoint-initdb.d/init-default-database.sql:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--password", "benchbox", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  clickhouse-data:
    driver: local
