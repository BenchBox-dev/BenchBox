# Pre-commit hooks for BenchBox
# Install: pre-commit install  (installs both pre-commit and pre-push stages
#                               via default_install_hook_types below)
# Run manually: pre-commit run --all-files

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: corpus-inventory
        name: corpus-inventory drift check
        entry: uv run -- python scripts/generate_corpus_inventory.py --check
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^results-data/bundles/

      # Fast (<1s) allowlist-only scan. Runs on every commit.
      # The pytest-collection fast-lane checks moved to `timing-policy-fast-lane`
      # (pre-push stage) because a ~30s hook at commit time was racing with
      # concurrent working-tree edits, causing spurious "files were modified by
      # this hook" aborts.
      - id: timing-policy-check
        name: timing policy (wall-clock allowlist)
        entry: uv run -- python _project/scripts/timing_policy_check.py --strict --skip-fast-lane
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: \.(py|json)$

      - id: timing-policy-fast-lane
        name: timing policy (fast-lane collect)
        entry: bash -c 'if [ "$BENCHBOX_PREPUSH" = "1" ]; then exec uv run -- python _project/scripts/timing_policy_check.py --strict --only-fast-lane; fi'
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Mirror the CI gate locally so PR pushes don't need to discover lint
      # failures via the network roundtrip. ruff-format is enforced via the
      # ruff-format hook below at commit time, so pre-push only re-checks
      # `ruff check` (catches anything bypassed with --no-verify on commit)
      # plus the fast test lane.
      - id: pr-preflight-fast-tests
        name: pr-preflight (fast tests, mirrors CI)
        entry: bash -c 'if [ "$BENCHBOX_PREPUSH" = "1" ]; then exec make pr-preflight-fast-tests; fi'
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Validate any blind-spot finding files staged in this commit.
      # Each finding is its own markdown file with strict YAML frontmatter;
      # see _project/blind-spots/README.md for the protocol.
      - id: blind-spot-validate
        name: blind-spot frontmatter validation
        entry: uv run --project _project/scripts -- python _project/scripts/validate_blind_spot.py
        language: system
        stages: [pre-commit]
        files: ^_project/blind-spots/.*\.md$
        exclude: ^_project/blind-spots/README\.md$

      # Token-scan gate for the Results Explorer retheme. Fails when raw
      # Tailwind palette literals appear under results-explorer/src outside
      # an explicit `// allow-explorer-token-literal: <reason>` marker.
      # Stdlib-only (no uv sync at commit time); runs only when files
      # under results-explorer/src/ change. See
      # docs/operations/results-explorer-token-scan.md.
      - id: explorer-tokens
        name: results-explorer token-scan
        entry: python3 _project/scripts/scan_explorer_tokens.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^results-explorer/src/.*\.(tsx|ts|jsx|js|css|html)$

      # Warn-only duplicate-code gate. Manual stage so it doesn't slow
      # every commit (pylint over benchbox/ takes ~60s). Run with
      # `pre-commit run duplicate-code-warn --all-files --hook-stage manual`.
      # Promote to a hard-fail blocking hook in a follow-up TODO once
      # the R-06/R-07/R-08/R-09 refactors land.
      - id: duplicate-code-warn
        name: pylint duplicate-code (warn-only)
        entry: uv run -- python _project/scripts/pylint_duplicate_code_warn.py
        language: system
        pass_filenames: false
        stages: [manual]

  # Code formatting with ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix]
        stages: [pre-commit]
      # Run the formatter
      - id: ruff-format
        stages: [pre-commit]

  # Spell checking
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args:
          - --ignore-words=.codespell-ignore.txt
          - --skip=*.pyc,_build,*.json,*.lock,*.svg,*.min.js,*.min.css,*.csv
          - --quiet-level=2
        stages: [pre-commit]
        exclude: ^_sources/  # vendored upstream sources; preserve byte-for-byte

  # YAML validation
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--unsafe]  # Allow custom YAML tags
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
        # _sources/ + _binaries/EULA: vendored upstream sources, byte-for-byte.
        # results-data/bundles/*.json: bundle JSONs are hash-pinned by their
        # per-bundle `<stem>.manifest.json` sidecars (`bundle_hash` SHA-256);
        # whitespace normalization breaks the validator hash contract. The
        # pattern is broad (`.*\.json$`) so it also covers the manifest sidecars
        # themselves, which is harmless — manifests do not carry self-hashes
        # today, but excluding them is forward-safe.
        exclude: ^(_sources/|_binaries/.*EULA\.txt|results-data/bundles/.*\.json$)
      - id: trailing-whitespace
        stages: [pre-commit]
        exclude: ^(_sources/|_binaries/.*EULA\.txt|results-data/bundles/.*\.json$)
      - id: check-added-large-files
        args: [--maxkb=1000]
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: detect-private-key
        stages: [pre-commit]

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
        args: [--fix, --disable, MD013, MD033, MD041]  # Disable line-length, HTML, first-line-heading rules
        stages: [pre-commit]
