- title: Switch TPC-DS Base Dialect from ANSI to Netezza ✅                                                                 │
  category: '"Technical Debt & Refactoring"'
  sections:
  - name: Notes
    text: '"- **Priority**: Medium                                                                                                 │"'
  - name: Notes
    text: '"- **Status**: Completed (commit 2a3c78b)                                                                               │"'
  - name: Notes
    text: '"- **Description**: Change the default TPC-DS SQL dialect from `ansi` (uses `SELECT TOP n`) to `netezza` (uses `LIMIT   │"'
  - name: Notes
    text: '"│        n`) for better modern SQL compatibility. This change affects all TPC-DS query generation and should be applied           │"'
  - name: Notes
    text: │        consistently across the codebase while maintaining support for all existing dialects.                                    │
  - name: Notes
    text: '"- **Context**:                                                                                                         │"'
  - name: Notes
    text: '"- **Current State**: Default dialect is `\"ansi\"` which uses `SELECT TOP n` SQL Server-style syntax                   │"'
  - name: Notes
    text: '"- **Desired State**: Default dialect should be `\"netezza\"` which uses modern `LIMIT n` syntax                        │"'
  - name: Notes
    text: '"- **Compatibility**: Better alignment with PostgreSQL, MySQL, DuckDB, SQLite, and other modern SQL databases         │"'
  - name: Notes
    text: '"- **Available Dialects**: `ansi`, `db2`, `netezza`, `oracle`, `sqlserver` (all should remain functional)             │"'
  - name: Notes
    text: '"- **Requirements**:                                                                                                    │"'
