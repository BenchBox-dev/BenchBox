- title: Fix ClickHouse Platform Issues
  category: Project Lifecycle Management
  sections:
  - name: Notes
    items:
    - text: '"**Priority**: Medium"'
    - text: '"**Status**: ✅ Completed"'
    - text: '"**Description**: ClickHouse platform adapter has two issues that cause warnings and inconsistencies"'
    - text: '"**Issues**:"'
  - name: Notes
    text: '"1. **Hardcoded OLAP optimizations applied regardless of --no-tuning flag**: ClickHouse adapter applies hardcoded settings in `configure_for_benchmark()` for OLAP benchmarks that ignore tuning configuration"'
  - name: Notes
    text: '"- Settings `join_algorithm = ''hash''` and `enable_multiple_joins_emulation = 1` don''t exist in ClickHouse embedded"'
  - name: Notes
    text: '"- These are applied unconditionally even with `--no-tuning` flag"'
  - name: Notes
    text: '"2. **Database path naming inconsistency**: ClickHouse embedded databases use generic naming (`clickhouse_embedded.chdb`) instead of benchmark-specific naming like other platforms (`clickbench_sf001_notuning_uniq_check.chdb`)"'
  - name: Notes
    text: '"- ClickHouse `get_database_path()` ignores the properly constructed `database_path` from orchestrator"'
  - name: Notes
    text: '"- Uses generic `database_name` instead of unique benchmark/scale/tuning-specific path"'
  - name: Notes
    items:
    - text: '"**Tasks**:"'
      children:
      - text: '"[x] **Fix hardcoded OLAP optimizations**:"'
        children:
        - text: '"✅ Make `configure_for_benchmark()` respect tuning configuration settings"'
        - text: '"✅ Skip problematic settings (`join_algorithm`, `enable_multiple_joins_emulation`) for embedded ClickHouse"'
        - text: ✅ Add version/mode detection to apply only compatible settings
        - text: '"✅ Ensure `--no-tuning` properly disables these hardcoded optimizations"'
      - text: '"[x] **Fix database path naming consistency**:"'
        children:
        - text: '"✅ Update ClickHouse `get_database_path()` to use orchestrator-provided `database_path`"'
        - text: '"✅ Convert DuckDB `.duckdb` extension to `.chdb` for ClickHouse while preserving unique naming"'
        - text: '"✅ Follow DuckDB pattern: `connection_config.get(''database_path'', fallback)`"'
        - text: ✅ Maintain backward compatibility with existing generic naming as fallback
      - text: '"[x] **Add embedded ClickHouse setting validation**:"'
        children:
        - text: ✅ Test settings compatibility before applying
        - text: ✅ Add warning suppression for known incompatible settings
        - text: ✅ Document ClickHouse embedded limitations and supported settings
    - text: '"**Files Affected**:"'
      children:
      - text: '"`/Users/joe/Developer/BenchBox/benchbox/platforms/clickhouse.py` (lines 106-120 for database path, lines 465-494 for optimization settings)"'
      - text: Platform configuration logic for tuning respect
    - text: '"**Current Behavior**:"'
      children:
      - text: '"Warnings: `Failed to set join_algorithm` and `Unknown setting ''enable_multiple_joins_emulation''`"'
      - text: Database reuse message shows generic path instead of benchmark-specific path
    - text: '"**Expected Behavior**:"'
