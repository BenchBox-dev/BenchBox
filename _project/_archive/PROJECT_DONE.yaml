- title: TPC Specification Compliance Issues ✅ COMPLETED
  category: Code Quality and Technical Debt
  sections:
  - name: Notes
    items:
    - text: '"**Priority**: High"'
    - text: '"**Status**: ✅ Completed"'
    - text: '"**Description**: Critical compliance issues where TPC-H and TPC-DS implementations don''t follow official specifications for query ordering in power and throughput tests"'
    - text: '"**Tasks**:"'
      children:
      - text: '"[x] Fix TPC-H power test to use proper stream permutation from `PERMUTATION_MATRIX[0]` instead of sequential ordering (1,2,3...22)"'
      - text: '"[x] Fix TPC-H throughput test concurrent streams to use different permutations from `PERMUTATION_MATRIX[stream_id % 41]`"'
      - text: '"[x] Fix TPC-DS power test to use proper stream permutation from `TPCDSStreamManager` with `PermutationMode.TPCDS_STANDARD`"'
      - text: '"[x] Fix TPC-DS throughput test concurrent streams to use different TPC-DS standard permutations per stream"'
      - text: '"[x] Update power run iterations configuration so each iteration uses a different stream permutation (iteration 0 uses stream 0, iteration 1 uses stream 1, etc.) to avoid repeated query ordering"'
      - text: '"[x] Update concurrent queries configuration to assign different stream permutations to concurrent workers"'
      - text: '"[x] Validate TPC-H power test uses correct query order: [14, 2, 9, 20, 6, 17, 18, 8, 21, 13, 3, 22, 16, 4, 11, 15, 1, 10, 19, 5, 7, 12]"'
      - text: '"[x] Integrate `benchbox/core/tpch/streams.py` `TPCHStreams.PERMUTATION_MATRIX` into power and throughput test implementations"'
      - text: '"[x] Integrate `benchbox/core/tpcds/streams.py` `TPCDSStreamManager` into TPC-DS power and throughput test implementations"'
      - text: '"[x] Add TPC specification compliance validation tests to ensure correct query ordering"'
      - text: '"[x] Update documentation to clarify TPC specification compliance and query ordering requirements"'
      - text: '"[x] Test that multiple concurrent streams use different permutations as required by TPC specifications"'
    - text: '"**Files Affected**: `benchbox/core/tpch/power_test.py`, `benchbox/core/tpch/throughput_test.py`, `benchbox/core/tpcds/power_test.py`, `benchbox/core/tpcds/throughput_test.py`, `benchbox/utils/execution_manager.py`"'
    - text: '"**Impact**: ✅ Successfully implemented TPC specification compliance across all power and throughput tests. TPC-H now uses the official 41-stream permutation matrix with proper query ordering starting with [14, 2, 9, 20, 6, 17, 18, 8, 21, 13, 3, 22, 16, 4, 11, 15, 1, 10, 19, 5, 7, 12] for stream 0. TPC-DS uses the standard permutation algorithm. Power run iterations now cycle through different stream permutations per iteration, and concurrent queries assign different stream IDs automatically. Results are now comparable to official TPC publications and provide valid statistical analysis."'
    - text: '"**Rationale**: TPC specifications mandate specific query permutations for power tests and different permutations for concurrent streams in throughput tests. Sequential or simple random ordering violates the specification and reduces the validity of performance measurements for optimizer testing and database evaluation."'
    - text: '"**Verification**: All compliance tests pass (`_project/test_tpc_compliance.py`), documentation updated (`_project/TPC_SPECIFICATION_COMPLIANCE.md`), and functionality validated with core TPC-H tests continuing to pass."'
