- title: Fix TPC Power/Throughput/Maintenance Test Implementation (TPC-H and TPC-DS) ✅
  category: Core Functionality
  sections:
  - name: Notes
    items:
    - text: '"**Priority**: High"'
    - text: '"**Status**: Completed (commit 95ffeb1)"'
    - text: '"**Description**: CLI test execution flags (`--power-test`, `--throughput-test`, `--maintenance-test`) are accepted but not executing valid TPC tests according to specifications for both TPC-H and TPC-DS benchmarks"'
    - text: '"**Context**: Pre-release project - breaking changes are acceptable to fix core functionality"'
    - text: '"**Current Issue**: All TPC test flags set `test_execution_type` but platform adapters ignore this value and execute standard sequential queries instead of proper TPC-compliant test implementations with correct metrics and procedures"'
    - text: '"**Affected Tests**:"'
      children:
      - text: '"**TPC-H**: `--power-test` runs queries 1-22 sequentially instead of stream permutation order with Power@Size calculation"'
      - text: '"**TPC-DS**: `--power-test` runs queries 1-99 sequentially instead of TPC-DS power test specification"'
      - text: '"**TPC-DS**: `--throughput-test` runs queries sequentially instead of concurrent streams with Throughput@Size calculation"'
      - text: '"**TPC-DS**: `--maintenance-test` runs queries instead of INSERT/UPDATE/DELETE data maintenance operations"'
    - text: '"**Root Cause Analysis**:"'
      children:
      - text: '"CLI correctly sets `test_execution_type` when test flags are specified"'
      - text: '"`BenchmarkOrchestrator` passes this to platform adapter''s `run_benchmark()` method"'
      - text: '"Platform adapter''s `run_benchmark()` method ignores `test_execution_type` and always calls `_execute_all_queries()`"'
      - text: '"`_execute_all_queries()` runs standard sequential query execution without TPC compliance"'
      - text: '"Existing complete test implementations exist but are never used:"'
        children:
        - text: '"`benchbox/core/tpch/power_test.py` - TPC-H Power Test implementation"'
        - text: '"`benchbox/core/tpcds/power_test.py` - TPC-DS Power Test implementation"'
        - text: '"`benchbox/core/tpcds/throughput_test.py` - TPC-DS Throughput Test implementation"'
        - text: '"`benchbox/core/tpcds/maintenance_test.py` - TPC-DS Maintenance Test implementation"'
    - text: '"**Current Implementation Status (commit fffc1e7)**:"'
      children:
      - text: '"✅ **Test Routing Infrastructure**: Platform adapter routing by `test_execution_type` implemented"'
      - text: '"✅ **CLI Integration**: Help text updated, parameter handling works correctly"'
      - text: '"✅ **Error Handling**: Graceful fallback for unsupported test/benchmark combinations"'
      - text: '"✅ **Test Coverage**: Comprehensive test suite for TPC test routing added"'
      - text: '"❌ **TPC Specification Compliance**: Uses simplified placeholder implementations instead of proper TPC tests"'
      - text: '"❌ **Existing Implementation Integration**: Does not use existing `benchbox/core/tpc*` test classes"'
      - text: '"❌ **Concurrent Execution**: TPC-DS throughput test runs sequentially with \"simplified implementation\" message"'
      - text: '"❌ **Full Query Coverage**: TPC-DS throughput test uses only 10 queries instead of 99-query specification"'
  - name: Notes
    items:
