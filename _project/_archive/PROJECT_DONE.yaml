- title: Standardize Connection Interfaces Across All Benchmarks
  category: Code Quality and Technical Debt
  sections:
  - name: Notes
    items:
    - text: '"**Priority**: High"'
    - text: '"**Status**: ✅ Completed"'
    - text: '"**Description**: Fix critical connection interface inconsistencies between TPC benchmarks and other benchmarks that prevent CLI compatibility and cause connection bugs"'
    - text: '"**Root Cause Analysis**:"'
      children:
      - text: '"**Two Incompatible Patterns**: Most benchmarks use connection objects (`execute_query(query_id, connection: Any, params=None)`), but TPC benchmarks use connection strings (`run_power_test(connection_string: str, ...)`)"'
      - text: '"**Critical Bug**: TPC-DS attempts `_DatabaseConnection(connection_string)` but `DatabaseConnection.__init__()` expects DB-API 2.0 connection objects, not strings"'
      - text: '"**Architecture Bypass**: TPC benchmarks bypass platform adapter connection management, preventing proper CLI integration"'
    - text: '"**Issues Identified**:"'
      children:
      - text: '"TPC-DS shows `\"sql_text\": \"<platform execution>\"` in result files due to connection interface mismatch"'
      - text: CLI incompatibility with TPC benchmarks due to connection string vs object mismatch
      - text: Resource management inconsistencies across benchmark types
      - text: Code duplication in connection handling logic
    - text: '"**Target Architecture**:"'
      children:
      - text: '"**Single Interface**: All benchmarks use `execute_query(query_id, connection: Any, params=None)` and `run_benchmark(connection: Any, ...)`"'
      - text: '"**TPC Test Mode Support**: TPC benchmarks must maintain `run_power_test(connection: Any, ...)`, `run_throughput_test(connection: Any, ...)`, and `run_maintenance_test(connection: Any, ...)` methods for CLI compatibility"'
      - text: '"**Platform Adapter Managed**: All connections created via `platform_adapter.create_connection(**config)`"'
      - text: '"**Resource Lifecycle**: Platform adapters handle connection creation, pooling, and cleanup"'
      - text: '"**Type Safety**: Consistent connection object types with proper DB-API 2.0 compliance"'
    - text: '"**Tasks**:"'
      children:
      - text: '"[x] ✅ **Fix Critical TPC-DS Bug**: Replace `_DatabaseConnection(connection_string)` with platform adapter connection creation"'
      - text: '"[x] ✅ **Standardize TPC-H Interface**: Update all TPC-H methods to use connection objects instead of connection strings"'
      - text: '"[x] ✅ **Standardize TPC-DS Interface**: Update all TPC-DS methods to use connection objects instead of connection strings"'
      - text: '"[x] ✅ **Update Method Signatures**: Change `connection_string: str` parameters to `connection: Any` across all TPC benchmark methods"'
      - text: '"[x] ✅ **Preserve TPC Test Modes**: Ensure `run_power_test()`, `run_throughput_test()`, and `run_maintenance_test()` methods are updated to use connection objects while maintaining CLI `--power-test`, `--throughput-test`, `--maintenance-test` flag compatibility"'
      - text: '"[x] ✅ **Remove String-Based Connection Handling**: Delete internal `DatabaseConnection(connection_string)` creation code"'
