- title: Switch TPC-DS Base Dialect from ANSI to Netezza ✅
  category: Core Functionality
  sections:
  - name: Notes
    items:
    - text: '"**Priority**: Medium"'
    - text: '"**Status**: Completed (commit 2a3c78b)"'
    - text: '"**Description**: Change the default TPC-DS SQL dialect from `ansi` (uses `SELECT TOP n`) to `netezza` (uses `LIMIT n`) for better modern SQL compatibility. This change affects all TPC-DS query generation and should be applied consistently across the codebase while maintaining support for all existing dialects."'
    - text: '"**Context**:"'
      children:
      - text: '"**Current State**: Default dialect is `\"ansi\"` which uses `SELECT TOP n` SQL Server-style syntax"'
      - text: '"**Desired State**: Default dialect should be `\"netezza\"` which uses modern `LIMIT n` syntax"'
      - text: '"**Compatibility**: Better alignment with PostgreSQL, MySQL, DuckDB, SQLite, and other modern SQL databases"'
      - text: '"**Available Dialects**: `ansi`, `db2`, `netezza`, `oracle`, `sqlserver` (all should remain functional)"'
    - text: '"**Requirements**:"'
      children:
      - text: '"**Convert Existing Usage**: All existing `ansi` dialect usage needs to be converted to `netezza`"'
      - text: '"**Maintain Compatibility**: `ansi` should continue to work if explicitly specified by users"'
      - text: '"**Platform Integration**: Each platform adapter should define a base dialect from the supported list"'
      - text: '"**Production Quality**: No placeholders or demo functionality - full production implementation"'
      - text: '"**No Backward Compatibility**: Project is pre-release, breaking changes are acceptable"'
    - text: '"**Detailed Implementation Tasks**:"'
      children:
      - text: '"[ ] **Audit Current Dialect Usage**:"'
        children:
        - text: '"Identify all hardcoded `\\"ansi\\"` default values in function signatures and class constructors"'
        - text: '"Map all locations where `base_dialect or ''ansi''` fallback logic is used"'
        - text: Document current dialect parameter flow through the system
        - text: '"**Locations Found**:"'
          children:
          - text: '"`benchbox/core/tpcds/queries.py`: Lines 35, 139 (default parameters)"'
          - text: '"`benchbox/core/tpcds/c_tools.py`: Lines 149, 215, 889, 935 (default parameters)"'
          - text: '"`benchbox/core/tpcds/benchmark.py`: Lines 271, 363, 391 (fallback logic)"'
      - text: '"[ ] **Update Default Dialect Parameters**:"'
        children:
        - text: '"Change `dialect: str = \"ansi\"` to `dialect: str = \"netezza\"` in all function signatures"'
        - text: '"**Files to Modify**:"'
          children:
          - text: '"`benchbox/core/tpcds/queries.py`: Update `TPCDSQueryManager.__init__()` and `validate_generated_queries()` methods"'
          - text: '"`benchbox/core/tpcds/c_tools.py`: Update `DSQGenBinary.generate()`, `generate_parameters()`, `generate_via_dsqgen()`, and `DSQGen.__init__()` methods"'
      - text: '"[ ] **Update Fallback Logic**:"'
        children:
        - text: '"Change `base_dialect or ''ansi''` to `base_dialect or ''netezza''` in all fallback scenarios"'
        - text: '"**File to Modify**:"'
          children:
          - text: '"`benchbox/core/tpcds/benchmark.py`: Update dialect fallback logic in query translation methods"'
      - text: '"[ ] **Update Documentation and Examples**:"'
        children:
        - text: '"Update method docstrings to show `netezza` as the default dialect"'
        - text: '"Update code comments that reference `ansi` as the default"'
        - text: '"Update any example configurations or test fixtures that assume `ansi` default"'
      - text: '"[ ] **Platform Adapter Base Dialect Configuration**:"'
        children:
        - text: '"Define base dialect mapping for each platform adapter:"'
          children:
          - text: '"DuckDB: `netezza` (LIMIT syntax support)"'
          - text: '"PostgreSQL: `netezza` (native LIMIT syntax)"'
          - text: '"SQLite: `netezza` (LIMIT syntax support)"'
          - text: '"Snowflake: `netezza` (LIMIT syntax support)"'
          - text: '"BigQuery: `netezza` (LIMIT syntax support)"'
          - text: '"ClickHouse: `netezza` (LIMIT syntax support)"'
          - text: '"Databricks: `netezza` (LIMIT syntax support)"'
          - text: '"SQL Server: `ansi` (native TOP syntax)"'
          - text: '"Oracle: `oracle` (native dialect)"'
          - text: '"DB2: `db2` (native dialect)"'
        - text: Add platform adapter method to return appropriate base dialect
        - text: Update platform adapter constructors to use platform-appropriate base dialect
      - text: '"[ ] **Test Comprehensive Dialect Support**:"'
        children:
        - text: '"Test query generation with `netezza` dialect produces valid `LIMIT n` syntax"'
        - text: '"Test query generation with `ansi` dialect still produces valid `SELECT TOP n` syntax"'
        - text: '"Test all supported dialects (`ansi`, `db2`, `netezza`, `oracle`, `sqlserver`) work correctly"'
        - text: Verify no regressions in existing functionality when dialect is explicitly specified
      - text: '"[ ] **Integration Testing**:"'
        children:
        - text: '"Test TPC-DS benchmark execution with new `netezza` default on all supported platforms"'
        - text: '"Verify platform adapters work correctly with `netezza` dialect SQL"'
        - text: Test CLI functionality with new dialect defaults
        - text: '"Validate dry-run outputs show correct `LIMIT n` syntax by default"'
      - text: '"[ ] **Error Handling and Validation**:"'
        children:
        - text: Ensure unsupported dialect requests provide clear error messages
        - text: Add dialect validation in query generation methods
        - text: Test edge cases and error scenarios with new default dialect
    - text: '"**Technical Requirements**:"'
      children:
      - text: '"**Query Generation**: All dsqgen command generation must use correct `-DIALECT` parameter"'
      - text: '"**SQL Translation**: Platform adapters should handle `LIMIT n` syntax correctly through sqlglot"'
      - text: '"**Template Files**: Verify `netezza.tpl` template file is available and correct"'
      - text: '"**Testing Coverage**: Comprehensive test coverage for dialect switching and compatibility"'
    - text: '"**Files Affected**:"'
      children:
      - text: '"**Primary**: `benchbox/core/tpcds/queries.py`, `benchbox/core/tpcds/c_tools.py`, `benchbox/core/tpcds/benchmark.py`"'
      - text: '"**Platform Adapters**: All platform adapter classes for base dialect configuration"'
      - text: '"**Tests**: Update test fixtures and add comprehensive dialect testing"'
      - text: '"**Documentation**: Update docstrings, comments, and examples"'
    - text: '"**Success Criteria**:"'
      children:
      - text: '"**Default Behavior**: New TPC-DS benchmarks use `LIMIT n` syntax by default"'
      - text: '"**Explicit Specification**: `--dialect ansi` or API calls with `dialect=\"ansi\"` still work correctly"'
      - text: '"**Platform Compatibility**: All platform adapters handle `netezza` dialect correctly"'
      - text: '"**Query Validation**: Generated queries are syntactically correct and functionally equivalent"'
      - text: '"**No Regressions**: All existing functionality continues to work with new defaults"'
      - text: '"**Modern SQL Standard**: Default SQL output uses modern `LIMIT n` syntax for better cross-platform compatibility"'
    - text: '"**Impact**: Improves default SQL compatibility with modern databases, reduces SQL translation complexity for most platforms, maintains full backward compatibility for users who need specific dialects, aligns with industry standards for LIMIT clause usage"'
- title: '"CLI: Detect and Skip Unneeded Data Generation ✅"'
  category: Core Functionality
  sections:
  - name: Notes
    items:
    - text: Implemented manifest-based detection to skip redundant data generation without scanning or decompressing data files.
    - text: '"Generators (TPC-DS and TPC-H) now write `_datagen_manifest.json` containing per-table file entries with `path`, `size_bytes`, and `row_count`, plus global metadata (benchmark, scale, compression, parallel, timestamp)."'
    - text: '"Orchestrator preflight validates the manifest strictly: confirms benchmark/scale, verifies each listed file exists and its `size_bytes` matches. When valid, it reuses data and constructs `benchmark.tables` mapping directly from the manifest."'
    - text: '"Added CLI flags `--no-regenerate` and `--force-regenerate` to control regeneration."'
    - text: Added unit tests for orchestrator flag behavior and manifest creation/consumption.
    - text: '"Impact: Deterministic, fast detection for reuse (local and cloud), improved UX and run predictability."'
