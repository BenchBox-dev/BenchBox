  - name: API Usage Examples
  - name: Notes
    text: '"```python"'
  - name: Notes
    text: '"# Core API usage (no CLI dependencies)"'
  - name: Notes
    text: from benchbox.core.tpcds import TPCDSBenchmark
  - name: Notes
    text: '"benchmark = TPCDSBenchmark(scale_factor=1.0, enable_validation=True)"'
  - name: Notes
    text: benchmark.generate_data()
  - name: Notes
    text: '"# Direct validation access"'
  - name: Notes
    text: '"validation_result = benchmark.validate_generated_data()"'
  - name: Notes
    text: '"if not validation_result.is_valid:"'
  - name: Notes
    text: '"print(f\"Validation failed: {validation_result.errors}\")"'
  - name: Notes
    text: '"# Database validation after loading"'
  - name: Notes
    text: '"db_validation = benchmark.validate_loaded_data(connection)"'
  - name: Notes
    text: '"# Platform-specific validation"'
  - name: Notes
    text: '"platform_validation = platform_adapter.validate_platform_capabilities(\"tpcds\")"'
  - name: Notes
    text: '"```"'
