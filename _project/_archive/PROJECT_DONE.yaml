entries:
- title: ✅ Migration from `uv pip install` to `uv add` Syntax
  category: Documentation and Tooling
  status: Completed
  priority: Medium
  impact: Migrated entire project from legacy pip-compatible `uv pip install` syntax to modern declarative `uv add` syntax. Updated 281 occurrences across 50+ files including core docs, Python source, platform adapters, CLI commands, CI/CD workflows, build system, examples, and tests. All documentation now shows both syntaxes with `uv add` as primary recommendation.
  sections:
  - name: Summary
    text: Completed comprehensive migration from `uv pip install package` to `uv add package` syntax throughout the entire BenchBox project. This modernizes the project to use uv's declarative package management approach while maintaining backward compatibility documentation. The migration improves reproducibility by ensuring all dependencies are tracked in pyproject.toml and uv.lock.
  - name: Completed Phases
    items:
    - text: 'Phase 1: Core Documentation (README, CLAUDE.md, GEMINI.md, CONTRIBUTING.md)'
      children:
      - text: 'Updated README.md installation tables to show both syntaxes'
      - text: 'Added Package Management section to CLAUDE.md with modern uv commands'
      - text: 'Updated GEMINI.md with uv add examples'
      - text: 'Changed CONTRIBUTING.md development setup to use uv sync --group dev'
      - text: 'All references now show uv add as primary, uv pip install as alternative'
    - text: 'Phase 2: Python Source Code (dependencies.py, platform adapters, CLI)'
      children:
      - text: 'Updated benchbox/utils/dependencies.py (52 instances - generates all dynamic error messages)'
      - text: 'Modified InstallationScenario class with uv_command and uv_pip_command properties'
      - text: 'Updated all 7 DependencyInfo install_command fields'
      - text: 'Updated platform adapters (databricks, clickhouse, base) install_commands'
      - text: 'Modified CLI commands (checks.py, plot.py, system.py) with new syntax'
      - text: 'All 35 dependency tests passing'
    - text: 'Phase 3: Documentation Files (docs/usage/, docs/platforms/, docs/guides/)'
      children:
      - text: 'Updated installation.md, faq.md, troubleshooting.md'
      - text: 'Updated platform quick-reference.md'
      - text: 'Updated TPC benchmark guides (tpch.md, tpcds.md, tpc-h-features.md)'
      - text: 'Updated API documentation RST files'
      - text: 'Used sed for batch processing of 8+ markdown files'
    - text: 'Phase 4: CI/CD Workflows (.github/workflows/)'
      children:
      - text: 'Migrated to uv tool install for standalone tools (safety, twine, sphinx)'
      - text: 'Updated to use uvx for running standalone tools'
      - text: 'Kept uv sync for project dependencies'
      - text: 'Modern declarative approach throughout CI'
    - text: 'Phase 5: Build System (Makefile)'
      children:
      - text: 'Changed install target: uv pip install . → uv sync'
      - text: 'Changed develop target: uv pip install -e ".[dev]" → uv sync --group dev'
      - text: 'Changed dist target: pip install + build → uv build (cleaner)'
    - text: 'Phase 6: Examples and Release Documentation'
      children:
      - text: 'Updated examples/README.md with new syntax'
      - text: 'Updated release/README.public.md'
      - text: 'Updated getting_started examples documentation'
      - text: 'Databricks and BigQuery example files updated'
    - text: 'Phase 7: Test Suite Updates'
      children:
      - text: 'Updated tests/unit/utils/test_dependencies.py assertions'
      - text: 'Updated tests/unit/cli/test_cli_check_deps.py assertions'
      - text: 'All 49 dependency and CLI tests passing'
  - name: Technical Details
    items:
    - text: 'Syntax Change: uv pip install "package[extra]" → uv add package --extra extra'
    - text: 'Multiple Extras: --extra cloud --extra clickhouse (not comma-separated)'
    - text: 'CI/CD Tools: uv tool install + uvx (for safety, twine, sphinx)'
    - text: 'Development: uv sync --group dev (replaces pip install -e ".[dev]")'
    - text: 'Build: uv build (replaces pip install build + python -m build)'
    - text: 'Documentation Strategy: Show both syntaxes, uv add as primary'
  - name: Files Modified
    items:
    - text: 'Core Docs: README.md (29 instances), CLAUDE.md, GEMINI.md, CONTRIBUTING.md'
    - text: 'Python Source: benchbox/utils/dependencies.py (52 instances), platform adapters, CLI commands'
    - text: 'Documentation: docs/usage/*.md, docs/platforms/*.md, docs/guides/tpc/*.md, docs/reference/*.rst'
    - text: 'CI/CD: .github/workflows/test.yml, .github/workflows/release.yml'
    - text: 'Build: Makefile'
    - text: 'Examples: examples/README.md, examples/getting_started/*.md, examples/*.py'
    - text: 'Tests: tests/unit/utils/test_dependencies.py, tests/unit/cli/test_cli_check_deps.py'
  - name: Commits
    items:
    - text: 'd619f8fe - docs: migrate README, CLAUDE.md, GEMINI.md, CONTRIBUTING.md, and dependencies.py to uv add syntax'
    - text: '3a972cd7 - refactor: update platform adapters and CLI to use uv add syntax'
    - text: '9a4c98dd - docs: migrate all documentation to uv add syntax (50+ files)'
    - text: '302c9118 - ci: migrate workflows to use uv tool install and uv sync'
    - text: 'a592b97a - build: modernize Makefile to use uv sync and uv build'
    - text: '2a85f3a5 - docs: update examples and release documentation to uv add syntax'
    - text: 'a84ed60b - test: update test assertion for new uv add syntax'
- title: ✅ Universal Validation Mode System - Architectural Refactor
  category: Result Validation and Architecture
  status: Completed
  priority: High
  impact: Replaced benchmark-specific validation flags with universal --validation-mode flag. Unified validation system now works consistently across all benchmarks (TPC-H, TPC-DS, future benchmarks). Improved architecture eliminates technical debt and provides foundation for extensible validation. All 46 validation tests passing, end-to-end integration tests passing.
  sections:
  - name: Summary
    text: Conducted adversarial review of validation system and identified architectural flaw in benchmark-specific --tpch-validation-mode flag. Implemented universal validation system with single --validation-mode flag that works for all benchmarks. Removed technical debt, improved consistency, and created scalable foundation for future benchmarks.
  - name: Completed Phases
    items:
    - text: 'Phase 1: Remove Benchmark-Specific Flag'
      children:
      - text: 'Removed --tpch-validation-mode CLI flag'
      - text: 'Added universal --validation-mode flag (exact, loose, range, disabled)'
      - text: 'Updated CLI help text with comprehensive documentation'
      - text: 'Flag applies to all benchmarks consistently'
    - text: 'Phase 2: Update TPC-H Integration'
      children:
      - text: 'Modified run.py to extract validation_mode from CLI'
      - text: 'Updated adapter.py to pass validation_mode to TPCHPowerTest'
      - text: 'Applied to both warmup and measurement runs'
      - text: 'Maintains seed-based auto-detection logic'
    - text: 'Phase 3: Update TPC-DS Integration'
      children:
      - text: 'Added set_config_validation_mode() to tpcds_results.py'
      - text: 'Updated get_query_validation_mode() with config priority'
      - text: 'Integrated into _execute_tpcds_power_test()'
      - text: 'Integrated into _execute_tpcds_throughput_test()'
      - text: 'Maintains backward compatibility with environment variables'
    - text: 'Phase 4: Documentation Updates'
      children:
      - text: 'Added comprehensive validation modes documentation to tpch_results.py'
      - text: 'Documented seed-based parameter generation'
      - text: 'Added usage examples for all validation modes'
      - text: 'Explained configuration hierarchy (programmatic > config > env > default)'
    - text: 'Phase 5: Testing and Validation'
      children:
      - text: 'All 46 validation unit tests passing'
      - text: 'All 10 Phase 4 integration tests passing'
      - text: 'End-to-end CLI tests with DuckDB passing'
      - text: 'Tested auto-detection at SF=1.0'
      - text: 'Tested loose mode with custom seed'
      - text: 'Tested explicit validation mode flags'
  - name: Technical Details
    items:
    - text: 'Architecture: Single universal flag replaces per-benchmark flags'
    - text: 'Configuration Priority: Programmatic > CLI Config > Environment > Default'
    - text: 'Backward Compatibility: TPC-DS environment variable still works'
    - text: 'Validation Modes: EXACT (reference seed), LOOSE (±50% tolerance), RANGE (min/max), DISABLED'
    - text: 'Files Modified: run.py, adapter.py, tpch_results.py, tpcds_results.py (4 files)'
  - name: Impact and Benefits
    items:
    - text: 'Scalable: Works for all benchmarks, easy to add new benchmarks'
    - text: 'Consistent: Same flag and behavior across all benchmarks'
    - text: 'User-Friendly: Single flag to learn, clear documentation'
    - text: 'Maintainable: Eliminates technical debt from per-benchmark flags'
    - text: 'Extensible: Foundation for future validation enhancements'
  commit: e0fc503f
  date: 2025-11-21

- title: ✅ Adversarial Review - Cost Framework Enhancement (Warnings, Metadata, Timing, Storage)
  category: Cost Estimation and Transparency
  status: Completed
  priority: High
  impact: Enhanced cost estimation framework with comprehensive warnings system, pricing metadata with staleness detection, concurrent query timing context, and storage cost estimation. Improved user transparency and cost accuracy across all supported platforms (Snowflake, BigQuery, Redshift, Databricks). All 122 cost tests passing.
  sections:
  - name: Summary
    text: Conducted adversarial review of cost estimation framework and implemented 4 phases of improvements to address transparency and accuracy gaps. Added cost_model field to distinguish marginal vs actual costs, implemented warnings system for user education, added pricing version tracking with staleness detection, enriched phase costs with timing context for budgeting, and created storage cost estimation module. Updated comprehensive documentation with output schema examples.
  - name: Completed Phases
    items:
    - text: 'Phase 1: Cost Model & Warnings System'
      children:
      - text: 'Added cost_model field to BenchmarkCost ("actual", "marginal", "estimated")'
      - text: 'Added warnings array for user-facing alerts'
      - text: 'Implemented Redshift marginal cost warnings with cluster TCO guidance'
      - text: 'Implemented Databricks all-purpose cluster cost warnings'
      - text: 'Clarified cost model distinctions in output'
      - text: 'All 122 tests passing'
    - text: 'Phase 2: Pricing Metadata & Staleness Detection'
      children:
      - text: 'Added PRICING_VERSION (2025.11) and PRICING_LAST_UPDATED (2025-11-09)'
      - text: 'Implemented get_pricing_age_days() and is_pricing_stale() helpers'
      - text: 'Added pricing_version and pricing_date to platform_details output'
      - text: 'Implemented automatic staleness warning (90-day threshold)'
      - text: 'Target accuracy: ±5% for major regions'
      - text: 'All 122 tests passing'
    - text: 'Phase 3: Concurrent Query Timing Context'
      children:
      - text: 'Added wall_clock_duration_seconds to PhaseCost model'
      - text: 'Added concurrent_streams count to PhaseCost model'
      - text: 'Computed effective_cost_per_hour for budgeting/forecasting'
      - text: 'Extracted timing from power_test, throughput_test, maintenance_test phases'
      - text: 'Provided context for understanding concurrent execution costs'
      - text: 'All 122 tests passing'
    - text: 'Phase 4: Storage Cost Estimation'
      children:
      - text: 'Created benchbox/core/cost/storage.py module'
      - text: 'Implemented estimate_storage_cost() with platform-specific pricing'
      - text: 'Covered 50+ regions across AWS, Azure, GCP'
      - text: 'Added storage_cost field to BenchmarkCost (optional)'
      - text: 'Added storage_estimate to platform_details with metadata'
      - text: 'Implemented automatic estimation when data_size_mb > 0'
      - text: 'Added warnings about estimate limitations and scope'
      - text: 'All 122 tests passing'
    - text: 'Phase 5: Documentation Updates'
      children:
      - text: 'Added comprehensive Output Schema section to README'
      - text: 'Documented cost_model types with platform mappings'
      - text: 'Documented warnings system with 4 warning categories'
      - text: 'Explained timing context fields and use cases'
      - text: 'Detailed pricing metadata versioning strategy'
      - text: 'Documented storage cost estimation methodology and limitations'
      - text: 'Provided JSON examples with all new fields'
  - name: Technical Details
    items:
    - text: 'Files Modified: benchbox/core/cost/models.py, integration.py, pricing.py, README.md'
    - text: 'Files Created: benchbox/core/cost/storage.py'
    - text: 'New Model Fields: cost_model, warnings, storage_cost (BenchmarkCost); wall_clock_duration_seconds, concurrent_streams (PhaseCost)'
    - text: 'New Pricing Functions: get_pricing_age_days(), is_pricing_stale(), estimate_storage_cost()'
    - text: 'Warning Categories: Cost model warnings, pricing staleness, storage estimates, configuration issues'
    - text: 'Backward Compatible: All new fields optional, no breaking changes'
    - text: 'Test Status: All 122 cost tests passing'
  - name: Commits
    items:
    - text: '7a9e13ac - feat(cost): enhance cost framework with warnings, metadata, timing, and storage estimates'
  completed_date: '2025-11-09'

- title: ✅ Adversarial Review - NotImplementedError Stub Removal (TPC-DS, TPC-Havoc, TPC-DI)
  category: Code Quality and Technical Debt
  status: Completed
  priority: High
  impact: Removed all placeholder stub implementations identified in adversarial code review across TPC-DS, TPC-Havoc, and TPC-DI benchmarks. Eliminated unused dead code, removed NotImplementedError methods in favor of platform adapter pattern, and enhanced documentation. All tests passing (169 TPC-DI + 15 TPC-Havoc + 16 TPC-DS).
  sections:
  - name: Summary
    text: Conducted comprehensive adversarial review to identify and remove all placeholder stub implementations. Completed 3-phase remediation plan removing unused legacy methods (TPC-DS), NotImplementedError execution methods (TPC-Havoc), and dead code (TPC-DI). Added comprehensive usage documentation and integration tests. Maintained architectural consistency across all benchmarks using platform adapter pattern.
  - name: Completed Phases
    items:
    - text: 'Phase 1: TPC-DS Legacy Methods Removal'
      children:
      - text: 'Removed 3 unused legacy methods from benchbox/core/tpcds/benchmark/runner.py'
      - text: 'Methods: load_data_to_database(), run_query(), run_benchmark()'
      - text: 'All raised NotImplementedError and were never called in production'
      - text: 'Removed associated test expectations from test_notimplementederror_completions.py'
      - text: 'All 16 TPC-DS tests passing'
      - text: 'Commit: 55554f31'
    - text: 'Phase 2: TPC-Havoc Full Implementation'
      children:
      - text: 'Removed 3 NotImplementedError execution methods from core and public API'
      - text: 'Methods: run_query_variant(), run_variant_comparison(), run_havoc_benchmark()'
      - text: 'Added comprehensive class docstrings with platform adapter usage examples'
      - text: 'Created integration test suite (tests/integration/test_tpchavoc_duckdb.py)'
      - text: 'Tests: 8 comprehensive tests (variant generation, metadata, export, SQL validity)'
      - text: 'All 15 TPC-Havoc tests passing (8 unit + 7 integration)'
      - text: 'Commits: e03801e4, 1e27b780, 13c75c0a'
    - text: 'Phase 3: TPC-DI Stub Cleanup'
      children:
      - text: 'Removed unused _insert_table_data() dead code from benchbox/core/tpcdi/etl/pipeline.py'
      - text: 'Method was never called and contained hardcoded placeholder value (1000)'
      - text: 'All 169 TPC-DI tests passing'
      - text: 'Commit: e81ec602'
  - name: Architecture Decisions
