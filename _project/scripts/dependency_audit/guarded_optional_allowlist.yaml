# Guarded optional import allowlist for the dependency audit.
#
# Packages listed here are DECLARED in pyproject.toml but have zero import
# sites in the scanned paths (benchbox/, scripts/, tests/, docs/).  The audit
# would otherwise flag them as violations.  List a package here only when ALL
# three conditions hold:
#
#   1. The package IS declared in pyproject.toml (core, extras, or dep-group).
#   2. The package has NO import statement in the scan paths - not even a
#      guarded `try: import X` block - because the AST scanner finds those too.
#   3. The package is legitimately optional (e.g. GPU-only, private distrib.).
#
# IMPORTANT: packages with guarded try/except imports are found by the AST
# scanner and therefore have import sites.  They do NOT need to be listed here.
# If a package passes the audit via import sites, an entry here is redundant.
#
# Each entry MUST include a `reason` and an `extras_group` reference so
# future maintainers can verify the declaration is still current.

# --------------------------------------------------------------------------
# NVIDIA RAPIDS / CUDA stack - optional GPU acceleration.
#
# NOTE: cudf/cupy/cuml are currently NOT declared as packages in pyproject.toml;
# extras:cudf = [] is an empty placeholder.  These entries are therefore never
# consulted by the audit (only declared packages reach the allowlist check).
# They are kept here as forward-declarations so that when extras:cudf is
# populated, maintainers know these packages should be added to the allowlist
# only if they somehow lack import sites at that point.
#
# As of this writing, cudf and cupy DO have guarded try/except import sites in
# benchbox/platforms/dataframe/cudf_df.py, so the AST scanner would find them
# even if they were declared - they would pass via import sites, not allowlist.
# --------------------------------------------------------------------------
cudf:
  reason: "GPU DataFrame backend; guarded import in cudf_df.py. extras:cudf is currently an empty placeholder - not yet a declared package."
  extras_group: "extras:cudf"

cupy:
  reason: "CUDA array library; guarded import in cudf_df.py. Not declared in pyproject.toml; pulled transitively via cudf."
  extras_group: "extras:cudf"

cuml:
  reason: "CUDA ML library; used in RAPIDS paths. Not declared in pyproject.toml; pulled transitively via cudf."
  extras_group: "extras:cudf"
