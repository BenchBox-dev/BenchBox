# Guarded optional import allowlist for the dependency audit.
#
# Packages listed here are DECLARED in pyproject.toml but have zero import
# sites in the scanned paths (benchbox/, scripts/, tests/, docs/).  The audit
# would otherwise flag them as violations.  List a package here only when ALL
# three conditions hold:
#
#   1. The package IS declared in pyproject.toml (core, extras, or dep-group).
#   2. The package has NO import statement in the scan paths — not even a
#      guarded `try: import X` block — because the AST scanner finds those too.
#   3. The package is legitimately optional (e.g. GPU-only, private distrib.).
#
# IMPORTANT: packages with guarded try/except imports are found by the AST
# scanner and therefore have import sites.  They do NOT need to be listed here.
# If a package passes the audit via import sites, an entry here is redundant.
#
# Each entry MUST include a `reason` and an `extras_group` reference so
# future maintainers can verify the declaration is still current.

# --------------------------------------------------------------------------
# NVIDIA RAPIDS / CUDA stack — optional GPU acceleration.
# extras:cudf is currently a placeholder (empty group); these entries are
# preemptive.  Once cudf/cupy are added to extras:cudf they will have guarded
# import sites in benchbox/platforms/dataframe/cudf_df.py and may not need
# this allowlist — but we keep the entries so the intent is documented.
# --------------------------------------------------------------------------
cudf:
  reason: "GPU DataFrame backend; guarded import in cudf_df.py. extras:cudf currently empty placeholder."
  extras_group: "extras:cudf"

cupy:
  reason: "CUDA array library; guarded import in cudf_df.py. Pulled via cudf."
  extras_group: "extras:cudf"

cuml:
  reason: "CUDA ML library; guarded import in RAPIDS paths. Pulled via cudf."
  extras_group: "extras:cudf"
