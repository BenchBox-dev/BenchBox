# Isolated Python environment for _project/scripts/ internal tooling.
#
# These scripts are NOT shipped in the BenchBox wheel. They live here so their
# dependency surface cannot leak into the public install.
#
# Usage:
#   uv run --project _project/scripts -- todo-db <args>
#   _project/scripts/todo <args>   # BenchBox policy adapter over todo-db
#
# See CLAUDE.md and AGENTS.md for the canonical pre-approved command forms.

[project]
name = "benchbox-project-scripts"
version = "0.1.0"
description = "Internal BenchBox TODO and release tooling - not shipped in the wheel"
requires-python = ">=3.10"
dependencies = [
    # Cap <2 to catch the next-major API break; browser results.duckdb files use
    # the default v1.0.0 on-disk format, attachable by @duckdb/duckdb-wasm
    # regardless of writer version (kept in sync with the root manifest).
    "duckdb>=1.0.0,<2.0.0",
    "libsql>=0.1.11", # todo-db hosted backend (Turso embedded replica)
    "pyyaml>=6.0.0", # todo-db import-yaml + other _project/scripts tools
    "sqlglot>=25.6.0,<31.0.0",
    "todo-db[hosted]",
    "zstandard>=0.20.0",
]

[tool.uv]
# Prevent uv from resolving workspace members from the repo root when
# invoked as `uv run --project _project/scripts`.
managed = true

[tool.uv.sources]
todo-db = { git = "https://github.com/joeharris76/todo-db", tag = "v0.4.0" }
