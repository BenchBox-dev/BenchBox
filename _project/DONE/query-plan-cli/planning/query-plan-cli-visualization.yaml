title: Query Plan CLI & Visualization
worktree: query-plan-cli
category: Core Functionality
priority: High
status: Completed
completed_date: "2025-11-23"
completion_notes: |
  CLI commands and visualization fully implemented and tested.
  - QueryPlanVisualizer class with ASCII tree rendering
  - show-plan command with tree, summary, and JSON formats
  - compare-plans command for single query and batch comparison
  - Threshold filtering for regression detection
  - 15 visualization tests (all passing)
  - Rich terminal output with panels and tables

  Advanced features (multi-platform comparison matrix, interactive mode,
  similarity search) deferred for future implementation. Current implementation
  provides complete visualization and comparison capabilities for end users.
description: 'Implement CLI commands for query plan analysis and ASCII visualization of

  query plans. Includes compare-plans command for cross-platform/cross-run

  comparison, and visualization utilities for rendering plans as ASCII trees

  with side-by-side diffs.


  **CLI Commands**:

  - `benchbox run --capture-plans`: Capture plans during benchmark (already added)

  - `benchbox compare-plans`: Compare plans from different runs/platforms

  - `benchbox show-plan`: Display single plan as ASCII tree

  '
context_sections:
- name: Visualization Approach
  summary: 'ASCII tree rendering using box-drawing characters. Side-by-side diff

    view for comparisons. Highlighting of differences using colors/symbols.

    Support for terminal width auto-detection.

    '
- name: CLI Integration
  summary: 'New compare_plans.py command module. Loads results from JSON, extracts

    plans, invokes comparison engine, displays results. Interactive mode

    for exploring large comparisons.

    '
impact: 'MEDIUM-HIGH - User-facing interface to the feature. Makes query plan analysis

  accessible to end users. Good visualizations critical for usability.

  '
dependencies:
- workstream: Query Plan Core Infrastructure (Models & Storage)
  reason: Requires QueryPlanDAG for rendering
- workstream: Query Plan Platform Adapter Integration
  reason: Requires captured plans to visualize
- workstream: Query Plan Comparison Engine
