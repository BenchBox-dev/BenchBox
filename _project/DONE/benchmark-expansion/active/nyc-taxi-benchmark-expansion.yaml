    status: done
    notes: "Option B (single combined table) is ruled out by anti_pattern: FHV has a\n\
      fundamentally different schema with no fare breakdown.\n\nRemaining options:\n\
      A) Separate tables per type (yellow_trips, green_trips, hvfhv_trips)\n   + Simplest,\
      \ no NULLable columns, each table matches source schema exactly\n   + Existing\
      \ Yellow queries untouched\n   - Cross-type queries need UNION ALL\nC) Common\
      \ core table + type-specific extension tables\n   + Cleaner cross-type queries\
      \ (core table has shared columns)\n   + Normalizes common fields (pickup/dropoff\
      \ time, location IDs)\n   - More complex schema, migration risk for existing Yellow\
      \ data\n\nDeliverable: ADR in notes or context_sections documenting the decision\n\
      and rationale, before any schema code is written.\n"
