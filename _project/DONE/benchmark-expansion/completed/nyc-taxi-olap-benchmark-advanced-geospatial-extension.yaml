title: NYC Taxi OLAP Benchmark (Advanced Geospatial Extension)
worktree: benchmark-expansion
category: '"Technical Debt & Refactoring"'
priority: Medium
status: Completed
completed_date: "2025-12-01"
description: Add advanced geospatial analytics capabilities to the NYC Taxi benchmark using platform-specific spatial functions,
  extending beyond basic lat/long coordinates to full geometric analysis
context_sections:
- name: Context
  summary: SQLGlot does not support geospatial function translation between platforms, requiring database-specific query implementations
    for advanced spatial analysis
impact: Enables comprehensive geospatial analytics benchmarking using real transportation data, provides platform-specific
  spatial performance evaluation, adds advanced geographic analysis capabilities missing from current benchmark suite, supports
  realistic location-based analytics patterns common in modern data applications
implementation_summary: |
  Implemented platform-specific spatial queries in benchbox/core/nyctaxi/spatial.py:

  DuckDB Spatial (10 queries):
  - S1: Distance-Based Top Routes (ST_Distance)
  - S2: Borough Centroid Analysis (ST_Centroid, ST_Collect)
  - S3: Radius Search from Times Square (ST_Distance)
  - S4: Airport Distance Analysis
  - S5: Cross-Borough Trip Distances
  - S6: Zone Spatial Clustering
  - S7: Manhattan Grid Analysis
  - S8: Bounding Box Query
  - S9: Nearest Zone Analysis
  - S10: Trip Direction Analysis

  PostgreSQL/PostGIS (4 queries):
  - S1: Distance-Based Top Routes (geography type)
  - S3: Radius Search (ST_DWithin)
  - S4: Airport Distance Analysis
  - S11: Borough Convex Hull (ST_ConvexHull)

  ClickHouse (4 queries):
  - S1: Distance-Based Top Routes (geoDistance)
  - S3: Radius Search (greatCircleDistance)
  - S12: GeoHash Aggregation (geohashEncode)
  - S13: H3 Index Aggregation (geoToH3)

  Additional features:
  - TAXI_ZONE_CENTROIDS data for key NYC zones
  - check_spatial_support() for platform capability detection
  - get_spatial_create_table_sql() for schema generation
  - 46 unit tests for comprehensive coverage
