      - id: wide_table_column_search\n  category: wide_table\n  description: Search for specific column pattern in wide table\n\
      \  sql: |2\n    SELECT table_name, column_name, data_type\n    FROM information_schema.columns\n    WHERE table_name\
      \ LIKE 'benchbox_wide_%'\n      AND column_name LIKE '%decimal%'\n    ORDER BY table_name, ordinal_position;\n```\n\n\
      **wide_table_type_distribution:**\n```yaml\n- id: wide_table_type_distribution\n  category: wide_table\n  description:\
