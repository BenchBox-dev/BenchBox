  - summary: Add constraint query category
    done: false
    details: "New queries for constraint metadata:\n\n**constraint_list_all:**\n```yaml\n- id: constraint_list_fk\n  category:\
      \ constraint\n  description: List all FK constraints on generated tables\n  sql: |2\n    SELECT\n        tc.table_name,\n\
      \        tc.constraint_name,\n        tc.constraint_type,\n        kcu.column_name\n    FROM information_schema.table_constraints\
      \ tc\n    JOIN information_schema.key_column_usage kcu\n      ON tc.constraint_name = kcu.constraint_name\n    WHERE\
      \ tc.table_name LIKE 'benchbox_fk_%'\n      AND tc.constraint_type = 'FOREIGN KEY'\n    ORDER BY tc.table_name, tc.constraint_name;\n\
      \  skip_on: [bigquery, clickhouse]\n```\n\n**constraint_dependency_graph:**\nPlatform-specific queries for constraint\
      \ dependencies.\n\nTotal: 3-4 new queries for constraint scenarios.\n"
  - summary: Add index metadata queries (where supported)
