      **Example Generated DDL (DuckDB):**\n```sql\nCREATE TABLE benchbox_wide_200_001 (\n    col_int_001 INTEGER,\n    col_int_002\
      \ INTEGER,\n    -- ... 80 integer columns\n    col_varchar_081 VARCHAR(100),\n    -- ... 60 varchar columns\n    col_decimal_141\
