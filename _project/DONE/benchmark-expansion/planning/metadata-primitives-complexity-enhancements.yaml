      \ index\n  description: List indexes on generated tables (ClickHouse)\n  sql: |2\n    SELECT\n        table,\n     \
      \   name,\n        type_full,\n        expr\n    FROM system.data_skipping_indices\n    WHERE table LIKE 'benchbox_%';\n\
      \  skip_on: [duckdb, snowflake, bigquery, databricks]\n```\n\n**PostgreSQL-compatible (DuckDB in some cases):**\n```sql\n\
      SELECT indexname, indexdef\nFROM pg_indexes\nWHERE tablename LIKE 'benchbox_%';\n```\n\nMost cloud warehouses (Snowflake,\
      \ BigQuery, Databricks) don't expose\nindex metadata as they manage indexes automatically. Skip these platforms.\n"
- phase: 'Phase 7: Benchmark Integration'
  items:
  - summary: Update MetadataPrimitivesBenchmark to support complexity config
    done: false
    details: "Extend benchmark class to accept complexity parameters:\n\n```python\nclass MetadataPrimitivesBenchmark(BaseBenchmark):\n\
      \    def __init__(\n        self,\n        scale_factor: float = 1.0,  # Not used, kept for API compat\n        complexity_config:\
      \ MetadataComplexityConfig | None = None,\n        **config\n    ):\n        self.complexity_config = complexity_config\
      \ or MetadataComplexityConfig()\n        self.generator = MetadataGenerator()\n        # ...\n\n    def setup_complexity_test(self,\
      \ connection, dialect: str):\n        \"\"\"Generate test objects based on complexity config.\"\"\"\n        return\
      \ self.generator.setup(\n            connection,\n            dialect,\n            self.complexity_config\n       \
      \ )\n\n    def run_complexity_benchmark(\n        self,\n        connection,\n        dialect: str,\n        categories:\
      \ list[str] | None = None,\n    ) -> MetadataComplexityResult:\n        \"\"\"Run benchmark with generated complexity\
