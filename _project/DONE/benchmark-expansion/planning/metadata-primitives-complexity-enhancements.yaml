- phase: 'Phase 3: Nested View Testing'
  items:
  - summary: Implement view hierarchy generator
    done: false
    details: "Generate chains of views with configurable depth:\n\n**View Chain Structure:**\n```\nbenchbox_view_d1_001 (depth\
      \ 1)\n  └─ SELECT * FROM benchbox_wide_50_001\n\nbenchbox_view_d2_001 (depth 2)\n  └─ SELECT * FROM benchbox_view_d1_001\
      \ WHERE col_int_001 > 0\n\nbenchbox_view_d3_001 (depth 3)\n  └─ SELECT v1.*, v2.col_varchar_081\n     FROM benchbox_view_d2_001\
      \ v1\n     JOIN benchbox_view_d1_002 v2 ON v1.col_int_001 = v2.col_int_001\n```\n\n**Depth Presets:**\n- shallow: 2\
      \ levels\n- medium: 3 levels (typical BI tool)\n- deep: 4 levels (complex marts)\n- extreme: 5 levels (stress test)\n\
      \n**Platform Considerations:**\n- ClickHouse: Skip (no view support in INFORMATION_SCHEMA)\n- BigQuery: Limited view\
      \ nesting may apply\n- All others: Full support expected\n"
  - summary: Add view hierarchy query category
    done: false
    details: "New queries for view dependency analysis:\n\n**view_hierarchy_list:**\n```yaml\n- id: view_hierarchy_list\n\
      \  category: view_hierarchy\n  description: List all generated views with nesting depth\n  sql: |2\n    SELECT table_name\
      \ as view_name, view_definition\n    FROM information_schema.views\n    WHERE table_name LIKE 'benchbox_view_%'\n  \
      \  ORDER BY table_name;\n```\n\n**view_hierarchy_definition_length:**\n```yaml\n- id: view_hierarchy_definition_length\n\
      \  category: view_hierarchy\n  description: Measure view definition complexity by length\n  sql: |2\n    SELECT\n  \
      \      table_name as view_name,\n        LENGTH(view_definition) as definition_length\n    FROM information_schema.views\n\
      \    WHERE table_name LIKE 'benchbox_view_%'\n    ORDER BY definition_length DESC;\n```\n\n**view_hierarchy_dependency_count:**\n\
      Platform-specific queries to count dependencies.\n\n**view_hierarchy_explain:**\n```yaml\n- id: view_hierarchy_explain_deep\n\
      \  category: view_hierarchy\n  description: EXPLAIN query against deepest nested view\n  sql: |2\n    EXPLAIN SELECT\
      \ * FROM benchbox_view_d4_001 LIMIT 10;\n```\n\nTotal: 5-7 new queries for view hierarchy scenarios.\n"
  - summary: Implement view dependency detection (platform-specific)
    done: false
    details: "Platform-specific dependency resolution:\n\n**DuckDB:**\n```sql\n-- No built-in dependency view, parse view_definition\n\
      SELECT view_name, view_definition\nFROM duckdb_views()\nWHERE view_name LIKE 'benchbox_%';\n```\n\n**Snowflake:**\n\
      ```sql\n-- OBJECT_DEPENDENCIES table function\nSELECT * FROM TABLE(GET_OBJECT_REFERENCES(\n    DATABASE_NAME => CURRENT_DATABASE(),\n\
      \    SCHEMA_NAME => CURRENT_SCHEMA()\n));\n```\n\n**PostgreSQL-compatible:**\n```sql\n-- pg_depend + pg_class for dependency\
      \ graph\nSELECT DISTINCT\n    c1.relname as dependent_view,\n    c2.relname as referenced_object\nFROM pg_depend d\n\
      JOIN pg_class c1 ON d.refobjid = c1.oid\nJOIN pg_class c2 ON d.objid = c2.oid\nWHERE c1.relname LIKE 'benchbox_%';\n\
      ```\n"
- phase: 'Phase 4: Complex Type Testing'
  items:
  - summary: Implement complex type generator
    done: false
    details: "Generate tables with STRUCT, ARRAY, MAP columns:\n\n**Type Complexity Levels:**\n\n**basic_complex:**\n```sql\n\
      CREATE TABLE benchbox_complex_basic (\n    id INTEGER,\n    tags ARRAY<VARCHAR>,           -- Simple array\n    metadata\
      \ STRUCT<key VARCHAR, value VARCHAR>  -- Simple struct\n);\n```\n\n**nested_complex:**\n```sql\nCREATE TABLE benchbox_complex_nested\
      \ (\n    id INTEGER,\n    -- Nested array of structs\n    events ARRAY<STRUCT<\n        timestamp TIMESTAMP,\n     \
      \   event_type VARCHAR,\n        properties MAP<VARCHAR, VARCHAR>\n    >>,\n    -- Deeply nested struct\n    user_profile\
      \ STRUCT<\n        name VARCHAR,\n        addresses ARRAY<STRUCT<\n            street VARCHAR,\n            city VARCHAR,\n\
      \            location STRUCT<lat DOUBLE, lng DOUBLE>\n        >>\n    >\n);\n```\n\n**Platform Variants:**\n| Type |\
      \ DuckDB | Snowflake | BigQuery | ClickHouse | Databricks |\n|------|--------|-----------|----------|------------|------------|\n\
      | ARRAY<INT> | ✓ | ✓ | ARRAY<INT64> | Array(Int32) | ARRAY<INT> |\n| STRUCT | ✓ | OBJECT | STRUCT | Tuple | STRUCT |\n\
      | MAP | ✓ | ✗ skip | ✗ skip | Map | ✓ |\n| Nested | ✓ | ✓ | ✓ | ✓ | ✓ |\n"
  - summary: Add complex type query category
    done: false
    details: "New queries for type introspection:\n\n**complex_type_inventory:**\n```yaml\n- id: complex_type_inventory\n\
      \  category: complex_type\n  description: List all columns with complex types\n  sql: |2\n    SELECT\n        table_name,\n\
      \        column_name,\n        data_type\n    FROM information_schema.columns\n    WHERE table_name LIKE 'benchbox_complex_%'\n\
      \      AND (data_type LIKE '%ARRAY%'\n           OR data_type LIKE '%STRUCT%'\n           OR data_type LIKE '%MAP%')\n\
      \    ORDER BY table_name, ordinal_position;\n```\n\n**complex_type_nesting_depth:**\n```yaml\n- id: complex_type_nesting_depth\n\
      \  category: complex_type\n  description: Analyze type nesting complexity\n  sql: |2\n    SELECT\n        table_name,\n\
      \        column_name,\n        data_type,\n        -- Estimate nesting by counting '<' characters\n        LENGTH(data_type)\
      \ - LENGTH(REPLACE(data_type, '<', '')) as nesting_depth\n    FROM information_schema.columns\n    WHERE table_name\
      \ LIKE 'benchbox_complex_%'\n    ORDER BY nesting_depth DESC;\n  variants:\n    duckdb: |2\n      SELECT\n         \
      \ table_name,\n          column_name,\n          data_type,\n          LENGTH(data_type) - LENGTH(REPLACE(data_type,\
      \ '<', '')) as nesting_depth\n      FROM information_schema.columns\n      WHERE table_name LIKE 'benchbox_complex_%'\n\
      \      ORDER BY nesting_depth DESC;\n```\n\n**complex_type_describe:**\nPlatform-specific DESCRIBE variants that show\
      \ nested structure.\n\nTotal: 5-6 new queries for complex type scenarios.\n"
  - summary: Handle platform type representation differences
    done: false
    details: "Different platforms represent complex types differently in metadata:\n\n**Type String Normalization:**\n```python\n\
      def normalize_type_string(type_str: str, dialect: str) -> str:\n    \"\"\"Normalize platform-specific type strings for\
      \ comparison.\"\"\"\n    if dialect == \"clickhouse\":\n        # Array(Int32) -> ARRAY<INT32>\n        type_str = type_str.replace(\"\
      Array(\", \"ARRAY<\").replace(\")\", \">\")\n    elif dialect == \"snowflake\":\n        # OBJECT -> STRUCT (conceptually)\n\
      \        pass  # Keep as-is, note in results\n    return type_str\n```\n\n**Expected Type Representations:**\n| Logical\
      \ Type | DuckDB | Snowflake | BigQuery | ClickHouse |\n|--------------|--------|-----------|----------|------------|\n\
      | Array of int | INTEGER[] | ARRAY | ARRAY<INT64> | Array(Int32) |\n| Struct | STRUCT(...) | OBJECT | STRUCT<...> |\
      \ Tuple(...) |\n| Map | MAP(K,V) | N/A | N/A | Map(K,V) |\n"
- phase: 'Phase 5: Large Catalog Testing'
  items:
  - summary: Implement catalog scale generator
    done: false
    details: "Generate many tables to test catalog scanning:\n\n**Catalog Size Presets:**\n- small: 10 tables (baseline)\n\
      - medium: 50 tables\n- large: 100 tables\n- xlarge: 500 tables (stress test)\n\n**Table Generation Strategy:**\n```python\n\
      def generate_catalog(size: int, connection, dialect: str):\n    \"\"\"Generate N tables with varied characteristics.\"\
      \"\"\n    tables = []\n    for i in range(size):\n        # Vary table characteristics\n        if i % 3 == 0:\n   \
      \         width = 10  # Narrow table\n        elif i % 3 == 1:\n            width = 30  # Medium table\n        else:\n\
      \            width = 50  # Wider table\n\n        table_name = f\"benchbox_catalog_{i:04d}\"\n        create_table(connection,\
      \ table_name, width, dialect)\n        tables.append(table_name)\n    return tables\n```\n\n**Optional Schema Variation:**\n\
      - Create tables across multiple schemas\n- Test cross-schema metadata queries\n"
  - summary: Add large catalog query category
    done: false
    details: "New queries for catalog scanning at scale:\n\n**large_catalog_list_all:**\n```yaml\n- id: large_catalog_list_all\n\
      \  category: large_catalog\n  description: List all generated tables\n  sql: |2\n    SELECT table_schema, table_name,\
      \ table_type\n    FROM information_schema.tables\n    WHERE table_name LIKE 'benchbox_catalog_%'\n    ORDER BY table_name;\n\
      ```\n\n**large_catalog_count:**\n```yaml\n- id: large_catalog_count\n  category: large_catalog\n  description: Count\
      \ generated tables\n  sql: |2\n    SELECT COUNT(*) as table_count\n    FROM information_schema.tables\n    WHERE table_name\
      \ LIKE 'benchbox_catalog_%';\n```\n\n**large_catalog_search:**\n```yaml\n- id: large_catalog_search\n  category: large_catalog\n\
      \  description: Search for tables by pattern\n  sql: |2\n    SELECT table_name\n    FROM information_schema.tables\n\
      \    WHERE table_name LIKE 'benchbox_catalog_00%'\n    ORDER BY table_name;\n```\n\n**large_catalog_column_total:**\n\
      ```yaml\n- id: large_catalog_column_total\n  category: large_catalog\n  description: Count total columns across all\
      \ generated tables\n  sql: |2\n    SELECT\n        COUNT(*) as total_columns,\n        COUNT(DISTINCT table_name) as\
      \ table_count\n    FROM information_schema.columns\n    WHERE table_name LIKE 'benchbox_catalog_%';\n```\n\nTotal: 5-6\
      \ new queries for large catalog scenarios.\n"
  - summary: Add catalog cleanup and management utilities
    done: false
    details: "Utilities for managing large generated catalogs:\n\n**Batch Cleanup:**\n```python\ndef cleanup_catalog(connection,\
      \ dialect: str, prefix: str = \"benchbox_\"):\n    \"\"\"Remove all generated objects with prefix.\"\"\"\n    # Get\
      \ list of objects\n    tables = get_tables_with_prefix(connection, prefix)\n    views = get_views_with_prefix(connection,\
      \ prefix)\n\n    # Drop in correct order\n    for view in views:\n        execute(connection, f\"DROP VIEW IF EXISTS\
      \ {view}\")\n    for table in tables:\n        execute(connection, f\"DROP TABLE IF EXISTS {table}\")\n```\n\n**Stale\
      \ Object Detection:**\n- Detect benchbox_ objects from previous runs\n- Provide CLI command for cleanup: `benchbox cleanup-metadata-test-objects`\n"
- phase: 'Phase 6: Constraint and Index Metadata'
  items:
  - summary: Implement constraint generator
    done: false
    details: "Generate tables with FK relationships:\n\n**Constraint Density Levels:**\n\n**sparse:** Few FK relationships\n\
      ```sql\nCREATE TABLE benchbox_fk_parent (id INTEGER PRIMARY KEY);\nCREATE TABLE benchbox_fk_child (\n    id INTEGER\
      \ PRIMARY KEY,\n    parent_id INTEGER REFERENCES benchbox_fk_parent(id)\n);\n```\n\n**dense:** Many FK relationships\
      \ (graph structure)\n```sql\n-- Generate 10 tables with interconnected FKs\n-- Each table references 2-3 others\n--\
      \ Tests dependency resolution performance\n```\n\n**Platform Constraints:**\n- BigQuery: No FK constraints, skip\n-\
      \ ClickHouse: No FK constraints, skip\n- Snowflake: FK supported but not enforced\n- DuckDB: Full FK support\n- Databricks:\
