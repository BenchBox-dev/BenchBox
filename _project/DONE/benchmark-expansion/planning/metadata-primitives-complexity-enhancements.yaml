id: metadata-primitives-complexity-enhancements
title: Metadata Primitives Complexity Enhancements
worktree: benchmark-expansion
category: Benchmark Development
priority: High
status: Completed
description: 'Enhance the Metadata Primitives benchmark to stress-test metadata operations with

  complex catalog scenarios that reflect real-world data warehouse characteristics.


  The current implementation tests basic INFORMATION_SCHEMA queries against simple

  schemas (TPC-H with 8 tables, ~60 columns total). Real production data warehouses

  have significantly more complex metadata:


  - Wide tables (100-1000+ columns) common in analytics/ML feature stores

  - Nested view hierarchies (3-4+ levels) from BI tools like Looker, dbt, Tableau

  - Complex data types (STRUCT, ARRAY, MAP, JSON) in modern data platforms

  - Large catalogs (100s-1000s of tables) in multi-tenant environments

  - Deep constraint/FK graphs in normalized operational databases


  These complexity factors cause 5-100x slower metadata operations that are not

  captured by the current benchmark. This enhancement adds a MetadataGenerator

  component and new query categories to measure these performance characteristics.

  '
context_sections:
- name: Current State Analysis
  summary: '**Current Test Schema:**

    - 3 tables (customers, orders, products) created in DuckDB fixture

    - ~14 columns total across all tables

    - 1 simple view (active_orders)

    - Only scalar data types (INTEGER, VARCHAR, DECIMAL, DATE)


    **Current Query Categories:**

    - schema: 10 queries (list databases, schemas, tables, views)

    - column: 8 queries (column metadata, types, constraints)

    - stats: 6 queries (row counts, sizes, storage info)

    - query: 4 queries (EXPLAIN plans, constraints)


    **Complexity Factors NOT Tested:**

    | Factor | Current | Real-World | Impact |

    |--------|---------|------------|--------|

    | Columns per table | 4-5 | 100-500+ | 10-50x slower scans |

    | Total columns | ~14 | 1000s | Memory/cache pressure |

    | View nesting depth | 1 | 3-4+ | Recursive resolution |

    | Complex types | 0 | 20-50% | Type parsing overhead |

    | Tables per catalog | 3 | 100-1000s | Catalog scan time |

    | FK relationships | 0 | Dense graphs | Dependency traversal |

    '
- name: Platform Complexity Support Matrix
  summary: '| Feature | DuckDB | Snowflake | BigQuery | ClickHouse | Databricks |

    |---------|--------|-----------|----------|------------|------------|

    | Wide tables (500+ cols) | ✓ | ✓ | ✓ | ✓ | ✓ |

    | Nested views (4+ deep) | ✓ | ✓ | Limited | ✗ | ✓ |

    | STRUCT type | ✓ | OBJECT | ✓ | Tuple | ✓ |

    | ARRAY type | ✓ | ✓ | ✓ | Array(T) | ✓ |

    | MAP type | ✓ | ✗ | ✗ | Map(K,V) | ✓ |

    | JSON/VARIANT | ✓ | VARIANT | JSON | String | STRING |

    | Nested types depth | ✓ | ✓ | ✓ | ✓ | ✓ |

    | Partition metadata | Limited | ✓ | ✓ | ✓ | ✓ |

    | FK constraints | ✓ | ✓ | ✗ | ✗ | ✓ |

    | Index metadata | Limited | ✗ | ✗ | ✓ | ✗ |

    '
- name: Architecture Design
  summary: "**New Components:**\n\n1. **MetadataGenerator** - Creates complex metadata structures\n   - Configurable via complexity\
    \ parameters (not scale_factor)\n   - Platform-specific DDL generation\n   - Cleanup/teardown support for test isolation\n\
    \n2. **Complexity Configuration** - Parameters controlling test scenarios\n   - width_factor: columns per wide table (100,\
    \ 200, 500, 1000)\n   - view_depth: max view nesting level (2, 3, 4, 5)\n   - type_complexity: scalar_only | basic_complex\
    \ | deeply_nested\n   - catalog_size: tables per catalog (10, 50, 100, 500)\n   - constraint_density: none | sparse |\
    \ dense\n\n3. **New Query Categories:**\n   - wide_table: Queries against wide table scenarios\n   - view_hierarchy: Nested\
    \ view queries and dependency resolution\n   - complex_type: Type introspection for STRUCT/ARRAY/MAP\n   - large_catalog:\
    \ Catalog scanning at scale\n   - constraint_graph: FK and dependency queries\n\n**Integration Pattern:**\n- Generator\
    \ creates test objects before benchmark execution\n- Queries reference generated objects via naming conventions\n- Cleanup\
    \ removes generated objects after execution\n- Results include complexity parameters in metadata\n"
- name: Performance Impact Hypotheses
  summary: '**Wide Tables (column_list_all query):**

    | Width | Expected Time | Scaling Factor |

    |-------|---------------|----------------|

    | 50 (baseline) | ~5ms | 1x |

    | 200 columns | ~20-50ms | 4-10x |

    | 500 columns | ~50-150ms | 10-30x |

    | 1000 columns | ~100-500ms | 20-100x |


    **View Nesting (view definition retrieval):**

    | Depth | Expected Time | Notes |

    |-------|---------------|-------|

    | 1 level | ~2ms | Current baseline |

    | 3 levels | ~10-20ms | Each level adds parsing |

    | 5 levels | ~30-100ms | May hit recursion limits |


    **Large Catalogs (schema_list_tables):**

    | Tables | Expected Time | Notes |

    |--------|---------------|-------|

    | 10 (baseline) | ~3ms | Current state |

    | 100 tables | ~10-30ms | Linear scan |

    | 500 tables | ~50-200ms | Memory pressure |

    | 1000 tables | ~100-500ms | Cache effects |


    These hypotheses will be validated by the benchmark implementation.

    '
tasks:
- phase: 'Phase 1: Generator Infrastructure'
  items:
  - summary: Design MetadataGenerator base class and configuration
    done: false
    details: "Create the foundation for generating complex metadata structures:\n\n**MetadataComplexityConfig dataclass:**\n\
      ```python\n@dataclass\nclass MetadataComplexityConfig:\n    width_factor: int = 50          # Columns in wide tables\n\
      \    view_depth: int = 1             # Max view nesting\n    type_complexity: str = \"scalar\" # scalar | basic | nested\n\
      \    catalog_size: int = 10          # Tables to generate\n    constraint_density: str = \"none\" # none | sparse |\
      \ dense\n    schema_count: int = 1           # Number of schemas\n```\n\n**MetadataGenerator interface:**\n- setup(connection,\
      \ dialect, config) -> GeneratedMetadata\n- teardown(connection, dialect, generated_metadata)\n- get_generated_object_names()\
      \ -> dict[str, list[str]]\n\nLocation: benchbox/core/metadata_primitives/generator.py\n"
  - summary: Implement platform-agnostic DDL generation
    done: false
    details: 'Create SQL generation utilities that work across platforms:


      **DDL Templates:**

      - CREATE TABLE with N columns (type variations)

      - CREATE VIEW with parameterized source

      - CREATE SCHEMA (where supported)


      **Type Mapping:**

      | Logical Type | DuckDB | Snowflake | BigQuery | ClickHouse |

      |--------------|--------|-----------|----------|------------|

      | wide_int | INTEGER | INTEGER | INT64 | Int32 |

      | wide_varchar | VARCHAR | VARCHAR | STRING | String |

      | wide_decimal | DECIMAL(10,2) | NUMBER(10,2) | NUMERIC | Decimal(10,2) |

      | wide_date | DATE | DATE | DATE | Date |

      | wide_timestamp | TIMESTAMP | TIMESTAMP | TIMESTAMP | DateTime |


      **Naming Convention:**

      - Wide tables: benchbox_wide_{width}_{index}

      - Views: benchbox_view_d{depth}_{index}

      - Schemas: benchbox_schema_{index}


      Location: benchbox/core/metadata_primitives/ddl.py

