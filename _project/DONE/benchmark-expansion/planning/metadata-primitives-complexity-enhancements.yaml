      - Or use schemas for isolation where supported\n- Provide \"cleanup_all\" to remove stale test objects\n\n**Implementation:**\n\
      ```python\nclass GeneratedMetadata:\n    tables: list[str]\n    views: list[str]\n    schemas: list[str]\n    types:\
