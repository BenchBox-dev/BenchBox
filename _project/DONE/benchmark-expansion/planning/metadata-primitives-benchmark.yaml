id: metadata-primitives-benchmark
title: Metadata Primitives Benchmark - INFORMATION_SCHEMA, SHOW, DESCRIBE
worktree: benchmark-expansion
category: Benchmark Development
priority: Medium
status: Completed
description: 'Create a new Metadata Primitives benchmark to test cross-platform catalog/schema

  introspection performance. This benchmark tests INFORMATION_SCHEMA views, SHOW commands,

  and DESCRIBE operations that are essential for data discovery and tooling integration.


  Unlike Read/Write/Transaction primitives that test data operations, this benchmark

  focuses on metadata operations that are critical for:

  - Data catalog integration

  - Schema discovery tools

  - IDE autocomplete performance

  - BI tool connectivity

  - Data governance workflows

  '
context_sections:
- name: Platform Support Matrix
  summary: '| Feature | Snowflake | DuckDB | BigQuery | Databricks | ClickHouse |

    |---------|-----------|--------|----------|------------|------------|

    | INFORMATION_SCHEMA.TABLES | ✅ | ✅ | ✅ | ✅ | ✅ |

    | INFORMATION_SCHEMA.COLUMNS | ✅ | ✅ | ✅ | ✅ | ✅ |

    | INFORMATION_SCHEMA.SCHEMATA | ✅ | ✅ | ✅ | ✅ | ✅ (system.databases) |

    | INFORMATION_SCHEMA.VIEWS | ✅ | ✅ | ✅ | ✅ | ❌ |

    | INFORMATION_SCHEMA.ROUTINES | ✅ | ❌ | ✅ | ✅ | ❌ |

    | SHOW TABLES | ✅ | ✅ | ❌ | ✅ | ✅ |

    | SHOW DATABASES | ✅ | ✅ | ❌ | ✅ | ✅ |

    | SHOW COLUMNS | ✅ | ✅ | ❌ | ✅ | ✅ (DESCRIBE) |

    | DESCRIBE TABLE | ✅ | ✅ | ❌ | ✅ | ✅ |

    | Query History/Logs | ✅ | ❌ | ✅ | ✅ | ✅ |

    | Table Statistics | ✅ | ✅ | ✅ | ✅ | ✅ |

    '
- name: Benchmark Categories
  summary: '1. **Schema Discovery** - Listing databases, schemas, tables

    2. **Column Introspection** - Column metadata, types, constraints

    3. **Table Statistics** - Row counts, size estimates, cardinality

    4. **View/Routine Discovery** - View definitions, function signatures

    5. **Query Introspection** - Query history, execution plans (where available)

    6. **Access Control Metadata** - Grants, privileges (where available)

    '
- name: Design Considerations
  summary: "- Unlike Read Primitives which use TPC-H tables, Metadata Primitives should work\n  with ANY existing schema (self-referential\
    \ - can query its own metadata)\n- Results are non-deterministic (platform-specific column names, metadata formats)\n\
    - Focus on response time, not result correctness validation\n- Some commands (SHOW) return non-standard result formats\n\
    - Need to handle platform differences in metadata column naming\n"
tasks:
- phase: 'Phase 1: Architecture Design'
  items:
  - summary: Design metadata primitives benchmark architecture
    done: false
    details: '- Define MetadataQuery dataclass (similar to PrimitiveQuery)

      - Determine if SHOW commands need special handling vs SQL queries

      - Design result capture for non-standard outputs (SHOW returns vary by platform)

      - Define categories: schema, column, table_stats, view, routine, access_control

      '
  - summary: Create catalog YAML schema for metadata queries
    done: false
    details: '- id, category, sql fields (reuse pattern from Read Primitives)

      - variants dict for platform-specific SQL

      - skip_on list for unsupported platforms

      - result_type field: "rows" | "describe" | "show" (for special handling)

      - validation mode: none (just measure execution time)

      '
- phase: 'Phase 2: Core Implementation'
  items:
  - summary: Create benchbox/core/metadata_primitives/ module structure
    done: false
    details: '- __init__.py

      - catalog/__init__.py

      - catalog/loader.py (MetadataCatalogLoader)

      - catalog/queries.yaml (metadata query definitions)

      - benchmark.py (MetadataPrimitivesBenchmark class)

      - generator.py (if needed for setup - may be minimal)

      '
  - summary: Implement MetadataCatalog loader
    done: false
    details: '- Reuse pattern from read_primitives/catalog/loader.py

      - Handle result_type field for special command handling

      - Validate SQL syntax is compatible with expected result format

      '
  - summary: Implement MetadataPrimitivesBenchmark class
    done: false
    details: '- Inherit from BaseBenchmark pattern

      - Execute queries and capture timing

      - Handle SHOW/DESCRIBE commands that may return non-tabular results

      - No result validation (metadata varies by platform)

      '
- phase: 'Phase 3: Query Catalog Development'
  items:
  - summary: Implement Schema Discovery queries (10+ queries)
    done: false
    details: '- schema_list_databases: SHOW DATABASES / INFORMATION_SCHEMA.SCHEMATA

      - schema_list_schemas: SHOW SCHEMAS / INFORMATION_SCHEMA.SCHEMATA

      - schema_list_tables: SHOW TABLES / INFORMATION_SCHEMA.TABLES

      - schema_list_tables_with_filter: SHOW TABLES LIKE ''%customer%''

      - schema_table_count: SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES

      - schema_list_views: SHOW VIEWS / INFORMATION_SCHEMA.VIEWS

      - schema_list_functions: SHOW FUNCTIONS / INFORMATION_SCHEMA.ROUTINES

      - schema_search_tables: Full-text search in table names

      - schema_catalog_size: Database/schema size estimation

      - schema_object_types: Count by object type (table, view, function)

      '
  - summary: Implement Column Introspection queries (8+ queries)
    done: false
    details: '- column_describe_table: DESCRIBE TABLE / SHOW COLUMNS

      - column_list_all: INFORMATION_SCHEMA.COLUMNS for specific table

      - column_list_with_types: Column names + data types

      - column_list_nullable: Columns with NULL allowed

      - column_primary_keys: Primary key columns (where available)

      - column_foreign_keys: Foreign key relationships

      - column_search: Search for columns by name pattern

      - column_data_type_distribution: Count columns by data type

      '
  - summary: Implement Table Statistics queries (6+ queries)
    done: false
    details: '- stats_row_count: Table row count estimation

      - stats_table_size: Table size in bytes

      - stats_column_cardinality: Distinct value estimates

      - stats_null_percentage: NULL ratio per column

      - stats_storage_info: Storage format, compression info

      - stats_partition_info: Partition metadata (where applicable)

      '
  - summary: Implement Query Introspection queries (4+ queries)
    done: false
    details: '- query_explain_plan: EXPLAIN for sample query

      - query_analyze_plan: EXPLAIN ANALYZE where supported

      - query_history_recent: Recent query history (Snowflake, BigQuery)

      - query_execution_stats: Query performance metrics

      Note: Many platforms require special permissions for query history

      '
- phase: 'Phase 4: Platform Variants'
  items:
  - summary: Add Snowflake-specific variants
    done: false
    details: '- SHOW commands are fully supported

      - ACCOUNT_USAGE schema for query history

      - TABLE_STORAGE_METRICS view

      - INFORMATION_SCHEMA.OBJECT_PRIVILEGES for access control

      '
  - summary: Add DuckDB-specific variants
    done: false
    details: '- PRAGMA commands for some operations

      - duckdb_tables(), duckdb_columns() functions

      - SUMMARIZE command for statistics

      - Limited SHOW command support

      '
  - summary: Add BigQuery-specific variants
    done: false
    details: '- No SHOW commands - use INFORMATION_SCHEMA only

      - INFORMATION_SCHEMA.JOBS for query history

      - INFORMATION_SCHEMA.TABLE_STORAGE for size

      - Requires project.dataset prefix

      '
  - summary: Add ClickHouse-specific variants
    done: false
    details: '- system.tables, system.columns, system.databases

      - DESCRIBE TABLE syntax

      - system.query_log for query history

      - MergeTree-specific statistics

      '
  - summary: Add Databricks-specific variants
    done: false
    details: '- Unity Catalog INFORMATION_SCHEMA

      - DESCRIBE commands fully supported

      - SHOW commands for various object types

      - system.information_schema schema

      '
- phase: 'Phase 5: Testing and Documentation'
  items:
  - summary: Create unit tests for metadata catalog loader
    done: false
    details: '- Test YAML parsing

      - Test variant resolution

      - Test skip_on filtering

      - Test invalid catalog handling

      '
  - summary: Create integration tests with DuckDB
    done: false
    details: '- Execute all queries against DuckDB

      - Verify timing capture works

      - Test with various schema sizes

      '
  - summary: Add benchmark to CLI and runner
    done: false
    details: '- Register metadata-primitives benchmark

      - Add to benchbox run --benchmark metadata-primitives

      - Add appropriate phases (power only - no throughput needed)

      '
  - summary: Document metadata primitives benchmark
    done: false
    details: '- Add to docs/benchmarks/

      - Document platform-specific limitations

      - Provide guidance on interpreting results

      '
