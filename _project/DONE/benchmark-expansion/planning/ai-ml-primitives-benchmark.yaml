    done: false
    details: "- ai_complete_simple: Basic text completion with short prompt\n- ai_complete_context: Completion with TPC-H\
      \ data context\n- ai_question_answer: Answer question about data\n- ai_sql_generation: Generate SQL from natural language\n\
      \nExample (Snowflake):\n```sql\nSELECT\n    c_custkey,\n    SNOWFLAKE.CORTEX.COMPLETE(\n        'llama3-8b',\n     \
      \   'Summarize this customer profile: ' || c_comment\n    ) as profile_summary\nFROM customer\nWHERE c_nationkey = 1\n\
      LIMIT 10;\n```\n"
  - summary: Implement NLP Analysis queries (5+ queries)
    done: false
    details: "- ai_sentiment_single: Sentiment of single text\n- ai_sentiment_batch: Sentiment of multiple rows\n- ai_classify_priority:\
      \ Classify order priority from comments\n- ai_classify_segment: Classify customer segment\n- ai_entity_extraction: Extract\
      \ entities from part descriptions\n\nExample (Snowflake):\n```sql\nSELECT\n    c_custkey,\n    c_comment,\n    SNOWFLAKE.CORTEX.SENTIMENT(c_comment)\
      \ as sentiment_score\nFROM customer\nWHERE c_mktsegment = 'BUILDING'\nLIMIT 100;\n```\n"
  - summary: Implement Text Transformation queries (4+ queries)
    done: false
    details: "- ai_summarize_short: Summarize short text\n- ai_summarize_long: Summarize longer text (part descriptions)\n\
      - ai_translate_comment: Translate customer comment\n- ai_grammar_fix: Fix grammar in comments (Databricks)\n\nExample\
      \ (Snowflake):\n```sql\nSELECT\n    p_partkey,\n    p_comment,\n    SNOWFLAKE.CORTEX.SUMMARIZE(p_comment) as summary\n\
      FROM part\nWHERE LENGTH(p_comment) > 100\nLIMIT 50;\n```\n"
  - summary: Implement Embedding Generation queries (3+ queries)
    done: false
