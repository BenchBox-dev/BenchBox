id: ai-ml-primitives-benchmark
title: AI/ML Primitives Benchmark - SQL-Based AI Functions
worktree: benchmark-expansion
category: Benchmark Development
priority: Medium-High
status: Completed
description: 'Create a new AI/ML Primitives benchmark to test cross-platform SQL-based AI/ML

  functions. This benchmark covers built-in AI functions that execute within the

  data warehouse, NOT external ML frameworks or vector search (covered separately).


  Focus areas:

  - LLM/Generative AI functions (Snowflake Cortex, BigQuery ML, Databricks AI)

  - Sentiment analysis, text classification, summarization

  - Entity extraction, translation

  - SQL-invokable ML predictions (not model training)


  This differs from the existing Vector Search benchmark which focuses on

  embedding storage and similarity search. This benchmark tests AI function

  invocation performance and output quality consistency.

  '
context_sections:
- name: Platform Support Matrix
  summary: '| Feature | Snowflake | BigQuery | Databricks | ClickHouse |

    |---------|-----------|----------|------------|------------|

    | **Text Generation** | ✅ COMPLETE() | ✅ ML.GENERATE_TEXT | ✅ ai_query() | ❌ |

    | **Summarization** | ✅ SUMMARIZE() | ✅ ML.GENERATE_TEXT | ✅ ai_summarize() | ❌ |

    | **Sentiment Analysis** | ✅ SENTIMENT() | ✅ ML.UNDERSTAND_TEXT | ✅ ai_analyze_sentiment() | ❌ |

    | **Translation** | ✅ TRANSLATE() | ✅ ML.TRANSLATE | ✅ ai_translate() | ❌ |

    | **Entity Extraction** | ✅ EXTRACT_ANSWER() | ✅ ML.UNDERSTAND_TEXT | ✅ ai_extract() | ❌ |

    | **Classification** | ✅ CLASSIFY_TEXT() | ✅ ML.PREDICT | ✅ ai_classify() | ❌ |

    | **Embedding Generation** | ✅ EMBED_TEXT_768() | ✅ ML.GENERATE_EMBEDDING | ✅ ai_embed() | ❌ |

    | **SQL-based Prediction** | ✅ ML functions | ✅ ML.PREDICT | ✅ MLflow | ❌ |


    Note: DuckDB has no built-in AI functions (requires external extensions)

    Note: ClickHouse has no built-in AI functions

    '
- name: Function Categories
  summary: '1. **Generative AI** - Text completion, question answering

    2. **NLP Analysis** - Sentiment, entity extraction, classification

    3. **Text Transformation** - Summarization, translation

    4. **Embedding Generation** - Vector embeddings for text

    5. **ML Prediction** - Invoking pre-trained models via SQL

    '
- name: Design Considerations
  summary: '- **Cost Awareness**: AI functions often have per-token or per-call costs

    - **Rate Limiting**: Platforms may throttle AI function calls

    - **Non-Determinism**: LLM outputs vary; cannot validate exact results

    - **Latency Focus**: Measure response time, not output correctness

    - **Batch vs Single**: Test both single-row and batch processing

    - **Model Selection**: Some platforms allow model choice (gpt-4, claude, etc.)

    - **DRY RUN mode**: Critical - must support cost estimation without execution

    '
- name: Snowflake Cortex Functions
  summary: 'Available functions (as of 2025):

    - SNOWFLAKE.CORTEX.COMPLETE(model, prompt) - Text generation

    - SNOWFLAKE.CORTEX.SUMMARIZE(text) - Text summarization

    - SNOWFLAKE.CORTEX.SENTIMENT(text) - Sentiment score (-1 to 1)

    - SNOWFLAKE.CORTEX.TRANSLATE(text, from_lang, to_lang) - Translation

    - SNOWFLAKE.CORTEX.EXTRACT_ANSWER(text, question) - Q&A extraction

    - SNOWFLAKE.CORTEX.CLASSIFY_TEXT(text, categories) - Classification

    - SNOWFLAKE.CORTEX.EMBED_TEXT_768(text) - 768-dim embeddings

    - SNOWFLAKE.CORTEX.EMBED_TEXT_1024(text) - 1024-dim embeddings


    Models: snowflake-arctic, llama3-8b, llama3-70b, mistral-large, etc.

    '
- name: BigQuery ML Functions
  summary: 'Available functions:

    - ML.GENERATE_TEXT(model, prompt_col) - Using Vertex AI models

    - ML.UNDERSTAND_TEXT(model, text_col, [''sentiment'', ''entities'']) - NLU

    - ML.TRANSLATE(model, text_col, target_lang) - Translation

    - ML.GENERATE_EMBEDDING(model, text_col) - Embeddings

    - ML.PREDICT(model, input_table) - General prediction


    Requires: Connection to Vertex AI, model deployment

    Models: gemini-pro, palm-2, text-bison, etc.

    '
- name: Databricks AI Functions
  summary: 'Available functions (Unity Catalog AI Functions):

    - ai_query(endpoint, prompt) - General AI endpoint query

    - ai_summarize(text) - Summarization

    - ai_analyze_sentiment(text) - Sentiment analysis

    - ai_translate(text, target_lang) - Translation

    - ai_extract(text, labels) - Entity extraction

    - ai_classify(text, labels) - Classification

    - ai_fix_grammar(text) - Grammar correction

    - ai_generate(prompt) - Text generation


    Requires: Foundation Model APIs or external model serving

    '
