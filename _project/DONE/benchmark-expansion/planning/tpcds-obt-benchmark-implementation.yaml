id: tpcds-obt-benchmark-implementation
title: Add TPC-DS-OBT (One Big Table) Benchmark Implementation
worktree: benchmark-expansion
category: Core Functionality
priority: Medium
status: Completed
description: 'Implement a TPC-DS-OBT benchmark that collapses all TPC-DS sales + returns + needed attributes into ONE truly
  wide table. The benchmark must output only one table (e.g., `tpcds_sales_returns_obt`) that merges store/web/catalog sales
  and returns, embeds any dimension attributes inline, and is the sole table referenced by the adapted queries. No auxiliary
  dimension tables are part of the benchmark.

  '
context_sections:
- name: OBT Pattern Background
  summary: 'One Big Table (OBT) is a data modeling pattern popularized by analytics engineering teams using tools like dbt,
    Looker, and modern BI platforms. Instead of normalized star/snowflake schemas requiring many JOINs, OBT pre-joins fact
    and dimension tables into a SINGLE wide table optimized for analytical queries. This benchmark enables performance comparison
    between traditional TPC-DS star schema and OBT approaches.

    '
- name: Naming Decision
  summary: 'Chose "TPC-DS-OBT" over "TPC-DS-Denorm" because OBT is more specific and recognized in the analytics engineering
    community. "Denorm" is generic (many types exist), while "OBT" precisely identifies the pattern. This aligns with dbt/Looker
    terminology.

    '
- name: Single Table Architecture (Critical)
  summary: 'Produces exactly ONE table `tpcds_sales_returns_obt` with all channels unified. The table UNIONs store_sales/web_sales/catalog_sales
    into a canonical column set, LEFT JOINs the corresponding returns tables inline, and optionally inlines dimension attributes
    as columns (no separate dimension tables shipped or queried). A `channel` discriminator enables filtering, and return
    metadata lives in the same row as the sale. Sparsity is acceptable; width is expected to be very wide to keep everything
    in a single relation.

    '
- name: Precedent in Codebase
  summary: 'Follows the Data Vault benchmark pattern already implemented in benchbox/core/datavault/. Uses same architecture:
    ETL transformation via DuckDB, declarative schema definitions, query adaptation from base TPC benchmark. Key files to
    reference: datavault/schema.py (schema pattern), datavault/etl/transformer.py (ETL pattern).

    '
impact: 'Adds OBT modeling support to BenchBox, enables evaluation of platform performance with wide-table scan patterns vs
  multi-join star schema patterns, provides comparative analysis for data teams choosing between modeling approaches, supports
  modern analytics engineering workflows.

  '
tasks:
- phase: Schema Design and Single Table Model
  done: false
  items:
  - summary: Confirm benchmark naming and registry id
    details: 'Keep "TPC-DS-OBT" (vs "TPC-DS-Denorm") for clarity about the single-table goal. Ensure CLI/registry identifiers
      reflect the chosen name (e.g., tpcds-obt).

      '
  - summary: Create `benchbox/core/tpcds_obt/` directory structure
    details: 'Mirror existing benchmark layout: __init__.py, schema.py, etl/, benchmark.py, queries.py, manifest templates.

      '
  - summary: Design unified `tpcds_sales_returns_obt` schema (~400-520 columns)
    details: 'Define one canonical column set covering store/web/catalog sales facts, returns facts, and any inlined dimension
      attributes needed to preserve TPC-DS query semantics. Include channel discriminator, bill/ship customer variants, return
      metadata, and consistent data type choices. Allow column groups to be toggled (full vs minimal) without ever emitting
      extra tables.

      '
  - summary: Implement schema.py with single-table definition
    details: 'Use Column/Table pattern from tpcds/schema/models.py. Provide column metadata for source tracking, prefix strategy
      for channel-specific attributes, and column ordering that keeps sales/returns fields grouped.

      '
  - summary: Document column mapping from TPC-DS sources
    details: 'Publish mapping of each OBT column to its source fact/return/dimension column and derivations. Include how nullability
      works for non-returned rows and non-applicable channels.

      '
  - summary: Add schema unit tests
    details: 'In tests/unit/core/tpcds_obt/test_schema.py verify single-table presence, column count per mode, data types,
      and DDL generation for supported platforms.

      '
- phase: ETL Transformer Implementation
  done: false
  items:
  - summary: Implement `etl/transformer.py` for single-table output
    details: 'Follow DataVaultETLTransformer style but emit only `tpcds_sales_returns_obt`. Use DuckDB to load TPC-DS .dat
      sources, normalize column names, and stage channel partitions before a UNION ALL into the unified schema.

      '
  - summary: Build per-channel transformation SQL feeding the unified schema
    details: 'For store/web/catalog, join sales to required dimensions inline (no dimension tables emitted), LEFT JOIN returns,
      and alias into the canonical column set. Ensure return columns are always present with NULL defaults when absent.

      '
  - summary: Add width management options without extra tables
    details: 'Support ''full'' vs ''minimal'' column groups by projecting subsets in the final SELECT. Keep output as one
      table regardless of width.

      '
  - summary: Generate manifest for the single OBT output
    details: 'Capture row counts by channel, return counts, column count, file sizes, and source scale factor. Reuse manifest
      conventions from other benchmarks.

      '
  - summary: Add ETL unit tests
    details: 'In tests/unit/core/tpcds_obt/test_etl.py mock DuckDB to verify SQL generation, column alignment across channels,
      and correct handling of missing returns.

      '
  - summary: Add integration test for end-to-end transformation
    details: 'In tests/integration/test_tpcds_obt_benchmark.py run SF=1 generation + transform and assert row counts equal
      combined sales facts, with return columns NULL where appropriate.

      '
- phase: Query Adaptation
  done: false
  items:
  - summary: Classify all 99 TPC-DS queries for single-table suitability
    details: 'Tag queries as directly portable, needs rewrite, or excluded (inventory-heavy). Document coverage and any semantic
      compromises in _project/notes.

      '
  - summary: Adapt channel-specific queries to `tpcds_sales_returns_obt`
    details: 'Remove joins to fact/dimension tables, replace with inline columns, and filter on `channel`. Preserve parameters
      and result semantics.

      '
  - summary: Adapt cross-channel queries on the single table
    details: 'Replace explicit UNIONs with channel-aware predicates/aggregations on the single table. Ensure return-inclusive
      metrics stay correct.

      '
  - summary: Implement TPCDSOBTQueryManager
    details: 'Manage loading, parameterization, and SQLGlot translation for the new query set. Track which columns depend
      on full vs minimal column groups.

      '
  - summary: Add query validation tests
    details: 'Validate SQL parsing, ensure placeholders remain, and compare row counts or sample results to baseline TPC-DS
      where logically equivalent.

      '
- phase: Benchmark Class Implementation
  done: false
  items:
  - summary: Create TPCDSOBTBenchmark core class
    details: 'In benchbox/core/tpcds_obt/benchmark.py inherit from BaseBenchmark. Wire generate_data() to TPC-DS generator
      + OBT transformer and expose the single-table dataset for loading and querying.

      '
  - summary: Implement single-table data loading
    details: '_load_data() should create the wide table on target platforms with appropriate DDL, handle column count limits,
      and load from the generated .dat/.parquet output.

      '
  - summary: Add benchmark configuration options
    details: 'Support dimension_mode (''full''|''minimal''), allowed_channels filter (still stored in one table), and toggle
      for including return-derived metrics. Ensure no option introduces extra tables.

      '
  - summary: Create top-level wrapper and exports
    details: 'Add benchbox/tpcds_obt.py wrapper and register TPCDSOBT in benchbox/__init__.py and _BENCHMARK_REGISTRY with
      the chosen name.

      '
- phase: CLI Integration
  done: false
  items:
  - summary: Register CLI entry for tpcds-obt
    details: 'In benchbox/cli/benchmarks.py add the benchmark, reuse standard options, and wire new flags for dimension_mode
      and channel filtering (still operating on one table).

      '
  - summary: Add CLI tests
    details: 'Cover dry-run, query listing, and DuckDB execution path using the single-table dataset.

      '
- phase: Validation and Documentation
  done: false
  items:
  - summary: Implement row and return validation
    details: 'Assert total rows equal sum of all sales facts, per-channel row counts match channel sales tables, and return
      columns/flags align with returns tables.

      '
  - summary: Compare query results against TPC-DS baseline
    details: 'For adapted queries, compare aggregates to baseline TPC-DS results; document any expected deviations from denormalization
      or merged returns logic.

      '
  - summary: Add compression support
    details: 'Ensure single-table output supports zstd/gzip and document defaults.

      '
  - summary: Document OBT benchmark in BENCHMARKS.md
    details: 'Explain single-table design, naming decision (OBT vs Denorm), how sales+returns were merged, and guidance on
      when to use full vs minimal column modes.

      '
technical_requirements:
- category: Schema
  details: 'A single OBT table `tpcds_sales_returns_obt` with a canonical column set spanning all sales + returns channels.
    Width expected in the ~400-520 column range depending on full vs minimal column groups. No additional tables are emitted.

    '
- category: ETL
  details: 'DuckDB in-memory transformation from TPC-DS .dat files into one OBT .dat/.parquet output. JOIN-based transformation
    preserving all source data with LEFT JOIN for returns. Scale factor >= 1.0 required (TPC-DS dsdgen constraint).

    '
- category: Queries
  details: '70-80 adapted queries from TPC-DS 99 operating exclusively on the single table. Mix of channel-specific and cross-channel
    analytics. Inventory queries excluded. Parameter substitution maintained.

    '
- category: Platforms
  details: 'Support all BenchBox platforms via SQLGlot. Call out platform-specific behavior for wide column counts and any
    load-time constraints for the single table.

    '
files_affected:
  modified:
  - 'change_type: New; details: `benchbox/core/tpcds_obt/` directory with schema.py, etl/, benchmark.py, queries.py'
  - 'change_type: New; details: `benchbox/tpcds_obt.py` top-level API wrapper'
  - 'change_type: New; details: `tests/unit/core/tpcds_obt/` test directory'
  - 'change_type: New; details: `tests/integration/test_tpcds_obt_benchmark.py`'
  - 'change_type: Modified; details: `benchbox/cli/benchmarks.py` - add benchmark registration'
  - 'change_type: Modified; details: `benchbox/__init__.py` - add TPCDSOBT to registry'
  added: []
  removed: []
dependencies:
- item: TPC-DS benchmark must be functional
  reason: OBT uses TPC-DS generated data as source
- item: DuckDB installed
  reason: ETL transformation uses DuckDB in-memory processing
success_metrics:
- Single OBT table generates correctly at SF=1 with expected column counts
- 70+ adapted queries execute against the single table without error
- Row counts align with summed TPC-DS sales facts and returns alignment is correct
- Query results match TPC-DS baseline where semantics are preserved
- CLI integration works end-to-end on DuckDB baseline
estimated_effort:
  total_hours: 40-60
  breakdown:
    schema_design: 8-10
    etl_transformer: 12-15
    query_adaptation: 15-20
    benchmark_integration: 6-8
    testing_validation: 8-12
