# Physical Tuning #04: DuckDB DDL Generator
#
# DuckDB is the primary local testing platform - high priority.

id: pt-04-duckdb-ddl
title: "PT-04: DuckDB Physical Tuning DDL Generator"
worktree: "physical-tuning"
priority: "High"
status: "Not Started"
category: "Platform Expansion"

description: |
  Implement DDL generation for DuckDB with support for its physical tuning
  capabilities, particularly sorting which was added in v0.10.

  ## DuckDB Physical Tuning Features

  ### Sorting (v0.10+)
  DuckDB supports row ordering in table definitions:
  ```sql
  CREATE TABLE t (a INT, b INT) ORDER BY a, b;
  ```

  Benefits:
  - Improved compression for sorted columns
  - Faster range scans on sorted columns
  - Better locality for related rows

  ### Partitioning (Hive-style)
  DuckDB can read/write Hive-partitioned Parquet:
  ```sql
  COPY (SELECT * FROM t) TO 'path' (FORMAT PARQUET, PARTITION_BY (col1, col2));
  ```

  This is more for external data organization than table-level tuning.

  ### No Distribution
  DuckDB is a single-node database - distribution tuning is not applicable.

  ## Current Gap

  DuckDB adapter (`benchbox/platforms/duckdb.py`) has:
  - `generate_tuning_clause()` method (line ~683)
  - Reads partitioning columns but only logs them
  - Does NOT add ORDER BY to CREATE TABLE statements

context_sections:
  "DDL Syntax Examples": |
    ```sql
    -- Sorted table (DuckDB 0.10+)
    CREATE TABLE lineitem (
        l_orderkey BIGINT NOT NULL,
        l_partkey BIGINT NOT NULL,
        l_suppkey BIGINT NOT NULL,
        l_linenumber INTEGER NOT NULL,
        l_quantity DECIMAL(15,2),
        l_extendedprice DECIMAL(15,2),
        l_discount DECIMAL(15,2),
        l_tax DECIMAL(15,2),
        l_returnflag VARCHAR(1),
        l_linestatus VARCHAR(1),
        l_shipdate DATE,
        l_commitdate DATE,
        l_receiptdate DATE,
        l_shipinstruct VARCHAR(25),
        l_shipmode VARCHAR(10),
        l_comment VARCHAR(44)
    ) ORDER BY l_shipdate, l_orderkey;

    -- Multiple sort columns with DESC
    CREATE TABLE orders (
        o_orderkey BIGINT PRIMARY KEY,
        o_custkey BIGINT,
        o_orderstatus VARCHAR(1),
        o_totalprice DECIMAL(15,2),
        o_orderdate DATE,
        o_orderpriority VARCHAR(15),
        o_clerk VARCHAR(15),
        o_shippriority INTEGER,
        o_comment VARCHAR(79)
    ) ORDER BY o_orderdate DESC, o_orderkey;

    -- Export with Hive partitioning
    COPY (SELECT * FROM lineitem)
    TO '/data/tpch/lineitem'
    (FORMAT PARQUET, PARTITION_BY (YEAR(l_shipdate), MONTH(l_shipdate)));
    ```

  "Version Compatibility": |
    DuckDB version requirements:
    - ORDER BY in CREATE TABLE: v0.10.0+ (released March 2024)
    - Hive partitioning COPY: v0.8.0+
    - PARTITION_BY in COPY: v0.9.0+

    BenchBox should:
    - Check DuckDB version before using ORDER BY syntax
    - Gracefully degrade for older versions (log warning, skip ORDER BY)

