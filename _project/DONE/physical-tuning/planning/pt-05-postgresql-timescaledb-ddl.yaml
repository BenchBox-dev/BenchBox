# Physical Tuning #05: PostgreSQL & TimescaleDB DDL Generators
#
# PostgreSQL is the foundation for TimescaleDB - implement together.

id: pt-05-postgresql-timescaledb-ddl
title: "PT-05: PostgreSQL & TimescaleDB Physical Tuning DDL Generators"
worktree: "physical-tuning"
priority: "High"
status: "Not Started"
category: "Platform Expansion"

description: |
  Implement DDL generation for PostgreSQL and TimescaleDB (which extends PostgreSQL)
  with support for their native partitioning, clustering, and time-series features.

  ## PostgreSQL Physical Tuning Features

  ### Declarative Partitioning (10+)
  PostgreSQL supports three partitioning strategies:
  - **RANGE**: Partition by value ranges (dates, numeric)
  - **LIST**: Partition by discrete values
  - **HASH**: Partition by hash of column(s)

  ### CLUSTER Command
  Physically reorders table data according to an index:
  ```sql
  CREATE INDEX idx ON table (col1, col2);
  CLUSTER table USING idx;
  ```
  Note: This is a one-time operation, not maintained on inserts.

  ### No Distribution
  PostgreSQL is single-node - distribution tuning not applicable.

  ## TimescaleDB Extensions

  ### Hypertables
  Time-partitioned tables optimized for time-series:
  ```sql
  SELECT create_hypertable('table', 'time_column');
  ```

  ### Chunk Intervals
  Control partition (chunk) size:
  ```sql
  SELECT create_hypertable('table', 'time_column',
      chunk_time_interval => INTERVAL '1 day');
  ```

  ### Compression
  TimescaleDB native compression:
  ```sql
  ALTER TABLE table SET (timescaledb.compress);
  SELECT add_compression_policy('table', INTERVAL '7 days');
  ```

  ## Current Gap

  PostgreSQL adapter has no DDL tuning support. TimescaleDB adapter (if exists)
  likewise has no tuning integration.

context_sections:
  "PostgreSQL DDL Syntax": |
    ```sql
    -- Range partitioned table (by date)
    CREATE TABLE orders (
        o_orderkey BIGINT NOT NULL,
        o_custkey BIGINT NOT NULL,
        o_orderdate DATE NOT NULL,
        o_totalprice DECIMAL(15,2),
        o_orderpriority VARCHAR(15)
    ) PARTITION BY RANGE (o_orderdate);

    -- Create partitions
    CREATE TABLE orders_2023 PARTITION OF orders
        FOR VALUES FROM ('2023-01-01') TO ('2024-01-01');
    CREATE TABLE orders_2024 PARTITION OF orders
        FOR VALUES FROM ('2024-01-01') TO ('2025-01-01');

    -- Hash partitioned table
    CREATE TABLE lineitem (
        l_orderkey BIGINT NOT NULL,
        l_linenumber INTEGER NOT NULL,
        ...
    ) PARTITION BY HASH (l_orderkey);

    -- Create hash partitions (4 partitions)
    CREATE TABLE lineitem_p0 PARTITION OF lineitem
        FOR VALUES WITH (MODULUS 4, REMAINDER 0);
    CREATE TABLE lineitem_p1 PARTITION OF lineitem
        FOR VALUES WITH (MODULUS 4, REMAINDER 1);
    -- ... etc

    -- CLUSTER for physical reordering
    CREATE INDEX orders_date_idx ON orders (o_orderdate);
    CLUSTER orders USING orders_date_idx;
    ```

  "TimescaleDB DDL Syntax": |
    ```sql
    -- Create regular table first
    CREATE TABLE metrics (
        time TIMESTAMPTZ NOT NULL,
        device_id INTEGER NOT NULL,
        temperature DOUBLE PRECISION,
        humidity DOUBLE PRECISION
    );

    -- Convert to hypertable with daily chunks
    SELECT create_hypertable('metrics', 'time',
        chunk_time_interval => INTERVAL '1 day'
    );

    -- Add space partitioning (optional)
    SELECT create_hypertable('metrics', 'time',
        partitioning_column => 'device_id',
        number_partitions => 4,
        chunk_time_interval => INTERVAL '1 day'
    );

    -- Enable compression
    ALTER TABLE metrics SET (
        timescaledb.compress,
        timescaledb.compress_segmentby = 'device_id',
        timescaledb.compress_orderby = 'time DESC'
    );

    -- Add compression policy (compress chunks older than 7 days)
    SELECT add_compression_policy('metrics', INTERVAL '7 days');
    ```

