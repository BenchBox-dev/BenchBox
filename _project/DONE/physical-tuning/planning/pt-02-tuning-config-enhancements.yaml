# Physical Tuning #02: Tuning Configuration Enhancements
#
# Extends the existing tuning configuration schema to support advanced physical
# tuning options needed by various platforms.

id: pt-02-tuning-config-enhancements
title: "PT-02: Tuning Configuration Schema Enhancements"
worktree: "physical-tuning"
priority: "High"
status: "Completed"
category: "Core Functionality"

description: |
  Extend the existing `TuningColumn` and related classes to support advanced
  physical tuning options that different platforms require.

  ## Current Limitations

  The current `TuningColumn` class only captures:
  - `name`: Column name
  - `type`: SQL data type
  - `order`: Position in tuning configuration

  This is insufficient for:
  - **Sort order**: ASC vs DESC per column
  - **Nulls handling**: NULLS FIRST vs NULLS LAST
  - **Compression**: Per-column encoding (Redshift ENCODE)
  - **Partition granularity**: DAILY, MONTHLY, YEARLY for date columns
  - **Sort key style**: COMPOUND vs INTERLEAVED (Redshift)
  - **Bucket count**: Number of buckets for hash partitioning

  ## Backward Compatibility

  All enhancements must be backward compatible with existing YAML configs.
  New fields should have sensible defaults that preserve current behavior.

context_sections:
  "Extended TuningColumn Design": |
    ```python
    @dataclass
    class TuningColumn:
        """Column participating in tuning configuration."""
        name: str
        type: str
        order: int

        # New fields (all optional with defaults)
        sort_order: Literal["ASC", "DESC"] = "ASC"
        nulls_position: Literal["FIRST", "LAST", "DEFAULT"] = "DEFAULT"
        compression: str | None = None  # Platform-specific: "lzo", "zstd", "raw", etc.
    ```

  "New PartitioningConfig Design": |
    ```python
    @dataclass
    class PartitioningConfig:
        """Advanced partitioning configuration."""
        columns: list[TuningColumn]
        strategy: Literal["RANGE", "LIST", "HASH", "DATE"] = "RANGE"

        # For DATE strategy
        granularity: Literal["HOURLY", "DAILY", "MONTHLY", "YEARLY"] | None = None

        # For HASH strategy
        bucket_count: int | None = None

        # For RANGE strategy
        range_boundaries: list[Any] | None = None  # Platform-specific
    ```

  "New SortKeyConfig Design": |
    ```python
    @dataclass
    class SortKeyConfig:
        """Advanced sort key configuration (primarily for Redshift)."""
        columns: list[TuningColumn]
        style: Literal["COMPOUND", "INTERLEAVED", "AUTO"] = "COMPOUND"
    ```

  "YAML Schema Example": |
    ```yaml
    table_tunings:
      LINEITEM:
        table_name: LINEITEM
        partitioning:
          strategy: DATE
          granularity: DAILY
          columns:
            - name: L_SHIPDATE
              type: DATE
              order: 1

        sorting:
          style: COMPOUND  # Redshift-specific
          columns:
            - name: L_ORDERKEY
              type: INTEGER
              order: 1
              sort_order: ASC
              nulls_position: LAST
            - name: L_LINENUMBER
              type: INTEGER
              order: 2
              sort_order: ASC

        distribution:
          - name: L_ORDERKEY
            type: INTEGER
            order: 1
            compression: lzo  # Redshift ENCODE

        clustering:
          bucket_count: 64  # For hash-based clustering
          columns:
            - name: L_PARTKEY
              type: INTEGER
              order: 1
    ```

