# Physical Tuning #08: Spark Family DDL Generator Enhancement
#
# Covers ALL Spark-based platforms including cloud-managed services.
# Leverages shared cloud_spark infrastructure for 80%+ code reuse.

title: "PT-08: Spark Family Physical Tuning DDL Generator (All Platforms)"
worktree: "physical-tuning"
priority: "Medium"
status: "Not Started"
category: "Platform Expansion"

description: |
  Enhance DDL generation for ALL Spark-based platforms with full support for
  partitioning, clustering, Z-ordering, and Delta Lake features. This covers
  12 Spark platforms through a shared infrastructure approach.

  ## Spark Family Platforms (12 total)

  ### Core Spark
  | Platform | File | Execution |
  |----------|------|-----------|
  | Local Spark | `benchbox/platforms/spark.py` | local[*], YARN, K8s |
  | PySpark SQL | `benchbox/platforms/pyspark/sql_adapter.py` | local[*], cluster |

  ### AWS Spark Services
  | Platform | File | Key Features |
  |----------|------|--------------|
  | EMR Serverless | `benchbox/platforms/aws/emr_serverless_adapter.py` | Auto-scaling, S3 |
  | AWS Glue | `benchbox/platforms/aws/glue_adapter.py` | Glue Catalog, ETL |
  | Athena Spark | `benchbox/platforms/aws/athena_spark_adapter.py` | Sub-second startup |

  ### GCP Spark Services
  | Platform | File | Key Features |
  |----------|------|--------------|
  | Dataproc | `benchbox/platforms/gcp/dataproc_adapter.py` | Persistent/ephemeral |
  | Dataproc Serverless | `benchbox/platforms/gcp/dataproc_serverless_adapter.py` | Fully managed |

  ### Azure Spark Services
  | Platform | File | Key Features |
  |----------|------|--------------|
  | Synapse Spark | `benchbox/platforms/azure/synapse_spark_adapter.py` | Spark pools |
  | Fabric Spark | `benchbox/platforms/azure/fabric_spark_adapter.py` | OneLake storage |

  ### Databricks
  | Platform | File | Key Features |
  |----------|------|--------------|
  | Databricks | `benchbox/platforms/databricks/adapter.py` | Delta, Unity Catalog |

  ### DataFrame Mode
  | Platform | File | Key Features |
  |----------|------|--------------|
  | PySpark DataFrame | `benchbox/platforms/dataframe/pyspark_df.py` | Expression family |

  ### Snowflake (PySpark API)
  | Platform | File | Key Features |
  |----------|------|--------------|
  | Snowpark Connect | `benchbox/platforms/snowpark_connect.py` | PySpark API compat |

  ## Architecture Strategy: Shared Mixin

  All cloud Spark platforms already inherit from shared infrastructure at
  `benchbox/platforms/base/cloud_spark/`. The physical tuning implementation
  will follow this pattern:

  1. **Create `SparkDDLGeneratorMixin`** in `benchbox/platforms/base/cloud_spark/mixins.py`
  2. **Implement format-specific generators** for Delta, Iceberg, Parquet, Hive
  3. **All platforms inherit the mixin** - 80%+ code reuse
  4. **Platform-specific overrides** where needed (e.g., Databricks Unity Catalog)

  ## Physical Tuning Features by Table Format

  ### Delta Lake (Databricks, EMR, Dataproc with Delta)
  ```sql
  CREATE TABLE t (...) USING DELTA PARTITIONED BY (col);
  CREATE TABLE t (...) USING DELTA CLUSTER BY (col1, col2);  -- Delta 3.0+ Liquid Clustering
  OPTIMIZE table ZORDER BY (col1, col2);  -- Post-load optimization
  ALTER TABLE t SET TBLPROPERTIES (delta.autoOptimize.optimizeWrite = true);
  ```

  ### Apache Iceberg (AWS Glue, Athena, Dataproc, EMR)
  ```sql
  CREATE TABLE t (...) USING ICEBERG PARTITIONED BY (bucket(16, col));
  CREATE TABLE t (...) PARTITIONED BY (years(ts), bucket(16, id));
  ```

  ### Apache Parquet (All platforms)
  ```sql
  CREATE TABLE t (...) USING PARQUET PARTITIONED BY (col);
  CREATE TABLE t (...) CLUSTERED BY (col) INTO 32 BUCKETS;
  ```

  ### Apache Hive (Legacy, still supported)
  ```sql
  CREATE TABLE t (...) STORED AS PARQUET
  PARTITIONED BY (dt STRING)
  CLUSTERED BY (id) SORTED BY (id) INTO 32 BUCKETS;
  ```

context_sections:
  "Shared Infrastructure": |
    BenchBox already has shared Spark infrastructure at `benchbox/platforms/base/cloud_spark/`:

    ```python
    # mixins.py - existing tuning mixin
    class SparkTuningMixin:
        """Handles constraint application (PKs/FKs not enforced in Spark)."""
        def apply_primary_keys(self, config): ...
        def apply_foreign_keys(self, config): ...

    class CloudSparkConfigMixin:
        """Benchmark configuration via SparkConfigOptimizer."""
        cloud_platform: ClassVar[CloudPlatform]
        def configure_for_benchmark(self, connection, benchmark_type): ...

    # NEW: SparkDDLGeneratorMixin (to be added)
    class SparkDDLGeneratorMixin:
        """DDL generation for Spark platforms."""
        def generate_tuning_clauses(self, table_tuning, platform_opts) -> TuningClauses: ...
        def get_post_load_statements(self, table_name, tuning) -> list[str]: ...
    ```

    All cloud adapters already use this pattern:
    ```python
    class DataprocServerlessAdapter(CloudSparkConfigMixin, SparkTuningMixin, PlatformAdapter):
        cloud_platform = CloudPlatform.DATAPROC_SERVERLESS
    ```

  "Format Detection Strategy": |
    Spark platforms can use multiple table formats. The DDL generator must detect
    and handle each format appropriately:

    ```python
    class SparkDDLGeneratorMixin:
        def detect_table_format(self) -> Literal["delta", "iceberg", "parquet", "hive"]:
            """Detect table format from adapter configuration."""
            # Check adapter settings, USING clause, etc.
            ...

        def generate_tuning_clauses(self, table_tuning, platform_opts) -> TuningClauses:
            format = self.detect_table_format()
            if format == "delta":
                return self._generate_delta_tuning(table_tuning)
            elif format == "iceberg":
                return self._generate_iceberg_tuning(table_tuning)
            # etc.
    ```

  "Platform-Specific Considerations": |
    While most DDL is shared, some platforms have unique requirements:

    | Platform | Unique Considerations |
    |----------|----------------------|
    | Databricks | Unity Catalog naming, Delta-only, liquid clustering |
    | AWS Glue | Glue Data Catalog, partition pruning via Glue |
    | Athena Spark | External tables only, S3 storage |
    | Dataproc | Hive Metastore or BigLake Metastore |
    | Synapse Spark | Serverless SQL pool integration |
    | Fabric Spark | OneLake Delta Tables, Lakehouse pattern |
    | Snowpark | NOT Spark DDL - uses Snowflake DDL (see PT-07) |

    Note: Snowpark Connect uses PySpark API for compatibility but executes natively
    on Snowflake. Its physical tuning uses Snowflake clustering, NOT Spark DDL.

