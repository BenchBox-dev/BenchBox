# Physical Tuning #12: Remaining Platforms DDL Generator Enhancement
#
# Covers platforms with existing tuning implementations that need
# alignment with the DDL Generator Protocol.

id: pt-12-remaining-platforms-ddl
title: "PT-12: Remaining Platforms Physical Tuning DDL Generator Enhancement"
worktree: "physical-tuning"
priority: "Medium"
status: "Completed"
category: "Platform Expansion"

description: |
  Enhance and refactor DDL generation for remaining platforms that already have
  partial or complete tuning implementations, aligning them with the new DDL
  Generator Protocol from PT-01.

  ## Platforms Covered

  ### ClickHouse (Comprehensive - Refactor Only)
  | Feature | Current State | Status |
  |---------|---------------|--------|
  | PARTITION BY | ClickHouseTuningMixin | Implemented |
  | ORDER BY (sort/cluster) | ClickHouseTuningMixin | Implemented |
  | MergeTree engines | ClickHouseTuningMixin | Implemented |
  | OPTIMIZE TABLE | apply_table_tunings() | Implemented |

  File: `benchbox/platforms/clickhouse/tuning.py` - **Already comprehensive, needs protocol alignment**

  ### Firebolt (Substantial - Refactor Only)
  | Feature | Current State | Status |
  |---------|---------------|--------|
  | PRIMARY INDEX | generate_tuning_clause() | Implemented |
  | PARTITION BY | generate_tuning_clause() | Implemented |
  | AGGREGATING INDEX | generate_tuning_clause() | Partial |

  File: `benchbox/platforms/firebolt.py` - **Substantial implementation, needs protocol alignment**

  ### Azure Synapse Dedicated SQL Pool (Substantial - Refactor Only)
  | Feature | Current State | Status |
  |---------|---------------|--------|
  | DISTRIBUTION (HASH/ROUND_ROBIN) | generate_tuning_clause() | Implemented |
  | CLUSTERED COLUMNSTORE INDEX | generate_tuning_clause() | Implemented |
  | HEAP tables | generate_tuning_clause() | Implemented |

  File: `benchbox/platforms/azure_synapse.py` - **Substantial implementation, needs protocol alignment**

  ### Fabric Warehouse (Delta Lake - Shares with Spark)
  | Feature | Current State | Status |
  |---------|---------------|--------|
  | OneLake Delta Tables | Inherits from Spark/Delta | To verify |
  | PARTITION BY | Should inherit from Delta | To verify |
  | OPTIMIZE | Should inherit from Delta | To verify |

  File: `benchbox/platforms/fabric_warehouse.py` - **May share with PT-08 Spark Family**

  ### InfluxDB (Time-Series - Limited DDL)
  | Feature | Current State | Status |
  |---------|---------------|--------|
  | Retention policies | API-based (not DDL) | N/A |
  | Shard groups | API-based (not DDL) | N/A |
  | Bucket organization | API-based (not DDL) | N/A |

  File: `benchbox/platforms/influxdb/adapter.py` - **Minimal DDL tuning (retention via API)**

  ### SQLite (Row-Based - No DDL Tuning)
  | Feature | Current State | Status |
  |---------|---------------|--------|
  | Indexes | CREATE INDEX at runtime | Minimal |
  | No partitioning | Single file | N/A |
  | No distribution | Single process | N/A |

  File: `benchbox/platforms/sqlite.py` - **No DDL tuning (indexes only via runtime)**

  ### DataFusion (Arrow-Based - Minimal DDL)
  | Feature | Current State | Status |
  |---------|---------------|--------|
  | Arrow memory tables | In-memory only | Minimal |
  | Parquet files | File-based (not DDL) | Minimal |
  | No partitioning | Single process | N/A |

  File: `benchbox/platforms/datafusion.py` - **Minimal DDL tuning**

  ### Polars SQL Mode (In-Memory - Minimal DDL)
  | Feature | Current State | Status |
  |---------|---------------|--------|
  | In-memory tables | No persistence | Minimal |
  | No partitioning | Single process | N/A |

  File: `benchbox/platforms/polars_platform.py` - **Minimal DDL tuning**

context_sections:
  "ClickHouse Current Implementation": |
    ClickHouse already has a comprehensive `ClickHouseTuningMixin` in `tuning.py`:

    ```python
    class ClickHouseTuningMixin:
        def generate_tuning_clause(self, table_tuning) -> str:
            # Generates PARTITION BY, ORDER BY clauses
            # Combines clustering and sorting into ORDER BY
            ...

        def apply_table_tunings(self, table_tuning, connection) -> None:
            # Post-load OPTIMIZE TABLE operations
            ...

        def supports_tuning_type(self, tuning_type) -> bool:
            # Supports PARTITIONING, SORTING, CLUSTERING, DISTRIBUTION
            ...
    ```

    **Changes needed:**
    - Implement DDLGenerator protocol (generate_tuning_clauses() returning TuningClauses)
    - Add MergeTree engine selection based on tuning config
    - Add TTL support for time-series data

  "Firebolt Current Implementation": |
    Firebolt has `generate_tuning_clause()` in `firebolt.py`:

    ```python
    def generate_tuning_clause(self, table_tuning) -> str:
        # PRIMARY INDEX from DISTRIBUTION columns
        # PARTITION BY from PARTITIONING columns
        # Returns: PRIMARY INDEX (col1, col2) PARTITION BY col3
        ...
    ```

    **Changes needed:**
    - Implement DDLGenerator protocol
    - Add AGGREGATING INDEX support for aggregating indexes
    - Add JOIN INDEX support for join optimization

  "Azure Synapse Current Implementation": |
    Azure Synapse has `generate_tuning_clause()` in `azure_synapse.py`:

    ```python
    def generate_tuning_clause(self, table_tuning) -> str:
        # DISTRIBUTION = HASH([col]) from DISTRIBUTION columns
        # Falls back to distribution_default (ROUND_ROBIN)
        # CLUSTERED COLUMNSTORE INDEX
        ...
    ```

    **Changes needed:**
    - Implement DDLGenerator protocol
    - Add CLUSTERED INDEX support for specific column ordering
    - Add partitioning support (not currently implemented)

  "Minimal Tuning Platforms": |
    Some platforms have minimal or no DDL-based physical tuning:

    - **SQLite**: Row-based database, single file, indexes only at runtime
    - **DataFusion**: Arrow-based in-memory engine, file-based for Parquet
    - **Polars SQL**: In-memory engine, no persistence layer
    - **InfluxDB**: Time-series with API-based retention policies

    These platforms should implement the DDLGenerator protocol returning empty
    TuningClauses with appropriate logging/warnings.

