# Physical Tuning #01: DDL Generator Protocol & Foundation
#
# Cross-cutting foundation that all platform-specific implementations depend on.
# This MUST be completed before any platform-specific DDL generators.

title: "PT-01: DDL Generator Protocol and Base Implementation"
worktree: "physical-tuning"
priority: "Critical"
status: "Completed"
completed_date: "2026-01-03"
category: "Core Functionality"

description: |
  Define the unified DDL generator protocol that all platform-specific implementations
  will follow. This provides a consistent interface for generating CREATE TABLE
  statements with physical tuning clauses applied.

  ## Why This Is Critical

  Currently, each platform implements tuning DDL generation differently:
  - ClickHouse: `generate_tuning_clause()` method
  - Firebolt: `generate_tuning_clause()` method
  - BigQuery: Inline in `_create_table_statement()`
  - Snowflake: `generate_tuning_clause()` method
  - Others: Not implemented at all

  A unified protocol ensures:
  1. Consistent interface across all platforms
  2. Composable tuning clauses (partition + cluster + sort)
  3. Testable DDL generation separate from execution
  4. Dry-run preview capability

  ## Deliverables

  1. `DDLGenerator` protocol defining the contract
  2. `TuningClauses` dataclass for structured clause output
  3. `BaseDDLGenerator` with shared logic and extension points
  4. `ColumnDefinition` type for schema representation
  5. Unit tests for protocol compliance

context_sections:
  "Protocol Design": |
    ```python
    from typing import Protocol, Optional
    from dataclasses import dataclass

    @dataclass
    class TuningClauses:
        """Structured output from DDL generation."""
        partition_by: str | None = None      # "PARTITION BY DATE(col)"
        cluster_by: str | None = None        # "CLUSTER BY (col1, col2)"
        distribute_by: str | None = None     # "DISTSTYLE KEY DISTKEY(col)"
        sort_by: str | None = None           # "SORTKEY(col1, col2)"
        table_properties: dict[str, str] | None = None  # Platform-specific
        post_create_statements: list[str] | None = None # Z-ORDER, OPTIMIZE, etc.

    class DDLGenerator(Protocol):
        """Protocol for platform-specific DDL generation."""

        def generate_tuning_clauses(
            self,
            table_tuning: TableTuning,
            platform_opts: PlatformOptimizationConfiguration | None = None,
        ) -> TuningClauses:
            """Generate tuning clauses for a table."""
            ...

        def generate_create_table_ddl(
            self,
            table_name: str,
            columns: list[ColumnDefinition],
            tuning: TuningClauses | None = None,
        ) -> str:
            """Generate complete CREATE TABLE statement."""
            ...

        def get_post_load_statements(
            self,
            table_name: str,
            tuning: TuningClauses,
        ) -> list[str]:
            """Get statements to run after data load (OPTIMIZE, etc.)."""
            ...
    ```

  "Integration Pattern": |
    Platform adapters will use DDL generators via composition:

    ```python
    class RedshiftAdapter(PlatformAdapter):
        def __init__(self, **config):
            super().__init__(**config)
            self._ddl_generator = RedshiftDDLGenerator()

        def load_data(self, benchmark, connection, data_dir):
            # Get tuning config
            tuning_config = self.tuning_config

            # Generate DDL with tuning
            for table_name, schema in benchmark.get_schema().items():
                table_tuning = tuning_config.table_tunings.get(table_name)
                clauses = self._ddl_generator.generate_tuning_clauses(table_tuning)
                ddl = self._ddl_generator.generate_create_table_ddl(
                    table_name, schema.columns, clauses
                )
                connection.execute(ddl)
    ```

