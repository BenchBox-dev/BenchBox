description: |
  Enhance the existing Snowflake DDL generation to fully utilize the tuning
  configuration system and improve automatic clustering management.

  ## Snowflake Physical Tuning Features

  ### Automatic Clustering
  Snowflake's primary tuning mechanism:
  ```sql
  CREATE TABLE t (...) CLUSTER BY (col1, col2);
  ALTER TABLE t CLUSTER BY (col1, col2);
  ```

  Notes:
  - Snowflake automatically maintains clustering in background
  - No manual partition creation needed
  - Best for columns used in WHERE, JOIN, ORDER BY

  ### Micro-Partitions (Automatic)
  Snowflake automatically partitions data into ~16MB micro-partitions.
  Users cannot control this directly - it's fully automatic.

  ### Search Optimization Service
  Optional acceleration for point lookups:
  ```sql
  ALTER TABLE t ADD SEARCH OPTIMIZATION ON EQUALITY(col);
  ```

  ## Current State

  Snowflake adapter (`benchbox/platforms/snowflake.py`) has:
  - `generate_tuning_clause()` method (line ~1448) - generates CLUSTER BY
  - `apply_table_tunings()` method (line ~1498) - runs ALTER CLUSTER BY
  - Issue: Uses inline config, doesn't fully use tuning YAML

context_sections:
  "DDL Syntax Examples": |
    ```sql
    -- Clustered table
    CREATE TABLE lineitem (
        l_orderkey NUMBER(38,0) NOT NULL,
        l_partkey NUMBER(38,0) NOT NULL,
        l_suppkey NUMBER(38,0) NOT NULL,
        l_linenumber NUMBER(38,0) NOT NULL,
        l_quantity NUMBER(12,2),
        l_extendedprice NUMBER(12,2),
        l_discount NUMBER(12,2),
        l_tax NUMBER(12,2),
        l_returnflag VARCHAR(1),
        l_linestatus VARCHAR(1),
        l_shipdate DATE,
        l_commitdate DATE,
        l_receiptdate DATE,
        l_shipinstruct VARCHAR(25),
        l_shipmode VARCHAR(10),
        l_comment VARCHAR(44)
    )
    CLUSTER BY (l_shipdate, l_orderkey);

    -- Automatic clustering (enabled by default for clustered tables)
    ALTER TABLE lineitem RESUME RECLUSTER;

    -- Search optimization
    ALTER TABLE lineitem ADD SEARCH OPTIMIZATION ON EQUALITY(l_orderkey);

    -- Check clustering health
    SELECT SYSTEM$CLUSTERING_INFORMATION('lineitem', '(l_shipdate, l_orderkey)');
    ```

  "Tuning Considerations": |
    Snowflake-specific guidance:
    - Don't over-cluster (3-4 columns max recommended)
    - Leading column should have highest cardinality for filter predicates
    - Date columns work well as first clustering key
    - Avoid clustering on frequently updated columns

    Partitioning note:
    - Snowflake handles partitioning automatically (micro-partitions)
    - `partitioning` in tuning config should be ignored with warning
    - Map `partitioning` columns to `clustering` for Snowflake

