# Physical Tuning #06: Trino, Presto & Athena DDL Generators
#
# These platforms share connector-based architecture with similar DDL patterns.

id: pt-06-trino-presto-athena-ddl
title: "PT-06: Trino, Presto & Athena Physical Tuning DDL Generators"
worktree: "physical-tuning"
priority: "Medium-High"
status: "Not Started"
category: "Platform Expansion"

description: |
  Implement DDL generation for the Trino/Presto family (including AWS Athena)
  with support for connector-specific partitioning and table format options.

  ## Platform Relationship

  - **Trino**: Fork of PrestoSQL (renamed 2020), community-driven
  - **Presto**: Originally from Facebook, now maintained by Presto Foundation
  - **Athena**: AWS-managed Trino/Presto service with S3-backed storage

  All three support similar connector architecture but with varying DDL syntax.

  ## Connector-Specific Tuning

  ### Hive Connector
  - PARTITIONED BY: Hive-style partitioning
  - BUCKETED BY: Hash bucketing
  - SORTED BY: Sort within buckets

  ### Iceberg Connector
  - partitioning: Partition transforms (year, month, day, hour, bucket, truncate)
  - sorted_by: Sorted table writes
  - format: Parquet, ORC, Avro

  ### Delta Lake Connector
  - partitioned_by: Column-based partitioning
  - location: Storage location

  ## Current Gap

  - Trino adapter has `generate_tuning_clause()` (line ~1178) with partial support
  - Presto adapter has `generate_tuning_clause()` (line ~1156) with partial support
  - Athena adapter has `generate_tuning_clause()` (line ~1165) with partial support
  - None fully wire tuning config to actual CREATE TABLE

context_sections:
  "Hive Connector DDL": |
    ```sql
    -- Trino/Presto Hive connector
    CREATE TABLE hive.schema.lineitem (
        l_orderkey BIGINT,
        l_partkey BIGINT,
        l_suppkey BIGINT,
        l_quantity DECIMAL(15,2),
        l_shipdate DATE
    )
    WITH (
        format = 'PARQUET',
        partitioned_by = ARRAY['l_shipdate'],
        bucketed_by = ARRAY['l_orderkey'],
        bucket_count = 32,
        sorted_by = ARRAY['l_orderkey']
    );

    -- Athena DDL (similar but with LOCATION)
    CREATE EXTERNAL TABLE lineitem (
        l_orderkey BIGINT,
        l_partkey BIGINT,
        ...
    )
    PARTITIONED BY (l_shipdate DATE)
    STORED AS PARQUET
    LOCATION 's3://bucket/tpch/lineitem/'
    TBLPROPERTIES ('parquet.compress'='SNAPPY');
    ```

  "Iceberg Connector DDL": |
    ```sql
    -- Trino Iceberg connector
    CREATE TABLE iceberg.schema.lineitem (
        l_orderkey BIGINT,
        l_partkey BIGINT,
        l_shipdate DATE,
        l_quantity DECIMAL(15,2)
    )
    WITH (
        format = 'PARQUET',
        partitioning = ARRAY['year(l_shipdate)', 'bucket(l_orderkey, 16)'],
        sorted_by = ARRAY['l_orderkey', 'l_linenumber'],
        location = 's3://bucket/iceberg/lineitem'
    );

    -- Partition transforms supported:
    -- year(col), month(col), day(col), hour(col)
    -- bucket(col, N), truncate(col, N)
    -- identity(col)
    ```

  "Delta Lake Connector DDL": |
    ```sql
    -- Trino Delta connector
    CREATE TABLE delta.schema.lineitem (
        l_orderkey BIGINT,
        l_partkey BIGINT,
        l_shipdate DATE
    )
    WITH (
        location = 's3://bucket/delta/lineitem',
        partitioned_by = ARRAY['l_shipdate']
    );
    ```

