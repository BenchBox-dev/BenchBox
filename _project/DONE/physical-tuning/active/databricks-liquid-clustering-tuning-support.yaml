impact:
  business_value: |
    Keeps BenchBox aligned with current Databricks tuning direction and enables
    more credible benchmark guidance for users evaluating modern table layout strategies.
  user_impact: |
    Databricks users can express and run Liquid Clustering benchmarks directly in
    tuning configs, instead of approximating behavior via legacy Z-ORDER pathways.
  technical_debt: |
    Reduces Databricks-specific tuning gaps and avoids overloading one tuning path
    with multiple semantics.

files_affected:
  modified:
  - "benchbox/core/tuning/interface.py"
  - "benchbox/core/tuning/parser.py"
  - "benchbox/platforms/databricks/adapter.py"
  - "benchbox/cli/commands/run.py"
  - "benchbox/core/results/models.py"
  added:
  - "tests/unit/platforms/test_databricks_liquid_clustering.py"
  - "docs/usage/databricks-liquid-clustering.md"

must_preserve:
- "Existing Databricks runs using Z-ORDER tuning continue to execute without config migration"
- "Non-Databricks platforms ignore Databricks-specific liquid clustering settings cleanly"
- "Dry-run output remains deterministic and includes all emitted Databricks tuning actions"
- "Databricks adapter error messages remain actionable when strategy prerequisites are missing"

approach: |
  Extend the unified tuning model with an explicit Databricks clustering strategy
  representation rather than inferring from generic sorting fields. Apply the strategy
  in Databricks adapter lifecycle points where table format/state is known.

  Keep precedence rules explicit: liquid clustering, z-order, and none must be mutually
  understandable with clear conflict handling and warnings.

  Add result metadata so downstream analysis can segment runs by applied strategy.

anti_patterns:
- "DO NOT silently reinterpret existing Z-ORDER configs as liquid clustering — because it changes benchmark semantics — require
  explicit strategy selection"
- "DO NOT implement Databricks-only behavior in platform-agnostic base classes without guards — because it risks cross-platform
  regressions — keep logic adapter-scoped where possible"
- "DO NOT ship strategy parsing without conflict validation — because mixed config states become non-reproducible — fail fast
  with clear remediation"

