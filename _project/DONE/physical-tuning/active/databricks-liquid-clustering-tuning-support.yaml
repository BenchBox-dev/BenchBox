# Databricks Liquid Clustering Tuning Support
#
# Location: _project/DONE/physical-tuning/active/databricks-liquid-clustering-tuning-support.yaml

id: databricks-liquid-clustering-tuning-support
title: "Add first-class Databricks Liquid Clustering support in BenchBox tuning configurations"
worktree: physical-tuning
priority: High
status: Completed
completed_date: "2026-02-20"
description: |
  Expand Databricks tuning support so Liquid Clustering is a first-class,
  configurable strategy in BenchBox, not a secondary/implicit path behind
  Z-ORDER/OPTIMIZE workflows.

  Rationale:
  - Databricks guidance is increasingly steering users toward Liquid Clustering.
  - Current BenchBox tuning emphasizes Z-ORDER and OPTIMIZE behaviors.
  - Users need direct control and comparability for Liquid Clustering in the
    unified tuning model and CLI/platform-option workflows.

  Scope:
  - Add explicit Liquid Clustering representation in tuning configuration.
  - Implement Databricks adapter execution paths for create-time and post-load
    Liquid Clustering operations.
  - Preserve backwards compatibility for existing Z-ORDER-based configs.
  - Expose strategy metadata in results to support fair comparisons.

category: Core Functionality

