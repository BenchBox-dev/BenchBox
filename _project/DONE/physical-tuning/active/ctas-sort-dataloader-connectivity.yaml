impact:
  business_value: |
    Eliminates copy-paste risk by ensuring all future CTAS sort implementations
    inherit shared lookup, validation, dry-run, and logging behavior automatically.
    Enables the local and cloud platform extensions (ctas-sort-local-sql-platforms,
    ctas-sort-cloud-platforms) without any further connectivity work.
  user_impact: |
    MotherDuck users will immediately gain sorted loading (same DuckDB engine).
    ClickHouse, StarRocks, and SQLite users gain the wiring needed for future
    platform-specific implementations to activate without additional changes.
  technical_debt: |
    Resolves duck-typed protocol gap introduced by the initial implementation.
    Centralizing eliminates the need for each platform to re-implement table
    lookup, identifier validation, dry-run, and logging.

