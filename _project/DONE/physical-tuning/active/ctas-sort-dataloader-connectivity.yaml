must_preserve:
- "DuckDBAdapter.load_data() produces identical row counts after refactor"
- "All existing test_duckdb_sorted_loading.py tests pass unchanged or are migrated 1-for-1"
- "DataLoader INSERT INTO path (tuning_config=None) is completely unaffected"
- "DuckDBDDLGenerator.generate_ctas_ddl() behavioral output is identical after the parameter rename"
- "apply_ctas_sort returns False (not exception) when platform returns None from _build_ctas_sort_sql"

approach: |
  Start with w1 (add the hook method signature to base adapter) before touching any
  adapters, so the interface is settled before implementations follow.

  For w2, keep the case-insensitive lookup and validate_sql_identifier call from the existing
  DuckDBAdapter.apply_ctas_sort() — both are correct and should move verbatim.

  For w3, DuckDBAdapter._build_ctas_sort_sql builds the ORDER BY string from sort_columns
  without involving DuckDBDDLGenerator — just use f-string formatting directly since the
  base class owns the logic that already extracted the columns. Only the SQL template string
  belongs in the platform-specific hook.

  For w4 (parameter rename), run grep first:
    grep -rn "generate_ctas_ddl" benchbox/ tests/
  to find all callers before renaming.

  For w8 (MotherDuck), add the apply_ctas_sort call after each table's INSERT INTO completes
  inside MotherDuck's existing load_data() loop — mirror the DataLoader pattern.

anti_patterns:
- "DO NOT make _build_ctas_sort_sql abstract — because not all platforms support CTAS sort and forcing every subclass to implement
  it would break the many adapters that don't need it — return None by default (opt-in model)"
- "DO NOT pass DuckDBDDLGenerator into _build_ctas_sort_sql — because the hook must be self-contained per platform — each
  platform builds its own SQL string directly"
- "DO NOT move the validate_sql_identifier call into _build_ctas_sort_sql — because identifier validation is a shared safety
  concern, not platform-specific — keep it in the base apply_ctas_sort() before calling the hook"
- "DO NOT rename generate_ctas_ddl parameter without grep-checking all callers first"

