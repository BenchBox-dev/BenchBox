sections:
  "Decision Summary": |
    Decision: TPC-DS-OBT needs dedicated DataFrame implementations; direct reuse
    of normalized TPC-DS DataFrame queries is not viable.

  "Current-State Evidence": |
    `benchbox/core/tpcds_obt/queries.py` documents 89/99 convertible SQL queries,
    including manual rewrites for complex cases. Current benchmark metadata still
    reports `supports_dataframe: False`.

  "Adaptation Plan": |
    - Build query families around OBT single-table semantics and channel-aware logic.
    - Reuse expression/pandas helper patterns, but not normalized table joins.
    - Validate against OBT SQL query manager outputs and parameterized variants.

