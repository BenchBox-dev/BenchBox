title: "Evaluate DataFrame Scope for TPC-Havoc"
worktree: dataframe-benchmarks
priority: Medium
status: Completed
completed_date: "2026-02-07"
description: |
  Evaluate whether any subset of TPC-Havoc is meaningful for DataFrame benchmarking.

  TPC-Havoc variants primarily test SQL optimizer behavior (query rewrites,
  predicate pushdown, planner choices). DataFrame execution bypasses SQL parsing
  and optimizer layers, so direct translation likely provides low benchmark value.

  This item captures a formal feasibility decision and, if justified, a narrowly
  scoped DataFrame subset.

