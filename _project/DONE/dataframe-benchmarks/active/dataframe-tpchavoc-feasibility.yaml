sections:
  "Decision": |
    No-go for broad DataFrame implementation.

  "Rationale": |
    TPC-Havoc is intentionally optimizer-focused: syntax variants and SQL planner
    behavior are the signal under test. DataFrame APIs bypass SQL parsing and most
    optimizer pathways being measured.

  "Scope Boundary": |
    Keep TPC-Havoc SQL-only for this initiative. Revisit only if a future objective
    explicitly targets DataFrame optimizer-plan behavior with equivalent semantics.
