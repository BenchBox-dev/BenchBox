impact:
  business_value: |
    Brings DataFusion DataFrame read_primitives from 72% to 97% pass rate (141/146 queries).
    This unblocks comprehensive cross-platform DataFrame benchmarking with DataFusion as a
    first-class citizen alongside Polars and PySpark.
  user_impact: |
    Users can run the full read_primitives benchmark suite on DataFusion without 41 noisy
    failures. Enables fair performance comparison between DataFusion, Polars, and PySpark
    on identical query workloads.
  technical_debt: |
    Fixes architectural gaps in the unified DataFrame layer (join equality decomposition,
    unique subset, missing window functions) that would affect any future benchmark adding
    similar query patterns. The window function additions (lag, lead, ntile, percent_rank,
    cume_dist) benefit all future query implementations.

success_metrics:
  - "DataFusion read_primitives passes >= 140 of 146 queries (up from 105)"
  - "No Polars read_primitives regressions"
  - "All existing DataFusion unit tests continue to pass"
  - "New window functions (lag, lead, ntile, percent_rank, cume_dist) work on both DataFusion and Polars"

