deferred:
  - summary: "Full string_to_array support (returning actual list expressions, not split_part proxy)"
    reason:
      "DataFusion v50 Python bindings lack string_to_array. Current proxy handles .split().list.get(n) pattern. Full support
      needs upstream contribution or UDF."
  - summary: "array_sum / list.sum() for DataFusion"
    reason:
      "No array_sum function in DataFusion v50. Would need unnest+aggregate workaround which is complex in expression
      context. Skipped for now."
  - summary: "array_distinct Arrow type normalization"
    reason:
      "DataFusion array_distinct returns Dictionary(Int32,Utf8) instead of Utf8 elements. This is a DataFusion bug - skip
      until upstream fix."

