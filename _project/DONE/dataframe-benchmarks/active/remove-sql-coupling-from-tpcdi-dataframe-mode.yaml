- "run_full_benchmark() and all SQL-mode TPC-DI entry points remain unbroken"
- "get_dataframe_etl_capabilities() capability checking remains functional"
- "TPC-DI stage result schema (query_id, status, execution_time, records_processed, records_loaded, rows_returned, first_row)
