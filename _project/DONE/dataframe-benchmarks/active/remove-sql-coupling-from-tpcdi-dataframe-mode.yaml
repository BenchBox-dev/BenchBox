context_sections:
  "Predecessor": |
    The completed TODO "Unify TPC-DI SQL/DataFrame Execution Contract" (b79b3889)
    unified the SQL and DataFrame paths through a shared _execute_etl_stage_queries()
    method but introduced SQLConnectionProvider - requiring DataFrame adapters to
    expose SQL connections. This was identified as a fundamental architectural defect
    in review: DataFrame mode should never touch SQL.

  "What Already Exists for Reuse": |
    1. DataFrameMaintenanceOperations protocol (maintenance_interface.py:300-427)
       with insert_rows, delete_rows, update_rows, merge_rows
    2. Concrete implementations for Polars, Delta Lake, Iceberg, DuckLake, Hudi, PySpark
    3. get_maintenance_operations_for_platform() factory (maintenance_interface.py:783-866)
    4. DataFrameMaintenanceCapabilities with supports_transactions, supports_insert, etc.
    5. WritePrimitivesBenchmark.execute_dataframe_workload() as a pattern for
       capability-driven DataFrame workloads
    6. FinWireProcessor and CustomerManagementXMLParser are already SQL-free parsers
    7. TransformationRule ABC and DataTypeTransformation are pure pandas logic
    8. get_dataframe_etl_capabilities() already queries the maintenance interface

  "Definition of Done": |
    - DataFrame TPC-DI path uses DataFrameMaintenanceOperations exclusively (no SQL)
    - SQL TPC-DI path works identically to before via SQLETLBackend
    - Both paths share Extract + Transform orchestration
    - SQLConnectionProvider and get_sql_connection removed from codebase
    - Transform produces DataFrames directly (no intermediate CSV files)
    - All tests pass including new backend-specific tests

success_metrics:
- "TPC-DI DataFrame workload executes without any SQL connection"
- "SQLETLBackend passes all existing SQL-path TPC-DI tests"
- "DataFrameETLBackend delegates to DataFrameMaintenanceOperations for all writes"
- "Zero references to SQLConnectionProvider or get_sql_connection in benchbox/"
- "Transform phase has zero intermediate file I/O (DataFrames flow directly to Load)"
