impact:
  business_value: |
    Enables TPC-DI DataFrame benchmarking on platforms that have no SQL connection
    (Polars, Delta Lake, Iceberg, etc.) using their native write operations. Currently
    these platforms cannot run TPC-DI in DataFrame mode because the code requires a
    SQL connection that doesn't exist.
  technical_debt: |
    Removes a fundamental architectural violation where the DataFrame subsystem
    (benchbox/core/dataframe/) exposes SQL concepts (SQLConnectionProvider,
    get_sql_connection). Eliminates double CSV serialization in the Transform phase.
    Establishes a clean backend protocol for mode-specific ETL execution.

