id: unify-tpcdi-sql-dataframe-execution-contract
title: Unify TPC-DI SQL/DataFrame Execution Contract and ETL Path
worktree: dataframe-benchmarks
priority: Critical
status: Completed
completed_date: "2026-02-07"
description: "TPC-DI currently exposes separate execution paths for SQL and DataFrame modes,

  and DataFrame mode discovers platform SQL connections via attribute sniffing.

  This creates correctness risk (behavioral drift between modes), weakens

  adapter contracts, and complicates future maintenance.


  This TODO standardizes TPC-DI execution on one shared ETL orchestration path,

  introduces an explicit connection-provider contract for DataFrame adapters,

  and removes ambiguous API behavior in execute_dataframe_workload().


  Scope focuses on runtime correctness and contract clarity for TPC-DI.

  "
category: Core Functionality
tasks:
  phases:
    - phase: "Phase 1: Contract Design and Baseline"
      done: true
      items:
        - summary: Define explicit SQL connection-provider contract for DataFrame execution
          done: true
          subtasks:
            - summary: Add protocol/interface in core dataframe abstractions for SQL-capable connection access
              done: true
            - summary: Document required adapter behavior and failure semantics when connection is unavailable
              done: true
        - summary: Map current TPC-DI SQL and DataFrame execution flow divergence
          done: true
          subtasks:
            - summary: Trace call graph for run_full_benchmark/run_etl_benchmark vs execute_dataframe_workload
              done: true
            - summary: Identify reusable ETL orchestration boundary and canonical result mapping layer
              done: true
    - phase: "Phase 2: Shared ETL Orchestration Implementation"
      done: true
      items:
        - summary: Refactor TPC-DI execution to a single shared ETL orchestration path
          done: true
          subtasks:
            - summary: Implement one canonical ETL executor used by both SQL and DataFrame entry points
              done: true
            - summary: Ensure stage ordering, batch processing, validation hooks, and failure handling are identical across modes
              done: true
            - summary: Keep mode-specific output shaping as thin adapters around shared execution results
              done: true
        - summary: Replace attribute sniffing with explicit contract usage in DataFrame path
          done: true
          subtasks:
            - summary: Use connection-provider protocol instead of hasattr(adapter, 'connection') / ctx.sql_connection checks
              done: true
            - summary: Emit deterministic, user-actionable errors for missing/invalid connection providers
              done: true
        - summary: Remove misleading parameter discard in execute_dataframe_workload
          done: true
          subtasks:
            - summary: Delete `_ = (ctx, monitor, run_options)` and align usage/docs with actual behavior
              done: true
            - summary: Either wire monitor/run_options into execution hooks or explicitly mark reserved parameters in docstring
              done: true
    - phase: "Phase 3: Verification and Regression Defense"
      done: true
      items:
        - summary: Add parity tests proving SQL/DataFrame consistency
          done: true
          subtasks:
            - summary: Add tests asserting shared stage outputs (status, ordering, metrics fields) for SQL and DataFrame entry points
              done: true
            - summary: Add failure-path parity tests (missing connection, stage exception, validation failure)
              done: true
        - summary: Add contract tests for adapter connection-provider protocol
          done: true
          subtasks:
            - summary: Verify compliant adapters pass and non-compliant adapters fail with explicit errors
              done: true
            - summary: Cover at least one expression-family and one pandas-family adapter behavior
              done: true
        - summary: Run targeted and broad quality gates
          done: true
          subtasks:
            - summary: Run TPC-DI unit suite and DataFrame adapter interaction tests
              done: true
            - summary: Run lint and typecheck to confirm contract and API consistency
              done: true
