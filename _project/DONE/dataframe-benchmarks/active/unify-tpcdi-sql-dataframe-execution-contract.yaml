impact:
  business_value: "Prevents silent correctness drift between SQL and DataFrame TPC-DI results,

    improving trust in benchmark outcomes and reducing regression/debug costs.

    "
  user_impact: "Users get deterministic behavior from TPC-DI regardless of execution mode,

    with clearer errors when a platform cannot provide required capabilities.

    "
  technical_debt: "Consolidates duplicated orchestration logic and replaces ad-hoc connection

    discovery with an explicit, testable contract.

    "
files_affected:
  modified:
    - benchbox/core/tpcdi/benchmark.py
    - benchbox/core/tpcdi/etl/pipeline.py
    - benchbox/core/dataframe/context.py
    - benchbox/platforms/dataframe/benchmark_mixin.py
    - tests/unit/core/tpcdi/test_tpcdi_dataframe_workload.py
    - tests/unit/core/tpcdi/test_tpcdi_pipeline.py
    - tests/unit/core/runner/test_dataframe_runner.py
  added:
    - tests/unit/core/tpcdi/test_tpcdi_sql_dataframe_parity.py
    - tests/unit/platforms/dataframe/test_connection_provider_contract.py
must_preserve:
  - TPC-DI transactional capability gating (transactions + incremental + SCD2) remains enforced before ETL stage execution
  - Existing TPC-DI benchmark metrics export structure remains backward-compatible for existing result consumers
  - DataFrame benchmark mixin query filtering semantics remain unchanged for non-TPC-DI benchmarks
approach: "Establish a canonical TPC-DI ETL executor boundary first, then route both

  SQL and DataFrame entry points through it. Keep mode-specific behavior limited

  to connection acquisition and output envelope formatting.


  Introduce a connection-provider protocol in core dataframe abstractions, update

  adapters/contexts to satisfy it, and remove fallback/sniffing logic. Then add

  parity tests that compare stage-level outcomes from SQL and DataFrame callers

  under controlled fixtures.

  "
anti_patterns:
  - DO NOT keep separate ETL orchestration logic for SQL and DataFrame paths - because drift is the root issue - route both
    through one shared executor
  - DO NOT use hasattr/getattr sniffing for connection discovery - because adapter behavior is implicit and brittle - enforce
    a typed provider contract
  - DO NOT encode mode-specific semantics in shared ETL internals - because this recreates divergence - isolate mode differences
    to thin adapters
verification:
  - description: TPC-DI DataFrame workload tests pass with contract-based connection resolution
    command: uv run -- python -m pytest tests/unit/core/tpcdi/test_tpcdi_dataframe_workload.py -q
    expected_output: all tests pass
  - description: TPC-DI SQL/DataFrame parity tests pass
    command: uv run -- python -m pytest tests/unit/core/tpcdi/test_tpcdi_sql_dataframe_parity.py -q
    expected_output: all tests pass
  - description: Connection-provider contract tests pass
    command: uv run -- python -m pytest tests/unit/platforms/dataframe/test_connection_provider_contract.py -q
    expected_output: all tests pass
  - description: Lint and typecheck are clean for touched files
    command: make lint && make typecheck-uv
    expected_output: lint passes; no new type diagnostics in changed files
scope_limit:
  only_modify:
    - benchbox/core/tpcdi/
    - benchbox/core/dataframe/
    - benchbox/platforms/dataframe/
    - tests/unit/core/tpcdi/
    - tests/unit/platforms/dataframe/
  do_not_modify:
    - benchbox/core/tpch/
    - benchbox/core/tpcds/
    - benchbox/cli/
success_metrics:
  - SQL and DataFrame TPC-DI entry points execute through one shared ETL orchestration implementation
  - No direct adapter/context attribute sniffing remains in TPC-DI DataFrame connection resolution
  - Stage-level outputs (status, timing key fields, record counters) are parity-validated between SQL and DataFrame modes
  - No misleading unused-parameter discard remains in execute_dataframe_workload()
open_questions:
  - Should DataFrame mode surface ETL result envelopes identical to SQL mode or retain query-style wrappers for benchmark runner
    compatibility?
  - Which adapter/context layer is the right long-term owner of SQL connection provider responsibilities?
sections:
  Implementation Summary:
    "Completed unification of TPC-DI SQL/DataFrame execution contracts and ETL\norchestration behavior.\n\
    \nDelivered:\n- Explicit `SQLConnectionProvider` contract in DataFrame core abstractions.\n- Shared ETL stage executor\
    \ reuse between SQL (`run_etl_benchmark`) and\n  DataFrame (`execute_dataframe_workload`) entry points.\n- Deterministic\
    \ connection-resolution errors based on explicit contract\n  rather than attribute sniffing.\n- Added SQL/DataFrame parity\
    \ tests and connection-provider contract tests.\n- Corrected DataFrame skip summary semantics by using a dedicated\n \
    \ `dataframe_skip_summary` field, preserving row-count validation semantics."
