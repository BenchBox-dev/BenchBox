sections:
  Decision: No-go for broad DataFrame implementation.
  Rationale: 'JoinOrder benchmark value comes from SQL optimizer join-order behavior.

    In DataFrame workloads, join order is commonly encoded explicitly in query code,

    so the benchmark no longer tests the same concern.'
  Scope Boundary: 'Keep JoinOrder SQL-only for this initiative. If revisited, define a separate

    DataFrame-specific benchmark objective rather than mirroring SQL JoinOrder.'
