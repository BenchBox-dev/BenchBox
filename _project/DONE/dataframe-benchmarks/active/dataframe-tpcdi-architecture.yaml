description: 'Define a dedicated architecture for TPC-DI DataFrame support.


  TPC-DI includes mutation-heavy ETL semantics (SCD Type 2, incremental loads,

  stateful transforms) that do not fit the current read-oriented DataFrameQuery/

  DataFrameContext pattern used for analytical query benchmarks.


  This item designs a fit-for-purpose model before implementation.

  '
