sections:
  Decision Summary: "Decision: implement TPC-DI DataFrame support through a dedicated ETL execution\npath, not through QueryRegistry/DataFrameQuery.\n\
    \nRationale:\n- TPC-DI workload is mutation/state oriented (dimension SCD2 versioning,\n  incremental loads, quality checks,\
    \ multi-table pipeline stages).\n- Existing `DataFrameContext` contract is query-shaped and read-oriented."
  Architecture Boundaries: "Proposed boundaries:\n- Keep existing SQL benchmark query execution path unchanged.\n- Add a TPC-DI-specific\
    \ DataFrame ETL orchestrator interface for staged writes,\n  checkpointing, and validation hooks.\n- Platform adapters\
    \ expose capability flags for transactional semantics and\n  persistence guarantees used by ETL stages."
  Validation Strategy: 'Require parity checks at pipeline stage boundaries:

    - Row-count and key-integrity checks per stage/table.

    - SCD2 invariants (current-row uniqueness, valid effective/end ranges).

    - Deterministic replay checks for incremental batches.'
  Evidence: 'Repository state confirms no benchmark-level DataFrame execution entry points

    in `benchbox/core/tpcdi/benchmark.py`; current code is ETL-centric and pandas

    data processing oriented.'
  Output: 'Created follow-on implementation TODO:

    `_project/TODO/dataframe-benchmarks/planning/implement-tpcdi-dataframe-pipeline.yaml`.'
