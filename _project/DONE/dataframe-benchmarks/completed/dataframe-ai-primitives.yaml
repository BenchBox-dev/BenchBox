completion_summary: |
  Implemented DataFrame operations module for AI Primitives benchmark, enabling
  benchmarking of AI/ML operations on DataFrame platforms using local models.

  **Key Deliverables:**
  - Created `benchbox/core/ai_primitives/dataframe_operations.py` with:
    - AIOperationType enum (11 operation types)
    - AIModelCapabilities class for ML library detection
    - DataFrameAICapabilities class for platform capabilities
    - DataFrameAIResult dataclass for operation results
    - DataFrameAIOperationsManager class for executing operations
    - Core operations: embeddings, sentiment, classification, entities, similarity
  - Updated `benchbox/core/ai_primitives/benchmark.py` with DataFrame methods:
    - supports_dataframe_mode()
    - get_dataframe_operations()
    - get_dataframe_skip_queries()
    - get_dataframe_supported_queries()
  - Created comprehensive unit tests (32 tests, all passing)

  **Scope:**
  - In scope (8 queries): embedding_single/batch/large_dimension, nlp_sentiment_single/batch,
    nlp_classify_priority/segment, nlp_entity_extraction
  - Out of scope (8 queries): generative_* and transform_* queries (require LLM API)

  **Dependencies handled gracefully:**
  - sentence-transformers (optional): for embeddings
  - textblob (optional): for sentiment analysis
  - spacy (optional): for entity extraction
  - Capability detection provides clear error messages with install commands

description: |
  Implement DataFrame versions of AI Primitives benchmark operations. The current
  benchmark has **16 SQL queries** across 4 categories testing AI/ML functions:

  **Categories (16 queries total):**
  - Generative (4): text completion, customer profile summary, Q&A, SQL generation
  - NLP (5): sentiment analysis (single/batch), classification (priority/segment), entity extraction
  - Transform (4): summarization (short/long), translation, grammar correction
  - Embedding (3): single embedding, batch embeddings, large-dimension embeddings

  **DataFrame Implementation Approach:**
  The SQL benchmark uses platform-specific AI functions (Snowflake Cortex, BigQuery ML,
  Databricks AI). DataFrame implementations would use:

  - **PySpark MLlib**: Native ML functions, model inference pipelines
  - **Sentence Transformers**: For embeddings via Hugging Face integration
  - **Polars + NumPy**: Vector operations, embedding similarity
  - **Pandas + scikit-learn**: Classification, NLP pipelines

  Not all 16 SQL queries translate directly - generative queries require LLM APIs
  while embedding/vector operations map well to DataFrame native operations.

context_sections:
  "Background and Motivation": |
    AI/ML workloads are increasingly run on DataFrame platforms:
    - Feature engineering pipelines (Pandas, Polars)
    - Distributed model training (PySpark MLlib)
    - Vector similarity for recommendations
    - Embedding generation and similarity search

    The SQL AI Primitives benchmark tests cloud-platform AI functions. DataFrame
    implementations enable the same benchmarks on local/OSS ML stacks.

  "Technical Context": |
    Current AI Primitives implementation (`benchbox/core/ai_primitives/`):
    - 16 SQL queries in `catalog/queries.yaml`
    - Platform variants for Snowflake, BigQuery, Databricks
    - Categories: generative (4), nlp (5), transform (4), embedding (3)
    - Uses TPC-H data via get_data_source_benchmark() returning "tpch"

    DataFrame ML integrations available:
    - PySpark MLlib: VectorAssembler, ML pipelines, model inference
    - Sentence Transformers: Embedding generation (Hugging Face)
    - spaCy/TextBlob: NLP (sentiment, entity extraction)
    - scikit-learn: Classification, text vectorization

  "Platform Capability Matrix": |
    | Operation           | PySpark MLlib | Polars+NumPy | Pandas+sklearn | Requires LLM API |
    |---------------------|---------------|--------------|----------------|------------------|
    | Text completion     | X             | X            | X              | Y                |
    | Sentiment analysis  | Y spark-nlp   | Y textblob   | Y textblob     | X                |
    | Classification      | Y ML pipeline | Y sklearn    | Y sklearn      | X                |
    | Entity extraction   | Y spark-nlp   | Y spacy      | Y spacy        | X                |
    | Summarization       | X             | X            | X              | Y                |
    | Translation         | X             | X            | X              | Y                |
    | Embedding (768d)    | Y sentence-tr | Y sentence-tr| Y sentence-tr  | X                |
    | Vector similarity   | Y native      | Y numpy      | Y numpy        | X                |

    Generative/transform queries (8 of 16) require LLM API integration.
    Embedding/NLP queries (8 of 16) can use local models.

  "Scope Constraints": |
    **In Scope (8 queries - local model support):**
    - Sentiment analysis (nlp_sentiment_single, nlp_sentiment_batch)
    - Classification (nlp_classify_priority, nlp_classify_segment)
    - Entity extraction (nlp_entity_extraction)
    - Embedding generation (embedding_single, embedding_batch, embedding_large_dimension)

    **Out of Scope (8 queries - require LLM API):**
    - Text completion (generative_complete_simple, generative_complete_customer_profile)
    - Question answering (generative_question_answer)
    - SQL generation (generative_sql_generation)
    - Summarization (transform_summarize_short, transform_summarize_long)
    - Translation (transform_translate_comment)
    - Grammar correction (transform_grammar_fix)

    Out-of-scope queries could be added later with optional LLM API integration
    (OpenAI, Anthropic, local Ollama) as a separate enhancement.

