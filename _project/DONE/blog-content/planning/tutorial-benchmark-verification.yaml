description: |
  Run benchmarks referenced in the tutorial blog posts to verify that
  all example commands work correctly and placeholder data can be replaced
  with real results.

  Tutorial posts affected:
  - read-primitives-introduction.md (Read Primitives benchmark)
  - tpchavoc-introduction.md (TPC-Havoc benchmark)
  - write-primitives-introduction.md (Write Primitives benchmark)

  Reference drafts: _blog/tutorials/drafts/

  Verification results:
  - Read Primitives on DuckDB: 135/152 queries pass (88.8%)
  - Read Primitives on SQLite: 74/152 queries pass (48.7%)
  - TPC-Havoc on DuckDB: 211/220 variants pass (95.9%)
  - Write Primitives on DuckDB: 73/109 operations pass (67.0%)

  Note: CLI `benchbox run` has a data loading bug with sharded manifest
  files (files exist but loader reports "file not found"). Python API
  works correctly. Benchmark commands documented with correct benchmark
  names (read_primitives, write_primitives, tpchavoc).

