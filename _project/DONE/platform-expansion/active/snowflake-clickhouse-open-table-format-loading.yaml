id: snowflake-clickhouse-open-table-format-loading
title: "Finish delta/iceberg loading gaps for Snowflake and ClickHouse adapter modes"
worktree: main
priority: Medium
status: Completed
description: |
  Snowflake and ClickHouse both support open table formats on the platform but their
  BenchBox adapters only load parquet/CSV.  These platforms were removed from
  DELTA_CAPABILITY and ICEBERG_CAPABILITY in format_capabilities.py (commit 9be7d5b70)
  to prevent the fail-fast check from passing when loading would fail.

  Completed closure:
  - Snowflake external Iceberg now maps staging_root into BASE_LOCATION and only
    advertises support when the required external volume config is present.
  - ClickHouse capability registration now distinguishes ClickHouse Cloud from
    ClickHouse Local/Server in format selection.
  - Snowflake Delta remains external-mode only and is advertised only when the run
    has the required external-table configuration.

category: Platform Expansion

deps:
  needs: []

work:
  - id: w1
    summary: "Finish Snowflake Iceberg loading as an end-to-end usable BenchBox path"
    status: done
    details: |
      Ensure Snowflake external Iceberg support has a clear, testable mapping between
      BenchBox staging_root and the configured external volume/base location.  The final
      implementation must be safe enough to advertise through capability selection.

  - id: w2
    summary: "Keep ClickHouse Cloud Iceberg loading path and tests green"
    status: done
    details: |
      ClickHouse Cloud external-table support via iceberg() on S3/GCS has prototype
      coverage and should remain preserved while the broader capability/model split is
      resolved.

  - id: w3
    summary: "Establish whether Snowflake Delta has a BenchBox-usable supported path"
    needs: [w1]
    status: done
    details: |
      Research Snowflake Delta Lake support (external tables or Delta Direct) and add
      loading code only if it can be exposed safely through BenchBox configuration.
      Lower priority than Iceberg.
      Snowflake external tables continue to use TABLE_FORMAT=DELTA for Delta directories.
      BenchBox now only advertises this path in external mode.

  - id: w4
    summary: "Make capability registration mode-aware or keep it conservative"
    needs: [w1, w2]
    status: done
    details: |
      Re-register Snowflake and ClickHouse only after BenchBox can safely map format
      support to the right adapter mode.  ClickHouse Cloud and ClickHouse Local/Server
      must not share a misleading capability result.

  - id: w5
    summary: "Expand tests to cover final Snowflake/ClickHouse closure criteria"
    needs: [w1, w2]
    status: done
    details: |
      Keep the existing mock-based ClickHouse Cloud coverage and add the missing tests
      required for final Snowflake closure and any mode-aware capability registration.

deferred:
  - id: d1
    summary: "Integration tests with real Snowflake/ClickHouse instances"
    reason: "Requires cloud credentials and running instances"
  - id: d2
    summary: "ClickHouse Delta support via conversion or external tooling"
    reason: "ClickHouse lacks native Delta support; would need Parquet conversion layer"

must_preserve:
  - "Snowflake parquet/CSV COPY INTO loading path must remain unchanged"
  - "ClickHouse Cloud parquet loading via S3/GCS staging must remain unchanged"
  - "format_capabilities.py fail-fast check: only re-register after loading code works"

approach: |
  Snowflake Iceberg: Use CREATE ICEBERG TABLE or ALTER TABLE ... SET TABLE_FORMAT = ICEBERG
  with external volume pointing to staged data.  Reference Snowflake docs for Iceberg
  Tables support.

  ClickHouse Iceberg: Use iceberg() table function to read Iceberg data from S3/GCS.
  Example: SELECT * FROM iceberg('s3://bucket/path/', ...) to create table from Iceberg.

  Delta support for both platforms is lower priority - Iceberg is the primary open table
  format for both.

anti_patterns:
  - "DO NOT register platforms in format_capabilities.py before loading code is tested -- because the fail-fast check will pass but load will fail at runtime -- implement and test first"
  - "DO NOT attempt Delta loading for ClickHouse -- because ClickHouse has no native delta support -- focus on Iceberg only"

verification:
  - description: "Snowflake and ClickHouse adapter tests pass"
    command: "uv run -- python -m pytest tests/unit/platforms/ -v -k 'snowflake or clickhouse' --no-header -q"
    expected_output: "All tests pass"
  - description: "Format capabilities tests pass with re-registered platforms"
    command: "uv run -- python -m pytest tests/unit/platforms/base/test_format_capabilities.py -v --no-header -q"
    expected_output: "All tests pass"

scope_limit:
  only_modify:
    - "benchbox/platforms/snowflake.py"
    - "benchbox/platforms/clickhouse_cloud.py"
    - "benchbox/platforms/base/format_capabilities.py"
    - "tests/unit/platforms/"
