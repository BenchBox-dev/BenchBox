id: deployment-config-inheritance
title: "Platform Configuration Inheritance"
worktree: platform-expansion
priority: Medium
status: Completed
completion_date: "2026-01-26"
category: Core Functionality
description: |
  Implement configuration inheritance system allowing child platforms to inherit
  SQL dialect, benchmark compatibility, and data type mappings from parent platforms.

  This enables MotherDuck to automatically inherit DuckDB's SQL dialect and
  benchmark query translations, while having its own connection configuration.

context_sections:
  "Background and Motivation": |
    When we add MotherDuck as a platform, it should automatically use DuckDB's
    SQL dialect and benchmark query compatibility without duplicating configuration.
    Similarly, Starburst should inherit from Trino, and ClickHouse Cloud should
    share configuration with ClickHouse server.

    This inheritance system prevents configuration drift and ensures consistent
    benchmark results across deployment variants of the same database engine.

  "Technical Context": |
    The PlatformCapability.inherits_from field establishes parent-child relationships.
    A new config_inheritance module resolves inherited configuration at runtime.

    What inherits:
    - SQL dialect identifier (for query translation)
    - Benchmark compatibility (which benchmarks/queries are supported)
    - Data type mappings (DECIMAL precision, timestamp handling)

    What does NOT inherit:
    - Connection configuration (auth, endpoints)
    - Credential requirements
    - Cloud storage settings

