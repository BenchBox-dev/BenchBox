impact:
  business_value: |
    Validates the deployment registry pattern with real-world adapters,
    providing reference implementations for future adapter development.
  user_impact: |
    Users gain consistent deployment mode syntax across all platforms
    (clickhouse:cloud, firebolt:cloud) instead of platform-specific config keys.
  technical_debt: |
    Eliminates ad-hoc mode handling in adapters, centralizing deployment
    awareness in the registry and factory.

