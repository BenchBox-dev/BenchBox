context_sections:
  "Background and Motivation": |
    During investigation of compression handling in the Athena adapter, research
    revealed that while Athena Engine v3 supports zstd compression for TEXTFILE,
    querying text files is inherently slow due to full data scans.

    AWS recommends using CTAS to convert text data to Parquet for production
    workloads, which can reduce data scanned by 100x or more.

  "Research Findings": |
    From AWS documentation:
    - Text table scan: 20 GB, 3.64 seconds
    - Parquet table scan: 135 MB, 2.62 seconds (148x less data scanned)

    CTAS syntax:
    CREATE TABLE ctas_parquet WITH (format='PARQUET', external_location='s3://...')
    AS SELECT * FROM staging_text_table

    Athena automatically adds CTAS results to Glue Data Catalog.

