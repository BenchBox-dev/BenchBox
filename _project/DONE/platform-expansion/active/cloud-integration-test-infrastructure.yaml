guardrails:
  verification:
    command: "uv run -- python -m pytest -m 'fast and not (slow or stress or resource_heavy or live_integration)' --tb=short -q"
    expected: "All existing fast tests pass unchanged — new markers and conftest additions must not interfere"
  must_preserve:
  - "Existing pytest markers (fast, slow, stress, live_integration, docker_integration) and their exclusion expressions in Makefile and pytest.ini"
  - "tests/integration/platforms/conftest.py — skip_unless_docker_service() and get_env_or_skip() helpers"
  - "tests/e2e/utils.py — has_cloud_credentials() helper"
  - "make test-fast marker expression: 'fast and not (slow or stress or resource_heavy or live_integration)'"
  approach: |
    Follow the existing live test pattern established in test_starrocks_live.py:
    1. pytestmark list with [integration, docker_integration/live_integration, live_<platform>]
    2. Use get_env_or_skip() for cloud credential env vars
    3. Use skip_unless_docker_service() for Docker-based platforms
    4. Each platform gets its own test file under tests/integration/platforms/
    New per-platform markers (live_firebolt, live_starburst, etc.) should be
    registered in pyproject.toml [tool.pytest.ini_options] markers list.
  anti_patterns:
  - "DO NOT add cloud credential checks to the root tests/conftest.py — use per-platform conftest or test-level skips — because global conftest pollution breaks offline test runs and slows xdist worker startup"
  - "DO NOT create a new marker scheme — because live_integration already exists and is wired into Makefile/pytest.ini exclusions; adding a parallel 'cloud_integration' marker would fragment the skip logic"
  - "DO NOT make live tests depend on specific data at specific scale factors — because cloud accounts may have varying data; use TPC-H SF=0.01 Q1 as the universal smoke query"
  scope_limit:
  - "Only add test files and per-platform conftest fixtures — do not modify adapter implementation code"
  - "Do not change existing Makefile marker expressions or pytest.ini addopts"

work:
- id: w0
  summary: "Research — inventory cloud accounts, document provisioning steps, estimate costs"
  status: done
  notes: |
    Produce a provisioning checklist covering:
    1. Which accounts already exist (check for env vars / config files)
    2. Minimum viable setup per platform (free tier? trial? Docker alternative?)
       - StarRocks: Docker Compose (free, local) — already has docker/starrocks/
       - pg_duckdb / pg_mooncake: Docker (free, local)
       - MotherDuck: free tier available (10 GB)
       - Firebolt: trial account required
       - Starburst Galaxy: trial account required
    3. Required env vars per platform for skip-when-unavailable logic
    4. Estimated monthly cost for platforms without free tiers
    5. Recommendation: prioritize Docker-based tests (free) first, then
       free-tier cloud, then paid-tier cloud
    Decision: Docker-based tests (w7) should run in CI from the start since
    they are free and deterministic. Cloud tests remain local-only until
    credentials are available in CI secrets.

