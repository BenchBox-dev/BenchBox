impact:
  business_value: |
    Enables direct comparison of DuckDB local vs MotherDuck cloud performance,
    a key use case for users evaluating cloud migration. MotherDuck is a
    high-profile platform in the analytics community.
  user_impact: |
    Users can benchmark MotherDuck alongside local DuckDB with minimal
    configuration, using the same benchmarks and query set.

