success_metrics:
- "MotherDuck adapter passes connection test"
- "TPC-H benchmark runs successfully at scale 0.01"
- "Results are comparable with local DuckDB (same query plans)"
- "Authentication works via env var and config file"
- "Error messages are actionable for common issues"

must_preserve:
- "DuckDB adapter (benchbox/platforms/duckdb.py) unchanged"
- "Platform registry backward compatible with existing platform names"
- "No new required runtime dependencies beyond duckdb>=0.9.0"

anti_patterns:
- "DO NOT modify duckdb.py — because MotherDuck inherits from DuckDB but is a separate platform — keep all MotherDuck-specific
  code in motherduck.py"
- "DO NOT require MotherDuck account for unit tests — because CI has no cloud credentials — mock the md: connection string
  in tests"

verification:
- description: "MotherDuck adapter imports correctly"
  command: "uv run -- python -c \"from benchbox.platforms.motherduck import MotherDuckAdapter; print('import OK')\""
  expected_output: "import OK"
- description: "Unit tests pass"
  command: "uv run -- python -m pytest tests/unit/platforms/test_motherduck.py -v --tb=short"
  expected_output: "all tests pass, 0 failures"
- description: "DuckDB adapter unaffected"
  command: "uv run -- python -m pytest tests/unit/platforms/test_duckdb*.py -v --tb=short"
  expected_output: "all tests pass, 0 failures"

scope_limit:
  only_modify:
  - "benchbox/platforms/motherduck.py"
  - "tests/unit/platforms/test_motherduck.py"
  do_not_modify:
  - "benchbox/platforms/duckdb.py"

