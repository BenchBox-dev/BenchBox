id: platform-adapter-benchmark-correctness
title: "Fix benchmark correctness issues in Databend, Doris, and pg_duckdb adapters"
worktree: platform-expansion
priority: Critical
status: Completed
completed_date: "2026-02-15"
description: |
  Adversarial code reviews identified three issues that directly corrupt benchmark
  measurement accuracy — the core purpose of BenchBox:

  1. **Databend result cache never disabled** (PR #29): disable_result_cache=True is
     stored but never applied. Queries may return cached results, inflating performance
     numbers. Must execute SET enable_query_result_cache = 0.

  2. **Databend USE database included in query timing** (PR #29): execute_query() starts
     the timer, then issues USE database before the actual query. Network latency of the
     USE statement contaminates every query measurement.

  3. **Doris SET global modifies cluster-wide settings** (PR #30): configure_for_benchmark()
     uses SET global (e.g., SET global enable_sql_cache = false, SET global
     parallel_fragment_exec_instance_num = 8). This modifies settings for ALL sessions on
     the cluster, not just the benchmark session. If another workload is running, it gets
     disrupted. Should use session-level SET without the global keyword.

  These are Critical priority because they silently produce wrong benchmark results —
  the most dangerous class of bug in a benchmarking tool.

category: Platform Expansion

work:
- id: w1
  summary: "Fix Databend: apply disable_result_cache in configure_for_benchmark() or create_connection()"
  status: done
  notes: "databend/adapter.py:128, 640-648 — execute SET enable_query_result_cache = 0"

- id: w2
  summary: "Fix Databend: move USE database out of timed query execution"
  status: done
  notes: "databend/adapter.py:506-510 — issue USE during connection setup, or start timer after USE"

- id: w3
  summary: "Fix Doris: change SET global to session-level SET in configure_for_benchmark()"
  status: done
  notes: "doris.py:544, 550, 556 — remove 'global' keyword from SET statements"

- id: w4
  summary: "Add tests verifying cache disable and timing isolation"
  needs: [w1, w2, w3]
  status: done
  notes: "Verify SET statements are issued; verify timer starts after USE"

metadata:
  tags:
  - benchmark-correctness
  - timing
  - cache
  - measurement-accuracy
  - code-review-finding
  estimated_effort: 1 day
  created_date: "2026-02-15"
  owners:
  - joe

must_preserve:
- "Databend execute_query() returns correct result format with execution_time_seconds"
- "Doris configure_for_benchmark() still disables caches and sets parallel execution"
- "All existing Databend and Doris adapter tests pass"

approach: |
  Databend cache: Add SET statement in configure_for_benchmark() body,
  following the pattern used by DuckDB adapter's configure_for_benchmark().

  Databend timing: Move USE database into create_connection() after connection
  is established, before returning. Remove from execute_query().

  Doris: Simple text replacement — remove 'global ' from each SET statement
  in configure_for_benchmark().

anti_patterns:
- "DO NOT add timing workarounds — because the timer should measure only the query — move the USE statement to connection
  setup"
- "DO NOT add global settings back as a configurable option — because session-level settings are always correct for benchmarking
  — remove global entirely"

verification:
- description: "Databend adapter tests pass"
  command: "uv run -- python -m pytest tests/unit/platforms/test_databend_adapter.py -v --tb=short"
  expected_output: "all tests pass"
- description: "Doris adapter tests pass"
  command: "uv run -- python -m pytest tests/unit/platforms/test_doris_adapter.py -v --tb=short"
  expected_output: "all tests pass"

scope_limit:
  only_modify:
  - "benchbox/platforms/databend/adapter.py"
  - "benchbox/platforms/doris.py"
  - "tests/unit/platforms/test_databend_adapter.py"
  - "tests/unit/platforms/test_doris_adapter.py"
  do_not_modify:
  - "benchbox/core/runner.py"
  - "benchbox/core/timing.py"
