  constraints:
    - "Must use FlightSQL/SQL for queries (not deprecated Flux)"
    - "Support InfluxDB 3.x (not 1.x/2.x which use different protocols)"
    - "Handle InfluxDB's leading-edge optimization for benchmarking"
    - "Nanosecond timestamp precision for time series accuracy"
  dependencies:
    - "influxdb3-python or flightsql-dbapi Python client"
    - "pyarrow for Arrow data handling"
    - "Docker for integration testing"
  compatibility: |
    - InfluxDB 3 Core (open source): Primary target
    - InfluxDB 3 Enterprise: Should work via same FlightSQL API
    - InfluxDB Cloud (Serverless/Dedicated/Clustered): Should work with token auth
    - Requires Python 3.9+ (same as BenchBox)

