description: |
  Implement InfluxDB adapter for BenchBox to support time series benchmarking workloads.

  InfluxDB 3.x is a time series database built on Apache Arrow, DataFusion, and Parquet
  (the FDAP stack). It supports native SQL queries via FlightSQL protocol, making it
  a good fit for BenchBox's SQL-based benchmarking approach.

  Primary use case: Running TSBS (Time Series Benchmark Suite) DevOps workloads against
  InfluxDB to benchmark time series query performance alongside other platforms like
  ClickHouse, TimescaleDB, and DuckDB.

context_sections:
  "InfluxDB 3.x Architecture": |
    InfluxDB 3.x represents a fundamental re-architecture:
    - Built on Rust with Apache Arrow, DataFusion, Parquet (FDAP stack)
    - Decoupled compute and storage (object storage/local disk)
    - Native SQL support via FlightSQL protocol
    - InfluxQL also supported (for backward compatibility)
    - Flux query language deprecated (maintenance mode only)

    Key versions:
    - InfluxDB 3 Core/Edge: Open source (April 2025 GA)
    - InfluxDB 3 Enterprise: Commercial distributed version
    - InfluxDB Cloud: Managed service (Serverless, Dedicated, Clustered)

    Open source limitations vs Enterprise:
    - No data compaction for historical queries
    - No delete capabilities
    - No high availability replicas
    - No role-based access control
    - Optimized for "leading edge" queries vs historical datasets

  "Python Client Libraries": |
    Two primary connection methods for BenchBox integration:

    1. influxdb3-python (recommended):
       ```python
       from influxdb3 import InfluxDBClient3
       client = InfluxDBClient3(
           host='localhost:8086',
           database='benchmarks',
           token='your-token'
       )
       table = client.query("SELECT * FROM cpu")
       ```

    2. flightsql-dbapi (DB-API 2.0 compliant):
       ```python
       from flightsql import FlightSQLClient
       client = FlightSQLClient(
           host='localhost:8086',
           token='your-token',
           metadata={'database': 'benchmarks'}
       )
       info = client.execute("SELECT * FROM cpu")
       reader = client.do_get(info.endpoints[0].ticket)
       table = reader.read_all()
       ```

    The flightsql-dbapi approach provides DB-API 2.0 compatibility which aligns
    better with BenchBox's existing DatabaseConnection pattern.

  "TSBS Benchmark Compatibility": |
    BenchBox already has TSBS DevOps benchmark implementation (benchbox/core/tsbs_devops/).
    The schema (cpu, mem, disk, net, tags tables) uses standard SQL types.

    For InfluxDB integration:
    - Data loading: Use InfluxDB Line Protocol for optimal ingest performance
    - Schema creation: InfluxDB 3.x auto-creates measurements from line protocol
    - Queries: Use SQL via FlightSQL (not InfluxQL or Flux)
    - Type mapping: TIMESTAMP -> time column, DOUBLE -> Float64, etc.

    Existing dialect support in tsbs_devops/schema.py includes:
    - standard, duckdb, clickhouse, timescale
    - InfluxDB dialect needed for optimal schema/query generation

  "Performance Considerations": |
    Based on TSBS benchmark results (note: most benchmarks used InfluxDB 1.x):
    - InfluxDB optimized for high-cardinality time series data
    - Strong ingest performance via Line Protocol
    - Query performance varies by workload type
    - Best for recent/leading-edge data queries

    Key benchmarking scenarios:
    - Single-host time range queries
    - Cross-host aggregations
    - Time-bucketed groupby queries
    - Threshold/alerting queries
    - Lastpoint/dashboard queries

