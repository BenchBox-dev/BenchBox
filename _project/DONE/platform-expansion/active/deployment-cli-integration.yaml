id: deployment-cli-integration
title: "Platform Deployment CLI Integration"
worktree: platform-expansion
priority: Medium-High
status: Completed
completion_date: "2026-01-26"
category: Core Functionality
description: |
  Integrate deployment mode awareness into the BenchBox CLI, providing clear
  documentation, help text, platform listing with deployment modes, and
  enhanced error messages for deployment-related issues.

context_sections:
  "Background and Motivation": |
    With deployment modes added to the registry and factory, the CLI needs to
    surface this capability to users through intuitive help text and commands.
    Users should easily discover available deployment modes and understand
    the implications of their selection.

  "Technical Context": |
    The CLI currently shows platform options in --help and via `benchbox platforms`.
    We extend this to show deployment mode options and add a --show-deployments
    flag for detailed deployment mode information.

tasks:
  phases:
  - phase: "Phase 1: Help Text Updates"
    done: true
    items:
    - summary: "Update --platform help text to show deployment syntax"
      done: true
      subtasks:
      - summary: "Add colon separator documentation"
        done: true
      - summary: "Show example deployment modes (clickhouse:cloud, firebolt:core)"
        done: true
      - summary: "Reference `benchbox platforms` for full list"
        done: true
    - summary: "Update --help examples section with deployment mode examples"
      done: true

  - phase: "Phase 2: Platform Listing"
    done: true
    items:
    - summary: "Add --show-deployments flag to `benchbox platforms` command"
      done: true
    - summary: "Display deployment modes per platform in listing"
      done: true
      subtasks:
      - summary: "Show available modes (local, server, cloud)"
        done: true
      - summary: "Indicate default deployment mode"
        done: true
      - summary: "Show requirements (credentials, cloud storage)"
        done: true
    - summary: "Add filtering by deployment mode (--deployment-mode local)"
      done: false
      notes: "Deferred - display_platform_deployments supports filtering but not exposed via CLI yet"

  - phase: "Phase 3: Error Messages"
    done: true
    items:
    - summary: "Enhance error message for unknown deployment mode"
      done: true
      notes: "Implemented in adapter_factory.py - shows available modes"
    - summary: "Add suggestion for valid deployment modes when invalid provided"
      done: true
    - summary: "Add warning when deployment requires unconfigured credentials"
      done: false
      notes: "Deferred - requires runtime credential checking"
    - summary: "Add warning when deployment requires cloud storage not configured"
      done: false
      notes: "Deferred - requires runtime config checking"

  - phase: "Phase 4: Testing"
    done: true
    items:
    - summary: "Test help output includes deployment mode documentation"
      done: true
    - summary: "Test platform listing with --show-deployments"
      done: true
    - summary: "Test error messages for invalid deployment modes"
      done: true
    - summary: "Test filtering by deployment mode"
      done: false
      notes: "Deferred with Phase 2 filtering feature"

metadata:
  tags:
  - cli
  - user-experience
  - deployment-modes
  estimated_effort: "2 days"
  created_date: "2026-01-14"

impact:
  business_value: |
    Improves discoverability of deployment modes, reducing user confusion and
    support requests about platform configuration.
  user_impact: |
    Users can easily discover and select deployment modes through intuitive
    CLI help and platform listing commands.

files_affected:
