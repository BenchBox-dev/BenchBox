id: cedardb-adapter
title: "Add CedarDB Platform Adapter"
worktree: platform-expansion
priority: Medium
status: Completed
completed_date: "2026-04-07"
category: Platform Expansion
description: |
  Add support for CedarDB (formerly Umbra), a high-performance RDBMS that handles both
  OLAP and OLTP workloads with PostgreSQL wire protocol compatibility.

  CedarDB is notable for:
  - Blazingly fast analytical and transactional query execution
  - Full PostgreSQL SQL dialect and wire protocol compatibility
  - Strong ACID guarantees with MVCC
  - Works with existing PostgreSQL tools (psql, DBeaver, DataGrip)
  - Python connectivity via psycopg2/psycopg3 (PostgreSQL drivers)

  Reference: https://cedardb.com/docs/

context_sections:
  "Technical Background": |
    CedarDB uses PostgreSQL wire protocol, meaning we reuse the PostgreSQLAdapter
    subclass pattern (see timescaledb.py, pg_mooncake.py, pg_duckdb.py). The adapter
    should subclass PostgreSQLAdapter from benchbox.platforms.postgresql and override:
    - platform_name, dialect, default port
    - _load_data() for bulk loading
    - _get_tuning_config() for CedarDB-specific tuning
    Key differences from vanilla PostgreSQL may be in:
    - Query optimization hints
    - Bulk loading mechanisms
    - Platform-specific tuning options

  "Connection Details": |
    Python drivers: psycopg2, psycopg3 (standard PostgreSQL drivers)
    Connection string: Standard PostgreSQL format
    Default port: 5432 (configurable — CedarDB may use a different default)

metadata:
  tags:
  - platform
  - sql
  - postgresql-compatible
  - olap
  - oltp
  - cedardb
  estimated_effort: Medium
  created_date: "2026-01-26"

technical_requirements:
  dependencies:
  - "psycopg2 or psycopg3 (PostgreSQL driver)"
  compatibility: |
    CedarDB supports PostgreSQL SQL dialect and wire protocol.
    Should work with existing PostgreSQL tooling.

files_affected:
  added:
  - "benchbox/platforms/cedardb.py"
  - "benchbox/platforms/credentials/cedardb.py"
  - "tests/unit/platforms/test_cedardb.py"
  - "_project/specs/platforms/cedardb.md"
  modified:
  - "benchbox/platforms/__init__.py"

must_preserve:
- "All existing platform adapter tests pass: uv run -- python -m pytest tests/unit/platforms/ -v --tb=short"
- "PlatformRegistry.get_adapter_class() resolves all existing platforms — CedarDB registration in __init__.py must not break
  the eager-load block pattern (see timescaledb/pg_duckdb/pg_mooncake sections in __init__.py)"
- "PostgreSQLAdapter.__init__(), connect(), execute_query(), _load_data() behavior unchanged — CedarDB overrides only, no
  parent edits"

anti_patterns:
- "DO NOT modify existing adapter files — because CedarDB is additive — create a new cedardb.py file"
- "DO NOT duplicate PostgreSQL adapter logic — because CedarDB uses PG wire protocol — subclass PostgreSQLAdapter (from benchbox.platforms.postgresql
  import PostgreSQLAdapter) as done in timescaledb.py, pg_mooncake.py, pg_duckdb.py"
- "DO NOT hardcode PostgreSQL default port 5432 — because CedarDB may use a different port — make port configurable with a
  CedarDB-appropriate default"

verification:
- description: "New adapter imports correctly"
  command: "uv run -- python -c \"from benchbox.platforms.cedardb import CedarDBAdapter; print('import OK')\""
  expected_output: "import OK"
- description: "Unit tests pass"
  command: "uv run -- python -m pytest tests/unit/platforms/test_cedardb.py -v --tb=short"
  expected_output: "all tests pass, 0 failures"
- description: "Existing platform tests unaffected"
  command: "uv run -- python -m pytest tests/unit/platforms/ -v --tb=short"
  expected_output: "all tests pass, 0 failures"
- description: "CedarDB registered in PlatformRegistry"
  command: "uv run -- python -c \"from benchbox.core.platform_registry import PlatformRegistry; assert 'cedardb' in PlatformRegistry.get_available_platforms(),
    'not registered'; print('registered OK')\""
  expected_output: "registered OK"

scope_limit:
