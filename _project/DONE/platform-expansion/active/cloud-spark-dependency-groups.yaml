id: cloud-spark-dependency-groups
title: "Cloud Spark Dependency Groups in pyproject.toml"
worktree: platform-expansion
priority: Medium-High
status: Completed
category: Core Functionality

description: |
  Add dependency groups for cloud Spark platforms to pyproject.toml.
  Enables users to install platform-specific dependencies with
  `uv add benchbox --extra cloud-spark-<provider>`.

  **Current State (as of 2026-01-07):**
  All 7 cloud Spark platform adapters are COMPLETE and registered:
  - AWS: Glue, EMR Serverless, Athena Spark (all use boto3)
  - GCP: Dataproc, Dataproc Serverless (use google-cloud-dataproc + storage)
  - Azure: Synapse Spark, Fabric Spark (use azure-identity + datalake + requests)
  - Snowflake: Snowpark Connect (uses snowflake-snowpark-python)

  **Problem:**
  The existing `cloud-spark` extra in pyproject.toml only includes Databricks
  dependencies and has an outdated "Future: AWS Glue, EMR..." comment.
  Provider-specific extras (cloud-spark-aws, cloud-spark-gcp, cloud-spark-azure)
  don't exist.

  **Scope:**
  This TODO is ONLY about pyproject.toml dependency groups, not platform
  implementation (which is already complete).

tasks:
  phases:
  - phase: "Phase 1: Add Provider-Specific Dependency Groups"
    done: true
    items:
    - summary: "Add cloud-spark-aws = [\"boto3>=1.34.0\"]"
      done: true
      notes: "Covers Glue, EMR Serverless, Athena Spark"
    - summary: "Add cloud-spark-gcp = [\"google-cloud-dataproc>=5.0.0\", \"google-cloud-storage>=2.0.0\"]"
      done: true
      notes: "Covers Dataproc and Dataproc Serverless"
    - summary: "Add cloud-spark-azure = [\"azure-identity>=1.15.0\", \"azure-storage-file-datalake>=12.14.0\", \"requests>=2.31.0\"\
        ]"
      done: true
      notes: "Covers Synapse Spark and Fabric Spark"
    - summary: "Add cloud-spark-snowflake = [\"snowflake-snowpark-python>=1.11.0\", \"pyspark>=3.5.0\"]"
      done: true
      notes: "For SnowparkConnectAdapter (already implemented)"

  - phase: "Phase 2: Update cloud-spark Meta-Group"
    done: true
    items:
    - summary: "Update cloud-spark to combine all provider deps + Databricks"
      done: true
      subtasks:
      - summary: "Add boto3>=1.34.0 for AWS platforms"
        done: true
      - summary: "Add google-cloud-dataproc>=5.0.0, google-cloud-storage>=2.0.0 for GCP"
        done: true
      - summary: "Add azure-identity>=1.15.0, azure-storage-file-datalake>=12.14.0, requests>=2.31.0 for Azure"
        done: true
      - summary: "Add snowflake-snowpark-python>=1.11.0, pyspark>=3.5.0 for Snowflake"
        done: true
      - summary: "Keep existing Databricks deps (databricks-*, cloudpathlib)"
        done: true
      - summary: "Remove outdated '# Future: AWS Glue, EMR...' comment"
        done: true

  - phase: "Phase 3: Documentation"
    done: true
    items:
    - summary: "Update docs/installation.md with new extras"
      done: true
      subtasks:
      - summary: "Document cloud-spark-aws for AWS Glue/EMR/Athena Spark"
        done: true
      - summary: "Document cloud-spark-gcp for Dataproc platforms"
        done: true
      - summary: "Document cloud-spark-azure for Synapse/Fabric Spark"
        done: true
      - summary: "Document cloud-spark-snowflake for Snowpark Connect"
        done: true
      - summary: "Document cloud-spark for all-in-one installation"
        done: true
    - summary: "Add example combining extras (e.g., --extra cloud-spark-aws --extra athena)"
      done: true

  - phase: "Phase 4: Validation"
    done: true
    items:
    - summary: "Test uv add benchbox --extra cloud-spark-aws works"
      done: true
    - summary: "Test uv add benchbox --extra cloud-spark-gcp works"
      done: true
    - summary: "Test uv add benchbox --extra cloud-spark-azure works"
      done: true
    - summary: "Test uv add benchbox --extra cloud-spark-snowflake works"
      done: true
    - summary: "Test uv add benchbox --extra cloud-spark installs all"
      done: true

metadata:
  tags:
  - cloud-spark
