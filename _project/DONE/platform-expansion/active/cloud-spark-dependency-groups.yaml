  created_date: "2025-12-24"
  last_updated: "2026-01-07"
  completed_date: "2026-01-07"

impact:
  business_value: |
    Users can install only the cloud provider dependencies they need rather
    than installing everything. Reduces dependency bloat and installation
    conflicts for single-cloud users.
  user_impact: |
    Clear installation path for each cloud provider:
    - AWS users: `uv add benchbox --extra cloud-spark-aws`
    - GCP users: `uv add benchbox --extra cloud-spark-gcp`
    - Azure users: `uv add benchbox --extra cloud-spark-azure`
    - Snowflake users: `uv add benchbox --extra cloud-spark-snowflake`
    - Multi-cloud: `uv add benchbox --extra cloud-spark`

files_affected:
  modified:
  - pyproject.toml
  - docs/usage/installation.md

success_metrics:
- "uv add benchbox --extra cloud-spark-aws installs boto3"
- "uv add benchbox --extra cloud-spark-gcp installs google-cloud-dataproc"
- "uv add benchbox --extra cloud-spark-azure installs azure-identity"
- "uv add benchbox --extra cloud-spark-snowflake installs snowflake-snowpark-python"
- "uv add benchbox --extra cloud-spark installs all provider deps"
- "docs/installation.md documents all cloud-spark extras"

completion_notes: |
  Implemented all cloud Spark dependency groups:

  1. Added 5 provider-specific extras:
     - cloud-spark-aws: boto3 for AWS Glue/EMR/Athena Spark
     - cloud-spark-gcp: google-cloud-dataproc/storage for Dataproc
     - cloud-spark-azure: azure-identity/datalake for Synapse/Fabric
     - cloud-spark-snowflake: snowflake-snowpark-python for Snowpark
     - cloud-spark-databricks: databricks-connect/sdk (new consistent naming)

  2. Updated cloud-spark meta-group to include all provider dependencies

  3. Added "Cloud Spark Platforms" section to docs/usage/installation.md
     with table of extras and usage examples

  4. Validated all extras resolve correctly via uv lock

  Bonus: Added cloud-spark-databricks for naming consistency (answering
  the open question about whether to add it).

