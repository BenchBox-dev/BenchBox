context_sections:
  "Technical Context": |
    The Databricks adapter already exists with mature infrastructure:
    - Connection management via databricks-sql-connector
    - UC Volume staging and upload
    - Delta Lake table creation
    - Complete authentication and credential handling

    The DataFrame adapter extends this by:
    - Accepting DataFrame expressions instead of SQL strings
    - Using df.write.saveAsTable() for data loading
    - Supporting filter, groupBy, agg, join expression building
