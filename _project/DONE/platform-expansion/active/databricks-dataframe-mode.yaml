  - benchbox/utils/dependencies.py - Add databricks-connect dependency info
  - pyproject.toml - Add cloud-spark and databricks-connect extras

  Key Features:
  - Extends existing DatabricksAdapter for 100% infrastructure reuse
  - Supports Databricks Connect for remote DataFrame execution
  - Provides expression helpers (col, lit, sum_col, etc.)
  - Automatic fallback to SQL mode when Connect unavailable
  - Full CLI integration via platform registry

description: |
  Add DataFrame execution mode to the existing Databricks adapter. This is the
  CRITICAL PRIORITY item for Week 1 of the managed cloud Spark integration project.

  Databricks is the market leader for managed Spark with the largest user base.
  This implementation leverages 100% of existing infrastructure (session management,
  UC Volumes, Delta Lake, authentication) with minimal new code.

