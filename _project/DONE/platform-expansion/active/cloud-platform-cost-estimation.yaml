context_sections:
  Technical Context: 'The cost estimation system follows a consistent pattern:

    1. RESOURCE_USAGE_SCHEMA defines expected fields for each platform

    2. pricing.py contains pricing tables and helper functions

    3. calculator.py routes to platform-specific _calculate_X_cost() methods


    The Athena implementation (2024-12-24) serves as a good template.

    '
  Pricing Models: '- Firebolt: FBU-based, varies by engine node type (S/M/L/XL)

    - Fabric DW: Capacity Units (CU), $0.18-0.22/CU-hour by region

    - Synapse Provisioned: DWU-hours (DW100c-DW30000c)

    - Synapse Serverless: $5/TB data processed (like Athena/BigQuery)

    '
sections:
  Implementation Summary: "Added cost estimation for three cloud platforms:\n\n1. Azure Synapse Analytics:\n   - Serverless\
    \ mode: $5.00/TB (same as Athena/BigQuery)\n   - Dedicated mode: DWU-hour pricing from DW100c to DW30000c\n   - Regional\
    \ pricing tiers (US/EU/AP/Other)\n\n2. Microsoft Fabric DW:\n   - Capacity Unit (CU) based pricing\n   - SKU support from\
    \ F2 to F2048\n   - Regional pricing ($0.18/CU-hour US, higher for EU/AP)\n   - Estimation from execution time when CU-seconds\
    \ not available\n\n3. Firebolt:\n   - Firebolt Unit (FBU) based pricing\n   - Node type rates: S=8, M=16, L=32, XL=64\
    \ FBU/hour\n   - Multi-node scaling support\n   - $0.0833/FBU base rate\n\nAlso added databricks-df as alias to databricks\
    \ pricing."
  Test Coverage: 'Created 30 new unit tests covering:

    - Synapse serverless and dedicated modes

    - Fabric CU calculations with different SKUs

    - Firebolt FBU calculations with node type scaling

    - Regional pricing variations

    - Resource usage validation

    - Pricing helper functions'
success_metrics:
