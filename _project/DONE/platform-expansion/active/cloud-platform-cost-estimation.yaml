    Missing cost data for these platforms limits BenchBox''s value proposition

    for comprehensive cost/performance analysis.

    '
  user_impact: 'Users running benchmarks on Firebolt, Fabric DW, or Synapse currently see

    total_cost: 0 in their results, which is misleading. This fix enables

