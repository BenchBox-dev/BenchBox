id: timescaledb-cloud-deployment
title: "TigerData Cloud Deployment Mode"
worktree: platform-expansion
priority: Medium
status: Completed
completed_date: "2026-02-17"
category: Platform Expansion
description: |
  Update the existing TimescaleDB cloud deployment mode to reflect the
  TigerData rebrand (Timescale → TigerData, Timescale Cloud → TigerData).
  Rename environment variables from TIMESCALE_* to TIGERDATA_* (with backward
  compatibility), update registry display names, error messages, docstrings,
  and tests. Add platform documentation, example scripts, and comparison
  matrix entry consistent with other cloud adapters.

  The core cloud connection logic already works (SSL, service URL parsing,
  env var auth, skip_database_management). This TODO focuses on the rebrand
  alignment and the documentation/example gap.

  Note: TigerData still uses *.tsdb.cloud.timescale.com hostnames, tsdbadmin
  default user, and tsdb default database — the infrastructure is unchanged,
  only the branding.

context_sections:
  "Background and Motivation": |
    Timescale has rebranded to TigerData (announced mid-2025):
    - Company: Timescale → TigerData
    - Cloud product: Timescale Cloud → TigerData (just "TigerData")
    - Open-source extension: TimescaleDB (unchanged)
    - Domain: timescale.com → tigerdata.com
    - Docs: docs.timescale.com → tigerdata.com/docs

    The existing TimescaleDB adapter already has a working cloud deployment
    mode (timescaledb:cloud) with SSL, service URL parsing, env var auth,
    and cloud-specific connection logic. However, all user-facing strings,
    environment variable names, error messages, and documentation still
    reference the old "Timescale Cloud" branding.

  "Technical Context": |
    TigerData uses standard PostgreSQL wire protocol (psycopg2). Key details:
    - Hostnames: *.tsdb.cloud.timescale.com (unchanged despite rebrand)
    - Default user: tsdbadmin
    - Default database: tsdb
    - SSL: required (verify-full recommended)
    - Connection pooling: session pool and transaction pool available
    - Service URL: postgres://user:pass@host:port/db?sslmode=require

    Existing implementation in benchbox/platforms/timescaledb.py:
    - _configure_cloud_mode(): env var resolution, SSL enforcement
    - _parse_service_url(): postgres:// URL parsing
    - Deployment mode validation: self-hosted | cloud
    - skip_database_management: True for cloud

    Existing tests in tests/unit/platforms/test_timescaledb_cloud.py:
    - 12 tests covering cloud mode auth, SSL, env vars, service URL parsing

  "What Already Works": |
    The following are already implemented and tested:
    - Cloud deployment mode in registry (platform_registry.py:515-525)
    - Cloud mode validation in __init__ (self-hosted | cloud)
    - _configure_cloud_mode() with env var resolution
    - _parse_service_url() for postgres:// URLs
    - SSL enforcement (sslmode=require)
    - skip_database_management for managed databases
    - 12 unit tests for cloud authentication and configuration

    What needs to change is branding alignment and documentation completeness.

