    Ensures BenchBox reflects current TigerData branding, preventing user
    confusion. Adds documentation parity with other cloud adapters
    (ClickHouse Cloud, Firebolt, Databend).
  user_impact: |
    Users see correct "TigerData" naming in CLI output, error messages, and
    documentation. Environment variables use TIGERDATA_* prefix (with
    backward-compatible TIMESCALE_* fallback).

