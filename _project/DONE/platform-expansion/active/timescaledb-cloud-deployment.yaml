- "All existing platform adapter tests pass: uv run -- python -m pytest tests/unit/platforms/ -v --tb=short"
- "Platform registry autodiscovery continues working for all existing platforms"
- "Existing self-hosted TimescaleDB mode unchanged — no behavior change for self-hosted users"
- "Existing TimescaleDB unit tests continue to pass: uv run -- python -m pytest tests/unit/platforms/test_timescaledb_adapter.py
  -v"
- "TIMESCALE_* environment variables still work (backward compatibility)"
- "timescaledb:cloud colon syntax unchanged"

anti_patterns:
- "DO NOT break existing self-hosted TimescaleDB mode — because self-hosted users depend on current behavior — cloud rebrand
  changes only affect cloud-mode code paths and user-facing strings"
- "DO NOT remove TIMESCALE_* env var support — because existing users may have these configured — add TIGERDATA_* as primary
  with TIMESCALE_* as documented fallback"
- "DO NOT rename the adapter module from timescaledb.py — because TimescaleDB is still the extension name and the platform
  identifier — only update display names and user-facing strings"
- "DO NOT change the colon syntax from timescaledb:cloud — because this is the established convention and TimescaleDB is still
  the extension name — update only display_name and description in registry"

verification:
- description: "TimescaleDB cloud unit tests pass"
  command: "uv run -- python -m pytest tests/unit/platforms/test_timescaledb_cloud.py -v --tb=short"
  expected_output: "all tests pass, 0 failures"
- description: "TimescaleDB adapter unit tests pass"
  command: "uv run -- python -m pytest tests/unit/platforms/test_timescaledb_adapter.py -v --tb=short"
  expected_output: "all tests pass, 0 failures"
- description: "All platform tests unaffected"
  command: "uv run -- python -m pytest tests/unit/platforms/ -v --tb=short"
  expected_output: "all tests pass, 0 failures"
- description: "TIGERDATA_* env vars work"
  command: "uv run -- python -c \"import os; os.environ['TIGERDATA_HOST']='x.com'; os.environ['TIGERDATA_PASSWORD']='p'; from
    benchbox.platforms.timescaledb import TimescaleDBAdapter; a = TimescaleDBAdapter(deployment_mode='cloud'); assert a.host
    == 'x.com'; print('OK')\""
  expected_output: "OK"
- description: "TIMESCALE_* env vars still work (backward compat)"
  command: "uv run -- python -c \"import os; os.environ['TIMESCALE_HOST']='y.com'; os.environ['TIMESCALE_PASSWORD']='p'; from
    benchbox.platforms.timescaledb import TimescaleDBAdapter; a = TimescaleDBAdapter(deployment_mode='cloud'); assert a.host
    == 'y.com'; print('OK')\""
  expected_output: "OK"
- description: "Example script syntax check"
  command: "uv run -- python -m py_compile examples/getting_started/cloud/tigerdata_tpch.py"
  expected_output: "no output (success)"

