  created_date: '2025-12-21'
impact:
  business_value: 'TimescaleDB is the leading PostgreSQL-based time-series database.

    First-class support enables BenchBox to serve time-series workload

    benchmarking, expanding the target audience.

    '
  user_impact: 'Users can easily benchmark TimescaleDB instances and compare them

    against PostgreSQL and other platforms. Time-series specific features

    like hypertables and compression can be properly evaluated.

    '
