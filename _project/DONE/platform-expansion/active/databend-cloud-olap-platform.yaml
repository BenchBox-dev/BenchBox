context_sections:
  "Background and Motivation": |
    Databend is a cloud-native, open-source data warehouse built in Rust with
    complete compute/storage separation. It stores data in Parquet format on
    object storage (S3, Azure Blob, GCS) and claims near-100% Snowflake SQL
    compatibility.

    The platform was evaluated in January 2026 and deferred due to:
    - No native SQLGlot dialect support (critical for BenchBox's SQL translation)
    - Overlap with existing platforms (ClickHouse, Snowflake, Firebolt)
    - Lower enterprise adoption

  "Technical Context": |
    **Architecture:**
    - Rust-based query engine with vectorized execution
    - Parquet-native storage with MVCC
    - Compute/storage separation on object storage
    - Horizontal scaling via query clusters

    **Python Connectivity:**
    - `databend-driver` (v0.28.2+) - DB-API 2.0 compliant
    - SQLAlchemy support via `databend-sqlalchemy`
    - Connection DSN: databend://user:pass@host:port/database

    **SQL Translation Strategy:**
    Since SQLGlot lacks Databend dialect, use Snowflake as translation target.
    Databend claims ~100% Snowflake compatibility, so this should work for
    most queries. Edge cases may require custom QueryTransformer.

  "Research Findings": |
    **SQLGlot Status (Jan 2025):**
    Databend explicitly NOT supported. Apache Superset's dialect map shows
    `# "databend": ???` indicating no corresponding dialect.

    **TPC Benchmarks:**
    Databend publishes internal TPC-H/TPC-DS benchmarks showing competitive
    performance vs Snowflake (~60% cost reduction claimed), but these are
    not official TPC-certified results.

    **GitHub Activity:**
    9.1k stars, 844 forks, 212 contributors. Active development with
    1,700+ releases. Growing but smaller community than ClickHouse (38k stars).

technical_requirements:
  constraints:
  - "SQLGlot does not support Databend dialect - must use Snowflake proxy"
  - "CI testing requires object storage (MinIO) + Databend cluster"
  - "Query compatibility must be verified manually for TPC suites"
  dependencies:
  - "databend-driver>=0.28.0"
  - "databend-sqlalchemy (optional, for SQLAlchemy users)"
  - "MinIO for local object storage testing"
  compatibility: |
    Python 3.7+
    Databend Cloud or self-hosted Databend
    Object storage backend required (S3, GCS, Azure Blob, MinIO)

open_questions:
