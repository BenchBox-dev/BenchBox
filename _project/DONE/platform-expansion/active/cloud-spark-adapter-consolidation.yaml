context_sections:
  "Code Review Findings": |
    Identified duplication patterns from adversarial code review:

    1. apply_primary_keys/apply_foreign_keys/apply_platform_optimizations
       - Identical implementation across 8 adapters
       - All return empty list with logging
       - ~400 LOC duplicated

    2. Lazy client initialization (_get_*_client methods)
       - 15 methods across 5 adapters
       - Same caching pattern
       - ~200 LOC duplicated

    3. configure_for_benchmark() with SparkConfigOptimizer
       - Same if/elif structure for tpch/tpcds/ssb
       - Only CloudPlatform enum varies
       - ~160 LOC duplicated

    4. URI parsing (s3_staging_dir[5:].split)
       - Manual parsing when CloudSparkStaging.from_uri() exists
       - ~80 LOC duplicated

