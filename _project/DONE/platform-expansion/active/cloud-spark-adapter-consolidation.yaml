# Cloud Spark Adapter Consolidation
# Extract common patterns into mixins and base classes

title: "Cloud Spark Adapter Consolidation - Extract Common Patterns"
worktree: "platform-expansion"
priority: "Medium-High"
status: "Completed"
category: "Core Functionality"

description: |
  Code review of the 7 cloud Spark platform adapters (5,358 LOC total) identified
  significant duplication opportunities. Approximately 1,100-1,400 lines of code
  can be consolidated through mixins and improved base classes.

  Adapters reviewed:
  - Dataproc Serverless (710 LOC)
  - Athena Spark (858 LOC)
  - EMR Serverless (849 LOC)
  - Synapse Spark (888 LOC)
  - AWS Glue (841 LOC)
  - Snowpark Connect (690 LOC)
  - Databricks DataFrame (522 LOC)

tasks:
  phases:
    - phase: "Phase 1: High-Priority Mixins"
      done: true
      items:
        - summary: "Create SparkTuningMixin with default constraint methods"
          done: true
          subtasks:
            - summary: "Extract apply_primary_keys() returning []"
              done: true
            - summary: "Extract apply_foreign_keys() returning []"
              done: true
            - summary: "Extract apply_platform_optimizations() returning []"
              done: true
            - summary: "Extract apply_constraint_configuration()"
              done: true
            - summary: "Update all 8 Spark adapters to inherit mixin"
              done: true
