              done: true
              notes: "Synapse/Fabric use (benchmark, scale_factor) not (connection, benchmark_type)"
        - summary: "SKIPPED: URI parsing refactor (low ROI, ~3 lines per adapter)"
          done: true
          subtasks:
            - summary: "Evaluated: Existing pattern is simple and readable"
              done: true
            - summary: "Decision: Keep adapter-specific URI parsing"
              done: true

    - phase: "Phase 3: Low-Priority Base Classes (Optional)"
      done: true
      items:
        - summary: "SKIPPED: CloudSparkBatchJobAdapter base class"
          done: true
          subtasks:
            - summary: "Evaluated: GCP uses synchronous wait, AWS uses async polling"
              done: true
            - summary: "Decision: Different APIs make abstraction low-value"
              done: true
        - summary: "SKIPPED: CloudSparkSessionAdapter base class"
          done: true
          subtasks:
            - summary: "Evaluated: Synapse/Fabric Livy patterns ~100 LOC shared"
              done: true
            - summary: "Decision: Only 2 adapters benefit, complexity not justified"
              done: true

    - phase: "Phase 4: Testing and Validation"
      done: true
      items:
        - summary: "Ensure all existing tests pass after refactoring"
          done: true
          notes: "228 tests passed in 3.13s"
        - summary: "Add unit tests for new mixins"
          done: true
          notes: "Mixin tests added in test_cloud_spark_config.py (Phase 1 commit)"
        - summary: "Run lint and type checks"
          done: true
          notes: "Lint passes. Pre-existing type errors in optional import patterns."

