completion:
  summary: |
    Query plan capture is now wired for the misc platform family. New parsers:
    DatabendQueryPlanParser (box-drawing tree), QuestDBQueryPlanParser (indented
    text tree), DorisQueryPlanParser (EXPLAIN SHAPE PLAN dash tree), and
    SingleStoreQueryPlanParser ("|---" connector chain-tree), all registered in
    the parser registry. MotherDuck (w1/w2, PR #748) and Velox both reuse existing
    parsers (DuckDB and Spark respectively) — Velox was found to be a Gluten+Velox-
    on-Spark adapter, not Prestissimo, so it reuses SparkQueryPlanParser and was
    never actually blocked on the Presto/Trino TODO. cuDF stays unsupported
    (documented). Adapters return a non-None parser and capture
    QueryPlanDAG + plan_fingerprint via execute_query() when capture_plans=True,
    with silent degradation when capture fails (strict mode still raises).
  key_decisions:
    - "Doris and SingleStore use SEPARATE parsers (formats differ structurally); no shared MySQLCompatibleQueryPlanParser."
    - "Velox reuses SparkQueryPlanParser (Spark EXPLAIN EXTENDED), correcting the original Presto-JSON assumption."
    - "QuestDB EXPLAIN is a text tree, not JSON, correcting the original assumption."
    - "Doris plan capture uses EXPLAIN SHAPE PLAN (Nereids) for a stable, nestable tree."
    - "get_query_plan() keeps its existing error-string-on-failure contract (pinned by adapter tests); parsers carry an error-sentinel guard so a failed EXPLAIN never yields a bogus plan."
  verification: |
    uv run -- python -m pytest tests/unit/platforms/test_misc_plan_capture.py -v  # 39 passed
    uv run -- python -m pytest tests/unit/ -q                                     # green
  commit: "see branch claude/misc-platforms-plan-capture-big6ry"
