id: firebolt-cloud-deployment
title: "Firebolt Cloud Deployment Mode"
worktree: platform-expansion
priority: Low
status: Completed
completed_date: "2026-02-16"
category: Platform Expansion
description: |
  Ensure full support for Firebolt Cloud deployment mode via the firebolt:cloud
  syntax, completing the Firebolt platform family alongside the existing
  firebolt:core (local Docker container) mode.

  While the Firebolt adapter already has mode awareness, this TODO ensures
  cloud mode is fully integrated with the new deployment registry architecture
  and has comprehensive credential/connection handling.

context_sections:
  "Background and Motivation": |
    Firebolt offers two deployment options:
    - Firebolt Core: Free local Docker container for development/testing
    - Firebolt Cloud: Fully managed cloud data warehouse service

    The existing Firebolt adapter has basic mode support via `firebolt_mode` config,
    but needs alignment with the deployment registry pattern and enhanced cloud
    support (OAuth, cloud storage staging, proper credential management).

  "Technical Context": |
    Current Firebolt implementation (firebolt.py):
    - mode="core" uses local Docker container
    - mode="cloud" connects to Firebolt Cloud service
    - Uses firebolt-sdk for both modes

    Cloud mode requires:
    - OAuth or service account authentication
    - Engine selection/management
    - Cloud storage for data loading (S3)
    - Proper error handling for cloud-specific failures

metadata:
  tags:
  - platform-adapter
  - firebolt
  - cloud
  - deployment-modes
  estimated_effort: "2-3 days"
  created_date: "2026-01-14"

  related:
  - migrate-clickhouse-firebolt-deployment
  migration_review_required: true
impact:
  business_value: |
    Enables comparison of Firebolt Core (free local) vs Firebolt Cloud (managed),
    helping users evaluate Firebolt's cloud offering and understand the
    performance differences between local development and production deployment.
  user_impact: |
    Users can benchmark Firebolt Cloud alongside the free Core version using
    the same benchmark suite and methodology, with intuitive firebolt:cloud syntax.
  technical_debt: |
    Aligns Firebolt with the deployment registry pattern, replacing ad-hoc
    firebolt_mode handling with standardized deployment_mode configuration.

files_affected:
