  - "benchbox/core/platform_registry.py"
  added:
  - "benchbox/platforms/credentials/firebolt_cloud.py"
  removed: []
technical_requirements:
  dependencies:
  - "firebolt-sdk (existing)"
  constraints:
  - "Requires Firebolt Cloud account for testing"
  - "S3 access required for cloud data loading"
  - "Engine must be running for queries"

must_preserve:
- "All existing platform adapter tests pass: uv run -- python -m pytest tests/unit/platforms/ -v --tb=short"
- "Platform registry autodiscovery continues working for all existing platforms"
- "Existing firebolt:core mode unchanged"
- "firebolt:core backward compatibility maintained with both firebolt_mode and deployment_mode config keys"

anti_patterns:
- "DO NOT remove firebolt_mode config support — because existing users have configs with it — support both firebolt_mode and
  deployment_mode with deprecation warning"
- "DO NOT break existing Firebolt Core Docker mode — because it is the default development mode — ensure firebolt:core continues
  to work without cloud credentials"
- "DO NOT require cloud credentials for core mode — because core mode runs locally via Docker — gate cloud auth behind deployment
  mode checks"

verification:
- description: "Cloud credentials module imports correctly"
  command: "uv run -- python -c \"from benchbox.platforms.credentials.firebolt_cloud import *; print('import OK')\""
  expected_output: "import OK"
- description: "Firebolt adapter unit tests pass"
  command: "uv run -- python -m pytest tests/unit/platforms/test_firebolt_adapter.py -v --tb=short"
  expected_output: "all tests pass, 0 failures"
- description: "Existing platform tests unaffected"
  command: "uv run -- python -m pytest tests/unit/platforms/ -v --tb=short"
  expected_output: "all tests pass, 0 failures"

scope_limit:
  only_modify:
  - "benchbox/platforms/firebolt.py"
  - "benchbox/platforms/credentials/firebolt_cloud.py"
  - "benchbox/core/platform_registry.py"
  - "tests/unit/platforms/test_firebolt_adapter.py"
  do_not_modify:
  - "benchbox/platforms/clickhouse/"
  - "benchbox/platforms/duckdb.py"
  - "benchbox/core/runner.py"

