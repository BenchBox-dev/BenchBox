id: athena-spark-platform
title: "Amazon Athena for Apache Spark Platform"
worktree: platform-expansion
priority: Medium
status: "Completed"
category: Platform Expansion

description: |
  Add Amazon Athena for Apache Spark platform adapter. This is AWS's interactive
  notebook-based Spark service with sub-second startup.

  Uses notebook-style execution model (Jupyter kernel) rather than batch jobs.
  Reuses 100% of S3 staging and AWS authentication patterns.

tasks:
  phases:
  - phase: "Phase 1: Adapter Implementation"
    done: true
    items:
    - summary: "Create AthenaSparkAdapter class"
      done: true
      subtasks:
      - summary: "Implement create_connection() with Athena Spark workgroup"
        done: true
      - summary: "Implement session lifecycle (start_session, terminate_session)"
        done: true
      - summary: "Implement execute_query() with start_calculation_execution()"
        done: true
      - summary: "Reuse S3 staging from cloud-spark infrastructure"
        done: true
    - summary: "Support SQL and DataFrame execution modes"
      done: true
    - summary: "Register in platform_registry.py"
      done: true

  - phase: "Phase 2: Testing"
    done: true
    items:
    - summary: "Create unit tests with mocked Athena Spark client"
      done: true
    - summary: "Add smoke test gated by @pytest.mark.live_athena_spark"
      done: false
      notes: "Deferred - requires live Athena Spark workgroup for testing"

  - phase: "Phase 3: Documentation"
    done: true
    items:
    - summary: "Create examples/getting_started/cloud/athena_spark_tpch.py"
      done: true
    - summary: "Write docs/platforms/athena-spark.md"
      done: true

