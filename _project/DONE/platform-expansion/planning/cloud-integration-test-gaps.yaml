  estimated_effort: "Medium — 5 files, mostly additive test code"
  created_date: "2026-03-28"
  follows: cloud-integration-test-infrastructure

guardrails:
  verification:
    command: "uv run ruff check tests/integration/platforms/test_firebolt_live.py tests/integration/platforms/test_motherduck_live.py tests/integration/platforms/test_starburst_live.py tests/integration/platforms/test_pg_extension_comparison.py tests/integration/platforms/test_pg_duckdb_live.py && make test-fast"
    expected: "Ruff clean on all 5 files; all fast tests pass; new test code is credential-gated and does not run without env vars"
    spot_checks:
    - "uv run -- python -m pytest tests/integration/platforms/test_firebolt_live.py --collect-only 2>&1 | grep 'test session starts' — verifies no import errors, expect 9 tests"
    - "uv run -- python -m pytest tests/integration/platforms/test_motherduck_live.py --collect-only 2>&1 | grep 'test session starts' — expect 9 tests"
    - "uv run -- python -m pytest tests/integration/platforms/test_starburst_live.py --collect-only 2>&1 | grep 'test session starts' — expect 9 tests"
  must_preserve:
  - "Existing test behavior in test_firebolt_live.py, test_starburst_live.py, test_motherduck_live.py — new classes are additive"
  - "Existing comparison test assertions in TestPgExtensionComparisonOrchestration and TestPgExtensionComparisonReport"
  - "Marker hierarchy: integration > live_integration > live_{platform}"
  - "make test-fast exclusion of live_integration tests"
  approach: |
    Follow the Snowflake/BigQuery/Databricks test structure exactly:
    1. SchemaManagement: CREATE SCHEMA/DATABASE, verify, cleanup in finally
    2. DataLoading: TPCH(), generate_data(), get_create_tables_sql(), load_data(), verify stats
    3. QueryExecution: get_query(1, seed=42), prefix table refs with schema, assert results
    4. SpecificFeatures: platform-unique capabilities + cleanup test
    All cleanup in finally blocks (not via cleanup_test_schema fixture).
    Comparison test refactor: replace subprocess with adapter.create_schema/load_data/execute_query.
  anti_patterns:
  - "DO NOT rely on cleanup_test_schema fixture for cleanup — it calls adapter.execute_sql() which doesn't exist as a public method and silently fails via try/except — use explicit finally blocks"
  - "DO NOT use writable operations against Starburst's default tpch catalog — it's read-only; gate write tests on STARBURST_WRITABLE_CATALOG env var"
  - "DO NOT import adapter classes at module level in comparison test — use lazy imports inside _run_benchmark_via_adapter() to avoid ImportError when platform deps aren't installed"
  scope_limit:
  - "Only modify test files — no production code changes"
  - "Do not change conftest.py fixtures, pytest.ini markers, or Makefile targets"

