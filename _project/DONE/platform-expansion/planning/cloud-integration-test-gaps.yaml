id: cloud-integration-test-gaps
title: "Cloud Integration Test Infrastructure — Address Review Gaps"
worktree: platform-expansion
priority: Medium-High
status: Completed
completed_date: "2026-03-29"
category: Platform Expansion
description: |
  Code review of the cloud-integration-test-infrastructure implementation
  (bcccb82..877e7452d) scored 7/10. Bug fixes were committed (5f8caffb2),
  raising it to ~8.5. Four structural gaps remain:

  1. Test depth parity — Firebolt (4 tests), Starburst (5), MotherDuck (5)
     are significantly thinner than Snowflake (9), BigQuery (10), Databricks (9).
     Missing: SchemaManagement, DataLoading, TPC-H QueryExecution, SpecificFeatures.
  2. Scope creep — PREFER_PLATFORM_FORMAT_ORDER production code refactor
     (format_capabilities.py, data_loading.py) was bundled in a test TODO.
     Already committed; acknowledge in commit message only.
  3. Comparison test fragility — test_pg_extension_comparison.py shells out
     to CLI via subprocess. Depends on --output flag + JSON schema stability.
     Should use Python adapter API directly.
  4. S3 test fixture gap — test_s3_parquet_query assumes pre-existing
     test.parquet in S3. No setup script or fixture creates it.

context_sections:
  "Test Depth Pattern": |
    Existing deep live tests (Snowflake, BigQuery, Databricks) follow a
    5-class structure: Connection → SchemaManagement → DataLoading →
    QueryExecution → SpecificFeatures. Each uses conftest fixtures:
    unique_test_schema, test_scale_factor, test_output_dir. Data loading
    uses TPCH(scale_factor=0.01, output_dir=..., verbose=False) with
    generate_data(), get_create_tables_sql(dialect=...), adapter.load_data().

  "Platform-Specific Constraints": |
    - Firebolt: dialect="postgres", uses databases not schemas, cursor-based
    - MotherDuck: DuckDB dialect, connection.execute() not cursor
    - Starburst: dialect="trino", default catalog tpch is READ-ONLY;
      writable ops need STARBURST_WRITABLE_CATALOG env var
    - cleanup_test_schema fixture calls nonexistent adapter.execute_sql()
      and silently fails — all cleanup must be in finally blocks

  "Comparison Test Architecture": |
    Current: subprocess CLI → parse JSON result files → compare.
    Target: adapter API → build result dicts in-process → compare.
    Adapter execute_query() returns {"status": "SUCCESS", "execution_time_seconds": ...}.
    Comparison test checks status == "success" (lowercase) — must lowercase.

metadata:
  tags:
  - integration-tests
