id: add-postgresql-platform-adapter
title: Add PostgreSQL Platform Adapter
worktree: platform-expansion
priority: Medium
status: Completed
description: Introduce a first-class PostgreSQL (with optional TimescaleDB extensions) adapter so users can benchmark against
  the ubiquitous row-store baseline alongside existing columnar targets.
context_sections:
- name: Customer Demand
  summary: Teams commonly ask for Postgres baselines to quantify gains from DuckDB, ClickHouse, or cloud warehouses; TimescaleDB
    opens the door to time-series scenarios.
impact: Establishes a familiar reference point, broadens community adoption, and prepares the codebase for broader ANSI SQL
  adapter coverage.
research_value: Validate core benchmark workloads on a row-store engine and document workload-specific tuning guidance.
tasks:
- phase: '"Discovery & Access Requirements"'
  description: Confirm target versions, extensions, and auth flows.
  items:
  - summary: Catalog supported PostgreSQL/Timescale versions, required extensions, and recommended server settings.
    done: false
  - summary: Document connection strategies (DSN, SSL, connection pooling) and credential management expectations.
    done: false
- phase: '"Schema & Configuration Mapping"'
  items:
  - summary: Audit benchmark DDL for Postgres-specific adjustments (numeric precision, identity columns, Timescale hypertables).
    done: false
  - summary: Define adapter configuration knobs (work_mem, parallelism, COPY tuning) with sensible defaults.
    done: false
- phase: Adapter Implementation
  items:
  - summary: Implement PostgreSQLPlatformAdapter with psycopg-based connection handling, COPY ingestion, and query execution
      APIs.
    done: false
  - summary: Integrate result export, EXPLAIN plan capture, and error translation aligned with PlatformAdapter contracts.
    done: false
- phase: '"Integration & Documentation"'
  items:
  - summary: Wire adapter into CLI platform registry, dependency checks, and configuration samples.
    done: false
  - summary: Author setup docs covering local containers, managed services, and Timescale-specific notes.
    done: false
- phase: '"Testing & Validation"'
  items:
  - summary: Add unit/integration tests for schema deployment, COPY throughput, and benchmark execution at multiple scale
      factors.
    done: false
  - summary: Capture regression fixtures for canonical TPC-H/TPC-DS query outputs and execution plans.
    done: false
- phase: '"Performance & Benchmark Review"'
  items:
  - summary: Produce comparison reports versus DuckDB/ClickHouse to highlight tuning guidance and bottlenecks.
    done: false
technical_requirements:
- category: '"Connection & Authentication"'
  items:
  - Support DSN strings, SSL parameters, and optional connection pooling (psycopg async/pool).
- category: SQL Compatibility
  items:
  - Ensure translators handle LIMIT/OFFSET, casting semantics, and Timescale hypertable DDL.
- category: Data Loading
  items:
  - Provide efficient bulk ingestion via COPY FROM STDIN with configurable batch sizing.
- category: Observability
  items:
  - Collect EXPLAIN/EXPLAIN ANALYZE output for benchmark runs and surface key metrics in results.
files_affected:
  modified:
  - benchbox/platforms/postgresql.py
  - tests/unit/platforms/test_postgresql_adapter.py
  - benchbox/platforms/__init__.py
  - docs/platforms/postgresql.md
  - benchbox/cli/platform.py
  added: []
  removed: []
metadata:
  owners:
  - '"@benchbox-maintainers"'
  tags:
  - platform
  - postgresql
completion:
  date: '2025-11-29'
  commits:
  - c7607efc: 'feat: add PostgreSQL platform adapter with COPY-based loading'
  implementation_notes: 'Implemented full PostgreSQLAdapter with:


    Core Features:

    - Connection management with session settings (work_mem, maintenance_work_mem, etc.)

    - COPY-based bulk data loading for efficient TPC benchmarks

    - EXPLAIN ANALYZE for query plan capture

    - Database creation/drop with proper identifier validation

    - Optional TimescaleDB extension detection


    Platform Integration:

    - Added PostgreSQLAdapter to platform registry and auto-registration

    - Added postgresql to platform_mapping and requirements

    - Added postgresql metadata to PlatformRegistry

    - Added postgresql extra to pyproject.toml

    - Added postgresql DependencyInfo in dependencies.py

    - Registered config builder and platform options


    Tests: 31 unit tests covering:

    - Initialization and configuration

    - Connection parameter handling

    - Database existence checking and management

    - Query execution and plan capture

    - COPY-based data loading with CSV and .tbl files

    - SQL identifier validation (prevents injection)


    Files Created:

    - benchbox/platforms/postgresql.py (main adapter)

    - tests/unit/platforms/test_postgresql_adapter.py (31 tests)

    '
