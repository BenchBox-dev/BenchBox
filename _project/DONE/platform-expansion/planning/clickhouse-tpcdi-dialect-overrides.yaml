id: clickhouse-tpcdi-dialect-overrides
title: "Add ClickHouse dialect overrides for TPC-DI analytics queries (JULIANDAY, NULLIF, FILTER, subqueries)"
worktree: platform-expansion
category: Platform Expansion
priority: Medium
status: Completed
completed_date: "2026-04-08"
description: |
  21/114 query failures on ClickHouse in TPC-DI benchmark across 7 unique queries:
  - AQ6: SUM(SUM(x)) OVER () nested window aggregate unsupported in ClickHouse
  - AQ7, AQ8, AQ10: JULIANDAY() SQLite function not portable
  - EQ7: FROM (VALUES (0)) not supported in ClickHouse FROM clause
  - EQ3: Double-nested COUNT scalar subquery (always returns 1, not actual count)

  Fixes applied:
  - AQ6: Full query override with CROSS JOIN pre-computed grand total
  - AQ7/AQ8/AQ10: JULIANDAY(x)-JULIANDAY(y) → dateDiff('day', y, x), DATE('now') → today()
  - EQ7: FROM VALUES (N) AS alias → FROM (SELECT N) AS alias (post-SQLGlot regex)
  - EQ3: Flatten double-nested COUNT(*) FROM (SELECT COUNT(*) ...) (pre-SQLGlot regex)

  Key insight: JULIANDAY replacements applied AFTER SQLGlot translation because SQLGlot
  reorders dateDiff() argument order when parsing from netezza dialect.

work:
  - id: w1
    summary: "Create ClickHouse overrides for AQ7, AQ8, AQ10 — replace JULIANDAY/DATE('now') with dateDiff/today()"
    status: done

  - id: w2
    summary: "Create ClickHouse override for AQ5 — rewrite NULLIF inside aggregates to if() expressions"
    status: done

  - id: w3
    summary: "Create ClickHouse override for AQ6 — replace SUM(SUM()) OVER () with CROSS JOIN total"
    status: done

  - id: w4
    summary: "Investigate and create ClickHouse overrides for EQ3, EQ7 — VALUES and double-nested COUNT"
    status: done

  - id: w5
    summary: "Verify all overrides load and pass syntax validation"
    needs: [w1, w2, w3, w4]
    status: done

files_affected:
  modified:
    - "benchbox/core/tpcdi/benchmark.py"
  added:
    - "tests/unit/core/tpcdi/test_tpcdi_clickhouse_overrides.py"

must_preserve:
  - "Base query_analytics.py queries unchanged — other platforms use standard SQL JULIANDAY/NULLIF/FILTER syntax"
  - "Override queries return identical column names, types, and row semantics"

anti_patterns:
  - "DO NOT modify the base query_analytics.py queries — because other platforms use them correctly — create ClickHouse overrides instead"
  - "DO NOT use JULIANDAY() in ClickHouse overrides — because it is a SQLite-only function — use dateDiff('day', ...) instead"
  - "DO NOT apply JULIANDAY→dateDiff before SQLGlot translation — because SQLGlot reorders dateDiff() arguments — apply after SQLGlot"

verification:
  - description: "ClickHouse TPC-DI overrides load and use native syntax"
    command: "uv run -- python -m pytest tests/unit/core/tpcdi/test_tpcdi_clickhouse_overrides.py -v"
    expected_output: "11 passed"

metadata:
  tags:
    - clickhouse
