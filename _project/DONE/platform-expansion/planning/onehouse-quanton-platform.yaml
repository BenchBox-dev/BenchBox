context_sections:
  "Onehouse Quanton Architecture": |
    Onehouse Quanton is a serverless managed Spark compute runtime:

    Execution Model:
    - Serverless clusters with automatic scaling
    - Purpose-built Quanton execution engine
    - Optimized for ETL and analytical workloads
    - Smart incremental processing for CDC/temporal data

    Performance Features:
    - 2-3x better price-performance vs EMR/Databricks
    - No per-cluster fees (unlike Databricks Photon)
    - Intelligent lakehouse I/O optimization
    - Minimal data scanning via incremental operations

    Table Format Support:
    - Native Apache Hudi support (founded by Hudi creators)
    - Apache Iceberg support (3x faster on TPC-DS benchmarks)
    - Delta Lake support
    - XTable for cross-format metadata translation

  "Multi-Table-Format Strategy": |
    Quanton's multi-format support enables unique benchmarking scenarios:

    Format Selection:
    - --table-format hudi: COW or MOR tables, timeline-based versioning
    - --table-format iceberg: Snapshot isolation, hidden partitioning
    - --table-format delta: ACID transactions, time travel

    Comparison Benchmarking:
    - Same TPC-H/TPC-DS queries across all three formats
    - Isolate format impact vs engine impact
    - Validate format-specific optimizations

    XTable Integration:
    - Single Parquet data copy
    - Multiple format metadata layers
    - Query from any compatible engine

  "Integration with Existing Cloud Spark Infrastructure": |
    BenchBox cloud Spark infrastructure components to leverage:

    Shared Components (benchbox/platforms/base/cloud_spark/):
    - CloudSparkConfigMixin: Benchmark-aware Spark configuration
    - SparkTuningMixin: Constraint configuration interface
    - CloudSparkStaging: Multi-cloud storage staging (S3, GCS, ADLS)
    - SparkConfigOptimizer: Scale-factor-aware tuning

    Similar Patterns (reference adapters):
    - EMR Serverless: Serverless cluster lifecycle, S3 staging
    - Dataproc Serverless: Auto-scaling, GCS staging
    - Databricks: API-based cluster management, Unity Catalog

    Key Differences:
    - Onehouse-specific API for cluster/job management
    - Multi-format table creation (Hudi, Iceberg, Delta)
    - Potential Quanton-specific configuration options

  "Performance Claims to Validate": |
    Onehouse published benchmarks to validate with BenchBox:

    TPC-DS Performance:
    - 3x faster than competitors on Iceberg workloads
    - Within 15% of Databricks Photon (at much lower cost)

    Cost Efficiency:
    - 50% savings vs EMR for Hudi workloads
    - No per-cluster fees (vs Photon premium)
    - 40-60% acceleration for migrated jobs

    BenchBox Validation:
    - Run identical TPC-H/TPC-DS at various scale factors
    - Compare with EMR Serverless and Databricks adapters
    - Document cost and performance metrics

  "AWS Integration Patterns": |
    Expected AWS integration (based on documented patterns):

    IAM Configuration:
    - Cross-account role for Onehouse to access customer S3
    - Quanton clusters assume role for data access
    - Similar to EMR/Glue IAM patterns

    S3 Integration:
    - Staging bucket for TPC data upload
    - Table data stored in customer S3
    - Standard s3:// or s3a:// paths

    Networking:
    - Serverless clusters in Onehouse infrastructure
    - VPC peering if private data access needed
    - Public S3 access for standard benchmarks
