completion_summary: |
  Implemented zero-cost tracking for all local/self-hosted platforms:

  Phase 1 & 2 (Combined):
  - Added RESOURCE_USAGE_SCHEMA definitions for 15 local platforms with
    platform-appropriate optional metrics
  - Extended _local_platforms set from 2 to 20 platforms
  - All local platforms now return QueryCost(compute_cost=0.0) instead of None

  Platforms added: postgresql, sqlite, timescaledb, trino, presto, influxdb,
  spark, pyspark, datafusion, polars, polars-df, pandas-df, cudf-df, modin-df, dask-df

  Phase 3 (Skipped):
  - Optional compute-time costing deferred as YAGNI - users can estimate
    on-prem costs externally if needed

  Success metrics achieved:
  - ✅ All platforms return QueryCost objects (not None)
  - ✅ No "Cost calculation not supported" warnings for registered platforms
  - ✅ 247 cost module tests passing

impact:
  business_value: |
    Provides consistent cost tracking schema across all platforms, even when
    the cost is zero. Enables future features like on-prem cost estimation.
  user_impact: |
    Users running local platforms will see consistent result schemas with
    execution metrics in pricing_details, rather than missing cost data.
  technical_debt: |
    Reduces special-case handling in result processing code that currently
    must handle missing cost fields for some platforms.

files_affected:
  modified:
  - "benchbox/core/cost/calculator.py"

context_sections:
  "Background": |
    Currently, only duckdb and clickhouse have zero-cost handlers in the
    calculate_query_cost() method. All other local platforms fall through
    to the "Cost calculation not supported" warning path.

    This creates inconsistent behavior where some local platforms return
    QueryCost(compute_cost=0.0) with metrics, while others return None.

  "Platforms Affected": |
    SQL Platforms:
    - postgresql, sqlite, timescaledb, trino, presto

    Distributed/Analytics:
    - spark, pyspark, influxdb

    DataFrame:
    - datafusion, polars (cudf, pandas, modin, dask are dataframe-only)

success_metrics:
- "All platforms return QueryCost objects (not None) from calculate_query_cost()"
- "Execution metrics included in pricing_details for all platforms"
- "No 'Cost calculation not supported' warnings for registered platforms"

open_questions:
