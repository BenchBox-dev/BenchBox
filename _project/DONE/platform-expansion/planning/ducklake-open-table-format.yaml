technical_requirements:
  dependencies:
  - DuckDB with ducklake extension (included with DuckDB >= 1.2.0)
  constraints:
  - Must follow BaseFormatConverter interface
  - Must support all ConversionOptions (compression, partitioning, etc.)
  - Must integrate with existing manifest v2 format tracking
  compatibility: 'DuckLake support requires platforms that can read DuckLake format.

    Primary support target is DuckDB (native). Other platforms may

    have experimental or extension-based support.

    '
success_metrics:
- DuckLakeConverter successfully converts TBL files to DuckLake format
- DuckLake tables load correctly in DuckDB benchmarks
- Maintenance operations (insert/delete/update/merge) work correctly
- Format detection correctly identifies DuckLake tables
- TPC-H benchmark runs successfully with DuckLake format at scale 0.01
- Time travel queries work as expected
- Test coverage >= 80% for new code
open_questions:
- What is the DuckLake directory/metadata structure for format detection? - DuckLake uses catalog.ducklake file for metadata
  and data/ subdirectory for Parquet files
- Does DuckLake require specific DuckDB version or extension? - Requires DuckDB >= 1.2.0 with ducklake extension (auto-installable)
- What platforms beyond DuckDB will support DuckLake? - Currently only DuckDB has native support
- Should DuckLake support partition columns like Delta/Iceberg? - Partition columns supported through DuckLake's internal
  partitioning
