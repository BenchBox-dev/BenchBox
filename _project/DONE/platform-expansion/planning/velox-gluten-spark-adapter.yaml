technical_requirements:
  dependencies:
    - "pyspark (existing extra - reused)"
    - "Gluten Velox bundle jar, e.g. gluten-velox-bundle-spark3.5_2.12-linux_amd64-1.4.0.jar"
    - "Java 8 or 17 on PATH (JAVA_HOME) - inside the container for macOS/Windows devs"
    - "Docker Desktop or Docker Engine - the ONLY supported local dev path on macOS/Windows; also the recommended path on Linux to pin OS/JDK versions"
    - "Linux x86_64 or aarch64 Docker image (apache/spark:3.5.x on Ubuntu 22.04)"
  constraints:
    - "Local mode requires a JVM and the Gluten jar on disk inside the execution host (container or Linux VM)"
    - "Remote mode requires a pre-configured Spark-Connect server (typically a Linux container) with Gluten already wired"
    - "No prebuilt macOS/Windows bundle jars exist as of 1.4.x - all non-Linux development and CI MUST go through Docker"
    - "Native macOS builds of Gluten are not supported by upstream - do not attempt to work around; use Docker instead"
    - "Benchmarks run under Rosetta/qemu emulation produce meaningless timing numbers - match image arch to host arch (linux_arm64 for Apple Silicon, linux_amd64 for Intel)"
    - "Off-heap memory budget is a real resource cost; Docker-based defaults must respect container memory limits (docker run --memory) and safe 16GB developer laptops"
  compatibility: |
    Gluten is *additive* to Apache Spark. Any Spark-SQL workload BenchBox
    already runs on the Spark adapter should run on Gluten+Velox; the
    execution differences are:
      - Some operators fall back to JVM (logged by Gluten).
      - Numeric and timestamp edge cases may differ - treat as validation
        concerns, not correctness bugs, unless reproducible.
      - EXPLAIN output includes VeloxColumnar* / RowToVeloxColumnar nodes.

