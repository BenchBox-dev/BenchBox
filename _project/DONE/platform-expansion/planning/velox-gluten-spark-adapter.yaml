id: velox-gluten-spark-adapter
title: "Add Velox + Gluten Spark Acceleration Platform Adapter"
worktree: platform-expansion
priority: Medium
status: Not Started
category: Platform Expansion
description: |
  Add a BenchBox platform adapter for Apache Gluten with the Velox backend -
  a plugin to Apache Spark that offloads physical operators to a highly
  optimized native C++ engine (Velox) while preserving Spark's fault
  tolerance, distributed scheduling, and DataFrame/SQL APIs.

  Unlike LakeSail (a standalone Rust/DataFusion Spark-Connect server),
  Gluten+Velox runs *inside* Apache Spark via jar + plugin configuration.
  From a client perspective, a Gluten-accelerated Spark cluster still speaks
  standard Spark (Connect or classic) - the acceleration is invisible to the
  application. The adapter's job is therefore primarily to:

    1. Own the lifecycle of a Gluten-enabled SparkSession / Spark-Connect
       server (jars on the classpath, required conf set, off-heap memory).
    2. Expose Gluten/Velox-specific configuration knobs as CLI options.
    3. Capture native-execution metadata (backend = Velox vs. JVM fallback)
       in platform info and query plans.
    4. Reuse all Spark load/query/tuning plumbing already proven on
       LakeSail and Apache Spark adapters.

  Reference performance: TPC-H ~3.3x overall / up to ~23x on individual
  queries, TPC-DS ~3x overall / up to ~13.7x on individual queries (Gluten
  community numbers, March 2024). This makes Velox a natural fit next to
  LakeSail, Photon-backed Databricks, and Fabric native acceleration in
  BenchBox's "accelerated Spark" tier.

  Upstream references:
    - https://gluten.apache.org/
    - https://github.com/apache/gluten (ASF Top-Level Project since Feb 2026)
    - https://velox-lib.io/
    - https://apache.github.io/incubator-gluten/get-started/Velox.html

context_sections:
  "Why Velox and not just Spark": |
    Apache Spark's default executor is JVM + Catalyst + Tungsten. Velox
    replaces the physical operator layer with a vectorized C++ engine
    (columnar, SIMD-friendly, unified memory management). Gluten is the
    Spark plugin that:
      - Intercepts physical plans after Catalyst.
      - Translates supported operators/expressions into a Velox plan
        via Substrait.
      - Executes them natively off-heap; falls back to JVM row-based
        execution for unsupported operators (transparent row/columnar
        conversion).
      - Adds a ColumnarShuffleManager for native off-heap shuffle.

    For BenchBox this is interesting because we already benchmark Apache
    Spark and LakeSail; adding Gluten+Velox lets users answer "how much
    of the LakeSail speedup is 'native execution' vs 'non-Spark runtime'?"
    on identical hardware.

  "Deployment shapes": |
    Gluten+Velox can be deployed in several ways; the adapter should
    support at least (a) and (b) in v1, and (c) as a deferred follow-up:

      (a) Local standalone Spark (pyspark in-process or local[*])
          with the Gluten jar added to the driver/executor classpath.
          Cheapest to test, closest to Apache Spark adapter pattern.
          IMPORTANT: "local" in this context means "one Spark JVM on the
          same host as the Python client" - that host MUST be Linux
          (native or containerized). See "Docker dev workflow" below.

      (b) Remote Spark-Connect server that has been pre-started with
          Gluten jars and Gluten plugin config. Matches LakeSail adapter
          shape: connect with `sc://host:port`, do not manage cluster.
          The pre-started server is typically itself a Linux container.

      (c) Containerized/managed deployments (EMR, Dataproc, Fabric native
          execution, on-prem K8s). Out of v1 scope; configuration hooks
          only, no lifecycle management.

  "Docker dev workflow (primary local path on macOS / Windows)": |
    Gluten ships prebuilt bundle jars ONLY for linux_amd64 and
    linux_aarch64. No Darwin or Windows artifact exists, and upstream
    Gluten explicitly does not test macOS builds (see apache/incubator-
    gluten #5006 and #5491). BenchBox therefore standardizes on Docker
    as the primary local dev and CI path:

      Base image:    apache/spark:3.5.2 (or a matching pyspark 3.5.x jdk17)
      OS:            Ubuntu 22.04 (matches Gluten supported-OS matrix)
      JDK:           OpenJDK 17
      Python:        3.11+ with pyspark==3.5.x
      Jar:           bind-mount or COPY gluten-velox-bundle-spark3.5_2.12
                     -linux_{amd64|aarch64}-1.4.0.jar into the image
      Expose:        50051 (Spark-Connect) for 'remote' deployment, or run
                     the whole benchmark inside the container for 'local'.

    Two supported dev workflows:

      (1) Adapter-only Docker (benchbox client outside, Spark inside):
          docker run starts a Gluten-configured Spark-Connect server
          inside the container; benchbox on the host connects via
          `sc://localhost:50051` with deployment=remote. Host can be
          macOS or Linux. No Gluten binary on the host.

      (2) All-in-one Docker (benchbox client AND Spark inside):
          docker run executes `benchbox run --platform velox …` entirely
          inside the Linux container with deployment=local. Simpler for
          one-shot benchmarks and CI.

    Arch note: Apple Silicon hosts can run the linux_arm64 bundle image
    natively (no emulation). Intel Macs use linux_amd64. Do NOT rely on
    Rosetta/qemu emulation for benchmarks - it voids the timing numbers.

  "Minimum required Spark configuration": |
    spark.plugins                           = org.apache.gluten.GlutenPlugin
    spark.memory.offHeap.enabled            = true
    spark.memory.offHeap.size               = <off-heap, e.g. 8g-20g>
    spark.shuffle.manager                   = org.apache.spark.shuffle.sort.ColumnarShuffleManager
    spark.driver.extraClassPath             = <path to gluten-velox-bundle jar>
    spark.executor.extraClassPath           = <path to gluten-velox-bundle jar>

    Official supported Spark versions as of Gluten 1.4.x: 3.2.2, 3.3.1,
    3.4.4, 3.5.5. Bundle jar naming:
      gluten-velox-bundle-spark{3.5}_{2.12}-{linux_amd64|linux_aarch64}-{1.4.0}.jar

    Java 8 or 17. Linux only (Ubuntu 20/22, CentOS 8) for prebuilt jars.
    On macOS and Windows the adapter is exercised exclusively via Docker
    (see "Docker dev workflow" above). Native macOS/Darwin execution of
    Gluten is NOT supported by upstream and is NOT a goal of this work.

  "Relationship to existing adapters": |
    - benchbox/platforms/spark.py           - classic SparkSession; closest
                                              template for local-mode Gluten.
    - benchbox/platforms/lakesail.py        - Spark-Connect client adapter,
                                              auto-starts local server, no
                                              cluster mgmt. Template for
                                              remote-mode Gluten.
    - benchbox/platforms/base/spark_execution_mixin.py
                                            - SparkDataLoadMixin /
                                              SparkQueryExecutionMixin
                                              already handle load+query via
                                              PySpark. Reuse verbatim.
    - benchbox/platforms/base/cloud_spark.py - SparkTuningMixin, reuse.

  "Known Velox/Gluten caveats that affect benchmarks": |
    - Not every SQL operator is accelerated; Gluten logs fallback events.
      For honest benchmarking we should surface fallback counts in
      platform_info / per-query metadata.
    - Off-heap memory is mandatory and sized separately from heap; too
      small a value causes OOM or forced JVM fallback.
    - ColumnarShuffleManager is required for shuffle acceleration;
      omitting it silently forfeits most of the speedup.
    - DECIMAL precision, TIMESTAMP timezone semantics, and some TPC-DS
      queries historically have Velox-vs-Spark diffs. Validation mode
      `loose` may be required for some queries until parity is confirmed.
    - Dependency is not a pip package: Gluten ships a JVM bundle jar
      (~150MB). The adapter cannot be made importable purely via `uv add`
      - it also needs the jar on disk. The install UX must account for
      this (downloader helper or explicit user-supplied path).

