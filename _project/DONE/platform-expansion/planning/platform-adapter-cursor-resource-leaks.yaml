id: platform-adapter-cursor-resource-leaks
title: "Fix cursor and connection resource leaks across new platform adapters"
worktree: platform-expansion
priority: High
status: Completed
completed_date: "2026-02-16"
description: |
  Adversarial code reviews of PRs #27-33 identified cursor and connection resource
  leaks in 5 of 6 new platform adapters: QuestDB, Databend, pg_duckdb, pg_mooncake,
  and StarRocks. Common patterns:

  1. **Cursor not closed on exception**: When cursor.execute() raises in execute_query(),
     the except block returns without calling cursor.close(). Under sustained query
     failures (common in benchmarking), this leaks server-side cursors.
  2. **Orphaned cursors from mogrify()**: pg_duckdb and pg_mooncake create new cursors
     via conn.cursor().mogrify() for credential escaping, but never close them.
  3. **Connection leaks in test/check methods**: Databend's test_connection() and
     check_server_database_exists() create BlockingDatabendClient instances without
     closing them.

  These leaks accumulate during long benchmark runs and can exhaust server-side
  connection/cursor limits.

category: Platform Expansion

work:
  - id: w1
    summary: "Fix QuestDB execute_query cursor leak - add try/finally around cursor lifecycle"
    status: done
    notes: "questdb.py:500-542 - cursor not closed when cursor.execute() or cursor.fetchall() raises"

  - id: w2
    summary: "Fix QuestDB create_schema cursor leak - ensure cursor.close() on non-Exception errors"
    status: done
    notes: "questdb.py:246-266 - KeyboardInterrupt/SystemExit bypass cursor.close()"

  - id: w3
    summary: "Fix Databend test_connection and check_server_database_exists connection leaks"
    status: done
    notes: "databend/adapter.py:594-603, 654-668 - BlockingDatabendClient never closed"

  - id: w4
    summary: "Fix pg_duckdb orphaned cursor from conn.cursor().mogrify() in create_connection"
    status: done
    notes: "pg_duckdb.py:255 - use existing cursor variable instead of creating new one"

  - id: w5
    summary: "Fix pg_mooncake orphaned cursor from conn.cursor().mogrify() in create_connection"
    status: done
    notes: "pg_mooncake.py:165 - same pattern as pg_duckdb"

  - id: w6
    summary: "Add unit tests verifying cursor.close() is called on exception paths"
    needs: [w1, w2, w3, w4, w5]
    status: done
    notes: "StarRocks already has test_cursor_closed_on_execute_query_failure - replicate pattern"

metadata:
  tags:
    - resource-leak
    - cursor
    - connection
    - reliability
    - code-review-finding
  estimated_effort: 1-2 days
  created_date: "2026-02-15"
  owners:
    - joe

must_preserve:
  - "All existing platform adapter unit tests pass: uv run -- python -m pytest tests/unit/platforms/ -v --tb=short"
  - "execute_query() return values unchanged - dict with 'rows', 'execution_time_seconds', etc."
  - "create_connection() return value unchanged - valid connection object"

approach: |
  For each adapter, wrap cursor usage in try/finally blocks. Follow the pattern
  already established in StarRocks (starrocks/workload.py) which uses:
    cursor = connection.cursor()
    try:
        cursor.execute(query)
        ...
    finally:
        cursor.close()

  For mogrify calls, reuse the existing cursor variable instead of creating a new one.
  For Databend client leaks, add try/finally around BlockingDatabendClient usage.

anti_patterns:
  - "DO NOT use context managers (with conn.cursor() as cur) - because not all database drivers support cursor as context manager
    - use explicit try/finally"
  - "DO NOT catch BaseException for cleanup - because cursor.close() itself might fail - use finally blocks which handle this
    correctly"

verification:
  - description: "All platform adapter tests pass"
    command: "uv run -- python -m pytest tests/unit/platforms/ -v --tb=short"
    expected_output: "all tests pass, 0 failures"
  - description: "QuestDB cursor lifecycle test"
    command: "uv run -- python -m pytest tests/unit/platforms/test_questdb_adapter.py -v --tb=short"
    expected_output: "all tests pass"
  - description: "pg extension cursor lifecycle tests"
    command:
      "uv run -- python -m pytest tests/unit/platforms/test_pg_duckdb_adapter.py tests/unit/platforms/test_pg_mooncake_adapter.py
      -v --tb=short"
    expected_output: "all tests pass"

scope_limit:
  only_modify:
    - "benchbox/platforms/questdb.py"
    - "benchbox/platforms/databend/adapter.py"
    - "benchbox/platforms/pg_duckdb.py"
    - "benchbox/platforms/pg_mooncake.py"
    - "tests/unit/platforms/test_questdb_adapter.py"
    - "tests/unit/platforms/test_databend_adapter.py"
    - "tests/unit/platforms/test_pg_duckdb_adapter.py"
    - "tests/unit/platforms/test_pg_mooncake_adapter.py"
  do_not_modify:
    - "benchbox/core/runner.py"
    - "benchbox/platforms/duckdb.py"
    - "benchbox/platforms/postgres.py"
