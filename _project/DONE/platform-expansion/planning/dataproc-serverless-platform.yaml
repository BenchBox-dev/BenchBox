id: dataproc-serverless-platform
title: "GCP Dataproc Serverless Platform"
worktree: platform-expansion
priority: Medium
status: "Completed"
category: Platform Expansion

description: |
  Add GCP Dataproc Serverless platform adapter. Serverless variant provides
  fully managed Spark with no cluster management and auto-scaling.

  Implementation shares 80% code with Dataproc cluster adapter. Uses Batch
  Controller API instead of Jobs API.

