implementation_notes: |
  Implemented using the cloud-spark shared infrastructure:
  - CloudSparkStaging.from_uri() for GCS data uploads
  - SparkConfigOptimizer.for_tpch() for benchmark-specific Spark configs
  - DataprocJobState enum for job state tracking

  Key adapter features:
  - Persistent cluster mode (reuse existing cluster)
  - Ephemeral cluster mode (create/delete per job)
  - Preemptible VM support for cost savings
  - Job polling with timeout
  - Results written to GCS and retrieved after completion

