id: clickhouse-coffeeshop-dialect-overrides
title: "Add ClickHouse dialect overrides for coffeeshop QSA4 (sumIf) and QTM1 (TIME type)"
worktree: platform-expansion
category: Platform Expansion
priority: Medium-High
status: Completed
completed_date: "2026-04-08"
description: |
  6 query failures on ClickHouse in coffeeshop benchmark:
  - QSA4 × 3: SUM(x) FILTER (WHERE cond) → ClickHouse needs sumIf(x, cond)
  - QTM1 × 3: EXTRACT(HOUR FROM order_time) where order_time is TIME type →
    toHour() doesn't accept bare TIME values, needs toHour(toDateTime(order_time))

  Part of Pattern B (EXTRACT) and Pattern D (FILTER aggregate).

work:
  - id: w1
    summary: "Create ClickHouse override for SA4 - actual issue is nested window aggregate SUM(SUM()) OVER (), replaced with CROSS JOIN subquery. TODO description was incorrect about FILTER clause."
    status: done

  - id: w2
    summary: "Create ClickHouse override for TM1 using toHour(toDateTime(order_time)) for TIME-type column"
    status: done

  - id: w3
    summary: "Add unit tests: load SA4/TM1 for ClickHouse and assert SQL avoids nested window aggregate and uses toDateTime() respectively"
    needs: [w1, w2]
    status: done

files_affected:
  added:
    - "benchbox/core/coffeeshop/queries/clickhouse_sql/qsa4.sql"
    - "benchbox/core/coffeeshop/queries/clickhouse_sql/qtm1.sql"

must_preserve:
  - "Base coffeeshop QSA4/QTM1 queries unchanged - other platforms use standard FILTER and EXTRACT"
  - "Override queries return identical column names and semantics"

anti_patterns:
  - "DO NOT modify base query files - because other platforms depend on standard SQL FILTER/EXTRACT - create clickhouse_sql/ overrides instead"
  - "DO NOT use toHour() directly on TIME columns - because ClickHouse toHour() rejects bare TIME values - wrap in toDateTime() first"

approach: |
  Follow existing override pattern. For QSA4, mechanically replace
  SUM(x) FILTER (WHERE cond) with sumIf(x, cond). For QTM1, wrap
  order_time in toDateTime() before passing to toHour().

verification:
  - description: "ClickHouse coffeeshop overrides load with sumIf and toDateTime wrappers"
    command: "uv run -- python -m pytest tests/ -v -k 'coffeeshop and clickhouse'"
    expected_output: "Tests pass confirming sumIf/toDateTime overrides for QSA4/QTM1"

metadata:
  tags:
    - clickhouse
    - coffeeshop
    - dialect-override
    - sf1-failures
  created_date: "2026-04-08"
  estimated_effort: "Small"

impact:
  business_value: |
    Fixes 6 query failures (2 queries × 3 iterations).
