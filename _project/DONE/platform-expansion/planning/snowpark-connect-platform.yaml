success_metrics:
  - "Snowpark Connect runs TPC-H SF=0.01 power test"
  - "Limitations clearly documented"
  - "Unit test coverage > 85%"

completion_notes: |
  Implemented Snowpark Connect adapter with:
  - PySpark-compatible DataFrame API on Snowflake
  - Snowpark Session management (create_connection, close)
  - SQL and DataFrame execution methods
  - Full Snowflake authentication support (password, key-pair, SSO)
  - 27 unit tests passing
  - Example script with cost estimation
  - Full platform documentation with limitations table

  Key difference from other cloud Spark platforms: NOT Apache Spark.
  Operations are translated to Snowflake SQL for native execution.

context_sections:
  "Technical Context": |
    Snowpark Connect is NOT Apache Spark - it's a PySpark API compatibility layer
    that translates DataFrame operations to Snowflake SQL. This provides:
    - Consistent API with other managed Spark platforms
    - No Spark cluster required
    - Snowflake's native query optimization

    Trade-offs:
    - Some Spark features unavailable (RDD, hint, repartition)
    - May behave differently from true Spark in edge cases
