technical_requirements:
  dependencies:
  - "boto3>=1.34.0"
  constraints:
  - "Requires IAM role with Glue + S3 permissions"
  - "S3 bucket required for data staging"
  - "Glue Data Catalog used for table metadata"

implementation_notes: |
  Implemented using the cloud-spark shared infrastructure:
  - CloudSparkStaging.from_uri() for S3 data uploads
  - SparkConfigOptimizer.for_tpch() for benchmark-specific Spark configs
  - GlueJobStatus enum for job state tracking

  Key adapter features:
  - Batch execution model (jobs submitted via Glue API)
  - Automatic job creation with optimized Spark config
  - Job polling with timeout and DPU tracking
  - Results written to S3 and retrieved after completion

