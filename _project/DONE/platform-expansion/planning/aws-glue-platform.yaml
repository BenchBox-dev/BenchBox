id: aws-glue-platform
title: "AWS Glue Managed Spark Platform"
worktree: platform-expansion
priority: High
status: Completed
category: Platform Expansion
completed_date: "2025-12-24"

description: |
  Add AWS Glue managed Spark platform adapter supporting both SQL and DataFrame modes.
  AWS Glue has ~60% market share for AWS Spark workloads. Implementation reuses
  cloud-spark shared infrastructure for staging, session management, and config optimization.

  Uses AWS Glue Jobs API for job submission, Glue Data Catalog for metadata,
  and S3 for data staging.

