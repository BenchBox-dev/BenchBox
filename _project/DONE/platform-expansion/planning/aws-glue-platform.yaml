impact:
  business_value: |
    AWS Glue is the dominant AWS Spark platform (~60% market share). Adding support
    enables benchmarking for the largest segment of AWS Spark users.
  user_impact: |
    AWS users can benchmark their Glue ETL workloads using TPC benchmarks.
    Cost estimation: ~$0.44/DPU-hour.

