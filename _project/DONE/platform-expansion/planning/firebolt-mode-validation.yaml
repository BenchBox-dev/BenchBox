title: Firebolt Core/Cloud Mode Validation
worktree: platform-expansion
priority: Medium
status: "Completed"
category: Platform Polish
description: |
  Improve Firebolt adapter mode detection and validation.

  Firebolt has two distinct deployment modes:
  - Core: Local Docker container on port 3473
  - Cloud: Managed service with client_id/client_secret

