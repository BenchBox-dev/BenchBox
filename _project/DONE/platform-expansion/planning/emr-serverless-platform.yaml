implementation_notes: |
  Implemented using the cloud-spark shared infrastructure:
  - CloudSparkStaging.from_uri() for S3 data uploads
  - SparkConfigOptimizer.for_tpch() for benchmark-specific Spark configs
  - EMRServerlessJobState enum for job state tracking

  Key adapter features:
  - Application lifecycle management (create/start/stop)
  - Job run submission with polling
  - vCPU-hour and memory-GB-hour tracking
  - Pre-initialized capacity support for sub-second startup
  - Results written to S3 and retrieved after completion

