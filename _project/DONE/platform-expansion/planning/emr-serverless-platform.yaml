description: |
  Add Amazon EMR Serverless managed Spark platform adapter. EMR Serverless provides
  true serverless Spark with sub-second startup and automatic resource scaling.

  Implementation reuses S3 staging and IAM auth patterns from AWS Glue adapter.
  Uses EMR Serverless API for application and job management.

