id: clickhouse-error-message-capture
title: "Fix ClickHouse adapter to capture error messages in query results"
worktree: platform-expansion
category: Core Functionality
priority: Medium-High
status: Completed
completed_date: "2026-04-12"
description: |
  The ClickHouse adapter captures failure status but swallows the exception message.
  read_primitives and tpcdi result JSONs show "status": "FAILED" with no error string,
  making diagnosis of query failures much harder.

  The adapter's query execution error handler should always capture str(exception)
  into the result object. This is Pattern G from the SF1 failure analysis.

work:
  - id: w1
    summary: "Find the ClickHouse adapter's query execution error handler - locate where exceptions are caught but messages discarded"
    status: done

  - id: w2
    summary: "Ensure str(exception) is always written to the result error field"
    needs: [w1]
    status: done

  - id: w3
    summary: "Add unit test verifying error messages are captured in query results"
    needs: [w2]
    status: done

files_affected:
  modified:
    - "benchbox/platforms/clickhouse/adapter.py"

must_preserve:
  - "Query execution flow and retry logic unchanged"
  - "Successful queries unaffected"

anti_patterns:
  - "DO NOT catch exceptions without storing str(e) in the result error field - because swallowed errors force manual re-runs for diagnosis - always capture the message"
  - "DO NOT change query execution flow or retry logic - because this is a diagnostics-only fix - only add error message capture to existing except blocks"

approach: |
  Search the ClickHouse adapter for try/except blocks in query execution methods.
  Look for patterns where the exception is caught to set status=FAILED but the
  error message is not stored. Ensure the error field in QueryResult is populated.

verification:
  - description: "Error messages appear in query results when queries fail"
    command: "uv run -- python -m pytest tests/ -v -k 'clickhouse and (error_capture or error_message)'"
    expected_output: "Tests pass confirming str(exception) is stored in result.error for failed queries"

metadata:
  tags:
    - clickhouse
    - diagnostics
    - bug
    - sf1-failures
  created_date: "2026-04-08"
  estimated_effort: "Small"

impact:
  business_value: |
    Improves diagnostics for all ClickHouse query failures. Without error messages,
    debugging requires re-running queries manually against the database.
  technical_debt: |
    Silent error swallowing is an anti-pattern that makes all ClickHouse failure
    analysis harder than it needs to be.
