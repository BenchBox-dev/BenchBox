implementation_notes: |
  Implemented using the cloud-spark shared infrastructure:
  - CloudSparkStaging.from_uri() for OneLake data uploads
  - SparkConfigOptimizer.for_tpch() for benchmark-specific Spark configs
  - Livy REST API for session and statement management

  Key adapter features:
  - DefaultAzureCredential for flexible authentication
  - Token refresh with 5-minute buffer
  - Session lifecycle management (create/verify/close)
  - Statement polling with configurable timeout
  - LivySessionState and LivyStatementState constants

