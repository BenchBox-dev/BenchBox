id: fabric-spark-platform
title: "Microsoft Fabric Spark Platform"
worktree: platform-expansion
priority: Medium-High
status: Completed
category: Platform Expansion
completed_date: "2025-12-24"

description: |
  Add Microsoft Fabric Spark platform adapter. Fabric is Microsoft's SaaS unified
  analytics platform replacing Azure Synapse for new deployments. Uses OneLake
  for storage and Livy API for Spark session management.

  Implementation uses Azure Entra ID for authentication and OneLake (ADLS Gen2)
  for data staging.

