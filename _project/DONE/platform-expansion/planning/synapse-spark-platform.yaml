title: "Azure Synapse Spark Platform"
worktree: platform-expansion
priority: Medium
status: "Completed"
category: Platform Expansion

description: |
  Add Azure Synapse Spark platform adapter. Synapse Spark is used by existing
  enterprise deployments and provides integrated analytics with Synapse SQL pools.

  Implementation shares 70% code with Fabric Spark adapter (authentication,
  staging, Livy protocol).

tasks:
  phases:
    - phase: "Phase 1: Adapter Implementation"
      done: true
      items:
        - summary: "Create SynapseSparkAdapter class"
          done: true
          subtasks:
            - summary: "Implement create_connection() with Synapse Livy endpoint"
              done: true
            - summary: "Reuse Azure Entra ID authentication from Fabric adapter"
              done: true
            - summary: "Implement Spark pool management"
              done: true
            - summary: "Support external Hive Metastore option"
              done: true
        - summary: "Support SQL and DataFrame execution modes"
          done: true
        - summary: "Register in platform_registry.py"
          done: true

    - phase: "Phase 2: Testing"
      done: true
      items:
        - summary: "Create unit tests with mocked Synapse API"
          done: true
        - summary: "Add smoke test gated by @pytest.mark.live_synapse_spark"
          done: false
          notes: "Deferred - requires live Synapse workspace for testing"

    - phase: "Phase 3: Documentation"
      done: true
      items:
        - summary: "Create examples/getting_started/cloud/synapse_spark_tpch.py"
          done: true
        - summary: "Write docs/platforms/synapse-spark.md"
          done: true

