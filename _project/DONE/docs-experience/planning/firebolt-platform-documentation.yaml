category: Documentation and User Experience
description: |
  Create comprehensive platform documentation for Firebolt.

  Firebolt has two distinct modes that need clear documentation:
  - Firebolt Core: Local Docker-based deployment (port 3473)
  - Firebolt Cloud: Managed service with client credentials

  This is a growing platform with increasing adoption that currently has no
  user-facing documentation in BenchBox.

