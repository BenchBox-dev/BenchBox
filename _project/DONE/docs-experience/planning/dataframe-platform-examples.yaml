title: DataFrame Platform Example Scripts
worktree: docs-experience
priority: Medium
status: "Completed"
category: Documentation and User Experience
description: |
  Create example Python scripts for DataFrame platforms.

  DataFrame mode is a key differentiator for BenchBox but lacks examples.
  Need examples for:
  - Polars (fastest DataFrame platform)
  - CuDF (GPU-accelerated)

  Examples should demonstrate:
  - DataFrame adapter initialization
  - TPC-H benchmark execution
  - Result interpretation

