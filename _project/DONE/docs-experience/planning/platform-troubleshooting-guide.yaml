  Enhanced docs/usage/troubleshooting.md with comprehensive coverage:

  Quick Diagnosis:
  - Error type matrix for fast lookup (8 error categories)

  Common Issues:
  - Connection refused with Docker startup commands
  - Network timeouts with firewall checks
  - Authentication failures for 4 major cloud platforms
  - Presto/Trino catalog not found with catalog listing
  - Permission errors with SQL GRANT examples

  Performance Issues:
  - Query timeout solutions with platform-specific settings
  - Memory issues with DuckDB, Polars, Spark, cloud solutions
  - Scale factor recommendations table

  Data Issues:
  - File not found with generation commands
  - Upload failures for S3, Snowflake stages, Databricks volumes

  Platform-Specific:
  - Snowflake warehouse resume
  - Databricks cluster startup API call
  - BigQuery quota management

  All solutions follow Problem → Cause → Solution format with copy-paste commands.

