completion_notes: |
  Expanded benchbox/cli/help.py COMMAND_EXAMPLES with comprehensive categories:

  Platform-Specific Examples:
  - Snowflake: S3 output, warehouse sizing, tuning with clustering
  - Databricks: Unity Catalog Volumes, ABFSS paths, Photon optimization
  - BigQuery: GCS output, project_id option, partitioning examples
  - Redshift: S3 staging, IAM role configuration
  - Local Platforms: DuckDB, SQLite, PostgreSQL quick reference
  - DataFrame Platforms: Polars, Pandas, DataFusion, Dask, cuDF

  Use-Case Examples:
  - Quick Validation (CI/CD): Small scale, subset queries, non-interactive mode
  - Full TPC Benchmark: All phases, scale factors, cloud output
  - Platform Comparison: Multi-platform run pattern for benchmarking
  - Data Generation Only: Generate phase without platform
  - Export and Analysis: Multiple output formats

  Configuration Examples:
  - Tuning Configuration: tuned/notuning/auto modes, custom YAML files
  - Data Regeneration: --force options for datagen/upload
  - Dry Run (Preview): Preview without execution
  - Compression (Advanced): zstd/gzip levels, disable
  - Plan Capture (Advanced): sampling, first-n, query selection
  - Validation (Advanced): exact/loose/full/disabled modes

  Updated tests/unit/test_cli_documentation.py:
  - Added test_run_command_help_examples for categorized examples
  - Updated parametrized tests for new help structure

metadata:
  owners:
  - "@benchbox-maintainers"
  tags:
  - cli
  - documentation
  - examples
  estimated_effort: 1-2 days
  created_date: "2025-12-12"

impact:
  business_value: |
    Self-documenting CLI reduces support burden. Users can discover
    functionality without leaving the terminal.
  user_impact: |
    Users find relevant examples quickly via --help without searching docs.
    Platform-specific examples prevent common configuration errors.

success_metrics:
- "Each major platform has dedicated example section"
- "Common use cases have copy-paste examples"
- "Examples tested and verified to work"
