completion_notes: |
  Created 3 new example scripts in examples/getting_started/cloud/:

  1. firebolt_core_tpch.py (159 lines)
     - Demonstrates Firebolt Core (local Docker) deployment
     - No authentication required - just local URL
     - Includes Docker setup instructions
     - Dry-run support for previewing queries

  2. firebolt_cloud_tpch.py (178 lines)
     - Demonstrates Firebolt Cloud (managed service)
     - OAuth client credentials authentication
     - Engine and account configuration
     - Cost considerations documented

  3. athena_tpch.py (200 lines)
     - Demonstrates AWS Athena serverless queries
     - S3 staging configuration
     - Cost estimation based on data scanned
     - Parquet format recommendations

  Each script follows existing patterns from databricks_tpch_power.py:
  - Environment variable validation
  - Dry-run mode with execute_example_dry_run()
  - Comprehensive docstrings with prerequisites
  - Platform-specific concept explanations
  - Cost optimization tips

  Added 9 new tests in tests/examples/test_getting_started_examples.py:
  - test_firebolt_core_runs_with_defaults
  - test_firebolt_core_dry_run
  - test_firebolt_cloud_requires_env
  - test_firebolt_cloud_runs_with_env
  - test_firebolt_cloud_dry_run
  - test_athena_requires_env
  - test_athena_runs_with_env
  - test_athena_dry_run

  All 19 example tests pass.

