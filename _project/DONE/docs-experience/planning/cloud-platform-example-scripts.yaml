description: |
  Create example Python scripts for cloud platforms currently lacking examples.

  Missing examples for:
  - Firebolt (Core and Cloud modes)
  - Athena (with S3 staging)

  Examples should be runnable scripts that demonstrate:
  - Platform adapter initialization
  - Benchmark configuration
  - Result handling

