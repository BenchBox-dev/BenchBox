completion_notes: |
  Added 8 new platform sections to `benchbox run --help examples`:

  Platform Examples Added:
  - Firebolt Core: Docker URL, database configuration
  - Firebolt Cloud: client_id, client_secret, account, engine
  - Presto: host, port, catalog selection (hive, iceberg, memory)
  - Trino: host, port, catalog selection, user specification
  - Athena: s3_staging_dir, workgroup, region, database
  - Azure Synapse: server, database, authentication, resource_class
  - Fabric Warehouse: server, workspace, warehouse
  - PostgreSQL: host, port, username, password, schema, sslmode

  Each section includes 2-4 practical examples with inline comments
  explaining platform-specific options and concepts.

  Tests updated to verify all 8 new platform sections are present.
  All 24 CLI documentation tests pass.

