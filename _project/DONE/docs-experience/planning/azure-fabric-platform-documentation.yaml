description: |
  Create platform documentation for Microsoft Azure data platforms.

  Two platforms need documentation:
  - Azure Synapse Analytics (dedicated + serverless SQL pools)
  - Microsoft Fabric Warehouse (Power BI integration)

  Both platforms share Azure AD authentication patterns but have
  distinct features and use cases.

