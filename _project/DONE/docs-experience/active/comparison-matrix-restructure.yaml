impact:
  business_value: |
    Complete platform documentation enables users to make informed decisions,
    reducing support burden and improving platform adoption across the 35
    supported engines.
  user_impact: |
    Users currently cannot discover 72% of available SQL platforms through
    the comparison matrix. This restructuring provides 100% coverage with
    improved navigation through categorical grouping.
  technical_debt: |
    Current document structure requires updating 15+ tables when adding a
    new platform. Grouped structure reduces this to 1-2 tables per platform.

