    \ to subtitle.\n\n2. **Navigation**: Added \"MCP\" link between \"Platforms\" and \"Install\".\n\n3. **Features**: Replaced\
    \ \"CLI and Library\" card with \"AI-Powered with MCP\" card\n   featuring robot emoji and MCP description.\n\n4. **Dedicated\
    \ MCP Section**: Created new section with:\n   - Purple/violet theme (distinct from blue Platforms section)\n   - Quick\
    \ setup code snippet for Claude Code\n   - Three capability cards: Discover, Execute, Analyze\n   - Natural language example\
    \ prompts\n   - Link to full MCP documentation\n\n5. **CSS Styling**: Added 80+ lines of MCP-specific styles including:\n\
    \   - Purple background (#1a1525)\n   - Purple accent color (#b392f0)\n   - Styled example prompts with monospace font\n\
    \   - Purple-themed documentation link button\n\n6. **Documentation Navigation**: Added MCP guide to Getting Started toctree\n\
    \   and MCP reference to Reference toctree in docs/index.rst."
