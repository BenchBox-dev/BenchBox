context_sections:
  "Current Site Architecture": |
    - Landing page: Pure HTML/CSS/JS at root (landing/)
    - Docs: Sphinx + Furo + MyST at /docs/
    - Deployment: GitHub Actions → GitHub Pages
    - Domain: benchbox.dev with custom CNAME

  "Why ABlog": |
    ABlog is a Sphinx extension that adds blogging capabilities. Key benefits:
    - Same toolchain as existing docs (Sphinx)
    - Same theme (Furo) for visual consistency
    - Same content format (Markdown via MyST)
    - Same deployment pipeline (GitHub Actions)
    - Single new dependency: `uv add ablog`

    Alternatives considered and rejected:
    - Hugo/Pelican: Require separate toolchain and theme
    - Plain Markdown: Lacks blog features (RSS, archives, tags)
    - Jekyll: Ruby dependency, different ecosystem

  "Implementation Notes": |
    ABlog 0.11.12 has a compatibility issue with Sphinx 9.x that requires
    ABlog 0.11.13+ (from GitHub main branch). Custom templates were created
    in docs/_templates/ to bridge ABlog with Furo theme since Furo doesn't
    support extensions that extend layout.html.

    Key templates created:
    - page.html: Extends Furo's page.html, adds RSS link and blog post navigation
    - ablog/collection.html: Archive pages (by date, tag, author)
    - ablog/catalog.html: Catalog listing pages
    - ablog/redirect.html: Post redirect pages
