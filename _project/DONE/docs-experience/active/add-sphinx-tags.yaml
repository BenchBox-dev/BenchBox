impact:
  business_value: 'Improved documentation discoverability helps users find relevant content faster,

    reducing friction and support burden. Tag-based navigation is a standard feature

    users expect from modern documentation.

    '
  user_impact: 'Users can browse documentation by topic, skill level, platform, or benchmark

    instead of relying solely on hierarchical navigation. Cross-cutting concerns

    (e.g., "all TPC-H content" or "all beginner content") become discoverable.

    '
  technical_debt: 'Minimal - sphinx-tags is a lightweight extension. Generated tag files are

    excluded from git. Taxonomy is documented for consistent future tagging.

    '
files_affected:
  modified:
  - pyproject.toml
  - docs/conf.py
  - docs/index.rst
  - .gitignore
  - docs/**/*.md (144 files)
  - docs/**/*.rst (57 files)
  added:
  - docs/_tags/ (generated, gitignored)
context_sections:
  Tagging Taxonomy: "40 controlled tags across 6 categories:\n\nAudience (4): beginner, intermediate, advanced, contributor\n\
    Content Type (5): tutorial, guide, reference, concept, quickstart\nBenchmarks (7): tpc-h, tpc-ds, tpc-di, ssb, clickbench,\
    \ h2odb, custom-benchmark\nPlatform Category (4): sql-platform, dataframe-platform, cloud-platform, embedded-platform\n\
    Specific Platforms (7): duckdb, sqlite, snowflake, databricks, bigquery, polars, pandas\nFeatures (11): cli, python-api,\
    \ configuration, data-generation, validation, tuning,\n               visualization, cloud-storage, testing, performance\n"
  Tag Syntax: 'Markdown (MyST) - after H1 title:

    ```{tags} beginner, tutorial, tpc-h

    ```


    RST - after title underline:

    .. tags:: reference, python-api, tpc-h

    '
  Badge Color Scheme: '- Audience: success (green), info (blue), warning (orange), primary (purple)

    - Content Type: primary, info, secondary, dark, success

    - Benchmarks: danger (red/orange) for TPC, warning for others

    - Platforms: info (SQL), primary (DataFrame), success (Cloud)

    - Features: varied by function

    '
technical_requirements:
  dependencies:
  - sphinx-tags>=0.4.0
  - sphinx-design>=0.6.0
  compatibility: 'Requires MyST parser (already configured) for Markdown tag directive support.

    Compatible with Furo theme. sphinx-design required for badge styling.

    '
success_metrics:
- Documentation builds without sphinx-tags warnings
- All 201 documentation files have 2-5 tags
- Tag index page generates and displays correctly
- Badge colors render correctly with Furo theme
- No orphan tags (tags used only once)
