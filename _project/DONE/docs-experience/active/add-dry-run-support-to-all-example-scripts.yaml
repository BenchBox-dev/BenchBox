title: Add Dry Run Support to All Example Scripts
worktree: docs-experience
category: Project Lifecycle Management
priority: Medium
status: Completed
completed_date: 2025-11-28
description: '"Add --dry-run parameter to all example scripts in `examples/` directory that prints all planned work to an output location without generating data or running queries"'
impact: Enables users to preview and validate benchmark execution plans before committing resources, improves debugging and configuration validation, provides transparency into benchmark operations, supports automated testing and CI/CD workflows
tasks:
- phase: Complex script dry-run support
  done: true
  notes: |
    All complex scripts have --dry-run support:
    - getting_started/cloud/bigquery_tpch_dry_run.py
    - getting_started/cloud/databricks_tpch_power.py
    - unified_runner.py
    - use_cases/platform_evaluation.py
    - use_cases/cost_optimization.py
    Simple local scripts also have dry-run (optional but included):
    - getting_started/local/duckdb_tpch_power.py
    - getting_started/local/duckdb_tpcds_power.py
    - getting_started/intermediate/duckdb_tpch_query_subset.py
    - features/query_subset.py
    - features/tuning_comparison.py
- phase: Shared helper implementation
  done: true
  notes: |
    - benchbox.examples.execute_example_dry_run() utility exists
    - benchbox.cli.dryrun.DryRunExecutor class handles execution
    - Outputs structured JSON + human-readable previews
- phase: Documentation
  done: true
  notes: |
    - examples/dry_run/README.md documents dry-run patterns
    - examples/README.md references dry-run examples
    - 5 example scripts in examples/dry_run/ demonstrate various use cases
- phase: Testing
  done: true
  notes: |
    - tests/unit/cli/test_cli_dryrun.py: 15 passing tests
    - tests/integration/test_tpcds_dry_run_validation.py
    - tests/examples/test_getting_started_examples.py
additional_lists:
  Example Classification:
  - Complex: examples/getting_started/cloud/bigquery_tpch_dry_run.py - HAS dry-run
  - Complex: examples/getting_started/cloud/databricks_tpch_power.py - HAS dry-run
  - Complex: examples/unified_runner.py - HAS dry-run
  - Simple: examples/getting_started/local/duckdb_tpch_power.py - HAS dry-run (bonus)
  - Simple: examples/getting_started/local/duckdb_tpcds_power.py - HAS dry-run (bonus)
  - Simple: examples/getting_started/intermediate/duckdb_tpch_query_subset.py - HAS dry-run (bonus)
  Scripts Without Dry-Run (by design - simple local demos):
  - examples/features/test_types.py - educational demo, no external resources
  - examples/features/maintenance_workflow.py - educational demo
  - examples/features/multi_platform.py - local DuckDB/SQLite only
  - examples/features/export_formats.py - result export, no benchmark execution
  - examples/features/result_analysis.py - result analysis only
  - examples/features/performance_monitoring.py - monitoring demo
  - examples/features/data_validation.py - validation demo
  - examples/use_cases/ci_regression_test.py - CI-focused, uses local DuckDB
  - examples/use_cases/incremental_tuning.py - local tuning demo
  - examples/duckdb_coffeeshop.py - simple local example
sections:
- name: Implementation Summary
  content: |
    Dry-run support is complete for all examples that need it, following the
    implementation plan's guidance to focus on "complex" scripts (cloud platforms,
    multi-platform orchestration) while leaving simple local demos without dry-run.

    Key accomplishments:
    - All cloud platform examples have --dry-run (BigQuery, Databricks)
    - Unified runner has comprehensive --dry-run support
    - Platform evaluation has --dry-run for comparing configurations
    - Local DuckDB examples have bonus --dry-run support
    - Shared helper (execute_example_dry_run) provides consistent implementation
    - Documentation in examples/dry_run/README.md
    - 15+ tests covering dry-run functionality
