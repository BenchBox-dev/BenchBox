- name: SQLite PRAGMA cache_size
  summary: "Location: benchbox/platforms/sqlite.py:220-221\nForced: PRAGMA cache_size = 10000 (~40MB with default page size)\n\
    Impact: Significant memory/performance lever; audit mentions WAL, foreign_keys,\n        synchronous, temp_store but OMITS\
    \ cache_size\nRecommendation: JUSTIFIED - necessary for OLAP performance; add to audit doc\n"
- name: DataFusion Disk Manager
  summary: "Location: benchbox/platforms/datafusion.py:232-237\nForced: with_disk_manager_os() ALWAYS called if RuntimeEnvBuilder\
    \ available\nImpact: Enables disk spilling globally; may write to system temp without explicit\n        temp_dir configuration;\
    \ audit mentions \"spill enablement\" but not the\n        forced disk manager activation\nRecommendation: JUSTIFIED but\
    \ incomplete - document that disk_manager_os() is forced\n                and may use system temp\n"
- name: DuckDB Thread and Temp Limits
  summary: "Location: benchbox/platforms/duckdb.py:210-217\nForced: SET threads TO {thread_limit}, SET max_temp_directory_size\
    \ = '{size}'\nImpact: Controls parallelism and disk spillover limits; audit mentions \"temp/thread\n        knobs\" generically\
    \ but doesn't document specific enforcement\nRecommendation: JUSTIFIED but incomplete - document specific SET statements\
    \ and defaults\n"
impact: Memory footprint, disk usage, and performance characteristics; incomplete documentation
