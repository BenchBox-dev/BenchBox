title: "Enhance and extend ASCII charting with new chart types and comparison visualizations"
worktree: core-functionality
priority: Medium-High
status: Completed
completed_date: "2026-02-06"
category: Core Functionality
description: |
  Enhance the existing ASCII charting module (benchbox/core/visualization/ascii/) with new chart
  types and improved comparison visualizations. The current implementation has 6 chart types across
  ~2,255 lines and is well-architected with terminal capability detection, ANSI color support, and
  Unicode fallbacks.

  Key enhancements needed:
  1. Paired comparison bar chart — side-by-side bars (e.g., SQL vs DataFrame) with inline percentage
     change annotations, regression/improvement color coding, and scale notes
  2. Diverging bar chart — centered-zero horizontal bars showing regression/improvement distribution,
     sorted by magnitude, with overflow arrows for outliers
  3. Summary box — bordered panel with key aggregate metrics (geo mean, total time, improved/stable/
     regressed counts, worst/best queries)
  4. Inline percentage annotations — "+23%", "-57%", "← !" markers alongside bars
  5. Intelligent truncation — handle outliers (e.g., Q21 +726%) by truncating bars with indicators
     rather than compressing the entire scale

  Library evaluation conclusion: Keep custom implementation. Evaluated 10+ terminal charting libraries
  (plotext, plotext-plus, termgraph, plotille, uniplot, rich, textual, asciichartpy, drawille,
  bashplotlib). None can replace the existing module without significant adaptation. Key reasons:
  - BenchBox needs render() -> str pattern; most libraries print to stdout
  - Benchmark-specific features (Pareto frontiers, best/worst markers, grouped multi-platform bars,
    auto-chunking) don't exist in any library
  - Sub-character bar precision (1/8 Unicode blocks) exceeds all library implementations
  - 4-tier terminal color degradation (truecolor -> 256 -> 16 -> none) with NO_COLOR support is
    more robust than any library
  - Zero dependency advantage is significant
  Closest competitor was plotext-plus (7/10 fit) but still needs wrappers for string output,
  benchmark annotations, and regression highlighting. Full evaluation documented in this item.

tasks:
  phases:
    - title: "Add paired comparison bar chart"
      description: |
        New ASCIIComparisonBar class for side-by-side per-query comparison of two runs/modes.
        Each query shows two horizontal bars (e.g., SQL and DF) with percentage change annotation.
        Features: color-coded regression (red) vs improvement (green), configurable bar width,
        value labels, scale indicator at bottom. Support truncation of outlier bars with "← !" marker.
      items:
        - description: "Create ASCIIComparisonBar class inheriting from ASCIIChartBase"
          done: true
        - description: "Implement paired bar rendering with 1/8 block precision"
          done: true
        - description: "Add inline percentage change annotations (+23%, -57%)"
          done: true
        - description: "Add color coding — red for regression, green for improvement, dim for stable"
          done: true
        - description: "Handle outlier truncation with overflow indicators"
          done: true
        - description: "Add scale note at bottom (e.g., 'each █ ≈ 42ms')"
          done: true
        - description: "Wire up factory function from_comparison_data()"
          done: true

    - title: "Add diverging bar chart (regression/improvement distribution)"
      description: |
        New ASCIIDivergingBar class showing percentage changes centered on a zero axis.
        Left side = improvements (DataFrame faster), right side = regressions.
        Sorted by magnitude. Handles extreme outliers with overflow arrows (──►).
        Uses ▓ for improvements, ▒ for regressions, ░ for near-zero.
      items:
        - description: "Create ASCIIDivergingBar class inheriting from ASCIIChartBase"
          done: true
        - description: "Implement centered-zero rendering with left/right bars"
          done: true
        - description: "Add sorted-by-magnitude ordering"
          done: true
        - description: "Implement overflow arrows for extreme outliers (──► for clipped values)"
          done: true
        - description: "Add axis labels and directional annotations"
          done: true
        - description: "Wire up factory function from_regression_data()"
          done: true

    - title: "Add summary box renderer"
      description: |
        New ASCIISummaryBox class (or method) for bordered panels with aggregate stats.
        Uses existing BOX_CHARS for borders. Contents include: title line, separator,
        geo mean comparison, total time comparison, improved/stable/regressed counts,
        worst/best query lists. Support both color and no-color modes.
      items:
        - description: "Create ASCIISummaryBox class or render method"
          done: true
        - description: "Implement bordered panel with title and stats rows"
          done: true
        - description: "Add configurable stat fields (geo mean, total, counts, worst/best)"
          done: true
        - description: "Support both single-run and comparison summaries"
          done: true

    - title: "Integrate new chart types with MCP and CLI"
      description: |
        Register new chart types in the MCP generate_chart tool and CLI export paths.
        Add chart_type options: comparison_bar, diverging_bar, summary_box.
        Add a 'comparison' template that renders all three together (paired bars,
        diverging distribution, summary box) as a cohesive comparison report.
      items:
        - description: "Register comparison_bar, diverging_bar, summary_box in MCP tool"
          done: true
        - description: "Add 'comparison' template that composes all three chart types"
          done: true
        - description: "Update _render_single_ascii_chart() dispatch in visualization.py"
          done: true
        - description: "Add data conversion from ResultPlotter comparison data"
          done: true

    - title: "Tests and documentation"
      description: |
        Comprehensive unit tests for all new chart types. Test edge cases: zero values,
        negative-only, single query, 100+ queries (auto-chunking), extreme outliers,
        Unicode fallback mode, all color modes, NO_COLOR compliance.
      items:
        - description: "Unit tests for ASCIIComparisonBar (paired rendering, annotations, truncation)"
          done: true
        - description: "Unit tests for ASCIIDivergingBar (sorting, overflow, centering)"
          done: true
        - description: "Unit tests for ASCIISummaryBox (borders, stats, color modes)"
