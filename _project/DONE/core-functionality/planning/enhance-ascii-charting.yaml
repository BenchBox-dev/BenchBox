impact:
  business_value: |
    Enables rich comparison visualization directly in terminals, CI logs, and MCP tool responses.
    The paired bar + diverging + summary box combination provides a complete comparison report
    without requiring HTML/browser rendering. Critical for CLI-first workflow and LLM integrations.
  user_impact: |
    Users can visualize SQL vs DataFrame comparisons, platform-to-platform regressions, and
    run-to-run performance trends entirely in their terminal. Reduces context-switching to browsers.
  technical_debt: |
    Extends the well-structured ASCII module with consistent patterns. No debt introduced if
    the inheritance and factory function patterns are followed correctly.

context_sections:
  - title: "Library Evaluation Summary"
    content: |
      Evaluated 10+ Python terminal charting libraries. Key findings:
      - plotext-plus (7/10): Best candidate but needs stdout->str wrappers, lacks benchmark annotations
      - plotille (4/10): Good scatter/line but no bar charts
      - termgraph (3/10): Popular but limited to simple bars, no box/scatter/heatmap
      - uniplot (3/10): Good quality but only line/scatter, requires numpy
      - Rich (2/10): Not a charting library; tables/panels only
      - All others scored ≤2/10 (unmaintained, wrong license, or wrong paradigm)
      Conclusion: Custom implementation is the right choice for BenchBox's specific needs.

  - title: "Design Reference: Target Output"
    content: |
      The three new chart types should compose into a single comparison report:
      1. Paired comparison bars — per-query side-by-side with % change annotations
      2. Diverging distribution — sorted regression/improvement chart centered on zero
      3. Summary box — bordered panel with aggregate statistics
      See the example ASCII output provided in the TODO creation request for exact visual targets.

