must_preserve:
  - "Existing 6 ASCII chart types (bar, histogram, heatmap, box, line, scatter) must remain fully functional"
  - "ASCIIChartBase interface and render() -> str contract must not change"
  - "Factory functions from_bar_data(), from_query_latency_data(), etc. must remain backward-compatible"
  - "4-tier color degradation chain (truecolor -> 256 -> 16 -> none) must work for new chart types"
  - "Unicode -> ASCII fallback must work for all new chart types"
  - "MCP generate_chart tool must continue to work for existing chart_type values"
  - "ASCIIChartOptions(use_color=False) must produce clean output without ANSI codes for new charts"

approach: |
  Follow existing inheritance pattern: new classes inherit from ASCIIChartBase in ascii/ module.
  Use existing BLOCK_CHARS, INTENSITY_CHARS, BOX_CHARS from base.py — do not duplicate.
  Follow factory function pattern (from_*_data) for data conversion.
  Mirror _render_single_ascii_chart() dispatch pattern in visualization.py for new types.
  Reference existing bar_chart.py for 1/8 block precision rendering technique.
  Reference existing histogram.py for auto-chunking pattern if comparison charts have many queries.

anti_patterns:
  - "DO NOT adopt an external charting library — because the render()->str pattern, benchmark-specific features, and sub-character precision cannot be replicated; custom implementation evaluated as superior to all 10+ candidates"
  - "DO NOT print to stdout — because all ASCII charts must return strings for MCP tool responses and CLI piping"
  - "DO NOT hardcode terminal width — because base.py already handles terminal detection; use self.width from ASCIIChartBase"
  - "DO NOT skip Unicode fallback — because ASCII_BLOCK_CHARS and ASCII_BOX_CHARS exist for terminals without Unicode support"
  - "DO NOT compress the entire bar scale for outliers — because it makes most bars unreadably small; truncate outlier bars instead with overflow indicators"

