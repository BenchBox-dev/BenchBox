title: "Unify SQL and DataFrame Adapter Execution Interfaces"
worktree: core-functionality
priority: Medium-High
status: Complete
category: Core Functionality
description: |
  Implement a unified `run_benchmark()` interface across SQL and DataFrame adapters,
  eliminating the design defect identified in code review where DataFrame adapters
  lack the same interface as SQL adapters.

  The current architecture violates the Adapter pattern:

  | Aspect | SQL Adapters | DataFrame Adapters |
  |--------|-------------|-------------------|
  | Has `run_benchmark()` | YES | NO |
  | Entry point | `adapter.run_benchmark()` | `run_dataframe_benchmark()` function |
  | Caller branching | None (polymorphic) | Required (orchestrator:287, MCP:175) |

  **Design Violations:**
  - Liskov Substitution Principle (adapters not interchangeable)
  - Open/Closed Principle (new modes require caller changes)
  - Adapter Pattern (no unified interface)

  **Goal:** All adapters (SQL and DataFrame) should implement the same `run_benchmark()`
  method, allowing callers to use adapters polymorphically without type-checking or
  branching logic.

context_sections:
  "Current Architecture Problems": |
    The orchestrator and MCP tools currently require branching logic:

    ```python
    # orchestrator.py:277-334
    if execution_mode == "dataframe":
        # Special DataFrame path with DataFramePhases, DataFrameRunOptions
        result = run_dataframe_benchmark(adapter, ...)
    else:
        # Standard SQL path
        result = run_benchmark_lifecycle(adapter, ...)
    ```

    ```python
    # mcp/tools/benchmark.py:175-191
    if _is_dataframe_platform(platform):
        result = run_dataframe_benchmark(adapter, ...)
    else:
        result = benchmark_instance.run_with_platform(adapter)
    ```

    This violates the fundamental purpose of the Adapter pattern - callers should
    not need to know which type of adapter they're using.

  "Target Architecture": |
    After refactoring, all callers use a single code path:

    ```python
    # Unified path - works for ALL adapters
    result = adapter.run_benchmark(benchmark, config)
    ```

    The adapter implementation handles the differences internally:
    - SQL adapters: Execute SQL queries against database
    - DataFrame adapters: Load data into memory, execute DataFrame operations

  "Files Affected Summary": |
    | File | Change |
    |------|--------|
    | `benchbox/platforms/dataframe/expression_family.py` | +`run_benchmark()` (~150 lines) |
    | `benchbox/core/runner/dataframe_runner.py` | Deprecate `run_dataframe_benchmark()` |
    | `benchbox/cli/orchestrator.py` | Remove ~60 lines branching |
    | `benchbox/mcp/tools/benchmark.py` | Remove ~20 lines branching |
    | `tests/unit/platforms/dataframe/test_expression_family.py` | Add tests |

