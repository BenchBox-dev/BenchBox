impact:
  business_value: |
    Establishes clean architecture that allows new execution modes (future: GPU,
    distributed, streaming) to be added without modifying callers. Reduces
    maintenance burden and bug surface area.
  user_impact: |
    No direct user impact - this is an internal refactoring. However, it enables
    future features to be added more easily and reduces the likelihood of bugs
    in DataFrame benchmarking.
  technical_debt: |
    Eliminates significant technical debt:
    - Removes ~80 lines of branching code across orchestrator and MCP
    - Establishes single responsibility for benchmark execution
    - Makes codebase follow established design patterns

