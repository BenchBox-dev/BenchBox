open_questions:
  - "Should we maintain backwards compatibility with run_dataframe_benchmark() or remove it entirely?"
  - "What's the right abstraction for phases (SQL has different phases than DataFrame)?"

design_decisions:
  - decision: "Both ExpressionFamilyAdapter and PandasFamilyAdapter need run_benchmark()"
    rationale: |
      There are two DataFrame adapter families:
      - ExpressionFamilyAdapter: Polars, PySpark, DataFusion (lazy evaluation)
      - PandasFamilyAdapter: Pandas, Modin, cuDF, Dask (eager evaluation)
      Both must implement run_benchmark() for true polymorphism and LSP compliance.

technical_requirements:
  constraints:
    - "Must not change external API or CLI interface"
    - "Must produce identical benchmark results"
    - "No performance regression"
  dependencies:
    - "Existing ExpressionFamilyAdapter infrastructure"
    - "BenchmarkResults type definition"
    - "Data loading infrastructure"
