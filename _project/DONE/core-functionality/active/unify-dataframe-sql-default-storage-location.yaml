id: unify-dataframe-sql-default-storage-location
title: "Unify DataFrame and SQL default storage locations to project-local benchmark_runs/"
worktree: "core-functionality"
priority: "High"
status: "Completed"
completed_date: "2026-02-09"
description: |
  DataFrame and SQL benchmarks use inconsistent default storage locations:

  - SQL: `./benchmark_runs/datagen/{benchmark}_{sf}` (project-local, CWD-relative)
  - DataFrame: `~/.benchbox/dataframe-data/{benchmark}/sf_{N}/{format}/` (user home, global)

  This creates a confusing asymmetry where raw source data lives locally but
  format conversions cache globally. Both should default to project-local under
  `benchmark_runs/` so that all benchmark artifacts live together and are easy
  to find, inspect, and clean up.

  The core fix is a one-line constant change:

      # Before (data_loader.py:63):
      DEFAULT_CACHE_DIR = Path.home() / ".benchbox" / "dataframe-data"

      # After:
      DEFAULT_CACHE_DIR = Path.cwd() / "benchmark_runs" / "dataframe-data"

  Plus wiring through runner construction, DirectoryManager, and test updates.

category: "Core Functionality"

metadata:
  owners:
  - "joe"
  tags:
  - "dataframe"
  - "storage"
  - "consistency"
  - "developer-experience"
  estimated_effort: "1-2 days"
  created_date: "2026-02-09"

impact:
  business_value: |
    Eliminates user confusion about where benchmark data lives. Currently SQL
    users see everything under benchmark_runs/ while DataFrame users must know
    to look in ~/.benchbox/. Unifying defaults makes the tool predictable and
    makes cleanup a single `rm -rf benchmark_runs/` operation.
  technical_debt: |
    The split happened organically when DataFrame support was added. The global
    cache was convenient during development but creates an asymmetry that should
    not ship as the long-term default.

files_affected:
  modified:
  - "benchbox/core/dataframe/data_loader.py"
  - "benchbox/core/runner/runner.py"
  - "benchbox/platforms/dataframe/benchmark_mixin.py"
  - "benchbox/cli/config.py"
  - "tests/unit/core/dataframe/test_data_loader.py"
  added:
  - "benchbox/utils/path_utils.py"
  - "tests/unit/core/dataframe/test_storage_location_parity.py"

must_preserve:
- "SQL data paths remain exactly as-is: Path.cwd() / 'benchmark_runs' / 'datagen' / ... (benchbox/base.py unchanged)"
- "BENCHBOX_CACHE_DIR environment variable continues to override the default cache directory"
- "DataFrameDataLoader public API (constructor signature, load_data return type) unchanged"
- "Internal cache directory structure below the root (benchmark/sf_N/format/) unchanged"
- "Manifest file format and content unchanged"
- "Existing runs with data in ~/.benchbox/dataframe-data/ continue to work if BENCHBOX_CACHE_DIR points there"

approach: |
  Minimal-surface-area change in strict dependency order:

  1) Change the DEFAULT_CACHE_DIR constant - this is the one-line core fix.
  2) Update DataCache docstring to reflect the new default.
  3) Add a path helper to path_utils.py for consistency with existing helpers.
  4) Wire BENCHBOX_CACHE_DIR through DataFrameRunOptions.cache_dir in runner.py
     so the runner explicitly sets the cache directory rather than relying on
     the module-level default.
  5) Register dataframe-data/ in DirectoryManager so it is created alongside
     datagen/, results/, and databases/.
  6) Update existing test assertions to expect the new path.
  7) Add a parity test that asserts SQL and DataFrame defaults share the same
     benchmark_runs/ root.
  8) Full verification: fast suite, smoke run, confirm output appears locally.

anti_patterns:
- "DO NOT move SQL paths to a global location - because the current CWD-relative SQL default is correct and predictable
  - the fix is bringing DataFrame in line with SQL, not the reverse"
- "DO NOT remove or disable caching - because DataFrame format conversions (CSV->Parquet etc.) are expensive
  - only the default location changes, caching behavior is preserved"
- "DO NOT auto-migrate existing ~/.benchbox/dataframe-data/ - because users may have multiple projects sharing that cache
  - migration is deferred and should be opt-in if ever implemented"
- "DO NOT change the internal cache directory structure (benchmark/sf_N/format/) - because this is an implementation detail
  that works correctly - only the root prefix changes"

