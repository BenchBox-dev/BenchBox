context_sections:
  "Asymmetry in Code": |
    | Component | Path | Code Location |
    |-----------|------|---------------|
    | SQL data dir | `Path.cwd() / "benchmark_runs" / "datagen"` | `benchbox/base.py:62-66` |
    | DataFrame cache | `Path.home() / ".benchbox" / "dataframe-data"` | `benchbox/core/dataframe/data_loader.py:63` |
    | DataCache init | Falls through to `DEFAULT_CACHE_DIR` when no env/param | `data_loader.py:479` |
    | Runner construction | `DataFrameRunOptions()` with `cache_dir` never set | `runner.py:611,714` |
    | DirectoryManager | Manages `datagen/`, `results/`, `databases/` but not `dataframe-data/` | `cli/config.py:849-865` |

  "Definition of Done": |
    - DEFAULT_CACHE_DIR points to `Path.cwd() / "benchmark_runs" / "dataframe-data"`
    - Runner explicitly passes cache_dir through DataFrameRunOptions
    - DirectoryManager creates dataframe-data/ alongside other benchmark_runs/ subdirs
    - All existing tests updated and passing
    - New parity test asserts SQL and DataFrame share benchmark_runs/ root
    - Smoke run confirms data appears project-locally

