    - "tests/unit/core/results/test_normalizer.py"

sections:
  "Implementation Summary": |
    Created new benchbox/core/results/normalizer.py module with:
    - NormalizedResultDict dataclass: unified view of v1.x and v2.x schemas
    - NormalizedQuery dataclass: per-query result representation
    - detect_schema_version(): detects "2.0", "2.1", or "1.x"
    - normalize_result_dict(): extracts all fields with schema-specific paths
    - get_query_map(): helper to convert query list to dict by ID

    Refactored consumers:
    - ResultPlotter._normalize_dict(): now calls shared normalizer, converts to viz-specific format
    - ResultExporter._extract_performance_metrics(): uses normalizer for timing/counts
    - ResultExporter._extract_query_map(): uses normalizer and get_query_map()

    Decision: loader.py's reconstruct_benchmark_results() was NOT refactored because
    it does full BenchmarkResults reconstruction with additional fields beyond what
    the normalizer provides. The normalizer is intentionally lightweight.

  "Lessons Learned": |
    - Keep normalizer lightweight - don't try to handle every field
    - Visualization-specific concerns (platform label decoration) stay in ResultPlotter
    - The version parameter in _extract_* methods is now unused but kept for API compat
    - comparison.py already uses loader.reconstruct_benchmark_results() so no changes needed

