impact:
  business_value: |
    Reduces maintenance burden when schema evolves. Single source of truth
    for JSON parsing ensures consistent behavior across visualization,
    comparison, and export features.
  technical_debt: |
    Eliminates 5+ duplicated implementations of schema version detection
    and field extraction. Makes future schema changes (v2.2, v3.0) easier
    to implement correctly.

files_affected:
