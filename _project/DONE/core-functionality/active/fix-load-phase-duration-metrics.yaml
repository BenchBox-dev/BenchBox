    assert d['phases']['data_loading']['duration_ms'] > 0, f'duration_ms missing or zero: {d[\"phases\"][\"data_loading\"\
    ]}'; print('PASS: duration_ms =', d['phases']['data_loading']['duration_ms'])\""
  expected_output: "PASS: duration_ms > 0"
- description: "Schema creation phase also has duration_ms"
  command: "python3 -c \"import json, glob; f=sorted(glob.glob('benchmark_runs/results/tpch_sf0.01_duckdb_*.json'))[-1]; d=json.load(open(f));
    assert d['phases']['schema_creation'].get('duration_ms') is not None, 'schema_creation missing duration_ms'; print('PASS')\""
  expected_output: "PASS"
- description: "Existing tests pass"
