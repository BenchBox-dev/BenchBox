# Fix load phase duration metrics in results JSON
#
# Location: _project/TODO/core-functionality/planning/fix-load-phase-duration-metrics.yaml

id: fix-load-phase-duration-metrics
title: "Fix load phase duration metrics missing from results JSON"
worktree: core-functionality
priority: High
status: Completed
category: Core Functionality
description: |
  The load-only code path (_execute_load_only_mode) has a key mismatch in its
  phases dict: it uses "duration_seconds" but the builder reads "duration_ms".
  The total duration only survives in the JSON via a secondary set_loading_time()
  call that bypasses the broken phases dict — a fragile indirection.

  Additionally, per-table load timings returned by adapter.load_data() are
  captured but immediately discarded (_per_table_timings), so the tables block
  in the JSON only contains row counts with no timing information.

  A truthiness check on data_loading_time (rather than `is not None`) silently
  drops zero-duration loads.

metadata:
  tags:
  - results
  - load-phase
  - metrics
  - data-quality
  estimated_effort: Small
  created_date: "2026-02-25"
  completed_date: "2026-02-25"

impact:
  business_value: |
    Accurate load phase metrics are essential for benchmarking data loading
    performance across platforms and compression settings. Without reliable
    duration data, load-only runs produce incomplete results.
  user_impact: |
    Users running load-only benchmarks (--phases load_only) get results with
    missing or inconsistent duration data in phase_status metadata.

files_affected:
  modified:
  - benchbox/core/runner/runner.py
  - benchbox/core/base_benchmark.py
  - benchbox/core/results/builder.py
  - benchbox/core/results/schema.py

context_sections:
  "Root Cause Analysis": |
    Five issues identified, ranked by impact:

    1. KEY MISMATCH (High): runner.py:374-385 builds phases dict with
       "duration_seconds" but base_benchmark.py:240 reads "duration_ms".
       Result: set_phase_status stores phase without duration.

    2. PER-TABLE TIMINGS DISCARDED (Medium): runner.py:359 captures
       _per_table_timings from adapter.load_data() but never passes it
       through. All per-table load_time_ms values are 0.

    3. add_table_stats MISSING load_time_ms (Medium): base_benchmark.py:207
       only passes row_count, so TableStats.load_time_ms defaults to 0.

    4. TRUTHINESS CHECK (Low): base_benchmark.py:209 uses
       `if kwargs.get("data_loading_time"):` which is falsy for 0.0.

    5. FRAGILE INDIRECTION (Structural): Total duration only works because
       set_loading_time() → _build_setup_phase() is a secondary path that
       happens to produce the correct value. If _table_stats were empty,
       _build_setup_phase returns None and duration would be lost entirely.

  "Why the Example JSON Looks Correct": |
    The example tpcds_sf10 result has duration_ms: 25038 because:
    - data_loading_time=load_time is passed as a kwarg (runner.py:404)
    - base_benchmark.py:209-210 calls builder.set_loading_time(25039.0)
    - _build_setup_phase() constructs DataLoadingPhase(duration_ms=25039)
    - schema.py:751-755 reads from execution_phases.setup.data_loading

    The phases dict path (duration_seconds key) is completely bypassed.
    This is correct by accident, not by design.

must_preserve:
- "Full SQL run path (run_enhanced_benchmark → ExecutionPhases dataclass) continues working — it uses _create_enhanced_data_loading_phase
  which is correct"
- "summary.data.load_time_ms continues to be populated from set_loading_time()"
- "tables block continues to include row counts for all tables"

anti_patterns:
- "DO NOT change the adapter.load_data() return type — because all platform adapters implement it — fix the consumer in runner.py
  and base_benchmark.py instead"
- "DO NOT add a third duration storage path — because set_loading_time() feeds summary.data.load_time_ms and set_phase_status()
  feeds phases.data_loading.duration_ms; both are intentional but they must derive from the same source value (load_time)"

