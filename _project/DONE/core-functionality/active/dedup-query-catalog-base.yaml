  - id: w3
    summary: "Create TranslatableQueryMixin with shared translate_query_text"
    status: done

  - id: w4
    summary: "Refactor amplab, coffeeshop, h2odb, read_primitives, ssb to use TranslatableQueryMixin"
    needs: [w3]
    status: done

  - id: w5
    summary: "Run tests to verify no regressions"
    needs: [w2, w4]
    status: done

