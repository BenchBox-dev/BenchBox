context_sections:
  "Background": |
    Commit 8117828c introduced `normalize_benchmark_id()` in
    `benchbox/core/results/builder.py` to fix inconsistent benchmark IDs
    between SQL and DataFrame execution paths.

    The function handles all TPC benchmark variants:
    - TPC-H: "tpch", "tpc-h", "tpc_h", "TPC-H Benchmark"
    - TPC-DS: "tpcds", "tpc-ds", "tpc_ds", "TPC-DS Benchmark"
    - SSB: "ssb"
    - ClickBench: "clickbench"

  "Patterns to Refactor": |
    **Current (duplicate logic):**
    ```python
    if "tpch" in benchmark_name or "tpc-h" in benchmark_name:
        # handle TPC-H
    elif "tpcds" in benchmark_name or "tpc-ds" in benchmark_name:
        # handle TPC-DS
    ```

    **Target (centralized):**
    ```python
    benchmark_id = normalize_benchmark_id(benchmark_name)
    if benchmark_id == "tpch":
        # handle TPC-H
    elif benchmark_id == "tpcds":
        # handle TPC-DS
    ```

  "Already Good (no change needed)": |
    These locations already use clean patterns:
    - `core/validation/query_validation.py:78,88` - tuple membership
    - `utils/input_validation.py:234,239` - tuple membership

