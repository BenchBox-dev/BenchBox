must_preserve:
- "Default runs without explicit requested version continue working for DuckDB and use current environment behavior."
- "Existing CLI/platform option compatibility for driver metadata is preserved (no breaking change to current workflows)."
- "Result JSON remains backward-compatible: platform.version and platform.client_version still present."
- "Platform adapter factory remains generic and does not regress non-DuckDB adapters or platform-specific connection flows."

approach: |
  Build on existing driver metadata plumbing instead of replacing it:

  1. Extend runtime_env to support explicit runtime-isolation strategy and
     package+version selection suitable for per-run execution.
  2. Keep shared platform adapter hooks generic (package name + requested version +
     resolved version + runtime-actual version), add DuckDB-specific runtime
     validation from live context (module + connection), then apply the same
     contract to other package-based platforms.
  3. Ensure results schema captures both intent and truth:
     - requested driver version
     - resolved install/runtime version
     - actual live runtime version used by execution
  4. Guard default behavior: if no requested version is provided, do not force
     isolation changes that alter existing run flow.
  5. Validate with two real DuckDB versions in separate runs and assert distinct
     actual versions in exported JSON, plus at least one non-DuckDB platform
     contract verification in the same delivery.

anti_patterns:
- "DO NOT treat requested version as proof of execution version -- because config intent can diverge from runtime imports
  -- validate from live runtime/connection."
- "DO NOT rely on external `uv run --python ...` process wrapping as the product contract -- because it is not reliably enforced
  inside BenchBox execution -- provide first-class in-product version selection."
- "DO NOT hardcode DuckDB-only logic in shared interfaces -- because other platforms need the same mechanism -- keep package/version/runtime
  strategy generic with platform-specific adapters."
- "DO NOT defer non-DuckDB rollout into a follow-up item -- because runtime correctness is platform-wide -- land shared integration
  for other package-based platforms in this same TODO."
- "DO NOT break default no-version runs -- because existing users depend on current behavior -- make version isolation opt-in
  when explicit version is requested."

verification:
- description: "Unit tests for runtime version selection and DuckDB adapter path pass"
  command: "uv run -- python -m pytest tests/unit/utils/test_runtime_env.py tests/unit/platforms/test_duckdb_adapter.py tests/unit/cli/test_execution_pipeline_driver_metadata.py
    -v --tb=short"
  expected_output: "all targeted tests pass with 0 failures"
- description: "Cross-platform runtime contract tests pass for non-DuckDB adapters that declare driver metadata"
  command: "uv run -- python -m pytest tests/unit/platforms/test_platform_driver_runtime_contract.py -v --tb=short"
  expected_output: "contract tests pass and enforce requested/resolved/actual metadata behavior across platforms"
- description: "Integration-style isolation test passes for two distinct requested versions"
  command: "uv run -- python -m pytest tests/integration/test_duckdb_version_isolation.py -v --tb=short"
  expected_output: "test verifies separate runs and distinct actual runtime versions in JSON metadata"
- description: "Default behavior regression check (no explicit driver version) still passes"
  command: "uv run -- python -m pytest tests/integration/test_benchmark_duckdb_execution.py -k 'smoke or basic' -v --tb=short"
  expected_output: "existing default DuckDB execution path remains green"
- description: "Manual DuckDB 0.9.2 run includes inspected JSON fields for requested/resolved/actual and platform/client versions"
  command: "benchbox run --platform duckdb --benchmark ssb --scale 0.01 --queries Q1 --platform-option driver_version=0.9.2
    --non-interactive --quiet && f_092=$(ls -t benchmark_runs/results/*duckdb_sql*.json | sed -n '1p') && echo \"$f_092\"\
    \ && jq '{platform_version:.platform.version,client_version:.platform.client_version,requested:(.execution.driver_version_requested
    // .execution_metadata.driver_version_requested),resolved:(.execution.driver_version_resolved // .execution_metadata.driver_version_resolved),actual:(.execution.driver_version_actual
    // .execution_metadata.driver_version_actual // .execution.runtime_version_actual // .execution_metadata.runtime_version_actual)}'
    \"$f_092\""
  expected_output: "command prints result file path and JSON object where requested/resolved/actual/platform/client versions
    all match 0.9.2"
- description: "Manual DuckDB 1.2.2 run includes inspected JSON fields and proves version differs from prior run"
  command: "benchbox run --platform duckdb --benchmark ssb --scale 0.01 --queries Q1 --platform-option driver_version=1.2.2
    --non-interactive --quiet && f_new=$(ls -t benchmark_runs/results/*duckdb_sql*.json | sed -n '1p') && f_prev=$(ls -t benchmark_runs/results/*duckdb_sql*.json
    | sed -n '2p') && jq '{platform_version:.platform.version,client_version:.platform.client_version,requested:(.execution.driver_version_requested
    // .execution_metadata.driver_version_requested),resolved:(.execution.driver_version_resolved // .execution_metadata.driver_version_resolved),actual:(.execution.driver_version_actual
    // .execution_metadata.driver_version_actual // .execution.runtime_version_actual // .execution_metadata.runtime_version_actual)}'
    \"$f_prev\" \"$f_new\" && test \"$(jq -r '.platform.version' \"$f_new\")\" != \"$(jq -r '.platform.version' \"$f_prev\"\
    )\""
  expected_output: "jq output shows one result with 0.9.2 and one with 1.2.2, and final version-inequality test exits successfully"

