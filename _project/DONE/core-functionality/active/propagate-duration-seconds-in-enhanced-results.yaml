id: propagate-duration-seconds-in-enhanced-results
title: "Propagate explicit duration_seconds through enhanced result builders"
worktree: core-functionality
priority: High
status: Completed
completed_date: "2026-02-25"
description: |
  Data-only benchmark lifecycle paths pass elapsed datagen time as
  `duration_seconds`, but that value is not consumed explicitly by the
  enhanced result construction flow in both `benchbox/core/base_benchmark.py`
  and wrapper fallback paths in `benchbox/base.py`.

  As a result, total duration can fall back to query+loading aggregates, which
  are zero for data-only runs with no query executions. This produces misleading
  run-level duration fields in exported results and blocks reliable metric
  expansion work that depends on correct canonical duration semantics.

category: Core Functionality

work:
- id: w1
  summary: "Add explicit duration_seconds kwarg to create_enhanced_benchmark_result in core and wrapper paths without breaking
    kwargs compatibility"
  status: done

- id: w2
  summary: "Wire explicit duration_seconds to ResultBuilder via set_total_duration() in both builder-population flows"
  needs: [w1]
  status: done

- id: w3
  summary: "Add regression tests proving data-only and minimal-result paths preserve non-zero duration_seconds"
  needs: [w2]
  status: done

- id: w4
  summary: "Run targeted and fast-suite verification; confirm no regressions in standard SQL/DataFrame benchmark flows"
  needs: [w3]
  status: done

must_preserve:
- "Do not remove `**kwargs` from create_enhanced_benchmark_result in either implementation path; existing callers pass platform-specific
  overrides"
- "ResultBuilder fallback duration behavior (start/end timestamps, then query+loading) remains unchanged when explicit duration
  is not provided"
- "Standard benchmark result generation for load/power/throughput runs remains backward-compatible"
- "create_minimal_benchmark_result continues returning fully valid BenchmarkResults with existing metadata structure"

approach: |
  Implement in dependency order:
  1) Function signatures: add `duration_seconds: Optional[float] = None` before
     `**kwargs` in `benchbox/core/base_benchmark.py` and wrapper fallback
     implementation in `benchbox/base.py`.
  2) Builder wiring: when duration_seconds is provided, call
     `builder.set_total_duration(duration_seconds)` in both code paths.
  3) Tests: update and extend unit tests in `tests/unit/core/test_base_benchmark.py`
     and `tests/unit/core/test_runner_lifecycle.py` to verify non-zero duration
     propagation for data-only/minimal cases and no regression for normal runs.
  4) Validate with focused tests then `-m fast`.

anti_patterns:
- "DO NOT repurpose `data_loading_time` to encode total run duration -- because loading duration and total elapsed duration
  are semantically distinct -- use explicit duration_seconds only"
- "DO NOT convert the canonical duration channel to milliseconds in builder interfaces -- because BenchmarkResults stores
  canonical duration in seconds -- convert only at presentation/export boundaries"
- "DO NOT special-case only one caller path -- because both core and wrapper create_enhanced flows must remain behaviorally
  consistent -- patch both implementations"

verification:
- description: "Base benchmark minimal-result path preserves explicit duration_seconds via targeted regression test"
  command: "uv run -- python -m pytest tests/unit/core/test_base_benchmark.py::test_create_minimal_benchmark_result_propagates_duration_seconds
    -v"
  expected_output: "PASSED"
- description: "Lifecycle data-only path reports propagated duration via targeted regression test"
  command: "uv run -- python -m pytest tests/unit/core/test_runner_lifecycle.py::test_data_only_mode_propagates_duration_seconds
    -v"
  expected_output: "PASSED"
- description: "Core result builder unit tests still pass"
  command: "uv run -- python -m pytest tests/unit/core/results/test_builder.py -v"
  expected_output: "PASSED"
- description: "Fast suite passes without regressions"
  command: "uv run -- python -m pytest -m fast -q"
  expected_output: "All tests pass with 0 failures"

scope_limit:
  only_modify:
  - "benchbox/core/base_benchmark.py"
  - "benchbox/base.py"
  - "benchbox/core/results/builder.py"
  - "tests/unit/core/test_base_benchmark.py"
  - "tests/unit/core/test_runner_lifecycle.py"
  - "tests/unit/core/results/test_builder.py"
