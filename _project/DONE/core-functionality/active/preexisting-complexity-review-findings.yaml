  expected_output: "all tests pass"
- description: "Core analysis tests pass"
  command: "uv run -- python -m pytest tests/unit/core/ -v"
  expected_output: "all tests pass"
- description: "Query plan snapshot tests produce deterministic output"
  command: "uv run -- python -m pytest tests/unit/core/query_plans/ -v -k 'compare or diff'"
  expected_output: "all tests pass with stable output ordering"
- description: "Docstrings document mutation and inf behavior"
  command: "grep -n 'in-place\\|mutate\\|float.*inf' benchbox/core/analysis/ranking.py benchbox/core/analysis/comparison.py"
  expected_output: "matches found in docstrings of _validate_query_overlap, _detect_outliers, _compute_raw_scores, _normalize_scores"

