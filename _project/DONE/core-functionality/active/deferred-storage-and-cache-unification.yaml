id: deferred-storage-and-cache-unification
title: "Deferred Storage Location and Cache Unification Enhancements"
worktree: core-functionality
priority: Medium
status: Completed
completed_date: "2026-02-18"
category: Core Functionality
description: |
  Consolidates 3 deferred items from unify-dataframe-sql-default-storage-location
  (completed 2026-02-09). The core fix unified DataFrame and SQL storage to
  project-local benchmark_runs/. These are follow-up refinements:

  1. CLI --global-cache flag to opt into ~/.benchbox/ location
  2. Auto-migration of existing ~/.benchbox/dataframe-data/ contents
  3. Unify cache subdirectory naming (datagen/ vs dataframe-data/)

context_sections:
  "Background": |
    Before the unification, SQL data went to benchmark_runs/ (project-local)
    while DataFrame data went to ~/.benchbox/dataframe-data/ (global). The fix
    standardized on project-local. These deferred items handle edge cases for
    users with existing global caches and cosmetic naming consistency.

metadata:
  tags:
  - storage
  - cache
  - deferred-followup
  estimated_effort: "Small — 1-2 days"
  created_date: "2026-02-18"
  split_from: unify-dataframe-sql-default-storage-location

files_affected:
  modified:
  - "benchbox/cli/commands/run.py"
  - "benchbox/core/dataframe/data_loader.py"
  - "benchbox/core/dataframe/__init__.py"
  - "benchbox/platforms/dataframe/benchmark_mixin.py"

must_preserve:
- "Default project-local storage (benchmark_runs/) continues to work without any flags"
- "Existing DataFrame and SQL data loading paths produce identical results"

anti_patterns:
- "DO NOT change default storage path behavior -- because existing users have data at benchmark_runs/ and any default change
  would silently break their runs -- use the --global-cache flag as opt-in only"
- "DO NOT auto-migrate data without explicit user confirmation -- because shared global caches may be intentionally cross-project
  -- require an explicit migration subcommand with a --confirm flag or dry-run mode"
- "DO NOT rename datagen/ in place -- because existing runs have paths baked into result manifests -- verify that renaming
  dataframe-data/ does not invalidate any stored manifest references before committing the change"

scope_limit:
  only_modify:
  - "benchbox/cli/commands/run.py"
  - "benchbox/core/dataframe/data_loader.py"
  - "benchbox/core/dataframe/__init__.py"
  - "benchbox/platforms/dataframe/benchmark_mixin.py"
  - "tests/unit/core/dataframe/"
  - "tests/unit/cli/"
  do_not_modify:
  - "benchbox/core/runner.py"
  - "benchbox/core/tpch/"
  - "benchbox/core/tpcds/"
  - "benchbox/results/"

verification:
- description: "Existing tests pass — storage paths unchanged by default"
  command: "uv run -- python -m pytest tests/unit/core/dataframe/ -v --tb=short"
  expected_output: "all tests pass, 0 failures"
- description: "--global-cache flag routes to ~/.benchbox/ location"
  command: "uv run -- python -m pytest tests/unit/cli/ -k global_cache -v --tb=short"
  expected_output: "tests pass, flag resolves to ~/.benchbox/"
- description: "Default path unchanged when flag absent"
  command: "uv run -- python -c \"from benchbox.core.dataframe import data_loader; print(data_loader.get_data_path())\""
  expected_output: "path contains benchmark_runs/"

work:
- id: w1
  summary: "Add --global-cache CLI flag to opt into ~/.benchbox/ storage location for shared cross-project caching"
  status: done
  notes: |
    Wire as a Click option in run.py, pass through the config/context object, thread
    into benchmark_mixin.py and down to data_loader.py. Keep the default branch
    (no flag) identical to current behavior — only the opt-in path changes.

- id: w2
  summary: "Add explicit migration command for existing ~/.benchbox/dataframe-data/ contents to project-local"
  needs: [w1]
  status: done
  notes: |
    No backward compatibility required. Dropped per owner decision 2026-02-18.

- id: w3
  summary: "Unify cache subdirectory naming between SQL (datagen/) and DataFrame (dataframe-data/) paths"
  status: done
  notes: |
    Independent of w1 — rename applies to the project-local path regardless of whether
    --global-cache exists. Removed needs: [w1] dependency since local naming and the
    global cache flag are orthogonal concerns.
