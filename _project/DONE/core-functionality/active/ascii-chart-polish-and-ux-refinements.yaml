impact:
  business_value: |
    Charts are the primary output users see from benchmark runs. Truncated names, missing context,
    and inconsistent formatting undermine trust in the tool and force users to cross-reference
    result JSON files to understand what they're looking at. These fixes make charts self-contained
    and immediately interpretable.
  user_impact: |
    Users will see full platform names, symmetric series labels, run parameters, and clearer
    visual distinction for outliers and heatmap values — all without needing to examine raw
    result files. Particularly impactful for SQL vs DataFrame comparisons and CI/CD log output.
  technical_debt: |
    Removes hardcoded magic numbers (8, 12, 20 char caps) in favor of dynamic sizing.
    Adds metadata threading that can be extended for future chart enhancements.

context_sections:
  "Current Output Issues (from real DataFusion SF1 run)": |
    1. Performance bar: "DataFusion" vs "DataFusion (datafr.." — asymmetric and truncated; should be "DataFusion (sql)" vs "DataFusion (df)"
    2. Box plot: "DataFusion.." — truncated at 12 chars, no mode distinction
    3. Comparison bar: "DataFu.." — truncated at 8 chars, unreadable
    4. Heatmap: "DataF.." columns — severely truncated, green→red palette hard to read
    5. Histogram: No visual distinction between normal and outlier bars
    6. All charts: No scale factor, platform version, or tuning config displayed
    7. All charts with axes: No axis title labels (only tick values shown)
    8. Summary box: "Geo Mean: 18.2ms → 61.3ms                              +236.7%" — huge blank gap between values and percentage

  "Architecture Notes": |
    - Series names originate in result_plotter.py:130-132 (_normalize_dict)
    - The "(dataframe)" suffix is appended only when execution_mode != "sql"
    - Label truncation is centralized in ASCIIChartBase._truncate_label() (base.py:376-383)
    - Each chart type applies its own max-length cap before calling _truncate_label()
    - Metadata (scale_factor, version, tuning) exists in NormalizedResult.raw but is not threaded to charts
    - COLOR_SCALE in heatmap.py:32-38 is hardcoded green→yellow→red

