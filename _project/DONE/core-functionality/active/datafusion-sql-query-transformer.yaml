context_sections:
  "Background and Motivation": |
    The seed parity fix changed TPCHPowerTestConfig.seed from int=1 to Optional[int]=None
    and added the -d flag to qgen when seed is None. This produces official TPC-H default
    parameters matching the answer files, enabling exact validation. Previously, seed=1
    (not matching reference seed 17039360) triggered loose validation with ±50% tolerance,
    masking these DataFusion SQL execution issues.

  "Technical Context": |
    DataFusion returns get_target_dialect() → "postgres", so queries are translated from
    netezza → postgres via SQLGlot. The translation is essentially a no-op (netezza maps
    to postgres). The raw qgen SQL passes through to DataFusion mostly unchanged.

    DataFusion's SQL planner has known limitations with:
    - NOT IN subqueries when NULLs may be present (different from PostgreSQL NULL semantics)
    - IN subqueries containing HAVING clauses (subquery decorrelation bugs)
    - HAVING clauses that reference scalar subqueries (floating-point comparison issues)
    - Nested correlated subqueries (scope resolution issues)

    The DataFrame implementations in dataframe_queries.py avoid all these patterns by using
    explicit .join(), anti-joins (.how="anti"), semi-joins (.how="semi"), and pre-aggregation
    with scalar extraction (ctx.scalar()).
