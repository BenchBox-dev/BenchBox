impact:
  business_value: |
    Ensures DataFusion SQL-mode TPC-H benchmark produces correct, validated results.
    Without this fix, 4 of 22 queries fail exact validation at SF=1.
  user_impact: |
    Users running TPC-H benchmarks on DataFusion in SQL mode will get correct results
    with exact validation instead of silent mismatches or validation failures.

