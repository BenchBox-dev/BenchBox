title: "Add DataFusion SQL query transformer for TPC-H Q11, Q16, Q18, Q20"
worktree: "core-functionality"
priority: "High"
status: "Completed"
completed_date: "2026-02-06"
description: |
  DataFusion's SQL engine misexecutes 4 TPC-H queries (Q11, Q16, Q18, Q20) that
  use SQL patterns it handles differently from PostgreSQL: HAVING with scalar
  subqueries, NOT IN subqueries, IN with HAVING, and nested correlated subqueries.

  These failures were exposed when the seed parity fix changed validation from
  "loose" (±50% tolerance) to "exact" (0% tolerance). The DataFrame implementations
  of the same queries produce correct results because they use explicit joins,
  anti-joins, and semi-joins instead of these problematic SQL patterns.

  The fix follows the established ClickHouse pattern: create a DataFusionQueryTransformer
  that rewrites the 4 problematic queries before execution, transforming them into
  semantically equivalent SQL that DataFusion handles correctly.

  Row count discrepancies at SF=1 with qgen -d defaults:
    Q11: Expected 1,048 → Got 1,289 (HAVING + scalar subquery threshold)
    Q16: Expected 18,314 → Got 18,200 (NOT IN subquery, NULL semantics)
    Q18: Expected 57 → Got 9 (IN subquery with HAVING clause)
    Q20: Expected 186 → Got 173 (nested IN with correlated subquery)

category: "Core Functionality"

tasks:
  phases:
    - phase: "Phase 1: Create DataFusionQueryTransformer"
      done: true
      items:
        - summary: "Create benchbox/platforms/datafusion_query_transformer.py following ClickHouse pattern"
          done: true
          subtasks:
            - summary: "Q11 rewrite: HAVING with scalar subquery → CTE with pre-computed threshold + WHERE filter"
              done: true
            - summary: "Q16 rewrite: NOT IN subquery → NOT EXISTS (fixes NULL semantics)"
              done: true
            - summary: "Q18 rewrite: IN with HAVING → EXISTS with derived table"
              done: true
            - summary: "Q20 rewrite: nested correlated IN → CTE with pre-aggregation + explicit JOIN"
              done: true
        - summary: "Use query_id dispatch (not fragile regex matching on arbitrary SQL)"
          done: true

    - phase: "Phase 2: Integration"
      done: true
      items:
        - summary: "Add transformer call in datafusion.py execute_query() before connection.sql()"
          done: true
        - summary: "Add 'datafusion' → 'postgres' mapping in dialect_utils.py normalize_dialect_for_sqlglot()"
          done: true

    - phase: "Phase 3: Testing and Validation"
      done: true
      items:
        - summary: "Create tests/unit/platforms/test_datafusion_query_transformer.py"
          done: true
          subtasks:
            - summary: "Test each of Q11, Q16, Q18, Q20 rewrites with actual qgen output"
              done: true
            - summary: "Test passthrough for unaffected queries (Q1-Q10, Q12-Q15, Q17, Q19, Q21-Q22)"
              done: true
            - summary: "Test transformations_applied tracking"
              done: true
        - summary: "Integration test: run all 22 TPC-H queries on DataFusion SQL at SF=1, 0 validation failures"
          done: true

