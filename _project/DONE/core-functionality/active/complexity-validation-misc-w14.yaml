work:
- id: w1
  summary: "Sub-area A: Extract validate() helper methods and simplify query plan parsers"
  status: done
  notes: |
    tpc_validation.py both validate() methods: extract check_X() private methods per
    validation rule. Pattern: repeated try-except-add_issue → list of validator functions.
    _validate_result (tpch/reporting.py): same — extract per-category check helpers.
    compare_dataframes: extract _check_row_count, _check_columns, _check_values phases.
    _extract_operator_specific_info (postgresql): strategy dict keyed by operator type.
    compute_complexity_score: extract _analyze_node recursive helper as standalone function.
    render_comparison: extract _render_diff_section, _render_operator_counts helpers.
    validate_data_directory: extract _validate_with_manifest, _validate_without_manifest.

- id: w2
  summary: "Sub-area B: Simplify CLI output and runner helper functions"
  status: done
  notes: |
    _display_platform_result: extract validation status lookup dict, extract _format_query_row.
    _get_queries_for_benchmark: replace benchmark if/elif with registry dict lookup.
    _extract_common_params: unify 3 extraction loops into single generic loop.
    compare_with_uniform: extract _validate_inputs, _run_uniform_comparison helpers.
    run_benchmark (ai_primitives): extract _check_platform, _select_queries, _run_with_cost.
    analyze_scaling: extract single-result vs multi-result calculation to shared helper.
    reconstruct_benchmark_results: extract per-section loaders as small helpers.

