  summary: "Sub-area C: Simplify CLI display/tuning and platform select functions"
  needs: []
  status: done
  notes: |
    create_sample (df_tuning): replace profile branches with PROFILE_CONFIG dict.
    show_defaults (df_tuning, tuning_group): extract _add_table_rows(table, config_group).
    show_cli (results): use early returns for default-value checks; extract display helper.
    setup_verbose_logging: replace level if/elif with LEVEL_MAP = {"DEBUG": logging.DEBUG, ...}.
    numbered_platform_select: extract _group_platforms(platforms) → (enabled, available, missing).

- id: w4
  summary: "Sub-area D: Simplify CLI metrics, compare, and exception handling"
  needs: []
  status: done
  notes: |
    calculate_qphh and qphh are near-identical — extract shared _load_and_compute_qphh helper.
    _format_html_comparison: extract _html_summary_table(), _html_query_table() helpers.
    _handle_cli_error: if already done in dict-dispatch batch, skip; else do it here.

- id: w5
  summary: "Sub-area E: Simplify platform adapters and utility functions"
  needs: []
  status: done
  notes: |
    _auto_detect_databricks_config: extract _select_warehouse(warehouses) → warehouse.
    get_data_source: unify v1/v2 manifest handling with shared file-loading helper.
    firebolt __init__: extract _detect_deployment_mode(config) → str.
    apply_ctas_sort: extract _extract_sort_columns(tuning, table) → list[str].
    validate_athena_credentials: extract _check_boto3_available(), _build_connection_kwargs().
    has_trailing_delimiter: unify compressed vs uncompressed paths with shared reader.
    extract_entities (ai_primitives): extract _spacy_extraction, _regex_fallback as helpers.

- id: w6
  summary: "Sub-area F: Simplify benchmark query helpers and write primitives"
  needs: []
  status: done
  notes: |
    get_query (tpch, tpcds): validation blocks are near-identical — extract shared
    _validate_query_params(query_id, stream_id, benchmark_name) helper.
    execute_operation (write_primitives): extract _setup_operation, _run_sql_operation.
    load_data_to_database (benchmark_mixins): extract _create_schema, _insert_rows.
    convert_csv_to_parquet and _convert_data: extract _build_type_map(schema) → dict.

- id: w7
  summary: "Sub-area G: Release functions"
  needs: []
  status: done
  notes: |
    _should_exclude_file: extract guard functions and apply as list.
    cmd_status: extract _print_file_section(files, header, limit) helper (3 call sites).

- id: w8
  summary: "Final complexity check — verify all remaining WARN functions are resolved or approved"
  needs: [w1, w2, w3, w4, w5, w6, w7]
  status: done

metadata:
  estimated_effort: "3-4 days"
  tags: ["complexity", "refactor", "misc", "validation"]

must_preserve:
- "tpc_validation validate(): validation issue counts and messages must be identical"
- "compare_dataframes: any difference between DataFrames must still raise the same errors"
- "get_query (tpch/tpcds): query permutation logic must be spec-compliant and unchanged"
- "calculate_qphh / qphh: metric calculation must be numerically identical"
- "_display_platform_result: all display fields and formatting must be identical"

approach: |
  Work sub-area by sub-area; each is mostly independent of the others.
  After each sub-area, run smoke tests before moving on.

  For near-duplicate functions (qphh/calculate_qphh, get_query tpch/tpcds):
  extract shared logic to a _shared_*() helper; do NOT merge the public functions.

anti_patterns:
- "DO NOT change the output of get_query — permutation order is spec-mandated"
- "DO NOT add new abstraction layers in validation — extract to private methods, not new classes"
- "DO NOT skip the smoke test between sub-areas — catch regressions early"
- "DO NOT merge functions that serve different purposes just because they look similar"

verification:
- description: "Smoke tests pass after each sub-area"
  command: "uv run -- python -m pytest -m fast -q"
  expected_output: "all tests pass, 0 failures"
- description: "Full complexity check shows all warnings resolved or approved"
  command: "uv run -- python scripts/check_complexity.py --top 150"
  expected_output: "PASSED: all functions within complexity limit of 20; Warnings count significantly reduced"

