    to_cli_args: 12+ non-default checks → loop over FIELD_CLI_ARGS = [(field, "--flag", converter), ...].

- id: w5
  summary: "Simplify _manifest_v2_to_dict optional-field extraction"
  needs: []
  status: done
  notes: |
    benchbox/core/manifest/io.py — repeated `if key in obj: d[target] = obj[key]` pattern.
