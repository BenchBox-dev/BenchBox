- id: w7
  summary: "Run smoke tests and complexity check; verify all 10 functions below warn threshold"
  needs: [w1, w2, w3, w4, w5, w6]
  status: done

metadata:
  estimated_effort: "1-2 days"
  tags: ["complexity", "refactor", "field-extraction"]

must_preserve:
- "get_enabled_settings: output set must contain exactly the same TuningType values as before"
- "_enrich_driver_runtime_metadata: all metadata fields must be populated identically"
- "_build_execution_from_context: result dict must have identical keys/values for all inputs"
- "to_cli_args: CLI arg string output must be identical for all benchmark configurations"
- "generate_cli_command: generated command must be copy-pasteable and functionally identical"

approach: |
  Three patterns to apply:
  1. Enumeration loop: FIELDS = [("src_attr", "dst_attr"), ...]; for s, d in FIELDS: setattr(dst, d, getattr(src, s))
  2. Conditional accumulation: CONDITIONS = [(predicate_fn, value), ...]; result = [v for fn, v in CONDITIONS if fn()]
  3. Optional dict builder: KEYS = [("src", "dst"), ...]; return {d: src[s] for s, d in KEYS if s in src}

  Do not add abstraction layers beyond what's needed — a simple list + comprehension is sufficient.
  Keep field definitions close to the function (module-level constant or near the function).

anti_patterns:
- "DO NOT create a FieldExtractor class — a list + loop is sufficient and more readable"
- "DO NOT merge the field definitions across functions — each function gets its own field list"
- "DO NOT change the output type or structure of any function (callers depend on these)"
- "DO NOT skip testing get_enabled_settings — it drives all tuning decisions"

verification:
- description: "Smoke tests pass"
  command: "uv run -- python -m pytest -m fast -q"
  expected_output: "all tests pass, 0 failures"
- description: "Target functions below warn threshold"
  command: "uv run -- python scripts/check_complexity.py --top 150 2>&1 | grep -E '(get_enabled_settings|enrich_driver|build_execution|build_config_block|populate_driver|to_cli_args|manifest_v2|get_enabled_tuning|extract_df_tuning|generate_cli_command)'"
  expected_output: "No WARN entries for the 10 target functions"

