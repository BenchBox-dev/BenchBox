- id: w6
  summary: "Simplify _extract_df_tuning and generate_cli_command"
  needs: []
  status: done
  notes: |
    _extract_df_tuning (dryrun.py): hasattr + is_default → 10 identical blocks → loop.
    generate_cli_command (cli/dryrun.py): non-default → append → 12 blocks → loop over
