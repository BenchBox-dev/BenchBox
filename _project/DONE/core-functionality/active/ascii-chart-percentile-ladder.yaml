    Percentile analysis is ubiquitous in benchmark reporting. Every TPC benchmark
    full-disclosure report includes percentile latency data. Adding this chart makes
    BenchBox output directly comparable to industry standard reports.
  user_impact: |
    Users can immediately see tail-latency behavior per platform without needing
    external tools. This is critical for evaluating platforms for latency-sensitive
    workloads where P99 matters more than average.

