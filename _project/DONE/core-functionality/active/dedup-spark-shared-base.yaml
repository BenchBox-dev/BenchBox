id: dedup-spark-shared-base
title: "Extract shared Spark base for LakeSail/Spark duplicated load_data and execute_query"
worktree: core-functionality
priority: Medium
status: Completed
completed_date: "2026-02-21"
category: Core Functionality
description: |
  Groups 13 and 30 from the duplicate-check report identify near-identical
  implementations of `load_data` (~92 lines) and `execute_query` (~69 lines)
  between `benchbox/platforms/lakesail.py` and `benchbox/platforms/spark.py`.

  LakeSail is a Spark Connect-based platform that shares the same DataFrame
  loading and query execution patterns as standard PySpark. Both adapters
  already inherit from a common base that provides helper methods like
  `_build_dry_run_result` and `_build_query_failure_result`.

  The shared logic should be extracted to a mixin or intermediate base class,
  eliminating ~161 duplicated lines.

approach: |
  1. Create `benchbox/platforms/base/spark_execution_mixin.py` with a
     `SparkExecutionMixin` class containing:
     - `_load_data_spark(self, benchmark, data_dir, connection)` — the shared
       load logic using DataSourceResolver, format detection, chunk loading
     - `_execute_query_spark(self, query, connection, **kwargs)` — the shared
       execution logic with dry-run, caching, validation, and error handling
  2. Have both LakeSail and Spark adapters inherit from the mixin
  3. Reduce each adapter's `load_data` and `execute_query` to thin wrappers
     or direct delegation to the mixin methods

  Reference the existing `benchbox/platforms/base/cloud_spark/` directory
  which already demonstrates the mixin pattern for cloud Spark adapters.

work:
  - id: w1
    summary: "Create SparkExecutionMixin with shared load_data logic (~92 lines)"
    status: done
    notes: |
      Extract from spark.py:481. Both lakesail.py and spark.py use identical:
      DataSourceResolver, _normalize_and_validate_file_paths, _get_table_schema,
      detect_file_format, parquet/CSV branching, row counting, timing.

  - id: w2
    summary: "Add shared execute_query logic to SparkExecutionMixin (~69 lines)"
    needs: [w1]
    status: done
    notes: |
      Extract from spark.py:631. Both files share identical: dry_run check,
      spark.catalog.clearCache(), spark.sql().collect(), validation block,
      _build_query_result_with_validation, _build_query_failure_result.

  - id: w3
    summary: "Refactor LakeSail and Spark adapters to use SparkExecutionMixin"
    needs: [w2]
    status: done

  - id: w4
    summary: "Run platform adapter tests to verify no regressions"
    needs: [w3]
    status: done

files_affected:
  modified:
    - "benchbox/platforms/lakesail.py"
    - "benchbox/platforms/spark.py"
  added:
    - "benchbox/platforms/base/spark_execution_mixin.py"

verification:
  - description: "Platform adapter tests pass"
    command: "uv run -- python -m pytest tests/unit/platforms/ -v -k 'spark or lakesail'"
    expected_output: "all tests pass"
  - description: "Duplicate check shows reduction for groups 13 and 30"
    command: "make duplicate-check-verbose --top-n 30"
    expected_output: "load_data and execute_query lakesail/spark groups no longer appear"

must_preserve:
  - "LakeSailAdapter.load_data() and SparkAdapter.load_data() public API unchanged"
  - "LakeSailAdapter.execute_query() and SparkAdapter.execute_query() return identical result dicts"

anti_patterns:
  - "DO NOT create a deep inheritance chain — because the adapter hierarchy is already 3+ levels — use a mixin that can be composed in"

scope_limit:
  only_modify:
    - "benchbox/platforms/lakesail.py"
    - "benchbox/platforms/spark.py"
    - "benchbox/platforms/base/"
    - "tests/unit/platforms/"

metadata:
  tags:
    - code-quality
    - duplicate-check
    - refactoring
  estimated_effort: "2-3 hours"
  created_date: "2026-02-21"
