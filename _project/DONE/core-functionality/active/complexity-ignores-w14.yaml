    needs: [w3]
    status: done

metadata:
  estimated_effort: "2-3 hours"
  tags: ["complexity", "pyproject", "ignores"]

must_preserve:
  - "All 19 functions remain behaviorally unchanged - this is annotation only"
  - "Existing approved ignores in exclude_functions list are untouched"

approach: |
  Follow the existing pattern in pyproject.toml [tool.benchbox.complexity] exclude_functions.
  Group new entries by the same category headings used for existing ones.
  Each entry: "file/path.py:function_name",  # NN - rationale

anti_patterns:
  - "DO NOT add functions that are reducible - only genuinely irreducible cases documented above"
  - "DO NOT remove or modify existing approved ignores"
  - "DO NOT add module-level exclusions; per-function ignores only"

verification:
  - description: "Complexity check passes with reduced warning count"
    command: "uv run -- python scripts/check_complexity.py --top 150"
    expected_output: "PASSED: all functions within complexity limit of 20; warnings count drops by ~19"

scope_limit:
  only_modify:
    - "pyproject.toml"
