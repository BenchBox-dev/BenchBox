    summary: "Add score 15-16 interactive REPL and credential wizard ignores"
    needs: [w2]
    status: done
    notes: |
      - _launch_sqlite_shell (16): user input dispatch loop; state machine is REPL-inherent
      - setup_snowflake_credentials (16): interactive wizard; multi-step validation with dependencies
      - _launch_duckdb_shell (15): same pattern as SQLite shell

  - id: w4
