work:
  - id: w1
    summary: "Add score-20 TPC/platform required ignores to pyproject.toml"
    status: done
    notes: |
      Add these with rationale comments (pattern: # NN - brief rationale):
      - _execute_parallel_pipeline: async parallel ETL orchestration with future management
      - setup_athena_credentials: interactive credential wizard; branching is UX-required
      - setup_bigquery_credentials: same as Athena
      - sort: multi-platform dispatch (Polars/PySpark/DataFusion) with different sort APIs

  - id: w2
    summary: "Add score 17-19 TPC spec and AST ignores"
    needs: [w1]
    status: done
    notes: |
      Add these with rationale:
      - _apply_datafusion_post_ops (19): literal vs multi-agg arithmetic with distinct semantics
      - _execute_dataframe_queries (18): TPC power test methodology; phases are spec-ordered
      - tpcds/throughput_test.py:run (18): TPC-DS spec; threading is mandatory
      - _rewrite_select (18): AST rewriting with dependency ordering (role_map → column rewrite)
      - _execute_rf1 (18): TPC-H RF1 spec; SQL building depends on prior step results
      - tpch/power_test.py:run (18): TPC-H power test; spec mandates permutation order
      - tpch/throughput_test.py:run (18): TPC-H throughput; spec mandates TTT measurement
      - _get_benchmark_results (17): thread-safe single-flight cache pattern
      - _convert_to_logical_operator (17): AST node conversion with operator-specific properties
      - _execute_stream (17): TPC-H stream; 22 queries in spec permutation order
      - transaction_primitives/benchmark.py:setup (17): spec-required sequential dependency chain
      - capture_query_plan (17): multi-level filter chain (ID, iteration, sampling, EXPLAIN)

