impact:
  business_value: |
    Plan capture runs will include actual per-operator timing and cardinality data,
    enabling real operator-level performance analysis. No schema changes required -
    the parser already handles these fields. Fingerprints and structural comparisons
    are unaffected.
  user_impact: |
    Users who run with --capture-plans get actionable timing data by default.
    Users who need lightweight structural-only capture can opt out via analyze_plans: false.

files_affected:
  modified:
  - benchbox/platforms/duckdb.py
  - benchbox/platforms/base/adapter.py
  - benchbox/cli/commands/run.py
  - tests/unit/platforms/test_duckdb_plan_capture.py

context_sections:
  "Why PRAGMA enable_profiling was rejected": |
    Full analysis in /Users/joe/.claude/plans/temporal-kindling-tarjan.md.
    Summary:
    - PRAGMA JSON schema uses operator_type/operator_timing/operator_cardinality (not
      name/timing/cardinality) - requires full parser rewrite
    - Inline reading needs conn.query_profiling_output() (DuckDB ≥ 1.0 Python API)
    - File-based output (PRAGMA profiling_output) is not thread-safe for concurrent queries
    - BenchBox fingerprinting excludes timing/cardinality anyway - PRAGMA overhead not justified

  "Why EXPLAIN ANALYZE is safe as default": |
    EXPLAIN ANALYZE (FORMAT JSON) produces the SAME JSON structure as EXPLAIN (FORMAT JSON):
      {"name": "HASH_JOIN", "timing": 0.042, "cardinality": 15000, "extra_info": "...", "children": [...]}
    DuckDBQueryPlanParser already handles timing+cardinality when present.
    Fixture DUCKDB_1_0_JSON_WITH_TIMING (tests/fixtures/duckdb_plans_by_version.py:177) proves this.
    Fingerprint computation in compute_plan_fingerprint() already excludes timing/cardinality -
    no fingerprint behavior change.

must_preserve:
- "Plan fingerprinting MUST NOT include timing/cardinality (QueryPlanDAG.compute_plan_fingerprint excludes these by design
  - structural comparison only)"
- "Opt-out path MUST remain available: analyze_plans: false in config (or equivalent) restores EXPLAIN without ANALYZE for
  users who need minimal overhead"
- "Parser behavior for plans without timing fields MUST continue working unchanged (backwards compatibility with stored plans
  from before this change)"

anti_patterns:
- "DO NOT switch to PRAGMA enable_profiling - because it uses a different JSON schema (operator_type vs name) requiring full
  parser rewrite - EXPLAIN ANALYZE is sufficient and schema-compatible"
- "DO NOT remove the analyze_plans opt-out - because concurrent throughput benchmarks and CI speed runs need lightweight structural-only
  plan capture - always keep the escape hatch"
- "DO NOT change the fingerprinting algorithm to include timing - because fingerprints are used for plan-change detection
  across runs, and timing varies between identical plans - keep timing out of fingerprints"

scope_limit:
  description: "Changes must be confined to plan capture path only"
  files:
  - benchbox/platforms/duckdb.py
  - benchbox/platforms/base/adapter.py
  - benchbox/cli/commands/run.py
  - tests/unit/platforms/test_duckdb_plan_capture.py
  - tests/unit/core/query_plans/parsers/test_duckdb_parser.py

verification:
- description: "EXPLAIN ANALYZE (FORMAT JSON) populates timing fields - confirms schema compatibility"
  command: "uv run -- python -c \"import duckdb, json; con = duckdb.connect(); con.execute('CREATE TABLE t AS SELECT range
    AS id FROM range(1000)'); rows = con.execute('EXPLAIN ANALYZE (FORMAT JSON) SELECT count(*) FROM t').fetchall(); plan
    = json.loads(rows[0][1]); print('timing present:', 'timing' in json.dumps(plan))\""
  expected_output: "timing present: True"
- description: "All parser tests pass (fingerprint stability, WITH_TIMING fixture handling)"
  command: "uv run -- python -m pytest tests/unit/core/query_plans/parsers/test_duckdb_parser.py -v"
  expected_output: "all tests pass, 0 failures"
- description: "All plan capture tests pass"
  command: "uv run -- python -m pytest tests/unit/platforms/test_duckdb_plan_capture.py tests/unit/core/query_plans/parsers/test_duckdb_parser.py
    -v"
  expected_output: "all tests pass, 0 failures"

