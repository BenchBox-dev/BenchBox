context_sections:
  "Root Cause Analysis": |
    Commit dbf159bd ("fix(metrics): harmonize TPC Power@Size calculation")
    changed the seed default from 1 to None as a side-effect of its primary
    goal (fixing Power@Size metric calculation). The seed change was described
    as "SQL seed default changed to None to allow reference-seed validation"
    but the downstream impact on SQL/DF parity was not assessed.

    The octal/decimal mismatch in TPCH_SF1_REFERENCE_SEED predates this
    commit and may have been introduced when the constant was first created.
    Python's 0o prefix for octal literals is easy to misread as decimal.

  "Resolution": |
    Fixed the reference seed comment to match the actual octal value (17039360).
    Changed seed default behavior to use qgen -d flag (defaults mode) when
    seed=None, which produces the official TPC-H default substitution parameters
    matching the answer files. Updated DataFrame TPCH_PARAMS to match qgen -d
    output. Both SQL and DF modes now produce identical row counts for all 22
    TPC-H queries at SF=1.

success_metrics:
  - "SQL and DF modes at SF=1 produce identical row counts for all 22 TPC-H queries"
  - "Geometric mean ratio between modes is within 1.0-1.5x (not 3.3x)"
  - "TPCH_SF1_REFERENCE_SEED octal literal and decimal comment agree"
  - "Unit test exists that asserts seed constant self-consistency"
