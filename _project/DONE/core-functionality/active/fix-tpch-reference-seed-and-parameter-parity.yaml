impact:
  business_value: |
    Benchmark comparisons between SQL and DataFrame modes are meaningless when
    the two modes run different query parameters. This blocks credible
    performance analysis and any published comparison numbers.
  technical_debt: |
    The hardcoded TPCH_PARAMS dictionary creates a hidden coupling between
    DataFrame queries and an implicit seed value. Any future seed change
    will silently break parity again.

files_affected:
  modified:
    - "benchbox/core/tpch/benchmark.py"
    - "benchbox/core/tpch/dataframe_queries.py"
    - "benchbox/platforms/base/adapter.py"
    - "benchbox/core/tpch/power_test.py"
  added:
    - "tests/unit/test_reference_seed.py"

must_preserve:
  - "TPCHPowerTest.__init__() seed auto-selection logic for exact validation when user explicitly passes --validation=exact"
  - "get_reference_seed() returns correct seed for SF=1.0 that matches answer files"
  - "DataFrame queries produce correct row counts matching TPC-H answer files at SF=1"
  - "SQL queries with default seed produce identical row counts to DataFrame queries for all 22 TPC-H queries"

approach: |
  Start by determining the correct reference seed empirically:
    1. Run `qgen` with various candidate seeds (1, 16843008, 17039360) at SF=1
    2. Compare generated query parameters against TPCH_PARAMS values
    3. Compare generated query output against answer files in benchbox/core/tpch/answers/

  The seed that produces parameters matching TPCH_PARAMS AND matching answer
  file row counts is the correct reference seed. Fix the constant accordingly.

  For the default behavior, Option B (restore seed=1 default) is likely simpler
  and lower-risk: change adapter.py:3656 back to `run_config.get("seed", 1)` and
  only auto-select reference_seed when validation_mode=="exact". This preserves
  parity without touching DataFrame queries.

  Long-term, TPCH_PARAMS should be generated from qgen output for a given seed
  rather than hardcoded, but that can be a follow-up.

anti_patterns:
  - "DO NOT change TPCH_PARAMS values without verifying against qgen output — because the parameters are interdependent and arbitrary changes will produce wrong row counts — regenerate from qgen instead"
  - "DO NOT remove the reference_seed concept entirely — because exact validation against answer files requires a specific seed — keep it available but don't make it the default"
  - "DO NOT add seed parameter threading to DataFrame query functions — because that would require reimplementing qgen's parameter substitution in Python — keep DataFrame params as a static dict derived from qgen output"

