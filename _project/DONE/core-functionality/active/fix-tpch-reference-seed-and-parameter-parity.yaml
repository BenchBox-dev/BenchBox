  phases:
    - phase: "Phase 1: Determine correct reference seed"
      done: true
      items:
        - summary: "Verify which seed the SF=1 answer files were generated with by running qgen with candidate seeds and comparing output row counts against answer files"
          done: true
        - summary: "Fix TPCH_SF1_REFERENCE_SEED so the octal literal, decimal comment, and answer files all agree"
          done: true
