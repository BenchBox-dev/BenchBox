        - summary: "Decide policy: should no-seed default to reference_seed (exact validation) or seed=1 (DF parameter parity)? Document the decision."
          done: true
          subtasks:
            - summary: "Option A: Keep reference_seed auto-select, update TPCH_PARAMS in dataframe_queries.py to match reference seed parameters"
              done: false
            - summary: "Option B: Restore seed=1 default, only use reference_seed when --validation=exact is explicitly requested"
              done: false
        - summary: "Implement chosen option and ensure both SQL and DF modes produce matching row counts for all 22 queries at SF=1"
          done: true

    - phase: "Phase 3: Parameterize DataFrame queries"
      done: true
      items:
        - summary: "Make TPCH_PARAMS in dataframe_queries.py derivable from seed rather than hardcoded, or at minimum validate that hardcoded values match the default seed"
          done: true
        - summary: "Add a startup assertion or test that compares TPCH_PARAMS values against qgen output for the default seed"
          done: true

    - phase: "Phase 4: Testing and validation"
      done: true
      items:
        - summary: "Run both modes at SF=1 and confirm geometric mean ratio is within 1.0-1.5x (not 3.3x)"
          done: true
        - summary: "Confirm all 22 queries pass validation in both modes with 0 row-count mismatches"
          done: true
        - summary: "Add unit test asserting TPCH_SF1_REFERENCE_SEED decimal comment matches actual value"
          done: true

