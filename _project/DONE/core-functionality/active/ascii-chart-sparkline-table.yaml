- "render_ascii_chart() in exporters.py handles all existing chart_type strings"
- "ASCIISummaryBox behavior unchanged (sparkline table is multi-platform overview, summary box is single-run aggregate stats)"

approach: |
  Build as a table renderer with inline mini-bars rather than a traditional chart:

  1. Create SparklineColumn (name, values dict[platform, float], higher_is_better) and
     SparklineTableData (platforms, columns) dataclasses.
  2. Create ASCIISparklineTable(ASCIIChartBase) with render().
  3. For each column, normalize values to 0.0-1.0 range and render as a 1-4 character
     vertical block using LOWER_BLOCK_CHARS (▁▂▃▄▅▆▇█).
  4. Respect higher_is_better flag: for latency metrics (lower is better), invert the
     normalization so the best platform gets the tallest bar.
  5. Color the best value green (#1b9e77) and worst red (#d95f02) per column.
  6. Add from_normalized_results() factory that populates columns from standard metrics.

  Column width calculation should be dynamic: metric name width + sparkline bar width +
  value width, constrained to fit within terminal width. If too many columns, truncate
  lower-priority columns with "..." indicator.

anti_patterns:
- "DO NOT use full-width bar charts per cell — because the value of this chart is compactness — use 1-4 character sparkline
  bars only"
- "DO NOT hardcode metric columns — because different benchmarks expose different metrics — accept a flexible list of SparklineColumn
  instances"

verification:
- description: "New chart class renders without error"
  command: "uv run -- python -c \"from benchbox.core.visualization.ascii.sparkline_table import ASCIISparklineTable, SparklineColumn,
    SparklineTableData; cols = [SparklineColumn('Total(ms)', {'DuckDB': 1240, 'Polars': 1580}, False), SparklineColumn('Success',
    {'DuckDB': 100, 'Polars': 100}, True)]; data = SparklineTableData(['DuckDB', 'Polars'], cols); chart = ASCIISparklineTable(data=data);
    print(chart.render())\""
  expected_output: "Rendered table with sparkline bars and values"
- description: "Existing chart tests still pass"
  command: "uv run -- python -m pytest tests/unit/visualization/ascii/test_ascii_charts.py -v"
  expected_output: "all tests pass, 0 failures"

