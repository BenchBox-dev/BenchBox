impact:
  business_value: |
    Eliminates a vestigial feature that adds maintenance burden without user value. Every
    future chart type (comparison_bar, diverging_bar, summary_box) only needs one implementation
    instead of two. Reduces optional dependency weight by 46 MB. Simplifies MCP tool responses
    from file-path-vs-content branching to always-inline content.
  user_impact: |
    Users who installed benchbox[viz] or benchbox[mcp] get a lighter install. CLI and MCP
    visualization continues to work identically (ASCII was already the functional path).
    Users who generated HTML files (if any) lose that capability — mitigated by the fact that
    no browser integration existed and files had to be manually located and opened.
  technical_debt: |
    Removes significant technical debt: the dual data model hierarchy, the conversion layer
    in exporters.py, the format branching in MCP tools, and the three test files that skip
    silently when plotly isn't installed. Net reduction of ~2,300 lines.

context_sections:
- title: "Removal Scope Summary"
  content: |
    Source code: Delete 783 lines entirely (charts.py, styles.py, dependencies.py),
    strip ~725 lines from shared files (result_plotter.py, exporters.py, visualization.py).
    Tests: Delete 801 lines (4 test files), update 2 test files.
    Config: Remove plotly from pyproject.toml viz/mcp extras.
    Total: ~2,300 lines removed, 37% reduction in visualization module.

- title: "Evidence: HTML Charts Are Unused"
  content: |
    1. No webbrowser.open() or HTTP server in codebase — HTML files sit on disk
    2. No CI workflow generates or validates HTML charts
    3. MCP returns file paths for HTML (useless to LLMs) vs inline for ASCII (useful)
    4. Blog workflow skill does not reference chart generation
    5. HTML is the default format but CLI visualize is rarely invoked
    6. Three Plotly test files use importorskip — they skip silently in minimal envs
    7. Previous work (trim-viz-deps-plotly-only.yaml in DONE/) already removed kaleido,
       signaling a trajectory toward lighter visualization deps

- title: "Data Model Unification Plan"
  content: |
    Current dual models:
      Plotly: BarDatum, TimeSeriesPoint, CostPerformancePoint, DistributionSeries, QueryLatencyDatum
      ASCII:  BarData, BoxPlotSeries, LinePoint, ScatterPoint, HistogramBar
    After removal: Promote ASCII models as canonical. ResultPlotter produces them directly.
    Conversion layer in exporters.py:render_ascii_chart() becomes unnecessary.
    New chart types (from enhance-ascii-charting TODO) only need ASCII models.

