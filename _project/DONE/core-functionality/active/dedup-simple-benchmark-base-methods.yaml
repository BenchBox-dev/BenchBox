description: |
  AMPLab, ClickBench, and SSB benchmarks had near-identical implementations of
  run_benchmark (AMPLab/ClickBench) and _load_data/_load_table_data (AMPLab/SSB).

  Created SimpleBenchmarkMixin in benchbox/core/simple_benchmark_mixin.py that
  extracts the shared logic, parameterized by _benchmark_label and _table_load_order
  class attributes.

  SSB's run_benchmark was NOT extracted because it uses a different return format
  (query_results list vs queries dict).

