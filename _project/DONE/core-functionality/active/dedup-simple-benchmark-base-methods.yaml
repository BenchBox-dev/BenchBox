    needs: [w1]
    status: done

  - id: w3
    summary: "Extract shared _load_data to base class (~76 lines saved)"
    needs: [w1]
    status: done

  - id: w4
    summary: "Verify all three benchmarks work with extracted base methods"
    needs: [w2, w3]
    status: done

