impact:
  business_value: |
    Prevents regressions in critical release-path code. A fingerprinting bug could ship mismatched
    source and artifacts. A timestamp normalization bug could leak actual build times. A size check
    gap could allow multi-GB TPC data files into public releases. These tests catch such issues
    before they reach production.
  user_impact: |
    No direct user impact (internal testing). Indirect benefit: higher confidence in release
    artifact integrity means users get correct, reproducible packages.
  technical_debt: |
    Reduces testing debt significantly. Current release module coverage is near 0% for these
    components. After implementation, critical path functions will have >80% coverage.

