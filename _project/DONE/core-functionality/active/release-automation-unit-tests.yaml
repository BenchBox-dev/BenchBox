        Test the two foundational functions that all downstream release steps depend on:
        compute_source_fingerprint() for source/artifact identity verification, and
        calculate_most_recent_saturday_midnight() / _normalize_timestamps() for reproducible builds.
      items:
        - description: "Create tests/unit/test_release_fingerprint.py with TestComputeSourceFingerprint class (~13 tests)"
          done: true
          subtasks:
            - description: "test_deterministic_same_content: same directory produces identical fingerprint on repeated calls"
              done: true
            - description: "test_content_sensitivity: changing .py file content changes the fingerprint"
              done: true
            - description: "test_adding_file_changes_fingerprint: adding a new .py file changes the fingerprint"
              done: true
            - description: "test_ignores_non_py_files: adding .md, .json, .yaml files does not change fingerprint"
              done: true
            - description: "test_empty_directory: empty dir produces valid 64-char hex SHA256 string"
              done: true
            - description: "test_nested_packages: files in sub/sub/module.py are included and affect fingerprint"
              done: true
            - description: "test_uses_posix_paths: fingerprint is deterministic (as_posix() used internally)"
              done: true
            - description: "test_ignores_timestamps: os.utime() on .py file does not change fingerprint"
              done: true
