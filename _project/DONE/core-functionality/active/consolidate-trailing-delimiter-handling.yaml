must_preserve:
- "All existing TPC-H and TPC-DS data loading must continue to work identically"
- "DuckDB SQL EXCLUDE pattern and PyArrow include_columns filtering remain unconditional (they handle both with/without trailing
  delimiter)"
- "Compressed file support in trailing delimiter detection (via CompressionManager)"
- "Schema-less fallback for has_trailing_delimiter when column_names is None"

approach: |
  The smart field-count detection from FormatConverter._needs_trailing_dummy_column() is the
  canonical approach: read the first non-empty line, split by delimiter, compare field count
  to expected column count. This correctly handles both TPC-H files (which have trailing |)
  and TPC-DS files like time_dim.dat (which do not). Move this logic to file_format.py as
  the single source of truth, then update all 13 call sites to use it. For SQL adapters,
  only standardize the column name -- the unconditional add-then-drop pattern is safe there.

anti_patterns:
- "DO NOT use naive 'ends with delimiter' check -- it incorrectly flags TPC-DS files like time_dim.dat that end with | as
  field content"
- "DO NOT unconditionally add dummy columns in DataFrame adapters -- it breaks when the file has no trailing delimiter (extra
  NaN column)"
- "DO NOT use delimiter == '|' as a proxy for has_trailing_delimiter -- not all pipe-delimited files have trailing pipes"

verification:
- description: "Lint passes"
  command: "uv run ruff check ."
- description: "All fast tests pass"
  command: "uv run -- python -m pytest -m fast -q"
- description: "TPC-DS time_dim loads correctly via DataFusion DataFrame mode"
  command: "uv run benchbox run --platform datafusion --benchmark tpcds --scale 0.01 --mode dataframe"
- description: "No stale trailing column references remain"
  command: "grep -r '_trailing_' benchbox/ --include='*.py'"
  expected_output: "Only references to TRAILING_DUMMY_COLUMN or its value '_trailing_delimiter_'"

