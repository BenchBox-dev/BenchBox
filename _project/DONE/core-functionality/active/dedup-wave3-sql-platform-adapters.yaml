    - "benchbox/platforms/clickhouse_cloud.py"
    - "benchbox/platforms/redshift.py"
    - "benchbox/platforms/spark.py"
    - "benchbox/platforms/presto_trino_utils.py"
    - "benchbox/platforms/azure/fabric_spark_adapter.py"
    - "benchbox/platforms/azure/synapse_spark_adapter.py"
  created:
    - "benchbox/platforms/azure/spark_execution_utils.py"
    - "benchbox/utils/cloud_urls.py"

verification:
  - description: "Platform adapter tests pass"
    command: "uv run -- python -m pytest tests/ -v -k 'firebolt or presto or trino or athena or azure or clickhouse or redshift or spark or lakesail'"
    expected_output: "exit code 0, no failures"
  - description: "Duplicate check shows reduction for targeted groups"
    command: "make duplicate-check-verbose 2>&1 | grep -c 'apply_table_tunings\\|_build_lakesail_config\\|_wait_for_statement\\|_extract_table_name'"
    expected_output: "0"

scope_limit:
  only_modify:
    - "benchbox/platforms/"
    - "benchbox/utils/"
    - "tests/"

must_preserve:
  - "apply_table_tunings behavior identical per platform (including ImportError handling)"
  - "Azure config builders produce identical connection parameters"
  - "create_schema DDL output byte-for-byte identical for Presto and Trino"
  - "Azure Spark statement execution and polling semantics unchanged"
  - "get_query_plan output format identical (newline-joined plan rows)"
  - "Cloud URL parsing returns identical (bucket, path) tuples"
  - "_extract_table_name returns identical table name strings from DDL"

anti_patterns:
  - "DO NOT create a deep inheritance hierarchy for platform adapters — because platform adapters are frequently added/modified by contributors unfamiliar with the class hierarchy; utility functions are easier to discover and compose than deep class chains — use standalone utility functions or thin mixins"
  - "DO NOT merge Presto and Trino into a single adapter class — because they diverge on features (Trino adds fault-tolerant execution, Presto has different auth) and a merged class would accumulate platform-specific branches — only share specific utilities via presto_trino_utils.py"
  - "DO NOT merge Fabric and Synapse Spark adapters — because Fabric has workspace-scoped Lakehouse/Warehouse semantics that Synapse lacks; only the Livy execution layer is shared — extract only _execute_statement and _wait_for_statement"
  - "DO NOT over-generalize the tuning utility — because other platforms (BigQuery, Snowflake, DuckDB) use radically different tuning mechanisms (clustering, micro-partitions, pragmas) and a universal abstraction would be leaky — only consolidate the specific 3 platforms (firebolt, lakesail, presto) that are 97% identical"
  - "DO NOT use *args/**kwargs for the config builder — because explicit parameters preserve type safety and IDE navigability across the 2 consuming adapters — keep explicit parameters matching the current signatures"

