      done: true
    - summary: Add is_csv_format() to benchbox/utils/file_format.py
      done: true
    - summary: Add unit tests for new utilities
      done: true
  - phase: 'Phase 2: Update Platform Adapters'
    done: true
    items:
    - summary: fabric_warehouse.py:928-929 - Replace suffix == '.parquet' with is_parquet_format()
      done: true
    - summary: postgresql.py:458-460,473 - Replace suffix checks with get_delimiter_for_file() and is_tpc_format()
      done: true
    - summary: snowpark_connect.py:348 - Replace suffix == '.parquet' with is_parquet_format()
      done: true
  - phase: 'Phase 3: Update DataFrame and Base Utilities'
    done: true
