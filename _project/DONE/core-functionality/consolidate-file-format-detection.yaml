context_sections:
  Current Utilities Available: 'In `benchbox/utils/file_format.py`:

    - `detect_data_format(path)` - Returns format name (''parquet'', ''tbl'', ''csv''), handles compression

    - `is_tpc_format(path)` - Returns True for .tbl/.dat, handles compression

    - `is_parquet_format(path)` - Returns True for .parquet, handles compression

    - `is_csv_format(path)` - Returns True for .csv, handles compression

    - `get_delimiter_for_file(path)` - Returns "|" for TPC, "," otherwise

    - `COMPRESSION_EXTENSIONS` - frozenset of compression extensions


    In `benchbox/platforms/base/data_loading.py`:

    - `FileFormatRegistry.get_base_data_extension()` - Handles sharding AND compression properly

    '
  Locations Updated: '| File | Lines | Utility Used | Status |

    |------|-------|-------------|--------|

    | fabric_warehouse.py | 932, 935, 940 | is_parquet_format(), is_tpc_format(), get_delimiter_for_file() | Done |

    | postgresql.py | 459, 469 | get_delimiter_for_file(), is_tpc_format() | Done |

    | snowpark_connect.py | 349 | is_parquet_format() | Done |

    | pandas_family.py | 1228 | detect_data_format() | Done |

    | base/utils.py | 42, 49 | is_parquet_format(), is_tpc_format() | Done |

    | tpcds/benchmark/runner.py | 1017 | get_delimiter_for_file() | Done |

    '
impact:
  technical_debt: 'Medium severity - code works for uncompressed files but will fail silently

    for compressed parquet/csv files, causing incorrect format detection and

    potentially data loading failures.

    '
  user_impact: 'Users with compressed parquet or CSV files may experience incorrect

    data loading behavior. This is increasingly important as compression

    becomes more common for large-scale benchmarks.

    '
