title: "Centralize File Format and Compression Extension Detection"
worktree: "core-functionality"
priority: "Medium-High"
status: "Completed"
completed_date: "2026-01-25"
description: |
  Extract file format detection and compression extension handling to a centralized utility.

  Currently, compression extension sets and format detection logic are duplicated across 5+ files
  with inconsistent coverage (some include .snappy, others don't; some handle .lz4, others don't).

  This violates DRY and creates maintenance burden - adding a new compression format requires
  updating multiple scattered locations.

category: "Core Functionality"

