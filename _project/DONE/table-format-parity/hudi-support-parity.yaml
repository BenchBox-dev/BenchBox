open_questions:
  - "How to handle schema inference for record key selection?"

resolved_decisions:
  - question: "Should we support both COW and MOR table types?"
    decision: "Default to COPY_ON_WRITE (better for analytics), allow MERGE_ON_READ via config"
    rationale: "COW has faster reads, MOR better for streaming - analytics workloads favor COW"
  - question: "Which Python library to use: pyhudi vs PySpark+Hudi connector?"
    decision: "PySpark SQL with Hudi connector - no pure Python library exists"
    rationale: "Unlike delta-rs/pyiceberg, Hudi has no standalone Python maintenance API"

