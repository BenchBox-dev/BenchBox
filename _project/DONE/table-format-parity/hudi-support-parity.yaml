context_sections:
  "Technical Context": |
    Hudi differs from Delta Lake and Iceberg in key ways:

    1. **Record Key Requirement**: Every Hudi table requires a record key field
       (similar to primary key) for deduplication and change tracking.

    2. **Precombine Field**: Hudi uses a precombine field to determine which
       record wins when duplicates exist (typically a timestamp).

    3. **Write Modes**: Supports insert, upsert, bulk_insert with different
       performance characteristics.

    4. **Python Library**: No dedicated Python maintenance library like delta-rs
       or pyiceberg. Must use PySpark with Hudi connector or Spark SQL.

    5. **Table Types**: Copy-on-Write (COW) vs Merge-on-Read (MOR) with
       different read/write performance tradeoffs.

  "Reference Implementations": |
    Delta Lake Pattern (delta_lake_maintenance.py):
    - Uses delta-rs library (Rust-based, high performance)
    - Native API calls: dt.delete(), dt.update(), dt.merge()

    Iceberg Pattern (iceberg_maintenance.py):
    - Uses pyiceberg library (pure Python)
    - Expression-based operations with row_filter conditions

    Hudi Approach:
    - Use PySpark with Hudi connector (most reliable)
    - Spark SQL for maintenance operations
    - Consider hudi-spark-client for lower-level access

technical_requirements:
  constraints:
    - "Must support configurable record key fields (not hardcoded 'id')"
    - "Must support configurable precombine fields (not hardcoded 'ts')"
    - "Must gracefully handle missing PyHudi/PySpark dependencies"
  dependencies:
    - "pyspark with hudi-spark-bundle"
    - "Optional: pyhudi for standalone operations"
  compatibility: |
    - Apache Hudi 0.14+ for full feature support
    - Spark 3.4+ for Hudi connector compatibility
    - AWS EMR, Databricks, Dataproc all support Hudi natively

