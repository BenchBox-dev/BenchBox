sections:
  Implementation Summary: 'Already implemented via:

    - benchbox/release/workflow.py: prepare_public_release() function

    - scripts/prepare_release.py: CLI script for running the release preparation

    - tests/unit/release/test_workflow.py: Test coverage for release workflow


    Usage: python scripts/prepare_release.py ../project-public --version 1.0.0 --init-git


    Features:

    - Copies only ALLOWED_ROOT_FILES (benchbox, tests, docs, README, LICENSE, etc.)

