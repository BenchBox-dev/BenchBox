context_sections:
  "Background and Motivation": |
    The wheel format (PEP 427) does not use MANIFEST.in - only setuptools
    package-data configuration determines what non-Python files are included.
    The current pyproject.toml uses a wildcard `"*"` key which matches patterns
    relative to each discovered package directory, NOT the project root.

    TPC-DS already has query_templates/ duplicated inside each platform-specific
    binary directory (106 files × 5 platforms), but the code ignores them and
    hardcodes paths to `_sources/`. TPC-H has no templates bundled at all.

  "Technical Context": |
    The fix creates shared (platform-independent) template directories at
    `benchbox/_binaries/tpc-{h,ds}/templates/` since templates are plain text
    files identical across all architectures. A new `get_tpc_templates_dir()`
    utility provides the single resolution path with package-first priority.

    Plan file: /Users/joe/.claude/plans/streamed-riding-canyon.md

