      done: true
    - summary: "Update benchbox/core/tpch/queries.py _find_templates_dir() to use new utility"
      done: true
    - summary: "Update benchbox/core/tpch/streams.py __init__() template path resolution"
      done: true
    - summary: "Update benchbox/core/tpcds/c_tools.py _resolve_tpcds_tool_and_template_paths()"
      done: true

  - phase: "Phase 3: Update Packaging Config"
    done: true
    items:
    - summary: "Remove broken '*' package-data glob from pyproject.toml"
      done: true
    - summary: "Remove _sources/ runtime includes from MANIFEST.in"
      done: true

  - phase: "Phase 4: Verification"
    done: true
    items:
    - summary: "Build wheel and verify templates are included"
      done: true
    - summary: "Install from wheel in fresh venv, test TPC-H query generation"
      done: true
    - summary: "Run existing tests (fast + tpcds_resource_resolution)"
      done: true
    - summary: "Verify editable install still works"
      done: true

