impact:
  business_value: |
    BenchBox is completely non-functional for TPC-H when installed from PyPI.
    This is a blocking issue for all users who install via pip/uv.
  user_impact: |
    Users installing from PyPI get RuntimeError when attempting any TPC-H or
    TPC-DS benchmark run. The error message is confusing ("templates not found")
    with no actionable fix for the user.
  technical_debt: |
    The _sources/ directory pattern (project-root files referenced at runtime)
    is fundamentally incompatible with wheel distribution. This fix consolidates
    runtime assets inside the package tree where they belong.

