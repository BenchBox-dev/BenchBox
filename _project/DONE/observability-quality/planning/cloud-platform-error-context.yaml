completion_notes: |
  Created benchbox/platforms/cloud_error_context.py with comprehensive
  error pattern matching for 4 cloud platforms.

  Module Structure:
  - CloudErrorContext dataclass with error_type, original_message, platform,
    suggestions, diagnostic_commands, and documentation_url fields
  - format_message() method for user-friendly output

  Error Categories Implemented:
  - auth: Authentication/credential issues
  - network: Connectivity and firewall issues
  - quota: Rate limits and resource quotas
  - config: Configuration and project/dataset issues
  - permission: IAM and access control issues
  - cluster_state: Warehouse/cluster status (paused, terminated, etc.)

  Platform Pattern Coverage:
  1. BigQuery (4 patterns):
     - Quota exhaustion with GCloud quota commands
     - Permission errors with IAM hints
     - Not found errors for projects/datasets
     - Credentials errors with GOOGLE_APPLICATION_CREDENTIALS hints

  2. Redshift (4 patterns):
     - Connection/network errors with security group hints
     - Cluster paused/maintenance detection
     - Permission errors with GRANT command suggestions
     - Password authentication failures

  3. Snowflake (4 patterns):
     - Warehouse suspended with ALTER WAREHOUSE resume hint
     - Role does not exist with USE ROLE suggestions
     - Account not found with identifier format hints
     - Authentication failed with MFA/key-pair suggestions

  4. Databricks (4 patterns):
     - Cluster terminated with startup guidance
     - Token expired with regeneration steps
     - Permission denied with cluster permissions hints
     - Network errors with workspace URL validation

  API Functions:
  - detect_error_type(error_message, platform) -> CloudErrorContext | None
  - enhance_cloud_error(exception, platform) -> ConfigurationError
  - wrap_cloud_operation(platform, operation) decorator

  Testing:
  - 36 tests in test_cloud_error_context.py
  - TestCloudErrorContext: 4 tests for message formatting
  - TestBigQueryErrorPatterns: 4 tests
  - TestRedshiftErrorPatterns: 4 tests
  - TestSnowflakeErrorPatterns: 4 tests
  - TestDatabricksErrorPatterns: 4 tests
  - TestDetectErrorType: 4 tests for edge cases
  - TestEnhanceCloudError: 3 tests
  - TestWrapCloudOperation: 4 tests
  - TestErrorPatternCoverage: 5 tests for pattern quality

  All 36 tests pass.

