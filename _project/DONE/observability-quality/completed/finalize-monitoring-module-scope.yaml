id: finalize-monitoring-module-scope
title: Finalize Monitoring Module Scope
worktree: observability-quality
category: Pre-Release High Priority Tasks (Should-Fix Before Release)
priority: Medium
status: Completed
description: '"Decided to ship `benchbox/monitoring` package in v1.0 as opt-in helper-only module with stable API, comprehensive
  tests (84% coverage), and complete documentation."'
context_sections:
- name: Worktree State
  summary: Monitoring modules and tests exist locally but are unstaged/unreferenced, risking broken imports for users.
- name: Current Findings (2025-02)
  summary: '"Monitoring utilities live entirely in `benchbox/monitoring/performance.py` and are re-exported for public use
    without extra dependencies.

    Unit suite `tests/unit/monitoring/test_performance_monitoring.py` passes, and documentation already references the helpers
    via `docs/advanced/performance.md`.

    `datetime.utcnow()` usage triggers deprecation warnings and CLI integration remains opt-in; decision still needed on whether
    to ship as helper-only or defer for deeper integration.

    "'
impact: Avoids shipping half-finished monitoring APIs or leaving dead references.
