description: |
  Build rule-based cost optimizer that generates actionable recommendations
  with savings estimates and implementation guides.

completion:
  date: '2025-11-29'
  commits:
  - ef8db9ef: "feat: add cost optimization engine with rule-based recommendations"
  implementation_notes: |
    Implemented comprehensive Cost Optimization Engine at benchbox/core/cost/optimizer.py with:

    Core Architecture:
    - CostOptimizer class with rule-based recommendation engine
    - OptimizationReport with prioritized recommendations
    - Recommendation dataclass with full details

    Data Models:
    - SavingsEstimate: Amount, confidence level, percentage, range
    - ImplementationGuide: Steps, prerequisites, risks, rollback, time estimate
    - OptimizationCategory: Platform tier, region, resource sizing, pricing model, query, data management
    - ConfidenceLevel: High, medium, low
    - ImplementationEffort: Trivial, low, medium, high

    Platform-Specific Rules:
    - Snowflake: Tier optimization (Enterprise→Standard), region optimization
    - Databricks: Tier optimization, workload type optimization (all_purpose→jobs)
    - BigQuery: Region optimization, bytes scanned reduction (partitioning/clustering)
    - Redshift: Region optimization, DS2→RA3 node type migration

    Cross-Platform Rules:
    - Reserved capacity recommendations for high spend ($10K+/year)
    - High-cost query detection with optimization guidance
    - Priority-ranked recommendations by impact

    API Features:
    - analyze() method generates complete optimization report
    - get_by_category() filters by optimization type
    - get_quick_wins() returns easy-to-implement recommendations
    - to_dict() for serialization

    Tests: 34 unit tests covering:
    - Data model serialization
    - Platform-specific rule detection
    - Edge cases (unknown platform, already optimized)
    - Confidence levels and effort levels

  phases_completed:
  - Rule-based detection (10 optimization rules)
  - Savings estimates (with confidence levels)
  - Implementation guides (step-by-step)
  - Platform support (Snowflake, BigQuery, Redshift, Databricks)
  - Test coverage (34 tests passing)

  note: |
    The Cost Optimization Engine integrates with the existing cost module and
    provides actionable recommendations for reducing cloud database spending.
    Access via `from benchbox.core.cost import CostOptimizer`.

