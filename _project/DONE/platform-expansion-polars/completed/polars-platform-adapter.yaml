id: polars-platform-adapter
title: Polars Platform Adapter
worktree: platform-expansion-polars
category: Platform Expansion
priority: High
status: Completed
description: |
  Implement Polars adapter for the fastest-growing DataFrame library
  (23K+ GitHub stars), positioning as "Pandas but 10x faster."

completion:
  date: '2025-11-28'
  commits:
  - f04facc4: "feat: add Polars platform adapter for SQL and DataFrame benchmarking"
  implementation_notes: |
    Implemented comprehensive Polars platform adapter at benchbox/platforms/polars_platform.py with:

    PolarsSQLContext Wrapper:
    - Provides connection-like interface for SQLContext
    - register_table() for adding DataFrames/LazyFrames
    - unregister_table() for cleanup
    - execute() for SQL query execution
    - get_tables() to list registered tables

    PolarsAdapter Class:
    - Extends PlatformAdapter base class
    - Supports lazy vs eager execution modes
    - Streaming mode for large datasets
    - PostgreSQL-compatible SQL dialect

    CLI Arguments:
    - --polars-execution-mode (lazy/eager)
    - --polars-streaming (enable streaming)
    - --polars-n-rows (row limit for testing)
    - --polars-working-dir
    - --polars-rechunk

    Data Loading:
    - Auto-detection of CSV/TBL/Parquet formats
    - Handles TPC benchmark files with trailing delimiters
    - Lazy scanning with scan_csv/scan_parquet
    - Schema inference and explicit column naming
    - Support for multiple file patterns

    Query Execution:
    - SQL execution via pl.SQLContext
    - Dry-run mode support
    - Row count validation integration
    - Proper error handling

    Platform Registration:
    - Added to platforms/__init__.py
    - get_platform_adapter() support
    - list_available_platforms() integration
    - get_platform_requirements() info

    Tests: 30 comprehensive unit tests covering:
    - Basic initialization and configuration
    - SQLContext operations
    - Query execution success/failure
    - Data loading and format detection
    - Validation and capabilities
    - CLI argument handling
    - Platform registration

  phases_completed:
  - Phase 1: Adapter Architecture (polars_platform.py with lazy/eager modes)
  - Phase 2: SQL Translation (pl.SQLContext integration)

  phases_remaining:
  - Phase 3: DataFrame Benchmark Mode (native Polars API queries)
  - Phase 4: Memory Profiling (peak memory tracking)

  note: |
    Core Polars adapter is production-ready for SQL-based benchmarking.
    The adapter uses Polars' SQLContext which supports most TPC-H queries.
    DataFrame-native benchmarks and memory profiling can be added separately.
    Some TPC-DS queries may require DataFrame API due to SQL limitations.
