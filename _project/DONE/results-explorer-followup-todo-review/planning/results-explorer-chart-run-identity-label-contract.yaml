success_metrics:
- "No chart shows the same visible label for two different result IDs."
- "Long run labels preserve a distinguishing date or short ID."
- "Full identity is available through tooltip/title/aria or details affordance."
- "All chart components use the same identity formatter."

implementation_notes:
- "w0 evidence captured at _project/verification-logs/results-explorer-chart-run-identity-label-contract/w0.log on 3c436332: duplicate public DataFusion cohorts exist in the current snapshot, and several chart components still used prefix-only truncation after run identity formatting."
- "The run identity helper now exposes compact/disambiguated/table/full labels, full title/aria text, suffix-preserving truncation, and uniqueness-preserving truncation for chart budgets."
- "Chart labels now use the shared truncation/identity contract in DistributionBox, CDFChart, PowerBar, PerformanceBar, StackedPhase, PercentileLadder, RankTable, TimeSeries, SparklineTable, Compare summary/baseline controls, and QueryDiffTable."
- "Non-hex short_id prefixes derived from full result IDs are ignored so compare-mode chart labels preserve the trailing hash token instead of falling back to full result IDs."
