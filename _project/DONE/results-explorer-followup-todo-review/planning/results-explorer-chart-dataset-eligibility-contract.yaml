- "w0 inventory captured in _project/verification-logs/results-explorer-chart-dataset-eligibility-contract/w0.log and fixture generation captured in w0-fixtures.log."
- "w1 matrix captured in _project/verification-logs/results-explorer-chart-dataset-eligibility-contract/w1.log with explicit display-safe, rank-safe, compare-safe, cost-safe, trend-safe, and provenance-only chart classes."
