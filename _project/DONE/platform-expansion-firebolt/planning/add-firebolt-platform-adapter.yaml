id: add-firebolt-platform-adapter
title: Add Firebolt Platform Adapter (Core + Cloud)
worktree: platform-expansion-firebolt
priority: Medium
status: Completed
completed_date: "2025-11-29"
category: Platform Expansion
description: |
  Implement a unified Firebolt platform adapter supporting both Firebolt Core (free, self-hosted)
  and Firebolt Cloud (managed service). Firebolt is a PostgreSQL-compatible cloud data warehouse
  with a vectorized query engine optimized for analytical workloads.

  **Key Discovery: Firebolt Core**
  Firebolt provides a genuinely free, self-hosted version called "Firebolt Core" that runs locally
  via Docker with the same distributed, vectorized query engine as the cloud version. This enables
  cost-free development, testing, and benchmarking without cloud dependencies.

  **Unified Adapter Strategy**
  A single adapter can support both deployment modes with minimal conditional logic:
  - Local (Core): `connect(database='firebolt', url='http://localhost:3473')`
  - Cloud: `connect(auth=ClientCredentials(...), engine_name=..., account_name=...)`

  This approach mirrors DataFusion's lesson of handling local vs cloud seamlessly.

context_sections:
  "Background and Motivation": |
    Firebolt offers compelling benchmarking value for BenchBox:

    1. **Free Local Development**: Firebolt Core allows testing without cloud costs or accounts
    2. **Same Engine**: Core uses identical query engine to cloud (no performance handicaps)
    3. **PostgreSQL Compatibility**: Standard SQL dialect enables easy migration and tooling
    4. **Modern Architecture**: Vectorized execution, distributed processing, Iceberg support
    5. **Official Python SDK**: DBAPI 2.0 compliant with async support

    Unlike many cloud warehouses (Snowflake, BigQuery), Firebolt's Core edition provides
    a true local development experience, similar to DuckDB but with distributed capabilities.

  "Firebolt Core Specifications": |
    **Docker Deployment:**
    ```bash
    # Linux
    docker run -i --rm --ulimit memlock=8589934592:8589934592 \
      --security-opt seccomp=unconfined -p 127.0.0.1:3473:3473 \
      -v ./firebolt-core-data:/firebolt-core/volume \
      ghcr.io/firebolt-db/firebolt-core:preview-rc

    # macOS (requires root user in container)
    mkdir -p -m 777 firebolt-core-data
    docker run -i --rm --user root --ulimit memlock=8589934592:8589934592 \
      --security-opt seccomp=unconfined -p 127.0.0.1:3473:3473 \
      -v ./firebolt-core-data:/firebolt-core/volume \
      ghcr.io/firebolt-db/firebolt-core:preview-rc
    ```

    **System Requirements:**
    - Linux kernel >= 6.1 (for io_uring API); Docker works on macOS
    - CPU: amd64 with SSE 4.2+ or arm64
    - RAM: Minimum 16 GB recommended
    - Storage: 25+ GB SSD recommended
    - Default port: 3473

    **Core Limitations vs Cloud:**
    - No authentication (acceptable for local benchmarking)
    - No DIMENSION tables (all tables sharded)
    - Single write transaction at a time (acceptable for batch loading)
    - No async query execution
    - No online upgrades
    - Subset of SQL dialect (core analytics features present)

  "DataFusion Lessons Applied": |
    Based on comprehensive analysis of the DataFusion adapter implementation:

    1. **from_config() Pattern**: Use for intelligent initialization with naming utilities
    2. **Database Naming**: Use generate_database_name() for consistency
    3. **Graceful Feature Degradation**: Log unsupported features, don't error
    4. **DataSourceResolver**: Use for normalized data loading paths
    5. **Dry-Run Support**: Capture SQL without execution
    6. **Type Mapping Table**: Create comprehensive SQL-to-Firebolt type mapping
    7. **Base Class Logging**: Use log_operation_start/complete, log_verbose methods
    8. **Test Mock Patterns**: Follow established testing patterns

  "Python SDK Details": |
    **Primary Package: firebolt-sdk**
    ```bash
    pip install firebolt-sdk
    # or with faster date processing:
    pip install "firebolt-sdk[ciso8601]"
    ```

    **Connection Examples:**
    ```python
    from firebolt.db import connect
    from firebolt.client.auth import ClientCredentials

    # Firebolt Core (local)
    with connect(database='benchbox', url='http://localhost:3473') as conn:
        cursor = conn.cursor()
        cursor.execute("SELECT * FROM table")

    # Firebolt Cloud
    with connect(
        auth=ClientCredentials(client_id, client_secret),
        engine_name='my_engine',
        database='my_database',
        account_name='my_account',
    ) as conn:
        cursor = conn.cursor()
        cursor.execute("SELECT * FROM table")
    ```

    **SQLAlchemy Dialect: firebolt-sqlalchemy**
    ```bash
    pip install firebolt-sqlalchemy
    ```

    Connection strings:
    - Cloud: `firebolt://{client_id}:{client_secret}@{database}/{engine}?account_name={account}`
    - Core: `firebolt://{database}?url=http://localhost:3473`

    **Thread Safety:** Level 2 (share Connection, each thread needs own Cursor)
    **Standards:** PEP 249 (DBAPI 2.0) compliant

  "SQL Dialect Characteristics": |
    **PostgreSQL Compatibility:** Firebolt uses PostgreSQL-compliant SQL dialect.

    **Data Types:**
    | SQL Type | Firebolt Type | Notes |
    |----------|---------------|-------|
    | INTEGER | INT | 4 bytes, -2^31 to 2^31-1 |
    | BIGINT | BIGINT | 8 bytes |
    | DECIMAL | NUMERIC | 28-29 significant digits (exact) |
    | FLOAT | REAL/DOUBLE | 4/8 bytes |
    | VARCHAR | TEXT | UTF-8, no length limit |
    | DATE | DATE | Days since epoch |
    | TIMESTAMP | TIMESTAMPNTZ | Microsecond precision |
    | ARRAY | ARRAY | Nested arrays supported |

    **Key Differences from Standard PostgreSQL:**
    - No VARCHAR/CHAR types - use TEXT
    - No fixed-point DECIMAL - use NUMERIC
    - Array processing with lambda functions
    - JSON via JSON_EXTRACT functions

    **String Handling:**
    - Case sensitivity: ASCII A-Z only as letters
    - Collation: ucs_basic (Unicode code point sorting)
    - Escape strings: E'text\U0001F680'

impact:
  business_value: |
    - Enables cost-free local benchmarking with Firebolt Core
    - Provides cloud warehouse alternative to Snowflake/BigQuery comparisons
    - Attracts Firebolt users to BenchBox ecosystem
    - Demonstrates BenchBox's ability to support modern cloud-native databases
  user_impact: |
    - Users can evaluate Firebolt performance without cloud account or costs
    - Docker-based setup provides reproducible benchmark environment
    - Same adapter works for transitioning from local testing to cloud deployment
    - PostgreSQL familiarity reduces learning curve
  technical_debt: |
    - Establishes pattern for databases with both local and cloud deployment modes
    - Validates unified adapter design approach for future platforms

