id: dataframe-platform-availability-detection-and-error-handling
title: DataFrame Platform Availability Detection and Error Handling
worktree: dataframe-phase0-detection
category: Core Functionality
priority: Critical
status: Completed
description: 'Implement runtime platform availability detection with graceful error handling

  when platforms are not installed. Must provide helpful error messages with

  installation instructions.

  '
context_sections:
- name: Current Problem
  summary: 'User runs `benchbox run --platform polars --mode dataframe` but polars

    isn''t installed. Current behavior would be cryptic import error. Need

    graceful degradation with helpful guidance.

    '
- name: Solution
  summary: 'Create PlatformDependencyChecker that validates availability before

    execution, provides clear error messages, and suggests installation

    commands.

    '
impact: 'CRITICAL - Without this, UX is terrible. Users get cryptic errors and don''t

  know how to fix them. Essential for smooth adoption.

  '
tasks:
- phase: 'Phase 0.4: Dependency Checker Implementation'
  items:
  - summary: Create benchbox/utils/platform_checker.py
    done: false
    details: "class PlatformDependencyChecker:\n    @staticmethod\n    def check_platform_available(platform: str) -> tuple[bool,\
      \ list[str]]:\n        \\\"\\\"\\\"Check if platform and dependencies available.\n\n        Returns:\n            (available,\
      \ missing_dependencies)\n        \\\"\\\"\\\"\n\n    @staticmethod\n    def check_cuda_available() -> bool:\n      \
      \  \\\"\\\"\\\"Check if CUDA runtime available for cuDF.\\\"\\\"\\\"\n\n    @staticmethod\n    def get_platform_version(platform:\
      \ str) -> str | None:\n        \\\"\\\"\\\"Get installed version of platform.\\\"\\\"\\\"\n\n    @staticmethod\n   \
      \ def suggest_installation(platform: str) -> str:\n        \\\"\\\"\\\"Return pip install command for platform.\\\"\\\
      \"\\\"\n"
  - summary: Implement check logic for each platform
    done: false
    details: 'Platforms to check:

      - pandas: import pandas

      - polars: import polars

      - pyspark: import pyspark, py4j

      - modin: import modin

      - dask: import dask.dataframe

      - cudf: import cudf, rmm + check CUDA

      - datafusion: import datafusion

      - vaex: import vaex (future)

      '
  - summary: Implement helpful error messages
    done: false
    details: "Example error:\n\"Platform 'polars' is not available.\n\nMissing dependencies:\n  - polars\n\nTo install:\n\
      \  pip install benchbox[dataframe-polars]\n\nOr for development:\n  pip install polars>=0.19.0\n\nSee docs: https://benchbox.dev/dataframe/installation\"\
      \n"
  - summary: Add version compatibility warnings
    done: false
    details: 'Warn if installed version outside tested range:

      "Warning: polars 0.22.0 is installed but only 0.19.0-0.20.0 are tested.

      Results may vary. See version matrix: [link]"

      '
- phase: 'Phase 0.5: CLI Integration'
  items:
  - summary: Add pre-flight checks to CLI orchestrator
    done: false
    details: Check platform availability before loading data or running queries
  - summary: Add --list-available-platforms flag
    done: false
    details: Show which DataFrame platforms are installed and usable
  - summary: Add platform availability to dry-run output
    done: false
- phase: 'Phase 0.6: Testing'
  items:
  - summary: Test error handling when platform not installed
    done: false
  - summary: Test CUDA detection for cuDF (with/without GPU)
    done: false
  - summary: Test version compatibility warnings
    done: false
