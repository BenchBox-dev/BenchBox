id: query-plan-parser-framework
title: Query Plan Parser Framework
worktree: query-plan-parsers
category: Core Functionality
priority: High
status: Completed
completed_date: '2025-11-23'
completion_notes: 'Base parser framework and DuckDB parser fully implemented and tested.

  SQLite parser implemented. Remaining parsers (PostgreSQL, BigQuery, Snowflake,

  DataFusion, ClickHouse, Redshift, Databricks) deferred for incremental implementation.

  '
description: "Implement platform-specific EXPLAIN output parsers that convert native query \nplans into harmonized QueryPlanDAG\
  \ structure. Includes base parser interface\nand 9 platform-specific implementations.\n\n**Parsing Strategy**:\n- Each platform\
  \ provides EXPLAIN in different format (text trees, JSON, XML)\n- Parse native format → intermediate representation → QueryPlanDAG\n\
  - Graceful degradation on parse failures (warn, continue without plan)\n"
context_sections:
- name: Parser Complexity Matrix
  summary: 'Easy (JSON): PostgreSQL, BigQuery, Snowflake (120-150 LOC each)

    Medium (Text): DuckDB, SQLite, DataFusion, ClickHouse, Redshift (150-220 LOC)

    Hard (Complex): Databricks/Spark (200-250 LOC)

    Total: ~1,500 LOC for all parsers

    '
- name: Operator Harmonization
  summary: 'Physical operators mapped to logical vocabulary. Examples:

    - HashJoin, MergeJoin, NestedLoopJoin → Join(type=inner/left/right)

    - SeqScan, IndexScan, TableScan → Scan(table_name=...)

    - HashAggregate, StreamAggregate → Aggregate(agg_functions=[...])

    '
impact: 'HIGH - Enables query plan capture for all platforms. Each parser is independent

  and can be implemented/tested in parallel once base interface defined.

  '
research_value: 'Documents platform-specific EXPLAIN formats and operator semantics. Establishes

  harmonization rules for cross-platform query optimization analysis.

  '
dependencies:
- workstream: Query Plan Core Infrastructure (Models & Storage)
  reason: Requires QueryPlanDAG, LogicalOperator, PhysicalOperator models
tasks:
