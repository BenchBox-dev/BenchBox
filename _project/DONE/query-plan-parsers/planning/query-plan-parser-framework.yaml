    done: false
  - summary: Implement QueryPlanParser ABC in base_parser.py
    done: false
    details: "class QueryPlanParser(ABC):\n    @abstractmethod\n    def parse_explain_output(self, explain_text: str) -> QueryPlanDAG:\n\
      \        \"\"\"Parse platform EXPLAIN into QueryPlanDAG\"\"\"\n    \n    @abstractmethod\n    def get_explain_query(self,\
      \ original_query: str) -> str:\n        \"\"\"Generate EXPLAIN query for platform\"\"\"\n        # e.g., \"EXPLAIN (FORMAT\
      \ JSON) {query}\"\n    \n    def parse_with_fallback(self, explain_text: str, query_id: str) -> QueryPlanDAG | None:\n\
      \        \"\"\"Parse with error handling, return None on failure\"\"\"\n"
  - summary: Add OperatorMapper helper class
