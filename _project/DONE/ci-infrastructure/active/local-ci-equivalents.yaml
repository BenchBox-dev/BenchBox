          done: true
        - summary: "Add `make ci-test` - exact CI test command"
          done: true
        - summary: "Add `make ci-docs` - exact CI docs build"
          done: true
        - summary: "Add `make security-audit` - safety check"
          done: true
        - summary: "Add `make validate-examples` - example validation scripts"
          done: true
        - summary: "Add `make docs-linkcheck` - sphinx linkcheck"
          done: true
        - summary: "Add `make spellcheck` - codespell check"
