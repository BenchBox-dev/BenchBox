implementation_summary: |
  Added 9 new Makefile targets that mirror GitHub Actions workflows:

  - `ci-lint`: Runs ruff check, ruff format --check, and ty check
  - `ci-test`: Runs fast tests with 75% coverage threshold
  - `ci-docs`: Builds Sphinx documentation
  - `security-audit`: Runs pip-audit security scan
  - `spellcheck`: Runs codespell spelling check
  - `docstring-coverage`: Runs interrogate docstring coverage
  - `test-package`: Builds package and tests installation
  - `test-integration-smoke`: Runs quick integration tests
  - `ci-local`: Orchestrates all CI checks in sequence

  Updated CONTRIBUTING.md with pre-push validation workflow documentation.

  Commits:
  - 07fcc144: feat(ci): add local CI equivalents for all GitHub workflow steps
