id: parallel-test-run-lock
title: "Prevent concurrent parallel test runs via fcntl.flock mutex"
worktree: ci-infrastructure
priority: Medium
status: Completed
completed_date: "2026-02-23"
category: CI Infrastructure
description: |
  pytest.ini defaults to `-n auto`, which spawns one worker per logical CPU (10 on
  this machine). When two agent sessions each trigger `make test-fast`, the result is
  20+ concurrent pytest workers competing for CPU, bringing the machine to a halt.

  Add an exclusive `fcntl.flock` lock in `tests/conftest.py` so that only one
  parallel test run can be active at a time. A second concurrent attempt fails
  immediately with a clear, actionable error message identifying the lock holder.

  Chosen approach: `fcntl.flock(LOCK_EX | LOCK_NB)` on `~/.benchbox/test.lock`.
  The OS auto-releases the lock when the holder process dies (no stale lock cleanup
  needed). No new dependencies — `fcntl` is stdlib on macOS/Linux.

context_sections:
  "Background": |
    Discovered when 35 CLI tests transiently failed due to global state pollution
    (set_quiet leaking across xdist workers) during a full parallel test run.
    Investigation revealed the root cause is resource contention from concurrent
    heavyweight parallel test invocations across agent sessions.

    pytest.ini addopts = -n auto means EVERY pytest invocation defaults to
    using all available CPUs. There is no existing guard against this.

  "Design Decisions": |
    - Lock file: ~/.benchbox/test.lock (user-local; ~/.benchbox/ already exists)
    - fcntl.flock chosen over os.open(O_CREAT|O_EXCL) because flock auto-releases
      on process death — no PID tracking, no age-based stale detection needed
    - Lock is NOT acquired when: in an xdist worker subprocess (hasattr config
      'workerinput'), numprocesses == 0 (single-threaded), or env var
      BENCHBOX_SKIP_TEST_LOCK=1 is set
    - Hook: pytest_configure (not pytest_sessionstart — numprocesses is on the
      config.option namespace after CLI option parsing, before configure hooks)
    - CI is unaffected: CI containers get fresh environments with no contention

  "Reference Implementation": |
    Existing pattern to reference (but not copy — uses PID-file approach which
    we intentionally avoid):
      benchbox/core/primitives/generator_base.py (datagen locking via O_CREAT|O_EXCL)

verification:
- description: "Second concurrent parallel run is blocked with exit code 1 and BLOCKED message"
  command: "make test-fast & sleep 5 && make test-fast 2>&1; echo \"exit:$?\""
  expected_output: "output contains 'BLOCKED' and 'exit:1'"
- description: "Single-threaded run is never blocked (no lock acquired)"
  command: "pytest -n 0 tests/unit/cli/test_cli_main.py -v 2>&1 | tail -3"
  expected_output: "tests pass with no BLOCKED message"
- description: "Env-var bypass allows concurrent parallel runs"
  command: "BENCHBOX_SKIP_TEST_LOCK=1 pytest tests/unit/cli/test_cli_main.py 2>&1 | tail -1"
  expected_output: "tests pass (no BLOCKED error)"
- description: "After a crashed run (kill -9), the next parallel run succeeds without manual cleanup"
  command: "make test-fast & sleep 3 && kill -9 $! ; sleep 1 && make test-fast 2>&1 | tail -3"
  expected_output: "tests pass (OS auto-released flock on kill)"

must_preserve:
- "xdist workers: hasattr(config, 'workerinput') check must prevent workers from competing for the lock — only the controller
  process acquires it"
- "CI pipelines: lock is user-local (~/.benchbox/test.lock); CI containers with fresh filesystems must never see a pre-existing
  lock"
- "Single-threaded runs: numprocesses == 0 or None must bypass the lock entirely"
- "Crash recovery: after kill -9 on a running test session, the next invocation must succeed without any manual cleanup (OS
  auto-releases flock on exit)"
- "All 13,000+ fast-marked tests continue to pass after the hooks are added — confirm with `make test-fast` reporting 13052
  passed"

anti_patterns:
- "DO NOT use portalocker or filelock packages — they add dependencies; fcntl is stdlib and sufficient for macOS/Linux"
- "DO NOT use pytest_sessionstart hook — use pytest_configure instead. Reason: numprocesses is readable from config.option
  at configure time (post CLI parse, pre session); sessionstart is too late and the lock would not block workers from being
  spawned"
- "DO NOT store lock metadata in _test_lock_fd write until after flock succeeds — ftruncate/write must happen only after exclusive
  lock is confirmed"
- "DO NOT add lock logic to production benchbox source — scope is tests/ and Makefile only"

scope_limit:
  only_modify:
  - tests/conftest.py
  - Makefile

approach: |
  1. In tests/conftest.py, add after existing imports:
     - _TEST_LOCK_PATH = Path.home() / ".benchbox" / "test.lock"
     - _test_lock_fd: int | None = None  (module-level, keeps fd alive)
     - _should_acquire_test_lock(config) helper function
     - pytest_configure hook: acquires fcntl.flock(LOCK_EX | LOCK_NB), writes
       PID+timestamp+cmd to lock file, stores fd in _test_lock_fd
     - pytest_unconfigure hook: releases lock via flock(LOCK_UN) and closes fd

  2. Error message format when blocked:
     "[benchbox] BLOCKED: A parallel test run is already active.
       Lock file : ~/.benchbox/test.lock
       Holder    : pid:XXXX started:YYYY-MM-DD HH:MM:SS cmd:...
       Options:
         • Wait for the other run to finish and retry.
         • Run single-threaded (no lock):  pytest -n 0 ...
         • Bypass lock (dangerous):         BENCHBOX_SKIP_TEST_LOCK=1 pytest ..."

  3. In Makefile, add test-unlock convenience target after test-fast:
     test-unlock:
         @echo "Removing stale BenchBox test lock..."
         @rm -f ~/.benchbox/test.lock
         @echo "Lock cleared."

metadata:
  tags:
  - test-infrastructure
  - developer-experience
  - concurrency
  - xdist
  estimated_effort: "Small — ~70 lines in conftest.py + 4 lines in Makefile"
  created_date: "2026-02-23"
  source_plan: "proud-snuggling-flamingo.md"

work:
- id: w1
  summary: "Add _TEST_LOCK_PATH constant, _test_lock_fd module var, and _should_acquire_test_lock() helper to tests/conftest.py"
  status: done
  notes: |
    Helper returns False for: xdist workers (hasattr(config, 'workerinput')),
    BENCHBOX_SKIP_TEST_LOCK env var set, numprocesses is 0/None/AttributeError.
    Returns True for numprocesses == 'auto' or any positive integer.

- id: w2
  summary: "Add pytest_configure hook: acquire fcntl.flock, write diagnostic info to lock file, store fd"
  needs: [w1]
  status: done
  notes: |
    fcntl.flock(fd, fcntl.LOCK_EX | fcntl.LOCK_NB)
    On BlockingIOError: read lock file for holder info, print BLOCKED message to
    stderr, os.close(fd), sys.exit(1).
    On success: os.ftruncate + os.write with "pid:X started:Y cmd:Z\n", store fd.

- id: w3
  summary: "Add pytest_unconfigure hook: release flock, close fd, reset module var"
  needs: [w2]
  status: done
  notes: |
    fcntl.flock(_test_lock_fd, fcntl.LOCK_UN) then os.close().
    Wrap in try/except OSError for resilience during abnormal teardown.

- id: w4
  summary: "Add test-unlock Makefile target (rm -f ~/.benchbox/test.lock)"
  status: done

- id: w5
  summary: "Run verification: two concurrent make test-fast invocations confirm second is blocked with exit 1"
  needs: [w3, w4]
  status: done
  notes: |
    Also verify: single-threaded bypass (pytest -n 0), env-var bypass, and
    auto-recovery after kill -9 on the first run.
