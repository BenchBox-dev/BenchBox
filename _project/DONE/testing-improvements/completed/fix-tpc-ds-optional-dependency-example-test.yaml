description: 'Single example test fails when TPC-DS source files are not installed in benchbox/_sources/tpc-ds/tools. The
  test should gracefully skip when optional TPC-DS binaries are unavailable, matching the pattern used for other optional
  dependencies.

  '
context_sections:
