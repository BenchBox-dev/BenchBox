id: open-table-format-smoke-tests
title: Open Table Format Smoke Tests
worktree: testing-improvements
category: Testing and Quality Assurance
priority: Medium
status: Completed
description: |
  Add smoke tests to verify end-to-end functionality for all supported open table formats
  (Parquet, Delta Lake, Apache Iceberg). While comprehensive unit tests exist for the
  format converters, there are no integration tests that verify the full pipeline works:
  data generation → format conversion → platform loading → query execution.

  Current test coverage:
  - Unit tests: tests/unit/utils/format_converters/ (Parquet, Delta, Iceberg converters)
  - Missing: Integration tests verifying CLI --convert-format option
  - Missing: Smoke tests verifying platforms can read converted data
  - Missing: CI verification that optional dependencies (deltalake, pyiceberg) work

impact:
  business_value: |
    Open table formats (Delta Lake, Iceberg) are critical for enterprise data lake
    architectures. Ensuring these formats work correctly builds trust with users
    deploying BenchBox against production-like environments.
  user_impact: |
    Users can confidently use --convert-format options knowing they've been tested
    end-to-end, not just at the converter level.
  technical_debt: |
    Closes the testing gap identified in the "Open File and Table Format Support"
    feature completion (2 remaining tasks: examples and documentation).

tasks:
- phase: "Phase 1: Parquet Format Smoke Tests"
  done: true
  notes: "Parquet has no optional dependencies - should always run"
  items:
  - summary: "Add DuckDB + Parquet integration test (TPC-H SF=0.01, single table)"
    done: true
  - summary: "Verify Parquet compression options (snappy, gzip, zstd) produce valid files"
    done: true
  - summary: "Verify partitioned Parquet output can be read as Hive dataset"
    done: true

- phase: "Phase 2: Delta Lake Format Smoke Tests"
  done: true
  notes: "Requires deltalake optional dependency"
  items:
  - summary: "Add DuckDB + Delta Lake integration test using delta_scan() extension"
    done: true
  - summary: "Verify Delta transaction log is created correctly"
    done: true
  - summary: "Add skip marker for missing deltalake dependency with clear message"
    done: true

- phase: "Phase 3: Apache Iceberg Format Smoke Tests"
  done: true
  notes: "Requires pyiceberg optional dependency"
  items:
  - summary: "Add Iceberg format conversion smoke test (verify metadata structure)"
    done: true
  - summary: "Add skip marker for missing pyiceberg dependency with clear message"
    done: true

- phase: "Phase 4: CLI Integration Tests"
  done: true
  notes: "CLI tests verify help, error handling, and option documentation. Full CLI conversion blocked by get_schema() API
    mismatch (tracked separately)."
  items:
  - summary: "Test CLI help shows all format options"
    done: true
  - summary: "Test CLI error handling for missing input/format/manifest"
    done: true
  - summary: "Test CLI shows all compression options in help"
    done: true

files_affected:
  added:
  - "tests/integration/test_open_table_formats.py"
  modified: []

success_metrics:
- "All three formats (Parquet, Delta, Iceberg) have at least one smoke test"
- "Tests skip gracefully when optional dependencies are missing"
- "CI runs Parquet tests on every PR (no optional deps required)"
- "DuckDB can query data converted to Parquet format"

