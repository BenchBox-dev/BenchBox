open_questions:
- "Should we add pyiceberg/deltalake to CI test matrix as optional dependency group?"
- "Do we need platform-specific tests (Databricks+Delta, Snowflake+Iceberg) or is DuckDB sufficient for smoke tests?"

implementation_notes: |
  16 integration tests added in tests/integration/test_open_table_formats.py:

  Phase 1 (Parquet) - 5 tests:
  - test_parquet_conversion_and_duckdb_query: End-to-end TBL→Parquet→DuckDB
  - test_parquet_snappy_compression: Snappy compression verification
  - test_parquet_gzip_compression: Gzip compression verification
  - test_parquet_zstd_compression: Zstd compression verification
  - test_parquet_hive_partitioned_duckdb_query: Hive-style partitioning

  Phase 2 (Delta Lake) - 3 tests:
  - test_delta_conversion_and_structure: Directory/log structure
  - test_delta_duckdb_query_via_delta_scan: DuckDB delta extension
  - test_delta_transaction_log_metadata: Transaction log JSON validation

  Phase 3 (Iceberg) - 2 tests:
  - test_iceberg_conversion_and_structure: Metadata directory
  - test_iceberg_metadata_structure: Metadata JSON fields

  Phase 4 (CLI) - 6 tests:
  - test_cli_convert_help: Help text verification
  - test_cli_convert_missing_input_error: Error handling
  - test_cli_convert_missing_format_error: Error handling
  - test_cli_convert_invalid_format_error: Error handling
  - test_cli_convert_missing_manifest_error: Error handling
  - test_cli_convert_compression_options_accepted: Options documented

  Note: Full CLI conversion tests blocked by benchmark.get_schema() API
  inconsistency - TPC-H's get_schema() takes no args but CLI passes table_name.
  This is tracked as a separate bug to fix.
