# BenchBox MCP Server Implementation
# Enables AI agents (Claude Code, other MCP clients) to interact with BenchBox programmatically

id: benchbox-mcp-server-implementation
title: BenchBox MCP Server for AI Agent Integration
worktree: mcp-server-integration
category: Supporting Infrastructure
priority: High
status: Completed

description: |
  Implement a Model Context Protocol (MCP) server that enables AI agents like Claude Code
  to run benchmarks, analyze results, and interact with BenchBox programmatically.

  MCP (Model Context Protocol) is Anthropic's open standard for connecting AI systems to
  external tools and data sources. By implementing an MCP server, BenchBox becomes
  accessible to any MCP-compatible AI agent, enabling natural language benchmark
  orchestration.

  The MCP server will expose BenchBox functionality through three primitives:
  - **Tools**: Executable actions (run benchmarks, export results)
  - **Resources**: Read-only data (benchmark metadata, historical results, system info)
  - **Prompts**: Reusable templates (analysis patterns, comparison queries)

  This enables use cases like:
  - "Run TPC-H at scale factor 1 on DuckDB and show me the results"
  - "Compare my last 3 benchmark runs and identify regressions"
  - "Which platforms support the TPC-DS benchmark?"
  - "Analyze query 5 performance across all my runs"

context_sections:
  "Background and Motivation": |
    AI agents are increasingly used for data engineering tasks. BenchBox users who work
    with Claude Code or similar tools want to integrate benchmarking into their AI-assisted
    workflows. Currently, users must manually run CLI commands and copy/paste results.

    An MCP server eliminates this friction by providing:
    1. Programmatic access to all BenchBox functionality
    2. Structured data exchange (JSON schemas, typed results)
    3. Stateful session management for long-running benchmarks
    4. Rich context for AI analysis (metadata, historical data)

  "Technical Context": |
    MCP Architecture:
    - Transport: stdio (local) - communicates via stdin/stdout using JSON-RPC 2.0
    - Python SDK: `mcp` package with FastMCP high-level API
    - Integration: Configuration in claude_desktop_config.json or via `claude mcp add`

    BenchBox Integration Points:
    - `benchbox.core.runner.runner.run_benchmark_lifecycle()` - Core execution API
    - `benchbox.core.schemas` - Pydantic models for configuration
    - `benchbox.core.results.models` - Result data structures
    - `benchbox.platforms` - Platform adapter factory
    - `benchbox.cli.benchmarks.BenchmarkManager` - Benchmark discovery

    Critical stdio constraint: MCP servers MUST NOT write to stdout (corrupts JSON-RPC).
    All logging must go to stderr or files.

  "MCP Protocol Details": |
    The MCP server must implement:

    1. Tool Handlers:
       - list_tools() -> List available tools with JSON schemas
       - call_tool(name, arguments) -> Execute tool and return result

    2. Resource Handlers:
       - list_resources() -> List available resources
       - read_resource(uri) -> Return resource content

    3. Prompt Handlers:
       - list_prompts() -> List available prompt templates
       - get_prompt(name, arguments) -> Return expanded prompt

    FastMCP provides decorators that auto-generate JSON schemas from Python type hints.

technical_requirements:
  constraints:
  - "Python 3.10+ required (MCP SDK requirement)"
  - "Must not write to stdout (stdio transport constraint)"
  - "Must handle long-running benchmarks (up to 30+ minutes)"
  - "Must provide meaningful progress updates for lengthy operations"
  - "Results must be serializable to JSON"
  - "Cloud platform credentials must be handled securely"
  dependencies:
  - "mcp>=1.2.0 - Model Context Protocol Python SDK"
  - "pydantic>=2.0 - Already in BenchBox, used for schema generation"
  - "httpx - For async HTTP (testing, MCP dev dashboard)"
  compatibility: |
    - Claude Code (primary target)
    - Any MCP-compatible client (OpenAI Agents, custom integrations)
    - Local stdio transport (network transport as future enhancement)

impact:
  business_value: |
    Positions BenchBox as AI-native tooling. As AI agents become standard in data
    engineering workflows, MCP integration ensures BenchBox remains relevant and
    accessible. Differentiator vs. other benchmark tools.
  user_impact: |
    Users can orchestrate benchmarks using natural language through their AI assistant.
    Dramatically reduces friction for exploratory benchmarking, regression testing,
    and performance analysis workflows.
  technical_debt: |
    Requires clean separation between CLI and core APIs. Current implementation already
    has good separation via `run_benchmark_lifecycle()`. May expose areas where CLI
    logic should be extracted to core.

