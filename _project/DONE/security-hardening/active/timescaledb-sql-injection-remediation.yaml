id: timescaledb-sql-injection-remediation
title: Fix SQL injection vulnerabilities in TimescaleDB adapter
worktree: security-hardening
priority: Critical
status: Completed
completed_date: '2025-12-24'
description: "The TimescaleDB adapter (benchbox/platforms/timescaledb.py) uses f-string interpolation\nto construct SQL queries\
  \ with user-controlled values, creating SQL injection vulnerabilities.\n\nIdentified in code review on 2025-12-24 (commit\
  \ e58ed40e).\n\nAffected locations:\n- Lines 300-310: create_hypertable() with chunk_interval parameter\n- Lines 362-380:\
  \ add_compression_policy() with compression_after parameter\n- Line 410: ANALYZE with qualified_table\n\nExample vulnerable\
  \ code:\n```python\ncursor.execute(f\"\"\"\n    SELECT create_hypertable(\n        '{qualified_table}',  # table_name from\
  \ config\n        'time',\n        chunk_time_interval => INTERVAL '{self.chunk_interval}',  # user-controlled!\n      \
  \  ...\n    )\n\"\"\")\n```\n\nIf chunk_interval contains `'; DROP TABLE users; --`, it could execute arbitrary SQL.\n"
category: Security and Compliance
