        done: true
    - summary: Refactor _add_compression_policy() to use psycopg2.sql module
      done: true
      subtasks:
      - summary: Use sql.Identifier for qualified_table in ALTER TABLE
        done: true
      - summary: Use sql.Literal for compression_after interval
        done: true
    - summary: Refactor load_data() ANALYZE statement to use sql.Identifier
      done: true
  - phase: 'Phase 2: Input Validation'
    done: true
    items:
    - summary: Add validation for chunk_interval parameter
      done: true
      subtasks:
      - summary: Define allowed PostgreSQL interval patterns (regex or parser)
        done: true
      - summary: Validate in __init__ and from_config
        done: true
      - summary: Raise clear error for invalid formats
        done: true
    - summary: Add validation for compression_after parameter
      done: true
      subtasks:
      - summary: Apply same interval validation
        done: true
  - phase: 'Phase 3: Testing and Lint Fixes'
    done: true
    items:
    - summary: Add security-focused unit tests
      done: true
      subtasks:
      - summary: Test that SQL injection payloads are safely escaped
        done: true
      - summary: Test invalid interval format rejection
        done: true
    - summary: Fix existing lint issues in test_timescaledb_adapter.py
      done: true
      subtasks:
