technical_requirements:
  constraints:
    - "Tests must run without external credentials by default"
    - "Cloud platform tests require skip markers when credentials unavailable"
    - "DataFrame tests must handle optional dependencies gracefully"
    - "Test execution time must be reasonable for CI"
  dependencies:
    - "pytest >= 8.0"
    - "pytest-timeout for long-running test protection"
  compatibility: |
    Tests must work on Linux, macOS, and Windows CI environments.
    Python 3.11+ required.

