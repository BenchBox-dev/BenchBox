title: "Refactor platform-specific packages from core to optional dependencies"
worktree: "infrastructure-publishing"
priority: "High"
status: "Completed"
category: "Core Functionality"

description: |
  Platform-specific packages have accumulated in pyproject.toml core dependencies
  that should be optional extras. This causes install bloat, dependency conflicts,
  and cross-platform issues (e.g., PySpark requires Java).

  Current core dependencies that should be optional:
  - polars>=1.35.2 (DataFrame platform)
  - datafusion>=50.1.0 (SQL/DataFrame platform)
  - presto-python-client>=0.8.4 (SQL platform)
  - clickhouse-driver>=0.2.9 (SQL platform)
  - pyspark>=4.0.1 (DataFrame platform - requires Java!)
  - dask[distributed]>=2024.8.0 (DataFrame platform)

  Core dependencies should only include CLI essentials:
  - click, rich (CLI framework)
  - pyyaml (config parsing)
  - packaging (version handling)
  - jsonschema (validation)

  DuckDB should remain as the default reference platform for ease of use.

context_sections:
  "Background and Motivation": |
    These dependencies were gradually added between 2025-10-20 and 2026-01-03
    as each platform feature was developed. Each addition put its dependency
    in core instead of optional, leading to dependency creep.

    Git blame shows the progression:
    - duckdb: 2025-10-20 (37a822ab2)
    - polars: 2025-11-28 (f04facc43)
    - datafusion: 2025-12-07 (e76b4897f)
    - presto-python-client: 2025-12-12 (b84c4e21a)
    - clickhouse-driver: 2025-12-13 (f842b57d7)
    - pyspark: 2025-12-14 (531fc1a7f)
    - dask: 2026-01-03 (0e521d3d5)

  "Technical Context": |
    The CLI currently assumes platforms are always available. Moving to optional
    dependencies requires:
    1. Updating import guards throughout the codebase
    2. Adding helpful "install with: uv sync --extra X" messages
    3. Ensuring benchbox CLI starts even with no platforms installed
    4. Updating documentation and getting-started guides

impact:
  business_value: |
    - Faster installs for users who only need specific platforms
    - Fewer dependency conflicts in user environments
    - Professional package structure matching industry standards
  user_impact: |
    - `pip install benchbox` goes from ~500MB to ~10MB
    - Users can install only the platforms they need
    - No more Java requirement for basic usage (PySpark is optional)
  technical_debt: |
    - Cleans up accidental dependency creep
    - Establishes clear pattern for future platform additions

