title: Query Plan Platform Adapter Integration
worktree: query-plan-adapters
category: Core Functionality
priority: High
status: Completed
completed_date: "2025-11-23"
completion_notes: |
  Base adapter integration completed for DuckDB and SQLite platforms.
  - Base adapter extended with capture_plans config and capture_query_plan() method
  - DuckDB adapter integrated with DuckDBQueryPlanParser
  - execute_query() modified to capture plans when enabled
  - 6 integration tests passing
  - Zero overhead when disabled
  - Graceful error handling

  Additional platforms (PostgreSQL, BigQuery, Snowflake, DataFusion, ClickHouse,
  Redshift, Databricks) can be added incrementally by implementing
  get_query_plan_parser() method in each adapter.
description: 'Extend PlatformAdapter base class and all 8+ platform adapters to support

  query plan capture. Add capture_query_plan() method that executes EXPLAIN,

  parses output, and returns QueryPlanDAG. Integrate with execute_query() flow.


  **Integration Strategy**:

  - Modify base adapter to add capture_query_plan() abstract method

  - Each platform implements method using its parser

  - execute_query() optionally captures plan based on --capture-plans flag

  - Graceful handling when parser unavailable or fails

  '
context_sections:
- name: Adapter Extension Pattern
  summary: 'Each adapter overrides get_query_plan_parser() to return platform parser.

    Base adapter provides capture_query_plan() that uses parser to convert

    EXPLAIN output to QueryPlanDAG. Minimal code per platform (~20-30 LOC).

    '
- name: CLI Integration
  summary: 'Add capture_plans parameter to adapter __init__. CLI passes flag from

    --capture-plans argument. execute_query() checks flag and captures plan

    if enabled, storing in result dict.

    '
impact: 'HIGH - Makes query plan capture available for all platforms. Relatively simple

  once parsers are complete (mostly glue code). Enables end-to-end functionality.

  '
