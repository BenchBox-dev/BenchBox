context_sections:
  "Root Cause Analysis": |
    The UnifiedExpr class wraps native expressions (PySpark Column or Polars Expr)
    but is missing several method implementations needed by TPC-H queries:

    | Missing Method | PySpark Equivalent | Affected Queries |
    |----------------|-------------------|------------------|
    | is_in(values) | col.isin(values) | Q12, Q16, Q19, Q22 |
    | str.starts_with(prefix) | col.startswith(prefix) | Q14, Q16, Q20 |
    | str.ends_with(suffix) | col.endswith(suffix) | Q16 (Q2) |
    | str.contains(pattern) | col.rlike(pattern) | Q9, Q13, Q16 |
    | str.slice(start, length) | col.substr(start+1, length) | Q22 |
    | dt.year() | F.year(col) | Q7, Q8, Q9 |
    | filter(condition) | F.when(cond, col) | Q8, Q12, Q14 |
    | n_unique() | F.countDistinct(col) | Q16, Q21 |

    Additionally, Q11 fails because ctx.scalar() doesn't unwrap UnifiedLazyFrame
    before passing to the adapter.

  "Implementation Summary": |
    Added 237 lines of code to unified_frame.py:
    - UnifiedStrExpr class with starts_with, ends_with, contains, slice methods
    - UnifiedDtExpr class with year, month, day methods
    - is_in(), n_unique(), filter() methods on UnifiedExpr
    - .str and .dt property accessors on UnifiedExpr

    Fixed expression_family.py:
    - ctx.scalar() now unwraps UnifiedLazyFrame before passing to adapter

    Also fixed group_by() to unwrap UnifiedExpr columns for Q9 and Q15.

