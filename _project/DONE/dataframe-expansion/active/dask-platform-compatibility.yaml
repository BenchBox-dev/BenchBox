context_sections:
  "Architectural Pattern": |
    The Expression family already uses this pattern successfully:
    - ExpressionFamilyContext.get_table() returns UnifiedLazyFrame wrapper
    - UnifiedGroupBy intercepts agg() calls and routes to platform-specific handling
    - Queries are platform-agnostic, wrappers handle differences transparently

    Applied identical pattern to Pandas family:
    - PandasFamilyContext.get_table() returns UnifiedPandasFrame wrapper
    - UnifiedPandasGroupBy intercepts agg() and routes to adapter.groupby_agg()
    - Each adapter (Pandas, Dask, Modin, cuDF) implements groupby_agg() appropriately

  "Dask API Differences": |
    Key incompatibilities addressed:
    1. as_index=False: Dask groupby() doesn't support it, used reset_index() instead
    2. nunique: Not supported in Dask agg(), computed separately and merged
    3. .dt.year on DatetimeIndex: Fixed by using pyarrow dtype_backend for parquet loading
    4. Lazy scalars: Added .compute() checks in queries returning scalar results

  "Query Changes Made": |
    Despite initial goal of "zero query changes", minimal adaptations were needed:
    - Removed unnecessary pd.to_datetime() calls in Q7, Q8, Q9 (fixes Dask, improves Pandas)
    - Added hasattr(val, 'compute') checks for scalar results in Q6, Q11, Q14, Q17, Q19
    - Changed .query("value > @threshold") to explicit comparison in Q11

success_metrics:
- "All 22 TPC-H queries pass on Dask ✓"
