context_sections:
  "Background and Motivation": |
    The UnifiedLazyFrame and UnifiedExpr classes were created to provide a
    platform-agnostic DataFrame API for TPC-H queries. However, TPC-DS queries
    were implemented using Polars-specific code (pl.concat, pl.when) and call
    methods that exist in Polars but weren't added to UnifiedExpr.

    This TODO addresses the gap to enable TPC-DS on PySpark.

  "Technical Context": |
    The implementation requires:
    1. Adding 7 methods to UnifiedExpr with PySpark/Polars branching
    2. Creating UnifiedWhen/UnifiedWhenThen classes for CASE WHEN expressions
    3. Adding concat() and when() to ExpressionFamilyContext
    4. Refactoring ~90 Polars-specific calls in TPC-DS queries

