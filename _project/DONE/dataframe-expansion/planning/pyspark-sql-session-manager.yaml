id: pyspark-sql-session-manager
title: Extract SparkSessionManager for shared PySpark session management
worktree: dataframe-expansion
priority: High
status: Not Started
category: Platform Expansion

description: |
  Extract SparkSession management from pyspark_df.py into a shared module
  that can be used by both DataFrame and SQL adapters.

  This enables the dual-mode PySpark platform architecture where both SQL
  and DataFrame modes share a single SparkSession (required by JVM constraint
  of one SparkSession per process).

  Key responsibilities of SparkSessionManager:
  - Singleton pattern respecting one SparkSession per JVM
  - Shared configuration: master, memory, executor settings, AQE
  - Java version detection with clear error messages (17/21 required, 23+ rejected)
  - Graceful shutdown handling

context_sections:
  "Design Pattern": |
    ```python
    # benchbox/platforms/pyspark/session.py
    class SparkSessionManager:
        _instance: SparkSession | None = None

        @classmethod
        def get_or_create(cls, config: dict) -> SparkSession:
            if cls._instance is None:
                cls._instance = cls._create_session(config)
            return cls._instance

        @classmethod
        def close(cls) -> None:
            if cls._instance is not None:
                cls._instance.stop()
                cls._instance = None
    ```

  "Configuration Options": |
    - spark.master: local[*] or cluster URL
    - spark.driver.memory: e.g., 4g
    - spark.executor.memory: e.g., 4g
    - spark.sql.adaptive.enabled: true (AQE)
    - spark.sql.adaptive.coalescePartitions.enabled: true

