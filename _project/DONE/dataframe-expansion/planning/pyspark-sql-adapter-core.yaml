id: pyspark-sql-adapter-core
title: Implement PySparkSQLAdapter core functionality
worktree: dataframe-expansion
priority: High
status: Completed
category: Platform Expansion

description: |
  Create PySparkSQLAdapter extending PlatformAdapter base class.
  Implements all required abstract methods for SQL benchmark execution.

  This adapter enables running TPC-H/TPC-DS benchmarks via Spark SQL syntax,
  complementing the existing DataFrame adapter for a dual-mode platform.

  Required abstract method implementations:
  | Method | Implementation |
  |--------|----------------|
  | create_connection() | Return SparkSession from shared manager |
  | create_schema() | Execute translated CREATE TABLE statements |
  | load_data() | Read files -> DataFrame -> saveAsTable() |
  | execute_query() | spark.sql(query).collect() with timing |
  | get_target_dialect() | Return "spark" |
  | configure_for_benchmark() | Set OLAP optimizations |

context_sections:
  "Adapter Skeleton": |
    ```python
    # benchbox/platforms/pyspark/sql_adapter.py
    class PySparkSQLAdapter(PlatformAdapter):
        def __init__(self, config: dict | None = None):
            super().__init__()
            self._config = config or {}
            self._spark: SparkSession | None = None

        def create_connection(self) -> SparkSession:
            from benchbox.platforms.pyspark.session import SparkSessionManager
            self._spark = SparkSessionManager.get_or_create(self._config)
            return self._spark

        def get_target_dialect(self) -> str:
            return "spark"

        def execute_query(self, connection, query, query_id, ...):
            start = time.perf_counter()
            result_df = self._spark.sql(query)
            rows = result_df.collect()  # Force eager evaluation
            elapsed = time.perf_counter() - start
            return QueryResult(...)
    ```

  "Dialect Translation": |
    Use SQLGlot for translation from DuckDB to Spark SQL:
    ```python
    import sqlglot
    spark_sql = sqlglot.transpile(
        duckdb_sql,
        read="duckdb",
        write="spark"
    )[0]
    ```

