id: pyspark-sql-registry-integration
title: Register PySpark SQL mode in platform registry
worktree: dataframe-expansion
priority: High
status: Completed
category: Platform Expansion

description: |
  Update platform registry to expose PySpark SQL capabilities
  and auto-register the SQL adapter.

  This enables the dual-mode platform pattern:
  - `benchbox run --platform pyspark --mode sql` -> SQL adapter
  - `benchbox run --platform pyspark --mode dataframe` -> DataFrame adapter (default)
  - `benchbox run --platform pyspark` -> DataFrame adapter (default)

  Registry changes:
  - Update pyspark capabilities: supports_sql=True
  - Add PySparkSQLAdapter to auto_register_platforms()
  - Ensure mode selection logic works correctly

context_sections:
  "Registry Update": |
    ```python
    # benchbox/core/platform_registry.py
    "pyspark": {
        "display_name": "PySpark",
        "description": "Apache Spark DataFrame/SQL API - Distributed - Java 17/21 required",
        "category": "dataframe",
        "libraries": [{"name": "pyspark", "required": True}],
        "requirements": ["pyspark>=3.5.0"],
        "installation_command": "uv add pyspark",
        "capabilities": {
            "supports_sql": True,         # NEW - enables SQL mode
            "supports_dataframe": True,
            "default_mode": "dataframe"
        },
    }
    ```

  "Auto-Registration": |
    ```python
    # In auto_register_platforms()
    try:
        from benchbox.platforms.pyspark import PySparkSQLAdapter
        PlatformRegistry.register_adapter(
            "pyspark-sql",
            PySparkSQLAdapter,
            mode="sql"
        )
    except ImportError:
        pass
    ```

  "Mode Selection Logic": |
    The CLI run command should resolve platform + mode to the correct adapter:
    ```python
    def get_adapter(platform: str, mode: str | None = None):
        metadata = registry.get_platform_metadata(platform)
        if mode is None:
            mode = metadata["capabilities"].get("default_mode", "sql")

        if mode == "sql":
            return registry.get_sql_adapter(platform)
        elif mode == "dataframe":
            return registry.get_dataframe_adapter(platform)
    ```

