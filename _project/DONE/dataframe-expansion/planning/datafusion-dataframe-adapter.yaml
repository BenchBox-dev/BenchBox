id: datafusion-dataframe-adapter
title: DataFusion DataFrame Adapter Implementation
worktree: dataframe-expansion
category: Platform Enhancement
priority: Medium
status: Not Started
description: 'Implement a DataFusion DataFrame adapter for BenchBox, enabling TPC-H benchmark

  execution using DataFusion''s Python bindings. DataFusion belongs to the Expression

  family (like Polars), offering lazy evaluation, Arrow-native execution, and

  competitive single-node performance.


  Current State:

  - BenchBox has no DataFusion integration (neither SQL nor DataFrame)

  - Expression family base class exists (ExpressionFamilyAdapter)

  - Polars adapter serves as reference implementation for Expression family

  - TPC-H queries have dual implementations (pandas_impl, expression_impl)


  Value Proposition:

  - Fastest single-node Parquet engine (ClickBench 2024)

  - Apache Arrow native - zero-copy data interchange

  - SQL and DataFrame API in same engine

  - Rust core with Python bindings - memory safe, performant

  - Growing adoption (InfluxDB 3, GlareDB, OpenObserve)

  '
context_sections:
- name: Technical Research Summary
  summary: '**Core Components**:

    - SessionContext: Entry point, maintains session state

    - DataFrame: Lazy evaluation, represents query plan

    - col(), lit(): Expression builders from datafusion module

    - functions module (f): Aggregation, window, string functions


    **Execution Model**:

    - Lazy evaluation: Operations build LogicalPlan DAG

    - Terminal operations: .collect(), .to_pandas(), .to_polars(), .show()

    - Catalyst-like optimizer with rule-based rewrites

    - Vectorized execution on Arrow RecordBatches


    **TPC-H Operation Support**:

    - Joins: .join(other, on=, how=) - all types supported

    - Aggregations: .aggregate(group_by, agg_exprs)

    - Window functions: window() with partition_by, order_by

    - Parquet: Native read with predicate/projection pushdown

    - SQL: Full SQL support via ctx.sql()


    **Performance Characteristics**:

    - Fastest Parquet reading (ClickBench single-node, Nov 2024)

    - 30%+ improvement from v34 to v43 (continuous optimization)

    - Multi-threaded vectorized execution

    - Predicate, projection, limit pushdown for Parquet

    '
- name: Architecture Decision - Expression Family
  summary: '**Decision**: Implement DataFusionDataFrameAdapter extending ExpressionFamilyAdapter


    **Rationale**:

    1. DataFusion uses expression-based API: col("name"), lit(value)

    2. Lazy evaluation with explicit materialization (.collect())

    3. Window functions via window() helper function

    4. API pattern closely matches Polars


    **Type Mapping**:

    - DF = pyarrow.Table (collected result)

    - LazyDF = datafusion.DataFrame (lazy, always)

    - Expr = datafusion.Expr


    **Key Differences from Polars**:

    - Aggregation syntax: .aggregate([group_cols], [agg_exprs])

    - Window functions: window(agg, partition_by=, order_by=)

    - Result type: .collect() returns List[RecordBatch], not DataFrame

    - SQL interop: Can register DataFrames as views for SQL queries

    '
- name: Abstract Methods to Implement (23 methods)
  summary: 'From ExpressionFamilyAdapter base class:


    **Expression Creation** (2):

    - col(name: str) -> Expr

    - lit(value) -> Expr


    **Date Operations** (4):

    - date_sub(column: Expr, days: int) -> Expr

    - date_add(column: Expr, days: int) -> Expr

    - cast_date(column: Expr) -> Expr

    - cast_string(column: Expr) -> Expr


    **I/O Operations** (4):

    - read_csv(path, *, delimiter, has_header, column_names) -> DataFrame

    - read_parquet(path) -> DataFrame

    - collect(df: DataFrame) -> Table (materialize)

    - get_row_count(df: DataFrame) -> int


    **Window Functions** (8):

    - window_rank(order_by, partition_by) -> Expr

    - window_row_number(order_by, partition_by) -> Expr

    - window_dense_rank(order_by, partition_by) -> Expr

    - window_sum(column, partition_by, order_by) -> Expr

    - window_avg(column, partition_by, order_by) -> Expr

    - window_count(column, partition_by, order_by) -> Expr

    - window_min(column, partition_by) -> Expr

    - window_max(column, partition_by) -> Expr


    **DataFrame Operations** (2):

    - union_all(*dataframes) -> DataFrame

    - rename_columns(df, mapping: dict) -> DataFrame


    **Properties** (3):

    - platform_name -> str ("DataFusion")

    - family -> str ("expression")

    - tuning_config -> DataFrameTuningConfiguration

    '
tasks:
- phase: 'Phase 1: Core Adapter Implementation'
  items:
  - summary: Create DataFusionDataFrameAdapter class skeleton
    done: false
    details: "Location: benchbox/platforms/dataframe/datafusion_df.py\n\n```python\nfrom __future__ import annotations\n\n\
      from pathlib import Path\nfrom typing import TYPE_CHECKING, Any\n\nfrom benchbox.platforms.dataframe.expression_family\
      \ import ExpressionFamilyAdapter\n\nif TYPE_CHECKING:\n    import pyarrow as pa\n    from datafusion import DataFrame\
      \ as DFDataFrame, Expr as DFExpr\n\ntry:\n    import datafusion\n    from datafusion import SessionContext, col, lit\n\
      \    from datafusion import functions as f\n    import pyarrow as pa\n    DATAFUSION_AVAILABLE = True\nexcept ImportError:\n\
      \    DATAFUSION_AVAILABLE = False\n    datafusion = None\n    SessionContext = None\n    col = None\n    lit = None\n\
      \    f = None\n    pa = None\n\n\nclass DataFusionDataFrameAdapter(ExpressionFamilyAdapter[\"pa.Table\", \"DFDataFrame\"\
      , \"DFExpr\"]):\n    \"\"\"DataFusion DataFrame adapter for TPC-H benchmarking.\n\n    This adapter uses DataFusion's\
      \ Python bindings with lazy evaluation.\n    DataFusion is an Arrow-native query engine with excellent Parquet performance.\n\
      \    \"\"\"\n\n    def __init__(\n        self,\n        working_dir: str | Path | None = None,\n        verbose: bool\
      \ = False,\n        very_verbose: bool = False,\n        tuning_config: DataFrameTuningConfiguration | None = None,\n\
      \        # DataFusion-specific options\n        target_partitions: int | None = None,\n        repartition_joins: bool\
      \ = True,\n        parquet_pushdown: bool = True,\n        **config_options: Any,\n    ):\n        if not DATAFUSION_AVAILABLE:\n\
      \            raise ImportError(\n                \"DataFusion is not installed. Install with: pip install datafusion\"\
      \n            )\n\n        super().__init__(working_dir, verbose, very_verbose, tuning_config)\n\n        self._target_partitions\
      \ = target_partitions\n        self._repartition_joins = repartition_joins\n        self._parquet_pushdown = parquet_pushdown\n\
      \        self._config_options = config_options\n\n        self._ctx: SessionContext | None = None\n        self._validate_and_apply_tuning()\n\
      \n    @property\n    def platform_name(self) -> str:\n        return \"DataFusion\"\n\n    @property\n    def family(self)\
      \ -> str:\n        return \"expression\"\n\n    @property\n    def ctx(self) -> SessionContext:\n        \"\"\"Get or\
      \ create SessionContext.\"\"\"\n        if self._ctx is None:\n            self._ctx = self._create_context()\n    \
      \    return self._ctx\n\n    def _create_context(self) -> SessionContext:\n        \"\"\"Create a configured SessionContext.\"\
      \"\"\n        from datafusion import SessionConfig\n\n        config = SessionConfig()\n\n        # Set target partitions\
      \ (parallelism)\n        if self._target_partitions:\n            config = config.with_target_partitions(self._target_partitions)\n\
      \n        # Join optimization\n        if self._repartition_joins:\n            config = config.with_repartition_joins(True)\n\
      \n        # Parquet pushdown\n        if self._parquet_pushdown:\n            config = config.set_bool_option(\n   \
      \             \"datafusion.execution.parquet.pushdown_filters\", True\n            )\n\n        # Additional options\n\
      \        for key, value in self._config_options.items():\n            if isinstance(value, bool):\n                config\
      \ = config.set_bool_option(key, value)\n            elif isinstance(value, str):\n                config = config.set_str_option(key,\
      \ value)\n\n        ctx = SessionContext(config)\n\n        if self._verbose:\n            self._log(f\"DataFusion context\
      \ created with {self._target_partitions or 'default'} partitions\")\n\n        return ctx\n```\n"
  - summary: Implement expression creation methods (col, lit)
    done: false
    details: "```python\ndef col(self, name: str) -> \"DFExpr\":\n    \"\"\"Create a column expression by name.\"\"\"\n  \
      \  from datafusion import col\n    return col(name)\n\ndef lit(self, value: Any) -> \"DFExpr\":\n    \"\"\"Create a\
      \ literal expression.\"\"\"\n    from datafusion import lit\n    return lit(value)\n```\n"
  - summary: Implement date operations
    done: false
    details: "```python\ndef date_sub(self, column: \"DFExpr\", days: int) -> \"DFExpr\":\n    \"\"\"Subtract days from a\
      \ date column.\n\n    DataFusion uses interval arithmetic for date operations.\n    \"\"\"\n    from datafusion import\
      \ functions as f\n    # DataFusion: date - interval 'N days'\n    interval = f.make_interval(days=lit(-days))\n    return\
      \ column + interval\n\ndef date_add(self, column: \"DFExpr\", days: int) -> \"DFExpr\":\n    \"\"\"Add days to a date\
      \ column.\"\"\"\n    from datafusion import functions as f\n    interval = f.make_interval(days=lit(days))\n    return\
      \ column + interval\n\ndef cast_date(self, column: \"DFExpr\") -> \"DFExpr\":\n    \"\"\"Cast column to date type.\"\
      \"\"\n    import pyarrow as pa\n    return column.cast(pa.date32())\n\ndef cast_string(self, column: \"DFExpr\") ->\
      \ \"DFExpr\":\n    \"\"\"Cast column to string type.\"\"\"\n    import pyarrow as pa\n    return column.cast(pa.utf8())\n\
      ```\n"
- phase: 'Phase 2: I/O Operations'
  items:
  - summary: Implement read_parquet
    done: false
    details: "```python\ndef read_parquet(self, path: Path) -> \"DFDataFrame\":\n    \"\"\"Read a Parquet file into a DataFusion\
      \ DataFrame.\n\n    DataFusion excels at Parquet reading with automatic:\n    - Predicate pushdown\n    - Projection\
      \ pushdown\n    - Row group pruning\n    - Page index filtering\n    \"\"\"\n    return self.ctx.read_parquet(str(path))\n\
      ```\n"
  - summary: Implement read_csv with TPC file handling
    done: false
    details: "```python\ndef read_csv(\n    self,\n    path: Path,\n    *,\n    delimiter: str = \",\",\n    has_header: bool\
      \ = True,\n    column_names: list[str] | None = None,\n) -> \"DFDataFrame\":\n    \"\"\"Read a CSV file into a DataFusion\
      \ DataFrame.\n\n    Handles TPC .tbl files with trailing delimiters.\n    \"\"\"\n    path_str = str(path)\n\n    #\
      \ Build CSV read options\n    read_options = {}\n    if delimiter != \",\":\n        read_options[\"delimiter\"] = delimiter\n\
      \    read_options[\"has_header\"] = has_header\n\n    # Handle TPC .tbl files with trailing delimiter\n    if path_str.endswith(\"\
      .tbl\") and column_names:\n        # Read with extended schema for trailing delimiter\n        extended_names = column_names\
      \ + [\"_trailing_\"]\n        df = self.ctx.read_csv(\n            path_str,\n            schema_infer_max_records=0,\n\
      \            **read_options\n        )\n        # Note: May need schema specification for .tbl files\n        # DataFusion\
      \ infers schema by default\n        if \"_trailing_\" in [f.name for f in df.schema()]:\n            df = df.drop(\"\
      _trailing_\")\n    else:\n        df = self.ctx.read_csv(path_str, **read_options)\n\n    return df\n```\n"
  - summary: Implement collect and get_row_count
    done: false
    details: "```python\ndef collect(self, df: \"DFDataFrame\") -> \"pa.Table\":\n    \"\"\"Materialize a lazy DataFrame to\
      \ PyArrow Table.\n\n    DataFusion's collect() returns List[RecordBatch].\n    We convert to a single Table for easier\
      \ handling.\n    \"\"\"\n    import pyarrow as pa\n\n    batches = df.collect()\n    if not batches:\n        # Empty\
      \ result - return empty table with schema\n        return pa.table({})\n\n    return pa.Table.from_batches(batches)\n\
      \ndef get_row_count(self, df: \"DFDataFrame\") -> int:\n    \"\"\"Get the number of rows in a DataFrame.\"\"\"\n   \
      \ result = df.count()\n    # count() returns a DataFrame with single row\n    count_batches = result.collect()\n   \
      \ if count_batches:\n        return count_batches[0].column(0)[0].as_py()\n    return 0\n\ndef to_pandas(self, df: \"\
      DFDataFrame\") -> \"pd.DataFrame\":\n    \"\"\"Convert DataFusion DataFrame to Pandas.\"\"\"\n    table = self.collect(df)\n\
      \    return table.to_pandas()\n\ndef to_polars(self, df: \"DFDataFrame\") -> \"pl.DataFrame\":\n    \"\"\"Convert DataFusion\
      \ DataFrame to Polars.\"\"\"\n    import polars as pl\n    table = self.collect(df)\n    return pl.from_arrow(table)\n\
      ```\n"
- phase: 'Phase 3: Window Functions'
  items:
  - summary: Implement ranking window functions
    done: false
    details: "```python\ndef window_rank(\n    self,\n    order_by: list[tuple[str, bool]],\n    partition_by: list[str] |\
      \ None = None,\n) -> \"DFExpr\":\n    \"\"\"Create a RANK() window function expression.\"\"\"\n    from datafusion import\
      \ functions as f\n\n    order_exprs = self._build_order_exprs(order_by)\n    partition_exprs = [col(c) for c in (partition_by\
      \ or [])]\n\n    return f.rank().over(\n        partition_by=partition_exprs,\n        order_by=order_exprs,\n    )\n\
      \ndef window_row_number(\n    self,\n    order_by: list[tuple[str, bool]],\n    partition_by: list[str] | None = None,\n\
      ) -> \"DFExpr\":\n    \"\"\"Create a ROW_NUMBER() window function expression.\"\"\"\n    from datafusion import functions\
      \ as f\n\n    order_exprs = self._build_order_exprs(order_by)\n    partition_exprs = [col(c) for c in (partition_by\
      \ or [])]\n\n    return f.row_number().over(\n        partition_by=partition_exprs,\n        order_by=order_exprs,\n\
      \    )\n\ndef window_dense_rank(\n    self,\n    order_by: list[tuple[str, bool]],\n    partition_by: list[str] | None\
      \ = None,\n) -> \"DFExpr\":\n    \"\"\"Create a DENSE_RANK() window function expression.\"\"\"\n    from datafusion\
      \ import functions as f\n\n    order_exprs = self._build_order_exprs(order_by)\n    partition_exprs = [col(c) for c\
      \ in (partition_by or [])]\n\n    return f.dense_rank().over(\n        partition_by=partition_exprs,\n        order_by=order_exprs,\n\
      \    )\n\ndef _build_order_exprs(\n    self,\n    order_by: list[tuple[str, bool]],\n) -> list[\"DFExpr\"]:\n    \"\"\
      \"Build order by expressions.\"\"\"\n    order_exprs = []\n    for col_name, ascending in order_by:\n        expr =\
      \ col(col_name)\n        if not ascending:\n            expr = expr.sort(ascending=False)\n        order_exprs.append(expr)\n\
      \    return order_exprs\n```\n"
  - summary: Implement aggregate window functions
    done: false
    details: "```python\ndef window_sum(\n    self,\n    column: str,\n    partition_by: list[str] | None = None,\n    order_by:\
      \ list[tuple[str, bool]] | None = None,\n) -> \"DFExpr\":\n    \"\"\"Create a SUM() window function expression.\"\"\"\
      \n    from datafusion import functions as f\n\n    partition_exprs = [col(c) for c in (partition_by or [])]\n    order_exprs\
      \ = self._build_order_exprs(order_by or [])\n\n    return f.sum(col(column)).over(\n        partition_by=partition_exprs,\n\
      \        order_by=order_exprs if order_exprs else None,\n    )\n\ndef window_avg(\n    self,\n    column: str,\n   \
      \ partition_by: list[str] | None = None,\n    order_by: list[tuple[str, bool]] | None = None,\n) -> \"DFExpr\":\n  \
      \  \"\"\"Create an AVG() window function expression.\"\"\"\n    from datafusion import functions as f\n\n    partition_exprs\
      \ = [col(c) for c in (partition_by or [])]\n    order_exprs = self._build_order_exprs(order_by or [])\n\n    return\
      \ f.avg(col(column)).over(\n        partition_by=partition_exprs,\n        order_by=order_exprs if order_exprs else\
      \ None,\n    )\n\ndef window_count(\n    self,\n    column: str,\n    partition_by: list[str] | None = None,\n    order_by:\
      \ list[tuple[str, bool]] | None = None,\n) -> \"DFExpr\":\n    \"\"\"Create a COUNT() window function expression.\"\"\
      \"\n    from datafusion import functions as f\n\n    partition_exprs = [col(c) for c in (partition_by or [])]\n    order_exprs\
      \ = self._build_order_exprs(order_by or [])\n\n    return f.count(col(column)).over(\n        partition_by=partition_exprs,\n\
      \        order_by=order_exprs if order_exprs else None,\n    )\n\ndef window_min(\n    self,\n    column: str,\n   \
      \ partition_by: list[str] | None = None,\n) -> \"DFExpr\":\n    \"\"\"Create a MIN() window function expression.\"\"\
      \"\n    from datafusion import functions as f\n\n    partition_exprs = [col(c) for c in (partition_by or [])]\n\n  \
      \  return f.min(col(column)).over(partition_by=partition_exprs)\n\ndef window_max(\n    self,\n    column: str,\n  \
      \  partition_by: list[str] | None = None,\n) -> \"DFExpr\":\n    \"\"\"Create a MAX() window function expression.\"\"\
      \"\n    from datafusion import functions as f\n\n    partition_exprs = [col(c) for c in (partition_by or [])]\n\n  \
      \  return f.max(col(column)).over(partition_by=partition_exprs)\n```\n"
- phase: 'Phase 4: DataFrame Operations'
  items:
  - summary: Implement union_all and rename_columns
    done: false
    details: "```python\ndef union_all(self, *dataframes: \"DFDataFrame\") -> \"DFDataFrame\":\n    \"\"\"Union multiple DataFrames\
      \ together.\"\"\"\n    if not dataframes:\n        raise ValueError(\"At least one DataFrame required for union\")\n\
      \n    result = dataframes[0]\n    for df in dataframes[1:]:\n        result = result.union(df)\n    return result\n\n\
      def rename_columns(\n    self,\n    df: \"DFDataFrame\",\n    mapping: dict[str, str],\n) -> \"DFDataFrame\":\n    \"\
      \"\"Rename columns in a DataFrame.\n\n    DataFusion uses .with_column_renamed() for renaming.\n    \"\"\"\n    result\
      \ = df\n    for old_name, new_name in mapping.items():\n        schema_names = [f.name for f in result.schema()]\n \
      \       if old_name in schema_names:\n            result = result.with_column_renamed(old_name, new_name)\n    return\
      \ result\n```\n"
  - summary: Implement query plan capture for profiling
    done: false
    details: "```python\ndef explain(self, df: \"DFDataFrame\", analyze: bool = False) -> str:\n    \"\"\"Get the query plan\
      \ for a DataFrame.\n\n    Args:\n        df: DataFrame to explain\n        analyze: If True, run EXPLAIN ANALYZE (includes\
      \ timing)\n\n    Returns:\n        Query plan as string\n    \"\"\"\n    if analyze:\n        # EXPLAIN ANALYZE runs\
      \ the query\n        return df.explain(analyze=True)\n    else:\n        return df.explain()\n\ndef get_logical_plan(self,\
      \ df: \"DFDataFrame\") -> str:\n    \"\"\"Get the logical plan for a DataFrame.\"\"\"\n    return str(df.logical_plan())\n\
      \ndef get_query_plan(self, df: \"DFDataFrame\") -> dict[str, str]:\n    \"\"\"Get both logical and physical query plans.\"\
      \"\"\n    return {\n        \"logical\": self.get_logical_plan(df),\n        \"physical\": self.explain(df),\n    }\n\
      ```\n"
  - summary: Implement SQL interoperability
    done: false
    details: "```python\ndef register_table(self, name: str, df: \"DFDataFrame\") -> None:\n    \"\"\"Register a DataFrame\
      \ as a table for SQL queries.\"\"\"\n    # Create a view from the DataFrame\n    self.ctx.register_table(name, df.to_arrow_table())\n\
      \ndef sql(self, query: str) -> \"DFDataFrame\":\n    \"\"\"Execute a SQL query against registered tables.\"\"\"\n  \
      \  return self.ctx.sql(query)\n\ndef register_parquet_table(self, name: str, path: Path) -> None:\n    \"\"\"Register\
      \ a Parquet file as a table for SQL queries.\"\"\"\n    self.ctx.register_parquet(name, str(path))\n```\n"
