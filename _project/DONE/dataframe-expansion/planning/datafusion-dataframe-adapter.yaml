      \    if self._verbose:\n        self._log(f\"DataFusion tuning: partitions={self._target_partitions}, \"\n         \
      \        f\"repartition_joins={self._repartition_joins}\")\n\ndef get_tuning_summary(self) -> dict[str, Any]:\n    \"\
      \"\"Get summary of applied tuning settings.\"\"\"\n    return {\n        \"platform\": self.platform_name,\n       \
      \ \"family\": self.family,\n        \"target_partitions\": self._target_partitions,\n        \"repartition_joins\":\
