  notes: "Implementation Notes:\n\n1. **Arrow Native**: DataFusion operates on Arrow RecordBatches. The\n   collect() method\
    \ returns List[RecordBatch], not a DataFrame type.\n   Convert to pa.Table for easier handling.\n\n2. **SQL Interop**:\
    \ DataFusion supports both DataFrame and SQL APIs.\n   Can register DataFrames as views and query via SQL. Useful for\n\
    \   complex queries or TPC-H queries with subqueries.\n\n3. **Zero-Copy**: DataFusion → Polars/Pandas conversions are\
    \ zero-copy\n   via Arrow. Leverage this for result validation.\n\n4. **Parquet Optimization**: DataFusion automatically\
    \ applies:\n   - Predicate pushdown (row group pruning)\n   - Projection pushdown (column pruning)\n   - Page index filtering\n\
    \   - Bloom filter usage\n   Enable with parquet_pushdown=True (default).\n\n5. **Window Functions**: DataFusion window\
    \ functions work differently\n   from Polars. Use window() helper with partition_by and order_by\n   parameters rather\
    \ than .over() method.\n\n6. **Date Arithmetic**: DataFusion uses interval arithmetic for date\n   operations. Use make_interval()\
    \ function for days/months/years.\n\n7. **Performance**: DataFusion is the fastest single-node Parquet\n   engine (ClickBench\
    \ 2024). Expect competitive or better performance\n   than Polars for Parquet-heavy workloads.\n\n8. **Community**: DataFusion\
    \ is an Apache top-level project with\n   strong community and production usage (InfluxDB, GlareDB).\n\nReferences:\n\
    - DataFusion Python: https://datafusion.apache.org/python/\n- API Reference: https://datafusion.apache.org/python/autoapi/datafusion/\n\
    - GitHub: https://github.com/apache/datafusion-python\n- Benchmarks: https://github.com/apache/datafusion-benchmarks\n\
    - Performance Blog: https://datafusion.apache.org/blog/\n"
