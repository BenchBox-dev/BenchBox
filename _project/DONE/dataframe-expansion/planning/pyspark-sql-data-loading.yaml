id: pyspark-sql-data-loading
title: Implement PySpark SQL data loading for TPC benchmarks
worktree: dataframe-expansion
priority: High
status: Completed
category: Platform Expansion

description: |
  Implement load_data() method for PySparkSQLAdapter supporting
  local and cloud data sources in CSV, Parquet, and TBL formats.

  Unlike Databricks (cloud-only), PySpark SQL supports both local
  file paths and cloud storage (S3, GCS, ABFS).

  Data loading flow:
  1. Read files into DataFrame (spark.read.csv/parquet)
  2. Apply column names from schema
  3. Write as managed Spark table (saveAsTable)
  4. Verify row counts

context_sections:
  "Implementation Pattern": |
    ```python
    def load_data(self, benchmark, connection, data_dir: Path):
        for table in benchmark.tables:
            # Find data file
            path = self._find_data_file(data_dir, table.name)

            # Read based on format
            if path.suffix == '.parquet':
                df = self._spark.read.parquet(str(path))
            elif path.suffix == '.tbl':
                # TPC format: pipe-delimited, trailing delimiter
                df = self._spark.read.csv(
                    str(path),
                    sep="|",
                    header=False,
                    inferSchema=False
                )
                # Remove trailing empty column from TPC format
                df = df.drop(df.columns[-1])
            else:
                df = self._spark.read.csv(str(path), header=True)

            # Apply column names
            df = df.toDF(*[col.name for col in table.columns])

            # Create managed table
            df.write.mode("overwrite").saveAsTable(table.name)

            # Verify row count
            count = self._spark.table(table.name).count()
            logger.info(f"Loaded {count} rows into {table.name}")
    ```

  "Cloud Path Support": |
    - S3: s3://bucket/path/ or s3a://bucket/path/
    - GCS: gs://bucket/path/
    - Azure: abfss://container@account.dfs.core.windows.net/path/

    Requires appropriate Spark packages:
    - S3: hadoop-aws
    - GCS: gcs-connector
    - Azure: hadoop-azure

