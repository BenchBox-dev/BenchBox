    \ Relationship)\n   - Q17 (Small-Quantity-Order Revenue)\n   - Q18 (Large Volume Customer)\n   - Q19 (Discounted Revenue)\n\
    \   - Q20 (Potential Part Promotion)\n   - Q21 (Suppliers Who Kept Orders Waiting)\n   - Q22 (Global Sales Opportunity)\n\
