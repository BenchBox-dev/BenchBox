      \ applied settings\n    if self._verbose:\n        self._log(f\"PySpark tuning applied: master={self._master}, \"\n\
      \                 f\"driver_memory={self._driver_memory}\")\n\ndef get_tuning_summary(self) -> dict[str, Any]:\n   \
      \ \"\"\"Get summary of applied tuning settings.\"\"\"\n    return {\n        \"platform\": self.platform_name,\n   \
