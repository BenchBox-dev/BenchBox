id: pyspark-dataframe-adapter
title: PySpark DataFrame Adapter Implementation
worktree: dataframe-expansion
category: Platform Enhancement
priority: Medium
status: Completed
description: 'Implement a PySpark DataFrame adapter for BenchBox, enabling TPC-H benchmark execution

  using PySpark''s DataFrame API. PySpark belongs to the Expression family (like Polars),

  using lazy evaluation and expression-based column operations.


  Current State:

  - BenchBox has existing Spark SQL adapter (benchbox/platforms/spark.py) for SQL mode

  - Expression family base class exists (ExpressionFamilyAdapter)

  - Polars adapter serves as reference implementation for Expression family

  - TPC-H queries have dual implementations (pandas_impl, expression_impl)


  Value Proposition:

  - Enables DataFrame vs SQL comparison for Spark platform

  - Supports distributed execution (local + cluster modes)

  - Bridges to existing Spark infrastructure users may have

  - Completes the Expression family platform coverage

  '
context_sections:
- name: Technical Research Summary
  summary: '**Core Components**:

    - SparkSession: Entry point, created via builder pattern

    - DataFrame: Distributed collection of rows with schema (lazy)

    - Column: Expression representing column reference (pyspark.sql.Column)

    - functions module (F): Expression builders (F.col, F.lit, F.sum, etc.)


    **Execution Model**:

    - Lazy evaluation: Operations build DAG, execution on action

    - Actions: .collect(), .show(), .count(), .write.*()

    - Catalyst optimizer: Automatic query plan optimization

    - Adaptive Query Execution (AQE): Runtime optimization


    **TPC-H Operation Support**:

    - Joins: .join(other, on=, how=) - all types supported

    - Aggregations: .groupBy().agg() with F.sum, F.avg, F.count, etc.

    - Window functions: Window.partitionBy().orderBy() with F.rank(), F.row_number()

    - Date operations: F.date_sub(), F.date_add(), F.to_date()

    - Filtering: .filter(condition) or .where(condition)


    **Configuration for Benchmarking**:

    - spark.sql.shuffle.partitions: Match CPU cores for local mode

    - spark.sql.adaptive.enabled: Enable AQE (recommended)

    - spark.sql.inMemoryColumnarStorage.enabled: Disable for benchmarking

    - spark.driver.memory / spark.executor.memory: Memory allocation

    '
- name: Architecture Decision - Expression Family
  summary: '**Decision**: Implement PySparkDataFrameAdapter extending ExpressionFamilyAdapter


    **Rationale**:

    1. PySpark uses expression-based API: F.col("name"), F.lit(value)

    2. Lazy evaluation with explicit materialization (.collect())

    3. Window functions via Window spec objects (like Polars .over())

    4. API pattern matches Polars more than Pandas


    **Type Mapping**:

    - DF = pyspark.sql.DataFrame

    - LazyDF = pyspark.sql.DataFrame (same type, always lazy)

    - Expr = pyspark.sql.Column


    **Key Differences from Polars**:

    - No separate LazyFrame type (DataFrame is always lazy)

    - Window functions use Window spec objects, not .over() method

    - Date operations require explicit F.to_date() casting

    - Session lifecycle management (SparkSession.stop())

    '
- name: Abstract Methods to Implement (23 methods)
  summary: 'From ExpressionFamilyAdapter base class:


    **Expression Creation** (2):

    - col(name: str) -> Column

    - lit(value) -> Column


    **Date Operations** (4):

    - date_sub(column: Column, days: int) -> Column

    - date_add(column: Column, days: int) -> Column

    - cast_date(column: Column) -> Column

    - cast_string(column: Column) -> Column


    **I/O Operations** (4):

    - read_csv(path, *, delimiter, has_header, column_names) -> DataFrame

    - read_parquet(path) -> DataFrame

    - collect(df: DataFrame) -> DataFrame (materialize)

    - get_row_count(df: DataFrame) -> int


    **Window Functions** (8):

    - window_rank(order_by, partition_by) -> Column

    - window_row_number(order_by, partition_by) -> Column

    - window_dense_rank(order_by, partition_by) -> Column

    - window_sum(column, partition_by, order_by) -> Column

    - window_avg(column, partition_by, order_by) -> Column

    - window_count(column, partition_by, order_by) -> Column

    - window_min(column, partition_by) -> Column

    - window_max(column, partition_by) -> Column


    **DataFrame Operations** (2):

    - union_all(*dataframes) -> DataFrame

    - rename_columns(df, mapping: dict) -> DataFrame


    **Properties** (3):

    - platform_name -> str ("PySpark")

    - family -> str ("expression")

    - tuning_config -> DataFrameTuningConfiguration

    '
tasks:
- phase: 'Phase 1: Core Adapter Implementation'
  items:
  - summary: Create PySparkDataFrameAdapter class skeleton
    done: false
    details: "Location: benchbox/platforms/dataframe/pyspark_df.py\n\n```python\nfrom __future__ import annotations\n\nimport\
      \ os\nfrom pathlib import Path\nfrom typing import TYPE_CHECKING, Any\n\nfrom benchbox.platforms.dataframe.expression_family\
      \ import ExpressionFamilyAdapter\n\nif TYPE_CHECKING:\n    from pyspark.sql import DataFrame as SparkDF, Column as SparkExpr,\
      \ SparkSession\n\ntry:\n    from pyspark.sql import SparkSession, DataFrame, Column\n    from pyspark.sql import functions\
      \ as F\n    from pyspark.sql.window import Window\n    PYSPARK_AVAILABLE = True\nexcept ImportError:\n    PYSPARK_AVAILABLE\
      \ = False\n    SparkSession = None\n    DataFrame = None\n    Column = None\n    F = None\n    Window = None\n\n\nclass\
      \ PySparkDataFrameAdapter(ExpressionFamilyAdapter[\"SparkDF\", \"SparkDF\", \"SparkExpr\"]):\n    \"\"\"PySpark DataFrame\
      \ adapter for TPC-H benchmarking.\n\n    This adapter uses PySpark's DataFrame API with lazy evaluation.\n    All DataFrames\
      \ are lazy by default; use .collect() for materialization.\n    \"\"\"\n\n    def __init__(\n        self,\n       \
      \ working_dir: str | Path | None = None,\n        verbose: bool = False,\n        very_verbose: bool = False,\n    \
      \    tuning_config: DataFrameTuningConfiguration | None = None,\n        # PySpark-specific options\n        master:\
      \ str = \"local[*]\",\n        app_name: str = \"BenchBox-TPC-H\",\n        driver_memory: str = \"4g\",\n        executor_memory:\
      \ str | None = None,\n        shuffle_partitions: int | None = None,\n        enable_aqe: bool = True,\n        **spark_config:\
      \ Any,\n    ):\n        if not PYSPARK_AVAILABLE:\n            raise ImportError(\n                \"PySpark is not\
      \ installed. Install with: pip install pyspark\"\n            )\n\n        super().__init__(working_dir, verbose, very_verbose,\
      \ tuning_config)\n\n        self._master = master\n        self._app_name = app_name\n        self._driver_memory =\
      \ driver_memory\n        self._executor_memory = executor_memory\n        self._shuffle_partitions = shuffle_partitions\n\
      \        self._enable_aqe = enable_aqe\n        self._spark_config = spark_config\n\n        self._spark: SparkSession\
      \ | None = None\n        self._validate_and_apply_tuning()\n\n    @property\n    def platform_name(self) -> str:\n \
      \       return \"PySpark\"\n\n    @property\n    def family(self) -> str:\n        return \"expression\"\n```\n"
  - summary: Implement SparkSession lifecycle management
    done: false
    details: "Add session creation and cleanup:\n\n```python\ndef _get_or_create_session(self) -> SparkSession:\n    \"\"\"\
      Get existing or create new SparkSession.\"\"\"\n    if self._spark is None:\n        builder = SparkSession.builder\
      \ \\\n            .master(self._master) \\\n            .appName(self._app_name) \\\n            .config(\"spark.driver.memory\"\
      , self._driver_memory)\n\n        if self._executor_memory:\n            builder = builder.config(\"spark.executor.memory\"\
      , self._executor_memory)\n\n        # Shuffle partitions (default 200 is too high for local mode)\n        partitions\
      \ = self._shuffle_partitions or os.cpu_count() or 8\n        builder = builder.config(\"spark.sql.shuffle.partitions\"\
      , str(partitions))\n\n        # Adaptive Query Execution\n        if self._enable_aqe:\n            builder = builder.config(\"\
      spark.sql.adaptive.enabled\", \"true\")\n            builder = builder.config(\"spark.sql.adaptive.coalescePartitions.enabled\"\
      , \"true\")\n\n        # Disable caching for benchmarking\n        builder = builder.config(\"spark.sql.inMemoryColumnarStorage.enabled\"\
      , \"false\")\n\n        # Additional user config\n        for key, value in self._spark_config.items():\n          \
      \  builder = builder.config(key, str(value))\n\n        self._spark = builder.getOrCreate()\n\n        if self._verbose:\n\
      \            self._log(f\"SparkSession created: {self._spark.sparkContext.master}\")\n\n    return self._spark\n\n@property\n\
      def spark(self) -> SparkSession:\n    \"\"\"Access the SparkSession.\"\"\"\n    return self._get_or_create_session()\n\
      \ndef close(self) -> None:\n    \"\"\"Stop the SparkSession and cleanup resources.\"\"\"\n    if self._spark is not\
      \ None:\n        self._spark.stop()\n        self._spark = None\n        if self._verbose:\n            self._log(\"\
      SparkSession stopped\")\n\ndef __del__(self) -> None:\n    \"\"\"Cleanup on garbage collection.\"\"\"\n    self.close()\n\
      ```\n"
  - summary: Implement expression creation methods (col, lit)
    done: false
    details: "```python\ndef col(self, name: str) -> Column:\n    \"\"\"Create a column expression by name.\"\"\"\n    return\
      \ F.col(name)\n\ndef lit(self, value: Any) -> Column:\n    \"\"\"Create a literal expression.\"\"\"\n    return F.lit(value)\n\
      ```\n"
  - summary: Implement date operations
    done: false
    details: "```python\ndef date_sub(self, column: Column, days: int) -> Column:\n    \"\"\"Subtract days from a date column.\"\
      \"\"\n    return F.date_sub(column, days)\n\ndef date_add(self, column: Column, days: int) -> Column:\n    \"\"\"Add\
      \ days to a date column.\"\"\"\n    return F.date_add(column, days)\n\ndef cast_date(self, column: Column) -> Column:\n\
      \    \"\"\"Cast column to date type.\"\"\"\n    return column.cast(\"date\")\n\ndef cast_string(self, column: Column)\
      \ -> Column:\n    \"\"\"Cast column to string type.\"\"\"\n    return column.cast(\"string\")\n```\n"
- phase: 'Phase 2: I/O Operations'
  items:
  - summary: Implement read_parquet
    done: false
    details: "```python\ndef read_parquet(self, path: Path) -> DataFrame:\n    \"\"\"Read a Parquet file into a Spark DataFrame.\n\
      \n    Note: Returns lazy DataFrame - no data is read until action.\n    \"\"\"\n    return self.spark.read.parquet(str(path))\n\
      ```\n"
  - summary: Implement read_csv with TPC file handling
    done: false
    details: "```python\ndef read_csv(\n    self,\n    path: Path,\n    *,\n    delimiter: str = \",\",\n    has_header: bool\
      \ = True,\n    column_names: list[str] | None = None,\n) -> DataFrame:\n    \"\"\"Read a CSV file into a Spark DataFrame.\n\
      \n    Handles TPC .tbl files with trailing delimiters.\n    \"\"\"\n    path_str = str(path)\n\n    reader = self.spark.read\
      \ \\\n        .option(\"delimiter\", delimiter) \\\n        .option(\"header\", str(has_header).lower())\n\n    # Handle\
      \ TPC .tbl files with trailing delimiter\n    if path_str.endswith(\".tbl\") and column_names:\n        # TPC files\
      \ have trailing delimiter, add dummy column\n        extended_names = column_names + [\"_trailing_\"]\n        df =\
      \ reader.schema(self._build_schema(extended_names)).csv(path_str)\n        # Drop the trailing column\n        df =\
      \ df.drop(\"_trailing_\")\n    elif column_names:\n        df = reader.schema(self._build_schema(column_names)).csv(path_str)\n\
      \    else:\n        df = reader.csv(path_str)\n\n    return df\n\ndef _build_schema(self, column_names: list[str]) ->\
      \ str:\n    \"\"\"Build schema string for CSV reading.\"\"\"\n    # Default to string type, let Spark infer or cast\
      \ later\n    return \", \".join(f\"`{name}` STRING\" for name in column_names)\n```\n"
  - summary: Implement collect and get_row_count
    done: false
    details: "```python\ndef collect(self, df: DataFrame) -> DataFrame:\n    \"\"\"Materialize a lazy DataFrame.\n\n    For\
      \ PySpark, this triggers computation and returns the same DataFrame.\n    Use .toPandas() or .collect() for actual data\
      \ retrieval.\n    \"\"\"\n    # Trigger computation by counting, return same DataFrame\n    # This ensures the query\
      \ plan is executed\n    _ = df.count()\n    return df\n\ndef get_row_count(self, df: DataFrame) -> int:\n    \"\"\"\
      Get the number of rows in a DataFrame.\"\"\"\n    return df.count()\n\ndef to_pandas(self, df: DataFrame) -> \"pd.DataFrame\"\
      :\n    \"\"\"Convert Spark DataFrame to Pandas for result inspection.\"\"\"\n    return df.toPandas()\n```\n"
- phase: 'Phase 3: Window Functions'
  items:
  - summary: Implement ranking window functions
    done: false
    details: "```python\ndef window_rank(\n    self,\n    order_by: list[tuple[str, bool]],\n    partition_by: list[str] |\
      \ None = None,\n) -> Column:\n    \"\"\"Create a RANK() window function expression.\"\"\"\n    window_spec = self._build_window_spec(order_by,\
      \ partition_by)\n    return F.rank().over(window_spec)\n\ndef window_row_number(\n    self,\n    order_by: list[tuple[str,\
      \ bool]],\n    partition_by: list[str] | None = None,\n) -> Column:\n    \"\"\"Create a ROW_NUMBER() window function\
      \ expression.\"\"\"\n    window_spec = self._build_window_spec(order_by, partition_by)\n    return F.row_number().over(window_spec)\n\
      \ndef window_dense_rank(\n    self,\n    order_by: list[tuple[str, bool]],\n    partition_by: list[str] | None = None,\n\
      ) -> Column:\n    \"\"\"Create a DENSE_RANK() window function expression.\"\"\"\n    window_spec = self._build_window_spec(order_by,\
      \ partition_by)\n    return F.dense_rank().over(window_spec)\n\ndef _build_window_spec(\n    self,\n    order_by: list[tuple[str,\
      \ bool]],\n    partition_by: list[str] | None = None,\n) -> \"WindowSpec\":\n    \"\"\"Build a Window specification\
      \ from order_by and partition_by.\"\"\"\n    # Start with partition if provided\n    if partition_by:\n        window\
      \ = Window.partitionBy(*[F.col(c) for c in partition_by])\n    else:\n        window = Window.partitionBy()\n\n    #\
      \ Add ordering\n    order_cols = []\n    for col_name, ascending in order_by:\n        col_expr = F.col(col_name)\n\
      \        if ascending:\n            order_cols.append(col_expr.asc())\n        else:\n            order_cols.append(col_expr.desc())\n\
      \n    if order_cols:\n        window = window.orderBy(*order_cols)\n\n    return window\n```\n"
  - summary: Implement aggregate window functions
    done: false
    details: "```python\ndef window_sum(\n    self,\n    column: str,\n    partition_by: list[str] | None = None,\n    order_by:\
      \ list[tuple[str, bool]] | None = None,\n) -> Column:\n    \"\"\"Create a SUM() window function expression.\"\"\"\n\
      \    window_spec = self._build_aggregate_window_spec(partition_by, order_by)\n    return F.sum(F.col(column)).over(window_spec)\n\
      \ndef window_avg(\n    self,\n    column: str,\n    partition_by: list[str] | None = None,\n    order_by: list[tuple[str,\
      \ bool]] | None = None,\n) -> Column:\n    \"\"\"Create an AVG() window function expression.\"\"\"\n    window_spec\
      \ = self._build_aggregate_window_spec(partition_by, order_by)\n    return F.avg(F.col(column)).over(window_spec)\n\n\
      def window_count(\n    self,\n    column: str,\n    partition_by: list[str] | None = None,\n    order_by: list[tuple[str,\
      \ bool]] | None = None,\n) -> Column:\n    \"\"\"Create a COUNT() window function expression.\"\"\"\n    window_spec\
      \ = self._build_aggregate_window_spec(partition_by, order_by)\n    return F.count(F.col(column)).over(window_spec)\n\
      \ndef window_min(\n    self,\n    column: str,\n    partition_by: list[str] | None = None,\n) -> Column:\n    \"\"\"\
      Create a MIN() window function expression.\"\"\"\n    window_spec = self._build_aggregate_window_spec(partition_by,\
      \ None)\n    return F.min(F.col(column)).over(window_spec)\n\ndef window_max(\n    self,\n    column: str,\n    partition_by:\
      \ list[str] | None = None,\n) -> Column:\n    \"\"\"Create a MAX() window function expression.\"\"\"\n    window_spec\
      \ = self._build_aggregate_window_spec(partition_by, None)\n    return F.max(F.col(column)).over(window_spec)\n\ndef\
      \ _build_aggregate_window_spec(\n    self,\n    partition_by: list[str] | None = None,\n    order_by: list[tuple[str,\
      \ bool]] | None = None,\n) -> \"WindowSpec\":\n    \"\"\"Build Window spec for aggregate functions.\"\"\"\n    if partition_by:\n\
      \        window = Window.partitionBy(*[F.col(c) for c in partition_by])\n    else:\n        window = Window.partitionBy()\n\
      \n    if order_by:\n        order_cols = []\n        for col_name, ascending in order_by:\n            col_expr = F.col(col_name)\n\
      \            order_cols.append(col_expr.asc() if ascending else col_expr.desc())\n        window = window.orderBy(*order_cols)\n\
      \        # Running window for ordered aggregates\n        window = window.rowsBetween(Window.unboundedPreceding, Window.currentRow)\n\
      \n    return window\n```\n"
- phase: 'Phase 4: DataFrame Operations'
  items:
  - summary: Implement union_all and rename_columns
    done: false
    details: "```python\ndef union_all(self, *dataframes: DataFrame) -> DataFrame:\n    \"\"\"Union multiple DataFrames together.\"\
      \"\"\n    if not dataframes:\n        raise ValueError(\"At least one DataFrame required for union\")\n\n    result\
      \ = dataframes[0]\n    for df in dataframes[1:]:\n        result = result.union(df)\n    return result\n\ndef rename_columns(self,\
      \ df: DataFrame, mapping: dict[str, str]) -> DataFrame:\n    \"\"\"Rename columns in a DataFrame.\"\"\"\n    result\
      \ = df\n    for old_name, new_name in mapping.items():\n        if old_name in df.columns:\n            result = result.withColumnRenamed(old_name,\
      \ new_name)\n    return result\n```\n"
  - summary: Implement query plan capture for profiling
    done: false
    details: "```python\ndef explain(self, df: DataFrame, mode: str = \"extended\") -> str:\n    \"\"\"Get the query plan\
      \ for a DataFrame.\n\n    Args:\n        df: DataFrame to explain\n        mode: \"simple\", \"extended\", \"codegen\"\
      , \"cost\", or \"formatted\"\n\n    Returns:\n        Query plan as string\n    \"\"\"\n    # Capture explain output\n\
      \    import io\n    import sys\n\n    old_stdout = sys.stdout\n    sys.stdout = buffer = io.StringIO()\n    try:\n \
      \       df.explain(mode=mode)\n    finally:\n        sys.stdout = old_stdout\n\n    return buffer.getvalue()\n\ndef\
      \ get_query_plan(self, df: DataFrame) -> dict[str, str]:\n    \"\"\"Get both logical and physical query plans.\"\"\"\
      \n    return {\n        \"logical\": self.explain(df, \"simple\"),\n        \"physical\": self.explain(df, \"extended\"\
      ),\n    }\n```\n"
