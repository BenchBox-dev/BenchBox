  notes: "Implementation Notes:\n\n1. **Session Management**: Unlike Polars (stateless), PySpark requires\n   SparkSession\
    \ lifecycle management. The adapter maintains a session\n   and cleans up on close() or garbage collection.\n\n2. **Local\
    \ vs Cluster**: Default to local[*] for development. For\n   cluster mode, pass master=\"spark://host:port\" or use YARN/K8s.\n\
    \n3. **Memory Configuration**: PySpark needs explicit memory settings.\n   Default 4g driver memory; adjust based on scale\
    \ factor.\n\n4. **Shuffle Partitions**: Default 200 is excessive for local mode.\n   Set to CPU count for optimal performance.\n\
    \n5. **AQE**: Adaptive Query Execution improves join performance.\n   Enabled by default; disable for deterministic benchmarking.\n\
    \n6. **Benchmarking Mode**: Disable caching (inMemoryColumnarStorage)\n   to ensure each query execution measures actual\
    \ work.\n\n7. **Query Plans**: Use .explain() to capture plans for profiling.\n   PySpark provides logical and physical\
    \ plans.\n\nReferences:\n- PySpark API: https://spark.apache.org/docs/latest/api/python/\n- DataFrame Guide: https://spark.apache.org/docs/latest/sql-getting-started.html\n\
    - Performance Tuning: https://spark.apache.org/docs/latest/tuning.html\n- Existing Spark SQL adapter: benchbox/platforms/spark.py\n"
