context_sections:
  "Documentation Outline": |
    # PySpark Platform

    ## Overview
    PySpark is a dual-mode platform supporting both SQL and DataFrame execution.

    ## Modes
    - **DataFrame mode** (default): Uses PySpark DataFrame API
    - **SQL mode**: Uses Spark SQL with SQLGlot translation

    ## Requirements
    - Python 3.10+
    - Java 17 or 21 (Java 23+ not supported)
    - pyspark>=3.5.0

    ## Installation
    ```bash
    uv add pyspark
    # or
    benchbox platforms install pyspark
    ```

    ## Usage

    ### DataFrame Mode (default)
    ```bash
    benchbox run --platform pyspark --benchmark tpch --scale 1
    # Equivalent to:
    benchbox run --platform pyspark --mode dataframe --benchmark tpch --scale 1
    ```

    ### SQL Mode
    ```bash
    benchbox run --platform pyspark --mode sql --benchmark tpch --scale 1
    ```

    ## Java Version
    PySpark 4.x requires Java 17 or 21. Java 23+ is not supported due to
    deprecated javax.security.auth.Subject API.

    Check your Java version:
    ```bash
    java -version
    ```

    Set JAVA_HOME if needed:
    ```bash
    export JAVA_HOME=/path/to/java-17
    ```

  "Mode Comparison Table": |
    | Aspect | DataFrame Mode | SQL Mode |
    |--------|---------------|----------|
    | Execution | Native DataFrame API | Spark SQL |
    | Query source | DataFrame expressions | Translated SQL |
    | TPC compliance | Non-compliant (not SQL) | Compliant |
    | Tuning | DataFrame-level | SQL hints, EXPLAIN |
    | Performance | Often faster | Standard SQL |
    | Use case | DataFrame benchmarking | SQL benchmarking |

