title: "Complete Read Primitives DataFrame Implementation (All 136 Queries)"
worktree: dataframe-expansion
priority: Critical
status: Completed
completion_date: "2026-01-26"
category: Core Functionality
description: |
  Complete the DataFrame implementation for ALL 136 Read Primitives queries.

  Current state: 102 queries implemented, 34 remaining
  Target: 133 queries with implementations (only 3 correlated-subquery queries are truly SQL-only)

  This is a CORRECTION to the previous incomplete implementation that incorrectly
  marked 49 queries as "skipped" or "expression-family-only" when they should have
  been implemented.

  KEY INSIGHT: Spark DataFrames are DECLARATIVE, not imperative. They build a logical
  plan that goes through Catalyst optimizer - the same optimizations apply as SQL.
  Therefore, 10 of the 13 "optimizer" queries CAN be tested via DataFrames by writing
  them in "naive" form and letting Catalyst optimize.

context_sections:
  "Research Summary - PySpark DataFrame Capabilities": |
    Based on research of PySpark 4.x DataFrame API, the following operations are
    fully supported and should NOT be skipped:

    **Array Operations** (pyspark.sql.functions):
    - F.explode(col) / F.explode_outer(col) - UNNEST equivalent
    - F.array_contains(col, value) - check if array contains element
    - F.sort_array(col) / F.array_sort(col) - sort array elements
    - F.size(col) / F.array_size(col) - array length
    - F.slice(col, start, length) - array slice
    - F.array_min(col) / F.array_max(col) - min/max of array
    - F.array_distinct(col) - unique elements
    - F.collect_list(col) / F.collect_set(col) - array aggregation

    **Struct Operations**:
    - F.struct(*cols) - create struct from columns
    - df.select("struct_col.field") - access struct field
    - F.from_json(col, schema) - parse JSON to struct
    - F.to_json(col) - convert struct to JSON

    **Map Operations**:
    - F.create_map(*cols) - create map from key-value pairs
    - F.map_keys(col) / F.map_values(col) - extract keys/values
    - df.select("map_col.key") or F.element_at(col, key) - map access

    **Higher-Order Functions** (PySpark 3.1+):
    - F.transform(col, lambda) - apply function to each element
    - F.filter(col, lambda) - filter array elements
    - F.aggregate(col, init, merge) - reduce array to single value

    **QUALIFY Equivalent** (two-step approach):
    - Step 1: Add window column with withColumn()
    - Step 2: Filter on window column with filter()
    - Example: df.withColumn("rn", F.row_number().over(w)).filter(F.col("rn") == 1)

    **CUBE/ROLLUP** (native support):
    - df.groupBy(...).cube(...).agg(...)
    - df.groupBy(...).rollup(...).agg(...)

    **Pivot/Unpivot**:
    - df.groupBy(...).pivot(col).agg(...)
    - df.unpivot(ids, values, variable_col, value_col) - PySpark 3.4+

    Sources:
    - https://sparkbyexamples.com/pyspark/pyspark-explode-array-and-map-columns-to-rows/
    - https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/functions.html
    - https://sparkbyexamples.com/pyspark/pyspark-pivot-and-unpivot-dataframe/
    - https://medium.com/globant/spark-higher-order-functions-f7cc17e8fbf

  "Architecture Requirements": |
    1. **NO direct pandas imports in pandas_impl functions**
       - WRONG: `import pandas as pd` inside function
       - RIGHT: Use ctx.get_table() and DataFrame operations only
       - The runner handles platform-specific imports

    2. **Expression implementations use ctx.col(), ctx.lit()**
       - Use method chaining: df.filter(ctx.col("x") > ctx.lit(100))
       - Window functions via ctx.window_* methods

    3. **Pandas implementations use DataFrame indexing**
       - Use df[df["col"] > 100] for filtering
       - Use df.groupby().agg() for aggregation
       - Handle platform differences (Polars vs Pandas) at runner level

  "Correct Skip List": |
    Only 3 queries should be in SKIP_FOR_DATAFRAME (correlated subquery constructs):
    - optimizer_exists_to_semijoin (correlated EXISTS - no DataFrame equivalent)
    - optimizer_in_to_exists (IN subquery with correlation - no DataFrame equivalent)
    - optimizer_scalar_subquery_flattening (correlated scalar subqueries - no DataFrame equivalent)

    The other 10 optimizer queries ARE implementable in DataFrames because Spark DataFrames
    are DECLARATIVE - they build a logical plan that goes through Catalyst optimizer, just
    like SQL. The key is to write them WITHOUT "baking in" the optimization.

  "Spark DataFrame Execution Model (CRITICAL)": |
    CORRECTION: Spark DataFrames are NOT imperative. They are declarative:
    - DataFrame API builds a logical plan tree
    - Catalyst optimizer rewrites the plan (same rules as SQL)
    - Same optimizations apply: predicate pushdown, join reorder, CSE, column pruning, etc.

    This means most "optimizer probe" queries CAN be tested via DataFrames by:
    1. Writing the "naive" form (filter after join, not before)
    2. Letting Catalyst optimize
    3. Verifying via df.explain("formatted") that the optimization occurred

  "No Hand-Optimization Coding Rules": |
    For optimizer probe queries, follow these rules to avoid baking in the optimization:

    | Optimization Being Tested | WRONG (bakes it in)                    | CORRECT (lets Catalyst optimize)           |
    |---------------------------|----------------------------------------|---------------------------------------------|
    | Predicate pushdown        | Filter before join                     | Filter AFTER join                           |
    | Join reordering           | Order joins by cardinality, add hints  | Keep "bad" join order, no hints             |
    | Limit pushdown            | Pre-limit inputs                       | orderBy().limit() at end                    |
    | Column pruning            | Early select() minimal columns         | Select only at the very end                 |
    | CSE                       | Name expression once, reuse column     | Repeat full expression multiple times       |
    | Constant folding          | Python math: 2*3+4                     | Spark expr: lit(2)*lit(3)+lit(4)            |
    | Aggregate pushdown        | Aggregate before join                  | Join first, then groupBy().agg()            |

  "Plan Capture Requirement": |
    For all optimizer probe queries, the benchmark runner should capture:
    - df.explain("formatted") or df.explain("extended")
    - Spark config snapshot (AQE, CBO, runtime filters, DPP settings)
    - Optional: stage/operator metrics

    This makes optimizer behavior VERIFIABLE, not hand-waved.

  "Quality Assessment - Existing 102 Queries": |
    Assessment of impact from flawed mental model on already-implemented queries:

    **Issue 1: Skip Lists Are Fundamentally Wrong** (HIGH IMPACT)
    - SKIP_FOR_DATAFRAME has 25 queries, should have 3
    - EXPRESSION_FAMILY_ONLY has 24 queries, should be deleted entirely
    - 22 queries incorrectly marked as not-implementable

    **Issue 2: Direct pandas imports in 23 functions** (MEDIUM IMPACT)
    Functions with `import pandas as pd` inside:
    - aggregation_materialize_pandas_impl (line 1438)
    - aggregation_selective_pandas_impl (line 1490)
    - aggregation_simple_pandas_impl (line 1502)
    - count_star_pandas_impl (line 1541)
    - broadcast_join_two_tables_pandas_impl (line 1727)
    - predicate_ordering_aggregation_pandas_impl (line 1752)
    - filter_bigint_non_selective_pandas_impl (line 1810)
    - filter_decimal_non_selective_pandas_impl (line 1843)
    - filter_string_non_selective_pandas_impl (line 1865)
    - string_equal_predicate_pandas_impl (line 2080)
    - string_equal_predicate_lower_pandas_impl (line 2091)
    - string_in_predicate_pandas_impl (line 2102)
    - string_like_predicate_center_pandas_impl (line 2113)
    - string_like_predicate_end_pandas_impl (line 2124)
    - string_like_predicate_start_pandas_impl (line 2135)
    - statistical_percentiles_pandas_impl (line 2344)
    - statistical_variance_stddev_pandas_impl (line 2369)
    - max_by_simple_pandas_impl (line 3051)
    - min_by_simple_pandas_impl (line 3127)
    - max_by_complex_pandas_impl (line 3150)
    - min_by_complex_pandas_impl (line 3173)
    - max_by_with_ties_pandas_impl (line 3199)
    - min_by_with_ties_pandas_impl (line 3223)

    These break compatibility with Modin, Dask, cuDF. Fix by:
    - Using aggregation patterns that return DataFrames
    - Or adding ctx.scalar_to_df() helper

    **Issue 3: Regular queries are mostly OK** (LOW IMPACT)
    The 102 implemented queries are functionally correct. Pre-filtering before
    joins for semi-join patterns is semantically correct, not a mistake.

