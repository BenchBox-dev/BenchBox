context_sections:
  "Research Findings": |
    Analysis of TPC-H errors on Polars SQL mode identified 5 fundamental
    limitations in Polars's SQL implementation:

    | Limitation | Affected Queries | Fixable? |
    |------------|------------------|----------|
    | Implicit joins | 17/22 | Requires SQL rewrite |
    | EXISTS subquery | Q4, Q21 | No - missing feature |
    | Scalar subquery > | Q22 | No - missing feature |
    | Non-equi join | Q13 | No - missing feature |
    | Date comparison | Q1, Q6, Q15 | Partial |

    Even with a SQL transformer for implicit joins, at least 4 TPC-H queries
    would remain broken due to fundamental missing features in Polars SQL.

    References:
    - https://github.com/pola-rs/polars/issues/14217 (chained joins)
    - https://github.com/pola-rs/polars/issues/16907 (multiple tables)
    - https://github.com/pola-rs/polars/issues/3935 (arbitrary expressions)

