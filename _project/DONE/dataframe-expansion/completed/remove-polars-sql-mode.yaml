  created_date: "2026-01-14"

impact:
  business_value: |
    Simplifies codebase by removing non-functional code path. Reduces user
    confusion by not offering a mode that fails on most benchmarks. Aligns
    BenchBox Polars support with Polars's actual design philosophy.
  user_impact: |
    Users can no longer attempt --mode sql with Polars. This is a positive
    change as the SQL mode was essentially broken for all multi-table benchmarks.
    DataFrame mode provides full functionality.
  technical_debt: |
    Removes ~200 lines of SQL-specific code that was effectively dead code
    for most use cases. Simplifies testing and maintenance.

