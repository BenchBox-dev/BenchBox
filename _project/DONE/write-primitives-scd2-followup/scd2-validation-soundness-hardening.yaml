id: "scd2-validation-soundness-hardening"
title: "Harden SCD2 validation naming and document row_hash fingerprint limits"
worktree: "write-primitives-scd2-followup"
priority: "Low"
status: "Completed"
completed_date: "2026-07-08"
category: "Testing and Quality Assurance"
description: |
  SCD2 audit finding #5 (two latent, non-shipping observations).
  (1) The validation id one_current_per_business_key (HAVING COUNT(*) <> 1 over
  is_current rows) catches duplicate current versions but not zero-current keys,
  so it enforces "at most one", not "exactly one" as the name implied. Each op
  already backstops the existence side with a positive companion check, so the
  exactly-one guarantee holds collectively. (2) The row_hash '|'-delimited /
  CAST(... AS VARCHAR) fingerprint is TPC-H-safe (0 pipe chars at SF0.01,
  same-engine comparison) but not injection-safe over arbitrary data.
  Decision (w0): rename the invariant honestly (no hot-path SQL change, so the
  benchmark timings the blog cites are unaffected) and document the fingerprint's
  safety assumptions in code.

work:
  - id: w0
    summary: "Re-ran the zero-current probe: at_most check caught 0 offending, companion every_changed_key_has_current_staged_version caught 20 -> backstop confirmed, hardening-only."
    status: done
  - id: w1
    summary: "Renamed one_current_per_business_key -> at_most_one_current_per_business_key across all 3 SCD2 ops in operations.yaml and the registration assertion in test_write_primitives_core.py:625."
    status: done
  - id: w2
    summary: "Documented _scd2_row_hash_expr safety in code: same-engine comparison only, and '|' delimiter collision-safety scoped to TPC-H (0 pipe chars); flags reuse over arbitrary data."
    status: done
  - id: w3
    summary: "Ran SCD2 unit + DuckDB integration tests (16 -k scd2 + 59 core unit, all green); ruff check/format clean on touched files."
    needs: [w1, w2]
    status: done

sections:
  "Implementation Summary": |
    Rename + documentation only; no operation or validation SQL semantics
    changed, so measured write times are unaffected. The exactly-one-current
    invariant remains enforced collectively by the renamed at-most-one check plus
    each op's positive companion existence check
    (every_changed_key_has_current_staged_version /
    every_new_key_present_as_current). Chose rename over adding a stronger
    predicate specifically to avoid perturbing the benchmark hot path.
  "Verification": |
    Zero-current probe bound the "backstopped" claim (at-most check 0, companion
    20). Catalog parses with the renamed id on all three ops and none on the old
    id. pytest -k scd2 (16) and the full core unit file (59) pass; ruff clean.

