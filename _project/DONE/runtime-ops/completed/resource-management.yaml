completed_date: "2025-11-28"
implementation_notes: |
  Created two new modules in benchbox/utils/:
  - timeout_manager.py: Cross-platform timeout enforcement using threading
  - resource_limits.py: Configurable resource limits with warning thresholds

  Updated execution_manager.py to integrate:
  - PowerRunExecutor: timeout per iteration, resource monitoring, usage reporting
  - ConcurrentQueryExecutor: stream timeouts, resource monitoring

  Features implemented:
  - Configurable memory limits (hard limit, warning %, critical %)
  - CPU usage warnings (informational)
  - Timeout enforcement via TimeoutManager context manager
  - ResourceLimitMonitor background thread for sampling
  - Graceful degradation support (trigger on memory threshold)
  - ResourceUsageSummary for reporting (peak/avg memory, CPU, warnings)

  All features are opt-in via configuration and work with existing code.
