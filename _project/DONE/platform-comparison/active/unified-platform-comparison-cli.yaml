- Single `benchbox compare` command with --run handles SQL, DataFrame, and mixed
- 80%+ code reuse between SQL and DataFrame comparison paths
- Unified documentation in one guide
- Backwards compatibility with existing compare-dataframes workflows
- All visualization types work for both SQL and DataFrame

