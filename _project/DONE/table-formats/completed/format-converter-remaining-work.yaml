  - id: phase3_manifest_v2
    title: "Phase 3.2: Implement Manifest v2"
    priority: critical
    estimated_hours: 2-3
    status: open
    description: |
      Extend manifest schema to track multiple formats per table.

      **Current Manifest v1**:
      ```json
      {
        "benchmark": "tpch",
        "scale_factor": 1,
        "tables": {
          "customer": {
            "files": ["customer.tbl"],
            "rows": 150000,
            "size_bytes": 24000000
          }
        }
      }
      ```

      **New Manifest v2**:
      ```json
      {
        "version": 2,
        "benchmark": "tpch",
        "scale_factor": 1,
        "format_preference": ["parquet", "delta", "tbl"],
        "tables": {
          "customer": {
            "formats": {
              "tbl": {
                "files": ["customer.tbl"],
                "rows": 150000,
                "size_bytes": 24000000
              },
              "parquet": {
                "files": ["customer.parquet"],
                "rows": 150000,
                "size_bytes": 10500000,
                "converted_from": "tbl",
                "conversion_timestamp": "2025-11-23T10:00:00Z",
                "row_groups": 8,
                "compression": "snappy"
              }
            }
          }
        }
      }
      ```

      **Implementation**:
      1. Add manifest version detection
      2. Support both v1 (backward compat) and v2
      3. Add format preference resolution
      4. Update manifest writer for conversions
      5. Update DataSourceResolver to use preferred format

      **Files to Modify**:
      - benchbox/core/base_benchmark.py (manifest I/O)
      - benchbox/platforms/base/data_loading.py (format selection)
      - benchbox/core/validation.py (manifest validation)

      **Migration Strategy**:
      - Read v1 → auto-upgrade to v2 structure in memory
      - Write v2 for new conversions
      - Never modify original v1 manifests

    acceptance_criteria:
