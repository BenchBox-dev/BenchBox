technical_notes: |
  ## Architecture Overview

  Format conversion fits into benchmark lifecycle:
  1. Data generation (TBL files) ← EXISTING
  2. **[NEW]** Format conversion (TBL → Parquet/Delta/Iceberg)
  3. **[UPDATED]** Manifest v2 tracks multiple formats
  4. Data loading uses preferred format ← UPDATE NEEDED
  5. Query execution ← NO CHANGES

  ## Key Integration Points

  - `benchbox/core/runner/runner.py` - Add conversion orchestration
  - `benchbox/core/base_benchmark.py` - Manifest v2 support
  - `benchbox/cli/run.py` - Add --convert-format flag
  - `benchbox/platforms/base/data_loading.py` - Format preference system

