  - id: phase5_registry_pattern
    title: "Phase 5.3: Implement FormatConverterRegistry"
    priority: low
    estimated_hours: 1
    status: open
    description: |
      Add factory pattern for converter discovery.

      **Current**:
      ```python
      from benchbox.utils.format_converters import ParquetConverter
      converter = ParquetConverter()
      ```

      **Desired**:
      ```python
      from benchbox.utils.format_converters import FormatConverterRegistry
      converter = FormatConverterRegistry.get("parquet")
      ```

      **Implementation**:
      ```python
      class FormatConverterRegistry:
          \"\"\"Central registry for format converters.\"\"\"

          _converters: dict[str, type[FormatConverter]] = {
              "parquet": ParquetConverter,
              "delta": DeltaConverter,
              "iceberg": IcebergConverter,
          }

          @classmethod
          def get(cls, format_name: str) -> FormatConverter:
              \"\"\"Get converter instance by format name.\"\"\"
              converter_class = cls._converters.get(format_name.lower())
              if not converter_class:
                  available = ", ".join(cls._converters.keys())
                  raise ValueError(
                      f"Unknown format '{format_name}'. "
                      f"Available formats: {available}"
                  )
              return converter_class()

          @classmethod
          def register(cls, format_name: str, converter_class: type[FormatConverter]) -> None:
              \"\"\"Register a custom converter.\"\"\"
              cls._converters[format_name.lower()] = converter_class

          @classmethod
          def list_formats(cls) -> list[str]:
              \"\"\"List all registered formats.\"\"\"
              return sorted(cls._converters.keys())
      ```

      **Benefits**:
      - Extensibility (plugins can register converters)
      - Consistency across codebase
      - Discovery (list_formats())

    acceptance_criteria:
