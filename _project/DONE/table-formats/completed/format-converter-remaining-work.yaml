      # Format Conversion Guide

      ## Overview
      BenchBox supports converting benchmark data to three open table formats...

      ## When to Use Each Format

      ### Parquet
      - **Best for**: Read-heavy analytics, cloud storage
      - **Pros**: Universal support, excellent compression
      - **Cons**: No ACID, no schema evolution
      - **Platforms**: All (DuckDB, DataFusion, ClickHouse, etc.)

      ### Delta Lake
      - **Best for**: ACID requirements, time travel
      - **Pros**: ACID, versioning, optimize/vacuum
      - **Cons**: Databricks-centric
      - **Platforms**: DuckDB (extension), Databricks, Spark

      ### Iceberg
      - **Best for**: Schema evolution, hidden partitioning
      - **Pros**: Vendor-neutral, snapshot management
      - **Cons**: Experimental support in DuckDB
      - **Platforms**: DuckDB (experimental), Trino, Spark

      ## Usage

      ### During Benchmark Run
      \`\`\`bash
      benchbox run --platform duckdb --benchmark tpch --scale 1 --convert-format parquet
      \`\`\`

      ### Standalone Conversion
      \`\`\`bash
      benchbox convert --input data/tpch_sf10 --format parquet --compression zstd
      \`\`\`

      ## Performance Comparison

      | Format  | Size (SF1) | Load Time | Q1 Time | Compression Ratio |
      |---------|-----------|-----------|---------|-------------------|
      | TBL     | 1.2 GB    | 12.5s     | 2.1s    | 1.0x              |
      | Parquet | 450 MB    | 3.2s      | 1.8s    | 2.7x              |
      | Delta   | 480 MB    | 3.8s      | 1.9s    | 2.5x              |
      | Iceberg | 470 MB    | 4.1s      | 2.0s    | 2.6x              |

      ## Partitioning Strategies

