technical_notes: '## Architecture Overview


  Format conversion fits into benchmark lifecycle:

  1. Data generation (TBL files) ← EXISTING

  2. **[NEW]** Format conversion (TBL → Parquet/Delta/Iceberg)

  3. **[UPDATED]** Manifest v2 tracks multiple formats

  4. Data loading uses preferred format ← UPDATE NEEDED

  5. Query execution ← NO CHANGES


  ## Key Integration Points


  - `benchbox/core/runner/runner.py` - Add conversion orchestration

  - `benchbox/core/base_benchmark.py` - Manifest v2 support

  - `benchbox/cli/run.py` - Add --convert-format flag

  - `benchbox/platforms/base/data_loading.py` - Format preference system

  '
tasks:
- id: phase3_orchestration
  title: 'Phase 3.1: Add Conversion Orchestration'
  priority: critical
  estimated_hours: 2-3
  status: open
  description: "Integrate format conversion into benchmark lifecycle runner.\n\n**Implementation**:\n1. Add conversion step\
    \ after data generation in runner.py\n2. Create FormatConversionOrchestrator class\n3. Handle conversion for all tables\
    \ in manifest\n4. Update manifest with converted file paths\n5. Support --convert-format CLI flag\n\n**Files to Modify**:\n\
    - benchbox/core/runner/runner.py\n- benchbox/cli/run.py\n- benchbox/cli/commands/run_benchmark.py\n\n**Key Functions**:\n\
    ```python\ndef _run_format_conversion(\n    benchmark: Any,\n    benchmark_config: BenchmarkConfig,\n    target_format:\
    \ str,\n    conversion_options: ConversionOptions | None = None\n) -> dict[str, list[Path]]:\n    \"\"\"Convert all tables\
    \ to target format.\"\"\"\n    # Get manifest\n    # For each table:\n    #   - Get converter for target format\n    #\
    \   - Convert source files\n    #   - Track converted paths\n    # Return mapping: {table_name: [converted_paths]}\n```\n\
    \n**CLI Integration**:\n```python\n@click.option(\n    \"--convert-format\",\n    type=click.Choice([\"parquet\", \"delta\"\
    , \"iceberg\"], case_sensitive=False),\n    help=\"Convert generated TBL files to specified format\"\n)\n```\n\n**Tests\
    \ Needed**:\n- Unit test: conversion orchestration logic\n- Integration test: full E2E with TPC-H SF0.01\n"
  acceptance_criteria:
  - benchbox run --convert-format parquet works end-to-end
  - All tables converted automatically
  - Conversion errors reported clearly
  - Progress displayed to user
- id: phase3_manifest_v2
  title: 'Phase 3.2: Implement Manifest v2'
  priority: critical
  estimated_hours: 2-3
  status: open
  description: "Extend manifest schema to track multiple formats per table.\n\n**Current Manifest v1**:\n```json\n{\n  \"\
    benchmark\": \"tpch\",\n  \"scale_factor\": 1,\n  \"tables\": {\n    \"customer\": {\n      \"files\": [\"customer.tbl\"\
    ],\n      \"rows\": 150000,\n      \"size_bytes\": 24000000\n    }\n  }\n}\n```\n\n**New Manifest v2**:\n```json\n{\n\
    \  \"version\": 2,\n  \"benchmark\": \"tpch\",\n  \"scale_factor\": 1,\n  \"format_preference\": [\"parquet\", \"delta\"\
    , \"tbl\"],\n  \"tables\": {\n    \"customer\": {\n      \"formats\": {\n        \"tbl\": {\n          \"files\": [\"\
    customer.tbl\"],\n          \"rows\": 150000,\n          \"size_bytes\": 24000000\n        },\n        \"parquet\": {\n\
    \          \"files\": [\"customer.parquet\"],\n          \"rows\": 150000,\n          \"size_bytes\": 10500000,\n    \
    \      \"converted_from\": \"tbl\",\n          \"conversion_timestamp\": \"2025-11-23T10:00:00Z\",\n          \"row_groups\"\
    : 8,\n          \"compression\": \"snappy\"\n        }\n      }\n    }\n  }\n}\n```\n\n**Implementation**:\n1. Add manifest\
    \ version detection\n2. Support both v1 (backward compat) and v2\n3. Add format preference resolution\n4. Update manifest\
    \ writer for conversions\n5. Update DataSourceResolver to use preferred format\n\n**Files to Modify**:\n- benchbox/core/base_benchmark.py\
    \ (manifest I/O)\n- benchbox/platforms/base/data_loading.py (format selection)\n- benchbox/core/validation.py (manifest\
    \ validation)\n\n**Migration Strategy**:\n- Read v1 → auto-upgrade to v2 structure in memory\n- Write v2 for new conversions\n\
    - Never modify original v1 manifests\n"
  acceptance_criteria:
  - Manifest v2 correctly tracks multiple formats
  - Platform adapter loads preferred format automatically
  - Backward compatible with v1 manifests
  - Validation works for both versions
- id: phase3_partitioning
  title: 'Phase 3.3: Implement Partitioning Support'
  priority: high
  estimated_hours: 1-2
  status: open
  description: "Add production-quality partitioning for all converters.\n\n**Current State**: partition_cols option exists\
    \ but:\n- Parquet: Not implemented at all\n- Delta/Iceberg: Passed to library but not validated\n\n**Required Implementation**:\n\
    \n1. **Schema Validation**:\n```python\ndef _validate_partition_columns(\n    partition_cols: list[str],\n    schema:\
    \ dict[str, Any]\n) -> None:\n    \"\"\"Validate partition columns exist in schema.\"\"\"\n    available = {col[\"name\"\
    ] for col in schema[\"columns\"]}\n    for col in partition_cols:\n        if col not in available:\n            raise\
    \ SchemaError(\n                f\"Partition column '{col}' not found in schema. \"\n                f\"Available columns:\
    \ {sorted(available)}\"\n            )\n```\n\n2. **Parquet Hive Partitioning**:\n```python\n# Use pyarrow.dataset for\
    \ partitioned writes\nimport pyarrow.dataset as ds\n\nif opts.partition_cols:\n    ds.write_dataset(\n        combined_table,\n\
    \        output_dir,\n        format=\"parquet\",\n        partitioning=ds.partitioning(\n            pa.schema([combined_table.schema.field(c)\
    \ for c in opts.partition_cols]),\n            flavor=\"hive\"\n        ),\n        basename_template=\"part-{i}.parquet\"\
    \n    )\n```\n\n3. **Delta/Iceberg**: Add validation before passing to library\n\n**Test Cases**:\n- Single partition\
    \ column (e.g., date)\n- Multiple partition columns (e.g., year, month)\n- Invalid partition column → error\n- Non-existent\
    \ column → error\n- Query performance improvement validation\n"
  acceptance_criteria:
  - All converters validate partition columns
  - Parquet implements Hive partitioning
  - Delta/Iceberg work with partitions
  - Tests cover happy path and errors
  - Performance benefit demonstrated (10x on selective queries)
- id: phase4_compliance_validation
  title: 'Phase 4.1: Add TPC Compliance Validation'
  priority: high
  estimated_hours: 2-3
  status: open
  description: "Ensure format conversions preserve TPC compliance.\n\n**Validation Requirements**:\n1. Row counts match exactly\
    \ (already implemented ✅)\n2. Sample data comparison (byte-level for critical columns)\n3. Aggregate checksums (SUM, COUNT,\
    \ MIN, MAX)\n4. Data type preservation\n5. NULL handling consistency\n\n**Implementation**:\n```python\n@dataclass\nclass\
    \ ComplianceValidationResult:\n    is_compliant: bool\n    row_count_match: bool\n    sample_data_match: bool\n    aggregate_checksums_match:\
    \ bool\n    errors: list[str]\n    warnings: list[str]\n    details: dict[str, Any]\n\ndef validate_conversion_compliance(\n\
    \    source_files: list[Path],\n    converted_file: Path,\n    schema: dict[str, Any],\n    format_type: str,\n    sample_size:\
    \ int = 1000\n) -> ComplianceValidationResult:\n    \"\"\"Comprehensive TPC compliance validation.\"\"\"\n\n    # 1. Row\
    \ count (already done via validate_row_count)\n\n    # 2. Sample random rows and compare values\n    source_samples =\
    \ sample_tbl_rows(source_files, sample_size)\n    converted_samples = sample_format_rows(converted_file, format_type,\
    \ sample_size)\n\n    # 3. Compute aggregate checksums\n    source_aggs = compute_aggregates(source_files, schema)\n \
    \   converted_aggs = compute_aggregates_from_format(converted_file, format_type, schema)\n\n    # 4. Compare with tolerance\
    \ for floating point\n    matches = compare_with_tolerance(source_aggs, converted_aggs, fp_tolerance=1e-6)\n\n    return\
    \ ComplianceValidationResult(...)\n```\n\n**Files to Create**:\n- benchbox/utils/format_converters/compliance.py\n\n**Files\
    \ to Modify**:\n- benchbox/utils/format_converters/base.py (add validation call)\n- All converters (call validation after\
    \ conversion)\n"
  acceptance_criteria:
  - Validation catches data loss
  - Validation catches type mismatches
  - Validation passes for correct conversions
  - Floating-point tolerance configurable
  - Results included in ConversionResult
