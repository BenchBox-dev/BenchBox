  - id: phase3_partitioning
    title: "Phase 3.3: Implement Partitioning Support"
    priority: high
    estimated_hours: 1-2
    status: open
    description: |
      Add production-quality partitioning for all converters.

      **Current State**: partition_cols option exists but:
      - Parquet: Not implemented at all
      - Delta/Iceberg: Passed to library but not validated

      **Required Implementation**:

      1. **Schema Validation**:
      ```python
      def _validate_partition_columns(
          partition_cols: list[str],
          schema: dict[str, Any]
      ) -> None:
          """Validate partition columns exist in schema."""
          available = {col["name"] for col in schema["columns"]}
          for col in partition_cols:
              if col not in available:
                  raise SchemaError(
                      f"Partition column '{col}' not found in schema. "
                      f"Available columns: {sorted(available)}"
                  )
      ```

      2. **Parquet Hive Partitioning**:
      ```python
      # Use pyarrow.dataset for partitioned writes
      import pyarrow.dataset as ds

      if opts.partition_cols:
          ds.write_dataset(
              combined_table,
              output_dir,
              format="parquet",
              partitioning=ds.partitioning(
                  pa.schema([combined_table.schema.field(c) for c in opts.partition_cols]),
                  flavor="hive"
              ),
              basename_template="part-{i}.parquet"
          )
      ```

      3. **Delta/Iceberg**: Add validation before passing to library

      **Test Cases**:
      - Single partition column (e.g., date)
      - Multiple partition columns (e.g., year, month)
      - Invalid partition column → error
      - Non-existent column → error
      - Query performance improvement validation

    acceptance_criteria:
      - All converters validate partition columns
      - Parquet implements Hive partitioning
      - Delta/Iceberg work with partitions
      - Tests cover happy path and errors
      - Performance benefit demonstrated (10x on selective queries)

  - id: phase4_compliance_validation
    title: "Phase 4.1: Add TPC Compliance Validation"
    priority: high
    estimated_hours: 2-3
    status: open
    description: |
      Ensure format conversions preserve TPC compliance.

      **Validation Requirements**:
      1. Row counts match exactly (already implemented ✅)
      2. Sample data comparison (byte-level for critical columns)
      3. Aggregate checksums (SUM, COUNT, MIN, MAX)
      4. Data type preservation
      5. NULL handling consistency

      **Implementation**:
      ```python
      @dataclass
      class ComplianceValidationResult:
          is_compliant: bool
          row_count_match: bool
          sample_data_match: bool
          aggregate_checksums_match: bool
          errors: list[str]
          warnings: list[str]
          details: dict[str, Any]

      def validate_conversion_compliance(
          source_files: list[Path],
          converted_file: Path,
          schema: dict[str, Any],
          format_type: str,
          sample_size: int = 1000
      ) -> ComplianceValidationResult:
          """Comprehensive TPC compliance validation."""

          # 1. Row count (already done via validate_row_count)

          # 2. Sample random rows and compare values
          source_samples = sample_tbl_rows(source_files, sample_size)
          converted_samples = sample_format_rows(converted_file, format_type, sample_size)

          # 3. Compute aggregate checksums
          source_aggs = compute_aggregates(source_files, schema)
          converted_aggs = compute_aggregates_from_format(converted_file, format_type, schema)

          # 4. Compare with tolerance for floating point
          matches = compare_with_tolerance(source_aggs, converted_aggs, fp_tolerance=1e-6)

          return ComplianceValidationResult(...)
      ```

