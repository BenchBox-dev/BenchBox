- id: phase5_registry_pattern
  title: 'Phase 5.3: Implement FormatConverterRegistry'
  priority: low
  estimated_hours: 1
  status: open
  description: "Add factory pattern for converter discovery.\n\n**Current**:\n```python\nfrom benchbox.utils.format_converters\
    \ import ParquetConverter\nconverter = ParquetConverter()\n```\n\n**Desired**:\n```python\nfrom benchbox.utils.format_converters\
    \ import FormatConverterRegistry\nconverter = FormatConverterRegistry.get(\"parquet\")\n```\n\n**Implementation**:\n```python\n\
    class FormatConverterRegistry:\n    \\\"\\\"\\\"Central registry for format converters.\\\"\\\"\\\"\n\n    _converters:\
    \ dict[str, type[FormatConverter]] = {\n        \"parquet\": ParquetConverter,\n        \"delta\": DeltaConverter,\n \
    \       \"iceberg\": IcebergConverter,\n    }\n\n    @classmethod\n    def get(cls, format_name: str) -> FormatConverter:\n\
    \        \\\"\\\"\\\"Get converter instance by format name.\\\"\\\"\\\"\n        converter_class = cls._converters.get(format_name.lower())\n\
    \        if not converter_class:\n            available = \", \".join(cls._converters.keys())\n            raise ValueError(\n\
    \                f\"Unknown format '{format_name}'. \"\n                f\"Available formats: {available}\"\n        \
    \    )\n        return converter_class()\n\n    @classmethod\n    def register(cls, format_name: str, converter_class:\
    \ type[FormatConverter]) -> None:\n        \\\"\\\"\\\"Register a custom converter.\\\"\\\"\\\"\n        cls._converters[format_name.lower()]\
    \ = converter_class\n\n    @classmethod\n    def list_formats(cls) -> list[str]:\n        \\\"\\\"\\\"List all registered\
    \ formats.\\\"\\\"\\\"\n        return sorted(cls._converters.keys())\n```\n\n**Benefits**:\n- Extensibility (plugins\
    \ can register converters)\n- Consistency across codebase\n- Discovery (list_formats())\n"
  acceptance_criteria:
  - Registry pattern implemented
  - All existing code uses registry
  - Plugin registration works
  - Tests updated
