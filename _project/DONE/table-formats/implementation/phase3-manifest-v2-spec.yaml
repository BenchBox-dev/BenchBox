id: phase3-manifest-v2-spec
title: 'Phase 3.1: Manifest v2 Implementation Specification'
worktree: table-formats
phase: implementation
priority: Critical
estimated_hours: 2-3
status: Completed
created: 2025-11-23
owner: ''
context: "Current manifest format (v1):\n{\n  \"benchmark\": \"tpch\",\n  \"scale_factor\": 0.01,\n  \"compression\": {...},\n\
  \  \"tables\": {\n    \"customer\": [\n      {\"path\": \"customer.tbl.zst\", \"size_bytes\": 93349, \"row_count\": 1500}\n\
  \    ]\n  }\n}\n\nNeed: Support multiple formats per table while maintaining v1 compatibility.\n"
motivation: 'After format conversion, manifests must track both original TBL files AND

  converted formats (Parquet/Delta/Iceberg). Platform adapters need to:

  1. Discover available formats

  2. Select preferred format for loading

  3. Track conversion metadata


  WITHOUT manifest v2, converted files are orphaned - converters work but

  platform adapters ignore the converted data.

  '
technical_approach: "## Design Principles\n\n1. **Backward Compatibility**: v1 manifests continue to work\n2. **Opt-in v2**:\
  \ Only write v2 when conversions exist\n3. **Migration Path**: Read v1 → upgrade to v2 in-memory → write v2\n4. **Schema\
  \ Evolution**: Extensible for future format additions\n\n## Manifest v2 Schema\n\n```json\n{\n  \"version\": 2,\n  \"benchmark\"\
  : \"tpch\",\n  \"scale_factor\": 0.01,\n  \"compression\": {...},\n  \"format_preference\": [\"parquet\", \"delta\", \"\
  tbl\"],  // NEW\n  \"created_at\": \"2025-11-23T10:00:00Z\",\n  \"generator_version\": \"0.1.0\",\n  \"tables\": {\n   \
  \ \"customer\": {\n      \"formats\": {  // NEW: nested by format\n        \"tbl\": [\n          {\"path\": \"customer.tbl.zst\"\
  , \"size_bytes\": 93349, \"row_count\": 1500}\n        ],\n        \"parquet\": [\n          {\n            \"path\": \"\
  customer.parquet\",\n            \"size_bytes\": 42000,\n            \"row_count\": 1500,\n            \"converted_from\"\
  : \"tbl\",  // NEW\n            \"converted_at\": \"2025-11-23T10:05:00Z\",  // NEW\n            \"compression\": \"snappy\"\
  ,  // NEW\n            \"row_groups\": 1,  // NEW\n            \"conversion_options\": {  // NEW\n              \"merge_shards\"\
  : true,\n              \"validate_row_count\": true\n            }\n          }\n        ]\n      }\n    }\n  }\n}\n```\n\
  \n## Version Detection\n\n```python\ndef detect_manifest_version(manifest_data: dict) -> int:\n    if \"version\" in manifest_data:\n\
  \        return manifest_data[\"version\"]\n    # v1 has tables as dict[str, list]\n    # v2 has tables as dict[str, dict[str,\
  \ dict]]\n    tables = manifest_data.get(\"tables\", {})\n    if tables and isinstance(next(iter(tables.values())), dict):\n\
  \        # Check if it's v2 (has 'formats' key)\n        first_table = next(iter(tables.values()))\n        if \"formats\"\
  \ in first_table:\n            return 2\n    return 1\n```\n"
implementation:
  step1_manifest_models:
    description: Create Pydantic/dataclass models for manifest v1 and v2
    file: benchbox/core/manifest/models.py (NEW FILE)
    code: "from __future__ import annotations\nfrom dataclasses import dataclass, field\nfrom datetime import datetime\nfrom\
      \ typing import Any\n\n@dataclass\nclass FileEntry:\n    \"\"\"Single file entry (v1 format).\"\"\"\n    path: str\n\
      \    size_bytes: int\n    row_count: int\n\n@dataclass\nclass ConvertedFileEntry:\n    \"\"\"File entry with conversion\
      \ metadata (v2).\"\"\"\n    path: str\n    size_bytes: int\n    row_count: int\n    converted_from: str | None = None\n\
      \    converted_at: str | None = None\n    compression: str | None = None\n    row_groups: int | None = None\n    conversion_options:\
      \ dict[str, Any] = field(default_factory=dict)\n\n@dataclass\nclass TableFormats:\n    \"\"\"v2: Multiple formats for\
      \ a single table.\"\"\"\n    formats: dict[str, list[ConvertedFileEntry]]\n\n@dataclass\nclass ManifestV1:\n    \"\"\
      \"Original manifest format.\"\"\"\n    benchmark: str\n    scale_factor: float\n    tables: dict[str, list[FileEntry]]\n\
      \    compression: dict[str, Any] | None = None\n    parallel: int | None = None\n    created_at: str | None = None\n\
      \    generator_version: str | None = None\n\n@dataclass\nclass ManifestV2:\n    \"\"\"Enhanced manifest with multi-format\
      \ support.\"\"\"\n    version: int = 2\n    benchmark: str | None = None\n    scale_factor: float | None = None\n  \
      \  tables: dict[str, TableFormats] = field(default_factory=dict)\n    format_preference: list[str] = field(default_factory=list)\n\
      \    compression: dict[str, Any] | None = None\n    parallel: int | None = None\n    created_at: str | None = None\n\
      \    generator_version: str | None = None\n"
  step2_manifest_io:
    description: Implement v1/v2 readers and writers with migration
    file: benchbox/core/manifest/io.py (NEW FILE)
    code: "import json\nfrom pathlib import Path\nfrom typing import Any\nfrom benchbox.core.manifest.models import ManifestV1,\
      \ ManifestV2, FileEntry, ConvertedFileEntry, TableFormats\n\ndef detect_version(manifest_dict: dict[str, Any]) -> int:\n\
      \    \"\"\"Detect manifest version (1 or 2).\"\"\"\n    if \"version\" in manifest_dict:\n        return manifest_dict[\"\
      version\"]\n\n    # v1: tables -> {table_name: [files]}\n    # v2: tables -> {table_name: {formats: {format: [files]}}}\n\
      \    tables = manifest_dict.get(\"tables\", {})\n    if not tables:\n        return 1\n\n    first_table_value = next(iter(tables.values()))\n\
      \    if isinstance(first_table_value, dict) and \"formats\" in first_table_value:\n        return 2\n\n    return 1\n\
      \ndef load_manifest(manifest_path: Path) -> ManifestV1 | ManifestV2:\n    \"\"\"Load manifest, auto-detecting version.\"\
      \"\"\n    with open(manifest_path) as f:\n        data = json.load(f)\n\n    version = detect_version(data)\n\n    if\
      \ version == 1:\n        return _parse_v1(data)\n    else:\n        return _parse_v2(data)\n\ndef _parse_v1(data: dict)\
      \ -> ManifestV1:\n    \"\"\"Parse v1 manifest.\"\"\"\n    tables = {}\n    for table_name, files in data.get(\"tables\"\
      , {}).items():\n        tables[table_name] = [\n            FileEntry(\n                path=f[\"path\"],\n        \
      \        size_bytes=f[\"size_bytes\"],\n                row_count=f[\"row_count\"]\n            )\n            for f\
      \ in files\n        ]\n\n    return ManifestV1(\n        benchmark=data[\"benchmark\"],\n        scale_factor=data[\"\
      scale_factor\"],\n        tables=tables,\n        compression=data.get(\"compression\"),\n        parallel=data.get(\"\
      parallel\"),\n        created_at=data.get(\"created_at\"),\n        generator_version=data.get(\"generator_version\"\
      )\n    )\n\ndef _parse_v2(data: dict) -> ManifestV2:\n    \"\"\"Parse v2 manifest.\"\"\"\n    tables = {}\n    for table_name,\
      \ table_data in data.get(\"tables\", {}).items():\n        formats_dict = {}\n        for format_name, files in table_data.get(\"\
      formats\", {}).items():\n            formats_dict[format_name] = [\n                ConvertedFileEntry(\n          \
      \          path=f[\"path\"],\n                    size_bytes=f[\"size_bytes\"],\n                    row_count=f[\"\
      row_count\"],\n                    converted_from=f.get(\"converted_from\"),\n                    converted_at=f.get(\"\
      converted_at\"),\n                    compression=f.get(\"compression\"),\n                    row_groups=f.get(\"row_groups\"\
      ),\n                    conversion_options=f.get(\"conversion_options\", {})\n                )\n                for\
      \ f in files\n            ]\n        tables[table_name] = TableFormats(formats=formats_dict)\n\n    return ManifestV2(\n\
      \        version=data.get(\"version\", 2),\n        benchmark=data.get(\"benchmark\"),\n        scale_factor=data.get(\"\
      scale_factor\"),\n        tables=tables,\n        format_preference=data.get(\"format_preference\", []),\n        compression=data.get(\"\
      compression\"),\n        parallel=data.get(\"parallel\"),\n        created_at=data.get(\"created_at\"),\n        generator_version=data.get(\"\
      generator_version\")\n    )\n\ndef upgrade_v1_to_v2(v1: ManifestV1) -> ManifestV2:\n    \"\"\"Migrate v1 manifest to\
      \ v2 structure.\"\"\"\n    tables = {}\n    for table_name, files in v1.tables.items():\n        # Detect format from\
      \ file extension\n        format_name = _detect_format_from_files(files)\n\n        converted_files = [\n          \
      \  ConvertedFileEntry(\n                path=f.path,\n                size_bytes=f.size_bytes,\n                row_count=f.row_count\n\
      \            )\n            for f in files\n        ]\n\n        tables[table_name] = TableFormats(\n            formats={format_name:\
      \ converted_files}\n        )\n\n    return ManifestV2(\n        version=2,\n        benchmark=v1.benchmark,\n     \
      \   scale_factor=v1.scale_factor,\n        tables=tables,\n        format_preference=[format_name, \"tbl\", \"csv\"\
      ],  # Prefer detected format\n        compression=v1.compression,\n        parallel=v1.parallel,\n        created_at=v1.created_at,\n\
      \        generator_version=v1.generator_version\n    )\n\ndef _detect_format_from_files(files: list[FileEntry]) -> str:\n\
      \    \"\"\"Detect format from file extensions.\"\"\"\n    if not files:\n        return \"tbl\"\n\n    path = files[0].path\n\
      \    if \".parquet\" in path:\n        return \"parquet\"\n    elif \".tbl\" in path or \".dat\" in path:\n        return\
      \ \"tbl\"\n    elif \".csv\" in path:\n        return \"csv\"\n    else:\n        return \"tbl\"\n\ndef write_manifest(manifest:\
      \ ManifestV1 | ManifestV2, path: Path) -> None:\n    \"\"\"Write manifest to JSON file.\"\"\"\n    if isinstance(manifest,\
      \ ManifestV1):\n        # Convert v1 to dict\n        data = _manifest_v1_to_dict(manifest)\n    else:\n        # Convert\
      \ v2 to dict\n        data = _manifest_v2_to_dict(manifest)\n\n    with open(path, \"w\") as f:\n        json.dump(data,\
      \ f, indent=2)\n\ndef _manifest_v1_to_dict(manifest: ManifestV1) -> dict:\n    \"\"\"Convert ManifestV1 to dict.\"\"\
      \"\n    tables = {}\n    for table_name, files in manifest.tables.items():\n        tables[table_name] = [\n       \
      \     {\n                \"path\": f.path,\n                \"size_bytes\": f.size_bytes,\n                \"row_count\"\
      : f.row_count\n            }\n            for f in files\n        ]\n\n    return {\n        \"benchmark\": manifest.benchmark,\n\
      \        \"scale_factor\": manifest.scale_factor,\n        \"tables\": tables,\n        \"compression\": manifest.compression,\n\
      \        \"parallel\": manifest.parallel,\n        \"created_at\": manifest.created_at,\n        \"generator_version\"\
      : manifest.generator_version\n    }\n\ndef _manifest_v2_to_dict(manifest: ManifestV2) -> dict:\n    \"\"\"Convert ManifestV2\
      \ to dict.\"\"\"\n    tables = {}\n    for table_name, table_formats in manifest.tables.items():\n        formats_dict\
      \ = {}\n        for format_name, files in table_formats.formats.items():\n            formats_dict[format_name] = [\n\
      \                {\n                    \"path\": f.path,\n                    \"size_bytes\": f.size_bytes,\n     \
      \               \"row_count\": f.row_count,\n                    \"converted_from\": f.converted_from,\n           \
      \         \"converted_at\": f.converted_at,\n                    \"compression\": f.compression,\n                 \
      \   \"row_groups\": f.row_groups,\n                    \"conversion_options\": f.conversion_options\n              \
      \  }\n                for f in files\n            ]\n        tables[table_name] = {\"formats\": formats_dict}\n\n  \
      \  return {\n        \"version\": 2,\n        \"benchmark\": manifest.benchmark,\n        \"scale_factor\": manifest.scale_factor,\n\
      \        \"tables\": tables,\n        \"format_preference\": manifest.format_preference,\n        \"compression\": manifest.compression,\n\
      \        \"parallel\": manifest.parallel,\n        \"created_at\": manifest.created_at,\n        \"generator_version\"\
      : manifest.generator_version\n    }\n"
  step3_format_preference:
    description: Implement format preference resolution system
    file: benchbox/core/manifest/preferences.py (NEW FILE)
    code: "from benchbox.core.manifest.models import ManifestV2\nfrom benchbox.platforms.base.format_capabilities import get_supported_formats\n\
      \ndef get_preferred_format(\n    manifest: ManifestV2,\n    table_name: str,\n    platform_name: str\n) -> str | None:\n\
      \    \"\"\"Get preferred format for a table on a platform.\n\n    Resolution order:\n    1. Manifest format_preference\
      \ (user-specified)\n    2. Platform default preferences\n    3. First available format\n\n    Returns None if no supported\
      \ formats available.\n    \"\"\"\n    table_formats = manifest.tables.get(table_name)\n    if not table_formats:\n \
      \       return None\n\n    available_formats = list(table_formats.formats.keys())\n    if not available_formats:\n \
      \       return None\n\n    # Get platform supported formats (in preference order)\n    platform_formats = get_supported_formats(platform_name)\n\
      \n    # Try manifest preference first\n    for fmt in manifest.format_preference:\n        if fmt in available_formats\
      \ and fmt in platform_formats:\n            return fmt\n\n    # Try platform preference\n    for fmt in platform_formats:\n\
      \        if fmt in available_formats:\n            return fmt\n\n    # Fallback: first available\n    return available_formats[0]\n\
      \ndef get_files_for_format(\n    manifest: ManifestV2,\n    table_name: str,\n    format_name: str\n) -> list[str]:\n\
      \    \"\"\"Get file paths for a specific format.\"\"\"\n    table_formats = manifest.tables.get(table_name)\n    if\
      \ not table_formats:\n        return []\n\n    files = table_formats.formats.get(format_name, [])\n    return [f.path\
      \ for f in files]\n"
  step4_update_converters:
    description: Update converters to write conversion metadata to manifest
    file: benchbox/utils/format_converters/base.py
    changes:
    - Add manifest update capability to ConversionResult
    - Include conversion timestamp
    - Include conversion options used
