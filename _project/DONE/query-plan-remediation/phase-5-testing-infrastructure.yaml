      \ 10\n        )\n        SELECT * FROM cte\n    \"\"\"\n\n    plan = capture_plan_for_query(\"duckdb\", query)\n\n \
      \   # Verify CTE represented in plan\n    assert plan is not None\n    # Should not have cycles (even though query is\
      \ recursive)\n    validate_no_cycles(plan.logical_root)\n"
  - summary: Test UNION with many branches
    done: false
    details: "def test_union_with_20_branches():\n    \"\"\"Test plan for UNION with 20 SELECT statements.\"\"\"\n    selects\
      \ = [f\"SELECT {i} as n\" for i in range(20)]\n    query = \" UNION ALL \".join(selects)\n\n    plan = capture_plan_for_query(\"\
      duckdb\", query)\n\n    # Verify all branches captured\n    assert count_union_branches(plan.logical_root) == 20\n"
  - summary: Test special characters in identifiers
    done: false
    details: "def test_plan_with_special_characters():\n    \"\"\"Test plan with special characters in table/column names.\"\
      \"\"\n    query = '''\n        SELECT \"col with spaces\", \"col-with-dashes\", \"col_with_émoji\"\n        FROM \"\
      table with spaces\"\n        WHERE \"col with spaces\" > 10\n    '''\n\n    plan = capture_plan_for_query(\"duckdb\"\
      , query)\n\n    # Verify special characters preserved\n    assert plan is not None\n    # Check table name in scan operator\n\
      \    scan = find_scan_operator(plan.logical_root)\n    assert scan.table_name == \"table with spaces\"\n"
  - summary: Test extremely long identifiers
    done: false
    details: "def test_plan_with_long_table_name():\n    \"\"\"Test plan with 1000 character table name.\"\"\"\n    long_name\
      \ = \"t\" * 1000\n    query = f\"SELECT * FROM {long_name}\"\n\n    plan = capture_plan_for_query(\"duckdb\", query)\n\
      \n    # Verify long name handled\n    assert plan is not None\n    scan = find_scan_operator(plan.logical_root)\n  \
      \  assert scan.table_name == long_name\n"
  - summary: Test circular reference protection
    done: false
    details: "def test_serialization_circular_reference_protection():\n    \"\"\"Test that circular references don't cause\
      \ infinite loop.\"\"\"\n    # Manually create invalid plan with cycle (shouldn't happen in practice)\n    root = LogicalOperator(operator_type=\"\
      Scan\", ...)\n    child = LogicalOperator(operator_type=\"Filter\", ...)\n    root.children = [child]\n    child.children\
      \ = [root]  # CYCLE!\n\n    plan = QueryPlanDAG(logical_root=root, ...)\n\n    # Serialization should detect cycle and\
      \ raise error\n    with pytest.raises(SerializationError, match=\"cycle\"):\n        plan.to_dict()\n"
- phase: 'Task 5.4: Concurrency Tests'
  description: Test plan capture in parallel execution (throughput phase)
  items:
  - summary: Create concurrency test base
    done: false
    details: "File: tests/integration/test_plan_capture_concurrency.py\n\n@pytest.mark.integration\n@pytest.mark.concurrency\n\
      class TestPlanCaptureConcurrency:\n    \"\"\"Test plan capture with concurrent query execution.\"\"\"\n"
  - summary: Test throughput phase with plan capture
    done: false
    details: "def test_throughput_with_plan_capture():\n    \"\"\"Run throughput phase with plan capture enabled.\"\"\"\n\
      \    results = run_benchmark_with_plans(\n        platform=\"duckdb\",\n        benchmark=\"ssb\",\n        scale=0.1,\n\
      \        phases=[\"throughput\"],\n        num_streams=4\n    )\n\n    # Verify all streams captured plans\n    # Each\
      \ query should have 4 executions (1 per stream)\n    executions_per_query = {}\n    for execution in results.query_executions:\n\
      \        executions_per_query.setdefault(execution.query_id, []).append(execution)\n\n    for query_id, executions in\
      \ executions_per_query.items():\n        assert len(executions) == 4\n        # Verify each has plan\n        for execution\
      \ in executions:\n            assert execution.query_plan is not None\n"
  - summary: Test parser thread safety
    done: false
    details: "def test_parser_thread_safety():\n    \"\"\"Test that parser can handle concurrent parse calls.\"\"\"\n    parser\
      \ = DuckDBQueryPlanParser()\n    explain_output = load_fixture(\"sample_explain.txt\")\n\n    def parse_in_thread():\n\
      \        return parser.parse_explain_output(\n            f\"query_{threading.get_ident()}\",\n            explain_output\n\
      \        )\n\n    with concurrent.futures.ThreadPoolExecutor(max_workers=4) as executor:\n        futures = [executor.submit(parse_in_thread)\
      \ for _ in range(10)]\n        plans = [f.result() for f in futures]\n\n    # Verify all parses succeeded\n    assert\
      \ all(p is not None for p in plans)\n\n    # Verify operator IDs are unique per plan (not shared state)\n    id_sets\
      \ = [collect_operator_ids(p.logical_root) for p in plans]\n    for ids in id_sets:\n        # Each plan should have\
      \ low IDs (1, 2, 3, ...)\n        assert min(ids) == 1\n"
  - summary: Test race conditions in capture state
    done: false
    details: "def test_no_race_conditions_in_capture_counters():\n    \"\"\"Test that concurrent captures don't corrupt counters.\"\
      \"\"\n    # Run benchmark with multiple streams\n    results = run_benchmark_with_plans(\n        platform=\"duckdb\"\
      ,\n        benchmark=\"ssb\",\n        scale=0.01,\n        phases=[\"throughput\"],\n        num_streams=4\n    )\n\
      \n    # Verify counters are accurate\n    expected_captures = len(results.query_executions)\n    actual_captures = results.query_plans_captured\n\
      \    actual_failures = results.plan_capture_failures\n\n    assert actual_captures + actual_failures == expected_captures\n"
technical_requirements:
- category: Test Coverage
  items:
  - Overall coverage ≥80% for query plan code
  - Integration tests for all supported platforms
  - Performance tests establish baseline and prevent regressions
  - Edge cases cover unusual but valid inputs
- category: Test Organization
  items:
  - Unit tests in tests/unit/
  - Integration tests in tests/integration/
  - Performance tests in tests/performance/
  - Appropriate pytest markers (integration, performance, slow, platform names)
- category: Performance Validation
  items:
  - Overhead tests assert <10% for typical queries
  - Parser performance <20ms for large plans
  - Comparison performance <50ms for 200 operators
- category: Concurrency Validation
  items:
  - Thread safety verified with concurrent test
  - No shared state corruption
  - All parallel streams capture correctly
