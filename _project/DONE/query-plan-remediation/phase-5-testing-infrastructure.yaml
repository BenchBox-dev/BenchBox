id: phase-5-testing-infrastructure
title: 'Query Plan Remediation - Phase 5: Testing Infrastructure'
worktree: query-plan-remediation
category: Testing & Quality
priority: High
status: Completed
description: 'Build comprehensive testing infrastructure for query plan capture, including

  integration tests across platforms, performance regression tests, edge case

  coverage, and concurrency tests for throughput phase.


  **Current Gap**: No integration tests, minimal edge case coverage, no

  performance tests, no concurrency validation.


  **Target**: ≥80% test coverage with integration, performance, and stress tests.

  '
context_sections:
- name: Current Test Coverage
  summary: 'Existing tests (good unit test coverage):

    - test_query_plan_models.py: 941 lines (unit)

    - test_query_plan_serialization.py: 453 lines (unit)

    - test_comparison.py: 419 lines (unit)

    - test_visualization.py: 319 lines (unit)

    - test_duckdb_parser.py: 361 lines (DuckDB only)


    Missing tests:

    - No integration tests (end-to-end capture in benchmark)

    - No cross-platform tests

    - No performance/overhead tests

    - No concurrency tests (throughput phase)

    - No edge cases (huge plans, malformed data)

    '
- name: Integration Test Requirements
  summary: 'Need tests that verify plan capture works end-to-end:

    - Run actual benchmark with --capture-plans

    - Verify plans present in results JSON

    - Test all supported platforms

    - Test failure modes and recovery

    - Verify results exportable and loadable

    '
- name: Performance Test Requirements
  summary: 'Need tests that measure and validate overhead:

    - Benchmark query with/without plan capture

    - Assert overhead within acceptable bounds (<10%)

    - Test impact on simple queries (worst case)

    - Test impact on complex queries (typical case)

    - Detect performance regressions

    '
- name: Concurrency Test Requirements
  summary: 'Throughput phase runs queries in parallel (4+ streams). Need to verify:

    - Parsers are thread-safe

    - No race conditions in capture

    - All streams capture correctly

    - No corruption of shared state (operator ID counter)

    '
- name: Edge Case Requirements
  summary: 'Need tests for unusual but valid scenarios:

    - Very large plans (1000+ operators)

    - Recursive CTEs

    - UNION/INTERSECT/EXCEPT with many branches

    - Special characters in identifiers

    - Extremely long table names

    - Circular reference protection

    '
impact: 'HIGH - Without comprehensive testing, bugs will reach production and undermine

  trust in the feature. Integration tests catch issues that unit tests miss.

  Performance tests prevent regressions that would invalidate benchmark results.


  - Integration tests validate real-world usage

  - Performance tests ensure acceptable overhead

  - Edge case tests prevent crashes on unusual queries

  - Concurrency tests prevent race conditions

  '
research_value: 'Demonstrates testing strategy for instrumentation features in performance-

  critical tools. Shows importance of testing at multiple levels.

  '
tasks:
- phase: 'Task 5.1: Integration Tests for Plan Capture'
  description: End-to-end tests with actual benchmark execution
  items:
  - summary: Create integration test base class
    done: false
    details: "File: tests/integration/test_plan_capture_base.py\n\nclass PlanCaptureIntegrationTestBase:\n    \"\"\"Base class\
      \ for plan capture integration tests.\"\"\"\n\n    def run_benchmark_with_plans(self, platform, benchmark,\n       \
      \                         scale, **kwargs):\n        \"\"\"Run benchmark with plan capture enabled.\"\"\"\n        config\
      \ = BenchmarkConfig(\n            platform=platform,\n            benchmark=benchmark,\n            scale_factor=scale,\n\
      \            capture_plans=True,\n            **kwargs\n        )\n        results = run_benchmark(config)\n       \
      \ return results\n\n    def assert_plans_captured(self, results, expected_count):\n        \"\"\"Assert expected number\
      \ of plans captured.\"\"\"\n        assert results.query_plans_captured == expected_count\n\n    def assert_plan_valid(self,\
      \ plan):\n        \"\"\"Assert plan structure is valid.\"\"\"\n        assert plan is not None\n        assert plan.logical_root\
      \ is not None\n        assert plan.plan_fingerprint is not None\n"
  - summary: Create DuckDB integration test
    done: false
    details: "File: tests/integration/test_plan_capture_duckdb.py\n\n@pytest.mark.integration\n@pytest.mark.duckdb\nclass\
      \ TestDuckDBPlanCapture(PlanCaptureIntegrationTestBase):\n\n    def test_ssb_with_plan_capture(self, tmp_path):\n  \
      \      \"\"\"Run SSB with plan capture, verify all plans captured.\"\"\"\n        results = self.run_benchmark_with_plans(\n\
      \            platform=\"duckdb\",\n            benchmark=\"ssb\",\n            scale=0.01,\n            output_dir=tmp_path\n\
      \        )\n\n        # SSB has 13 queries\n        assert results.query_plans_captured == 13\n\n        # Verify each\
      \ execution has plan\n        for execution in results.query_executions:\n            self.assert_plan_valid(execution.query_plan)\n\
      \n    def test_plan_capture_with_sampling(self, tmp_path):\n        \"\"\"Test sampling reduces number of plans captured.\"\
      \"\"\n        results = self.run_benchmark_with_plans(\n            platform=\"duckdb\",\n            benchmark=\"ssb\"\
      ,\n            scale=0.01,\n            plan_sampling_rate=0.5,\n            output_dir=tmp_path\n        )\n\n    \
      \    # Should capture roughly 50% (statistical test)\n        expected = 13 * 0.5\n        assert abs(results.query_plans_captured\
      \ - expected) < 3\n\n    def test_plan_capture_failure_handling(self, tmp_path, monkeypatch):\n        \"\"\"Test that\
      \ parser failure doesn't break benchmark.\"\"\"\n        # Mock parser to raise exception\n        def mock_parse(*args,\
      \ **kwargs):\n            raise ValueError(\"Mock parse error\")\n\n        monkeypatch.setattr(\n            \"benchbox.parsers.duckdb_parser.DuckDBQueryPlanParser._parse_impl\"\
      ,\n            mock_parse\n        )\n\n        results = self.run_benchmark_with_plans(\n            platform=\"duckdb\"\
      ,\n            benchmark=\"ssb\",\n            scale=0.01,\n            skip_malformed_plans=True,\n            output_dir=tmp_path\n\
      \        )\n\n        # Benchmark should complete despite parse failures\n        assert results.query_executions_completed\
      \ > 0\n        assert results.plan_capture_failures == 13\n"
