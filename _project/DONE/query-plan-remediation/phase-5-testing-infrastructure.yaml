- phase: 'Task 5.2: Performance Regression Tests'
  description: Measure and validate plan capture overhead
  items:
  - summary: Create performance test framework
    done: false
    details: "File: tests/performance/perf_test_base.py\n\nclass PerformanceTestBase:\n    def measure_query_time(self, platform,\
      \ query, iterations=10):\n        \"\"\"Measure query execution time without plan capture.\"\"\"\n        times = []\n\
      \        for _ in range(iterations):\n            start = time.perf_counter()\n            execute_query(platform, query)\n\
      \            times.append(time.perf_counter() - start)\n        return statistics.mean(times), statistics.stdev(times)\n\
      \n    def measure_query_time_with_plans(self, platform, query,\n                                     iterations=10):\n\
      \        \"\"\"Measure query execution time WITH plan capture.\"\"\"\n        # Similar to above but with capture_plans=True\n\
      \n    def assert_overhead_acceptable(self, baseline_time, capture_time,\n                                  max_overhead_pct=10):\n\
      \        \"\"\"Assert overhead is within acceptable range.\"\"\"\n        overhead_pct = ((capture_time - baseline_time)\
      \ / baseline_time) * 100\n        assert overhead_pct < max_overhead_pct, (\n            f\"Plan capture overhead {overhead_pct:.1f}%\
      \ exceeds \"\n            f\"maximum {max_overhead_pct}%\"\n        )\n"
  - summary: Create overhead measurement test
    done: false
    details: "File: tests/performance/test_plan_capture_overhead.py\n\n@pytest.mark.performance\n@pytest.mark.slow\nclass\
      \ TestPlanCaptureOverhead(PerformanceTestBase):\n\n    def test_simple_query_overhead(self):\n        \"\"\"Test overhead\
      \ on simple queries (worst case).\"\"\"\n        query = \"SELECT 1\"\n\n        baseline, _ = self.measure_query_time(\"\
      duckdb\", query)\n        with_capture, _ = self.measure_query_time_with_plans(\"duckdb\", query)\n\n        # For simple\
      \ queries, overhead may be higher percentage\n        # but absolute time should be small (<5ms)\n        overhead_ms\
      \ = (with_capture - baseline) * 1000\n        assert overhead_ms < 5, f\"Overhead {overhead_ms:.2f}ms too high\"\n\n\
      \    def test_complex_query_overhead(self):\n        \"\"\"Test overhead on complex queries (typical case).\"\"\"\n\
      \        query = \"\"\"\n            SELECT l_returnflag, l_linestatus,\n                   sum(l_quantity) as sum_qty\n\
      \            FROM lineitem\n            WHERE l_shipdate <= date '1998-09-02'\n            GROUP BY l_returnflag, l_linestatus\n\
      \            ORDER BY l_returnflag, l_linestatus\n        \"\"\"\n\n        baseline, _ = self.measure_query_time(\"\
      duckdb\", query)\n        with_capture, _ = self.measure_query_time_with_plans(\"duckdb\", query)\n\n        self.assert_overhead_acceptable(baseline,\
      \ with_capture,\n                                       max_overhead_pct=10)\n\n    def test_tpch_overhead(self):\n\
      \        \"\"\"Test overhead on full TPC-H benchmark.\"\"\"\n        # Run full TPC-H with and without plans\n     \
      \   baseline_results = run_benchmark(\n            platform=\"duckdb\",\n            benchmark=\"tpch\",\n         \
      \   scale=0.1,\n            capture_plans=False\n        )\n\n        capture_results = run_benchmark(\n           \
      \ platform=\"duckdb\",\n            benchmark=\"tpch\",\n            scale=0.1,\n            capture_plans=True\n  \
      \      )\n\n        baseline_time = sum(e.execution_time_ms for e in baseline_results.query_executions)\n        capture_time\
      \ = sum(e.execution_time_ms for e in capture_results.query_executions)\n\n        self.assert_overhead_acceptable(baseline_time,\
      \ capture_time,\n                                       max_overhead_pct=10)\n"
  - summary: Create parser performance test
    done: false
    details: "File: tests/performance/test_parser_performance.py\n\n@pytest.mark.performance\nclass TestParserPerformance:\n\
      \n    def test_parse_time_for_large_plan(self):\n        \"\"\"Test parsing time for large plans (100+ operators).\"\
      \"\"\n        # Create or load fixture with large EXPLAIN output\n        large_explain = load_fixture(\"large_plan.txt\"\
      )\n\n        parser = DuckDBQueryPlanParser()\n\n        start = time.perf_counter()\n        plan = parser.parse_explain_output(\"\
      test\", large_explain)\n        parse_time_ms = (time.perf_counter() - start) * 1000\n\n        # Parsing should be\
      \ fast (<20ms even for large plans)\n        assert parse_time_ms < 20, f\"Parse time {parse_time_ms:.2f}ms too slow\"\
      \n\n    def test_comparison_performance(self):\n        \"\"\"Test comparison time for large plans.\"\"\"\n        plan1\
      \ = create_large_plan(num_operators=200)\n        plan2 = create_large_plan(num_operators=200)\n\n        start = time.perf_counter()\n\
      \        comparison = compare_query_plans(plan1, plan2)\n        compare_time_ms = (time.perf_counter() - start) * 1000\n\
      \n        # Comparison should be fast (<50ms for 200 operators)\n        assert compare_time_ms < 50\n"
