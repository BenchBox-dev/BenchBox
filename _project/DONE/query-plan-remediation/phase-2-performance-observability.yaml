- phase: 'Task 2.2: Implement CLI Flags for Sampling'
  description: Add fine-grained control over when plans are captured
  items:
  - summary: Add --plan-sampling-rate flag
    done: false
    details: "File: benchbox/cli/run.py\n\n@click.option(\"--plan-sampling-rate\", type=float, default=1.0,\n            \
      \ help=\"Fraction of query executions to capture plans for (0.0-1.0). \"\n                  \"Example: 0.1 captures\
      \ 10% of executions.\")\n\nValidation: 0.0 <= rate <= 1.0\n"
  - summary: Implement sampling logic in adapter
    done: false
    details: "File: benchbox/platforms/base/adapter.py\n\nimport random\n\ndef capture_query_plan(self, connection, query,\
      \ query_id):\n    if not self.capture_plans:\n        return None, 0.0\n\n    # Apply sampling\n    if random.random()\
      \ > self.config.plan_sampling_rate:\n        return None, 0.0  # Skip this capture\n\n    # ... proceed with capture\n"
  - summary: Add --plan-first-n flag
    done: false
    details: "File: benchbox/cli/run.py\n\n@click.option(\"--plan-first-n\", type=int, default=None,\n             help=\"\
      Capture plans only for first N iterations of each query. \"\n                  \"Example: --plan-first-n 1 captures\
      \ only first iteration.\")\n\nTrack iteration count per query in adapter state.\n"
  - summary: Implement first-N logic in adapter
    done: false
    details: "File: benchbox/platforms/base/adapter.py\n\nclass PlatformAdapter:\n    def __init__(self, ...):\n        self._query_iteration_counts:\
      \ dict[str, int] = {}\n\n    def capture_query_plan(self, connection, query, query_id):\n        if not self.capture_plans:\n\
      \            return None, 0.0\n\n        # Apply first-N filtering\n        if self.config.plan_first_n is not None:\n\
      \            iteration = self._query_iteration_counts.get(query_id, 0)\n            self._query_iteration_counts[query_id]\
      \ = iteration + 1\n            if iteration >= self.config.plan_first_n:\n                return None, 0.0  # Skip,\
      \ already captured N times\n\n        # ... proceed with capture\n"
  - summary: Add --plan-queries flag
    done: false
    details: "File: benchbox/cli/run.py\n\n@click.option(\"--plan-queries\", type=str, default=None,\n             help=\"\
      Comma-separated list of query IDs to capture plans for. \"\n                  \"Example: --plan-queries q01,q05,q17\"\
      )\n\nParse into set of query IDs.\n"
  - summary: Implement query filtering in adapter
