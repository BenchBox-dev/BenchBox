- phase: 'Task 2.3: Implement External Plan Storage'
  description: Store plans in separate files instead of embedding in JSON
  items:
  - summary: Add --plan-storage CLI flag
    done: false
    details: "File: benchbox/cli/run.py\n\n@click.option(\"--plan-storage\", type=click.Choice([\"inline\", \"external\"]),\n\
      \             default=\"inline\",\n             help=\"Store plans inline in results JSON or in external files.\")\n"
  - summary: Create external storage directory structure
    done: false
    details: "When external storage enabled:\n  benchmark_runs/{run_id}/\n    results.json (QueryExecution.query_plan = None)\n\
      \    plans/\n      q01_iter0.plan.json\n      q01_iter1.plan.json\n      q05_iter0.plan.json\n      ...\n"
  - summary: Implement PlanStorage abstraction
    done: false
    details: "File: benchbox/core/results/plan_storage.py\n\nclass PlanStorage(ABC):\n    @abstractmethod\n    def store_plan(self,\
      \ query_id: str, iteration: int,\n                 plan: QueryPlanDAG) -> str:\n        \"\"\"Store plan, return reference.\"\
      \"\"\n\n    @abstractmethod\n    def load_plan(self, reference: str) -> QueryPlanDAG:\n        \"\"\"Load plan from\
      \ reference.\"\"\"\n\nclass InlinePlanStorage(PlanStorage):\n    def store_plan(self, ...) -> str:\n        return \"\
      inline\"  # Signal to embed in JSON\n\nclass ExternalPlanStorage(PlanStorage):\n    def __init__(self, base_dir: Path):\n\
      \        self.plans_dir = base_dir / \"plans\"\n        self.plans_dir.mkdir(exist_ok=True)\n\n    def store_plan(self,\
      \ query_id, iteration, plan) -> str:\n        filename = f\"{query_id}_iter{iteration}.plan.json\"\n        filepath\
      \ = self.plans_dir / filename\n        with open(filepath, 'w') as f:\n            json.dump(plan.to_dict(), f, indent=2)\n\
      \        return f\"plans/{filename}\"\n\n    def load_plan(self, reference: str) -> QueryPlanDAG:\n        filepath\
      \ = self.plans_dir.parent / reference\n        with open(filepath) as f:\n            data = json.load(f)\n        return\
      \ QueryPlanDAG.from_dict(data)\n"
  - summary: Integrate storage selection into adapter
    done: false
    details: "File: benchbox/platforms/base/adapter.py\n\ndef __init__(self, config, ...):\n    if config.plan_storage ==\
      \ \"external\":\n        self.plan_storage = ExternalPlanStorage(results_dir)\n    else:\n        self.plan_storage\
      \ = InlinePlanStorage()\n"
  - summary: Update QueryExecution serialization
    done: false
    details: "File: benchbox/core/results/models.py\n\n@dataclass\nclass QueryExecution:\n    # ... existing fields ...\n\
      \    query_plan: QueryPlanDAG | None = None\n    plan_reference: str | None = None  # NEW: \"plans/q01_iter0.plan.json\"\
      \n\nIn to_dict():\n    if self.plan_reference:\n        # External storage: only include reference\n        result[\"\
      plan_reference\"] = self.plan_reference\n    elif self.query_plan:\n        # Inline storage: full plan\n        result[\"\
      query_plan\"] = self.query_plan.to_dict()\n"
  - summary: Implement lazy loading for external plans
    done: false
    details: "File: benchbox/core/results/loader.py\n\nclass ResultsLoader:\n    def load_plan(self, execution: QueryExecution)\
      \ -> QueryPlanDAG | None:\n        if execution.query_plan:\n            return execution.query_plan\n        if execution.plan_reference:\n\
      \            return self.plan_storage.load_plan(execution.plan_reference)\n        return None\n"
  - summary: Add tests for external storage
    done: false
    details: 'File: tests/unit/core/results/test_plan_storage.py


      - Test: External storage creates plan files

      - Test: Results JSON contains only references

      - Test: Lazy loading reconstructs plans correctly

      - Test: File size comparison (inline vs external)

      '
  - summary: Document storage format stability
    done: false
    details: 'Add docs/storage-format.md explaining:

      - External plan file format

      - Versioning strategy

      - Backward compatibility guarantees

      '
technical_requirements:
- category: Performance Measurement
  items:
  - Timing resolution ≥1ms (use time.perf_counter)
  - Overhead calculation accurate even for sub-ms queries
  - Zero performance impact when capture disabled
- category: Sampling
  items:
  - Sampling rate applied per execution, not per query
  - First-N counter per query, not global
  - Query filter exact match on query_id
- category: Storage
  items:
  - External files use same JSON format as inline
  - Lazy loading on-demand, no preloading
  - File size reduction ≥60% with external storage
- category: Testing
  items:
  - Statistical tests for sampling (chi-square or similar)
  - Integration tests with real benchmark runs
  - Performance regression tests
