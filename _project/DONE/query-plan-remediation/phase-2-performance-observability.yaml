      \ if not self.capture_plans:\n        return None, 0.0\n\n    start_time = time.perf_counter()\n    try:\n        plan\
      \ = self._capture_plan_impl(connection, query, query_id)\n        capture_time_ms = (time.perf_counter() - start_time)\
