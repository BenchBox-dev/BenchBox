id: phase-2-performance-observability
title: 'Query Plan Remediation - Phase 2: Performance & Observability'
worktree: query-plan-remediation
category: Performance
priority: Critical
status: Completed
description: 'Add performance measurement and observability for query plan capture to

  understand and control the overhead introduced by plan capture. Implement

  sampling and external storage options to minimize impact on benchmark results.


  **Problems Addressed**:

  - No measurement of plan capture overhead (could be 5-20% of query time)

  - Cannot sample captures (all-or-nothing with --capture-plans)

  - Plans embedded in JSON inflate result files unbounded

  - No visibility into which queries have expensive EXPLAIN operations

  '
context_sections:
- name: Performance Impact Unknown
  summary: 'Plan capture calls get_query_plan() for EVERY query execution, adding

    overhead from EXPLAIN compilation. For simple queries (SELECT 1, runtime

    0.5ms), EXPLAIN parsing could take longer than the query itself. For TPC-H

    22 queries with 3 iterations = 66 EXPLAIN calls with unknown overhead.


    Without measurement, users cannot assess if capture distorts benchmark

    results. Critical for a benchmarking tool to minimize measurement bias.

    '
- name: No Sampling Capability
  summary: '--capture-plans is binary: all queries or none. Cannot capture plans for:

    - Only first iteration of each query

    - Random 10% sample of executions

    - Specific queries of interest


    This forces users to either accept full overhead or skip capture entirely.

    '
- name: Result File Size Bloat
  summary: 'Plans serialized inline with QueryExecution in results JSON. TPC-H Q17

    with 100+ operators = 15-20KB per execution. 22 queries * 3 iterations *

    15KB = ~1MB of plan data embedded in results. SSB with 13 queries less

    severe but still problematic.


    External storage option would reduce JSON size by 60%+ while preserving

    all plan data in separate files.

    '
impact: 'CRITICAL - Cannot validate that plan capture doesn''t distort benchmark results.

  Users need visibility and control over overhead. Large result files impact

  storage, network transfer, and load times for analysis.


  - Performance measurement enables data-driven decisions about capture usage

  - Sampling reduces overhead while still capturing representative plans

  - External storage solves file size issues for large benchmarks

  '
research_value: 'Demonstrates best practices for instrumentation overhead measurement in

  performance-critical tools. Shows pattern for optional feature overhead

  control and transparency.

  '
