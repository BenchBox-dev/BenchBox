technical_requirements:
- category: Parser Implementation
  items:
  - Each parser extends QueryPlanParser base class
  - All parsers reset operator ID counter per parse
  - Parsers handle format variations gracefully
  - Unknown operator types map to OTHER with warning
- category: Testing
  items:
  - Unit tests with fixture data (no live DB required)
  - Integration tests with real platforms (optional, marked)
  - Test coverage ≥80% for each parser
  - Test all operator type mappings
- category: Documentation
  items:
  - Platform support table maintained
  - Each platform has example EXPLAIN output
  - Known limitations documented
  - Minimum version requirements stated
- category: Error Handling
  items:
  - Parse failures include platform context
  - Format changes detected and reported
  - Graceful degradation on unsupported features
