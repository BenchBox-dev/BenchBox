id: phase-4-platform-coverage
title: 'Query Plan Remediation - Phase 4: Platform Coverage Expansion'
worktree: query-plan-remediation
category: Feature Completion
priority: High
status: Completed
description: 'Expand query plan parser coverage from 2 to 6+ platforms to enable the

  cross-platform comparison use case. Implement parsers for PostgreSQL, Redshift,

  DataFusion, and document platform support clearly.


  **Current State**: Only DuckDB (text) and SQLite parsers exist

  **Target State**: All major platforms supported with documented compatibility


  **Platforms to Add**:

  - PostgreSQL (JSON format from EXPLAIN (FORMAT JSON))

  - Redshift (XML/text format)

  - DataFusion (tree format)

  - Snowflake (JSON format) - stretch goal

  - ClickHouse (tree format) - stretch goal

  - BigQuery (custom format handling) - stretch goal

  '
context_sections:
- name: Current Coverage Gap
  summary: 'Only 2/6 platforms have working parsers:

    - DuckDB: ✓ (text-based box format)

    - SQLite: ✓ (simple tree format, but not tested)

    - PostgreSQL: ✗ (no parser)

    - Redshift: ✗ (get_query_plan exists but no parser)

    - BigQuery: ✗ (returns dict with bytes_processed, not DAG)

    - Snowflake: ✗ (no implementation)

    - DataFusion: ✗ (no implementation)

    - ClickHouse: ✗ (no adapter yet)


    This makes cross-platform comparison impossible for most users.

    '
- name: PostgreSQL EXPLAIN Format
  summary: 'PostgreSQL supports multiple EXPLAIN formats:

    - Text (human-readable, hard to parse)

    - JSON (machine-readable, structured) ← PREFERRED

    - XML (structured but verbose)

    - YAML (structured)


    JSON format provides complete plan tree with node types, join types,

    cost estimates, and row counts. Should use EXPLAIN (ANALYZE, FORMAT JSON)

    for detailed plans.

    '
- name: Redshift Plan Format
  summary: 'Redshift EXPLAIN returns text or XML. Plan includes:

    - Distribution operations (DS_DIST_*, DS_BCAST_*)

    - Network operations

    - Cost estimates

    - Row counts


    Need to parse text format or request XML and parse structure.

    '
- name: DataFusion Plans
  summary: 'DataFusion (Apache Arrow query engine) provides EXPLAIN with:

    - Logical plan (tree format)

    - Physical plan (execution plan)

    - Text representation


    Format similar to other Arrow-based engines. Operators include:

    TableScan, Filter, Projection, HashJoin, HashAggregate, Sort, Limit

    '
impact: 'HIGH - Expanding platform coverage enables the primary use case of cross-

  platform query plan comparison. Currently feature is only usable with DuckDB.


  - PostgreSQL parser enables comparison with most popular open-source DB

  - Redshift parser enables cloud warehouse comparison

  - DataFusion parser covers Arrow ecosystem

  - Documentation prevents user confusion about support

  '
research_value: 'Demonstrates feasibility of harmonizing diverse EXPLAIN formats into unified

  representation. Validates logical operator abstraction across platforms.

  '
tasks:
- phase: 'Task 4.1: Implement PostgreSQL Parser'
  description: Parse PostgreSQL EXPLAIN (FORMAT JSON) output
  items:
  - summary: Create PostgreSQLQueryPlanParser class
    done: false
    details: "File: benchbox/parsers/postgresql_parser.py\n\nclass PostgreSQLQueryPlanParser(QueryPlanParser):\n    def __init__(self):\n\
      \        super().__init__(\"postgresql\")\n\n    def _parse_impl(self, query_id, explain_output):\n        # Parse JSON\
      \ format\n        data = json.loads(explain_output)\n        plan_data = data[0][\"Plan\"]  # Top-level plan node\n\
      \        root = self._parse_plan_node(plan_data)\n        return QueryPlanDAG(\n            query_id=query_id,\n   \
      \         platform=\"postgresql\",\n            logical_root=root,\n            estimated_cost=plan_data.get(\"Total\
      \ Cost\"),\n            estimated_rows=plan_data.get(\"Plan Rows\")\n        )\n"
  - summary: Implement _parse_plan_node() for recursive parsing
    done: false
    details: "def _parse_plan_node(self, node: dict) -> LogicalOperator:\n    node_type = node[\"Node Type\"]\n\n    # Map\
      \ PostgreSQL node types to logical operators\n    operator_type = self._map_node_type(node_type)\n\n    # Extract node-specific\
      \ properties\n    properties = self._extract_properties(node)\n\n    # Parse children recursively\n    children = []\n\
      \    if \"Plans\" in node:\n        for child_node in node[\"Plans\"]:\n            children.append(self._parse_plan_node(child_node))\n\
      \n    return LogicalOperator(\n        operator_type=operator_type,\n        operator_id=self._next_operator_id(),\n\
      \        properties=properties,\n        children=children,\n        # ... other fields\n    )\n"
  - summary: Implement _map_node_type() for operator mapping
    done: false
    details: "def _map_node_type(self, pg_node_type: str) -> LogicalOperatorType:\n    mapping = {\n        \"Seq Scan\":\
      \ LogicalOperatorType.SCAN,\n        \"Index Scan\": LogicalOperatorType.SCAN,\n        \"Bitmap Heap Scan\": LogicalOperatorType.SCAN,\n\
      \        \"Hash Join\": LogicalOperatorType.JOIN,\n        \"Nested Loop\": LogicalOperatorType.JOIN,\n        \"Merge\
      \ Join\": LogicalOperatorType.JOIN,\n        \"Aggregate\": LogicalOperatorType.AGGREGATE,\n        \"HashAggregate\"\
      : LogicalOperatorType.AGGREGATE,\n        \"Sort\": LogicalOperatorType.SORT,\n        \"Limit\": LogicalOperatorType.LIMIT,\n\
      \        # ... more mappings\n    }\n    return mapping.get(pg_node_type, LogicalOperatorType.OTHER)\n"
  - summary: Update PostgreSQL adapter to use parser
    done: false
    details: "File: benchbox/platforms/postgresql/adapter.py\n\ndef get_query_plan(self, connection, query):\n    explain_query\
      \ = f\"EXPLAIN (FORMAT JSON) {query}\"\n    result = connection.execute(explain_query).fetchall()\n    return json.dumps(result[0][0])\
      \  # Return JSON string\n\ndef get_query_plan_parser(self):\n    return PostgreSQLQueryPlanParser()\n"
  - summary: Create test fixtures with PostgreSQL EXPLAIN output
    done: false
    details: "File: tests/fixtures/postgresql_plans.py\n\nSIMPLE_SELECT = \"\"\"\n[{\"Plan\": {\n    \"Node Type\": \"Seq\
      \ Scan\",\n    \"Relation Name\": \"users\",\n    \"Total Cost\": 15.50,\n    \"Plan Rows\": 100\n}}]\n\"\"\"\n\nCOMPLEX_JOIN\
      \ = \"\"\"... (TPC-H Q5 or similar)\"\"\"\n"
  - summary: Create comprehensive parser tests
    done: false
    details: 'File: tests/parsers/test_postgresql_parser.py


      - Test: Simple SELECT parsed correctly

      - Test: JOIN with multiple tables

      - Test: Aggregate with GROUP BY

      - Test: Subquery/CTE

      - Test: Cost and row estimates extracted

      - Test: All PostgreSQL node types mapped

      '
  - summary: Integration test with real PostgreSQL
    done: false
    details: 'File: tests/integration/test_postgresql_plan_capture.py


      Requires PostgreSQL connection. Use pytest marker:

