- phase: 'Task 7.4: Enhanced Error Recovery'
  description: Improve error messages and recovery strategies
  items:
  - summary: Detect common format change patterns
    done: false
    details: "File: benchbox/parsers/error_detection.py\n\ndef detect_format_issues(explain_output: str, platform: str) ->\
      \ list[str]:\n    \"\"\"Detect common reasons for parse failures.\"\"\"\n    issues = []\n\n    if platform == \"duckdb\"\
      :\n        # Check for expected markers\n        if \"┌\" not in explain_output and \"{\" not in explain_output:\n \
      \           issues.append(\n                \"No recognized format markers found. \"\n                \"DuckDB EXPLAIN\
      \ format may have changed.\"\n            )\n\n        # Check encoding issues\n        if any(ord(c) > 127 for c in\
      \ explain_output):\n            try:\n                explain_output.encode('ascii')\n            except UnicodeEncodeError:\n\
      \                issues.append(\n                    \"Non-ASCII characters detected. \"\n                    \"Encoding\
      \ issues may cause parse failures.\"\n                )\n\n    return issues\n"
  - summary: Add format change guidance to errors
    done: false
    details: "When parse fails, include actionable guidance:\n\nraise PlanParseError(\n    query_id=query_id,\n    platform=platform,\n\
      \    error_message=(\n        f\"Parse failed: {original_error}\\n\\n\"\n        f\"Possible causes:\\n\"\n        f\"\
      1. Platform version changed EXPLAIN format\\n\"\n        f\"2. Encoding issues with Unicode characters\\n\"\n      \
      \  f\"3. Parser needs update for new version\\n\\n\"\n        f\"Actions:\\n\"\n        f\"- Check platform version:\
      \ {platform_version}\\n\"\n        f\"- Try --plan-format json if available\\n\"\n        f\"- Report issue with EXPLAIN\
      \ sample\"\n    )\n)\n"
  - summary: Implement parser diagnostics command
    done: false
    details: "File: benchbox/cli/commands/diagnose_parser.py\n\n@click.command(\"diagnose-parser\")\n@click.option(\"--platform\"\
      , required=True)\n@click.option(\"--explain-file\", required=True)\ndef diagnose_parser(platform, explain_file):\n \
      \   \"\"\"Diagnose why parser is failing on EXPLAIN output.\"\"\"\n\n    explain_output = Path(explain_file).read_text()\n\
      \n    print(f\"Diagnosing parser for {platform}\")\n    print(\"=\" * 50)\n\n    # Detect format\n    if explain_output.strip().startswith(\"\
      {\"):\n        print(\"✓ Format detected: JSON\")\n    elif \"┌\" in explain_output:\n        print(\"✓ Format detected:\
      \ Text (box-drawing)\")\n    else:\n        print(\"✗ Format not recognized\")\n\n    # Check encoding\n    try:\n \
      \       explain_output.encode('ascii')\n        print(\"✓ Encoding: ASCII-safe\")\n    except UnicodeEncodeError:\n\
      \        print(\"⚠  Encoding: Contains non-ASCII characters\")\n\n    # Try parsing\n    try:\n        parser = get_parser_for_platform(platform)\n\
      \        plan = parser.parse_explain_output(\"diagnostic\", explain_output)\n        print(f\"✓ Parse successful: {len(collect_operators(plan))}\
      \ operators\")\n    except Exception as e:\n        print(f\"✗ Parse failed: {e}\")\n\n        # Detailed diagnosis\n\
      \        issues = detect_format_issues(explain_output, platform)\n        if issues:\n            print(\"\\nDetected\
      \ issues:\")\n            for issue in issues:\n                print(f\"  - {issue}\")\n"
  - summary: Add parser health checks
    done: false
    details: "File: tests/parsers/test_parser_health.py\n\n@pytest.mark.health\nclass TestParserHealth:\n    \"\"\"Health\
      \ checks for parser robustness.\"\"\"\n\n    def test_parser_handles_empty_output(self):\n        \"\"\"Parser handles\
      \ empty EXPLAIN gracefully.\"\"\"\n        parser = DuckDBQueryPlanParser()\n        with pytest.raises(PlanParseError,\
      \ match=\"empty\"):\n            parser.parse_explain_output(\"test\", \"\")\n\n    def test_parser_handles_malformed_json(self):\n\
      \        \"\"\"Parser handles malformed JSON gracefully.\"\"\"\n        parser = DuckDBQueryPlanParser()\n        with\
      \ pytest.raises(PlanParseError, match=\"JSON\"):\n            parser.parse_explain_output(\"test\", \"{invalid json\"\
      )\n\n    def test_parser_handles_partial_output(self):\n        \"\"\"Parser handles truncated output gracefully.\"\"\
      \"\n        partial = DUCKDB_EXPLAIN[:100]  # Truncated\n        parser = DuckDBQueryPlanParser()\n        with pytest.raises(PlanParseError):\n\
      \            parser.parse_explain_output(\"test\", partial)\n"
technical_requirements:
- category: Format Support
  items:
  - DuckDB parser supports both text and JSON formats
  - JSON format preferred, text as fallback
  - Format detection is automatic
- category: Version Awareness
  items:
  - Parser registry selects based on platform version
  - Multiple parsers per platform supported
  - Version detection implemented for all platforms
- category: Testing
  items:
  - Tests cover multiple platform versions
  - Fixtures represent real-world format variations
  - CI tests against multiple versions
- category: Error Handling
  items:
  - Format issues detected and reported
  - Error messages include actionable guidance
  - Diagnostic tools available
