  description: Test parsers against multiple platform versions
  items:
  - summary: Collect EXPLAIN outputs from multiple versions
    done: false
    details: "File: tests/fixtures/duckdb_plans_by_version.py\n\nDUCKDB_0_9_EXPLAIN = \"\"\"\n┌─────────────────┐\n│   PROJECTION\
      \    │\n│   ─ ─ ─ ─ ─ ─   │\n│        l_*       │\n└─────────────────┘\n\"\"\"\n\nDUCKDB_0_10_EXPLAIN_TEXT = \"\"\"\
