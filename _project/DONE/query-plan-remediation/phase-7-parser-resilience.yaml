  - summary: Create version-parameterized tests
    done: false
    details: "File: tests/parsers/test_duckdb_parser_versions.py\n\n@pytest.mark.parametrize(\"version,explain_output\", [\n\
      \    (\"0.9.0\", DUCKDB_0_9_EXPLAIN),\n    (\"0.10.0\", DUCKDB_0_10_EXPLAIN_TEXT),\n    (\"0.10.0\", DUCKDB_0_10_EXPLAIN_JSON),\n\
      \    (\"1.0.0\", DUCKDB_1_0_EXPLAIN_JSON),\n])\ndef test_parse_duckdb_version(version, explain_output):\n    \"\"\"\
      Test parser handles multiple DuckDB versions.\"\"\"\n    registry = ParserRegistry()\n    # ... register parsers\n \
      \   parser = registry.get_parser(\"duckdb\", version)\n    assert parser is not None\n\n    plan = parser.parse_explain_output(\"\
      test\", explain_output)\n    assert plan is not None\n    assert plan.logical_root is not None\n"
