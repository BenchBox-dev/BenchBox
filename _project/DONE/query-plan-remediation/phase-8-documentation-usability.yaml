- phase: 'Task 8.4: Troubleshooting Guide'
  description: Help users diagnose and fix common issues
  items:
  - summary: Create troubleshooting document
    done: false
    details: 'File: docs/query-plans/troubleshooting.md


      # Query Plan Troubleshooting


      ## No Plans Captured


      **Symptom**: Ran with `--capture-plans` but results show 0 plans.


      **Diagnosis**:

      ```bash

      grep -i "plan" benchmark.log

      # Look for warnings about parser availability

      ```


      **Solutions**:

      1. Check platform is supported: `docs/query-plans/platform-support.md`

      2. Check platform version is compatible

      3. Enable debug logging: `--log-level debug`


      ## Parse Failures


      **Symptom**: Logs show "Failed to parse query plan"


      **Diagnosis**:

      ```bash

      benchbox diagnose-parser --platform duckdb --explain-file explain.txt

      ```


      **Solutions**:

      1. Check EXPLAIN format hasn''t changed (platform upgrade?)

      2. Try alternative format: JSON vs text

      3. Check for encoding issues (Unicode)

      4. Report issue with EXPLAIN sample


      ## High Overhead


      **Symptom**: Benchmark much slower with `--capture-plans`


      **Diagnosis**:

      Check capture overhead in results:

      ```bash

      jq ''.avg_plan_capture_overhead_pct'' results.json

      ```


      **Solutions**:

      1. Use sampling: `--plan-sampling-rate 0.1`

      2. Capture only first iteration: `--plan-first-n 1`

      3. Increase timeout: `--plan-timeout 60`

      4. Use external storage: `--plan-storage external`


      ## Large Result Files


      **Symptom**: results.json is 50MB+


      **Solutions**:

      1. Use external storage: `--plan-storage external`

      2. Reduce captured queries: `--plan-queries q01,q05`

      3. Post-process to extract plans


      ## Comparison Failures


      **Symptom**: `plan-diff` reports no differences but fingerprints differ


      **Diagnosis**: Fingerprints are very sensitive to structure.


      **Explanation**: Even reordering operands can change fingerprint.

      This is intentional - fingerprint detects ANY structural change.


      ## Encoding Issues (Windows)


      **Symptom**: Parse failures on Windows with Unicode errors


      **Solution**:

      Set UTF-8 encoding:

      ```powershell

      $env:PYTHONIOENCODING="utf-8"

      benchbox run ...

      ```

      '
