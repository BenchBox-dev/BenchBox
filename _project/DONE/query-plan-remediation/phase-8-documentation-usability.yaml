category: Documentation
priority: Medium
status: Completed
description: 'Create comprehensive user-facing and developer documentation for the query

  plan feature. Improve CLI help text, add examples, create troubleshooting

  guides, and document API contracts and data formats.


  **Current State**: Minimal documentation, no user guides, unclear limitations

  **Target State**: Complete documentation enabling self-service usage

  '
context_sections:
- name: Insufficient User Documentation
  summary: 'Users don''t know:

    - Which platforms support plan capture

    - What performance impact to expect

    - How to interpret captured plans

    - What to do when capture fails

    - How to compare plans across runs


    No user guide exists, only code comments.

    '
- name: Missing API Documentation
  summary: 'Developers/integrators don''t know:

    - QueryPlanDAG structure and contracts

    - Fingerprint computation algorithm

    - Comparison threshold recommendations

    - Storage format stability guarantees

    - How to write new parsers

    '
- name: Unclear CLI Usage
  summary: 'CLI help text is minimal:

    - No examples provided

    - No performance warnings

    - No link to detailed docs

    - Flags not explained in context

    '
- name: No Troubleshooting Guide
  summary: 'When things go wrong, users don''t know:

    - How to diagnose parser failures

    - What logs to check

    - How to report issues

    - Common problems and solutions

    '
impact: 'MEDIUM - Poor documentation leads to confusion, support burden, and low

  adoption. Users can''t self-serve and give up on the feature.


  - Comprehensive docs reduce support tickets

  - Examples enable quick starts

  - Troubleshooting guides empower users

  - API docs enable extensions

  '
research_value: 'Demonstrates importance of documentation for optional/advanced features.

  Shows value of layered documentation (quick start → deep dive).

  '
tasks:
- phase: 'Task 8.1: User Guide'
  description: Create comprehensive user-facing documentation
  items:
  - summary: Create query plan user guide
    done: false
    details: "File: docs/query-plans/user-guide.md\n\n# Query Plan Capture and Analysis - User Guide\n\n## Overview\nBenchBox\
      \ can capture query execution plans during benchmark runs,\nenabling analysis of query optimization and cross-platform\
      \ comparison.\n\n## Quick Start\n```bash\n# Capture plans for TPC-H benchmark\nbenchbox run --platform duckdb --benchmark\
      \ tpch --scale 1 \\\n             --capture-plans\n\n# View captured plan\nbenchbox show-plan --run results.json --query-id\
      \ q05\n\n# Compare plans across runs\nbenchbox plan-diff --baseline before.json --current after.json\n```\n\n## Supported\
      \ Platforms\n| Platform | Status | Format | Notes |\n|----------|--------|--------|-------|\n| DuckDB   | ✓ Stable |\
      \ Text/JSON | Preferred format: JSON |\n| PostgreSQL | ✓ Stable | JSON | Requires v12+ |\n| DataFusion | ✓ Beta | Text\
      \ | Format may vary |\n| Redshift | ✓ Beta | Text/XML | Distribution ops |\n| SQLite   | Partial | Text | Limited testing\
      \ |\n\n## Performance Impact\nQuery plan capture adds overhead by running EXPLAIN for each query:\n- Typical overhead:\
      \ 3-8% of query time\n- Simple queries: Up to 15% (EXPLAIN time > query time)\n- Complex queries: 2-5%\n\n**Recommendations**:\n\
      - Use `--plan-sampling-rate 0.1` to capture 10% of executions\n- Use `--plan-first-n 1` to capture only first iteration\
      \ per query\n- Measure overhead with performance tests\n\n## Understanding Captured Plans\nPlans contain:\n- **Logical\
      \ operators**: Scan, Filter, Join, Aggregate, Sort, etc.\n- **Physical operators**: Platform-specific (HashJoin, IndexScan)\n\
      - **Cost estimates**: Expected resource usage\n- **Plan fingerprint**: SHA256 hash of logical structure\n\n### Plan\
      \ Fingerprint\nFingerprints enable fast comparison:\n- Based on operator types, join types, table names\n- Excludes\
      \ cost estimates (focus on structure, not optimization)\n- Same fingerprint = same logical plan\n\n## Common Use Cases\n\
      \n### 1. Cross-Platform Comparison\nCompare how different databases optimize the same query:\n```bash\nbenchbox run\
      \ --platform duckdb --benchmark tpch --scale 1 --capture-plans\nbenchbox run --platform postgresql --benchmark tpch\
      \ --scale 1 --capture-plans\nbenchbox plan-diff --baseline duckdb_results.json --current pg_results.json\n```\n\n###\
      \ 2. Regression Detection\nDetect plan changes after upgrades:\n```bash\n# Before upgrade\nbenchbox run --platform duckdb\
      \ --capture-plans > before.json\n\n# After upgrade\nbenchbox run --platform duckdb --capture-plans > after.json\n\n\
      # Compare\nbenchbox plan-diff --baseline before.json --current after.json\n```\n\n### 3. Query Optimization Analysis\n\
      Understand why queries are slow:\n```bash\nbenchbox show-plan --run results.json --query-id q17 --format text\n# Look\
      \ for: full table scans, Cartesian products, missing indexes\n```\n\n## Advanced Options\n\n### Sampling\nReduce overhead\
      \ by capturing subset of executions:\n```bash\n--plan-sampling-rate 0.2  # Capture 20% randomly\n--plan-first-n 1  \
      \         # Only first iteration per query\n--plan-queries q01,q05     # Only specific queries\n```\n\n### Storage\n\
      Store plans externally to reduce result file size:\n```bash\n--plan-storage external  # Plans in separate files\n# Results:\
      \ results.json (small), plans/ directory (plan files)\n```\n\n### Timeouts\nProtect against slow EXPLAIN queries:\n\
      ```bash\n--plan-timeout 60  # Timeout after 60 seconds\n```\n"
  - summary: Create examples and recipes document
    done: false
    details: "File: docs/query-plans/examples.md\n\n# Query Plan Examples and Recipes\n\n## Example 1: Finding Cartesian Products\n\
      Cartesian products are expensive (M × N rows). Detect them:\n```python\nfrom benchbox.analysis import find_cartesian_products\n\
      \nresults = load_results(\"results.json\")\nfor execution in results.query_executions:\n    if execution.query_plan:\n\
      \        cartesian = find_cartesian_products(execution.query_plan)\n        if cartesian:\n            print(f\"{execution.query_id}:\
      \ Cartesian product detected!\")\n```\n\n## Example 2: Comparing Join Strategies\nDifferent platforms may use different\
      \ join algorithms:\n```bash\nbenchbox show-plan --run duckdb.json --query-id q05 | grep -i join\n# Output: HashJoin\n\
      \nbenchbox show-plan --run pg.json --query-id q05 | grep -i join\n# Output: MergeJoin\n```\n\n## Example 3: Tracking\
      \ Plan Evolution\nTrack how plans change over multiple runs:\n```bash\nbenchbox plan-history --query-id q17 --history-dir\
      \ ./history\n# Shows fingerprint changes over time\n```\n"
  - summary: Create FAQ document
    done: false
    details: 'File: docs/query-plans/faq.md


      # Query Plan FAQ


      **Q: Why are no plans captured?**

      A: Check:

      1. Did you specify `--capture-plans`?

      2. Is your platform supported? (See platform support table)

      3. Check logs for warnings about parser availability


      **Q: Can I capture plans for custom queries?**

      A: Not directly, but you can use the API:

      ```python

      from benchbox import capture_plan

      plan = capture_plan(platform="duckdb", query="SELECT ...")

      ```


      **Q: How much storage do plans require?**

      A: Typical: 5-20KB per query. Use `--plan-storage external` for large

      benchmarks to keep result files small.


      **Q: Are fingerprints stable across BenchBox versions?**

      A: Yes, fingerprint algorithm is versioned and backward-compatible.


      **Q: What if EXPLAIN times out?**

      A: Increase timeout with `--plan-timeout 120` or skip that query

      with `--plan-queries` excluding it.

      '
- phase: 'Task 8.2: API Documentation'
  description: Document data structures and APIs for developers
  items:
  - summary: Create API reference for query plan models
    done: false
    details: "File: docs/api/query-plans.md\n\n# Query Plan API Reference\n\n## QueryPlanDAG\nContainer for query plan with\
      \ logical operator tree.\n\n```python\n@dataclass\nclass QueryPlanDAG:\n    query_id: str\n    platform: str\n    logical_root:\
      \ LogicalOperator\n    estimated_cost: float | None\n    estimated_rows: int | None\n    plan_fingerprint: str\n   \
      \ raw_explain_output: str | None\n```\n\n### Methods\n- `to_dict() -> dict`: Serialize to JSON-compatible dict\n- `from_dict(data:\
      \ dict) -> QueryPlanDAG`: Deserialize from dict\n- `compute_plan_fingerprint(root: LogicalOperator) -> str`: Compute\
      \ SHA256 fingerprint\n- `verify_fingerprint() -> bool`: Check fingerprint integrity\n- `refresh_fingerprint() -> None`:\
      \ Recompute fingerprint\n\n### Fingerprint Algorithm\nFingerprint includes:\n- Operator types (Scan, Join, Filter, etc.)\n\
      - Join types (Inner, Left, Right, etc.)\n- Table names\n- Aggregate functions\n\nFingerprint excludes:\n- Cost estimates\n\
      - Row count estimates\n- Operator IDs\n- Platform-specific metadata\n\n**Rationale**: Focus on logical structure, ignore\
      \ optimization details.\n\n## LogicalOperator\nNode in logical operator tree.\n\n```python\n@dataclass\nclass LogicalOperator:\n\
      \    operator_type: LogicalOperatorType\n    operator_id: str\n    properties: dict[str, Any]\n    children: list[\"\
      LogicalOperator\"]\n    # Operator-specific fields\n    table_name: str | None\n    join_type: JoinType | None\n   \
      \ # ...\n```\n\n## Comparison API\n```python\nfrom benchbox.comparisons import compare_query_plans\n\nresult = compare_query_plans(plan1,\
      \ plan2)\n# Returns: ComparisonResult with differences\n```\n"
  - summary: Document parser extension points
    done: false
    details: "File: docs/contributing/parser-development.md\n\n# Developing a New Query Plan Parser\n\n## Overview\nTo add\
      \ support for a new platform, implement a QueryPlanParser subclass.\n\n## Step-by-Step Guide\n\n### 1. Create Parser\
      \ Class\n```python\nfrom benchbox.parsers.base import QueryPlanParser\n\nclass MyPlatformParser(QueryPlanParser):\n\
      \    def __init__(self):\n        super().__init__(\"myplatform\")\n\n    def _parse_impl(self, query_id: str, explain_output:\
      \ str) -> QueryPlanDAG:\n        # Parse explain_output\n        # Build LogicalOperator tree\n        # Return QueryPlanDAG\n\
      ```\n\n### 2. Map Operators\nMap platform-specific operators to LogicalOperatorType:\n```python\ndef _map_operator(self,\
      \ platform_op: str) -> LogicalOperatorType:\n    mapping = {\n        \"TableScan\": LogicalOperatorType.SCAN,\n   \
      \     \"HashJoin\": LogicalOperatorType.JOIN,\n        # ...\n    }\n    return mapping.get(platform_op, LogicalOperatorType.OTHER)\n\
      ```\n\n### 3. Register Parser\n```python\nfrom benchbox.parsers.registry import register_parser\nregister_parser(\"\
      myplatform\", \"1.0\", MyPlatformParser)\n```\n\n### 4. Write Tests\nRequired tests:\n- Simple SELECT\n- JOIN query\n\
      - Aggregate query\n- Complex query (subquery/CTE)\n\n### 5. Update Platform Adapter\n```python\ndef get_query_plan_parser(self):\n\
      \    return MyPlatformParser()\n```\n"
  - summary: Document storage format and stability
    done: false
    details: "File: docs/storage-format.md\n\n# Query Plan Storage Format\n\n## JSON Schema\nPlans are stored as JSON in BenchmarkResults:\n\
      ```json\n{\n  \"query_plan\": {\n    \"query_id\": \"q05\",\n    \"platform\": \"duckdb\",\n    \"plan_fingerprint\"\
      : \"a1b2c3...\",\n    \"logical_root\": {\n      \"operator_type\": \"Project\",\n      \"operator_id\": \"1\",\n  \
      \    \"children\": [...]\n    }\n  }\n}\n```\n\n## Format Versioning\n- Format version 1: Initial implementation (BenchBox\
      \ 1.0)\n- Format version 2: Added validation (BenchBox 1.1) - BACKWARD COMPATIBLE\n\n## Stability Guarantees\n- Fingerprint\
      \ algorithm is versioned and stable\n- Adding fields is backward-compatible\n- Removing fields requires major version\
      \ bump\n- Deserialization handles missing optional fields\n\n## External Storage Format\nWhen using `--plan-storage\
      \ external`, plans are in separate files:\n```\nbenchmark_runs/run123/\n  results.json\n  plans/\n    q01_iter0.plan.json\n\
      \    q01_iter1.plan.json\n    ...\n```\n\nEach `.plan.json` file contains a single QueryPlanDAG.\n"
