id: phase-1-critical-bug-fixes
title: 'Query Plan Remediation - Phase 1: Critical Bug Fixes'
worktree: query-plan-remediation
category: Bug Fixes
priority: Critical
status: Completed
description: 'Fix critical bugs discovered in adversarial review that cause silent failures,

  incorrect behavior, and potential performance/security issues. These are P0

  issues that must be fixed before the query plan feature can be considered

  production-ready.


  **Problems Addressed**:

  - Silent capture failures (no error signaling to user)

  - Operator ID counter leakage across queries (breaks comparison)

  - Unbounded serialization (can cause memory/storage issues)

  - Inefficient BFS queue (O(n) pop operations)

  - No timeout protection on EXPLAIN queries (can hang benchmarks)

  '
context_sections:
- name: Silent Failure Issue
  summary: 'When plan capture fails (parser unavailable, EXPLAIN error, parse failure),

    the code returns None with only a debug-level log message. Users with

    --capture-plans enabled get no indication that capture failed until they

    inspect results and find 0 plans captured.


    Location: benchbox/platforms/base/adapter.py:capture_query_plan()

    '
- name: Operator ID Counter Leakage
  summary: 'DuckDBQueryPlanParser inherits _operator_id_counter from base class but

    never resets it between parse calls. When parsing 22 TPC-H queries, the

    first query gets IDs 1-10, second gets 11-25, etc. This makes cross-query

    comparison impossible because operator IDs are cumulative instead of

    per-query.


    Location: benchbox/parsers/duckdb_parser.py, benchbox/parsers/base.py

    '
- name: Unbounded Serialization
  summary: 'QueryPlanDAG.to_dict() recursively serializes entire operator tree with no

    depth limits or size guards. Large plans (100+ operators) can produce

    megabytes of JSON. Circular references (if introduced by bugs) cause

    infinite recursion. No protection mechanism exists.


    Location: benchbox/core/results/query_plan_models.py:to_dict()

    '
- name: BFS Queue Performance
  summary: 'Plan comparison uses list.pop(0) in BFS traversal, which is O(n). For

    trees with 100+ operators, this creates quadratic behavior. Should use

    collections.deque with popleft() for O(1).


    Location: benchbox/comparisons/query_plan_comparison.py:_compare_operator_trees()

    '
- name: EXPLAIN Timeout Risk
  summary: 'No timeout protection on get_query_plan() calls. If EXPLAIN hangs (buggy

    query, platform issue, network timeout for remote DB), entire benchmark

    hangs indefinitely. User must kill process.


    Location: benchbox/platforms/base/adapter.py:get_query_plan()

    '
impact: 'CRITICAL - These bugs cause incorrect behavior, confusing UX, and potential

  benchmark hangs. Must fix before any production use of query plan feature.


  - Silent failures confuse users who expect plans but get none

  - ID leakage breaks all cross-query comparison functionality

  - Unbounded serialization risks OOM or huge result files

  - BFS performance degrades on complex queries

  - Timeout issue can hang long-running benchmarks

  '
research_value: 'Demonstrates importance of defensive programming in capture paths that run

  during benchmark execution. Shows need for graceful degradation and clear

  error signaling in optional features.

  '
