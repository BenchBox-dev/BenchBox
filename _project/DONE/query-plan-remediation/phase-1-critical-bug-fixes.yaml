- phase: 'Task 1.3: Add Serialization Size Limits'
  description: Protect against unbounded recursion and memory issues
  items:
  - summary: Add max_depth parameter to to_dict()
    done: false
    details: "File: benchbox/core/results/query_plan_models.py\n\ndef to_dict(self, max_depth: int = 50) -> dict[str, Any]:\n\
      \    \"\"\"Serialize to dict with depth protection.\"\"\"\n    return self._to_dict_impl(max_depth=max_depth, current_depth=0)\n\
      \ndef _to_dict_impl(self, max_depth: int, current_depth: int):\n    if current_depth > max_depth:\n        raise SerializationError(f\"\
      Max depth {max_depth} exceeded\")\n    # ... serialize, recurse with current_depth + 1\n"
  - summary: Create SerializationError exception class
    done: false
    details: "File: benchbox/core/errors.py\n\nclass SerializationError(Exception):\n    \"\"\"Raised when plan serialization\
