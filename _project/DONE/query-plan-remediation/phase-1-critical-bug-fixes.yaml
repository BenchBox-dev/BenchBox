technical_requirements:
- category: Error Handling
  items:
  - All failures logged with WARNING or ERROR level (never DEBUG only)
  - User-visible summary at end of benchmark
  - Graceful degradation (continue benchmark unless --strict)
- category: Performance
  items:
  - BFS queue operations must be O(1)
  - Serialization depth limit prevents stack overflow
  - Timeout prevents indefinite hangs
- category: Testing
  items:
  - Unit tests for each bug fix
  - Integration tests for failure modes
  - Performance regression tests
