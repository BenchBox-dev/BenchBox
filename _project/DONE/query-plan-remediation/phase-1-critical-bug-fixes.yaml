      '
- phase: 'Task 1.4: Fix BFS Queue Performance'
  description: Replace list with deque for O(1) operations
  items:
  - summary: Import collections.deque
    done: false
    details: 'File: benchbox/comparisons/query_plan_comparison.py


      from collections import deque

      '
  - summary: Replace list with deque in _compare_operator_trees()
    done: false
    details: "Change:\n  queue: list[tuple[...]] = [(left, right)]\n  while queue:\n      op_left, op_right = queue.pop(0)\
      \  # O(n)\n\nTo:\n  queue: deque[tuple[...]] = deque([(left, right)])\n  while queue:\n      op_left, op_right = queue.popleft()\
      \  # O(1)\n"
  - summary: Verify fix doesn't change comparison behavior
    done: false
    details: 'Run existing comparison tests, ensure all pass.

      BFS order should be identical, just more efficient.

      '
  - summary: Add performance test
    done: false
    details: 'File: tests/performance/test_comparison_performance.py


      - Create plan with 200 operators

      - Time comparison before/after fix

      - Verify speedup

      '
- phase: 'Task 1.5: Add EXPLAIN Timeout Protection'
  description: Prevent benchmarks from hanging on slow EXPLAIN queries
  items:
  - summary: Add plan_capture_timeout_seconds config parameter
    done: false
    details: "File: benchbox/config/benchmark_config.py\n\n@dataclass\nclass BenchmarkConfig:\n    # ... existing fields ...\n\
      \    plan_capture_timeout_seconds: int = 30\n"
  - summary: Wrap get_query_plan() with timeout mechanism
    done: false
    details: "File: benchbox/platforms/base/adapter.py\n\nimport signal\nfrom contextlib import contextmanager\n\n@contextmanager\n\
      def timeout(seconds):\n    def timeout_handler(signum, frame):\n        raise TimeoutError(\"Operation timed out\")\n\
      \    signal.signal(signal.SIGALRM, timeout_handler)\n    signal.alarm(seconds)\n    try:\n        yield\n    finally:\n\
      \        signal.alarm(0)\n\nIn capture_query_plan():\n    try:\n        with timeout(self.config.plan_capture_timeout_seconds):\n\
      \            explain_output = self.get_query_plan(connection, query)\n    except TimeoutError:\n        self.logger.warning(\n\
      \            \"Query plan capture timed out for %s after %ds\",\n            query_id, self.config.plan_capture_timeout_seconds\n\
      \        )\n        return None\n"
  - summary: Add CLI flag --plan-timeout
    done: false
    details: "File: benchbox/cli/run.py\n\n@click.option(\"--plan-timeout\", default=30, type=int,\n             help=\"Timeout\
      \ for EXPLAIN queries (seconds)\")\n"
  - summary: Add tests for timeout behavior
    done: false
    details: 'File: tests/unit/platforms/test_plan_capture_timeout.py


      - Mock slow EXPLAIN query (sleep 40s)

      - Verify timeout after 30s

      - Verify benchmark continues

      - Verify failure counted

      '
  - summary: Document timeout in user guide
