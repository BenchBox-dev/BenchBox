id: dataframe-backwards-compatibility-and-mode-coexistence
title: DataFrame Backwards Compatibility and Mode Coexistence
worktree: dataframe-phase0-compat
category: Core Functionality
priority: Critical
status: Completed
completed_date: '2025-12-02'
description: 'Ensure DataFrame mode coexists with existing SQL mode. Define interaction

  between modes, migration path, and CLI interface for mode selection.

  '
implementation_summary: 'Implemented clean mode separation via platform naming convention:


  Mode Detection:

  - Platform names ending with -df use DataFrame mode

  - polars-df, pandas-df → DataFrame execution

  - All other platforms → SQL execution

  - is_dataframe_execution() and get_execution_mode() helpers


  DataFrame Runner (benchbox/core/runner/dataframe_runner.py):

  - run_dataframe_benchmark() handles complete DataFrame lifecycle

  - DataFramePhases for load/execute phase control

  - DataFrameRunOptions for memory warnings, caching, format preferences

  - Pre-execution memory check and scale factor validation

  - Data loading via DataFrameDataLoader

  - Query execution via platform adapters


  Orchestrator Routing (benchbox/cli/orchestrator.py):

  - Automatic routing based on platform type

  - DataFrame platforms → run_dataframe_benchmark()

  - SQL platforms → run_benchmark_lifecycle()

  - No --mode flag needed - mode determined by platform name


  Result Schema Compatibility:

  - Both modes produce BenchmarkResults

  - execution_metadata["execution_mode"] = "sql" | "dataframe"

  - execution_metadata["dataframe_platform"] for DataFrame runs

  - All existing result fields populated for both modes


  Note: Since project is not yet released, simplified approach used:

  - No --mode flag (platform suffix is mode selector)

  - No migration documentation needed

  - No deprecation policy needed

  '
