title: Implement DataFrame Result Validation Framework
worktree: dataframe-validation
category: Testing and Quality Assurance
priority: High
status: "Completed"
completed_date: '2025-12-02'
description: |
  Create comprehensive validation framework to ensure DataFrame results match
  SQL results and are consistent across platforms.

implementation_summary: |
  Implemented validation framework in benchbox/core/dataframe/validation.py:

  Core Classes:
  - ValidationResult: Dataclass with is_valid, status, errors, warnings, metrics
  - ValidationConfig: Configurable tolerance levels and comparison options
  - ValidationLevel: STRICT, STANDARD, LOOSE modes
  - ComparisonStatus: MATCH, MISMATCH, PARTIAL_MATCH, ERROR
  - DataFrameValidator: Stateful validator with summary reporting

  Core Functions:
  - compare_dataframes(): Sort-invariant comparison with fuzzy float tolerance
  - compare_with_sql(): Compare DataFrame results with SQL results
  - validate_query_result(): Validate against expected row count/columns
  - validate_row_count(): Row count validation with tolerance
  - validate_column_names(): Column schema validation
  - fuzzy_float_compare(): Float comparison with relative/absolute tolerance

  Features:
  - Automatic conversion from Polars, Pandas, or dict inputs
  - Sort-invariant comparison (results may have different ordering)
  - Fuzzy float comparison with configurable tolerance (default 1e-6)
  - NULL handling (NULL == NULL can be configured)
  - Detailed error reporting with metrics

  51 unit tests in tests/unit/core/dataframe/test_validation.py

