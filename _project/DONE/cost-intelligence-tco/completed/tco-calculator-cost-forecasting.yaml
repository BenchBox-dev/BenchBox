completion:
  date: '2025-11-28'
  commits:
  - 2b1beae4: "feat: add TCO (Total Cost of Ownership) calculator"
  implementation_notes: |
    Implemented complete TCO calculator module at benchbox/core/cost/tco.py with:

    Growth Models:
    - GrowthModel enum: NONE, LINEAR, COMPOUND
    - GrowthConfig dataclass with calculate_multiplier() method
    - Supports separate data growth rate vs usage growth rate

    Discount Models:
    - DiscountType enum: NONE, RESERVED, COMMITTED_USE, ENTERPRISE, VOLUME
    - DiscountConfig with delayed start support (effective_start_year)
    - Automatic discount multiplier calculation per year

    Budget Monitoring:
    - BudgetThreshold with monthly/annual/total periods
    - BudgetAlert generation when thresholds exceeded
    - Period conversion (monthly <-> annual)

    TCO Projections:
    - YearlyProjection with base/growth/discount breakdowns
    - TCOProjection with multi-year forecasts
    - Average annual cost and cumulative tracking
    - Full to_dict() serialization

    TCOCalculator:
    - calculate_tco() from BenchmarkCost with annual runs multiplier
    - calculate_tco_from_annual_cost() for direct annual input
    - compare_platforms() for multi-platform TCO comparison
    - Budget threshold management (add/clear)

    Utility Functions:
    - create_standard_tco_scenarios() generates conservative/moderate/aggressive

    Tests: 54 comprehensive unit tests covering all functionality
    Exports added to benchbox.core.cost module __init__.py
