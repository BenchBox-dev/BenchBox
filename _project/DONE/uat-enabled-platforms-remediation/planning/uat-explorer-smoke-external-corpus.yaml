  evidence:
    - "uv run -- python -m pytest tests/uat/test_explorer_smoke.py -m fast -q -> 11 passed"
    - "cd results-explorer && npm run test:e2e:fixtures && npm run build && npx playwright test --grep @smoke --project chromium -> 9 passed"
    - "E2E_FIXTURE_DIR=... npx playwright test --grep @uat-external-corpus --project chromium -> 1 passed"
    - "BENCHBOX_OUTPUT_DIR=/Users/joe/Developer/benchmark_runs make uat-sweep CONFIG=tests/uat/configs/uat-explorer-external-corpus-smoke.yaml -> phase_exit_codes all 0"
    - "/Users/joe/Developer/benchmark_runs/logs/uat_explorer_external_corpus_smoke_20260513/matrix_summary.tsv -> 1 passed / 0 failed / 0 timed out"

impact:
  business_value: |
    Keeps UAT frontend smoke focused on whether packaged results are browsable,
    not whether a particular fixture corpus happened to be present.
  user_impact: |
    Maintainers can trust Explorer smoke failures to identify packaging or UI
    issues in the actual UAT output.
  technical_debt: |
    Separates frontend fixture regression coverage from UAT external-corpus
    validation.

success_metrics:
  - "UAT Explorer smoke passes with any non-empty valid result corpus"
  - "Fixture route tests still catch regressions against the canonical frontend fixtures"
  - "Corpus packaging errors fail before Playwright route assertions"
