- "tests/uat/matrix.py:45-73 -- existing `PLATFORM_EXTRA_OPTS`; Singlestore already passes `password=benchbox` for local UAT"
- "tests/uat/matrix.py:385-419 -- `benchbox_run_argv()` appends local managed Docker platform options only when explicitly requested"
- "docker/postgres-extensions/docker-compose.pg-duckdb.yaml:19-22 -- local service sets `POSTGRES_PASSWORD=benchbox`"
- "docker/postgres-extensions/docker-compose.pg-mooncake.yaml:23-26 -- local service sets `POSTGRES_PASSWORD=benchbox`"
- "docker/postgres-extensions/docker-compose.timescaledb.yaml:22-25 -- local service sets `POSTGRES_PASSWORD=benchbox`"
- "benchbox/platforms/base/config_utils.py:7-18 -- PostgreSQL-family base options include host/user/database/schema but no
  password"
- "benchbox/platforms/pg_duckdb.py:448-481 -- adapter config accepts password via platform options or credentials"
- "benchbox/platforms/pg_mooncake.py:419-445 -- adapter config accepts password via platform options or credentials"
- "benchbox/platforms/timescaledb.py:631-674 -- adapter config accepts password via platform options or credentials"

must_preserve:
- "Managed Docker lifecycle remains sequential on localhost:5432 for PostgreSQL-extension platforms"
- "No credential value is written into user-facing default adapter config outside local UAT managed execution"
- "Cloud/live platform credentials continue to come from credentials/env mechanisms, not UAT hard-coded local values"

approach: |
  Reuse `PLATFORM_EXTRA_OPTS` and the `benchbox_run_argv()` command builder
  rather than special-casing PostgreSQL-family adapters. Keep the credential
  value aligned with the existing Docker compose files and usage comments.

anti_patterns:
- "DO NOT make the adapters silently default to `benchbox` passwords - that would leak local test assumptions into user-managed
  deployments"
- "DO NOT weaken Docker lifecycle checks - `uat_lifecycle.log` already shows lifecycle success and the defect is runtime command
  construction"
- "DO NOT mark PostgreSQL-extension benchmarks incompatible based on the 2026-05-12 run until the auth blocker is fixed"

verification:
- description: "UAT matrix and Docker asset unit coverage passes"
  command: "uv run -- python -m pytest tests/uat/test_matrix.py tests/uat/test_docker_assets.py -m fast -q"
  expected_output: "passes and includes assertions for pg-duckdb, pg-mooncake, and timescaledb password propagation"
- description: "Generated UAT argv includes local password for PostgreSQL-extension platforms"
  command: "uv run -- python - <<'PY'\nfrom tests.uat.matrix import benchbox_run_argv\nfor platform in ['pg-duckdb', 'pg-mooncake',
    'timescaledb']:\n    argv = benchbox_run_argv(platform, 'tpch', 0.01, extra_args=[], local_managed_platform=True)\n    print(platform, 'password=benchbox'
    in argv)\nPY"
  expected_output: "Each platform prints True"
- description: "Managed smoke reaches past authentication"
  command: "BENCHBOX_OUTPUT_DIR=~/Developer/benchmark_runs make uat-sweep CONFIG=tests/uat/configs/uat-pg-extension-auth-smoke.yaml"
  expected_output: "No cell for pg-duckdb, pg-mooncake, or timescaledb fails with `fe_sendauth: no password supplied`"

