id: uat-pg-extension-auth-propagation
title: "UAT: propagate PostgreSQL extension Docker credentials into runtime cells"
worktree: uat-enabled-platforms-remediation
priority: Critical
status: Completed
category: Testing and Quality Assurance

description: |
  The corrected enabled-platform UAT run from 2026-05-12 failed every
  `pg-duckdb`, `pg-mooncake`, and `timescaledb` cell before benchmark-specific
  execution with `fe_sendauth: no password supplied`.

  Evidence is in `/Users/joe/Developer/benchmark_runs/logs/uat_enabled_today_platforms_20260512`:
  `command-status.json` returned 2 after 1036.4s; `matrix_summary.tsv` recorded
  22/22 failures for each PostgreSQL-extension platform; `cells.jsonl` shows the
  first error as a missing password; `uat_lifecycle.log` shows managed Docker
  startup and teardown succeeded for those services.

  The Docker compose files set `POSTGRES_PASSWORD=benchbox`, and adapter configs
  accept a password. The UAT matrix builder does not pass one for these local
  managed services, while `singlestore` already has an explicit local password
  option. Fix the UAT harness/config path so local managed PostgreSQL-family
  cells receive the credentials required by their compose stacks.

work:
- id: w0
  summary: "Revalidate the auth failure on current code before editing"
  status: done
  notes: |
    Capture a compact summary from the retained artifact directory and, if the
    local Docker stack is available, one targeted current-code repro for a
    single `pg-duckdb` cell. Record command, checked SHA, exit status, and the
    key auth line in the implementation PR or TODO update. Do not commit raw
    stdout logs.

    Completed on 2026-05-12 at git SHA checked by implementation branch:
    prior artifact command-status returned 2 after 1036.4s, and
    `matrix_summary.tsv` contained 22/22 failed rows for each of `pg-duckdb`,
    `pg-mooncake`, and `timescaledb`. Retained per-cell logs contained
    `fe_sendauth: no password supplied` for the PostgreSQL-extension cells.

- id: w1
  summary: "Add explicit local-UAT credentials for PostgreSQL-family platforms"
  needs: [w0]
  status: done
  notes: |
    Extend the existing platform-option mechanism used by `benchbox_run_argv`
    so `pg-duckdb`, `pg-mooncake`, `timescaledb`, and local `postgresql` cells
    use `password=benchbox` when run against the project-managed Docker
    compose services. Keep this scoped to UAT/local managed execution; do not
    change adapter defaults for user-managed or cloud deployments.

- id: w2
  summary: "Cover generated argv and Docker asset expectations with tests"
  needs: [w1]
  status: done
  notes: |
    Add assertions that the generated UAT argv includes the required
    `--platform-option password=benchbox` for the PostgreSQL-extension
    platforms and that the compose files still advertise the same password.
    Existing Singlestore coverage is the pattern to extend.

- id: w3
  summary: "Run one managed-Docker smoke per PostgreSQL-extension platform"
  needs: [w2]
  status: done
  notes: |
    With `BENCHBOX_OUTPUT_DIR=~/Developer/benchmark_runs`, run a minimal
    managed UAT or single-cell smoke for `pg-duckdb`, `pg-mooncake`, and
    `timescaledb` that reaches benchmark setup past authentication. The
    success criterion for this TODO is eliminating `fe_sendauth: no password
    supplied`; benchmark-specific failures belong to downstream TODOs.

    Completed with:
    `BENCHBOX_OUTPUT_DIR=~/Developer/benchmark_runs make uat-sweep CONFIG=tests/uat/configs/uat-pg-extension-auth-smoke.yaml`.
    The run directory was
    `/Users/joe/Developer/benchmark_runs/logs/uat_pg_extension_auth_smoke_20260512`.
    Initial attempts proved auth was no longer the blocker but exposed
    downstream runtime failures in `pg-duckdb` and `pg-mooncake`. Per the
    implementation instruction, investigation continued until the smoke
    produced working runs rather than stopping at "not auth".

    Final clean managed run completed with execute/report exit code 0:
    `matrix_summary.tsv` recorded 3/3 passed and 0 failed for `pg-duckdb`,
    `pg-mooncake`, and `timescaledb`. Result bundles were:
    `/Users/joe/Developer/benchmark_runs/results/tpch_sf001_pg_duckdb_sql_20260512_200944_817eb953.json`,
    `/Users/joe/Developer/benchmark_runs/results/tpch_sf001_pg_mooncake_sql_20260512_200958_b268ef93.json`,
    and
    `/Users/joe/Developer/benchmark_runs/results/tpch_sf001_timescaledb_sql_20260512_201138_c2122fd0.json`.
    No cell log contained `fe_sendauth` or `no password supplied`, and
    `uat_lifecycle.log` showed managed Docker startup and teardown succeeded
    for all three extension platforms.

deferred:
- summary: "Change adapter-level credential defaults"
  reason: "The observed failure is UAT harness auth propagation for managed Docker, not a proven adapter default defect."
- summary: "Stop at auth classification only"
  reason: "Rejected by 2026-05-12 implementation instruction: the goal was working runs, so downstream runtime blockers were fixed in the same slice."

