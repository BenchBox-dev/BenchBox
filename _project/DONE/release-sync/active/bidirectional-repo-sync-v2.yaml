context_sections:
  "Lessons from Failed Implementation": |
    The previous sync module (benchbox/release/sync.py) was removed because:
    1. Built separate filtering logic that duplicated and diverged from prepare_release.py
    2. Left 1000+ files uncommitted in public repo
    3. Overwrote newer .github/workflows files with older versions
    4. ~800 lines of code that should have been ~200 lines

  "Design Principles": |
    1. Reuse prepare_release.py infrastructure for filtering
    2. Always commit after sync (never leave uncommitted files)
    3. Git-based diff for direction awareness
    4. Minimal new code - extend existing scripts
    5. Explicit conflict handling - never silently overwrite

