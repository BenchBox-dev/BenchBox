title: "Bidirectional Repository Sync (Redesigned)"
worktree: "release-sync"
priority: "High"
status: "Completed"
category: "Core Functionality"
completed_date: "2026-01-18"

description: |
  Implement bidirectional sync between private (BenchBox) and public (BenchBox-public)
  repositories. This is a redesign after the previous implementation failed due to:
  - Building separate filtering logic that ignored DOCS_DIR_EXCLUDES, CLAUDE_DIR_EXCLUDES
  - Copying files without committing them
  - No awareness of which version was newer
  - Silently overwriting public repo changes

  The new design reuses existing prepare_release.py infrastructure and always commits
  after sync operations.

completion_summary: |
  Implemented bidirectional repository sync with ~280 lines of new code (workflow.py: ~200 lines,
  sync_repos.py: ~370 lines). All success metrics met:
  - status command correctly excludes docs/_build, .claude/settings.local.json, and FORBIDDEN_PATTERNS
  - push command creates git commit in public repo
  - Conflicts detected and require --force to overwrite
  - 31 unit tests passing

