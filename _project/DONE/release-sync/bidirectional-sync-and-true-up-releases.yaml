context_sections:
  "Architecture": |
    New module structure:
    ```
    benchbox/release/
    ├── workflow.py          # Existing release utilities
    ├── sync.py              # NEW: Sync engine
    └── __init__.py          # Update exports

    scripts/
    ├── automate_release.py  # Update: add --mode and --sync options
    ├── sync_repos.py        # NEW: Standalone sync command
    ```

  "Key Classes": |
    RepoSync: Main sync engine
    - ensure_public_repo(fetch=True) - Clone/fetch public repo
    - diff_private_to_public() -> SyncDiff - Find changes to push
    - diff_public_to_private() -> SyncDiff - Find changes to pull
    - sync_to_public(files) -> SyncResult - Push with transforms
    - sync_from_public(files) -> SyncResult - Pull with reverse transforms
    - true_up_release() -> SyncResult - Incremental sync

    SyncDiff: Difference between repos
    - added: list[Path] - Files in source but not dest
    - modified: list[Path] - Files changed between repos
    - deleted: list[Path] - Files in dest but not source

    SyncResult: Sync operation result
    - synced_files: list[Path]
    - conflicts: list[Path] - Files changed in both repos
    - errors: list[str]
    - success: bool

  "Configuration Files": |
    release/.sync-config.yaml (version-controlled):
    ```yaml
    public_repo:
      url: "git@github.com:joeharris76/benchbox.git"
      branch: "main"
      local_path: "../BenchBox-public"

    sync:
      transforms:
        - file: "pyproject.toml"
          substitutions:
            "joeharris76@gmail.com": "joe@benchbox.dev"
      exclude_patterns:
        - "*.local.*"
        - ".sync-state.json"
    ```

    release/.sync-state.json (gitignored):
    ```json
    {
      "last_sync_timestamp": "2025-01-11T00:00:00Z",
      "last_sync_commit_private": "abc123...",
      "last_sync_commit_public": "def456...",
      "synced_files_manifest": {...}
    }
    ```

  "CLI Usage": |
    Standalone sync commands:
    ```bash
    ./scripts/sync_repos.py status           # Show diff
    ./scripts/sync_repos.py push             # Private → public
    ./scripts/sync_repos.py pull             # Public → private
    ./scripts/sync_repos.py true-up          # Incremental sync
    ```

    Release automation with sync:
    ```bash
    ./scripts/automate_release.py --version 0.1.1 --mode full     # Default
    ./scripts/automate_release.py --version 0.1.1 --mode true-up  # Incremental
    ./scripts/automate_release.py --version 0.1.2 --sync-from-public
    ```

impact:
  business_value: |
    Enables faster bug fix releases without full tree replacement.
    Simplifies importing external contributions from public repo.
    Provides visibility into what differs between repos.

  user_impact: |
    - Bug fixes can be released incrementally (true-up mode)
    - External PRs to public repo can be easily imported
    - Sync status provides clear visibility into repo differences

  technical_debt: |
    Replaces ephemeral public tree pattern with proper sync tracking.
    Adds explicit conflict detection and resolution.

