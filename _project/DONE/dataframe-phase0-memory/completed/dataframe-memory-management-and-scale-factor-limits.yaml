id: dataframe-memory-management-and-scale-factor-limits
title: DataFrame Memory Management and Scale Factor Limits
worktree: dataframe-phase0-memory
category: Core Functionality
priority: Critical
status: Completed
completed_date: '2025-12-02'
description: 'Implement memory management strategy and per-platform scale factor limits

  to prevent OOM crashes. Different platforms have different memory constraints

  (Pandas loads all in RAM, cuDF limited by GPU VRAM, etc.).

  '
implementation_summary: 'Implemented comprehensive memory management in benchbox/core/dataframe/capabilities.py:


  Platform Capabilities:

  - PlatformCapabilities dataclass for 8 DataFrame platforms

  - max_recommended_sf: Platform-specific scale factor limits

  - memory_overhead_factor: Memory multiplier (Pandas 2.5x, Polars 2.0x, etc.)

  - execution_model: EAGER, LAZY, DISTRIBUTED, OUT_OF_CORE

  - GPU requirements, partitioning needs, streaming support

  - Helpful notes and descriptions for each platform


  Memory Management Functions:

  - estimate_memory_required(): Calculate memory for benchmark + SF

  - check_sufficient_memory(): Pre-execution memory validation

  - get_available_memory_gb(): System memory via psutil

  - get_gpu_memory_gb(): GPU memory for cuDF via pynvml

  - validate_scale_factor(): Check SF against platform limits

  - format_memory_warning(): Helpful error messages with suggestions

  - recommend_platform_for_sf(): Platform recommendations by SF


  56 unit tests in tests/unit/core/dataframe/test_capabilities.py

  '
