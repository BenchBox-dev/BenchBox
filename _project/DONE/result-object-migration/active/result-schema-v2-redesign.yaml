context_sections:
  "Background and Motivation": |
    The current v1.1 schema evolved organically and accumulated significant issues:
    - Platform info appears in 4 different locations
    - Timing data is split across results.timing and phases.setup.*.duration_ms
    - Query details use 7 lines per query when 1 line suffices
    - Many null-filled error fields that are rarely used

    Analysis of 4 different benchmark result files revealed the need to support:
    - Multi-iteration runs (Data Vault with 3 iterations)
    - Query subsets (ClickHouse with specific queries)
    - Multiple streams (throughput testing)
    - Different query ID formats (numeric, descriptive strings)
    - TPC-specific metrics (power_at_size, geometric_mean)
    - Statistical percentiles (p90, p95, p99, stdev)

  "Technical Context": |
    Key design decisions:
    1. Query plans -> separate companion file ({run_id}_plans.json)
    2. SQL text -> omit entirely (available in benchmark source)
    3. Phase details -> flatten into main file
    4. Tuning -> platform.tuning summary + optional companion file

    Compact query format: {"id": "Q1", "ms": 632.9, "rows": 100}
    With optional fields: {"id": "1", "ms": 189.2, "rows": 4, "iter": 1, "stream": 1}

  "Implementation Notes": |
    Changes made:
    - schema.py: Complete rewrite with SCHEMA_VERSION = "2.0", SchemaV2Validator,
      build_result_payload(), build_plans_payload(), build_tuning_payload()
    - exporter.py: Updated _export_json_v2() with companion file support
    - loader.py: Complete rewrite with UnsupportedSchemaError, reconstruct_benchmark_results()
    - models.py: Removed duplicate 'phases' field
    - comparison.py: Updated _dict_to_benchmark_results() to use loader's reconstruct function
    - compare.py CLI: Updated _discover_result_files_with_metadata() for v2.0 paths
    - Deleted migration.py, test_migration.py, test_result_schema.py
    - Updated all test fixtures to use v2.0 format

success_metrics:
- "Result JSON files are 70-85% smaller than v1.1"
- "No duplicate data in output"
- "All consumers (comparison, CLI) work with new format"
- "All tests pass including round-trip verification"
- "Clear error message when loading v1.x files"

completion_notes: |
  Successfully implemented schema v2.0 redesign. All 210 tests in the results module
  pass. Key changes:
  - v2.0 schema with compact query format and companion files
  - migration.py deleted - no backward compatibility with v1.x
  - Loader rejects v1.x files with clear UnsupportedSchemaError
  - Timing statistics computed from query results (single source of truth)
  - Geometric mean can come from timing section or tpc_metrics section
