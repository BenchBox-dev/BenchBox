    - summary: Review current tuning file reference implementation
      done: true
    - summary: Analyze tuning config structure (TuningConfig dataclass)
      done: true
    - summary: Decide inline vs companion file approach
      done: true
  - phase: 'Phase 2: Implementation'
    done: true
    items:
    - summary: Update schema.py to include tuning config in output
      done: true
      subtasks:
      - summary: Add tuning config serialization to result payload
        done: true
      - summary: Capture all TuningClauses fields (sorting_keys, partitioning, etc.)
        done: true
      - summary: Include platform-specific tuning extensions
        done: true
    - summary: Update exporter.py to serialize tuning config
