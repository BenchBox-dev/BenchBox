    len(set(FILL_PATTERNS)) >= 8, f'only {len(set(FILL_PATTERNS))} unique fills'; assert len(set(SERIES_MARKERS)) >= 8, f'only
    {len(set(SERIES_MARKERS))} unique markers'; print('PASS: 8+ unique fill patterns and series markers')\""
  expected_output: "PASS: 8+ unique fill patterns and series markers"

