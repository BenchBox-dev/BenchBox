id: greyscale-ascii-visualization-fallbacks
title: "Add greyscale fallback rendering for ASCII visualizations"
worktree: main
priority: Medium-High
status: "Completed"
completed_date: "2026-02-17"
category: "Core Functionality"
description: |
  When color is disabled - either via CLI `--no-color`, the `NO_COLOR` env var,
  or the MCP path (which hardcodes `use_color=False`) - ASCII chart output becomes
  unreadable because all visual differentiation between data series is lost.

  The root cause is that `TerminalColors.colorize()` returns plain undecorated text
  when `color_mode == ColorMode.NONE`, but the chart renderers rely entirely on color
  to distinguish between series (bars, legend markers, comparison pairs, etc.).

  The heatmap is the one exception - it already falls back to intensity characters
  (`░▒▓█`) when color is unavailable (base.py:64-66). All other chart types need
  equivalent structural differentiation.

  **Current behavior (broken):**
  - CLI `--no-color`: all bars use identical `█` fill, legends have same `■` marker,
    comparison charts show indistinguishable series
  - MCP `generate_chart`: hardcodes `use_color=False` (visualization.py:470),
    producing same unreadable output

  **Desired behavior:**
  - No-color output uses different fill characters per series (e.g., `█`, `▓`, `▒`, `░`)
  - Legend markers differentiate series with unique symbols (e.g., `■`, `◆`, `▲`, `●`)
  - Comparison bars show series-identifying prefixes or patterns
  - Text labels and structural layout compensate for absent color
  - MCP output is always readable without relying on ANSI rendering

context_sections:
  "Architecture Overview": |
    The visualization stack has three layers:

    1. **Color system** (base.py): `ColorMode` enum → `TerminalColors` dataclass
       with `colorize()`, `fg()`, `bg()` methods. When `NONE`, all methods return
       plain text / empty strings.

    2. **Chart classes** (ascii/*.py): 15 chart types extending `ASCIIChartBase`.
       Each calls `self.options.get_colors()` and uses `colors.colorize()` for all
       styling. No chart currently has a structural fallback when color is off
       (except heatmap).

    3. **Entry points**: CLI (visualize.py), MCP (mcp/tools/visualization.py),
       post-run summary (post_run_summary.py). Each constructs `ASCIIChartOptions`
       with `use_color` and passes to chart classes.

  "Existing Patterns to Reuse": |
    - Heatmap already uses `INTENSITY_CHARS = " ░▒▓█"` (base.py:65) and
      `ASCII_INTENSITY_CHARS = " .-=#"` (base.py:66) as no-color fallbacks
    - `ASCIIChartOptions` already has `use_unicode` toggle with ASCII fallbacks
      for block chars and box-drawing chars (base.py:48-62)
    - The `DEFAULT_PALETTE` (base.py:18-27) has 8 entries - the fill-character
      palette needs at least 8 distinct patterns to match

  "MCP Context": |
    MCP tool output is consumed by LLMs and displayed in chat UIs that typically
    don't render ANSI escape codes. The current hardcoded `use_color=False` is
    correct, but without greyscale fallbacks the charts are useless. The fix
    should make MCP output fully self-documenting via structural differentiation,
    not by enabling color in MCP.

work:
- id: w1
  summary: "Add fill-pattern palette and series-marker palette to base.py"
  status: done
  notes: |
    Add to base.py alongside existing palettes:
    - FILL_PATTERNS: tuple of fill character sets per series (e.g., "█", "▓", "▒", "░", "▚", "▞", "╳", "·")
    - SERIES_MARKERS: tuple of legend marker characters (e.g., "■", "◆", "▲", "●", "◇", "▽", "○", "□")
    - ASCII fallbacks for both (e.g., "#", "=", "-", ".", "x", "+", "o", "*")
    Add a helper method to TerminalColors or ASCIIChartOptions to return the
    appropriate fill/marker for a given series index.

- id: w2
  summary: "Update ASCIIBarChart to use fill patterns when color is off"
  needs: [w1]
  status: done
  notes: |
    In bar_chart.py, when colors.color_mode == NONE, use per-series fill characters
    from FILL_PATTERNS instead of uniform █. Legend should use SERIES_MARKERS.

- id: w3
  summary: "Update ASCIIComparisonBar to use distinct patterns per series"
  needs: [w1]
  status: done
  notes: |
    In comparison_bar.py, baseline vs comparison bars need distinct fill patterns.
    The improvement/regression text markers should use structural symbols (↑/↓)
    instead of relying on green/red colorize() calls.

- id: w4
  summary: "Update high-complexity chart types for no-color readability"
  needs: [w1]
  status: done
  notes: |
    Apply fill-pattern and series-marker fallbacks to the most complex charts
    (highest colorize() call count, multiple render modes):
    - histogram.py (11 calls - two render modes: single-platform and multi-platform,
      each with bars + legends + outlier markers)
    - summary_box.py (7 calls - multiple styled sections)
    - diverging_bar.py (4 calls - positive/negative differentiation)
    - box_plot.py (4 calls - whisker/box/median coloring)

- id: w5
  summary: "Update remaining chart types for no-color readability"
  needs: [w1]
  status: done
  notes: |
    Apply fill-pattern and series-marker fallbacks to the simpler chart classes
    (mechanical changes, 2-4 colorize calls each):
    - normalized_speedup.py (4 calls - reference line + series)
    - stacked_bar.py (3 calls - multi-segment fills)
    - percentile_ladder.py (3 calls - band colors + segmented bars)
    - scatter_plot.py (3 calls - point markers per series)
    - sparkline_table.py (2 calls - inline sparkline coloring)
    - line_chart.py (2 calls - line character per series)
    - cdf_chart.py (2 calls - curve character per series)
    - rank_table.py (2 calls - rank highlight coloring)
    - Heatmap already has fallbacks - verify they're sufficient, no changes expected

- id: w6
  summary: "Add tests for no-color rendering across chart types"
  needs: [w2, w3, w4, w5]
  status: done
  notes: |
    Add parametrized tests that render each chart type with use_color=False and verify:
    - Output contains no ANSI escape codes
    - Multiple series produce visually distinct output (different fill characters)
    - Legend entries have unique markers
    - Output is not empty and structurally complete

- id: w7
  summary: "Verify MCP and CLI --no-color produce readable output end-to-end"
  needs: [w6]
  status: done
  notes: |
    End-to-end validation:
    - Run `benchbox visualize --no-color --template head_to_head` with real result files
    - Run MCP generate_chart with template and verify content field is readable
    - Compare colored vs no-color output to ensure same data is conveyed

deferred:
- summary: "Add intermediate 'greyscale' ColorMode that uses dim/bold ANSI"
  reason: |
    A GREYSCALE color mode using ANSI dim/bold/underline (supported on most terminals
    even without color) could provide a middle tier between full color and no formatting.
    Deferring because the structural-pattern approach covers the primary use cases
    (MCP and --no-color). Can revisit if users want a dim/bold tier.

- summary: "HTML/SVG chart output format for MCP"
  reason: |
    An alternative approach would be rendering charts as HTML/SVG for richer MCP output.
    Deferring because ASCII output is the established format and the structural fixes
    solve the immediate readability problem.

