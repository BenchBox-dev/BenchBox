  expected_output: "All tests pass, 0 failures"
- description: "No-color bar chart output has distinct fill characters per series"
  command: "uv run -- python -m pytest tests/unit/visualization/test_nocolor_rendering.py -v"
  expected_output: "All tests pass, verifying series differentiation"
- description: "Fill pattern palette has at least 8 distinct entries matching color palette size"
