impact:
  business_value: |
    MCP chart output is currently unusable - every generate_chart call produces
    unreadable content. This is the primary visualization interface for AI-assisted
    benchmark analysis. Fixing this makes the MCP visualization tools actually useful.
  user_impact: |
    Users who pipe output, use --no-color, or consume charts via MCP get readable
    visualizations with clear series differentiation instead of indistinguishable bars.

