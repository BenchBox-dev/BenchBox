impact:
  technical_debt: |
    Six SSB queries have silently returned empty results at every scale factor.
    Any benchmark run using SSB Q2.x or Q3.3/Q3.4/Q4.3 is measuring
    zero-row execution rather than real analytical workloads. This
    corrupts SSB benchmark results for all platforms.

prior_art:
  - "cross-surface-oracle-remediation DONE file — deferred this bug; the allowlist approach is the current workaround"
  - "_binaries/ or benchbox/benchmarks/ssb/ — locate the SSB generator"
  - "benchbox/benchmarks/ssb/gate*.yaml — the allowlist entries to remove after the fix"

must_preserve:
  - "All other SSB query results remain unchanged (Q1.x, Q2.x not affected by p_category, Q3.x excluding 3.3/3.4)"
  - "The cross-surface gate continues to pass for non-SSB benchmarks"

anti_patterns:
  - "DO NOT widen the allowlist further — the correct fix is in the generator, not in silencing more cells"
  - "DO NOT fix p_category for only one platform — the generator produces the data before any platform loads it"

verification:
  - description: "Q2.1 returns non-empty results at SF=0.1"
    command: "benchbox run --benchmark ssb --query q2_1 --scale-factor 0.1 --platform duckdb"
    expected_output: "result set contains at least one row"
  - description: "SSB gate passes without vacuous-cell allowlist entries"
    command: "uv run -- python -m pytest tests/unit/benchmarks/test_ssb_gate.py -q"
    expected_output: "all tests pass"
