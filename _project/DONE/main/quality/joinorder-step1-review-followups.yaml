description: |
  Follow-up cleanup from the post-Step-1 review of GitHub issue #289.
  The review found no Step-1 blockers, but identified internal-surface,
  estimate, stale-comment, and manifest-clarity cleanup items. This
  completed record tracks the fixes landed after the canonical
  foundation/cutover work.

work:
  - id: w1
    summary: "Hide internal joinorder_synthetic from public interactive CLI surfaces"
    status: done
    notes: |
      Keep `joinorder_synthetic` directly runnable by ID for internal smoke
      workflows, but exclude `surface: internal` benchmarks from benchmark
      list/filter/category wizard displays.

  - id: w2
    summary: "Refresh canonical JoinOrder interactive estimates"
    status: done
    notes: |
      Update JoinOrder memory/runtime estimates for the fixed 74M-row canonical
      dataset and add explicit joinorder_synthetic estimates.

  - id: w3
    summary: "Remove stale CSV dialect comments from canonical JoinOrder"
    status: done
    notes: |
      Canonical `joinorder` fetches verified Parquet files; CSV null-marker
      fallback comments belong only to `joinorder_synthetic`.

  - id: w4
    summary: "Clarify JoinOrder manifest hash fields"
    status: done
    notes: |
      Distinguish `data_archive_hash` as the logical per-table aggregate hash
      from `archive_sha256` as the downloadable tar.zst transport hash. This
      is a metadata-only manifest clarification, so the pinned manifest hash
      and reference-cardinality manifest hash were updated together.

  - id: w5
    summary: "Work from current origin/develop in a clean pool worktree"
    status: done
    notes: |
      Main clone remained stale with unrelated `skill-sync.lock` changes, so
      follow-up fixes were made from `/Users/joe/Developer/BenchBox.pool-07`.

