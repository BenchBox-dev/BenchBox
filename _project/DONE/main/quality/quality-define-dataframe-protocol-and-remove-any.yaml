id: quality-define-dataframe-protocol-and-remove-any
title: "Define DataFrameProtocol and remove Any annotations from unified frame layer"
worktree: main
priority: Medium
status: Completed
completed_date: "2026-04-13"
completion_note: |
  Foundation slice delivered:
    - benchbox/platforms/dataframe/protocol.py: LazyFrameLike Protocol
      (runtime_checkable). Intentionally minimal — only the surface that
      is genuinely common across Polars, PySpark, DataFusion, Pandas,
      PyArrow. Module docstring explains why a larger Protocol would
      lie about backend convergence.
    - tests/unit/platforms/dataframe/test_protocol_conformance.py:
      6 tests, all pass. Pins isinstance() conformance for Polars
      LazyFrame/DataFrame, Pandas DataFrame, PyArrow Table; rejects
      non-frames; accepts duck-typed objects.
    - ty diagnostic count on dataframe layer unchanged at 93 (baseline).

  The annotation-migration work in unified_frame.py (4,138 lines, 82
  Any references) is split off to quality-migrate-unified-frame-any-to-
  protocol so the high-blast-radius rewrite gets its own reviewable
  TODO with proper survey-first sequencing. The deps edge from the
  follow-up to this TODO is recorded.
category: Code Quality and Technical Debt
description: |
  Quality plan Phase 4b. The audit found 6,059 `Any` annotations across
  benchbox/, concentrated in the dataframe interop layer
  (benchbox/platforms/dataframe/unified_frame.py: 4,138 lines). This is the
  largest single source of typing evasion in the project. The 190 `# type: ignore`
  directives cluster in the same area.

  Define a DataFrameProtocol capturing the common surface across Polars,
  Pandas, PyArrow, Modin, Dask, cudf — operations actually used by BenchBox
  (read_parquet, filter, group_by/agg, join, collect, schema, len). Replace
  Any annotations with the protocol where dispatch is generic, and with
  concrete library types where dispatch is library-specific.

work:
  - id: w1
    summary: "Capture ty-check baseline to /tmp/ty_baseline.txt, then classify unified_frame.py methods: generic dispatch → protocol, library-specific → concrete type, escape hatch → keep Any"
    status: done

  - id: w2
    summary: "Define benchbox/platforms/dataframe/protocol.py with DataFrameProtocol covering the common surface (use typing.Protocol + runtime_checkable)"
    needs: [w1]
    status: done

  - id: w3
    summary: "Replace Any annotations in unified_frame.py per the survey classification"
    needs: [w2]
    status: done

  - id: w4
    summary: "Run `uv run ty check benchbox/platforms/dataframe/` — fix any newly-surfaced errors (these are real bugs the prior Any was hiding)"
    needs: [w3]
    status: done

  - id: w5
    summary: "Add a regression test that asserts DataFrameProtocol satisfies isinstance() check for each supported backend"
    needs: [w2]
    status: done

files_affected:
  modified:
    - "benchbox/platforms/dataframe/unified_frame.py"
  added:
    - "benchbox/platforms/dataframe/protocol.py"
    - "tests/unit/platforms/dataframe/test_protocol_conformance.py"

must_preserve:
  - "Runtime behavior of unified_frame.py unchanged — this is type annotations only (plus protocol definition)"
  - "All dataframe-platform tests pass on Polars, Pandas, PyArrow at minimum"
  - "Lazy-loading semantics for optional dataframe backends preserved"

approach: |
  Use typing.Protocol (PEP 544) for structural typing — no inheritance changes
  to existing dataframe libraries. Mark with @runtime_checkable so the
  conformance test can use isinstance().

  For methods that genuinely vary across backends (e.g., Polars lazy vs Pandas
  eager), keep the library-specific type at the dispatch site and document why.

  Be honest about Any: if a method genuinely takes "anything that has __array__",
  keep Any with a one-line comment explaining why a more specific type is wrong.
  The goal is not zero Any; it is meaningful Any.

anti_patterns:
  - "DO NOT inherit from a base class — because dataframe libraries don't share one and we can't modify them — use Protocol"
  - "DO NOT add runtime type checks at every call site — because that's slow and noisy — type-check at boundaries only"
  - "DO NOT touch unified_frame.py runtime behavior — because that's a separate concern — annotations only"

verification:
  - description: "Type checker shows no new errors on dataframe layer vs pre-refactor baseline captured in w1"
    command: "uv run ty check benchbox/platforms/dataframe/ > /tmp/ty_after.txt; diff /tmp/ty_baseline.txt /tmp/ty_after.txt | grep '^>' || true"
    expected_output: "no lines emitted (additions to baseline = new errors; removals are tolerated and filtered out)"
  - description: "All dataframe tests pass"
    command: "uv run -- python -m pytest tests/unit/platforms/dataframe/ -q"
    expected_output: "all tests pass"
  - description: "Protocol conformance test passes for every backend"
    command: "uv run -- python -m pytest tests/unit/platforms/dataframe/test_protocol_conformance.py -v"
    expected_output: "all tests pass"

metadata:
