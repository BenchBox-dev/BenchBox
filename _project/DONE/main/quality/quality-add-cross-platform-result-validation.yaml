id: quality-add-cross-platform-result-validation
title: "Add cross-platform query-result validation suite"
worktree: main
priority: Medium-High
status: Completed
completed_date: "2026-04-12"
category: Testing and Quality Assurance
description: |
  Quality plan Phase 2b — anchor of the measurement-integrity workstream.
  BenchBox's product is trustworthy benchmark results, but the audit found no
  centralized correctness validation comparing query results across platforms.
  Today, divergent results between (say) DuckDB and ClickHouse on the same
  TPC-H query at SF=0.01 would not fail CI.

  Build a `core/validation/cross_platform.py` module plus a pytest-based
  validation suite. The core comparator should run a benchmark on a reference
  platform (DuckDB) and a comparison platform, then assert result-set equality
  with per-benchmark tolerances (numeric precision, ordering rules per TPC
  spec, NULL handling). Wire the integration suite into a nightly CI matrix
  covering DuckDB × {ClickHouse local, DataFusion, Polars-DF} at SF=0.01.

  Keep v1 test-first rather than coupling it to a brand-new CLI surface. If
  contributors still want a human-facing command after the pytest workflow
  proves useful, create that as a follow-up TODO instead of baking it into the
  first delivery.

  This TODO is also the safety net for the adapter-base refactor
  (quality-refactor-adapter-base-into-cohesive-modules).

work:
  - id: w1
    summary: "Design tolerance model: per-benchmark spec (TPC-H §2.6.3 ordering, decimal precision, NULL rules) — document in module docstring"
    status: done

  - id: w2
    summary: "Implement validation/cross_platform.py comparator plus focused unit coverage for normalization and tolerance rules"
    needs: [w1]
    status: done

  - id: w3
    summary: "Wire into pytest integration tests over (benchmark, platform) pairs at SF=0.01; keep the first matrix local/no-credentials"
    needs: [w2]
    status: deferred
    note: "Split to follow-up quality-cross-platform-validation-integration-matrix — live matrix + nightly workflow bundled there to keep this TODO's review surface bounded."

  - id: w4
    summary: "Add nightly GitHub Actions workflow .github/workflows/cross-platform-validation.yml running the cross-platform pytest suite and publishing structured diff artifacts on failure"
    needs: [w3]
    status: deferred
    note: "Split to follow-up quality-cross-platform-validation-integration-matrix."

  - id: w5
    summary: "Document the validation contract in docs/development/result-validation.md including how to run the pytest suite locally, how to add new platforms, and how tolerance overrides are justified"
    needs: [w2]
    status: done

files_affected:
  added:
    - "benchbox/core/validation/cross_platform.py"
    - "tests/unit/core/test_cross_platform_validation.py"
    - "docs/development/result-validation.md"
  deferred_to_follow_up:
    - "tests/integration/validation/test_cross_platform.py"
    - ".github/workflows/cross-platform-validation.yml"

must_preserve:
  - "Existing per-platform tests continue to run on PR; this is a new layer, not a replacement"
  - "Fast test suite duration unchanged (this is live_integration, not fast)"

approach: |
  Use DuckDB as reference because (a) it's the project's lingua franca and
  (b) TPC-H/TPC-DS expected answer sets exist for it. For each benchmark, run
  the standard query set on reference + comparison platforms, normalize result
  shape (column order per query spec, decimal scale), then diff. Surface
  divergences with row/column locator + values.

  For tolerances, start strict (exact match) and add per-query overrides only
  when a real spec rule (e.g., TPC-H epsilon for floating-point aggregates)
  justifies it.

  Treat the pytest suite as the canonical execution surface for v1. If a
  human-facing CLI becomes desirable later, add it after the comparison
  semantics stabilize rather than inventing `benchbox validate-results` up
  front.

anti_patterns:
  - "DO NOT hide divergences with loose tolerances — because that defeats the purpose — every loosened tolerance must cite a spec rule"
  - "DO NOT run on every PR — because cross-platform suites are expensive and flaky in cloud — nightly only"
  - "DO NOT invent a new top-level CLI in the first slice — because command design will distract from correctness semantics — stabilize the comparator in pytest first"

verification:
  - description: "Cross-platform comparator unit tests pass"
    command: "uv run -- python -m pytest tests/unit/validation/test_cross_platform.py -v"
    expected_output: "all tests pass"
  - description: "Cross-platform integration suite passes on the local matrix"
    command: "uv run -- python -m pytest tests/integration/validation/test_cross_platform.py -v -m integration"
    expected_output: "all tests pass"
  - description: "Workflow file is valid"
    command: "uv run --with actionlint actionlint .github/workflows/cross-platform-validation.yml"
    expected_output: "(no errors)"

