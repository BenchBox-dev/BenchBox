id: quality-migrate-unified-frame-any-to-protocol
title: "Replace Any annotations in unified_frame.py with LazyFrameLike protocol"
worktree: main
priority: Medium
status: Completed
completed_date: "2026-04-13"
category: Code Quality and Technical Debt
description: |
  Follow-up to quality-define-dataframe-protocol-and-remove-any.

  The protocol foundation lives at benchbox/platforms/dataframe/protocol.py
  (LazyFrameLike). Polars LazyFrame/DataFrame, Pandas DataFrame, and
  PyArrow Table satisfy isinstance() against it; conformance tests pin
  the contract.

  The annotation migration in unified_frame.py (4,138 lines, 82 Any
  references) was deliberately deferred to its own slice because:
    - High blast radius: every benchmark execution path touches this file
    - Library-specific dispatch in many methods means not every Any can
      become LazyFrameLike — some need concrete library types
    - Should land alongside ty diagnostic reduction (93 in dataframe layer
      today) so the gain is visible

  This TODO does the migration in reviewable slices.

deps:
  needs:
  - quality-define-dataframe-protocol-and-remove-any

work:
- id: w1
  summary: "Survey unified_frame.py: classify each `Any` annotation as (a) generic dispatch -> LazyFrameLike, (b) library-specific
    -> concrete type, (c) genuine escape hatch -> keep with comment. Output CSV."
  status: done

- id: w2
  summary: "Migrate category (a) — generic-dispatch sites — to LazyFrameLike. One commit per ~20 sites for review bounding."
  needs: [w1]
  status: done
  notes: "Verified (a) count after hand-walking: only 2 genuine generic-dispatch sites
    (wrap_dataframe + UnifiedLazyFrame.join). Both migrated in commit 486c21640. The other
    23 heuristic-flagged (a) sites were re-classified as (b) library-specific or (c)
    escape-hatch — see Heuristic limitations + Re-classification log in
    docs/development/unified_frame_any_survey.md."

- id: w3
  summary: "Migrate category (b) — library-specific sites — to concrete types (e.g., polars.LazyFrame, pyspark.sql.DataFrame).
    Use TYPE_CHECKING imports to preserve lazy-load semantics."
  needs: [w1]
  status: done
  notes: "21 (b) sites migrated to concrete types under TYPE_CHECKING imports across commits
    3b8fa0e57 (1 polars helper), 6a191d677 (8 pyspark join methods), 4b11df2f8 (10 datafusion
    expr/df sites), 4baac9f50 (3 datafusion ast/agg helpers). 11 sites originally heuristic-
    flagged (b) were re-classified to (c) (runtime probes + Unified*Expr.__init__ family) and
    documented per re-classification log."

- id: w4
  summary: "For category (c) escape-hatch Any, add inline comment explaining why a more specific type would be wrong. The
    goal is meaningful Any, not zero Any."
  needs: [w1]
  status: done
  notes: "Used class-level rationale blocks instead of one-comment-per-method to avoid noise.
    Coverage: UnifiedExpr class docstring (covers ~17 method-param sites), arithmetic dunder
    section comment (16 sites), UnifiedWhen/UnifiedWhenThen class docstrings (5 sites),
    UnifiedExpr.native + .collect + .scalar docstrings (3 return sites), _is_* predicate
    section comment (4 sites). Commits: 7226876a3, 3b8fa0e57, 3398d9457, f137b20dc."

- id: w5
  summary: "Run `uv run ty check benchbox/platforms/dataframe/` against /tmp/ty_baseline.txt (93 diagnostics). Confirm no
    new errors; fix any that appear (those are real bugs the prior Any was hiding)."
  needs: [w2, w3, w4]
  status: done
  notes: "ty diagnostic count steady at 93 (= baseline) after every w2/w3/w4 commit. No new
    errors surfaced — the prior Any annotations were not masking type errors in the migrated
    sites. Verified after final commit f137b20dc."

files_affected:
  modified:
  - "benchbox/platforms/dataframe/unified_frame.py"

must_preserve:
- "Runtime behavior of unified_frame.py unchanged — annotations only"
- "All dataframe-platform tests pass on Polars, Pandas, PyArrow at minimum"
- "Lazy-loading of optional backends preserved (TYPE_CHECKING imports for library-specific types)"
- "ty diagnostic count does not increase from baseline 93"

approach: |
  Sweep one method group at a time (join operations, group_by, expression
  classes) so review can focus on a coherent slice. Use ast tooling for
  the survey to avoid grep false positives — Any can appear in
  type aliases, return positions, parameter positions, and dict/list
  generic args.

anti_patterns:
- "DO NOT migrate everything to LazyFrameLike — because not every Any is a generic-dispatch site — classify first"
- "DO NOT add runtime isinstance() checks at every call — because that's slow and noisy — type-only at boundaries"
- "DO NOT touch unified_frame.py runtime behavior — because that's a separate concern — annotations only"
- "DO NOT bundle the survey + migration into one commit — because it loses the ability to revert just the migration — survey
  first, then migrate per category"

verification:
- description: "ty diagnostic count unchanged or reduced"
  command: "uv run ty check benchbox/platforms/dataframe/ 2>&1 | tail -1"
  expected_output: "Found ≤93 diagnostics"
- description: "Dataframe tests pass"
  command: "uv run -- python -m pytest tests/unit/platforms/dataframe/ -q"
  expected_output: "all tests pass"

metadata:
  tags: ["quality-plan", "phase-4", "typing", "dataframe"]
  estimated_effort: "Medium (2-3 days)"
  created_date: "2026-04-13"
