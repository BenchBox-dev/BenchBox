  tags:
    - architecture-review-followup
    - driver-metadata
    - validation
    - lifecycle
  estimated_effort: "1-2 days"
  created_date: "2026-05-21"
  last_updated: "2026-05-21T00:00:00Z"
  completed_date: "2026-05-22"
  source: "Independent verification of execution/results architecture findings #2 and #7"

impact:
  business_value: |
    Keeps exported runtime metadata consistent across CLI and lifecycle paths
    and prevents unsupported validation from looking like failed validation.
  user_impact: |
    Users see less confusing validation status and stable driver metadata in
    result bundles regardless of execution path.
  technical_debt: |
    Removes a duplicated metadata propagation engine and clarifies a core
    lifecycle status contract.

files_affected:
  modified:
    - "benchbox/core/results/driver_metadata.py"
    - "benchbox/core/runner/runner.py"
    - "tests/unit/cli/test_run_metadata_contract.py"
    - "tests/unit/core/test_runner_helpers.py"
    - "tests/unit/core/test_runner_lifecycle.py"
    - "docs/reference/result-formats.md"
    - "docs/reference/public-contracts.md"

prior_art:
  - "benchbox/core/results/driver_metadata.py: shared metadata helper already used by CLI paths - extend this rather than keeping runner-local duplication."
  - "benchbox/core/runner/runner.py: current platform_info setdefault behavior - preserve while routing through shared helper."
  - "benchbox/core/results/schema.py: driver metadata collection for export - verify exported fields remain stable."
  - "tests/unit/cli/test_run_metadata_contract.py: existing shared-helper contract tests - expand for platform_info and runner parity."
  - "tests/unit/core/test_runner_helpers.py: existing post-load validation tests - update to the explicit applicability semantics."

must_preserve:
  - "Adapter-sourced driver metadata remains higher precedence than database_config fallbacks."
  - "Existing platform_info keys are not overwritten by driver metadata propagation."
  - "Driver metadata still serializes through schema-v2 platform/execution blocks as before."
  - "Actual post-load validation exceptions still surface as failed validation, not as not-run."
  - "DataFrame post-load validation remains skipped unless a separate TODO changes DataFrame validation support."

approach: |
  Centralize metadata propagation by strengthening the existing shared helper,
  then reduce runner-local code to a wrapper. Treat validation applicability as
  a small lifecycle contract: absent capability means no validation record;
  attempted validation failures remain failures.

anti_patterns:
  - "DO NOT remove runner platform_info driver metadata population without replacing it in the shared helper -- existing exports may rely on those setdefault fields."
  - "DO NOT turn all validation exceptions into `None` -- that would hide real failed validation attempts."
  - "DO NOT change result JSON key names for driver metadata as part of helper consolidation."
  - "DO NOT add another wrapper helper in runner.py that recreates the same field map under a new name."

