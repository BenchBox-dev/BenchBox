id: execution-results-driver-metadata-and-validation-semantics
title: "Execution/results hardening: unify driver metadata propagation and validation applicability semantics"
worktree: main
priority: High
status: "Completed"
category: Results

deps:
  needs:
    - architecture-contract-map-and-support-taxonomy
    - result-schema-policy-and-explorer-input-gate

description: |
  Independent verification found two lifecycle/result consistency risks in
  `benchbox/core/runner/runner.py`.

  Driver metadata propagation exists in two places: the shared
  `benchbox/core/results/driver_metadata.py:apply_driver_metadata()` helper
  used by CLI/orchestrator paths, and runner-local
  `_enrich_driver_runtime_metadata()` plus `_apply_driver_meta_to_dicts()`.
  The original critic overstated precedence divergence: both paths prefer
  adapter values over database config fallbacks. The real divergence is that
  the runner also writes driver fields into `result.platform_info` with
  `setdefault()`, while the shared helper only writes result attributes and
  `execution_metadata`.

  Post-load validation also conflates not-applicable validation with failed
  validation. `_run_postload_validation()` returns `None` for `adapter is None`,
  but returns a synthetic invalid `ValidationResult` when an adapter lacks
  `create_connection`/`close_connection`. Consumers already treat `None` as
  "no validation record" and aggregate `is_valid=False` as a failed stage.

work:
  - id: w0
    summary: "Revalidate driver metadata call sites and post-load validation consumers"
    status: done
    notes: |
      Re-run source checks before editing and capture a compact summary with
      checked SHA, command, and counts. Do not commit raw stdout.

      Required checks:
        - `rg -n "apply_driver_metadata|_enrich_driver_runtime_metadata|_apply_driver_meta_to_dicts|_CONFIG_FIELD_MAP|_EXEC_META_SETDEFAULT" benchbox tests --glob '!build/**' --glob '!docs/_build/**' --glob '!.venv/**'`.
        - `rg -n "_run_postload_validation|postload_result|validation_records|_finalize_validation_metadata|ValidationResult\\(is_valid=False" benchbox tests --glob '!build/**' --glob '!docs/_build/**' --glob '!.venv/**'`.
        - Inspect `tests/unit/core/test_runner_helpers.py` for tests pinning current missing-method invalid behavior.

      Decision gate: if result-schema policy or public-contract docs currently
      promise a failed stage for validation-not-applicable, preserve that public
      behavior and document why this TODO should not change it.

      Completed 2026-05-22 at checked SHA
      `f997b0aebc354f69bf32ca6b431dd4bd7e177404`: driver metadata rg returned
      28 lines, post-load validation rg returned 55 lines. Public contracts
      reserve `summary.validation="passed"` for actual validation evidence and
      say missing validation records finalize as `not_run`; no contract requires
      unsupported connection validation to record a failed stage.

  - id: w1
    summary: "Extend the shared driver metadata helper to preserve runner platform_info behavior"
    needs: [w0]
    status: done
    notes: |
      Update `benchbox/core/results/driver_metadata.py` so the shared helper
      can also populate `result.platform_info` using the same `setdefault()`
      behavior currently present in runner-local `_apply_driver_meta_to_dicts()`.

      Preserve these semantics:
        - adapter values win over database config values;
        - config values fill only missing adapter values;
        - `driver_version_resolved` falls back to requested `driver_version`;
        - `driver_package` and `driver_version_requested` in execution metadata
          use `setdefault`;
        - `driver_auto_install_used` remains recorded even when false;
        - platform_info population never overwrites existing platform metadata.

  - id: w2
    summary: "Route runner lifecycle metadata enrichment through the shared helper"
    needs: [w1]
    status: done
    notes: |
      Replace the runner-local duplication in
      `_enrich_driver_runtime_metadata()` with calls to
      `apply_driver_metadata(...)`. Delete or shrink `_DRIVER_STR_FIELDS`,
      `_CONFIG_FIELD_MAP`, `_EXEC_META_SETDEFAULT`, and
      `_apply_driver_meta_to_dicts()` if they become unused.

      Keep `_enrich_driver_runtime_metadata()` as a small compatibility wrapper
      if tests or monitoring import gates patch it directly. The wrapper should
      be boring: call the shared helper and return the result.

  - id: w3
    summary: "Define validation applicability semantics and update post-load validation behavior"
    needs: [w0]
    status: done
    notes: |
      Decide and implement one explicit semantic rule:
        - not applicable: return `None`, do not add a validation stage;
        - attempted and failed: return `ValidationResult(is_valid=False)`;
        - attempted and passed/warned: return the engine result.

      Apply that rule to `_run_postload_validation()`. The likely change is
      returning `None` when the adapter lacks `create_connection` or
      `close_connection`, while preserving synthetic failure for exceptions
      raised after validation is actually attempted.

      Update tests currently expecting invalid for missing adapter methods to
      assert `None` if the public-contract check in w0 allows the change.

  - id: w4
    summary: "Add metadata and validation regression tests for lifecycle and CLI parity"
    needs: [w2, w3]
    status: done
    notes: |
      Cover:
        - CLI/orchestrator path and runner lifecycle path produce the same
          top-level driver fields and `execution_metadata` fields;
        - runner path still backfills `platform_info` without overwriting
          existing platform_info values;
        - missing connection validation hooks produce no validation stage after
          the semantics change;
        - actual post-load validation exceptions still produce a failed stage.

      Prefer focused unit tests around `apply_driver_metadata()`,
      `_enrich_driver_runtime_metadata()`, `_run_postload_validation()`, and
      `_finalize_validation_metadata()` before broad lifecycle tests.

deferred:
  - summary: "Redesign all validation stages as typed applicability/pass/fail objects"
    reason: "This TODO fixes the confirmed not-applicable vs failed conflation; a typed validation model is larger result-schema work."
  - summary: "Remove `_enrich_driver_runtime_metadata()` public patch point immediately"
    reason: "Monitoring import-gate tests patch this helper; a compatibility wrapper is safer unless a focused audit proves no external/test reliance remains."

