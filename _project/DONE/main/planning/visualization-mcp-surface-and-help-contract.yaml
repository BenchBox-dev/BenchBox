    - "benchbox/mcp/server.py"
    - "benchbox/mcp/tools/visualization.py"
    - "benchbox/mcp/tools/discovery.py"
    - "benchbox/core/visualization/"
    - "tests/unit/mcp/"
    - "docs/reference/public-contracts.md"
    - "docs/development/"
  do_not_modify:
    - ".venv/"
    - "textcharts package source"
    - "CLI visualization behavior beyond generated/shared help text"
    - "benchmark execution or results schema code"

success_metrics:
  - "MCP chart/template help is generated from or tested against registries."
  - "BenchBox's MCP charting surface is documented as result-aware semantic charting."
  - "Runtime evidence or an explicit limitation records whether textcharts MCP tools are exposed alongside BenchBox."
  - "Discovery metadata no longer silently advertises stale or partial chart support."

open_questions:
  - "Does the deployed MCP harness expose textcharts and BenchBox tools in one visible tool list?"
  - "Should BenchBox server instructions mention external textcharts tools at all?"
  - "Should discovery metadata return all semantic chart IDs or only a curated common subset?"
