id: visualization-mcp-surface-and-help-contract
title: "Visualization hardening: decide MCP charting surface boundaries and generate help from registries"
worktree: main
priority: Medium-High
status: "Completed"
category: Visualization

deps:
  needs:
    - architecture-contract-map-and-support-taxonomy
    - visualization-chart-registry-and-exporter-contract

description: |
  Independent verification partially confirmed a product-surface concern: the
  installed external dependency `textcharts==0.1.2` ships its own MCP server
  with raw primitive tools such as `textcharts_bar`, while BenchBox ships
  result-aware MCP tools `suggest_charts` and `generate_chart`.

  Static repository inspection at SHA a63ae1a76 found that BenchBox's MCP
  server registers BenchBox tool groups only and does not directly register or
  forward textcharts MCP tools. However, the broader harness/session may expose
  both MCP surfaces independently. That runtime exposure cannot be settled from
  source alone.

  The same review confirmed a smaller drift surface: BenchBox MCP docstrings
  hardcode chart/template examples while CLI help derives chart/template choices
  from registries. This TODO makes the MCP boundary explicit and ensures help
  text comes from the registry/template sources selected by the chart-registry
  TODO.

work:
  - id: w0
    summary: "Revalidate actual MCP tool exposure and help-text drift against the current branch/runtime"
    status: done
    notes: |
      Revalidated against checked SHA
      `4d436d76e4f2bd59a2a0588afb66ac672ff0605d` with installed
      `textcharts==0.1.2`. Source inspection shows BenchBox registers
      `register_visualization_tools()` from `benchbox/mcp/server.py`; it does
      not import or forward `textcharts.mcp_server`. The installed dependency
      exposes a separate `textcharts-mcp` server with `textcharts_*` primitive
      tools. Runtime FastMCP inspection observed 12 BenchBox tools
      (`generate_chart`, `suggest_charts`, and other BenchBox tools) and 17
      separate textcharts tools when creating the textcharts server directly.

  - id: w1
    summary: "Record the product contract between raw textcharts MCP tools and BenchBox result-aware MCP tools"
    needs: [w0]
    status: done
    notes: |
      Updated public contracts and MCP reference docs to classify BenchBox
      `generate_chart`/`suggest_charts` as result-file-aware semantic charting.
      Textcharts MCP tools are documented as a separate raw primitive server
      namespace if a user configures that server independently.

  - id: w2
    summary: "Generate or centralize MCP chart/template help text from registries"
    needs: [w1]
    status: done
    notes: |
      Added stable module-level MCP help constants in
      `benchbox/mcp/tools/visualization.py`, derived from
      `CHART_TYPE_DESCRIPTIONS` and `list_templates()`, and passed them to
      FastMCP as explicit tool descriptions.

  - id: w3
    summary: "Align MCP server instructions and discovery metadata with the chosen chart-surface contract"
    needs: [w1, w2]
    status: done
    notes: |
      Updated server instructions and chart discovery metadata to identify the
      complete BenchBox semantic chart registry, supported ASCII output, and
      textcharts as an external namespace. Discovery does not advertise raw
      textcharts primitive IDs as BenchBox chart types.

  - id: w4
    summary: "Add regression tests for MCP help, discovery metadata, and chart namespace clarity"
    needs: [w3]
    status: done
    notes: |
      Added tests asserting MCP help includes every current template and
      semantic chart ID, registered FastMCP descriptions use the generated
      help constants, discovery metadata exposes the complete semantic
      registry, and raw `bar`/`heatmap` primitive IDs are not BenchBox
      chart IDs.

deferred:
  - summary: "Bundle or proxy the external textcharts MCP server through BenchBox"
    reason: "This is a product decision with namespace and support implications; document the boundary before adding registration behavior."
  - summary: "Remove textcharts as a dependency"
    reason: "Renderer shims depend on textcharts; this TODO concerns MCP/help boundaries, not renderer extraction."
  - summary: "Build an MCP schema generator for every BenchBox tool"
    reason: "Only visualization chart/template help drift is in scope."

metadata:
  tags:
    - architecture-review-followup
    - visualization
    - mcp
    - textcharts
    - public-contract
  estimated_effort: "1-2 days"
  created_date: "2026-05-21"
  last_updated: "2026-05-21T00:00:00Z"
  completed_date: "2026-05-22"
  source: "Independent verification of visualization architecture findings M5 and N1"

impact:
  business_value: |
    Gives agents a clear charting contract and prevents support confusion
    between raw textcharts primitives and BenchBox result-aware charts.
  user_impact: |
    MCP users see accurate chart/template help and fewer ambiguous tool choices.
  technical_debt: |
    Removes hand-typed MCP chart/template prose and records the intended
    external dependency boundary.

files_affected:
  modified:
    - "benchbox/mcp/server.py"
    - "benchbox/mcp/tools/visualization.py"
    - "benchbox/mcp/tools/discovery.py"
    - "benchbox/core/visualization/chart_types.py"
    - "benchbox/core/visualization/templates.py"
    - "tests/unit/mcp/test_visualization_tools.py"
    - "tests/unit/mcp/test_discovery_tools.py"
    - "docs/reference/public-contracts.md"

prior_art:
  - "benchbox/mcp/server.py: BenchBox MCP instructions - update the user-facing charting surface here."
  - "benchbox/mcp/tools/visualization.py: result-aware `suggest_charts` and `generate_chart` tools - keep semantic chart namespace here."
  - "benchbox/mcp/tools/discovery.py: current chart metadata returned by discovery - align with the visualization registry."
  - "benchbox/core/visualization/templates.py: template registry - derive help text from this rather than hardcoding."
  - "textcharts/mcp_server.py in the installed dependency: raw primitive MCP server - document as separate unless runtime registration proves otherwise."
  - "docs/reference/public-contracts.md: support-tier map for MCP tool contracts - extend with visualization surface boundaries."

must_preserve:
  - "BenchBox MCP `generate_chart` and `suggest_charts` remain result-file-aware tools."
  - "BenchBox semantic chart IDs remain distinct from textcharts primitive command names."
  - "FastMCP tool descriptions remain readable and useful after any generated-help change."
  - "No textcharts MCP tool registration is added or removed without runtime evidence and a product decision."

approach: |
  Treat M5 as a product contract question first and a code question second.
  Use runtime tool-list evidence when available. For the confirmed N1 drift,
  derive MCP help from chart and template registries so help text changes with
  the actual supported surfaces.

anti_patterns:
  - "DO NOT claim BenchBox registers textcharts MCP tools unless the runtime tool list proves it."
  - "DO NOT mix raw textcharts primitive names into BenchBox chart-type validation."
  - "DO NOT leave hardcoded template prose after adding or changing templates."
  - "DO NOT hide an externally configured MCP server from user tooling by changing BenchBox source alone."

verification:
  - description: "MCP visualization and discovery tests pass."
    command: "uv run -- python -m pytest tests/unit/mcp/test_visualization_tools.py tests/unit/mcp/test_discovery_tools.py -q"
    expected_output: "Visualization and discovery MCP tests pass."
  - description: "MCP help references valid current templates."
    command: "uv run -- python -m pytest tests/unit/mcp/test_visualization_tools.py tests/unit/mcp/test_discovery_tools.py -k 'template or help or discovery or chart' -q"
    expected_output: "MCP help/discovery tests prove chart and template text follows registry/template sources or is explicitly marked as examples."
  - description: "Textcharts MCP exposure evidence is recorded."
    command: "rg -n \"textcharts|raw primitive|result-aware|generate_chart|suggest_charts\" docs/reference/public-contracts.md benchbox/mcp/server.py benchbox/mcp/tools/visualization.py"
    expected_output: "Docs/instructions clearly distinguish BenchBox result-aware charts from textcharts raw primitive tools."
  - description: "TODO graph remains valid after implementation."
    command: "uv run --project _project/scripts -- python _project/scripts/todo_cli.py validate && uv run --project _project/scripts -- python _project/scripts/todo_cli.py check-graph"
    expected_output: "TODO validation and graph checks pass."

