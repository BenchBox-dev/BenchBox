id: landing-prompts-all-supported-platforms
title: "Make /prompts/ expose every supported BenchBox platform"
worktree: main
priority: High
status: Completed
category: Product and Documentation

description: |
  The `/prompts/` landing prompt builder currently exposes a hand-curated
  static platform subset in `landing/prompts/catalog.yaml`. That subset was
  not approved: platform filters should exclude non-applicable platforms by
  interface and deployment, but every supported BenchBox platform must be
  promptable when it matches the selected filters.

  Current observed defect:
    - Managed cloud + SQL compare mode only shows MotherDuck,
      ClickHouse Cloud, and Snowflake.
    - `landing/prompts/catalog.yaml` lists only 8 total platforms.
    - The runtime platform registry reports 50 platform IDs, with 45
      SQL-capable and 19 DataFrame-capable platforms when checked via
      `PlatformRegistry.get_platform_capabilities()`.
    - The registry currently includes at least one deployment capability
      mode outside the prompt UI vocabulary (`remote` for Velox), and many
      platforms rely on the registry's default-local fallback when no
      deployment modes are defined. The implementation must audit and resolve
      those cases rather than silently misclassifying them.

  The fix should not replace one manually-curated list with a longer
  manually-curated list. The prompt catalog must derive its platform list
  from the runtime registry at generation time, then use focused overrides
  only for presentation and prompt-safety metadata that the registry cannot
  supply.

deps:
  needs:
  - landing-prompts-generic-semantics-and-layout-fixes

work:
- id: w0
  summary: "Re-validate current registry/catalog evidence"
  status: done
  notes: |
    Re-run the current-state inventory before implementation and record a
    compact summary in the PR body:

        uv run -- python - <<'PY'
        from collections import Counter
        from benchbox.core.platform_registry import PlatformRegistry

        metadata = PlatformRegistry.get_all_platform_metadata()
        counts = Counter()
        deployments = Counter()
        for platform_id in sorted(metadata):
            caps = PlatformRegistry.get_platform_capabilities(platform_id)
            if caps.supports_sql:
                counts["sql"] += 1
            if caps.supports_dataframe:
                counts["dataframe"] += 1
            modes = {dep.mode for dep in caps.deployment_modes.values()} or {"local"}
            for mode in modes:
                deployments[mode] += 1
        print("total", len(metadata))
        print("sql", counts["sql"])
        print("dataframe", counts["dataframe"])
        print("deployment_modes", dict(sorted(deployments.items())))
        PY

    Also confirm the prompt catalog platform count before the change:

        uv run -- python - <<'PY'
        import yaml
        from pathlib import Path
        catalog = yaml.safe_load(Path("landing/prompts/catalog.yaml").read_text())
        print(len(catalog["platforms"]))
        print([p["id"] for p in catalog["platforms"]])
        PY

    Raw stdout belongs in `/tmp` or the PR body summary, not committed as
    a log transcript.

- id: w1
  summary: "Replace the curated-platform decision with an all-supported-platform contract"
  needs: [w0]
  status: done
  notes: |
    Update `_project/decisions/landing-prompts-route.md` to state that:
      - `/prompts/` must expose every runtime-supported platform from
        `PlatformRegistry.get_all_platform_metadata()` that supports SQL
        or DataFrame execution.
      - Filtering is allowed only by actual platform capability
        (`supports_sql`, `supports_dataframe`, deployment mode, benchmark
        compatibility), not by marketing curation.
      - The route remains static: it may materialize registry data into
        `landing/prompts/catalog.generated.js` at build/generation time,
        but must not add a public JSON API or runtime endpoint.
      - Hand-authored YAML may contain labels, ordering groups, safety
        copy, or explicit metadata corrections, but must not be the source
        of truth for platform inclusion.

- id: w2
  summary: "Audit deployment metadata before wiring filters to all platforms"
  needs: [w0]
  status: done
  notes: |
    The prompt UI filters by `interfaces[]` and `deployments[]`, so the
    source metadata must be accurate. Inspect every platform returned by
    `PlatformRegistry.get_all_platform_metadata()` and classify:
      - interface support from `PlatformRegistry.get_platform_capabilities()`
        (`supports_sql`, `supports_dataframe`);
      - deployment modes from `deployment_modes[*].mode`;
      - fallback behavior for platforms with no deployment modes currently
        defined (`supports_deployment_mode()` treats them as local).
      - any deployment capability mode outside the current prompt UI
        vocabulary (`local`, `self-hosted`, `managed`), especially
        `remote`.

    Produce an implementation table in code/tests, not a one-off chat
    table. If registry metadata is wrong for obvious cloud/server
    platforms (for example Snowflake, BigQuery, Redshift, Databricks,
    Athena, Fabric, Synapse, Spark-provider platforms), either:
      - fix the registry `capabilities.deployment_modes` so all consumers
        benefit, or
      - add a narrowly-scoped `platform_overrides` section in
        `landing/prompts/catalog.yaml` with an explicit comment explaining
        why the prompt route needs a correction before the registry is
        fixed.

    `remote` must not leak into `catalog.generated.js` unless the UI gains
    a fourth Deployment option. For this TODO, default to mapping `remote`
    to `self-hosted` only when the platform is user-managed/networked, and
    document that mapping in generator code/tests.

- id: w3
  summary: "Derive prompt platform entries from PlatformRegistry in the generator"
  needs: [w1, w2]
  status: done
  notes: |
    Refactor `scripts/generate_landing_quickstarts.py` so the generated
    catalog's `platforms[]` is materialized from the runtime registry:
      - source ids from `PlatformRegistry.get_all_platform_metadata()`;
      - label from registry `display_name` unless a presentation override
        exists;
      - `interfaces` from `supports_sql` / `supports_dataframe`;
      - `deployments` from deployment capability `mode` values, normalized
        to the UI vocabulary `local`, `self-hosted`, `managed`;
      - exclude only platforms with neither SQL nor DataFrame support.

    Keep `catalog.generated.js` as the static runtime payload. Do not
    fetch registry data in the browser, and do not introduce
    `landing/prompts/recipes.json`.

    The generated prompt ids should use canonical PlatformRegistry ids, not
    aliases from `PlatformRegistry.get_all_aliases()`. Aliases may remain
    valid CLI input but should not duplicate dropdown entries.

- id: w4
  summary: "Convert catalog.yaml platform data into overrides, not an inclusion list"
  needs: [w3]
  status: done
  notes: |
    Change `landing/prompts/catalog.yaml` so hand-authored platform data
    cannot silently omit supported platforms. Recommended shape:

        platform_overrides:
          snowflake:
            label: "Snowflake"
            deployments: [managed]
            safety_terms: ...

    The generator should fail if `platforms:` is still used as a complete
    source list, or should treat `platforms:` as generated/output-only and
    not read it from YAML. Any override key must match a real registry
    platform id.

- id: w5
  summary: "Preserve cloud-safety behavior for every managed platform"
  needs: [w3, w4]
  status: done
  notes: |
    Managed deployments must keep the existing safety contract:
      - dependency/status check before any live run;
      - dry-run before live execution;
      - no secrets pasted into chat.

    For generated managed platform entries, either require explicit
    `safety_terms` in `platform_overrides` or synthesize conservative
    generic safety terms from deployment capability flags such as
    `requires_credentials`, `requires_network`, and `requires_cloud_storage`.
    Add validator errors for managed entries that lack effective
    dependency/dry-run/no-secret guidance after overrides are applied.

- id: w6
  summary: "Regenerate catalog.generated.js and update UI tests for full coverage"
  needs: [w3, w4, w5]
  status: done
  notes: |
    Regenerate `landing/prompts/catalog.generated.js`.

    Extend `tests/unit/landing/test_landing_quickstarts.py` with gates
    that fail if the prompt catalog drifts from the runtime registry:
      - generated platform ids equal every registry platform id with SQL
        or DataFrame support;
      - every generated platform has a non-empty label, at least one
        interface, and at least one deployment;
      - every generated deployment value is one of `local`,
        `self-hosted`, or `managed`;
      - any non-UI registry deployment mode such as `remote` has an
        explicit generator mapping covered by test;
      - SQL filter pool contains all SQL-capable registry platforms for
        the selected deployment;
      - DataFrame filter pool contains all DataFrame-capable registry
        platforms for the selected deployment;
      - managed platform entries have effective safety terms;
      - no hand-curated subset comment remains.

- id: w7
  summary: "Add a focused browser/static smoke for platform dropdown coverage"
  needs: [w6]
  status: done
  notes: |
    Add the narrowest maintainable smoke test available in this codebase.
    If no browser harness exists yet, add a static JS/DOM smoke similar to
    the local review script that loads `catalog.generated.js` and
    `prompts.js`, selects:
      - SQL + Managed cloud + Compare platforms;
      - SQL + Self-hosted + Compare platforms;
      - DataFrame + Local + Test one platform.

    Assert each dropdown includes all registry-derived applicable platform
    ids and no inapplicable ids. This should be committed as a real test,
    not left as a manual terminal transcript.

deferred:
- summary: "Search/typeahead UI for long platform lists"
  reason: "All platforms must be promptable first; large-list ergonomics can follow if native selects become unwieldy."
- summary: "Derive benchmark compatibility per platform"
  reason: "This TODO must fix platform availability. Benchmark-specific compatibility filtering can be added separately unless
    registry `unsupported_benchmarks` makes it cheap and safe."

prior_art:
- "benchbox/core/platform_registry.py:PlatformRegistry.get_all_platform_metadata — reuse as the source of truth for supported
  platform ids"
- "benchbox/core/platform_registry.py:PlatformRegistry.get_platform_capabilities — reuse for SQL/DataFrame and deployment
  capability derivation"
- "scripts/generate_landing_quickstarts.py:validate/render_js — extend the existing static catalog generator rather than adding
  a browser fetch or public API"
- "landing/prompts/catalog.yaml:managed safety_terms — preserve the current cloud-safety copy contract as overrides or generated
  safety text"
- "tests/unit/landing/test_landing_quickstarts.py — extend existing generator/catalog tests with registry-parity gates"
- "_project/decisions/landing-prompts-route.md — correct the product decision record instead of relying on chat context"

must_preserve:
- "All supported runtime platforms with SQL or DataFrame capability are promptable after applicable filters are selected."
- "Filters still exclude non-applicable platforms by interface and deployment."
- "Default first-load state remains Generic + CLI + Test one platform + SQL + Local + duckdb + tpch + 0.01."
- "URL parameter names remain pinned: goal, agent, surface, interface, deployment, platform, platformA, platformB, benchmark,
  scale."
- "Dropdown platform ids use canonical PlatformRegistry ids; aliases do not create duplicate prompt options."
- "No new public CLI command, MCP prompt-rendering tool, browser fetch endpoint, or recipes.json file."
- "Managed-cloud safety guidance remains visible and conservative."
- "The prompt builder remains a static landing route backed by committed catalog.generated.js."

approach: |
  Treat the curated subset as a product defect, not a catalog expansion
  chore. Start by proving the current registry/catalog mismatch. Then move
  the inclusion source of truth into `scripts/generate_landing_quickstarts.py`
  using `PlatformRegistry` metadata. Keep YAML as configuration for
  human-authored presentation/safety overrides only. The hardest part is
  deployment classification: do not blindly accept the registry fallback that
  treats missing deployment metadata as local if that would misclassify
  managed cloud/server platforms in the UI. Prefer improving registry
  metadata when it is obviously incomplete, because other CLI/docs surfaces
  may benefit from the same correction.

anti_patterns:
- "DO NOT hand-add the missing 42-ish platforms to `landing/prompts/catalog.yaml` as another complete static list - because
  that recreates the unauthorized subset problem - derive inclusion from PlatformRegistry instead."
- "DO NOT mark every platform with missing deployment metadata as `local` without audit - because managed cloud and self-hosted
  platforms would appear under the wrong filter - fix metadata or add explicit prompt overrides."
- "DO NOT remove interface/deployment filtering - because filters are correct, only the source platform universe is wrong."
- "DO NOT add `landing/prompts/recipes.json` or a browser fetch of runtime registry data - because the decision record forbids
  a public unversioned JSON API."
- "DO NOT weaken managed-cloud safety validation to make generated entries pass - because all managed prompt paths must retain
  dependency/dry-run/no-secret guidance."
- "DO NOT change root landing navigation, docs templates, BenchBox CLI behavior, or MCP tool names as part of this fix."

verification:
- description: "Registry parity and generated catalog checks pass"
  command: "uv run -- python scripts/generate_landing_quickstarts.py --check && uv run -- python -m pytest tests/unit/landing/
    -q"
  expected_output: "exit 0; landing tests pass including registry-parity checks"
- description: "Generated prompt catalog covers all registry-supported platforms"
  command: "uv run -- python - <<'PY'\nimport json\nfrom pathlib import Path\nfrom benchbox.core.platform_registry import
    PlatformRegistry\ntext = Path('landing/prompts/catalog.generated.js').read_text()\npayload = text.split(' = ', 1)[1].rstrip(';\\\
    n')\ncatalog = json.loads(payload)\nexpected = {pid for pid in PlatformRegistry.get_all_platform_metadata() if (lambda
    caps: caps.supports_sql or caps.supports_dataframe)(PlatformRegistry.get_platform_capabilities(pid))}\nactual = {p['id']
    for p in catalog['platforms']}\nassert actual == expected, (sorted(expected - actual), sorted(actual - expected))\nprint(len(actual))\n\
    PY"
  expected_output: "exit 0; printed count matches registry-supported platform count"
- description: "Prompt JS parses cleanly"
  command: "node --check landing/prompts/prompts.js"
  expected_output: "exit 0"
- description: "No curated subset language remains in prompt catalog source"
  command: "! rg -ni 'MVP platform subset|implicitly excluded|source of truth for platform inclusion' landing/prompts/catalog.yaml
    scripts/generate_landing_quickstarts.py"
  expected_output: "exit 0; no catalog/generator language permits a hand-curated inclusion subset"
- description: "Forbidden public JSON catalog remains absent"
  command: "test ! -e landing/prompts/recipes.json"
  expected_output: "exit 0"

