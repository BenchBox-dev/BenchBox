impact:
  business_value: |
    The prompt builder should accurately represent BenchBox's platform
    breadth. Showing only a tiny curated subset undermines the landing page
    promise and hides supported cloud, server, local, and DataFrame options
    from users who are ready to try them.
  user_impact: |
    Users can generate prompts for every supported platform that matches
    their selected interface and deployment filters, rather than assuming
    unsupported status from missing dropdown options.
  technical_debt: |
    Removes a second platform source of truth from the landing surface and
    replaces it with a generator-time projection of the runtime registry.

success_metrics:
- "Generated `/prompts/` platform ids match every PlatformRegistry id with SQL or DataFrame support."
- "Managed cloud + SQL dropdown includes all managed SQL-capable platforms, not only MotherDuck, ClickHouse Cloud, and Snowflake."
- "Local + DataFrame dropdown includes all local DataFrame-capable platforms from the registry."
- "Generated deployment values are limited to the prompt UI vocabulary: local, self-hosted, managed."
- "Adding a new PlatformRegistry platform with SQL or DataFrame support fails landing tests unless it appears in catalog.generated.js."
- "Managed-platform prompts still include dependency/dry-run/no-secret guidance."

open_questions:
- question: "Should platform ids whose registry metadata has no deployment_modes be fixed in PlatformRegistry or represented
    as prompt-only overrides first?"
  gating: true
  affects: ["w2", "w3", "success_metric: generated platform ids match every supported platform with correct filters"]
  default: "Fix obvious registry metadata gaps; use prompt overrides only where registry ownership is ambiguous."
