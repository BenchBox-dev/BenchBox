id: execution-results-dataframe-routing-and-query-resolution
title: "Execution/results hardening: unify DataFrame routing, query resolution, and query-id filters"
worktree: main
priority: High
status: Completed
completed_date: "2026-05-21"
category: DataFrame Architecture

deps:
  needs:
  - architecture-contract-map-and-support-taxonomy

description: |
  Independent verification confirmed that DataFrame execution has two related
  sources of drift.

  The deprecated internal compatibility module
  `benchbox/core/runner/dataframe_runner.py` is still load-bearing for CLI and
  dry-run helpers. Production DataFrame execution uses
  `adapter.run_benchmark()` through
  `benchbox/platforms/dataframe/benchmark_mixin.py`, but dry-run imports
  `get_execution_mode()` and `_get_queries_for_benchmark()` from the deprecated
  module. Both the deprecated runner and the production mixin duplicate TPC-H
  stream ordering, TPC-DS stream/variant fallback, and bidirectional query
  subset filters.

  DataFrame-vs-SQL routing is also detected two ways. The lifecycle runner
  decides DataFrame execution from adapter `family in ("expression", "pandas")`,
  while adapter factory, capabilities, CLI/dry-run helpers, and the deprecated
  runner use platform suffix/default-mode logic. A new DataFrame family or
  registry default can therefore disagree with the lifecycle branch.

work:
- id: w0
  summary: "Revalidate DataFrame execution-mode predicates, deprecated helper imports, and duplicated query resolution"
  status: done
  notes: |
    Re-run current-tree checks before editing and record checked SHA plus a
    compact evidence summary in the implementation PR body or TODO notes.

    Required checks:
      - `rg -n "from benchbox\\.core\\.runner\\.dataframe_runner import|benchbox\\.core\\.runner\\.dataframe_runner|run_dataframe_benchmark\\(|is_dataframe_execution\\(|get_execution_mode\\(|_get_queries_for_benchmark\\(" benchbox tests --glob '!build/**' --glob '!docs/_build/**' --glob '!.venv/**'`.
      - `rg -n "adapter\\.family|is_dataframe_mode|is_dataframe_platform|endswith\\(\\\"-df\\\"\\)|endswith\\('-df'\\)" benchbox tests --glob '!build/**' --glob '!docs/_build/**' --glob '!.venv/**'`.
      - Compare `benchbox/core/runner/dataframe_runner.py` TPC-H/TPC-DS query resolution against `benchbox/platforms/dataframe/benchmark_mixin.py`.
      - Check docs/reference/backward-compatibility.md and docs/reference/public-contracts.md for the current deprecated compatibility promise.

    Decision gate: do not delete `dataframe_runner.py` in this TODO unless
    the compatibility registry and tests are updated under an explicit
    removal decision. The expected path is shared helper extraction first.

- id: w1
  summary: "Create a shared DataFrame query-resolution helper used by mixin and dry-run compatibility paths"
  needs: [w0]
  status: done
  notes: |
    Extract DataFrame benchmark query resolution into a single internal helper
    module. The helper should own:
      - benchmark ID normalization;
      - TPC-H stream permutation ordering;
      - TPC-DS standard stream generation;
      - TPC-DS variant lookup and fallback behavior;
      - ClickBench DataFrame query registry retrieval;
      - benchmark-instance `get_dataframe_queries()` fallback;
      - MagicMock/synthetic hook rejection if still needed.

    Candidate destination: `benchbox/core/dataframe/query_resolution.py` or a
    similarly focused core DataFrame module. Keep it internal unless the
    public-contract map is updated.

    The production mixin and dry-run query extraction must call the helper.
    The deprecated runner may call the helper while remaining as a thin
    compatibility wrapper.

- id: w2
  summary: "Unify DataFrame execution-mode detection behind one predicate"
  needs: [w0]
  status: done
  notes: |
    Add one predicate that can answer "does this adapter/config/platform mean
    DataFrame execution?" without relying on two unrelated sources of truth.

    The predicate must account for:
      - explicit execution mode in database config;
      - `-df` suffix and deployment suffix handling;
      - PlatformRegistry default mode;
      - actual adapter DataFrame capability;
      - existing family values `expression` and `pandas`;
      - future DataFrame family values without modifying runner.py.

    Candidate shape: adapter property/protocol `is_dataframe` plus a factory
    resolver for config/platform strings. If a property is added to adapters,
    include compatibility fallback for older adapters during the migration.

- id: w3
  summary: "Replace duplicated bidirectional Q-prefix filter normalization with one helper"
  needs: [w1]
  status: done
  notes: |
    Extract the exact bidirectional query filter behavior currently duplicated
    in `BenchmarkExecutionMixin._build_query_filter()` and
    `dataframe_runner._execute_dataframe_queries()`:
      - input `Q1` matches both `Q1` and `1`;
      - input `1` matches both `1` and `Q1`;
      - case-insensitive input;
      - variant IDs such as `Q14a` remain usable.

    Do not accidentally replace this with the existing one-way
    `normalize_query_id()` helper unless the helper is extended to preserve
    the bidirectional filter-set contract.

    Reconcile, but do not necessarily replace, SQL adapter
    `_apply_query_subset()`: it resolves against actual query dict keys and
    is related rather than identical.

- id: w4
  summary: "Remove production-path dependency on deprecated dataframe_runner helpers while preserving compatibility imports"
  needs: [w1, w2, w3]
  status: done
  notes: |
    Update `benchbox/cli/orchestrator.py` and `benchbox/core/dryrun.py` to use
    the shared execution-mode and query-resolution helpers rather than
    importing from `benchbox.core.runner.dataframe_runner`.

    Leave `dataframe_runner.py` as a deprecated internal compatibility module
    if tests or public-contract docs require it. Its helper functions should
    delegate to the new shared helpers so behavior cannot drift.

    Update docs/reference/backward-compatibility.md only if the lifecycle
    status or removal timing changes.

- id: w5
  summary: "Add parity tests for DataFrame routing, dry-run query extraction, and production mixin query resolution"
  needs: [w4]
  status: done
  notes: |
    Tests must prove:
      - lifecycle runner, adapter factory, CLI/orchestrator, and dry-run agree
        on DataFrame-vs-SQL mode for representative platforms including
        `polars`, `polars-df`, `pandas-df`, `datafusion-df`, `duckdb`, and a
        deployment-suffixed DataFrame platform;
      - dry-run query extraction and production mixin query resolution return
        the same ordered query IDs for TPC-H and TPC-DS at representative
        stream IDs;
      - TPC-DS variant fallback strict/allow modes remain unchanged;
      - Q-prefix query subset filtering still accepts both prefixed and bare
        inputs.

deferred:
- summary: "Delete `benchbox/core/runner/dataframe_runner.py` completely"
  reason: "The current public/backward-compat registry describes it as a deprecated internal compatibility runner; deletion
    needs a separate removal-window decision after helper imports migrate."
- summary: "Redesign DataFrame query registries for all benchmark families"
  reason: "This TODO centralizes existing routing/query-resolution behavior; broader registry redesign should wait until drift
    is removed."
- summary: "Remove MagicMock-aware hook handling from production modules"
  reason: "Can be done after the shared helper lands and tests stop requiring MagicMock internals."

