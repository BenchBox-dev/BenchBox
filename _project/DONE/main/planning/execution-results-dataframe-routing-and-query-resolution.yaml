must_preserve:
- "Production DataFrame execution remains `adapter.run_benchmark()` plus `BenchmarkExecutionMixin`."
- "Dry-run DataFrame query previews remain available for supported DataFrame benchmarks."
- "TPC-H stream permutation and TPC-DS stream/variant fallback behavior does not change."
- "Existing `dataframe_runner.py` compatibility imports keep working unless the public-contract map explicitly approves removal."
- "No new DataFrame platform dependency is imported eagerly."

approach: |
  Split the work into two small centers of gravity: one query-resolution helper
  and one execution-mode predicate. Route production mixin, dry-run, CLI, and
  deprecated compatibility helpers through those centers. Keep compatibility
  wrappers until deletion is separately authorized.

anti_patterns:
- "DO NOT decide DataFrame mode in runner.py by hard-coding family names again -- future families must not require runner
  edits."
- "DO NOT delete `dataframe_runner.py` just because it is deprecated -- dry-run and tests still import it."
- "DO NOT let dry-run call a different TPC-DS variant fallback implementation than real execution."
- "DO NOT replace bidirectional Q-prefix filters with canonical stripping unless tests prove all caller contracts still work."
- "DO NOT import optional DataFrame libraries in mode-detection helpers."

