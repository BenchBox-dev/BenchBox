impact:
  business_value: |
    Gives users and agents consistent chart advice and error messages across
    CLI and MCP.
  user_impact: |
    Agents can discover `power_bar`, and valid-but-inapplicable charts report
    missing data rather than falsely claiming unsupported chart types.
  technical_debt: |
    Removes duplicated render orchestration and production-dead suggestion
    logic from the visualization subsystem.

