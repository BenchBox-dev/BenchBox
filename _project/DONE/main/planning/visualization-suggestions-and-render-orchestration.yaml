prior_art:
  - "benchbox/core/visualization/result_plotter.py: normalization and currently dead private suggester - delegate or delete private suggestion behavior."
  - "benchbox/mcp/tools/visualization.py: current agent-facing suggestion and render surface - preserve response compatibility where possible."
  - "benchbox/cli/commands/visualize.py: current console rendering behavior - preserve `auto` and template semantics unless explicitly changed."
  - "benchbox/core/visualization/templates.py: named chart bundles - reuse rather than duplicating template iteration."
  - "benchbox/core/visualization/utils.py: existing shared subtitle and power-run helpers - reuse for profile extraction."
  - "benchbox/core/visualization/chart_types.py: `requires_two_results` metadata - use instead of hard-coding pairwise chart names."

must_preserve:
  - "CLI `visualize --chart-type all` and default `auto` continue to render the expected chart set unless the implementation records an explicit behavior-change decision."
  - "MCP `suggest_charts` response keeps chart suggestions, data profile, and primary recommendation fields unless client compatibility is updated."
  - "MCP `generate_chart` keeps returning inline ASCII content for successful ASCII renders."
  - "Pairwise-only charts still require exactly two results when invoked explicitly."
  - "Template rendering continues to skip inapplicable charts rather than failing the entire template when at least one chart renders."

approach: |
  Build one core profile, one core suggester, and one core render-set outcome.
  Keep UI-specific formatting at the edges: CLI prints, MCP serializes. Make
  not-applicable a first-class outcome rather than overloading it with unknown
  chart-type handling.

anti_patterns:
  - "DO NOT add another MCP-only suggestion branch for `power_bar` without removing the divergent suggestion model."
  - "DO NOT import MCP or Click/Rich types into core visualization orchestration."
  - "DO NOT rely on `None` alone to mean both unknown chart and not-applicable chart."
  - "DO NOT delete tests for `power_bar` suggestions unless replacement tests cover the production path."

verification:
