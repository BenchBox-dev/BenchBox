    command: "uv run -- python -m pytest tests/unit/visualization/test_visualize_cli.py tests/unit/visualization/test_power_run_charting.py tests/unit/mcp/test_visualization_tools.py -q"
    expected_output: "CLI and MCP chart rendering/suggestion tests pass."
  - description: "Suggestion coverage check confirms `power_bar` can be recommended."
    command: "uv run -- python -m pytest tests/unit/mcp/test_visualization_tools.py tests/unit/visualization/test_power_run_charting.py -k 'power_bar or suggest' -q"
    expected_output: "Production-facing suggestion tests prove power-result inputs can recommend power_bar."
  - description: "Known inapplicable chart no longer reports as unsupported through MCP tests."
    command: "uv run -- python -m pytest tests/unit/mcp/test_visualization_tools.py -k 'inapplicable or unsupported or chart' -q"
    expected_output: "Unknown chart and known-but-inapplicable chart cases are distinct."
  - description: "TODO graph remains valid after implementation."
    command: "uv run --project _project/scripts -- python _project/scripts/todo_cli.py validate && uv run --project _project/scripts -- python _project/scripts/todo_cli.py check-graph"
    expected_output: "TODO validation and graph checks pass."

