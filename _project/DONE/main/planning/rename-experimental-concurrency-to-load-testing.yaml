id: rename-experimental-concurrency-to-load-testing
title: "Rename experimental/concurrency to load_testing to clarify intent (stays experimental)"
worktree: main
priority: Medium
status: Completed
completed_date: "2026-07-09"
category: Core Functionality

description: |
  DECISION MADE (do not re-litigate promote-vs-remove): keep
  benchbox/experimental/concurrency/, but RENAME it -- the name "concurrency"
  is a misnomer. It is not the TPC spec concurrency (that lives in
  core/throughput/). It is a load-testing + workload-analysis framework:
  - patterns.py: WorkloadPattern shapes (Steady/Burst/RampUp/Spike/Step/Wave)
    -- time-varying demand profiles.
  - executor.py: ConcurrentLoadExecutor -- drives a pattern, per-stream
    connections, dynamic concurrency targeting, background resource monitor.
  - pool_tester.py: ConnectionPoolTester -- pool exhaustion / churn / under-load.
  - analyzer.py: ConcurrencyAnalyzer -- queue-dwell, contention, scaling curves.

  The package name collides conceptually with core/throughput and hides what the
  code does. Rename to `benchbox/experimental/load_testing/` (recommended). The
  class names already use the operative term ("ConcurrentLoad*", "Workload*"),
  so only the package name and one analyzer class are actually misleading.

  SCOPE: this item is a rename + honest re-documentation ONLY. It stays under
  benchbox.experimental (unsupported, no stability guarantees, not wired into
  the CLI/registry). Hardening and any decision to wire it into the CLI/UAT are
  DEFERRED to a separate future item -- do not do that work here.

prior_art:
  - "benchbox/experimental/concurrency/__init__.py — the public surface (__all__) whose internal import paths must be rewritten to the new package name."
  - "benchbox/experimental/nl2sql/, gpu/, multiregion/, aiml_functions/ — sibling experimental subsystems; keep the same 'experimental package, unsupported' shape and README/FAQ treatment."
  - "benchbox/core/throughput/ — the SPEC concurrency the old name collides with; the rename exists to disambiguate from this."
  - "README.md:41 and docs/usage/faq.md:20 — the prose that lists 'concurrency' as an experimental subsystem; update the name there too."

work:
  - id: w1
    summary: "git mv benchbox/experimental/concurrency -> benchbox/experimental/load_testing and rewrite internal imports in __init__.py"
    status: done
    notes: |
      Update the four `from benchbox.experimental.concurrency.<mod> import`
      lines in __init__.py to the new package path. Keep __all__ unchanged.
  - id: w2
    summary: "Rename the test dir and update all importers"
    needs: [w1]
    status: done
    notes: |
      git mv tests/unit/core/concurrency -> tests/unit/core/load_testing.
      Update imports in test_analyzer.py, test_executor.py, test_patterns.py,
      test_pool_tester.py, AND tests/unit/core/test_concurrency_executor_and_joinorder.py
      (which stays put but imports the package).
  - id: w3
    summary: "Update coverage/config references"
    needs: [w1]
    status: done
    notes: |
      pyproject.toml:666-667 and .coveragerc_core:22,24 list
      benchbox/experimental/concurrency/{executor,pool_tester}.py -- repoint to
      the new path.
  - id: w4
    summary: "Rename the one class that perpetuates the confusion: ConcurrencyAnalyzer -> LoadAnalyzer (or WorkloadAnalyzer)"
    needs: [w1]
    status: done
    notes: |
      Optional but recommended for consistency with the package name. Update
      __all__, the class def in analyzer.py, and its importers/tests. The
      ConcurrentLoad*/Workload* classes already read correctly and can stay.
  - id: w5
    summary: "Re-document honestly: update README.md:41 and docs/usage/faq.md:20 to name 'load_testing' and describe it as unsupported load-testing/workload-analysis research"
    needs: [w1]
    status: done

must_preserve:
  - "The package stays under benchbox.experimental and remains unsupported/undocumented as a product feature (no CLI/registry wiring in this item)."
  - "Public class names ConcurrentLoadExecutor/Config/Result, the WorkloadPattern family, and the pool-tester types keep working (only the package path and ConcurrencyAnalyzer change)."
  - "All existing tests still pass after the path/class updates."

anti_patterns:
  - "DO NOT wire it into the CLI/UAT or 'harden' it here — because this item is a rename only — capture that as a separate deferred item."
  - "DO NOT leave stale import paths — because coverage config and the joinorder test import it from outside the package dir — grep the whole repo for the old path after moving."

verification:
  - description: "No references to the old package path remain"
    command: "rg -rn --fixed-strings 'experimental.concurrency' benchbox tests pyproject.toml .coveragerc_core"
    expected_output: "no matches"
  - description: "Renamed package imports and tests pass"
    command: "uv run -- python -m pytest tests/unit/core/load_testing/ tests/unit/core/test_concurrency_executor_and_joinorder.py -v"
    expected_output: "all pass under the new path"

scope_limit:
  only_modify:
    - "benchbox/experimental/concurrency/"
    - "benchbox/experimental/load_testing/"
    - "tests/unit/core/concurrency/"
    - "tests/unit/core/load_testing/"
    - "tests/unit/core/test_concurrency_executor_and_joinorder.py"
    - "pyproject.toml"
    - ".coveragerc_core"
    - "README.md"
    - "docs/usage/faq.md"

deferred:
  - summary: "Harden the framework and decide whether to wire it into the CLI/UAT as a supported load-testing mode"
    reason: "Out of scope for the rename; revisit when there is time to invest in the feature."

impact:
  technical_debt: |
    Removes a naming collision with the spec throughput path and makes the
    module's purpose (load testing / workload analysis) legible, so a future
    reader does not confuse it with TPC concurrency.

metadata:
  tags: [concurrency, experimental, load-testing, rename, naming]
  estimated_effort: Small
  created_date: "2026-07-09"

open_questions:
  - question: "Final package name: load_testing (recommended) vs workload_lab vs load_analysis?"
    gating: false
    affects: ["w1"]
    default: "load_testing — industry-standard, covers both load generation and analysis, matches existing ConcurrentLoad*/Workload* class names."
