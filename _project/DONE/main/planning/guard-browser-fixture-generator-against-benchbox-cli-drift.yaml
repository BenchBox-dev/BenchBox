id: guard-browser-fixture-generator-against-benchbox-cli-drift
title: "Guard the browser fixture generator against silent `benchbox explorer build` CLI drift"
worktree: main
priority: Medium
status: Completed
completed_date: "2026-04-19"
category: Testing and Quality Assurance

description: |
  The deterministic fixture corpus still shells out to
  `benchbox explorer build`, but it no longer depends on a brittle
  undocumented flag surface. The integration now has an explicit
  contract:

  1. `benchbox/core/explorer_pipeline/contract.py` declares the versioned
     build contract and required flags.
  2. `benchbox explorer build-contract` emits that contract as JSON.
  3. `results-explorer/scripts/validate-explorer-build-contract.mjs`
     checks the version/flags before fixture generation starts.
  4. `tests/unit/cli/test_explorer_build_contract.py` pins the Python-side
     command surface so drift fails in the unit suite before the browser
     harness ever looks flaky.

deps:
  needs:
    - implement-results-explorer-browser-functional-tests

work:
  - id: w1
    summary: "Declare a stable contract surface on the Python side"
    status: done
    notes: |
      Added `benchbox/core/explorer_pipeline/contract.py` plus the hidden
      `benchbox explorer build-contract` command in
      `benchbox/cli/commands/explorer.py`.

  - id: w2
    summary: "Teach `generate-browser-fixtures.mjs` to assert the contract before invoking `benchbox explorer build`"
    needs: [w1]
    status: done
    notes: |
      The generator now runs
      `results-explorer/scripts/validate-explorer-build-contract.mjs`
      before it builds fixtures and exits non-zero on any mismatch.

  - id: w3
    summary: "Add a pytest that pins the Python-side flag surface"
    needs: [w1]
    status: done
    notes: |
      Added `tests/unit/cli/test_explorer_build_contract.py`, which checks
      the emitted contract JSON and asserts the required flag options are
      still present on `explorer build`.

must_preserve:
  - "`benchbox explorer build` continues to work for all current callers (the fixture generator and any doc snippets)."
  - "The fixture generator remains a single-entry `node scripts/generate-browser-fixtures.mjs` command - no new required env vars."
  - "The browser suite remains the source of truth for user-visible coverage; this TODO only adds an early warning, not replacement coverage."

approach: |
  Keep the contract small and ugly on purpose. A shared constant plus
  a one-line assertion beats a generated TypeScript binding or an
  OpenAPI-style schema for a surface this narrow. If the coupling grows
  (more commands, richer output), revisit.

anti_patterns:
  - "DO NOT replace the subprocess call with an in-process Python→JS bridge - because subprocess-based coupling is the only thing keeping the fixture generator deployable without a Node↔Python runtime - keep the shell-out and add the version check alongside it."
  - "DO NOT swallow the mismatch as a warning - because the whole point is to fail fast so the real root cause surfaces in CI - exit non-zero on mismatch."

verification:
  - description: "The TODO item itself validates cleanly"
    command: "uv run _project/scripts/validate_todo.py _project/TODO/main/planning/guard-browser-fixture-generator-against-benchbox-cli-drift.yaml"
    expected_output: "Validation passes with no schema or DAG errors"
  - description: "The Python contract test pins the flags the generator depends on"
    command: "uv run -- python -m pytest tests/unit/cli/test_explorer_build_contract.py -q"
    expected_output: "Contract test passes; flag surface unchanged"
  - description: "The JS-side validator fails fast before fixture generation starts"
    command: "cd results-explorer && node scripts/validate-explorer-build-contract.mjs"
    expected_output: "Validator exits zero and prints the aligned version, command, and required flags"

scope_limit:
  only_modify:
    - "results-explorer/scripts/generate-browser-fixtures.mjs"
    - "benchbox/cli/commands/explorer.py"
    - "benchbox/core/explorer_pipeline/"
    - "tests/unit/cli/"
  do_not_modify:
    - "results-explorer/src/"
    - "results-explorer/public/data/"
    - "results-data/bundles/"
    - "results-explorer/e2e/"

metadata:
  tags:
    - "results"
    - "explorer"
    - "testing"
    - "cli"
    - "contract"
    - "infrastructure"
  estimated_effort: "Small"
  created_date: "2026-04-19"

impact:
  business_value: |
    Prevents a class of cross-language drift bug that wastes
    contributor time and makes the browser suite look flaky when the
    real fault is on the Python side.
  user_impact: |
    None directly - this is infrastructure-side resilience.
  technical_debt: |
    Makes the implicit contract between `benchbox explorer build` and
    the fixture generator explicit and testable.
