id: df-support-tpchavoc
title: "Add DataFrame execution support to TPC-Havoc benchmark"
worktree: main
priority: Medium
status: Completed
completed_date: "2026-04-10"
description: |
  Add DataFrame variant implementations for TPC-Havoc, enabling execution of
  structurally diverse TPC-H query variants on Polars, PySpark, DataFusion, Pandas,
  Modin, cuDF, and Dask platforms.

  TPC-Havoc generates 10 structural SQL variants per TPC-H query (22 queries x 10
  variants = 220 total). Each variant is semantically equivalent but uses different
  SQL constructs (CTEs, scalar subqueries, window functions, UNION, etc.) to stress
  different optimizer components.

  For DataFrame execution, the concept translates differently: instead of varying SQL
  syntax, DataFrame variants vary the API call sequence - different join orders,
  different aggregation strategies (pre-filter vs post-filter), lazy vs eager
  evaluation patterns, and different window function formulations. The goal shifts
  from "stress the SQL optimizer" to "measure how different DataFrame API patterns
  affect execution performance on the same logical query."

  TPC-H already has DataFrame queries (tpch/dataframe_queries.py) with 22 queries
  in both expression and pandas families. TPC-Havoc DataFrame extends these with
  alternative implementations that use structurally different DataFrame API patterns.

  This is architecturally unique - no other benchmark has the variant concept in
  DataFrame mode. Requires designing a new variant registration pattern for
  DataFrameQuery objects.

category: Core Functionality

work:
- id: w1
  summary: "Design DataFrame variant architecture and registration pattern"
  status: done
  notes: |
    Design how DataFrame variants integrate with the existing DataFrameQuery/QueryRegistry
    system. Key decisions:

    1. Query ID scheme: Use "Q1v1", "Q1v2", ... "Q1v10" or "Q1-scalar-subquery",
       "Q1-cte-rewrite"? The former is consistent with SQL variant IDs; the latter
       is more descriptive for DataFrame where structural names matter.

    2. Registry structure: One flat QueryRegistry with all 220 entries, or a nested
       structure (VariantRegistry wrapping QueryRegistry)? Flat is simpler and works
       with the existing dataframe_runner dispatch.

    3. Variant categories for DataFrame (map from SQL variant types):
       - join-reorder: Different .join() sequences for same result
       - pre-filter: Filter before join vs after join
       - window-alternative: Window function vs groupby+join for same logic
       - cte-inline: Intermediate DataFrame vs chained expression
       - aggregation-strategy: Multiple small groupbys vs single large groupby
       - broadcast-hint: Explicit broadcast for small tables vs default
       - lazy-eager: .collect() placement variations (expression family only)

    4. How variants relate to base TPC-H queries: Import from tpch/dataframe_queries.py
       as the "v0" baseline, then define v1-v10 as alternatives.

    Write a short design doc in benchbox/core/tpchavoc/DATAFRAME_VARIANTS.md
    documenting the chosen approach before implementation.

- id: w2
  summary: "Implement expression-family variants for Q1-Q3 (30 variants)"
  needs: [w1]
  status: done
  notes: |
    Create benchbox/core/tpchavoc/dataframe_queries/ directory with per-query modules
    (q01.py, q02.py, q03.py). For each query, create 10 expression_impl variants.

    Q1 (Pricing Summary - filter + groupby + aggregation):
    - v1: Baseline (import from tpch dataframe Q1)
    - v2: Pre-compute aggregation columns before groupby
    - v3: Window functions instead of groupby (partition + distinct)
    - v4: Two-pass: compute sums first, then averages from sums
    - v5: Filter using .when().then() instead of boolean mask
    - v6: Explicit column selection before groupby (projection pushdown hint)
    - v7: Sort before groupby (tests sort-based aggregation)
    - v8: Intermediate DataFrame for filtered data (CTE equivalent)
    - v9: Compute each aggregate separately then join results
    - v10: Reverse sort order then reverse at end

    Q2 (Minimum Cost Supplier) and Q3 (Shipping Priority) follow similar variant
    axes but emphasize join-reorder variants due to multi-table joins.

    Each variant must produce identical results to the base query.

- id: w3
  summary: "Implement expression-family variants for Q4-Q6 (30 variants)"
  needs: [w1]
  status: done
  notes: |
    Continue with q04.py, q05.py, q06.py.

    Q4 (Order Priority Checking - EXISTS subquery):
    - Variant axes: semi-join vs filter-join, pre-filter lineitem dates vs post-filter
    Q5 (Local Supplier Volume - 6-table join + groupby):
    - Variant axes: join order (6 permutations), pre-filter nation/region before join
    Q6 (Forecasting Revenue Change - single-table filter + sum):
    - Variant axes: filter order, compound vs chained filters, pre-select columns

- id: w4
  summary: "Implement expression-family variants for Q7-Q10 (40 variants)"
  needs: [w1]
  status: done
  notes: |
    q07.py through q10.py. These are join-heavy queries where the primary variant
    axis is join order:
    - v1: Baseline join order from tpch/dataframe_queries.py
    - v2-v4: Alternative join orders (small-to-large, large-to-small, star-join)
    - v5-v7: Pre-filter variants (filter dimension tables before joining)
    - v8-v10: Aggregation strategy variants

    Q7 (Volume Shipping), Q8 (National Market Share), Q9 (Product Type Profit),
    Q10 (Returned Item Reporting).

- id: w5
  summary: "Implement expression-family variants for Q11-Q14 (40 variants)"
  needs: [w1]
  status: done
  notes: |
    q11.py through q14.py. Mix of subquery-heavy and aggregation-heavy queries.

    Q11 (Important Stock Identification - HAVING with subquery):
    - Variant axes: subquery as intermediate DF vs inline, threshold pre-compute
    Q12 (Shipping Modes and Order Priority - CASE + groupby):
    - Variant axes: CASE as .when() chain vs boolean masks, filter-first vs agg-first
    Q13 (Customer Distribution - LEFT JOIN + groupby + groupby):
    - Variant axes: two-stage vs single-stage aggregation, NOT LIKE as anti-join
    Q14 (Promotion Effect - CASE inside SUM):
    - Variant axes: conditional sum vs filter+sum+join, pre-filter parts

- id: w6
  summary: "Implement expression-family variants for Q15-Q18 (40 variants)"
  needs: [w1]
  status: done
  notes: |
    q15.py through q18.py. Complex subquery patterns.

    Q15 (Top Supplier - subquery for max revenue):
    - Variant axes: intermediate DF vs chained, top-1 vs filter-to-max
    Q16 (Parts/Supplier Count - DISTINCT, NOT IN):
    - Variant axes: anti-join vs ~isin(), distinct before vs after join
    Q17 (Small Quantity Order Revenue - correlated subquery):
    - Variant axes: join-with-avg vs window function, filter timing
    Q18 (Large Volume Customer - HAVING):
    - Variant axes: filter-after-groupby vs pre-aggregate, join order

- id: w7
  summary: "Implement expression-family variants for Q19-Q22 (40 variants)"
  needs: [w1]
  status: done
  notes: |
    q19.py through q22.py. Most complex query patterns.

    Q19 (Discounted Revenue - compound OR conditions):
    - Variant axes: union of filtered sets vs single complex filter, per-brand subframes
    Q20 (Potential Part Promotion - multi-level subquery):
    - Variant axes: join chain vs nested intermediates, semi-join vs filter
    Q21 (Suppliers Who Kept Orders Waiting - EXISTS/NOT EXISTS):
    - Variant axes: semi-join + anti-join vs boolean masks, join order for 4 tables
    Q22 (Global Sales Opportunity - nested subqueries):
    - Variant axes: intermediate DFs vs chained, avg pre-compute vs inline

- id: w8
  summary: "Implement pandas-family variants for Q1-Q11 (110 variants)"
  needs: [w2, w3, w4, w5]
  status: done
  notes: |
    Add pandas_impl variants to q01.py through q11.py, paralleling expression_impl.
    Many variant strategies translate directly (join reorder, pre-filter, etc.).

    Replace expression-specific variants (lazy/eager, collect placement) with
    pandas-specific alternatives:
    - .apply() vs vectorized operations
    - pd.merge() vs df.join() (index-based)
    - .groupby().agg() vs .pivot_table()
    - iterative merge chain vs reduce(merge, tables)

- id: w9
  summary: "Implement pandas-family variants for Q12-Q22 (110 variants)"
  needs: [w6, w7]
  status: done
  notes: |
    Add pandas_impl variants to q12.py through q22.py.

    For the complex subquery patterns (Q15-Q22), pandas variants emphasize:
    - Intermediate DataFrames vs chained operations
    - .merge() join order permutations
    - .pipe() chains vs sequential assignment
    - Index-based operations vs column-based

- id: w10
  summary: "Wire up TPC-Havoc benchmark class and registry for DataFrame dispatch"
  needs: [w8, w9]
  status: done
  notes: |
    Integration:
    1. Add get_dataframe_queries() method to TPCHavocBenchmark
       - Must return all variants (not just base queries)
       - Consider whether to return all 220 at once or support filtering by query/variant
    2. Set supports_dataframe: True in benchmark_registry.py for tpchavoc
    3. Add variant equivalence validation for DataFrame results
       (extend ResultValidator to handle DataFrame output comparison)

- id: w11
  summary: "Add unit tests for TPC-Havoc DataFrame variants"
  needs: [w10]
  status: done
  notes: |
    Create tests/unit/core/tpchavoc/test_dataframe_queries.py:
    - Test variant registration (220 total, 10 per query)
    - Test all variants for Q1 produce identical results on small TPC-H data
    - Test expression_impl and pandas_impl for at least Q1-Q3 variants
    - Test variant metadata (description, categories)
    - Mark equivalence tests @pytest.mark.slow (they need TPC-H SF=0.01 data)

