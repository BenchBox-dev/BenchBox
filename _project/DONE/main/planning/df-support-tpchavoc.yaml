impact:
  business_value: |
    Unique benchmark capability - no other tool measures how DataFrame API patterns
    affect performance for semantically equivalent operations. Valuable for DataFrame
    library developers optimizing their engines and for users choosing between API
    patterns.
  user_impact: |
    Users can run `benchbox run --platform polars-df --benchmark tpchavoc` to discover
    which DataFrame coding patterns perform best on their platform, informing code
    style decisions for production DataFrame workloads.

