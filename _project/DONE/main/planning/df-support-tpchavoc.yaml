  reason: "Full equivalence testing is expensive (220 queries x 2 families). Start with Q1-Q3 equivalence in unit tests, defer
    comprehensive testing to integration suite."
- summary: "Variant performance analysis tooling - identify which DataFrame patterns are fastest per platform"
  reason: "Analysis tooling is follow-up work after the implementations exist and have been benchmarked."
- summary: "Replace Q16-Q22 result-replay variants with deeper hand-written structural rewrites"
  reason: "The first complete registry covers Q16-Q22 with canonical execution plus final projection/order replay to preserve
    equivalence. Deeper variants for Q19 condition unions, Q20 semi-join ordering, Q21 anti-join alternatives, and Q22
    materialized average balance should be developed with broader equivalence coverage."

