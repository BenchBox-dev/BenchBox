approach: |
  Create a dataframe_queries/ subdirectory (like clickbench) with per-query modules
  (q01.py through q22.py). Each module exports 10 DataFrameQuery objects.

  Import the base TPC-H DataFrame implementation as v1 (baseline) for each query from
  tpch/dataframe_queries.py, then define v2-v10 as structural alternatives.

  A central registry.py aggregates all queries into a single QueryRegistry with
  IDs like "Q1v1", "Q1v2", etc. The benchmark's get_dataframe_queries() returns
  this registry.

  Design the variant categories based on actual TPC-H query structure - not all
  variant types apply to all queries (e.g., join-reorder only applies to multi-join
  queries). Document which variant strategies apply to which queries in
  DATAFRAME_VARIANTS.md.

  Use the existing TPC-H parameter override system (set_parameter_overrides) for
  seed-based reproducibility.

implementation_order: |
  Implement LAST among the 5 DataFrame support TODOs. TPC-Havoc is the largest scope
  (220 variants) and architecturally unique (variant concept). Implement after
  df-support-flightdata and df-support-joinorder establish the QueryRegistry pattern,
  since TPC-Havoc extends it with the variant registration design. All 5 TODOs modify
  benchmark_registry.py - sequential implementation avoids merge conflicts.

anti_patterns:
- "DO NOT modify tpch/dataframe_queries.py - because TPC-Havoc extends TPC-H, not modifies it - import base implementations
  and build variants on top"
- "DO NOT create variants that produce different results - because semantic equivalence is the core property - every variant
  must produce identical output for the same input data and parameters"
- "DO NOT create trivial variants (e.g., just renaming aliases) - because the point is structural diversity - each variant
  must use a genuinely different execution strategy"

verification:
- description: "All 220 DataFrame variants are registered"
  command: "uv run -- python -c \"from benchbox.core.tpchavoc.dataframe_queries import get_dataframe_queries; r = get_dataframe_queries();
    print(f'{len(r)} variants registered'); assert len(r) == 220\""
  expected_output: "220 variants registered"
- description: "TPC-Havoc benchmark reports supports_dataframe=True"
  command: "uv run -- python -c \"from benchbox.core.benchmark_registry import BENCHMARK_METADATA; print(BENCHMARK_METADATA['tpchavoc']['supports_dataframe'])\""
  expected_output: "True"
- description: "Q1 variants produce equivalent results"
  command: "uv run -- python -m pytest tests/unit/core/tpchavoc/test_tpchavoc_dataframe_queries.py -k 'q1_equivalence' -v"
  expected_output: "all tests pass, 0 failures"

