must_preserve:
  - "Do not break top-level wrapper facade tests unless an explicit deprecation path lands in the same PR."
  - "Do not move benchmark-family code in a way that changes result bundle shape."
  - "Do not introduce platform adapter imports into core engine modules."

approach: |
  Start with API classification and small ambiguity removals. Treat a
  benchmark-family plugin seam as a design gate before extraction, and use tests
  to keep wrappers, registries, and loaders aligned.

anti_patterns:
  - "DO NOT interpret duplicate wrapper reachability as accidental -- tests assert facade behavior -- classify first."
  - "DO NOT create a third benchmark base class while cleaning up two existing bases -- remove, alias, or justify the secondary base."
  - "DO NOT split core by moving files mechanically -- dependency direction and public API status must drive the boundary."

