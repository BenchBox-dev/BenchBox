    - core
    - plugins
  estimated_effort: "4-8 days"
  created_date: "2026-05-21"
  last_updated: "2026-05-21T00:00:00Z"

impact:
  business_value: |
    Keeps user-facing benchmark APIs stable while reducing internal extension
    cost for new benchmark families.
  user_impact: |
    Users and contributors know whether to rely on wrappers, CLI, MCP, or loader
    APIs.
  technical_debt: |
    Removes ambiguous base classes and starts turning core from a dumping ground
    into explicit engine and benchmark-family boundaries.

