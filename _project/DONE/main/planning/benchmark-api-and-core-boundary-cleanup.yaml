id: benchmark-api-and-core-boundary-cleanup
title: "Architecture hardening: classify benchmark APIs and reduce core boundary drift"
worktree: main
priority: Medium
status: Completed
completed_date: "2026-05-21"
category: Core Architecture

deps:
  needs:
    - architecture-contract-map-and-support-taxonomy

description: |
  Benchmark APIs are split across tested top-level wrappers, a public
  benchbox.base.BaseBenchmark, a small remaining core.base_benchmark class,
  lazy registries, loaders, and benchmark-family code inside broad core/base
  mixins. The wrappers are not accidental; tests assert facade behavior. The
  cleanup target is the remaining ambiguous base/loader split and the lack of a
  benchmark-family extension boundary, not a wrapper purge.

  This item classifies benchmark API surfaces, retires or justifies the second
  base class, and prepares a benchmark-family plugin seam without a broad
  rewrite.

work:
  - id: w0
    summary: "Revalidate benchmark API surfaces, wrapper tests, registries, and core boundary issues"
    status: done
    notes: |
      Completed evidence at checked SHA
      1d454632ba73911bc4ff0cf0a3fb8ec22227a7a8:
        - benchbox/base.py remains the beta-public BaseBenchmark surface;
          run_with_platform remains the beta-public adapter execution hook.
        - benchbox/core/base_benchmark.py remains a distinct deprecated
          internal compatibility base, not an alias.
        - Production imports of the deprecated core base are limited to
          benchbox/core/datavault/benchmark.py and
          benchbox/core/tpcds_obt/benchmark.py.
        - tests/unit/test_wrapper_facades_fast.py asserts wrapper behavior;
          wrapper reachability is not accidental.
        - benchbox/__init__.py exposes 21 top-level benchmark facades: 7 eager
          imports and 14 lazy _BENCHMARK_REGISTRY entries.
        - benchbox/core/benchmark_loader.py resolves 23 core benchmark families
          from registry-backed CORE_BENCHMARK_CLASS_NAMES.
        - docs/reference/backward-compatibility.md now records the remaining
          core-base migration target explicitly.

  - id: w1
    summary: "Decision gate: define wrapper-vs-CLI-vs-loader public API contract"
    needs: [w0]
    status: done
    notes: |
      Decision recorded in docs/reference/public-contracts.md:
        - CLI, top-level benchmark wrappers, benchbox.base.BaseBenchmark,
          BaseBenchmark.run_with_platform, registry metadata, and MCP remain
          beta-public surfaces.
        - benchbox.core.benchmark_loader is internal.
        - benchbox.core.base_benchmark.BaseBenchmark is deprecated internal
          compatibility.

      No wrapper facade was collapsed or deprecated.

  - id: w2
    summary: "Retire, alias, or justify benchbox/core/base_benchmark.py"
    needs: [w1]
    status: done
    notes: |
      Justified as a documented deprecated internal compatibility base. It is
      retained only for datavault and tpcds_obt until those implementations
      migrate to benchbox.base.BaseBenchmark. Runtime modules expose surface
      markers and docs/reference/backward-compatibility.md carries the target.

  - id: w3
    summary: "Reconcile benchmark registry, wrapper, and loader counts"
    needs: [w1]
    status: done
    notes: |
      Added tests/unit/core/test_benchmark_api_contract.py to lock:
        - 23 registry metadata entries.
        - 23 loader-resolved core families.
        - 22 public discovery entries.
        - 21 top-level Python benchmark facades.
        - 14 lazy facades and 7 eager facades.
        - 2 core-only benchmark IDs: ai_primitives and joinorder_synthetic.

  - id: w4
    summary: "Design the benchmark-family plugin seam as an ADR before extraction"
    needs: [w1]
    status: done
    notes: |
      Added docs/design/future-state/benchmark-family-plugin-seam/README.md and
      linked it from the future-state index. The design keeps wrappers and
      result bundles stable, defines family-owned versus shared-runtime
      responsibilities, and requires one pilot family before any broad package
      extraction.

  - id: w5
    summary: "Add an import-boundary check for core modules that depend on platform adapters"
    needs: [w4]
    status: done
    notes: |
      Added a narrow AST import-boundary check over benchbox/base.py,
      benchbox/core/base_benchmark.py, benchbox/core/benchmark_loader.py,
      benchbox/core/__init__.py, and benchbox/core/tuning/. The check forbids
      concrete benchbox.platforms imports in those benchmark API and tuning
      boundary files while avoiding unrelated existing core/platform couplings.

deferred:
  - summary: "Split all of benchbox/core into engine and benchmark packages"
    reason: "Large structural refactor should follow the public API decision and plugin-seam ADR."
  - summary: "Remove all wrapper facades"
    reason: "Wrappers are tested as public facades unless explicitly deprecated."

metadata:
  tags:
    - benchmarks
