prior_art:
- "docs/reference/backward-compatibility.md: existing shim/deprecation registry -- extend, do not duplicate."
- "docs/reference/hosted-results-contract.md: existing product-contract style -- reuse the crisp contract language."
- "Makefile: compat docs generation targets -- reuse generated-docs checks where feasible."

success_metrics:
- "Every reviewed public surface has one tier, one owner, and one verification gate."
- "Platform and benchmark counts in docs derive from one authoritative source or are marked non-authoritative."
- "Future architecture reviews can cite the contract map instead of rebuilding the surface inventory."
- "Drift-check ownership is routed to the source that owns each public claim class."

open_questions:
- "Should benchbox.experimental remain packaged in wheels, move to an extra, or become repo-only before 1.0?"
- "Who owns the public contract map review gate: maintainers generally, docs owners, or release owners?"
