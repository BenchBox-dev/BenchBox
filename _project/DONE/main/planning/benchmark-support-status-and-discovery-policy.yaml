id: benchmark-support-status-and-discovery-policy
title: "Architecture hardening: add benchmark support status and discovery policy"
worktree: main
priority: Medium-High
status: "Completed"
completed_date: "2026-05-21"
category: Benchmark Architecture

deps:
  needs:
  - architecture-contract-map-and-support-taxonomy
  - benchmark-api-and-core-boundary-cleanup

description: |
  The public contract map defines `support_status` for platforms and benchmarks.
  Platform metadata already carried support status; this item closed the
  benchmark half by adding benchmark-level support status to the benchmark
  metadata source of truth, defining how it interacts with `surface` and
  `supports_dataframe`, and wiring the count/status claims through tested
  discovery paths.

work:
- id: w0
  summary: "Revalidate benchmark discovery and support-claim evidence before editing"
  status: done
  notes: |
    Completed 2026-05-21 at checked SHA
    d8102e8fd7c6a216f5af18fd1d0c1c55db1a4c69.

    Revalidation summary:
      - `benchbox/core/benchmark_registry.py` had 23 metadata entries, 23 loader
        IDs, 22 public discovery IDs, 21 top-level facades, and one internal
        benchmark (`joinorder_synthetic`).
      - MCP discovery and resources consumed registry metadata but did not expose
        support status.
      - Explorer pipeline code did not maintain an independent benchmark support
        catalogue; no explorer code change was needed to prevent classification
        drift.
      - `docs/reference/public-contracts.md` still described benchmark
        `support_status` as pending.

    Capture a compact summary of checked SHA, current benchmark counts,
    discovery surfaces, docs claims, and any line-number drift. Do not commit
    raw command transcripts.

    Minimum evidence to re-check:
      - `benchbox/core/benchmark_registry.py` metadata, `surface`, and list helpers.
      - `benchbox/__init__.py` wrapper facade exports.
      - `benchbox/core/benchmark_loader.py` loader reachability.
      - MCP benchmark discovery tools and docs.
      - Explorer pipeline benchmark labels and any "supported benchmark" copy.
      - `docs/reference/public-contracts.md` count and support taxonomy.

- id: w1
  summary: "Define benchmark-specific support_status semantics"
  needs: [w0]
  status: done
  notes: |
    Completed with the shared taxonomy values: stable, beta, experimental,
    repo_only, deprecated, and document_only.

    Current product decision:
      - stable: tpch, tpcds, ssb, clickbench, joinorder.
      - beta: tpcdi, h2odb, amplab, read_primitives, write_primitives,
        metadata_primitives, transaction_primitives, coffeeshop, tsbs_devops,
        nyctaxi, flightdata, vector_search.
      - experimental: tpcds_obt, ai_primitives, tpchavoc, tpch_skew, datavault.
      - repo_only: joinorder_synthetic.
      - deprecated/document_only: none.

    Reuse the public taxonomy values: stable, beta, experimental, repo_only,
    deprecated, and document_only. Spell out how they apply to benchmark
    families, data availability, official-vs-development scale factors, and
    DataFrame support.

    Keep `support_status` distinct from:
      - `surface`, which controls discovery visibility.
      - `supports_dataframe`, which is a capability flag.
      - dataset availability or local optional dependency availability.

- id: w2
  summary: "Add support_status metadata and validation to benchmark_registry"
  needs: [w1]
  status: done
  notes: |
    Completed by adding `support_status` to every `BENCHMARK_METADATA` entry,
    validating at import time, and adding registry helpers:
    `get_benchmark_support_status()`, `get_benchmarks_by_support_status()`, and
    `get_benchmark_registry_summary()`.

    Every `BENCHMARK_METADATA` entry should have exactly one valid
    `support_status`. Add helper accessors or summary functions only where
    discovery/docs/tests need them; avoid introducing a second benchmark
    catalogue.

- id: w3
  summary: "Propagate benchmark support status to discovery surfaces"
  needs: [w2]
  status: done
  notes: |
    Completed for MCP discovery/resources and docs. `list_available`,
    `get_benchmark_info`, benchmark resources, and query-detail benchmark info
    now project registry `support_status`. CLI display was left unchanged because
    it does not make support-level claims, and explorer code was left unchanged
    because it has no separate benchmark support catalogue.

    Update CLI, MCP, explorer, and docs only where they make support-level
    claims. Do not hide or remove an existing public benchmark solely because
    its support status is clarified; visibility changes need an explicit
    surface/deprecation decision.

- id: w4
  summary: "Add drift checks for benchmark status and count claims"
  needs: [w2]
  status: done
  notes: |
    Completed by extending benchmark API contract tests and MCP discovery/resource
    tests. The contract map and benchmark docs now state support-status counts
    from registry metadata instead of treating benchmark status as pending.

    Extend benchmark API contract coverage so registry count, wrapper count,
    loader count, public discovery count, and support-status summary claims
    cannot drift silently. Exact user-facing count tables should derive from
    benchmark registry metadata or be marked editorial.

deferred:
- summary: "Use benchmark support status to redesign the explorer benchmark browser"
  reason: "Explorer UX changes should follow the metadata contract and public discovery decision."
- summary: "Remove or hide public benchmark facades based on support status"
  reason: "Support status is not a visibility or deprecation decision by itself."

metadata:
  tags:
  - benchmarks
  - contracts
  - support-status
  - discovery
  estimated_effort: "2-4 days"
  created_date: "2026-05-21"
  last_updated: "2026-05-21T00:00:00Z"

impact:
  business_value: |
    Makes benchmark breadth easier to trust by separating supported product
    benchmarks from experimental, internal, and document-only surfaces.
  user_impact: |
    Users can tell whether a benchmark is stable, beta, experimental, deprecated,
    or repo-only before relying on published results or automation.
  technical_debt: |
    Closes the benchmark half of the support-status taxonomy and reduces drift
    across docs, MCP discovery, explorer input, and wrapper/loader counts.

