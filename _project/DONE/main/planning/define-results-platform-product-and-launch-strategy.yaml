  - architecture
  estimated_effort: "Medium"
  created_date: "2026-03-29"

impact:
  business_value: |
    Turns an underspecified feature idea into a staged product program that can
    actually be staffed, prioritized, and reviewed.
  user_impact: |
    Prevents BenchBox from shipping a confusing mix of local publishing and
    hosted results behavior under one overloaded command or page.
  technical_debt: |
    Removes ambiguity before API, frontend, and storage choices harden around
    the wrong product boundary.

must_preserve:
- "The schema-v2 result bundle remains the single canonical artifact for all downstream publishing and submission flows"
- "The existing static GitHub Pages deployment for landing/docs/blog remains a valid baseline during planning"

approach: |
  Start with product shape, not implementation. The result explorer, hosted
  API, and local artifact publishing should each have a separate contract and
  success metric. Use the existing BenchBox export path as the anchor, then map
  external reference patterns onto the repo's real deployment constraints.

anti_patterns:
- "DO NOT collapse local artifact publication and hosted submission into one command surface -- because the storage contract and service contract differ materially -- define `publish` and `submit` separately"
- "DO NOT assume the static docs stack can absorb a rich results explorer unchanged -- because interactive compare/search/auth workflows have different needs -- choose the site topology explicitly"

