id: query-plan-capture-isolation-phase-design
title: "Design and implement plan capture as an explicit isolated benchmark phase"
worktree: main
priority: High
status: Completed
category: Core Functionality
superseded_by: query-plan-capture-canonical-isolation

# SUPERSEDED (2026-06-15): The cutover this item delivered is an ADDITIVE,
# opt-in-per-adapter intermediate step, NOT the destination. It (a) makes the
# isolated phase opt-in via plan_capture_phase_eligible on only 6 adapters while
# leaving inline capture present in ~16 adapters, (b) only runs in the
# power/standard path (throughput/maintenance/combined still capture inline, so an
# eligible adapter behaves differently by test type), and (c) hard-codes the phase
# to structural-only, silently dropping ANALYZE timing and killing the
# analyze_plans knob. The canonical target — ONE isolated phase for ALL EXPLAIN
# engines, across ALL test types, with analyze_plans as the only knob and inline
# capture REMOVED — is tracked by query-plan-capture-canonical-isolation (and its
# siblings: -phase-respect-analyze, -sideeffect-engine-policy,
# -post-measurement-divergence). The anti-patterns below that enshrine permanent
# inline coexistence apply ONLY to genuine side-effect engines (BigQuery), not to
# EXPLAIN-based engines.

# PROGRESS:
#   2026-06-14 (PR #798): w1 (design note) DONE; w2 (thread safety) DONE; phase
#     building block benchbox/core/plan_capture_phase.py added (run_plan_capture_phase).
#   2026-06-15 (this PR): CLI/orchestrator cutover completed.
#   - w3 (phase hook): DONE — the generic query pipeline (_execute_all_queries in
#     benchbox/platforms/base/execution.py) now suppresses inline capture during the
#     timed loop for phase-eligible adapters and runs run_plan_capture_phase() once
#     post-measurement (_capture_plans_post_measurement), merging query_plan /
#     plan_fingerprint / plan_capture_time_ms into the result dicts. The phase reuses
#     the measurement connection (so embedded in-memory engines still see loaded data)
#     and is structural-only. Eligibility is an opt-in capability flag
#     (PlatformAdapter.plan_capture_phase_eligible) enabled on DuckDB, MotherDuck,
#     SQLite, DataFusion, PostgreSQL, Redshift. Side-effect-capture platforms
#     (BigQuery, Spark/Databricks and other cloud adapters) keep inline capture
#     unchanged (flag stays False) — the inline path was NOT removed.
#   - w4 (docs): DONE — docs/features/query-plan-analysis.md "Capture Isolation
#     (post-measurement phase)" section describes the behavior, the structural-only
#     trade-off, DML-once guarantee, and the eligibility flag.
#   - w5 (phase isolation tests): DONE — tests/integration/test_plan_capture_phase.py
#     TestIntegratedCapturePhase drives _execute_all_queries and asserts inline is
#     suppressed during measurement, plans are populated by the post-measurement phase,
#     and DML executes exactly once.
#
# NOTE: opt-in (vs opt-out) eligibility was chosen deliberately — it keeps every
# cloud/Spark/BigQuery measurement path on its proven inline capture (zero blast
# radius) per the "do not remove inline in one shot" anti-pattern. Extending the
# phase to remote EXPLAIN engines (Athena, Trino/Presto, ClickHouse, Doris,
# QuestDB, SingleStore) and to the TPC-H/TPC-DS power drivers (which currently do
# not persist plans at all — _power_query_result drops plan fields) is follow-up.

design_note: |
  Plan capture phase contract (w1)
  --------------------------------
  Lifecycle position: the capture phase runs AFTER all power/throughput
  iterations complete, when measurement is already stable. It never executes
  while a timed query is in flight, so EXPLAIN can no longer delay a measured
  query or contend on the measurement connection (the accepted trade-off in the
  timeout PR, #789).

  Connection model (resolves the gating open_question): SEPARATE connection by
  default. run_plan_capture_phase() opens a fresh connection via
  adapter.create_connection() and closes it when done, so the phase cannot
  contaminate measurement transaction state. Callers may pass connection=<conn>
  to reuse an existing one (e.g. embedded :memory: engines where a second
  connection would not see loaded data); in that case the caller owns closing it.

  EXPLAIN mode: structural-only. The phase forces analyze_plans=False, so:
    - DML/write-DDL is never re-executed (the shared is_dml_query guard already
      downgrades these, and analyze_plans=False makes SELECT capture cheap too).
    - SELECT capture pays planning cost only, not ~1x execution time.
  Fingerprints are unaffected (they exclude timing/cardinality), so structural
  regression detection is unchanged. ANALYZE remains opt-in via the analyze_plans
  argument for callers that explicitly want actual-plan stats.

  Filter semantics: the phase receives an explicit query list, which IS the
  selection. It bypasses the measurement-phase sampling filters (plan_first_n,
  plan_sampling_rate) so each requested query is captured exactly once, and
  restores all overridden adapter attributes in a finally block.

  Result contract: PlanCapturePhaseResult carries plans (query_id -> DAG),
  fingerprints (query_id -> str), per_query_capture_ms, total_capture_ms, and
  captured/failed counts — ready to merge into run metadata (plan_fingerprints).

  Backward compatibility: this is ADDITIVE. The inline execute_query() capture
  path is untouched, so platforms that surface plans as an execution side effect
  (BigQuery job stats, Spark event logs) keep working. The CLI cutover that makes
  --capture-plans drive the phase for EXPLAIN-based platforms is the remaining
  incremental step.

description: |
  Plan capture is intended to run as a separate, isolated phase of the benchmark
  — totally decoupled from the power/throughput measurement runs. The current
  implementation does not match this intent: capture is wired inline inside each
  adapter's execute_query() via the capture_plans flag, so EXPLAIN runs
  interleaved with the timed measurement.

  Two problems arise from inline capture:

  1. Write isolation: even with a DML guard (see query-plan-capture-postgresql-dml-guard),
     the capture EXPLAIN executes inside the same transaction as the benchmark query.
     This exposes the measurement database state to a second round-trip, and for any
     platform where EXPLAIN ANALYZE re-executes (PostgreSQL, DuckDB with analyze_plans=True),
     the write runs twice unless actively guarded.

  2. Measurement contamination: if capture EXPLAIN runs immediately after the timed
     query, it holds the connection open and may delay the next measured query. This
     affects throughput benchmarks with multiple concurrent streams.

  The correct model: plan capture should be a separate benchmark phase that:
    - Runs after all power/throughput iterations complete (measurement already stable)
    - Uses a separate connection to avoid transaction interference
    - Issues EXPLAIN-only (no ANALYZE re-execution needed — structure from static plan)
    - Does not count toward any timing measurement

  The phased model requires a dedicated "capture" phase hook in the run orchestrator
  (benchbox/cli/commands/run.py) that is triggered by --capture-plans, distinct from
  the --power and --throughput phases. The existing inline path can remain as a
  compatibility layer for platforms that provide plans as a side effect of execution
  (e.g., BigQuery job statistics, Spark event logs) where post-hoc capture is the
  only option.

  Secondary gap — thread safety of _plan_capture_iteration_counts:
  benchbox/platforms/base/result_capture.py:323 initialises
  `self._plan_capture_iteration_counts: dict[str, int] = {}` on the adapter instance.
  Under concurrent stream execution (--streams > 1), multiple threads call
  capture_query_plan() concurrently and mutate this dict without a lock. The dict
  operations are CPython-GIL-protected for single-key reads/writes, but
  plan_first_n filtering (lines 591-595) is a read-increment-write sequence that
  can produce incorrect counts under preemption. This should be addressed as part
  of the isolation architecture.

prerequisites:
  - "query-plan-capture-postgresql-dml-guard — DML double-execution must be fixed first to harden inline path during transition"
  - "query-plan-capture-display-decouple — show_query_plans coupling resolved before redesigning capture flow"

prior_art:
  - "benchbox/cli/commands/run.py:487 — show_query_plans = capture_plans sets the current inline mode"
  - "benchbox/platforms/base/result_capture.py:561 — capture_query_plan() implementation"
  - "benchbox/platforms/base/result_capture.py:323 — _plan_capture_iteration_counts (not thread-safe)"
  - "benchbox/cli/commands/run.py — power/throughput phase orchestration to reference for hook design"

work:
  - id: w1
    summary: "Design the plan capture phase contract: inputs, outputs, timing, connection model"
    status: done
    notes: |
      Write a design note (inline in this TODO or as a brief ADR) covering:
        - Where in the run lifecycle the capture phase fires (after last power/throughput iteration)
        - Whether it uses the same adapter instance or a fresh connection
        - EXPLAIN options for capture-only mode (no ANALYZE — static plan structure only)
        - How results are merged back into the run metadata (plan_fingerprints dict)
        - Backward-compat: platforms that already capture inline (BigQuery, Spark via job stats)
          must continue to work; capture phase is additive, not a replacement

  - id: w2
    summary: "Fix _plan_capture_iteration_counts thread safety"
    needs: [w1]
    status: done
    notes: |
      Replace the bare dict mutation at result_capture.py:591-595 with a
      threading.Lock-protected increment. Options:
        a) Per-instance threading.Lock added to __init__ alongside the dict
        b) Replace dict with collections.Counter + lock
        c) Use threading.local() if per-thread isolation is preferred
      Option (a) is simplest and consistent with the existing adapter-instance model.
      Add a concurrent-stream unit test that fires capture_query_plan() from N
      threads and asserts plan_first_n is honoured per-query_id (not per-thread).

  - id: w3
    summary: "Add a run_plan_capture_phase() hook to the run orchestrator"
    needs: [w1]
    status: done  # wired into _execute_all_queries via _capture_plans_post_measurement (opt-in flag)
    notes: |
      Add a function to benchbox/cli/commands/run.py (or a new
      benchbox/core/plan_capture_phase.py) that:
        - Accepts the list of query IDs and their SQL
        - Opens a fresh connection (to avoid contaminating measurement state)
        - Calls adapter.capture_query_plan(conn, sql, qid) with analyze_plans=False
          (structural plan only, no re-execution cost)
        - Collects results into a dict[str, QueryPlanDAG] keyed by query_id
        - Returns timing metadata (total capture time, per-query capture ms)
      This is distinct from the inline capture path and is guarded by
      --capture-plans + a "phase" flag (e.g., only fire when not in throughput
      stream mode, or fire after all streams complete).

  - id: w4
    summary: "Update docs and --help to describe capture as a post-measurement phase"
    needs: [w3]
    status: done  # docs/features/query-plan-analysis.md "Capture Isolation (post-measurement phase)"
    notes: |
      Update docs/features/query-plan-analysis.md and docs/reference/cli/run.md:
        - Describe that --capture-plans triggers a separate post-measurement phase
        - Clarify that DML queries get estimated-plan capture (no ANALYZE re-execution)
        - Note that BigQuery/Spark capture is always post-execution via platform
          APIs regardless of the phase design

  - id: w5
    summary: "Add integration test verifying phase isolation"
    needs: [w3, w4]
    status: done  # TestIntegratedCapturePhase drives _execute_all_queries (suppression + post-measurement merge + DML-once)
    notes: |
      Add a test that:
        - Runs a mock benchmark with capture_plans=True
        - Asserts that the capture phase fires AFTER the timed measurement (not interleaved)
        - For DML queries, asserts DML ran exactly once (not twice)
        - Asserts plan_fingerprints are populated in the run metadata
      This can use DuckDB (no external credentials) with a small in-memory table and
      an INSERT query.

deps:
  needs:
    - "query-plan-capture-postgresql-dml-guard"
    - "query-plan-capture-display-decouple"

must_preserve:
  - "Platforms that capture plans as execution side effects (BigQuery job stats, Spark event logs) must continue to work — the inline path cannot be removed."
  - "Existing --capture-plans behavior must remain backward-compatible for SELECT-only benchmarks."
  - "plan_fingerprints field in run metadata must continue to be populated."
  - "DuckDB analyze_plans=False option must remain available for the capture phase."

approach: |
  Design the phase contract first (w1) before writing any code. The phase model
  must accommodate both the new post-measurement capture path (for PostgreSQL,
  DuckDB, Redshift) and the existing inline/side-effect path (BigQuery, Spark).
  Fix the thread-safety issue independently (w2) as it is a correctness bug
  separate from the phase design. The orchestrator hook (w3) should be additive
  — the inline capture in execute_query() can coexist until all adapters migrate.

anti_patterns:
  - "DO NOT remove the inline capture from execute_query() in one shot — BigQuery and Spark depend on it; migration is incremental."
  - "DO NOT use threading.local() for _plan_capture_iteration_counts — plan_first_n is a global per-query-id counter, not per-thread."
  - "DO NOT add ANALYZE to the capture-phase EXPLAIN call — the phase is structural-plan-only; re-execution cost belongs in the measurement phase."
  - "DO NOT add the capture phase to the --throughput concurrent-stream path — stream isolation is a pre-condition, not a deliverable of this TODO."

verification:
  - description: "Thread-safety fix: plan_first_n counted correctly under concurrent capture"
    command: "uv run -- python -m pytest tests/unit/platforms/ -k 'plan_first_n or iteration_count' -v"
    expected_output: "Thread-safe iteration count tests pass"
  - description: "Phase hook fires after all power iterations in mock run"
    command: "uv run -- python -m pytest tests/integration/ -k 'capture_phase' -v"
    expected_output: "Capture phase fires post-measurement"
  - description: "DML queries run exactly once in a mock benchmark"
    command: "uv run -- python -m pytest tests/integration/ -k 'dml_single_execution' -v"
    expected_output: "DML query executed once; plan captured from estimated EXPLAIN"

scope_limit:
  only_modify:
    - "benchbox/platforms/base/result_capture.py"
    - "benchbox/cli/commands/run.py"
    - "docs/features/query-plan-analysis.md"
    - "docs/reference/cli/run.md"
    - "tests/unit/platforms/"
    - "tests/integration/"
    - "_project/TODO/main/planning/query-plan-capture-isolation-phase-design.yaml"

success_metrics:
  - "Plan capture phase runs after all measurement iterations complete, not interleaved."
  - "_plan_capture_iteration_counts is thread-safe under concurrent stream execution."
  - "DML queries in a benchmark run exactly once (write isolation guaranteed)."
  - "BigQuery and Spark adapters continue to capture plans via their existing inline paths."

open_questions:
  - question: "Should the capture phase use a separate connection or reuse the measurement connection?"
    gating: true
    affects: ["w3"]
    default: "Separate connection: avoids any transaction contamination and makes isolation explicit"
  - question: "Should analyze_plans default to False in the capture phase, or remain configurable?"
    gating: false
    affects: ["w3", "w4"]
    default: "False: capture phase is structural-plan-only; ANALYZE re-execution should require opt-in"

