id: launch-results-explorer-acceptance-and-seed
title: "Launch results explorer: acceptance testing, seed corpus verification, and go-live"
worktree: main
priority: Medium-High
status: Completed
category: Core Functionality
deps:
  needs:
  - generate-seed-corpus-for-results-explorer
  - integrate-explorer-into-github-pages-deployment
  - resolve-results-explorer-brand-ownership
description: |
  Final launch gate for the Phase 1 results explorer. This TODO verifies that
  all launch criteria are met, the seed corpus is complete and correct, the
  explorer works end-to-end in production, and the feature is ready for public
  announcement.

  Launch criteria (from strategy memo):
  1. Seed corpus has sufficient depth for the dynamic comparison tool: each
     included benchmark has ≥3 comparable platforms at the same scale factor
  2. Compare view is the primary entry point and works end-to-end: select
     benchmark/scale/platforms → query-level timing breakdown → shareable URL
  3. All explorer pages render correctly with real data
  4. DuckDB-WASM filtering works in Chrome, Firefox, Safari
  5. GitHub Pages deployment succeeds end-to-end from CI
  6. Explorer is navigable from the existing site header/nav
  7. Brand ownership decision is resolved and reflected in domain/hosting/identity

work:
- id: w1
  summary: "Verify seed corpus completeness and quality"
  status: done
  notes: |
    Run the corpus inventory validation:
    - Each included benchmark has ≥3 comparable platforms at the same scale factor
    - All bundles are schema-valid with valid query timings (no zero-duration or error-only runs)
    - Companion files present where expected (plans for DuckDB/DataFusion)
    - The dynamic comparison tool produces meaningful comparisons for every
      benchmark×scale combination in the corpus

    If gaps exist (e.g., a benchmark has only 2 platforms), generate additional
    runs to fill them before launch.

- id: w2
  summary: "Run cross-browser acceptance testing"
  needs: [w1]
  status: done
  notes: |
    Test the deployed explorer (or local preview) on:
    - Chrome (latest): all pages, DuckDB-WASM, compare view
    - Firefox (latest): all pages, DuckDB-WASM, compare view
    - Safari (latest): all pages, DuckDB-WASM, compare view
    - Mobile Chrome/Safari: basic navigation and detail pages

    Verify:
    - Pages load within 3 seconds on broadband
    - DuckDB-WASM initializes and filtering works
    - Compare view renders charts and tables correctly
    - Share URLs work when opened in a new tab/browser
    - Raw bundle download links work
    - No console errors or broken asset references

- id: w3
  summary: "Verify production deployment end-to-end"
  needs: [w1]
  status: done
  notes: |
    Push to main and verify the full GitHub Pages deployment:
    - Landing page still works at benchbox.dev
    - Docs still work at benchbox.dev/docs/
    - Blog still works at benchbox.dev/blog/
    - Explorer works at benchbox.dev/results/
    - All explorer routes resolve (home, browse, detail, compare)
    - "Results" nav link is visible on all site pages
    - No mixed content warnings or CORS errors

- id: w4
  summary: "Write changelog entry and update project documentation"
  needs: [w2, w3]
  status: done
  notes: |
    - Add changelog entry for the results explorer launch
    - Update README if it references the project's web presence
    - Update CLAUDE.md if any new commands or conventions were added
    - Verify docs/CLI_REFERENCE.md doesn't need updates

- id: w5
  summary: "Mark Phase 1 complete and update TODO cluster status"
  needs: [w3, w4]
  status: done
  notes: |
    - Mark `build-results-explorer-subsite-on-benchbox-dev` as complete
    - Move all completed Phase 1 implementation TODOs to DONE
    - Update the strategy memo with actual launch date and any deviations
    - Update `define-results-platform-product-and-launch-strategy` status
    - Regenerate TODO indexes

metadata:
  tags:
  - results
  - explorer
  - phase-1
  - launch
  - acceptance
  estimated_effort: "Medium"
  created_date: "2026-03-29"
  completed_date: "2026-04-04"

impact:
  business_value: |
    This is the gate between "built" and "shipped". Without acceptance testing
    and verification, the explorer could launch with broken pages or missing data.
  user_impact: |
    Users get a polished, tested experience on launch day instead of a half-working
    prototype.

must_preserve:
- "Existing benchbox.dev pages (landing, docs, blog) must be verified as unaffected"
- "All seed corpus results must be accessible and renderable in the explorer"

approach: |
  Systematic verification of all launch criteria. No shortcuts — test every
  page, every browser, every deployment path. Fix issues found during acceptance
  before marking launch complete.

anti_patterns:
- "DO NOT mark launch complete before all 7 criteria are verified -- because a partial launch is harder to fix than a delayed launch -- gate on all criteria passing"
- "DO NOT accept corpus depth below the ≥3-platforms threshold by shipping placeholder data -- because the compare view is the primary deliverable and requires depth -- generate missing runs before launch"
- "DO NOT skip cross-browser testing on the assumption that Chrome results cover Firefox and Safari -- because DuckDB-WASM has browser-specific loading differences -- test each browser explicitly"
- "DO NOT merge the explorer into main without verifying existing benchbox.dev pages still work -- because a broken docs or landing deploy is a regression even if the explorer is perfect -- always check sibling pages"

verification:
- description: "Seed corpus meets depth-per-benchmark criterion (≥3 platforms per benchmark×scale cohort)"
  command: "uv run -- python -c \"import json, collections; m = json.load(open('results-explorer/public/data/manifest.json')); cohorts = collections.defaultdict(set); [cohorts[(r['benchmark'], str(r.get('scale_factor','')))].add(r['platform']) for r in m['results']]; print(f'{len(m[\"results\"])} results across {len(cohorts)} cohorts'); [print(f'  {k}: {len(v)} platforms ({sorted(v)})') for k,v in sorted(cohorts.items())]; assert all(len(v) >= 3 for v in cohorts.values()), f'Cohorts with <3 platforms: {dict((k,len(v)) for k,v in cohorts.items() if len(v)<3)}'\""
  expected_output: "All benchmark×scale cohorts have ≥3 comparable platforms"
- description: "Full site build succeeds (landing + docs + blog + explorer)"
  command: "cd results-explorer && npm run build && test -f dist/index.html && test -f dist/tpch/index.html && ls dist/r/*/index.html | wc -l"
  expected_output: "Build succeeds; index, benchmark, and result detail pages present"
- description: "Explorer component test suite passes"
  command: "cd results-explorer && npm run typecheck && npm run build"
  expected_output: "Typecheck and build both pass"
- description: "Cross-browser acceptance — manual"
  command: "echo 'Manual: verify Chrome, Firefox, Safari per w2 checklist'"
  expected_output: "Manual verification — all browsers pass"

scope_limit:
  only_modify:
  - "_project/TODO/"
  - "_project/DONE/"
  - "_project/analysis/"
  - "CHANGELOG.md"
  - "README.md"
  do_not_modify:
  - "benchbox/"
