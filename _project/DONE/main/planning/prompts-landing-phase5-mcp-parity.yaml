id: prompts-landing-phase5-mcp-parity
title: "Prompts landing - Phase 5: MCP-surface parity for hygiene, cost, hints, provenance"
worktree: main
priority: Medium
status: Completed
category: Documentation

description: |
  Phase 5 brings the /prompts/ MCP surface up to the same operational
  safety contract as the CLI surface after Phases 1-4: smoke runs for
  paid or non-local target-scale executions, cost acknowledgment for
  paid target-scale executions, platform-option gap notes, TPC-DS
  subscale dsdgen warnings, result analysis, provenance capture, and
  optional plan capture guidance.

  The implementation deliberately uses existing MCP surfaces only. It
  does not add new MCP tools, and it avoids inventing unsupported
  run_benchmark arguments for platform options.

work:
  - id: w0
    summary: "Inventory CLI-to-MCP prompt parity mapping"
    status: done
    notes: |
      MCP tools are already non-interactive and capture output through
      tool responses rather than shell tee logs. The prompt maps CLI
      guardrails to MCP-native steps: run_benchmark smoke calls,
      user-facing cost acknowledgment, analyze_results for compare
      result files, system_profile for provenance, and get_query_plan
      after optional capture_plans=true runs.

  - id: w1
    summary: "Extend buildMcpPrompt with smoke and cost-acknowledgment steps"
    needs: [w0]
    status: done
    notes: |
      Reuses the shared needsSmokeStep and needsCostAcknowledgment
      predicates so MCP and CLI stay aligned on cost_class, deployment,
      and scale thresholds.

  - id: w2
    summary: "Render platform-option hints and dsdgen warnings in MCP prompts"
    needs: [w1]
    status: done
    notes: |
      TPC-DS dsdgen warnings mirror the CLI text. Platform-option hints
      render as an explicit MCP surface gap because run_benchmark does
      not expose a platform option argument; the prompt tells users to
      configure values via BenchBox config/env or switch to CLI.

  - id: w3
    summary: "Use real MCP analysis, provenance, and plan tools"
    needs: [w2]
    status: done
    notes: |
      Compare prompts call analyze_results with file1/file2 from live
      mcp_metadata.result_file responses. Single-run prompts summarize
      the run_benchmark payload and optionally call aggregate analysis.
      Provenance calls system_profile, whose payload includes BenchBox
      version and system fields. Optional plan capture uses
      capture_plans=true plus get_query_plan.

  - id: w4
    summary: "Tests, generated catalog, and validation"
    needs: [w3]
    status: done
    notes: |
      Added validator coverage for analysis_tool, system_profile_tool,
      and plan_tool; static prompt tests for real-tool wording and the
      platform-option gap; generated catalog parity assertions; and
      render smoke coverage for paid/local/compare MCP prompts.

verification:
  - description: "Validator passes"
    command: "uv run -- python scripts/generate_landing_quickstarts.py --validate-only"
    expected_output: "validate-only: OK"
  - description: "Generated catalog is fresh"
    command: "uv run -- python scripts/generate_landing_quickstarts.py --check"
    expected_output: "check: OK"
  - description: "Prompt quickstart make target passes"
    command: "make prompt-quickstarts-check"
    expected_output: "check: OK"
  - description: "Landing tests pass"
    command: "uv run -- python -m pytest tests/unit/landing/test_landing_quickstarts.py -n 0 -q"
    expected_output: "0 failures"

must_preserve:
  - "MCP prompt ordering remains list_available -> dependency check -> optional safety notes -> dry run -> live run -> summary/provenance."
  - "MCP uses the same Phase 2-3 smoke, cost, and dsdgen predicates as CLI."
  - "Catalog MCP tool and prompt names are validated against benchbox/mcp/."

deferred:
  - summary: "Add first-class MCP platform option arguments"
    reason: "Requires MCP tool API work outside the landing prompt batch."
  - summary: "MCP live-server integration tests for rendered prompts"
    reason: "Unit and render-smoke coverage prove prompt generation; live MCP integration is a separate surface."

success_metrics:
  - "An MCP Snowflake TPC-H SF=1.0 prompt includes smoke, cost acknowledgment, analyze_results, system_profile, and optional get_query_plan guidance."
  - "An MCP DuckDB TPC-H SF=0.01 local prompt does not include smoke or cost acknowledgment."
  - "Generated catalog stays in sync with catalog.yaml."

open_questions:
  - question: "Does BenchBox MCP have a version-json equivalent?"
    gating: false
    affects: ["w3 provenance step"]
    default: "Resolved for this phase by using system_profile, which includes BenchBox version and system fields."

metadata:
  estimated_effort: "Small"
  tags: [landing, prompts, mcp, agent-ux]

impact:
  user_impact: |
    MCP users now receive the same operational guardrails as CLI users
    without being pointed at nonexistent MCP arguments.
  technical_debt: |
    The landing catalog now validates the MCP tools referenced by the
    generated prompt text.
