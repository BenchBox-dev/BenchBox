id: joinorder-sqlite-performance
title: "Canonical JoinOrder SF=1 SQLite UAT exceeds corpus backfill timeout"
worktree: main
priority: Medium
status: Completed
completed_date: "2026-05-15"
category: Performance

description: |
  Canonical JoinOrder SF=1 UAT on SQLite loaded the canonical IMDb tables and
  executed successfully through query 75/113 in warmup, but did not complete
  within the 7200 second per-cell corpus backfill budget. SQLite should remain
  excluded from the supported canonical JoinOrder SF=1 corpus matrix until it
  has either a tuned execution path or a documented longer-running UAT lane.

  Evidence:
    /Users/joe/Developer/benchmark_runs/logs/uat_joinorder_canonical_corpus_20260512/sqlite_joinorder_1.0_20260512_202135.log

  Observed summary:
    - Tables loaded successfully.
    - Warmup progressed to query 75/113.
    - No result JSON was emitted, so there is no complete, submittable bundle.

work:
- id: w1
  summary: "Root-cause the SQLite timeout"
  status: done
  notes: |
    The May 12 canonical UAT loaded all 21 tables / 74,190,187 rows, then
    spent most runtime in repeated scans of large JoinOrder relationship tables.
    Examples from the timeout log include q6a at 46.17s, q16b at 65.3s, q17a
    at 59.41s, q17e at 59.20s, and q17f at 50.55s.

- id: w2
  summary: "Add SQLite JoinOrder helper indexes"
  needs: [w1]
  status: done
  notes: |
    SQLite now creates a JoinOrder-scoped helper index set after load, covering
    the canonical JOB join keys and high-selectivity filter columns across the
    large fact/relationship tables and small dimension tables. The helper path
    runs only when all 21 JoinOrder tables are present, then runs `ANALYZE` so
    SQLite plans against the new statistics.

- id: w3
  summary: "Verify canonical SF=1 runtime improvement"
  needs: [w2]
  status: done
  notes: |
    Full-data local probe under `/Users/joe/Developer/benchmark_runs` loaded
    21 tables / 74,190,187 rows and built 32 helper indexes in 455.322s. A
    follow-up pass over all 113 canonical queries on the indexed database
    passed in 200.021s total. The canonical UAT shape is 1 warmup + 3
    measurement passes, so the measured estimate is roughly 455s + 4 * 200s =
    1,255s plus orchestration overhead, comfortably under the 7,200s corpus
    backfill budget.

verification:
- description: "SQLite helper-index unit coverage passes"
  command: "uv run -- python -m pytest tests/unit/platforms/test_sqlite_adapter.py -q"
  expected_output: "36 passed"
- description: "SQLite JoinOrder selected slow-query probe passes"
  command: "grep -E 'LOAD tables=21 rows=74190187|^(6a|16b|17a|20c|33c) status=SUCCESS' /Users/joe/Developer/benchmark_runs/logs/joinorder_sqlite_helper_index_probe.log"
  expected_output: "21 tables / 74,190,187 rows, 32 helper indexes, and selected slow queries succeed"
- description: "SQLite JoinOrder full 113-query indexed pass succeeds"
  command: "tail -1 /Users/joe/Developer/benchmark_runs/logs/joinorder_sqlite_helper_index_113_probe.log"
  expected_output: "PASS queries=113 total_seconds=200.021"
- description: "TODO graph remains valid after moving this item to DONE"
  command: "uv run --project _project/scripts -- python _project/scripts/todo_cli.py check-graph && uv run --project _project/scripts -- python _project/scripts/todo_cli.py validate _project/DONE/main/planning/joinorder-sqlite-performance.yaml"
  expected_output: "passes"

