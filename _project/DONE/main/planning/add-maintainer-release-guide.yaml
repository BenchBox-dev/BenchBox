anti_patterns:
- DO NOT duplicate content from automate_release.py's docstring into the
  guide - because the docstring is for developers reading the source; the
  guide is for maintainers running the tool; they need different framings.
  Link to source, summarise behaviour, do not paste.
- DO NOT make the guide a complete reference of every flag - because that
  is what `--help` is for; the guide is the runbook ("here is what to do"),
  not the man page.
- DO NOT include screenshots or animated GIFs - because the existing docs
  are text-only and screenshots rot fast; ASCII tables and code blocks are
  sufficient and maintainable.
- DO NOT write the guide before the dependent items land - because it
  references the new is_public_path predicate and the new
  --allow-public-divergence flag; writing first means rewriting twice.
- DO NOT add a "history" or "previous release process" section - because
  it is dead weight; the guide describes how to release TODAY, full stop.

