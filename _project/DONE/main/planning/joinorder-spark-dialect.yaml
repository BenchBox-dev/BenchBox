id: joinorder-spark-dialect
title: "Canonical JoinOrder q33c failure on Spark SQL"
worktree: main
priority: Medium
status: Completed
completed_date: "2026-05-15"
category: Platform Compatibility

description: |
  Canonical JoinOrder SF=1 UAT on Spark SQL reached the full 113-query
  workload but failed q33c during collection, so Spark cannot be advertised
  as complete canonical JoinOrder support until this query is fixed and all
  113 logical queries pass across the required measurement runs.

  Evidence:
    /Users/joe/Developer/benchmark_runs/logs/uat_joinorder_canonical_corpus_20260512/spark_joinorder_1.0_20260512_222136.log
    /Users/joe/Developer/benchmark_runs/results/joinorder_sf1_spark_sql_20260512_223641_d18f303d.json

  Observed summary:
    - Measurement run 1 logged `Completed 113 queries: 112 passed, 0 skipped, 1 failed.`
    - Result bundle summary was `summary.queries = {"total": 173, "passed": 172, "failed": 1}`.
    - The result is not eligible for `results-data/bundles/`.

work:
- id: w1
  summary: "Root-cause the q33c Spark failure"
  status: done
  notes: |
    The failure is a Spark physical-planning/runtime issue rather than a SQL
    dialect parse failure. The canonical UAT log reports Spark could not build
    and broadcast a JoinOrder-side table while executing q33c, and Spark's own
    workaround recommendation includes disabling automatic broadcast joins.

- id: w2
  summary: "Apply JoinOrder-specific Spark planning defaults"
  needs: [w1]
  status: done
  notes: |
    Spark now treats JoinOrder as an analytical workload for AQE/CBO session
    tuning and defaults `spark.sql.autoBroadcastJoinThreshold` to `-1` for
    JoinOrder sessions. Explicit `broadcast_threshold` and raw Spark config
    overrides remain authoritative.

- id: w3
  summary: "Add focused regression coverage"
  needs: [w2]
  status: done
  notes: |
    Unit coverage verifies the JoinOrder default, explicit override behavior,
    raw Spark config precedence, and the JoinOrder benchmark configuration hook.

verification:
- description: "Spark JoinOrder planning defaults and related adapter tests pass"
  command: "uv run -- python -m pytest tests/unit/platforms/test_spark_adapter.py tests/unit/core/test_joinorder_benchmark.py -q"
  expected_output: "passes"
- description: "TODO graph remains valid after moving this item to DONE"
