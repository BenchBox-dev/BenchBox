    command: "uv run -- python -m pytest tests -k 'dataframe and parity' --tb=short"
    expected_output: "Focused DataFrame parity tests pass."
  - description: "Run focused result export tests."
    command: "uv run -- python -m pytest tests/unit/core/results -q"
    expected_output: "Result export tests pass."

