  - id: w6
    summary: "Clarify TPC-DS table count (24 vs 25 - DBGEN_VERSION)"
    status: done
    needs: []
    description: |
      This is a naming/accuracy issue in the TPC-DS doc: the table count is
      ambiguous. Check whether DBGEN_VERSION is a data table or metadata
      table. Update TPC-DS doc to state the correct count, explicitly
      mentioning or excluding DBGEN_VERSION with rationale.
    files:
      - docs/benchmarks/tpc-ds.md

verification:
  - description: "All benchmark docs (excl. index) contain CLI name callouts"
    command: 'total=$(ls docs/benchmarks/*.md | grep -v index.md | wc -l); found=$(grep -l ''CLI name'' docs/benchmarks/*.md | grep -v index.md | wc -l); echo "$found/$total benchmarks have CLI name callout"; [ "$found" -eq "$total" ] && echo ''PASS'' || echo ''FAIL'''
    expected_output: "20/20 benchmarks have CLI name callout - PASS"
  - description: "Index page has CLI name column"
    command: "grep -q 'CLI Name\\|CLI name\\|cli.name' docs/benchmarks/index.md && echo 'PASS: index has CLI names' || echo 'FAIL: index missing CLI names'"
    expected_output: "PASS: index has CLI names"

scope_limit:
  only_modify:
    - "docs/benchmarks/"
    - "docs/platforms/pg_duckdb.md"
    - "docs/platforms/pg_mooncake.md"
  do_not_touch:
    - "Any source code files"
    - "Documentation filenames (do not rename)"
    - "Benchmark or platform registration names in code"
