    files:
      - docs/benchmarks/index.md

  - id: w5
    summary: "Add CLI name callout to platform docs with naming mismatches"
    status: done
    needs: []
    description: |
      Add a prominent callout near the top of each platform doc showing the
      CLI registration name. Mapping: pg_duckdb.md→pg-duckdb,
      pg_mooncake.md→pg-mooncake. Ensure example CLI commands use the
