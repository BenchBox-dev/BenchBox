  - "benchbox/core/expected_results/tpch_results.py:get_tpch_expected_results - reuse SF=1 answer-backed row counts for gate-query ratchets"
  - "benchbox/core/validation/query_validation.py:QueryValidator.validate_query_result - preserve row-count validation semantics outside strict gate mode"
  - "Makefile:test-correctness-gate - extend the existing bounded gate rather than adding a full stress lane"
  - "tests/unit/test_standardized_test_commands.py - extend command/workflow ratchets for query quality, strict arming, and no-skip behavior"
  - ".github/workflows/pr.yml:correctness-gate - preserve code-impacting develop PR aggregation"
  - ".github/workflows/test.yml:correctness-gate - preserve main/release aggregation"
  - "tests/README.md:Automated Gate Contract - update the documented contract after implementation"
  - "_project/TODO/main/planning/testing-approach-correctness-gates.yaml - correct stale completion notes without rewriting unrelated history"

must_preserve:
  - "Develop PR feedback remains bounded; do not run the full stress matrix on every routine PR."
  - "`make test-correctness-gate` still executes a real DuckDB/TPC-H benchmark through generate, load, and power phases."
  - "Strict gate mode fails when configured expected-results checks do not actually evaluate."
  - "Default non-strict stress matrix behavior continues to skip unsupported expected-results validation rather than failing unrelated opt-in matrix cases."
  - "Main/release and develop workflow aggregators continue to require the correctness gate for code-impacting paths where they do today."
  - "Databricks coverage-theater fixes from #737 remain intact; do not reintroduce constructor-bypass tests or `_build_query_result_with_validation` stubs."

approach: |
  Start with evidence refresh so the follow-up is tied to current `develop`,
  not a stale review transcript. Then harden the current bounded gate in place:
  choose a discriminating answer-backed query subset, make strict mode fail
  when the subset does not validate, and make the Makefile target fail on a
  selected skip. After the gate is sound, triage medium-only tests by product
  risk and promote only the clusters that carry correctness obligations.
  Finish by repairing stale documentation and recording the remaining
  row-value-validation limit as deferred work.

anti_patterns:
  - "DO NOT frame a one-cell bounded gate as the defect - because bounded routine PR feedback is intentional - improve the oracle inside that cell instead."
  - "DO NOT choose only scalar one-row aggregate queries - because row-count validation then cannot discriminate many wrong answers - include high-cardinality answer-backed queries."
  - "DO NOT leave strict enforcement behind benchmark/scale assumptions - because future CI speedups can silently disarm the oracle - fail whenever a configured strict subset produces missing/SKIP validations."
  - "DO NOT rely on pytest exit 0 for a selected node - because selected skips currently pass - add an explicit no-skip/ran-count guard."
  - "DO NOT add all medium tests to CI as a bulk fix - because the marker is heterogeneous - inventory and promote correctness-relevant clusters explicitly."
  - "DO NOT rewrite the prior TODO as if #737 never helped - preserve genuine wins and correct only the false or incomplete claims."

