id: results-explorer-uat-defect-submission-batch-path-affordances
title: "UAT defect: submission flow lacks batch and exact-path affordances"
worktree: main
priority: "Medium"
status: "Completed"
category: "Developer Experience"

description: |
  W5 had to loop `benchbox submit` over 388 captured result paths one file at a
  time. A guessed result filename failed clearly, but the flow still lacks an
  obvious way for contributors to copy exact result paths from history or submit
  a batch of successful local results.

work:
- id: w1
  summary: "Inventory existing result discovery, history, and submit command paths"
  notes: |
    Inventory found `benchbox submit` already accepts one exact result path and
    `--last`, while `benchbox results` lists recent result metadata without the
    source file paths that submit can consume. Hosted submission history is a
    separate sidecar flow (`benchbox results --submitted`) and should not be
    conflated with local result discovery. The minimal unblocked affordance is
    therefore exact path discovery in `benchbox results`, plus a submit help
    tip pointing contributors to that command.
  status: done
- id: w2
  summary: "Add a minimal exact-path or batch-submission affordance"
  needs: [w1]
  notes: |
    Own the CLI affordance only: add a copyable exact result-path view to
    `benchbox results` and update `benchbox submit --help` so users know how to
    discover the paths. Do not add batch hosted upload in this TODO; hosted
    submission stays explicit and one bundle at a time.
  status: done
- id: w3
  summary: "Document and test the contributor-facing path"
  needs: [w2]
  notes: |
    Document the exact-path discovery path in contributor-facing CLI docs and
    run the focused CLI tests plus terminating help commands.
  status: done

approach: |
  Implement the narrower exact-path affordance rather than batch submission.
  Reuse `ResultExporter.list_results()`, because it already filters primary
  schema-v2 result JSON files and excludes `.plans.json`, `.tuning.json`, and
  hosted `.submission.json` sidecars. Keep `benchbox submit RESULT.json
  --output DIR` unchanged, and keep hosted submission behind explicit
  `--service`.

scope_limit:
  only_modify:
  - "benchbox/cli/commands/results.py"
  - "benchbox/cli/commands/submit.py"
  - "tests/unit/cli/commands/test_results.py"
  - "tests/unit/cli/commands/test_submit.py"
  - "docs/reference/cli/results.md"
  - "docs/reference/cli/submit.md"
  - "docs/contributing-results.md"
  - "_project/TODO/main/active/results-explorer-uat-defect-submission-batch-path-affordances.yaml"
  - "_project/DONE/main/planning/results-explorer-uat-defect-submission-batch-path-affordances.yaml"
  do_not_modify:
  - "benchbox/cli/submit_service.py"
  - "benchbox/cli/submit_auth.py"
  - "benchbox/core/results/exporter.py"
  - "results-explorer/src/"
  - "docs/_build/"

work_unit_owned_files:
  w1:
  - "_project/TODO/main/active/results-explorer-uat-defect-submission-batch-path-affordances.yaml"
  w2:
  - "benchbox/cli/commands/results.py"
  - "benchbox/cli/commands/submit.py"
  - "tests/unit/cli/commands/test_results.py"
  - "tests/unit/cli/commands/test_submit.py"
  - "_project/TODO/main/active/results-explorer-uat-defect-submission-batch-path-affordances.yaml"
  w3:
  - "docs/reference/cli/results.md"
  - "docs/reference/cli/submit.md"
  - "docs/contributing-results.md"
  - "_project/TODO/main/active/results-explorer-uat-defect-submission-batch-path-affordances.yaml"

process_notes:
  database_cleanup: |
    Disk cleanup is part of every verification loop. When free space falls
    below 40GB, reclaim loaded database artifacts first
    (`benchmark_runs/databases/**`) and preserve reusable generated data in
    `benchmark_runs/datagen/**` unless it is stale or unrelated to active
    verification, because generated TPC-H data can be reused by derived
    workloads such as read primitives. Continue work above 5GB free; hard-stop
    only below 5GB.

verification:
- description: "CLI tests cover exact-path discovery or batch submission."
  command: "uv run -- python -m pytest tests/unit/cli/commands/test_results.py tests/unit/cli/commands/test_submit.py -q"
  expected_output: "selected CLI tests pass"
- description: "Submit help remains terminating and documents the affordance."
  command: "uv run -- benchbox submit --help"
  expected_output: "help includes the new path or batch affordance"
- description: "Results help remains terminating and documents path discovery."
  command: "uv run -- benchbox results --help"
  expected_output: "help includes the exact-path discovery flag"

must_preserve:
- "Single-file `benchbox submit RESULT.json --output DIR` continues to work."
- "No hosted upload occurs unless `--service` is explicitly requested."

anti_patterns:
- "DO NOT make batch submission silently publish -- because users need review before publication -- default to local package
  output or explicit confirmation."

metadata:
  tags: [uat, submission-flow, cli-ux]
