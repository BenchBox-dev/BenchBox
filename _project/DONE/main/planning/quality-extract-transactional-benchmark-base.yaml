id: quality-extract-transactional-benchmark-base
title: "Extract shared TransactionalBenchmarkBase + OperationsRegistryBase for transaction/write primitives"
worktree: main
priority: Medium
status: Completed
category: Code Quality and Technical Debt
description: |
  Quality plan supplement — duplication workstream follow-up. Tracks
  residual R-08 from
  `quality-consolidate-duplicate-code-clusters` (see
  docs/development/duplication-residuals.md).

  `transaction_primitives` and `write_primitives` ship near-identical
  `Benchmark` and `Operations` base classes — operation registry,
  dispatch, reporting scaffolding — but with type signatures parameterized
  over benchmark-specific result/operation types. Inventory measured the
  duplication at three clusters: 101, 93, and 71 lines (~265 lines total)
  across two 1300+ line files.

  The dedup TODO deliberately deferred this because:
    - Multi-day refactor (extraction needs generics over the
      result/operation type parameter, plus a shared registry contract)
    - Touches benchmark execution path used by ACID tests — non-trivial
      test surface
    - Per-cluster scope of the parent dedup TODO was capped at ≤4 hours

  This TODO does the extraction in reviewable slices and is the explicit
  destination flagged by R-08.

deps:
  needs:
  - quality-consolidate-duplicate-code-clusters

work:
- id: w1
  summary: "Survey both Benchmark + Operations classes side-by-side: produce diff table of (shared method, divergent method,
    divergent type signature). Identify the minimal generic surface."
  status: done

- id: w2
  summary: "Introduce TransactionalBenchmarkBase[ResultT, OperationT] under benchbox/core/transactional/. Migrate transaction_primitives.Benchmark
    to inherit; one commit."
  needs: [w1]
  status: done

- id: w3
  summary: "Migrate write_primitives.Benchmark onto TransactionalBenchmarkBase[ResultT, OperationT]; verify type params bind
    cleanly. One commit."
  needs: [w2]
  status: done

- id: w4
  summary: "Introduce OperationsRegistryBase[OperationT]; migrate transaction_primitives.Operations and write_primitives.Operations
    one at a time."
  needs: [w1]
  status: done

- id: w5
  summary: "Re-run pylint duplicate-code at 15-line threshold over both modules; confirm the three R-08 clusters drop out.
    Update docs/development/duplication-residuals.md."
  needs: [w3, w4]
  status: done

files_affected:
  modified:
  - "benchbox/core/transaction_primitives/benchmark.py"
  - "benchbox/core/transaction_primitives/operations.py"
  - "benchbox/core/write_primitives/benchmark.py"
  - "benchbox/core/write_primitives/operations.py"
  - "docs/development/duplication-residuals.md"
  added:
  - "benchbox/core/transactional/benchmark_base.py"
  - "benchbox/core/transactional/operations_registry_base.py"

must_preserve:
- "Runtime behavior of every transaction_primitives + write_primitives benchmark unchanged"
- "ACID test results unchanged at every scale factor"
- "Result-model field names and types unchanged on the public surface (only the implementation moves)"
- "All transaction_primitives + write_primitives tests pass on every backend (DuckDB / Postgres / SQLite at minimum)"

approach: |
  Extract-with-generics. The two benchmark classes are not identical; they
  parameterize over different ResultT / OperationT. The extraction must
  preserve that parameterization, not collapse it.

  Sequence each migration: introduce base, migrate ONE family, run tests,
  commit; then migrate the second family. Do not bundle. The reason the
  parent dedup TODO refused to touch this was bundle risk.

anti_patterns:
- "DO NOT collapse ResultT / OperationT into a single concrete type — because that loses type safety the existing classes
  provide — keep generics"
- "DO NOT migrate both families in one commit — because review needs to see each migration in isolation — one commit per family"
- "DO NOT change benchmark semantics during extraction — because that's a separate concern — structural moves only"
- "DO NOT extract methods that genuinely differ between the two families — because the diff exists for a reason — the survey
  in w1 must classify each method as shared vs divergent"

verification:
- description: "Pylint R0801 count drops to 0 in the four target files (catalog/schema/dataframe_ops files are out-of-scope
    and retain pre-existing clusters)"
  command: "uv run --with pylint --with pandas --with polars pylint --disable=all --enable=duplicate-code --min-similarity-lines=15
    benchbox/core/transaction_primitives/benchmark.py benchbox/core/transaction_primitives/operations.py benchbox/core/write_primitives/benchmark.py
    benchbox/core/write_primitives/operations.py 2>&1 | grep -c 'R0801'"
  expected_output: "0"
- description: "Transaction primitives tests pass"
  command: "uv run -- python -m pytest tests/unit/core/transaction_primitives/ tests/unit/core/write_primitives/ -q"
  expected_output: "all tests pass"
- description: "ACID test runs cleanly on DuckDB"
  command: "uv run benchbox run --platform duckdb --benchmark transaction_primitives --scale 0.01 --dry-run /tmp/preview"
  expected_output: "preview generated, no error"

metadata:
  tags: ["quality-plan", "phase-2", "duplication", "transactional"]
  estimated_effort: "Medium (2-3 days)"
  created_date: "2026-04-13"
