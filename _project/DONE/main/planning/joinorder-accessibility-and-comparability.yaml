impact:
  business_value: |
    Decides (on the record) whether the loss of a quick-iteration path for the
    real JOB workload is acceptable, and closes a results-comparability hazard
    that the explorer team has been fixing benchmark-by-benchmark.
  user_impact: |
    (A) Users on laptops / CI / metered egress get either a small correlated JOB
    option or a clear statement that there isn't one. (B) A 13-of-113 DataFrame
    run can't be silently mistaken for, or compared against, a complete run.
  technical_debt: |
    Aligns joinorder with the rest of the suite on partial-run / leaderboard-
    scope handling instead of being a quiet exception.

success_metrics:
  - "An ADR records the decision on a reachable small JOB workload (build JOB-light / promote tiny fixture / document none)"
  - "If a small scale was chosen: it is selectable, resolves to a correlated subset archive, all 113 queries run on it, and it is documented as not-comparable to --scale 1"
  - "A verification log establishes whether a joinorder --mode dataframe run is marked partial across result metadata, leaderboard, and compare"
  - "If any surface treated a 13/113 run as complete/comparable, that is fixed via the existing comparability machinery and covered by tests"

open_questions:
  - question: "Build a JOB-light correlated subset (option a), promote the tiny fixture (option b), or document that no small path exists (option c)?"
    gating: true
    affects: ["w1 success_metric: small-workload ADR", "w2", "w3"]
    default: "Option (b) -- promote the existing joinorder_canonical_tiny fixture as a documented smoke-only scale -- is the lowest-effort path that still gives a reachable real-data option; (a) only if the user wants a genuinely measurement-useful small scale"
  - "Does the existing BenchmarkResults model already record queries-executed vs queries-defined + skip list, or does Phase 3 need to add that field?"
