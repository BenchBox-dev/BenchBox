must_preserve:
  - "default_scale for joinorder stays 1.0 (canonical is the default); a small scale is opt-in"
  - "scale_factor=1.0 keeps fetching/verifying the canonical archive exactly as today; any small-scale path is additive"
  - "joinorder_synthetic stays surface=internal and is not repurposed as the 'small JOB' answer"
  - "The 13 real DataFrame translations and the 100 NotImplementedError stubs / skip list keep behaving as today; Phase 3 only adds run-level partiality metadata"

approach: |
  Two independent tracks under one TODO. Track A (w1-w3): a recorded design
  decision first (the user picks a/b/c), then implement only if a/b. Track B
  (w4-w5): verify first, fix only if needed, and reuse the explorer/compare
  comparability machinery the team already built rather than inventing a
  joinorder-specific one. Read benchmark_registry.py's scale-validation path
  and the explorer leaderboard-scope logic before touching either.

anti_patterns:
  - "DO NOT add a small scale by truncating each table to the first N rows — because that orphans foreign keys and the JOB queries return empty — derive a transitively-closed sub-universe (or reuse the tiny-fixture build)"
  - "DO NOT make joinorder_synthetic the 'small JOB' answer — because it is uncorrelated random data and does not exercise the optimizer like JOB — it stays internal/smoke-only"
  - "DO NOT build a joinorder-specific 'partial run' marker — because the explorer already has leaderboard-scope + compare-warning machinery (PRs #361/#363/#367/#370) — reuse it"
  - "DO NOT change default_scale away from 1.0 — because canonical JOB is the point of the public benchmark — a small scale is strictly opt-in"
  - "DO NOT skip the w4 verification and jump straight to building a marker — because the explorer work may already cover this — verify, then fix only the actual gap"

verification:
  - description: "Phase 1 decision is recorded as an ADR in _project/decisions/"
    command: "ls _project/decisions/joinorder-small-workload-*.md && grep -il 'joinorder\\|JOB' _project/decisions/joinorder-small-workload-*.md"
    expected_output: "an ADR records the choice among (a) build JOB-light, (b) promote the tiny fixture, (c) document no small path -- with rationale"
  - description: "If a small scale was added: it is in scale_options, resolves to the light archive, and all 113 queries run on it"
    command: "uv run -- python -c \"from benchbox.core.benchmark_registry import BENCHMARK_METADATA as m; print(m['joinorder']['scale_options'])\" && uv run -- python -m pytest tests/unit/core/joinorder -q"
    expected_output: "scale_options shows the new small value (or [1.0] unchanged if option (c) was chosen); joinorder unit tests pass including the new subset test"
  - description: "Phase 2 verification summary exists and states the partiality finding"
    command: "grep -RiE 'partial|skip|unrank|113|comparab' _project/joinorder"
    expected_output: "the summary shows whether a joinorder --mode dataframe run is marked partial across result metadata / leaderboard / compare"
  - description: "If a gap was found: partial joinorder DataFrame runs are marked and comparison-guarded; tests cover it"
    command: "uv run -- python -m pytest tests/unit/core/joinorder tests/unit -k 'joinorder and (partial or skip or comparab)' -q || echo 'no gap found / no Phase 3 needed'"
    expected_output: "either Phase 3 tests pass, or Phase 2 found no gap and Phase 3 was correctly skipped"
  - description: "Docs build clean after any doc updates"
    command: "make docs-validate"
    expected_output: "passes"

