id: fail-open-policy-and-translation-strictness
title: "Architecture hardening: define fail-open vs fail-closed policy for translation and validation"
worktree: main
priority: Medium-High
status: "Completed"
category: Correctness

deps:
  needs:
    - architecture-contract-map-and-support-taxonomy
    - result-schema-policy-and-explorer-input-gate

description: |
  BenchBox intentionally fails open in some interactive paths: SQL translation
  can return original SQL when SQLGlot is unavailable or translation fails, and
  validation defaults can leave checks disabled. That resilience is useful for
  local experimentation, but publishing, CI, compatibility governance, and
  result comparison need explicit uncertainty or fail-closed behavior.

  This item defines mode-specific policy and adds strict translation metadata
  without globally making graceful fallback fatal.

work:
  - id: w0
    summary: "Revalidate current fail-open paths and tests that require graceful fallback"
    status: done
    notes: |
      Checked SHA before edits: f255be364a7913864c308579ebef85f4cbff2707.
      Revalidated fail-open sites:
        - benchbox/utils/dialect_utils.py returned source SQL on SQLGlot import
          or translation failure.
        - benchbox/platforms/base/dialect_translation.py returned source SQL
          for adapter/multi-statement translation failures.
        - benchbox/core/runner/runner.py converted only UNKNOWN/blank
          validation to NOT_RUN, leaving default PASSED placeholders intact.
        - tests/integration/test_tpcds_duckdb_dialect.py asserts malformed SQL
          translation stays graceful in local/default mode.
        - result bundles already had execution and summary.validation surfaces
          suitable for additive translation metadata and uncertainty labels.

  - id: w1
    summary: "Decision gate: define mode policy for interactive, CI, publishing, and governance"
    needs: [w0]
    status: done
    notes: |
      Recorded policy in docs/reference/public-contracts.md:
        - interactive/local remains fail-open with warnings and bundle metadata,
        - CI/compat governance can fail closed through strict translation mode,
        - publishing/explorer consumers must reject or label non-clean
          NOT_RUN/NOT_VALIDATED/UNKNOWN/UNCERTAIN statuses,
        - validation_status PASSED is reserved for runs with validation evidence.

  - id: w2
    summary: "Add translation outcome metadata to result bundles"
    needs: [w1]
    status: done
    notes: |
      Added additive execution.translation metadata without a schema-version
      bump: aggregate status, strict_mode, attempt/success/fallback/failed
      counts, translators, source/target dialects, warning/error categories,
      and compact grouped outcomes. Loader reconstruction preserves it.

  - id: w3
    summary: "Add strict translation mode for CI, publishing, and compat tests"
    needs: [w1]
    status: done
    notes: |
      Added sql_translation_context(strict=True) plus lifecycle-runner wiring.
      Runner reads strict_translation, translation_strict, or
      sql_translation_strict from benchmark options or platform_options, so CLI
      platform-option paths can request fail-closed behavior.

  - id: w4
    summary: "Add golden or representative translation tests for risky dialect paths"
    needs: [w3]
    status: done
    notes: |
      Added unit tests for successful outcome metadata, graceful fallback
      metadata, strict-mode failure, compact summary grouping, bundle export
      metadata, and non-clean status policy. Added a TPC-DS integration test
      asserting strict translation fails closed while the existing graceful
      fallback integration test remains intact.

  - id: w5
    summary: "Fix contradictory validation documentation and result status semantics"
    needs: [w1]
    status: done
    notes: |
      Lifecycle finalization now converts default PASSED placeholders with no
      validation records/details to NOT_RUN. Translation fallback on otherwise
      clean results marks validation_status UNCERTAIN. Shared result status
      policy treats not_run, not_validated, unknown, and uncertain as non-clean.
      Updated result-integrity docs with explicit status semantics.

deferred:
  - summary: "Make validation enabled by default for every benchmark"
    reason: "Potentially expensive and behavior-changing; decide after mode policy and result labeling are correct."
  - summary: "Golden-file every SQL dialect translation"
    reason: "This TODO starts with representative risky paths and strict-mode wiring."

metadata:
  tags:
    - correctness
    - sql-translation
    - validation
    - publishing
  estimated_effort: "3-6 days"
  created_date: "2026-05-21"
  last_updated: "2026-05-21T07:15:00Z"

impact:
  business_value: |
    Prevents uncertain SQL translation or skipped validation from becoming
    published correctness claims.
  user_impact: |
    Local users retain forgiving behavior, while public/CI results get explicit
    safety labels or failures.
  technical_debt: |
    Replaces scattered fallback behavior with a mode-aware correctness policy.

files_affected:
  modified:
    - "benchbox/utils/dialect_utils.py"
    - "benchbox/platforms/base/dialect_translation.py"
    - "benchbox/core/runner/"
    - "benchbox/core/results/"
    - "tests/unit/utils/"
    - "tests/unit/core/results/"
    - "tests/integration/test_tpcds_duckdb_dialect.py"
    - "tests/integration/validation/"
    - "docs/reference/public-contracts.md"
    - "docs/development/result-integrity-validation.md"

must_preserve:
  - "Do not break tests that intentionally assert graceful fallback in interactive/local paths."
  - "Do not label unchecked validation as PASSED."
  - "Do not change public result schema fields without coordinating with result-schema-policy-and-explorer-input-gate."

approach: |
  Make fallback behavior mode-aware instead of globally fatal. Add metadata so
  downstream consumers can distinguish successful translation from fallback,
  and make strict mode available to CI, publishing, and governance paths.

anti_patterns:
  - "DO NOT globally raise on every translation failure -- tests and local workflows rely on graceful fallback -- add strict mode for gates instead."
  - "DO NOT bury translation failure in logs only -- result bundles and gates need structured metadata -- record outcome explicitly."
  - "DO NOT treat validation disabled as validation passed -- that is a public correctness claim -- use NOT_RUN or UNCERTAIN."

verification:
  - description: "Run focused dialect translation tests."
    command: "uv run -- python -m pytest tests -k 'dialect or translation' --tb=short"
    expected_output: "Graceful and strict translation tests pass."
  - description: "Run focused result validation tests."
    command: "uv run -- python -m pytest tests -k 'validation_status or result_integrity' --tb=short"
    expected_output: "Validation status semantics are enforced."

