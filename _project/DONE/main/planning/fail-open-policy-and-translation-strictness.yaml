  - "Translation fallback is visible in result metadata."
  - "Publishing/CI/governance paths can enforce strict translation or record uncertainty."

open_questions:
  - "Should publishing reject fallback-translated results or publish them with a visible uncertainty label?"
  - "Should strict translation be opt-in by CLI flag, implied by publishing, or both?"
