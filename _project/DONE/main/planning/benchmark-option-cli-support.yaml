  - benchbox/platforms/

success_metrics:
- --benchmark-option K=V works end-to-end for at least nyctaxi, flightdata, tsbs_devops
- Type coercion handles int, list[int], list[str], enum lists, bool, datetime
- Unknown options produce clear error messages with available options listed
- seed and force_regenerate reach benchmark constructors that accept them
- --help-topic shows available benchmark options per benchmark

metadata:
  owners:
  - '@benchbox-maintainers'
  tags:
  - cli
  - infrastructure
  - developer-experience
  estimated_effort: 1-2 weeks
  created_date: '2026-04-04'
  dependencies:
  - Existing --platform-option mechanism (benchbox/cli/platform_hooks.py)
  notes: >
    Discovered during NYC Taxi benchmark expansion review. The taxi_types param
    was added to NYCTaxiBenchmark but is unreachable from the CLI. Research
    revealed this is a systemic gap affecting 10 of 21 benchmarks.

    The --platform-option implementation in platform_hooks.py (209 lines) is a
    proven, well-tested pattern. The benchmark-option implementation should be
    structurally identical: BenchmarkOptionSpec dataclass, BenchmarkHookRegistry
    class, BenchmarkOptionParamType Click param type.

    seed and force_regenerate are already in BenchmarkConfig.options but only used
    by the orchestrator/runner, not forwarded to constructors. This TODO fixes
    that gap too — benchmarks register seed/force_regenerate as specs, and the
    orchestrator forwards them alongside any user-provided --benchmark-option values.

work:
- id: w1
  summary: Create BenchmarkHookRegistry and BenchmarkOptionSpec in benchbox/cli/benchmark_hooks.py
  status: done
  notes: >
    Mirror platform_hooks.py structure:
    - BenchmarkOptionError (ValueError subclass)
    - BenchmarkOptionSpec dataclass (name, parser, default, help, choices, aliases)
    - List/enum parser functions: parse_int_list, parse_str_list, parse_enum_list factory
    - BenchmarkHookRegistry class: register_option_specs(benchmark, *specs),
      parse_options(benchmark, provided), describe_options(benchmark), get_default_options(benchmark)
    - Reuse existing parse_bool and _identity from platform_hooks or extract to shared utils

- id: w2
  summary: Add --benchmark-option Click option to run.py and wire parsing
  status: done
  needs:
  - w1
  notes: >
    In benchbox/cli/commands/run.py:
    - Add BenchmarkOptionParamType (same pattern as PlatformOptionParamType)
    - Add @click.option("--benchmark-option", ..., type=BenchmarkOptionParamType(),
      multiple=True, hidden=True) — parallel to --platform-option
    - Parse benchmark options via BenchmarkHookRegistry.parse_options(benchmark, pairs)
    - Store parsed options in BenchmarkConfig.options under a namespaced key
      (e.g., options["benchmark_options"] = {...}) to avoid collision with existing options

- id: w3
  summary: Wire orchestrator to forward benchmark options to constructor kwargs
  status: done
  needs:
  - w2
  notes: >
    In benchbox/cli/orchestrator.py _get_benchmark_instance():
    - Extract benchmark_options from config.options.get("benchmark_options", {})
    - Merge into kwargs dict before calling benchmark_class(**kwargs)
    - seed and force_regenerate: these already live in BenchmarkConfig.options
      but are NOT forwarded to constructors today. The orchestrator should check
      if the current benchmark has registered BenchmarkOptionSpecs for "seed" or
      "force_regenerate" (via BenchmarkHookRegistry.list_option_specs(benchmark)),
      and if so, include them in kwargs from config.options. Benchmarks that don't
      register these specs simply never receive them (no change). This avoids a
      dual-path where seed flows through both config.options and --benchmark-option.
    - Preserve existing try/except TypeError fallback for parallel param

- id: w4
  summary: Register option specs for high-complexity benchmarks (NYC Taxi, TSBS DevOps — enum lists, datetime, int lists)
  status: done
  needs:
  - w1
  notes: >
    These benchmarks require the custom parser functions built in w1 (parse_enum_list,
    parse_int_list, parse_datetime). This is the highest-risk work unit — validate
    parser edge cases (empty lists, single values, whitespace) here before w5.

    NYC Taxi (benchbox/core/nyctaxi/benchmark.py):
    - taxi_types: parse_enum_list(TaxiType), default=None, choices description
    - year: int parser, default=2019, choices=range(2019,2026)
    - months: parse_int_list, default=None
    - seed: int parser, default=None

    TSBS DevOps (benchbox/core/tsbs_devops/benchmark.py):
    - num_hosts: int parser, default=None
    - duration_days: int parser, default=None
    - interval_seconds: int parser, default=10
    - start_time: parse_datetime, default=None

    Registration via module-level BenchmarkHookRegistry.register_option_specs() calls
    (same pattern as platform option registration in benchbox/platforms/__init__.py).

- id: w5
  summary: Register option specs for simple-type benchmarks (FlightData, DataVault, TPC-DS OBT, TPC-H Skew, Vector Search, Join Order, TPC-DI)
  status: done
  needs:
  - w1
  notes: >
    These benchmarks use only str, int, parse_bool, parse_str_list, and
    choices-constrained str parsers — all straightforward. Lower risk than w4.

    FlightData: end_year (int, default=LAST_AVAILABLE_YEAR)
    DataVault: hash_algorithm (str, choices=["md5","sha256",...]), record_source (str)
    TPC-DS OBT: tpcds_source_dir (str), dimension_mode (str, choices), channels (parse_str_list), output_format (str, choices)
    TPC-H Skew: skew_preset (str, choices=["none","light","moderate","heavy","extreme","realistic"])
    Vector Search: dimensions (int, default=128)
    Join Order: queries_dir (str)
    TPC-DI: enable_parallel (parse_bool, default=False), max_workers (int)

- id: w6
  summary: Add unit tests for BenchmarkHookRegistry, parsers, and end-to-end wiring
  status: done
  needs:
  - w3
  - w4
  notes: >
    tests/unit/cli/test_benchmark_hooks.py:
    - Registry: register, parse, describe, defaults, unknown key rejection, duplicate rejection
    - Parsers: parse_int_list, parse_str_list, parse_enum_list (TaxiType), parse_datetime
    - Integration: BenchmarkOptionParamType Click type, end-to-end from CLI string to constructor kwarg
    - Regression: benchmarks without registered specs still construct normally

- id: w7
  summary: Add --help-topic documentation for benchmark options
  status: done
  needs:
  - w4
  - w5
  notes: >
    Extend --help-topic system (benchbox/cli/help.py) to show available benchmark
    options per benchmark.
    Example output for --help-topic benchmarks or --help-topic nyctaxi:
      nyctaxi:
        taxi_types  - Taxi data types to load (yellow,green,hvfhv) [default: yellow]
        year        - Year of TLC data (2019-2025) [default: 2019]
        months      - Months to include, comma-separated (1-12) [default: all]

deferred:
- id: d1
  summary: Add benchmark-option shell completion
  reason: >
    Tab-completion for --benchmark-option keys and choices would improve DX but
    requires Click shell completion integration. Not needed for initial release.
  undefer_when: User feedback requests it or CLI completion is added for other options
- id: d2
  summary: Validate benchmark options against constructor signature at registration time
  reason: >
    Could catch mismatches between registered spec names and actual constructor
    param names. Low risk since specs are co-located with benchmark code and
    tested. Adds import-time overhead.
  undefer_when: A bug is caused by spec/constructor name mismatch
