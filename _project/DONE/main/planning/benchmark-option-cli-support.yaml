id: benchmark-option-cli-support
title: Add --benchmark-option K=V CLI support for benchmark-specific parameters
worktree: main
category: Core Functionality
priority: High
status: Completed
completed_date: '2026-04-12'
description: >
  Benchmark constructors accept parameters that are unreachable from the CLI.
  The orchestrator (_get_benchmark_instance) only forwards a fixed set of kwargs
  (scale_factor, compress_data, compression_type, compression_level, verbose,
  quiet, parallel). Benchmark-specific parameters like taxi_types, year, months,
  end_year, num_hosts, skew_preset, dimensions, hash_algorithm, seed, and
  force_regenerate never reach the constructor.

  This affects 10 of 21 benchmarks. The fix is a --benchmark-option K=V mechanism
  mirroring the existing --platform-option K=V pattern. Each benchmark registers
  typed option specs; the orchestrator merges parsed options into constructor kwargs.

context_sections:
- name: Affected Benchmarks — Unreachable Parameters
  summary: >
    | Benchmark     | Unreachable params                                          |
    |---------------|-------------------------------------------------------------|
    | nyctaxi       | taxi_types (list[TaxiType]), year (int), months (list[int]) |
    | flightdata    | end_year (int)                                              |
    | tsbs_devops   | num_hosts (int), duration_days (int), interval_seconds (int), start_time (datetime) |
    | datavault     | hash_algorithm (str), record_source (str)                   |
    | tpcds_obt     | tpcds_source_dir (str), dimension_mode (str), channels (list[str]), output_format (str) |
    | tpch_skew     | skew_preset (str)                                           |
    | vector_search | dimensions (int)                                            |
    | joinorder     | queries_dir (str)                                           |
    | tpcdi         | enable_parallel (bool), max_workers (int)                   |
    | ALL with seed | seed (int) — stored in BenchmarkConfig.options but not forwarded |

    Additionally, force_regenerate is stored in BenchmarkConfig.options but not
    forwarded to benchmark constructors that accept it.

- name: Existing --platform-option Pattern
  summary: >
    The platform-option mechanism (platform_hooks.py) provides the exact design
    to follow:

    1. PlatformOptionSpec dataclass: name, parser callable, default, help, choices, aliases
    2. PlatformHookRegistry: register_option_specs(), parse_options(), describe_options()
    3. PlatformOptionParamType (Click param): validates KEY=VALUE format
    4. Flow: CLI parses pairs → registry resolves names and applies parsers → typed dict
       merged into DatabaseConfig.options

    Key design decisions already validated by platform-option:
    - Specs register typed parsers (int, parse_bool, custom lambdas) — no reflection
    - Unknown keys rejected with clear error listing available options
    - Duplicate keys rejected
    - Defaults applied for unspecified options
    - Aliases supported (e.g., driver_version / driver-version)
    - Options are hidden from main --help (shown in --help-topic)

- name: Type Coercion Requirements
  summary: >
    Platform-option parsers handle str, int, bool. Benchmark-option adds:

    - list[int]: comma-separated "1,2,3" → [1, 2, 3] (months, channels)
    - list[str]: comma-separated "store,web" → ["store", "web"]
    - list[Enum]: comma-separated "yellow,green,hvfhv" → [TaxiType.YELLOW, ...]
    - datetime: ISO format "2019-02-01T00:00:00" → datetime object
    - Existing parsers (int, parse_bool, str identity) reused directly

    Parsers should live alongside the existing parse_bool() in a shared module
    or in the new benchmark_hooks.py file.

