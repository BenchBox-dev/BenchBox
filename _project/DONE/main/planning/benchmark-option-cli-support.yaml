must_preserve:
- All existing benchmark default behavior unchanged when no --benchmark-option provided
- --platform-option continues working independently
- Benchmarks with only standard params (tpch, tpcds, ssb, clickbench, h2odb, etc.) unaffected
- BenchmarkConfig.options continues serving its existing purposes (tuning config, validation flags, power run settings)
- seed and force_regenerate continue working in their current RunConfig/orchestrator paths — benchmark-option adds a parallel path to the constructor

anti_patterns:
- DO NOT add individual CLI flags per benchmark parameter (--taxi-types, --year, --end-year) — because this creates N*M option explosion across 21 benchmarks and 30+ existing CLI options — use the generic --benchmark-option K=V mechanism instead
- DO NOT use Python inspect/reflection to auto-discover constructor params — because it's fragile across **kwargs, defaults, and type annotations — use explicit spec registration per benchmark (same as platform-option)
- DO NOT merge benchmark-option parsing into PlatformHookRegistry — because platform and benchmark options have different lifecycles (platform options go to DatabaseConfig, benchmark options go to constructor kwargs) — create a parallel BenchmarkHookRegistry
- DO NOT pass raw BenchmarkConfig.options dict as **kwargs to constructors — because options contains orchestrator-level settings (tuning_enabled, validation flags, estimated_time_range) that would cause TypeError on benchmark constructors — only forward keys that have registered BenchmarkOptionSpecs

verification:
- description: NYC Taxi benchmark accepts taxi_types via CLI
  command: >
    benchbox run --platform duckdb --benchmark nyctaxi --scale 0.01
    --benchmark-option taxi_types=yellow,green,hvfhv --dry-run
  expected_output: dry run shows 3 taxi types, 39 queries
- description: Unknown benchmark option rejected with clear error
  command: >
    benchbox run --platform duckdb --benchmark tpch --scale 0.01
    --benchmark-option nonexistent=value --dry-run
  expected_output: error message listing available options (or none)
- description: All existing tests pass (no regression)
  command: uv run -- python -m pytest tests/ -m fast -q
  expected_output: all pass, 0 failures
- description: Benchmark hook registry unit tests pass
  command: uv run -- python -m pytest tests/unit/cli/test_benchmark_hooks.py -v
  expected_output: all pass
- description: Help-topic shows registered benchmark options
  command: benchbox run --help-topic benchmarks
  expected_output: output includes taxi_types, year, months for nyctaxi and skew_preset for tpch_skew

