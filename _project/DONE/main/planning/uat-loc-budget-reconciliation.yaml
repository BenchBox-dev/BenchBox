id: uat-loc-budget-reconciliation
title: "UAT boundary reset: reconcile the ~1,500 LOC budget with the ~6,500 prod LOC reality"
worktree: main
priority: Medium
status: Completed
completed_date: "2026-06-01"
category: Testing and Quality Assurance

description: |
  Outcome of a 4-round adversarial architecture review of the UAT layer. The
  spec budgeted ~1,500 LOC across 13 modules (_project/specs/uat-framework.md:132).
  Actual UAT is ~6,476 production LOC (~4.3x) + ~5,730 test LOC + 1,729 YAML
  across 20+ modules + 31 configs.

  Both sides agree the production concern is valid (the rebuttal's "test LOC !=
  production complexity" is fair, but prod alone is still 4.3x). Even after
  excluding explorer-prep (356 LOC) and legitimate evidence artifacts (746 LOC),
  ~5,300 prod LOC remains in the plumbing/core/preflight/docker machinery the
  ORIGINAL 1,500-LOC spec was meant to cover. Release-gate orchestration
  explains the audit trail; it does not explain a 3.6x remaining core.

  This item is the deliberate reconciliation: do not leave a 4x gap between
  charter and reality unexplained. It depends on the charter decision in
  [[uat-certification-wording-charter-decision]] because the chartered scope
  determines what the budget should be. The decision work produces one
  reconciliation path; the unchosen path is recorded as deferred rather than as
  a pending work unit that blocks TODO completion.

work:
- id: w0
  summary: "Re-measure prod/test/YAML LOC per module and bucket each (core / evidence-artifacts / explorer-prep / plumbing)"
  status: done
  notes: |
    Re-measure the prod LOC figure with a per-module breakdown. Bucket:
    core-exercise (execute, matrix, runner, enumerate, ladder, cleanup),
    evidence-artifacts (report rollups, packaging, resume, source-SHA),
    explorer-prep, docker lifecycle (721 LOC, default-OFF), plumbing
    (orchestrator/config/cli ~1,783 LOC). Record a compact summary.
    MEASURED 2026-06-01 (on merged develop, prod = tests/uat/*.py minus test_*/conftest):
      prod ~6,476 across 21 modules; test ~5,730; yaml ~1,729.
      Buckets: plumbing (orchestrator 649/config 578/_cli 556)=1,783;
      core-exercise (execute 751/matrix 384/runner 265/enumerate 137/cleanup 121/ladder 83)=1,741;
      preflight+compat+timeouts (preflight 407/preflight_budget 216/compatibility 198/timeouts 130)=951;
      docker lifecycle default-OFF (docker_assets 504/docker_cleanup 372)=876;
      evidence artifacts (validate 303/report 273/package 170)=746; explorer-prep 356; package init markers 23.
      ROOT CAUSE of the 4.3x: (a) the spec table OMITTED 4 modules entirely
      (_cli 556/docker_cleanup 372/preflight_budget 216/compatibility 198 = 1,342 LOC),
      and (b) phases/plumbing were under-estimated. No discretionary bloat in load-bearing buckets.
      NOTE: docker_assets 504 includes ~140 LOC added by uat-single-connection-registry (this batch).

- id: w1
  summary: "Decide path A (cut code toward intent) vs path B (revise budget with rationale)"
  needs: [w0]
  status: done
  notes: |
    Gated by [[uat-certification-wording-charter-decision]] — chartered scope
    sets the target budget. Candidate cut areas (path A): orchestrator/config/cli
    plumbing (1,783 LOC) and the default-OFF docker lifecycle (721 LOC, where
    docker_manage_platforms defaults false).
    DECIDED 2026-05-31 (user): Path B — revise the budget with per-bucket
    rationale. Evidence (w0) shows the gap is undercounting of chartered
    surface (4 unlisted modules + under-estimated phases), not bloat; a forced
    cut would damage load-bearing capability. Charter dep satisfied: #4 (Path A,
    "release-gate orchestration") merged in PR #729. Path A recorded as deferred.

- id: w2
  summary: "Apply the selected reconciliation path and record the unchosen path as deferred"
  needs: [w1]
  status: done
  notes: |
    If w1 chooses path A, reduce plumbing/discretionary subsystems and defer
    path B. If w1 chooses path B, update _project/specs/uat-framework.md:132
    to a realistic budget with per-bucket rationale and defer path A. Favor
    the "consume canonical surfaces" principle in either path.
    DONE (Path B): replaced the §"Responsibility split" estimate table with an
    added Actual (2026-06-01) column + the 4 previously-unlisted modules, and the
    "~1,500 LOC" total with a "Budget reconciliation" note revising it to
    ~6,500 prod LOC / ~21 modules with the per-bucket breakdown and root cause.
    Path A (cut code) recorded as deferred.

deferred:
- summary: "Set a CI LOC-budget guard that fails when UAT exceeds the agreed budget"
  reason: "A budget guard only makes sense after the budget is reconciled; now that it is, a guard at ~6,500 is a reasonable
    follow-up."
- summary: "Execute the reconciliation path not selected in w1 (Path A: cut code toward the budget)"
  reason: "Path B was chosen; the cut-vs-revise decision is intentionally exclusive, so Path A must not remain pending work.
    Evidence showed the buckets are chartered, not bloat."

metadata:
  tags:
  - uat-boundary-reset
  - tech-debt
  - release-gate
  estimated_effort: "2-3 days"
  created_date: "2026-05-31"
  last_updated: "2026-06-01T00:00:00Z"

impact:
  technical_debt: |
    Closes the unexplained 4x gap between the spec's LOC budget and the
    implementation — either by trimming the core or by honestly revising the
    budget with per-bucket rationale.

prior_art:
- "_project/specs/uat-framework.md:132 — reuse as the budget source of truth; revise only with rationale"
- "tests/uat/README.md layout section — reuse for module inventory when bucketing production LOC"
- "tests/uat/phases/report.py and tests/uat/orchestrator.py — treat source-SHA/report artifacts as chartered evidence before
  considering cuts"

approach: |
  Measure and bucket first, settle the charter decision (it sets the target),
  then either cut or revise. Trimming should favor the "consume canonical
  surfaces" principle so it compounds with the classifier and registry items.

anti_patterns:
- "DO NOT revise the budget number without a per-bucket rationale — that just blesses the bloat"
- "DO NOT cut evidence/audit artifacts that ARE chartered (lines 31,35-38,268,688) to hit a number"

verification:
- description: "Per-module LOC breakdown exists and buckets sum to the measured total"
  command: "find tests/uat -name '*.py' ! -name 'test_*' ! -name 'conftest*' | xargs wc -l | tail -1"
  expected_output: "prod LOC total matches the breakdown in w0"
- description: "Spec budget and reality reconciled"
  command: "grep -n '1,500\\|1500\\|LOC' _project/specs/uat-framework.md"
  expected_output: "budget line reflects the decision (revised number with rationale, or unchanged with code trimmed toward
    it)"

scope_limit:
  only_modify:
  - "_project/specs/uat-framework.md (budget line + rationale)"
  - "tests/uat/ (only if path A trimming is chosen)"
  do_not_modify:
  - "benchbox/ (this item is about the UAT layer's size, not core)"

deps:
  needs:
  - uat-certification-wording-charter-decision

success_metrics:
- "Spec budget and implementation reconciled: code trimmed toward budget OR budget revised with per-bucket rationale"
- "The 4x charter-vs-reality gap is no longer silent"
