id: df-support-transaction-primitives
title: Add DataFrame execution support to Transaction Primitives benchmark
worktree: main
priority: Medium
status: Completed
description: "Complete and integrate the existing DataFrame operations module for\
  \ the Transaction\nPrimitives benchmark, enabling execution on PySpark + Delta Lake/Iceberg\
  \ platforms.\n\nTransaction Primitives tests ACID transaction semantics: commit,\
  \ rollback, savepoints,\nisolation levels, and multi-statement transactions using\
  \ 23 SQL operations on TPC-H\nstaging tables (txn_orders, txn_lineitem, txn_customer).\n\
  \nA substantial dataframe_operations.py already exists (1290 lines) with:\n- TransactionOperationType\
  \ enum (10 operation types: ATOMIC_INSERT, ROLLBACK_TO_VERSION,\n  TIME_TRAVEL_QUERY,\
  \ CONCURRENT_WRITE, etc.)\n- DataFrameTransactionCapabilities dataclass (per-platform\
  \ capability tracking)\n- Integration with DataFrameMaintenanceCapabilities and\
  \ TransactionIsolation\n- Platform-specific support declarations (PySpark+Delta,\
  \ PySpark+Iceberg)\n\nKey constraint: DataFrame transaction semantics are fundamentally\
  \ different from SQL.\nSQL uses BEGIN/COMMIT/ROLLBACK; Delta Lake uses atomic writes\
  \ with RESTORE for\nrollback; Iceberg uses snapshot-based isolation. Polars/Pandas\
  \ have NO transaction\nsupport. This benchmark is PySpark-only in DataFrame mode.\n\
  \nThe work is primarily integration - wiring the existing operations module into\
  \ the\nbenchmark class, runner, and registry - plus filling in any incomplete operation\n\
  implementations and adding tests.\n"
category: Core Functionality
work:
  - id: w1
    summary: Audit existing dataframe_operations.py - map operations to benchmark operations,
      identify gaps
    status: done
    notes: "Read benchbox/core/transaction_primitives/dataframe_operations.py (1290
      lines) thoroughly.

      Compare against the 23 SQL operations defined in catalog/operations.yaml.


      Create a mapping table:

      - Which SQL operations have DataFrame equivalents already implemented?

      - Which operations are impossible in DataFrame mode (e.g., SQL-level savepoints)?

      - Which operations need new implementations?

      - Which DataFrameTransactionCapabilities are fully implemented vs stubs?


      Check integration points:

      - Does the module use get_maintenance_operations_for_platform() correctly?

      - Does it handle DataFrameMaintenanceCapabilities properly?

      - Are the TransactionIsolation levels correctly mapped?


      Document findings in a comment block at the top of the file or in a separate

      audit notes file to guide w2.

      "
  - id: w2
    summary: Complete missing operation implementations and add skip lists for unsupported
      operations
    needs:
      - w1
    status: done
    notes: "Based on the w1 audit:\n\n1. Complete any stub implementations in dataframe_operations.py\n\
      2. Define SKIP_FOR_DATAFRAME list for operations that have no DataFrame equivalent:\n\
      \   - SQL-level savepoints (SAVEPOINT/ROLLBACK TO) - no Delta Lake/Iceberg equivalent\n\
      \   - Explicit isolation level setting (SET TRANSACTION ISOLATION LEVEL)\n   -\
      \ Operations requiring explicit BEGIN/COMMIT blocks\n3. Define SKIP_FOR_POLARS\
      \ and SKIP_FOR_PANDAS as complete skip lists (all operations)\n   since transaction\
      \ primitives only work on PySpark+Delta/Iceberg\n4. Ensure error handling for\
      \ unsupported platforms returns clear skip messages\n\nThe operations manager\
      \ pattern (not QueryRegistry pattern) is correct for this\nbenchmark - transaction\
      \ operations are stateful and sequential, not independent\nqueries.\n"
  - id: w3
    summary: Wire up TransactionPrimitivesBenchmark class and registry for DataFrame
      dispatch
    needs:
      - w2
    status: done
    notes: "Integration steps:\n1. Add get_dataframe_operations() method to TransactionPrimitivesBenchmark\
      \ in\n   benchmark.py - similar to write_primitives pattern:\n   ```python\n \
      \  def get_dataframe_operations(self, platform_name):\n       from .dataframe_operations\
      \ import get_transaction_manager\n       return get_transaction_manager(platform_name)\n\
      \   ```\n2. Set supports_dataframe: True in benchmark_registry.py for transaction_primitives\n\
      3. Verify the dataframe_runner.py handles operations-based benchmarks correctly\n\
      \   (it should fall through to get_dataframe_operations if no get_dataframe_queries)\n\
      4. Add platform capability checks - only PySpark with Delta Lake or Iceberg\n\
      \   should attempt this benchmark in DataFrame mode\n"
  - id: w4
    summary: Add unit tests for Transaction Primitives DataFrame operations
    needs:
      - w3
    status: done
    notes: "Create tests/unit/core/transaction_primitives/test_dataframe_operations.py:

      - Test TransactionOperationType enum values match expected operations

      - Test DataFrameTransactionCapabilities for PySpark reports correct support

      - Test Polars/Pandas capabilities report all operations as unsupported

      - Test skip list generation for non-PySpark platforms

      - Test operation manager instantiation with mock platform

      - Mock-based tests (real PySpark+Delta tests belong in integration suite)

      - Mark all tests @pytest.mark.fast

      "
deferred:
  - summary: Integration tests with real PySpark + Delta Lake
    reason: Requires PySpark + Delta Lake runtime. Add to live_integration test suite
      with @pytest.mark.live_integration.
  - summary: Iceberg table format support testing
    reason: Iceberg support depends on PySpark + Iceberg catalog setup. Defer until
      Delta Lake path is validated.
  - summary: Map all 23 SQL operations to DataFrame equivalents with full parity
    reason: Some SQL operations (savepoints, explicit isolation levels) have no DataFrame
      equivalent. Document the parity gap rather than attempting impossible translations.
metadata:
  tags:
    - dataframe
    - transaction-primitives
    - pyspark
    - delta-lake
    - iceberg
    - acid
  estimated_effort: 2-3 days
  created_date: "2026-04-10"
impact:
  business_value: "Enables transaction semantics benchmarking on lakehouse platforms
    (Delta Lake,

    Iceberg) via PySpark DataFrames. Critical for organizations evaluating lakehouse

    ACID guarantees vs traditional databases.

    "
  user_impact: "Users can run `benchbox run --platform pyspark-df --benchmark transaction_primitives`

    to measure Delta Lake/Iceberg transaction overhead and compare with SQL databases.

    "
files_affected:
  modified:
    - benchbox/core/transaction_primitives/dataframe_operations.py
    - benchbox/core/transaction_primitives/benchmark.py
    - benchbox/core/benchmark_registry.py
  added:
    - tests/unit/core/transaction_primitives/test_dataframe_operations.py
must_preserve:
  - TransactionPrimitivesBenchmark SQL execution path unchanged - all 23 SQL operations
    still work via OperationExecutor interface
  - TPC-H staging table schema (txn_orders, txn_lineitem, txn_customer) unchanged
  - Platform overrides for SQL mode (e.g., DuckDB savepoint skips) still work
approach: "This benchmark already has substantial DataFrame operations code (1290
  lines).

  The work is primarily audit + integration, not greenfield implementation.


  Follow the write_primitives pattern: the benchmark class exposes

  get_dataframe_operations() returning an operations manager, not

  get_dataframe_queries() returning a QueryRegistry. The dataframe_runner

  already handles this via the operations manager path.


  Start with the audit (w1) to understand what's implemented vs stub. The

  existing code uses DataFrameMaintenanceCapabilities and TransactionIsolation

  from benchbox/core/dataframe/maintenance_interface.py - verify these are

  correctly integrated.


  Only PySpark+Delta/Iceberg supports DataFrame transactions. Polars, Pandas,

  and other platforms should be explicitly skipped with clear messaging.

  "
implementation_order: "Implement THIRD or FOURTH (interchangeable with metadata-primitives).
  Both use

  the operations manager pattern (not QueryRegistry), so order between them doesn't

  matter. Implement after df-support-flightdata establishes the QueryRegistry reference

  pattern. All 5 DataFrame support TODOs modify benchmark_registry.py - sequential

  implementation avoids merge conflicts.

  "
anti_patterns:
  - DO NOT attempt to implement transactions on Polars/Pandas - because they have no
    ACID semantics - skip cleanly with informative messages
  - DO NOT map SQL BEGIN/COMMIT/ROLLBACK directly - because Delta Lake uses atomic writes,
    not explicit transaction blocks - use the Delta Lake/Iceberg native patterns documented
    in dataframe_operations.py
  - DO NOT rewrite the existing 1290-line module from scratch - because significant
    work is already done - audit and complete what exists
verification:
  - description: Transaction Primitives reports supports_dataframe=True
    command: uv run -- python -c "from benchbox.core.benchmark_registry import BENCHMARK_REGISTRY;
      print(BENCHMARK_REGISTRY['transaction_primitives']['supports_dataframe'])"
    expected_output: "True"
  - description: Operations manager loads without error
    command: uv run -- python -c "from benchbox.core.transaction_primitives.dataframe_operations
      import TransactionOperationType; print(f'{len(TransactionOperationType)} operation
      types')"
    expected_output: 10 operation types
  - description: Unit tests pass
    command: uv run -- python -m pytest tests/unit/core/transaction_primitives/ -v
    expected_output: all tests pass, 0 failures
scope_limit:
  only_modify:
    - benchbox/core/transaction_primitives/
    - benchbox/core/benchmark_registry.py
    - tests/unit/core/transaction_primitives/
  do_not_modify:
    - benchbox/core/runner/dataframe_runner.py
    - benchbox/core/dataframe/
    - benchbox/platforms/
completed_date: "2026-04-10"
