id: explorer-add-comparison-charts
title: "Add normalized speedup and diverging bar charts to explorer compare view"
worktree: main
priority: Medium
status: Completed
completed_date: "2026-04-14"
category: Core Functionality

description: |
  Post-launch audit (2026-04-14) found that the explorer compare view
  ships only 2 inline SVG components (grouped bar chart + simple ratio
  table) while the CLI offers 15 chart types. The most strategically
  important gap for the "dynamic comparison tool" claim is the absence
  of charts that make per-query performance deltas legible at a glance:

    1. Normalized speedup chart (log scale, baseline-relative) - answers
       "how much faster/slower is platform B vs platform A per query?"
       The current grouped bar chart doesn't normalize, so a 1ms vs 2ms
       delta looks the same as a 100ms vs 200ms delta.

    2. Diverging bar chart (per-query improvement/regression) - answers
       "which queries got faster and which got slower?" A positive/negative
       bar per query makes regressions immediately obvious. The CLI's
       `diverging_bar` chart type is the primary tool for this.

  These two charts close the most visible CLI parity gap and directly
  support the compare view's core UX claim.

  A phase breakdown (stacked load vs query time) and percentile ladder
  are valuable but deferred - they require phase timing fields that are
  not yet in the manifest.

deps:
  needs:
    - explorer-extend-manifest-and-pipeline
    - explorer-align-duration-metric

work:
  - id: w1
    summary: "Implement NormalizedSpeedupChart: speedup = baseline_ms / this_ms per query, log-scale horizontal bars, green/red for faster/slower. Baseline = first selected result."
    status: done
    notes: |
      Log scale is important because OLAP query deltas span orders of
      magnitude. A linear scale makes small queries illegible when one
      large query dominates.

      Bar color: green (speedup > 1), red (speedup < 1), neutral (= 1).
      Log scale axis labels: 0.1x, 0.25x, 0.5x, 1x, 2x, 4x, 10x.

  - id: w2
    summary: "Implement DivergingBarChart: delta_ms = this_ms - baseline_ms per query, horizontal diverging bars centered at 0, % change labels, sorted by abs(delta)."
    status: done
    notes: |
      Convention: red bars = regression (slower than baseline), green bars =
      improvement (faster). Magnitude-sorted by abs(delta) so the biggest
      changes are at the top. Match CLI diverging_bar semantics.

  - id: w3
    summary: "Add chart selector to Compare.tsx: toggle between Grouped Bar, Normalized Speedup, Diverging Bar. Default Normalized Speedup for 2-result; Grouped Bar for 3+."
    needs: [w1, w2]
    status: done

  - id: w4
    summary: "Add baseline selector for normalized speedup chart: when comparing 3+ results, a dropdown lets the user pick which result is the baseline. Default to the fastest (lowest geomean_ms) result."
    needs: [w3]
    status: done

files_affected:
  added:
    - "results-explorer/src/components/NormalizedSpeedupChart.tsx"
    - "results-explorer/src/components/DivergingBarChart.tsx"
  modified:
    - "results-explorer/src/pages/Compare.tsx"

must_preserve:
  - "Existing grouped bar chart - it is the default for 3+ result comparisons and remains accessible via the chart selector"
  - "Compare view URL format - chart selection is UI state, not URL state (no new query params needed)"
  - "Null-safety: if geomean_ms is missing, disable normalized speedup with a clear message"

approach: |
  Both charts are inline SVG components (consistent with existing
  QueryTimingChart pattern). No external charting library needed for
  these two chart types - the math is simple and SVG gives full control
  over log scale rendering.

  Log scale: manually compute SVG x-positions from log2(speedup).
  Render grid lines at 0.25x, 0.5x, 1x, 2x, 4x. Label them.

  Diverging bar: sort queries by abs(delta_pct) descending so the most
  impactful queries appear at top. Include a summary line: "N queries
  faster, M queries slower, median delta: ±X%".

anti_patterns:
  - "DO NOT pull in a charting library (D3, Chart.js, Recharts) - because bundle size and dependency overhead aren't justified for 2 chart types - inline SVG is sufficient"
  - "DO NOT use linear scale for the speedup chart - because OLAP deltas span orders of magnitude - log scale is required for legibility"
  - "DO NOT default to the slowest result as baseline - because speedup is conventionally measured relative to the alternative, not the worst option - default to fastest"

scope_limit:
  only_modify:
    - "results-explorer/src/components/NormalizedSpeedupChart.tsx (new)"
    - "results-explorer/src/components/DivergingBarChart.tsx (new)"
    - "results-explorer/src/pages/Compare.tsx"
  do_not_modify:
    - "benchbox/core/explorer_pipeline/ (no pipeline changes needed)"
    - "results-explorer/src/pages/ResultDetail.tsx"

verification:
  - description: "Both new chart components exist"
    command: "ls results-explorer/src/components/NormalizedSpeedupChart.tsx results-explorer/src/components/DivergingBarChart.tsx"
    expected_output: "both files present"
  - description: "Chart selector renders in Compare"
    command: "grep -n 'NormalizedSpeedupChart\\|DivergingBarChart\\|chart.*selector\\|chartType' results-explorer/src/pages/Compare.tsx"
    expected_output: "both chart components referenced"
  - description: "TypeScript compiles cleanly"
    command: "cd results-explorer && npm run typecheck"
    expected_output: "(no errors)"

metadata:
  tags: ["results", "explorer", "charts", "compare", "visualization", "fidelity"]
  estimated_effort: "Medium (2-3 days)"
  created_date: "2026-04-14"
