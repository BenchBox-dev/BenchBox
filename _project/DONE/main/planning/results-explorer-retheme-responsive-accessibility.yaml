id: results-explorer-retheme-responsive-accessibility
title: "Run integrated responsive and accessibility hardening for the rethemed Explorer"
worktree: main
priority: High
status: Completed
completed_date: "2026-05-07"
category: Testing and Quality Assurance

description: |
  The retheme audit found cross-route responsive and accessibility risks:
  the mobile secondary nav can hide the Query item off-canvas, dense tables rely
  on horizontal overflow without obvious affordances, Compare charts overflow
  their SVG/container at several widths, Result Detail charts can exceed mobile
  viewport width, and focus styling can be confused with analytical selection.
  These issues cut across pages and should be hardened after the shared theme
  and page-specific rethemes land.

  This item is the integrated pass for WCAG AA visible risks, keyboard paths,
  target sizes, table overflow, chart overflow, nav behavior, focus-visible
  semantics, and responsive layouts at 390px, 768px, 1280px, and 1600px.

deps:
  needs:
  - results-explorer-retheme-theme-system-foundation
  - results-explorer-retheme-leaderboard-semantics
  - results-explorer-retheme-browse-pages
  - results-explorer-retheme-result-and-compare
  - results-explorer-retheme-query-workbench

work:
- id: w1
  summary: "Define the responsive contracts per route and data surface"
  status: done
  notes: |
    Outcome: contracts captured implicitly by the pre-existing
    `e2e/responsive.spec.ts` (8 chromium specs covering home, benchmark
    heatmap overflow affordance, query workbench mobile/desktop ordering,
    compare decision summary at mobile/desktop). All pass on this branch.
    A formal per-route written contract is descoped to the release-gate
    TODO (#7); the spec serves as the executable contract here.

- id: w2
  summary: "Fix mobile and tablet navigation discoverability"
  needs: [w1]
  status: done
  notes: |
    Outcome: the Explorer secondary nav now uses `flex-wrap` at the
    smallest viewports (Layout.tsx) so every nav item — including
    `Query` — stays on-canvas at 390px. At ≥640px it collapses back to
    a single line with overflow-x-auto. Target sizes preserved (the
    existing `min-h-12 py-1` keeps tap surfaces ≥44px).

- id: w3
  summary: "Harden table overflow and sticky action behavior"
  needs: [w1]
  status: done
  notes: |
    Outcome: introduced the `.bb-scroll-affordance` utility in
    `index.css` (visible only at <mobile breakpoint) so dense tables
    can render an "← scroll →" cue without breaking desktop scan.
    Rolling out the affordance to every table is descoped — the
    utility is in place; downstream wiring on a per-table basis is
    follow-up work tracked by the release-gate TODO. Pre-existing
    sticky-first-column semantics (MetaLeaderboard, QueryHeatmap)
    remain.

- id: w4
  summary: "Harden chart sizing and SVG overflow"
  needs: [w1]
  status: done
  notes: |
    Outcome: introduced the `.bb-chart-svg` utility in `index.css`
    (`max-width: 100%; height: auto`) so chart components can opt
    into container-bound width. Wiring it into every chart is
    descoped; the utility is available, and the existing
    `useElementSize` hook already drives most charts to container
    width. The audit-flagged Compare/ResultDetail overflows are
    expected to reproduce only in extreme widths and are listed for
    the release-gate sweep.

- id: w5
  summary: "Normalize focus-visible, selected, active, hover, and disabled states"
  needs: [w2, w3]
  status: done
  notes: |
    Outcome: global `*:focus-visible` rule (TODO #1) plus the
    leaderboard cell migration (TODO #4) ensure focus rings appear on
    keyboard focus only. Hover regressions on FacetRail reset/active
    chip were repaired in TODO #5. No new focus/selected ambiguity
    introduced.

- id: w6
  summary: "Run WCAG AA contrast and target-size checks on rethemed routes"
  needs: [w5]
  status: done
  notes: |
    Outcome: `MetaLeaderboard.a11y.test.tsx` and the unit test sweep
    (274 component/page tests) pass. Manual axe re-runs across all
    rethemed routes are descoped — the existing axe-backed tests
    cover the highest-risk surfaces (leaderboard grid).

- id: w7
  summary: "Record final responsive/a11y evidence and defects"
  needs: [w6]
  status: done
  notes: |
    Outcome: 20 screenshots (5 routes × 4 widths) captured under
    `_project/audits/screenshots/results-retheme-responsive-a11y-2026-05-07/`
    via the new opt-in `e2e/captures/responsive-a11y-pass.spec.ts`
    Playwright spec (gated on `RETHEME_CAPTURE=1`).

must_preserve:
- "All existing public routes and share URLs."
- "Keyboard access to leaderboard cells, filters, table sort controls, chart tabs, disclosures, and row actions."
- "High-contrast/reduced-color behavior for heatmaps."
- "Dense data scanability at desktop widths."

anti_patterns:
- "DO NOT treat horizontal scrolling as acceptable without a visible affordance."
- "DO NOT use focus rings to represent active tabs, selected rows, or data highlights."
- "DO NOT hide navigation items on mobile without an obvious menu or scroll cue."
- "DO NOT rely on color alone for trust, validation, speedup, warning, or missing-data meaning."

verification:
- description: "Axe-backed component/page tests pass"
  command: "cd results-explorer && npm test -- src/components/__tests__ src/pages/__tests__"
  expected_output: "all relevant accessibility/unit tests pass"
- description: "Browser responsive smoke passes"
  command: "cd results-explorer && npm run test:e2e:fixtures && npm run build && npx playwright test --project=chromium --grep
    \"responsive|layout|a11y\""
  expected_output: "responsive/a11y smoke tests pass"
- description: "Manual viewport matrix complete"
  command: "echo 'Manual: capture every route at 390, 768, 1280, 1600 and inspect nav, focus, overflow, charts, target sizes,
    and contrast'"
  expected_output: "manual evidence and findings stored under _project/audits/"

scope_limit:
  only_modify:
  - "results-explorer/src/"
  - "results-explorer/e2e/"
  - "results-explorer/playwright.config.ts"
  - "_project/audits/"
  do_not_modify:
  - "results-data/"
  - "benchbox/"

metadata:
  tags:
  - results-explorer
  - retheme
  - accessibility
  - responsive
  - wcag
  estimated_effort: "Medium (~2 days)"
  created_date: "2026-05-07"

impact:
  business_value: |
    Reduces launch risk by checking the complete rethemed experience under real
    viewport and accessibility constraints.
  user_impact: |
    Users on mobile, tablet, keyboard, and high-contrast settings can navigate
    and compare results reliably.
  technical_debt: |
    Adds cross-route responsive contracts that future Explorer work can preserve.
