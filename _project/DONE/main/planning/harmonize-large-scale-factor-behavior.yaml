must_preserve:
  - "SF=1 baselines unchanged - the original harmonization is correct at SF=1"
  - "All existing query sets, schemas, SQL files unchanged"
  - "Benchmarks must still produce valid data at SF=0.01 (CI/testing scale)"
  - "CompressionMixin behavior unchanged"
  - "Linear benchmarks (CoffeeShop, H2O.db, JOB, AMPLab) need no code changes"

anti_patterns:
  - "DO NOT introduce a global calibration multiplier layer - because it adds indirection that makes per-benchmark tuning harder - scale each benchmark's own parameters directly"
  - "DO NOT change row counts for spec-locked benchmarks (TPC-H, TPC-DS, SSB) - because their row counts are defined by the TPC/SSB specifications - only adjustable benchmarks are in scope"
  - "DO NOT add backwards-compatibility shims - because BenchBox is still in beta (v0.2.0) - change formulas directly"
  - "DO NOT synthesize fake data without research gate approval - because the value of real-data benchmarks is historical authenticity - w3 (FlightData) and w5 (NYC Taxi) research gates must evaluate replication strategies before any synthetic data is added"

verification:
  - description: "TSBS scaling is linear after fix"
    command: 'uv run -- python -c "from benchbox.core.tsbs_devops.generator import TsbsDevopsGenerator; g1=TsbsDevopsGenerator(scale_factor=1); g10=TsbsDevopsGenerator(scale_factor=10); print(f''SF=1: {g1.num_hosts} hosts, {g1.duration_days} days''); print(f''SF=10: {g10.num_hosts} hosts, {g10.duration_days} days'')"'
    expected_output: "SF=10 should show ~1000 hosts with same duration as SF=1 (2 days)"
  - description: "FlightData warns at ceiling"
    command: 'uv run -- python -c "import logging; logging.basicConfig(level=logging.WARNING); from benchbox.core.flightdata.downloader import FlightDataDownloader; d=FlightDataDownloader(scale_factor=100)" 2>&1 | grep -i warn'
    expected_output: "Warning message about month ceiling being reached"
  - description: "NYC Taxi warns at saturation"
    command: 'uv run -- python -c "import logging; logging.basicConfig(level=logging.WARNING); from benchbox.core.nyctaxi.downloader import NycTaxiYellowDownloader; d=NycTaxiYellowDownloader(scale_factor=100)" 2>&1 | grep -i warn'
    expected_output: "Warning message about sample_rate saturation at 1.0"
  - description: "Existing tests pass"
    command: "uv run -- python -m pytest tests/unit/generators/test_scale_factor_harmonization.py -v"
    expected_output: "All tests pass including new linearity tests"
  - description: "Full test suite passes"
    command: "uv run -- python -m pytest -m fast -q"
    expected_output: "All fast tests pass with no regressions"

