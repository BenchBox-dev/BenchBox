id: quality-cross-platform-validation-integration-matrix
title: "Wire cross-platform validation comparator into a nightly integration matrix"
worktree: main
priority: Medium
status: Completed
completed_date: "2026-04-14"
category: Testing and Quality Assurance
description: |
  Follow-up slice of quality-add-cross-platform-result-validation.

  That TODO delivered the comparator (benchbox/core/validation/cross_platform.py),
  its unit tests (tests/unit/core/test_cross_platform_validation.py), and
  the developer doc (docs/development/result-validation.md). What remains is
  the live integration matrix and the nightly workflow - both require
  platform credentials or heavier local infrastructure, so they were split
  off to preserve bounded review surface.

  Scope:
    - Integration pytest suite at tests/integration/validation/test_cross_platform.py
      that executes the standard query sets on DuckDB (reference) vs each
      comparison platform at SF=0.01.
    - First matrix stays credential-free: DuckDB × {DataFusion, Polars-DF,
      ClickHouse-local container}. Cloud platforms (Snowflake, Databricks)
      are a separate follow-up if/when the nightly lane gains secrets.
    - Nightly workflow at .github/workflows/cross-platform-validation.yml
      running the suite and publishing structured diff artifacts on failure.

deps:
  needs:
    - quality-add-cross-platform-result-validation

work:
  - id: w1
    summary: "Write tests/integration/validation/test_cross_platform.py: DuckDB × DataFusion, TPC-H SF=0.01; comparator STRICT by default; Tolerance overrides must cite spec rules"
    status: done

  - id: w2
    summary: "Extend the suite to DuckDB × Polars-DF and DuckDB × ClickHouse-local (docker). Keep test markers = live_integration so the fast lane is unaffected."
    needs: [w1]
    status: done

  - id: w3
    summary: "Add .github/workflows/cross-platform-validation.yml running on cron (nightly) plus workflow_dispatch. On failure, upload a structured JSON diff artifact per failed (benchmark, platform-pair) cell."
    needs: [w2]
    status: done

  - id: w4
    summary: "Document a triage runbook: how to read the diff artifact, how to file a TODO with spec-anchored rationale if the divergence is legitimate, and how to roll back an adapter change that broke a column."
    needs: [w3]
    status: done

files_affected:
  added:
    - "tests/integration/validation/test_cross_platform.py"
    - ".github/workflows/cross-platform-validation.yml"
    - "docs/development/result-validation-triage.md"

must_preserve:
  - "Fast test lane duration unchanged - new tests are live_integration only"
  - "No new required PR check - nightly-only signal; CI on PR stays as-is"
  - "Comparator module (benchbox/core/validation/cross_platform.py) untouched by this TODO - it is already shipped"

approach: |
  Use the existing Python comparator unchanged. Each integration test
  builds (reference_rows, comparison_rows) via each platform's existing
  adapter, then calls compare_query_results() and asserts report.matched.

  For ClickHouse-local, lean on the existing docker harness in
  docker/clickhouse/. For Polars-DF and DataFusion, reuse the dataframe
  platform runners directly.

  Start with TPC-H SF=0.01 only. Expand to TPC-DS as a separate follow-up
  once TPC-H is stable in nightly for at least one week.

anti_patterns:
  - "DO NOT run the suite on every PR - because cross-platform suites are expensive and flaky under cloud noise - nightly only"
  - "DO NOT paper over a divergence with loose tolerance - because that defeats the purpose - every loosened Tolerance must cite a spec rule in the rationale field"
  - "DO NOT hard-code credentials - because the first matrix is credential-free by design - snowflake/databricks join in a separate slice"
  - "DO NOT edit the comparator module - because the unit suite pins its contract - file a new comparator TODO if behavior needs to change"

verification:
  - description: "Integration suite passes locally on the no-credentials matrix"
    command: "uv run -- python -m pytest tests/integration/validation/test_cross_platform.py -v -m live_integration"
    expected_output: "all tests pass"
  - description: "Nightly workflow file is valid"
    command: "uv run --with actionlint actionlint .github/workflows/cross-platform-validation.yml"
    expected_output: "(no errors)"
  - description: "New integration test file carries no mark.fast markers - fast lane unaffected"
    command: "grep -c 'mark.fast' tests/integration/validation/test_cross_platform.py || echo 0"
    expected_output: "0"

metadata:
  tags: ["quality-plan", "phase-2", "correctness", "validation", "ci"]
  estimated_effort: "Medium (2-3 days)"
  created_date: "2026-04-12"

success_metrics:
  - "Nightly workflow green for 7 consecutive nights on DuckDB × {DataFusion, Polars-DF, ClickHouse-local} at TPC-H SF=0.01"
  - "Any legitimate divergence surfaced by the matrix has a merged Tolerance override citing a TPC spec rule"
  - "Zero silent cross-platform divergences land on main"
