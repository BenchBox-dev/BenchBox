id: execution-results-tpc-metrics-and-power-result-normalization
title: "Execution/results hardening: retire legacy TPC metrics and normalize power-result conversion"
worktree: main
priority: Medium-High
status: "Completed"
category: Results

deps:
  needs:
    - architecture-contract-map-and-support-taxonomy

description: |
  Independent verification of the execution/results architecture review found
  two adjacent duplication risks in the TPC metrics and power-test result path.

  First, `benchbox/core/tpc_metrics.py` is an 877-line legacy module with no
  production importers in the current tree. Production code imports
  `benchbox.core.results.metrics.TPCMetricsCalculator`, which is re-exported
  from `benchbox.core.results`. Only `tests/unit/core/test_tpc_metrics.py`
  imports the legacy module. The module is therefore a deletion candidate, but
  it contains richer validation/reporting classes that should be audited before
  removal so useful behavior is not silently lost.

  Second, `benchbox/platforms/base/execution.py` repeats TPC-H and TPC-DS
  power-test result-dict conversion in four blocks, plus four
  `power_test_error` sentinels. The duplication is smaller than the original
  critic claimed, but it is still enough to make failure/result schema drift
  likely when one TPC driver changes.

work:
  - id: w0
    summary: "Revalidate TPC metrics import graph, unique legacy surface, and power-result conversion count"
    status: done
    notes: |
      Revalidated against checked SHA
      `7a4262f8f6457e97b334e6132c9e58b2640c785f`. `wc -l` reported
      `benchbox/core/tpc_metrics.py` at 877 lines and
      `benchbox/core/results/metrics.py` at 211 lines. The legacy import grep
      found only `tests/unit/core/test_tpc_metrics.py`; no production importer
      exists in the current tree. The canonical results metrics grep found
      production and test use of `benchbox.core.results.metrics` /
      `TPCMetricsCalculator`. The power conversion grep found the duplicated
      TPC-H/TPC-DS normal result blocks and `power_test_error` sentinels in
      `benchbox/platforms/base/execution.py`.

  - id: w1
    summary: "Audit legacy tpc_metrics.py for behavior not present in results.metrics"
    needs: [w0]
    status: done
    notes: |
      Audit decision table:
        - Power@Size, Throughput@Size, and composite Qph formulas are covered
          by `benchbox/core/results/metrics.py`; focused tests now pin the
          legacy formula expectations on the canonical calculator.
        - `PowerMetrics`, `ThroughputMetrics`, `CompositeMetrics`,
          `MetricsValidator`, and `calculate_full_metrics()` are unimported
          legacy object/reporting surfaces, not part of current schema-v2
          result construction.
        - `StatisticalAnalyzer` and `MetricsReporter` may be useful product
          ideas, but they are uncalled internal reporting helpers and should be
          promoted only through a separate CLI/reporting TODO.
      No unique production-useful behavior required migration before deleting
      the legacy module.

  - id: w2
    summary: "Retire or fold the legacy TPC metrics module through an explicit compatibility decision"
    needs: [w1]
    status: done
    notes: |
      Deleted `benchbox/core/tpc_metrics.py` and
      `tests/unit/core/test_tpc_metrics.py`. No public/backward-compat docs
      were changed because the revalidated import graph did not show an
      intentionally supported import path. Removed the stale mutation-tool
      exclusion for the deleted module from `pyproject.toml` as a narrow scope
      exception found during self-review.

  - id: w3
    summary: "Extract power-test result conversion and sentinel construction helpers"
    needs: [w0]
    status: done
    notes: |
      Added `_power_query_result()` and `_power_test_error_result()` in
      `benchbox/platforms/base/execution.py` and replaced the duplicated
      TPC-H/TPC-DS power conversion blocks and sentinels. Throughput,
      maintenance, and generic power conversion paths were left unchanged.

  - id: w4
    summary: "Add focused regression tests for canonical TPC metrics and power-result conversion"
    needs: [w2, w3]
    status: done
    notes: |
      Added canonical formula coverage in
      `tests/unit/core/results/test_metrics.py` and conversion-helper coverage
      in `tests/unit/platforms/test_base_adapter.py`. The final import grep is
      expected to terminate with no matches for `benchbox.core.tpc_metrics`.

deferred:
  - summary: "Rewrite all TPC-H/TPC-DS power and throughput execution drivers around one shared result adapter"
    reason: "This TODO removes confirmed duplication in the power conversion path only; a broader driver rewrite needs separate perf and compliance risk review."
  - summary: "Promote rich metrics reporting to a user-facing CLI command"
    reason: "Only do this if w1 proves the legacy reporter has product value; otherwise it is dead internal surface."

metadata:
  tags:
    - architecture-review-followup
    - results
    - tpc
    - duplication
  estimated_effort: "1-2 days"
  created_date: "2026-05-21"
  last_updated: "2026-05-21T00:00:00Z"
