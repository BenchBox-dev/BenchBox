    expected_output: "All focused metrics and base-adapter tests pass."
  - description: "Legacy TPC metrics import graph has an explicit terminal state."
    command: "rg -n \"^from benchbox\\.core\\.tpc_metrics import|^import benchbox\\.core\\.tpc_metrics|from benchbox\\.core import tpc_metrics|benchbox\\.core\\.tpc_metrics\" benchbox tests pyproject.toml --glob '!build/**' --glob '!docs/_build/**' --glob '!.venv/**'"
    expected_output: "No matches if deletion path is chosen; otherwise only documented compatibility imports remain and the PR explains why deletion was rejected."
  - description: "Fast suite catches result-shape regressions."
    command: "uv run -- python -m pytest -m fast -q"
    expected_output: "Fast tests pass."
  - description: "TODO graph remains valid after implementation."
    command: "uv run --project _project/scripts -- python _project/scripts/todo_cli.py validate && uv run --project _project/scripts -- python _project/scripts/todo_cli.py check-graph"
    expected_output: "TODO validation and graph checks pass."

