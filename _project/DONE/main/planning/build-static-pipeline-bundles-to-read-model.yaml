  estimated_effort: "Medium"
  created_date: "2026-03-29"
  completed_date: "2026-04-03"

impact:
  business_value: |
    The build pipeline is the bridge between BenchBox's canonical result format
    and the explorer's data needs. Without it, the explorer has no data to render.
  user_impact: |
    Users get fast, pre-processed data for browsing and rich DuckDB-WASM powered
    filtering — not raw JSON parsing in the browser.
  technical_debt: |
    Establishes a clean boundary: canonical bundles are the source of truth,
    derived read models are rebuildable projections. No mutable state.

must_preserve:
- "Schema-v2 bundle files are read-only inputs — the pipeline must not modify them"
- "The derived read model is fully rebuildable from bundles — no state accumulation"

approach: |
  Pure Python script using only stdlib + duckdb for the snapshot. No web frameworks,
  no databases, no network calls. The script is a build tool, not a service.
  Use `benchbox.core.results.schema` for validation if convenient, but the pipeline
  should work standalone.

anti_patterns:
- "DO NOT query raw bundles from the browser at runtime — because bundle files are verbose and unindexed — serve pre-built read models instead"
- "DO NOT generate result IDs that depend on file paths or insertion order — because IDs must be stable across rebuilds — derive them from bundle metadata deterministically"

verification:
- description: "Pipeline produces valid read models from seed corpus"
  command: "uv run -- python scripts/build_read_model.py --input results-data/bundles/ --output /tmp/test-read-model/ && ls /tmp/test-read-model/"
  expected_output: "manifest.json, details/, bundles/, results.duckdb"
- description: "Pipeline unit tests pass"
  command: "uv run -- python -m pytest tests/unit/scripts/test_build_read_model.py -q"
  expected_output: "All tests pass"

scope_limit:
  only_modify:
  - "scripts/build_read_model.py"
  - "tests/unit/scripts/"
  do_not_modify:
  - "benchbox/"
  - "results-data/"
