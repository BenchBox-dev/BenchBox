id: quality-extract-throughput-runner
title: "Extract shared core.throughput.runner with aligned ThroughputResult model"
worktree: main
priority: Medium
status: Completed
completed_date: "2026-04-14"
category: Code Quality and Technical Debt
description: |
  Quality plan supplement - duplication workstream follow-up. Tracks
  residual R-06 from
  `quality-consolidate-duplicate-code-clusters` (see
  docs/development/duplication-residuals.md).

  TPC-DS and TPC-H ship near-identical throughput-test harnesses: shared
  concurrent-stream executor + metrics calculation + smaller exception +
  connection-close blocks (~77 lines of duplication). The dedup TODO
  deliberately deferred this because clean extraction needs:
    - Aligning `TPCHThroughputTestResult` and `TPCDSThroughputTestResult`
      shapes (near-identical fields with different spec-naming comments)
    - Unifying success-rate gates (TPC-H uses configurable
      `config.min_success_rate`; TPC-DS hard-codes 70%)
    - Introducing a shared `StreamRunner` protocol

  This TODO does the alignment and extraction. Result is a
  `core.throughput.runner` module that both benchmarks consume; spec-
  specific success criteria stay surfaced via config, not buried in
  per-benchmark forks.

deps:
  needs:
    - quality-consolidate-duplicate-code-clusters

work:
  - id: w1
    summary:
      "Diff TPCHThroughputTestResult ↔ TPCDSThroughputTestResult; map each field to unified ThroughputResult or per-spec
      subclass. Output: docs/development/throughput-result-alignment.md."
    status: done

  - id: w2
    summary:
      "Introduce benchbox/core/throughput/result.py with the unified ThroughputResult dataclass. TPC-H and TPC-DS specific
      fields land on a thin per-spec subclass. No callers migrated yet."
    needs: [w1]
    status: done

  - id: w3
    summary:
      "Introduce benchbox/core/throughput/runner.py with StreamRunner protocol, concurrent-stream executor, metrics calc.
      Success-rate via config (TPC-DS default 70%, overridable). One commit."
    needs: [w2]
    status: done

  - id: w4
    summary:
      "Migrate TPC-H throughput_test.py to use core.throughput.runner.StreamRunner; preserve config.min_success_rate
      behavior. One commit."
    needs: [w3]
    status: done

  - id: w5
    summary:
      "Migrate TPC-DS throughput_test.py to use core.throughput.runner.StreamRunner; preserve hard-coded 70% gate as
      the config default. One commit."
    needs: [w3]
    status: done

  - id: w6
    summary:
      "Re-run pylint duplicate-code at 15-line threshold over both throughput modules; confirm R-06 cluster drops out.
      Update docs/development/duplication-residuals.md."
    needs: [w4, w5]
    status: done

files_affected:
  modified:
    - "benchbox/core/tpch/throughput_test.py"
    - "benchbox/core/tpcds/throughput_test.py"
    - "docs/development/duplication-residuals.md"
  added:
    - "benchbox/core/throughput/__init__.py"
    - "benchbox/core/throughput/result.py"
    - "benchbox/core/throughput/runner.py"
    - "docs/development/throughput-result-alignment.md"

must_preserve:
  - "TPC-H throughput test result shapes - public field names unchanged on the result surface that report templates and visualizations
    consume"
  - "TPC-DS throughput test 70% success-rate gate - must remain the default; only become overridable, not weaker"
  - "TPC-H configurable min_success_rate behavior - same config knob, same default"
  - "Concurrent-stream count semantics unchanged for both specs"
  - "All TPC-H + TPC-DS throughput tests pass at scale 0.01 on DuckDB"

approach: |
  Result-model alignment first, then runner extraction. Reverse order
  fails because the runner can't be shared until the result type is
  unified.

  For w1, walk both result dataclasses field-by-field; for each field,
  classify as (shared / TPC-H-only / TPC-DS-only). Shared fields land on
  the base ThroughputResult; spec-specific fields stay on subclasses.
  This is the documented approach in R-06.

  Extract runner only after w2 lands and is verified - the runner
  signature is `StreamRunner.run(...) -> ThroughputResult`, which
  presumes the unified type exists.

  Sequence migrations one spec at a time. Don't bundle.

anti_patterns:
  - "DO NOT silently weaken the TPC-DS 70% success-rate gate - because that hides regressions - keep 70% as the default, only
    make it config-overridable"
  - "DO NOT collapse spec-specific result fields into the base type - because that loses spec naming the reports rely on - base
    for shared, subclass for spec-specific"
  - "DO NOT migrate both specs in one commit - because the bundle risk is exactly why R-06 was deferred from the parent TODO
    - one commit per spec"
  - "DO NOT introduce abstraction beyond what the two specs share - because YAGNI - the StreamRunner protocol covers two callers,
    not N"

verification:
  - description: "Pylint R-06 cluster (~77 lines) drops out"
    command:
      "uv run --with pylint --with pandas --with polars pylint --disable=all --enable=duplicate-code --min-similarity-lines=15
      benchbox/core/tpch/throughput_test.py benchbox/core/tpcds/throughput_test.py 2>&1 | grep -c 'R0801'"
    expected_output: "0"
  - description: "TPC-H throughput tests pass"
    command: "uv run -- python -m pytest tests/unit/core/tpch/ -q -k throughput"
    expected_output: "all tests pass"
  - description: "TPC-DS throughput tests pass"
    command: "uv run -- python -m pytest tests/unit/core/tpcds/ -q -k throughput"
    expected_output: "all tests pass"
  - description: "TPC-DS throughput dry run on DuckDB"
    command: "uv run benchbox run --platform duckdb --benchmark tpcds --scale 0.01 --phases throughput --dry-run /tmp/preview"
    expected_output: "preview generated, no error"

metadata:
  tags: ["quality-plan", "phase-2", "duplication", "throughput"]
  estimated_effort: "Medium (2-3 days)"
  created_date: "2026-04-13"
