context_sections:
  "Reviewed Commits": |
    - 7c61f2ac9 refactor(skip-queries): unify platform skip dispatch through get_platform_skip_queries
    - 4a2b00043 fix(skip-queries): normalize skip IDs in SQL adapter and add DataFusion dispatch tests
  "Evidence": |
    `benchbox/core/read_primitives/benchmark.py` currently routes DataFusion
    through `get_skip_for_datafusion()` in `get_platform_skip_queries()`.
    `benchbox/platforms/base/adapter.py` consumes `get_platform_skip_queries()`
    in SQL filtering. `benchbox/core/read_primitives/dataframe_queries.py`
    documents `SKIP_FOR_DATAFUSION` as DataFusion DataFrame mode. The catalog
    has DataFusion SQL variants for the four removed query IDs.
  "Test Gap": |
    The tests added in 4a2b00043 cover DataFrame mixin dispatch with synthetic
    fixtures, but there is no SQL adapter regression test proving that the same
    generic hook does not remove DataFusion SQL variants.

