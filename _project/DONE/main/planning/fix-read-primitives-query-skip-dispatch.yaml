work:
- id: w1
  summary: "Split SQL platform skips from DataFrame platform skips in the read-primitives benchmark API"
  status: done
  notes: |
    Keep `get_platform_skip_queries(platform_name)` for skips that are valid
    for SQL execution too, such as the LakeSail `empty_build_join` skip. Add a
    DataFrame-mode hook such as `get_dataframe_platform_skip_queries(platform_name)`
    for DataFrame-only platform workarounds.

- id: w2
  summary: "Move DataFusion DataFrame skips out of the generic SQL-visible platform hook"
  needs: [w1]
  status: done
  notes: |
    `get_platform_skip_queries("DataFusion")` must no longer return
    `list_filter`, `list_transform`, `list_reduce`, or `array_distinct` for
    SQL mode. DataFusion DataFrame mode should still skip those four IDs via
    the new DataFrame-specific platform hook until the underlying DataFrame
    implementations are supported.

- id: w3
  summary: "Make expression-family skips truly family-wide and move Polars map skips to a platform-specific bucket"
  needs: [w1]
  status: done
  notes: |
    `SKIP_FOR_EXPRESSION_FAMILY` should only contain queries unsupported by
    all expression-family adapters. Move `map_construction`, `map_access`, and
    `map_keys_values` to a Polars DataFrame platform skip list because the
    stated blocker is Polars' lack of native Map dtype, while PySpark and
    DataFusion have platform branches in `ExpressionFamilyContext.map_from_entries()`.

- id: w4
  summary: "Add explicit PySpark DataFrame handling for list_filter and list_transform"
  needs: [w1]
  status: done
  notes: |
    The narrow fix is to add `list_filter` and `list_transform` to a PySpark
    DataFrame platform skip list because those implementations call
    `ctx.element()` and PySpark does not override the default raising method.
    If implementing PySpark-native transform/filter instead, do it only with
    focused tests against Spark expression semantics; do not fake `element()`.

- id: w5
  summary: "Update the DataFrame benchmark mixin to consume the DataFrame-specific platform skip hook"
  needs: [w2, w3, w4]
  status: done
  notes: |
    `_collect_skip_query_ids()` should keep the existing DataFrame-wide and
    expression-family hooks, then union in platform skips from the new
    DataFrame-only hook. It should not call `get_platform_skip_queries()` for
    mode-specific DataFrame skip lists.

- id: w6
  summary: "Harden SQL adapter skip normalization without changing its SQL-only platform skip semantics"
  needs: [w1]
  status: done
  notes: |
    Preserve the case-insensitive normalization added in 4a2b00043, but make
    it defensive like the DataFrame mixin by normalizing with
    `str(value).strip().lower()`. Do not use this as a workaround for the
    DataFusion SQL regression; the mode split is still required.

- id: w7
  summary: "Add SQL adapter regression tests proving DataFusion SQL keeps the four catalog-variant queries"
  needs: [w2, w6]
  status: done
  notes: |
    Add a focused test that builds `ReadPrimitivesBenchmark().get_queries(dialect="datafusion")`
    and then passes those queries through `PlatformAdapter._filter_queries()`
    with `platform_name="DataFusion"`. Assert `list_filter`, `list_transform`,
    `list_reduce`, and `array_distinct` survive filtering. Also assert the
    LakeSail SQL skip remains effective for `empty_build_join`.

- id: w8
  summary: "Add real-benchmark DataFrame skip-dispatch tests for DataFusion, Polars, and PySpark"
  needs: [w3, w4, w5]
  status: done
  notes: |
    Extend the DataFrame mixin tests beyond synthetic fixtures by using
    `ReadPrimitivesBenchmark`. Assert DataFusion DataFrame skips the four
    DataFusion-only IDs, Polars skips the three map IDs, PySpark skips
    `list_filter`/`list_transform`, and PySpark/DataFusion do not inherit the
    Polars map skips through an expression-family bucket.

- id: w9
  summary: "Run targeted query-skip verification and document the expected pass/fail boundaries"
  needs: [w7, w8]
  status: done
  notes: |
    Rerun the existing passing tests plus the new SQL/DataFrame regression
    tests. Include the manual DataFusion SQL proof command in the implementation
    notes or PR description so reviewers can see that `count_delta` no longer
    drops from 150 to 146.

must_preserve:
- "`ReadPrimitivesBenchmark.get_platform_skip_queries('LakeSail')` continues to skip `empty_build_join` for SQL mode"
- "DataFusion SQL read-primitives keeps the catalog variants for `array_distinct`, `list_transform`, `list_filter`, and `list_reduce`"
- "DataFusion DataFrame mode still skips `list_filter`, `list_transform`, `list_reduce`, and `array_distinct` until those
  DataFrame implementations are supported"
- "Polars DataFrame mode still skips `map_construction`, `map_access`, and `map_keys_values` because Polars has no native
  Map dtype"
- "PySpark and DataFusion DataFrame modes do not inherit Polars-only map skips via `SKIP_FOR_EXPRESSION_FAMILY`"
- "Skip ID matching remains case-insensitive and whitespace-tolerant in both SQL and DataFrame adapters"

approach: |
  Treat `get_platform_skip_queries(platform_name)` as a SQL-visible hook. Only
  put entries there when the skip is valid for SQL execution as well as any
  other execution mode. Introduce a separate DataFrame-specific platform hook
  for DataFrame-only workarounds and update `BenchmarkExecutionMixin` to call
  that hook.

  In `dataframe_queries.py`, keep skip lists aligned to actual support:
  family-wide lists should only contain true all-expression-family gaps, Polars
  should own Map dtype gaps, DataFusion should own DataFusion DataFrame API gaps,
  and PySpark should own the list higher-order gaps unless PySpark-native
  implementations are added with tests.

  Prefer narrow tests that assert the dispatch contract directly. The SQL
  regression was missed because commit 4a2b00043 added DataFrame mixin tests but
  no SQL adapter test around the shared hook.

anti_patterns:
- "DO NOT fix the DataFusion SQL regression by special-casing DataFusion inside `PlatformAdapter._filter_queries()` - because
  the ambiguous hook would still leak future DataFrame-only skips into SQL - split the hook by execution mode instead"
- "DO NOT move the four DataFusion DataFrame skips into read-primitives catalog `skip_on` - because the SQL catalog has working
  DataFusion variants - keep DataFrame-only skips in DataFrame dispatch"
- "DO NOT keep Polars-only map blockers under `SKIP_FOR_EXPRESSION_FAMILY` - because that suppresses PySpark/DataFusion DataFrame
  coverage - use a Polars-specific DataFrame skip bucket"
- "DO NOT implement PySpark `element()` by returning a placeholder or Polars-like object - because Spark list transform/filter
  semantics must be real expressions - either skip those queries or implement native Spark expressions with behavioral tests"
- "DO NOT broaden skips to whole categories like `lambda` or `map` - because the benchmark needs per-query capability accounting
  - skip only the concrete unsupported query IDs"

verification:
- description: "Existing DataFrame mixin and read-primitives variant tests still pass"
  command: "uv run -- python -m pytest tests/unit/platforms/dataframe/test_benchmark_mixin.py tests/unit/core/read_primitives/test_query_manager_variants.py
    -q"
  expected_output: "all tests pass"
- description: "SQL adapter regression test proves DataFusion SQL keeps catalog variants while LakeSail SQL skip remains active"
  command: "uv run -- python -m pytest tests/unit/platforms/base/test_adapter_query_skips.py -q"
  expected_output: "all tests pass; DataFusion SQL keeps list_filter, list_transform, list_reduce, and array_distinct"
- description: "Read-primitives DataFrame skip-list tests verify Polars/DataFusion/PySpark platform-specific buckets"
  command: "uv run -- python -m pytest tests/unit/core/read_primitives/test_read_primitives_dataframe.py tests/unit/platforms/dataframe/test_benchmark_mixin.py
    -q -k 'skip or platform'"
  expected_output: "all selected tests pass"
- description: "Manual DataFusion SQL proof no longer shows the four-query drop after platform filtering"
  command: "uv run -- python -c \"from types import SimpleNamespace; from benchbox.core.read_primitives.benchmark import ReadPrimitivesBenchmark;
    from benchbox.platforms.base.adapter import PlatformAdapter; b=ReadPrimitivesBenchmark(); qs=b.get_queries(dialect='datafusion');
    ids=['list_transform','list_filter','list_reduce','array_distinct']; filtered=PlatformAdapter._filter_queries(SimpleNamespace(platform_name='DataFusion'),
    qs, b, 'read_primitives', {}); print({i: i in filtered for i in ids}); print(len(qs), len(filtered))\""
  expected_output: "all four IDs print True after filtering, and the filtered count does not drop by those four queries"
- description: "Targeted affected suite passes"
  command: "uv run -- python -m pytest tests/unit/platforms/base/test_adapter_query_skips.py tests/unit/platforms/dataframe/test_benchmark_mixin.py
    tests/unit/core/read_primitives/test_query_manager_variants.py tests/unit/core/read_primitives/test_read_primitives_dataframe.py
    -q"
  expected_output: "all tests pass"

