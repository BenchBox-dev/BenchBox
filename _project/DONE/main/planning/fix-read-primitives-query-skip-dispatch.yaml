impact:
  business_value: |
    BenchBox platform comparisons depend on query coverage being accurate by
    execution mode. Silently skipping valid DataFusion SQL queries makes SQL
    coverage look smaller than it is and weakens cross-platform benchmark
    conclusions.
  user_impact: |
    Users running `read_primitives` on DataFusion SQL currently lose four valid
    query variants without an explicit failure. Users running PySpark/DataFusion
    DataFrame mode also get capability reporting distorted by overbroad or
    incomplete skip buckets.
  technical_debt: |
    Splitting SQL skips from DataFrame platform skips makes the execution-mode
    contract explicit and prevents future mode-specific DataFrame workarounds
    from leaking into SQL adapter filtering.

