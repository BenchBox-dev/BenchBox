impact:
  business_value: |
    Prevents BenchBox from overstating canonical JoinOrder rebuild guarantees
    and gives maintainers a clear path to resolve the release-risk gap.
  user_impact: |
    Users get an honest statement of whether they can rebuild the exact archive
    bytes or only verify logically equivalent canonical tables.
  technical_debt: |
    Replaces an implicit byte-reproducibility assumption with a tested,
    documented integrity model.

success_metrics:
- "The selected rebuild guarantee is documented in the attestation and user docs"
- "The build pipeline has a versioned logical-content check for maintainer rebuilds"
- "No manifest hashes are silently refreshed without a documented artifact decision"

open_questions:
- question: "Should JoinOrder rebuild recovery target byte-identical archive reproduction or logical content equivalence?"
  gating: false
  affects: ["w1", "w2", "w3"]
  default: "Resolved: logical content equivalence, because the current Parquet writer path is byte-nondeterministic for at least `cast_info` and byte identity is not the benchmark contract."
