id: windows-ci-hardening
title: "Harden CI and static analysis to catch Windows-specific failures before merge"
worktree: main
priority: High
status: Completed
completed_date: "2026-04-02"
description: |
  Codebase audit identified several categories of Windows issues that can
  slip past the current CI matrix (Windows + Python 3.12 running fast tests
  only). The codebase is reasonably Windows-aware (good pathlib usage, .exe
  suffix handling, /proc/ fallbacks), but gaps remain in encoding, static
  analysis, and integration test coverage on Windows.

  Key findings from audit:
  - ~6 open() calls in core/dryrun.py missing encoding="utf-8" (silent
    data corruption on Windows where default is cp1252)
  - 3 os.access(path, os.X_OK) checks that are no-ops on Windows
  - Integration tests (integration-smoke, test-package, pyspark) run
    Ubuntu-only - test-package uses bash-isms (source activate)
  - Only Python 3.12 tested on Windows; 3.10 has different encoding defaults
  - No static analysis catches Windows anti-patterns pre-merge

category: Testing & Quality

metadata:
  tags:
  - ci
  - windows
  - cross-platform
  - release-quality
  estimated_effort: "Medium"
  created_date: "2026-04-02"
  source_review: "Windows CI hardening conversation - codebase audit"

impact:
  user_impact: |
    Prevents Windows users from hitting encoding corruption, confusing
    error messages from X_OK no-ops, and integration failures that were
    never tested on Windows.
  maintainer_impact: |
    New ruff rules and CI checks catch Windows issues at PR time instead
    of after release. Slightly longer CI time from additional matrix entry.
  regression_risk: |
    Very low. All changes are additive (new checks, new matrix entries).
    No existing behavior modified.

justification: |
  Windows is a supported platform but has weaker CI coverage than Linux/macOS.
  The current setup catches import errors and basic path issues but misses
  encoding bugs (the #1 "works on Linux, broken on Windows" category),
  meaningless executable checks, and integration-level path/subprocess issues.
  These are cheap to fix now and expensive to debug after a release.

cost_benefit_analysis:
  expected_benefits: |
    Catches the most common Windows failure categories (encoding, paths,
    subprocess, integration) at PR time. Prevents post-release bug reports.
  expected_costs: |
    ~1 additional CI matrix entry (~3 min), ruff config change, small
    script for anti-pattern detection. Total estimated: half a day.
  recommendation: |
    Implement in priority order (w1-w3 are quick wins, w4-w7 build on them).
    Each work unit is independently shippable.

deps:
  needs: []

work:
- id: w1
  summary: "Enable ruff PLW1514 rule for open() without explicit encoding"
  status: done
  needs: []
  description: |
    Add PLW1514 (unspecified-encoding) to the ruff select list in
    pyproject.toml. Fix existing violations - primarily ~6 instances in
    core/dryrun.py where open() is called without encoding="utf-8".
    On Windows the default encoding is the system ANSI codepage (cp1252),
    not UTF-8, so missing encoding= causes silent data corruption.
  files:
  - pyproject.toml
  - benchbox/core/dryrun.py

- id: w2
  summary: "Add Windows + Python 3.10 to CI test matrix"
  status: done
  needs: []
  description: |
    Add one include entry to the test.yml strategy matrix:
      - os: windows-latest
        python-version: '3.10'
    Python 3.10 on Windows uses the system codepage as default encoding,
    not UTF-8 (PEP 686 wasn't default until 3.15). This catches encoding
    regressions that 3.12 alone would miss.
  files:
  - .github/workflows/test.yml

- id: w3
  summary: "Make test-package job cross-platform"
  status: done
  needs: []
  description: |
    The test-package job uses `source test-venv/bin/activate` and bare
    `python` - both bash-isms that fail on Windows. Replace with `uv run`
    invocations that work on all platforms. Consider adding windows-latest
    to the job matrix to verify package installation on Windows.
  files:
  - .github/workflows/test.yml

- id: w4
  summary: "Run integration-smoke tests on Windows"
  status: done
  needs: [w3]
  description: |
    Add windows-latest to the integration-smoke job matrix. These ~46
    tests exercise data generation, file I/O, and subprocess orchestration
    - all areas where Windows path/encoding bugs surface. Requires w3
    patterns to be established first.
  files:
  - .github/workflows/test.yml

- id: w5
  summary: "Add static analysis script for Windows anti-patterns"
  status: done
  needs: [w1]
  description: |
    Create a lightweight script (scripts/check_windows_antipatterns.py or
    additional ruff rule config) that checks for:
    - os.access(path, os.X_OK) usage (no-op on Windows, always True)
    - Hardcoded '/' separators in path string construction
    - Unix-only signal constants without hasattr guards
    - subprocess calls with shell=True using bash syntax
    Run in CI as part of the lint step. Could be a simple AST-walking
    script (~100 lines) or additional ruff rule selection.
  files:
  - scripts/check_windows_antipatterns.py
  - .github/workflows/test.yml

- id: w6
  summary: "Fix existing Windows anti-pattern violations"
  status: done
  needs: [w5]
  description: |
    Fix issues surfaced by the new static checks:
    - Replace os.X_OK checks with platform-aware logic (check .exe
      extension on Windows, X_OK on Unix) - 3 instances in TPC generators
      and tpc_compilation.py
    - Add encoding="utf-8" to any remaining open() calls missed by w1
    - Guard any unguarded Unix-only signal usage
  files:
  - benchbox/core/tpch/generator.py
  - benchbox/core/tpcds/generator/runner.py
  - benchbox/utils/tpc_compilation.py

- id: w7
  summary: "Add targeted unit tests for platform-dependent code paths"
  status: done
  needs: [w6]
  description: |
    Add unit tests that exercise Windows-sensitive code by mocking
    platform.system() to verify both Unix and Windows code paths run
    correctly on any CI runner:
    - core/system.py CPU/memory detection fallback paths
    - core/dataframe/tuning/defaults.py memory detection fallback
    - utils/tpc_compilation.py executable detection with .exe suffix
    - utils/runtime_env.py Windows site-packages path resolution
  files:
  - tests/unit/core/test_system.py
  - tests/unit/core/dataframe/test_tuning_defaults.py
  - tests/unit/utils/test_tpc_compilation.py
  - tests/unit/utils/test_runtime_env.py

deferred:
- summary: "Run full integration suite on Windows"
  reason: |
    The full integration suite (not just smoke) on Windows would add
    significant CI time. Defer until Windows smoke tests are stable
    and we have data on what additional issues the full suite catches.
- summary: "Add Windows-specific pytest marker"
  reason: |
    A @pytest.mark.windows_sensitive marker for tests that exercise
    platform-dependent code. Useful for targeted local testing but
    requires ongoing discipline to apply. Revisit after w7 establishes
    which tests are actually platform-sensitive.

must_preserve:
- "All existing tests continue to pass on Linux/macOS (no regressions)"
- "CI time for the common case (Ubuntu PR) does not increase"
- "Windows matrix entries use fail-fast: false to avoid masking issues"

approach: |
  Start with zero-effort wins (ruff rule, matrix entry) before building
  new tooling. Each work unit is independently shippable - no need to
  batch. Follow the existing CI structure in .github/workflows/test.yml.

anti_patterns:
- "DO NOT add Windows-only workarounds with sys.platform checks scattered through business logic - centralize platform abstractions
  in utils/"
- "DO NOT make integration tests conditional on platform - fix the tests to be cross-platform instead"
- "DO NOT use continue-on-error: true for Windows jobs - that hides failures instead of catching them"

verification:
- description: "Ruff catches open() calls without encoding"
  command: "uv run ruff check benchbox/ --select PLW1514"
  expected_output: "No violations"
- description: "All existing tests still pass"
  command: "uv run -- python -m pytest tests -m fast -q --tb=short"
  expected_output: "All tests pass"
- description: "No unguarded os.X_OK usage"
  command: "grep -rn 'os.access.*X_OK' benchbox/"
  expected_output: "Zero matches or all wrapped in platform check"

scope_limit:
  only_modify:
  - ".github/workflows/test.yml"
  - "pyproject.toml (ruff config only)"
  - "scripts/ (new static checker)"
  - "benchbox/core/dryrun.py"
  - "benchbox/core/tpch/generator.py"
  - "benchbox/core/tpcds/generator/runner.py"
  - "benchbox/utils/tpc_compilation.py"
  - "tests/unit/ (new platform-dependent tests)"
  do_not_touch:
  - "Working cross-platform code not flagged in the audit"
  - "Production logic beyond targeted encoding/X_OK fixes"
  - "Integration tests structure (only add matrix entries)"
