id: dry-run-followup-broken-getting-started-link
title: "Close the docs linkcheck gap for broken source-relative links"
worktree: main
priority: Low
status: Completed
completed_date: "2026-05-26"
category: Documentation

description: |
  The agent-proxy dry-run on 2026-04-28 found that
  `docs/contributing-results.md` Prerequisites #1 linked to
  `getting-started.rst` at the wrong relative path (the file lives at
  `docs/usage/getting-started.md`, not `docs/getting-started.rst`). The
  link itself is patched in the same PR as the retrospective. The repo
  now has Sphinx linkcheck coverage in `.github/workflows/docs.yml` and
  `make docs-linkcheck`; this TODO exists to explain why that existing
  coverage did not prevent the source-relative link regression, then
  patch the smallest gap in the existing docs validation surface.

  See `_project/handoffs/external-dry-run-retrospective-2026-04-28.md`
  for the originating finding.

work:
- id: w1
  summary: "Reproduce why existing Sphinx linkcheck missed the original source-relative link"
  status: done
  notes: |
    Current prior art:
      - `.github/workflows/docs.yml` has a blocking `linkcheck` job.
      - `Makefile` has `ci-linkcheck`, `docs-linkcheck`, and
        `docs-check` wrappers.
      - `docs/index.rst` includes `contributing-results.md` in the
        toctree.
    Reconstruct the failure mode from the 2026-04-28 dry-run context:
    was the link fixed before linkcheck ran, was linkcheck absent from
    the relevant PR gate at the time, did MyST/Sphinx not validate the
    source-relative target shape, or did the path only break in the
    GitHub-rendered markdown view?

- id: w2
  summary: "Patch the existing docs validation surface at the narrowest failing layer"
  needs: [w1]
  status: done
  notes: |
    Prefer extending the existing Sphinx/docs validation path over
    adding a second link checker. Examples:
      - If `docs/contributing-results.md` was not in the checked source
        set at the time, add an explicit regression assertion to
        `docs-validate` or the docs CI job.
      - If Sphinx validates built links but not GitHub-rendered markdown
        source links, add a small markdown relative-link check scoped to
        repo-local targets.
      - Add `markdown-link-check` only if the Sphinx path cannot cover
        this exact failure mode.

- id: w3
  summary: "Run the docs link checks and fix any other latent local-link breakage"
  needs: [w2]
  status: done
  notes: |
    Run the existing docs linkcheck and the new/extended local-link
    assertion. Fix local relative-link failures in the same PR if they
    are under `docs/`; file separate follow-ups for unrelated generated
    docs or broad external-link cleanup.

verification:
- description: "Existing Sphinx linkcheck remains wired into docs CI"
  command: "rg -n 'sphinx-build -b linkcheck' .github/workflows/docs.yml Makefile"
  expected_output: "docs.yml and Makefile both contain linkcheck wiring"
- description: "The originally-broken source-relative path no longer appears"
  command: "! rg -n 'getting-started\\.rst|\\]\\(getting-started\\.rst\\)' docs/contributing-results.md"
  expected_output: "no matches"
- description: "Docs linkcheck passes after the coverage-gap fix"
  command: "make docs-linkcheck"
  expected_output: "exit 0"

must_preserve:
- "Existing relative links in `docs/` that currently resolve continue to resolve (no false positives from a poorly-tuned linkcheck
  config)"
- "Docs CI total wall-clock stays within the existing budget (linkcheck added as a parallel job, not serialized after the
  slow build)"
- "External-link 404s remain advisory, not blocking -- a third-party link rotting should not block a docs PR"

anti_patterns:
- "DO NOT whitelist the originally-broken path to make linkcheck pass -- because that defeats the purpose of adding the check"
- "DO NOT add a second generic link checker before explaining why the existing Sphinx linkcheck missed the regression -- because
  duplicated docs gates create noise without proving this failure mode is covered"

scope_limit:
  only_modify:
  - "docs/"
  - ".github/workflows/"
  - "Makefile"
  - "scripts/"

prior_art:
- ".github/workflows/docs.yml — existing blocking Sphinx linkcheck job; EXTEND before adding a separate checker"
- "Makefile — existing `ci-linkcheck`, `docs-linkcheck`, and `docs-check` wrappers; REUSE for local verification"
- "docs/conf.py — existing `linkcheck_ignore` configuration; EXTEND only for flaky external URLs, not local relative-link
  misses"

metadata:
  tags:
  - docs
  - ci
  - dry-run-followup
  estimated_effort: "Small"
  created_date: "2026-04-28"

impact:
  technical_debt: |
    Closes the regression-detection gap that let the broken link
    survive long enough for a contributor (agent or human) to
    encounter it.
