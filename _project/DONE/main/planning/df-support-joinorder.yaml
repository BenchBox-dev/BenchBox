approach: "Follow the read_primitives/dataframe_queries.py single-file pattern with\
  \ QueryRegistry.\nUse get_dataframe_queries() fallback method on the benchmark class.\n\
  \nStart with 4-5 table queries (w1) to establish the multi-join translation pattern,\n\
  then scale to 7-9 table queries. The central translation challenge is converting\n\
  implicit cross-joins (comma-separated FROM with WHERE conditions) into explicit\n\
  .join() chains. Use the title table as the hub for most queries since most\njunction\
  \ tables reference title.id.\n\nFor the expression family, the join pattern is:\n\
  \  title.join(movie_companies, left_on=\"id\", right_on=\"movie_id\")\n       .join(company_type,\
  \ left_on=\"company_type_id\", right_on=\"id\")\n       .filter(col(\"kind\") ==\
  \ lit(\"production companies\"))\n       .select(col(\"title\").min().alias(\"movie_title\"\
  ))\n\nUse QueryCategory.JOIN for all queries, plus AGGREGATE and FILTER as appropriate.\n"
implementation_order: 'Implement SECOND, after df-support-flightdata establishes the
  reference pattern.

  Reuse the same file structure and registration approach. All 5 DataFrame support

  TODOs modify benchmark_registry.py — sequential implementation avoids merge conflicts.

