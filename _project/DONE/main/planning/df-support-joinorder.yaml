id: df-support-joinorder
title: Add DataFrame execution support to JoinOrder benchmark
worktree: main
priority: Medium-High
status: Completed
description: "Add dual-family DataFrame query implementations (expression + pandas)\
  \ for all 13\nJoinOrder benchmark queries, enabling execution on Polars, PySpark,\
  \ DataFusion,\nPandas, Modin, cuDF, and Dask platforms.\n\nJoinOrder is based on\
  \ \"How Good Are Query Optimizers, Really?\" (VLDB 2015) and uses\na 21-table IMDB-like\
  \ schema to stress-test query optimizer join ordering. The 13\nqueries (1a through\
  \ 12a, plus 1b) feature complex multi-table joins (5-9 tables),\nLIKE predicates,\
  \ IN clauses, cross-table filtering, and MIN aggregations.\n\nThis is the most challenging\
  \ benchmark to port to DataFrames because:\n1. Multi-table joins (5-9 tables per\
  \ query) require careful chaining of .join() calls\n2. Implicit cross-joins in FROM\
  \ clauses (comma-separated tables with WHERE join\n   conditions) must be translated\
  \ to explicit .join() sequences\n3. LIKE patterns with wildcards need string method\
  \ equivalents\n4. Join order matters for performance, and DataFrame APIs may not\
  \ preserve the\n   optimizer stress-testing intent — document this caveat\n\nThe\
  \ purpose of DataFrame JoinOrder is NOT to test optimizer join ordering (DataFrames\n\
  define explicit join order), but to measure multi-join execution performance across\n\
  platforms with identical join sequences.\n"
category: Core Functionality
work:
- id: w1
  summary: Create expression-family implementations for queries 1a-4a (4-5 table joins)
  status: done
  notes: "Create benchbox/core/joinorder/dataframe_queries.py with a QueryRegistry.\n\
    Start with the simpler queries that join 4-5 tables:\n\n- 1a: 5 tables (company_type,\
    \ info_type, movie_companies, movie_info_idx, title)\n  MIN aggregations, LIKE/NOT\
    \ LIKE on mc.note, equality joins\n- 1b: Same structure as 1a with different predicates\n\
    - 2a: 5 tables (company_name, keyword, movie_companies, movie_keyword, title)\n\
    \  Equality joins, country_code filter\n- 3a: 4 tables (keyword, movie_info, movie_keyword,\
    \ title)\n  LIKE on keyword, IN clause on mi.info, production_year filter\n- 4a:\
    \ 5 tables (info_type, keyword, movie_info_idx, movie_keyword, title)\n  String\
    \ comparison (mi_idx.info > '2.0'), production_year filter\n\nTranslation pattern\
    \ for implicit cross-joins:\n  FROM t1, t2, t3 WHERE t1.id = t2.fk AND t2.id =\
    \ t3.fk\n  -> t1.join(t2, left_on=\"id\", right_on=\"fk\").join(t3, left_on=\"\
    id\", right_on=\"fk\")\n\nFor LIKE patterns: col(\"note\").str.contains(\"(co-production)\"\
    )\n"
- id: w2
  summary: Create expression-family implementations for queries 5a-9a (5-8 table joins)
  needs:
  - w1
  status: done
  notes: "More complex queries with 5-8 table joins:\n\n- 5a: 5 tables — European\
    \ movies with theatrical release notes\n- 6a: 5 tables — Superhero movies with\
    \ specific actor (LIKE + IN)\n- 7a: 8 tables (aka_name, cast_info, info_type,\
    \ link_type, movie_link, name,\n  person_info, title) — most complex join chain,\
    \ BETWEEN on production_year,\n  gender filter, name_pcode_cf LIKE\n- 8a: 7 tables\
    \ — Japanese dubbed movies, role_type filter, NOT LIKE\n- 9a: 8 tables — American\
    \ voice actresses, BETWEEN on year, IN on ci.note,\n  person_role_id join to char_name\n\
    \nKey challenge: 7a and 9a have 8-table joins requiring careful join sequencing.\n\
    Choose join order that matches natural FK relationships in the IMDB schema.\n"
- id: w3
  summary: Create expression-family implementations for queries 10a-12a (7-9 table
    joins)
  needs:
  - w1
  status: done
  notes: "The most complex queries:\n\n- 10a: 7 tables — American producers, company_type\
    \ + role_type filters\n- 11a: 9 tables (company_name, company_type, keyword, link_type,\
    \ movie_companies,\n  movie_info, movie_keyword, movie_link, title) — most tables\
    \ in any query,\n  country_code != '[pl]', LIKE on cn.name, IS NULL check on mc.note\n\
    - 12a: 8 tables — Drama/horror movies with high ratings, double info_type join\n\
    \  (it1 for genres, it2 for rating), compound conditions\n\n11a is the most complex\
    \ query in the benchmark — plan the join sequence carefully\naround the title\
    \ table as the central fact table.\n"
- id: w4
  summary: Create pandas-family implementations for queries 1a-6a (simpler joins)
  needs:
  - w1
  - w2
  status: done
  notes: 'Add pandas_impl functions for queries 1a, 1b, 2a, 3a, 4a, 5a, 6a (7 queries).

    Key differences from expression family:


    - Joins: pd.merge(left, right, left_on=..., right_on=..., how="inner")

    - LIKE: df["col"].str.contains("pattern", na=False)

    - NOT LIKE: ~df["col"].str.contains("pattern", na=False)

    - IN: df["col"].isin([...])

    - MIN agg: df.agg({"col": "min"}) or df["col"].min()

    - String comparison: df[df["info"] > "2.0"]

    - IS NULL: df["col"].isna()


    Multi-table joins chain: reduce(lambda acc, rhs: pd.merge(acc, rhs, ...), tables)

    or sequential merge calls.

    '
- id: w5
  summary: Create pandas-family implementations for queries 7a-12a (complex joins)
  needs:
  - w2
  - w3
  status: done
  notes: "Add pandas_impl functions for queries 7a, 8a, 9a, 10a, 11a, 12a (6 queries).\n\
    Same translation patterns as w4.\n\n7a-9a have 7-8 table joins — the sequential\
    \ pd.merge() chain will be long.\nUse descriptive intermediate variable names\
    \ for readability:\n  merged_title_mc = pd.merge(title, movie_companies, ...)\n\
    \  merged_with_cn = pd.merge(merged_title_mc, company_name, ...)\n\n11a (9 tables)\
    \ is the most complex — test this one carefully.\n"
- id: w6
  summary: Wire up JoinOrder benchmark class and registry for DataFrame dispatch
  needs:
  - w4
  - w5
  status: done
  notes: "Integration:\n1. Add get_dataframe_queries() method to JoinOrderBenchmark\
    \ in benchmark.py\n2. Set supports_dataframe: True in benchmark_registry.py for\
    \ joinorder entry\n3. Verify JoinOrderGenerator synthetic data works with DataFrame\
    \ data loading\n   (CSV/Parquet format compatibility)\n"
- id: w7
  summary: Add unit tests for JoinOrder DataFrame queries
  needs:
  - w6
  status: done
  notes: "Create tests/unit/core/joinorder/test_dataframe_queries.py:\n- Test all\
    \ 13 queries registered with correct IDs\n- Test expression_impl on small synthetic\
    \ IMDB-like data (build minimal\n  fixtures with a few rows per table that satisfy\
    \ join conditions)\n- Test pandas_impl on same fixtures\n- Test result shapes\
    \ are non-empty (queries with valid data should return rows)\n- Test LIKE/IN/NOT\
    \ LIKE predicates filter correctly\n- Mark tests @pytest.mark.fast where possible\n"
