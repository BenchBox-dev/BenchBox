anti_patterns:
- DO NOT attempt to replicate SQL optimizer stress-testing in DataFrame mode — because
  DataFrame APIs define explicit join order, there is no optimizer to stress — focus
  on correct multi-join execution and performance measurement
- DO NOT use nested loops or iterative joins — because that destroys performance —
  use chained .join() calls that the DataFrame engine can optimize
- DO NOT assume table aliases from SQL map to DataFrame variables — because IMDB schema
  has self-referential patterns — use descriptive variable names (e.g., info_type_genre,
  info_type_rating for the double it join in 12a)
