success_metrics:
- "Result Detail first viewport shows primary metric and primary action before detailed receipt sections dominate."
- "Compare first viewport shows comparability status, baseline, decision summary, and chart/table path in a clear order."
- "Result Detail chart does not clip at 390px."
- "Same-cohort equal-value Compare does not waste most chart area on empty domain."
- "Mixed-scale Compare keeps suppression context attached to derived values."

