    whether two runs can be compared.
  user_impact: |
    Users see the decision, metric, baseline, and comparability guardrails
    before dense receipt and query details.
  technical_debt: |
    Consolidates chart sizing, receipt hierarchy, and comparability-status
    presentation around testable patterns.
