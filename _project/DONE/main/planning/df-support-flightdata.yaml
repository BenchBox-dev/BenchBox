  created_date: "2026-04-10"

impact:
  business_value: |
    Enables FlightData benchmark on 8 DataFrame platforms (Polars, PySpark,
    DataFusion, Pandas, Modin, cuDF, Dask, Bodo). Real-world aviation data
    is a compelling demo for DataFrame analytics capabilities.
  user_impact: |
    Users can run `benchbox run --platform polars-df --benchmark flightdata`
