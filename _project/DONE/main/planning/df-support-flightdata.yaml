files_affected:
  added:
  - benchbox/core/flightdata/dataframe_queries.py
  - tests/unit/core/flightdata/test_dataframe_queries.py
  modified:
  - benchbox/core/flightdata/benchmark.py
  - benchbox/core/benchmark_registry.py

must_preserve:
- "FlightDataBenchmark SQL execution path remains unchanged — all existing SQL queries and parameterized date ranges work
  identically"
- "FlightDataDownloader data generation produces files loadable by both SQL and DataFrame paths"
- "benchbox run --platform duckdb --benchmark flightdata still works (SQL mode unaffected)"

approach: |
  Follow the read_primitives/dataframe_queries.py pattern: single file with
  expression_impl and pandas_impl functions for each query, registered in a
  QueryRegistry. Use the get_dataframe_queries() fallback method on the benchmark
  class (no hard-coded dispatch needed).

  Reference benchbox/core/flightdata/queries.py for the SQL source — each query's
  SQL maps directly to DataFrame operations. Start with the 5 on-time performance
  queries (simplest aggregation patterns), then delay analysis, route analytics,
  temporal patterns, and carrier comparisons.

  Use DataFrameQuery categories: JOIN, AGGREGATE, GROUP_BY, FILTER, SORT for
  appropriate classification. Parameterize date ranges via a module-level defaults
  dict with set_parameter_overrides() pattern from tpch/dataframe_queries.py.

implementation_order: |
  Implement FIRST among the 5 DataFrame support TODOs. FlightData is the simplest
  benchmark (3 tables, standard OLAP patterns) and establishes the reference pattern
  for the others. All 5 TODOs modify benchmark_registry.py — sequential implementation
  avoids merge conflicts.

anti_patterns:
- "DO NOT implement queries as SQL strings passed to DataFrame engines — because that defeats the purpose of DataFrame benchmarking
  — implement using native DataFrame API (col/lit/join/groupby)"
- "DO NOT hardcode date ranges — because FlightData uses parameterized {start_date}/{end_date} based on available data — use
  the parameter override pattern from tpch/dataframe_queries.py"

verification:
- description: "All 20 DataFrame queries are registered in the QueryRegistry"
  command: "uv run -- python -c \"from benchbox.core.flightdata.dataframe_queries import get_dataframe_queries; r = get_dataframe_queries();
    print(f'{len(r)} queries registered'); assert len(r) == 20\""
  expected_output: "20 queries registered"
- description: "FlightData benchmark reports supports_dataframe=True"
  command: "uv run -- python -c \"from benchbox.core.benchmark_registry import BENCHMARK_REGISTRY; print(BENCHMARK_REGISTRY['flightdata']['supports_dataframe'])\""
  expected_output: "True"
- description: "Unit tests pass"
  command: "uv run -- python -m pytest tests/unit/core/flightdata/ -v"
  expected_output: "all tests pass, 0 failures"

scope_limit:
  only_modify:
  - benchbox/core/flightdata/
  - benchbox/core/benchmark_registry.py
  - tests/unit/core/flightdata/
  do_not_modify:
  - benchbox/core/runner/dataframe_runner.py
  - benchbox/core/dataframe/
  - benchbox/platforms/
