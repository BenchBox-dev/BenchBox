id: explorer-comparability-warnings
title: "Add comparability warnings to Compare view for cross-mode and cross-tuning comparisons"
worktree: main
priority: Medium
status: Completed
completed_date: "2026-04-14"
category: Core Functionality

description: |
  The strategy doc (§ Trust, Visibility, and Ranking) lists the dimensions
  on which two results are comparability-breaking. Phase 1 enforces
  hard-blocks on benchmark and scale factor mismatch. Execution mode and
  tuning mode are also comparability-breaking — a SQL vs DataFrame
  comparison or a tuned vs notuning comparison can look like a platform
  performance difference when it is actually a configuration difference.

  Phase 1 couldn't enforce these because execution_mode and tuning_mode
  weren't in the manifest. Once explorer-extend-manifest-and-pipeline
  lands, the Compare view can inspect them and warn.

  This TODO adds visible warnings (not hard-blocks) when:
    - The two results differ on execution_mode (SQL vs DataFrame)
    - The two results differ on tuning_mode (tuned vs notuning)
    - The two results use different query subsets (full vs partial)

  Warnings are prominent (banner at top of compare view) but not blocking —
  intentional cross-tuning comparisons are valuable.

deps:
  needs:
    - explorer-extend-manifest-and-pipeline
    - explorer-add-tuning-config-visibility

work:
  - id: w1
    summary: "Add comparability check function to Compare.tsx: given two DetailResult objects, return a list of ComparabilityWarning records {dimension, value_a, value_b, severity}."
    status: done
    notes: |
      Dimensions to check:
        - execution_mode: warn if "sql" vs "dataframe"
        - tuning_mode: warn if "tuned" vs "notuning"
        - query subset: warn if query_count differs and both are <full set
        - test_type: warn if "power" vs "throughput"

      All are severity=warning (yellow banner), not error (red block).

  - id: w2
    summary: "Render ComparabilityWarning banners above the compare chart: yellow background, icon + message per differing dimension. Dismissible."
    needs: [w1]
    status: done

  - id: w3
    summary: "Extend cohort validation in Compare.tsx: execution_mode + tuning_mode mismatches produce soft-warns; benchmark + scale mismatches remain hard-blocks."
    needs: [w2]
    status: done

files_affected:
  modified:
    - "results-explorer/src/pages/Compare.tsx"
  added:
    - "results-explorer/src/components/ComparabilityBanner.tsx"

must_preserve:
  - "Existing hard-block on benchmark mismatch and scale-factor mismatch — these remain blocking"
  - "Cross-tuning and cross-mode comparisons are allowed (not blocked) — warning is advisory, not preventive"
  - "Compare view still renders when warnings are present"

approach: |
  Comparability check runs client-side after both DetailResult objects are
  loaded. Returns a list of warnings; each warning renders as a dismissible
  banner above the chart area.

  Warning text should explain the implication, not just state the fact.
  "Execution mode differs: sql vs dataframe" is insufficient — add
  "results may not reflect platform SQL performance differences".

anti_patterns:
  - "DO NOT hard-block on execution_mode or tuning_mode mismatch — because intentional cross-mode comparisons are valid analytical use cases — warn and allow"
  - "DO NOT show warnings for equal values — because that would be noise — only warn when the dimension actually differs"
  - "DO NOT conflate warnings with trust labels — because comparability is about methodology, trust is about provenance — separate concerns, separate UI elements"

scope_limit:
  only_modify:
    - "results-explorer/src/pages/Compare.tsx"
    - "results-explorer/src/components/ComparabilityBanner.tsx (new)"
  do_not_modify:
    - "benchbox/core/explorer_pipeline/ (no pipeline changes)"
    - "results-explorer/src/pages/ResultDetail.tsx"

verification:
  - description: "Comparability check function present"
    command: "grep -n 'comparability\\|ComparabilityWarning\\|execution_mode.*warn\\|tuning_mode.*warn' results-explorer/src/pages/Compare.tsx"
    expected_output: "check logic present"
  - description: "Hard-blocks still enforced"
    command: "grep -n 'benchmark.*mismatch\\|scale_factor.*mismatch\\|hard.block\\|Cannot compare' results-explorer/src/pages/Compare.tsx"
    expected_output: "hard-block logic still present"
  - description: "TypeScript compiles cleanly"
    command: "cd results-explorer && npm run typecheck"
    expected_output: "(no errors)"

metadata:
  tags: ["results", "explorer", "comparability", "warnings", "compare", "fidelity"]
  estimated_effort: "Small (0.5-1 day)"
  created_date: "2026-04-14"
