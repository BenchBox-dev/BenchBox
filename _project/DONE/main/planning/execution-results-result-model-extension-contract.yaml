prior_art:
  - "docs/reference/public-contracts.md: result JSON bundle contract tier - extend before moving exported fields."
  - "benchbox/core/results/schema_policy.py: consumer-specific schema acceptance - preserve these risk postures."
  - "benchbox/core/results/schema.py: current schema-v2 payload builder - exported keys are the compatibility boundary."
  - "benchbox/core/results/loader.py: reconstruction contract for historical result files - test before moving fields."
  - "_project/scripts/explorer_pipeline/transformer.py: hosted/explorer consumer - include in downstream compatibility checks."
  - "scripts/benchmark_mooncake_migration.py: standalone top-level migration payload - decide whether to align or leave separate."

must_preserve:
  - "Existing schema-v2 result bundles remain loadable by `load_result_file()`."
  - "Public submission validation remains compatible with accepted schema-v2 bundles."
  - "Explorer pipeline input gate behavior from result-schema-policy work is not weakened."
  - "No existing top-level exported key is removed without same-PR compatibility and docs updates."
  - "Do not conflate internal dataclass cleanup with exported JSON schema cleanup."

approach: |
  Treat `BenchmarkResults` cleanup as a compatibility design problem, not a
  mechanical field move. First document the extension policy, then inventory
  current fields and consumers, then add contract tests, and only then make a
  minimal internal-only or backward-compatible change.

anti_patterns:
  - "DO NOT move `native_comparison` or migration fields into `platform_extensions` in one step without loader, explorer, MCP, and public-submission tests."
  - "DO NOT add a catch-all dict that bypasses schema-v2 validation policy."
  - "DO NOT treat the dataclass field count as the user-facing problem -- exported result compatibility is the primary risk."
  - "DO NOT delete `_benchmark_id_override` until result filename, loader, and builder behavior have an explicit replacement."

