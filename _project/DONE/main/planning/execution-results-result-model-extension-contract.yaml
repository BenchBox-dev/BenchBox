impact:
  business_value: |
    Protects public result bundles and hosted submissions while making future
    platform-specific result extensions more disciplined.
  user_impact: |
    Users and downstream tools avoid surprise schema breaks while maintainers
    get a clear path for adding platform-specific result data.
  technical_debt: |
    Separates model-cleanup desire from schema compatibility requirements and
    records a migration matrix for the overloaded result object.

