id: tuning-fk-load-ordering-fix-20260716
title: "Fix FK-enforcement table-load-ordering defect surfaced by working tuning"
worktree: main
priority: High
status: Completed
completed_date: "2026-07-16"
completed_note: |
  Reproduced and fixed. develop does NOT yet contain PR #1176's tuning-
  delivery fix, so the CLI e2e path (`benchbox run --tuning
  tpch_tuned.yaml`) never actually turns on FK enforcement in the
  adapter (-vv logs show "Schema constraints - Primary keys: False,
  Foreign keys: False" even with foreign_keys.enabled: true in the
  YAML) -- confirmed the e2e verification command in this TODO cannot
  reproduce the defect on develop as-is. Reproduced instead at the
  unit/adapter level by setting `adapter.unified_tuning_configuration`
  directly (the real constraint-application entry point
  `get_effective_tuning_configuration()` reads) with FK enforcement
  forced on, then loading real SF 0.01 TPC-H data via
  `DuckDBAdapter.load_data`: every table except `part`/`region` (the
  only two with no FK dependencies) failed with "Violates foreign key
  constraint" because `TPCHBenchmark` had no `get_table_loading_order`,
  so `DataLoader._load_file_based_data` fell back to alphabetical
  order (lineitem before orders, customer before nation, etc).

  Fix: added `benchbox.core.schema_primitives.get_fk_ordered_table_names`
  (stable topological sort over `BaseSchemaTable.get_foreign_keys()`
  metadata), `benchbox.core.tpch.schema.get_table_loading_order()`, and
  `TPCHBenchmark.get_table_loading_order(available_tables)` -- the same
  extension point TPC-DS already uses. Chose FK-aware load ordering over
  post-load ALTER (the TODO's "portable default"): verified DuckDB
  1.3.2 raises "Not implemented Error: No support for that ALTER TABLE
  option yet!" on `ALTER TABLE ... ADD FOREIGN KEY`, so post-load ALTER
  isn't viable on the affected engine anyway. Constraint application
  itself is untouched (still inline CREATE TABLE via the existing
  `apply_constraint_configuration` path), so applied-ledger/phase-
  metadata instrumentation is unaffected by this change and needs no
  new wiring.

  Verification substitution: the TODO's e2e command
  (`benchbox run --platform duckdb --benchmark tpch --tuning tuned
  --non-interactive`) exercises the full delivery chain, which isn't
  merged yet (PR #1176 still open) -- ran it anyway on develop as a
  smoke check (it completes, but with FK enforcement OFF, so it can't
  prove the fix). Substituted `tests/integration/tuning/
  test_duckdb_fk_load_ordering.py`, which forces
  `unified_tuning_configuration` on a real `DuckDBAdapter` + real
  generated SF 0.01 data (same bypass as the w0 reproduction) and
  proves: (1) the tuned load completes with nonzero rows in every
  table, (2) FK constraints are still enforced post-load (a violating
  INSERT is rejected -- not silently disabled per anti_patterns), and
  (3) `TPCHBenchmark.get_table_loading_order` returns a dependency-safe
  order for the exact table set the real loader passes in. Also added
  unit coverage in `tests/unit/core/test_tpch_schema_helpers.py` and
  `tests/unit/core/test_tpch_benchmark_fakes.py` for the new ordering
  helper (including a stability check for independent tables and a
  cycle-doesn't-raise check). Untuned/no-tuning path re-verified
  end-to-end (`--tuning notuning`) to load successfully in the new
  (dependency, not alphabetical) order with no functional change.
category: Core Functionality

description: |
  From the 2026-07 remediation batch (#1176 e2e): once tuning constraints
  actually reach the engine, loading TPC-H with the shipped tpch_tuned.yaml
  (foreign_keys.enabled: true) fails because tables load in an order that
  violates FK references (e.g. lineitem before orders). Invisible for months
  because tuning never reached the engine. Reproduce (duckdb SF 0.01, shipped
  template), then fix by dependency-ordering the load sequence from schema FK
  metadata or deferring FK creation to post-load (choose per-engine semantics;
  post-load ALTER is the portable default).

work:
  - id: w0
    summary: "Reproduce with the shipped template on duckdb SF 0.01; capture the exact failure"
    status: done
    needs: []
    notes: |
      E2E command from this TODO's verification section does NOT reproduce
      on develop: -vv logs show foreign_keys=False reaching the adapter
      even with foreign_keys.enabled: true in tpch_tuned.yaml (PR #1176's
      tuning-delivery fix isn't merged yet). Reproduced instead by setting
      adapter.unified_tuning_configuration directly (bypassing the
      delivery gap, exercising the real constraint-application path) and
      loading real SF 0.01 TPC-H data via DuckDBAdapter.load_data in the
      then-current alphabetical fallback order: every table except
      part/region (no FK deps) failed with "Violates foreign key
      constraint" (e.g. lineitem before orders, customer before nation).
  - id: w1
    summary: "Implement fix (FK-aware load order or post-load constraint application) with rationale"
    status: done
    needs: [w0]
    notes: |
      Chose FK-aware load ordering, not post-load ALTER: verified DuckDB
      1.3.2 rejects ALTER TABLE ... ADD FOREIGN KEY ("No support for that
      ALTER TABLE option yet!"), so the "portable default" doesn't work on
      this engine. Added benchbox.core.schema_primitives.
      get_fk_ordered_table_names (stable topo-sort over
      BaseSchemaTable.get_foreign_keys()), benchbox.core.tpch.schema.
      get_table_loading_order(), and TPCHBenchmark.get_table_loading_order
      -- the same hasattr(benchmark, "get_table_loading_order") extension
      point benchbox/platforms/base/data_loading.py already uses for
      TPC-DS. Constraint application itself (apply_constraint_configuration,
      inline CREATE TABLE FK clauses) is untouched.
  - id: w2
    summary: "Tests: tuned run with FK enforcement completes; constraint actually enforced post-load (violation insert rejected)"
    status: done
    needs: [w1]
    notes: |
      tests/integration/tuning/test_duckdb_fk_load_ordering.py (real
      DuckDB + real generated SF 0.01 data, FK enforcement forced on via
      the same bypass as w0): tuned load completes with nonzero rows in
      every table; a violating INSERT into orders is still rejected
      post-load; TPCHBenchmark.get_table_loading_order returns a
      dependency-safe order for the real loader's table set. Unit
      coverage added in tests/unit/core/test_tpch_schema_helpers.py
      (topo-sort correctness, stability, cycle-safety) and
      tests/unit/core/test_tpch_benchmark_fakes.py (benchmark-level
      ordering against a shuffled available_tables list).

