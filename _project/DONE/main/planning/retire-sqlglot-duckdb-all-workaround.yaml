approach: |
  Bump the floor before deleting the code. The floor bump is the
  contract that lets us assume the upstream fix is present; without it,
  users on older sqlglot would silently regress. After the bump and
  delete, the live DuckDB regression on TPC-H/TPC-DS/SSB is the
  load-bearing evidence the change is safe end-to-end. Documentation
  edits land in the same PR so the public artifacts (blog draft,
  upstream README) stay in sync with the code.

anti_patterns:
- "DO NOT skip w0 (re-validate the harness against the resolved sqlglot version) - because the original PASS observation was
  recorded on 2026-05-04 against 30.6.0; if this TODO sits in planning/ for weeks, `uv lock` may resolve a different version
  and the safety predicate quietly drifts."
- "DO NOT delete the workaround without bumping the sqlglot floor first - because users on the current floor (>=20.0.0) may
  be on a sqlglot version pre-#3756 and would silently produce broken DuckDB SQL."
- "DO NOT skip the live DuckDB regression in w5 - because unit tests on translate_sql_query do not exercise the full per-platform
  call path through dialect_translation.py."
- "DO NOT touch the SQLite or Postgres post-fix branches - because those are independently load-bearing per the repro harness
  FAIL results for items #2, #3 in the upstream prep."
- "DO NOT add a new public-path regression test in w4 - the existing tests at test_dialect_utils.py:178,191 already cover
  GROUP/ORDER BY ALL through translate_sql_query; adding more would duplicate coverage."

