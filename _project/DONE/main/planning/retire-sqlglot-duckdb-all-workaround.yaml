id: retire-sqlglot-duckdb-all-workaround
title: "Retire obsolete _restore_group_order_by_all_keyword DuckDB workaround and update related docs"
worktree: main
priority: Medium
status: Completed
category: Code Quality
completed_date: "2026-05-04"

outcome: |
  Investigated 2026-05-04. Conclusion: workaround stays.

  W0+W1 confirmed the floor bump (>=25.6.0) is the correct minimum for
  PR #3756, and the floor bump landed on this branch. W3 (helper deletion)
  was implemented and reverted within 2 minutes once a cross-dialect probe
  showed PR #3756 only fixed `read="duckdb", write="duckdb"`; BenchBox's
  actual call shape is `read="postgres", write="duckdb"` (after the
  netezza→postgres normalization in `dialect_utils.translate_sql_query`),
  and that path still emits `ORDER BY "ALL"` on `sqlglot==30.6.0`.

  W4 and W5 cancelled (depended on W3). W6 re-scoped to documenting the
  narrower remaining gap in blog post 11 and `_project/sqlglot-upstream/
  README.md` instead of announcing retirement.

  Root cause of the original mis-classification: `repros/repro_all.py`
  only exercises the single-dialect case for item #1. A cross-dialect
  probe would have flagged this. Captured as a follow-up TODO in the
  upstream README and as a blind-spot finding alongside this PR.

description: |
  The repro harness at `_project/sqlglot-upstream/repros/repro_all.py`
  confirmed against `sqlglot==30.6.0` that SQLGlot's DuckDB generator now
  preserves `GROUP BY ALL` and `ORDER BY ALL` as bare keywords even when
  `identify=True` is set. This was previously a defect that BenchBox
  worked around with `_restore_group_order_by_all_keyword` and
  `_query_has_group_or_order_by_all` in `benchbox/utils/dialect_utils.py`,
  invoked from two call sites:

    1. `benchbox/utils/dialect_utils.translate_sql_query` (the central
       wrapper).
    2. `benchbox/platforms/base/dialect_translation.py` (a parallel
       per-statement path that imports the same helpers).

  Upstream fix: https://github.com/tobymao/sqlglot/pull/3756 (issue
  https://github.com/tobymao/sqlglot/issues/3755). Verified by our
  harness on 30.6.0; the `[PASS]` line in the harness output confirms
  the bare-keyword form is preserved.

  This TODO retires the workaround safely. Safe retirement requires
  bumping our `sqlglot` floor in `pyproject.toml` to the first version
  that includes #3756 - removing the code without that bump would silently
  break users on older `sqlglot` releases who still have the underlying
  defect. Our current pin is `sqlglot>=20.0.0,<31.0.0`.

  Two artifacts that currently document the workaround as load-bearing
  must be updated in the same PR:

    - `_blog/building-benchbox/drafts/11-what-we-built-on-top-of-sqlglot.md`
      (post #11, currently in `drafts/`, not yet published). Section 2
      "Post-generation fixups" lists `_restore_group_order_by_all_keyword`
      in a three-row table. Update to remove that row, attribute the
      retirement to upstream PR #3756, and reduce the post's "three fixes"
      framing to two.
    - `_project/sqlglot-upstream/README.md`. The verdict table and the
      "Follow-up TODOs" section both reference this retirement.

context_sections:
  "Research findings": |
    - Repro on `sqlglot==30.6.0` PASSES; SQLGlot output is
      `SELECT "col1", "col2", SUM("col3") FROM "tbl" GROUP BY ALL`
      (no double-quoted ALL inside the GROUP BY clause).
    - Our existing post-fixup is therefore a no-op when the input has
      `GROUP BY ALL` but is not on the path otherwise; it is dead code.
    - `_query_has_group_or_order_by_all` is only called from
      `_restore_group_order_by_all_keyword`'s gate; both functions
      can be deleted together.
    - There are two production call sites (see description).
    - There are two test files referencing these helpers:
      `tests/unit/utils/test_dialect_utils.py` and
      `tests/unit/sql_compat/test_translate_sql_delegation.py`.
    - First fix release: sqlglot v25.6.0 (2024-07-17). PR #3756 was
      merged 2024-07-11 (squashed as commit 70a1f65b on main); v25.5.1
      (2024-07-04) precedes the merge, v25.6.0 (2024-07-17) is the first
      tagged release that contains it.

  "Why this is Medium, not High": |
    The code is harmless when running against modern `sqlglot`; this is
    code-cleanliness, not a correctness fix. Schedule against contributor
    bandwidth, not on a deadline. The blog post 11 is in `drafts/`,
    so the documentation correction is not a public-facing emergency.

work:
- id: w0
  summary: "Re-validate the repro harness against the resolved sqlglot version before any code change"
  status: done
  notes: |
    The TODO's PASS evidence was recorded against `sqlglot==30.6.0` on
    2026-05-04. Before touching pyproject or code:
      - Run `uv run --with sqlglot python _project/sqlglot-upstream/repros/repro_all.py`
        (no version pin) so it resolves whatever the current cap allows.
      - Confirm item #1 still PASSes; items #2/#3/#5/#6 still FAIL as
        recorded.
    If item #1 no longer PASSes (e.g., upstream regressed it after our
    observation), STOP and re-investigate before proceeding. If a new
    sqlglot major (>=31.0.0) has shipped that the cap excludes, surface
    that in the PR — it may need to be widened in the same change.

- id: w1
  summary: "Identify min sqlglot release containing PR #3756, bump floor, relock"
  status: done
  needs: [w0]
  notes: |
    Lookup: read sqlglot's CHANGELOG/release notes/git tags around the
    merge of https://github.com/tobymao/sqlglot/pull/3756; record the
    first tagged release containing the fix in this TODO's "Research
    findings" section, e.g. "first fix release: sqlglot vX.Y.Z
    (YYYY-MM-DD)".

    Bump: update the `sqlglot` requirement in `pyproject.toml` from
    `>=20.0.0,<31.0.0` to `>=<min-with-3756>,<31.0.0`. Run `uv lock`
    to refresh `uv.lock`. Confirm the resolved version matches w0
    (no unintended downgrade or upgrade). Note in the PR body that
    the floor bump is the safety predicate for w3.

- id: w3
  summary: "Remove _restore_group_order_by_all_keyword and _query_has_group_or_order_by_all"
  status: done
  needs: [w1]
  notes: |
    CANCELLED 2026-05-04: implemented as 89eb06d9c, then reverted as
    ab08064b2 within 2 minutes once the cross-dialect path was checked.
    The repro harness only tested `read="duckdb", write="duckdb"`, but
    BenchBox's actual call goes through `read="postgres", write="duckdb"`
    (after netezza→postgres normalization in `dialect_utils.translate_sql_query`).
    On `sqlglot==30.6.0` that cross-dialect path still emits
    `ORDER BY "ALL"`, so the helpers are still load-bearing. Verified
    with a direct `sqlglot.transpile(..., read='postgres', write='duckdb',
    identify=True)` probe.

    The workaround stays. Retirement requires either a follow-up upstream
    fix that covers the cross-dialect path, or a deliberate decision to
    drop Postgres/Netezza source SQL inputs to the DuckDB target.

- id: w4
  summary: "Prune direct private-helper test references; keep existing public-path regression tests"
  status: done
  needs: [w3]
  notes: |
    CANCELLED 2026-05-04: depends on w3, which is cancelled. The private
    helpers stay in place, so the test imports and direct-call assertions
    that exercise them stay too — they remain a useful regression contract
    against accidental deletion.

- id: w5
  summary: "Live regression: TPC-H/TPC-DS/SSB on DuckDB SF 0.01"
  status: done
  needs: [w4]
  notes: |
    CANCELLED 2026-05-04: w3 was reverted, so there is no risky code
    change for this gate to protect. The dialect_utils call path is
    unchanged on this branch except for the floor bump in w1 (which is
    a constraint, not a runtime change).

- id: w6
  summary: "Update blog post 11 and SQLGlot upstream README to reflect retirement"
  status: done
  needs: [w5]
  notes: |
    DONE 2026-05-04 (re-scoped): instead of "reflect retirement", the
    documentation updates now reflect that the workaround stays and
    document the narrower remaining gap.

    Blog post 11 (commit 92c78e937): clarifies in section "Post-generation
    fixups" that PR #3756 fixed direct DuckDB only and that BenchBox's
    Postgres/Netezza→DuckDB path still produces quoted ALL. Adds a
    footnote citing #3755/#3756 with the narrower scope. Updates the
    "Test environment" line to reflect the new floor and explicitly
    notes the workaround stays.

    Upstream README (this commit): row #1 verdict updated from
    "Retire workaround" to "Keep workaround", explaining that the upstream
    fix only covers `read=duckdb`. The "Follow-up TODOs" bullet that
    asked us to retire the helper is replaced with a follow-up to extend
    `repros/repro_all.py` so the harness exercises the cross-dialect path
    BenchBox actually uses (the original mis-classification was a harness
    coverage gap, not an upstream regression).
      - Update the SQLGlot floor reference in the README if w2 changed it.

