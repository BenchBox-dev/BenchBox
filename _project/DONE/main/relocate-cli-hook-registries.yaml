must_preserve:
  - "CLI --benchmark-option and platform-option parsing behavior (PlatformHookRegistry, PlatformOptionSpec, parse_bool, BenchmarkOptionError) is byte-identical after the move."
  - "Existing imports of benchbox.cli.benchmark_hooks / benchbox.cli.platform_hooks from any external caller keep working via the shim for at least one release."
  - "All 10 core benchmark modules and platforms/__init__.py continue to register their hooks at the same point in the import/registration sequence."

prior_art:
  - "benchbox/cli/benchmark_hooks.py header comment ('Mirrors the platform_hooks.py pattern') - both registries already share a design pattern; relocate them together rather than one at a time to avoid a half-migrated state."
  - "remove-or-integrate-legacy-cudf-platform-module.yaml - existing example of a relocation TODO in this same planning set that adds back-compat notes and a docs update step; follow its w0 (verify importers)/decide/update-docs shape."

approach: |
  Do the physical move first as a no-logic-change relocation (w1), add the
  compat shim immediately after (w2) so nothing breaks mid-migration, then
  update the real importers in core/ and platforms/ (w3) to point at the new
  location so the dependency graph is actually fixed - the shim alone does
  not fix layering, only the updated importers do. Treat the public-contract
  question (w4) as a documentation/deprecation-window decision, not a design
  blocker for the move itself.

anti_patterns:
  - "DO NOT update core/platforms importers to the new location without first adding the cli/ shim - a partially migrated state would break external callers still using the old cli.* path during the same PR window."
  - "DO NOT change registry class names, method signatures, or hook registration order during the move - this is a location fix, not a redesign."
  - "DO NOT silently drop the cli.* shim without checking docs/reference/public-contracts.md first - these may be documented as public import paths."

verification:
  - description: "All benchmark and platform CLI option hooks still work after relocation"
    command: "uv run -- python -m pytest tests -k 'benchmark_hooks or platform_hooks or cli_options' --tb=short"
    expected_output: "all hook-registry tests pass"
  - description: "Old cli.* import paths still resolve via the shim"
    command: "uv run -- python -c 'from benchbox.cli.benchmark_hooks import BenchmarkOptionError; from benchbox.cli.platform_hooks import PlatformHookRegistry; print(\"ok\")'"
    expected_output: "ok"
  - description: "No remaining core/platforms module imports benchbox.cli.* for hooks"
    command: "grep -rn 'cli.benchmark_hooks\\|cli.platform_hooks\\|cli import benchmark_hooks\\|cli import platform_hooks' benchbox/core benchbox/platforms"
    expected_output: "no matches (only benchbox/cli/*.py shim files reference the old names, if any)"

scope_limit:
  only_modify:
    - "benchbox/core/"
    - "benchbox/platforms/"
    - "benchbox/cli/benchmark_hooks.py"
    - "benchbox/cli/platform_hooks.py"
    - "docs/reference/backward-compatibility.md"
    - "docs/reference/public-contracts.md"
  do_not_modify:
    - "benchbox/cli/app.py"
    - "benchbox/cli/main.py"

success_metrics:
  - "benchbox.core.* and benchbox.platforms.* no longer import from benchbox.cli for hook registries."
  - "benchbox/cli/benchmark_hooks.py and benchbox/cli/platform_hooks.py are back-compat shims re-exporting from benchbox.core.hooks."
  - "Public-contract status of the old import paths is explicitly documented (public with deprecation window, or internal-only)."

open_questions:
  - "Should the new home be benchbox/core/hooks/ or a top-level benchbox/hooks/, given that platform_hooks.py is consumed by benchbox/platforms/__init__.py rather than by core/ itself? Default to benchbox/core/hooks/ per the utils < core < platforms < cli ordering (platforms may depend on core) unless review finds a reason core itself must not own platform-facing hooks."
