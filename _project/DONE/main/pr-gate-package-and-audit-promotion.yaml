impact:
  business_value: |
    Closes the exact gap that let a broken clean install (pulling pandas
    into the core install) ship in v0.3.0 - the next such regression fails
    the develop PR that introduces it instead of surfacing at the next
    nightly run or during the main release PR.
  technical_debt: |
    Removes a class of "passes locally, breaks on install" bugs from the
    develop branch instead of only main.

success_metrics:
  - "A packaging-metadata-breaking change fails ci-required-result on its PR, not just nightly."
  - "Non-packaging PRs incur zero added required-job wall-clock time."

