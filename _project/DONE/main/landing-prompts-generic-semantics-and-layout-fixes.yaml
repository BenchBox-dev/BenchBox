approach: |
  Single PR, narrow scope. Apply work units in order — catalog and
  generator first so tests stay green, then the layout/CSS bugs in
  isolation, then the structural simplification (remove blocks, merge
  prompts), then visual polish, then copy + decision record. Run
  `make prompt-quickstarts-write` once after w2 catalog edit; the only
  expected committed include change is the agent label, the hint field,
  and the scale strings.

anti_patterns:
  - "DO NOT keep any string containing 'manual' in user-facing copy - because the corrected design has no manual mode - search and remove."
  - "DO NOT toggle visibility via JS `el.style.display` - because CSS already has `display: flex` on `.prompts-field` - use the HTML `hidden` attribute together with the new `[hidden] { display: none !important }` CSS rule."
  - "DO NOT add `landing/prompts/recipes.json` - same hidden-API risk as before - keep catalog data as an implementation include."
  - "DO NOT wire analytics - still deferred until 2026-08-13."
  - "DO NOT touch `landing/index.html` (root) or `docs/_templates/page.html` - nav already final."
  - "DO NOT edit `benchbox/cli/`, `benchbox/mcp/`, `benchbox/core/`, or `results-explorer/` - same scope-limit posture as the original chain."

