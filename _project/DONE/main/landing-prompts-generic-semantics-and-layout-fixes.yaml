id: landing-prompts-generic-semantics-and-layout-fixes
title: "Fix /prompts/ generic-agent semantics, remove manual-mode legacy, and resolve layout bugs"
worktree: main
priority: High
status: Completed
completed_date: "2026-05-14"
category: Product and Documentation

description: |
  PR #404 landed the /prompts/ launch on 2026-05-14. Walking the live page
  surfaced (a) a semantic conflation — "Generic / manual" was implemented
  as a fallback for "no agent at all", when the user's actual intent
  (Pi, OpenCode, Cline, Aider, etc.) was for Generic to be a real
  coding-agent option — and (b) several rendering bugs:
    - H1 hidden behind the fixed nav (insufficient top padding).
    - Platform A/B fields leak into Test-one mode, and the single
      Platform field leaks into Compare mode, because the CSS
      `display: flex` on `.prompts-field` overrides the HTML `hidden`
      attribute set by JS.
    - MCP mode renders TWO natural-language prompt blocks (Agent prompt
      + MCP prompt) doing roughly the same job.
    - A "CLI commands" block is always shown even though the page H1 is
      about composing agent prompts.
    - Page lede ends "or run the commands yourself" — a manual-mode
      legacy.

  Decisions ratified by the user before this TODO was created:
    - Agent label = "Generic" with a hint "Pi, OpenCode, Cline, Aider, …"
      visible only when Generic is selected.
    - CLI commands block fully removed; the agent prompt is the artefact.
    - Emoji glyphs on block titles are acceptable to add visual interest.
    - One PR (not split).
    - Default agent remains Generic.

  Branch: `fix/landing-prompts-generic-semantics-and-layout`. Base: `develop`.

deps: {}

work:
  - id: w1
    summary: "Re-validate current state before editing"
    status: done
    notes: |
      - Confirm `develop` tip on the main clone has #404 merged
        (`git log origin/develop --oneline -5`).
      - Confirm `landing/prompts/{index.html,prompts.js,prompts.css,catalog.yaml,catalog.generated.js,a11y-checklist.md}`
        all exist on `develop`.
      - Confirm `_project/decisions/landing-prompts-route.md` is current.

  - id: w2
    summary: "Rename agent label and refresh catalog"
    needs: [w1]
    status: done
    notes: |
      - `landing/prompts/catalog.yaml`: change `agents[0].label` from
        "Generic / manual" to "Generic"; add a new
        `hint: "Pi, OpenCode, Cline, Aider, …"` field on that entry.
      - Coerce scales to canonical string form
        (`"0.01"`, `"0.1"`, `"1.0"`, `"10.0"`) so YAML does not strip
        trailing zeros via numeric coercion.
      - Run `make prompt-quickstarts-write` to regenerate
        `landing/prompts/catalog.generated.js`.
      - `make prompt-quickstarts-check` exits 0.

  - id: w3
    summary: "Generator + tests follow-on"
    needs: [w2]
    status: done
    notes: |
      - `scripts/generate_landing_quickstarts.py`: accept string scales
        (the current code passes them through; verify no numeric
        coercion remains). Optionally extend validation so an agent
        entry's `label` cannot contain "manual".
      - `tests/unit/landing/test_landing_quickstarts.py`:
        - Update `test_defaults_resolve_to_known_ids` to compare against
          canonical string scales.
        - Add `test_no_manual_label_anywhere`: walk `agents[].label`
          and assert no entry contains "manual" (case-insensitive).
        - Add `test_generic_agent_has_hint`: assert the `generic` agent
          entry has a non-empty `hint` field.
      - `uv run -- python -m pytest tests/unit/landing/ -q` is green.

  - id: w4
    summary: "Fix H1 underlap (B1) and form→output gap (V2)"
    status: done
    notes: |
      - `landing/prompts/prompts.css`: change `.prompts-main` top
        padding from `var(--space-xl)` to
        `calc(80px + var(--space-xl))` so the fixed nav stops covering
        the H1. This mirrors the landing hero's
        `padding: calc(80px + var(--space-3xl)) 0 ...`.
      - Tighten `.prompts-form { margin-bottom: var(--space-lg); }` so
        the form does not float above the output blocks.

  - id: w5
    summary: "Fix Platform A/B visibility bug (B8)"
    needs: [w4]
    status: done
    notes: |
      Add a CSS override so the HTML `hidden` attribute beats
      `display: flex` on `.prompts-field`:

          .prompts-field[hidden],
          .prompts-block[hidden] { display: none !important; }

      After this, JS toggling `el.hidden = true/false` is sufficient and
      no JS-driven `display` mutation is needed.

  - id: w6
    summary: "Background visual treatment (V1)"
    needs: [w4]
    status: done
    notes: |
      - `landing/prompts/prompts.css`: add a `.prompts-main::before`
        radial-gradient overlay using `--accent-primary`/`--accent-secondary`
        rgba tints, mirroring the landing `.hero::before` pattern.
      - Promote `.prompts-header, .prompts-form, .prompts-output` to
        `position: relative; z-index: 1;` so the gradient sits behind
        the panels.
      - Leave existing panel fills (`--bg-secondary`) alone — they are
        already strong enough against the new background.

  - id: w7
    summary: "Remove CLI-commands block (B4) and the redundant MCP prompt block (B5)"
    needs: [w2]
    status: done
    notes: |
      - `landing/prompts/index.html`: delete `<div id="block-cli">` and
        `<div id="block-mcp-prompt">` entirely. Rename the surviving
        MCP block heading from "MCP server setup" to "MCP server config".
      - `landing/prompts/prompts.js`: remove the rendering paths for
        both deleted blocks; collapse `renderOutput()` so it manages
        only `block-prompt`, `block-mcp-setup`, and `block-cloud-safety`.

  - id: w8
    summary: "Make Agent prompt the single natural-language block (B3, B6)"
    needs: [w7]
    status: done
    notes: |
      - `landing/prompts/prompts.js` `buildAgentPrompt()`: replace the
        generic branch's "Here is a manual recipe…" line with
        "You are a coding agent (e.g. Pi, OpenCode, Cline, Aider) with
        shell access. Help me run a BenchBox benchmark end-to-end."
      - When `state.surface === "mcp"`, render the MCP-flavoured prompt
        (the body that currently goes into `mcp-prompt-text`) into
        `block-prompt` instead. There is exactly one natural-language
        prompt block per render.
      - Set `$("block-prompt").hidden = false;` unconditionally.

  - id: w9
    summary: "Visual polish — block titles, copy buttons, scale rendering (V3, V4)"
    needs: [w8]
    status: done
    notes: |
      - `landing/prompts/index.html`: add
        `<small class="prompts-field-hint" id="agent-hint" hidden></small>`
        under the Agent select. Prepend a single emoji glyph to each
        block title: "📋 Agent prompt", "🔧 MCP server config". The
        existing "⚠ " on managed-cloud safety stays.
      - `landing/prompts/prompts.js`:
        - Add `syncAgentHint(state)` to show the hint only when
          `agent === "generic"` (text comes from `catalog.agents[].hint`).
        - Change the scale select to render the canonical string label
          directly (no `String(numericScale)` coercion that strips
          trailing zeros).
        - Add a `COPY_LABELS` map so the `aria-live` region announces
          "Copied agent prompt" instead of "Copied prompt-text".
      - `landing/prompts/prompts.css`: add `.prompts-field-hint` style
        (smaller, `--text-muted`); add `transition: background 0.15s`
        on `.prompts-copy`.

  - id: w10
    summary: "Page copy refresh + favicon (B7, A1)"
    needs: [w9]
    status: done
    notes: |
      - `landing/prompts/index.html`: rewrite the lede to
        "Pick an agent, surface, platform, benchmark, and scale. Copy
        the prompt into your coding agent. Defaults to a safe local
        DuckDB + TPC-H quickstart." Drop the trailing
        "or run the commands yourself" parenthetical.
      - Add `<link rel="icon" href="data:," />` to silence the dev
        server `favicon.ico` 404.
      - Refresh the `<noscript>` text so it no longer implies a manual
        mode — keep the one-line `uv add … && uv run benchbox run …`
        recipe as a fallback, but frame it as "if JavaScript is
        disabled, here is the default quickstart".

  - id: w11
    summary: "Decision-record correction (D1, D2, D3)"
    needs: [w8]
    status: done
    notes: |
      - `_project/decisions/landing-prompts-route.md`:
        - Prepend a `## Correction (2026-05-14)` subsection (just below
          the metadata block, before `## Context`) noting the original
          conflation between "generic coding agent" and "manual no-agent
          recipe", and pointing at this PR.
        - Rewrite the rationale paragraph in
          `## Default agent and surface` to drop the
          "without an MCP-capable agent" framing; the new rationale is
          "vendor-neutral default that does not pre-bias toward OpenAI
          or Anthropic; Generic is a first-class coding-agent option".
        - Replace the entire `## Generic-agent semantics` section:
          registry key `generic`; intent = any coding agent with shell
          or MCP capability that isn't named Codex/Claude Code;
          vendor-neutral output wording; same block shape as the
          named-agent options; no manual-recipe mode.

