    - core
  estimated_effort: "1-2 days"
  created_date: "2026-07-03"
  last_updated: "2026-07-03T00:00:00Z"

impact:
  business_value: |
    Removes a root-package import cycle that forces fragile load-order
    assumptions and defensive except-ImportError bootstrapping, reducing the
    risk of future circular-import regressions as the package grows.
  user_impact: |
    No direct user-facing change; reduces the chance of import-time errors
    or inconsistent behavior depending on which module is imported first.
  technical_debt: |
    Eliminates a documented load-order hazard (benchbox/__init__.py:14-16)
    and a bootstrap-guard workaround (utils/verbosity.py:11-15), both of
    which are symptoms of the cycle rather than independent design choices.

files_affected:
  modified:
    - "benchbox/utils/version.py"
    - "benchbox/utils/datagen_manifest.py"
    - "benchbox/utils/verbosity.py"
    - "benchbox/__init__.py"
  added:
    - "benchbox/_version.py"
    - "tests/unit/test_import_isolation.py"

must_preserve:
  - "validate_version_consistency() behavior in benchbox/__init__.py:30-46 (warns via UserWarning on RuntimeError, does not hard-fail import) is unchanged."
  - "The wheel's reported version (importlib.metadata / `benchbox --version` equivalent) stays correct for both editable/dev installs and built wheels."
  - "The lean-import guarantee already enforced by tests/unit/test_import_isolation.py (no heavy third-party modules like pandas/polars/pyarrow/duckdb on `import benchbox`) stays green."

prior_art:
  - "benchbox/utils/version.py:_PYPROJECT_CACHE and PROJECT_ROOT - existing tomllib-based pyproject parsing to reuse for the source-tree fallback rather than adding a second TOML reader."
  - "tests/unit/test_import_isolation.py:_run_entrypoint - existing subprocess-isolation pattern to extend for the new w4 regression test, rather than inventing a new import-isolation harness."

approach: |
  Start from utils/version.py since it is the more clearly self-contained
  fix (only needs a version string, not general benchbox internals). Decide
  between importlib.metadata vs. a leaf benchbox/_version.py by checking
  whether validate_version_consistency() needs anything else from the
  package root; if not, importlib.metadata + tomllib fallback avoids adding
  a new file. Apply the same fix to datagen_manifest.py once the pattern is
  settled. Only then touch verbosity.py's guard and the __init__.py comment,
  since removing them prematurely (before the cycle is actually broken) would
  reintroduce the failure the guard exists to prevent.

anti_patterns:
  - "DO NOT remove the verbosity.py try/except ImportError guard before confirming w1+w2 actually eliminate the cycle - removing it first will surface the exact ImportError the guard was added to suppress."
  - "DO NOT special-case version resolution per install method (editable vs wheel) with duplicated logic - reuse the existing _PYPROJECT_CACHE/tomllib fallback for the source-tree case."
  - "DO NOT fold this into the shrink-campaign ledger - _project/goal-shrink-core-code.md scopes structural/god-class-style refactors out of that loop; this is a standalone architecture fix."

verification:
  - description: "Package still imports cleanly and lean-import isolation stays green"
    command: "uv run -- python -m pytest tests/unit/test_import_isolation.py -v"
    expected_output: "all import-isolation tests pass, 0 failures"
  - description: "New regression test proves utils.version no longer imports the package root"
    command: "uv run -- python -m pytest tests/unit/test_import_isolation.py -k version_no_root_import -v"
    expected_output: "test passes"
  - description: "Version consistency validation still runs at import time without hard-failing"
    command: "uv run -- python -c 'import benchbox; print(benchbox.__version__)'"
    expected_output: "prints the current version string with no traceback"

scope_limit:
  only_modify:
    - "benchbox/utils/version.py"
    - "benchbox/utils/datagen_manifest.py"
    - "benchbox/utils/verbosity.py"
    - "benchbox/__init__.py"
    - "benchbox/_version.py"
    - "tests/unit/test_import_isolation.py"
  do_not_modify:
    - "benchbox/cli/"
    - "benchbox/platforms/"
    - "benchbox/core/"

success_metrics:
  - "utils/version.py and utils/datagen_manifest.py no longer import the benchbox package root."
  - "benchbox/__init__.py:14-16 load-order comment is removed or no longer applies."
  - "utils/verbosity.py's bootstrap try/except ImportError guard is removed or justified for a different reason."
  - "A regression test asserts import benchbox.utils.version does not trigger full benchbox package initialization."

open_questions:
  - "Does validate_version_consistency() need any other benchbox-root state besides __version__ and doc paths? If so, a leaf _version.py module may be insufficient and the doc-consistency check may need its own path resolution independent of the package import."
