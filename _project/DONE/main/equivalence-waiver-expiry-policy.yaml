  - description: "A synthetic past-due review_by waiver triggers the new signal in equivalence.py's report"
    command: "uv run -- python -m pytest tests/unit/core/tpchavoc/ -k review_by -v"
    expected_output: "same behavior, ported to the TPC-Havoc engine-keyed baselines"
