  - description: "Existing gates stay green after the change lands"
    command: "make ssb-cross-surface-equivalence-report && make read-primitives-cross-surface-equivalence-report && make tpchavoc-equivalence-report"
    expected_output: "all three exit 0, unchanged from before this TODO"
    result: "PASS - all three exit 0. Also spot-checked make clickbench-cross-surface-equivalence-report (retrofitted _CLICKBENCH_TIE_AMBIGUOUS lives there) and make tpchavoc-equivalence-report-clickhouse (retrofitted CLICKHOUSE_KNOWN_DIVERGENCES_REVIEW_BY lives there) - both exit 0, no review-due warning yet (worked-example dates are 2027-01-03, not past-due on 2026-07-03)."

scope_limit:
  only_modify:
    - "benchbox/core/equivalence/cross_surface.py"
    - "benchbox/core/tpchavoc/equivalence.py"
    - "tests/unit/equivalence/ (actually tests/unit/core/equivalence/ - see verification deviation note)"
    - "tests/unit/core/tpchavoc/"
    - "_project/TODO/"
  do_not_modify:
    - "benchbox/core/tpchavoc/validation.py"

open_questions:
  - question: "Should review_by live as a new ClassifiedDivergence field (cross_surface.py) / a small dataclass replacing the bare str (equivalence.py), or as an independent side-table keyed by the same divergence key?"
    gating: true
    affects: ["w1 carrier shape", "w2/w3 implementation"]
    default: "Prefer extending ClassifiedDivergence with an optional review_by field in cross_surface.py (reuses the existing, already-adopted mechanism) and a small side-table dict[str, date] per baseline in equivalence.py (avoids retyping four existing dict[str, str] globals) - but confirm neither choice complicates the sibling read-primitives-waivers-classified-divergence conversion before finalizing."
  - question: "Warn or fail the gate when a review_by date has passed?"
    gating: true
    affects: ["w1 policy", "w2/w3 exit-code behavior"]
    default: "Warn (print prominently, do not change the exit code) - a past-due review is a prompt to re-look, not proof the waiver is wrong, and both modules' hard-gate exit codes should stay reserved for actual divergence/vacuity/staleness signals."

success_metrics:
  - "A waiver in either module can carry an optional review_by date, and a past-due date is surfaced distinctly in the gate's/report's output."
  - "The policy is documented in both module docstrings."
  - "At least one real, long-lived waiver per module carries a worked-example review_by, with a test proving the check fires when it is past-due."

