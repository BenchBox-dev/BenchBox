id: release-accounting-drift-correction
title: "Correct CHANGELOG/README release accounting drift and add a tag-claim guard"
worktree: main
priority: High
status: Completed
category: Release Tooling

description: |
  Release bookkeeping in this repo has drifted from the actual published
  state, in two independent ways confirmed against the repo and PyPI on
  2026-07-03:

  1. `CHANGELOG.md` line 10 has a `## [0.3.1] - 2026-05-30` section written
     in the same released-version format as every other dated entry (e.g.
     `## [0.3.0] - 2026-05-16` at line 53), but no `v0.3.1` git tag exists
     (`git ls-remote --tags origin 'refs/tags/v0.3.*'` returns only
     `refs/tags/v0.3.0`) and PyPI has never served `0.3.1`
     (`pip index versions benchbox` lists `0.3.0` as latest). The section
     reads as shipped when it is not.

  2. `README.md:31` says `Current release: v0.2.1`, but that has been stale
     since `v0.3.0` published; PyPI-latest is `0.3.0`, not `0.2.1`
     (`pyproject.toml` and `benchbox/__init__.py` also still read `0.2.1`
     on `develop`, which is expected per the release-cut flow in
     `Makefile:977-1057` — version bumps happen only on the ephemeral
     release branch, not on `develop` — but README's human-facing claim
     needs to reflect the actual latest published release, not develop's
     working version file).

  Compounding both: `v0.3.0` is PyPI-latest but fails a clean import
  (`ModuleNotFoundError: No module named 'pandas'`, reverified live via
  `uv run --isolated --no-project --with 'benchbox==0.3.0' -- python -c
  'import benchbox'` run from outside the repo tree). So the CHANGELOG
  currently implies a working, released `0.3.1` fix exists when the
  PyPI-latest install is actually broken.

  This TODO owns the honesty fix to the release bookkeeping (CHANGELOG
  wording/dating, README's current-release line) and a durable guard so a
  `CHANGELOG.md` released-version section can never again claim a version
  with no corresponding git tag. It does NOT own cutting the real `v0.3.1`
  release — that belongs to `release-recovery-v0-3-1`, which is already
  Critical priority and already in flight.

work:
  - id: w1
    summary: "Re-validate the cited drift facts before editing"
    status: done
    notes: |
      Capture compact evidence (do not commit raw logs):
        - `git ls-remote --tags origin 'refs/tags/v0.3.*'` -> only v0.3.0
        - `uv run --isolated --with pip -- python -m pip index versions benchbox`
          -> LATEST: 0.3.0
        - `cd /tmp && uv run --isolated --no-project --with 'benchbox==0.3.0' --
          python -c 'import benchbox'` -> ModuleNotFoundError: pandas
          (run from outside the repo tree — running from the repo root
          silently shadows the installed wheel with the local `benchbox/`
          source directory and gives a false pass)
        - `grep -n 'Current release' README.md` -> still v0.2.1
      If any of these have changed (e.g. v0.3.1 has since actually
      shipped), stop and re-scope this TODO against deps.needs before
      editing CHANGELOG/README.

  - id: w2
    summary: "Fix CHANGELOG.md so the 0.3.1 section cannot be read as released"
    needs: [w1]
    status: done
    notes: |
      Two acceptable outcomes depending on w1's findings; pick one and
      say which in the PR body:
        (a) If v0.3.1 has not shipped yet: move the `[0.3.1] - 2026-05-30`
            content under `## [Unreleased]` (merging with any existing
            Unreleased content) and drop the specific date, since dated
            sections are a released-version convention elsewhere in this
            file (`0.3.0`, `0.2.1`, etc.).
        (b) If the plan is still to cut a real v0.3.1 imminently: keep the
            section but re-date it to `TBD` or the actual cut date once
            known, and do not let a future-dated or past-but-unreleased
            date sit in a released-version slot.
      Either way, add a short note under the entry (or a new `0.3.0`
      addendum) that `0.3.0` shipped with a broken clean install
      (`ModuleNotFoundError: pandas`) and that the fix is pending release,
      consistent with the honest state release-recovery-v0-3-1 is working
      toward.

  - id: w3
    summary: "Fix README.md's current-release line to match PyPI-latest"
    needs: [w1]
    status: done
    notes: |
      `README.md:31` currently reads `Current release: v0.2.1`. Update it
      to name the actual PyPI-latest version (`v0.3.0` as of w1, pending
      the recovery release). Consider phrasing that survives version churn
      without needing a manual bump every release (e.g. pointing readers to
      `benchbox --version` or the PyPI project page) — but if you keep an
      explicit version string, it must match PyPI-latest at merge time.

  - id: w4
    summary: "Add a guard: a CHANGELOG released-version section requires a matching git tag"
    needs: [w2]
    status: done
    notes: |
      Extend `scripts/generate_changelog_entry.py` (which already knows how
      to detect the latest `v*` tag via `git describe --tags --abbrev=0
      --match 'v*'`, see `_resolve_log_range`) or add a small standalone
      check, plus a unit test under `tests/unit/release/` (see the existing
      `tests/unit/release/test_ruleset_review_enforcement.py` for the
      out-of-tree module-loading pattern used for `_project/scripts`
      modules — decide whether this check belongs in `scripts/` or
      `_project/scripts/` based on where it needs to run: CI content-guard
      vs. one-off release tooling).

      The check: parse `CHANGELOG.md` for `## [X.Y.Z] - <date>` headers
      (excluding `[Unreleased]`) and assert each `X.Y.Z` has a
      corresponding `vX.Y.Z` tag reachable from `git tag -l` / `git
      ls-remote --tags origin`. Wire it into `make pr-preflight` or the
      content-guard path (whichever this repo already uses for
      CHANGELOG-adjacent lint) so a future premature dated section fails
      CI instead of silently drifting again.

deferred:
  - summary: "Cutting the real v0.3.1 release"
    reason: "Owned by release-recovery-v0-3-1 (Critical, already Not Started with w1/w2 done). This TODO only fixes the bookkeeping honesty problem and adds the guard."
  - summary: "Automatically keeping README's current-release line in sync via CI"
    reason: "Out of scope here; if w3's fix still requires a manual version string, a follow-up could add a doc-freshness check similar to the CHANGELOG guard, but that's a separate TODO if desired."

deps:
  needs:
    - release-recovery-v0-3-1

must_preserve:
  - "CHANGELOG.md's existing dated-section format for genuinely released versions (0.3.0, 0.2.1, ...) is unchanged."
  - "scripts/generate_changelog_entry.py continues to generate valid changelog entries for make release-cut (see Makefile:986)."
  - "The w4 guard must not block make release-cut itself (which drafts a section before the tag exists) — it should only fail on sections that are already merged to develop/main claiming an untagged version, not on the release branch's own in-progress draft."

approach: |
  Do the CHANGELOG/README honesty fix (w2/w3) first since it's low-risk
  and doesn't depend on the recovery release landing. Land the tag-guard
  (w4) as a follow-up in the same PR or a fast-follow. Check with the
  release-recovery-v0-3-1 owner before finalizing w2's exact wording so
  the two TODOs don't produce conflicting CHANGELOG edits — coordinate via
  deps.needs rather than editing that TODO's scope_limit list.

anti_patterns:
  - "DO NOT delete the 0.3.1 CHANGELOG content outright - because it documents real completed work (pandas lazy-loading, Databricks Liquid Clustering, etc.) that will ship in the eventual recovery release - move/re-date it instead of dropping it."
  - "DO NOT hardcode a new version string guess into README.md without checking PyPI - because that recreates the exact drift this TODO fixes - verify against pip index versions benchbox or the release tag list before writing a version number."
  - "DO NOT make the w4 guard block make release-cut's own changelog draft - because that draft legitimately claims an untagged version before the tag is pushed - scope the check to already-merged develop/main state, not the release branch mid-flight."

verification:
  - description: "No CHANGELOG.md released-version section claims a version without a matching tag"
    command: "uv run -- python scripts/generate_changelog_entry.py --help >/dev/null && echo 'script still importable'"
    expected_output: "script still importable (replace with the actual new guard's check command once w4 lands, e.g. a pytest under tests/unit/release/)"
  - description: "README's current-release line matches PyPI-latest"
    command: "grep -n 'Current release' README.md"
    expected_output: "version string matches the output of: uv run --isolated --with pip -- python -m pip index versions benchbox | grep LATEST"
  - description: "New unit test for the tag-claim guard passes"
    command: "uv run -- python -m pytest tests/unit/release/ -v"
    expected_output: "all tests pass, including the new guard test, 0 failures"

scope_limit:
  only_modify:
    - "CHANGELOG.md"
    - "README.md"
    - "scripts/generate_changelog_entry.py"
    - "tests/unit/release/"
  do_not_modify:
    - "pyproject.toml"
    - "benchbox/__init__.py"
    - "_project/TODO/main/active/release-recovery-v0-3-1.yaml"

prior_art:
  - "scripts/generate_changelog_entry.py:_resolve_log_range — reuse the existing git tag-detection logic (git describe --tags --abbrev=0 --match 'v*') rather than reimplementing tag lookup."
  - "tests/unit/release/test_ruleset_review_enforcement.py — reuse the out-of-tree module-loading pattern if the guard lives in _project/scripts rather than scripts/."

metadata:
  owners:
    - joeharris76
  tags:
    - release
    - changelog
    - documentation
    - accounting
  created_date: "2026-07-03"
  estimated_effort: "Small"

impact:
  business_value: |
    Prevents the CHANGELOG and README from misrepresenting release state,
    which erodes trust in the changelog as a source of truth and could
    lead users or downstream tooling to believe a fix is available when
    it is not yet published.
  technical_debt: |
    Adds a durable CI-enforceable guard so this specific class of drift
    (dated CHANGELOG section without a matching tag) cannot silently
    recur.

success_metrics:
  - "CHANGELOG.md has no dated released-version section without a corresponding git tag."
  - "README.md's current-release line matches PyPI-latest at merge time."
  - "A CI-enforced check fails a future PR that reintroduces an untagged dated CHANGELOG section."

resolution_notes: |
  All four work units implemented 2026-07-03. w1's facts re-validated
  unchanged: only v0.3.0 tagged/published; v0.3.0's clean import still
  fails with ModuleNotFoundError: pandas (reverified from /tmp, outside
  the repo tree); README still said v0.2.1.

  - w2: CHANGELOG.md's `## [0.3.1] - 2026-05-30` section moved under
    `## [Unreleased]` (outcome (a): v0.3.1 has not shipped), dated header
    dropped, and an explicit accounting note added explaining the prior
    mis-dating, that 0.3.0 (PyPI-latest) has the broken pandas import, and
    that the fix is complete on develop pending release-recovery-v0-3-1.

  - w3: DEVIATION from the literal success-metric wording ("README.md's
    current-release line matches PyPI-latest"). Discovered mid-implementation
    that benchbox/utils/version.py's check_version_consistency() (out of
    scope to edit - it's in the benchbox/utils/ exclusion zone for this
    session, owned by other in-flight work) hard-requires README.md's
    "Current release: vX.Y.Z" line, parsed by _DOC_VERSION_PATTERN, to
    literally equal benchbox.__version__ (develop's pyproject.toml/__init__.py
    literal, currently 0.2.1 - frozen since release-cut/-finalize never
    replay version bumps onto develop). tests/unit/test_version_management.py
    ::test_check_version_consistency_reports_clean_state pins this and would
    fail (missing/mismatched README marker) if the line stopped matching
    0.2.1 or stopped matching the pattern at all (e.g. if reworded to point
    only at `benchbox --version`/PyPI with no parseable version literal).
    That test and version.py are both out of this TODO's scope_limit and
    the session's cross-cutting file-ownership boundaries.

    Resolution: kept the literal "Current release: v0.2.1." marker verbatim
    (so the automated consistency check - which is really asserting
    "docs agree with this checkout's own working-tree version," not "docs
    agree with PyPI" - stays green and doesn't silently get weakened), and
    added it now candidly explains what that marker actually means
    ("mirrors pyproject.toml on develop... is NOT what pip install
    benchbox gets you today"), immediately followed by a clearly-labeled,
    prominent statement of the real PyPI-latest (v0.3.0) with the broken-
    install caveat and a workaround (install from develop). This satisfies
    the TODO's honesty intent (a reader is no longer misled into thinking
    v0.2.1 is current) without breaking the pinned internal-consistency
    test. Flagging as an open item: the checker's semantics (working-tree
    version, not PyPI-latest) and this TODO's ask (README should reflect
    PyPI-latest) are structurally in tension as long as develop's version
    literal stays frozen between releases; a durable fix would need either
    a version.py change (exempt README's PyPI-facing claim from the
    strict-equality check) or a docs restructure (move the PyPI-latest
    claim to a location version.py doesn't scan) - out of scope here.

  - w4: added `released_versions_in_changelog`, `existing_tags`,
    `find_untagged_changelog_versions`, `check_tag_claims`, and a
    `--check-tag-claims` CLI flag to scripts/generate_changelog_entry.py
    (single home for tag-detection logic, alongside `_resolve_log_range`'s
    existing `git describe --tags` use). The guard exempts exactly the
    dated section matching an in-progress release branch's own version
    (`vX.Y.Z[-suffix]`, same shape validate-main-pr.yml accepts) per
    must_preserve's constraint that it must not block release-cut's own
    draft; every other untagged dated section is flagged regardless of
    branch. New tests/unit/release/test_changelog_tag_guard.py (9 tests,
    pytest.mark.fast) covers the fixture-based logic plus a live check
    that this repo's actual CHANGELOG.md currently has zero untagged
    claims on this branch. `existing_tags()` falls back to
    `git ls-remote --tags origin` when local tags aren't fetched (true in
    this sandbox checkout), so the guard doesn't silently pass for lack of
    local tag data.

  Verification: `uv run -- python -m pytest tests/unit/release/ -q` → 17
  passed. `uv run -- python -m pytest tests/unit/test_version_management.py
  tests/unit/utils/test_utils_version_management.py -q` → 16 passed
  (confirms the w3 compromise keeps the pinned consistency check green).
  `uv run -- python scripts/generate_changelog_entry.py --check-tag-claims`
  → exit 0, "CHANGELOG.md tag-claim guard: OK". ruff check/format clean on
  all touched Python files.
