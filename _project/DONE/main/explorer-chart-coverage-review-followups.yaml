id: explorer-chart-coverage-review-followups
title: "Address follow-up findings from chart-coverage code review"
worktree: main
priority: Low
status: Completed
completed_date: "2026-04-19"
category: Core Functionality

description: |
  Non-required nits and improvements surfaced by the code review of
  explorer-close-chart-type-coverage-gaps. The two Required issues (PowerBar
  color index, PercentileLadder caller color index) were fixed immediately
  post-review. This item tracks the remaining four findings.

work:
  - id: w1
    summary: "Fix ordinal() in RankTable to handle n >= 21 correctly"
    needs: []
    status: done
    notes: |
      RankTable.tsx:21-25 - ordinal() only special-cases 1/2/3; everything
      else falls through to `${n}th`.  Renders "21th", "22nd"→"22th" for
      n >= 21 that end in 1/2/3 (except 11/12/13 which are correctly "th").
      Unlikely with current platform counts but technically wrong.

      Fix: standard ordinal suffix rule -
        const suffixes = ["th","st","nd","rd"];
        const v = n % 100;
        return `${n}${suffixes[(v - 20) % 10] ?? suffixes[v] ?? suffixes[0]}`;

  - id: w2
    summary: "Render CDFChart as ECDF steps, not smooth lines"
    needs: []
    status: done
    notes: |
      CDFChart.tsx:103-115 uses `L` (lineto) to connect CDF points, producing
      smooth diagonal lines.  A true ECDF is a step function: horizontal
      segment to the x-value, then vertical jump to the next cumulative
      fraction.  The Python reference (textcharts.cdf_chart) renders steps.
      Visual divergence is minor on dense data (22+ queries) but visible on
      sparse distributions.

      Fix: render H→V steps instead of diagonal L commands.  No math change
      needed - computeECDFPoints output is already correct.

  - id: w3
    summary: "Data-gate Histogram / Box Plot / CDF tabs in BenchmarkIndex"
    needs: []
    status: done
    notes: |
      BenchmarkIndex.tsx:383-386 - The Histogram, Box Plot, and CDF tabs are
      unconditionally shown (hardcoded true).  When all platform timings are
      null or empty, clicking these tabs shows a blank section because each
      chart guards internally and returns null.  The Percentiles, Power, Phases,
      and Cost tabs are already data-gated.

      Fix: add a `hasTimings` guard:
        const hasTimings = s.platforms.some(
          (p) => Object.values(p.timings).some((v) => v !== null && v > 0)
        );
      Then use hasTimings for the histogram/distribution/cdf entries.

  - id: w4
    summary: "Replace hardcoded CANONICAL_IDS in meta-test with dynamic chart_types.py parse"
    needs: []
    status: done
    notes: |
      chartRegistry.meta.test.ts:19-36 - CANONICAL_IDS is a third hardcoded
      copy of the chart type list (alongside chart_types.py and chartRegistry.ts).
      The test detects TS-side drift but NOT Python-side drift: if someone adds
      a 17th type to chart_types.py without updating the test's list, the test
      passes.

      Fix options:
        (a) Parse chart_types.py at test time using Node fs.readFileSync +
            regex to extract chart IDs from _CHART_SPECS.
        (b) Emit a machine-readable chart-ids.json from the Python pipeline
            as a build artifact and compare against that.
        (c) Accept the current triple-write but add a comment warning that
            chart_types.py is the authority and all three must be kept in sync.

      Option (c) is the lowest friction; (a) is the most robust.  Avoid (b)
      since it couples the static build to the test suite.

