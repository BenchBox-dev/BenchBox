id: deferred-dataframe-performance-analysis
title: "Deferred DataFrame Performance Cross-Platform Analysis"
worktree: main
priority: Medium
status: Completed
category: Performance Analysis
description: |
  Consolidates 3 deferred items from dataframe-performance-optimization-and-analysis
  (completed 2025-01-07). These represent the next tier of DataFrame performance
  work beyond the initial profiling infrastructure.

  Originally deferred 13+ months ago. The landscape has evolved - existing
  adapters (Polars, Pandas, DataFusion, PySpark) now provide enough coverage
  to start the cross-platform comparison without waiting for Modin/cuDF/Dask.

  Deferred items:
  1. Cross-platform benchmark suite - start with existing adapters (Polars,
     Pandas, DataFusion, PySpark), expand to Modin/cuDF/Dask later
  2. SQL vs DataFrame comparison benchmark (DuckDB SQL vs DataFrame API;
     DataFusion SQL vs DataFrame) - both platforms support dual execution modes
  3. Performance comparison report generation

context_sections:
  "Background": |
    Basic profiling is available via execute_query_profiled(). The completed TODO
    established the performance measurement infrastructure. These deferred items
    build the higher-level analysis layer that compares across platforms.

  "Revised Scope (Feb 2026)": |
    Original deferral reason cited missing Modin/cuDF/Dask adapters. However,
    4 DataFrame adapters now exist and are production-ready: Polars, Pandas,
    DataFusion, PySpark. This is sufficient for a meaningful cross-platform
    comparison. Modin/cuDF/Dask can be added incrementally when adapters exist.

    The SQL vs DataFrame comparison is immediately feasible on DuckDB and
    DataFusion, which both support SQL and DataFrame execution paths.

metadata:
  tags:
    - dataframe
    - performance
    - deferred-followup
  estimated_effort: "Medium - feasible with existing adapters"
  created_date: "2026-02-18"
  split_from: dataframe-performance-optimization-and-analysis

work:
  - id: w1
    summary: "Design cross-platform DataFrame benchmark matrix - Polars vs Pandas vs DataFusion vs PySpark on TPC-H queries"
    status: done
    notes: |
      Start with existing adapters. Define: which TPC-H queries, which scale
      factors, which metrics (wall time, memory, CPU). Design output format
      for comparison tables.

  - id: w2
    summary: "Implement SQL vs DataFrame comparison mode - run identical TPC-H queries via SQL and DataFrame on DuckDB and DataFusion"
    needs: [w1]
    status: done
    notes: |
      Both DuckDB and DataFusion support dual execution modes. Compare per-query
      timing to quantify the overhead/advantage of each execution path.

  - id: w3
    summary: "Build performance comparison report generator - aggregate multi-platform results into structured comparison output"
    needs: [w1]
    status: done
    notes: |
      Generate comparison tables, highlight fastest/slowest per query, compute
      geometric means. Integrate with existing ASCII chart system.

completed_date: "2026-02-18"

sections:
  "Implementation Summary": |
    All three work units resolved by discovering that the required infrastructure
    was already fully implemented by the time this TODO was re-activated (Feb 2026).

    w1 (Design): The benchmark matrix is established as:
      - Platforms: polars-df, pandas-df, datafusion-df, pyspark-df
      - Queries: TPC-H Q1,Q3,Q6,Q10,Q17,Q21 at SF 0.1 for meaningful timing
      - Metrics: geometric mean, p90, memory via execute_query_profiled()
      - Workflow: benchbox run per platform → schema v2.1 files → compare/visualize

    w2 (SQL vs DataFrame): SQLVsDataFrameBenchmark and DataFrameBenchmarkSuite
    both exist in benchbox/core/dataframe/benchmark_suite.py. CLI access via
    benchbox compare -p polars-df -p duckdb (run mode) or
    benchbox compare file1.json file2.json (file mode).

    w3 (Report generator): Comparison reports (markdown, text, json) already
    generated by DataFrameBenchmarkSuite._generate_markdown_report() and
    UnifiedBenchmarkSuite. Standard ASCII chart integration via benchbox visualize
    with comparison_bar chart type across multiple schema v2.1 files.

  "Recommended Workflow": |
    To run cross-platform DataFrame comparison:
      benchbox run --platform polars-df --benchmark tpch --scale 0.1 --queries Q1,Q3,Q6,Q10,Q17,Q21
      benchbox run --platform pandas-df --benchmark tpch --scale 0.1 --queries Q1,Q3,Q6,Q10,Q17,Q21
      benchbox run --platform datafusion-df --benchmark tpch --scale 0.1 --queries Q1,Q3,Q6,Q10,Q17,Q21
      benchbox visualize <file1> <file2> <file3> --chart-type comparison_bar

    For SQL vs DataFrame comparison:
      benchbox compare -p polars-df -p duckdb --benchmark tpch --scale 0.1
      benchbox compare file_polars.json file_duckdb.json

deferred:
  - summary: "Modin, cuDF, and Dask adapter integration into cross-platform suite"
    reason: "Adapters for these platforms don't exist yet. Add to the comparison suite incrementally as adapters are implemented."
