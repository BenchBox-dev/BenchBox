            uv run -- python -m pytest --collect-only -q -p no:warnings

      Because conflict detection fires inside pytest_collection_modifyitems,
      --collect-only is sufficient to trigger it. Do NOT pipe to tail or any
      other command — the exit code must come directly from pytest for CI to
      catch failures reliably.

