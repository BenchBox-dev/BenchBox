must_preserve:
  - "make test-fast and uv run -- python -m pytest -m fast -q collect identical node ID sets (not just equal counts) — enforced by existing collection hook in d84c897a8"
  - "make test-slow, make test-stress, make test-all still collect their expected sets — hook must not block explicit marker opt-in"
  - "BENCHBOX_SKIP_MARKER_CHECK=1 suppresses validation errors after w14 promotion (escape hatch preserved); during w1-w13 migration, BENCHBOX_ENFORCE_MARKER_CHECK=1 opts into early error mode"
  - "No test logic changes — only marker annotations modified"

approach: |
  Work units are sequenced: extend the existing pytest_collection_modifyitems hook
  in warning mode first (w1), placing conflict detection BEFORE the deselection
  slice so all 43 violations are visible regardless of -m filter. CI stays green
  while violations are fixed (w2-w13 can run in any order or in parallel — one
  file per commit). Promote to error mode (w14) only after all violations are
  gone, confirmed by pytest --collect-only returning zero marker-conflict warnings.
  Finally add the make target (w15) to give pre-commit a fast entry point.

anti_patterns:
  - "DO NOT add new markers to tests without first checking for speed-lane conflicts — because the hook catches it at collection time but a failing CI run wastes 10+ minutes before you see the error; check locally with --collect-only first"
  - "DO NOT resolve conflicts by removing resource_heavy or live_integration from tests that genuinely need those markers — those exist to route tests to the right runner; remove the speed-lane marker instead"
  - "DO NOT use BENCHBOX_SKIP_MARKER_CHECK=1 in CI — it defeats the entire purpose"
  - "DO NOT change test logic while fixing markers — because this is a metadata-only cleanup and any logic change risks introducing regressions that get blamed on the marker fix, making it harder to revert cleanly"
  - "DO NOT add a second pytest_collection_modifyitems function to conftest.py — Python silently overrides the first; extend the existing hook body instead"
  - "DO NOT pipe the lint-markers pytest invocation into tail or any filter — the exit code must come from pytest directly, otherwise CI wiring silently passes on failure"

