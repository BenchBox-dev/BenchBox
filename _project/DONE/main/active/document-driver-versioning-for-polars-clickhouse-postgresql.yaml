id: document-driver-versioning-for-polars-clickhouse-postgresql
title: "Add driver version management callouts to Polars, ClickHouse Cloud, and PostgreSQL platform docs"
worktree: main
priority: Low
status: Completed
completed_date: "2026-02-23"
description: |
  The DuckDB platform doc (docs/platforms/duckdb.md) was updated in the previous TODO
  (document-driver-version-selection-behavior) to include a "Testing a Specific DuckDB Version"
  section with a concrete example and a cross-reference to the driver-version-management guide.

  Three other platform docs are missing equivalent coverage:

    docs/platforms/polars.md
      - No mention of driver versioning. After the polars extra is made optional, users
        will need to know how to install a specific polars version.

    docs/platforms/clickhouse-cloud.md
      - No driver versioning section. The platform uses clickhouse-connect; users may want
        to pin a specific connector release for reproducibility.

    docs/platforms/postgresql.md
      - Has basic install info but no guidance on driver version selection or the uv.lock
        revert issue.

  The fix for each file is the same pattern used for duckdb.md:
    1. Add a "Testing a Specific [Platform] Driver Version" subsection under Configuration
       or Platform Options, with a concrete --platform-option driver_version example
    2. Add a {ref}`driver-version-management` cross-reference link

  Additionally, the driver-version-management.md guide itself should reference these
  platforms in its examples (currently it only shows duckdb and snowflake examples).

category: Documentation

work:
- id: w1
  summary: "Add 'Testing a Specific Polars Version' callout to docs/platforms/polars.md with driver_version + driver_auto_install
    example and {ref}`driver-version-management` link"
  status: done

- id: w2
  summary: "Add 'Testing a Specific clickhouse-connect Version' callout to docs/platforms/clickhouse-cloud.md: same pattern
    as w1, note that the driver package is 'clickhouse-connect' not 'clickhouse'"
  status: done

- id: w3
  summary: "Add 'Testing a Specific psycopg2 Version' callout to docs/platforms/postgresql.md: same pattern as w1, note that
    the driver package is 'psycopg2-binary'"
  status: done

- id: w4
  summary: "Add polars and clickhouse-connect examples to docs/usage/driver-version-management.md Pattern 1 block alongside
    existing duckdb/snowflake examples"
  needs: [w1, w2, w3]
  status: done

metadata:
  created_date: "2026-02-23"
  estimated_effort: "Small (1-2 hours)"
  tags:
  - documentation
  - driver-versioning
  - polars
  - clickhouse
  - postgresql

impact:
  user_impact: |
    Users of Polars, ClickHouse Cloud, and PostgreSQL platforms will find version
    management guidance directly in their platform's documentation — not just in DuckDB's.
    Reduces confusion when uv.lock silently reverts a manually-installed version.

files_affected:
  modified:
  - "docs/platforms/polars.md"
  - "docs/platforms/clickhouse-cloud.md"
  - "docs/platforms/postgresql.md"
  - "docs/usage/driver-version-management.md"

must_preserve:
- "Existing content in all four docs files is not removed or restructured — only append new sections"
- "The {ref}`driver-version-management` cross-reference format matches what is used in duckdb.md"
- "driver-version-management.md remains the single authoritative guide — platform docs link to it, not duplicate it"

approach: |
  For each platform doc, locate the "Platform Options" or "Configuration" section and
  add a new subsection immediately after the options table:

  ### Testing a Specific [Platform Name] Version

  ```bash
  benchbox run --platform [platform] --benchmark tpch \
    --platform-option driver_version=X.Y.Z \
    --platform-option driver_auto_install=true
  ```

  See {ref}`driver-version-management` for the full guide, including why `uv run` may
  revert a manually-installed version and how to work around it.

  Use the exact same wording as duckdb.md lines 79-88 for consistency, substituting
  the correct platform name and a realistic version number (e.g., polars 1.36.1,
  clickhouse-connect 0.10.0, psycopg2-binary 2.9.11).

  For driver-version-management.md, add one example per platform to the
  "Pattern 1: driver_auto_install" block — a brief comment line + the benchbox run
  command is sufficient (no new sections needed).

anti_patterns:
- "DO NOT duplicate the full driver-version-management guide content in each platform doc — because it will go stale — add
  only a short example + link"
- "DO NOT add version numbers that don't match the current optional-extra floors — because it will confuse users — use the
  same versions as pyproject.toml optional extras"

verification:
- description: "All three platform docs contain a driver_version example"
  command: "grep -l 'driver_version' docs/platforms/polars.md docs/platforms/clickhouse-cloud.md docs/platforms/postgresql.md"
  expected_output: "All three files listed (each contains 'driver_version')"
- description: "All three platform docs contain the cross-reference link"
  command: "grep -l 'driver-version-management' docs/platforms/polars.md docs/platforms/clickhouse-cloud.md docs/platforms/postgresql.md"
  expected_output: "All three files listed"
- description: "Sphinx doc build produces no warnings for the new cross-references"
  command: "uv run sphinx-build -W docs docs/_build/html 2>&1 | grep -i 'warning\\|error' | head -20"
  expected_output: "No warnings or errors related to the new cross-references"

scope_limit:
  only_modify:
  - "docs/platforms/polars.md"
  - "docs/platforms/clickhouse-cloud.md"
  - "docs/platforms/postgresql.md"
  - "docs/usage/driver-version-management.md"
