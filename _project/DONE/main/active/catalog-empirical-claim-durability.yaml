id: catalog-empirical-claim-durability
title: "Add storage-bytes smoke and doc-yaml consistency check for catalog empirical claims"
worktree: main
priority: Medium
status: Completed
completed_date: "2026-05-06"
category: Testing and Quality Assurance

description: |
  Blind-spot `2026-05-05-003357` documented that
  `benchbox/core/write_primitives/catalog/operations.yaml` carries hand-
  stamped `verified <tool> at SF=<x>` comments tied to point-in-time
  observations (e.g. 60003 / 4314 / 317 bytes for the ClickHouse smoke;
  similar numbers for DuckDB). Three durability problems:

  1. No regression alarm if observations drift after a tool upgrade.
  2. Doc-vs-yaml-bound skew is unguarded
     (`docs/benchmarks/write-primitives-sketch-functions.md` quotes
     "~4.3KB on ClickHouse" while operations.yaml carries `[1500, 8000]`
     bounds -- they can drift independently with no signal).
  3. Verification methodology is not codified -- the ad-hoc SQL script
     that captured the observations lived only in the session that wrote
     them.

  This TODO ships a checked-in companion smoke + a doc-yaml consistency
  test, and sweeps existing comments for staleness.

closes_blind_spots:
- 2026-05-05-003357-empirical-verification-numbers-decoupled-from-yaml-bounds

work:
- id: w1
  summary: "Sweep existing `verified <tool>` comments for date-staleness or version drift"
  status: done
  notes: |
    Grep `benchbox/core/write_primitives/catalog/operations.yaml` for
    `verified` and produce a table: comment | tool | tool version at
    write time | current tool version | bound | observed bytes today
    (if measurable). Any row where current observation is outside the
    bound or where the tool version has moved is a sweep finding --
    record the table as a checked-in handoff at
    `_project/handoffs/catalog-verified-comment-sweep-2026-05-05.md`
    (or current date) so a reviewer can diff the next sweep against
    it.

- id: w2
  summary: "Write `scripts/sketch_storage_smoke.sh` (or `make` target) that prints observed bytes"
  needs: [w1]
  status: done
  notes: |
    Run the persist+merge cycles against the bundled SF=0.01 fixtures
    for each tool (DuckDB, ClickHouse-local, optionally chDB) and
    print observed bytes per op in a stable format (TSV: tool /
    op_id / observed_bytes). Stash it under
    `scripts/sketch_storage_smoke.sh` so the next person who refreshes
    the numbers has a single command.

- id: w3
  summary: "Add doc-yaml consistency test"
  needs: [w1]
  status: done
  notes: |
    Fast-marked test in `tests/unit/core/write_primitives/
    test_doc_yaml_consistency.py` that parses
    `docs/benchmarks/write-primitives-sketch-functions.md` for "~Xkb
    on <tool>" claims and asserts each falls inside the matching
    `operations.yaml` `expected_value_min/max` bound. If the doc claim
    is missing a tool the catalog covers, fail with a clear "claim
    missing" message. If the bound is missing, fail with "doc claim
    has no yaml bound."

- id: w4
  summary: "Re-stamp any out-of-date catalog comments uncovered by w1"
  needs: [w1, w2]
  status: done
  notes: |
    Use the smoke output from w2 to refresh the comments. If a bound
    legitimately moved (tool upgrade, schema change), document the
    bound update with a date + observed-bytes line under the existing
    `verified` comment so the next sweep can diff against it.

- id: w5
  summary: "Add 'durability of empirical claims' sub-axis to the review framework"
  needs: [w3]
  status: done
  notes: |
    Extend `.claude/skills/code/references/five-axis-review.md` with a
    sub-axis under Correctness: "For changes that update empirically-
    observed numbers in catalog comments or docs, require a checked-in
    smoke (or make target) that re-produces the observation, and a
    consistency test that fails when doc claims drift outside catalog
    bounds." This sub-axis is explicitly delegated to this TODO by
    `extend-five-axis-review-rubric` (see its `deferred:` block) so
    there is no double-edit risk. The `deps.needs` link below ensures
    the parent TODO's six branches land first.

verification:
- description: "Smoke script exists"
  command: "test -f scripts/sketch_storage_smoke.sh"
  expected_output: "exit 0"
- description: "Doc-yaml consistency test exists and passes"
  command: "uv run -- python -m pytest tests/unit/core/write_primitives/test_doc_yaml_consistency.py -v"
  expected_output: "exit 0"
- description: "Sweep handoff document exists"
  command: "ls _project/handoffs/catalog-verified-comment-sweep-*.md 2>/dev/null"
  expected_output: ">= 1 file (after w1 lands)"

must_preserve:
- "Existing `expected_value_min/max` bounds in `operations.yaml` are not loosened to make a stale comment pass -- if the smoke
  shows drift, the bound moves WITH a new dated comment line, not silently."
- "Doc prose around storage-size claims continues to read naturally; the consistency test parses the existing prose pattern,
  not a machine-readable annotation."
- "Existing chDB or other in-flight sketch work is not blocked by this TODO -- the consistency test fails only on declared
  (yaml-bounded + doc-claimed) ops."

anti_patterns:
- "DO NOT replace the catalog `verified` comments with structured YAML annotations -- the comments are reviewer-friendly prose;
  the smoke + test are the enforcement layer."
- "DO NOT make the smoke run in CI on every PR -- it pulls fixtures and runs persist+merge cycles. It is an on-demand sweep
  tool, run quarterly or when bounds are touched."

scope_limit:
  only_modify:
  - "scripts/sketch_storage_smoke.sh"
  - "tests/unit/core/write_primitives/test_doc_yaml_consistency.py"
  - "benchbox/core/write_primitives/catalog/operations.yaml"
  - "docs/benchmarks/write-primitives-sketch-functions.md"
  - ".claude/skills/code/references/five-axis-review.md"

deps:
  needs:
  - extend-five-axis-review-rubric

metadata:
  tags:
  - catalog
  - sketches
  - testing
  - blind-spot-followup
  estimated_effort: "Medium"
  created_date: "2026-05-05"

impact:
  technical_debt: |
    BenchBox's catalog accumulates "plausible-looking" empirical claims
    as more sketch families and platforms land. Without a smoke +
    consistency test, the value of the catalog as a methodology record
    erodes one quiet drift at a time. Adding the smoke pays back on
    every future tool upgrade.
