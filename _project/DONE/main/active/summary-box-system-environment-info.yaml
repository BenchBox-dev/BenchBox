id: summary-box-system-environment-info
title: "Add system environment details to the right side of the run summary box"
worktree: main
priority: Medium
status: Completed
completed_date: "2026-02-10"
category: Visualization
description: |
  The post-run summary box currently renders benchmark metrics (Geo Mean, Total,
  Queries, Best, Worst) in a single column with unused whitespace on the right.
  Add key system environment details (OS, Python version, CPU count/arch, memory)
  as a right-aligned column next to the metrics, giving users immediate context
  about the hardware/software configuration that produced the results.

  Target layout (single-run):
  ```
  ┌────────────────────────────────────────────────────────────────────┐
  │                   ClickBench on DuckDB (SF 1.0)                   │
  ├──────────────────────────────┬─────────────────────────────────────┤
  │ Geo Mean:  1.6ms             │  OS: Darwin 25.2.0                 │
  │ Total:     48.8ms            │  Python: 3.12.11 (uv)              │
  │ Queries:   27                │  CPUs: 10 (arm64)                  │
  │                              │  Memory: 16 GB                     │
  ├──────────────────────────────┴─────────────────────────────────────┤
  │ Best: Q6 (1.0ms), Q13 (1.0ms), Q15 (1.0ms)                      │
  │ Worst: Q19 (4.0ms), Q10 (3.5ms), Q33 (3.0ms)                    │
  └────────────────────────────────────────────────────────────────────┘
  ```

  The data is already available: BenchmarkResults has a `system_profile` field
  (SystemProfile dataclass from benchbox/core/schemas.py) with os_name,
  os_version, architecture, cpu_cores_logical, memory_total_gb, python_version.

  The summary box is rendered in two places:
  - Post-run CLI: generate_post_run_summary() in post_run_summary.py
  - MCP charts: generate_chart() with chart_type="summary_box"

metadata:
  tags:
    - visualization
    - ascii-charts
    - ux
  estimated_effort: Small
  created_date: "2026-02-10"
  last_updated: "2026-02-10"

impact:
  business_value: |
    Users sharing or reviewing benchmark results get immediate context about the
    environment without having to open the JSON result file. Especially useful
    for comparing results across machines or environments.
  technical_debt: |
    None - this is a new feature addition to existing rendering infrastructure.

must_preserve:
  - "Existing single-run and comparison summary box layouts still render correctly when system_profile is None"
  - "ASCIISummaryBox.render() remains a pure function (no side effects, no I/O)"
  - "Box width auto-detection still works; environment column only appears when terminal is wide enough"

approach: |
  1. Add optional environment fields to SummaryStats dataclass (os, python, cpus, memory).
  2. In ASCIISummaryBox._render_single_metrics(), render a two-column layout when
     environment data is present: left column = metrics, right column = env info,
     separated by a vertical box-drawing char.
  3. In _render_comparison_metrics(), apply the same two-column layout.
  4. In generate_post_run_summary(), extract system_profile from BenchmarkResults
     and populate the new SummaryStats fields.
  5. Graceful fallback: if system_profile is None or terminal is too narrow,
     render the current single-column layout.

  Follow existing patterns in summary_box.py for box-drawing characters,
  ANSI color handling, and visible-length padding calculations.

anti_patterns:
  - "DO NOT call platform.uname() or psutil at render time - because the renderer should be pure and system info should come
    from the result object - use result.system_profile"
  - "DO NOT hard-code a fixed box width - because terminal widths vary - use options.get_effective_width() and fall back to
    single-column if too narrow"

verification:
  - description: "Existing summary box tests still pass"
    command: "uv run -- python -m pytest tests/unit/core/visualization/test_post_run_summary.py -v --tb=short"
    expected_output: "all tests pass, 0 failures"
  - description: "New environment info renders in summary box"
    command: "uv run -- python -m pytest tests/unit/core/visualization/ -k 'system_environment or env_info' -v --tb=short"
    expected_output: "new tests pass showing environment details in box"

success_metrics:
  - "Summary box displays OS, Python, CPUs, Memory when system_profile is available"
  - "Layout gracefully degrades to single-column when system_profile is None"
  - "Layout gracefully degrades to single-column when terminal width < 60"
  - "Comparison summary boxes also show environment details"

files_affected:
  modified:
    - "benchbox/core/visualization/ascii/summary_box.py"
    - "benchbox/core/visualization/post_run_summary.py"
    - "tests/unit/core/visualization/test_post_run_summary.py"

scope_limit:
  only_modify:
    - "benchbox/core/visualization/ascii/summary_box.py"
    - "benchbox/core/visualization/post_run_summary.py"
    - "tests/unit/core/visualization/"
  do_not_modify:
    - "benchbox/core/results/"
    - "benchbox/core/schemas.py"
    - "benchbox/cli/"

work:
