id: reduce-cc12-complexity-ceiling
title: "Reduce CC=12 complexity ceiling - exclude 12 inherent, refactor 8, lower warn to 12"
worktree: main
priority: Medium
status: Completed
completed_date: "2026-03-12"
description: |
  Completed on 2026-03-12.

  Wave 4 started with the original top-20 CC=12 sample:
  - 12 inherent functions excluded in pyproject.toml
  - 8 accidental-complexity functions refactored below the ceiling

  A follow-up wave (4b) was then required because the original `--top 20` scan
  missed 30 additional non-excluded CC=12 functions.

  Outcome:
  - Refactored 6 additional helper/dispatch functions below CC=12
  - Classified the remaining 24 additional CC=12 functions as inherent
    platform/spec/runtime/conversion complexity
  - Added narrow function-level exclusions in `pyproject.toml` with matching
    rows in `quality/complexity/classification-matrix.yaml`
  - Lowered `warn_complexity` from 13 to 12

  Final state:
  - Worst non-excluded function complexity: CC=11
  - `make complexity-check`: 0 warnings, 0 failures

category: Code Quality and Technical Debt

deps:
  needs: []

work:
  - id: w1
    summary: "Classify all 20 CC=12 functions and exclude inherent complexity"
    status: done
    note: |
      Verified all 20 functions. Reclassified 7 preliminary-refactorable as inherent
      (convert, _run_simple_wizard, run_dataframe_benchmark, execute_complex_type_introspection,
      detect_antipatterns, _parse_json_node, parse_file) and 1 preliminary-inherent as
      refactorable (_generate_query_highlights). Added 12 exclusions to pyproject.toml
      under wave 4 header. Updated classification-matrix.yaml with all 20 entries.

  - id: w2
    summary: "Refactor _output_summary_text (CC 12->~6) - extract Rich rendering path"
    status: done
    needs: [w1]
    note: |
      File: benchbox/cli/commands/compare_plans.py:338
      Pattern: Builds identical data in two formats (text string + Rich console) with
      duplicated conditional structure (plans_changed > 0, unchanged filter, regressions).
      Approach: Extract _render_summary_rich(summary, regressions) to separate the Rich
      console rendering. Main function becomes text-only + dispatch.

  - id: w3
    summary: "Refactor validate_config (CC 12->~5) - data-driven validation rules"
    status: done
    needs: [w1]
    note: |
      File: benchbox/cli/config.py:359
      Pattern: 10 identical 'get key → check threshold → print error → return False' guards.
      Approach: Define _VALIDATION_RULES = [(key_path, default, check_fn, error_msg), ...]
      and replace 10 guards with a single validation loop.

  - id: w4
    summary: "Refactor generate_cli_command (CC 12->~6) - extend data-driven param pattern"
    status: done
    needs: [w1]
    note: |
      File: benchbox/cli/dryrun.py:30
      Pattern: 20+ parameter combinations with 3 recurring patterns (list flags,
      scalar params, boolean flags). _VALUE_PARAMS partially extracted.
      Approach: Add _BOOL_PARAMS and _LIST_PARAMS alongside existing _VALUE_PARAMS.
      Replace per-param conditionals with 3 loops.

  - id: w5
    summary: "Refactor format_last_run_summary (CC 12->~6) - extract field loop and time formatter"
    status: done
    needs: [w1]
    note: |
      File: benchbox/cli/preferences.py:232
      Pattern: Sequential conditional branches for each config field with identical
      get-format-append logic.
      Approach: Define field list with format lambdas; loop once. Extract
      _format_relative_time() for timestamp delta logic.

  - id: w6
    summary: "Refactor calculate_confidence_interval (CC 12->~5) - t-critical lookup table"
    status: done
    needs: [w1]
    note: |
      File: benchbox/core/analysis/statistics.py:163
      Pattern: Nested if/elif for confidence_level x sample_size -> t-critical value
      creates 9 branches from 2 dimensions.
      Approach: Replace with _T_CRITICAL dict keyed by confidence_level, containing
      sorted (n_threshold, t_value) tuples. Use linear scan for lookup.

  - id: w7
    summary: "Refactor _generate_query_highlights (CC 12->~6) - extract gap and surprise helpers"
    status: done
    needs: [w1]
    note: |
      File: benchbox/core/analysis/insights.py:447
      Pattern: Two independent analysis sections (performance gap detection lines 458-470,
      surprising ranking shifts lines 472-490) with no shared state between them.
      Approach: Extract _find_gap_highlights(query_comparisons, threshold) and
      _find_surprising_win_highlights(query_comparisons, rankings). Main function
      concatenates both results.

  - id: w8
    summary: "Refactor get_summary (CC 12->~7) - extract speedup matrix and winner helpers"
    status: done
    needs: [w1]
    note: |
      File: benchbox/core/dataframe/benchmark_suite.py:685
      Pattern: Two distinct computation blocks - speedup matrix via O(n^2) platform pairs
      (lines 704-711), query winners via triple-nested result scan (lines 720-729).
      Approach: Extract _build_speedup_matrix(platforms, geomeans) and
      _find_query_winners(results). Main function becomes: compute geomeans -> build
      matrix -> find winners -> construct ComparisonSummary.

  - id: w9
    summary: "Refactor validate_power_test_results (CC 12->~6) - table-driven validation rules"
    status: done
    needs: [w1]
    note: |
      File: benchbox/core/tpc_metrics.py:120
      Pattern: Repetitive range checks (scale factor min/max, total time min/max,
      per-query time min/max) with identical check-and-append-error pattern.
      Approach: Define _VALIDATION_RULES = [(attr, min_val, max_val, label), ...].
      Replace repeated range checks with a single validation loop.

  - id: w10
    summary: "Lower warn threshold from 13 to 12 in pyproject.toml"
    status: done
    needs: [w2, w3, w4, w5, w6, w7, w8, w9]
    note: |
      Follow-up wave 4b completed the missed CC=12 cohort discovered by
      `check_complexity.py --warn-complexity 12 --top 200`.

      Additional work completed under w10:
      - Refactored 6 functions below CC=12:
        `_build_safe_where_clause`, `_apply_vectorized_conversions`,
        `_extract_phase_timings_ms`, `_extract_plan_summary`,
        `_map_identifier_default`, `_get_remote_file_uris_from_manifest`
      - Classified and excluded 24 additional inherent CC=12 functions across
        TPC workflows, platform adapters, runtime resolution, and format conversion
      - Lowered `warn_complexity` to 12 and verified zero remaining warnings

deferred: []

verification:
  - description: "Complexity check passes with no functions at CC>=12"
    command: "make complexity-check"
    expected_output: "0 warnings, 0 failures"
  - description: "No non-excluded CC>=12 functions remain"
    command: "uv run -- python scripts/check_complexity.py --warn-complexity 12 --top 50"
    expected_output: "Warnings (>12): 0"
  - description: "No regressions in fast suite"
    command: "uv run -- python -m pytest -m fast -q"
    expected_output: "All fast tests pass"
  - description: "Lint passes"
    command: "uv run ruff check ."
    expected_output: "All checks passed"

must_preserve:
  - "All refactored functions must produce identical behavior - no semantic changes"
  - "Existing tests must continue to pass without modification"
  - "exclude_functions entries must include CC score and rationale comment"
  - "Excluded functions from prior complexity waves (CC>=20, CC=14, CC=13) remain untouched"

approach: |
  w1: Read each CC=12 function, classify per guidelines established in prior waves.
  Record in classification-matrix format. Batch-add confirmed inherent entries to
  pyproject.toml under new section header. (DONE: 12 inherent, 8 refactorable)

  w2-w9: For each refactoring:
  1. Read the function and its callers/tests
  2. Extract private helper methods or define data-driven config in the same module
  3. Run focused tests + lint after each extraction
  4. Verify CC reduced via: uv run -- python scripts/check_complexity.py 2>&1 | grep function_name
  5. Commit per work unit

  w10: Update warn_complexity threshold and verify.

anti_patterns:
  - "DO NOT change public API signatures - because all targets are internal or private functions"
  - "DO NOT add new abstractions (base classes, protocols) - because extraction and dict dispatch alone achieve the CC target"
  - "DO NOT move code to new files - because helpers share private state with the parent function"
  - "DO NOT refactor functions classified as inherent - because their complexity reflects domain reality; use exclude_functions instead"
  - "DO NOT lower max_complexity (currently 20) - because the exclude list handles inherent complexity above the warn threshold; only warn_complexity should decrease"
  - "DO NOT create new test files for extracted helpers - because they are private and tested through existing call paths"

scope_limit:
  only_modify:
    - "pyproject.toml"
    - "quality/complexity/classification-matrix.yaml"
    - "benchbox/core/tpcdi/etl/sql_backend.py"
    - "benchbox/core/tpcdi/etl/transformations.py"
    - "benchbox/core/visualization/ascii_runtime.py"
    - "benchbox/mcp/tools/analytics.py"
    - "benchbox/core/tpcds_obt/query_conversion.py"
    - "benchbox/platforms/databricks/adapter.py"
    - "benchbox/cli/commands/compare_plans.py"
    - "benchbox/cli/config.py"
    - "benchbox/cli/dryrun.py"
    - "benchbox/cli/preferences.py"
    - "benchbox/core/analysis/statistics.py"
    - "benchbox/core/analysis/insights.py"
    - "benchbox/core/dataframe/benchmark_suite.py"
    - "benchbox/core/tpc_metrics.py"
