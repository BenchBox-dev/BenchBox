id: explorer-cross-benchmark-meta-leaderboard
title: "Add cross-benchmark meta-leaderboard to the home page"
worktree: main
priority: Medium
status: Completed
completed_date: "2026-04-15"
category: Core Functionality

description: |
  The 2026-04-15 strategy review observed that BenchBox's multi-benchmark
  story is a real differentiator vs ClickBench but the current Home page
  does not lean into it. A cross-benchmark meta-leaderboard answers
  "which engines consistently do well across benchmarks?" - a question
  no single-benchmark site can answer.

  Approach: compute per-engine performance *rank* within each
  (benchmark, scale, phase) cohort, then surface aggregate rank across
  cohorts. Ranks normalize away the incompatible units (power_score vs
  geomean_ms) that make direct cross-benchmark comparison impossible.

  Visualization: a compact table on the home page with columns per
  benchmark cohort and a cell showing the engine's rank (e.g., "1/4")
  plus a summary "Average rank: 1.5" column on the right.

  Not included: any claim that the meta-leaderboard is an official or
  weighted score. It is a transparent rank-aggregation across whatever
  cohorts the corpus contains, with all inputs visible and linkable.

deps:
  needs:
  - explorer-emit-benchmark-summary-artifact
  - explorer-matrix-leaderboard-view

work:
- id: w1
  summary: "Add MetaLeaderboard computation to pipeline.py; emit meta_leaderboard.json"
  status: done
  notes: |
    Scan every BenchmarkSummary and emit
    results-explorer/public/data/meta_leaderboard.json with:
      {cohorts: [{benchmark, scale, phase,
                  platforms: [{platform, rank, total}]}],
       summary: [{platform, avg_rank, appearances}]}
    Exclude cohorts with only 1 platform.

- id: w2
  summary: "Build MetaLeaderboard component at src/components/MetaLeaderboard.tsx"
  needs: [w1]
  status: done
  notes: |
    Table: one column per cohort (abbreviated header 'TPC-H SF0.01
    pwr'), cells show rank fraction. Rightmost column 'Avg Rank';
    rows sorted by avg_rank ascending.

- id: w3
  summary: "Integrate MetaLeaderboard into Home.tsx as hero panel; demote Recent Results"
  needs: [w2]
  status: done

- id: w4
  summary: "Add transparency disclosure panel below the meta-leaderboard"
  needs: [w2]
  status: done
  notes: |
    Explain: (a) rank is within-cohort; (b) only cohorts with ≥2
    platforms count; (c) platforms missing from a cohort are N/A, not
    penalized; (d) avg_rank is a simple mean across appearances;
    (e) link to the full methodology discussion.

files_affected:
  added:
  - "results-explorer/src/components/MetaLeaderboard.tsx"
  - "results-explorer/public/data/meta_leaderboard.json (generated)"
  modified:
  - "benchbox/core/explorer/pipeline.py"
  - "results-explorer/src/pages/Home.tsx"

must_preserve:
- "Home page remains navigable - the meta-leaderboard is additive, not replacing global nav"
- "Recent Results section remains on the home page in a secondary position"
- "No invented composite scores - only transparent rank aggregation"

approach: |
  The pipeline already iterates through every bundle once. After the
  per-benchmark artifacts are built, iterate the in-memory accumulators
  again to compute ranks: for each cohort, sort by the cohort's primary
  metric and assign 1-based ranks. Aggregate across cohorts per engine.

  Frontend is a pure table render. No interactivity in the first cut -
  clicking a cohort header navigates to the matrix leaderboard for that
  cohort.

anti_patterns:
- "DO NOT invent a weighted composite score - because any weighting is indefensible and masks the inputs - use simple rank
  aggregation with all inputs visible"
- "DO NOT penalize platforms that didn't run a cohort - because missing data is not a loss - show N/A and exclude from that
  platform's average"
- "DO NOT include cohorts with only 1 platform - because rank is meaningless there - filter them out at pipeline time"
- "DO NOT hide the methodology panel behind a 'why' link - because the whole point is transparency - show it inline below
  the table"

scope_limit:
  only_modify:
  - "benchbox/core/explorer/pipeline.py"
  - "results-explorer/src/components/MetaLeaderboard.tsx"
  - "results-explorer/src/pages/Home.tsx"
  - "results-explorer/public/data/meta_leaderboard.json"

verification:
- description: "meta_leaderboard.json is emitted"
  command: "test -f results-explorer/public/data/meta_leaderboard.json && echo exists"
  expected_output: "exists"
- description: "Meta-leaderboard only includes cohorts with ≥2 platforms"
  command: "uv run -- python -c 'import json; d = json.load(open(\"results-explorer/public/data/meta_leaderboard.json\"));
    assert all(len(c[\"platforms\"]) >= 2 for c in d[\"cohorts\"])'"
  expected_output: "no assertion failure"
- description: "Home page renders MetaLeaderboard"
  command: "grep -n 'MetaLeaderboard' results-explorer/src/pages/Home.tsx"
  expected_output: "imported and rendered"
- description: "TypeScript compiles"
  command: "cd results-explorer && npm run typecheck"
  expected_output: "no errors"

metadata:
  tags: ["results", "explorer", "home", "meta-leaderboard", "differentiator"]
  estimated_effort: "Medium (1-2 days)"
  created_date: "2026-04-15"
