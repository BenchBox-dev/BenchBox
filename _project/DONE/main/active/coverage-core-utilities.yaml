  last_updated: "2026-02-07T13:30:00"

impact:
  business_value: |
    Zero-coverage modules represent the highest risk-to-effort ratio.
    Adding basic tests is cheap and prevents embarrassing regressions.
  technical_debt: |
    6 modules at 0% coverage. Each one is a blind spot where any change
    could silently break functionality.

must_preserve:
  - "All existing tests continue to pass"
  - "No changes to production code"

approach: |
  Start with zero-coverage modules since any test at all is progress.
  core/tpc_metrics.py likely has pure functions for metric calculation — test
  with known inputs/outputs. core/comparison/ is a self-contained comparison
  engine — test the comparison logic with mock result objects. For release/sync.py,
  mock filesystem and git operations. utils/lazy_loader.py is a module-level
  lazy import utility — test import mechanics.

anti_patterns:
  - "DO NOT test private implementation details — because private APIs can change without notice, breaking tests — test via public methods and documented interfaces only"
  - "DO NOT add tests that depend on filesystem state or network — because CI environments vary and network tests are flaky — mock I/O using unittest.mock or pytest tmp_path fixture"

verification:
  - description: "New tests pass"
    command: "uv run -- python -m pytest tests/unit/ -k 'tpc_metrics or comparison or platform_config or reports or sync or lazy_loader' -v"
    expected_output: "all tests pass, 0 failures"

success_metrics:
  - "All 6 zero-coverage modules reach ≥50% coverage"
  - "All low-coverage modules listed reach ≥50% coverage"

