  expected_output: "Updated per-file report shows each listed file at >=50%"
- description: "Fast/unit tests remain green for changed coverage areas"
  command: "uv run -- python -m pytest tests/unit -m 'fast or unit' -q"
  expected_output: "all tests pass, 0 failures"

