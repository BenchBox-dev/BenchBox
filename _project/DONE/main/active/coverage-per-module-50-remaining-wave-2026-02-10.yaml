impact:
  business_value: |
    Enforcing >=50% coverage on remaining low-coverage modules reduces
    regression risk across benchmark orchestration, reporting, query builders,
    and platform adapters that users rely on for reproducible results.
  technical_debt: |
    This closes the long tail after prior coverage waves by targeting the
    remaining exceptions in core, CLI, utils, and platform modules.

must_preserve:
- "benchbox CLI behavior and option parsing in run commands remains unchanged"
- "No live cloud access is required for unit tests (all cloud SDK behavior is mocked)"
- "Benchmark query generation semantics remain intact for TPC-H, TPC-DS, SSB, Amplab, NYC Taxi, and ClickBench"

approach: |
  Implement tests in focused batches by domain. Reuse existing fixture and
  mocking patterns in tests/unit/benchmarks/, tests/unit/core/, and
  tests/unit/platforms/. For dataframe_queries modules, validate representative
  query builder behavior (structure, required references, deterministic outputs)
  instead of asserting full SQL text equality. For cloud/platform modules,
  isolate credential parsing, request construction, and error mapping with
  mocks only.

anti_patterns:
- "DO NOT modify production code only to satisfy coverage targets — because this risks behavioral drift — add focused tests
  for existing behavior"
- "DO NOT write tests that require live databases or cloud credentials — because CI is offline for these integrations — mock
  network/client layers"
- "DO NOT assert entire generated SQL strings verbatim — because formatting churn creates brittle tests — assert key clauses,
  table refs, and parameter handling"

verification:
- description: "Coverage report runs in CI profile without regressions"
