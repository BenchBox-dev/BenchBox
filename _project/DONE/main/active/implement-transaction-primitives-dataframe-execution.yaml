approach: |
  Follow the metadata_primitives pattern for scaffolding (NOT write_primitives SQL
  parity), but with significant additional complexity for parameter sourcing and
  operation ordering.

  Why NOT metadata_primitives' uniform dispatch:
  metadata_primitives works with a simple loop because every execute_* method takes
  (dataframe) or (). Transaction primitives' 12 methods have heterogeneous signatures:
  execute_atomic_insert(table_path, dataframe), execute_atomic_update(table_path,
  condition, updates), execute_rollback_to_version(table_path, version), etc. A uniform
  getattr loop cannot provide the correct arguments.

  Recommended structure for execute_dataframe_workload:
  1. Setup: create Delta table from synthetic TPC-H data, record table_path
  2. Build an ordered list of (op_type, callable) pairs where each callable captures
     the correct arguments for that operation (e.g., via a helper method per operation
     or a dispatch dict with lambdas/partials)
  3. Filter by query_filter and manager.supports_operation()
  4. Execute in dependency order (writes before rollbacks/time-travel)
  5. Convert DataFrameTransactionResult → adapter dict format
  6. Teardown: clean up Delta table

  Why NOT SQL parity (DuckDB intermediary):
  Transaction semantics are platform-specific. Delta Lake RESTORE, Iceberg snapshot
  isolation, and PySpark conflict detection are the things being benchmarked. DuckDB
  would test its own transactions, not the target platform's.

  Semantic equivalence note:
  The SQL path runs 23 operations; the DataFrame path runs 12. These test equivalent
  ACID concepts through different mechanisms. Results are comparable at the category
  level (commit overhead, rollback, isolation), not at the individual operation level.
  This is by design - lakehouse transactions are fundamentally different from SQL
  BEGIN/COMMIT/ROLLBACK.

  The existing get_dataframe_operations() method (line 1060) validates the platform,
  creates the manager, and returns it. Use it as the entry point.

anti_patterns:
- DO NOT emit result rows without calling an operation method - because this is exactly the phantom-data defect from the
  prior attempt. Every result row must come from a real manager.execute_*() call with measured timing.
- DO NOT use a uniform getattr dispatch loop like getattr(manager, f"execute_{op.value}")() - because the 12 execute_*
  methods have heterogeneous signatures (2-5 params each, all different). execute_atomic_insert needs (table_path,
  dataframe), execute_atomic_update needs (table_path, condition, updates), execute_rollback_to_version needs
  (table_path, version). A uniform loop cannot provide correct arguments. Build an explicit dispatch map or
  per-operation helper.
- DO NOT call rollback/time-travel operations before write operations - because rollback needs version numbers created
  by prior writes, time_travel_query needs historical versions to exist, and version_compare needs two distinct
  versions. Operations must run in dependency order (writes first, then version ops, then concurrency/isolation ops).
- DO NOT skip table setup/teardown - because every execute_* method requires a table_path pointing to a real
  Delta/Iceberg table. The SQL path has staging tables created by setup(). The DataFrame path must create its own Delta
  table before operations and clean it up after.
- DO NOT use the SQL parity pattern (DuckDB intermediary) - because transaction semantics are platform-specific (Delta
  RESTORE, Iceberg snapshots). Routing through DuckDB tests DuckDB transactions, not the target platform's.
- DO NOT rename keyword parameters with underscore prefixes (_monitor, _run_options) - because the adapter passes them
  as keyword arguments by name. Renaming breaks the call site with TypeError. Use # noqa: ARG002 if linter complains.
- DO NOT flip supports_dataframe to True before execute_dataframe_workload is functional - because this is what the
  prior attempt did, creating a system that advertised a broken capability.
- DO NOT write tests that only verify object construction or config flags - because the prior attempt had 11 such tests
  and none caught the hollow implementation. Every test must verify execution behavior (method calls, non-zero times,
  correct result format).
- DO NOT assume 1:1 parity between SQL operations (23) and DataFrame operations (12) - because they test equivalent ACID
  concepts through different mechanisms. The SQL path tests BEGIN/COMMIT/ROLLBACK, savepoints, and isolation levels. The
  DataFrame path tests atomic writes, RESTORE, time travel, and snapshot isolation. Results are comparable at the
  category level, not the individual operation level.

verification:
- description: execute_dataframe_workload does not raise NotImplementedError
  command: >
    uv run -- python -c "
    from benchbox.core.transaction_primitives.benchmark import TransactionPrimitivesBenchmark;
    b = TransactionPrimitivesBenchmark();
    assert hasattr(b, 'execute_dataframe_workload');
    import inspect; src = inspect.getsource(b.execute_dataframe_workload);
    assert 'NotImplementedError' not in src, 'Still raises NotImplementedError';
    print('OK: execute_dataframe_workload has real implementation')
    "
  expected_output: "OK: execute_dataframe_workload has real implementation"
- description: execute_dataframe_workload calls get_dataframe_operations (source check)
  command: >
    uv run -- python -c "
    from benchbox.core.transaction_primitives.benchmark import TransactionPrimitivesBenchmark;
    import inspect; src = inspect.getsource(TransactionPrimitivesBenchmark.execute_dataframe_workload);
    assert 'get_dataframe_operations' in src, 'Does not delegate to get_dataframe_operations';
    print('OK: delegates to get_dataframe_operations')
    "
  expected_output: "OK: delegates to get_dataframe_operations"
- description: skip_dataframe_data_loading returns True
  command: >
    uv run -- python -c "
    from benchbox.core.transaction_primitives.benchmark import TransactionPrimitivesBenchmark;
    b = TransactionPrimitivesBenchmark();
    assert b.skip_dataframe_data_loading() is True;
    print('OK: skip_dataframe_data_loading returns True')
    "
  expected_output: "OK: skip_dataframe_data_loading returns True"
- description: Registry reports supports_dataframe True and num_queries 12
  command: >
    uv run -- python -c "
    from benchbox.core.benchmark_registry import BENCHMARK_REGISTRY;
    entry = BENCHMARK_REGISTRY['transaction_primitives'];
    assert entry['supports_dataframe'] is True, f'supports_dataframe={entry[\"supports_dataframe\"]}';
    assert entry['num_queries'] == 12, f'num_queries={entry[\"num_queries\"]}, expected 12';
    print('OK: supports_dataframe is True, num_queries is 12')
    "
  expected_output: "OK: supports_dataframe is True, num_queries is 12"
- description: Behavioral tests pass (not just instantiation tests)
  command: uv run -- python -m pytest tests/unit/core/transaction_primitives/test_dataframe_workload.py -v
  expected_output: all tests pass, 0 failures
- description: Existing operations manager tests still pass
  command: uv run -- python -m pytest tests/unit/core/transaction_primitives/ -v
