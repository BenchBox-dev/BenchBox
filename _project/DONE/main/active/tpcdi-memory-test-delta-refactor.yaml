id: tpcdi-memory-test-delta-refactor
title: "Refactor TPC-DI memory validation to check growth (delta) instead of absolute RSS"
worktree: main
priority: High
status: Completed
completed_date: "2026-03-27"
category: Testing & Quality
description: |
  The TPC-DI scalability test's memory assertion checks absolute process RSS:

    max_memory_mb = 1000 * scale_factor + 2000
    assert metrics["peak_memory_mb"] <= max_memory_mb

  This was raised from 600 MB to 2000 MB base in commit 8c0ddcb46 because observed
  absolute RSS at SF 0.01 was 1943 MB - xdist workers, loaded modules, and pandas
  internals dominate the measurement, not the benchmark itself.

  The problem: absolute RSS is immune to memory leaks. A 300 MB regression at SF 0.01
  would push actual usage to ~2243 MB, which still passes the 2010 MB ceiling (since
  ceiling is 1000*0.01 + 2000 = 2010 MB). The test no longer catches regressions.

  The fix is already 90% done: `memory_growth_mb = peak_memory - start_memory` is
  already computed and stored in performance_results[scale_factor] at line 144 of
  test_multi_scale_factor_performance_analysis. The validation method at line 301
  just ignores it, checking peak_memory_mb instead.

  Switching to delta restores regression sensitivity: the baseline process RSS
  (1800-2000 MB of OS/Python/xdist overhead) is subtracted out, leaving only the
  memory actually allocated by the benchmark. A tight ceiling on growth catches leaks
  without being affected by CI environment variability.

metadata:
  tags:
    - testing
    - performance
    - tpcdi
    - memory
    - regression-detection
  estimated_effort: "Small - validation method change + one calibration run to pick threshold"
  created_date: "2026-03-27"
  related_commits:
    - "8c0ddcb46 - raised absolute RSS threshold 600→2000 MB, which is what this TODO fixes"

work:
  - id: w1
    summary: "Run a calibration pass to observe actual memory_growth_mb values across scale factors"
    status: done
    notes: |
      Add a temporary print to _validate_performance_thresholds to emit memory_growth_mb
      for each scale factor, then run the test:
        uv run -- python -m pytest tests/performance/test_tpcdi_scalability.py::TestTPCDIScalabilityPerformance::test_multi_scale_factor_performance_analysis -n 0 -s -v
      Record actual delta values at SF 0.01, 0.1, 0.5, 1.0 to inform threshold selection.
      Expected: growth should be O(10s of MB) for data generation + ETL, much less than
      the 1943 MB absolute RSS that forced the current ceiling.

  - id: w2
    summary: "Replace peak_memory_mb assertion with memory_growth_mb and calibrated threshold"
    needs: [w1]
    status: done
    notes: |
      In _validate_performance_thresholds (line ~301), change:
        max_memory_mb = 1000 * scale_factor + 2000
        assert metrics["peak_memory_mb"] <= max_memory_mb
      to:
        max_growth_mb = 1000 * scale_factor + {calibrated_base}
        assert metrics["memory_growth_mb"] <= max_growth_mb
      Set {calibrated_base} to observed maximum growth + 2x headroom from w1 results.
      Also update the print statement on line 312:
        print(f"  Memory: {metrics['peak_memory_mb']:.1f}MB ✅")
      to report growth_mb instead of peak_mb, for clearer test output.

must_preserve:
  - "memory_growth_mb key continues to exist in performance_results dict (used by _save_performance_baseline)"
  - "peak_memory_mb key remains in performance_results (other methods may reference it)"
  - "All four scale factors (0.01, 0.1, 0.5, 1.0) continue to be tested"
  - "No changes to data collection logic in test_multi_scale_factor_performance_analysis - only _validate_performance_thresholds changes"

approach: |
  The change is entirely in _validate_performance_thresholds. The data collection loop
  already captures start_memory and peak_memory and computes the delta - no changes
  needed there. Only the assertion and the threshold formula change.

  Calibrate threshold conservatively: observed_max_growth * 2 rounded up to nearest
  50 MB, with a minimum floor of 100 MB to prevent spurious failures on very fast
  machines with aggressive GC.

anti_patterns:
  - "DO NOT remove peak_memory_mb from performance_results - because _save_performance_baseline may use it and callers outside this method may depend on it - only change the assertion"
  - "DO NOT pick a threshold without a calibration run first -- because guessing will either re-create the loose-threshold problem or cause spurious CI failures -- always observe before asserting"
  - "DO NOT merge the calibration print into production code -- because debug prints in test output are noise -- remove the temporary print before committing w2"

verification:
  - description: "No assert still references peak_memory_mb"
    command: "grep -c 'assert.*peak_memory_mb' tests/performance/test_tpcdi_scalability.py"
    expected_output: "0"
  - description: "Exactly one assert now references memory_growth_mb"
    command: "grep -c 'assert.*memory_growth_mb' tests/performance/test_tpcdi_scalability.py"
    expected_output: "1"
  - description: "Test passes at all scale factors without flakiness"
    command: "uv run -- python -m pytest tests/performance/test_tpcdi_scalability.py::TestTPCDIScalabilityPerformance::test_multi_scale_factor_performance_analysis -n 0 -v"
    expected_output: "1 passed"
  - description: "No regression in broader performance test suite"
    command: "uv run -- python -m pytest tests/performance/test_tpcdi_scalability.py -n 0 -q"
    expected_output: "All tests pass"

scope_limit:
  only_modify:
    - "tests/performance/test_tpcdi_scalability.py"
