  reason: "Too destructive for UAT automation. Keep `docker system prune` / `docker builder prune` as explicit user-approved
    recovery commands outside this item."
- summary: "Cleanup of externally managed Docker stacks"
  reason: "Deleting volumes from stacks UAT did not start can destroy developer data. This item uses UAT-owned stack lifecycle;
    any external-cleanup mode needs a separate explicit approval and design."
- summary: "Cloud-platform lifecycle cleanup"
  reason: "Cloud UAT is deferred elsewhere; this item is only for local Docker-backed platforms."
- summary: "Moving Docker lifecycle management into platform adapters"
  reason: "Adapters should connect to a platform, not own local infrastructure lifecycle; UAT is the developer harness that
    knows the sweep boundary."

