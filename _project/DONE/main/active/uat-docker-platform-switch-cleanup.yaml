must_preserve:
- "Sequential platform execution remains mandatory; do not add parallel platform execution or async Docker lifecycle behavior."
- "Existing TPC-H/TPC-DS source-consumer database reuse remains intact; Docker teardown happens at platform boundaries, not
  per cell."
- "Generated datagen under `~/Developer/benchmark_runs/datagen/` remains preserved unless a separate explicit cleanup policy
  is approved."
- "Non-Docker and DataFrame platform UAT behavior stays unchanged except for shared free-space guardrails."
- "Benchmark cell elapsed time remains the `benchbox run` subprocess duration; Docker startup/teardown is UAT overhead, not
  query timing."
- "Docker cleanup targets only UAT-owned compose projects by default; user-managed developer stacks are not stopped or pruned."
- "Externally managed Docker stacks keep current probe/skip behavior unless a separate explicitly approved external cleanup
  mode is designed."

anti_patterns:
- "DO NOT use `docker system prune`, `docker volume prune`, `docker image prune`, or `docker builder prune` from automated
  UAT."
- "DO NOT run `docker compose down -v` without an explicit UAT-owned `-p <project>` name in automated cleanup."
- "DO NOT allow `docker_platform_switch: volumes` or `images` while `docker_manage_platforms: false`; that is a no-op or unsafe
  external deletion."
- "DO NOT add new YAML fields that are not read by both `uat-sweep` and `uat-execute` paths."
- "DO NOT assume compose project names isolate platforms whose compose files declare fixed `container_name`; audit and handle
  those explicitly."
- "DO NOT put Docker lifecycle commands in platform adapters or `benchbox run`; this is UAT harness behavior."
- "DO NOT tear Docker down after each cell; that breaks same-platform reuse and increases timing noise."
- "DO NOT silently swallow cleanup failures; surface them in logs and phase outcomes while still attempting best-effort teardown."

scope_limit:
  only_modify:
  - "tests/uat/docker_assets.py"
  - "tests/uat/cleanup.py"
  - "tests/uat/config.py"
  - "tests/uat/phases/execute.py"
  - "tests/uat/phases/preflight.py"
  - "tests/uat/orchestrator.py"
  - "tests/uat/_cli.py"
  - "tests/uat/test_*.py"
  - "tests/uat/configs/*.yaml"
  - "docs/operations/uat-framework.md"
  - "tests/uat/README.md"
