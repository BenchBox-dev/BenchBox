impact:
  business_value: |
    Simplifies installation, especially in containerized/CI environments where
    Kaleido's Chrome dependency causes failures. Reduces install size by ~50MB+.
  user_impact: |
    Users lose PNG/SVG/PDF export but retain interactive HTML charts. HTML works
    universally and provides better interactivity (hover, zoom, pan). Users
    needing static images can use browser screenshot or print-to-PDF.
  technical_debt: |
    Removes unused dependencies (Pandas, Pillow) and problematic dependency
    (Kaleido). Simplifies codebase by removing conditional Kaleido logic.

