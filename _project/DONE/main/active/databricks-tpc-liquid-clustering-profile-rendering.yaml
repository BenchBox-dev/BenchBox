impact:
  user_impact: |
    Databricks benchmark users can run and interpret modern Liquid Clustering
    TPC tuning without losing comparability with legacy Z-ORDER or other
    platforms.
  maintainer_impact: |
    Prevents Databricks-specific physical layout behavior from leaking into the
    platform-neutral TPC profile and gives future platform mappings a clearer
    rendering contract.
  comparison_integrity: |
    Avoids grouping Z-ORDER, Liquid Clustering, auto-selected Liquid keys, and
    basic fallback configs under an undifferentiated `tuned` label.

