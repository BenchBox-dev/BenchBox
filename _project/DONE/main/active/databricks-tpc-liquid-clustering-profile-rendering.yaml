must_preserve:
- "The logical TPC profile remains platform-neutral; Databricks is one renderer, not the source of truth."
- "Existing Databricks Z-ORDER tuned templates remain available for legacy strategy comparisons unless a migration is explicitly
  approved."
- "Liquid Clustering, Z-ORDER, and basic-constraints fallback are distinguishable in result metadata and comparison semantics."
- "DuckDB tuned templates and mappings remain free of Databricks vocabulary such as Z-ORDER or Liquid Clustering."
- "No live Databricks/cloud tests run without explicit user approval."
- "No result metadata claims a tuning mechanism was applied unless BenchBox attempted and recorded that operation."
- "New routine tests carry explicit `unit` and `fast` pytest markers."

approach: |
  Treat Databricks Liquid Clustering as a strategy-aware physical rendering of
  the existing logical TPC profile. First revalidate current Databricks docs and
  BenchBox execution order, then model rendering ids and mechanism semantics in
  the profile validation layer. Add Liquid-specific templates or generated
  artifacts only after conflict validation is explicit. Finally, wire result
  metadata and tests so comparisons cannot collapse Z-ORDER, Liquid, and
  fallback tuning into one misleading `tuned` bucket.

  Prefer small, reviewable layers:
    1. strategy-aware mapping data model;
    2. Databricks Liquid template/rendering artifacts;
    3. config and adapter conflict validation;
    4. lifecycle/operation metadata correctness;
    5. docs and comparison semantics.

anti_patterns:
- "DO NOT silently rename or reinterpret existing Databricks TPC tuned YAMLs as Liquid Clustering; that would change historical
  comparison semantics."
- "DO NOT report Databricks `distribution` as a real physical distribution key; Databricks distribution candidates are logical
  locality evidence."
- "DO NOT allow Liquid Clustering and Z-ORDER fields in the same effective config without a hard validation error or a documented
  explicit waiver."
- "DO NOT keep hardcoding Databricks profile mechanisms to `z_order`; the mapping must depend on the selected physical rendering."
- "DO NOT claim cross-platform performance equivalence from logical profile coverage alone."
- "DO NOT add broad automatic template rewriting before validation and golden tests can prove every emitted field."

