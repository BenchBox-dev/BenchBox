anti_patterns:
- "DO NOT add @pytest.mark.slow, @pytest.mark.live_integration, or @pytest.mark.resource_heavy markers — because those markers
  cause tests to be excluded from the fast lane and won't count toward the 80% coverage gate — use only @pytest.mark.fast"
- "DO NOT import or instantiate real cloud SDK clients in tests — because CI has no cloud credentials and live calls cause
  flakiness and violate the fast-lane contract — mock all external SDK calls with unittest.mock.patch"
- "DO NOT use -o 'addopts=' to override pytest.ini — this strips -n auto and makes tests 10x slower"
- "DO NOT call list() on color_cycle() return values — color_cycle() returns an infinite itertools.cycle; use list(theme.palette
  or DEFAULT_PALETTE) instead"
- "DO NOT modify production source files to make them more testable — because changes to production code require their own
  review cycle and could introduce regressions that dwarf the coverage gain — only add/extend test files"
- "DO NOT batch all 25 modules into a single test file — because monolithic test files make coverage diffs unreadable and
  slow down targeted reruns — keep per-module or per-group test files aligned with existing test directory structure"

