  command: "cd results-explorer && npm test -- chartTheme"
  expected_output: "all tests pass"
- description: "Compare tests pass with new cases"
  command: "cd results-explorer && npm test -- Compare"
  expected_output: "all tests pass"
- description: "Full test suite green"
  command: "cd results-explorer && npm run typecheck && npm test"
  expected_output: "all green"

