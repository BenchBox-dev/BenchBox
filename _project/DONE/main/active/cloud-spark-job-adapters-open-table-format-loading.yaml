id: cloud-spark-job-adapters-open-table-format-loading
title: "Close open-table-format loading gaps for job-based managed Spark adapters"
worktree: main
priority: Medium-High
status: Completed
completed_date: "2026-03-23"
description: |
  Several managed Spark adapters do not use SparkDataLoadMixin for data loading and
  therefore are not covered by spark-mixin-open-table-format-loading.

  This item covers the job/staging-based adapters whose loading is implemented through
  platform-specific upload and remote table-registration flows:
  - emr-serverless
  - dataproc
  - dataproc-serverless
  - athena-spark

  The goal is to make Delta/Iceberg/Hudi selectable and executable end-to-end for the
  adapters above, not merely to add capability-table entries.

category: Platform Expansion

deps:
  needs:
    - spark-mixin-open-table-format-loading

work:
  - id: w1
    summary: "Audit each adapter's actual load path and supported remote table-registration mechanism"
    status: done
  - id: w2
    summary: "Implement Delta/Iceberg/Hudi loading or explicit per-format rejection for emr-serverless"
    needs: [w1]
    status: done
  - id: w3
    summary: "Implement Delta/Iceberg/Hudi loading or explicit per-format rejection for dataproc and dataproc-serverless"
    needs: [w1]
    status: done
  - id: w4
    summary: "Implement Delta/Iceberg loading or explicit per-format rejection for athena-spark"
    needs: [w1]
    status: done
  - id: w5
    summary: "Re-register only the adapters with verified end-to-end support in format_capabilities.py"
    needs: [w2, w3, w4]
    status: done
  - id: w6
    summary: "Add adapter-specific unit tests covering remote registration SQL/config generation"
    needs: [w2, w3, w4]
    status: done

must_preserve:
  - "Existing parquet/native loading paths for all four adapters"
  - "Capability registration must remain conservative until verified end-to-end"

verification:
  - description: "Managed Spark adapter tests pass"
    command: "uv run -- python -m pytest tests/unit/platforms/ -v -k 'emr or dataproc or athena_spark' --no-header -q"
    expected_output: "All tests pass"
  - description: "Format capability tests pass after any re-registration"
    command: "uv run -- python -m pytest tests/unit/platforms/base/test_format_capabilities.py -v --no-header -q"
    expected_output: "All tests pass"

scope_limit:
  only_modify:
    - "benchbox/platforms/aws/emr_serverless_adapter.py"
    - "benchbox/platforms/gcp/dataproc_adapter.py"
    - "benchbox/platforms/gcp/dataproc_serverless_adapter.py"
    - "benchbox/platforms/aws/athena_spark_adapter.py"
    - "benchbox/platforms/base/format_capabilities.py"
    - "tests/unit/platforms/"
