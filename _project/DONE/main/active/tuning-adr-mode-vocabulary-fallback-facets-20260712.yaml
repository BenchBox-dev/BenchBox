open_questions:
  - question: "Does a template-less tuned run keep the 'tuned' label?"
    gating: true
    affects: [w2]
    default: "No - distinct mode value; refuse under --official"
    resolved_with: "Adopted default: distinct mode value `tuned-fallback`; refused under --official. See docs/development/tuning-adr-002-mode-vocabulary-fallback-facets.md."
  - question: "Do two 'tuned' runs on different platforms facet-match regardless of physical mechanisms?"
    gating: true
    affects: [w2]
    default: "Coarse facet keeps matching; receipt warns on disjoint mechanism sets; physical_rendering_id becomes a secondary facet for TPC"
    resolved_with: "Adopted default: coarse facet keeps exact-match semantics; ComparabilityReceipt warns on disjoint mechanism sets; physical_rendering_id promoted to a secondary matchable facet for TPC. See docs/development/tuning-adr-002-mode-vocabulary-fallback-facets.md."

