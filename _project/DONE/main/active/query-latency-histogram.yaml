id: query-latency-histogram
title: "Query Latency Histogram Visualization"
worktree: main
priority: Medium
status: Completed
completed_date: "2026-02-05"
category: Core Functionality
description: |
  Add a new "query latency histogram" chart type that displays one vertical bar per query,
  showing the execution latency for each query. This provides a quick visual overview of
  query performance distribution across a benchmark run.

  When more than ~33 queries are graphed, the visualization should automatically split
  into multiple charts to maintain readability. This is particularly useful for TPC-DS
  (99 queries) where a single chart would be too dense.

context_sections:
  "Background and Motivation": |
    Current visualizations show aggregate metrics (geometric mean, distributions) but
    lack a simple per-query latency overview. Users often want to quickly identify:

    1. Which queries are slowest/fastest
    2. The latency distribution pattern across all queries
    3. Outliers that may need optimization
    4. Query-by-query comparison across platforms

    A vertical bar histogram with one bar per query provides immediate visual insight
    into these patterns.

  "Technical Context": |
    **Existing Visualization Infrastructure:**
    - Core module: `benchbox/core/visualization/`
    - ASCII charts: `benchbox/core/visualization/ascii/`
    - Plotly charts: `benchbox/core/visualization/charts.py`
    - Data types: `BarDatum`, `DistributionSeries` in `types.py`

    **Similar Existing Charts:**
    - `PerformanceBarChart` - horizontal bars for platform comparison
    - `ASCIIBarChart` - ASCII version of performance bar chart
    - Query heatmap - shows per-query data but in grid format

    **Pagination Precedent:**
    - Query heatmap has column truncation for wide datasets
    - ASCII charts have width constraints (40-120 chars)

  "Design Considerations": |
    1. **Vertical vs Horizontal Bars**: Vertical bars work better for many items
       (queries) since labels can be rotated or abbreviated (Q1, Q2, ...)
    2. **Multi-Chart Splitting**: When queries > 33, emit multiple charts with
       clear labeling (e.g., "Queries 1-33", "Queries 34-66", "Queries 67-99")
    3. **Sorting Options**: By query ID (natural order) or by latency (ranked)
    4. **Platform Comparison**: Optional grouped bars for multi-platform comparison

