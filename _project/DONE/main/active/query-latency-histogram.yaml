impact:
  business_value: |
    Provides immediate visual insight into per-query performance without needing
    to parse tables or heatmaps. Especially valuable for TPC-DS (99 queries) and
    ClickBench (43 queries) where query-level patterns matter.

  user_impact: |
    Users can quickly spot slow queries and performance patterns. The automatic
    multi-chart splitting ensures readability even for large benchmark suites.

