id: ddl-dialect-policy-migration
title: "Migrate residual literal-dialect policy out of metadata_primitives/ddl.py rendering into sql_compat capability data"
worktree: main
priority: Medium
status: Completed
completed_date: "2026-06-28"
category: Code Quality and Technical Debt

description: |
  The sql_compat capability engine has largely replaced ddl.py's dialect if/elif
  chains (type dispatch is now table-driven via get_type_mapping(), down from ~13
  branches to ~2). But residual literal-dialect policy remains inside DDL RENDERING
  functions:
    - ddl.py:296  if dialect.lower() not in ("snowflake", "bigquery")  (map column)
    - ddl.py:351  if pk_columns and dialect.lower() not in ("clickhouse", "doris")
    - ddl.py:390  if dialect.lower() == "bigquery" / elif "clickhouse"  (view syntax)
  These hardcode dialect names in the rendering path rather than resolving through a
  capability table. They are the residual tail of the sql_compat migration.

  Move this policy into the existing sql_compat capability predicates/data
  (supports_complex_types, supports_foreign_keys, supports_views already exist) so
  the DDL rendering functions carry no literal dialect names.

prior_art:
- ref: "benchbox/core/metadata_primitives/ddl.py:173"
  note: "get_type_mapping() - the data-driven pattern the residual branches should follow."
- ref: "benchbox/core/metadata_primitives/ddl.py:522, :535, :550"
  note: "supports_complex_types / supports_views / supports_foreign_keys predicates - extend these (or the sql_compat table
    behind them) to cover map-column, PK, and view-syntax policy."
- ref: "benchbox/sql_compat/ (registry.py, decision.py, resolver.py, inventory.py)"
  note: "The capability engine that owns dialect-specific data; add the map/PK/view-syntax policy here, do not re-add if/elif
    to ddl.py."

work:
- id: w1
  summary: "Resolve map-column, PK, and view-syntax policy via capability data, not literal dialect names"
  status: done
  needs: []
  notes: |
    Replace the three literal-dialect branches (ddl.py:296/351/390) with capability
    lookups: map-column support, primary-key-clause support, and view-syntax
    variant resolved from one sql_compat table/registry. Keep the rendered DDL
    byte-identical for every current dialect (this is a refactor, not a behavior
    change).

- id: w2
  summary: "Add a rendering-scoped no-literal-dialect-names test"
  status: done
  needs: [w1]
  notes: |
    Add a test scoped to the DDL RENDERING functions asserting they contain no
    literal dialect-name policy (assert behavior via capability data and a snapshot
    of rendered DDL per dialect). Do NOT use a blunt module-wide
    grep 'dialect.lower()' -> 0 ratchet: capability-table internals may legitimately
    reference dialect keys; the smell is literal dialect policy in the RENDERING
    path, not anywhere in the module.

must_preserve:
- "Rendered DDL is byte-identical for every currently-supported dialect (snapshot before/after)."
- "sql_compat capability semantics are reused/extended, not duplicated."

anti_patterns:
- "DO NOT re-add dialect if/elif to the rendering functions - the whole point is to retire them into capability data."
- "DO NOT enforce a module-wide grep->0 ratchet that would forbid legitimate capability-table dialect keys."

verification:
- description: "DDL unchanged per dialect; rendering carries no literal dialect policy"
  command: "uv run -- python -m pytest tests/unit/core/metadata_primitives/test_ddl.py -q"
  expected_output: "rendered DDL byte-identical per dialect (snapshot); rendering-scoped no-literal-dialect test passes"

scope_limit:
  only_modify:
  - "benchbox/core/metadata_primitives/ddl.py"
  - "benchbox/sql_compat/"
  - "tests/"

success_metrics:
- "DDL rendering functions contain no literal dialect-name policy; map/PK/view-syntax decisions live in sql_compat capability
  data."

metadata:
  tags: [sql-compat, ddl, technical-debt, refactor]
  estimated_effort: "Medium"
