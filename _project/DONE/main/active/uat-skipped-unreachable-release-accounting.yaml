id: uat-skipped-unreachable-release-accounting
title: "Account for skipped/unreachable UAT cells in release-report candidate counts (release-evidence integrity)"
worktree: main
priority: High
status: Completed
category: Release Tooling
completed_date: "2026-06-28"

description: |
  UAT records skipped and unreachable cells, but the release report's candidate
  counts do not fully represent them - so a release can look more complete than it
  is. When skipped/unreachable cells silently shrink the denominator, a "passed N
  of N" summary reads as full coverage when some cells never actually ran. That is
  a release-evidence integrity problem, not a cosmetic one: the report is the
  artifact a release decision is made against.

  Audit the UAT report/validate accounting so skipped and unreachable cells appear
  as explicit, reconciling denominators (e.g. passed / attempted / total-defined,
  with skipped and unreachable broken out), and a non-zero unreachable count is
  surfaced loudly in the summary rather than quietly absorbed.

prior_art:
  - ref: "tests/uat/_cli.py (the `report` and `validate` subcommands; make uat-report runs `python -m tests.uat._cli report`, Makefile:1886)"
    note: "The actual report/validate generator whose accounting must reconcile; reuse its existing JSONL cell records and TSV emitter, do not add a parallel reporter."
  - ref: "Makefile:1881 (uat-report), :1870 (uat-validate)"
    note: "The make entry points wrapping tests/uat/_cli; CELLS_JSONL/OUTPUT_TSV contract stays unchanged."
  - ref: "_project/ UAT charter (#729: 'release-gate orchestration, not certification', Path A)"
    note: "The charter this report serves; counts must support a release-GATE decision, so unreachable cells must be visible, not hidden."

work:
  - id: w0
    summary: "Reproduce and characterize the undercount with a fixture (re-validate the claim)"
    status: done
    needs: []
    notes: |
      Build a small fixture CELLS_JSONL of UAT cell records with N defined cells, K
      skipped, U unreachable, P passed, F failed. Run `python -m tests.uat._cli
      report` over it and record exactly how skipped/unreachable cells are
      counted (or dropped) today - specifically whether they fall out of the
      denominator.
      Commit a compact summary (command, inputs, observed totals, the SHA reviewed:
      develop @ cb49cecf5) so the defect is pinned before the fix. This re-validates
      the description's claim rather than assuming it.

  - id: w1
    summary: "Make report totals reconcile and surface unreachable loudly"
    status: done
    needs: [w0]
    notes: |
      Update the report/validate accounting so the summary reports passed /
      attempted / total-defined with skipped and unreachable broken out as explicit
      lines that reconcile to total-defined (passed + failed + skipped + unreachable
      == total-defined). A non-zero unreachable count must appear prominently in the
      summary (not only in a detail row). Do not change what counts as pass/fail;
      only fix denominator representation and visibility.

  - id: w2
    summary: "Regression test the reconciliation"
    status: done
    needs: [w1]
    notes: |
      Add a test on the report generator asserting totals reconcile for the w0
      fixture and that U>0 is flagged in the summary output. Keep it fast and
      fixture-driven (no live UAT run).

must_preserve:
  - "Pass/fail classification of cells is unchanged; only the denominator representation and visibility change."
  - "Existing UAT report consumers (TSV columns) keep working; add columns/lines rather than renaming existing ones unless necessary."

verification:
  - description: "Totals reconcile and unreachable is surfaced"
    command: "uv run -- python -m pytest tests/uat/test_report_accounting.py -q"
    expected_output: "passed+failed+skipped+unreachable == total-defined; U>0 flagged in summary"

scope_limit:
  only_modify:
    - "tests/uat/"
    - "tests/"

success_metrics:
  - "A UAT report with skipped/unreachable cells shows a denominator that reconciles to total-defined."
  - "A release reviewer cannot mistake a partially-run sweep for full coverage."

metadata:
  tags: [uat, release, evidence-integrity, reporting]
  estimated_effort: "Medium"
  created_date: "2026-06-28"
  last_updated: "2026-06-28T00:00:00"
