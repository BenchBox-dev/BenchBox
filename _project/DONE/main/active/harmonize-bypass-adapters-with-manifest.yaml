    Recent commits a1bc0dba2 / d24ced0a3 / a7acce14b plus uncommitted
    working-tree edits fixed 13 distinct SingleStore data-loading errors
    against live SingleStore 9.1.1 in Docker. Each fix was correct in
    isolation but landed in singlestore.py — duplicating logic that
    PostgreSQL, Doris, and QuestDB also need (and partially have, in
    drifting forms). Specifically:

      - OPTIONALLY ENCLOSED BY '"' (datavault quoted strings) — adapter-only.
      - NULL DEFINED BY '' for .tbl/.dat only — should be dialect.null_marker.
      - csv_normalize_booleans for TPC-DI — should be manifest metadata.
      - csv_has_header detection — should be manifest metadata.
      - is_zst suffix compare → CompressionManager → should be FileFormatRegistry.
      - should_strip_trailing suffix walk — should be one helper, used by all.

    The harmonization preserves the bug fixes but moves them to the layer
    where they actually belong, so the next platform adapter (Velox, etc.)
    inherits them for free instead of needing its own band-aid round.

