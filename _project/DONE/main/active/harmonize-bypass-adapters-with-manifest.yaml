  reason: |
    Those adapters use ``DataSourceResolver`` already and are not currently
    broken. Whether they should consume ``table_metadata`` (for tighter
    contracts) or keep the current ``getattr(benchmark, ...)`` fallback can
    be decided once this work has bedded in. Out of scope for this PR.

- summary: "DDL transform consolidation (FK strip, etc.) into shared helpers"
  reason: |
    DDL is genuinely platform-specific (SHARD vs DUPLICATE vs DISTRIBUTED
    KEY etc.) and prior audit confirmed adapters intentionally diverge.
    Not the same problem class as data-loading.

- summary: "Cloud / remote-storage manifests"
  reason: |
    ``ManifestFileSource`` already handles cloud paths; cloud-using
    adapters (Snowflake, Athena, BigQuery, Redshift) already use
    ``DataSourceResolver`` and don't need migration. Out of scope.

