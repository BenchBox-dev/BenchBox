approach: |
  Reuse, do not invent. The framework already has the right shapes — the
  bypass adapters just don't consult them. Concretely:

  - DataSource extension follows the same idiom DataSourceResolver already
    uses for table_formats: default factory + injection at resolve() time
    so all three providers (BenchmarkTablesSource, BenchmarkImplTablesSource,
    ManifestFileSource) yield the same shape.
  - resolve_csv_dialect() precedence (manifest > benchmark > defaults)
    mirrors how table_formats already work: manifest is authoritative,
    benchmark attributes are fallback for legacy paths.
  - prepare_local_load_file() is a thin wrapper around the existing
    CompressionHandler family; it does not duplicate that logic, it
    composes it with TPC-specific transforms.
  - Adapter migration follows the working-tree pattern from singlestore.py
    that already replaced ZstdCompressor with CompressionManager — but lifts
    ONE level higher to FileFormatRegistry.get_compression_handler().
  - Sequential migration with hard gates: SingleStore is the canary because
    it has the most band-aids and the most stress-test coverage. If
    SingleStore goes green, the same pattern works for the others.

  Reference implementations to copy from:
  - DuckDB adapter (benchbox/platforms/duckdb.py:784) for canonical
    DataLoader use.
  - DelimitedFileHandler (benchbox/platforms/base/data_loading.py:752) for
    the pattern of consulting compression_handler then schema_inspector
    then row_processor.

anti_patterns:
- "DO NOT walk path.suffixes in adapter code — because it duplicates the same logic in three places already and keeps drifting
  — call get_data_extension() once in file_format.py."
- "DO NOT detect compression by suffix string compare (data_file.suffix.lower() == '.zst') — because it silently ignores .gz
  and any future format — call FileFormatRegistry.get_compression_handler(file_path)."
- "DO NOT raise on unannotated benchmarks — because that breaks every TPC benchmark on day one — emit logger.warning naming
  the unannotated table, fall back to format-derived defaults, keep going."
- "DO NOT revert prior fix commits (a1bc0dba2, d24ced0a3, a7acce14b) — because the bug fixes themselves were correct, only
  the layer was wrong — move the logic up, don't lose the fix."
- "DO NOT change DDL transforms (FK strip, SHARD KEY, DUPLICATE KEY) — because each platform genuinely needs different DDL
  and prior audit confirmed intentional divergence — leave them where they are."
- "DO NOT touch TPC-style generators (tpch, tpcds, ssb, datavault) to add metadata — because resolve_csv_dialect() derives
  the right defaults from format=='tbl'/'dat' — annotating them adds noise without information."
- "DO NOT batch all four adapter migrations into one commit — because if one regresses, the others are stuck behind it — commit
  per adapter with the per-platform Docker stress check between each."

