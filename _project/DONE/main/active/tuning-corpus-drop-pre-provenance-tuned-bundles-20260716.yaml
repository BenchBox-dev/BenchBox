    notes: "Reuse the sweep logic (execution.tuning_mode == 'tuned') to build the removal list; commit the deletion with the list in the commit body."
    status: pending
    needs: []
  - id: w2
    summary: "Re-run explorer ingest over the remaining corpus; verify counts (expect 0 tuned, ~203 not-recorded)"
    status: pending
    needs: [w1]
  - id: w3
    summary: "Record the decision + regeneration path in results-data docs/README"
    notes: "Note that tuned corpus cells should be regenerated post-#1176/#1180 on live platforms; list the affected platform/benchmark cells so regeneration has a checklist."
    status: pending
    needs: [w1]

