  - concurrency
  estimated_effort: Medium
  created_date: "2026-02-11"
  last_updated: "2026-02-11T00:00:00"

impact:
  business_value: |
    DataFusion is a first-class local platform path. Failing primitive benchmarks
    damages confidence in cross-platform benchmark correctness and parity claims.
  user_impact: |
    Users running DataFusion currently observe widespread write-primitives setup
    failures and read-primitives map-query failures. Fixing this restores expected
    benchmark execution behavior for common commands.
  technical_debt: |
    This work removes adapter API mismatches and replaces fragile SQL assumptions
    with explicit dialect handling and minimal concurrency safety around shared
    working directories.

must_preserve:
- "Base adapter reuse/recreate flow in `benchbox/platforms/base/adapter.py` remains the single source of truth for database
  lifecycle decisions"
- "Existing DuckDB/PostgreSQL/SQLite write-primitives setup behavior remains unchanged"
- "Read-primitives catalog variant and skip_on semantics in `benchbox/core/read_primitives/catalog/loader.py` and `benchbox/core/read_primitives/queries.py`
  remain backward compatible"
- "DataFusion benchmark commands that already pass (for non-map read queries) continue to run without regression"

approach: |
  Follow existing shared-pattern boundaries:

  1) For write-primitives table-existence checks, introduce/reuse a small shared
  SQL execution compatibility helper (execute-or-sql fallback) that can be used
  by benchmark setup code without encoding DataFusion-specific logic in multiple
  call sites. Keep the fallback narrow and deterministic.

  2) For read-primitives map queries, implement DataFusion-specific `variants`
  SQL in `queries.yaml` rather than broad skips, using syntax validated against
  the installed DataFusion SQL dialect. Keep the default query text intact for
  other platforms.

  3) For concurrent working-dir cleanup, apply the minimum fix around DataFusion
  directory delete/recreate paths (lock file or equivalent scoped mutex) and
  preserve existing database reuse checks so compatible data is reused rather than
  always recreated.

  4) Add focused unit/integration regression tests that assert parity behavior
  (equivalent execution intent, not necessarily identical timings).

anti_patterns:
- "DO NOT hardcode `if platform == datafusion` branches at every write-primitives call site — because this duplicates connection
  handling logic — centralize execution compatibility in one helper path"
- "DO NOT solve map-query failures by globally skipping map category on DataFusion — because parity requires equivalent behavior
  — add DataFusion variants with validated syntax"
- "DO NOT bypass base adapter lifecycle with ad-hoc cleanup in benchmark code — because reuse and compatibility checks already
  live in shared adapter flow — integrate minimal locking at the adapter boundary"
- "DO NOT force `force_recreate=True` as a race workaround — because it destroys reuse effectiveness — serialize destructive
  cleanup only when needed"

verification:
- description: "Write-primitives setup check uses DataFusion-compatible SQL execution path and no longer false-negatives source
    tables"
  command: "uv run -- python -m pytest tests/unit/benchmarks/test_write_primitives_core.py -k \"table_exists or setup\" -v"
  expected_output: "targeted write-primitives setup tests pass with no DataFusion API mismatch failures"
- description: "Read-primitives map queries have valid DataFusion SQL variants and execute successfully"
  command: "uv run -- python -m pytest tests/integration/test_read_primitives_datafusion.py -k \"map_construction or map_access
    or map_keys_values\" -v"
  expected_output: "map query integration tests pass on DataFusion"
- description: "Concurrent DataFusion run setup no longer fails on working-dir cleanup races"
  command: "uv run -- python -m pytest tests/integration/test_datafusion_adapter.py -k \"concurrent or working_dir or reuse\"\
    \ -v"
  expected_output: "no intermittent `Could not remove existing database` errors across repeated runs"
- description: "End-to-end parity sanity for both primitive benchmarks on DataFusion SQL mode"
  command: "uv run -- python -m benchbox run --platform datafusion --benchmark write_primitives --scale 1 --non-interactive
    --phases power"
  expected_output: "write-primitives runs queries instead of failing setup on missing source tables"
- description: "End-to-end read-primitives map category runs on DataFusion without parser failure"
  command: "uv run -- python -m benchbox run --platform datafusion --benchmark read_primitives --scale 1 --non-interactive
    --queries map_construction,map_access,map_keys_values --phases power"
  expected_output: "all three map queries execute or fail only for non-syntax reasons"

