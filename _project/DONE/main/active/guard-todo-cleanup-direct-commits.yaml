id: guard-todo-cleanup-direct-commits
title: "Prevent accidental direct commits on develop/main branches by todo_cli cleanup"
worktree: main
priority: Medium
status: Completed
completed_date: "2026-05-30"
category: Code Quality and Technical Debt

description: |
  The `todo_cli.py cleanup` command validates and automatically commits local TODO/DONE files.
  However, it lacks branch safeguards, allowing direct commits on long-lived branches (like `develop` and `main`)
  even when run inside the main clone. Durable commits in BenchBox require that all changes go through a
  worktree branch and be submitted as a PR to `develop`.

  This TODO adds a branch safety gate inside `todo_cli.py cleanup` to abort execution when a non-dry-run cleanup is triggered directly on `develop` or `main`.

work:
- id: w1
  summary: "Add branch safety assertions in todo_cli.py cleanup"
  status: done
  notes: |
    Modify `cleanup` method in `_project/scripts/todo_cli.py` to:
      1. Detect the current branch name (using `git rev-parse --abbrev-ref HEAD`).
      2. If the current branch is `develop` or `main` and `dry_run` is False, print a clear, helpful error and raise SystemExit(1).

- id: w2
  summary: "Verify the safety gate locally"
  needs: [w1]
  status: done
  notes: |
    Verify that:
      - Running cleanup with `--dry-run` on any branch still works correctly.
      - Running cleanup (real) on a feature/chore branch works correctly.
      - Running cleanup (real) on `develop` or `main` is blocked and returns a non-zero exit code.

verification:
- description: "Branch check blocks cleanup on develop/main"
  command: "git checkout -b develop-test-gate && touch _project/TODO/main/active/test-dummy.yaml && uv run --project _project/scripts
    -- python _project/scripts/todo_cli.py cleanup; echo EXIT_CODE=$?"
  expected_output: "EXIT_CODE=1"
- description: "YAML schema is valid"
  command: "uv run --project _project/scripts -- python _project/scripts/todo_cli.py check-graph && uv run --project _project/scripts
    -- python _project/scripts/validate_todo.py --all"
  expected_output: "exit 0"

must_preserve:
- Do not affect `--dry-run` behavior. Dry-running cleanup on any branch should always be allowed for read-only
  validation checks.
- Keep output messages clear and helpful to instruct developers to claim a worktree.

approach: |
  Query the active git branch at the start of `cleanup()` inside `todo_cli.py`. If it matches `develop` or `main`, and `dry_run` is False, abort execution before staging or committing any files.

anti_patterns:
- "DO NOT bypass branch checks using environment overrides or flags within the CLI — keep the safeguard simple and strict."

scope_limit:
  only_modify:
  - "_project/scripts/todo_cli.py"
  - "_project/TODO/main/active/guard-todo-cleanup-direct-commits.yaml"

success_metrics:
- "Direct commits on develop or main via todo_cli.py cleanup are strictly prohibited."
- "Dry runs and cleanup on feature branches continue to function normally."
