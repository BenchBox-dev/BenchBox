  needs: []
  status: done
  notes: |
    Five platforms where every config_dict entry is a plain merged_options.get(field).
    NOTE: clickhouse_cloud, snowflake, databricks all have the credential merge order bug
    (saved_creds updated before options). Consolidation to build_platform_config fixes this
    as a side-effect — each commit message should note the merge-order fix.

    For each platform, the swap is:
    1. Remove: CredentialManager import, cred_manager, saved_creds, explicit_options, merged_options,
       name, driver_package, config_dict, and return DatabaseConfig(**config_dict) lines
    2. Add: from benchbox.platforms.base.config_utils import build_platform_config (local import)
    3. Add: return build_platform_config(platform_type=..., credential_key=..., ...)

    Platform details:
      databend:       credential_key="databend",       driver="databend-driver",   display="Databend"
                      fields: host, port, username, password, database, dsn, warehouse, ssl, disable_result_cache
      clickhouse_cloud: credential_key="clickhouse-cloud", driver="clickhouse-connect", display="ClickHouse Cloud"
                      fields: host, password, username, database, oauth_token, s3_staging_url, s3_region,
                              gcs_staging_url, max_memory_usage, max_execution_time, disable_result_cache, compression
      spark:          credential_key="spark",           driver="pyspark",           display="Apache Spark"
                      fields: master, app_name, deploy_mode, driver_memory, executor_memory, executor_cores,
                              num_executors, shuffle_partitions, broadcast_threshold, adaptive_enabled,
                              table_format, enable_hive, spark_config, java_home, staging_root
      snowflake:      credential_key="snowflake",       driver="snowflake-connector-python", display="Snowflake"
