id: cross-surface-known-divergence-baseline-hygiene
title: "Fail (or force baseline update) when a known cross-surface divergence no longer reproduces"
worktree: main
priority: Medium-High
status: Completed
category: Testing and Quality Assurance
completed_date: "2026-06-28"

description: |
  Cross-surface gates carry classified known_divergences (e.g. ClickBench Q18's
  order-less LIMIT, _H2ODB_KNOWN_DIVERGENCES). These entries are reported but do
  NOT fail the gate when they no longer reproduce. That asymmetry lets a stale
  exception linger: once a known divergence is silently resolved (by a loader fix,
  a query change, or a comparator improvement), the baseline entry stays, and a
  FUTURE regression on that same cell would be masked as "known" instead of caught.

  Add baseline hygiene: a known-divergence entry whose cell now matches must either
  fail the gate or force a baseline update (an --update-baseline discipline), so the
  exception list cannot drift ahead of reality. This mirrors the empty-baseline,
  fail-on-divergence discipline the TPC-Havoc gates already enforce, extended to the
  "resolved exception" direction.

prior_art:
  - ref: "benchbox/core/equivalence/cross_surface.py (known_divergences, GATES)"
    note: "Where classified exceptions live; the gate already reports them - add the reverse check (resolved-but-still-listed)."
  - ref: "benchbox/core/tpchavoc/equivalence.py (KNOWN_DIVERGENCES, empty-baseline fail-on-divergence)"
    note: "The discipline to mirror: a baseline is for intentional differences only; reuse its pattern, do not fork the comparator."
  - ref: "_project/analysis/clickbench-cross-surface-divergences.md"
    note: "Documents the single justified ClickBench Q18 baseline entry - the kind of entry that must be re-validated, not assumed permanent."

work:
  - id: w1
    summary: "Detect resolved-but-listed known divergences and fail (or require --update-baseline)"
    status: done
    needs: []
    notes: |
      In the gate runner, after comparison, check each known_divergences entry: if
      the cell it names now MATCHES (no divergence), that entry is stale. Default
      behavior: FAIL the gate with a clear message naming the resolved entry and
      instructing removal; provide an --update-baseline (or make target flag) to
      drop resolved entries deterministically. Keep genuine, still-reproducing
      classified divergences accepted exactly as today. Apply to every gate carrying
      known_divergences.

  - id: w2
    summary: "Test both directions: stale entry fails, live entry still accepted"
    status: done
    needs: [w1]
    notes: |
      Add tests: (a) a known-divergence entry whose cell now matches fails the gate
      (or is removed under --update-baseline); (b) a still-reproducing classified
      divergence is still accepted; (c) a NEW unclassified divergence still fails.
      Reuse the planted-defect style of the existing gate tests.

must_preserve:
  - "Genuine, still-reproducing classified divergences (e.g. ClickBench Q18 order-less LIMIT) remain accepted."
  - "A new unclassified divergence still fails the gate (no weakening of detection)."
  - "ResultValidator semantics unchanged; reuse, do not fork."

anti_patterns:
  - "DO NOT silently auto-prune resolved entries on a normal run - default to FAIL so the removal is a reviewed change; auto-prune only behind an explicit --update-baseline."

verification:
  - description: "Stale known-divergence entry is caught (unit)"
    command: "uv run -- python -m pytest tests/unit/core/equivalence/test_cross_surface.py -q -k baseline"
    expected_output: "a resolved-but-listed known_divergences entry fails the gate; a still-reproducing one is accepted; a new unclassified divergence fails"
  - description: "Manual end-to-end check"
    command: "add a fake resolved entry to a gate's known_divergences, run `make ssb-cross-surface-equivalence-report`"
    expected_output: "gate FAILS naming the resolved entry; passes again once removed (or under --update-baseline)"

scope_limit:
  only_modify:
    - "benchbox/core/equivalence/"
    - "benchbox/core/tpchavoc/"
    - "Makefile"
    - "tests/"

success_metrics:
  - "A resolved known-divergence cannot remain silently in any gate baseline."
  - "Baselines reflect only currently-reproducing intentional differences."

metadata:
  tags: [equivalence, correctness, baseline, regression-guard]
  estimated_effort: "Medium"
  created_date: "2026-06-28"
  last_updated: "2026-06-28T00:00:00"
