impact:
  business_value: |
    This closes one of the highest remaining credibility gaps in the public
    results explorer: proving that the real browser experience works as
    designed, not just the isolated page logic. It also turns manual
    acceptance work into a repeatable quality gate for future explorer changes.
  user_impact: |
    Users get a more reliable explorer experience across routing, compare
    workflows, query workbench interactions, downloads, and browser-specific
    error handling.
  technical_debt: |
    Replaces ad-hoc and one-off manual browser verification with a deterministic
    acceptance layer aligned to the actual deployment model.
