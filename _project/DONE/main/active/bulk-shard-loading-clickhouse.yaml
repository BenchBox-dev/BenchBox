- "ClickHouseNativeHandler.load_table() (single-file path) continues to work unchanged"
- "load_table_bulk() falls back to the default per-file loop when shard paths are in different directories"
- "Dry-run mode still captures SQL without executing it"
- "All fast-suite tests continue to pass: uv run -- python -m pytest -m fast -q must report 0 failures"
- "All existing tests/unit/platforms/test_clickhouse_adapter.py tests pass without modification"

approach: |
  1. Read ClickHouseNativeHandler.load_table() to understand the current SQL
     pattern, column schema retrieval, and dry-run handling.
  2. Implement load_table_bulk(): derive glob from the shard list, build a
     single INSERT ... SELECT * FROM file(glob) statement, execute with
     before/after COUNT(*) for the row count delta.
  3. Add guard: if shard paths span multiple directories, fall back to
     super().load_table_bulk() (the default loop).
  4. For ClickHouse Cloud: audit whether the cloud adapter already handles
     shards in bulk; if so, just add tests.

anti_patterns:
- "DO NOT concatenate shard CSV files on disk - because that requires temp storage and file I/O - use the glob pattern in
  SQL instead"
- "DO NOT hardcode the glob separator as '.' - because shard naming conventions may differ (e.g., _N vs .N) - derive the common
  prefix programmatically from the actual file names"
- "DO NOT skip the fallback to per-file loop - because shards may legitimately be in different dirs for re-loaded manifests
  - the fallback ensures correctness in all cases"

