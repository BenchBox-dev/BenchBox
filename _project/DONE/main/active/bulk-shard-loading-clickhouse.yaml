# Bulk Shard Loading for ClickHouse via Glob Pattern
#
# Location: _project/TODO/main/planning/bulk-shard-loading-clickhouse.yaml

id: bulk-shard-loading-clickhouse
title: "Replace per-shard INSERT loops with glob-pattern bulk INSERT for ClickHouseNativeHandler"
worktree: main
priority: Medium-High
status: Completed
completed_date: "2026-02-22"
description: |
  ClickHouseNativeHandler.load_table() currently processes one shard file per
  call.  For a sharded benchmark table (e.g., lineitem.tbl.1 … lineitem.tbl.10)
  the DataLoader loop issues 10 separate INSERT INTO ... SELECT * FROM file(path)
  statements.

  ClickHouse's table function file() (and s3() for cloud) support glob patterns:
    file('/data/lineitem*.tbl', 'CSV', 'col1 UInt64, ...')
  A single INSERT using a glob covers all shards in one query-plan pass.

  This TODO implements load_table_bulk() in ClickHouseNativeHandler, leveraging
  the load_table_bulk() interface introduced in bulk-shard-loading-duckdb.

  Scope is ClickHouse (self-hosted) and ClickHouse Cloud adapters only.
  It explicitly excludes platforms backed by DelimitedFileHandler (SQLite,
  PostgreSQL, DataFusion, etc.) which have no SQL multi-file primitive.

category: Core Functionality

deps:
  needs:
  - bulk-shard-loading-duckdb

work:
- id: w1
  summary: "Audit ClickHouseNativeHandler: locate load_table() and identify all execute call sites"
  status: done
  notes: |
    File: benchbox/platforms/clickhouse/workload.py (and any subclass in clickhouse_cloud.py).
    Confirm the exact SQL pattern used (file(), s3(), or COPY), how file paths are
    escaped, and whether there is a dry-run mode to preserve.

- id: w2
  summary: "Implement ClickHouseNativeHandler.load_table_bulk() using file() glob pattern for self-hosted ClickHouse"
  needs: [w1]
  status: done
  notes: |
    Algorithm:
    1. Derive a glob from the shard list. All shards for a table share a common
       stem: if paths are ['lineitem.tbl.1', 'lineitem.tbl.2', ...] in the same
       directory, the glob is 'lineitem.tbl.*'.
    2. Validate: all paths share the same parent dir and the same stem prefix.
       If not (edge case), fall back to the default loop via super().load_table_bulk().
    3. Build SQL:
         INSERT INTO {table}
         SELECT * FROM file('{dir}/{stem}.*', 'CSV', '{col_schema}')
    4. Execute and return COUNT delta (before/after) as for DuckDB.

    The ClickHouse file() function requires an explicit column schema string for
    CSV - derive it from DESCRIBE TABLE {table} (or equivalent).
    Dry-run: capture SQL then return len(file_paths)*1000.

- id: w3
  summary: "Handle ClickHouse Cloud: verify whether cloud path already bulk-loads; add tests or implement if not"
  needs: [w2]
  status: done
  notes: |
    ClickHouse Cloud benchmarks upload files to S3 before loading.
    TIME CAP: max 2 hrs. If the audit shows the cloud path already issues a
    single COPY / INSERT for all shards, add a confirming test and close this unit.
    If the cloud path still issues one INSERT per shard (using s3() or url()),
    implement load_table_bulk() analogously to w2 using s3() glob patterns.
    DO NOT scope-creep into refactoring the full cloud upload pipeline -
    only add/override load_table_bulk() in the cloud adapter class.

- id: w4
  summary: "Unit tests for ClickHouseNativeHandler.load_table_bulk() - glob SQL, row count, fallback, dry-run"
  needs: [w2]
  status: done
  notes: |
    Test cases:
    - 4 shards in same dir: assert glob pattern in SQL, single execute call, correct row count
    - Shards in different directories: assert fallback to per-shard loop (no glob)
    - Single-shard list: assert result equals load_table() result
    - Dry-run: assert no execute on real connection, return == 4000

deferred:
- summary: "Investigate columnar-native bulk loading (ClickHouse Native format instead of CSV)"
  reason: "CSV via file() is sufficient for current benchmarks; Native format has different escaping requirements"
- summary: "Bulk loading for PostgreSQL COPY FROM PROGRAM or COPY FROM STDIN multi-file"
  reason: "PostgreSQL COPY is fundamentally single-file per statement; would require UNION ALL construction or a PL/pgSQL
    wrapper - different scope"
- summary: "Bulk S3/GCS loading for ClickHouse Cloud adapter using s3() glob patterns"
  reason: "Cloud adapter (_load_data_via_s3, _load_data_via_gcs) has its own per-file upload+insert loop that bypasses DataLoader
    and ClickHouseNativeHandler entirely. Bulk loading requires restructuring the upload pipeline (upload all first, then
    single INSERT with s3() glob) - a larger refactor tracked separately."

