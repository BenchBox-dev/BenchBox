context_sections:
  "ClickHouse file() Multi-File Support": |
    ClickHouse's file() table function accepts:
      file(path_pattern, format, structure)
    where path_pattern can be a glob:
      file('/data/lineitem.tbl.*', 'CSV', 'col1 UInt64, col2 String')
    This processes all matching files in a single distributed scan.

    For ClickHouse Cloud, data is typically staged in S3. The s3() table function
    similarly supports glob patterns:
      s3('s3://bucket/prefix/lineitem.tbl.*', 'CSV', 'col1 UInt64, ...')

  "Glob Derivation from Shard List": |
    Given shard paths ['/data/lineitem.tbl.1', '/data/lineitem.tbl.2',
    '/data/lineitem.tbl.3'], the glob is derived as:
      parent_dir = common parent of all paths
      stem = longest common prefix of all filenames (e.g., 'lineitem.tbl.')
      glob = parent_dir / (stem + '*')
    This is safe as long as all shards share a directory and a common filename
    prefix (true for all TPC-H and TPC-DS datagen output patterns).

