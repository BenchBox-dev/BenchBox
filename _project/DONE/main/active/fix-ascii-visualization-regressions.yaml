id: fix-ascii-visualization-regressions
title: "Fix ASCII visualization regressions in summary box, histogram semantics, box labels, and heatmap readability"
worktree: main
priority: High
status: "Completed"
completed_date: "2026-02-17"
category: "Core Functionality"
description: |
  Recent no-color/greyscale ASCII chart behavior is still suboptimal in real outputs,
  especially for head-to-head comparisons. User-reported regressions show that structural
  differentiation and readability goals are not consistently met across chart types.

  Confirmed issues from live output and code review:

  1. **Box plot series labels are over-truncated and include a low-value marker prefix**
     (e.g., "■ DataFusion (.."), making series names harder to read.

  2. **Grouped histogram outlier semantics are incorrect**: outlier detection is tracked by
     `query_id` only, so when one platform is an outlier for a query, all platform bars for
     that query are rendered as outliers.

  3. **Grouped histogram legend markers do not match plotted glyphs** in no-color mode:
     legend uses marker set (■/◆/...) while bars use fill patterns (█/▓/...), causing
     unnecessary cognitive load.

  4. **Heatmap no-color output is visually sparse and hard to scan**: values are centered
     instead of right-aligned and column delineation is weak, producing mostly-empty columns
     and poor comparability.

  5. **Heatmap row-truncation indicator path appears dead** and should be validated/fixed
     if intended behavior is to support row truncation messaging.

  6. **Summary box comparison rows overflow box width in no-color mode** because visible
     width accounting excludes structural pct arrows (e.g., `+6.2%↑`), pushing the right
     border out by one column.

  7. **Summary box best/worst rows can overflow with long query IDs** because they are
     not wrapped or truncated before border padding.

  8. **Summary box title can overflow the box** because title text is centered without
     width clamping.

  9. **Summary box two-column mode drops comparison percentages** when environment data is
     present, losing key comparison context.

work:
- id: w1
  summary: "Fix grouped histogram outlier granularity to be per-bar (platform+query), not per-query"
  status: done

- id: w2
  summary: "Make grouped histogram legend glyphs semantically match rendered bar glyphs in no-color mode"
  needs: [w1]
  status: done

- id: w3
  summary: "Improve box plot series label layout to avoid marker-driven truncation and preserve informative names"
  status: done

- id: w4
  summary: "Improve no-color heatmap density/readability with right-aligned numeric cells and clearer column separators"
  status: done

- id: w5
  summary: "Audit heatmap truncation logic, fix dead row-truncation path if needed, and add regression tests"
  needs: [w4]
  status: done

- id: w6
  summary: "Fix summary-box comparison-row width accounting so no-color pct arrows do not overflow borders"
  status: done

- id: w7
  summary: "Clamp/wrap summary-box title and best/worst rows to prevent border overflow with long text"
  needs: [w6]
  status: done

- id: w8
  summary: "Restore percentage-change visibility in two-column summary mode and add width-regression tests"
  needs: [w6]
  status: done

must_preserve:
- "Colored rendering behavior for ASCII charts remains unchanged when use_color=True"
- "CLI/MCP chart type interfaces and output contracts remain backward-compatible"
- "Existing query ordering and chunk-splitting behavior in ASCIIQueryHistogram remains stable"
- "Heatmap scale semantics (fast→slow normalization and displayed numeric range) remain correct"
- "Summary-box line lengths always match configured chart width in no-color and ASCII/Unicode modes"
- "Summary-box two-column mode continues to show comparison deltas (percent change), not just absolute values"

approach: |
  Start with correctness issues: grouped histogram outlier identity and summary-box width
  accounting. Then address box plot label UX, no-color heatmap presentation, and summary-box
  text-fit behavior for long content.

  Reuse existing no-color differentiation helpers in `ASCIIChartOptions` and avoid introducing
  new global rendering modes. Keep changes localized to chart renderer modules plus targeted
  visualization tests.

anti_patterns:
- "DO NOT switch MCP/CLI no-color flows back to ANSI color dependence - because those paths must remain readable without ANSI
  - use structural glyph/layout improvements instead"
- "DO NOT encode outlier state as query-only in grouped mode - because it marks non-outlier peer bars incorrectly - track
  outliers at platform+query bar identity"
- "DO NOT relax tests to accept mismatched legend-vs-bar semantics - because that hides a readability regression - assert
  glyph correspondence explicitly"
- "DO NOT pad summary-box rows using raw percentage text length - because no-color mode appends structural arrows (↑/↓) -
  compute visible width from rendered text"
- "DO NOT hide comparison percentages in two-column summary mode - because users lose the key regression/improvement signal
  - include both absolute and percent deltas"

verification:
- description: "Targeted ASCII visualization tests pass for histogram/box/heatmap behavior"
  command: "uv run -- python -m pytest tests/unit/visualization/ascii/test_ascii_charts.py -k 'histogram or box_plot or heatmap'
    -q"
  expected_output: "all selected tests pass"
- description: "No-color rendering regression tests pass"
  command: "uv run -- python -m pytest tests/unit/visualization/test_nocolor_rendering.py -q"
  expected_output: "all tests pass"
- description: "Static checks pass on touched visualization files"
  command: "uv run ruff check benchbox/core/visualization/ascii/ tests/unit/visualization/"
  expected_output: "All checks passed"
- description: "Summary-box width integrity holds at multiple fixed widths"
  command: "uv run -- python -m pytest tests/unit/visualization/ascii/test_ascii_charts.py -k 'summary and (dot_leader or
    border or narrow)' -q"
  expected_output: "all selected tests pass with no line-width overflows"

