  estimated_effort: "Small (2-4 hours)"
  created_date: "2026-03-12"
  last_updated: "2026-03-12"

impact:
  business_value: |
    Eliminates the last custom ASCII chart renderer in BenchBox, completing the
    consolidation of all chart rendering behind the textcharts library.
  user_impact: |
    Monitoring resource charts gain color, unicode, and theme support. Visual quality
    improves from basic `*`-grid to textcharts line charts with proper axes and legends.
  technical_debt: |
    Removes ~80 lines of custom rendering code (_resample_to_width, _build_chart_grid,
    manual grid construction) and replaces with a single library call.

files_affected:
  modified:
  - "benchbox/monitoring/report.py"
  - "tests/unit/monitoring/test_monitoring_report.py"

must_preserve:
- "`generate_ascii_chart()` function signature and return type (ResourceChart)"
- "`ResourceChart` dataclass public interface (render(), resource_type, width, height, min_value, max_value)"
- "`ResourceReporter.generate_report()` behavior - charts dict keyed by ResourceType"
- "`ResourceReport.generate_text_report()` output structure (sections: SUMMARY, UTILIZATION, BOTTLENECK, CHARTS)"
- "Empty series returns `(no data)` chart"

approach: |
  Thin adapter strategy: keep the public API surface (`generate_ascii_chart`, `ResourceChart`)
  unchanged and replace only the internal rendering pipeline.

  1. Add textcharts imports and a private adapter function `_series_to_line_chart()`
  2. Rewire `generate_ascii_chart()` to delegate to the adapter
  3. Delete dead helper functions (_resample_to_width, _build_chart_grid)
  4. Update test assertions that relied on custom rendering characters
  5. Add color/unicode passthrough as a follow-on enhancement

anti_patterns:
- "DO NOT change the `generate_ascii_chart()` return type - because `ResourceReporter` and
  `ResourceReport` depend on `ResourceChart` - keep the adapter internal."
- "DO NOT use `use_color=True` by default - because monitoring output often goes to log files
  and CI output - default to False with opt-in."
- "DO NOT attempt to convert query plan tree rendering - because textcharts has no tree
  chart type and the operator tree is domain-specific DAG visualization - defer it."

