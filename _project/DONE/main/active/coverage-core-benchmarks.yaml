id: coverage-core-benchmarks
title: "Improve test coverage for core benchmark modules to ≥50%"
worktree: main
priority: High
status: Completed
completed_date: "2026-02-11"
category: Testing and Quality Assurance
description: |
  Core benchmark module coverage has been refreshed from coverage.json generated
  on 2026-02-10. Most originally-targeted files are now >=50% from prior waves.

  Remaining files below 50% that still require targeted unit tests:
    - benchbox/core/ssb/benchmark.py: 48%
    - benchbox/core/nyctaxi/benchmark.py: 49%
    - benchbox/core/metadata_primitives/benchmark.py: 47%

  This item now focuses on closing only these remaining gaps to >=50% while
  preserving existing benchmark behavior and avoiding production code changes.

metadata:
  tags:
  - testing
  - coverage
  - core
  estimated_effort: Large
  created_date: "2026-02-07"
  last_updated: "2026-02-11T11:05:00"

  migration_review_required: true
impact:
  business_value: |
    Core benchmark modules are the primary value proposition of BenchBox.
    Inadequate test coverage risks regressions in benchmark correctness,
    which directly undermines user trust in results.
  technical_debt: |
    12 core packages below 50% coverage. Reaching the 50% floor across
    all modules establishes a baseline for CI enforcement.

must_preserve:
- "All existing tests continue to pass"
- "No changes to production code — tests only"

approach: |
  Follow existing test patterns in tests/unit/benchmarks/ (e.g., test_tpch_core.py,
  test_tpcds_core.py). Use @pytest.mark.fast for tests <1s, @pytest.mark.unit for
  all. Mock external dependencies (file I/O, database connections, TPC binaries).
  For dataframe_queries files, test a representative subset of queries (5-10 per
  benchmark) rather than exhaustive coverage.

anti_patterns:
- "DO NOT modify production code to improve coverage — because the goal is to verify existing behavior, not refactor — write
  tests for code as-is"
- "DO NOT test auto-generated SQL strings character-by-character — because SQL formatting changes would cause false failures
  — test query structure, table references, and parameters instead"
- "DO NOT create integration tests requiring live databases — because CI has no database servers and tests must run in <1s
  — use mocks and in-memory fixtures"

verification:
- description: "All new tests pass"
  command: "uv run -- python -m pytest tests/unit/ -v --tb=short -m fast"
  expected_output: "all tests pass, 0 failures"
- description: "Coverage for each targeted module reaches ≥50%"
  command: "make coverage-per-file && for f in benchbox/core/ssb/benchmark.py benchbox/core/nyctaxi/benchmark.py benchbox/core/metadata_primitives/benchmark.py;
    do jq -r --arg f \"$f\" '.files[$f].summary.percent_covered_display' coverage.json; done"
  expected_output: "each printed value is >=50"

success_metrics:
- "Remaining sub-50 target files in this item reach ≥50% line coverage"
- "Zero test failures introduced"
- "All new tests marked @pytest.mark.fast and complete in <1s each"

