id: fix-coverage-theater
title: "Fix coverage theater: replace fake assertions with real behavioral tests"
worktree: main
priority: High
status: Completed
completed_date: "2026-03-23"
description: |
  Audit found ~30-35% of "coverage wave" tests inflate metrics without validating behavior.
  16 `assert True` instances always pass. 315 `assert hasattr` checks verify attributes exist
  but never call them. 81 trivial `.columns` assertions exercise code without checking output.
  Import-only tests get coverage credit for importing modules. Mock dispatch tests verify
  mocks were called, not that behavior is correct.

  This must be fixed BEFORE adding new coverage — otherwise the 80% target is built on
  a foundation of tests that protect nothing. Net statement gain is ~0, but test suite
  integrity improves dramatically.

  Current coverage: 66.4% (79,444 / 115,498 statements).

category: Testing & Quality

deps:
  needs: []

work:
- id: w1
  summary: "Kill all `assert True` statements (16 instances)"
  status: done
  needs: []
  description: |
    Replace every `assert True` with a real assertion.
    Run: `grep -rn "assert True" tests/ --include="*.py" | grep -v __pycache__`

    Known high-priority locations:
    - tests/unit/test_error_handling.py (~3 instances, lines 223-226+) — assert on
      specific exception types, error messages, or state changes instead of try/except
      with `assert True` in both branches.
    - tests/unit/cli/test_cli_execution.py (~2 instances) — assert on CLI exit codes,
      output content, or error messages.
    - tests/unit/test_release_infrastructure.py (~2 instances) — assert on release
      validation output or artifact state.

    For each: read the test intent, determine what SHOULD be asserted, replace.
    Every test should fail if the code under test breaks.

- id: w2
  summary: "Upgrade hasattr-only checks to behavioral assertions (priority 20 of 315)"
  status: done
  needs: []
  description: |
    There are 315 `assert hasattr(...)` calls across 89 test files. Most are
    legitimate API surface tests (e.g., verifying a platform adapter implements
    required interface methods). These are acceptable when paired with other
    assertions in the same test.

    The problem is the ~20 tests where `assert hasattr` is the SOLE assertion —
    no method call, no return value check, no error path tested. Focus on these.

    How to find them: for each file with `assert hasattr`, check whether the
    same test function has at least one other meaningful assertion. If hasattr
    is the only assertion, upgrade it.

    Priority files (hasattr as sole assertion pattern):
    - tests/unit/test_base_advanced.py (lines 146-151) — test concrete implementations
      of generate_data, get_queries, etc. with real inputs
    - tests/unit/test_circular_imports.py — API surface tests with no behavioral call
    - tests/unit/test_connection_interface_consistency.py — test connection methods work

    Scope: fix the ~20 sole-assertion cases. The remaining ~295 are acceptable
    API surface tests (they verify interface contracts alongside other assertions).

- id: w3
  summary: "Deepen mock dispatch tests in 4 coverage files (12 instances)"
  status: done
  needs: []
  description: |
    4 test files with "coverage" in the name use `assert_called_once()` as the
    primary assertion — testing that a mock was called, not what it was called with
    or whether the behavior is correct. 12 instances total across these files.

    Target files:
    - tests/unit/platforms/test_clickhouse_cloud_coverage.py — mock dispatch for
      S3 loading, HTTP loading, connection routing
    - tests/unit/platforms/azure/test_synapse_spark_coverage.py — Spark session
      dispatch, staging operations
    - tests/unit/platforms/gcp/test_dataproc_coverage.py — cluster operations,
      job submission dispatch
    - tests/unit/platforms/aws/test_emr_serverless_coverage.py — job submission,
      S3 staging dispatch

    For each `assert_called_once()`:
    1. Add argument assertions: verify the SQL string, file path, or config dict
       passed to the mocked method (e.g., `mock_s3.assert_called_once_with(
       expected_s3_path, format="parquet")`)
    2. Where the mocked method is pure logic (no network), replace mock with a
       real lightweight call and assert on the output

- id: w4
  summary: "Fix trivial `.columns` assertions in dataframe query tests (81 tests)"
  status: done
  needs: []
  description: |
    tests/unit/core/test_dataframe_queries_coverage_wave_remaining.py has 81 tests
    that only assert `result.columns` is truthy. Upgrade to:
    1. Assert specific column names (e.g., `assert "revenue" in result.columns`)
    2. Assert column count matches expected schema
    3. Where possible, assert on row count or sample values with test data

- id: w5
  summary: "Convert import-only tests to behavioral tests"
  status: done
  needs: []
  description: |
    tests/unit/platforms/test_platform_adapters_coverage_wave_remaining.py (lines 42-99)
    imports modules and asserts `isinstance(AVAILABLE, bool)`. Convert these to:
    1. Test that the adapter class can be instantiated (even if connection fails)
    2. Test that config validation works (accepts valid config, rejects invalid)
    3. Test SQL dialect methods return well-formed SQL strings

    Apply same pattern to any other import-only tests found via:
    `grep -rn "isinstance.*bool" tests/unit/`

- id: w6
  summary: "Triage `assert ... is not None` sole-assertion tests (cap at top 20)"
  status: done
  needs: []
  description: |
    There are 1,122 `assert ... is not None` calls across tests. Most are
    legitimate (e.g., asserting a factory returned an object before testing it
    further). The problem cases are where `is not None` is the SOLE assertion.

    Approach:
    1. Run: `grep -rn "is not None" tests/ --include="*.py" | grep -v __pycache__`
    2. For each file, check if the test has other meaningful assertions after the
       None check. If not, it's theater.
    3. Cap at the top 20 worst offenders (sole-assertion tests in high-value code
       paths: core/, platforms/base/, cli/).
    4. For each: add an assertion on the actual content — type, value, shape, or
       method behavior of the returned object.

    This is a triage pass, not exhaustive. The remaining None checks are fine
    as precondition guards (assert not None, then assert on content).

deferred:
- summary: "Rename files with 'coverage' in the name to describe what they test"
  reason: "Lower priority cosmetic change. Test names should describe behavior
    (e.g., test_clickhouse_cloud_dispatch.py) not metrics they serve. Do after
    the assertion quality is fixed."
- summary: "Add mutation testing to detect tests that never fail"
  reason: "mutmut or cosmic-ray can find tests that pass regardless of code changes.
    Useful as a second pass after fixing known theater, but expensive to run."

metadata:
  tags:
  - testing
  - quality
  - coverage
  - technical-debt
  estimated_effort: "Medium (3-5 days)"
  created_date: "2026-03-23"
  last_updated: "2026-03-23"

verification:
  command: |
    echo "--- assert True count ---" && grep -rn "assert True" tests/ --include="*.py" | grep -v __pycache__ | wc -l && echo "--- mock dispatch in coverage files ---" && grep -rn "assert_called_once\b" tests/ --include="*coverage*.py" | grep -v __pycache__ | wc -l && echo "--- test suite passes ---" && uv run -- python -m pytest -m fast -q --tb=line 2>&1 | tail -3
  expected: "assert True count = 0; mock dispatch in coverage files = 0; all fast tests pass"

must_preserve:
- "Total test count must not decrease (currently 14,215 collected) — upgrade tests, don't delete them"
- "Coverage percentage must not drop below 66.4% — assertions are being improved, not removed"
- "All existing test markers (fast, unit, etc.) must be preserved"

anti_patterns:
- "DO NOT just delete failing tests — because the goal is to make tests meaningful, not to remove them — fix the assertion to test real behavior"
- "DO NOT replace `assert True` with `assert result is not None` — because that's still trivial — assert on specific values, types, or state"
- "DO NOT add `# pragma: no cover` to bypass coverage on code that should be tested — because this TODO is about fixing test quality, not hiding gaps"

scope_limit:
  include:
  - "tests/ (test files only)"
  exclude:
  - "benchbox/ source code (no production changes in this TODO)"
  - "pytest.ini, pyproject.toml (no config changes)"

impact:
  business_value: |
    Transforms coverage metric from vanity number into genuine safety signal.
    After this, when coverage says 66%, it means 66% of the code is actually
    verified to work correctly.
  technical_debt: |
    Eliminates the "coverage wave" anti-pattern where tests were written to hit
    targets rather than validate behavior. Establishes quality baseline for
    the coverage-to-80% effort that follows.
