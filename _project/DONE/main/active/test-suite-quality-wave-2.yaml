verification:
  command: |
    echo "--- fast suite timing ---" && timeout 600 uv run -- python -m pytest tests/unit -m fast --durations=5 -n 0 -q 2>&1 | tail -10 && echo "--- is-not-None count in top 5 ---" && grep -c 'is not None' tests/unit/core/test_dataframe_queries_coverage_wave_remaining.py tests/unit/platforms/dataframe/test_pyspark_df.py tests/unit/core/cost/test_cloud_platform_costs.py tests/unit/core/tpch/test_dataframe_queries.py tests/unit/core/aiml_functions/test_aiml_functions_queries.py 2>&1 && echo "--- sleeps in tpc_compliance ---" && grep -c 'time.sleep' tests/unit/test_tpc_compliance.py && echo "--- conftest size ---" && wc -l tests/conftest.py && echo "--- hollow isinstance (4 files) ---" && grep -c 'assert isinstance' tests/validation/test_parameter_compliance.py tests/unit/tpch/test_api_compatibility.py tests/integration/tpch/test_tpch_benchmark.py tests/unit/test_tpcds_enhanced.py 2>&1 && echo "--- thin files deleted ---" && ls tests/unit/platforms/test_clickhouse_metadata_coverage.py tests/unit/platforms/test_bigquery_case_normalization.py tests/unit/platforms/test_bigquery_staging_root.py tests/unit/platforms/test_timescaledb_coverage.py 2>&1 && echo "--- MagicMock in top 2 ---" && grep -c 'MagicMock' tests/unit/platforms/test_platform_adapters_coverage_wave_remaining.py tests/unit/core/runner/test_dataframe_runner.py 2>&1
  expected: "Fast suite <10min; is-not-None counts reduced >50%; 0 sleeps in tpc_compliance; conftest <200 lines; hollow isinstance
    reduced >50%; thin files not found (deleted); MagicMock counts reduced by 35-55"

must_preserve:
- "All existing tests must continue to pass — marker changes only affect which suite they run in"
- "tests/unit/core/test_dataframe_queries_coverage_wave_remaining.py must be kept (has real Polars execution)"
- "Root conftest parallel locking behavior must be preserved across the split"
- "CI fast suite (make test-fast) must still work with updated markers"
- "Meaningful isinstance assertions must be kept — only replace hollow ones where the type is guaranteed by the function signature"
- "Cloud platform test files must keep MagicMock — no real connection alternative exists for Snowflake, BigQuery, Databricks,
  etc."
- "Consolidated tests must preserve all test methods — merge means zero test loss"

anti_patterns:
- "DO NOT delete test files without merging their tests first — because every test file in scope has real value — move tests
  to the target file, then delete the source"
- "DO NOT add new MagicMock usage — because the suite already has 1,605 instances and mock density is a known problem — use
  real objects or monkeypatch"
- "DO NOT move fixtures without verifying scope — because conftest.py fixtures are auto-discovered by pytest scope and moving
  them changes availability — run affected tests after each fixture move"
- "DO NOT replace meaningful isinstance assertions — because expression wrapper types (UnifiedExpr, pl.Expr) and C binary
  wrapper types are API contracts — only replace where the return type is guaranteed by the function signature"
- "DO NOT attempt MagicMock reduction in cloud-only platform tests — because Snowflake/BigQuery/Databricks/etc. have no local
  alternative — mocking is the correct approach for those"

scope_limit:
  include:
  - "tests/ directory (markers, assertions, conftest, sleep removal, file consolidation)"
  - "pyproject.toml (marker definitions only)"
  exclude:
  - "benchbox/ source code (no production changes)"
  - "tests/integration/ (modify only test_tpch_benchmark.py isinstance assertions in w4)"
  - "tests/e2e/ (do not modify)"

impact:
  business_value: |
    Fast suite under 10 minutes enables rapid iteration. Stronger assertions
    catch more bugs during development. Simpler conftest reduces onboarding
    friction. Fewer test files reduces maintenance surface.
  user_impact: |
    No user-facing changes. Developer experience improves significantly.
  technical_debt: |
    Reduces trivial assertions by ~230 (152 is-not-None + 79 isinstance).
    Reduces MagicMock by 35-55 in highest-density files. Eliminates
    timing-dependent test flakiness. Consolidates 5 thin files into their
    parent files. Makes conftest maintainable at <200 lines.

