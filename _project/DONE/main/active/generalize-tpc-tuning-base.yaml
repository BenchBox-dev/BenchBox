impact:
  business_value: |
    Makes tuned-mode benchmark comparisons more credible by separating workload
    intent from platform-specific physical implementation and by exposing
    coverage gaps instead of hiding them behind a single `tuned` label.
  user_impact: |
    Users comparing Databricks, DuckDB, and future platforms can see whether
    each result used the same logical TPC tuning profile, which candidates were
    mapped, and which physical features were actually applied.
  technical_debt: |
    Reduces one-off platform YAML drift and creates a path for future platforms
    to consume reusable workload-level tuning evidence instead of copying
    Databricks-specific examples.
