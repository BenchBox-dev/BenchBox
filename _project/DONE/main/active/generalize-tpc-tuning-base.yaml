completion_notes: |
  Completed on 2026-05-26.

  Implemented a platform-neutral TPC profile at
  `benchbox/core/tuning/profiles/tpc.yaml`, with typed loading,
  role/status validation, platform capability mapping, checked-template
  validation, and result metadata emission.

  Databricks and DuckDB TPC-H/TPC-DS templates now validate against the same
  logical profile:
  - Databricks TPC-H: mapped 16/16 required candidates; mechanisms
    distribution, partitioning, z_order.
  - DuckDB TPC-H: mapped 16/16 required candidates; mechanisms partitioning,
    sorted_ingestion, sorting.
  - Databricks TPC-DS: mapped 32/32 required candidates; 2 low-evidence
    dropped candidates remain excluded; mechanisms distribution, partitioning,
    z_order.
  - DuckDB TPC-DS: mapped 32/32 required candidates; 2 low-evidence dropped
    candidates remain excluded; mechanisms partitioning, sorted_ingestion,
    sorting.

