    uv run -- python -c "from benchbox.cli.config import ConfigManager; cm=ConfigManager(); paths=('examples/tunings/databricks/tpch_tuned.yaml','examples/tunings/databricks/tpcds_tuned.yaml','examples/tunings/duckdb/tpch_tuned.yaml','examples/tunings/duckdb/tpcds_tuned.yaml'); [cm.load_unified_tuning_config(p, p.split('/')[2]) for p in paths]; print('ok')"
  expected_output: "ok"
- description: "Tuned-template coverage matrix tests stay green"
  command: "uv run -- python -m pytest tests/uat/test_tuning_coverage.py -m fast -q"
  expected_output: "all tests pass"
- description: "Broad PR gate"
  command: "make pr-preflight"
  expected_output: "exit 0"

must_preserve:
- "Existing `--tuning notuning` baseline semantics: constraints disabled, no platform physical tuning."
- "Existing `--tuning tuned` template discovery behavior unless this TODO explicitly introduces a backward-compatible profile
  resolution layer."
- "Databricks accepted columns added by validate-and-integrate-tpc-tuning-json remain represented unless a newer evidence
  audit documents a removal."
- "DuckDB tuned templates are not modified to imitate Databricks Z-ordering; use DuckDB-appropriate sorting/layout semantics."
- "No raw UAT logs, scratchpad files, or large generated reports are committed."

approach: |
  Build the generalization in three layers:

  1. Logical profile: canonical workload-level TPC candidates and evidence.
  2. Capability mapping: platform-specific translation or explicit waiver.
  3. Validation/reporting: checked templates and result metadata show coverage
     of the logical profile.

  Keep generation optional until validation is stable. A strict checker with a
  reviewable diff is safer than silently rewriting platform YAML.

anti_patterns:
- "DO NOT treat Databricks as the source of truth - because that preserves the original blind spot and makes other platforms
  second-class consumers."
- "DO NOT require identical physical mechanisms across platforms - because Z-ORDER, ORDER BY, CLUSTER BY, distribution keys,
  and sorted ingestion have different semantics and costs."
- "DO NOT call a tuned-vs-tuned comparison fair unless result metadata shows which logical candidates were mapped, waived,
  or unsupported."
- "DO NOT add speculative columns to platform templates without query-template evidence or a profile-level rationale."
- "DO NOT hide fallback/basic-constraints cells behind `tuning_mode == tuned` without a coverage grade or waiver reason."
- "DO NOT make the profile validator depend on live cloud credentials; use checked-in YAML and dry-run/unit-level assertions."

