must_preserve:
- "All 15 golden snapshot tests pass unchanged — BenchBox passes explicit values everywhere"
- "BenchBox CLI and MCP chart output byte-identical to pre-migration"
- "Zero DeprecationWarning from textcharts during normal BenchBox operation"
- "Compatibility shim re-exports both old and new names for external callers"

approach: |
  Low-risk mechanical migration. The audit confirms BenchBox passes all labels
  and titles explicitly — no call site relies on changed defaults. The work is:
  5 factory function renames, 3 dead import removals, 2 verifications, and an
  optional subject= adoption evaluation. Golden tests are the safety net.

anti_patterns:
- "DO NOT adopt value_formatter or lower_is_better without a concrete use case -- defaults are correct for latency metrics
  -- adopt when BenchBox adds throughput or Power@Size chart rendering"
- "DO NOT remove deprecated factory names from the compatibility shim -- external callers using old BenchBox import paths
  need both old and new names available"
- "DO NOT change any explicit title= or metric_label= values in ascii_runtime.py -- they are already correct and the audit
  confirmed no reliance on defaults"
