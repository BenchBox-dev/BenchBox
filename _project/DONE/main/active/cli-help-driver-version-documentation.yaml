  - DuckDB or a generic section: --platform-option driver_version=1.2.0
      --platform-option driver_auto_install=true
  - Athena Spark section (or create one): --platform-option engine_version="PySpark engine version 3"
  Also fix any stale option descriptions identified in w1.

  Entry point for w4: benchbox/mcp/tools/benchmark.py run_benchmark() docstring
