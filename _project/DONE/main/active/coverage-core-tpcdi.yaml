id: coverage-core-tpcdi
title: "Improve test coverage for core/tpcdi module to ≥50%"
worktree: main
priority: Medium-High
status: Completed
category: Testing and Quality Assurance
completed_date: "2026-02-18"
description: |
  This item was completed by validating that existing TPC-DI test coverage
  already satisfies the >=50% targets for the scoped files and package-level
  threshold, without requiring production or test-code changes in this item.

  Verified coverage results at completion:
    - core/tpcdi/etl/transformations.py: 61%
    - core/tpcdi/etl/scd_processor.py: 76%
    - core/tpcdi/source_generators.py: 99%
    - core/tpcdi/etl/batch.py: 68%
    - core/tpcdi/benchmark.py: 54%

  All TPC-DI unit tests in scope passed, and package-level coverage exceeded
  the 50% minimum.

metadata:
  tags:
  - testing
  - coverage
  - tpcdi
  estimated_effort: Medium
  created_date: "2026-02-07"
  last_updated: "2026-02-18T13:43:27"

impact:
  business_value: |
    TPC-DI is a differentiated benchmark that few competing tools support.
    Solid test coverage protects this competitive advantage.
  technical_debt: |
    ETL pipeline code at 11-17% coverage is a significant regression risk.
    SCD processing logic is especially critical to test since bugs would
    produce silently wrong benchmark results.

must_preserve:
- "All existing TPC-DI tests continue to pass"
- "No changes to production code"

approach: |
  The ETL transformations are mostly pure functions that transform DataFrames
  or dictionaries — ideal for unit testing. Create test fixtures with small
  sample data (5-10 rows) that exercise the transform logic. For SCD processor,
  test Type 1 and Type 2 SCD operations with before/after state assertions.
  For batch.py, mock the database connection and test orchestration logic.

anti_patterns:
- "DO NOT test with real TPC-DI data files — because they require the dsqgen binary and are 100MB+ at SF=1, making tests slow
  and environment-dependent — create minimal synthetic fixtures (5-10 rows)"
- "DO NOT require dsqgen binary — because it is platform-specific, not available in CI, and segfaults on fractional scale
  factors — mock data generation calls"

verification:
- description: "TPC-DI unit tests pass"
  command: "uv run -- python -m pytest tests/unit/core/tpcdi -v --tb=short"
  expected_output: "all tests pass, 0 failures"
- description: "core/tpcdi package coverage reaches >=50%"
  command: "uv run -- python -m pytest tests/unit/core/tpcdi --cov=benchbox/core/tpcdi --cov-report=term --cov-fail-under=50
    -q"
  expected_output: "coverage check passes with total >=50%"
- description: "Each targeted TPC-DI file reaches >=50% coverage"
  command: >-
    uv run -- python -m pytest tests/unit/core/tpcdi -p pytest_cov
    --cov=benchbox/core/tpcdi --cov-report=json:coverage_tpcdi.json
    --cov-report=term --cov-fail-under=0 -q && for f in benchbox/core/tpcdi/etl/transformations.py
    benchbox/core/tpcdi/etl/scd_processor.py benchbox/core/tpcdi/source_generators.py
    benchbox/core/tpcdi/etl/batch.py benchbox/core/tpcdi/benchmark.py; do
    v=$(jq -r --arg f "$f" '.files[$f].summary.percent_covered_display' coverage_tpcdi.json);
    echo "$f: $v"; awk -v n="$v" 'BEGIN { exit !(n+0 >= 50) }' || exit 1; done
  expected_output: "each listed file prints a value >=50 and command exits 0"

success_metrics:
- "core/tpcdi package reaches ≥50% line coverage overall"
- "Each individual file listed reaches ≥50%"

