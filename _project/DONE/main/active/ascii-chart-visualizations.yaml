title: "ASCII Chart Visualizations for CLI and MCP Server"
worktree: main
priority: Medium-High
status: Completed
completed_date: "2026-02-05"
category: Core Functionality
description: |
  Implement ASCII/text-based alternatives to all BenchBox chart visualizations,
  enabling rich visual output directly in terminal environments and MCP server
  responses without requiring HTML files or external viewers.

  The current visualization system uses Plotly to generate interactive HTML charts.
  This TODO adds a parallel ASCII rendering capability that maintains the same
  data models and interface while outputting terminal-friendly text graphics.

context_sections:
  "Background and Motivation": |
    BenchBox's visualization pipeline currently generates Plotly HTML charts that
    require opening in a browser. This creates friction for:

    1. **CLI Users**: Want to see results inline without leaving the terminal
    2. **MCP Server Users**: Claude and other LLM agents can't interpret HTML/images
    3. **CI/CD Pipelines**: Need text-based summaries in logs
    4. **SSH Sessions**: Remote terminals without X11 forwarding or browser access
    5. **Accessibility**: Screen readers work better with structured text

    ASCII charts provide immediate visual feedback while preserving the analytical
    value of the graphical representations.

  "Technical Context": |
    **Current Visualization Architecture:**
    - Core module: `benchbox/core/visualization/`
    - Chart classes: `PerformanceBarChart`, `DistributionBoxPlot`, `QueryHeatmap`,
      `CostPerformanceScatterPlot`, `TimeSeriesLineChart`
    - CLI command: `benchbox visualize` (see `benchbox/cli/commands/visualize.py`)
    - MCP tools: `suggest_charts()`, `generate_chart()` in `benchbox/mcp/tools/visualization.py`
    - Data types: `BarDatum`, `DistributionSeries`, `CostPerformancePoint`, `TimeSeriesPoint`

    **Existing Text Rendering:**
    - Query plans already have ASCII tree rendering (`benchbox/core/query_plans/visualization.py`)
    - Rich library is used extensively for tables, panels, and styled terminal output
    - Report command uses Rich tables for rankings/trends/regressions

    **Libraries Available:**
    - Rich (already integrated): Tables, panels, progress bars, markup styling
    - Potential additions: plotext (terminal plotting), asciichartpy, termgraph

  "Design Principles": |
    1. **Same Data Models**: Reuse existing `BarDatum`, `DistributionSeries`, etc.
    2. **Parallel Implementation**: ASCII charts mirror Plotly chart classes
    3. **Format Option**: Add `--format ascii` to CLI, `format: "ascii"` to MCP tools
    4. **Theme Support**: Convert existing light/dark themes to ANSI colors
    5. **Graceful Degradation**: Fall back to simpler output if terminal lacks Unicode/color
    6. **Width Awareness**: Detect terminal width and scale charts appropriately

