id: migrate-remaining-print-leaks-to-emit
title: Migrate remaining 68 benchbox files from raw print() to emit() and clear _PENDING_MIGRATION
worktree: main
priority: Medium-High
status: Completed
category: Core Functionality
description: "The centralize-output-control effort (completed 2026-02-18) migrated\
  \ the high-traffic\nCLI/core/TPC-DS/MCP paths to emit() and added a global ratchet\
  \ test that prevents new\nprint() leaks.  However, the ratchet discovered 68 pre-existing\
  \ files that were out of\nscope for that effort and placed in _PENDING_MIGRATION.\n\
  \nThis TODO drives the migration of all 68 files, subsystem by subsystem, until\n\
  _PENDING_MIGRATION is empty and the global guardrail covers the entire codebase.\n\
  \nFiles are grouped into 12 work units by subsystem to keep each session focused:\n\
  \  w1  – utils layer         (5 files)\n  w2  – CLI help            (1 file)\n \
  \ w3  – analysis + comparison  (5 files)\n  w4  – cost + misc core    (8 files)\n\
  \  w5  – dataframe cluster   (5 files)\n  w6  – TPC-DI cluster      (7 files)\n\
  \  w7  – TPC-DS misc + TPC-H skew  (5 files)\n  w8  – tuning generators   (11 files)\n\
  \  w9  – publishing cluster  (4 files)\n  w10 – monitoring cluster  (5 files)\n\
  \  w11 – platforms cluster   (8 files)\n  w12 – release + primitives           \
  \     (4 files)\n  w13 – remove all entries from _PENDING_MIGRATION, verify clean\n\
  \nAfter w13 the ratchet test enforces zero tolerance automatically — no future\n\
  maintenance required.\n"
