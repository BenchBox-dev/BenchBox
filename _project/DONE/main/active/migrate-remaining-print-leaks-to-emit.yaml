must_preserve:
- 'emit() quiet-mode suppression: when set_quiet(True) is active, no output should
  reach stdout from any migrated file'
- benchbox run --quiet produces no user-visible stdout/stderr output while still returning
  correct exit codes
- MCP server stdout remains reserved for JSON-RPC messages only — migrated files must
  not re-introduce print() on MCP code paths
- test_pending_migration_set_contains_no_stale_entries passes after each work unit
  (remove migrated files from the set)
- test_no_new_raw_print_in_benchbox_runtime continues to pass throughout the migration
approach: "For each work unit:\n1. Read each file in the cluster to identify all raw\
  \ print() call sites.\n2. For each site, replace print(\"...\") with emit(\"...\"\
  ) — the signatures are\n   identical for simple string output.\n3. For f-string\
  \ or multi-arg print() calls, preserve formatting: emit() accepts\n   any Rich renderable\
  \ or plain string, so f-strings pass through unchanged.\n4. Add `from benchbox.utils.printing\
  \ import emit` to the imports if not present.\n   Remove any now-unused imports\
  \ (e.g., `from rich.console import Console` if\n   the Console instance was only\
  \ used for print-equivalent calls).\n5. After completing the cluster, remove those\
  \ file paths from _PENDING_MIGRATION\n   in tests/unit/cli/test_output_control_static.py.\n\
  6. Run the static guardrail test to confirm: `uv run -- python -m pytest\n   tests/unit/cli/test_output_control_static.py\
  \ -v`.\n7. Commit the cluster migration + _PENDING_MIGRATION removal atomically.\n\
  \nImportant notes:\n- Some files may use print() for debug/development output that\
  \ should simply\n  be removed rather than migrated (e.g., worker_pool_examples.py\
  \ which is\n  example/demo code). Evaluate each site: if it's debug output with\
  \ no\n  user-facing value, delete it; if it's user-facing status, migrate to emit().\n\
  - Tuning generators (w8) likely use print() for DDL output that users pipe to\n\
  \  files.  These may need emit() with appropriate formatting, or may need a\n  separate\
  \ stdout-clean path.  Read each generator before deciding.\n- TPC-DI worker_pool_examples.py\
  \ is almost certainly example/demo code; its\n  print() calls may be intentional\
  \ and should be evaluated for removal vs migration.\n"
anti_patterns:
- DO NOT batch-replace all print() calls blindly — because some files use print()
  for intentional stdout output (DDL generators, examples) — read each file and decide
  per site
- DO NOT forget to remove migrated files from _PENDING_MIGRATION — because test_pending_migration_set_contains_no_stale_entries
  will fail if you don't — remove each file from the set as part of the same commit
- DO NOT use Console() directly in migrated files — because that bypasses quiet-mode
  control — use emit() for plain output, or get_console() / quiet_console if Rich
  renderables are needed
- DO NOT add silence_output() wrappers to cover print() calls — because silence_output()
  is an MCP boundary tool, not a migration shortcut — replace the print() calls directly
verification:
- description: Static print-leak guardrail passes after each work unit
  command: uv run -- python -m pytest tests/unit/cli/test_output_control_static.py
    -v
  expected_output: all 3 tests pass, 0 failures
- description: Quiet-mode unit tests still pass
  command: uv run -- python -m pytest tests/unit/cli/test_quiet_mode.py tests/unit/mcp/test_mcp_benchmark_stdout_suppression.py
    -v
  expected_output: all tests pass, 0 failures
- description: Full fast test suite passes
  command: uv run -- python -m pytest -m fast -q
  expected_output: all tests pass, 0 failures
- description: _PENDING_MIGRATION is empty after w13 (stale-entry test passes trivially
    on empty set)
  command: uv run -- python -m pytest tests/unit/cli/test_output_control_static.py
    -v
  expected_output: 3 passed, 0 failed
