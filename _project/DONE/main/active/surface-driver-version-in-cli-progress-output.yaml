id: surface-driver-version-in-cli-progress-output
title: "Surface active driver version in CLI progress output"
worktree: main
priority: Medium-High
status: Completed
description: |
  BenchBox currently prints "Running {benchmark} on {platform} at scale {scale}" before
  resolving the database config, so the driver version isn't known at that point. Users
  have no visible indication of which driver version actually ran until they inspect the
  result JSON.

  This became a concrete UX problem: a user manually installed duckdb==1.5.0.dev307 via
  uv pip install, then ran benchbox without specifying --platform-option driver_version=X.
  uv run silently reverted the package to the uv.lock-pinned 1.4.3 before Python started.
  The result JSON correctly reported 1.4.3, but the user only discovered the discrepancy
  by reading the result file - never from the CLI output.

  The fix is to emit driver version after config resolution, either by:
    a) Moving the "Running ..." line to after database_config is created (line 1402 in
       commands/run.py), so version is available to include inline.
    b) Adding a second, briefer line like "  ↳ driver: duckdb 1.4.3 (current-process)"
       immediately after config creation.

  The preferred output is option (a): one combined line.
  Target format: "Running {benchmark} on {platform} at scale {scale} [driver {version}]"
  Example: "Running clickbench on duckdb at scale 10.0 [driver 1.4.3]"

  For platforms where no version was explicitly requested (the common case), still show
  the actual resolved version so the user can see what's running. For platforms without
  a driver package (e.g., SQLite), omit the driver clause.

category: Core Functionality

work:
  - id: w1
    summary:
      "Move 'Running...' print line to after database_config creation in commands/run.py (line ~1402) and include driver
      version from database_config.driver_version_actual or driver_version_resolved"
    status: done

  - id: w2
    summary:
      "Handle the no-driver-package case (e.g., SQLite) gracefully - omit driver clause when driver_package is None or
      version is unknown"
    needs: [w1]
    status: done

  - id: w3
    summary: "Add unit/snapshot test verifying the new output format for both driver-present and driver-absent cases"
    needs: [w1]
    status: done

  - id: w4
    summary:
      "Check the interactive mode code path (around line 1924 in commands/run.py where platform_type is resolved) and
      apply the same driver version display pattern if applicable"
    needs: [w1]
    status: done

metadata:
  created_date: "2026-02-23"
  estimated_effort: "Small (< 2 hours)"
  tags:
    - ux
    - cli
    - driver-versioning

impact:
  user_impact: |
    Users can immediately see which driver version will run without inspecting result JSON.
    Reduces silent version substitution going unnoticed (e.g., uv.lock pin reverting a
    manually installed dev/pre-release version).

must_preserve:
  - "The 'Running ...' line still appears before benchmark execution begins (not after)"
  - "Non-interactive/--non-interactive mode continues to work correctly"
  - "The output format for platforms without a driver package (SQLite) is not broken"
  - "benchbox run --dry-run output is not affected"

approach: |
  In benchbox/cli/commands/run.py, the "Running ..." line is at line 1369 (direct execution
  path). The database_config is created at line 1402 via db_manager.create_config().

  Move the console.print to after line 1406 (after database_config is fully created).
  At that point, database_config.driver_version_actual and database_config.driver_version_resolved
  are both populated by ensure_driver_version() inside database.py.

  Use driver_version_actual if set, fall back to driver_version_resolved, fall back to
  omitting the driver clause entirely. Do not show "None" or "unknown".

  The interactive mode (not direct execution) uses a different code path - check if the
  same pattern applies there (around line 1924 where platform_type is resolved).

anti_patterns:
  - "DO NOT emit the version before database_config creation - because it won't be resolved yet - move the print line to after
    line 1406"
  - "DO NOT show 'driver: None' or 'driver: unknown' - because it's noise - omit the driver clause when version is not available"
  - "DO NOT change the --dry-run output path - because it has different semantics - scope only to direct execution path"

verification:
  - description: "Output line includes driver version for DuckDB run"
    command:
      "uv run benchbox run --platform duckdb --benchmark tpch --scale 0.01 --phases power --non-interactive 2>&1 | grep
      'Running tpch'"
    expected_output: "Running tpch on duckdb at scale 0.01 [driver 1.4.3] (or similar with actual version)"
  - description: "Existing fast unit tests still pass"
    command: "uv run -- python -m pytest -m fast -q"
    expected_output: "All tests pass with 0 failures"

scope_limit:
  only_modify:
    - "benchbox/cli/commands/run.py"
    - "tests/unit/cli/"
completed_date: "2026-02-23"
