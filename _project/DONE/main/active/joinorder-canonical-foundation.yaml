context_sections:
  "Research Findings": |
    License posture (decided in planning, summary):

    Risk read: AMBIGUOUS, LEANING LOW for the planned action (host
    Parquet conversion as GitHub Release with attribution + checksum
    manifest + DATA-LICENSE.md + takedown commitment).

    Evidence supporting "leaning low":
      - Boncz CWI mirror (event.cwi.nl/da/job/readme.txt) has been
        live since 2016, maintained by JOB co-author through 2025,
        explicitly acknowledges the gray area
      - gregrahn/join-order-benchmark: ~9.5 years public, 356 stars,
        99 forks, no enforcement action
      - Harvard Dataverse, CedarDB docs, MIT learnedsystems all
        redistribute IMDb-derived JOB data; no documented IMDb
        objection in any forum
      - JOB is derived from a discontinued IMDb data product (2017)
      - US Feist v. Rural weakens compilation-copyright claim on
        the parsed/relational form

    Evidence supporting "ambiguous":
      - IMDb's current ToU literally prohibits "creating any kind
        of online/offline database" outside personal use
      - No permissive license, no IMDb consent on record
      - EU sui generis database right is narrower than US copyright

    Posture conditions for hosting (to be honored in cutover w15 +
    w14):
      1. DATA-LICENSE.md per benchmark with IMDb attribution
         verbatim, Boncz-style scope clause, redistribution
         disclaimer, takedown contact
      2. Air-gapped/pre-populated datagen directory path for users in
         stricter jurisdictions, using the existing `BENCHBOX_OUTPUT_DIR`
         convention and the same manifest checksum verification
      3. Same-day takedown SLA: pull Release asset on objection,
         fall back to user-populated datagen directory instructions
      4. No click-through (matches field practice; no legal upside)

    See conversation history for the full evidence pack and
    sources. If posture conditions cannot be met before w14
    promotion, fall back to Option C: host conversion scripts
    only, require users to pre-populate the standard datagen directory.
