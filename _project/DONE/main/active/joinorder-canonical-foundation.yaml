approach: |
  This TODO is foundation + offline data prep. Most of the work
  happens outside the running BenchBox process: a build pipeline
  that runs once, produces an archive, stages a draft Release.

  Sequence the work to minimize rework:
    1. w0 (re-validate cited evidence) — gates the rest
    2. Design doc first (w1) — anchors all subsequent decisions
    3. In parallel: data-fetch module (w2), registry+enforcement (w3),
       and conversion pipeline (w4→w7)
    4. Pipeline gates (w8, w9) added before reference cardinalities
       (w10→w12) so we never compute reference values on broken data
    5. Archive packaging (w13) and tiny fixture regen (w14) precede
       Release staging (w15, w16)

  For the build pipeline (w4-w14), use Docker-Postgres for
  reproducibility. Document the exact image tag in
  `data_manifest.toml`. The pipeline script must be idempotent and
  re-runnable — if Joe needs to rebuild from a clean source 6 months
  from now, the same script + same upstream pg_dump must produce a
  byte-identical archive (modulo timestamps in the manifest).

  Reusable infrastructure: design every module in `benchbox/core/data_fetch/`
  to be benchmark-agnostic. The cutover TODO will instantiate it for
  joinorder. Future TODOs will instantiate for ClickBench, etc.

anti_patterns:
- "DO NOT compute reference cardinalities by re-running the queries on the BenchBox-converted Parquet via DuckDB — because
  that loses the independent-oracle property — use Postgres on the restored pg_dump as the oracle, then validate that DuckDB
  on the converted Parquet matches"
- "DO NOT skip the encoding round-trip gate — because silent NFC/NFD normalization in the Parquet writer will break predicate
  matching on accented names without producing any error message — fail loud at build time"
- "DO NOT hard-code joinorder-specific logic in benchbox/core/data_fetch/ — because the whole point is reuse for ClickBench
  / future real-data benchmarks — keep the module benchmark-agnostic; joinorder-specific config goes in benchbox/core/joinorder/data_manifest.toml"
- "DO NOT commit the full canonical Parquet archive to git — because it is ~1.5 GB and slows every clone — only the tiny fixture
  (~1MB) is checked in; the full archive lives only on the GitHub Release"
- "DO NOT publish the GitHub Release as non-draft in this TODO — because the live URL is consumed by code that doesn't exist
  yet — staging stays draft until cutover TODO's UAT smoke test passes"
- "DO NOT add joinorder-specific exception classes — because the data_fetch infrastructure is meant for reuse — exceptions
  live in benchbox/core/data_fetch/errors.py and are benchmark-agnostic"

