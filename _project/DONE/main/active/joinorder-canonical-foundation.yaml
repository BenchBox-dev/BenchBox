- id: w5
  summary: "Per-table CSV extract from restored Postgres with UTF-8 fidelity"
  status: done
  needs: [w4]
  notes: |
    For each of 21 IMDb tables in the restored Postgres:
      COPY <table> TO '/tmp/<table>.csv' WITH (
        FORMAT csv,
        ENCODING 'UTF8',
        HEADER true,
        QUOTE '"',
        ESCAPE '"',
        FORCE_QUOTE *
      )

    No NFC/NFD normalization in the extract step. Verify via
    sampling: extract a row containing accented characters
    (e.g., from `name` table) and assert byte-for-byte match
    against Postgres SELECT output.

    Output: 21 CSV files with provenance (per-file sha256
    captured for the manifest).

- id: w6
  summary: "CSV → Parquet conversion via DuckDB with zstd compression"
  status: done
  needs: [w5]
  notes: |
    For each of 21 CSVs, convert to Parquet via DuckDB:
      COPY (SELECT * FROM read_csv_auto('<file>.csv'))
        TO '<file>.parquet' (
          FORMAT 'parquet',
          COMPRESSION 'zstd',
          ROW_GROUP_SIZE 100000
        )

    Schema preservation: `read_csv_auto` infers types; verify
    against the Postgres source schema (pg_dump metadata).
    Mismatches must be caught: explicit type casting per table
    if necessary. Document any forced types in the manifest.

    Output: 21 Parquet files + per-file sha256 captured for the
    manifest.

- id: w7
  summary: "Provenance manifest assembly with full reproducibility metadata"
  status: done
  needs: [w6]
  notes: |
    Assemble `data_manifest.toml` with:
      - dataset_version: logical immutable id, e.g.
        `joinorder-imdb-2013-v1`
      - script git SHA (from `git rev-parse HEAD` at build time)
      - DuckDB version (from `duckdb.__version__`)
      - Postgres image tag (pinned in w4)
      - source DOI, retrieval timestamp (ISO-8601 UTC),
        upstream pg_dump sha256
      - per-table block: file path, row count, sha256, schema
        (column name → Postgres type)
      - data_archive_hash: aggregate sha256 over all per-file
        hashes in deterministic table order
      - manifest_hash: sha256 of the final data_manifest.toml
        contents after all fields are populated

    The manifest is the gate document: any byte-difference in
    the conversion downstream changes data_archive_hash and then
    manifest_hash. dataset_version is a human-stable release id;
    if the archive bytes change, either keep the same logical
    dataset_version with a new manifest_hash for a metadata-only
    correction, or intentionally bump dataset_version for a data
    change. The design doc from w1 must state this policy.

- id: w8
  summary: "Encoding round-trip gate (build-time pipeline assertion)"
  status: done
  needs: [w7]
  notes: |
    After Parquet conversion, the pipeline MUST assert encoding
    fidelity. Sample the following classes of rows:
      - non-ASCII names from `name`, `aka_name` (e.g., accented chars,
        ideographic chars in actor names)
      - non-ASCII titles from `title`, `aka_title`
      - punctuation-heavy notes from `cast_info.note`,
        `movie_companies.note`

    Round-trip test:
      Parquet → DuckDB scan → compare typed values against the
      Postgres source rows for sampled primary keys, and compare
      UTF-8 byte sequences for string/text columns before any
      normalization. Do not require whole-row CSV serializer output
      to be byte-identical; CSV quoting, ordering, and NULL
      representation can legitimately differ across tools.

    Pipeline aborts (non-zero exit) if any sampled value or string
    byte sequence differs.
    This catches silent NFC/NFD normalization or encoding drift in
    the DuckDB writer. Sample size: 100 rows per table from the
    canonical-tricky set above.

- id: w9
  summary: "Canonical predicate-domain validation gate (known-zero preserving)"
  status: done
  needs: [w7]
  notes: |
    The defect that makes synthetic JOB worthless is that
    `movie_companies.note` and `cast_info.note` are always NULL,
    so queries filtering on those values match nothing. The
    pipeline MUST assert the canonical source/query pair has the
    expected predicate-domain shape.

    For each of the 113 canonical JOB queries:
      - Compute underlying joined predicate cardinality via Postgres
        by replacing the aggregate SELECT list with COUNT(*).
      - Assert known-zero canonical queries `2c`, `5a`, `5b`, `10b`,
        and `32a` have exactly 0 underlying rows. These are also zero
        on the original CWI JOB archive, so they are part of the
        canonical oracle rather than Dataverse restore corruption.
      - Assert every other canonical query has >=1 underlying joined
        row.
      - Preserve aggregate-result semantics separately: the known-zero
        queries are MIN aggregate queries without GROUP BY, so SQL
        returns one row with NULL aggregate values even though the
        underlying join is empty.

    Exact null-count assertions against the restored canonical source:
      - movie_companies.note: 1,271,989 NULL / 2,609,129 rows
      - cast_info.note: 22,007,252 NULL / 36,244,344 rows
      - title.episode_of_id: 985,048 NULL / 2,528,312 rows

    Pipeline aborts if any non-known-zero query becomes empty, any
    known-zero query becomes nonzero, or any exact null count drifts.

- id: w10
  summary: "Import 113 canonical JOB queries from gregrahn into a build-input directory"
  status: done
  needs: [w7]
  notes: |
    Source: gregrahn/join-order-benchmark canonical 113 queries
    (1a-33c). Pin the gregrahn commit SHA used (record in build
    manifest provenance) so the import is reproducible.

    Output: `_project/joinorder/build-inputs/queries/{1a,...,33c}.sql`
    One file per query, exact text from upstream (no rewrites).

    NOT committed to benchbox/core/joinorder/queries.py — that
    is the cutover TODO's responsibility. Build-inputs directory
    is the staging area used only by the offline pipeline.

    Sanity check: each .sql file is parseable by
    `sqlglot.parse_one(text, read="postgres")` without error.

- id: w11
  summary: "Compute reference cardinalities via PostgreSQL oracle"
  status: done
  needs: [w10, w9]
  notes: |
    For each of 113 queries, run against the restored Postgres
    on canonical converted data and capture:
      - row_count (integer)
      - first_row_sha256 (sha256 of the canonical-ordered first row;
        query rewritten as `SELECT ... FROM (<query>) ORDER BY 1,2,...`
        for deterministic ordering)
      - postgres_version
      - query_id (canonical "1a", "33c" etc.)

    Output: `_project/joinorder/reference_cardinalities.json`
    (committed to repo). Schema:
      {
        "postgres_version": "16.2",
        "dataset_version": "joinorder-imdb-2013-v1",
        "manifest_hash": "<sha256(data_manifest.toml)>",
        "data_archive_hash": "<aggregate-data-sha256>",
        "gregrahn_commit": "<sha>",
        "queries": {
          "1a": {"row_count": ..., "first_row_sha256": "..."},
          ...
        }
      }

- id: w12
  summary: "Cross-check reference cardinalities against Leis 2015 published values"
  status: done
  needs: [w11]
  notes: |
    First verify whether Leis et al. 2015 or companion JOB materials
    publish usable result cardinalities for any of the 113 queries.
    The papers primarily publish optimizer/cardinality-estimation
    error distributions, not a complete answer-set oracle, so this
    work unit must not assume a table of reference row counts exists.
    Cross-check our computed cardinalities only for values that are
    actually published or otherwise traceable to a stable upstream
    artifact.

    Output: `_project/joinorder/cardinality-cross-check.md`
    Lists each query for which a published/traceable count exists,
    reports our computed count and PASS / DRIFT verdict. If no
    suitable published counts exist, the report must say so plainly
    and explain that the authoritative oracle for BenchBox is the
    Postgres run captured in w11. Drift > ±2% on any traceable count
    requires investigation before proceeding.

