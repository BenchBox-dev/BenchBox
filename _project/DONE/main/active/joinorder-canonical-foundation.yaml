  notes: |
    Script foundation: `_project/scripts/build_joinorder_data.py`

    This work unit produces a runnable pipeline skeleton that:
      1. Downloads the Harvard Dataverse pg_dump
         (doi:10.7910/DVN/2QYZBT); records upstream sha256 to
         a build manifest
      2. Spins up an ephemeral Postgres container via docker
