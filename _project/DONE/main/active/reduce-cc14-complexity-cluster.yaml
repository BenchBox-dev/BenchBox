id: reduce-cc14-complexity-cluster
title: "Reduce CC 14 complexity cluster — exclude 8 inherent, refactor 8 to ≤10"
worktree: main
priority: Medium
status: Completed
completed_date: "2026-03-12"
description: |
  After resolving all CC ≥20 violations, 16 functions remain at CC 14 (the new
  ceiling). Each was evaluated by reading the implementation and classifying
  complexity as inherent (driven by domain semantics — type dispatch, protocol
  steps, format combinations) or accidental (refactorable via extraction or
  data-driven patterns).

  8 functions have inherent complexity and should be added to exclude_functions.
  8 functions have accidental complexity and should be refactored to CC ≤10.

  Goal: lower the complexity ceiling from 14 to ≤13, with no regressions.

category: Code Quality

deps:
  needs: []

work:
- id: w1
  summary: "Exclude 8 inherent-complexity CC 14 functions in pyproject.toml"
  status: done
  note: |
    Functions to exclude with rationale:

    1. builder.py:to_dict (CC=14) — conditional serialization of 12 optional
       fields; each `if` guards one field, no branching logic to extract.

    2. clickhouse_cloud.py:_create_external_tables_via_s3 (CC=14) — 4-way
       format dispatch (iceberg-local, iceberg-cloud, parquet-local,
       parquet-cloud) with genuinely distinct S3 upload and source_expr
       construction per format.

    3. databricks/adapter.py:get_platform_info (CC=14) — independent
       try/except probes for client lib version, runtime version, and
       warehouse metadata via SDK; same inherent pattern as the already-
       excluded BigQuery and Redshift get_platform_info functions.

    4. dataframe/benchmark_mixin.py:run_benchmark (CC=14) — orchestration
       flow: memory check → validation → context → load → execute → build
       result. Each step is sequential and distinct.

    5. redshift.py:apply_table_tunings (CC=14) — Redshift DDL constraints
       require individual inspection of DISTSTYLE/DISTKEY/SORTKEY columns
       and conditional ALTER/CTAS recreation.

    6. format_converters/base.py:map_sql_type_to_arrow (CC=14) — type dispatch
       where DECIMAL requires parameter parsing; dict-based approach would
       need special-case handling that doesn't reduce real complexity.

    7. input_validation.py:validate_query_id (CC=14) — input validation with
       benchmark-specific allowlists (TPC-H, TPC-DS, SSB); each benchmark
       has distinct ID format rules (e.g. variant suffixes for TPC-H/DS).

    8. stale_artifact_pruning.py:prune_stale_table_artifacts (CC=14) —
       file cleanup across compressed/uncompressed × single/sharded ×
       expected-format modes; branching reflects real format combinations.

- id: w2
  summary: "Refactor _format_property_diff (CC 14→~4) — dict dispatch replacing if/elif chain"
  status: done
  needs: [w1]
  note: |
    File: benchbox/core/query_plans/visualization.py:334
    Pattern: 8 sequential `if "key" in diffs` blocks, each formatting one
    property type identically (extract left/right, format string).
    Approach: Build a _PROPERTY_FORMATTERS dict mapping diff keys to
    formatter callables or format-string templates. Main function becomes
    a single dict lookup + fallback.

- id: w3
  summary: "Refactor _populate_dataframe_query_details (CC 14→~6) — extract impl resolution"
  status: done
  needs: [w1]
  note: |
    File: benchbox/mcp/tools/benchmark.py:713
    Pattern: Nested if/elif for family × impl (expression/pandas) selection
    with 6 branches and fallback logic.
    Approach: Extract _resolve_dataframe_impl(df_query, family) → (impl, family)
    that encapsulates the priority cascade. Main function becomes linear:
    resolve impl → get source → populate response.

- id: w4
  summary: "Refactor generate_ascii_chart (CC 14→~5) — extract resampling and grid building"
  status: done
  needs: [w1]
  note: |
    File: benchbox/monitoring/report.py:42
    Pattern: Three interleaved concerns — normalization, resampling, and
    character-grid rendering — in a single function.
    Approach: Extract _resample_to_width(series, width) and
    _build_chart_grid(normalized, height, min_val, max_val) as private
    helpers. Main function becomes: normalize → resample → build grid.

- id: w5
  summary: "Refactor _rewrite_bulk_load_sql (CC 14→~4) — extract per-pattern rewrite helpers"
  status: done
  needs: [w1]
  note: |
    File: benchbox/platforms/datafusion_write_transformer.py:44
    Pattern: Three independent SQL rewrite patterns (multi-file UNION ALL,
    COPY-based, read_csv_auto) each with distinct regex + rewriting logic.
    Approach: Extract _rewrite_multi_file(), _rewrite_copy_based(), and
    _rewrite_csv_auto() helpers. Main function tries each in order.

- id: w6
  summary: "Refactor _validate_with_manifest (CC 14→~6) — extract shared entry validation"
  status: done
  needs: [w1]
  note: |
    File: benchbox/utils/data_validation.py:468
    Pattern: Two branches (known tables with expectations vs unknown tables)
    that share nearly identical per-entry validation (check path, size,
    file existence).
    Approach: Extract _validate_manifest_entries(entries, data_dir) → (ok,
    issues, file_sizes) to deduplicate the shared validation logic.

- id: w7
  summary: "Refactor _create_enhanced_schema_creation_phase (CC 14→~5) — extract table name resolution"
  status: done
  needs: [w1]
  note: |
    File: benchbox/platforms/base/adapter.py:2329
    Pattern: Three fallback attempts to extract table names from benchmark
    object (get_table_names(), .tables, ._impl.tables) plus a nested
    _extract_table_names() with 5-way type dispatch.
    Approach: Extract _resolve_table_names(benchmark) → list[str] that
    encapsulates the fallback chain. The nested _extract_table_names is
    already well-isolated; move it to module level.

- id: w8
  summary: "Refactor parse_database_name (CC 14→~6) — data-driven keyword extraction"
  status: done
  needs: [w1]
  note: |
    File: benchbox/utils/database_naming.py:358
    Pattern: Sequential scanning of parts list for tuning mode keywords,
    constraint keywords, and optimization keywords — three independent loops.
    Approach: Consolidate keyword scanning using classification dicts:
    TUNING_KEYWORDS = {"notuning": "notuning", "tuned": "tuned", ...}
    etc. Replace three loops with a single-pass classifier or use set
    intersection.

- id: w9
  summary: "Refactor convert (vortex) (CC 14→~7) — extract writer dispatch"
  status: done
  needs: [w1]
  note: |
    File: benchbox/utils/format_converters/vortex_converter.py:125
    Pattern: DuckDB-first → Python-bindings fallback writer selection with
    interleaved progress callbacks and error handling.
    Approach: Extract _write_vortex_file(table, output_path, opts) → str
    (writer name) that encapsulates the two-writer fallback logic.
    Main convert() becomes: validate → read → write → build result.

verification:
- description: "Complexity check passes"
  command: "make complexity-check"
  expected_output: "PASSED: all functions within complexity limit of 20"
- description: "No new functions at CC 14 (ceiling should be ≤13)"
  command: "uv run -- python scripts/check_complexity.py --no-fail 2>&1 | head -5"
  expected_output: "Top functions should be CC ≤13"
- description: "No regressions in fast suite"
  command: "uv run -- python -m pytest -m fast -q"
  expected_output: "All fast tests pass"
- description: "Lint passes"
  command: "uv run ruff check ."
  expected_output: "All checks passed"

must_preserve:
- "All refactored functions must produce identical behavior — no semantic changes"
- "Existing tests must continue to pass without modification"
- "exclude_functions entries must include CC score and rationale comment"
- "Excluded functions from prior complexity work remain untouched"

approach: |
  w1: Add 8 entries to pyproject.toml [tool.benchbox.complexity] exclude_functions
  following the existing format: "file:function",  # CC — rationale

  w2-w9: For each refactoring:
  1. Read the function and its callers/tests
  2. Extract private helper methods in the same module
  3. Run focused tests + lint after each extraction
  4. Verify CC reduced via: uv run -- python scripts/check_complexity.py 2>&1 | grep function_name
  5. Commit per work unit

anti_patterns:
- "DO NOT change public API signatures — because all targets are internal functions"
- "DO NOT add new abstractions (base classes, protocols) — because extraction alone achieves the CC target"
- "DO NOT move code to new files — because helpers share private state with the parent function"
- "DO NOT refactor functions classified as inherent — because their complexity reflects domain reality; use exclude_functions
  instead"

scope_limit:
  only_modify:
  - "pyproject.toml"
  - "benchbox/core/query_plans/visualization.py"
  - "benchbox/mcp/tools/benchmark.py"
  - "benchbox/monitoring/report.py"
  - "benchbox/platforms/base/adapter.py"
  - "benchbox/platforms/datafusion_write_transformer.py"
  - "benchbox/utils/data_validation.py"
  - "benchbox/utils/database_naming.py"
  - "benchbox/utils/format_converters/vortex_converter.py"
