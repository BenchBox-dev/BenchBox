id: results-explorer-uat-defect-dask-resource-envelope
title: "UAT defect: Dask DataFrame resource envelope and exit-137 reporting"
worktree: main
priority: "Medium-High"
status: "Completed"
category: "Testing and Quality Assurance"
completed_date: "2026-05-03"

description: |
  Dask DataFrame produced repeated exit-137/resource-spike failures in the UAT
  sweep, including TPC-H, TPC-DS SF 0.1, read primitives SF 1.0, FlightData, and
  TPCHavoc. Dask ClickBench timed out at the 600-second cap. The behavior also
  caused transient disk-space dips that recovered after subprocess exit.

work:
- id: w1
  summary: "Identify the Dask-owned runtime/config files before editing"
  status: done
  notes: |
    W1 ownership research complete. UAT evidence lives in
    _project/handoffs/results-explorer-uat-retrospective-20260502.md, which
    records Dask exit-137/resource-spike failures for TPC-H, TPC-DS SF 0.1,
    read primitives SF 1.0, FlightData, and TPCHavoc, plus a Dask ClickBench
    600-second timeout.

    W2 should primarily own benchbox/platforms/dataframe/dask_df.py for local
    cluster defaults, memory/spill configuration, spill-directory cleanup, and
    Dask-specific resource diagnostic text. CLI-facing Dask option defaults are
    registered in benchbox/platforms/__init__.py. If Dask query compute
    diagnostics cannot be routed through the adapter from the existing shared
    path, the only shared fallback file is
    benchbox/platforms/dataframe/pandas_family.py.

    W3 should own tests/unit/platforms/dataframe/test_dask_df_coverage.py and,
    only if CLI option default assertions change,
    tests/unit/platforms/dataframe/test_pandas_family_adapters.py.
- id: w2
  summary: "Define local resource limits, spill cleanup, and clearer exit-137 diagnostics"
  needs: [w1]
  status: done
  notes: |
    Query-level reduction isolated the opaque exit-137 reproducer to TPC-H Q10
    in the Pandas-family implementation. Predicate pushdown and projection
    reduction did not prevent the parent-process kill, while the remaining 21
    TPC-H queries passed as a subset. W2 therefore owns a Dask adapter guard
    that classifies TPC-H Q10 as a resource-envelope failure before executing
    the known parent-killing graph.
- id: w3
  summary: "Add targeted coverage for Dask resource-limit reporting"
  needs: [w2]
  status: done

verification:
- description: "Dask local smoke either passes or reports a clear resource-envelope failure."
  command: "uv run -- benchbox run --platform dask-df --benchmark tpch --scale 0.01 --phases load,power --non-interactive"
  expected_output: "completed result or explicit resource-envelope diagnostic, not opaque exit 137"
- description: "Fast tests remain green."
  command: "uv run -- python -m pytest -m fast -q"
  expected_output: "all selected tests pass"

must_preserve:
- "Dask remains optional and does not affect base installs."
- "Resource cleanup must not delete reusable generated benchmark source data."

anti_patterns:
- "DO NOT treat exit 137 as a generic benchmark failure -- because it is an environment/resource signal -- surface that classification
  explicitly."

approach: |
  Preserve reusable generated source data under benchmark_runs/datagen/. Dask
  cleanup may remove only Dask-owned spill/runtime directories and loaded
  database/output artifacts created for the current verification run; it must
  not delete TPC-H source data because read, write, transaction, and related
  primitives reuse that source corpus.

  Prefer Dask-owned adapter changes first. Use the existing
  DataFrameTuningConfiguration memory/spill fields where a user supplied tuning
  config exists, and add conservative local defaults only where untuned CLI
  Dask currently has no resource envelope. Keep Dask optional: no base install
  imports should require Dask.

scope_limit:
  only_modify:
  - "_project/TODO/main/active/results-explorer-uat-defect-dask-resource-envelope.yaml"
  - "benchbox/platforms/dataframe/dask_df.py"
  - "benchbox/platforms/__init__.py"
  - "benchbox/platforms/dataframe/pandas_family.py"
  - "tests/unit/platforms/dataframe/test_dask_df_coverage.py"
  - "tests/unit/platforms/dataframe/test_pandas_family_adapters.py"

