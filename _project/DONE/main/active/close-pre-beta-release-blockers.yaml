impact:
  business_value: |
    Creates a defensible Beta release surface. Users and evaluators should see
    one clear product status, one accurate installation story, and one package
    boundary instead of mixed signals that undermine launch credibility.
  user_impact: |
    Prevents users from following stale install instructions, misunderstanding
    support status, or inferring support for namespaces/features that BenchBox
    does not actually stand behind.
  technical_debt: |
    Converts release-policy drift into explicit invariants and narrows static
    analysis noise on the command path most users hit first.

