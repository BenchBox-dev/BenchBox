must_preserve:
- "`uv run -- benchbox --help`, `uv run -- benchbox --version`, and `uv run -- benchbox run --help` continue to exit 0 and
  expose the current command set."
- "The completed `move-duckdb-to-optional-extras` rationale is not accidentally reversed by docs-only edits; packaging and
  docs must agree."
- "`benchbox.experimental` stays out of `benchbox.__all__` and benchmark registries regardless of whether it remains in or
  leaves the default wheel."
- "`benchbox.release` remains excluded from the default wheel."
- "`uv run -- python -m pytest -m fast -q` remains green after any release-surface cleanup."

approach: |
  Use the 2026-04-01 review findings as the input set, but ground every change
  in existing local decisions:
  - `move-duckdb-to-optional-extras`
  - `isolate-experimental-core-subsystems`
  - `remove-release-tooling-from-wheel`

  Resolve policy/documentation questions first, then implement any packaging
  boundary changes, then clean the targeted `ty` diagnostics, then ratchet
  regression tests. Prefer extending existing release/version/package tests over
  inventing one-off scripts.

anti_patterns:
- "DO NOT update only `README.md` -- because the FAQ, installation guide, and version-reporting surfaces will drift again
  -- update all canonical current-state docs in the same pass."
- "DO NOT claim DuckDB is part of the default install unless `[project.dependencies]` actually says so -- because users will
  hit import/runtime mismatches -- either change packaging or change docs, but not one without the other."
- "DO NOT use `MANIFEST.in` as the mechanism for wheel package exclusion -- because wheels are controlled by setuptools package
  discovery/package-data -- update `pyproject.toml` packaging config instead."
- "DO NOT add `benchbox.experimental` to public exports or benchmark registries to make the packaging policy feel simpler
  -- because that would silently expand the supported Beta surface -- keep it explicitly unsupported or explicitly out of
  the default wheel."
- "DO NOT try to zero the entire repository-wide `ty` backlog inside this item -- because that turns a focused release blocker
  into an unbounded cleanup -- ratchet the release-critical entrypoints first and open follow-up work for the rest."

verification:
- description: "Current-state docs no longer contain stale Alpha/default-DuckDB claims"
  command: "rg -n \"Status-Alpha|alpha software|Alpha Software|works with DuckDB out of the box|automatically installed as
    a dependency\" README.md docs/README.md docs/usage/faq.md docs/usage/installation.md docs/platforms/platform-selection-guide.md
    docs/platforms/duckdb.md"
  expected_output: "No matches for stale current-state status/install claims"
- description: "Release-critical entrypoints are clean under ty"
  command: "uv run ty check benchbox/cli/commands/run.py benchbox/base.py benchbox/__init__.py"
  expected_output: "Found 0 diagnostics"
- description: "Version/package/release regression tests pass"
  command: "uv run -- python -m pytest tests/unit/cli/test_cli_package_exports.py tests/unit/cli/test_cli_version_command.py
    tests/unit/test_version_management.py tests/unit/utils/test_version_markers.py tests/unit/test_release_exclusion_invariants.py
    tests/unit/test_release_infrastructure.py -q"
  expected_output: "All selected tests pass"
- description: "Default distribution contents match the documented Beta support policy"
  command: "uv build --sdist --wheel && unzip -l dist/benchbox-*.whl | rg 'benchbox/(experimental|release)/'"
  expected_output: "`benchbox/release` absent; `benchbox/experimental` presence or absence matches the documented policy and
    its tests"
- description: "Overall smoke gate remains green"
  command: "uv run -- python -m pytest -m fast -q && uv run -- benchbox --help && uv run -- benchbox --version && uv run --
    benchbox run --help"
  expected_output: "Fast suite passes and all CLI help/version commands exit 0"

