context_sections:
  "Review Findings": |
    The triggering review found:
    - Beta classifier in `pyproject.toml` while README/FAQ still said Alpha.
    - Contradictory default-install guidance after DuckDB became optional.
    - A default wheel that still ships `benchbox.experimental` without a fully
      explicit Beta support boundary.
    - A `ty` warning backlog large enough to hide release-critical issues.

  "Prior Decisions To Reconcile": |
    The repo already contains completed items that intentionally changed the
    install and namespace story:
    - `move-duckdb-to-optional-extras`
    - `isolate-experimental-core-subsystems`
    - `remove-release-tooling-from-wheel`

    This item should treat those as baseline decisions, then either reaffirm
    them coherently for Beta or replace them deliberately and consistently.

success_metrics:
- "Canonical docs, metadata, and CLI version/help surfaces all present one consistent release status."
- "Install instructions accurately match the real dependency surface for DuckDB and other default workflows."
- "Wheel contents match the documented support boundary for both `benchbox.release` and `benchbox.experimental`."
- "Targeted `uv run ty check` on the release-critical entrypoints reports zero diagnostics."
- "Fast tests, build artifacts, and CLI smoke commands remain green after the cleanup."

open_questions:
- "Should Beta ship `benchbox.experimental` in the default wheel as an explicit unsupported namespace, or should the default
  distribution exclude it entirely?"
- "If the final Beta flip is deferred until the release branch/cut, should the repository temporarily return all current-state
  surfaces to Alpha until w10 completes?"
