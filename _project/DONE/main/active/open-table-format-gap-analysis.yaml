      - dataproc: [delta, iceberg, parquet, tbl, csv]
      - dataproc-serverless: [delta, iceberg, parquet, tbl, csv]
      - synapse-spark: [delta, parquet, tbl, csv]
      - athena-spark: [parquet, tbl, csv]
      Add these platforms to supported_platforms in DELTA/ICEBERG/PARQUET capabilities.

  - id: w3
    summary: "Add Presto and Trino to format capabilities"
    status: done
    needs: []
    description: |
      Add PLATFORM_FORMAT_PREFERENCES entries for:
      - presto: [iceberg, delta, parquet, tbl, csv]
      - trino: [iceberg, delta, parquet, tbl, csv]
      Add presto/trino to DELTA_CAPABILITY and ICEBERG_CAPABILITY supported_platforms.
      Both use catalogs (not file-based loading), so support level is EXTENSION.

  - id: w4
    summary: "Register cloud lakehouse platforms"
    status: done
    needs: [w1]
    description: |
      Add PLATFORM_FORMAT_PREFERENCES for:
      - fabric-lakehouse: [delta, parquet, tbl, csv]
      - fabric-spark: [delta, parquet, tbl, csv]
      - quanton: [iceberg, hudi, delta, parquet, tbl, csv]
      - lakesail: [iceberg, hudi, delta, parquet, tbl, csv]
      Add these platforms to DELTA/ICEBERG capabilities (and HUDI for quanton/lakesail).

  - id: w5
    summary: "Register Snowflake, ClickHouse, Redshift, and BigQuery format gaps"
    status: done
    needs: []
    description: |
      Snowflake:
      - Add snowflake to ICEBERG_CAPABILITY.supported_platforms (EXTENSION)
      - Add snowflake to DELTA_CAPABILITY.supported_platforms (EXTENSION)
      - Update snowflake PLATFORM_FORMAT_PREFERENCES: [parquet, delta, iceberg, tbl, csv]
      - Snowflake supports Delta via external tables (TABLE_FORMAT=DELTA) and Delta Direct
      - Snowflake supports Iceberg Tables (managed + unmanaged) since 2024

      ClickHouse:
      - Add clickhouse to DELTA_CAPABILITY.supported_platforms (EXTENSION)
      - Add clickhouse to ICEBERG_CAPABILITY.supported_platforms (EXTENSION)
      - Update clickhouse PLATFORM_FORMAT_PREFERENCES: [parquet, delta, iceberg, tbl, csv]

      Redshift:
      - Add redshift to DELTA_CAPABILITY.supported_platforms (EXTENSION)
      - Update redshift PLATFORM_FORMAT_PREFERENCES: [parquet, delta, tbl, csv]
      - Redshift Spectrum supports read-only Delta Lake queries (since 2020, via manifest)
      - Iceberg support is preview-only - defer until production-ready

      BigQuery:
      - Add bigquery to DELTA_CAPABILITY.supported_platforms (EXTENSION)
      - Update bigquery PLATFORM_FORMAT_PREFERENCES: [parquet, delta, tbl, csv]
      - BigQuery has native Delta Lake support via BigLake (since mid-2024)
      - Iceberg via BigLake also supported - defer to d4 for investigation

      NOTE: All four platform adapters lack loading code for these new formats.
      Registering them in capabilities means the fail-fast check passes, but loading
      will still fail until adapter code is added. This work unit should document
      which adapter methods need implementation.

  - id: w6
    summary: "Update format_capabilities tests for all new registrations"
    status: done
    needs: [w1, w2, w3, w4, w5]
    description: |
      Update tests/unit/platforms/base/test_format_capabilities.py:
      - Add test cases for HUDI capability
      - Update existing delta/iceberg tests for newly registered platforms
      - Add tests for new PLATFORM_FORMAT_PREFERENCES entries
      - Verify get_supported_formats() returns correct lists for all platforms
      - Verify is_format_supported() for all new platform/format combinations

  - id: w7
    summary: "Verify each platform adapter's loading code handles registered formats"
    status: done
    needs: [w6]
    description: |
      Audit completed 2026-03-05. Results:

      DONE (has loading code):
      - Spark-based (cloud_spark): Full SparkDDLGeneratorMixin with delta/iceberg/hudi tuning
      - Quanton: Full DDL generation for all three formats via _generate_create_table_ddl()

      PARTIAL (catalog/config-based, no explicit loading code):
      - Presto: Supports --table-format with catalogs, but relies on external catalog setup
      - Trino: Supports --table-format ["memory","hive","iceberg","delta"], catalog-based
      - Fabric Spark: Comments mention Delta support, inherits SparkTuningMixin
      - Snowflake: No format-specific loading code (external table mechanism only)

      CORRECTED (removed from registry - adapter cannot use these formats):
      - LakeSail: Adapter restricts to ["parquet","orc"]; removed from delta/iceberg/hudi

      GAP (registered but no loading code):
      - Synapse Spark: No table format selection despite inheriting SparkTuningMixin
      - ClickHouse: No deltaLake()/iceberg() table function code
      - Redshift: No Delta Spectrum external table code
      - BigQuery: No Delta BigLake loading code
      - Fabric Lakehouse: Read-only SQL endpoint, cannot create/load data

      These adapter gaps need follow-up TODOs for implementation.

