scope_limit:
  in_scope:
    - "format_capabilities.py registry and its tests"
    - "PLATFORM_FORMAT_PREFERENCES entries"
    - "CAPABILITIES_REGISTRY entries"
  out_of_scope:
    - "Platform adapter loading code (unless a registered format lacks implementation)"
    - "Adding formats a platform cannot actually use (speculative support)"
    - "ORC and Hive format support (not open table formats BenchBox manages)"

verification:
  command: "uv run -- python -m pytest tests/unit/platforms/base/test_format_capabilities.py -q --override-ini='addopts='"
  expected: "All tests pass"

approach: |
  Work in format_capabilities.py first (pure data registration, no logic changes).
  Reference existing DELTA_CAPABILITY pattern for new capabilities.
  Use EXTENSION support level for formats that need extra packages (deltalake, pyiceberg, hudi).
  Use NATIVE for formats built into the platform (Databricks delta, Quanton iceberg).

anti_patterns:
  - "DO NOT register a format for a platform that cannot actually use it -- because the fail-fast check in runner.py will allow
    the run to proceed and then fail at load time -- instead only register formats with confirmed platform support"
  - "DO NOT add loading code for formats without live platform access to test -- because untested loading paths will give false
    confidence -- instead mark those as needing integration testing in the work unit"
  - "DO NOT confuse storage formats (ORC) or catalog layers (Hive) with open table formats -- because BenchBox's --table-format
    flag manages table formats like Delta/Iceberg that datagen produces -- instead keep scope to formats BenchBox actually generates
    and loads"
