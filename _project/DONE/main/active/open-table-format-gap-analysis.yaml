    summary: "Add HUDI_CAPABILITY to registry"
    status: done
    needs: []
    description: |
      Create HUDI_CAPABILITY FormatCapability in format_capabilities.py:
      - format_name: "hudi", display_name: "Apache Hudi"
      - features: time_travel, acid_transactions, schema_evolution, compaction,
        copy_on_write, merge_on_read
      - supported_platforms: spark (EXTENSION), quanton (NATIVE),
        lakesail (EXTENSION), emr-serverless (EXTENSION),
        dataproc (EXTENSION), dataproc-serverless (EXTENSION)
      - NOT databricks - the Databricks SQL adapter has no Hudi loading code
      Add to CAPABILITIES_REGISTRY dict.

  - id: w2
    summary: "Add Spark-based platforms to format preferences and capabilities"
    status: done
    needs: [w1]
    description: |
      Add PLATFORM_FORMAT_PREFERENCES entries for:
      - spark: [delta, iceberg, hudi, parquet, tbl, csv]
