metadata:
  owners:
    - "joeharris76"
  tags:
    - codex-review
    - quality
    - security
    - dev-loop
  estimated_effort: "Medium"
  created_date: "2026-05-03"
  last_updated: "2026-05-04T12:00:00Z"

impact:
  business_value: |
    Codex review feedback that lands on merged PRs is currently the most
    consistent signal of correctness regressions and security gaps, but
    the squash-merge workflow means findings ship to develop unless
    explicitly re-swept. The first sweep
    (`codex-pr-review-followups-week-2026-05-01`) demonstrated the
    pattern; this is the second weekly cadence and includes two
    security findings (PR #113 secret-key normalization, PR #147 cwd
    code execution) plus three correctness defects (PR #114 multi-row
    scalar validation, PR #141 cost.total_usd round-trip, PR #144
    unconditional Q10 skip).
  user_impact: |
    Direct user-facing effects in this batch: broken plan download
    links (PR #103); single-select regressions on the leaderboard
    (PR #102); chart axis miscues (PR #107); explorer initialization
    blocked when optional snapshot tables are empty (PR #127); platform
    check exiting non-zero for legitimately disabled platforms
    (PR #151); `benchbox submit --dry-run` failing on non-source
    installs (PR #147).
  technical_debt: |
    Several findings indicate template-level drift (verification
    commands written without testing them, weekly-sweep template
    bounds, cwd path lookups). Where possible, the recommended fixes
    above include backstops (validators, tests, schema gates) so the
    same shape can't ship again.

# Cross-cutting invariants every work unit MUST honor (per-unit
# specifics live inside each work unit's `notes:` "Must preserve" section).
must_preserve:
  - "Public CLI surfaces (`benchbox submit`, `benchbox results`, `benchbox platforms check`, `benchbox run`) keep their exit-code contracts for unrelated paths — the only changed exit codes are the ones each work unit explicitly names."
  - "Public results-explorer URL/facet contracts (`bm`, `sf`, `instance_or_warehouse`, etc.) keep their existing serde shape — only the read/write merge logic changes."
  - "Existing CI gates (`make pr-preflight`, lint, ty, fast tests) must pass on every work-unit PR."
  - "Existing TODO/blind-spot tooling (`make blind-spots-list`, `make worktree-pool-check`, `_project/scripts/validate_todo.py`) keeps its current invocation shape — w19 changes worktree-pool-check semantics, not its CLI."

approach: |
  Implementation strategy mirrors the prior sweep TODO
  (`codex-pr-review-followups-week-2026-05-01`):

  - **Each work unit is independently shippable.** Don't batch unless
    units share a file. Already merged in this revision: w6 (PR #132,
    one template file) and w10 (PR #147, one validator function). Soft
    pairings expressed via `needs:` so they bundle in the same PR:
    w16 → w3 (`platform_options.py`), w21 → w11 (platform readiness flow).
  - **Read the cited file before editing.** The "Current evidence on
    `origin/develop`" section names the line range so you can confirm
    the issue still exists at fix time; the codebase is moving fast and
    a finding may already be irrelevant.
  - **Land tests with each fix.** Every work unit has a per-unit
    `Verification:` block with a specific pytest/vitest command — run
    it locally before pushing. Most regression tests are new fixtures;
    a few are mutations of existing test files.
  - **Security findings (w3 + w16, w10) are P0-tier within the P1
    batch.** Land them first or in parallel — PR #113's redaction gap
    leaks credentials, PR #147's cwd path enables code execution.
  - **Workflow change (w22) needs CI verification.** It modifies a
    GitHub Actions workflow that runs only on `develop`; review the
    next sync-to-published run after merge to confirm the
    deterministic SHA pin holds.
  - **w8 has an open question** about the precise local-envelope
    predicate (scheduler_address only, or also cluster_mode). Resolve
    against the original OOM repro before editing — see `open_questions`
    below.

anti_patterns:
  - "DO NOT batch unrelated work units into one PR — because each Codex finding lands a focused review thread and a multi-finding PR loses the fix↔thread mapping — open one PR per work unit (or per `needs:`-linked pair)."
  - "DO NOT add new helpers, abstractions, or refactors beyond what the work unit names — because the prior sweep ran into review churn from incidental refactors — keep the diff minimal and add the regression test the work unit calls for."
  - "DO NOT skip writing the regression test 'because the fix is obvious' — because every Codex finding here describes a class of regression that already shipped once — the test is the primary protection against re-introduction."
  - "DO NOT widen the changes to also fix the items listed under `description:` as already-addressed (PR #99/#112/#134/#154) — they are intentionally out of scope; the relevant fixes already exist or are tracked elsewhere."
  - "DO NOT touch `_project/DONE/main/**` from any work unit — because completed items are the source-of-truth for prior sweeps and audits — refile any DONE-related finding as a new TODO instead of editing in place."

verification:
  - description: "All 22 work units land on develop, individually or via `needs:`-linked pairs, with a corresponding follow-up commit referenced in this TODO's `commits:` field."
    command: "for pr in 99 102 103 105 107 110 111 112 113 114 115 117 119 121 122 127 129 131 132 134 141 144 145 147 151 154 161 163 167; do gh api repos/joeharris76/BenchBox/pulls/$pr/comments --jq '[.[] | select(.user.login == \"chatgpt-codex-connector[bot]\")] | length' | { read n; [ \"$n\" -gt 0 ] && echo \"PR #$pr: $n comments\"; }; done"
    expected_output: "Same set of PRs returns matching counts; each work unit's PR is referenced from its corresponding commit in `commits:`."
  - description: "Lint and fast-test gate is green after each work unit's fix"
    command: "make pr-preflight"
    expected_output: "Preflight reports lint, type, and Python fast-test gates passing."
  - description: "Next weekly Codex sweep (week ending 2026-05-10) reports zero unaddressed comments from this batch."
    command: "# Re-run the same scan on PRs #95-#170 with the codex-thread-rescan template; expect every comment from this sweep to be marked Resolved or Already-Fixed."
    expected_output: "All 36 originally-scanned comments classify as Resolved (by w1-w22 commits) or Already-Fixed (per the description filtered set)."

success_metrics:
  - "All 22 work units shipped to `develop` with their named regression tests landing in the same PR."
  - "Two security findings (w3 secret-key normalization, w10 cwd code execution) merged within 7 days of TODO creation."
  - "Zero of the 24 actionable Codex comments from this batch reappear in the next weekly sweep (week ending 2026-05-10)."
  - "No regression in `make pr-preflight` runtime introduced by the new test fixtures (>10% slowdown triggers a follow-up)."
  - "Public cost-contract bundles (PR #105, #141) round-trip with `cost.total_usd` preserved for legacy bundles AND suppressed for `cost_status='unavailable'` modern bundles — confirmed by a parametrized round-trip test."

open_questions:
  - "(w8) Is the dask-df local-envelope predicate `not self.scheduler_address` (covers user-supplied remote schedulers) or also `cluster_mode != 'local'` (covers managed-Dask/Coiled distributed clusters)? Verify against how the original OOM was reproduced; default to the broader predicate if both are needed."
  - "(w6 Axis 2) Should `sweep_blind_spots.py list` get a `--since`/`--until` affordance as a follow-up (Option B), or is the explicit `ls` glob (Option A) sufficient long-term? Decide before the next weekly sweep so the template doesn't drift again."
  - "(w20) Should the hosted vs PR manifest path-level helpers be a public API, or `_`-prefixed test-internal? Public makes future contract tests easier; private keeps the surface small."

