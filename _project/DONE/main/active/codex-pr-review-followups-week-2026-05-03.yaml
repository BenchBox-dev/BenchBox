      Current evidence on `origin/develop`:
        - `tests/integration/test_hosted_submit_validator_contract.py:198-211` —
          two direct `sub._build_submission_manifest(...)` calls with
          identical inputs except `submission_path`.

      Recommended fix: drive each manifest through its corresponding
      path. For PR-flow, drive the same code that
      `benchbox submit --output ...` calls (or a path-level helper);
      for hosted, drive the same code `_dispatch_service_mode` calls.
      Acceptable shortcut: extract a tiny
      `_build_submission_manifest_for_pr_flow()` /
      `_build_submission_manifest_for_hosted_flow()` helper that the
      test calls without faking the rest of the dispatch.

      Must preserve:
        - The other tests in this file (`_run_validator` happy path,
          missing-required-keys negative case) continue to pass.
        - The docstring's contract — "if either path mutates the
          manifest after construction, this test fails" — is now
