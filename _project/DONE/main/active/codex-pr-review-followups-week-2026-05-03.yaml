            case now returns ready (was: environment_skip)."

  - id: w22
    summary: "Pin the sync-results-data-to-published workflow checkout to the triggering SHA"
    status: pending
    notes: |
      Source review comment:
        - PR #167, P2, `.github/workflows/sync-results-data-to-published.yml`
        - https://github.com/joeharris76/BenchBox/pull/167#discussion_r3178675036

      Finding: using `ref: develop` makes the job read whatever
      `develop` points to when the runner starts, not the commit that
      triggered the run. With `concurrency.cancel-in-progress: false`,
      older queued runs can execute after newer pushes and then
      mirror newer corpus content while still naming the branch / PR
      with the older `GITHUB_SHA`, creating misattributed or
      duplicate mirror PRs.

      Current evidence on `origin/develop`:
        - `.github/workflows/sync-results-data-to-published.yml:34-47` —
          `concurrency.cancel-in-progress: false` and
          `actions/checkout@v4` with `ref: develop`.

      Recommended fix: pin the checkout to `${{ github.sha }}` (or
      hard-reset to it before diffing) so each run mirrors the exact
      triggering push deterministically.

      Must preserve:
        - `fetch-depth: 0` stays so subsequent steps can switch
          branches and diff.
        - The "Configure git identity" step (lines 49-52) is
          unchanged.
        - `concurrency.cancel-in-progress: false` is intentional and
          stays — older runs must not be cancelled, just made
          deterministic.

      Verification:
        - description: "Static (local): the diff replaces `ref: develop`
            with `ref: ${{ github.sha }}` and adds no other ref-changing
            logic. Behavioral verification requires CI: after merge,
            replay sequence push A then push B on a test branch in
            repo settings → workflow runs and confirm each run mirrors
            its triggering tree (no cross-attribution)."
        - command: "git diff origin/develop -- .github/workflows/sync-results-data-to-published.yml | grep -E '^\\+.*ref:'"
        - expected_output: "`+ ref: ${{ github.sha }}` appears; no
            other ref-line additions. Behavioral check is manual on
            the next merge to develop (cannot be reproduced locally
            because the workflow only runs in GitHub Actions)."

