work:
  - id: w1
    summary: "Fix the empty-string/null conflation in the DataFrame load path (C1: Q6, Q17, Q18, Q24 are REAL bugs)"
    status: done
    addresses: [C1, "review:CRITICAL C1", "#848 false conclusion"]
    notes: |
      The DataFrame surface conflates SQL '' with None, which changes results, not
      just presentation. Two layers must be decided and fixed:

      ROOT FIX (preferred) - loader fidelity: a CSV empty field in a declared
      string/VARCHAR/TEXT column must materialize as '' (matching DuckDB/SQL), not
      Arrow null. Today convert_csv_to_parquet passes strings_can_be_null=True
      (data_loader.py:329) and pandas read_csv uses default na_values, so empties
      become null on the production path; the gate path (DuckDB->Arrow) keeps ''.
      Decide the canonical contract (recommend: declared-string empties stay '',
      matching the SQL reference and the upstream ClickBench data) and enforce it on
      BOTH load paths. This is the true fix and also resolves Q24/Q17-col1.

      SYMPTOM FIX (only if the loader contract cannot be '' for a real reason):
      make the generated factories null-correct - groupby(..., dropna=False) in
      _make_group_pandas (clickbench queries.py:291; mirror in ssb) and a
      null-aware distinct count instead of bare pandas .nunique() (queries.py:206/
      285). But note this only patches generated factories; hand-written impls and
      future benchmarks would still be exposed - which is why the loader fix is
      preferred.

      Whichever path: verify against the REAL DataFrame run (dataframe_runner /
      benchmark_mixin), not the gate only - the gate bypasses the loader (see w6),
      so a gate-only fix would be invisible to production.
    acceptance:
      - "Q6 COUNT(DISTINCT SearchPhrase) == 18 on DuckDB SQL, Polars expression, AND pandas."
      - "Q17/Q18 GROUP BY count-multisets are identical across all three surfaces (no silently dropped null-key rows)."
      - "Q24 and Q17 col-1 no longer diverge on '' vs None."
      - "A new fast-lane unit test pins the empty-vs-null contract for a declared string column on the production load path."

  - id: w2
    summary: "Make the comparator order-aware and tie-aware; fix the None/NaN sort crash (BS2)"
    status: done
    addresses: [BS2, "review:Blind Spot 2", "review:DEMO1/2/3"]
    progress: |
      DONE. Both previously-open halves of BS2 are now closed (additive, opt-in;
      ResultValidator is extended, never forked).
      (1) ORDER-BY blindness CLOSED: validate_results_exact gained an opt-in
          order_aware mode + an order_by (result-column positions) parameter. When
          enabled it compares rows in RETURNED order - the sequence of distinct
          order-key values must match exactly (so a reversed ORDER BY is CAUGHT),
          while rows sharing an order-key value are a multiset (so a legitimate tie
          reshuffle is NOT flagged) and the final group under a trailing LIMIT is a
          boundary tie (so the tie-aware fix from #858 does not regress). The
          cross_surface gate resolves each query's ORDER BY to result-column
          positions via sqlglot (_order_by_result_key) and enables order_aware only
          when EVERY ORDER BY term maps to a projected column; an unmappable key
          (e.g. clickbench Q24 SELECT *, Q25 ORDER BY a non-projected EventTime)
          returns None and falls back to the order-insensitive comparison rather
          than a silent order-blind "pass" (the residual blind spot is enumerated
          and documented, not muted via a baseline).
      (2) None/non-None sorted() crash FIXED: the comparator now sorts on a
          None-safe, type-safe surrogate (_row_sort_key / _cell_sort_key) so a
          column mixing None with a value (or mixed types) never raises TypeError;
          a genuine None-vs-value difference is reported as a clean MISMATCH, not an
          "error:" from sorted().
      Verified: w10's test_reversed_sort_is_the_bs2_probe FLIPPED from "not caught"
      to CAUGHT on ssb Q3.1 (149 ordered rows); _EXPECT_CAUGHT now expects the
      multi-row reverse_sort caught on ssb/amplab/coffeeshop/clickbench (only
      joinorder_synthetic's single-row no-op stays an expected miss). New fast-lane
      unit suite tests/integration/test_validator_order_aware.py pins reversed-order
      MISMATCH, tie/boundary tolerance, and the None-mixed-column clean MISMATCH
      (never "error:"). All 5 enforced cross-surface gates stay green (ssb 14/26
      discriminating, amplab 12/16, coffeeshop 22/22, clickbench 70 discriminating,
      joinorder 26/26); tie reshuffles still not flagged. TPC-Havoc SQL (220/220)
      and DataFrame (440/440) gates remain byte-identical green - they pass
      order_aware=False, so their path is unchanged. Findings doc
      _project/analysis/cross-surface-mutation-sensitivity.md updated (matrix flips
      to caught + the documented residual non-projected-ORDER-BY blind spot).
    notes: |
      validate_results_exact (validation.py:54-79) sorts full rows then compares
      positionally, so it is simultaneously BLIND to real ORDER BY bugs (a reversed
      order passes - DEMO1) and NOISY on legitimate ties (two equally-valid tie
      picks fail - DEMO2), and it crashes on a column mixing None with non-None
      because Python sorted() cannot order None vs int (DEMO3), which
      find_surface_divergences (dataframe_surface.py:234) then mislabels as
      "error:" instead of a clean result.

      Add an ORDER-AWARE comparison mode for queries that declare an ORDER BY:
        - compare the ordered prefix up to the first tie group exactly (this
          restores ORDER BY signal), then
        - treat the rows sharing the boundary order-key as a MULTISET (this removes
          the tie noise that #848 mistook for the whole story).
      For queries with no ORDER BY, keep multiset/set comparison.
      Fix the sort key to place None deterministically (e.g. sort on a (is_none,
      value) surrogate) so a NULL-bearing column never raises, and so a genuine
      None-vs-value difference is reported as a MISMATCH, not an "error:".

      CRITICAL CONSTRAINT: this comparator is shared with the TPC-Havoc SQL and
      DataFrame gates, which rely on its current semantics and run with empty
      baselines. The order/tie-awareness must be additive (opt-in per query/gate)
      and MUST keep all TPC-Havoc gates byte-identical-green. Do NOT fork the
      validator for cross-surface only; extend it.
    acceptance:
      - "Ten consecutive ClickBench gate runs produce an IDENTICAL divergence set (determinism, jointly with w5)."
      - "A deliberately reversed ORDER BY in a gated DataFrame query is caught (new mutation test, see w9)."
      - "Two equally-valid tie picks at a LIMIT boundary are NOT reported as a divergence."
      - "A result column mixing None and values yields a MISMATCH (if it differs) or a clean pass (if equal), never an 'error:' from sorted()."
      - "All TPC-Havoc SQL and DataFrame equivalence gates remain green with unchanged output."

  - id: w3
    summary: "Eliminate engine nondeterminism at the gate boundary (H1)"
    status: done
    addresses: [H1, "review:HIGH H1", "claim 5"]
    progress: |
      DONE via the w2 tie-aware comparator (#858), NOT the single-thread +
      total-order tie-breaker route this item originally specified. Re-verified
      post-merge: ClickBench reports a STABLE "2 divergent", green, across 3
      identical runs (was 27/25/26); SSB is stable green. The engine still reorders
      tied rows, but the tie-aware comparator makes that reordering irrelevant to
      the gate verdict, which satisfies the determinism acceptance. A dedicated
      byte-stability regression test is folded into w10.
    notes: |
      The wobble is engine tie-ordering, not data. Pin it at the gate:
        - run the gate's DuckDB connection and the Polars/pandas execution
          single-threaded (PRAGMA threads=1; pl.Config / POLARS_MAX_THREADS=1), AND
        - have both surfaces apply a deterministic TOTAL-ORDER tie-breaker before any
          LIMIT (append all remaining columns / a stable key to ORDER BY on the SQL
          reference and the DataFrame impls), so LIMIT truncation is reproducible.
      Document explicitly (in cross_surface.py and the review's "determinism" claim)
      that random.seed(42) makes the DATA reproducible but does NOT make the GATE
      deterministic; the tie-breaker + single-thread is what does.
    acceptance:
      - "Three+ identical ClickBench AND SSB gate runs produce identical reports (count AND per-cell values)."
      - "A regression test asserts gate output is byte-stable across two in-process runs on the same seed."

  - id: w4
    summary: "Fail (not silently pass) on vacuous empty-vs-empty cells; make every gated query discriminating (BS3)"
    status: done
    addresses: [BS3, "review:Blind Spot 3", "claim 4"]
    progress: |
      DONE. Part 1 (gate hygiene) shipped: find_cross_surface_divergences now
      takes an opt-in reference_row_counts out-map; _report uses it to exclude
      vacuous (0-reference-row) cells from the discriminating "compared N of M"
      count, lists them separately, and FAILS the gate on any vacuous query NOT
      classified in a new per-gate CrossSurfaceGate.legitimately_empty mapping
      (mirrors known_divergences, with a written rationale). A per-gate
      scale_factor override (default EQUIVALENCE_SCALE) was also added and threaded
      through run_gate/build/build_production_contexts.
      Part 2 (SSB discrimination): the scale_factor route was tried and REJECTED on
      evidence - all 6 empty SSB queries (Q2.1-2.3, Q3.3, Q3.4, Q4.3) return 0 rows
      at EVERY bounded SF (verified empty at 0.1, 0.2, 0.3, 0.5 AND 1.0). Root
      cause is a value-FORMAT mismatch, not data density: the BenchBox SSB
      generator emits p_category='MFGR#112' (3-digit) but the canonical query
      filters 'MFGR#12' (2-digit) [count(part WHERE p_category='MFGR#12')==0 at
      SF=1.0]; c_city/s_city are 'UNITED K0'..'K9' (10-char truncation) but the
      query filters 'UNITED KI1'/'KI5'. No bounded SF can bridge that, and changing
      the canonical query parameters is forbidden (it would alter the benchmark).
      Per the w4 fallback, the 6 are classified legitimately_empty with that written
      rationale and a tracking note (regenerate SSB data with faithful value
      formats; do NOT touch the canonical params). The guard is proven to surface
      them: the SSB gate is green at 14/26 DISCRIMINATING + 12 vacuous-classified,
      and a fast-lane unit test asserts _report FAILS on an UNclassified vacuous
      query and passes when classified.
      The audit of the other gates found the guard exposed PREVIOUSLY-HIDDEN
      vacuity (the exact BS3 theater): amplab had 2 empty-vs-empty queries (Q3, Q5
      - GROUP BY ... HAVING COUNT(*)>10 selects no qualifying group at the bounded
      cell) and clickbench had 8 (Q20/Q23/Q28/Q29/Q39/Q40/Q41/Q42 - canonical
      ClickBench upstream literals/thresholds: specific UserID/RefererHash/URLHash,
      CounterID=62 + July-2013 window, HAVING COUNT(*)>100000, OFFSET past the
      filtered slice - that the synthetic 100k-row data cannot satisfy). All are
      classified legitimately_empty with written rationales (cannot be made
      discriminating without an un-bounded cell or changing canonical queries -
      both forbidden); coffeeshop (22/22) and joinorder_synthetic (26/26) are
      genuinely clean with 0 vacuous. Every gate is green again, now HONESTLY:
      coffeeshop 22/22, joinorder 26/26, ssb 14 discriminating, amplab 12, click
      70 discriminating + Q18 tie baseline. TPC-Havoc SQL (220/220) + DataFrame
      (440/440) reports unchanged green - the shared ResultValidator is untouched;
      the guard lives only in cross_surface._report.
      UPDATE (ssb-generator-dimension-value-fidelity, #870): the SSB
      legitimately_empty stopgap has now been RETIRED. The generator was fixed to
      emit canonical value formats (p_category 'MFGR#12', p_brand1 'MFGR#2221',
      c_city/s_city 'UNITED KI1'); a second latent bug (lo_orderdate drew random
      integers that mostly were not valid datekeys, orphaning ~95% of the fact
      table from DATE) was also fixed by sampling real datekeys, and Q3.4's SQL
      year_month default was resolved per-query to the canonical 'Dec1997'. All 6
      previously-empty queries now return rows at SF=0.1, so the SSB gate is
      26/26 DISCRIMINATING, 0 vacuous, and the _SSB_LEGITIMATELY_EMPTY mapping is
      deleted (not re-classified).
    notes: |
      6/13 SSB queries return 0 rows at SF=0.1, so 12/26 cells pass empty-vs-empty.
      Two parts:
        1. Gate hygiene: track per-query reference row count in
           find_cross_surface_divergences; in _report, count a both-empty cell as
           NON-discriminating. The gate should FAIL (or require an explicit
           classified "legitimately-empty" entry) if any gated query's reference is
           empty, and the "compared N of M cells" line must exclude vacuous cells
           from the discriminating count.
        2. Data discrimination: for SSB, choose query parameters (or a per-benchmark
           SF) so Q2.1-2.3/Q3.3/Q3.4/Q4.3 return rows at the bounded cell. Prefer
           parameterization over raising SF globally (keep PRs cheap).
      Apply the same empty-result audit to coffeeshop (currently 0/11 empty - good),
      clickbench, and joinorder_synthetic before promotion.
    acceptance:
      - "Every gated query returns >=1 reference row at the bounded cell, OR is explicitly classified legitimately-empty with a rationale."
      - "The gate report distinguishes discriminating cells from vacuous ones, and fails on an un-classified vacuous cell."
      - "SSB still green after re-parameterization, now with 26/26 DISCRIMINATING cells."

