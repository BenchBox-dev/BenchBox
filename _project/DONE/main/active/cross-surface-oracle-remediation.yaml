success_metrics:
  - "ClickBench gate is deterministically green (empty baseline) across repeated runs, and Q6/Q17/Q18 are fixed at the loader."
  - "The comparator catches a reversed ORDER BY and ignores legitimate tie reshuffles; no run-to-run wobble."
  - "No gated query passes vacuously; every gated cell is discriminating or explicitly classified."
  - "Coverage/applicability artifacts distinguish 'registered' from 'verified green' and do not count unverified id mappings; staged gates run in CI with a promotion deadline."
  - "Module docs state honestly what the oracle proves; mutation tests quantify its sensitivity."

