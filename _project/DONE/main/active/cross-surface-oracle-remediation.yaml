  - id: w6
    summary: "Add a production-loader-path gate cell + harden the DDL parser and type maps (M4, L1, L2)"
    status: done
    addresses: [M4, L1, L2, "review:MEDIUM M4", "review:LOW L1/L2"]
    progress: |
      PARSER SUB-PART DONE (L1, fix/dataframe-ddl-column-parser): replaced the
      naive column.split() in schema_utils.column_name/column_sql_type with a
      paren-aware, quote-aware DDL column parser (_split_ddl_column). It now
      preserves parenthesized precision/scale with internal commas/spaces
      (DECIMAL(10, 2), VARCHAR(255), NUMERIC(18, 4)), multi-word types
      (DOUBLE PRECISION, TIMESTAMP WITH/WITHOUT TIME ZONE, CHARACTER VARYING),
      and quoted/bracketed/backtick identifiers with internal spaces
      ("odd name", [odd name], `odd name`); trailing constraints (NOT NULL,
      DEFAULT ..., PRIMARY KEY, UNIQUE, CHECK(...), REFERENCES ...) are stripped
      from the type. Simple "name TYPE" behavior is byte-identical. New table-
      driven unit tests in tests/unit/core/dataframe/test_schema_utils_ddl_parser.py
      (59 cases). Verified: dataframe + joinorder unit suites (1298 passed),
      joinorder_synthetic and ssb cross-surface gates green (0 divergent),
      tpchavoc-equivalence-report unchanged (220 equivalent).
      ADAPTER EMPTY-STRING CONTRACT DONE (raw-CSV path): carried the dialect-aware
      empty-string->'' contract from the pandas adapter to the other DataFrame
      adapters' read_csv. Polars now passes missing_utf8_is_empty_string=(null_marker
      is None) to scan_csv; modin/dask/cudf now read declared text columns as object
      and restore '' for empty fields when null_marker is None (NULL when ''),
      reusing _pandas_string_columns. So a prefer_parquet=False (or CSV-recommending)
      load no longer reintroduces the empty-string->null divergence (Q6/Q17/Q18) on
      those surfaces. Verified: polars read_csv unit test (both dialect cases),
      adapter coverage suites (139 passed), no import cycle, ssb gate still green.
      modin/cudf are not installed in this env so their read_csv was not runtime-
      exercised, but the change is the same pattern proven on the pandas adapter.
      ACCEPTANCE MET, w6 CLOSED:
        - Leading-zero VARCHAR + all-empty TEXT survive the production load path
          identical to the SQL reference (new test
          test_convert_declared_string_columns_survive_production_load_path: '007'
          stays string, an all-empty TEXT column is a string column following the
          dialect - NULL for a .tbl whose null_marker is "", matching DuckDB; '' for
          a .csv whose null_marker is None). Declared STRING dtypes ARE applied on
          the production path (the leading zeros prove a VARCHAR is not inferred as
          int), via the type maps (#857) + pandas/dask/modin/cudf dtype=object.
        - schema_utils DDL parser unit tests pass (DDL parser #864).
        - joinorder_synthetic's deferred dtype divergences are resolved: its
          cross-surface gate is GREEN (0 divergent, 0 vacuous), closing the #847
          deferral.
      M4's core concern (the gate bypassed the loader) was already resolved on
      develop: the gate drives the REAL DataFrameDataLoader and caught the
      TEXT->null and TIMESTAMP->string bugs. A dedicated DTYPE-asserting gate cell
      (compare column dtypes, not just values) is an additive enhancement, not part
      of w6's acceptance - moved to deferred.
    notes: |
      The gate's loader bypass (dataframe_surface.py:74-125 materializes from typed
      DuckDB Arrow) means it cannot see production CSV->parquet dtype corruption.
        - Add a gate cell/mode that loads each gated benchmark through the REAL
          DataFrameDataLoader (CSV->parquet->read_parquet) and compares both dtypes
          and values to the SQL reference, so loader corruption is observable.
        - Carry the w1 empty-string->'' contract to the remaining raw-CSV adapters.
          w1 fixed the Parquet path (strings_can_be_null=False) and the pandas CSV
          path; Polars scan_csv / modin / dask / cudf still map an empty string
          field to null on their raw-CSV read, so prefer_parquet=False (or a
          CSV-recommending adapter) reintroduces the Q6/Q17/Q18 divergence on those
          surfaces. Thread declared column types into each adapter's read_csv and
          preserve '' for string columns, mirroring pandas_df.read_csv.
        - Harden schema_utils.column_name/column_sql_type (schema_utils.py:29-51):
          replace the naive column.split() with a paren-aware, quote-aware DDL
          column parser that handles DECIMAL(10, 2) (space after comma), quoted/
          spaced names, and multi-word types (DOUBLE PRECISION, TIMESTAMP WITH TIME
          ZONE, NOT NULL DEFAULT ...). Add unit tests for each shape.
        - Extend PYARROW_TYPE_MAP and the polars/pandas maps (data_loader.py:191-199)
          to cover TEXT, BIGINT, REAL, DOUBLE PRECISION, NUMERIC, BOOLEAN so declared
          string/numeric types are applied at conversion instead of inferred.
        - Apply declared STRING dtypes on the production load path (not just date-
          name suppression) so a leading-zero VARCHAR is not inferred as int.
      Re-verify the real DataFrame benchmark run still works (this is a loader fix,
      not gate-only special-casing).
    acceptance:
      - "A leading-zero VARCHAR ('007') and an all-empty TEXT column survive the production load path identical to the SQL reference (new test)."
      - "schema_utils parser unit tests pass for DECIMAL(p, s), quoted names, and multi-word types."
      - "joinorder_synthetic's 10 deferred dtype divergences are resolved on the production path (closes the #847 deferral)."

  - id: w7
    summary: "Stop overclaiming independence; document what the oracle actually proves (BS1)"
    status: done
    addresses: [BS1, "review:Blind Spot 1", "claim 1"]
    progress: |
      DONE: corrected the cross_surface.py module docstring and the
      dataframe_surface.py DATAFRAME_BACKENDS comment - they no longer claim "two
      independent implementations"; they state the oracle catches transcription
      (not conceptual) errors, and that ssb + most clickbench generate BOTH
      DataFrame backends from one DSL spec (no backend-vs-backend independence)
      while coffeeshop AND amplab hand-write a separate impl per backend (verified
      by inspecting the query modules - amplab is hand-written too, not only
      coffeeshop). Added the per-benchmark generated-vs-hand-written record at
      _project/analysis/cross-surface-oracle-independence.md.
    notes: |
      Correct the docstrings that assert "two independent implementations"
      (cross_surface.py:3-6) and "independent ... can diverge independently"
      (dataframe_surface.py:48-50). For SSB and ~40/43 ClickBench queries BOTH
      backends are generated from one DSL spec row, so they cannot diverge on logic
      - only on engine semantics; the only real independence is SQL-text vs DSL-spec
      (same author, same understanding). State plainly that the oracle catches
      TRANSCRIPTION errors, not CONCEPTUAL ones, for DSL-generated benchmarks.
      Record per gated benchmark whether its DataFrame surface is hand-written
      (coffeeshop) or generated (ssb, clickbench). Optional but recommended: for at
      least the enforced gates, ensure one surface is independently authored, or add
      a second independent reference (e.g. the upstream published ClickBench answer
      set) so the oracle is not just self-consistency.
    acceptance:
      - "Module docstrings accurately describe the independence the oracle has (and lacks) per benchmark."
      - "The coverage map / a doc records generated-vs-handwritten for each gated benchmark."

  - id: w8
    summary: "Run staged gates in CI and add a promotion forcing-function (M3)"
    status: done
    addresses: [M3, "review:MEDIUM M3", "claim 10"]
    progress: |
      DONE by promotion (#859), which resolves M3 more directly than the
      staged-CI-plus-deadline approach this item proposed: clickbench and
      joinorder_synthetic were promoted from STAGED_GATES to enforced, BLOCKING
      GATES with new pr.yml steps and fast-lane regressions. STAGED_GATES is now
      EMPTY, so the "parked staged gate that silently rots" gap no longer exists.
      If a benchmark is ever staged again, revisit the dated-promotion forcing
      function then (re-file as a fresh item; not needed while STAGED is empty).
    notes: |
      STAGED_GATES (clickbench, joinorder_synthetic) are not run in CI (pr.yml runs
      only ssb + coffeeshop) and nothing fails when a staged gate is parked
      indefinitely; test_clickbench_is_staged_not_enforced only BLESSES parking.
        - Add the staged cross-surface reports to a non-blocking CI job so their
          divergence snapshots cannot silently rot (promote to blocking once green
          via w5).
        - Add a governance test: a benchmark may sit in STAGED_GATES only with a
          dated rationale and an owner; fail if a staged gate has been parked past a
          declared review-by date. Delete a staged gate that no one will burn down
          rather than leave a permanent red parking lot.
    acceptance:
      - "pr.yml runs the clickbench and joinorder_synthetic staged reports (non-blocking until green)."
      - "A staged gate without a dated promotion rationale fails a governance test."

  - id: w9
    summary: "Tighten coverage-map / applicability honesty (M1, M2)"
    status: done
    addresses: [M1, M2, "review:MEDIUM M1/M2", "claims 6,7"]
    progress: |
      DONE. Both honesty signals landed (re-derived from the LIVE registries, not
      hardcoded).
      M1 (coverage map): generate_oracle_coverage_map.py now records
      cross_surface_enforced per benchmark (True for enforced GATES = CI-blocking
      hence green-or-CI-fails, False for STAGED_GATES = registered-but-not-run, None
      for non-cross-surface). The md gains an "Enforced" column plus a "What an
      oracle here means" preamble stating that 'guarded' is REGISTERED, not green;
      the json carries the new field. The 5 enforced gates (amplab, clickbench,
      coffeeshop, joinorder_synthetic, ssb) report "enforced (CI-blocking)"; STAGED
      is currently empty. Drift test (oracle-coverage-map-check) regenerated + green.
      M2 (applicability): cross_surface_applicability_sweep.py downgrades the
      zero-verified-overlap benchmarks from gateable to a new candidate-unverified
      status; _GATEABLE_STATUSES no longer counts them as coverage. The live sweep
      now reports 4 gateable (flightdata, h2odb, joinorder, read_primitives) and 5
      candidate-unverified (datavault, nyctaxi, tpcds_obt, tpch_skew, tsbs_devops).
      amplab is no longer in this list at all (promoted to an enforced gate in #859),
      so the original "6" is 5 unguarded candidates here.
      Tests: tests/unit/test_oracle_coverage_map.py gains
      test_cross_surface_enforced_distinguishes_registered_from_verified_green;
      tests/unit/test_cross_surface_applicability.py pins the new
      candidate-unverified set and asserts none are counted gateable. Both committed
      artifacts regenerated; both -check/drift targets and both unit test modules
      green; ruff/format/ty clean.
    notes: |
      - generate_oracle_coverage_map.py derives 'guarded' from GATES dict membership
        (85/111) and never checks the gate is green. Either run each gate (or read
        its CI result) and add a distinct 'verified-green' signal, or rename
        'guarded' -> 'gate-registered' so a registered-but-unverified gate is not
        reported as coverage.
      - cross_surface_applicability_sweep.py counts 6 'needs-id-mapping' benchmarks
        (amplab, datavault, nyctaxi, tpcds_obt, tpch_skew, tsbs_devops) as 'gateable'
        on ZERO verified id overlap; the campaign's own TODO warns 'do NOT guess'
        the nyctaxi/tsbs mappings and tpcds_obt is 3 DF queries vs 89 SQL. Downgrade
        these from 'gateable' to 'candidate-unverified' until an independent
        SQL<->DF id mapping is confirmed per benchmark.
    acceptance:
      - "The coverage map separates 'gate registered' from 'gate verified green'."
      - "Applicability does not count an unverified id mapping as gateable; the 6 are 'candidate-unverified' with a per-benchmark verification task."

  - id: w10
    summary: "Mutation-test the oracle to measure SENSITIVITY, not just specificity (C2 - the central question)"
    status: done
    needs: [w2, w4]
    addresses: [C2, "review:CRITICAL C2", "deeper-question 2", "claim 9"]
    progress: |
      DONE: a systematic mutation-sensitivity suite lands in
      tests/integration/test_cross_surface_mutation_sensitivity.py and its
      caught-vs-uncaught matrix is committed as evidence in
      _project/analysis/cross-surface-mutation-sensitivity.md. For every enforced
      gated benchmark (read live from GATES: ssb, amplab, coffeeshop, clickbench,
      joinorder_synthetic) it wraps ONE target query's DataFrame impl at test time
      (dataclasses.replace on the DataFrameQuery - the production registries are
      NOT touched) and drives the real gate machinery
      (find_cross_surface_divergences + the reused ResultValidator) on the bounded
      SF=0.1 cell. No production code or comparator changed, so TPC-Havoc stays
      byte-identical-green.

      Matrix (both backends; verified at SF=0.1):
        flip_comparator (<->-<=, +1 row)  : CAUGHT on all 5 (row-count path)
        drop_group_key  (drop leading col): CAUGHT on all 5 (column-count path)
        drop_join       (value perturb)   : CAUGHT on all 5 (value path)
        reverse_sort    (reverse rows)    : NOT CAUGHT on the 4 multi-row gates
                                            (ssb/amplab/coffeeshop/clickbench);
                                            no-op on joinorder_synthetic (every
                                            gated query is a single-row scalar).
      So each gated benchmark has >=3 mutation classes the gate provably catches
      (acceptance #1), and the one uncaught class is documented (acceptance #2).

      HONEST FINDING (the C2 answer): the reversed-sort miss CONFIRMS the open half
      of w2/BS2 - validate_results_exact full-row-sorts both sides before
      comparing, so a reversed ORDER BY that preserves the multiset passes
      silently. This is recorded (NOT baselined - that would be the anti-pattern)
      with a tracking note pointing back at w2; the dedicated
      test_reversed_sort_is_the_bs2_probe will flip to failing the moment an
      order-aware comparator lands, forcing the doc + the harness _EXPECT_CAUGHT
      table to be updated. The oracle is strong on row-membership, column-shape,
      and value bugs and blind only to pure ordering bugs - it did NOT find "no
      bugs" because it is vacuous; w4's empty-cell guard plus this suite's
      non-empty-target assertion (test_unmutated_target_is_green) rule that out.

      Also folds in the w3 byte-stability regression
      (test_gate_output_is_byte_stable_across_two_in_process_runs): two in-process
      ssb gate runs on the same seed produce an identical divergence set.
    notes: |
      The campaign measured only that the gates PASS (specificity); it never measured
      whether they CATCH a seeded bug (sensitivity). Add a mutation-test harness that,
      per gated benchmark, injects a known DataFrame error and asserts the gate goes
      RED:
        - flip a filter comparator (< -> <=),
        - drop a GROUP BY key,
        - reverse a sort direction (this is the BS2 regression guard),
        - drop a join.
      For each mutation that the gate does NOT catch, document why (e.g. an empty-
      result query from BS3, or an order-only change the comparator ignores) and feed
      it back into w2/w4. This closes the central unanswered question: is the oracle
      strong enough to find logic bugs, or did it find "no bugs" because it is too
      weak/vacuous?
    acceptance:
      - "Each gated benchmark has >=3 mutation tests the gate provably catches."
      - "Every mutation class the gate cannot catch is documented with the reason and a tracking item."

deferred:
  - summary: "A truly independent SQL-side oracle for non-tpch/tpcds benchmarks (e.g. upstream published answer sets)."
    reason: "Large; cross-surface proves agreement not correctness. Tracked as a deeper question in the review, not required to close these findings."
  - summary: "A dedicated DTYPE-asserting cross-surface gate cell (compare each loaded column's dtype, not just its values, against the SQL reference)."
    reason: "Additive enhancement beyond w6's acceptance and M4's core concern (which is resolved: the gate drives the real production loader and already caught the TEXT->null / TIMESTAMP->string dtype bugs via value comparison). Designing an acceptable cross-engine dtype-equivalence map is a separable piece."
  - summary: "SSB generator emits a 3-digit p_category ('MFGR#212') so the standard SSB Q2.x predicates ('MFGR#12') match no rows at any scale (Q2.1-2.3/Q3.3/Q3.4/Q4.3 empty to SF=1.0)."
    reason: "A separate SSB data-generation bug, not a cross-surface oracle defect; the vacuous cells are honestly classified in the ssb gate's allowlist. Tracked in #870."

must_preserve:
  - "All TPC-Havoc SQL and DataFrame equivalence gates stay green with empty baselines and byte-identical output - the comparator change (w2) is additive, never a fork."
  - "benchbox run default (execution-only) behavior is unchanged for every benchmark; gate and loader changes must keep the real DataFrame run path working (re-verify a DataFrame benchmark run after w1/w6)."
  - "The bounded one-cell-per-benchmark cost model is preserved; no full platform matrix in routine PRs."
  - "SSB and CoffeeShop enforced gates stay green throughout (CoffeeShop is the reference 'good' gate)."

anti_patterns:
  - "DO NOT silence a divergence by adding it to known_divergences - because the baseline is for intentional presentational differences only - fix the wrong surface (this is exactly how #848 went wrong)."
  - "DO NOT fix the null bug only in the gate path or only in the generated factories - because production and hand-written impls would stay broken - fix the loader contract (w1) and verify on the real run path."
  - "DO NOT fork ResultValidator for cross-surface - because TPC-Havoc depends on it - extend it with an opt-in order/tie-aware mode."
  - "DO NOT promote a staged gate to GATES while it is nondeterministic or has a non-empty baseline - because GATES membership is the coverage signal - green+empty+deterministic first."
  - "DO NOT count an empty-vs-empty or unverified-id-mapping cell as coverage - because that is the exact 'theater' the review flagged."

