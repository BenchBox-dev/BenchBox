id: fix-type-checking-quick-wins
title: "Fix type checking errors - Quick Wins (4 rules enabled)"
worktree: main
priority: Medium
status: Completed
category: Testing and Quality Assurance
description: |
  Fixed 37 type errors across 4 low-count rules, enabling them as errors in ty config.
  This is Phase 1 (audit) + partial Phase 5 (tighten config) from the larger type
  checking TODO. The remaining 8 ignored rules require more extensive refactoring.

completed_date: "2026-01-16"

tasks:
  phases:
  - phase: "Phase 1: Audit and Categorize Errors"
    done: true
    items:
    - summary: "Run ty check with each rule enabled individually to get accurate counts"
      done: true
    - summary: "Categorize errors by root cause"
      done: true
    - summary: "Identify quick wins vs major refactoring"
      done: true

  - phase: "Fix Quick Win Rules"
    done: true
    items:
    - summary: "Fix too-many-positional-arguments (2 errors)"
      done: true
      details: |
        - benchbox/core/tpchavoc/queries.py:182 - Fixed positional arg to get_query
        - benchbox/tpch.py:247 - Fixed config passed to constructor not run()
    - summary: "Fix conflicting-declarations (3 errors)"
      done: true
      details: |
        - benchbox/core/tpcdi/generator/data.py - Removed forward declaration, added type: ignore
        - benchbox/core/tpcdi/generator/sql.py - Same pattern
        - benchbox/platforms/datafusion.py - Added type: ignore to optional import fallbacks
    - summary: "Fix invalid-parameter-default (11 errors)"
      done: true
      details: |
        - Added `| None` to parameter types where default was None
        - Fixed in benchbox/core/tpcdi/benchmark.py, tpcds/generator/manager.py,
          platforms/base/adapter.py, and 4 test files
    - summary: "Fix unresolved-reference (21 errors)"
      done: true
      details: |
        - Added TYPE_CHECKING imports for forward references (pa, UnifiedTuningConfiguration)
        - Fixed test bugs where wrong variable names were used (adapter -> live_*_adapter)
        - Added missing pytest import
        - Fixed sqlite3 -> Exception in DuckDB tests
        - Fixed BenchmarkBenchmarkTestResult -> BenchmarkTestResult typo
        - Initialized baseline_qps before use

  - phase: "Enable Fixed Rules as Errors"
    done: true
    items:
    - summary: "Update pyproject.toml ty.rules section"
      done: true
      details: |
        Changed from "ignore" to "error":
        - too-many-positional-arguments
        - conflicting-declarations
        - invalid-parameter-default
        - unresolved-reference

summary: |
  Reduced ignored ty rules from 12 to 8 by fixing 37 errors across 4 rules.
  This improves type safety and catches real bugs (like wrong variable names
  in test files). The remaining 8 rules (~2665 errors total) require more
  extensive refactoring and should be addressed incrementally.

