# Bulk Shard Loading for DuckDB (Framework + Implementation)
#
# Location: _project/TODO/main/planning/bulk-shard-loading-duckdb.yaml

id: bulk-shard-loading-duckdb
title: "Replace per-shard INSERT loops with single bulk INSERT for DuckDB handlers"
worktree: main
priority: High
status: Completed
completed_date: "2026-02-22"
description: |
  When a benchmark table is generated with parallel>1, its data is split across
  N shard files (e.g., lineitem.tbl.1, lineitem.tbl.2, ..., lineitem.tbl.N).
  The base DataLoader._load_file_based_data() currently calls handler.load_table()
  once per shard in a sequential loop, producing N separate INSERT statements.

  For DuckDB this is inefficient: DuckDB's read_csv() and read_parquet() both
  accept an array of file paths or a glob pattern and process all files in a
  single optimised scan, avoiding N round-trips and N separate query plans.

  This TODO adds a load_table_bulk() interface to FileFormatHandler, changes the
  DataLoader loop to use it, and implements the DuckDB-native multi-file variant
  for DuckDBNativeHandler (CSV/TBL) and DuckDBParquetHandler.

  Expected improvement (TPC-H SF1, 4-shard lineitem):
  - Before: 4 × (pragma + COUNT_before + INSERT + COUNT_after) = 16 execute calls
  - After:  1 × (pragma + COUNT_before + bulk INSERT + COUNT_after) = 4 execute calls
  - Data transfer and query planning overhead reduced ~75% for sharded tables

  PostgreSQL, SQLite, DataFusion, and other platforms that use DelimitedFileHandler
  / executemany() are NOT in scope - they have no SQL multi-file primitive.

category: Core Functionality

work:
  - id: w1
    summary: "Add load_table_bulk() to FileFormatHandler base class with default loop implementation"
    status: done
    notes: |
      Signature: load_table_bulk(table_name, file_paths: list[Path], connection, benchmark, logger) -> int
      Default: iterate file_paths, call self.load_table() for each, sum results.
      This makes the interface backward-compatible - all existing handlers auto-inherit
      correct (if non-bulk) behaviour.

  - id: w2
    summary: "Update DataLoader._load_file_based_data() to call load_table_bulk() for multi-shard tables"
    needs: [w1]
    status: done
    notes: |
      In the isinstance(file_path_or_paths, list) branch, instead of:
        for shard_path in file_path_or_paths:
            rows += self._load_single_file(table_name, shard_path)
      Do:
        handler = self.handler_factory(file_path_or_paths[0], ...)
        total_rows = handler.load_table_bulk(table_name, [Path(p) for p in file_path_or_paths],
                                             self.connection, self.benchmark, self.adapter.logger)
      The handler_factory is called once (on the first shard) to select the right handler type.
      The shard_count display in the log line must still be len(file_path_or_paths).

  - id: w3
    summary: "Implement DuckDBNativeHandler.load_table_bulk() using read_csv([list_of_paths])"
    needs: [w2]
    status: done
    notes: |
      Key design points:
      1. Call pragma_table_info once (using connection) to get col_names.
      2. Detect trailing delimiter on the FIRST shard only (has_trailing_delimiter).
      3. Build names/columns based on that detection - applies to all shards.
      4. Build INSERT SQL with array literal:
           INSERT INTO {table}
           SELECT {cols} FROM read_csv(['{esc_path1}', '{esc_path2}', ...], delim='|', ...)
      5. Use before/after COUNT(*) to get inserted row count (same as load_table()).
      6. Dry-run mode: capture_sql() for each file (or combined) then return 1000*N.

  - id: w4
    summary: "Implement DuckDBParquetHandler.load_table_bulk() using read_parquet([list_of_paths])"
    needs: [w2]
    status: done
    notes: |
      Simpler than CSV - no pragma or trailing-delimiter detection needed.
      INSERT INTO {table} SELECT * FROM read_parquet(['{path1}', '{path2}', ...])
      Use before/after COUNT(*) to get inserted row count.
      Dry-run: capture_sql() then return 1000*N.

  - id: w5
    summary: "Unit tests for DuckDBNativeHandler.load_table_bulk() - correct row count, SQL shape, dry-run"
    needs: [w3]
    status: done
    notes: |
      Add to tests/unit/platforms/base/test_trailing_delimiter_loading.py.
      Test cases:
      - 3 shards, trailing delimiter: assert array syntax in SQL, single INSERT call, correct row count
      - 3 shards, no trailing delimiter: assert no _trailing_delimiter_ in SQL
      - dry-run mode: assert capture_sql called, return value == 3000
      - single-shard list delegates correctly (same result as load_table())
      Mock call sequence: [pragma, COUNT_before, INSERT_bulk, COUNT_after]

  - id: w6
    summary: "Unit tests for DuckDBParquetHandler.load_table_bulk() - correct row count, SQL shape, dry-run"
    needs: [w4]
    status: done
    notes: |
      Add to tests/unit/platforms/base/test_parquet_handlers.py.
      Test cases:
      - 2 shards: assert read_parquet([...]) array syntax, 3 execute calls, correct row count
      - dry-run: assert no connection.execute called, return == 2000

  - id: w7
    summary:
      "Smoke test: benchbox run --platform duckdb --benchmark tpch --scale 0.01 --phases load,power reports correct row
      counts"
    needs: [w5, w6]
    status: done
    notes: |
      At SF0.01 parallel=1, tables are single-file - verifies no regression.
      Add a unit/integration test that exercises DataLoader with a mock multi-shard
      table and confirms load_table_bulk() was called (not individual load_table()).

