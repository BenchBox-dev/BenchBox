impact:
  business_value: |
    Reduces data-loading time for sharded TPC-H / TPC-DS tables on DuckDB. For
    TPC-H SF1 with 4 shards, eliminates 12 of 16 execute round-trips during the
    load phase. Directly improves benchmark throughput and reduces wall-clock
    time for CI runs that exercise the load phase.
  user_impact: |
    Users running high-scale (SF >= 1) benchmarks with parallel datagen will see
    faster load phases. Row count reporting remains accurate thanks to the
    before/after COUNT(*) fix already applied.
  technical_debt: |
    The per-shard loop was the only available design before DuckDB gained
    multi-file read_csv/read_parquet support. Adding load_table_bulk() to the
    base class makes the bulk-loading capability explicit and extensible to
    ClickHouse and other platforms in follow-on work.

