context_sections:
  "Root Cause Analysis": |
    DataLoader._load_file_based_data() (data_loading.py:1773-1782) detects
    multi-shard tables via isinstance(file_path_or_paths, list) but then iterates
    the list, calling _load_single_file() once per shard.  Each call builds and
    executes a fresh INSERT...SELECT FROM read_csv(single_path) query.

    DuckDB 1.4.x fully supports:
      read_csv(['path1', 'path2', 'path3'], ...)      # multi-file CSV
      read_parquet(['path1', 'path2', ...])            # multi-file Parquet
    These produce a single logical scan and a single INSERT, which is both faster
    (one query plan, one transaction) and simpler to trace.

  "Design Decision: load_table_bulk() interface": |
    Rather than modifying the DataLoader loop signature or adding a special case
    in _load_file_based_data(), we add load_table_bulk() to FileFormatHandler.
    The default implementation loops over load_table() for full backward
    compatibility. DuckDB handlers override with the native multi-file variant.

    This design lets ClickHouse, future RDBMS platforms, etc. opt in to bulk
    loading independently, and keeps _load_file_based_data() clean.

  "Row Count Accuracy": |
    The before/after COUNT(*) fix (already committed) is used inside
    load_table_bulk() as well: COUNT before the bulk INSERT, execute the INSERT,
    COUNT after. The delta is the exact number of rows added, regardless of how
    many shards were combined.

