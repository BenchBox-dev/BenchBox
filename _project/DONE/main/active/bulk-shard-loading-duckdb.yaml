approach: |
  1. In FileFormatHandler (data_loading.py), add:
       def load_table_bulk(self, table_name, file_paths, connection, benchmark, logger) -> int:
           total = 0
           for path in file_paths:
               total += self.load_table(table_name, path, connection, benchmark, logger)
           return total

  2. In DataLoader._load_file_based_data() (lines 1773-1782), replace the
     for-loop + _load_single_file() pattern with:
       handler = self.handler_factory(file_path_or_paths[0], self.adapter, self.benchmark)
       total_rows = handler.load_table_bulk(table_name, [Path(p) for p in file_path_or_paths],
                                            self.connection, self.benchmark, self.adapter.logger)
     This calls the factory once to pick the correct handler, then delegates
     the entire shard list to load_table_bulk().

  3. In DuckDBNativeHandler, override load_table_bulk():
     a. Call pragma_table_info once to get col_names.
     b. Detect trailing delimiter on file_paths[0].
     c. Escape each path: [escape_sql_string_literal(str(p)) for p in file_paths].
     d. Build array literal: "['" + "', '".join(escaped) + "']".
     e. Build INSERT SQL using the array literal inside read_csv().
     f. COUNT before, execute INSERT, COUNT after, return delta.

  4. In DuckDBParquetHandler, override load_table_bulk() similarly:
     Build INSERT ... SELECT * FROM read_parquet(['p1', 'p2', ...]) and use
     before/after COUNT(*).

  5. Add tests before touching production code (TDD: write failing tests for
     load_table_bulk, then implement to make them pass).

anti_patterns:
  - "DO NOT change the load_table() single-file method signatures - because existing tests and non-DuckDB platforms depend on
    them - only add load_table_bulk() as an override"
  - "DO NOT call pragma_table_info once per shard in load_table_bulk() - because the schema is the same for all shards of a
    table - call it once for the first path"
  - "DO NOT call has_trailing_delimiter on every shard in load_table_bulk() - because all shards of the same TBL table have
    the same delimiter pattern - sample only the first path"
  - "DO NOT change _load_single_file() - because it is still used for the single-file (non-list) branch - leave it untouched"
  - "DO NOT use a glob string instead of an explicit path array in load_table_bulk() - because shard files may not be in the
    same directory or may have non-glob-friendly names - use the explicit list passed in"

