  - "DuckDBParquetHandler.load_table() continues to work unchanged"
  - "All 12,970 existing fast-suite tests continue to pass"
  - "DataLoader default behaviour (non-DuckDB platforms, single-file tables) is unaffected"
  - "Dry-run mode still captures SQL without executing it"
