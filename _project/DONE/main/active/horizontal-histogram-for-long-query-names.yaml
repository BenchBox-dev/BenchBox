id: horizontal-histogram-for-long-query-names
title: "Switch post-run histogram to horizontal bars when query names are long"
worktree: main
priority: Medium
status: Completed
completed_date: "2026-02-10"
category: Visualization
description: |
  The post-run query latency histogram uses vertical bars (ASCIIQueryHistogram)
  which puts query IDs on the x-axis. For benchmarks with short numeric IDs
  (TPC-H: Q1-Q22, TPC-DS: Q1-Q99) this works well. But for Primitives
  benchmarks and others with long descriptive query names (e.g.,
  "Qaggregation_groupby_large", "Qshuffle_inner_join_one_to_many_string"),
  the labels get truncated to 2-3 characters ("Qa", "Qo", "Qsh"), making the
  chart unreadable.

  A horizontal bar chart (ASCIIBarChart already exists in bar_chart.py) would
  put query names on the y-axis with up to 30 characters of label space,
  making long names legible. The post-run summary should automatically choose
  the appropriate chart type based on query name length.

  Decision heuristic: if the median query ID length exceeds a threshold
  (e.g., 6 characters), use horizontal bars. Otherwise use vertical histogram.

  Affected benchmarks (long query names):
    - read_primitives (124 queries, names like "aggregation_groupby_large")
    - transaction_primitives
    - metadata_primitives
    - joinorder (names like "1a", "2b" - short, so vertical is fine)
    - h2odb (names like "groupby_q1" - borderline)

  Unaffected benchmarks (short numeric IDs):
    - tpch (Q1-Q22), tpcds (Q1-Q99), ssb (Q1-Q13), clickbench (Q1-Q43)

metadata:
  tags:
    - visualization
    - ascii-charts
    - ux
  estimated_effort: Small
  created_date: "2026-02-10"
  last_updated: "2026-02-10"

impact:
  business_value: |
    Primitives benchmarks are a key differentiator for BenchBox. Unreadable
    post-run output undermines usability and makes results hard to share.
  technical_debt: |
    None - ASCIIBarChart already exists; this wires it into the post-run path.

must_preserve:
  - "Existing vertical histogram rendering for TPC-H/TPC-DS/SSB/ClickBench is unchanged"
  - "generate_post_run_summary() return type (PostRunSummary) is unchanged"
  - "ASCIIBarChart and ASCIIQueryHistogram classes are not modified"
  - "All existing post-run summary tests continue to pass"

approach: |
  1. In generate_post_run_summary(), after building the query_display_ids,
     compute the median query ID length.
  2. If median length > 6, build an ASCIIBarChart (horizontal) instead of
     ASCIIQueryHistogram (vertical). ASCIIBarChart already supports labels
     up to 30 chars and has its own truncation logic.
  3. ASCIIBarChart uses BarData(label, value, ...) instead of HistogramBar.
     Map the query data into the appropriate dataclass.
  4. For high query counts (>40), consider showing only the top/bottom N
     queries in horizontal mode since vertical space is limited.

  Key files:
    - benchbox/core/visualization/post_run_summary.py (chart selection logic)
    - benchbox/core/visualization/ascii/bar_chart.py (ASCIIBarChart, BarData)
    - benchbox/core/visualization/ascii/histogram.py (ASCIIQueryHistogram - read only)

anti_patterns:
  - "DO NOT modify ASCIIQueryHistogram or ASCIIBarChart internals - because these are shared rendering components used elsewhere
    - add the selection logic in generate_post_run_summary() only"
  - "DO NOT use query count as the sole heuristic - because TPC-DS has 99 queries with short names - use query name length as
    the primary signal"

verification:
  - description: "Existing post-run summary tests pass"
    command: "uv run -- python -m pytest tests/unit/core/visualization/test_post_run_summary.py -v --tb=short"
    expected_output: "all tests pass, 0 failures"
  - description: "New tests for horizontal bar chart selection"
    command: "uv run -- python -m pytest tests/unit/core/visualization/ -k 'horizontal or long_query' -v --tb=short"
    expected_output: "new tests pass showing horizontal chart for long query names"

success_metrics:
  - "Benchmarks with long query names render horizontal bar charts with readable labels"
  - "Benchmarks with short numeric IDs continue to render vertical histograms"
  - "PostRunSummary.query_histogram is always a non-empty string for successful runs"

files_affected:
  modified:
    - "benchbox/core/visualization/post_run_summary.py"
    - "tests/unit/core/visualization/test_post_run_summary.py"

scope_limit:
  only_modify:
    - "benchbox/core/visualization/post_run_summary.py"
    - "tests/unit/core/visualization/"
  do_not_modify:
    - "benchbox/core/visualization/ascii/histogram.py"
    - "benchbox/core/visualization/ascii/bar_chart.py"
    - "benchbox/cli/"

work:
  - id: w1
    summary: "Add chart type selection logic in generate_post_run_summary() based on median query name length"
    status: done
  - id: w2
    summary: "Add tests for horizontal bar chart selection with long and short query names"
    status: done
    needs: [w1]
