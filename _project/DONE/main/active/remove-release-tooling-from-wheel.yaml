id: remove-release-tooling-from-wheel
title: "Remove maintainer-only release tooling from the default install surface"
worktree: main
priority: High
status: Completed
completed_date: "2026-03-23"
category: Maintainer Tooling
description: |
  BenchBox ships `benchbox/release/` (~2,300 lines) and the `benchbox-sync`
  console entry point to all users via MANIFEST.in and pyproject.toml. These
  are maintainer-only tools for release automation, repository sync, and
  content validation.

  Coupling analysis confirmed near-zero coupling: release imports only
  `benchbox.utils.printing.emit`, and core BenchBox never imports from release.

  The fix is three small edits:
  1. Remove `benchbox-sync` from `[project.scripts]` in pyproject.toml.
  2. Add `prune benchbox/release` to MANIFEST.in so the wheel excludes it.
  3. Optionally add a `[maintainer]` extra that re-exposes the entry point for
     explicit installs.

  A full `benchbox-maintainer` package is not needed given the near-zero
  coupling. Maintainers can continue to use `benchbox-sync` from the source
  checkout or via `uv run -- python -m benchbox.release.sync`.

metadata:
  tags:
    - architecture
    - packaging
    - maintainer-tooling
    - scope-review
  estimated_effort: "Small"
  created_date: "2026-03-12"
  source_review: "Orthogonal functionality review finding #1"

future_state:
  readme: "docs/design/future-state/remove-release-tooling-from-wheel/README.md"

impact:
  user_impact: |
    End users no longer see `benchbox-sync` in their PATH or discover release
    commands they cannot use.
  maintainer_impact: |
    Maintainers invoke sync via `uv run -- python -m benchbox.release.sync`
    from the source checkout instead of a global `benchbox-sync` command.
    Functionally identical.
  packaging_impact: |
    Wheel shrinks by ~2,300 lines of Python. One fewer console script.
  regression_risk: |
    Low. Core BenchBox has zero imports from `benchbox.release`. The only
    runtime touchpoint is `benchbox.utils.printing.emit` in the reverse
    direction (release importing from utils).

justification: |
  End users should not be exposed to maintainer-only entry points. The coupling
  is near-zero, so the fix is a small packaging edit, not an extraction project.

cost_benefit_analysis:
  expected_benefits: |
    High. Cleaner default install, no user-visible maintainer commands, smaller
    wheel.
  expected_costs: |
    Trivial. Two config file edits and a CI update.
  recommendation: |
    Proceed immediately. No separate package needed.

files_affected:
  modified:
    - "pyproject.toml"
    - "MANIFEST.in"
    - "scripts/sync_repos.py"
    - "tests/unit/cli/test_cli_package_exports.py"

work:
  - id: w1
    summary: "Remove benchbox-sync entry point and exclude benchbox/release/ from the wheel"
    status: done
    notes: |
      In pyproject.toml: remove `benchbox-sync = "benchbox.release.sync:main"`
      from `[project.scripts]`.
      In MANIFEST.in: add `prune benchbox/release` after the existing
      `recursive-include benchbox` line.
      Update scripts/sync_repos.py to invoke the module directly instead of
      relying on the installed entry point.

  - id: w2
    summary: "Update tests and CI to reflect the removed entry point"
    needs: [w1]
    status: done
    notes: |
      Any test asserting `benchbox-sync` is an installed script should be updated
      to expect its absence in default installs. CI release jobs that use
      `benchbox-sync` should switch to `uv run -- python -m benchbox.release.sync`.

must_preserve:
  - "Public `benchbox` CLI behavior for default installs"
  - "Ability to run release/sync from the source checkout via `uv run`"
  - "Release test coverage (tests still run from source, just not shipped)"

approach: |
  Edit two config files and update CI references. No code moves, no new
  packages, no compatibility shims.

anti_patterns:
  - "DO NOT create a separate benchbox-maintainer package for this level of decoupling - it is over-engineered"
  - "DO NOT remove benchbox/release/ source code from the repo - because maintainers need it for release automation from the
    source checkout - exclude from wheel only"

verification:
  - description: "Public CLI and package-export tests still pass"
    command: "uv run -- python -m pytest tests/unit/cli/test_cli_package_exports.py tests/unit/test_cli_documentation.py -q"
    expected_output: "All tests pass"
  - description: "Release and sync tests still pass from source checkout"
    command:
      "uv run -- python -m pytest tests/unit/release/test_workflow.py tests/unit/release/test_release_sync_unit.py tests/unit/test_release_sync.py
      -q"
    expected_output: "All tests pass"
  - description: "benchbox-sync is not installed as a console script in a clean wheel install"
    command:
      "uv venv /tmp/benchbox-wheel-test && uv build --wheel && uv pip install --python /tmp/benchbox-wheel-test dist/benchbox-*.whl
      --quiet && /tmp/benchbox-wheel-test/bin/benchbox-sync --help; rm -rf /tmp/benchbox-wheel-test"
    expected_output: "benchbox-sync not found (exit code 1)"
  - description: "benchbox.release is excluded from the wheel"
    command: "uv build --wheel && python -m zipfile -l dist/benchbox-*.whl | grep release"
    expected_output: "No output (zero matches)"

scope_limit:
  only_modify:
    - "pyproject.toml"
    - "MANIFEST.in"
    - "scripts/sync_repos.py"
    - "tests/unit/cli/test_cli_package_exports.py"
    - "tests/unit/test_cli_documentation.py"
    - ".github/workflows/"
  do_not_touch:
    - "benchbox/release/ source code (stays in repo, just excluded from wheel)"
    - "Benchmark query implementations"
    - "Platform adapters"
    - "Result schemas"
