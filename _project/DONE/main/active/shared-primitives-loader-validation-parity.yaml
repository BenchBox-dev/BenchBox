id: shared-primitives-loader-validation-parity
title: "Bring shared primitives loader's validation_query parsing up to write_primitives parity"
worktree: main
priority: Medium-High
status: Completed
completed_date: "2026-05-06"
category: Architecture & Refactoring

description: |
  Blind-spot `2026-05-04-004045` documented an asymmetry between
  `benchbox/core/primitives/catalog/loader.py:_parse_validation_queries`
  (forwards 7 fields: id/sql/expected_rows/expected_rows_min/
  expected_rows_max/expected_values/check_expression) and the
  write_primitives-local equivalent (which forwards
  `expected_value_min`, `expected_value_max`, and validation-level
  `platform_overrides` in addition).

  The shared loader is consumed by `transaction_primitives` today. Any
  future agent reaching for `load_operations_catalog` in another
  benchmark area silently gets the older, narrower validation_query
  shape -- the field is just dropped, no error.

  Sweep verification (2026-05-05): operation-level `platform_overrides`
  IS present in the shared loader, but validation-query-level
  `expected_value_min`, `expected_value_max`, and `platform_overrides`
  are NOT.

closes_blind_spots:
- 2026-05-04-004045-shared-primitives-loader-validation-extension-lag

work:
- id: w1
  summary: "Decide: extend shared loader, or fold write_primitives-local into shared"
  status: done
  notes: |
    Two paths:
    (a) extend `benchbox/core/primitives/catalog/loader.py`
        `_parse_validation_queries` to forward the three missing
        fields, leave the write_primitives-local loader as a thin
        wrapper.
    (b) delete the write_primitives-local loader and have
        `load_write_primitives_catalog` delegate to
        `load_operations_catalog` end-to-end.
    Path (a) is incremental and safer; path (b) eliminates the
    duplication root cause. Pick one based on how much
    write_primitives-local logic is unique vs. just-different.

- id: w2
  summary: "Implement chosen path; ensure both validation_query parsers expose identical shapes"
  needs: [w1]
  status: done
  notes: |
    Port `_parse_validation_platform_overrides` and
    `_parse_expected_value_bounds` from the write_primitives loader
    into the shared loader (or its helpers). Build the new
    ValidationQuery via `build_validation_query(...)` so callers
    that don't pass the new fields keep working.

- id: w3
  summary: "Add a CI grep/test that fails when one loader gains a validation_query field the other does not"
  needs: [w2]
  status: done
  notes: |
    Smallest viable: a fast-marked unit test that introspects both
    loader functions' kwargs to `build_validation_query(...)` and
    asserts the field set is identical. Larger: a structural diff
    between the two loader files for the validation-query block.

- id: w4
  summary: "Document the loader contract in module docstring"
  needs: [w2]
  status: done
  notes: |
    Add a docstring to `benchbox/core/primitives/catalog/loader.py`
    noting "validation_query field forwarding must stay in lockstep
    with write_primitives' equivalent; see TODO
    shared-primitives-loader-validation-parity for rationale and the
    cross-loader test."

verification:
- description: "Shared loader forwards the three previously-missing fields"
  command: "grep -E 'expected_value_min|expected_value_max|platform_overrides' benchbox/core/primitives/catalog/loader.py
    | wc -l"
  expected_output: ">= 3"
- description: "Cross-loader parity test exists and passes"
  command: "uv run -- python -m pytest tests/unit/core/primitives/test_loader_parity.py -v"
  expected_output: "exit 0"
- description: "transaction_primitives still loads its catalog cleanly"
  command: "uv run -- python -m pytest tests/unit/core/transaction_primitives/ -m fast -q"
  expected_output: "exit 0"

must_preserve:
- "transaction_primitives validation behaviour is unchanged for catalogs that don't use the new fields."
- "write_primitives validation_query parsing continues to accept all three currently-supported extensions (`expected_value_min`,
  `expected_value_max`, `platform_overrides`)."
- "ValidationQuery dataclass shape is backwards-compatible (new params are optional with sensible defaults)."

anti_patterns:
- "DO NOT delete the write_primitives-local loader as a side-effect -- if the chosen path is (a) incremental extension, leave
  the local loader in place and let it inherit from the shared one explicitly."
- "DO NOT introduce a third copy of the validation-query parsing logic. If (b) is chosen, the write_primitives loader becomes
  a thin call into the shared one, not a parallel implementation."

scope_limit:
  only_modify:
  - "benchbox/core/primitives/catalog/loader.py"
  - "benchbox/core/write_primitives/catalog/loader.py"
  - "benchbox/core/transaction_primitives/"
  - "tests/unit/core/primitives/"
  - "tests/unit/core/write_primitives/"

metadata:
  tags:
  - architecture
  - catalog-loaders
  - blind-spot-followup
  estimated_effort: "Small"
  created_date: "2026-05-05"

impact:
  technical_debt: |
    The two-loader divergence has cost three rounds already (PR #112/#114
    expected_value bounds; PR #176 platform_overrides). Each extension to
    the write_primitives-local loader silently widens the gap. Locking
    the two loaders into a tested parity contract stops the bleeding
    before transaction_primitives or a future benchmark hits a silent-
    drop bug.
