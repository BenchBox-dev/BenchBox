id: single-repo-migration-phase-4-test-release-with-new-flow
title: "Single-repo migration phase 4: final sync, _project/** history merge, first release on public (v0.3.0)"
worktree: main
priority: High
status: Completed
category: Release Tooling

deps:
  needs:
  - single-repo-migration-phase-3-new-release-flow
  - release-recovery-v0-3-1

blockers:
- date: "2026-05-25"
  work: [w8]
  reason: |
    The first public `v0.3.0` release was cut and published, but the
    post-publish install verification failed. The latest `release.yml`
    run for tag `v0.3.0` concluded `failure`: build, PyPI publish, and
    GitHub release jobs succeeded, while all `test-installation` jobs
    failed. A clean install of the immutable PyPI `benchbox==0.3.0`
    still fails to import because `benchbox.platforms.clickhouse.client`
    imports `pandas`, which was not available from the published wheel's
    dependency set.
  evidence: |
    - `git rev-parse v0.3.0` returned `038ad548875a674cc6de0a8956677e052eac1033`.
    - `gh release view v0.3.0 --repo joeharris76/BenchBox` showed `BenchBox 0.3.0`, published `2026-05-20T11:49:42Z`.
    - `uv run --isolated --with pip -- python -m pip index versions benchbox` showed available/latest `0.3.0`.
    - `gh run list --repo joeharris76/BenchBox --workflow=release.yml --limit 1` returned run `26160520298`, conclusion `failure`, branch `v0.3.0`, SHA `038ad548875a674cc6de0a8956677e052eac1033`.
