context_sections:
  Research Findings: 'The regression is triggered by DataFusion enforcing file_extension filtering

    in read_csv (default .csv), which rejects TPC-H .tbl files. The adapter path

    loads .tbl directly and does not invoke data conversion. The dependency floor

    for datafusion is >=50.1.0, so newer environments now hit the stricter check.

    '
technical_requirements:
  constraints:
  - Must work across DataFusion versions with differing read_csv APIs
  - Do not break non-DataFusion DataFrame adapters
  dependencies:
  - datafusion>=50.1.0 (runtime dependency)
  - pyarrow for CSV read fallback
success_metrics:
- DataFusion DataFrame run succeeds on TPC-H SF=0.01 and SF=1 using .tbl inputs
- Missing data surfaces a clear error before load; queries do not execute
- All DataFrame adapter tests pass
- Queries never execute after any table load failure
open_questions:
- Which DataFusion versions expose file_extension in read_csv options?
- Should .tbl be normalized to .csv on disk or only in-memory via PyArrow?
completed_date: '2026-01-26'
sections:
  Implementation Summary: 'Implemented DataFusion-safe .tbl loading with version-aware file_extension

    support and PyArrow fallback (including compressed .zst streams). Updated

    DataFrame adapter load path to fail fast on missing data and load errors,

    and routed load-only flows for DataFrame adapters through the DataFrame

    execution path in the core runner. Added tests for compressed and non-

    trailing TBL conversion and adapter fail-fast behavior. Manual CLI

    verification completed for load-only and power phases.'
  Challenges and Solutions: 'DataFusion enforces .csv extensions and cannot read compressed .tbl.zst

    directly. The fix uses DataFusion’s file_extension option when available,

    and otherwise streams decompressed data through PyArrow. Conversion now

    detects trailing delimiters dynamically to avoid column-mismatch errors.'
  Lessons Learned: 'Load-only flows must detect DataFrame adapters before SQL-only paths.

    TPC data generated with compression requires explicit decompression during

    CSV→Parquet conversion to avoid parse errors.'
