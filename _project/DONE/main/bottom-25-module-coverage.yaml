      test that they match expected structure, not just "they exist".

      Research gate: Read both source files in full before writing tests.

      Files to create:
      - tests/unit/core/coffeeshop/test_coffeeshop_schema.py
      - tests/unit/core/tpcdi/test_schema_extensions.py

      coffeeshop/schema.py - verified public API:
        get_create_table_sql(table_name) → str
        get_all_create_table_sql() → str  (joined SQL, NOT a dict)
        get_tunings() → BenchmarkTunings
        TABLES dict with 3 keys

      - Test TABLES has exactly 3 keys: "dim_locations", "dim_products", "order_lines"
      - Test each table dict has "name", "columns", "row_count_formula" keys
      - Test dim_locations has exactly 6 columns; assert record_id type=="INTEGER",
        location_id type=="VARCHAR(16)"
      - Test order_lines columns include location_record_id with
        foreign_key=="dim_locations.record_id"
      - Test get_create_table_sql("dim_locations") returns str starting with
        "CREATE TABLE dim_locations"
      - Test get_create_table_sql("unknown_table") raises ValueError
      - Test get_all_create_table_sql() returns str containing all 3 "CREATE TABLE" headers
      - Test get_all_create_table_sql(enable_primary_keys=False) → no "PRIMARY KEY" in output
      - Test get_tunings() returns BenchmarkTunings; tunings contains entry for "order_lines"
      - Assert order_lines tuning has partitioning on "order_date"

      tpcdi/schema_extensions.py - verified public API:
        EXTENSION_TABLES dict with 9 keys
        get_extended_table_order() → list[str]
        get_foreign_key_constraints() → dict[str, list[dict]]
        get_extended_create_table_sql(table_name) → str
        get_all_extended_create_table_sql() → str

      - Test EXTENSION_TABLES has keys: "DimBroker", "FactCashBalances", "FactHoldings",
        "FactMarketHistory", "FactWatches", "Industry", "StatusType", "TaxRate", "TradeType"
      - Test DIMBROKER["name"] == "DimBroker" and "SK_BrokerID" is in column names
      - Test get_extended_table_order() returns list where lookup tables precede fact tables
        (assert "Industry" appears before "FactCashBalances")
      - Test Fact tables (FactCashBalances, FactHoldings, FactMarketHistory, FactWatches)
        all have "BatchID" column - lookup tables (Industry, StatusType, TaxRate, TradeType)
        do NOT have BatchID (verify per-table, not as a blanket assertion)
      - Test get_extended_create_table_sql("FactCashBalances") returns str containing
        "CREATE TABLE IF NOT EXISTS FactCashBalances"
      - Test get_extended_create_table_sql("unknown") raises ValueError
      - Test get_all_extended_create_table_sql() returns str with 9 CREATE TABLE blocks
      - Test get_foreign_key_constraints() returns dict; "DimBroker" key has FK to itself
        (ManagerID → BrokerID self-reference)

  - id: w4
    summary: "Test dependency_validation unit functions with synthetic data (16% → 80%)"
    status: done
    needs: []
    description: |
      benchbox/utils/dependency_validation.py: 83 stmts missing, 16% coverage.
      The 2 existing tests only hit the happy-path on the real pyproject.toml.
      The internal functions (_collect_locked_versions, _validate_requirement, etc.)
      need unit tests with synthetic TOML data - not relying on real lock file.

      Extend: tests/unit/utils/test_utils_dependency_validation.py

      Test _collect_locked_versions with synthetic lock_data dict:
      - {"package": [{"name": "foo", "version": "1.2.3"}]} → {"foo": {Version("1.2.3")}}
      - Multiple versions of same package → set contains both
      - Entry missing "name" → skipped gracefully
      - Entry missing "version" → skipped gracefully
      - Canonical name normalization: "PyYAML" → "pyyaml"

      Test _requirements_from_strings:
      - ["foo>=1.0", "bar==2.3.4"] → list of 2 Requirement objects with correct attrs
      - ["foo"] → Requirement with empty specifier

      Test _validate_requirement:
      - Satisfying version present → True
      - Version present but doesn't satisfy specifier (foo>=2.0, locked 1.0) → False
      - No versions locked → False
      - No specifier on requirement → True (any version acceptable)

      Test _format_requirement:
      - With specifier → "foo>=1.0"
      - Without specifier → "foo"

      Test validate_dependency_versions with synthetic data:
      - All satisfied → returns []
      - One unsatisfied → returns list with that package's error string
      - Multiple failures → returns all of them
      - Extras section: unsatisfied extra dep → error includes "(extra: <name>)"

      Test build_matrix_summary with synthetic data:
      - Extracts requires-python, resolution-markers, optional-dependencies
      - Returns correct structure

      Test _print_matrix output (capture stdout via capsys):
      - "Python compatibility" header in output
      - Markers section shows if present
      - "No optional dependencies declared" when extras is empty

      Test main():
      - --matrix flag: calls build_matrix_summary and prints it
      - Missing required dep: returns exit code 1 and writes to stderr
      - Passing --pyproject and --lock paths to point at synthetic files (write tmp TOML)

