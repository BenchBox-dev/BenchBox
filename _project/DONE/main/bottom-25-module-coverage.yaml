        get_query(query_id) → str
        get_queries(dialect) → dict[str, str]
        get_create_tables_sql(dialect, tuning_config) → str

      File to create: tests/unit/core/coffeeshop/test_coffeeshop_benchmark.py

      Test CoffeeShopBenchmark initialization:
      - Default scale_factor=1.0 → self.scale_factor == 1.0
      - Custom scale_factor=0.5 → propagated to data_generator
      - self._name == "CoffeeShop Benchmark", self._version == "2.0"
      - query_manager is CoffeeShopQueryManager instance
      - data_generator is CoffeeShopDataGenerator instance

      Test generate_data (use tmp_path fixture):
      - With output_format="csv" → returns dict with 3 entries
      - Each value is a path string to an existing .csv file
      - Table names in returned dict match TABLES.keys()
      - With tables=["dim_locations"] → only that one key in returned dict
      - Tables stored in self.tables after generation
      - With output_format="parquet" → raises ValueError (only csv supported)
      - Unknown table name → raises ValueError

      Test load_data_to_database (use duckdb.connect(":memory:")):
      - After generate_data, load_data_to_database(conn) creates tables in DuckDB
      - conn.execute("SELECT COUNT(*) FROM dim_locations").fetchone()[0] > 0
      - conn.execute("SELECT COUNT(*) FROM order_lines").fetchone()[0] > 0
      - Calling load_data_to_database before generate_data → raises ValueError

      Test run_benchmark (use duckdb.connect(":memory:") after load):
      - run_benchmark(conn, queries=["Q1"]) returns dict with "query_results" list
      - result["query_results"][0]["query_id"] == "Q1"
      - result["query_results"][0]["success"] == True
      - result["query_results"][0]["avg_time"] > 0

      Mark tests as: @pytest.mark.unit @pytest.mark.medium (not @pytest.mark.fast)

