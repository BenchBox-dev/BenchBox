id: coverage-blindspot-burndown
title: "Coverage config hygiene: drop stale .coveragerc_core omits, add fast-lane tests for TPC-DI SCD processor and core/throughput"
worktree: main
priority: Medium
status: "Completed"
completed_date: "2026-07-04"
category: "Testing and Quality Assurance"

description: |
  Test-strategy review of coverage configuration found real coverage
  blind spots, but the originally-cited facts needed correction after
  reading the current tree - two of the three "omitted" TPC-DI ETL files
  no longer exist:

  `.coveragerc_core:16-18` currently reads:

      benchbox/core/tpcdi/etl/transformations.py
      benchbox/core/tpcdi/etl/batch.py
      benchbox/core/tpcdi/etl/scd_processor.py

  - `transformations.py` was deleted in commit `0fbbd431` ("chore: shrink
    dead TPC-DI transformations (#640)").
  - `batch.py` was deleted in commit `5b15277b` ("chore: shrink dead TPC-DI
    ETL batch scaffold (#637)").
  - Both omit entries are now stale/dead config referring to files that
    don't exist - harmless (coverage's `omit` glob just matches nothing)
    but should be cleaned up so the file doesn't misrepresent what's
    actually being excluded from coverage.
  - `scd_processor.py` DOES still exist (951 lines,
    `benchbox/core/tpcdi/etl/scd_processor.py`) and IS still omitted from
    coverage entirely. It has a dedicated unit test file
    (`tests/unit/core/tpcdi/test_etl_scd_processor.py`, marked
    `pytest.mark.unit, pytest.mark.medium` - not `fast`) plus exercise via
    `tests/integration/test_tpcdi_phase3_benchmark.py` (`integration,
    medium`) and `tests/integration/test_tpcdi_full_benchmark.py`
    (`integration, slow`). None of these run in the fast lane
    (`-m "fast and not (slow or ...)"`, `.github/workflows/pr.yml:450`,
    `--cov-fail-under=70`), so even without the coverage omit,
    `scd_processor.py` contributes zero coverage to the number CI actually
    gates on - the omit just also hides it from the full/nightly coverage
    report.

  Separately, `benchbox/core/throughput/` (`runner.py` 163 lines,
  `result.py` 72 lines - imported by
  `benchbox/core/tpch/throughput_test.py` and
  `benchbox/core/tpcds/throughput_test.py`) is NOT in the `.coveragerc_core`
  omit list, so it's nominally measured - but its only real exerciser,
  `tests/integration/test_tpch_throughput_test.py`, is marked
  `pytest.mark.integration, pytest.mark.slow`. There is no
  `fast`-marked test that imports or exercises `core/throughput` at all,
  so its real fast-lane coverage is effectively zero even though the
  90-line-ish module isn't formally excluded.

  Net effect: the 70% `--cov-fail-under` floor
  (`.github/workflows/pr.yml:450`) is measured only on the fast lane, and
  two real modules (`scd_processor.py`, `core/throughput/`) have no
  fast-lane characterization tests protecting them from regressions
  between releases, even though one of them isn't even coverage-omitted.

metadata:
  owners:
    - joeharris76
  tags:
    - testing
    - quality
    - coverage
    - tpcdi
    - throughput
  estimated_effort: "Medium"
  created_date: "2026-07-03"

impact:
  user_impact: |
    None directly - coverage tooling and test-only changes. Reduces the
    chance that a regression in TPC-DI SCD processing or the throughput-
    test runner ships undetected because the fast CI lane never touches
    that code.
  technical_debt: |
    Removes two dead omit entries pointing at deleted files, and closes
    two real fast-lane coverage gaps with minimal characterization tests
    rather than full rewrites of the existing (slower) integration
    coverage.

work:
  - id: w1
    summary: "Remove the two stale .coveragerc_core omit entries for deleted files"
    status: done
    completion_notes: |
      Confirmed via `git log --all -- <path>` that both files' most recent
      history is a deletion commit (0fbbd431 for transformations.py,
      5b15277b for batch.py) and neither exists in the tree. Deleted both
      lines from .coveragerc_core's omit list. Verified with
      `grep -n 'transformations.py\|batch.py' .coveragerc_core` -> no matches.
    notes: |
      Delete the `benchbox/core/tpcdi/etl/transformations.py` and
      `benchbox/core/tpcdi/etl/batch.py` lines from `.coveragerc_core`'s
      `omit` list (lines 16-17) - both files were removed by #640 and #637
      respectively and no longer exist. Confirm no other file resurrects
      those paths before deleting (`git log --all -- <path>` should show
      only the deletion commits as the most recent history).

  - id: w2
    summary: "Add fast-marked characterization tests for benchbox/core/tpcdi/etl/scd_processor.py"
    status: done
    completion_notes: |
      Measured actual runtime with `--durations=0 -n 0`: setup 0.51s
      (import/session overhead), call 0.01s, total 0.65s for the single
      existing test. Genuinely fast (option 1) - re-marked pytestmark from
      `pytest.mark.medium` to `pytest.mark.fast` in place; no new test file
      needed. Re-verified under `-m fast -n 0`: 1 passed in 0.83s.
    notes: |
      `tests/unit/core/tpcdi/test_etl_scd_processor.py` already exists and
      is well-scoped (104 lines) but marked `medium`, not `fast`. Two
      options, pick based on actual runtime once measured:
        1. If the existing medium tests are individually fast (likely,
           given SCD logic is pure in-memory transformation, not I/O), just
           re-mark the file's `pytestmark` to `fast` after confirming
           runtime with `--durations=0`.
        2. If the existing tests are genuinely slower (e.g. they spin up a
           DataFrame/DB fixture), add a small new `fast`-marked test module
           covering the core SCD Type-2 branching logic
           (insert-new-version / expire-old-version / no-op-unchanged)
           against minimal in-memory fixtures, leaving the existing
           `medium` file for broader integration-shaped cases.
      Whichever path, the fast lane must end up covering scd_processor.py.

  - id: w3
    summary: "Add fast-marked characterization tests for benchbox/core/throughput/"
    status: done
    completion_notes: |
      Added tests/unit/core/throughput/__init__.py (empty, matching sibling
      tests/unit/core/* subpackage convention) and
      tests/unit/core/throughput/test_runner.py (fast-marked, 12 tests)
      exercising StreamRunner.execute() (all-succeed, failed-stream,
      exception-from-stream_fn, zero-queries-stream, single-thread fallback
      when max_workers is None, verbose-logging no-op) and
      StreamRunner.compute_metrics() (throughput/query-throughput math,
      zero-queries edge case, no-stream-results elapsed-time fallback via
      monkeypatched elapsed_seconds, zero-total-time division-skip branch),
      plus ThroughputResult/ThroughputStreamResult default-shape checks.
      Deliberately did not exercise real multi-threaded timeout behavior
      (ThreadPoolExecutor's TimeoutError branch) since that needs
      wall-clock-sensitive execution - left to the existing slow
      integration test per the anti-pattern guidance. All 12 pass in
      <1s combined (`-m fast -n 0`: 12 passed in 0.98s).
    notes: |
      `benchbox/core/throughput/runner.py` (163 lines) and `result.py`
      (72 lines) currently have no test coverage outside the slow-marked
      `tests/integration/test_tpch_throughput_test.py`. Add a small
      `fast`-marked unit test module (e.g.
      `tests/unit/core/throughput/test_runner.py`) covering the runner's
      pure logic paths with a mocked/fake benchmark object (mirroring the
      pattern already used in test_tpch_throughput_test.py's
      `benchmark.get_query.return_value = "SELECT 1"` style mocking, but
      without the `slow` marker) - concurrency/throughput timing behavior,
      result aggregation in `result.py`, and error/edge-case handling
      (zero queries, single-thread fallback, etc.). Do not attempt to
      characterize actual multi-threaded timing behavior in the fast lane -
      that's what the existing slow integration test is for; focus fast
      tests on deterministic logic (aggregation math, config validation,
      result-shape correctness).

  - id: w4
    summary: "Remove the (now-clean) coveragerc omissions and document any remaining deliberate ones"
    needs: [w2, w3]
    status: done
    completion_notes: |
      Removed the scd_processor.py line from .coveragerc_core's omit list
      now that w2 gives it fast-lane coverage. Added a one-line rationale
      comment above each of the 7 remaining omit entries (tpcds/datavault/
      nyctaxi/clickbench dataframe_queries/queries.py + tpcds rollup_helper/
      channel_helper + experimental/concurrency executor.py/pool_tester.py),
      based on grepping tests/ for each module's existing coverage (all 7
      have dedicated unit/integration test files; experimental/concurrency
      is additionally confirmed via grep to not be imported by any
      production code path outside benchbox/experimental itself).
      DISCOVERY (out of scope to fix, flagging for follow-up): the actual
      CI gate in .github/workflows/pr.yml's "Run fast tests" step invokes
      `pytest --cov=benchbox --cov-fail-under=70` with NO --cov-config flag,
      so coverage.py auto-discovers pyproject.toml's [tool.coverage.run]
      section (confirmed via `python -m coverage debug config` ->
      config_files_read includes pyproject.toml, not .coveragerc_core).
      pyproject.toml already has its own parallel omit list (with its own
      pre-existing rationale comments, already omitting scd_processor.py).
      .coveragerc_core is actually consumed by pytest-ci.ini's
      `--cov-config=.coveragerc_core` (a separate/legacy CI profile) and by
      tests/conftest.py's advisory 80%-warning coverage check. This TODO's
      scope_limit explicitly excludes pyproject.toml and pr.yml, so this
      change is correct as specified but does not by itself move the
      production --cov-fail-under=70 gate's omit list - only the
      pytest-ci.ini profile and the advisory check.
    notes: |
      Once w2/w3 land fast-lane coverage for scd_processor.py (and
      core/throughput if it turns out to need adding to the omit list
      pending w3 - it currently is NOT omitted, so no removal needed
      there), remove the now-covered `scd_processor.py` line from
      `.coveragerc_core`'s omit list. For every omit entry that remains
      (the dataframe_queries/queries.py-style generated-query files,
      `benchbox/experimental/concurrency/*`), add a one-line rationale
      comment above it in `.coveragerc_core` explaining WHY it's
      deliberately excluded (e.g. "# generated/templated SQL construction,
      exercised via golden-output tests, not line coverage" or
      "# experimental, not on any release-gate path") so future readers
      don't have to archaeology their way to an answer the way this TODO
      had to.

must_preserve:
  - "The 70% --cov-fail-under floor in .github/workflows/pr.yml:450 continues to pass after adding new fast tests (new tests should raise coverage, not just add runtime)."
  - "Existing medium/slow/integration TPC-DI and throughput tests (test_etl_scd_processor.py if left as medium, test_tpcdi_phase3_benchmark.py, test_tpcdi_full_benchmark.py, test_tpch_throughput_test.py) continue to pass unchanged."
  - "No behavior change to benchbox/core/tpcdi/etl/scd_processor.py or benchbox/core/throughput/ - this is a test-and-config-only TODO."

approach: |
  Start with w1 (pure config cleanup, zero risk, unblocks nothing but is
  trivial to land first). w2 and w3 are independent and can proceed in
  parallel - both are "add or re-mark fast tests for an under-tested
  module" with the same shape. Measure actual runtime with
  `pytest --durations=0` before deciding fast vs. keep-medium for w2's
  existing test file. w4 depends on w2+w3 landing since it removes the
  omit entry only once real fast-lane coverage exists to replace it.

anti_patterns:
  - "DO NOT re-add omit entries for transformations.py / batch.py 'just in case' - because they were deliberately deleted as dead code by #637/#640 - if they come back, that's a new decision for a new commit, not a reason to keep stale references now."
  - "DO NOT mark test_etl_scd_processor.py or new throughput tests 'fast' without measuring actual runtime first - because mis-marking a slow test as fast defeats the purpose of the lane split and can make the required PR gate flaky/slow - verify with --durations=0."
  - "DO NOT attempt to characterize real multi-threaded timing/concurrency behavior of core/throughput/runner.py in fast tests - because that inherently requires wall-clock-sensitive execution unsuitable for a fast deterministic lane - keep the fast tests to pure/deterministic logic and leave timing behavior to the existing slow integration test."

verification:
  - description: ".coveragerc_core no longer references deleted files"
    command: "! grep -n 'transformations.py\\|batch.py' .coveragerc_core"
    expected_output: "Exit 0 (grep found no match; bare grep exits 1 on no-match, so it must be inverted for this to be a pass/fail gate)"
  - description: "New/re-marked fast tests for scd_processor.py pass and are collected in the fast lane"
    command: "uv run -- python -m pytest tests/unit/core/tpcdi/test_etl_scd_processor.py -m fast -v"
    expected_output: "Tests collected and pass under the fast marker"
  - description: "New fast tests for core/throughput pass and are collected in the fast lane"
    command: "uv run -- python -m pytest tests/unit/core/throughput/ -m fast -v"
    expected_output: "Tests collected and pass under the fast marker"
  - description: "Fast-lane coverage floor still passes with the coveragerc omissions removed"
    command: "uv run -- python -m pytest tests -m \"fast and not (slow or stress or resource_heavy or live_integration)\" --cov=benchbox --cov-report=term-missing --cov-fail-under=70"
    expected_output: "Coverage >= 70%, all fast tests pass"

scope_limit:
  only_modify:
    - ".coveragerc_core"
    - "tests/unit/core/tpcdi/test_etl_scd_processor.py"
    - "tests/unit/core/throughput/"
  do_not_modify:
    - "benchbox/core/tpcdi/etl/scd_processor.py"
    - "benchbox/core/throughput/"
    - ".github/workflows/pr.yml"

success_metrics:
  - "Zero .coveragerc_core omit entries reference nonexistent files"
  - "benchbox/core/tpcdi/etl/scd_processor.py has fast-lane test coverage and is removed from the omit list"
  - "benchbox/core/throughput/ has a fast-marked unit test module covering its deterministic logic"
  - "Every remaining .coveragerc_core omit entry has an inline rationale comment"
