id: explorer-heatmap-accessibility-review-followups
title: "Address follow-up findings from heatmap-accessibility code review"
worktree: main
priority: Low
status: Completed
completed_date: "2026-04-19"
category: Testing and Quality Assurance

description: |
  Non-required nits and improvements surfaced by the code review of
  explorer-heatmap-accessibility-and-tests.  Four Required issues
  (broken CSS rule, invisible focus ring, empty columnheader, misleading
  aria-sort) were fixed immediately post-review.  This item tracks
  the remaining nit/consider findings.

work:
  - id: w1
    summary: "Align aria-label text with visible cell text for timing values"
    needs: []
    status: done
    notes: |
      QueryHeatmap.tsx:278 - aria-label uses ms.toFixed(1) (e.g. "10.0 ms")
      while the visible cell text uses fmtMs() which emits toFixed(0)
      ("10 ms").  Screen readers announce a value that differs from what
      is displayed.

      Fix: use fmtMs(ms) in the aria-label string for consistency.

      Also: for the fastest cell (ratio=1.0), the label reads "10 ms, 1.0×
      fastest in column" which is grammatically awkward - the cell IS the
      fastest, not a comparison to it.  Special-case as "10 ms, fastest in
      column" when ratio rounds to 1.0.

  - id: w2
    summary: "Replace manual violation-split in axe-helper with configureAxe"
    needs: []
    status: done
    notes: |
      axe-helper.ts:19-41 - The helper manually splits results.violations
      into serious/critical vs minor arrays, reconstructs { violations:
      critical }, and passes the partial object to toHaveNoViolations().
      This works but relies on jest-axe's private object shape.

      The idiomatic approach:
        import { configureAxe, toHaveNoViolations } from "jest-axe";
        const axe = configureAxe({ impactLevels: ["serious", "critical"] });
        expect(await axe(container)).toHaveNoViolations();

      The helper becomes a clean two-liner; jest-axe handles the filtering
      internally and is not coupled to the violation object shape.

  - id: w3
    summary: "Add Home/End key support to keyboard grid navigation"
    needs: []
    status: done
    notes: |
      QueryHeatmap.tsx:122-149 - handleCellKey handles ArrowLeft/Right/
      Up/Down but not Home/End.  The WAI-ARIA 1.2 grid pattern recommends
      (not requires) Home to jump to first cell in row and End to last cell
      in row, Ctrl+Home to first cell in grid.

      Low priority: not a WCAG requirement for read-only data grids.
      Worth adding if AT user feedback surfaces the gap.

  - id: w4
    summary: "Add axe test for QueryHeatmap with selection enabled"
    needs: []
    status: done
    notes: |
      QueryHeatmap.test.tsx currently renders with no onSelectionChange, so
      the checkbox column header (hasSelection=false) is never in the axe
      DOM.  The Required fix (w3 in the main TODO) added aria-label to the
      empty <th>, but there is no regression test that exercises the
      selection path through axe.

      Fix: add one axe test case in QueryHeatmap.test.tsx that passes
      selectedIds={new Set()} and onSelectionChange={() => {}} so axe runs
      against the full grid including the checkbox column header.

files_affected:
  modified:
    - "results-explorer/src/components/QueryHeatmap.tsx"
    - "results-explorer/src/testing/axe-helper.ts"
    - "results-explorer/src/components/__tests__/QueryHeatmap.test.tsx"

must_preserve:
  - "axe helper continues to suppress minor violations - only the implementation mechanism changes in w2"
  - "aria-label remains present on all cells in w1 - only the text format changes"

verification:
  - description: "QueryHeatmap axe tests still pass after axe-helper refactor"
    command: "cd results-explorer && npm test -- QueryHeatmap"
    expected_output: "all tests pass including axe assertions"
  - description: "Full test suite green"
    command: "cd results-explorer && npm run typecheck && npm test"
    expected_output: "all green"

anti_patterns:
  - "DO NOT change configureAxe to suppress impact levels globally - because that silences violations in all tests - scope the
    config per-call or per-helper"

