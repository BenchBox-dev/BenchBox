  - "All 7 assert_not_called() sites in test_benchmark_execution.py have an accompanying positive-outcome assertion"
  - "test_dataframe_runner.py:484 asserts a single pinned value, not an either-outcome tuple"
  - "Zero in-body except ImportError: pytest.skip sites remain in test_write_primitives_dataframe.py's PySpark test classes"
