    - "tests/unit/core/write_primitives/test_pyspark_sketch_factories.py"
    - "tests/unit/core/write_primitives/test_benchmark_execution.py"
    - "tests/unit/core/runner/test_dataframe_runner.py"
    - "tests/unit/benchmarks/test_write_primitives_dataframe.py"
  do_not_modify:
    - "benchbox/core/write_primitives/"
    - "benchbox/core/runner/dataframe_runner.py"
    - "benchbox/core/results/builder.py"
    - "benchbox/platforms/dataframe/pyspark_maintenance.py"

success_metrics:
