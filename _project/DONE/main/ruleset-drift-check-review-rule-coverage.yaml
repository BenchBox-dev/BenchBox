id: ruleset-drift-check-review-rule-coverage
title: "Extend ruleset_drift_check.py to assert the develop pull_request review rule"
worktree: main
priority: High
status: Completed
category: Release Tooling

description: |
  Follow-up to auto-merge-review-gate-admin-enforcement. `scripts/ruleset_drift_check.py`
  `compare_ruleset` (lines 135-180) already compares the develop ruleset's
  enforcement state, target ref, required status checks, strict-check policy,
  required_linear_history, non_fast_forward, deletion, and bypass actors — but
  it never inspects the ruleset's `pull_request` rule (required_approving_review_count,
  require_code_owner_review). So the daily `release-canary.yml` ruleset-drift job
  (and the validate-main-pr.yml bootstrap invocation) can stay green forever even
  while the develop ruleset still shows required_approving_review_count: 0 and
  require_code_owner_review: false — the documented live state in
  docs/operations/repo-admin-settings.md:119-121.

  The review-rule predicate already exists and is correct:
  `_project/scripts/ruleset_review_enforcement.py` (`review_enforcement_findings`)
  reads `SOUNDNESS_PREFIXES` from `_project/scripts/auto_merge_soundness_paths.py`
  so its narration cannot drift from the auto-merge withholding set. But today it
  only runs (a) manually, piped from `gh api repos/.../rules/branches/develop`, or
  (b) as a pinned-logic unit test in `tests/unit/release/test_ruleset_review_enforcement.py`
  that exercises fixture JSON, not the live ruleset. Nothing wires it into the
  daily canary that already has ruleset-read (`RULESET_DRIFT_TOKEN`) access. That
  means the admin-enforcement TODO's w3 verification step ("meta-check turns red
  if the ruleset enforcement is ever removed") is not actually automated at the
  canary layer — only the one-time manual verify command in the runbook covers it.

prior_art:
  - "scripts/ruleset_drift_check.py:compare_ruleset — reuse this comparison-and-findings pattern; add one more section rather than a parallel mechanism."
  - "_project/scripts/ruleset_review_enforcement.py:review_enforcement_findings — the single source of truth for the review-rule predicate; import it, do not reimplement the required_approving_review_count / require_code_owner_review checks inline in ruleset_drift_check.py."

work:
  - id: w1
    summary: "Decide sequencing: land review-rule drift coverage before or after the admin PUT lands"
    status: done
    notes: |
      If ruleset_drift_check.py starts asserting required_approving_review_count>=1
      and require_code_owner_review=true immediately, the daily canary goes
      permanently red until the admin action in auto-merge-review-gate-admin-enforcement
      is applied (live state is currently 0/false per
      docs/operations/repo-admin-settings.md:119-121). Two options: (a) land this
      only after the admin PUT is confirmed applied (this item stays blocked on
      that TODO's w3), or (b) land a warn-only mode now (findings printed, exit 0)
      that flips to enforcing once the admin action lands. Record the decision
      here and in the PR description; do not silently pick one.

  - id: w2
    summary: "Import ruleset_review_enforcement's predicate into ruleset_drift_check.py's compare_ruleset"
    needs: [w1]
    status: done
    notes: |
      Add a call to `review_enforcement_findings` (from
      _project/scripts/ruleset_review_enforcement.py) inside or alongside
      `compare_ruleset` for the develop-squash-only ruleset only (main-release-only
      has no equivalent requirement documented). Reuse `extract_rules` to normalize
      the already-fetched live ruleset payload — do not re-fetch. Append its
      findings to the existing findings list so `render_summary` and the JSON
      `--output` payload surface them the same way as other drift findings.

  - id: w3
    summary: "Update the runbook and confirm both CI call sites surface the new failure mode"
    needs: [w2]
    status: done
    notes: |
      Update docs/operations/repo-admin-settings.md's "Ruleset drift is checked
      by scripts/ruleset_drift_check.py" paragraph to say it now also asserts
      review enforcement for develop, and update or retire the now-partially-
      redundant "Verify (manual or release-canary...)" command if the canary
      covers it automatically. Confirm release-canary.yml (~line 160) and
      validate-main-pr.yml (~line 115) both still pass the token/env this needs
      and that a failure renders clearly in their job summaries (same pattern as
      existing drift findings).

  - id: w4
    summary: "Extend or add unit coverage for the merged drift+review-enforcement path"
    needs: [w2]
    status: done
    notes: |
      Add a fixture-based test (alongside tests/unit/release/test_ruleset_drift_check.py
      if it exists, else tests/unit/release/) asserting compare_ruleset now flags a
      develop ruleset missing review enforcement, and stays silent on that axis
      once the fixture has required_approving_review_count>=1 and
      require_code_owner_review=true. Keep tests/unit/release/test_ruleset_review_enforcement.py
      passing unchanged — this item extends the drift checker, not the predicate.

must_preserve:
  - "scripts/ruleset_drift_check.py's existing comparisons (required checks, strict policy, linear history, non-fast-forward, deletion, bypass actors, target refs) are unchanged for both develop-squash-only and main-release-only."
  - "_project/scripts/ruleset_review_enforcement.py remains the single source of truth for the review-rule predicate; ruleset_drift_check.py imports it rather than duplicating the required_approving_review_count / require_code_owner_review checks."
  - "The RELEASE_READINESS_OVERRIDE_SHA/_REASON emergency override in ruleset_drift_check.py continues to short-circuit before any new check runs."

anti_patterns:
  - "DO NOT reimplement required_approving_review_count / require_code_owner_review logic inline in ruleset_drift_check.py — import review_enforcement_findings from _project/scripts/ruleset_review_enforcement.py so the two scripts cannot drift apart."
  - "DO NOT flip the canary to enforcing without first checking whether the admin PUT from auto-merge-review-gate-admin-enforcement has actually landed — that repeats the same 'code says enforced, repo layer does not' gap this whole line of TODOs exists to close."

verification:
  - description: "ruleset_review_enforcement's own pinned test still passes"
    command: "uv run -- python -m pytest tests/unit/release/ -k ruleset_review_enforcement -q"
    expected_output: "all tests pass, 0 failures"
  - description: "ruleset_drift_check now flags a fixture develop ruleset with required_approving_review_count=0"
    command: "uv run -- python -m pytest tests/unit/release/ -k ruleset_drift -q"
    expected_output: "new/updated test asserts a review-enforcement finding is present when the fixture ruleset lacks review requirements"

scope_limit:
  only_modify:
    - "scripts/ruleset_drift_check.py"
    - "tests/unit/release/"
    - "docs/operations/repo-admin-settings.md"
  do_not_modify:
    - "_project/scripts/ruleset_review_enforcement.py"
    - "_project/scripts/auto_merge_soundness_paths.py"

deps:
  needs:
    - auto-merge-review-gate-admin-enforcement

success_metrics:
  - "release-canary.yml's ruleset-drift job fails when the live develop ruleset has required_approving_review_count<1 or require_code_owner_review!=true."
  - "The same failure mode is reachable from validate-main-pr.yml's bootstrap invocation without a separate code path."
  - "docs/operations/repo-admin-settings.md accurately describes the merged check (no stale claim that only the manual command or the pinned unit test cover this)."

open_questions:
  - question: "Should the new check enforce immediately or warn-until-enforced?"
    gating: true
    affects: ["w1", "success_metrics: release-canary fails on missing review enforcement"]
    default: "Warn-only (non-failing) until auto-merge-review-gate-admin-enforcement's w3 confirms the admin PUT landed, then flip to enforcing in a follow-up commit."

metadata:
  owners:
    - joeharris76
  tags: [release, ci, governance, ruleset, drift-check, holistic-review-followup]
  estimated_effort: "Small"
  created_date: "2026-07-03"
  last_updated: "2026-07-03T00:00:00"

resolution_notes: |
  All four work units implemented 2026-07-03, per the open_question's default
  (WARN-until-enforced):

  - w1: decision recorded as WARN-until-enforced (option b), matching the
    stated default. Implemented via a module-level toggle,
    `DEVELOP_REVIEW_RULE_ENFORCED = False`, in scripts/ruleset_drift_check.py.
  - w2: compare_ruleset now imports `extract_rules` and
    `review_enforcement_findings` from
    `_project/scripts/ruleset_review_enforcement.py` (neither file touched,
    per scope_limit) and, for `develop-squash-only` only, appends its
    findings to the same findings list `render_summary`/the JSON `--output`
    payload already use. While `DEVELOP_REVIEW_RULE_ENFORCED` is False,
    those specific findings are prefixed `WARNING_PREFIX = "WARNING
    (non-blocking): "`; a new `blocking_findings()` helper filters them out
    when `main()` decides the exit code and the JSON `status` field, so they
    render identically to other drift findings but do not fail the canary.
    Flipping `DEVELOP_REVIEW_RULE_ENFORCED` to True later is the one-line
    change referenced in both the code comment and the runbook.
  - w3: updated both the "Soundness-path review enforcement" section and the
    "Ruleset drift is checked by scripts/ruleset_drift_check.py" paragraph in
    docs/operations/repo-admin-settings.md to describe the merged check, the
    WARN-until-enforced decision, and that validate-main-pr.yml's bootstrap
    invocation shares the same code path (confirmed by reading both
    workflow files - neither needed a change, since both already call
    `ruleset_drift_check.py` with `RULESET_DRIFT_TOKEN` and
    `--require-bypass-actor-visibility`). Did not retire the manual verify
    command (still useful standalone, e.g. for checking current live state
    outside a canary run); clarified its relationship to the now-automated
    path instead.
  - w4: added tests/unit/release/test_ruleset_drift_review_coverage.py
    (4 tests) covering: missing review enforcement -> non-blocking warning
    by default; enforced ruleset -> no findings; `enforce_review_rule=True`
    -> the same gap becomes blocking (proves the one-line-flip claim);
    main-release-only is unaffected by the develop-only check.
    tests/unit/release/test_ruleset_review_enforcement.py required no
    changes and stays green (8/8). tests/unit/test_ruleset_drift.py's 5
    pre-existing tests (main-release-only fixtures) also stay green
    unchanged, confirming must_preserve.

  Note on success_metrics: the first listed metric ("release-canary.yml's
  ruleset-drift job fails when ... require_code_owner_review!=true")
  describes the POST-enforcement end state, not the state landed by this
  PR - by design, per the WARN-until-enforced decision this TODO's own
  open_questions section defaults to. The canary will start failing on
  that condition once `DEVELOP_REVIEW_RULE_ENFORCED` is flipped to True
  (gated on auto-merge-review-gate-admin-enforcement's admin PUT landing,
  per anti_patterns). Also note `required_approving_review_count` is not
  checked at all, by design (see review_enforcement_findings' own
  docstring) - the success metric's mention of it reflects the TODO
  description's own paraphrase of GitHub's raw field names, not a gap in
  this implementation.

  Verification: `uv run -- python -m pytest tests/unit/release/ -k
  ruleset_review_enforcement -q` -> 8 passed. `uv run -- python -m pytest
  tests/unit/release/ -k ruleset_drift -q` -> 4 passed. Full
  tests/unit/test_ruleset_drift.py + tests/unit/release/ +
  tests/unit/test_release_infrastructure.py + tests/unit/test_release_readiness.py
  -> 78 passed. ruff check/format clean on touched Python files.
