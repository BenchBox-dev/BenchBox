    details: 'TPC-H SF 1:

      - Pandas vs Modin vs cuDF vs Dask

      - Polars vs PySpark vs DataFusion

      - Single-node vs distributed (Dask, PySpark)

      '
  - summary: Create SQL vs DataFrame comparison benchmark
    done: false
    deferred: Deferred - requires DuckDB Python API integration. DataFusion SQL vs DataFrame can be compared now.
    details: 'For each platform with both modes:

      - DuckDB: SQL vs Python API

      - DataFusion: SQL vs DataFrame API

      '
  - summary: Generate performance comparison reports
    done: false
    deferred: Deferred until benchmark suite is complete. Basic profiling reports available via execute_query_profiled().
