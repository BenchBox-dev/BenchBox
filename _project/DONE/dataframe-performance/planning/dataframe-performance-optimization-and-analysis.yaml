tasks:
- phase: 'Phase 9.1: Performance Profiling'
  items:
  - summary: Create benchbox/core/dataframe/profiling.py
    done: true
    details: '- Query execution timing (QueryExecutionProfile, timing breakdown)

      - Memory usage tracking (MemoryTracker with background sampling)

      - Lazy evaluation overhead measurement (planning vs collect phases)

      - Platform-specific metrics collection (ProfileMetricType enum)

      '
  - summary: Add query plan capture for optimizing platforms
    done: true
    details: '- Polars: .explain() output via capture_polars_plan()

      - PySpark: .explain() output via capture_pyspark_plan()

      - DataFusion: logical_plan() output via capture_datafusion_plan()

      '
- phase: 'Phase 9.2: Optimization Implementation'
  items:
  - summary: Optimize Pandas family queries for performance
    done: true
    details: '- Minimize copies via copy-on-write (Pandas 2.0+)

      - Efficient scalar extraction via ctx.scalar()

      - Auto-categorize strings for memory optimization

      '
  - summary: Optimize Expression family queries
    done: true
    details: '- Leverage lazy evaluation with execute_query_profiled()

      - Minimize collect() calls via ctx.scalar()

      - Platform-specific optimizations documented

      '
  - summary: Add platform-specific query variants (5% escape hatch)
    done: true
    details: '- Scalar extraction helpers for all platforms

      - Copy-on-write configuration for Pandas

      - Comprehensive optimization documentation

      '
