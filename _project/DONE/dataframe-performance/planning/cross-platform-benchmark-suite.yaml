id: cross-platform-benchmark-suite
title: DataFrame Cross-Platform Benchmark Suite
worktree: dataframe-performance
category: Performance and Efficiency
priority: Medium
status: Completed
description: |
  Create comprehensive benchmark suite comparing DataFrame platform performance.
  This was deferred from the dataframe-performance Phase 9.3 work pending
  completion of Modin, cuDF, and Dask adapters.

  Current state:
  - Basic profiling exists (execute_query_profiled, MemoryTracker)
  - Cross-platform example exists: examples/dataframe/cross_platform_comparison.py
  - Missing: Systematic benchmark suite with standardized comparisons

  Goal: Generate reproducible performance comparisons across all DataFrame
  platforms for blog posts and documentation.

context_sections:
  "Deferred From":
    summary: |
      This work was explicitly deferred in dataframe-performance Phase 9.3:
      - "Deferred until Modin/cuDF/Dask adapters are implemented"
      - "Cross-platform comparison example exists: examples/dataframe/cross_platform_comparison.py"

tasks:
- phase: "Phase 1: Benchmark Suite Architecture"
  done: true
  items:
  - summary: "Design benchmark suite structure"
    done: true
    details: |
      - Standard test configurations (scale factors, query sets)
      - Platform capability matrix (GPU, distributed, streaming)
      - Result collection and normalization format
  - summary: "Create DataFrame benchmark runner"
    done: true
    details: |
      Extend existing cross_platform_comparison.py into full suite
      Add statistical analysis (mean, std, percentiles)
  - summary: "Define platform comparison categories"
    done: true
    details: |
      - Single-node: Pandas vs Polars vs DataFusion
      - GPU-accelerated: cuDF vs Polars GPU
      - Distributed: Dask vs PySpark vs Modin
      - Memory efficiency comparisons

- phase: "Phase 2: SQL vs DataFrame Comparisons"
  done: true
  items:
  - summary: "Create SQL mode baselines"
    done: true
    details: |
      Run TPC-H via SQL on DuckDB, SQLite for baseline
  - summary: "Create DataFrame vs SQL comparison framework"
    done: true
    details: |
      - Same queries, same data, SQL vs DataFrame API
      - DataFusion SQL vs DataFusion DataFrame
      - Measure overhead of DataFrame abstraction
  - summary: "Generate SQL vs DataFrame performance reports"
    done: true

- phase: "Phase 3: Reporting and Visualization"
  done: true
  items:
  - summary: "Integrate with visualization framework"
    done: true
    details: |
      Use benchbox/core/visualization/ to generate:
      - Platform comparison bar charts
      - Query-by-query breakdown heatmaps
      - Memory usage comparisons
  - summary: "Create benchmark report templates"
    done: true
    details: |
      - HTML reports with interactive charts
      - JSON exports for downstream processing
      - Markdown summaries for blog posts
  - summary: "Add regression detection for performance changes"
    done: true

- phase: "Phase 4: CLI Integration"
  done: true
  items:
  - summary: "Add benchbox compare-dataframes command"
    done: true
    details: |
      benchbox compare-dataframes --platforms polars-df,pandas-df,datafusion-df \
        --benchmark tpch --scale 1 --output ./comparison/
  - summary: "Add performance regression CI job"
    done: false
    details: |
      Track DataFrame performance across commits
      Alert on significant regressions
      NOTE: Deferred - CLI provides foundation, CI integration is separate concern

files_affected:
  modified:
  - examples/dataframe/cross_platform_comparison.py
  - benchbox/core/dataframe/profiling.py
  added:
  - benchbox/core/dataframe/benchmark_suite.py
  - benchbox/cli/commands/compare_dataframes.py
  - tests/performance/test_dataframe_comparison.py
  - docs/performance/dataframe-comparison-guide.md

dependencies:
  blocked_by:
  - _project/TODO/dataframe-expansion/planning/modin-cudf-dask-production-ready.yaml

metadata:
  owners:
  - "@benchbox-maintainers"
  tags:
  - dataframe
  - performance
  - benchmarking
  - comparison
  estimated_effort: Medium
  created_date: "2025-12-13"

impact:
  business_value: |
    Enables data-driven platform selection content for marketing.
    Powers "Which DataFrame library should I use?" blog posts.
  user_impact: |
    Users can make informed platform choices based on their workload.
    Reproducible benchmarks they can run on their own hardware.

success_metrics:
- Benchmark suite covers all production DataFrame platforms
- Reports generated automatically from benchmark results
- Performance comparisons integrated with visualization framework
- CLI command available for user-run comparisons
