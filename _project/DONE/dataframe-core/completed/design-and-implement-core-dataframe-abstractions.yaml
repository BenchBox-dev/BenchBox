id: design-and-implement-core-dataframe-abstractions
title: Design and Implement Core DataFrame Abstractions
worktree: dataframe-core
category: Core Functionality
priority: Critical
status: Completed
completed_date: '2025-12-02'
description: 'Implement the foundational abstractions for DataFrame benchmarking including

  DataFrameQuery protocol, DataFrameContext, and DataFrameOps protocol that

  will enable 95%+ code reuse across 8 dataframe platforms using a family-based

  architecture.

  '
context_sections:
- name: Architecture Decision
  summary: 'Research shows Python dataframe libraries cluster into 2 syntactic families:

    Pandas-like (Pandas, Modin, cuDF, Vaex, Dask) and Expression-based (Polars,

    PySpark, DataFusion). This enables 72% code reduction vs per-platform approach.

    '
- name: Design Philosophy
  summary: 'Each query is implemented once per family (not once per platform). Families

    share 95%+ of query code, with platform differences isolated to thin adapters

    handling I/O and type conversions.

    '
impact: 'CRITICAL - Foundation for entire DataFrame support. Enables 8 platforms with

  only 2 family implementations. 72% code reduction vs per-platform approach.

  Estimated 9-11 weeks total timeline vs 13+ weeks for per-platform.

  '
research_value: 'Validates family-based architecture pattern. Demonstrates that syntactic

  clustering enables massive code reuse while maintaining platform-specific

  optimizations.

  '
implementation_summary: 'Implemented complete DataFrame abstractions in benchbox/core/dataframe/:

  - DataFrameQuery dataclass with query_id, name, description, categories

  - Dual implementation support: expression_impl and pandas_impl

  - DataFrameContext protocol for table access and expression helpers

  - DataFrameContextImpl concrete implementation

  - Expression helpers: col(), lit(), date_add(), date_sub(), cast_date()

  - QueryRegistry for TPC-H query management


  Also implemented platform adapters in benchbox/platforms/dataframe/:

  - ExpressionFamilyAdapter base class for Polars-like libraries

  - PandasFamilyAdapter base class for Pandas-like libraries

  - PolarsDataFrameAdapter concrete implementation

  - PandasDataFrameAdapter concrete implementation

  - Platform availability detection and requirements

  '
