technical_requirements:
- category: Data Models
  items:
  - Fully typed with Python 3.10+ type hints
  - Immutable dataclasses (frozen=True where appropriate)
  - Recursive tree structure support
- category: Serialization
  items:
  - JSON-serializable output (no binary formats)
  - Human-readable JSON structure
  - Backward compatible with existing results schema
- category: Performance
  items:
  - Fingerprint computation <10ms for typical plans (<100 operators)
  - Serialization <50ms for typical plans
  - Memory overhead <1MB per plan for typical queries
