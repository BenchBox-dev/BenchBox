title: Query Plan Core Infrastructure (Models & Storage)
worktree: query-plan-core
category: Core Functionality
priority: Critical
status: Completed
completed_date: "2025-11-23"
description: 'Implement foundational data models for query plan representation including

  two-tier DAG structure (logical + physical operators), storage schema

  extensions, and JSON serialization. This is the foundation that all other

  workstreams depend on.


  **Key Design Decisions**:

  - Structured DAG representation only (no raw text storage)

  - Two-tier: LogicalOperator (cross-platform) + PhysicalOperator (platform-specific)

  - Opt-in capture via --capture-plans flag

  - Plan fingerprinting for fast equality checks

  '
context_sections:
- name: Architecture
  summary: "QueryPlanDAG contains logical operator tree with links to physical operators.\nLogical layer uses normalized vocabulary\
    \ (Scan, Filter, Join, Aggregate, Sort, \nLimit, Project). Physical layer preserves platform-specific details (HashJoin,\n\
    IndexScan, etc.) with cost estimates and metadata.\n"
- name: Storage Integration
  summary: 'Extends QueryExecution dataclass with optional query_plan field. Plans stored

    in JSON alongside existing result data. Adds plan_fingerprint for fast comparison

    without full tree traversal.

    '
impact: 'CRITICAL - Foundation for entire feature. Blocks all other workstreams until complete.

  Enables structured query plan storage, comparison, and analysis across all platforms.

  '
research_value: 'Establishes patterns for harmonizing disparate EXPLAIN formats into unified representation.

  Demonstrates feasibility of cross-platform query optimization analysis.

  '
tasks:
- phase: 'Phase 1.1: Core Data Models'
  description: Define QueryPlanDAG, LogicalOperator, PhysicalOperator dataclasses
  items:
  - summary: Create benchbox/core/results/query_plan_models.py
    done: false
  - summary: Implement PhysicalOperator dataclass
    done: false
    details: "@dataclass\nclass PhysicalOperator:\n    operator_type: str  # \"HashAggregate\", \"SeqScan\", etc.\n    operator_id:\
      \ str\n    properties: dict[str, Any]  # cost, rows, memory\n    platform_metadata: dict[str, Any]  # platform-specific\n"
  - summary: Implement LogicalOperator dataclass with recursive structure
    done: false
    details: "@dataclass\nclass LogicalOperator:\n    operator_type: str  # Scan, Filter, Join, Aggregate, Sort, Limit, Project\n\
      \    operator_id: str\n    properties: dict[str, Any]\n    children: list[\"LogicalOperator\"]\n    physical_operator:\
      \ PhysicalOperator | None\n    # Operator-specific fields\n    table_name: str | None  # For Scan\n    join_type: str\
      \ | None   # For Join\n    filter_expressions: list[str] | None  # For Filter\n    aggregation_functions: list[str]\
      \ | None  # For Aggregate\n    sort_keys: list[dict] | None  # For Sort\n"
  - summary: Implement QueryPlanDAG container dataclass
    done: false
    details: "@dataclass\nclass QueryPlanDAG:\n    query_id: str\n    platform: str\n    logical_root: LogicalOperator\n \
      \   estimated_cost: float | None\n    estimated_rows: int | None\n    plan_fingerprint: str  # SHA256 hash of logical\
      \ structure\n    raw_explain_output: str | None  # Original for debugging\n"
  - summary: Add operator type enums (LogicalOperatorType, JoinType, AggFunction)
    done: false
- phase: 'Phase 1.2: Plan Fingerprinting'
  description: Implement deterministic hashing for fast plan comparison
  items:
  - summary: Implement compute_plan_fingerprint() function
    done: false
    details: "def compute_plan_fingerprint(logical_root: LogicalOperator) -> str:\n    \"\"\"Compute SHA256 hash of logical\
      \ operator tree structure.\n    \n    Only includes: operator_type, join_type, table_name\n    Excludes: costs, row\
      \ counts, operator_id (non-structural)\n    \"\"\"\n"
  - summary: Add fingerprint computation to QueryPlanDAG.__post_init__
    done: false
  - summary: Create tests for fingerprint determinism
    done: false
    details: Verify same logical plan → same fingerprint, different properties → same fingerprint
- phase: 'Phase 1.3: Serialization & Deserialization'
