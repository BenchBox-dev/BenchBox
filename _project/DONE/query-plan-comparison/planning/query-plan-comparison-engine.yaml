id: query-plan-comparison-engine
title: Query Plan Comparison Engine
worktree: query-plan-comparison
category: Core Functionality
priority: High
status: Completed
completed_date: '2025-11-23'
completion_notes: 'Core comparison engine fully implemented and tested. Includes:

  - PlanComparison, SimilarityScore, OperatorDiff dataclasses

  - QueryPlanComparator with BFS-based tree comparison

  - Multi-dimensional similarity scoring (structural, operator, property)

  - Property comparison for all operator types

  - 14 comprehensive tests (all passing)

  - Cross-platform comparison support


  Advanced features (batch operations, Zhang-Shasha tree edit distance,

  cross-run regression detection) deferred for future implementation.

  Current implementation provides solid foundation for basic comparison needs.

  '
description: 'Implement algorithms for comparing query plans across platforms, runs, and

  queries. Includes logical plan comparison (tree diff), physical plan comparison,

  and similarity scoring (tree edit distance). Supports three comparison scenarios:

  cross-platform, cross-run, and cross-query.


  **Comparison Scenarios**:

  1. Cross-platform: Compare DuckDB vs DataFusion for same query

  2. Cross-run: Detect plan regressions between benchmark runs

  3. Cross-query: Find structurally similar queries

  '
context_sections:
- name: Algorithms
  summary: '- Tree Diff: Recursive tree traversal with operator matching (O(n×m))

    - Similarity Score: Zhang-Shasha tree edit distance (O(n²×m²), pruned)

    - Physical Comparison: Property-based diff (O(n))

    '
- name: Comparison Metrics
  summary: '- Structural similarity (0.0-1.0): % of matching operators

    - Logical differences: Missing/added/changed operators

    - Physical differences: Cost estimate changes, operator type changes

    - Plan fingerprint equality: Fast exact match check

    '
impact: 'HIGH - Core value proposition of the feature. Enables meaningful analysis of

  query plans across different contexts. Comparison engine is independent of

  capture mechanism.

  '
