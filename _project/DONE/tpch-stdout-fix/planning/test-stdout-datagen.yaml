title: "Add regression tests for TPC-H stdout data generation"
worktree: "tpch-stdout-fix"
priority: "High"
status: "Completed"
category: "Testing and Quality Assurance"
description: |
  Create comprehensive regression tests for TPC-H stdout data generation
  to ensure the -z flag works correctly and produces identical output
  to file-based generation.

  Test coverage includes:
  - All 8 TPC-H tables
  - Output equivalence verification
  - Backward compatibility for file-mode generation
  - Money format bug fix verification

context_sections:
  "Technical Context": |
    Key test scenarios implemented:

    1. Output Equivalence Tests:
       - dbgen -z -s 0.01 -T c > stdout.tbl
       - dbgen -s 0.01 -T c (creates customer.tbl)
       - diff stdout.tbl customer.tbl (must be identical)

    2. All Tables Test:
       - Generate all 8 tables via stdout
       - Verify row counts match expected for scale factor
       - Verify data format (pipe-delimited, correct columns)

    3. Backward Compatibility:
       - File-mode generation still works without -z flag
       - Output format unchanged from previous behavior

    4. Bug Fix Verification:
       - Money formatting produces correct decimal values
       - No garbage values from wrong format specifier

