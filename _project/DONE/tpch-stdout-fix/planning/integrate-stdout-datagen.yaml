id: tpch-stdout-fix-integrate-stdout-datagen
title: "Integrate TPC-H stdout datagen with compression and format pipelines"
worktree: "tpch-stdout-fix"
priority: "High"
status: "Completed"
category: "Core Functionality"
description: |
  Update BenchBox TPC-H generator to use the new -z stdout flag for streaming
  data generation with inline compression, eliminating intermediate file I/O.

  This enables efficient data generation workflows:
  - Direct streaming to zstd/gzip compression
  - Parallel chunk generation with streaming output
  - Reduced disk I/O and faster generation

context_sections:
  "Background and Motivation": |
    Currently TPC-H generator uses file-based generation followed by
    compression. With the -z flag, we can stream directly from dbgen
    to compression, similar to how TPC-DS should work once patched.

    Benefits:
    - No intermediate .tbl files written to disk
    - Memory-efficient streaming pipeline
    - Faster overall generation (single pass)
    - Consistent approach with TPC-DS

  "Technical Context": |
    Key files to modify:
    - benchbox/core/tpch/generator.py - Main generator implementation

    Integration pattern:
    ```python
    # Stream dbgen output directly to compressed file
    cmd = [dbgen_exe, "-z", "-s", str(scale), "-T", table_code]
    with subprocess.Popen(cmd, stdout=subprocess.PIPE) as proc:
        with open_compressed(output_path, 'wb') as f:
            for chunk in iter(lambda: proc.stdout.read(8192), b''):
                f.write(chunk)
    ```

    Considerations:
    - -z flag incompatible with -C (chunks) - handle separately
    - Parallel generation: multiple dbgen processes, each streaming
    - Error handling for broken pipes
    - Progress tracking without intermediate files

    Fallback Strategy:
    - If -z flag not available (old binary), fall back to file-then-compress
    - Detect capability at runtime by checking dbgen -help output
    - Log warning when using fallback mode
    - Ensure identical output regardless of generation method

