id: patch-tpch-source-stdout
title: "Patch TPC-H source to fix stdout data generation"
worktree: "tpch-stdout-fix"
priority: "High"
status: "Completed"
category: "Core Functionality"
description: |
  Apply patches to TPC-H dbgen source code to enable reliable stdout data generation
  using the -z flag, matching the tpch-kit reference implementation.

  The BenchBox TPC-H source (June 2021) lacks stdout output capability that was added
  to tpch-kit (March 2025). This prevents streaming data generation workflows that
  are critical for compression pipelines and efficient data loading.

  Key differences identified between BenchBox and tpch-kit:
  - Missing `zstdout` global variable declaration in dss.h
  - Missing stdout conditional in print_prep() function in print.c
  - Missing -z command-line flag handling in driver.c
  - Money formatting bug in print.c (int vs long format specifier)

context_sections:
  "Background and Motivation": |
    The TPC-DS source has the same stdout generation issue, confirmed broken
    in upstream since at least 2016 (GitHub Issue #25 - gregrahn/tpcds-kit).

    For TPC-H, the tpch-kit repository has patches that enable stdout output
    via the -z flag. BenchBox should incorporate these patches to enable:
    - Streaming data generation with inline compression
    - Direct piping to gzip/zstd for efficient storage
    - No intermediate file I/O overhead

  "Technical Context": |
    Four files need patching with ~30 lines of code total:

    1. dss.h (Line 282) - Add variable declaration:
       EXTERN int zstdout;

    2. print.c (Lines 97-107) - Add stdout conditional in print_prep():
       if (zstdout) { return(stdout); } else { res = tbl_open(...); }

    3. print.c (Line 138) - Fix money format bug:
       Change: fprintf(target, "%ld.%02ld", dollars, cents);
       To: fprintf(target, "%d.%02d", dollars, cents);

    4. driver.c (3 locations):
       - Add 'z' to getopt string (line 454)
       - Add help text for -z flag (line 395)
       - Add case 'z': zstdout = 1; break; (lines 525-527)

