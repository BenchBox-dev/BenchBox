title: "Rebuild TPC-H binaries with stdout fix for all platforms"
worktree: "tpch-stdout-fix"
priority: "High"
status: "Completed"
category: "Core Functionality"
description: |
  After applying stdout patches to TPC-H source, rebuild dbgen binaries
  for all supported platforms to enable streaming data generation.

  Target platforms (6 total):
  - darwin-arm64 (macOS Apple Silicon)
  - darwin-x86_64 (macOS Intel)
  - linux-arm64 (Linux ARM64)
  - linux-x86_64 (Linux x86_64)
  - windows-arm64 (Windows ARM64)
  - windows-x86_64 (Windows x86_64)

context_sections:
  "Technical Context": |
    Binary locations: _binaries/tpc-h/{platform}/dbgen

    Build requirements:
    - Native compilation for macOS platforms
    - Docker containers for Linux builds (existing infrastructure)
    - MinGW cross-compilation for Windows builds (via Docker)

    Infrastructure used:
    - _sources/compilation/scripts/compile-all-platforms.sh
    - _sources/compilation/docker/Dockerfile.linux-{x86_64,arm64}
    - _sources/compilation/docker/Dockerfile.windows-{x86_64,arm64}

