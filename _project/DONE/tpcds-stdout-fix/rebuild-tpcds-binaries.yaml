priority: High
status: Completed
completed_date: '2026-01-15'
category: Core Functionality
description: 'After patching the TPC-DS source files to fix stdout data generation,

  rebuild all platform binaries in _binaries/tpc-ds/.


  Completed platforms:

  - darwin-arm64 (macOS Apple Silicon) - DONE

  - darwin-x86_64 (macOS Intel) - DONE

  - linux-arm64 (Linux ARM) - DONE

  - linux-x86_64 (Linux x86) - DONE

  - windows-arm64 (Windows ARM) - Skipped (no binaries existed, needs native CI)

  - windows-x86_64 (Windows x86) - Skipped (no binaries existed, needs native CI)


  Additional fixes made during build:

  - Added MAXINT definition for LINUX in porting.h

  - Added -fcommon flag to LINUX_CFLAGS in makefile (GCC 10+ compatibility)

  '
context_sections:
  Build Environment Requirements: '- macOS: Xcode command line tools, make

    - Linux: gcc, make (via Docker or native)

    - Windows: MinGW or cross-compilation


    Consider using Docker for cross-platform builds to ensure reproducibility.

    '
  Binary Verification: 'Each binary must be tested with:

    1. dsdgen -help | grep "FILTER" (should show FILTER not _FILTER)

    2. dsdgen -TABLE date_dim -SCALE 1 -FILTER Y (should output to stdout)

    3. dsdgen -TABLE date_dim -SCALE 1 (should create file, backward compat)

    '
