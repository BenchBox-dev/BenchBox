open_questions:
- Should we support returns tables via separate dsdgen calls for sales/returns pairs?
- What's the minimum row batch size for efficient Parquet writes (1K, 10K, 100K)?
- Should streaming be opt-in (--datagen-stream) or default for large scale factors?
- How should we handle streaming failures mid-generation (retry vs fallback to file)?
success_metrics:
- dsdgen stdout output can be piped directly to zstd compression
- dsdgen stdout output can be written directly to Parquet format
- Large scale factors (SF10+) work without intermediate .dat files
- Existing file-based workflow continues to work as fallback
- 10-30% reduction in total data generation time for large SFs
sections:
  Implementation Summary: 'The streaming functionality already existed in benchbox/core/tpcds/generator/streaming.py

    with sophisticated handling of:

    - Single table streaming with direct compression

    - Parent/child table pairs (sales/returns)

    - Parallel chunk generation

    - Manifest tracking with row counts


    The only change needed was updating the flag from "-_filter y" (broken) to "-FILTER Y"

    (works with patched binaries). Also updated checksums.md5 for all rebuilt binaries.'
