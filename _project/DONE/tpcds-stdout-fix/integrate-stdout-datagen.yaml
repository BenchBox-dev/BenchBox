id: tpcds-stdout-fix-integrate-stdout-datagen
title: Integrate stdout datagen with compression and format pipelines
worktree: tpcds-stdout-fix
priority: High
status: Completed
completed_date: '2026-01-15'
category: Core Functionality
description: 'With the fixed TPC-DS binaries supporting stdout output via -FILTER Y,

  update BenchBox data generation modules to leverage streaming output

  for direct compression and open table format writing.


  NOTE: The streaming infrastructure already existed in benchbox/core/tpcds/generator/streaming.py

  but was broken because it used the old "-_filter y" flag which didn''t work with unfixed dsdgen.

  This TODO was reduced to updating the flag to use "-FILTER Y" (the fixed version).

  '
context_sections:
  Current Data Generation Flow: '1. dsdgen writes .dat files to disk

    2. BenchBox reads .dat files

    3. Converts/loads to target platform

    4. Cleanup .dat files

    '
  New Streaming Flow: "1. dsdgen -FILTER Y streams to stdout\n2. BenchBox pipes directly to:\n   a) Compression (zstd/gzip)\
    \ → file\n   b) Parquet writer → file or cloud storage\n   c) Platform loader (direct ingest)\n3. No intermediate files\
    \ needed\n"
  Implementation Considerations: '- Need to handle sales/returns table pairs (returns skipped in FILTER mode)

    - Consider adding returns support to dsdgen later

    - Parallel table generation possible since each table is independent

    - Must preserve existing file-based flow as fallback

    '
tasks:
  phases:
  - phase: 'Phase 1: Update binary wrapper module'
    done: true
    note: Streaming module already existed, just needed flag update
    items:
    - summary: Update -_filter y to -FILTER Y in streaming.py
      done: true
    - summary: Update checksums.md5 for all rebuilt binaries
      done: true
