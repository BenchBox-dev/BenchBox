completion_notes: |
  Created comprehensive regression test suite in tests/unit/core/tpcds/test_stdout_datagen.py
  with 8 tests across 3 test classes:

  TestDsdgenFilterFlag (4 tests):
  - test_filter_flag_shows_without_underscore - validates params.h patch
  - test_filter_flag_accepted - validates flag recognition
  - test_filter_outputs_to_stdout - validates print.c patch
  - test_filter_does_not_create_file - validates no file created with FILTER
  - test_without_filter_creates_file - backward compat test

  TestStdoutDataEquivalence (1 test):
  - test_stdout_matches_file_output - validates stdout data == file data

  TestStreamingCompression (2 tests):
  - test_stdout_pipes_to_gzip - validates streaming to gzip works
  - test_stdout_pipes_to_zstd - validates streaming to zstd works

  All 8 tests pass. Tests auto-skip on platforms where dsdgen is not available.
  Tests are marked with @pytest.mark.tpcds and @pytest.mark.unit for CI filtering.
