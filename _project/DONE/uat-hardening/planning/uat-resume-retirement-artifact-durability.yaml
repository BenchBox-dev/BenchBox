sections:
  "Implementation Summary": |
    Four commits, one per work unit, on fix/uat-resume-retirement:
    1. w1 -- deleted _write_resume_manifest, load_resume_attempts,
       build_resume_runner, RESUME_MANIFEST_VERSION from orchestrator.py; the
       --resume flags and handler branches from _cli.py; the resume-manifest
       tests from test_orchestrator.py (2 rewritten to keep covering
       abort-artifact emission without resume, 1 deleted outright); scrubbed
       resume-manifest prose from the spec, operator docs, and
       tests/uat/README.md.
    2. w2 -- added atomic_write_text() (temp sibling + fsync + os.replace) to
       phases/report.py and threaded it through all five durable-artifact
       write sites (cells.jsonl, its accounting sidecar,
       compatibility_pruned.jsonl, validator_rollup.tsv, matrix_summary TSV).
    3. w3 -- default logs_dir_template gained {time} (HHMMSS); default_log_dir
       expands it alongside {date}; explicit {date}-only templates in
       checked-in configs are unaffected (str.replace no-op).
    4. w4 -- cells.jsonl is now written before its accounting sidecar.
    Verification: both TODO-specified greps came back clean (only prose
    explaining the removal, plus the unrelated Makefile release-cut
    "resume" terminology, which was left untouched); `uv run -- python -m
    pytest tests/uat/ -m fast -q` -> 372 passed; `make lint` clean. `git diff
    --name-only` against develop confirmed every touched file is within
    scope_limit.only_modify.

