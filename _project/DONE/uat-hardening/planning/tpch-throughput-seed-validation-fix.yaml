approach: |
  Investigation-first TODO: w0/w1 are mandatory before any code. The
  scope_limit below is deliberately broad for the INVESTIGATION only; w1
  must pin the actual seam (expected: the validation module producing
  summary.validation, possibly tpch/throughput_test.py where seed
  provenance is known) and w2+ must stay within the pinned files. Keep the
  change scoped to validation policy; do not touch execution. This is
  comparator/validation-adjacent code -- check .github/CODEOWNERS: if the
  touched paths are soundness-critical, the PR waits for Code Owner review
  instead of auto-merge (call it out in the PR body).

anti_patterns:
  - "DO NOT widen the loose tolerance band to make the queries pass -- that weakens validation for every query."
  - "DO NOT exclude the 4 queries unconditionally -- reference-seed runs must keep validating them."
  - "DO NOT special-case inside tests/uat -- the fix belongs in benchbox core so every consumer (CLI runs, UAT, nightly) benefits."

