          base_seed=42 and for any seed at a non-SF=1.0 scale factor (no
          pinned reference exists below SF=1.0), context cleared every
          query, and a REAL-stack end-to-end case across TWO streams (0 and
          1) confirming Q11/16/18/20 are absent from BOTH streams' failed-
          query sets with the default base_seed -- this is the literal w0
          throughput repro (8 failures = {11,16,18,20} x 2 streams), now 0
          boundary-query failures on either stream. (The other 18
          non-boundary queries are expected to fail in this specific test
          because the mock forces every query's row count to 999 regardless
          of query id -- that is correct EXACT-mode behavior and is not
          this test's concern; it only asserts on the boundary set.)
      All new + pre-existing tests pass:
        - tests/unit/core/ (9993 passed, 12 skipped, 0 failed)
        - tests/integration/test_tpch_power_test.py -m "integration and slow" (12 passed)
        - tests/integration/test_tpch_throughput_test.py -m "integration and slow" (16 passed)
        - tests/integration/test_throughput_corrections.py (included in the
          tests/unit/core/ run above via the combined verification command;
          separately reconfirmed, all passing)
      One incidental finding during verification: a pre-existing local-only
