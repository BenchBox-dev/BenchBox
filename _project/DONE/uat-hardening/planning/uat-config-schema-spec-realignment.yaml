id: uat-config-schema-spec-realignment
title: "Enforce the schema rules the spec claims; validate platform includes and frozen shards; realign the UAT charter spec with reality"
worktree: uat-hardening
priority: Medium
status: Completed
completed_date: "2026-07-19"
category: "Code Quality and Technical Debt"

description: |
  The charter spec's schema-enforcement table (Section 3,
  _project/specs/uat-framework.md:355-368) claims at least 7 load-time
  validations that do not exist -- two verified empirically on develop @
  fc31f3604 by loading configs through validate_config:
  `scales: {rungs: [0.01, 0.1], override: 1.0}` is ACCEPTED (spec says
  error) and `validator_clean_rate_floor: 1.5` is ACCEPTED (spec says
  error). Also runtime-only: package.submit_terminal_state vocabulary +
  service-required checks live in package.py:56-68 not config.py; not
  enforced anywhere: cross_scale_coverage_min_pairs-without-report,
  preflight-fields-without-preflight warning. Silent coercions:
  phases_arg: [load] str()-coerces to "['load']" (config.py:311);
  rungs: [true] passes as 1.0; output.* templates str()-coerce mappings.
  phases: order and duplicates are unvalidated (config.py:175-185) --
  `phases: [report, execute]` produced an empty report pre-
  uat-fail-advance-consistency; duplicates run a phase twice.

  Enumeration gap: resolve_platforms appends `include` entries WITHOUT
  registry validation (matrix.py:153-156) -- a retired platform in a
  frozen shard surfaces only at execute time (benchmark includes get
  visible pruned-accounting rows, enumerate.py:106-117; platforms should
  match). All 32 configs currently load and enumerate non-empty (verified
  by running the loader 2026-07-10), but nothing guards this: zero tests
  reference the 18 generated shards. The frozen-config-replay blind spot's
  suggested guard was never added.

  Lifecycle-policy drift: 9 of 15 top-level configs carry neither
  # TEMPLATE nor # HISTORICAL headers despite the Section 9 policy;
  docs/operations/uat-framework.md:21 tells operators to run the
  HISTORICAL config that :310-313 forbids re-running.

  SPEC REALIGNMENT (after the code changes above land, rewrite the stale
  sections in one pass): Section 1.4 still declares throughput out of
  scope (tests/uat/throughput.py shipped 2026-07-10); Section 2 module
  table omits artifact_hygiene/container_cleanup/throughput and carries a
  stale ~6,500 LOC budget (actual ~7,957 pre-batch -- re-measure at
  realignment time); Section 3 schema table must match the NOW-implemented
  validations and document fields code enforces but the spec omits
  (local_platforms_check, benchmark_runs_dir_template, extra_args,
  official/streams/seed, release_gate_runtime_envelopes); Section 4 make-
  target args are stale for uat-validate/report/explorer-smoke/package and
  omit uat-artifact-hygiene/bring-up/docker-cleanup (+ gate-check once
  landed); Section 4's description of test_no_cli_surface_drift.py claims
  it "fails on submit signature drift" while the guard now allowlists ~28
  CLI files and SKIPS submit.py/run.py signature checks
  (test_no_cli_surface_drift.py:50-66) -- describe the real guarantee;
  Section 6 documents a 9-column TSV (actual: 12+, REPORT_HEADER
  report.py:53-58) and a parity test that "matches row count" (actual:
  header-only, test_replay_2026_05_02.py:25); Section 2:133/3:313 claim
  draft-pr/merged-to-published-results open PRs (stubs, package.py:34,
  :126-132 -- either document as unimplemented or remove from the vocab);
  resume sections already scrubbed by uat-resume-retirement.

prior_art:
  - "tests/uat/config.py:_reject_unknown_fields + per-section validators -- the enforcement machinery; new rules are additional checks inside existing section validators, not a new validation layer. Extend."
  - "tests/uat/phases/enumerate.py:106-117 -- benchmark-include pruned-accounting rows; mirror for platform includes. Reuse pattern."
  - "tests/uat/test_config.py:237-275 reader-evidence test -- extend coverage beyond stress-default.yaml fields."

work:
  - id: w1
    summary: "Load-time enforcement: rungs/override exclusion, floor in [0,1], terminal-state vocab + service, phases order/duplicate rejection, bool rejection for rungs, phases_arg/output type checks"
    status: done
    needs: []
    notes: >
      config.py: all new rejections added inside the existing per-section
      validators (no new validation layer). scales.rungs+override
      coexistence rejected when both explicitly set; validator_clean_rate_floor
      > 1.0 rejected (was only >= 0 before); bool rung/override values
      rejected (bool is an int subclass, float(True)==1.0 previously
      coerced silently); phases duplicate + out-of-canonical-order entries
      rejected (an out-of-order list e.g. [report, execute] silently
      produced an empty report); execute.phases_arg and output.*_template
      non-string values rejected instead of str()-coerced. package
      submit_terminal_state vocab + service-required checks moved from
      package.py's runtime guard to load time, GATED on `"package" in
      phases` so a stale package: block on a config that never runs the
      phase stays inert (mirrors the existing preflight inertness
      carve-out, and keeps package.py's own runtime guard independently
      testable via test_package.py which is out of scope_limit). 16 new
      test_config.py tests.
  - id: w2
    summary: "Registry-validate platforms.include at enumerate with pruned-accounting rows (mirroring benchmark includes); unknown platform in include becomes a visible pruned row, not an execute-time surprise"
    status: done
    needs: []
    notes: >
      matrix.py: known_platform_ids() (SQL ∪ dataframe registry platforms
      + the `-df` CLI alias suffix, guarded against double-suffixing ids
      already ending in -df) and missing_platforms_from_include(),
      mirroring missing_benchmarks_from_include. resolve_platforms now
      drops include entries absent from the registry. enumerate.py grew a
      loop mirroring the benchmark-missing accounting (was enumerate.py:106-117)
      emitting platform-not-in-registry / pruned-registry rows, one per
      (missing platform x resolved benchmark x scale). test_matrix.py:
      6 new tests (known_platform_ids coverage, missing_platforms_from_include
      flag/dedupe/empty/resolve-parity, enumerate registry-missing-platform
      accounting).
  - id: w3
    summary: "Shard/config runnability guard: fast test that loads + enumerates every YAML under tests/uat/configs/ (including generated-rerun-shards/) asserting non-empty cells and zero unknown includes"
    status: done
    needs: [w1, w2]
    notes: >
      test_config.py: test_every_corpus_config_loads_and_enumerates_nonempty
      parametrized over all 32 configs under tests/uat/configs/ (15
      top-level + 17 generated-rerun-shards/, none previously referenced
      by any test) -- loads, checks zero unknown platform/benchmark
      includes, asserts non-empty enumeration; each failure names the
      config + field. Companion test_corpus_config_paths_cover_generated_rerun_shards
      guards the discovery glob. Review nit applied: discovery globs both
      *.yaml and *.yml (shared _glob_configs helper) so a future .yml
      config cannot silently escape.
  - id: w4
    summary: "Lifecycle headers: add class headers to the 9 unlabeled configs; fast test asserting every top-level config carries a recognized header"
    status: done
    needs: []
    notes: >
      Empirically 10 (not 9) top-level configs lacked a header. All
      classified # TEMPLATE (none met the immutable-one-shot bar
      # HISTORICAL requires): the 3 release-gate-0N, uat-enabled-platforms-
      {enumeration,full}, uat-explorer-external-corpus-smoke,
      uat-lakesail-failing-benchmarks, uat-pg-extension-auth-smoke,
      uat-synthetic-timeout-smoke, uat-throughput-duckdb-nightly. Fixing
      the corpus to satisfy w1 surfaced a REAL defect: all three
      release-gate-0N configs declared `package` in phases: with no
      package: section, so every release-gate sweep silently aborted at
      the package phase (validated by review: explorer_smoke consumes
      package's submissions_dir; local-stage is valid vocab and does not
      change gate semantics). Fixed by adding
      `package: {submit_terminal_state: local-stage}` to each -- did NOT
      weaken the rule. test_config.py:
      test_top_level_config_carries_recognized_lifecycle_header
      (parametrized over 15) + a discovery-exclusion guard.
  - id: w5
    summary: "Fix the operator-doc contradiction (quick-ref pointing at the HISTORICAL config) and spec Section 9 to match the enforced header policy"
    status: done
    needs: [w4]
    notes: >
      docs/operations/uat-framework.md: quick-ref "Full sweep" example and
      the "clone a template" cp example now point at runnable TEMPLATE
      configs (uat-tuned-followup-20260505.yaml / stress-default.yaml)
      instead of the HISTORICAL uat-2026-05-02.yaml. Spec Section 9.1
      widened to note # TEMPLATE also covers canonical repeatedly-run
      operational configs (edited in place, not cloned per sweep), with an
      "Enforcement" note pointing at the w3/w4 guards -- the policy is no
      longer convention-only.
  - id: w6
    summary: "Spec realignment pass over uat-framework.md per the description list (scope, module/LOC table, schema table, make targets, CLI-guard description, TSV shape, package stubs)"
    status: done
    needs: [w1, w3, w4]
    notes: >
      _project/specs/uat-framework.md, enumerated stale claims only:
      Section 1.4 throughput marked shipped (throughput.py + execute.
      official/streams/seed + run-official routing); Section 2 module
      table + tree re-measured TODAY at ~9,774 production LOC across 26
      modules (added artifact_hygiene/cells_io/container_cleanup/
      gate_summary/throughput; per-bucket reconciliation refreshed);
      Section 3 schema table now matches the w1 validations and documents
      the previously-omitted enforced fields (local_platforms_check,
      benchmark_runs_dir_template, extra_args, official/streams/seed,
      release_gate_runtime_envelopes) + a row noting include-registry
      drops are accounting rows not ConfigErrors; Section 4 make-target
      table corrected to real Makefile signatures + added uat-artifact-
      hygiene/bring-up/prepull/docker-cleanup/gate-check; the
      test_no_cli_surface_drift.py description rewritten to the real
      loosened guarantee (29-file allowlist, submit/run signature-diff
      skipped); Section 6 corrected to the real 13-column REPORT_HEADER
      and the header-only (not row-count) parity assertion; draft-pr/
      merged-to-published-results documented as stubs everywhere claimed
      implemented. No spec section rewritten beyond the enumerated claims.

deferred:
  - summary: "Auto-generating the spec's module/LOC table from the tree"
    reason: "Tooling nicety; a dated manual re-measure with the realignment is sufficient and the table drifts slowly. Promoted to [[uat-spec-module-loc-table-autogen]] (2026-07-16), which needs this item."

deps:
  needs: [uat-release-gate-enforcement, uat-operator-provisioning, nightly-throughput-gate-restoration]

must_preserve:
  - "All 32 existing configs (including every generated shard) still load and enumerate after the new validations -- if any legitimately violates a new rule, fix the CONFIG in the same PR and note it; do not weaken the rule."
  - "Unknown-field rejection everywhere (config.py:169-172 pattern) stays."
  - "HISTORICAL config contents remain unedited except the header-comment line if missing."

approach: |
  Code first (w1-w4), spec last (w6) so the spec describes shipped
  reality exactly once. The w3 guard is the regression net for the whole
  config corpus -- write it to emit WHICH config and field failed. This
  TODO deliberately lands last in the batch: every earlier TODO changes
  surfaces the spec must describe.

anti_patterns:
  - "DO NOT make new validations warn-only to avoid fixing violating configs -- fix the configs."
  - "DO NOT rewrite spec sections beyond the enumerated stale claims; the charter's decisions (Path A vocabulary, Section 8 adversarial framing, Section 10 non-assertions) stand."

verification:
  - description: "Schema enforcement + corpus guard"
    command: "uv run -- python -m pytest tests/uat/test_config.py tests/uat/test_matrix.py tests/uat/test_replay_2026_05_02.py -q"
    expected_output: "pass; new rules verified; all 32+ configs load and enumerate"
  - description: "Spec claims spot-check: the two empirically-false rows now enforce"
    command: "uv run -- python -c \"from tests.uat.config import validate_config; import sys;\nfor payload in ({'name':'x','phases':['execute'],'scales':{'rungs':[0.1],'override':1.0}}, {'name':'x','phases':['execute','validate'],'validate':{'validator_clean_rate_floor':1.5}}):\n    try: validate_config(payload); sys.exit('ACCEPTED: '+str(payload))\n    except Exception: pass\nprint('both rejected')\""
    expected_output: "both rejected"

