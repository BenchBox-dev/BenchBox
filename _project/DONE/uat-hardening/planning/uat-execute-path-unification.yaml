id: uat-execute-path-unification
title: "Unify make uat-execute with the orchestrator path; single cells.jsonl codec; de-duplicate phase logic in _cli/execute"
worktree: uat-hardening
priority: Medium-High
status: Completed
completed_date: "2026-07-11"
category: "Architecture"

description: |
  `make uat-execute` is a weaker, artifact-less re-implementation of the
  sweep's execute leg. Verified on develop @ fc31f3604:

  1. _handle_execute (tests/uat/_cli.py:386-441) duplicates the
     orchestrator's preflight->execute sequence but does NOT install the
     per-cell disk-floor watch (orchestrator.py:141-162), does NOT write
     cells.jsonl or the accounting sidecar, so it has weaker mid-sweep disk
     protection (partially addressed by uat-disk-gate-always-on) and
     produces no durable artifacts for `make uat-report`. Same config,
     silently different behavior from `make uat-sweep`.

  2. Duplicated contracts: the cells.jsonl schema lives in two files with
     no shared codec (writer orchestrator.py:563-604, reader
     _cli.py:184-201); the sidecar filename convention is built by hand in
     both (_cli.py:166 vs orchestrator.py:558-560); _handle_stress
     (_cli.py:96-113) duplicates run_sweep_from_path's stress_overrides
     logic (orchestrator.py:683-692) which currently has zero production
     callers.

  3. execute.py god-phase cleanups that fall out of unification:
     - _apply_submit_classification (execute.py:544-556) re-reads and
       re-classifies the same result JSON run_cell already classified
       (runner.py:256-260) -- duplicate policy application, second file
       read per cell;
     - _compatibility_pruned_for_config re-runs enumeration during
       abort-artifact emission (orchestrator.py:554-555) -- a second
       independent enumeration that can diverge from the one execute used;
       thread the actual enumeration through instead;
     - free-space checking exists in three variants (preflight gate,
       execute platform-boundary at execute.py:680-706, orchestrator
       per-cell wrapper) -- consolidate the measurement into one shared
       helper (the policy sites stay distinct);
     - dead code: matrix.py:84-86 placeholder tuple assignments,
       timeouts.py:114-131 env_without_pythonpath / iter_argv_for_log
       (zero callers, docstring claims a consumer that does not exist).

  4. Prose-string abort contract: the orchestrator decides to emit abort
     artifacts via `"free space" in (result.abort_reason or "")`
     (orchestrator.py:263, :346). Replace with a typed abort-kind enum
     field on PhaseResult/ExecuteOutcome so rewording a message cannot
     change control flow. (Resume-manifest emission at those sites is gone
     after uat-resume-retirement-artifact-durability.)

prior_art:
  - "tests/uat/orchestrator.py:run_sweep -- the canonical phase loop; _handle_execute becomes a thin call into a single-phase entry (e.g. run_sweep with an execute-only phases override), not a third path. Reuse."
  - "tests/uat/orchestrator.py:563-604 + _cli.py:184-201 -- the two cells.jsonl codecs to merge; the merged codec is a new small module tests/uat/cells_io.py (genuinely new file, single owner for the JSONL + sidecar schema). Supersede both inline copies."
  - "tests/uat/phases/preflight.py:free_space_gib + execute.py:_free_space_abort_reason + orchestrator.py:_build_disk_floor_runner -- three free-space variants; measurement consolidates into preflight_budget.py (existing module). Extend."

work:
  - id: w1
    summary: "Extract cells_io.py owning cells.jsonl + accounting-sidecar read/write (single schema definition); orchestrator and _cli consume it; sidecar path helper unified"
    status: done
    needs: []
    notes: >
      New tests/uat/cells_io.py owns write_cells_jsonl (moved from
      orchestrator._write_cells_jsonl, including _persist_cell_failure_context
      /_cell_log_tail/_cell_log_has_marker/FAILURE_TAIL_* constants),
      read_cells_jsonl (moved from _cli._handle_report's inline JSONL
      parsing), read_skipped_unreachable_sidecar (moved from
      _cli._read_skipped_unreachable_sidecar), and cells_accounting_path
      (the unified sidecar-filename convention). orchestrator.py and
      _cli.py now call into cells_io; on-disk content is byte-identical
      (verified via the existing write/read round-trip tests, updated to
      call cells_io directly). Deviation from the implementation note:
      atomic_write_text was NOT moved into cells_io.py -- report.py and
      validate.py are both outside this TODO's scope_limit.only_modify,
      and atomic_write_text is a generic primitive shared by five artifact
      types, not cells.jsonl-specific. cells_io.py imports it from
      report.py instead (`from tests.uat.phases.report import
      atomic_write_text`), which satisfies "cells_io owns the schema" and
      "orchestrator/_cli consume one codec" without an out-of-scope edit.
  - id: w2
    summary: "Route _handle_execute through the orchestrator single-phase path so uat-execute gets the disk watch and writes cells.jsonl + sidecar like a sweep; keep --databases-root/--no-cleanup semantics"
    status: done
    needs: [w1]
    notes: >
      _handle_execute now scopes config.phases to [preflight?, execute]
      (preflight included only when the loaded config's own phases: list
      requests it, matching the prior gating) and calls
      orchestrator.run_sweep directly instead of hand-rolling
      preflight+execute. SweepResult gained two additive fields
      (`preflight`, `execute_outcome`) so _handle_execute can rebuild its
      stdout JSON summary from the phase loop's own result. Behavior
      improvement (per approach): uat-execute now gets the per-cell
      disk-floor watch and writes cells.jsonl + accounting sidecar,
      including abort-safe partial artifacts on a mid-execute disk-floor
      trip (a scenario the old standalone path never covered). Added the
      required parity test
      (test_uat_execute_and_execute_only_sweep_produce_identical_cells_jsonl
      in test_cli_dispatch.py): uat-execute and an execute-only sweep
      produce byte-identical cells.jsonl + sidecar for the same mocked
      run_cell.
  - id: w3
    summary: "Delete _handle_stress duplication: route through run_sweep_from_path(stress_overrides=...); keep CLI flags and behavior identical"
    status: done
    needs: [w2]
    notes: >
      _handle_stress no longer hand-applies the platform/benchmark/scale
      replace() overrides; it builds a stress_overrides dict and calls
      run_sweep_from_path(config_path, stress_overrides=...), which already
      implemented the identical closed override set (previously zero
      production callers). Printed JSON shape unchanged (still omits
      abort_reason, unlike _handle_sweep's summary). Added
      test_stress_main_forwards_platform_benchmark_scale_as_stress_overrides
      since run_sweep_from_path's stress_overrides path had no direct test
      before this TODO made it load-bearing.
  - id: w4
    summary: "Remove _apply_submit_classification double-application from execute.py; delete dead code (matrix.py placeholders, timeouts env_without_pythonpath/iter_argv_for_log)"
    status: done
    needs: []
    notes: >
      run_cell (runner.py:256-260) already classifies for submit before
      returning; _apply_submit_classification's mirror in
      _run_platform_benchmark is idempotent on an already-classified
      CellResult, so it was pure waste (second file read) for the real
      runner. Rather than an identity check against `run_cell` (fragile
      under unittest.mock.Mock's attribute auto-vivification, which broke
      inspect.unwrap in a spike of this approach), gated the mirror behind
      an explicit `runner_needs_submit_classification: bool = False`
      parameter threaded through run_execute -> _run_or_skip_platform ->
      _run_platform_benchmark. The one test that genuinely needs the mirror
      (test_execute_downgrades_passed_cell_with_query_failure_result, whose
      fake_runner deliberately skips classification) now opts in
      explicitly; kept per the TODO's own guidance rather than deleted.
      Removed matrix.py's SQL_PLATFORMS/DOCKER_PLATFORMS/DATAFRAME_PLATFORMS
      placeholder tuples (immediately overwritten before any read) and
      timeouts.py's env_without_pythonpath/iter_argv_for_log plus their
      tests (verified zero callers repo-wide via grep).
  - id: w5
    summary: "Replace the 'free space' abort_reason substring checks with a typed abort_kind field; thread execute's actual enumeration into abort-artifact emission instead of re-enumerating"
    status: done
    needs: [w1]
    notes: >
      No live substring-driven control flow remained by the time this
      TODO started (the two `"free space" in abort_reason` matches left in
      the codebase are test assertions on message content, not branches --
      superseded by earlier uat-status-taxonomy-exit-code-fixes /
      uat-disk-gate-always-on work). Added the typed field anyway per the
      binding implementation note, as forward-looking hardening: abort_kind:
      str | None on ExecuteOutcome (execute.py) and PreflightResult
      (preflight.py), values "disk_floor" / "docker_startup" /
      "docker_teardown" / "docker_required" / "local_platform_unreachable".
      Deviation: added on the two concrete subclasses rather than the
      shared PhaseResult base -- phases/__init__.py is outside this TODO's
      scope_limit.only_modify. Not threaded into cells.jsonl (anti_pattern
      compliance). Threaded execute's real enumeration into the disk-floor
      abort path: run_execute now annotates a propagating DiskFloorAbort
      with its actual compatibility_pruned tuple (mirroring the existing
      skipped_unreachable_count annotation), and orchestrator.run_sweep
      synthesizes an ExecuteOutcome from it instead of passing
      execute_outcome=None, so _emit_abort_artifacts no longer falls back
      to _compatibility_pruned_for_config's second, possibly-diverging
      re-enumeration for this path (that fallback stays correct/necessary
      for a genuine preflight-phase abort, where execute never ran).
      Regression test added:
      test_disk_floor_abort_threads_real_compatibility_pruned_without_reenumerating.
  - id: w6
    summary: "Consolidate free-space measurement into one helper in preflight_budget.py consumed by all three policy sites"
    status: done
    needs: [w5]
    notes: >
      Moved free_space_gib from phases/preflight.py into preflight_budget.py
      (the module that already owns the paired disk-budget estimator).
      preflight.py re-exports it (`from tests.uat.preflight_budget import
      free_space_gib as free_space_gib`) so its own internal call sites and
      test_preflight.py's existing monkeypatches -- test_preflight.py is
      outside this TODO's scope_limit.only_modify -- keep working unchanged.
      execute.py's default_free_space_reader and orchestrator.py's
      _build_disk_floor_runner now import/call preflight_budget.free_space_gib
      directly; updated test_orchestrator.py's three patch targets from
      orchestrator.preflight_phase.free_space_gib to
      orchestrator.preflight_budget.free_space_gib accordingly. All three
      policy sites (preflight gate, execute platform-boundary check,
      orchestrator per-cell watch) keep distinct thresholds/behavior; only
      the measurement primitive is shared.

