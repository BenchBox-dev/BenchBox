id: uat-release-gate-enforcement
title: "Make UAT a real release gate: machine-readable gate summary, ancestry+freshness check in release readiness, tuned cross-scale floors"
worktree: uat-hardening
priority: Critical
status: Completed
completed_date: "2026-07-12"
category: "Release Tooling"

description: |
  DECISION (user, 2026-07-11): UAT becomes a REAL gate. Today it is
  advisory by documented design -- docs/operations/release-guide.md:71-73
  says "long-running UAT remain[s] advisory"; release-finalize gates on
  exactly RELEASE_REQUIRED_CONTEXTS := validate-base release-required-result
  (Makefile:1054) and scripts/release_readiness_check.py reads only
  release-canary evidence. No workflow, script, or target consumes any UAT
  artifact; the APPROVE/HOLD checklist (docs/operations/uat-framework.md
  :418-434) is manual and unreferenced from the release runbook. Verified
  on develop @ fc31f3604.

  MECHANISM (mirrors the proven release-canary pattern -- readiness check
  queries canary summary artifact, fails on missing/red/stale/non-ancestor,
  release-guide.md:47-57):

  1. GATE SUMMARY ARTIFACT: at sweep completion the orchestrator writes
     uat_gate_summary.json (versioned schema): config name,
     source_commit_sha + source_dirty (already computed for the TSV,
     report.py SourceInfo), container engine (from
     uat-container-engine-routing), completed_at, per-phase exit codes,
     accounting counts (attempted/passed/failed/timeout/unreachable/
     startup_failed/skipped incl. pruned split), validator clean rate vs
     floor, cross-scale pairs vs floor, explorer_smoke_status,
     unreachable_is_estimated, and a single derived verdict green|red.

  2. AGGREGATION + ORDERING: `make uat-gate-check` reads the three
     release-gate stage summaries, enforces the cross-stage Docker
     ordering invariant machine-readably (stage completed_at fields
     replace the manual copy-paste snippet at uat-framework.md:404-413 /
     report.py:release_gate_ordering_violations), enforces the
     mechanizable APPROVE checklist items (all stages green, sidecar not
     estimated, explorer smoke actually ran for stages that include it),
     and writes a combined release-evidence file to a TRACKED path
     (_project/release-evidence/uat-gate-summary.json) that the operator
     commits.

  3. RELEASE WIRING: extend scripts/release_readiness_check.py to require
     the combined summary: verdict green, source_dirty false,
     source_commit_sha an ancestor of the release PR head, age <= 21 days
     (judgement call: releases are cut every few weeks and a full 3-stage
     sweep costs an operator-day; the canary's 48h window would force
     redundant sweeps -- document the rationale). Missing/red/stale/
     non-ancestor fails validate-base on the release PR. Reuse the
     existing RELEASE_READINESS_OVERRIDE_SHA/_REASON admin escape hatch
     (release-guide.md:75-79) so incidents have the same documented
     override as the canary.

  4. TUNED FLOORS (user delegated the judgement): replace the placeholder
     cross_scale_coverage_min_pairs: 1 in all three release-gate configs
     (release-gate-01:60, -02:62, -03:53 -- "Tune to the approved pair
     count during bring-up" was never done). Derivation rule: at
     implementation time, compute eligible (platform, benchmark) pairs per
     stage via enumerate_cells_with_pruning (registry + compatibility
     truth), set floor = floor(0.8 * eligible_pairs) with absolute minimum
     8 / 4 / 2 for stages 1 / 2 / 3, and write the derivation (eligible
     count, formula, date) as a comment above the value in each config.
     0.8 absorbs legitimate environment variance (a down docker stack)
     while making mass-regression impossible to sign off.

  5. DOCS: release-guide.md drops the "advisory" language for UAT,
     documents the required evidence flow (sweep x3 -> uat-gate-check ->
     commit evidence -> open release PR), and the release runbook gains
     the checklist step that was always missing.

prior_art:
  - "scripts/release_readiness_check.py + .github/workflows/release-canary.yml -- the freshness+ancestry evidence pattern being mirrored; extend the script rather than adding a second checker. Extend."
  - "tests/uat/phases/report.py:SourceInfo (source_commit_sha/source_dirty TSV columns) -- provenance capture already exists; the summary reuses it. Reuse."
  - "tests/uat/phases/report.py:release_gate_ordering_violations -- existing ordering-check logic; uat-gate-check calls it with machine-derived timestamps instead of operator-derived ones. Reuse."
  - "tests/uat/gate_summary.py is a NEW module (the w1 dataclass + serializer); nearest neighbor is the cells_io.py codec pattern from uat-execute-path-unification. Genuinely new, single-purpose."
  - "_project/release-evidence/ is a NEW tracked directory (convention: committed release evidence, curated out of release branches like the rest of _project). No existing evidence-commit convention exists -- nearest neighbors are _project/verification-logs (ignored, wrong fit) and release-canary's workflow-artifact summary (wrong lifetime: 90-day artifact retention vs permanent evidence). Genuinely new, minimal (one JSON per release cycle)."

work:
  - id: w1
    summary: "Define uat_gate_summary.json schema (versioned dataclass, serialized beside cells.jsonl); written for every sweep INCLUDING dry-run (verdict marks dry_run); unit tests for green/red derivation"
    status: done
    needs: []
    notes: >
      New tests/uat/gate_summary.py: GateSummary (version: 1) +
      PhaseAccounting dataclasses, derive_verdict (green|red|dry_run --
      reduces to "any phase exit nonzero or aborted" since validate/report
      floors already fold into their own exit_code()), atomic write via
      report.atomic_write_text, forward-compat readers that drop unknown
      keys. run_sweep writes the summary LAST for every sweep (dry-run,
      green, red, all abort paths) via _write_gate_summary_artifact;
      _emit_abort_artifacts now returns its partial ReportSummary so abort
      accounting flows into the summary. completed_at is a sweep-end
      datetime.now() capture. Accounting prefers the ReportSummary; a
      report-less execute sweep (make uat-execute) mirrors write_report's
      counting on the outcome (report.py's status predicates made public
      as is_skipped_status/is_unreachable_status for that). Tests: verdict
      matrix, dry-run/green/red/abort sweep summaries, unknown-key
      round-trip (tests/uat/test_orchestrator.py).
  - id: w2
    summary: "Machine-readable stage completion: sweep records completed_at + config name in the summary; release_gate_ordering_violations consumes summaries; delete the manual snippet from uat-framework.md"
    status: done
    needs: [w1]
    notes: >
      Summary carries config_name + completed_at (w1). gate-check parses
      the stage-1/stage-2 summaries' completed_at and feeds the existing
      report.release_gate_ordering_violations (reused unchanged per prior
      art) with each Docker stage's uat_lifecycle.log text -- both the
      stage1->docker and stage2->stage3 boundaries are enforced. The
      operator python snippet at uat-framework.md (old :456-463) is
      deleted, replaced by the `make uat-gate-check` flow.
  - id: w3
    summary: "make uat-gate-check + _cli gate-check subcommand: aggregate 3 stage summaries, enforce ordering + mechanized APPROVE items, write _project/release-evidence/uat-gate-summary.json"
    status: done
    needs: [w2]
    notes: >
      _cli.py gate-check subcommand (--stage1/2/3 accept run dirs or
      summary paths; --output defaults to the repo
      _project/release-evidence/uat-gate-summary.json) +
      gate_summary.build_combined_evidence: red on any non-green/dry-run
      stage verdict, estimated sidecar, explorer_smoke configured-but-not-
      ran, cross-stage sha mismatch, dirty tree, wrong stage count, or
      ordering violation; exit 0 green / 1 red / 2 unreadable inputs.
      "gate-check" added to MAKE_TARGET_SUBCOMMANDS and the constant-vs-
      constant test in test_cli_dispatch.py; `make uat-gate-check` target
      + .PHONY added. _project/release-evidence/README.md documents the
      convention (operator-committed evidence, develop-only, curated out
      of release branches). DEVIATION: .gitignore needed a
      `!_project/release-evidence/` negation (the `_project/*` ignore
      would have made the "TRACKED path" requirement impossible) --
      .gitignore was not in scope_limit but the one-line change is the
      mechanism's precondition. CLI tests: green evidence write, both
      ordering boundaries, red-stage HOLD, missing-summary hard error.
  - id: w4
    summary: "Tune cross_scale_coverage_min_pairs in the three release-gate configs per the derivation rule (0.8 * eligible, minimums 8/4/2, derivation comment in each config)"
    status: done
    needs: []
    notes: >
      Eligible = pairs whose EVERY configured rung is enumerable via
      enumerate_cells_with_pruning (registry truth, 2026-07-12, develop @
      acfb89922) -- raw pair counts include pairs missing a rung (e.g.
      clickbench/joinorder 1.0-only) that the cross-scale check can never
      count, so raw counts would give impossible floors. Stage 1: 153
      eligible (208 raw) -> floor max(8, floor(0.8*153)) = 122. Stage 2:
      64 eligible (83 raw) -> max(4, 51) = 51. Stage 3: 203 eligible (251
      raw) -> max(2, 162) = 162. Derivation comments written above each
      value; test_config.py::
      test_release_gate_cross_scale_floors_are_tuned_and_achievable pins
      the sound band (>= minimum, <= floor(0.8*eligible), < eligible --
      the never-exact anti-pattern) without pinning exact registry
      counts.
  - id: w5
    summary: "Extend release_readiness_check.py: require green/clean/ancestor/<=21d UAT evidence with the existing override escape hatch; unit tests for each failure mode (missing, red, stale, non-ancestor, dirty)"
    status: done
    needs: [w3]
    notes: >
      evaluate_uat_gate_evidence mirrors evaluate_canary_runs (pure,
      injectable is_ancestor via the existing git merge-base helper);
      _load_uat_gate_evidence reads the working tree first, then `git
      show origin/develop:...` (release/base checkouts curate _project/
      away; validate-main-pr.yml already fetches origin/develop). Runs
      only after a green canary and combines via _combined_result, so
      canary bootstrap/exit-20 semantics are untouched; the existing
      RELEASE_READINESS_OVERRIDE_SHA/_REASON early-return covers the UAT
      check automatically (test pinned). New args/envs: --uat-max-age-days
      (RELEASE_UAT_MAX_AGE_DAYS, default 21), --uat-evidence-path,
      --uat-evidence-ref. Unit tests in test_release_infrastructure.py::
      TestUATGateReleaseEvidence: missing/red/dry_run/dirty/stale/
      non-ancestor/missing-completed_at each block, green passes,
      main() combination both ways, override bypass, make-target wiring,
      README convention. NOTE: the gate takes effect once this script
      version ships to main (validate-main-pr.yml runs the trusted-base
      copy); no workflow change needed or made. CODEOWNERS: scripts/
      release_readiness_check.py is NOT Code-Owner-gated (not in
      .github/CODEOWNERS or SOUNDNESS_PREFIXES).
  - id: w6
    summary: "Update release-guide.md (drop 'advisory', document evidence flow + override), uat-framework.md (gate-check replaces manual checklist mechanics), AGENTS.md release section if it references the old flow"
    status: done
    needs: [w5]
    notes: >
      release-guide.md: advisory sentence now scopes to stress/live only;
      new "UAT release-gate evidence (required)" section (sweep x3 ->
      uat-gate-check -> commit evidence -> release PR, 21-day rationale,
      origin/develop read, override), flow-precondition note, recovery
      bullet. uat-framework.md: per-sweep summary documented; manual
      ordering snippet replaced by `make uat-gate-check`; floor-tuning
      sentence points at the w4 derivation; APPROVE/HOLD section now
      describes the mechanized checklist + the two remaining manual items
      (DuckDB reference green, NO_JSON error text). AGENTS.md release
      paragraph gains the evidence precondition. REVIEW FOLLOW-UPS
      (Opus review, applied pre-PR): R1 defense-in-depth --
      build_combined_evidence now also requires the exact
      EXPECTED_RELEASE_GATE_STAGES config-name tuple (kills same-dir-x3
      and hollow-config substitution) and per-stage armed floor gates
      (validator_clean_rate_floor + cross_scale_floor not None), both
      tested; C1 -- gate-check HOLDs when a Docker stage (2/3) presents
      no uat_lifecycle.log ("ordering not verifiable") instead of
      silently passing, tested; C3 -- gate_summary module doc notes the
      readiness checker relies on additive versioning rather than
      validating `version`; N1 -- the git-show fallback honors
      --uat-evidence-path; release-guide.md states the one-cycle
      activation lag plainly. ADDITIONAL DEVIATION (review-mandated,
      outside scope_limit): docs/operations/repo-admin-settings.md
      advisory_suites line dropped "long-running UAT" and gained a
      pointer to the release-guide evidence section -- one-line
      doc-consistency fix; leaving an operator-facing contradiction was
      judged worse than the scope breach (line not parsed by
      ruleset_drift_check.py or any test; verified).

