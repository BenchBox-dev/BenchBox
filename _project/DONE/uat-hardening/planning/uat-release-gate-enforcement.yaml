  - summary: "Automated scheduled release-gate sweeps in CI (cloud runners with docker stacks)"
    reason: "Cost/credential policy for hours-long multi-platform docker sweeps in CI is its own decision; the operator-run + committed-evidence model gets enforcement now without it."
  - summary: "Per-platform runtime envelopes (compatibility.release_gate_runtime_envelopes) feeding the gate"
    reason: "Schema field exists but no envelope data has been collected; needs several recorded sweeps first."

deps:
  needs: [uat-container-engine-routing, uat-fail-advance-consistency]

must_preserve:
  - "release-canary checks and RELEASE_REQUIRED_CONTEXTS continue working unchanged; UAT evidence is an ADDITIONAL requirement inside release_readiness_check, not a replacement."
  - "Existing RELEASE_READINESS_OVERRIDE_SHA/_REASON override semantics (admin-only, documented, removed after use)."
  - "Non-release sweeps (stress, nightly throughput, ad-hoc configs) write a summary but are never consumed by release readiness -- only the committed release-evidence file is."
  - "The soundness-paths auto-merge exception: release_readiness_check.py changes may be CODEOWNERS-gated; check before enabling auto-merge."

approach: |
  This is the keystone TODO -- the release-canary precedent means the
  readiness-check extension is pattern-following, not invention. Keep the
  summary schema additive-versioned (version: 1) so later accounting
  fields do not break the checker. w4 is independent and can land first
  within the PR. The evidence path must survive on develop but be curated
  out of release branches -- verify release-cut's curation globs cover
  _project/release-evidence/ (they cover _project/ broadly; confirm, do
  not assume).

anti_patterns:
  - "DO NOT gate on raw TSVs -- the checker consumes only the versioned summary JSON; TSVs stay human evidence."
  - "DO NOT auto-commit evidence from inside the sweep -- the operator reviews and commits it deliberately (evidence is a human attestation plus machine verdict, and sweeps must not write to the git tree)."
  - "DO NOT set the floors to eligible-pair-count exactly -- a single flaky docker stack would then block every release; 0.8 slack is the point."

verification:
  - description: "Gate summary + gate-check + readiness unit tests"
    command: "uv run -- python -m pytest tests/uat/ tests/unit/test_release_infrastructure.py -m fast -q"
    expected_output: "pass, incl. readiness failure modes (missing/red/stale/non-ancestor/dirty) and floor derivation comments present in the three configs"
  - description: "End-to-end dry-run: a dry-run sweep produces a summary; uat-gate-check over three synthetic stage summaries produces the combined evidence file"
    command: "make uat-sweep CONFIG=tests/uat/configs/release-gate-01-native-dataframe.yaml DRY_RUN=1 && ls ~/Developer/benchmark_runs/logs/uat_*/uat_gate_summary.json"
    expected_output: "summary file exists with verdict field"

