id: document-stdout-patches
title: "Document TPC-DS stdout patches and credit tpcds-kit origin"
worktree: tpcds-docs
priority: High
status: Completed
completed_date: "2026-01-15"
category: Documentation

description: |
  The TPC-DS stdout fix (commit 3911fd3a) applied patches to enable streaming
  data generation but lacks documentation equivalent to what TPC-H has.

  TPC-H has a comprehensive PATCHES.md file documenting the stdout patch
  and crediting gregrahn/tpch-kit. TPC-DS needs the same treatment to:

  1. Document the patches applied for future maintainers
  2. Credit the original fix author (gregrahn/tpcds-kit commit 7992dbb)
  3. Help users understand the streaming capability exists

  This was identified during code review of the stdout fix implementation.

context_sections:
  "Existing TPC-H Documentation": |
    _sources/tpc-h/PATCHES.md provides an excellent template:
    - Documents the -z flag for stdout output
    - Credits tpch-kit (https://github.com/gregrahn/tpch-kit)
    - Explains the problem, solution, and exact changes
    - Includes usage examples and verification steps

  "TPC-DS Patches Applied": |
    The following changes were made in commit 3911fd3a:

    1. params.h line 64: `_FILTER` → `FILTER`
       - Fix: Parameter name mismatch preventing flag recognition

    2. print.c lines 480-486: Move fpOutfile assignment inside else block
       - Fix: Preserve stdout when FILTER=Y instead of overwriting with NULL

    3. porting.h lines 120-122: Add `#define MAXINT INT_MAX` for Linux
       - Fix: Missing MAXINT definition causing Linux build failure

    4. makefile line 59: Add `-fcommon` to LINUX_CFLAGS
       - Fix: GCC 10+ compatibility for multiple definition errors

  "Attribution": |
    Original stdout fix by Greg Rahn (gregrahn) in tpcds-kit repo:
    - Repository: https://github.com/gregrahn/tpcds-kit
    - Commit: 7992dbb (2013)
    - The fix was reverted by TPC spec imports (v2.10.0, v4.0.0)

