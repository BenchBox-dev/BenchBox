impact:
  business_value: |
    MCP server is the primary interface for AI agents (Claude Code, etc.) to
    interact with BenchBox. Production-quality implementation directly impacts:
    - AI agent reliability when using BenchBox
    - User trust in AI-assisted benchmarking workflows
    - Error recovery and debugging experience
    - Future extensibility for new AI agent features
  user_impact: |
    Users integrating BenchBox with AI agents will experience:
    - More reliable tool calls with better error messages
    - Faster debugging when things go wrong
    - Better security through input validation
    - Clearer understanding of tool capabilities via annotations

