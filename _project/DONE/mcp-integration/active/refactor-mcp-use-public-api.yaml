impact:
  business_value: |
    Ensures MCP reliability by using stable public APIs. Reduces maintenance
    burden as CLI internals can evolve without breaking MCP functionality.
  user_impact: |
    Users of MCP (Claude Code, other AI assistants) will have more reliable
    benchmark execution without runtime errors from API mismatches.
  technical_debt: |
    Eliminates architectural violation where MCP bypasses public API to use
    CLI implementation details. This caused the profile() vs get_system_profile()
    bug and creates ongoing risk of similar issues.

