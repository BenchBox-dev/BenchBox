id: fix-mcp-stdout-corruption
title: Fix MCP server stdout corruption from ResultExporter
worktree: mcp-integration
priority: High
status: Completed
completed_date: '2026-01-27'
category: Core Functionality
description: 'The MCP server emits non-protocol output to stdout during result export,

  which breaks stdio MCP clients like the codex CLI. For stdio MCP servers,

  stdout must contain exclusively JSON-RPC messages. When ResultExporter

  prints status lines to stdout, it corrupts the JSON-RPC stream, causing

  strict clients to close the transport with "Transport closed" errors.


  Root cause: ResultExporter in benchbox/core/results/exporter.py uses

  self.console.print() at multiple points (lines 167, 171, 175, 247, 255)

  to output status messages. When MCP tools create ResultExporter without

  a quiet console, these messages leak to stdout.


  The fix uses the existing quiet-mode infrastructure in benchbox/utils/printing.py

  which already provides get_quiet_console() and set_quiet() utilities.

  '
tasks:
  phases:
  - phase: 'Phase 1: Apply Belt-and-Suspenders Fix'
    done: true
    items:
    - summary: Set global quiet mode in MCP server initialization
      done: true
      subtasks:
      - summary: Add set_quiet(True) at top of create_benchbox_server() in benchbox/mcp/server.py
        done: true
    - summary: Pass quiet console to ResultExporter in benchmark.py
      done: true
      subtasks:
      - summary: Import get_quiet_console from benchbox.utils.printing
        done: true
      - summary: 'Change line ~211 to: exporter = ResultExporter(anonymize=False, console=get_quiet_console())'
        done: true
    - summary: Pass quiet console to ResultExporter in results.py
      done: true
      subtasks:
      - summary: Import get_quiet_console from benchbox.utils.printing
        done: true
      - summary: 'Change line ~237 to: exporter = ResultExporter(anonymize=False, console=get_quiet_console())'
        done: true
  - phase: 'Phase 2: Add Regression Test'
    done: true
    items:
    - summary: Create tests/unit/mcp/test_mcp_stdout_isolation.py
      done: true
      subtasks:
      - summary: Test that run_benchmark produces no stdout output
        done: true
      - summary: Test that compare_results produces no stdout output
        done: true
  - phase: 'Phase 3: Verification'
    done: true
    items:
    - summary: 'Run unit tests: uv run -- python -m pytest tests/unit/mcp/ -v'
      done: true
    - summary: 'Run lint and typecheck: make lint && make typecheck'
      done: true
    - summary: Manual verification with codex CLI (if available)
      done: true
