context_sections:
  "Existing Visualization Infrastructure": |
    BenchBox has a complete visualization module at benchbox/core/visualization/:

    Chart Types (charts.py):
    - PerformanceBarChart: Multi-platform performance comparison
    - TimeSeriesLineChart: Trend analysis over time
    - CostPerformanceScatterPlot: Cost vs performance analysis
    - DistributionBoxPlot: Query timing distribution
    - QueryVarianceHeatmap: Query performance patterns

    Templates (templates.py):
    - "default": Single run baseline (bar + box + heatmap)
    - "flagship": Eight-platform comparison with heatmap and cost frontier
    - "head_to_head": Two-platform comparison with win/loss emphasis
    - "trends": Multi-period performance trend lines
    - "cost_optimization": Cost breakdown and price/performance frontier

    Export Formats (exporters.py):
    - PNG (requires kaleido)
    - SVG (requires kaleido)
    - PDF (requires kaleido)
    - HTML (always available)

    High-Level API (result_plotter.py):
    - ResultPlotter class loads results from JSON or BenchmarkResults
    - Supports theme customization via ThemeSettings
    - Generates multiple charts per template

  "MCP Tool Design Considerations": |
    Return Value Strategy:
    - Return file path for generated chart
    - Optionally include base64-encoded image data for immediate display
    - Include metadata (dimensions, format, chart_type)

    Dependency Handling:
    - Plotly is required for all charts
    - Kaleido is required for PNG/SVG/PDF export
    - HTML export works without kaleido
    - Tools should check dependencies and return helpful errors

    Integration with Existing Tools:
    - generate_chart can accept result_id from get_results/list_recent_runs
    - compare_results_chart parallels compare_results but produces visual output
    - generate_chart_set uses same result_id pattern

technical_requirements:
  dependencies:
    - "plotly>=5.24.0 (required)"
    - "kaleido>=0.2.1 (optional, for PNG/SVG/PDF)"
  constraints:
    - "Must handle missing optional dependencies gracefully"
    - "Must not break MCP server startup if visualization deps missing"
    - "Chart files must be written to accessible location"
  compatibility: |
    - Python 3.10+ (MCP server requirement)
    - Compatible with existing result file format
    - Works with both local and cloud benchmark results

success_metrics:
  - "list_chart_templates returns all 5 templates with accurate descriptions"
  - "generate_chart produces valid PNG/HTML for all 5 chart types"
  - "generate_chart_set produces complete chart sets matching template specs"
  - "compare_results_chart generates meaningful comparison visualizations"
  - "All tools return helpful errors when dependencies are missing"
  - "Unit test coverage >= 80% for new code"

