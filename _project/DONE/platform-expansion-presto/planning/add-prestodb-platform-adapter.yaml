id: add-prestodb-platform-adapter
title: Add PrestoDB Platform Adapter
worktree: platform-expansion-presto
category: Platform Expansion
priority: Medium
status: Completed
completed_date: '2025-11-29'
description: 'Implement PrestoDB (Meta''s Presto fork) platform adapter to complement the existing

  Trino adapter. While Trino and PrestoDB share a common ancestry (Trino was formerly

  PrestoSQL before the 2019 fork), they have diverged significantly and require

  separate adapters due to incompatible drivers and protocols.

  '
context_sections:
- name: Background - Trino vs PrestoDB Fork
  summary: 'In 2019, the original Presto founders forked the project and renamed it to Trino

    (formerly PrestoSQL) due to trademark disputes with Facebook/Meta. Meta retained

    the "Presto" name and continues development as PrestoDB. The projects have since

    diverged in features, drivers, and protocols.

    '
- name: Technical Incompatibilities
  summary: 'Key differences requiring separate adapters:

    - Python drivers: Trino uses ''trino'' package, PrestoDB uses ''presto-python-client''

    - HTTP headers: Trino uses X-Trino-*, PrestoDB uses X-Presto-*

    - SQL dialect: SQLGlot has separate ''trino'' and ''presto'' dialects (Trino inherits from Presto with modifications)

    - Authentication: Different auth implementations and APIs

    - System tables: Different metadata schemas

    '
- name: Market Position
  summary: 'While Trino has become the dominant open-source fork (20K+ GitHub stars, Netflix/Airbnb/Lyft),

    PrestoDB is still used by organizations that:

    - Have existing PrestoDB deployments from pre-fork era

    - Use Meta''s ecosystem or contributions

    - Require specific PrestoDB-only features

    - Run managed PrestoDB services (some cloud providers)

    '
- name: Marketing Dependency
  summary: 'Enables content like "Trino vs Athena vs Presto: The Open-Source Query Engine Battle"

    with actual benchmark data from all three platforms. Currently blocked by lack of

    native PrestoDB support.

    '
impact: 'MEDIUM - Completes the Presto/Trino ecosystem coverage.

  Enables true "Trino vs PrestoDB" comparisons with identical workloads.

  Supports users with legacy PrestoDB deployments.

  '
research_value: 'Study driver API differences between presto-python-client and trino packages.

  Document protocol header differences (X-Presto-* vs X-Trino-*).

  Identify SQL dialect divergences using SQLGlot''s separate Presto dialect.

  '
tasks:
- phase: 'Phase 1: Research & Architecture Decision'
  done: true
  items:
  - summary: Evaluate presto-python-client API vs trino package API
    details: 'Compare connection parameters, authentication methods, cursor behavior.

      Document: https://github.com/prestodb/presto-python-client

      '
  - summary: Decide on implementation strategy - new adapter vs shared base class
    details: 'Options:

      A) Separate PrestoAdapter class (simpler, clearer separation)

      B) Shared PrestoTrinoBaseAdapter with protocol switching (DRY but complex)

      Recommendation: Option A for clarity and maintainability

      '
  - summary: Document SQLGlot Presto vs Trino dialect differences
    details: 'SQLGlot''s Trino class inherits from Presto but overrides:

      - SUPPORTS_USER_DEFINED_TYPES = False

      - LOG_BASE_FIRST = True

      - Different TRIM, JSON_QUERY, LISTAGG parsing

      - Different transforms for ArraySum, GroupConcat, Merge, etc.

      '
- phase: 'Phase 2: Adapter Scaffolding'
  done: true
  items:
  - summary: Create benchbox/platforms/presto.py with PrestoAdapter class
    details: 'Model after TrinoAdapter but use presto-python-client:

      - import prestodb

      - prestodb.dbapi.connect()

      - Different auth classes

      '
  - summary: Configure presto-python-client library integration
    details: 'Package: presto-python-client (PyPI: presto-python-client)

      Supports Python 2.7, 3.5-3.7, PyPy (note: older Python support than Trino)

      '
  - summary: Implement connection handling (coordinator URL, catalog, schema, auth)
    details: 'Similar to Trino but with PrestoDB-specific parameters.

      Note different HTTP header format (X-Presto-User vs X-Trino-User).

      '
  - summary: Add credential management (basic auth, Kerberos if needed)
    details: 'PrestoDB supports different auth mechanisms than Trino.

      Implement basic auth first, document Kerberos as future enhancement.

      '
- phase: 'Phase 3: SQL Dialect Translation'
  done: true
  items:
  - summary: Use SQLGlot 'presto' dialect for query translation
    details: 'Set self._dialect = "presto" (not "trino")

      SQLGlot handles the dialect differences automatically.

      '
  - summary: Test TPC-H/TPC-DS query compatibility with Presto dialect
    details: 'Verify all benchmark queries translate correctly.

      Document any queries that need Presto-specific handling.

      '
  - summary: Handle Presto-specific SQL syntax differences
    details: 'Key differences from Trino:

      - TRIM function parsing

      - JSON_QUERY behavior

      - LISTAGG vs ARRAY_AGG differences

      - LOG function argument order

      '
- phase: 'Phase 4: Data Loading'
  done: true
  items:
  - summary: Implement data loading via INSERT statements
    details: 'Use same batch INSERT approach as Trino adapter.

      Batch size may need tuning for PrestoDB performance characteristics.

      '
  - summary: Support for Hive connector data loading
    details: 'PrestoDB commonly uses Hive connector for S3/HDFS data.

      May require different table format syntax than Trino.

      '
  - summary: Handle PrestoDB-specific table properties
    details: 'CREATE TABLE syntax may differ slightly from Trino.

      WITH clause properties may have different names.

      '
- phase: 'Phase 5: Platform Info & Metadata'
  done: true
  items:
  - summary: Implement get_platform_info() for PrestoDB
    details: 'Query system tables (may differ from Trino''s system.runtime.nodes).

      Document any schema differences.

      '
  - summary: Add PrestoDB version detection
    details: 'Version query may differ from Trino.

      Handle gracefully if system tables are inaccessible.

      '
  - summary: Capture PrestoDB-specific configuration
    details: 'Session properties, resource groups, etc.

      '
- phase: 'Phase 6: Testing'
  done: true
  items:
  - summary: Create unit tests mirroring test_trino_adapter.py
    details: 'tests/unit/platforms/test_presto_adapter.py

      Cover all adapter methods with mocked connections.

      '
  - summary: Add test_presto_not_trino() to document incompatibility
    details: 'Explicit test verifying dialect is ''presto'' not ''trino''.

      Document that this adapter is for PrestoDB only.

      '
  - summary: Integration testing with PrestoDB instance
    details: 'Docker-based testing: prestodb/presto or similar.

      Verify against actual PrestoDB coordinator.

      '
- phase: 'Phase 7: Registration & Documentation'
  done: true
  items:
  - summary: Register PrestoAdapter in platform registry
    details: 'benchbox/platforms/__init__.py - add import and mapping

      benchbox/core/platform_registry.py - add metadata

      '
  - summary: Add 'presto' dependency group to dependencies.py
    details: 'New DependencyInfo for presto-python-client.

      Clearly distinguish from ''trino'' group.

      '
  - summary: Update pyproject.toml with presto extra
    details: '[project.optional-dependencies]

      presto = ["presto-python-client", "cloudpathlib"]

      '
  - summary: Document Trino vs PrestoDB selection guidance
    details: 'Update platform selection guide explaining:

      - When to use Trino adapter (recommended for most users)

      - When to use Presto adapter (legacy PrestoDB deployments)

      - When to use Athena adapter (AWS managed service)

      '
