- phase: 'Phase 3: Validation System'
  items:
  - summary: Implement platform compatibility validation
    done: false
    details: "Location: benchbox/core/dataframe/tuning/validation.py\n\n```python\ndef validate_dataframe_tuning(\n    config:\
      \ DataFrameTuningConfiguration,\n    platform: str\n) -> list[ValidationIssue]:\n    \"\"\"Validate tuning configuration\
      \ for platform.\"\"\"\n    issues = []\n\n    # Check unsupported settings\n    for setting in config.get_enabled_settings():\n\
      \        if not setting.is_compatible_with_platform(platform):\n            issues.append(ValidationIssue(\n       \
      \         level=ValidationLevel.WARNING,\n                message=f\"{setting.value} not supported on {platform}\",\n\
      \                suggestion=f\"This setting will be ignored on {platform}\"\n            ))\n\n    # Platform-specific\
      \ validations\n    if platform == \"polars\":\n        issues.extend(_validate_polars(config))\n    elif platform ==\
      \ \"pandas\":\n        issues.extend(_validate_pandas(config))\n    # ...\n\n    return issues\n\ndef _validate_polars(config:\
      \ DataFrameTuningConfiguration) -> list[ValidationIssue]:\n    issues = []\n\n    # Warn if streaming_mode=True but\
      \ chunk_size not set\n    if config.execution.streaming_mode and config.memory.chunk_size is None:\n        issues.append(ValidationIssue(\n\
      \            level=ValidationLevel.INFO,\n            message=\"Streaming mode enabled without explicit chunk_size\"\
      ,\n            suggestion=\"Consider setting chunk_size for large string columns\"\n        ))\n\n    # Error if engine_affinity\
      \ invalid\n    valid_engines = {\"streaming\", \"in-memory\", None}\n    if config.execution.engine_affinity not in\
      \ valid_engines:\n        issues.append(ValidationIssue(\n            level=ValidationLevel.ERROR,\n            message=f\"\
      Invalid engine_affinity: {config.execution.engine_affinity}\",\n            suggestion=f\"Use one of: {valid_engines}\"\
      \n        ))\n\n    return issues\n```\n"
  - summary: Implement smart defaults based on system profile
    done: false
    details: "Location: benchbox/core/dataframe/tuning/defaults.py\n\n```python\ndef get_smart_defaults(\n    platform: str,\n\
      \    system_profile: SystemProfile | None = None\n) -> DataFrameTuningConfiguration:\n    \"\"\"Generate recommended\
      \ defaults based on system capabilities.\"\"\"\n\n    if system_profile is None:\n        system_profile = detect_system_profile()\n\
      \n    config = DataFrameTuningConfiguration()\n\n    # CPU-based recommendations\n    config.parallelism.thread_count\
      \ = min(\n        system_profile.cpu_cores,\n        16  # Cap for diminishing returns\n    )\n\n    # Memory-based\
      \ recommendations\n    available_memory = system_profile.available_memory_gb\n    if available_memory < 8:\n       \
      \ config.execution.streaming_mode = True\n        config.memory.chunk_size = 100_000\n    elif available_memory < 32:\n\
      \        config.memory.chunk_size = 500_000\n\n    # Platform-specific adjustments\n    if platform == \"polars\":\n\
      \        if available_memory > 64:\n            config.execution.engine_affinity = \"in-memory\"\n        else:\n  \
      \          config.execution.engine_affinity = \"streaming\"\n    elif platform == \"dask\":\n        config.parallelism.worker_count\
      \ = max(1, system_profile.cpu_cores // 4)\n        config.parallelism.threads_per_worker = 2\n        config.memory.memory_limit\
      \ = f\"{available_memory // config.parallelism.worker_count}GB\"\n\n    return config\n```\n"
