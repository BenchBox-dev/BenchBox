    done: false
    details: "Modify: benchbox/platforms/dataframe/expression_family.py\nModify: benchbox/platforms/dataframe/pandas_family.py\n\
      \nAdd to base classes:\n```python\nclass ExpressionFamilyAdapter(ABC, Generic[DF, LazyDF, Expr]):\n    def __init__(\n\
      \        self,\n        working_dir: str | Path | None = None,\n        verbose: bool = False,\n        tuning_config:\
      \ DataFrameTuningConfiguration | None = None,\n        tuning_config_path: Path | str | None = None,\n        **kwargs\n\
      \    ):\n        # Load tuning config if path provided\n        if tuning_config_path:\n            loader = DataFrameTuningLoader()\n\
      \            self._tuning_config = loader.load_config(\n                tuning_config_path,\n                platform=self.platform_name\n\
      \            )\n        else:\n            self._tuning_config = tuning_config or DataFrameTuningConfiguration()\n\n\
      \        # Validate for platform\n        issues = validate_dataframe_tuning(self._tuning_config, self.platform_name)\n\
      \        for issue in issues:\n            if issue.level == ValidationLevel.ERROR:\n                raise TuningValidationError(issue.message)\n\
      \            elif issue.level == ValidationLevel.WARNING:\n                logger.warning(f\"Tuning: {issue.message}\"\
      )\n\n        # Apply tuning settings\n        self._apply_tuning()\n\n    @abstractmethod\n    def _apply_tuning(self)\
      \ -> None:\n        \"\"\"Apply tuning configuration. Platform-specific implementation.\"\"\"\n\n    @property\n   \
      \ def tuning_config(self) -> DataFrameTuningConfiguration:\n        \"\"\"Get active tuning configuration.\"\"\"\n \
      \       return self._tuning_config\n\n    def get_tuning_summary(self) -> dict:\n        \"\"\"Get summary of applied\
      \ tuning settings.\"\"\"\n```\n"
  - summary: Implement Polars tuning application
    done: false
    details: "Modify: benchbox/platforms/dataframe/polars_df.py\n\n```python\ndef _apply_tuning(self) -> None:\n    \"\"\"\
      Apply Polars-specific tuning settings.\"\"\"\n    config = self._tuning_config\n\n    # Thread count (must be set via\
      \ env var before import)\n    # We can warn if different from current\n    current_threads = pl.threadpool_size()\n\
      \    if config.parallelism.thread_count and current_threads != config.parallelism.thread_count:\n        logger.warning(\n\
      \            f\"Cannot change Polars thread count at runtime. \"\n            f\"Set POLARS_MAX_THREADS={config.parallelism.thread_count}\
      \ before import.\"\n        )\n\n    # Streaming chunk size\n    if config.memory.chunk_size:\n        pl.Config.set_streaming_chunk_size(config.memory.chunk_size)\n\
      \n    # Engine affinity (Polars 1.0+)\n    if config.execution.engine_affinity:\n        try:\n            pl.Config.set_engine_affinity(engine=config.execution.engine_affinity)\n\
      \        except AttributeError:\n            logger.warning(\"Engine affinity requires Polars 1.0+\")\n\n    # String\
      \ cache\n    if config.data_types.enable_string_cache:\n        pl.enable_string_cache()\n\n    # Store streaming mode\
      \ for collect()\n    self._streaming_mode = config.execution.streaming_mode\n    self._rechunk = config.memory.rechunk_after_filter\n\
      \ndef collect(self, lazy_frame: pl.LazyFrame) -> pl.DataFrame:\n    \"\"\"Collect lazy frame with tuning-aware settings.\"\
      \"\"\n    kwargs = {}\n    if self._streaming_mode:\n        kwargs[\"engine\"] = \"streaming\"\n\n    result = lazy_frame.collect(**kwargs)\n\
      \n    if self._rechunk:\n        result = result.rechunk()\n\n    return result\n```\n"
  - summary: Implement Dask tuning application
    done: false
    details: "Modify: benchbox/platforms/dataframe/dask_df.py\n\n```python\ndef _apply_tuning(self) -> None:\n    \"\"\"Apply\
      \ Dask-specific tuning settings.\"\"\"\n    config = self._tuning_config\n\n    # Override constructor params with tuning\
      \ config\n    if config.parallelism.worker_count:\n        self.n_workers = config.parallelism.worker_count\n    if\
      \ config.parallelism.threads_per_worker:\n        self.threads_per_worker = config.parallelism.threads_per_worker\n\
      \    if config.memory.memory_limit:\n        self.memory_limit = config.memory.memory_limit\n    if config.memory.spill_to_disk:\n\
      \        self.local_directory = config.memory.spill_directory or \"/tmp/dask-worker-space\"\n\n    # Setup distributed\
      \ client if configured\n    if config.execution.streaming_mode or self.use_distributed:\n        self._setup_distributed_client()\n\
      \ndef _setup_distributed_client(self) -> None:\n    \"\"\"Initialize Dask distributed client with tuning settings.\"\
      \"\"\n    config = self._tuning_config\n\n    cluster_kwargs = {\n        \"n_workers\": self.n_workers,\n        \"\
      threads_per_worker\": self.threads_per_worker,\n    }\n    if config.memory.memory_limit:\n        cluster_kwargs[\"\
      memory_limit\"] = config.memory.memory_limit\n    if config.memory.spill_to_disk:\n        cluster_kwargs[\"local_directory\"\
      ] = str(self.local_directory)\n\n    self._cluster = LocalCluster(**cluster_kwargs)\n    self._client = Client(self._cluster)\n\
      ```\n"
