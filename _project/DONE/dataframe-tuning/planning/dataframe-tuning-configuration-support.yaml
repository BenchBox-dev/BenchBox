id: dataframe-tuning-configuration-support
title: DataFrame Tuning Configuration Support
worktree: dataframe-tuning
category: Platform Enhancement
priority: High
status: Completed
description: 'Implement a tuning configuration framework for DataFrame adapters that parallels the

  SQL tuning system. Unlike SQL adapters where tuning affects schema and table creation,

  DataFrame tuning focuses on runtime execution parameters, memory management, and

  parallelism settings.


  Current State:

  - DataFrame adapters have ZERO tuning framework integration

  - SQL adapters use UnifiedTuningConfiguration with 13 TuningType options

  - DataFrame adapters only accept constructor parameters for basic settings

  - No way to load/save DataFrame tuning configs from YAML

  - No validation or platform compatibility checking


  This TODO implements a parallel tuning system designed for DataFrame semantics.

  '
context_sections:
- name: Research Summary - DataFrame Tuning Capabilities
  summary: 'Based on comprehensive research of official documentation and best practices:


    **Polars**:

    - POLARS_MAX_THREADS: Thread pool size (must set before import)

    - pl.Config.set_streaming_chunk_size(): Chunk size for streaming mode

    - pl.Config.set_engine_affinity(): New streaming engine vs legacy

    - StringCache: Global string interning for categoricals

    - streaming=True in collect(): Enable streaming execution

    - rechunk=True: Optimize memory layout after operations


    **Pandas**:

    - dtype_backend: ''numpy'', ''numpy_nullable'', or ''pyarrow''

    - chunksize: Read files in chunks

    - category dtype: Memory-efficient string handling

    - usecols: Only load needed columns

    - inplace operations: Reduce memory copies


    **Dask**:

    - n_workers: Number of worker processes

    - threads_per_worker: Threads per worker

    - memory_limit: Per-worker memory limit

    - scheduler: ''synchronous'', ''threads'', ''processes'', ''distributed''

    - use_distributed: Enable distributed scheduler with dashboard

    - blocksize: Partition size for file reading


    **Modin**:

    - engine: ''ray'' or ''dask'' backend

    - NPartitions: Number of partitions (default 8)

    - MODIN_CPUS: CPU limit


    **cuDF**:

    - device_id: CUDA device selection

    - spill_to_host: Spill GPU memory to host RAM

    - RMM pool configuration (advanced)


    **PyArrow** (backend for many platforms):

    - ARROW_DEFAULT_MEMORY_POOL: jemalloc, mimalloc, or system

    - jemalloc_set_decay_ms(): Memory release timing

    - use_threads, memory_map, pre_buffer for I/O

    '
- name: Architectural Decision - Separate from SQL Tuning
  summary: "**Decision**: Create a PARALLEL tuning system (DataFrameTuningConfiguration) rather\nthan extending UnifiedTuningConfiguration.\n\
    \n**Rationale**:\n1. **Different Semantics**: SQL tuning affects schema/DDL; DataFrame tuning affects runtime\n2. **No\
    \ Schema Concepts**: DataFrames don't have partitioning, clustering, or constraints\n   in the SQL sense - these are replaced\
    \ by execution settings\n3. **When Applied**: SQL tuning at table creation; DataFrame tuning at adapter init/query time\n\
    4. **Validation Rules**: Completely different compatibility matrices\n5. **Configuration Source**: SQL tuning from DDL\
    \ analysis; DataFrame from execution profiling\n\n**Alternative Rejected**: Extending TuningType enum with DataFrame options\n\
    - Would pollute SQL tuning with inapplicable options\n- Validation logic would become complex\n- is_compatible_with_platform()\
    \ would need overhaul\n"
- name: Platform Compatibility Matrix
  summary: '| Setting Category | Polars | Pandas | Dask | Modin | cuDF |

    |------------------|--------|--------|------|-------|------|

    | **Parallelism** | | | | | |

    | - thread_count | yes | no | yes | yes | no |

    | - worker_count | no | no | yes | yes | no |

    | **Memory** | | | | | |

    | - memory_limit | no | no | yes | no | no |

    | - spill_to_disk | no | no | yes | no | yes |

    | - chunk_size | yes | yes | yes | no | no |

    | **Execution** | | | | | |

    | - streaming_mode | yes | no | native | no | no |

    | - engine_affinity | yes | no | no | yes | no |

    | - rechunk | yes | no | no | no | no |

    | **Data Types** | | | | | |

    | - dtype_backend | no | yes | yes | yes | no |

    | - string_cache | yes | yes(cat) | no | yes | yes |

    | **I/O** | | | | | |

    | - memory_pool | indirect | indirect | indirect | indirect | no |

    | - memory_map | indirect | yes | yes | yes | no |

    | **GPU** | | | | | |

    | - device_id | no | no | no | no | yes |

    '
