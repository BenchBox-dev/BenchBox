id: fabric-adapter-architecture
title: "Microsoft Fabric Data Warehouse Adapter Architecture"
description: |
  Comprehensive architectural analysis comparing Azure Synapse implementation with
  Microsoft Fabric requirements, and detailed design for the Fabric adapter.

category: platform-adapter
priority: High
status: "Completed"
created: 2025-12-02
updated: 2025-12-02
author: claude-opus
worktree: fabric-platform
phase: planning

context:
  motivation: |
    Microsoft Fabric is positioned as the successor to Azure Synapse Analytics,
    representing Microsoft's unified SaaS analytics platform. Supporting Fabric
    enables BenchBox users to benchmark this increasingly popular platform.

  existing_work: |
    Azure Synapse adapter (benchbox/platforms/azure_synapse.py) provides a
    production-ready implementation with:
    - 1,075 lines of well-structured code
    - Three auth methods (SQL, AAD password, Managed Identity)
    - COPY INTO bulk loading via Azure Blob Storage
    - T-SQL dialect support with schema translation
    - Tuning support (distribution, partitioning, indexing)

analysis:
  synapse_vs_fabric_comparison:
    architecture:
      synapse:
        - PaaS offering requiring Azure subscription
        - Dedicated SQL Pools (MPP architecture)
        - Separate compute/storage with manual management
        - Azure Data Lake Storage Gen2 for data lake
        - Manual integration between services
      fabric:
        - SaaS offering (can work without Azure subscription)
        - Warehouse based on Delta Lake/Parquet
        - Decoupled storage (OneLake) with automatic management
        - OneLake unified storage layer on ADLS Gen2
        - Pre-integrated services with single tenant experience

    sql_compatibility:
      common:
        - T-SQL dialect (tsql)
        - TDS protocol on port 1433
        - ODBC Driver 18+ support
        - Microsoft Entra ID authentication
      differences:
        fabric_limitations:
          - No SQL Authentication (Entra ID only)
          - No MARS (Multiple Active Result Sets)
          - Limited ALTER TABLE operations
          - MERGE is preview feature
          - Same-region connections only
          - No materialized views
          - No triggers or recursive queries
        fabric_advantages:
          - Delta Lake native format
          - Shortcuts for data sharing
          - Simplified permissions (workspace-level)

    data_loading:
      synapse:
        - COPY INTO from Azure Blob Storage
        - PolyBase for external tables
        - SAS tokens, account keys, or credentials
        - Direct INSERT for fallback
      fabric:
        - COPY INTO from OneLake or external storage
        - Native Delta Lake/Parquet ingestion
        - OneLake as preferred staging location
        - Azure SDK (azure-storage-file-datalake)
        - Entra ID authentication only

    connectivity:
      synapse:
        endpoint: "{workspace}.sql.azuresynapse.net"
        auth_methods: [sql, aad_password, aad_msi]
        drivers: [pyodbc]
      fabric:
        endpoint: "{workspace}-{guid}.datawarehouse.fabric.microsoft.com"
        auth_methods: [aad_password, aad_msi, service_principal]
        drivers: [pyodbc with ODBC 18+]
        storage_endpoint: "https://onelake.dfs.fabric.microsoft.com"

design:
  adapter_class: MicrosoftFabricAdapter

  inheritance_strategy: |
    Extend PlatformAdapter directly (same as Synapse), NOT inherit from Synapse.
    Rationale: While there are similarities, Fabric has enough differences
    (auth, storage, limitations) that composition would be complex. Clean
    implementation with shared utilities is preferable.

  key_components:
    authentication:
      strategy: |
        Fabric ONLY supports Entra ID authentication. The adapter must:
        1. Use azure-identity for token acquisition
        2. Support DefaultAzureCredential (az login, env vars, MSI)
        3. Support explicit service principal credentials
        4. Inject access tokens into pyodbc connection
      implementation: |
        Use ODBC connection with Authentication=ActiveDirectoryServicePrincipal
        or ActiveDirectoryInteractive, NOT SQL authentication.

    connection:
      endpoint_format: |
        Server={workspace_guid}.datawarehouse.fabric.microsoft.com,1433
        Database={warehouse_name}
      connection_string: |
        DRIVER={ODBC Driver 18 for SQL Server};
        SERVER={endpoint};
        DATABASE={database};
        Authentication=ActiveDirectoryServicePrincipal;
        UID={client_id};
        PWD={client_secret};
        Encrypt=yes;
        TrustServerCertificate=no;

    data_loading:
      primary_method: "OneLake + COPY INTO"
      strategy: |
        1. Upload data files to OneLake using Azure SDK
        2. Execute COPY INTO from OneLake paths
        3. Use workspace Files folder as staging area
      onelake_uri_format: |
        https://onelake.dfs.fabric.microsoft.com/{workspace}/{warehouse}.Warehouse/Files/benchbox-staging/{table}
      fallback: "Direct INSERT (limited performance)"

    dialect:
      value: "tsql"
      notes: |
        Same T-SQL dialect as Synapse, but with reduced surface area.
        Schema translation from DuckDB works identically.

    tuning_support:
      supported:
        - TuningType.INDEXING (clustered columnstore default)
      not_supported:
        - TuningType.DISTRIBUTION (Fabric handles automatically)
        - TuningType.PARTITIONING (limited support, auto-managed)
      rationale: |
        Fabric's managed architecture handles distribution and partitioning
        automatically. Users don't specify distribution keys like in Synapse.

  configuration_parameters:
    required:
      - workspace: "Fabric workspace name or GUID"
      - warehouse: "Warehouse item name"
    auth_options:
      service_principal:
        - client_id: "Entra App registration client ID"
        - client_secret: "Client secret"
        - tenant_id: "Entra tenant ID"
      default_credential:
        - use_default_credential: true
        - "Uses az login, environment variables, or managed identity"
    optional:
      - schema: "SQL schema (default: dbo)"
      - connect_timeout: "Connection timeout seconds (default: 30)"
      - disable_result_cache: "Disable caching for benchmarks (default: true)"

  file_structure:
    main_adapter: benchbox/platforms/microsoft_fabric.py
    test_file: tests/unit/platforms/test_microsoft_fabric_adapter.py

  dependencies:
    required:
      - pyodbc: ">=4.0.0"
      - azure-identity: ">=1.15.0"
    optional:
      - azure-storage-file-datalake: ">=12.14.0"

implementation_plan:
  phase_1_core:
    description: "Basic connectivity and query execution"
    tasks:
      - Create MicrosoftFabricAdapter class skeleton
      - Implement Entra ID authentication with azure-identity
      - Implement connection creation with access token injection
      - Implement basic query execution
      - Register in platform registry

  phase_2_data_loading:
    description: "OneLake integration for data loading"
    tasks:
      - Implement OneLake file upload using azure-storage-file-datalake
      - Implement COPY INTO command generation
      - Implement fallback INSERT loading
      - Handle Parquet and CSV file formats

  phase_3_benchmark_support:
    description: "Full benchmark execution support"
    tasks:
      - Implement schema creation with Fabric limitations
      - Implement table statistics management
      - Implement query plan capture (EXPLAIN)
      - Add result cache control

  phase_4_testing:
    description: "Test coverage"
    tasks:
      - Unit tests with mocked dependencies
      - Integration test configuration
      - Documentation

code_reuse_opportunities:
  from_synapse:
    - T-SQL dialect handling
    - COPY INTO command structure (with OneLake URLs)
    - Table optimization patterns (columnstore)
    - Error handling patterns
  from_base:
    - Schema creation with dialect translation
    - Query execution framework
    - Tuning interface integration
    - Dry-run mode support

risks_and_mitigations:
  - risk: "Fabric T-SQL limitations may break TPC queries"
    mitigation: "Test all 22 TPC-H and 99 TPC-DS queries; document any incompatibilities"
  - risk: "OneLake authentication complexity"
    mitigation: "Use DefaultAzureCredential with clear documentation"
  - risk: "COPY INTO syntax differences"
    mitigation: "Review Fabric-specific COPY INTO docs; may need Parquet-first approach"

references:
  - title: "Microsoft Fabric Warehouse Connectivity"
    url: "https://learn.microsoft.com/en-us/fabric/data-warehouse/connectivity"
  - title: "T-SQL Surface Area in Fabric"
    url: "https://learn.microsoft.com/en-us/fabric/data-warehouse/tsql-surface-area"
  - title: "OneLake Python Access"
    url: "https://learn.microsoft.com/en-us/fabric/onelake/onelake-access-python"
  - title: "COPY INTO for Fabric Warehouse"
    url: "https://learn.microsoft.com/en-us/fabric/data-warehouse/ingest-data-copy"
