id: share-tpch-datagen-with-primitives
title: ✅ Share TPCH Datagen with Primitives
category: Pre-Release High Priority Tasks (Should-Fix Before Release)
status: Completed
priority: High
impact: Eliminates duplicate TPC-H data for Primitives benchmark, saving GBs of disk space and generation time while fixing
  manifest corruption bugs.
sections:
  Summary: '"Fixed critical issues where Primitives benchmark was creating duplicate TPC-H data in primitives_sf* directories
    and corrupting shared TPC-H manifests. Implemented data sharing infrastructure allowing Primitives to automatically use
    TPC-H data from tpch_sf* directories. Added comprehensive documentation and 12 new tests covering data sharing, manifest
    isolation, and CLI orchestrator behavior."'
  Completed Tasks: '- Phase 0 - Root Cause Investigation

    - Phase 1 - Fix Implementation

    - "Phase 3 - Testing & Verification"

    - Phase 4 - Documentation'
  Files Affected: '- benchbox/base.py - Added get_data_source_benchmark() method

    - benchbox/core/primitives/benchmark.py - Implement data source declaration

    - benchbox/core/primitives/generator.py - Removed manifest mutation

    - benchbox/cli/orchestrator.py - Respect benchmark data sharing

    - pyproject.toml - Fixed duplicate section

    - tests/unit/benchmarks/test_primitives_core.py - Added 3 tests

    - tests/unit/cli/test_orchestrator_data_sharing.py - New file with 5 tests

    - tests/integration/test_primitives_tpch_manifest_isolation.py - New file with 4 tests

    - docs/usage/data-generation.md - Added data sharing documentation

    - benchbox/cli/commands/run.py - Updated CLI help text

    - CHANGELOG.md - Added migration notes'
  Success Metrics: '- "✅ Primitives generates to tpch_sf*/ by default (not primitives_sf*/)"

    - ✅ TPC-H manifest unchanged after Primitives run (benchmark field stays ''tpch'')

    - ✅ TPC-H → Primitives → TPC-H sequence works without validation errors

    - ✅ No duplicate .tbl files created when running both benchmarks

    - ✅ Custom --output still works for isolated benchmark runs

    - ✅ All 31 tests pass including bidirectional reuse tests'
  Related Commits: '- "fa78d487 - fix: enable Primitives to share TPC-H data without duplication"

    - "7cd1cf38 - chore: mark Primitives data sharing TODO phases as completed"

    - "fae21d3a - docs: document Primitives/TPC-H data sharing feature"

    - "786ec105 - chore: mark Phase 4 (Documentation) as completed in TODO"'
