id: improve-installation-instructions
title: ✅ Improve Installation Instructions
category: Pre-Release High Priority Tasks (COMPLETED)
status: Completed
priority: High
impact: Delivered reliable installation guidance, clarified optional extras, and provided tooling so users can validate their
  setup before running benchmarks
sections:
  Description: Expanded the installation materials to cover core vs. optional setups, added a platform matrix, surfaced troubleshooting
    guidance, and enhanced the CLI dependency checker with a matrix view.
  Completed Tasks: '- "✅ **Documented Core Installation Path**: Updated `README.md` and `docs/GETTING_STARTED.md` with clear
    messaging around the base DuckDB/SQLite install, including supported features and limitations."

    - "✅ **Documented Optional Extras**: Added detailed explanations of each extras group, alternative installers (`uv`, `pip`,
    `pipx`), and combination examples with the required quoting guidance."

    - "✅ **Created Installation Matrix**: Produced a Markdown matrix outlining scenarios, platforms, extras, and installation
    commands; exposed the same data through `benchbox check-deps --matrix` for terminal users."

    - "✅ **Added Troubleshooting Guidance**: Extended documentation with common failure scenarios (shell globbing, missing
    wheels, SSL issues, Windows build tools) and pointed to deeper platform guides."

    - "✅ **Enhanced CLI Tooling**: Added a `--matrix` flag to `benchbox check-deps` that renders the curated installation
    table using Rich for quick reference inside the terminal."

    - "✅ **Expanded Test Coverage**: Added targeted unit tests for the new scenario registry, matrix rows, and CLI behavior
    (including the tip for combined extras)."'
  Technical Results: '- "**Documentation**: `README.md`, `docs/GETTING_STARTED.md`, and `docs/TROUBLESHOOTING.md` now align
    on installation flows, include alternative installers, and address platform-specific hurdles."

    - "**CLI Improvements**: `benchbox check-deps` now surfaces a formatted installation matrix and remains backward compatible
    with existing flags."

    - "**Utilities**: `benchbox/utils/dependencies.py` exposes reusable scenario metadata for future docs/CLI features."

    - "**Testing**: `tests/unit/cli/test_cli_check_deps.py` and `tests/unit/utils/test_dependencies.py` cover new branches;
    targeted suites pass under `UV_CACHE_DIR=_project/.uv-cache uv run -- python -m pytest tests/unit/cli/test_cli_check_deps.py
    tests/unit/utils/test_dependencies.py`."'
  Files Modified: '- README.md (installation overhaul, matrix, troubleshooting, quick-start alignment)

    - docs/GETTING_STARTED.md (step-by-step install guidance and validation workflow)

    - docs/TROUBLESHOOTING.md (expanded installation issue coverage)

    - benchbox/utils/dependencies.py (installation scenarios + matrix helpers)

    - "benchbox/cli/main.py (new `--matrix` flag rendering)"

    - "benchbox/utils/printing.py (restored `quiet_console` helper for CLI tests)"

    - tests/unit/utils/test_dependencies.py (scenario tests and matrix assertions)

    - tests/unit/cli/test_cli_check_deps.py (matrix option assertions)'
  Success Metrics Achieved: '- ✅ Installation docs describe core vs. optional installs with explicit commands

    - ✅ Optional extras documented with multi-installer support and combination examples

    - ✅ CLI offers a matrix view so users can validate installations interactively

    - ✅ Troubleshooting guidance covers shell quoting, packaging tools, SSL, and Windows build tooling

    - ✅ New tests guard the scenario registry and CLI matrix output'
worktree: unknown
