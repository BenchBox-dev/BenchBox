id: connection-parameter-conflicts-in-tpc-test-methods
title: Connection Parameter Conflicts in TPC Test Methods
category: Bug Fixes
sections:
  Notes: '- "**Priority**: High"

    - "**Status**: ✅ Completed"

    - "**Description**: Fixed \"multiple values for keyword argument ''connection''\" errors when executing TPC power/throughput/maintenance
    tests through CLI"

    - "**Context**: The CLI orchestrator was passing connection parameters both explicitly (connection=connection) and within
    run_config dictionary, causing Python to receive duplicate keyword arguments when calling platform adapter test methods"

    - "**Root Cause**: In CLI orchestrator methods (`_execute_power_test`, `_execute_throughput_test`, `_execute_maintenance_test`),
    calls like `platform_adapter.run_power_test(benchmark, connection=connection, **run_config)` failed when run_config also
    contained a ''connection'' key"

    - "**Tasks Completed**:"

    - "**Files Affected**:"

    - "**Impact**: ✅ **RESOLVED** - TPC test methods (power, throughput, maintenance) now execute successfully without parameter
    conflicts, ensuring reliable benchmark execution through CLI interface"

    - "**Validation**: SSB power test execution progresses past connection error to actual benchmark execution phase"'
worktree: unknown
