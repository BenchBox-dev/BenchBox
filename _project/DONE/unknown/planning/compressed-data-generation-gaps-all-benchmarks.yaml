id: compressed-data-generation-gaps-all-benchmarks
title: Compressed Data Generation Gaps (all benchmarks) ✅
category: Data Quality and Compatibility Issues
sections:
  Notes: '- "Priority: High"

    - "Status: Completed"

    - "Description: Implemented durable manifest-based data generation across benchmarks and hardened compressed output handling.
    No raw `.dat`/`.tbl` artifacts remain when compression is enabled; empty compressed files are disallowed; validators now
    prefer manifest and rebuild when missing."

    - "Solution Delivered:"

    - "Files Affected:"

    - "Impact: Increases reliability of data reuse, accelerates preflight checks (manifest vs scan), and ensures consistent
    artifact formats for loaders and validators across all supported benchmarks."'
