id: switch-tpc-ds-base-dialect-from-ansi-to-netezza-2
title: Switch TPC-DS Base Dialect from ANSI to Netezza ✅
category: Core Functionality
sections:
  Notes: '- "**Priority**: Medium"

    - "**Status**: Completed (commit 2a3c78b)"

    - "**Description**: Change the default TPC-DS SQL dialect from `ansi` (uses `SELECT TOP n`) to `netezza` (uses `LIMIT
    n`) for better modern SQL compatibility. This change affects all TPC-DS query generation and should be applied consistently
    across the codebase while maintaining support for all existing dialects."

