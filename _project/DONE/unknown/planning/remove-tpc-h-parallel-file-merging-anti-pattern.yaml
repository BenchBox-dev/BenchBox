id: remove-tpc-h-parallel-file-merging-anti-pattern
title: Remove TPC-H Parallel File Merging Anti-Pattern
category: Code Quality and Technical Debt
sections:
  Notes: '- "**Priority**: High"

    - "**Status**: ✅ **COMPLETED**"

    - "**Description**: TPC-H data generator incorrectly merges parallel-generated chunk files, defeating the purpose of parallel
    generation and violating TPC-H design principles"

    - "**Root Cause**: The `_merge_parallel_files()` function was introduced in commit `8025a44` (August 13, 2025) as part
    of adding CLI parallel data generation support. This was a design mistake that goes against TPC-H specification."

    - "**Problems with Current Implementation**:"

    - "**Current Platform Support Analysis**:"

    - "**Tasks**:"

    - "**Expected Benefits**:"

    - "**Files Affected**:"

    - "**Impact**: Critical fix for TPC-H benchmark correctness and performance. Restores intended TPC-H behavior, improves
    both generation and loading performance, and aligns with database optimization best practices."

    - "**✅ COMPLETED**: January 2026, commit `8d9cf33` - Successfully removed parallel file merging anti-pattern"'
