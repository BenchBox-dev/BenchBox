id: vector-search-benchmark-support
title: "Vector Search Benchmark Support"
worktree: ai-ml-vector-search
priority: High
status: Completed
category: AI/ML Capabilities
description: |
  Implement vector search benchmarking for OLAP databases with vector/embedding
  support. Test similarity search performance across platforms that support
  vector operations: BigQuery, Snowflake, Databricks, ClickHouse, PostgreSQL
  (pgvector), and DuckDB (vss extension).

  Focus on the core vector search operations used in RAG applications:
  - k-Nearest Neighbor (kNN) exact search
  - Approximate Nearest Neighbor (ANN) search with HNSW/IVF indexes
  - Filtered vector search (metadata + vector similarity)
  - Batch vector operations

  Use the ANN-Benchmarks methodology as a reference standard for measuring
  recall@k vs queries-per-second tradeoffs.

metadata:
  tags:
  - benchmark
  - vector-search
  - ai-ml
  - embeddings
  estimated_effort: "3-4 weeks"
  created_date: "2026-02-07"
  last_updated: "2026-04-04T12:00:00"
  completed_date: "2026-04-04"

  migration_review_required: true
impact:
  business_value: |
    Vector search is the fastest-growing OLAP feature, driven by RAG applications.
    No existing tool benchmarks vector search across OLAP platforms consistently.
    This positions BenchBox uniquely in the AI/ML benchmarking space.
  user_impact: |
    Users building RAG applications can compare vector search performance across
    their existing OLAP platforms vs dedicated vector databases.
  technical_debt: |
    New benchmark module — no existing debt. Clean-slate implementation.

must_preserve:
- "All existing benchmark modules unaffected"
- "BaseBenchmark interface contract unchanged"
- "Platform registry backward compatible"

approach: |
  Follow the pattern established by h2odb and amplab benchmarks (small, focused
  benchmarks with synthetic data). Use benchbox/core/h2odb/ as a template for
  directory structure. Generate synthetic embedding vectors using numpy random
  with controlled seeds for reproducibility. Use cosine similarity as the
  default distance function (most common in RAG applications).

anti_patterns:
- "DO NOT use real ML model embeddings for benchmark data — because model inference adds uncontrolled variability — use synthetic
  vectors with known statistical properties"
- "DO NOT require vector database extensions to be pre-installed — because platforms may not have them — detect availability
  and skip gracefully with actionable error messages"
- "DO NOT benchmark index build time in the power run — because index creation is a one-time cost — measure it separately
  in the load phase"

verification:
- description: "Vector benchmark module imports"
  command: "uv run -- python -c \"from benchbox.core.vector_search import VectorSearchBenchmark; print('OK')\""
  expected_output: "OK"
- description: "Unit tests pass"
  command: "uv run -- python -m pytest tests/unit/core/vector_search/ -v --tb=short"
  expected_output: "all tests pass, 0 failures"
- description: "Benchmark appears in registry"
  command: "uv run -- python -c \"from benchbox.core import get_benchmark; print(get_benchmark('vector_search'))\""
  expected_output: "VectorSearchBenchmark instance"

