id: implement-tpc-h-queries-for-expression-family
title: Implement TPC-H Queries for Expression Family
worktree: dataframe-tpch-expression
category: Core Functionality
priority: Critical
status: Completed
completed_date: '2025-12-02'
description: 'Implement all 22 TPC-H queries using expression-based API. Single implementation

  with dialect translation works on Polars, PySpark, DataFusion (3 platforms).

  '
implementation_summary: 'All 22 TPC-H queries implemented in benchbox/core/tpch/dataframe_queries.py

  using the expression family API. Each query uses:

  - ctx.col() for column references

  - ctx.lit() for literal values

  - ctx.date_sub()/ctx.date_add() for date arithmetic

  - ctx.get_table() for table access

  - LazyFrame operations with .collect() for execution


  Complex patterns implemented:

  - Q2: Correlated subquery → join with min aggregation

  - Q11: HAVING threshold → collect + filter pattern

  - Q15: CTE → intermediate LazyFrame with max aggregation

  - Q16: NOT IN → anti-join pattern

  - Q21: EXISTS/NOT EXISTS → semi-join and anti-join

  - Q22: Substring + NOT EXISTS → str.slice + anti-join

  '
