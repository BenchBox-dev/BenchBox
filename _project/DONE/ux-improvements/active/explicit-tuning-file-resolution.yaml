      - summary: "Log template path when using --tuning tuned"
        done: true
      - summary: "Log explicit message when falling back to basic config"
        done: true
      - summary: "Show warning when expected template not found"
        done: true
    - summary: "Add --tuning show command to display resolved tuning config"
      done: true

  - phase: "Phase 2: Improve Discovery and Documentation"
    done: true
    items:
    - summary: "Add --tuning list to show available tuning templates for platform/benchmark"
      done: true
    - summary: "Improve error messages to distinguish invalid keyword vs file not found"
      done: true
    - summary: "Add help text explaining template discovery logic"
      done: true
    - summary: "Document the difference between 'tuned' and 'auto' modes"
      done: true

  - phase: "Phase 3: Explicit Path Resolution"
    done: true
    items:
    - summary: "Add BENCHBOX_TUNING_PATH environment variable for custom search paths"
      done: true
    - summary: "Support relative paths from project root (not just cwd)"
      done: true
    - summary: "Add config file option to set default tuning template"
      done: true

  - phase: "Phase 4: Testing and Validation"
    done: true
    items:
    - summary: "Add tests for verbose tuning logging output"
      done: true
    - summary: "Add tests for --tuning list and --tuning show"
      done: true
    - summary: "Add integration tests for path resolution scenarios"
      done: true

completion_summary: |
  Implemented transparent tuning file resolution system with full user visibility.

  Key deliverables:
  - New `benchbox/cli/tuning_resolver.py` module with TuningMode, TuningSource enums
  - `resolve_tuning()` function provides full transparency metadata
  - `benchbox tuning list` command to discover available templates
  - `benchbox tuning show` command to preview resolved configuration
  - BENCHBOX_TUNING_PATH environment variable for custom search paths
  - Improved error messages distinguishing invalid keywords from missing files
  - Config file support for default tuning template (tuning.default_config_file)
  - 31 unit tests covering all functionality
  - Updated help documentation with tuning discovery examples

