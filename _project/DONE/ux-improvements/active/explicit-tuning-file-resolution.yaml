impact:
  business_value: |
    Improves user confidence and reduces confusion when running benchmarks.
    Users will understand exactly what tuning configuration is applied, leading
    to more reproducible and trustworthy benchmark results.
  user_impact: |
    Users currently have no visibility into which tuning file is loaded when using
    `--tuning tuned`. This can lead to unexpected results and difficulty debugging
    why benchmarks behave differently across runs or environments.
  technical_debt: |
    The current implicit logic is spread across run.py (lines 739-768, 804-859)
    and config.py (lines 641-675). Refactoring to explicit resolution will
    consolidate this logic and make it more maintainable.

