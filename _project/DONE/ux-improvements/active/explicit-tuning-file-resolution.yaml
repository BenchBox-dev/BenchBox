  - "benchbox/cli/config.py"
  - "benchbox/cli/help.py"
  - "docs/usage/cli-quick-start.md"
  added:
  - "tests/unit/cli/test_tuning_resolution.py"

context_sections:
  "Current Behavior Analysis": |
    The CLI argument parsing at `benchbox/cli/commands/run.py:739-768` handles four cases:
    - `tuned` - Enable optimizations, trigger template discovery
    - `notuning` - Disable all optimizations (baseline)
    - `auto` - Smart defaults based on system profile
    - PATH - Path to custom YAML config

    Template auto-discovery at `benchbox/cli/commands/run.py:804-859`:
    - Constructs path: `examples/tunings/{platform}/{benchmark}_tuned.yaml`
    - If exists: silently loads it
    - If not found: prompts user (interactive) or uses basic config (non-interactive)

    Key locations:
    - CLI argument definition: run.py:252-256
    - Tuning value parsing: run.py:739-768
    - Template auto-discovery: run.py:804-859
    - File loading: config.py:641-675
    - Help text: help.py:234-238

  "User Experience Problems": |
    1. Silent template loading: User specifies `--tuning tuned` but doesn't see
       which template is loaded or know it exists

    2. Implicit fallback: If template missing, silently falls back to basic config
       without warning - user may think they're using optimized config

    3. No discovery: Users must manually find tuning files in examples/tunings/

    4. Path ambiguity: Custom paths resolved from cwd; no search paths or defaults

    5. Error confusion: Invalid path treated as invalid keyword - same error message

    6. Mode confusion: "auto" behavior not clearly documented vs "tuned"

success_metrics:
- "Users can see exactly which tuning file is loaded in CLI output"
- "Users receive warning when expected tuning template is not found"
- "--tuning list shows all available templates for current platform/benchmark"
- "--tuning show displays resolved configuration before execution"
- "Error messages distinguish between invalid keywords and missing files"
- "Documentation clearly explains tuned vs auto modes"

