context_sections:
  "Background and Motivation": |
    The current interactive wizard shows all 15+ platforms in a single table,
    which can be overwhelming. Users often know whether they want:
    - SQL mode (traditional queries) or DataFrame mode (Pandas-like operations)
    - Local execution (for development) or cloud execution (for production)

    By asking these questions upfront, we can filter the platform list to
    only show relevant options.

  "Technical Context": |
    The platform registry already tracks:
    - capabilities.supports_sql and capabilities.supports_dataframe for mode
    - category field distinguishes 'cloud' from 'analytical'/'embedded'/'distributed'

    The filtering logic can leverage PlatformRegistry.get_platform_capabilities()
    and the category field from platform metadata.

