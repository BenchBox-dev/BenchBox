      done: true
      subtasks:
      - summary: Present unique benchmarks from discovered files
        done: true
      - summary: Filter platforms based on selected benchmark
        done: true
      - summary: Filter scale factors based on benchmark + platform
        done: true
      - summary: Show max 10 most recent matching results
        done: true
