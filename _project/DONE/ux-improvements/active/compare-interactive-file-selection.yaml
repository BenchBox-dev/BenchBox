    - summary: Update CLI help text for compare command
      done: true
metadata:
  tags:
  - cli
  - ux
  - compare
  - interactive
  estimated_effort: 1-2 days
  created_date: '2025-12-15'
impact:
  user_impact: 'Users with many benchmark result files can now easily find and compare

    specific runs without manually inspecting file names or paths. The guided

    selection by benchmark/platform/scale dramatically reduces cognitive load.

    '
  technical_debt: 'Removes fragile text-based file detection heuristic that checked for

    "benchmark" or "results" keywords in file content. New implementation

    properly parses JSON and validates schema version.

    '
files_affected:
  modified:
  - benchbox/cli/commands/compare.py
  - tests/unit/cli/test_compare_command.py
context_sections:
  Current Implementation Issues: 'The _interactive_file_comparison() function (lines 489-595) has these problems:

    1. Weak file discovery: scans dirs with content-based text matching

    2. No metadata display: just shows file paths, no context

    3. No filtering: shows all results, user must manually identify files

    4. Doesn''t leverage existing find_latest_result() or load_result_file()

    '
  Proposed UX Flow: "Option A: Direct path entry (unchanged)\n  - User types file paths directly\n\nOption B: Guided selection\
    \ (new)\n  1. Choose benchmark (tpch, tpcds, ssb, etc.)\n  2. Choose platform (filtered to those with results for selected\
    \ benchmark)\n  3. Choose scale factor (filtered to available for benchmark+platform)\n  4. Select from 10 most recent\
    \ matching results\n"
success_metrics:
- Users can find matching results in 3-4 selections instead of scanning file names
- Result table shows benchmark, platform, scale, timestamp at a glance
- File discovery correctly identifies only valid BenchBox result files
- Max 10 results shown per filtered selection
sections:
  Implementation Summary: "Implemented guided file selection for the `benchbox compare` command with:\n\n1. **ResultFileMetadata\
    \ class**: Structured metadata from result files with\n   properties for formatted_timestamp and short_path display.\n\
    \n2. **_discover_result_files_with_metadata()**: Scans directories for JSON files,\n   validates schema_version and benchmark\
    \ sections, extracts metadata, and\n   returns sorted list (newest first).\n\n3. **_guided_file_selection()**: Hierarchical\
    \ selection by benchmark → platform\n   → scale factor, displaying only 10 most recent matching results.\n\n4. **_direct_file_selection()**:\
    \ Simple path entry mode for manual file selection.\n\n5. **_display_results_table()**: Rich table display with benchmark,\
    \ platform,\n   scale, timestamp, and truncated file path columns with color coding.\n\n6. **Unit tests**: 8 new tests\
    \ for ResultFileMetadata class and discovery function."
