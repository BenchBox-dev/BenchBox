impact:
  user_impact: |
    Significantly improves the platform setup experience:
    - No need to type long platform names (e.g., "fabric_warehouse")
    - Reduces typos and invalid input errors
    - Faster navigation through setup options
    - More intuitive for users unfamiliar with platform names

files_affected:
  modified:
  - "benchbox/cli/platform.py"
  added:
  - "tests/unit/cli/test_platform_setup_ux.py"

context_sections:
  "Current Behavior": |
    The setup wizard uses Rich Prompt.ask() with string choices:

    ```
    What would you like to do? [enable/disable/install/status/done] (done): install
    Which platform to install? [duckdb/datafusion/sqlite/polars/clickhouse/bigquery/...]:
    ```

    Users must type the exact platform name from a long list of options.

  "Desired Behavior": |
    Use numbered list selection:

    ```
    What would you like to do?
      1. Enable platform
      2. Disable platform
      3. Install platform
      4. Show status
      5. Done

    Select option [1-5]: 3

    Which platform to install?

    Available:
      1. DuckDB
      2. DataFusion
      3. SQLite
      ...

    Missing dependencies:
      15. BigQuery
      16. Databricks
      ...

    Select platform [1-22] or name: 16
    ```

  "Implementation Notes": |
    - Rich library has IntPrompt for integer input
    - Could use questionary or InquirerPy for advanced list selection
    - Keep backwards compatibility by accepting both numbers and names
    - Group platforms by status (enabled, available, missing) for clarity

success_metrics:
- "All setup prompts use numbered selection"
- "Both number and name input accepted for backwards compatibility"
- "Platforms grouped by availability status in selection lists"
- "Unit tests cover numbered selection logic"
