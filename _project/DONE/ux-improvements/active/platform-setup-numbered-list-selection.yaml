id: platform-setup-numbered-list-selection
title: "Add numbered list selection to platform setup wizard"
worktree: ux-improvements
priority: Medium-High
status: Completed
completed_date: "2026-01-07"
completion_summary: |
  Implemented numbered list selection for platform setup wizard:
  - Created NumberedSelectPrompt class (Rich Prompt subclass)
  - Created numbered_platform_select() helper for platform selection
  - Updated setup_platforms command to use numbered menus
  - Supports both number and name input for backwards compatibility
  - Platforms grouped by status (enabled/available/missing)
  - Added 18 unit tests covering all functionality
description: |
  The `benchbox platforms setup` interactive wizard currently requires users to type
  full platform names when selecting actions or platforms. This is error-prone and
  tedious, especially with many platforms available.

  Replace string-based prompts with numbered list selection for better UX:
  - Actions: Show numbered menu (1. Enable, 2. Disable, 3. Install, etc.)
  - Platforms: Show numbered list grouped by availability status
  - Allow both number and name input for flexibility

category: User Experience

