impact:
  business_value: |
    Improved UX makes the tool more accessible and reduces user friction.
    Consistency with `benchbox run` reduces learning curve.
  user_impact: |
    Users can run comparisons with simpler syntax.
    New users get guided through the process interactively.
    Power users can continue using explicit arguments.

success_metrics:
