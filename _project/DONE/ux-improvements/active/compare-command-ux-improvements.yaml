id: compare-command-ux-improvements
title: Compare Command UX Improvements
worktree: ux-improvements
category: Usability
priority: High
status: In Progress
description: |
  Address two UX issues with the `benchbox compare` command:

  1. **Superfluous --run flag**: The `--run` flag is awkward and inconsistent with
     `benchbox run` which doesn't require a `--run` flag. Mode should be inferred
     from the arguments provided.

  2. **No interactive guidance**: Unlike `benchbox run`, `compare` has no interactive
     wizard when called without arguments. Users must already know the exact syntax.

  Current state:
  - benchbox compare --run -p duckdb -p sqlite  # Awkward --run flag
  - benchbox compare result1.json result2.json   # File comparison
  - benchbox compare                              # Error - no guidance

  Target state:
  - benchbox compare -p duckdb -p sqlite          # Run mode (inferred from -p)
  - benchbox compare result1.json result2.json    # File mode (inferred from args)
  - benchbox compare                              # Interactive wizard

context_sections:
  "Current UX Issues":
    summary: |
      1. `--run` flag required to trigger run mode, inconsistent with `benchbox run`
      2. No interactive guidance when called without arguments
      3. Error messages don't guide user toward correct usage
      4. No system profiling or smart recommendations

  "Target UX":
    summary: |
      1. Mode inferred from arguments:
         - `-p/--platform` present → run mode (no --run needed)
         - File paths as arguments → file comparison mode
         - No arguments → interactive wizard

      2. Interactive wizard flow (when no args):
         Step 1: Choose comparison type (Run benchmarks / Compare files)
         Step 2: If run mode:
           - Select platforms (multi-select from available)
           - Select benchmark and scale
           - Configure options
         Step 3: If file mode:
           - Browse/select result files
         Step 4: Execute comparison

  "Reference: benchbox run":
    summary: |
      The `run` command has:
      - 5-step interactive wizard (system profiling, DB selection, benchmark, tuning, execution)
      - Uses DatabaseManager.select_database() for platform picker
      - Uses BenchmarkManager.select_benchmark() for benchmark picker
      - TTY detection for interactive vs non-interactive mode
      - --non-interactive flag for CI/CD environments

tasks:
  - phase: "Phase 1: Remove --run Flag"
    done: false
    items:
      - summary: "Infer mode from arguments"
        done: false
        details: |
          In compare command:
          - If -p/--platform is provided → run mode
          - If positional args (file paths) provided → file mode
          - If neither → interactive mode (or error if --non-interactive)

          Keep --run as hidden deprecated flag for backwards compatibility

      - summary: "Update help text"
        done: false
        details: |
          Remove --run from prominent help
          Update examples to show new syntax:
            benchbox compare -p duckdb -p sqlite
            benchbox compare result1.json result2.json

      - summary: "Add deprecation warning for --run"
        done: false
        details: |
          If --run is explicitly passed, show warning:
          "The --run flag is deprecated and can be omitted.
           Use: benchbox compare -p duckdb -p sqlite"

  - phase: "Phase 2: Add Interactive Wizard"
    done: false
    items:
      - summary: "Add TTY detection"
        done: false
        details: |
          Check sys.stdin.isatty() and sys.stdout.isatty()
          If not TTY and no args, show helpful error with examples

      - summary: "Create comparison type selector"
        done: false
        details: |
          First prompt: What would you like to do?
          - [1] Compare platforms (run benchmarks)
          - [2] Compare result files

      - summary: "Add platform multi-selector"
        done: false
        details: |
          For run mode:
          - Show available platforms (from --list-platforms logic)
          - Allow multi-select (minimum 2)
          - Group by type (SQL / DataFrame / Cloud)
          - Show availability status

      - summary: "Add benchmark/scale selector"
        done: false
        details: |
          Reuse logic from BenchmarkManager.select_benchmark()
          Or create simplified version for compare

      - summary: "Add file browser/selector"
        done: false
        details: |
          For file mode:
          - List recent result files
          - Or allow path input
          - Validate files exist and are valid benchmark results

  - phase: "Phase 3: Polish"
    done: false
    items:
      - summary: "Add --non-interactive flag"
        done: false
        details: |
          For CI/CD environments:
          benchbox compare --non-interactive -p duckdb -p sqlite

          Error with clear message if required args missing

      - summary: "Update documentation"
        done: false
        details: |
          Update docs/guides/platform-comparison.md
          Show new simpler syntax
          Document interactive mode

      - summary: "Add tests for new UX"
        done: false
        details: |
          Test mode inference
          Test interactive wizard (mocked)
          Test backwards compatibility

