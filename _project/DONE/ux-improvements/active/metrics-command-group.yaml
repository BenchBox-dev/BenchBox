# Metrics Command Group TODO
# Create a unified metrics command and consolidate calculate-qphh

id: metrics-command-group
title: Create metrics command group and consolidate calculate-qphh
worktree: ux-improvements
category: ux-improvements
priority: Low
status: "Completed"
created: 2025-12-14
completed: 2025-12-14
estimated_effort: small

description: |
  Create a `benchbox metrics` command group for TPC and benchmark metric
  calculations, consolidating `calculate-qphh` as the first subcommand.

  This provides a natural home for additional metrics like TPC-DS QphDS@Size,
  price-performance ratios, and cloud cost analysis.

motivation: |
  - Logical grouping for metric calculations
  - Reduces top-level CLI clutter as more metrics are added
  - Clear separation: run (execute), compare (diff), metrics (calculate)
  - Extensible for future metrics (QphDS, price-performance, cost-per-query)
  - Consistent UX pattern with other command consolidations

context:
  related_files:
    - benchbox/cli/commands/calculate_qphh.py
    - benchbox/cli/app.py
  dependencies: []

  current_usage: |
    benchbox calculate-qphh --power-results power.json --throughput-results throughput.json

  proposed_usage: |
    benchbox metrics qphh --power power.json --throughput throughput.json
    benchbox metrics qpds --power power.json --throughput throughput.json  # Future
    benchbox metrics price-performance --results results.json --price 10000  # Future

acceptance_criteria:
  - Create metrics command group using Click
  - Add qphh subcommand with same functionality as calculate-qphh
  - Mark calculate-qphh as hidden+deprecated (still functional)
  - Add migration note to calculate-qphh docstring
  - Update documentation

implementation_plan:
  phase_1:
    title: Create metrics command group
    tasks:
      - Create benchbox/cli/commands/metrics.py with Click group
      - Add qphh subcommand (move logic from calculate_qphh.py)
      - Register metrics group in app.py

  phase_2:
    title: Deprecate calculate-qphh
    tasks:
      - Mark calculate-qphh as hidden=True, deprecated=True
      - Add migration note to docstring
      - Keep functional for backwards compatibility

  phase_3:
    title: Documentation and testing
    tasks:
      - Update CLI documentation
      - Add tests for metrics command group
      - Test calculate-qphh deprecation warning

future_extensions:
  - qpds: TPC-DS QphDS@Size composite metric
  - price-performance: Cost-adjusted performance ratio
  - cost-per-query: Cloud cost analysis per query
  - efficiency: Resource utilization metrics

out_of_scope:
  - Implementing additional metrics (separate TODOs)
  - Changing QphH calculation logic
  - Auto-calculation after benchmark runs

notes: |
  This is a low-priority cleanup item. The calculate-qphh command works fine
  as-is. The consolidation becomes more valuable when additional metrics are
  added.

  Consider bumping priority when:
  - Adding TPC-DS QphDS@Size calculation
  - Adding price-performance metrics
  - Adding cloud cost analysis features
