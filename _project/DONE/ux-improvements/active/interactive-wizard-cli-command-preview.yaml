id: interactive-wizard-cli-command-preview
title: Display equivalent CLI command before benchmark execution
worktree: ux-improvements
priority: Medium
status: Completed
description: 'The interactive CLI wizard (`benchbox run` with no arguments) guides users through

  configuration but doesn''t show the equivalent command-line parameters. Users should

  see the exact CLI command that would reproduce their choices before execution starts.


  This enables:

  - Learning the CLI flags for future direct invocations

  - Scripting and automation of repeated benchmark runs

  - Documentation of benchmark configurations in runbooks

  - Easy sharing of benchmark setups with teammates

  '
category: User Experience
tasks:
  phases:
  - phase: 'Phase 1: Design'
    done: true
    items:
    - summary: Map all wizard options to their CLI flag equivalents
      done: true
      subtasks:
      - summary: Document platform selection → --platform flag
        done: true
      - summary: Document benchmark selection → --benchmark flag
        done: true
      - summary: Document scale factor → --scale flag
        done: true
      - summary: Document phase selection → --phases flag
        done: true
      - summary: Document compression settings → --compression flag
        done: true
      - summary: Document tuning mode → --tuning flag
        done: true
      - summary: Document output location → --output flag
        done: true
      - summary: Document format selection → --format flag
        done: true
      - summary: Document validation mode → --validation flag
        done: true
      - summary: Document verbosity → --verbose/-v flag
        done: true
      - summary: Document query subset → --queries flag
        done: true
      - summary: Document seed → --seed flag
        done: true
      - summary: Document force options → --force flag
        done: true
    - summary: Decide on multiline vs single-line command format
      done: true
    - summary: Design copy-friendly output format (without Rich decorations)
      done: true
  - phase: 'Phase 2: Implementation'
    done: true
    items:
    - summary: Create CommandBuilder class to accumulate CLI arguments
      done: true
    - summary: Track user choices during wizard flow
      done: true
    - summary: Generate formatted CLI command string
      done: true
    - summary: Display command in Configuration Preview section
      done: true
    - summary: Handle platform-specific flags (e.g., --catalog for Trino)
      done: true
    - summary: Omit default values from generated command for brevity
      done: true
  - phase: 'Phase 3: Testing and Polish'
    done: true
    items:
    - summary: Add unit tests for command generation
      done: true
    - summary: Test all wizard paths produce valid commands
      done: true
    - summary: Verify generated commands are copy-pasteable
      done: true
    - summary: Ensure command escaping is correct for shell
      done: true
metadata:
  tags:
  - cli
  - ux
  - interactive
  - wizard
  - documentation
  estimated_effort: Small
  created_date: '2025-12-24'
impact:
  user_impact: 'Significantly improves the learning curve and workflow:

    - New users learn CLI syntax while using the wizard

    - Experienced users can quickly capture commands for scripts

    - Benchmark configurations become easily reproducible

    - Team members can share exact benchmark setups

    '
  business_value: 'Reduces support burden and improves adoption:

    - Fewer questions about "how do I run this benchmark again?"

    - Easier onboarding for new team members

    - Better documentation of benchmark configurations

    '
files_affected:
  modified:
  - benchbox/cli/dryrun.py
  - benchbox/cli/commands/run.py
  - tests/unit/cli/test_cli_dryrun.py
context_sections:
  Current Behavior: "The interactive wizard shows a Configuration Preview before execution:\n\n```\n╭───────────────────────╮\n\
    │ Configuration Preview │\n╰───────────────────────╯\n  Platform:             ATHENA (sql mode)\n  Benchmark:        \
    \    TPC-H at scale 0.1\n  Phases:               generate, load, power\n  Queries:              All\n  Output:       \
    \        s3://benchbox-uploads/benchbox-data/\n  Compression:          zstd:3\n  Est. Time:            2-10 minutes\n\n\
    Proceed with execution? [y/n] (y):\n```\n\nThe equivalent CLI command is not shown.\n"
  Desired Behavior: "Add the equivalent CLI command to the Configuration Preview:\n\n```\n╭───────────────────────╮\n│ Configuration\
    \ Preview │\n╰───────────────────────╯\n  Platform:             ATHENA (sql mode)\n  Benchmark:            TPC-H at scale\
    \ 0.1\n  Phases:               generate, load, power\n  Queries:              All\n  Output:               s3://benchbox-uploads/benchbox-data/\n\
    \  Compression:          zstd:3\n  Est. Time:            2-10 minutes\n\nEquivalent CLI command:\nbenchbox run \\\n  \
    \  --platform athena \\\n    --benchmark tpch \\\n    --scale 0.1 \\\n    --phases generate,load,power \\\n    --output\
    \ s3://benchbox-uploads/benchbox-data/ \\\n    --compression zstd:3 \\\n    --tuning benchmark_runs/athena_tpch_tuned.yaml\
    \ \\\n    --verbose\n\nProceed with execution? [y/n] (y):\n```\n\nThe command should:\n- Use multiline format with backslash\
    \ continuation for readability\n- Omit flags that match default values (e.g., don't show --validation exact)\n- Include\
    \ the saved tuning config path if user saved one\n- Be directly copy-pasteable to terminal\n"
  Implementation Notes: '- Create a CommandBuilder class that accumulates options during wizard

    - Each wizard step updates the builder with chosen values

    - Builder has a format() method that generates the command string

    - Consider using shlex.quote() for values with special characters

    - Handle S3 paths, file paths, and other values that may need escaping

    '
success_metrics:
- CLI command displayed before execution prompt
- Command is valid and reproduces wizard choices exactly
- Default values omitted for brevity
- Command is copy-pasteable (proper escaping, no Rich formatting)
- Platform-specific flags included when applicable
completed_date: '2025-12-24'
sections:
  Implementation Summary: "The feature was already partially implemented with generate_cli_command() in\nbenchbox/cli/dryrun.py.\
    \ The implementation was completed by:\n\n1. Adding the missing `verbose` parameter to generate_cli_command() to support\n\
    \   -v and -vv flags\n\n2. Updating display_interactive_preview() to accept and pass all wizard options:\n   - force:\
    \ Force regeneration mode (all, datagen, upload)\n   - official: TPC-compliant mode flag\n   - capture_plans: Query plan\
    \ capture flag\n   - validation: Validation mode (loose, range, etc.)\n   - verbose: Verbosity level (0, 1, 2)\n\n3. Updating\
    \ the call site in run.py to pass all the new parameters from the\n   wizard context to display_interactive_preview()\n\
    \n4. Adding 21 comprehensive unit tests for generate_cli_command() covering:\n   - All individual flags and their inclusion/omission\
    \ logic\n   - Default value handling (scale=0.01, phases=[\"power\"], tuning=\"notuning\")\n   - Multiline format with\
    \ backslash continuation\n   - Full command generation with all options"
  Files Changed: '- benchbox/cli/dryrun.py: Added verbose parameter, wired up all options

    - benchbox/cli/commands/run.py: Pass all wizard context to preview function

    - tests/unit/cli/test_cli_dryrun.py: Added TestGenerateCliCommand class (21 tests)'
