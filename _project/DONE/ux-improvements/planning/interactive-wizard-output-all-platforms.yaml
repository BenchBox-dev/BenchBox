id: interactive-wizard-output-all-platforms
title: "Add --output prompt for all platforms in interactive wizard"
worktree: ux-improvements
priority: Medium
status: Completed
description: |
  Currently, the interactive wizard only prompts for output location when a cloud
  platform is selected. However, users may want to specify custom output locations
  for local platforms too, especially for:
  1. Organizing results by project
  2. Using faster storage (SSD, RAM disk)
  3. Avoiding disk space issues on default location
  4. Integration with external tools

category: User Experience

tasks:
  phases:
  - phase: "Phase 1: Implementation"
    done: false
    items:
    - summary: "Add optional output location prompt for all platforms"
      done: false
    - summary: "Show default location before prompting"
      done: false
    - summary: "Validate local paths exist/are writable"
      done: false

  - phase: "Phase 2: Testing"
    done: false
    items:
    - summary: "Test custom output with local platforms"
      done: false
    - summary: "Test default behavior when skipped"
      done: false

