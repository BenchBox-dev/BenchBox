id: interactive-wizard-execution-mode-selection
title: "Add --mode (SQL/DataFrame) selection to interactive wizard"
worktree: ux-improvements
priority: High
status: Completed
description: |
  Platforms like Polars, Pandas, DuckDB, and others support both SQL and DataFrame
  execution modes. The CLI exposes this via `--mode sql|dataframe`, but the
  interactive wizard always uses the platform's default mode.

  Users should be able to choose their execution mode to:
  1. Compare SQL vs DataFrame API performance
  2. Test DataFrame-native query implementations
  3. Use the mode that matches their production workload

category: User Experience

tasks:
  phases:
  - phase: "Phase 1: Implementation"
    done: false
    items:
    - summary: "Check if selected platform supports multiple modes"
      done: false
    - summary: "Prompt for mode selection only when platform supports both"
      done: false
    - summary: "Update database_config.execution_mode from selection"
      done: false

  - phase: "Phase 2: Testing"
    done: false
    items:
    - summary: "Test mode selection with Polars (supports both)"
      done: false
    - summary: "Test mode prompt doesn't appear for SQL-only platforms"
      done: false

