id: interactive-wizard-verbose-output
title: "Add --verbose/-v option to interactive wizard"
worktree: ux-improvements
priority: Low
status: Not Started
description: |
  The CLI supports `-v/--verbose` for detailed logging output, but the interactive
  wizard doesn't prompt for verbosity level. While not critical (most users don't
  need verbose output during interactive runs), some users may want to see detailed
  logs for debugging or understanding benchmark internals.

  Options to consider:
  - Simple toggle: "Enable verbose output? [y/N]"
  - Verbosity levels: Normal, Verbose, Debug
  - Only prompt in "advanced" configuration mode

category: User Experience

tasks:
  phases:
  - phase: "Phase 1: Implementation"
    done: false
    items:
    - summary: "Add optional verbose prompt in wizard (likely at end)"
      done: false
    - summary: "Wire to VerbositySettings for benchmark execution"
      done: false
    - summary: "Consider making it part of 'advanced options' submenu"
      done: false

  - phase: "Phase 2: Testing"
    done: false
    items:
    - summary: "Test verbose output appears when enabled"
      done: false
    - summary: "Verify default (non-verbose) behavior unchanged"
      done: false

