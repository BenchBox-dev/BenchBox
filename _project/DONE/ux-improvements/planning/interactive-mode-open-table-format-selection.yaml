impact:
  user_impact: |
    Improves the interactive experience for users who want to benchmark with
    modern data formats:
    - No need to know about --convert-format flag
    - Platform-specific recommendations guide users to optimal format choices
    - Compression and partitioning options exposed in user-friendly prompts
    - Consistent with existing interactive wizard patterns

  business_value: |
    Open table formats are a key differentiator for BenchBox. Making them
    discoverable in interactive mode increases adoption and showcases
    BenchBox's format conversion capabilities.

files_affected:
  modified:
  - "benchbox/cli/commands/run.py"
  added:
  - "benchbox/cli/format_wizard.py"
  - "tests/unit/cli/test_format_wizard.py"

context_sections:
  "Current Interactive Wizard Steps": |
    The current interactive mode has 5 steps:
    1. System Analysis - profiles CPU, memory, disk
    2. Database Selection - choose platform
    3. Benchmark Selection - choose benchmark and scale
    4. Tuning Configuration - optional tuning wizard
    5. Execution - run the benchmark

    Format selection could be added as Step 3.5 or integrated into Step 3.

  "Existing Format Support": |
    The CLI already supports format conversion via command-line flags:
    - `--convert-format parquet` - Parquet files
    - `--convert-format delta` - Delta Lake tables
    - `--convert-format iceberg` - Apache Iceberg tables
    - Compression: `delta:snappy`, `iceberg:zstd`
    - Partitioning: `iceberg:zstd,partition:year,month`

    Platform format preferences are defined in format_capabilities.py.

  "Platform Format Recommendations": |
    Intelligent defaults based on platform:
    - Databricks: Delta Lake (native format)
    - Snowflake/BigQuery/Redshift: Iceberg (native Iceberg support)
    - DuckDB: Parquet (excellent Parquet/Delta support)
    - ClickHouse: Parquet (native Parquet support)
    - SQLite/PostgreSQL: CSV (no table format support)

