id: interactive-wizard-force-regeneration
title: "Add --force option to interactive wizard"
worktree: ux-improvements
priority: High
status: Completed
description: |
  The CLI supports `--force all|datagen|upload` to force regeneration of data
  or re-upload to cloud storage. This is not accessible from the interactive
  wizard.

  Users need force options when:
  1. Testing data generation changes
  2. Recovering from interrupted runs
  3. Forcing re-upload after cloud storage changes
  4. Regenerating data with different compression

category: User Experience

tasks:
  phases:
  - phase: "Phase 1: Implementation"
    done: false
    items:
    - summary: "Detect existing data for selected benchmark/scale"
      done: false
    - summary: "Prompt for force options when data exists"
      done: false
    - summary: "Support force all, datagen, upload options"
      done: false

  - phase: "Phase 2: Testing"
    done: false
    items:
    - summary: "Test force prompts with existing data"
      done: false
    - summary: "Test force skipped when no data exists"
      done: false

