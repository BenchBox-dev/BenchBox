context_sections:
  "Current State": |
    Dry-run is only accessible via CLI flag:
    ```bash
    benchbox run --dry-run ./preview --platform duckdb --benchmark tpch
    ```

    Interactive wizard users have no equivalent capability.

  "Proposed User Flow": |
    After Step 4 (Tuning Configuration):
    ```
    Step 5 of 5: Execution

    Would you like to preview this configuration before running? [y/N]: y

    === DRY RUN PREVIEW ===
    Platform: DuckDB (SQL mode)
    Benchmark: TPC-H at scale 0.1
    Phases: power
    Estimated memory: ~1.2GB
    Estimated time: 2-5 minutes

    Equivalent CLI command:
      benchbox run --platform duckdb --benchmark tpch --scale 0.1 --phases power

    Proceed with execution? [Y/n]:
    ```

