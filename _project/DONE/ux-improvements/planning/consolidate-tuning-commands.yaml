id: consolidate-tuning-commands
title: Consolidate tuning commands under unified `tuning` group
worktree: ux-improvements
priority: Medium
status: Completed
category: Core Functionality
completed_date: '2025-12-14'
description: 'The CLI currently has two separate tuning command structures that should be unified:


  Current (inconsistent):

  - `benchbox create-sample-tuning --platform duckdb` (top-level, 20 chars)

  - `benchbox df-tuning create-sample --platform polars` (nested group)

  - `benchbox df-tuning validate config.yaml`

  - `benchbox df-tuning show-defaults --platform polars`


  Proposed (unified):

  - `benchbox tuning init --platform duckdb` (SQL platforms)

  - `benchbox tuning init --platform polars --mode dataframe` (DataFrame platforms)

  - `benchbox tuning validate config.yaml --platform polars`

  - `benchbox tuning defaults --platform polars`


  This consolidation improves discoverability, reduces cognitive load, and provides

  a consistent interface for all tuning-related operations.

  '
tasks:
  phases:
  - phase: 'Phase 1: Create unified tuning group'
    done: true
    items:
    - summary: Create new `benchbox/cli/commands/tuning_group.py` with click.group
      done: true
    - summary: Implement `tuning init` command with --mode flag (sql/dataframe)
      done: true
    - summary: Implement `tuning validate` command
      done: true
    - summary: Implement `tuning defaults` command
      done: true
  - phase: 'Phase 2: Migration and deprecation'
    done: true
    items:
    - summary: Add deprecation warnings to old commands
      done: true
    - summary: Keep old commands as hidden aliases for backwards compatibility
      done: true
    - summary: Update COMMAND_CATEGORIES in help.py
      done: true
  - phase: 'Phase 3: Documentation and cleanup'
    done: true
    items:
    - summary: Update CLI documentation
      done: true
    - summary: Update example commands in docstrings
      done: true
    - summary: Add tests for new command structure
      done: true
