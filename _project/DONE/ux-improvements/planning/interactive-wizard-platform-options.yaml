context_sections:
  "Priority Rationale": |
    Low priority because:
    - Large implementation effort (platform-specific prompts)
    - `benchbox platforms setup` already handles credential configuration
    - Power users comfortable with --platform-option flag
    - Most options have sensible defaults from credential files

  "Alternative Approaches": |
    1. Enhance `benchbox platforms setup` to handle all options
    2. Create per-platform setup wizards (e.g., `benchbox setup databricks`)
    3. Support config file that stores platform options persistently

  "Current Workaround": |
    Users can configure via CLI:
    ```bash
    benchbox run --platform databricks \
      --platform-option cluster_id=xxx \
      --platform-option catalog=main \
      --benchmark tpch
    ```

dependencies:
