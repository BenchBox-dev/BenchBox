id: results-explorer-home-theme-and-responsive-density-contract
title: "Settle Results Explorer home theme, corpus-summary, and responsive density contracts"
worktree: results-explorer-contract-followup
priority: Medium
status: Completed
completed_date: "2026-05-12"
category: User Experience

description: |
  The home leaderboard page now mixes dark chrome/filter controls with a light
  analytical workspace. The CSS documents that this is intentional, but review
  feedback and tests still treat it as a possible theme regression. The same
  route also fails a responsive budget because the first leaderboard row sits
  below the 1200 px mobile smoke threshold after the filter/summary block grew.
  Separately, a smoke test still expects copy such as `Corpus summary` and
  `PR-validated corpus` that no longer appears in the UI.

  This TODO requires the team to make explicit product decisions instead of
  applying spot CSS or test edits: either codify the mixed dark/light analytical
  workspace, or move the route to a coherent full-dark theme; either restore a
  corpus-summary affordance, or update the tests and copy contract; and either
  compact the mobile filter stack, or revise the responsive budget with a
  documented reason.

deps:
  needs:
  - results-explorer-metric-display-precision-and-scope-copy

work:
- id: w0
  summary: "Revalidate home theme, corpus summary, and mobile row position"
  status: done
  notes: |
    Capture screenshots and DOM evidence for `/results/` at desktop width and
    mobile widths used by the e2e suite. Record:
      - body/chrome/filter/table background tokens;
      - whether `Corpus summary` or `PR-validated corpus` appears;
      - first visible leaderboard row y-position;
      - filter block height and which controls are above the row;
      - the current test expectations that fail.
    Store findings in
    `_project/verification-logs/results-explorer-home-theme-and-responsive-density-contract/w0.md`.

- id: w1
  summary: "Choose the theme contract for analytical explorer surfaces"
  needs: [w0]
  status: done
  notes: |
    Decide one of:
      - mixed contract: dark marketing/chrome and dark filter shell with light
        analytical tables/charts are intentional for scanability;
      - full-dark contract: tables, charts, cards, empty states, and exports
        must use dark tokens throughout Results Explorer;
      - route-specific contract: home is mixed, but detail/query/compare pages
        follow a different named surface contract.
    Decision gate: do not change background colors or tests until the chosen
    contract is documented in the implementation PR and encoded in token or
    visual tests.

- id: w2
  summary: "Resolve corpus-summary test and copy contract"
  needs: [w0]
  status: done
  notes: |
    Decide whether the page should restore a compact corpus-summary region or
    whether the stale smoke test should be updated. If restored, the section
    must use current scope terms from the metric/scope TODO and fit the density
    budget. If removed, tests must assert the current intentional summary copy
    instead of legacy strings.

- id: w3
  summary: "Set and implement the mobile density budget"
  needs: [w0, w1, w2]
  status: done
  notes: |
    Define a concrete mobile acceptance rule, such as `first leaderboard row is
    visible by y <= 1200 at the canonical mobile viewport` or a new documented
    threshold. Then implement the smallest layout change needed:
      - collapse advanced filters behind a disclosure on mobile;
      - reduce duplicated summary rows;
      - make date/trust/tuning controls wrap more tightly;
      - keep `Start a comparison` reachable without pushing the table too far
        down.
    Decision gate: if the team chooses a threshold above 1200 px, document why
    the extra scroll is acceptable for database engineers comparing results.

- id: w4
  summary: "Add visual/token and responsive regression tests"
  needs: [w1, w2, w3]
  status: done
  notes: |
    Add tests that assert:
      - the chosen theme contract on home and one detail route;
      - the presence or intentional absence of corpus-summary copy;
      - first leaderboard row mobile y-position under the accepted budget;
      - filter controls remain reachable and labelled after compaction.
    Browser-check desktop and mobile home after implementation.

prior_art:
- "results-explorer/src/index.css documents the current dark chrome plus light analytical workspace contract."
- "results-explorer/src/pages/Home.tsx renders the leaderboard hero, filter shell, summary copy, and table."
- "results-explorer/e2e/responsive.spec.ts contains the mobile row-position smoke expectation."
- "results-explorer/e2e/routes/home.spec.ts or equivalent smoke tests contain the stale corpus-summary expectations."
- "_project/DONE/results-explorer-followup-todo-review/planning/results-explorer-surface-theme-and-density-contract.yaml addressed
  earlier theme/density issues."

must_preserve:
- "Theme changes must maintain contrast for numeric tables, heat cells, selected filters, and disabled controls."
- "Mobile compaction must not remove benchmark, scale, phase, trust, tuning, date, or comparison entry controls."
- "Tests must encode product intent, not old screenshots."
- "No layout change should hide the first comparison entrypoint behind horizontal scroll."

approach: |
  First decide the visual and responsive contract. Then either update tests to
  match documented intent or change the layout to meet the existing contract.
  Keep the changes home-scoped unless the chosen theme contract explicitly
  applies to all Results Explorer routes.

anti_patterns:
- "DO NOT darken only one section to satisfy a screenshot comment without checking table/chart contrast."
- "DO NOT delete responsive assertions just because the row-position test is currently failing."
- "DO NOT restore obsolete corpus-summary copy if its counts conflict with the current scope model."
- "DO NOT hide primary filters or compare entrypoints on mobile."

verification:
- description: "Home route tests pass"
  command: "cd results-explorer && npm test -- --run src/pages/__tests__/Home.test.tsx"
  expected_output: "home theme, copy, and density unit/component tests pass"
- description: "Responsive e2e smoke passes"
  command: "cd results-explorer && npx playwright test tests/e2e/responsive.spec.ts --project=chromium"
  expected_output: "responsive smoke passes with documented row-position budget"
- description: "Home smoke/e2e passes"
  command: "cd results-explorer && npx playwright test tests/e2e/home.spec.ts --project=chromium"
  expected_output: "home smoke reflects the chosen corpus-summary contract"
- description: "Browser evidence confirms desktop and mobile home layout"
  command: "rg -n \"PASS|FAIL|theme|corpus|first row|mobile|density\" _project/verification-logs/results-explorer-home-theme-and-responsive-density-contract/"
  expected_output: "verification log includes desktop and mobile evidence"

scope_limit:
  only_modify:
  - "results-explorer/src/index.css"
  - "results-explorer/src/pages/Home.tsx"
  - "results-explorer/src/pages/__tests__/Home.test.tsx"
  - "results-explorer/e2e/routes/home.spec.ts"
  - "results-explorer/e2e/responsive.spec.ts"
  - "_project/verification-logs/results-explorer-home-theme-and-responsive-density-contract/"
  do_not_modify:
  - "results-explorer/public/data/"
  - "benchbox/core/explorer_pipeline/"

success_metrics:
- "Home theme behavior is documented and enforced by tests."
- "Corpus-summary expectations match the current product contract."
- "The first leaderboard row meets the accepted mobile visibility budget."
- "Primary filters and compare entrypoints remain reachable on mobile."

metadata:
  tags:
  - results-explorer
  - theme
  - responsive
  - home
  estimated_effort: "Medium (1-2 days)"
  created_date: "2026-05-12"

impact:
  business_value: |
    Prevents recurring theme and density churn by turning screenshot feedback
    into explicit visual and responsive contracts.
  user_impact: |
    Users get a coherent home page that stays scannable on desktop and usable on
    mobile without ambiguous theme behavior.
  technical_debt: |
    Replaces stale smoke assertions with tests tied to documented product
    decisions.
