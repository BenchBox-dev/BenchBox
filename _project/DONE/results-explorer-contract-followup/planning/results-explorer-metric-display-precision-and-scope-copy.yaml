id: results-explorer-metric-display-precision-and-scope-copy
title: "Repair metric precision and leaderboard scope copy regressions"
worktree: results-explorer-contract-followup
priority: High
status: Completed
completed_date: "2026-05-12"
category: User Experience

description: |
  The latest review found two remaining trust problems in metric and scope
  communication. Result detail pages can show raw exact power-score precision in
  hero values, for example `11,636.652993864305`, while adjacent explorer
  surfaces show rounded scan values. The leaderboard home can also say
  `5 ranked, 2 published unranked` and then `Full leaderboard scope has 7 ranked
  platform IDs`, which contradicts its own count semantics.

  This TODO closes the gap between raw audit precision, scan-readable display
  precision, and corpus/ranking scope copy. It must preserve exact values for
  receipts, exports, sorting, and audit trails while using readable formatting
  and truthful count labels in the UI.

deps:
  needs: []

work:
- id: w0
  summary: "Revalidate precision and scope-copy examples"
  status: done
  notes: |
    Capture evidence from:
      - a result-detail page whose primary metric is a large power score;
      - `/results/` in the current default filter state;
      - `/results/` after changing benchmark, scale, phase, trust, tuning, and
        date filters;
      - any tooltips or exact-value affordances for power score cells.
    Record the raw value, visible value, title/aria text, sort behavior, and
    scope copy in
    `_project/verification-logs/results-explorer-metric-display-precision-and-scope-copy/w0.md`.

- id: w1
  summary: "Define display precision tiers for scan, comparison, and audit contexts"
  needs: [w0]
  status: done
  notes: |
    Define explicit formatting rules:
      - scan contexts such as hero cards, leaderboard cells, chart labels, and
        compare cards use compact rounded values with meaningful significant
        digits;
      - comparison contexts keep enough precision for ratios and deltas without
        showing raw binary/float noise;
      - audit contexts such as receipts, exports, exact-value titles, and raw
        JSON retain exact source values.
    Decision gate: do not use `fmtScoreExact` in scan contexts unless the UI
    labels the value as exact and provides a reason for the precision.

- id: w2
  summary: "Apply the precision contract to result detail without changing raw data"
  needs: [w1]
  status: done
  notes: |
    Update result-detail primary metric display so large power scores use the
    same scan-readable formatting as other explorer surfaces. Provide exact
    precision in a title, receipt row, details disclosure, or audit section if
    needed. Keep sorting/comparison/export values raw.

- id: w3
  summary: "Define and test leaderboard scope count semantics"
  needs: [w0]
  status: done
  notes: |
    Define separate names for:
      - ranked platform count;
      - published unranked platform count;
      - total published platform count;
      - full corpus platform count;
      - public coverage count under current filters.
    Update home copy so it never describes a total that includes unranked items
    as `ranked`. Add invariant tests that compute the displayed counts from the
    same source rows and fail on contradictory wording.

- id: w4
  summary: "Add tests and browser evidence for precision and scope copy"
  needs: [w2, w3]
  status: done
  notes: |
    Add unit/component tests for:
      - result-detail power-score hero values do not show long exact decimals;
      - exact values remain available in an explicit audit context;
      - leaderboard scope text uses ranked/unranked/total terms correctly;
      - count grammar handles singular, plural, zero, and filtered states.
    Browser-check the result detail and home routes at desktop width.

prior_art:
- "results-explorer/src/utils.ts exposes `fmtScore`, `fmtScoreCompact`, and `fmtScoreExact`."
- "results-explorer/src/lib/metricFormatters.ts centralizes semantic metric formatting."
- "results-explorer/src/pages/ResultDetail.tsx currently uses exact score formatting for the primary metric."
- "results-explorer/src/pages/Home.tsx computes and renders leaderboard ranked, unranked, and coverage copy."
- "_project/DONE/results-explorer-followup-todo-review/planning/results-explorer-metric-formatting-contract.yaml established
  the broader metric formatting contract."
- "_project/DONE/results-explorer-followup-todo-review/planning/results-explorer-leaderboard-scope-filter-contract.yaml established
  earlier leaderboard scope semantics."

must_preserve:
- "Raw metric values must remain unchanged in data, sorting, comparison math, and exports."
- "Exact precision must remain available in receipt/audit contexts when it was previously available."
- "Leaderboard copy must match the filtered data actually rendered."
- "Scope count changes must not hide unranked or unpublished states."

approach: |
  Add narrow contract tests around the exact regressions before patching copy.
  Then route result-detail scan values through the shared formatter and make
  leaderboard scope copy consume named count fields instead of overloaded totals.

anti_patterns:
- "DO NOT round raw data before computing ranks, ratios, or comparisons."
- "DO NOT remove exact values entirely just to simplify display."
- "DO NOT rename a mixed total as `ranked`."
- "DO NOT patch one sentence without adding count invariants for other filter states."

verification:
- description: "Metric formatting tests pass"
  command: "cd results-explorer && npm test -- --run src/__tests__/utils.test.ts src/lib/__tests__/metricFormatters.test.ts
    src/pages/__tests__/ResultDetail.test.tsx"
  expected_output: "result-detail scan and exact precision tests pass"
- description: "Home scope tests pass"
  command: "cd results-explorer && npm test -- --run src/pages/__tests__/Home.test.tsx src/components/__tests__/MetaLeaderboard.test.tsx"
  expected_output: "leaderboard scope count and copy tests pass"
- description: "Browser evidence confirms precision and scope copy"
  command: "rg -n \"PASS|FAIL|power score|exact|ranked|unranked|coverage\" _project/verification-logs/results-explorer-metric-display-precision-and-scope-copy/"
  expected_output: "verification log includes result-detail and home route evidence"

scope_limit:
  only_modify:
  - "results-explorer/src/utils.ts"
  - "results-explorer/src/__tests__/utils.test.ts"
  - "results-explorer/src/lib/metricFormatters.ts"
  - "results-explorer/src/lib/__tests__/metricFormatters.test.ts"
  - "results-explorer/src/pages/ResultDetail.tsx"
  - "results-explorer/src/pages/Home.tsx"
  - "results-explorer/src/pages/__tests__/ResultDetail.test.tsx"
  - "results-explorer/src/pages/__tests__/Home.test.tsx"
  - "results-explorer/src/components/MetaLeaderboard.tsx"
  - "results-explorer/src/components/__tests__/MetaLeaderboard.test.tsx"
  - "_project/verification-logs/results-explorer-metric-display-precision-and-scope-copy/"
  do_not_modify:
  - "results-explorer/public/data/"
  - "benchbox/core/explorer_pipeline/"

success_metrics:
- "Result-detail hero metrics use scan-readable precision while preserving exact audit values."
- "Leaderboard scope copy never calls mixed ranked/unranked totals `ranked`."
- "Count terms are backed by named fields and invariant tests."
- "Filter changes do not produce contradictory scope copy."

metadata:
  tags:
  - results-explorer
  - metrics
  - precision
  - leaderboard-scope
  estimated_effort: "Small-Medium (1 day)"
  created_date: "2026-05-12"

impact:
  business_value: |
    Reduces user skepticism caused by noisy numeric precision and contradictory
    leaderboard scope claims.
  user_impact: |
    Users see readable metrics and can understand whether counts refer to
    ranked, unranked, public, or total corpus coverage.
  technical_debt: |
    Removes overloaded scope totals and clarifies display-vs-audit precision.
