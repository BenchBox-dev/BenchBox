    summary: |
      Existing users have SQL workflows. Some platforms support both modes
      (DuckDB SQL + Python API, DataFusion SQL + DataFrame). Need smooth
      migration path without breaking existing functionality.
  - name: Solution Approach
    summary: |
      Add --mode flag to CLI (sql|dataframe), maintain SQL as default,
      ensure result schemas compatible, provide migration documentation.
  impact: |
    CRITICAL - Without this, we risk breaking existing users or creating
    confusing UX. Essential for smooth adoption.
  tasks:
  - phase: "Phase 0.15: CLI Mode Selection"
    items:
    - summary: "Add --mode flag to benchbox CLI"
