            performance_ratios: dict[str, float]  # platform -> speedup vs baseline
            statistical_significance: dict[str, float]  # platform -> p-value
            confidence_intervals: dict[str, tuple[float, float]]
            insights: list[str]  # Generated insight strings
    - summary: Implement result loading and validation
      details: |
