      SQL mode: data loaded into database via INSERT/COPY.
      DataFrame mode: data loaded into... what? Memory? Files? Format?
      Each platform prefers different formats: Pandas (CSV), Polars (Parquet/streaming),
      PySpark (Parquet/HDFS), cuDF (Parquet/GPU-direct).
  - name: Solution Approach
    summary: |
      Create DataFrameDataLoader that generates/locates data in platform-preferred
      format, integrates with DataSourceResolver for data generation, and loads
      into platform-specific DataFrames.
