  - change_type: Modified
    details: '"CLI exporter & docs (`benchbox/cli/output.py`, docs)"'
  - change_type: Updated
    details: Tests referencing query_details or legacy schema versions
  - change_type: Enhanced
    details: Security testing in test suite
  - change_type: New
    details: Security documentation and guidelines
- title: NYC Taxi OLAP Benchmark (Core Implementation)
  worktree: benchmark-expansion
  category: '"Technical Debt & Refactoring"'
  priority: High
  status: In Progress
  description: Implement NYC Taxi benchmark using real-world NYC taxi trip data for OLAP analytics, providing authentic multi-dimensional workloads with temporal and basic geospatial dimensions
  impact: Adds realistic transportation analytics benchmark using authentic data patterns, provides multi-dimensional OLAP workloads (temporal, basic geographic, financial), enables performance comparison against industry-standard datasets, complements existing synthetic benchmarks with real-world data complexity
  tasks:
  - phase: '"Phase 1: Core Infrastructure (Week 1-2)"'
    done: false
    items:
    - summary: '"Create `benchbox/core/nyctaxi/` directory structure following BenchBox patterns"'
    - summary: '"Implement `schema.py` with core trip table and taxi zones dimension table definitions"'
    - summary: '"Create `benchmark.py` inheriting from `BaseBenchmark` with scale factor support"'
    - summary: '"Implement `downloader.py` for TLC data acquisition with resumable downloads and validation"'
    - summary: Add scale factor sampling (0.01 to 100.0) for datasets from 11MB to 111GB (300K to 3B trips, 7 hours to full dataset)
    - summary: '"Create basic test framework in `tests/unit/test_nyctaxi.py`"'
  - phase: '"Phase 2: Data Processing Pipeline (Week 3-4)"'
    done: false
    items:
    - summary: '"Implement `generator.py` for CSV/Parquet processing and data cleaning"'
    - summary: Add support for multiple TLC data formats and schema evolution over time
    - summary: Create data validation, outlier filtering, and quality reporting
    - summary: Support compressed data handling (gzip) with efficient processing
    - summary: Implement database integration for DuckDB, ClickHouse, PostgreSQL with optimized loading
    - summary: Add tuning configurations and indexing strategies for each platform
  - phase: '"Phase 3: Query Suite Development (Week 5-6)"'
    done: false
    items:
    - '"summary: \\"Create `queries.py` with 25 representative OLAP queries adapted from existing benchmarks:\\""'
  files_affected:
  - change_type: New
    details: '"Complete `benchbox/core/nyctaxi/` implementation"'
  - change_type: New
    details: '"`benchbox/nyctaxi.py` top-level convenience class"'
  - change_type: New
    details: Example scripts and platform-specific tuning configurations
  - change_type: Modified
    details: CLI benchmark registration, platform adapter integration
  - change_type: New
    details: Comprehensive test suite and validation framework
  additional_lists:
    Query Sources:
    - Todd Schneider's nyc-taxi-data repository (PostgreSQL/ClickHouse analytics)
    - ClickHouse official documentation queries
    - DuckDB taxi dataset benchmarks
    - Mark Litwintschik's database performance analyses
    - Additional custom queries for comprehensive OLAP coverage
  extra_fields:
    Data Source: '"NYC Taxi & Limousine Commission (TLC) trip records - real transportation data from 2009-present (3+ billion trips, 111GB compressed)"'
    Technical Approach: Download and process real TLC data rather than synthetic generation, with deterministic sampling for reproducible scale factors and comprehensive data validation
- title: NYC Taxi OLAP Benchmark (Advanced Geospatial Extension)
  worktree: benchmark-expansion
  category: '"Technical Debt & Refactoring"'
  priority: Medium
  status: In Progress
  description: Add advanced geospatial analytics capabilities to the NYC Taxi benchmark using platform-specific spatial functions, extending beyond basic lat/long coordinates to full geometric analysis
  context_sections:
  - name: Context
    summary: SQLGlot does not support geospatial function translation between platforms, requiring database-specific query implementations for advanced spatial analysis
  impact: Enables comprehensive geospatial analytics benchmarking using real transportation data, provides platform-specific spatial performance evaluation, adds advanced geographic analysis capabilities missing from current benchmark suite, supports realistic location-based analytics patterns common in modern data applications
  tasks:
  - phase: Platform-Specific Spatial Support
    done: false
    items:
    - summary: '"Implement PostGIS integration for PostgreSQL with full ST_* function support"'
    - summary: Add DuckDB Spatial extension integration with geometry type handling
    - summary: Create ClickHouse geo function implementations using native geographic functions
    - summary: Add BigQuery/Snowflake spatial capabilities where available
    - summary: Implement platform capability detection for spatial feature support
  - phase: Advanced Spatial Schema Extensions
    done: false
    items:
    - summary: Extend schema with GEOMETRY/POINT columns for platforms supporting spatial types
    - summary: Add spatial indexing configurations (R-tree, spatial B-tree) per platform
    - summary: Create taxi zone polygon data integration for area-based analysis
    - summary: Implement coordinate reference system handling and transformations
    - summary: Add support for both 2D coordinates and optional elevation data
  - phase: Spatial Query Suite Development
    done: false
    items:
    - summary: '"Create 10-15 advanced spatial queries with database-specific implementations:"'
  technical_requirements:
  - category: Platform Support
    details: PostGIS/PostgreSQL, DuckDB Spatial, ClickHouse geo functions, optional BigQuery/Snowflake
  - category: Manual Translation
    details: Database-specific query implementations due to SQLGlot limitations
  - category: Spatial Types
    details: GEOMETRY, POINT, POLYGON support where available, fallback to lat/long coordinates
  - category: Index Support
    details: Spatial indexing configuration and optimization per platform
  - category: Data Integration
    details: External geographic data loading and reference datasets
  files_affected:
  - change_type: Enhanced
    details: '"`benchbox/core/nyctaxi/schema.py` with spatial type support"'
  - change_type: Enhanced
    details: '"`benchbox/core/nyctaxi/queries.py` with platform-specific spatial queries"'
  - change_type: Enhanced
    details: '"`benchbox/core/nyctaxi/generator.py` with spatial data processing"'
  - change_type: New
    details: Platform-specific spatial optimization configurations
  - change_type: Enhanced
    details: Test suite with spatial validation and cross-platform testing
  - change_type: New
    details: Spatial-specific examples and documentation
  additional_lists:
    Query Sources:
    - PostGIS NYC taxi geospatial analysis examples
    - ClickHouse geo function documentation and examples
    - DuckDB spatial extension tutorials and benchmarks
    - Academic geospatial database research using taxi data
    - Original custom spatial analytics queries for comprehensive coverage
