- title: Query Plan Comparison Engine
  worktree: query-plan-comparison
  category: Core Functionality
  priority: High
  status: Not Started
  description: |
    Implement algorithms for comparing query plans across platforms, runs, and
    queries. Includes logical plan comparison (tree diff), physical plan comparison,
    and similarity scoring (tree edit distance). Supports three comparison scenarios:
    cross-platform, cross-run, and cross-query.

    **Comparison Scenarios**:
    1. Cross-platform: Compare DuckDB vs DataFusion for same query
    2. Cross-run: Detect plan regressions between benchmark runs
    3. Cross-query: Find structurally similar queries

  context_sections:
  - name: Algorithms
    summary: |
      - Tree Diff: Recursive tree traversal with operator matching (O(n×m))
      - Similarity Score: Zhang-Shasha tree edit distance (O(n²×m²), pruned)
      - Physical Comparison: Property-based diff (O(n))

  - name: Comparison Metrics
    summary: |
      - Structural similarity (0.0-1.0): % of matching operators
      - Logical differences: Missing/added/changed operators
      - Physical differences: Cost estimate changes, operator type changes
      - Plan fingerprint equality: Fast exact match check

  impact: |
    HIGH - Core value proposition of the feature. Enables meaningful analysis of
    query plans across different contexts. Comparison engine is independent of
    capture mechanism.

  dependencies:
  - workstream: "Query Plan Core Infrastructure (Models & Storage)"
    reason: "Requires QueryPlanDAG model and plan fingerprints"

  tasks:
  - phase: "Phase 4.1: Comparison Framework"
    description: Base classes and comparison result models
    items:
    - summary: "Create benchbox/core/results/query_plan_comparison.py"
      done: false
    - summary: "Define PlanComparisonResult dataclass"
      done: false
      details: |
        @dataclass
        class PlanComparisonResult:
            plan1_id: str
            plan2_id: str
            are_identical: bool
            fingerprints_match: bool
            logical_differences: list[str]
            physical_differences: list[str]
            similarity_score: float  # 0.0 to 1.0
            cost_difference: float | None
            visualization_diff: str  # ASCII tree diff
    - summary: "Create QueryPlanComparator class"
      done: false
      details: |
        class QueryPlanComparator:
            def compare_plans(plan1, plan2) -> PlanComparisonResult
            def compare_logical_plans(plan1, plan2) -> dict
            def compare_physical_plans(plan1, plan2) -> dict
            def compute_similarity(plan1, plan2) -> float

  - phase: "Phase 4.2: Logical Plan Comparison (Tree Diff)"
