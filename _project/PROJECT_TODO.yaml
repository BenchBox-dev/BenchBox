- title: Add TPC-H Skew Benchmark Implementation
  worktree: benchmark-expansion
  category: Core Functionality
  priority: Medium
  status: In Progress
  description: '"Implement TPC-H Skew benchmark based on the research published at https://www.tpc.org/tpctc/tpctc2011/slides_and_papers/introducing_skew_into_the_tpc_h_benchmark.pdf and reference implementation at https://github.com/YSU-Data-Lab/TPC-H-Skew"'
