entries:
- title: Result Object Migration (BenchmarkResult → BenchmarkResults)
  worktree: result-object-migration
  category: Pre-Release High Priority Tasks (Should-Fix Before Release)
  priority: High
  status: Completed
  description: 'Consolidate on the lifecycle-aware BenchmarkResults type by eliminating legacy BenchmarkResult usage in CLI execution paths, data-only pipeline flows, exporters, and documentation.

    '
  context_sections:
  - name: Legacy Baseline
    summary: 'BenchmarkResult in benchbox/core/config.py is limited to CLI error handling with minimal metadata, lacking phase tracking, platform context, and validation details.

      '
  - name: Target State
    summary: 'BenchmarkResults from benchbox/core/results/models.py already power platform adapters and lifecycle runners, providing rich metadata, execution phases, and validation tracking.

      '
  - name: Risk Profile
    summary: 'Migration impacts CLI pipelines, exporter schemas, and widespread imports; regressions could trigger CLI output changes or schema mismatches if not carefully validated.

      '
  impact: HIGH - Aligns all result generation on the canonical model, reduces duplication, and unlocks exporter/type simplification ahead of release.
  research_value: 'Establishes pre/post migration JSON export baselines to confirm structural parity and surface unexpected regressions early.

    '
  tasks:
  - phase: Phase 1 - Extend BaseBenchmark Helper
    description: 'Add a minimal BenchmarkResults factory for error and interrupt scenarios without changing existing workflows.

      '
    items:
    - summary: Implement BaseBenchmark.create_minimal_benchmark_result helper.
      done: true
    - summary: Unit test minimal result creation covering validation status and metadata defaults.
      done: true
  - phase: Phase 2 - Migrate CLI Error Handlers
    description: 'Replace BenchmarkResult constructions during KeyboardInterrupt and exception handling in benchbox/cli/execution.py.

      '
    items:
    - summary: Cache benchmark_instance on BenchmarkExecutor for downstream error contexts.
      done: true
    - summary: Use create_minimal_benchmark_result in KeyboardInterrupt and exception flows.
      done: true
    - summary: Verify CLI output formatting parity for error cases.
      done: true
  - phase: Phase 3 - Update data_only Pipeline
    description: 'Emit enhanced benchmark results for data_only mode, mirroring lifecycle runner patterns.

      '
    items:
    - summary: Replace legacy BenchmarkResult with create_enhanced_benchmark_result invocation.
      done: true
    - summary: Populate phases and execution metadata consistent with runner expectations.
      done: true
    - summary: Validate data_only exports against schema v1.0 baseline fixtures.
      done: true
  - phase: Phase 4 - Remove Legacy BenchmarkResult
    description: 'Delete the legacy class definition and update all imports and type hints to rely solely on BenchmarkResults.

      '
    items:
    - summary: Remove benchbox/core/config.py BenchmarkResult definition and related helpers.
      done: true
    - summary: Update imports and type hints across 60+ files to reference BenchmarkResults only.
      done: true
    - summary: Simplify exporter build_canonical_payload signature (drop Union types).
      done: true
    - summary: Run full pytest suite and integration tests to confirm no regressions.
      done: true
  - phase: Phase 5 - Documentation and Cleanup
    description: 'Document the migration and communicate breaking changes to contributors and early adopters.

      '
    items:
    - summary: Author docs/migration/result_object_migration.md with migration guidance and examples.
      done: true
    - summary: Add CHANGELOG entry covering removal of BenchmarkResult and new helper usage.
      done: true
    - summary: Update exporter documentation and samples to reflect canonical result type.
      done: true
    - summary: Remove lingering BenchmarkResult references in examples and schema notes.
      done: true
  technical_requirements:
  - category: Validation
    items:
    - '"Maintain 100% JSON schema v1.0 validation pass rate before and after migration."'
  - category: Testing
    items:
    - '"Full pytest suite passes; targeted CLI tests (`tests/unit/cli/test_cli_*.py`) stay green."'
  - category: Compatibility
    items:
    - CLI error output remains unchanged despite internal result type migration.
  - category: Documentation
    items:
    - Migration guide includes follow-along code snippets for new helper usage.
  - category: Tooling
    items:
    - Baseline vs migrated JSON exports captured for regression comparison.
  files_affected:
  - change_type: Modified
    paths:
    - benchbox/core/base_benchmark.py
    - benchbox/cli/execution.py
    - benchbox/cli/execution_pipeline.py
    - benchbox/core/results/exporter.py
    - benchbox/core/config.py
  - change_type: Added
    paths:
    - docs/migration/result_object_migration.md
  metadata:
    owners:
    - '"@benchbox-maintainers"'
    tags:
    - results
    - cli
    due_date: '2024-08-15'
  open_questions:
  - summary: '"Should we provide a deprecated shim for external BenchmarkResult imports despite pre-release status?"'
  - summary: '"Should error cases hydrate system_profile within create_minimal_benchmark_result?"'
  - summary: '"Do we add explicit regression tests asserting BenchmarkResult import fails post-migration?"'
- title: Security Audit
  worktree: security-hardening
  category: Pre-Release Medium Priority Tasks (Nice-to-Have)
  priority: Medium
  status: In Progress
  description: While credential handling patterns are good, no formal security review has been performed, which is important before public release
  context_sections:
  - name: Context
    summary: Security review is essential for any tool that handles credentials and connects to databases
  impact: MEDIUM - Ensures security before public release and builds user trust
  tasks:
  - phase: Credential Handling Review
    done: false
    description: Audit all credential management
    items:
    - summary: Review how credentials are stored, passed, and used
    - summary: Ensure credentials are never logged or exposed
    - summary: Verify credential encryption and secure storage practices
    - summary: Test credential handling across all platform adapters
  - phase: Input Validation Review
    done: false
    description: Audit all user input handling
    items:
    - summary: Review SQL injection prevention measures
    - summary: Test input sanitization and validation
    - summary: Verify query parameter handling is secure
    - summary: Test CLI input validation and safety
  - phase: Cloud Storage Security
    done: false
    description: Review cloud credential and data handling
    items:
    - summary: Audit cloud storage credential management
    - summary: Review data transmission security (encryption in transit)
    - summary: Verify cloud API usage follows security best practices
    - summary: Test cloud storage access controls and permissions
  - phase: Dependency Security
    done: false
    description: Review third-party dependency security
    items:
    - summary: Audit all dependencies for known vulnerabilities
    - summary: Set up automated dependency security scanning
    - summary: Review dependency update policies and procedures
    - summary: Document security-relevant dependency choices
  - phase: Security Testing
    done: false
    description: Create security-focused tests
    items:
    - summary: Add tests for credential handling edge cases
    - summary: Test input validation with malicious inputs
    - summary: Add tests for secure error handling (no information leakage)
    - summary: Create security regression testing
  success_metrics:
  - No security vulnerabilities identified in audit
  - Comprehensive security testing in place
  - Security best practices documented
  - Automated security scanning configured
  files_affected:
  - change_type: Review
    details: All credential handling code in platform adapters
  - change_type: Review
    details: Input validation throughout CLI and core modules
- title: Stabilize Full Test Suite Failures
  worktree: testing-improvements
  category: Pre-Release High Priority Tasks (Should-Fix Before Release)
  priority: High
  status: Completed
  description: '"COMPLETED: Schema v1.0 migration test failures have been resolved. CLI exporter tests (30/30 passing) and result schema tests (12/12 passing) now pass. Test collection works correctly (3576 tests, 0 errors). Documentation exists at docs/testing.md covering platform smoke suites and dependency setup. Remaining work moved to separate TODO items for optional dependency handling and test suite optimization.

    "'
  tasks:
  - phase: Root Cause Analysis
    items:
    - summary: Update CLI exporter tests to expect schema_version "1.0" and canonical field names.
      done: true
    - summary: Review failing suites and categorise missing dependencies vs legitimate breakages.
      done: true
  - phase: Fixes
    items:
    - summary: Remove the legacy export path/flags and align fixtures with the canonical schema.
      done: true
    - summary: Add skip/xfail markers and documentation for tests that require external services.
      done: true
  - phase: '"Verification & Docs"'
    items:
    - summary: '"Run targeted suites (`tests/unit/cli/test_cli_output.py`, `tests/unit/core/test_result_schema.py`)."'
      done: true
    - summary: '"Document recommended pytest commands and dependency setup in `docs/development/testing.md`."'
      done: true
  technical_requirements:
  - category: Reliability
    items:
    - '"Default `uv run -- python -m pytest` run should pass or skip gracefully with clear messaging."'
  - category: Documentation
    items:
    - Contributor docs describe dependency prerequisites and test profiles.
  files_affected:
  - change_type: Modified
    paths:
    - tests/unit/cli/test_cli_output.py
    - tests/unit/core/test_result_schema.py
  - change_type: Updated
    paths:
    - docs/development/testing.md
  metadata:
    owners:
    - '"@benchbox-maintainers"'
    tags:
    - testing
    - ci
- title: Canonicalize Result Schema
  worktree: release-readiness
  category: Pre-Release High Priority Tasks (Should-Fix Before Release)
  priority: High
  status: Completed
  description: Align all exporters, docs, and tests on a single benchmark result JSON schema version 1.0 and remove legacy version branching.
  context_sections:
  - name: Outcome
    summary: Exporters now emit schema v1.0 exclusively, tests assert canonical fields, and documentation (including a migration note) reflects the new layout.
  impact: HIGH - Simplifies tooling, avoids broken expectations, and clarifies public contracts.
