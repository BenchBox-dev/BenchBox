- title: Design and Implement Core DataFrame Abstractions
  worktree: dataframe-core
  category: Core Functionality
  priority: Critical
  status: Not Started
  description: |
    Implement the foundational abstractions for DataFrame benchmarking including
    DataFrameQuery protocol, DataFrameContext, and DataFrameOps protocol that
    will enable 95%+ code reuse across 8 dataframe platforms using a family-based
    architecture.
  context_sections:
  - name: Architecture Decision
    summary: |
      Research shows Python dataframe libraries cluster into 2 syntactic families:
      Pandas-like (Pandas, Modin, cuDF, Vaex, Dask) and Expression-based (Polars,
      PySpark, DataFusion). This enables 72% code reduction vs per-platform approach.
  - name: Design Philosophy
    summary: |
      Each query is implemented once per family (not once per platform). Families
      share 95%+ of query code, with platform differences isolated to thin adapters
      handling I/O and type conversions.
  impact: |
    CRITICAL - Foundation for entire DataFrame support. Enables 8 platforms with
    only 2 family implementations. 72% code reduction vs per-platform approach.
    Estimated 9-11 weeks total timeline vs 13+ weeks for per-platform.
  research_value: |
    Validates family-based architecture pattern. Demonstrates that syntactic
    clustering enables massive code reuse while maintaining platform-specific
    optimizations.
  tasks:
  - phase: "Phase 1.1: Core Protocol Definitions"
    description: Define the core abstractions and protocols
    items:
    - summary: "Create benchbox/core/dataframe/__init__.py package structure"
      done: false
    - summary: "Implement DataFrameQuery dataclass in benchbox/core/dataframe/query.py"
      done: false
      details: |
        - query_id, query_name, description fields
        - pandas_impl: Callable (for Pandas family)
        - expression_impl: Callable (for Expression family)
        - execute() method
        - Optional sql_equivalent for validation
    - summary: "Define DataFrameOps protocol in benchbox/core/dataframe/query.py"
      done: false
      details: |
        Protocol methods:
        - select(*columns) - column selection
        - filter(condition) - row filtering
        - groupby(*columns) -> DataFrameGroupBy
        - join(other, on, how) - joins
        - sort_values(by, ascending) - sorting
        - with_column(name, expr) - computed columns
        - distinct() - deduplication
        - collect() - execution
        - count(), shape() - metadata
    - summary: "Define DataFrameGroupBy protocol for grouped operations"
      done: false
      details: |
        - agg(**aggregations) - aggregation
        - sum(), mean(), count(), min(), max() - common aggregates
    - summary: "Define JoinType and AggregateFunction enums"
      done: false
    - summary: "Create comprehensive unit tests for protocols (tests/dataframe/test_protocols.py)"
      done: false
      details: |
        - Test protocol contract compliance
        - Test method signatures
        - Test enum values
        - Coverage target: 100%

  - phase: "Phase 1.2: DataFrameContext Implementation"
    description: Context object for table access and expression helpers
    items:
    - summary: "Define DataFrameContext protocol in benchbox/core/dataframe/context.py"
      done: false
      details: |
        Protocol methods:
        - get_table(name) -> dataframe
        - list_tables() -> list[str]
        - table_exists(name) -> bool
        - col(name) -> expr (platform-specific)
        - lit(value) -> expr (platform-specific)
        - Date/time helpers (cast_date, date_add, date_sub)
    - summary: "Implement DataFrameContextImpl concrete class"
      done: false
      details: |
        - Store tables dict
        - Reference to platform adapter
        - Delegate expression creation to adapter
    - summary: "Create unit tests for context (tests/dataframe/test_context.py)"
      done: false
      details: |
        - Test table registration and retrieval
        - Test expression delegation
        - Test error handling (missing tables)

  files_affected:
  - change_type: New
    paths:
    - benchbox/core/dataframe/__init__.py
    - benchbox/core/dataframe/query.py
    - benchbox/core/dataframe/context.py
  - change_type: New
    paths:
    - tests/dataframe/__init__.py
