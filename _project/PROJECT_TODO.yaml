- title: Query Plan Parser Framework
  worktree: query-plan-parsers
  category: Core Functionality
  priority: High
  status: Not Started
  description: |
    Implement platform-specific EXPLAIN output parsers that convert native query
    plans into harmonized QueryPlanDAG structure. Includes base parser interface
    and 9 platform-specific implementations.

    **Parsing Strategy**:
    - Each platform provides EXPLAIN in different format (text trees, JSON, XML)
    - Parse native format → intermediate representation → QueryPlanDAG
    - Graceful degradation on parse failures (warn, continue without plan)

  context_sections:
  - name: Parser Complexity Matrix
    summary: |
      Easy (JSON): PostgreSQL, BigQuery, Snowflake (120-150 LOC each)
      Medium (Text): DuckDB, SQLite, DataFusion, ClickHouse, Redshift (150-220 LOC)
      Hard (Complex): Databricks/Spark (200-250 LOC)
      Total: ~1,500 LOC for all parsers

  - name: Operator Harmonization
    summary: |
      Physical operators mapped to logical vocabulary. Examples:
      - HashJoin, MergeJoin, NestedLoopJoin → Join(type=inner/left/right)
      - SeqScan, IndexScan, TableScan → Scan(table_name=...)
      - HashAggregate, StreamAggregate → Aggregate(agg_functions=[...])

  impact: |
    HIGH - Enables query plan capture for all platforms. Each parser is independent
    and can be implemented/tested in parallel once base interface defined.

  research_value: |
    Documents platform-specific EXPLAIN formats and operator semantics. Establishes
    harmonization rules for cross-platform query optimization analysis.

  dependencies:
  - workstream: "Query Plan Core Infrastructure (Models & Storage)"
    reason: "Requires QueryPlanDAG, LogicalOperator, PhysicalOperator models"

  tasks:
  - phase: "Phase 2.1: Base Parser Interface"
    description: Abstract base class for all parsers
    items:
    - summary: "Create benchbox/core/results/query_plan_parsers/ directory"
      done: false
    - summary: "Implement QueryPlanParser ABC in base_parser.py"
      done: false
      details: |
        class QueryPlanParser(ABC):
            @abstractmethod
            def parse_explain_output(self, explain_text: str) -> QueryPlanDAG:
                """Parse platform EXPLAIN into QueryPlanDAG"""

            @abstractmethod
            def get_explain_query(self, original_query: str) -> str:
                """Generate EXPLAIN query for platform"""
                # e.g., "EXPLAIN (FORMAT JSON) {query}"

            def parse_with_fallback(self, explain_text: str, query_id: str) -> QueryPlanDAG | None:
                """Parse with error handling, return None on failure"""
    - summary: "Add OperatorMapper helper class"
      done: false
      details: |
        class OperatorMapper:
            @staticmethod
            def physical_to_logical(phys_type: str, platform: str) -> str:
                """Map physical operator to logical type"""
                # HashJoin → Join, SeqScan → Scan, etc.
