- title: DataFrame Memory Management and Scale Factor Limits
  worktree: dataframe-phase0-memory
  category: Core Functionality
  priority: Critical
  status: Not Started
  description: |
    Implement memory management strategy and per-platform scale factor limits
    to prevent OOM crashes. Different platforms have different memory constraints
    (Pandas loads all in RAM, cuDF limited by GPU VRAM, etc.).
  context_sections:
  - name: Memory Challenge
    summary: |
      TPC-H SF 10 = ~10GB data. Pandas/Modin/Polars load entire dataset in RAM.
      cuDF requires data in GPU VRAM (typically 8-24GB). Dask needs partitioning
      configuration. No current plan for OOM handling.
  - name: Solution Approach
    summary: |
      Define per-platform capabilities including max recommended SF, memory
      requirements, and partitioning needs. Add pre-execution memory checks
      and helpful error messages.
  impact: |
    CRITICAL - Without this, users will hit OOM crashes with no warning or guidance.
    Pandas will crash on SF > 10, cuDF on SF > 1 (typical GPU). Essential for
    reliability.
  tasks:
  - phase: "Phase 0.7: Platform Capabilities Definition"
    items:
    - summary: "Create PlatformCapabilities dataclass"
      done: false
      details: |
        @dataclass
        class PlatformCapabilities:
            platform_name: str
            max_recommended_sf: float  # e.g., Pandas: 10, Dask: 100, PySpark: 1000
            memory_overhead_factor: float  # multiplier for data size
            requires_partitioning: bool  # True for Dask, PySpark
            supports_out_of_core: bool  # True for Dask, Vaex
            gpu_required: bool  # True for cuDF
            recommended_data_format: str  # "parquet" for large SF, "csv" for small
    - summary: "Define capabilities for each platform"
      done: false
      details: |
        PANDAS_CAPABILITIES = PlatformCapabilities(
            platform_name="pandas",
            max_recommended_sf=10.0,
            memory_overhead_factor=2.5,  # Pandas uses ~2.5x data size
            requires_partitioning=False,
            supports_out_of_core=False,
            gpu_required=False,
            recommended_data_format="csv",  # Simple for small SF
        )

        CUDF_CAPABILITIES = PlatformCapabilities(
            platform_name="cudf",
            max_recommended_sf=1.0,  # Limited by GPU VRAM
            memory_overhead_factor=1.8,
            requires_partitioning=False,
            supports_out_of_core=False,
            gpu_required=True,
            recommended_data_format="parquet",
        )
        # ... etc for all 8 platforms

  - phase: "Phase 0.8: Memory Estimation"
    items:
    - summary: "Implement memory estimator for TPC-H/TPC-DS"
      done: false
      details: |
        def estimate_memory_required(
            benchmark: str,  # "tpch" or "tpcds"
            scale_factor: float,
            platform: str,
        ) -> int:
            \"\"\"Estimate memory in bytes needed for benchmark.\"\"\"
            # TPC-H SF 1 ≈ 1GB raw data
            # TPC-DS SF 1 ≈ ~GB raw data
            # Apply platform overhead factor
            # Return bytes required
    - summary: "Implement available memory detection"
      done: false
      details: |
        import psutil

        def get_available_memory() -> int:
            \"\"\"Get available system RAM in bytes.\"\"\"
            return psutil.virtual_memory().available

        def get_available_gpu_memory() -> int:
            \"\"\"Get available GPU VRAM in bytes (for cuDF).\"\"\"
            # Use pynvml or similar
    - summary: "Implement pre-execution memory check"
      done: false
      details: |
        def check_sufficient_memory(
            benchmark: str,
            scale_factor: float,
            platform: str,
        ) -> tuple[bool, str]:
            \"\"\"Check if sufficient memory available.

            Returns:
                (sufficient, error_or_warning_message)
            \"\"\"

  - phase: "Phase 0.9: Scale Factor Validation"
    items:
    - summary: "Add SF validation to CLI"
      done: false
      details: |
        Before execution:
        1. Check requested SF vs platform max_recommended_sf
        2. Estimate memory required
        3. Check available memory
        4. Warn or error if insufficient
    - summary: "Implement helpful SF limit messages"
      done: false
      details: |
        Example error:
        "Scale factor 100 exceeds recommended limit for pandas (max: 10).

        Estimated memory required: 250GB
        Available memory: 32GB

        Suggestions:
        - Use smaller scale factor (try SF 1 or 10)
        - Use Dask for distributed processing (supports SF 100)
        - Use PySpark for very large scale factors (supports SF 1000+)

        To proceed anyway (not recommended):
          benchbox run --platform pandas --scale 100 --ignore-memory-warnings"

  - phase: "Phase 0.10: Partitioning Configuration (Dask/PySpark)"
    items:
    - summary: "Implement partition calculator"
      done: false
      details: |
        def calculate_optimal_partitions(
            data_size_bytes: int,
            available_memory_bytes: int,
            num_workers: int,
        ) -> int:
            \"\"\"Calculate optimal partition count for distributed platforms.\"\"\"
            # Heuristic: each partition should fit in memory with overhead
            partition_size_target = available_memory_bytes * 0.8 / num_workers
            return max(1, int(data_size_bytes / partition_size_target))
    - summary: "Add partition configuration to Dask adapter"
      done: false
    - summary: "Add partition configuration to PySpark adapter"
      done: false

