      done: false
      details: "Recursive descent comparing operators at each level"
    - summary: "Implement operator matching logic"
      done: false
      details: |
        Match operators by: operator_type, table_name (for Scan),
        join_type (for Join), etc. Ignore operator_id.
    - summary: "Detect missing/added operators"
      done: false
      details: "Operators in plan1 but not plan2, and vice versa"
