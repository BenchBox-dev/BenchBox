- title: Query Plan Platform Adapter Integration
  worktree: query-plan-adapters
  category: Core Functionality
  priority: High
  status: Not Started
  description: |
    Extend PlatformAdapter base class and all 8+ platform adapters to support
    query plan capture. Add capture_query_plan() method that executes EXPLAIN,
    parses output, and returns QueryPlanDAG. Integrate with execute_query() flow.

    **Integration Strategy**:
    - Modify base adapter to add capture_query_plan() abstract method
    - Each platform implements method using its parser
    - execute_query() optionally captures plan based on --capture-plans flag
    - Graceful handling when parser unavailable or fails

  context_sections:
  - name: Adapter Extension Pattern
    summary: |
      Each adapter overrides get_query_plan_parser() to return platform parser.
      Base adapter provides capture_query_plan() that uses parser to convert
      EXPLAIN output to QueryPlanDAG. Minimal code per platform (~20-30 LOC).

  - name: CLI Integration
    summary: |
      Add capture_plans parameter to adapter __init__. CLI passes flag from
      --capture-plans argument. execute_query() checks flag and captures plan
      if enabled, storing in result dict.

  impact: |
    HIGH - Makes query plan capture available for all platforms. Relatively simple
    once parsers are complete (mostly glue code). Enables end-to-end functionality.

  dependencies:
  - workstream: "Query Plan Core Infrastructure (Models & Storage)"
    reason: "Requires QueryPlanDAG model"
  - workstream: "Query Plan Parser Framework"
    reason: "Requires platform parsers"

  tasks:
  - phase: "Phase 3.1: Base Adapter Extension"
    description: Modify PlatformAdapter base class
    items:
    - summary: "Add capture_plans parameter to PlatformAdapter.__init__"
      done: false
      details: |
        def __init__(self, ..., capture_plans: bool = False):
            self.capture_plans = capture_plans
    - summary: "Add get_query_plan_parser() abstract method"
      done: false
      details: |
        @abstractmethod
        def get_query_plan_parser(self) -> QueryPlanParser | None:
            """Return platform-specific parser, or None if unsupported"""
    - summary: "Implement capture_query_plan() in base adapter"
      done: false
      details: |
        def capture_query_plan(self, connection, query: str) -> QueryPlanDAG | None:
            parser = self.get_query_plan_parser()
            if not parser:
                return None
            try:
                explain_query = parser.get_explain_query(query)
                explain_output = self._execute_explain(connection, explain_query)
                return parser.parse_explain_output(explain_output)
            except Exception as e:
                self.log_verbose(f"Failed to capture plan: {e}")
                return None
    - summary: "Modify execute_query() to optionally capture plan"
      done: false
      details: |
        result = {...}
        if self.capture_plans:
            plan = self.capture_query_plan(connection, query)
            if plan:
                result["query_plan"] = plan
        return result
    - summary: "Update base adapter tests"
      done: false

  - phase: "Phase 3.2: DuckDB Adapter Integration"
    description: First platform integration as proof of concept
    items:
    - summary: "Implement get_query_plan_parser() in DuckDB adapter"
      done: false
      details: |
        def get_query_plan_parser(self) -> QueryPlanParser:
            return DuckDBParser()
    - summary: "Test plan capture with DuckDB queries"
      done: false
    - summary: "Verify plan stored in query result dict"
      done: false
    - summary: "Integration test: benchbox run --platform duckdb --capture-plans"
      done: false

  - phase: "Phase 3.3: Remaining Platform Integrations"
    description: Extend all other platforms (can be done in parallel)
