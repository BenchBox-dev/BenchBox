# ==============================================================================
# QUERY PLAN CAPTURE & COMPARISON FEATURE
# ==============================================================================
# Overview Document: _project/query_plan_capture_overview.md
# Architecture: Two-tier DAG (logical + physical), opt-in capture, cross-platform
# Timeline: 5-6 weeks across 6 workstreams
# Code Addition: ~5,000 LOC (models, parsers, comparison, visualization, tests)
# ==============================================================================

- title: Query Plan Core Infrastructure (Models & Storage)
  worktree: query-plan-core
  category: Core Functionality
  priority: Critical
  status: Not Started
  description: |
    Implement foundational data models for query plan representation including
    two-tier DAG structure (logical + physical operators), storage schema
    extensions, and JSON serialization. This is the foundation that all other
    workstreams depend on.

    **Key Design Decisions**:
    - Structured DAG representation only (no raw text storage)
    - Two-tier: LogicalOperator (cross-platform) + PhysicalOperator (platform-specific)
    - Opt-in capture via --capture-plans flag
    - Plan fingerprinting for fast equality checks

  context_sections:
  - name: Architecture
    summary: |
      QueryPlanDAG contains logical operator tree with links to physical operators.
      Logical layer uses normalized vocabulary (Scan, Filter, Join, Aggregate, Sort,
      Limit, Project). Physical layer preserves platform-specific details (HashJoin,
      IndexScan, etc.) with cost estimates and metadata.

  - name: Storage Integration
    summary: |
      Extends QueryExecution dataclass with optional query_plan field. Plans stored
      in JSON alongside existing result data. Adds plan_fingerprint for fast comparison
      without full tree traversal.

  impact: |
    CRITICAL - Foundation for entire feature. Blocks all other workstreams until complete.
    Enables structured query plan storage, comparison, and analysis across all platforms.

  research_value: |
    Establishes patterns for harmonizing disparate EXPLAIN formats into unified representation.
    Demonstrates feasibility of cross-platform query optimization analysis.

  tasks:
  - phase: "Phase 1.1: Core Data Models"
    description: Define QueryPlanDAG, LogicalOperator, PhysicalOperator dataclasses
    items:
    - summary: "Create benchbox/core/results/query_plan_models.py"
      done: false
    - summary: "Implement PhysicalOperator dataclass"
      done: false
      details: |
        @dataclass
        class PhysicalOperator:
            operator_type: str  # "HashAggregate", "SeqScan", etc.
            operator_id: str
            properties: dict[str, Any]  # cost, rows, memory
            platform_metadata: dict[str, Any]  # platform-specific
    - summary: "Implement LogicalOperator dataclass with recursive structure"
      done: false
      details: |
        @dataclass
        class LogicalOperator:
            operator_type: str  # Scan, Filter, Join, Aggregate, Sort, Limit, Project
            operator_id: str
            properties: dict[str, Any]
            children: list["LogicalOperator"]
            physical_operator: PhysicalOperator | None
            # Operator-specific fields
            table_name: str | None  # For Scan
            join_type: str | None   # For Join
            filter_expressions: list[str] | None  # For Filter
            aggregation_functions: list[str] | None  # For Aggregate
            sort_keys: list[dict] | None  # For Sort
    - summary: "Implement QueryPlanDAG container dataclass"
      done: false
      details: |
        @dataclass
        class QueryPlanDAG:
            query_id: str
            platform: str
            logical_root: LogicalOperator
            estimated_cost: float | None
            estimated_rows: int | None
            plan_fingerprint: str  # SHA256 hash of logical structure
            raw_explain_output: str | None  # Original for debugging
    - summary: "Add operator type enums (LogicalOperatorType, JoinType, AggFunction)"
      done: false

  - phase: "Phase 1.2: Plan Fingerprinting"
    description: Implement deterministic hashing for fast plan comparison
    items:
    - summary: "Implement compute_plan_fingerprint() function"
      done: false
      details: |
        def compute_plan_fingerprint(logical_root: LogicalOperator) -> str:
            """Compute SHA256 hash of logical operator tree structure.

            Only includes: operator_type, join_type, table_name
            Excludes: costs, row counts, operator_id (non-structural)
            """
    - summary: "Add fingerprint computation to QueryPlanDAG.__post_init__"
      done: false
    - summary: "Create tests for fingerprint determinism"
      done: false
      details: "Verify same logical plan → same fingerprint, different properties → same fingerprint"

  - phase: "Phase 1.3: Serialization & Deserialization"
    description: JSON encoding/decoding for storage
    items:
    - summary: "Implement QueryPlanDAG.to_dict() method"
      done: false
      details: "Recursive conversion of operator tree to JSON-serializable dict"
    - summary: "Implement QueryPlanDAG.from_dict() class method"
      done: false
      details: "Reconstruct QueryPlanDAG from stored JSON"
    - summary: "Add custom JSON encoder for dataclass serialization"
      done: false
    - summary: "Create round-trip serialization tests"
      done: false
      details: "Ensure plan → JSON → plan preserves all information"

  - phase: "Phase 1.4: Storage Schema Extension"
    description: Extend QueryExecution and BenchmarkResults models
    items:
    - summary: "Add query_plan field to QueryExecution in models.py"
      done: false
      details: |
        @dataclass
        class QueryExecution:
            # ... existing fields ...
            query_plan: QueryPlanDAG | None = None
            plan_fingerprint: str | None = None
    - summary: "Add query_plans_captured counter to BenchmarkResults"
      done: false
      details: "Track how many queries had plans captured in run"
    - summary: "Add plan_comparison_summary optional field to BenchmarkResults"
      done: false
      details: "Store cross-run comparison results if applicable"
    - summary: "Update result exporter to serialize query plans"
      done: false
      details: "Extend JSON exporter in benchbox/core/results/exporter.py"
    - summary: "Create schema migration tests"
      done: false
      details: "Verify backward compatibility with existing results"

  - phase: "Phase 1.5: Testing & Validation"
    description: Comprehensive unit tests for core models
    items:
    - summary: "Create tests/unit/core/results/test_query_plan_models.py"
      done: false
    - summary: "Test dataclass instantiation and validation"
      done: false
    - summary: "Test operator tree construction and traversal"
      done: false
    - summary: "Test fingerprint computation and uniqueness"
      done: false
    - summary: "Test JSON serialization round-trips"
      done: false
    - summary: "Test storage schema backward compatibility"
      done: false
    - summary: "Achieve >90% test coverage for models"
      done: false

