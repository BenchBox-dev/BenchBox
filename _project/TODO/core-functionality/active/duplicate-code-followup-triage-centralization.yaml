id: duplicate-code-followup-triage-centralization
title: "Follow-up duplicate-code triage and consolidation from AST clone report"
worktree: core-functionality
priority: High
status: "In Progress"
category: "Code Quality and Technical Debt"
description: |
  The latest `make duplicate-check-verbose` run reports 401 duplicate function groups and
  13,796 duplicated lines (threshold 15,180). The first consolidation pass removed high-value
  duplicates, but the report still contains many mixed groups where some are intentional
  boilerplate while others are true parallel implementations.

  This follow-up TODO performs a full classification pass for all currently identified clone
  groups, then applies the correct action for each class:
  - Intended duplication: keep implementation but mark with narrow ignore rules.
  - Parallel implementation: centralize shared logic into core modules/mixins/helpers and update call sites.

  The key deliverable is a complete, auditable triage map of every reported clone group plus
  implementation work that lowers duplicated lines further and reduces noise in future reports.

context_sections:
  "Current Baseline (2026-02-20)": |
    Latest duplicate scan summary:
    - Duplicate function groups: 401
    - Duplicate instances: 702
    - Estimated duplicated lines: 13,796
    - Current threshold: 15,180

    Highest-value remaining groups include:
    - TPC-DS OBT transformer mapping methods (~344 dup lines)
    - benchmark/query helper wrappers across benchmark facades (~240 dup lines)
    - DataFrame unified frame/protocol operation patterns (~216+ dup lines)
    - facade get_create_tables_sql one-liners across top-level benchmark modules (~176 dup lines)
    - Firebolt/Presto/Trino execute_query implementations (~158 dup lines)
    - Spark/LakeSail load_data implementations (~92 dup lines)

  "Classification Rule Set": |
    Each duplicate group must be explicitly tagged as one of:
    1) intended_boilerplate
    2) structural_but_domain_specific
    3) parallel_implementation

    Required evidence per group:
    - representative files/functions reviewed
    - rationale for classification
    - action decision (ignore, defer, or consolidate now)
    - risk notes and required regression tests

    Objective classification checklist (all groups):
    - Control-flow and side-effects equivalent across all copies
    - Parameter/input contract equivalent
    - Output and error semantics equivalent
    - Platform/dialect behavior equivalent (or explicitly not equivalent)

    Disqualifiers for consolidation:
    - Interface/protocol contract methods meant to be per-platform/per-implementation
    - Thin facade methods where duplication is API surface, not implementation debt
    - Domain-specific SQL/transforms that are shape-similar but business-different

    Consolidate only when:
    - At least 3 of 4 objective checks pass and no disqualifier applies
    - A shared abstraction point can be introduced without public API changes
    - Regression tests exist (or are added) for affected behavior

deps:
  needs: [consolidate-duplicate-code]

work:
- id: w1
  summary: "Capture baseline duplicate report artifacts in machine-readable and reviewable formats"
  status: done
  notes: |
    Run `make duplicate-check-verbose` plus JSON mode from `scripts/check_duplicate_code.py`.
    Persist artifacts under `_project/analysis/duplicate-code-followup/` with timestamped files and
    refresh canonical pointers:
    - `_project/analysis/duplicate-code-followup/latest-duplicates.txt`
    - `_project/analysis/duplicate-code-followup/latest-duplicates.json`
    Include top groups and full-group inventory for review traceability.

- id: w2
  summary: "Define strict classification rubric for intended boilerplate vs parallel implementation"
  needs: [w1]
  status: done
  notes: |
    Create a checklist with objective decision criteria and examples.
    Add explicit disqualifiers for false consolidations (protocol methods, interface contracts,
    and facade delegation wrappers that are intentionally repetitive).

- id: w3
  summary: "Pilot classification on top duplicate groups and calibrate rubric"
  needs: [w2]
  status: pending
  notes: |
    Classify top 30 groups first, then refine rubric language where disagreements/ambiguity appear.
    This phase locks classification examples before full-inventory triage.

- id: w4
  summary: "Classify remaining duplicate groups and produce complete action matrix"
  needs: [w3]
  status: pending
  notes: |
    Evaluate every currently identified group from the full inventory (beyond top-N).
    Output one row per group with class, rationale, action, confidence, and owner module.
    Write matrix to `_project/analysis/duplicate-code-followup/classification-matrix.yaml`.

- id: w5
  summary: "Validate matrix completeness and freeze implementation/ignore backlog"
  needs: [w4]
  status: pending
  notes: |
    Verify one-to-one coverage between latest duplicate report groups and matrix rows.
    No implementation starts until coverage and action mapping are complete and internally consistent.

- id: w6
  summary: "Implement ignore rules batch A for intended adapter/protocol boilerplate groups"
  needs: [w5]
  status: pending
  notes: |
    Update duplicate checker config/script with tightly scoped ignore rules
    (function names plus path constraints where needed). Avoid broad suppressions and broad path wildcards.

- id: w7
  summary: "Implement ignore rules batch B for intended facade/structural non-parallel groups"
  needs: [w5]
  status: pending
  notes: |
    Apply ignores for verified intentional duplication in thin facades and domain-specific structural clones.
    Keep ignore entries traceable to matrix rows and rationale.

- id: w8
  summary: "Consolidate benchmark facade/query-helper parallel implementations into shared core utilities"
  needs: [w5]
  status: pending
  notes: |
    Target groups such as repeated benchmark wrapper helpers (`get_queries`, `get_query`,
    `get_create_tables_sql`) and repeated query metadata/filter helper patterns where behavior matches.

- id: w9
  summary: "Consolidate DataFrame family parallel implementations via pandas/expression shared helpers"
  needs: [w5]
  status: pending
  notes: |
    Focus on true parallel methods (`merge`, `groupby_agg`, `col/lit/from_pandas`, scalar conversion helpers)
    where semantics are aligned across adapters.

- id: w10
  summary: "Consolidate platform adapter parallel implementations into scoped mixins"
  needs: [w5]
  status: pending
  notes: |
    Evaluate and centralize genuinely parallel adapter methods (for example cloud adapter
    platform info blocks, cache/session validators, shared execute/load flows) while preserving
    platform-specific error semantics.

- id: w11
  summary: "Consolidate TPC-DI and generator helper duplicates that are true parallel scaffolding"
  needs: [w5]
  status: pending
  notes: |
    Address repeated query metadata accessors/filtering helpers and generator scaffolding
    only where behavioral equivalence is demonstrated.

- id: w12
  summary: "Run targeted regression tests per consolidation/ignore track and fix breakages"
  needs: [w6, w7, w8, w9, w10, w11]
  status: pending
  notes: |
    Run targeted unit suites for every touched module family and resolve regressions before final verification.

- id: w13
  summary: "Run regression suite, re-run duplicate check, and lower threshold to new baseline + safety margin"
  needs: [w12]
  status: pending
  notes: |
    Verify behavior parity with targeted tests for each consolidation track plus fast suite.
    Update threshold in pyproject to observed duplicated-line count plus 10% headroom.

- id: w14
  summary: "Finalize TODO completion state, capture before/after metrics, and regenerate indexes"
  needs: [w13]
  status: pending
  notes: |
    Record total line reduction, finalized threshold, and list of consolidated groups.
    Move item through active -> done workflow only after all verification passes.

deferred:
- summary: "Consolidation requiring live cloud platform behavior validation"
  reason: "Some adapter duplicates may look parallel but depend on platform-specific cursor/session behavior best validated
    in live integrations."
- summary: "Refactoring large benchmark SQL/query bodies that are structurally similar but domain-different"
  reason: "High risk of over-abstraction; keep as intentional or defer unless strong equivalence evidence exists."

must_preserve:
- "Firebolt/Presto/Trino execution semantics and error handling behavior in platform adapter tests."
- "Spark-family load paths continue to support current file formats and loading options."
- "DataFrame adapter correctness for pandas-family and expression-family query execution paths."
- "Top-level benchmark facade APIs (`get_query`, `get_queries`, `get_create_tables_sql`) remain backwards compatible."
- "Duplicate checker remains useful (no broad ignores that hide real regressions)."

approach: |
  Start with evidence, not edits: build a full clone-group matrix before changing code.
  For each group classified as parallel_implementation, identify the narrowest shared abstraction
  point (utility function, mixin, or core helper module) and migrate incrementally.
  Keep each consolidation track independently testable and committable.
  Apply ignore rules only after explicit group-level classification and only with narrow scope.
  Re-run duplicate scan after each consolidation track to confirm the expected impact.

anti_patterns:
- "DO NOT ignore whole directories in duplicate config -- because this hides future regressions -- use narrow function/path-level
  ignores tied to classified groups."
- "DO NOT consolidate structurally similar but domain-specific SQL/generator logic -- because AST shape can be misleading
  -- require demonstrated behavioral equivalence first."
- "DO NOT change public benchmark facade signatures during refactor -- because downstream modules and tests rely on them --
  centralize internals only."
- "DO NOT introduce deep inheritance chains for consolidation -- because adapter hierarchy is already complex -- prefer focused
  mixins/helpers."

verification:
- description: "All clone groups in current report have explicit classifications and actions"
  command: "uv run -- python -c \"import json,yaml,pathlib; r=pathlib.Path('_project/analysis/duplicate-code-followup/latest-duplicates.json');
    m=pathlib.Path('_project/analysis/duplicate-code-followup/classification-matrix.yaml'); report=json.loads(r.read_text());
    matrix=yaml.safe_load(m.read_text()); rows=matrix['groups'] if isinstance(matrix,dict) and 'groups' in matrix else matrix;
    report_ids={g['hash'] for g in report['groups']}; matrix_ids={row['group_hash'] for row in rows}; missing=report_ids-matrix_ids;
    extra=matrix_ids-report_ids; assert not missing and not extra, f'missing={len(missing)} extra={len(extra)}'; print(f'coverage_ok
    groups={len(report_ids)}')\""
  expected_output: "coverage_ok groups=<count>, with zero missing/extra group hashes."
- description: "Core duplicate checker passes at new threshold"
  command: "make duplicate-check-verbose"
  expected_output: "PASS with duplicated lines below updated threshold."
- description: "Fast regression suite remains green"
  command: "uv run -- python -m pytest -m fast -q -n 0"
  expected_output: "all fast tests pass, 0 failures."
- description: "Targeted platform and dataframe tests remain green after consolidation"
  command: "uv run -- python -m pytest tests/unit/platforms/ tests/unit/core/dataframe/ -q -n 0"
  expected_output: "all targeted tests pass, 0 failures."

