scope_limit:
  only_modify:
  - "benchbox/platforms/postgresql.py"
  - "benchbox/platforms/timescaledb.py"
  - "benchbox/platforms/presto.py"
  - "benchbox/platforms/trino.py"
  - "benchbox/platforms/doris.py"
  - "benchbox/platforms/presto_trino_utils.py"
  - "benchbox/core/"
  - "tests/"

must_preserve:
- "TimescaleDB CLI args include all PostgreSQL-compatible params plus chunk_interval and compression"
- "Presto/Trino catalog validation error messages contain platform-specific name"
- "execute_query return format identical for Doris and PostgreSQL (timing, validation, error dict)"
- "TPC-DS returns generation: catalog returns use CR_* columns, web returns use WR_* columns"
- "Manager factory dispatch maps identical platform names to identical manager classes"
- "get_entry_by_id raises ValueError with sorted available keys in error message"

anti_patterns:
- "DO NOT create a PostgreSQL base class that TimescaleDB inherits for ALL methods — only share the CLI argument helper, not
  the full adapter"
- "DO NOT merge Presto and Trino into a single adapter — only share the catalog validation utility"
- "DO NOT use *args/**kwargs in the returns generation helper — use explicit field_mapping and channel_fields parameters for
  type safety"
- "DO NOT create an abstract base for all SQL platforms' execute_query — only consolidate the specific Doris/PostgreSQL pair
  that is byte-for-byte identical"

