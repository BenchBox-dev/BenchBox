context_sections:
  "Current State Analysis": |
    SQL Parameter Path:
      TPC-H: QGenBinary.generate(query_id, seed=X, scale_factor=Y) → qgen binary → SQL with substituted params
      TPC-DS: DSQGenBinary.generate(query_id, seed=X, scale_factor=Y, stream_id=Z) → dsqgen binary → SQL with substituted params

    DataFrame Parameter Path:
      TPC-H: Parameters INLINED directly in each of the 44 query functions (22 expression + 22 pandas).
             The TPCH_PARAMS dict at module top is dead code — never referenced by any query function.
             Example: q1_expression_impl() has `cutoff_date = date(1998, 9, 2)` — not `TPCH_PARAMS["q1_date"]`.
      TPC-DS: All query functions call get_parameters(query_id) from parameters.py, which returns
             values from the TPCDS_DEFAULT_PARAMS dict. This is a centralized choke point.

    Ordering/Permutation Path (ALREADY CORRECT for both modes):
      TPC-H: TPCHStreams.PERMUTATION_MATRIX[stream_id % 41] — used by both SQL and DataFrame
      TPC-DS: TPCDSPermutationGenerator(seed=42+stream_id) — used by both SQL and DataFrame

  "Choke Point Analysis": |
    TPC-DS (EASY — 1 function change):
      All 99 queries → get_parameters(query_id) → TPCDS_DEFAULT_PARAMS
      Fix: Add `overrides` param to get_parameters(). Zero query functions modified.
      EXCEPTION: Q96 bypasses get_parameters() entirely — uses hardcoded literals.

    TPC-H (HARDER — 44 function refactors):
      All 22 expression_impl and 22 pandas_impl functions inline their parameters.
      Fix: Create get_tpch_parameters(query_id), consolidate inline values into a dict,
      refactor 44 functions to call the centralized function.
      EXCEPTION: Q7 and Q8 call get_tpch_parameters() for text params but hardcode dates.

  "Post-Implementation Review Findings (2026-02-06)": |
    REVIEW SCORE: 12/15 (Good)

    BUG #1 — TPC-H Q7/Q8 Hardcoded Dates (4 functions affected):
      q7_expression_impl line 426-427, q7_pandas_impl line 1341-1342,
      q8_expression_impl line 475-476, q8_pandas_impl line 1403-1404.
      All four call get_tpch_parameters() but then hardcode start_date=date(1995,1,1)
      and end_date=date(1996,12,31) instead of reading them from params.
      MITIGATING: These dates are TPC-H spec-fixed (qgen never varies them). The
      parameter extractor _q7()/_q8() don't extract dates either. Architecturally
      inconsistent but functionally correct for current behavior.

    BUG #2 — TPC-DS Q96 Bypasses get_parameters():
      q96_expression_impl (queries.py:431) and q96_pandas_impl (queries.py:463)
      use hardcoded literals (t_hour==8, t_minute>=30, hd_dep_count==0, etc.)
      instead of calling get_parameters(96). Parameters ARE defined in
      TPCDS_DEFAULT_PARAMS[96] = {"hours": [(8, 9)]} but never consumed.
      This is the only TPC-DS query that bypasses the choke point.

    GAP #3 — No integration-level tests:
      Tests verify get_tpch_parameters() and get_parameters() return correct values,
      but no test verifies that actual query implementations consume overridden values.
      A test that sets overrides and runs a query function would have caught Bugs #1-2.

    STYLE — Misplaced import:
      parameter_extractor.py line 83: `from datetime import timedelta` inside _q1().
      Should be at module top.

    DESIGN NOTE — Module-level mutable state:
      Both _parameter_overrides globals are not thread-safe. Acceptable for single-process
      benchmark runs. Worth documenting if multi-threading is ever considered.

    TPC-DS EXTRACTOR COVERAGE:
      _extract_common_params() handles 7 pattern types (year, month, state, gender,
      marital_status, education, manufact_id). Many TPC-DS parameters like zip_codes,
      cities, colors, categories, buy_potential, income_band have no extraction patterns.
      This limits override effectiveness for ~40% of TPC-DS queries with non-trivial params.
      Noted as a future enhancement opportunity, not a Phase 6 requirement.

  "Design Decision: Extract vs Reimplement": |
    Option A (CHOSEN): Extract parameters from binary output.
      Pro: Authoritative, spec-compliant, zero maintenance when TPC spec updates.
      Con: Requires binary to be available, adds ~1-2s startup latency per run.

    Option B (REJECTED): Reimplement parameter generation in Python.
      Pro: No binary dependency, faster.
      Con: Must replicate complex seed-based random distribution logic, risk of divergence.

  "Design Decision: Module-level overrides vs Protocol change": |
    Option A (CHOSEN): Module-level _parameter_overrides dict.
      Pro: Zero changes to DataFrameContext Protocol, DataFrameQuery, or platform adapters.
      Con: Module-level state (set/clear around query execution). Not thread-safe.

    Option B (REJECTED): Add params field to DataFrameContext Protocol.
      Pro: Explicit dependency injection, cleaner architecture.
      Con: Requires updating Protocol + DataFrameContextImpl + PolarsDataFrameContext +
           ExpressionFamilyContext + PandasFamilyContext + all platform adapters.
           Violates minimum-change constraint.

