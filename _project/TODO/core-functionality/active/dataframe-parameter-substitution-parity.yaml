impact:
  business_value: |
    Without parameter parity, SQL vs DataFrame benchmark comparisons are scientifically
    invalid — the two modes execute different query workloads. This blocks any credible
    published performance comparison between SQL platforms and DataFrame libraries.
    Multi-stream throughput tests in DataFrame mode are also meaningless since every
    stream runs identical parameters instead of the specification-required variations.
  technical_debt: |
    The hardcoded parameter values (inline in TPC-H, TPCDS_DEFAULT_PARAMS in TPC-DS)
    are a maintenance liability. Any change to the default seed, scale factor handling,
    or stream configuration silently breaks SQL/DataFrame parity. Extracting parameters
    from the authoritative binary tools eliminates this class of bugs permanently.

