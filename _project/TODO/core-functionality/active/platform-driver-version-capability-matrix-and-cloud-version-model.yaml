impact:
  business_value: |
    Enables trustworthy cross-version benchmark comparisons across platforms,
    not only DuckDB, and improves integrity of published benchmark conclusions.
  user_impact: |
    Users can intentionally select driver versions where supported and can
    distinguish Python client version from platform engine version in results.
  technical_debt: |
    Replaces implicit capability checks with explicit platform capability
    declarations and a normalized version-semantics model.

