  command: "uv run -- python -m pytest tests/unit/platforms/test_platform_driver_runtime_contract.py tests/unit/utils/test_runtime_env.py
    -v --tb=short"
  expected_output: "all targeted contract/runtime tests pass with 0 failures"
- description: "DataFusion SQL and DataFrame runtime-binding tests pass"
  command: "uv run -- python -m pytest tests/unit/platforms/test_datafusion_adapter.py tests/unit/platforms/dataframe/test_datafusion_df.py
    -k 'driver or runtime or version' -v --tb=short"
  expected_output: "DataFusion adapter tests covering runtime/version behavior pass"
- description: "Result schema/runner metadata propagation remains correct"
  command: "uv run -- python -m pytest tests/unit/core/results/test_query_plan_serialization.py tests/unit/core/test_runner_lifecycle.py
    -k 'driver or version' -v --tb=short"
  expected_output: "driver/engine metadata fields are serialized correctly with no regression"
- description: "Integration matrix verifies distinct actual driver versions across multiple supported platforms"
  command: "uv run -- python -m pytest tests/integration/test_duckdb_version_isolation.py tests/integration/test_platform_driver_version_matrix.py
    -v --tb=short"
  expected_output: "integration tests prove per-run version isolation where platform capability allows"
- description: "Manual command matrix confirms runtime and metadata correctness"
  command: "benchbox run --platform duckdb --benchmark tpch --scale 0.01 --platform-option driver_version=1.2.2 --non-interactive
    --quiet && benchbox run --platform datafusion --benchmark tpch --scale 0.01 --platform-option driver_version=51.0.0 --non-interactive
    --quiet"
  expected_output: "for supported platforms, result JSON shows distinct verified actual driver versions; unsupported combinations
    fail fast with explicit guidance"

