success_metrics:
- "Each platform marked as supporting multi-driver-version execution can run at least two requested driver versions with distinct
  live-verified actual versions."
- "No platform emits `driver_version_actual` unless sourced from live runtime context."
- "Cloud/managed adapters expose engine/service version metadata when a reliable probe exists, without conflating it with
  client driver version."
- "Unsupported capability combinations fail fast with deterministic, user-actionable errors."

open_questions:
- "What is the canonical field naming for engine/service versions: `platform_engine_version_*` vs `service_version_*`?"
- "Should users be allowed to request an engine version, or should engine version remain observed/actual-only for managed
  services?"
- "How should multi-component cloud versions (warehouse runtime + SQL engine + connector) be represented without ambiguity?"
- "Should platform capability declarations live only in `PlatformRegistry`, or also be surfaced via adapter introspection
  for plugin platforms?"

research_value:
  hypothesis: |
    Separating driver-version and engine-version semantics, plus explicit capability
    declarations, will eliminate false version reporting and produce auditable,
    platform-correct benchmark metadata.
  validation_approach: |
    Validate with contract tests, integration matrix tests, and manual runs across
    local and cloud adapters. Compare reported metadata against live probe values.
  success_criteria: |
    No known path can report a requested/resolved version as "actual" without live
    runtime verification, and cloud platform versions are represented distinctly
    from Python client versions.
