id: platform-driver-version-capability-matrix-and-cloud-version-model
title: "Plan cross-platform multi-driver-version support and cloud engine-version metadata"
worktree: core-functionality
priority: High
status: In Progress
category: Core Functionality
description: |
  Follow-up planning item to close the remaining cross-platform gaps after the
  initial runtime-isolation rollout.

  Current implementation now fails fast when an adapter is asked to use
  `isolated-site-packages` but does not explicitly support runtime binding.
  This prevents incorrect `driver_version_actual` reporting, but it does not yet
  provide a complete, explicit capability matrix and implementation plan across
  all platforms.

  This item defines a detailed execution plan to:
  1. Ensure every platform that can support multiple Python driver versions does.
  2. Make capability declarations explicit and discoverable (not implicit via ad-hoc attr checks).
  3. Investigate and design an additional "cloud platform/engine version" concept
     for platforms where Python client version is independent from underlying
     service/runtime version.

context_sections:
  "Trigger and Current Gap": |
    The current guardrail uses adapter capability detection at runtime:
    - `supports_isolated_runtime = bool(getattr(adapter_class, "supports_driver_runtime_isolation", False))`
    - raises when isolated runtime is selected but unsupported.

    This protects correctness, but capability definition remains partially implicit
    and not yet normalized into a first-class matrix across all platforms.

  "Version Semantics Gap": |
    BenchBox currently centers on driver version metadata
    (`driver_version_requested/resolved/actual`).
    For cloud/managed platforms, this can diverge from underlying service version
    (warehouse/engine/runtime). A dedicated engine-version model may be needed to
    avoid conflating client and server/runtime versions in analysis and reporting.

  "Scope Policy": |
    This is a platform-wide planning item.
    DuckDB is already implemented; next phase covers DataFusion plus all other
    adapters that can realistically support selectable Python driver versions,
    with explicit rationale for unsupported cases.

