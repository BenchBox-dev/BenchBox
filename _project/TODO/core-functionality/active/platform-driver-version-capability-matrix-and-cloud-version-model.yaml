- summary: "Automated live-cloud verification against paid accounts in CI"
  reason: "Requires account provisioning/secrets policy decisions; keep implementation and metadata model decoupled from account
    availability."

must_preserve:
- "Default runs with no explicit driver version continue to behave exactly as today for all platforms."
- "DuckDB runtime-isolation behavior remains live-validated from the actual execution connection/module."
- "Result JSON keeps backward-compatible `platform.version` and `platform.client_version` fields."
- "Unsupported isolated-runtime requests fail fast with actionable errors; never silently downgrade to misleading metadata."

approach: |
  Use a capability-first architecture instead of adapter-by-adapter ad hoc logic.

  1. Inventory and classify platforms before changing behavior.
  2. Define canonical version semantics:
     - driver version (Python client package)
     - engine/platform version (remote service/runtime)
  3. Move capability declarations into explicit platform metadata/contract fields.
  4. Implement runtime binding only where live verification can prove correctness.
  5. Enforce fail-fast paths for unsupported combinations.
  6. Add schema+test coverage to prevent regression and metadata conflation.

anti_patterns:
- "DO NOT infer support only from optional class attrs discovered via `getattr` -- because this hides platform contract intent
  -- define capability declarations explicitly in registry/contract metadata."
- "DO NOT populate `driver_version_actual` from resolver metadata alone -- because resolver output is not proof of live runtime
  import/execution -- verify from live module/connection context."
- "DO NOT treat cloud engine version as equivalent to Python driver version -- because they are independently versioned lifecycles
  -- model and export them separately."
- "DO NOT silently continue on unsupported isolated runtime requests -- because that can produce invalid benchmark conclusions
  -- fail fast with specific remediation guidance."
- "DO NOT remove or rename existing result keys without compatibility layer -- because downstream consumers depend on current
  schema -- add new fields alongside existing ones."

verification:
