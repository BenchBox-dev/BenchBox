id: "complexity-mcp-analytics-w14"
title: "Decompose MCP tool implementations and analytics functions (complexity batch 6)"
worktree: "main"
priority: "Medium"
status: "Not Started"
description: |
  8 MCP tool and analytics functions mix phase logic (file enumeration, metric extraction,
  aggregation, formatting) in single long functions. Extracting phases to private helpers
  reduces complexity while keeping the MCP-registered tool function as a readable summary.

  Target functions:
    benchbox/mcp/resources/registry.py:register_all_resources       (20)
    benchbox/mcp/tools/analytics.py:_get_performance_trends_impl    (20)
    benchbox/mcp/tools/analytics.py:_aggregate_results_impl         (18)
    benchbox/mcp/tools/analytics.py:_detect_regressions_impl        (17)
    benchbox/mcp/tools/analytics.py:get_query_plan                  (15)
    benchbox/mcp/prompts/registry.py:register_all_prompts           (15)
    benchbox/mcp/tools/benchmark.py:_run_benchmark_impl             (16)
    benchbox/mcp/tools/benchmark.py:_validate_config_impl           (15)

category: "Core Functionality"

work:
  - id: w1
    summary: "Decompose register_all_resources: extract per-resource handler factories"
    status: pending
    notes: |
      benchbox/mcp/resources/registry.py:34 — nested function definitions for
      list_benchmarks, get_benchmark, list_platforms, get_platform each follow
      identical fetch → JSON structure pattern. Extract resource factories:
      - _make_list_resource(fetch_fn, formatter_fn) → Callable
      - _make_get_resource(fetch_fn, formatter_fn) → Callable
      Registration becomes: server.register_resource(uri, _make_list_resource(...))

  - id: w2
    summary: "Decompose _get_performance_trends_impl into load/filter/extract/aggregate phases"
    status: pending
    notes: |
      benchbox/mcp/tools/analytics.py:435 — phases:
      - _load_result_files(result_dir, platform_filter) → list[RunResult]
      - _extract_metric(result, metric_name) → float | None
      - _compute_trends(grouped_runs, metric) → TrendResult
      Main function: load → filter → extract per run → group → compute trends.

  - id: w3
    summary: "Decompose _aggregate_results_impl and _detect_regressions_impl"
    needs: []
    status: pending
    notes: |
      _aggregate_results_impl (analytics.py:566):
      - Extract _build_group_key(result, group_by) → str (3-way dispatch → dict)
      - Extract _extract_timings(result) → list[float]
      _detect_regressions_impl (analytics.py:278):
      - Extract _load_result_pair(file1, file2) → (RunResult, RunResult)
      - Extract _detect_query_regression(q1, q2, threshold) → Regression | None

  - id: w4
    summary: "Simplify get_query_plan, register_all_prompts, _run_benchmark_impl, _validate_config_impl"
    needs: []
    status: pending
    notes: |
      get_query_plan (analytics.py:101): extract _resolve_result_file(name) → Path,
        _extract_plan(result, query_id, format) → str
      register_all_prompts (prompts/registry.py:20): similar to resources — extract
        _make_benchmark_prompt(template_fn) factory; repeated @mcp.prompt() patterns.
      _run_benchmark_impl (benchmark.py:239): extract _validate_and_build_config,
        _execute_and_format_result.
      _validate_config_impl (benchmark.py:545): extract per-phase validators as small helpers:
        _validate_platform, _validate_mode, _validate_benchmark each return error | None.

  - id: w5
    summary: "Run smoke tests and complexity check; verify all 8 functions below warn threshold"
    needs: [w1, w2, w3, w4]
    status: pending

metadata:
  estimated_effort: "1 day"
  tags: ["complexity", "refactor", "mcp", "analytics"]

must_preserve:
  - "register_all_resources: all MCP resource URIs and JSON shapes must be identical"
  - "_get_performance_trends_impl: trend values and structure must be numerically identical"
  - "_detect_regressions_impl: regression detection logic and threshold comparison unchanged"
  - "_validate_config_impl: validation error messages must be identical (MCP clients may parse them)"
  - "register_all_prompts: all prompt names, descriptions, and argument specs unchanged"

approach: |
  MCP registration functions: use factory functions that close over data, returning the
  inner handler. This is the same pattern as existing MCP tools in discovery.py
  (already approved as ignore, but the factory approach is worth borrowing).

  Analytics functions: three-phase pattern — load files, compute metric, format output.
  Extract each phase. Avoid shared mutable state between phases.

anti_patterns:
  - "DO NOT rename MCP tool/resource/prompt names — they're part of the public API"
  - "DO NOT change the JSON response structure of any MCP tool or resource"
  - "DO NOT add async to sync functions or remove async from async functions"
  - "DO NOT merge analytics impl functions — keep them separate (each serves a different MCP tool)"

verification:
  - description: "Smoke tests pass"
    command: "uv run -- python -m pytest -m fast -q"
    expected_output: "all tests pass, 0 failures"
  - description: "MCP-specific tests pass"
    command: "uv run -- python -m pytest tests/ -k 'mcp or analytics or benchmark_tool' -q"
    expected_output: "all tests pass, 0 failures"
  - description: "Target functions below warn threshold"
    command: "uv run -- python scripts/check_complexity.py --top 150 2>&1 | grep -E '(register_all_resources|performance_trends|aggregate_results|detect_regressions|get_query_plan|register_all_prompts|run_benchmark_impl|validate_config_impl)'"
    expected_output: "No WARN entries for the 8 target functions"

scope_limit:
  only_modify:
    - "benchbox/mcp/resources/registry.py"
    - "benchbox/mcp/tools/analytics.py"
    - "benchbox/mcp/prompts/registry.py"
    - "benchbox/mcp/tools/benchmark.py"
