  needs: [w1]
  status: done

- id: w3
  summary: "Add MCP-specific CLI arg parsing (--results-dir, --charts-dir, --log-level) and env fallback"
  needs: [w1]
  status: done

- id: w4
  summary: "Inject resolved directories into MCP server registration instead of module constants"
  needs: [w3]
  status: done

- id: w5
  summary: "Route MCP benchmark export writes through configured results_dir"
  needs: [w4]
  status: done

- id: w6
  summary: "Align MCP traversal/safe-root checks with configured results_dir"
  needs: [w4]
  status: pending

- id: w7
