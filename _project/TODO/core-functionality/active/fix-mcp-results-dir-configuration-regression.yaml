- "MCP tools continue to block path traversal outside the configured results root."
- "MCP benchmark responses preserve existing schema fields, including mcp_metadata.result_file."
- "Default behavior remains benchmark_runs/results when no override is provided."

anti_patterns:
- "DO NOT couple MCP flags into benchbox run CLI -- because MCP and CLI are separate interfaces -- keep parsing isolated in
  MCP CLI entrypoint."
- "DO NOT duplicate env/path precedence logic across modules -- because drift will reintroduce inconsistency -- centralize
  in core resolver and reuse."
- "DO NOT keep module-level hard-coded DEFAULT_RESULTS_DIR in MCP tools -- because write/read paths must stay in sync -- inject
  resolved roots at registration time."

