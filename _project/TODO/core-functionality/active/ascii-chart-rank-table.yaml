  created_date: "2026-02-14"

impact:
  business_value: |
    Competitive ranking is the most intuitive format for decision makers evaluating
    platform choices. It directly answers "which platform should we choose?" by
    showing consistent winners across the full query workload.
  user_impact: |
    Users immediately see which platform wins the most queries without mentally
    comparing numbers across a heatmap or bar chart. Tie-breaking and consistency
    patterns become obvious.

files_affected:
  added:
    - benchbox/core/visualization/ascii/rank_table.py
  modified:
    - benchbox/core/visualization/ascii/__init__.py
    - benchbox/core/visualization/exporters.py
    - benchbox/core/visualization/templates.py
    - tests/unit/visualization/ascii/test_ascii_charts.py

must_preserve:
  - "All 9 existing chart types continue to render identically"
  - "render_ascii_chart() in exporters.py handles all existing chart_type strings"
  - "ASCIIHeatmap behavior unchanged (heatmap shows absolute values, rank table shows ordinal positions)"

approach: |
  Build as a table renderer (similar approach to ASCIIHeatmap) with ranking logic:

  1. Create RankTableData (queries list[str], platforms list[str],
     times dict[tuple[platform, query], float]) dataclass.
  2. Create ASCIIRankTable(ASCIIChartBase) with render().
  3. For each query, rank platforms by execution time (lower is better). Handle ties
     by assigning the same rank (1st, 1st, 3rd, 4th for a two-way tie).
  4. Color 1st place green (#1b9e77), last place red (#d95f02), middle ranks dim.
  5. Footer: count 1st-place wins per platform, compute geometric mean of ranks.
  6. Add from_heatmap_data() factory that reuses the same matrix data as ASCIIHeatmap.
  7. Auto-split into multiple charts when queries exceed terminal height (similar to
     histogram chunking pattern).

  Use natural query sort order (Q1, Q2, Q10 not Q1, Q10, Q2) matching
  ASCIIQueryHistogram._natural_sort_key().

anti_patterns:
  - "DO NOT modify ASCIIHeatmap — because the heatmap shows absolute values with
    intensity encoding, while the rank table shows ordinal positions — implement
    as a new class that can accept the same input data"
  - "DO NOT use floating-point rank display — because ranks are ordinal — show
    '1st', '2nd', '3rd' text, not '1.0', '2.0'"

verification:
  - description: "New chart class renders without error"
    command: "uv run -- python -c \"from benchbox.core.visualization.ascii.rank_table import ASCIIRankTable, RankTableData; data = RankTableData(['Q1','Q2'], ['DuckDB','Polars'], {('DuckDB','Q1'): 10, ('Polars','Q1'): 20, ('DuckDB','Q2'): 30, ('Polars','Q2'): 15}); chart = ASCIIRankTable(data=data); print(chart.render())\""
    expected_output: "Rendered table with rank positions and win/loss tally"
  - description: "Existing chart tests still pass"
    command: "uv run -- python -m pytest tests/unit/visualization/ascii/test_ascii_charts.py -v"
    expected_output: "all tests pass, 0 failures"

