  only_modify:
  - benchbox/base.py
  - benchbox/core/base_benchmark.py
  - benchbox/core/benchmark_loader.py
  - benchbox/core/benchmark_registry.py
  - benchbox/core/nyctaxi/benchmark.py
  - benchbox/core/tsbs_devops/benchmark.py
  - benchbox/core/runner/runner.py
  - benchbox/core/contracts/benchmark_runtime.py
  - benchbox/core/results/result_factory.py
  - docs/reference/backward-compatibility.md
  - docs/reference/python-api/base.rst
  - tests/unit/core/test_base_benchmark.py
  - tests/unit/core/test_runner_lifecycle.py
  - tests/unit/core/nyctaxi/test_nyctaxi_benchmark.py
  - tests/unit/core/tsbs_devops/test_tsbs_devops_benchmark.py
  - tests/unit/core/test_benchmark_runtime_contract.py
  - tests/unit/core/test_loader_registry_parity.py

verification:
- description: "Runtime contract tests pass for all loader-resolved benchmark classes"
  command: "uv run -- python -m pytest tests/unit/core/test_benchmark_runtime_contract.py -q"
  expected_output: "all tests pass, 0 failures"
- description: "Loader and registry benchmark sets are aligned and importable"
  command: "uv run -- python -m pytest tests/unit/core/test_loader_registry_parity.py -q"
  expected_output: "all tests pass, 0 failures"
- description: "Result construction paths preserve per-table load timing propagation and zero-duration handling"
  command: "uv run -- python -m pytest tests/unit/core/test_base_benchmark.py tests/unit/core/results/test_builder.py -q"
  expected_output: "all tests pass, 0 failures"
- description: "Lifecycle paths (data_only/load_only/setup_only/standard) behave consistently across representative benchmarks"
  command: "uv run -- python -m pytest tests/unit/core/test_runner_lifecycle.py tests/unit/core/nyctaxi/test_nyctaxi_benchmark.py
    tests/unit/core/tsbs_devops/test_tsbs_devops_benchmark.py -q"
  expected_output: "all tests pass, 0 failures"

success_metrics:
- "All loader-resolved benchmarks implement the canonical runtime contract"
- "Exactly one shared implementation exists for result-construction behavior used by benchmark base classes"
- "No lifecycle mode regression in representative benchmark test matrix"
- "Benchmark loader and registry source sets match with automated parity checks"

open_questions:
- "Should `benchbox.core.base_benchmark.BaseBenchmark` become a shim/re-export or remain as the canonical source with `benchbox.base`
  delegating?"
- "Do we explicitly support third-party custom benchmarks inheriting `benchbox.base.BaseBenchmark` directly, and if so what
  compatibility guarantees are required?"

