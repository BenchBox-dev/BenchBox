id: harmonize-benchmark-runtime-contract-and-base-classes
title: "Harmonize benchmark runtime contract and base classes across all benchmarks"
worktree: core-functionality
priority: High
status: In Progress
category: Core Functionality
description: |
  BenchBox currently has a split benchmark runtime architecture:

  1) Most loader-resolved core benchmarks inherit `benchbox.base.BaseBenchmark`,
     which contains a fallback result-building path.
  2) A smaller subset inherits `benchbox.core.base_benchmark.BaseBenchmark`,
     which has newer lifecycle helpers and result-builder behavior.
  3) Some loader-resolved benchmarks (notably nyctaxi and tsbs_devops) inherit
     neither base class and do not provide required runtime methods such as
     `create_enhanced_benchmark_result`.

  This divergence causes behavioral drift and latent regressions. A recent
  per-table timing fix landed in `benchbox.core.base_benchmark` but did not
  propagate to the dominant `benchbox.base` execution path used by most
  loader-resolved benchmarks.

  This item unifies runtime behavior behind one canonical contract and one
  shared result-construction implementation, then migrates all loader-resolved
  benchmarks to conform to that contract.

metadata:
  tags:
  - architecture
  - benchmark-loader
  - results
  - lifecycle
  - technical-debt
  estimated_effort: Large
  created_date: "2026-02-26"

impact:
  business_value: |
    Eliminates class-path dependent benchmark behavior and reduces future
    regression risk when evolving result schema and lifecycle execution.
  user_impact: |
    Users get consistent phase/result behavior across all benchmarks and modes
    (data_only, load_only, setup_only, standard), regardless of benchmark type.
  technical_debt: |
    Removes duplicated base-class logic and resolves loader/registry drift.

files_affected:
  modified:
  - benchbox/base.py
  - benchbox/core/base_benchmark.py
  - benchbox/core/benchmark_loader.py
  - benchbox/core/benchmark_registry.py
  - benchbox/core/nyctaxi/benchmark.py
  - benchbox/core/tsbs_devops/benchmark.py
  - benchbox/core/runner/runner.py
  - docs/reference/backward-compatibility.md
  - docs/reference/python-api/base.rst
  - tests/unit/core/test_base_benchmark.py
  - tests/unit/core/test_runner_lifecycle.py
  - tests/unit/core/nyctaxi/test_nyctaxi_benchmark.py
  - tests/unit/core/tsbs_devops/test_tsbs_devops_benchmark.py
  added:
  - benchbox/core/contracts/benchmark_runtime.py
  - benchbox/core/results/result_factory.py
  - tests/unit/core/test_benchmark_runtime_contract.py
  - tests/unit/core/test_loader_registry_parity.py

must_preserve:
- "Existing benchmark IDs and CLI benchmark selection behavior remain stable"
- "Result schema v2 output structure remains backward compatible for existing consumers"
- "Current DataFrame execution path behavior and platform metadata remain unchanged"
- "Existing preflight, manifest, and postload validation semantics remain unchanged when enabled"
- "`benchbox.base.BaseBenchmark.create_enhanced_benchmark_result()` remains backward compatible with existing kwargs (`table_statistics`,
  `data_loading_time`, `phases`, `execution_metadata`)"
- "`benchbox.core.runner.runner.run_benchmark_lifecycle()` continues to return `BenchmarkResults` with expected execution
  modes for `data_only`, `load_only`, and setup-only branches"

approach: |
  1) Define and codify one runtime protocol for loader-resolved benchmarks.
  2) Extract shared result-construction logic into a single reusable module.
  3) Make both base classes delegate to that shared implementation, then close
     remaining behavior gaps (minimal results, validation helpers).
  4) Migrate outlier benchmarks (nyctaxi, tsbs_devops) onto the canonical
     runtime base contract with minimal behavior changes.
  5) Unify benchmark loader and benchmark registry metadata sources so supported
     benchmark sets cannot drift.
  6) Add regression tests that assert contract conformance and lifecycle
     behavior parity across representative benchmarks and modes.

anti_patterns:
- "DO NOT patch only one base class path -- because loader-resolved benchmarks use multiple inheritance paths -- centralize
  behavior in one shared implementation"
- "DO NOT silently change benchmark IDs, class names, or public CLI benchmark names -- because that breaks user workflows
  and automation -- preserve external identifiers and add explicit compatibility tests"
- "DO NOT widen scope into unrelated platform adapter refactors -- because this is a runtime-contract harmonization effort
  -- constrain changes to benchmark base/loader/registry/runtime surfaces"

