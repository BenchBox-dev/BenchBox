impact:
  business_value: |
    Without these fixes, SQL vs DataFrame comparisons remain partially invalid
    for TPC-DS and can produce misleading benchmark conclusions under seeded or
    multi-stream scenarios.
  technical_debt: |
    Current module-level override lifecycle and narrow extraction coverage create
    latent correctness risks and brittle parity assumptions. This TODO reduces
    hidden state leakage and formalizes parity-critical extraction behavior.

