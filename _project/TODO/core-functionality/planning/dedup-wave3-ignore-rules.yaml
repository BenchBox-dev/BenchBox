files_affected:
  modified:
    - "pyproject.toml"

verification:
  - description: "Duplicate check passes at lowered threshold"
    command: "make duplicate-check"
    expected_output: "PASS"
  - description: "Suppressed groups no longer appear in verbose output"
    command: "make duplicate-check-verbose 2>&1 | grep -c 'generate_company_dimension\\|supports_acl_introspection\\|validate_customer_tier\\|q26_expression'"
    expected_output: "0"

scope_limit:
  only_modify:
    - "pyproject.toml"

must_preserve:
  - "Existing ignore_rules entries remain intact"
  - "Threshold only lowered, never raised beyond current value"
  - "make duplicate-check still passes in CI"

anti_patterns:
  - "DO NOT add overly broad function name ignores — because broad ignores mask future real duplicates that should be consolidated, defeating the purpose of the checker — always scope with path_contains"
  - "DO NOT duplicate existing rules — because multiple rules matching the same function create maintenance burden when paths change and make it unclear which rule is authoritative — extend existing rules by adding function names or paths"
  - "DO NOT ignore groups that are genuine consolidation candidates — because the wave-3 consolidation TODOs (sql-platform-adapters, core-and-dataframe) target groups where extraction will reduce real maintenance cost — check the companion TODOs before classifying a group as ignore"

metadata:
  tags:
    - code-quality
    - duplicate-check
    - ignore-rules
    - wave-3
  estimated_effort: "1-2 hours"
  created_date: "2026-03-12"
