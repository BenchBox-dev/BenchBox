context_sections:
  "Current Utilities Available": |
    In `benchbox/utils/file_format.py`:
    - `detect_data_format(path)` - Returns format name ('parquet', 'tbl', 'csv'), handles compression
    - `is_tpc_format(path)` - Returns True for .tbl/.dat, handles compression
    - `get_delimiter_for_file(path)` - Returns "|" for TPC, "," otherwise
    - `COMPRESSION_EXTENSIONS` - frozenset of compression extensions

    In `benchbox/platforms/base/data_loading.py`:
    - `FileFormatRegistry.get_base_data_extension()` - Handles sharding AND compression properly

  "Missing Utilities": |
    Need to add (following same pattern as is_tpc_format):
    - `is_parquet_format(path)` - True for .parquet files including .parquet.zst
    - `is_csv_format(path)` - True for .csv files including .csv.gz

  "Pattern to Follow": |
    The existing `is_tpc_format()` shows the correct pattern:

    ```python
    def is_tpc_format(path: Union[str, Path]) -> bool:
        path = Path(path)
        for suffix in path.suffixes:
            suffix_lower = suffix.lower()
            if suffix_lower in COMPRESSION_EXTENSIONS:
                continue
            return suffix_lower in TPC_FORMAT_EXTENSIONS
        return False
    ```

  "Locations Requiring Fixes": |
    | File | Line | Pattern | Issue |
    |------|------|---------|-------|
    | fabric_warehouse.py | 928-929 | `suffix == ".parquet"` | Doesn't handle .parquet.zst |
    | postgresql.py | 458-460 | `suffix == ".tbl/.csv"` | Doesn't handle compression |
    | pandas_family.py | 1225-1231 | `suffix == ".parquet"` | Doesn't handle compression |
    | snowpark_connect.py | 348 | `suffix == ".parquet"` | Doesn't handle compression |
    | base/utils.py | 42 | `endswith(".parquet")` | Doesn't handle sharding |
    | tpcds/runner.py | 1016 | `suffix == ".csv"` | Doesn't handle compression |

impact:
  technical_debt: |
    Medium severity - code works for uncompressed files but will fail silently
    for compressed parquet/csv files, causing incorrect format detection and
    potentially data loading failures.

  user_impact: |
    Users with compressed parquet or CSV files may experience incorrect
    data loading behavior. This is increasingly important as compression
    becomes more common for large-scale benchmarks.

