verification:
  - description: "Primitives benchmark tests pass"
    command: "uv run -- python -m pytest tests/ -v -k 'primitive or transaction or write_prim'"
    expected_output: "all tests pass"
  - description: "TPC official benchmark tests pass"
    command: "uv run -- python -m pytest tests/ -v -k 'official or audit'"
    expected_output: "all tests pass"
  - description: "DataFrame platform tests pass"
    command: "uv run -- python -m pytest tests/ -v -k 'dataframe or unified_frame or datafusion'"
    expected_output: "all tests pass"
  - description: "CLI command tests pass"
    command: "uv run -- python -m pytest tests/ -v -k 'qphh or metrics'"
    expected_output: "all tests pass"
  - description: "Duplicate check shows reduction"
    command: "make duplicate-check-verbose 2>&1 | head -5"
    expected_output: "duplicated lines lower than pre-wave3 count"

scope_limit:
  only_modify:
    - "benchbox/core/"
    - "benchbox/platforms/dataframe/unified_frame.py"
    - "benchbox/platforms/dataframe/datafusion_df.py"
    - "benchbox/cli/commands/"
    - "tests/"

must_preserve:
  - "_table_exists returns identical bool for all table existence checks"
  - "get_create_tables_sql produces identical DDL strings"
  - "Ranking algorithms produce identical rank orderings and scores"
  - "Audit trail output format and content identical for TPC-DS and TPC-H"
  - "Cast methods return identical UnifiedExpr types across all platforms"
  - "TPC-DI loader produces identical loaded data for dimension and fact tables"
  - "DataFusion window functions produce identical rank semantics"
  - "CLI text output formatting identical in both commands"
  - "Registry query listings return identical dictionaries"

anti_patterns:
  - "DO NOT change public method signatures — only extract internal dispatch logic"
  - "DO NOT use getattr-based dynamic dispatch for _apply_cast — pass explicit type strings, not Python type objects, to maintain IDE navigability"
  - "DO NOT merge transaction_primitives and write_primitives benchmark modules — only share the specific duplicated helper functions"
  - "DO NOT create abstract base classes for the registries — a simple shared function with module_path parameter is sufficient"
  - "DO NOT combine the ranking refactor with any changes to the ranking algorithm itself — only extract the shared scaffolding"

