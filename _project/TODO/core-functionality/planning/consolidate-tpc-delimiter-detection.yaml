context_sections:
  "New Utilities Available": |
    Added to `benchbox/utils/file_format.py`:

    ```python
    from benchbox.utils.file_format import (
        is_tpc_format,
        get_delimiter_for_file,
        TPC_FORMAT_EXTENSIONS,
    )

    # Check if file is TPC format
    is_tpc_format("lineitem.tbl")      # True
    is_tpc_format("store_sales.dat")   # True
    is_tpc_format("lineitem.tbl.zst")  # True (handles compression)
    is_tpc_format("data.csv")          # False

    # Get delimiter directly
    get_delimiter_for_file("lineitem.tbl")  # "|"
    get_delimiter_for_file("data.csv")      # ","
    ```

  "Patterns to Refactor": |
    **Current (duplicate logic):**
    ```python
    delimiter = "|" if ".tbl" in file_str or ".dat" in file_str else ","
    ```

    **Target (centralized):**
    ```python
    delimiter = get_delimiter_for_file(file_path)
    ```

    Or for boolean checks:
    ```python
    # Current
    if ".tbl" in file_str or ".dat" in file_str:

    # Target
    if is_tpc_format(file_path):
    ```

  "Note on Tuple/List Patterns": |
    Locations using tuple/list membership like `suffix in (".tbl", ".dat")`
    should ALSO be updated to use the centralized utilities. This ensures:
    1. Single source of truth for TPC format extensions
    2. Proper handling of compressed files (e.g., .tbl.zst)
    3. Easier extension when new formats are added

    If a platform needs custom logic, it should use the central utility
    and override the result rather than duplicating the extension list.

impact:
  technical_debt: |
    Low severity - code works correctly but has duplicated logic.
    The new utilities handle compression extensions correctly, which
    some current implementations may not handle properly.

  user_impact: |
    None - internal refactoring only.

