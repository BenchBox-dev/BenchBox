context_sections:
  "Background and Motivation": |
    The ResultPlotter._normalize_dict() method was generating empty charts
    because it expected v1.x schema paths (results.timing, results.queries.details)
    but the benchmark runner outputs v2.x schema (summary.timing, top-level queries).

    The immediate fix added v2.x support to result_plotter.py, but this created
    more duplication since ResultExporter already had similar v2.x handling.

  "Identified Duplication Points": |
    1. ResultPlotter._normalize_dict() - extracts benchmark, platform, timing, queries
    2. ResultExporter._extract_performance_metrics() - extracts timing, query counts
    3. ResultExporter._extract_query_map() - extracts per-query timing data
    4. loader.reconstruct_benchmark_results() - full reconstruction from JSON
    5. loader._reconstruct_query_results() - extracts query details

    All implement: schema version detection, conditional field paths, field mapping.

  "Schema Differences": |
    v1.x Schema:
    - results.timing.total_ms
    - results.queries.details[] with execution_time_ms
    - execution.platform, execution.timestamp

    v2.x Schema:
    - summary.timing.total_ms
    - queries[] (top-level) with ms field
    - platform.name, run.timestamp

