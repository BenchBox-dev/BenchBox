id: dedup-tpcds-constants-empty-results
title: "Extract TPC-DS canonical table list and shared _empty_results to constants"
worktree: core-functionality
priority: Low
status: Not Started
category: Core Functionality
description: |
  Group 15 from the duplicate-check report identifies two consolidation targets:

  1. TPC-DS canonical table names (~24-element list): duplicated identically in
     - benchbox/core/tpcds/c_tools.py:136
     - benchbox/core/tpcds/generator/manager.py:178
     - benchbox/core/tpcds/benchmark/runner.py:404
     This is a TPC-DS specification constant that should be defined once.

  2. _empty_results (zero-valued results dict): duplicated between
     benchbox/core/tpc_patterns.py:559 and benchbox/base.py:178.
     This is a shared result schema for stream/throughput result builders.

approach: |
  1. Create or add to `benchbox/core/tpcds/constants.py`:
     `TPCDS_TABLE_NAMES: list[str] = ["call_center", "catalog_page", ...]`
  2. Replace the 3 copies with imports from constants module
  3. For _empty_results, determine the canonical location (likely tpc_patterns.py)
     and have base.py import from there

