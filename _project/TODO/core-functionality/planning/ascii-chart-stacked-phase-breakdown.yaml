impact:
  business_value: |
    Phase-level timing analysis is a core part of TPC compliance reporting.
    Understanding where time is spent guides optimization decisions and platform
    selection based on workload characteristics.
  user_impact: |
    Users see at a glance whether a platform is slow because of data loading
    vs query execution, enabling informed platform selection for their
    specific workload pattern (batch ETL vs interactive queries).

