    command: "uv run -- python -c \"from benchbox.core.visualization.ascii.stacked_bar import ASCIIStackedBar, StackedBarData, StackedBarSegment; segs = [StackedBarSegment('Load', 2.0), StackedBarSegment('Power', 8.0), StackedBarSegment('Throughput', 4.0)]; data = [StackedBarData('DuckDB', segs, 14.0)]; chart = ASCIIStackedBar(data=data); print(chart.render())\""
    expected_output: "Rendered chart with one platform row showing stacked segments"
  - description: "Existing chart tests still pass"
    command: "uv run -- python -m pytest tests/unit/visualization/ascii/test_ascii_charts.py -v"
    expected_output: "all tests pass, 0 failures"

