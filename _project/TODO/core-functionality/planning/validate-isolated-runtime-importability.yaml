id: validate-isolated-runtime-importability
title: "Validate isolated runtime importability before treating as cache hit"
worktree: core-functionality
priority: High
status: Not Started
category: Core Functionality
description: |
  Bug discovered on 2026-02-24: `driver_auto_install=true` silently fails when a
  corrupted isolated runtime exists on disk. The root cause is a two-layer failure:

  Layer 1 — Discovery short-circuits auto-install:
  In runtime_env.py lines 340–355, `discover_isolated_runtime()` runs before any
  auto-install logic. If it finds a metadata match, it returns immediately and
  auto-install is never reached. A broken isolated runtime at
  `benchmark_runs/duckdb_version_envs/duckdb-1.2.2/` was discovered via
  `importlib.metadata` (which only reads `.dist-info/METADATA` files — no actual
  module import), so the metadata check passed and the corrupted runtime was returned.

  Layer 2 — Python ABI mismatch makes the runtime unusable:
  The DuckDB 1.2.2 C extension was installed under Python 3.12
  (`duckdb.cpython-312-darwin.so`) but BenchBox was running under Python 3.10.
  Python 3.10 cannot load a 3.12 C extension, causing
  `ModuleNotFoundError: No module named 'duckdb.duckdb'` at import time.

  The downstream `load_driver_module()` (line 184) does perform an actual import and
  path validation, but by the time it runs the damage is done: `ensure_driver_version()`
  already returned a resolution claiming the runtime is valid, and the error surfaces
  as an opaque import failure rather than a clear "stale/incompatible runtime" message
  with recovery guidance.

  The fix: `discover_isolated_runtime()` must validate that a candidate runtime is
  actually importable (not just metadata-present) before treating it as a cache hit.
  When validation fails, the candidate should be skipped (allowing auto-install to
  proceed) and a warning should be logged.

context_sections:
  "Background and Motivation": |
    The `platform-driver-runtime-isolation` TODO (completed 2026-02-20) built the
    isolated runtime discovery and loading infrastructure. The discovery function
    (`discover_isolated_runtime`, runtime_env.py:122-159) was designed to be
    lightweight — scanning `.dist-info/METADATA` without importing modules. This was
    a reasonable design choice for speed, but it means corrupted or ABI-incompatible
    runtimes pass discovery and only fail at load time.

    The `load_driver_module()` function (runtime_env.py:184-232) already validates
    imports and checks `module.__file__` paths, but this runs too late in the flow.
    By the time it's called, `ensure_driver_version()` has already returned a
    `DriverResolution` claiming `isolated-site-packages` strategy, and the auto-install
    code path was never reached.

  "Technical Context": |
    Affected code path: `ensure_driver_version()` → `discover_isolated_runtime()` →
    returns `DriverRuntimeLocation` → caller uses it → `load_driver_module()` fails.

    The import validation in `load_driver_module()` catches the error but produces a
    confusing error message because the context of "why" is lost. The user sees a
    `ModuleNotFoundError` instead of "isolated runtime at X is incompatible with
    Python Y — deleting and re-installing".

    Key constraint: the fix must not make discovery slow for the common case (valid
    runtimes). A full import is expensive (~50-200ms for DuckDB). A lightweight
    ABI check (verifying `.so` filename contains the current `cpython-3XX` tag) is
    much cheaper (~1ms) and catches the most common failure mode.

metadata:
  tags:
    - runtime-isolation
    - driver-versioning
    - correctness
    - auto-install
    - abi-compatibility
  estimated_effort: "1-2 days"
  created_date: "2026-02-24"

impact:
  business_value: |
    Prevents silent failures when users request specific driver versions with
    auto-install enabled. Currently, a stale runtime from a different Python
    version causes an opaque import error with no recovery path.
  user_impact: |
    Users running `--platform-option driver_version=X driver_auto_install=true`
    get a working runtime instead of a confusing ModuleNotFoundError. When a stale
    runtime is detected, they get a clear warning and automatic fallthrough to
    auto-install.
  technical_debt: |
    Closes a gap in the runtime isolation design where metadata-only validation
    was insufficient for C extension packages with ABI version constraints.

