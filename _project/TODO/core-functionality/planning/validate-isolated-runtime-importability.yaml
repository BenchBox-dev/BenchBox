  modified:
    - benchbox/utils/runtime_env.py
    - tests/unit/utils/test_runtime_env.py
  added: []
  removed: []

work:
  - id: w1
    summary: "Add _validate_runtime_importable() helper with lightweight ABI check
      on discovered isolated runtimes using extension file suffix matching"
    status: pending
    notes: |
      Use importlib.machinery.EXTENSION_SUFFIXES to get valid suffixes for the running
      interpreter (e.g., ['.cpython-310-darwin.so', '.abi3.so', '.so']).
      Scan the package-specific subdirectory (site_packages / normalized_package) for
      .so/.pyd files — not the entire site-packages tree. The normalized_package variable
      is already in scope at the call site in discover_isolated_runtime(). For example,
      for duckdb the scan target is site-packages/duckdb/, where the .so lives at
      duckdb/duckdb.cpython-3XX-platform.so.
      If extension files exist but none have a suffix in EXTENSION_SUFFIXES, return False.
      If no extension files exist (pure Python package), return True.
      Note: .abi3.so (stable ABI) extensions are cross-version compatible and are
      correctly accepted because EXTENSION_SUFFIXES includes them.

  - id: w2
    summary: "Integrate validation into discover_isolated_runtime() — call
      _validate_runtime_importable() on each candidate before returning it; log a
      warning and continue scanning on validation failure"
    needs: [w1]
    status: pending
    notes: |
      In the loop at runtime_env.py:147-158, after version match is confirmed, call
      the validator. On failure, log a warning like:
      'Skipping isolated runtime at {site_packages}: ABI mismatch (found cpython-312,
      need cpython-310). Delete this runtime or rebuild for current Python.'
      Then `continue` to the next candidate instead of returning.
      Use logging.getLogger(__name__).warning() consistent with existing patterns.

  - id: w3
    summary: "Add unit tests for validation and skip-on-failure behavior, then run
      full verification suite to confirm zero regressions"
    needs: [w2]
    status: pending
    notes: |
      Test cases:
      1. Candidate with cpython-312 .so but running cpython-310 → skipped, returns None
      2. Candidate with correct ABI .so → returned as valid
      3. Candidate with no .so files (pure Python) → returned as valid
      4. Candidate with .abi3.so (stable ABI) → returned as valid
      5. Two candidates: first has wrong ABI, second is valid → second returned
      6. Integration: ensure_driver_version() with corrupted isolated runtime falls
         through to auto-install path when driver_auto_install=True
      Use tmp_path fixtures and fake .so file creation (same pattern as existing
      test_discover_isolated_runtime_finds_matching_version).
      After tests pass, run full verification suite (see verification section).

