must_preserve:
  - "All 9 existing chart types continue to render identically"
  - "render_ascii_chart() in exporters.py handles all existing chart_type strings"
  - "ASCIIBarChart behavior unchanged (this is a new chart type, not a modification)"

approach: |
  Follow the pattern in benchbox/core/visualization/ascii/diverging_bar.py for the
  centered-zero layout with bars extending left and right from a reference line:

  1. Create SpeedupData dataclass (name, ratio, is_baseline).
  2. Create ASCIINormalizedSpeedup(ASCIIChartBase) with a render() method.
  3. Draw a vertical baseline reference line at 1.0x in the center.
  4. Ratios > 1.0 extend right (faster, green), ratios < 1.0 extend left (slower, red).
  5. Add from_normalized_results() factory that computes ratios given results + baseline name.
  6. Use logarithmic scaling for the bar width to handle large ratio ranges (e.g., 0.1x to 50x).

  The baseline platform selection should accept either a platform name or "slowest"/"fastest"
  as convenience aliases.

anti_patterns:
  - "DO NOT use linear scaling for bar widths — because ratios can span 0.01x to 100x —
    use log2 scaling so 2x and 0.5x are symmetric around the baseline"
  - "DO NOT modify ASCIIBarChart or ASCIIDivergingBar — because they serve different purposes
    (absolute values, pct change) — implement as a new class"

verification:
  - description: "New chart class renders without error"
    command: "uv run -- python -c \"from benchbox.core.visualization.ascii.normalized_speedup import ASCIINormalizedSpeedup, SpeedupData; data = [SpeedupData('SQLite', 1.0, True), SpeedupData('DuckDB', 8.2, False), SpeedupData('Pandas', 0.4, False)]; chart = ASCIINormalizedSpeedup(data=data); print(chart.render())\""
    expected_output: "Rendered chart with baseline at center and bars extending left/right"
  - description: "Existing chart tests still pass"
    command: "uv run -- python -m pytest tests/unit/visualization/ascii/test_ascii_charts.py -v"
    expected_output: "all tests pass, 0 failures"

