  created_date: "2026-02-14"

impact:
  business_value: |
    This is the formal reporting format for TPC publications, SPEC CPU benchmarks,
    and academic papers. Adding this chart elevates BenchBox output to publication
    quality and enables direct comparison with industry benchmark results.
  user_impact: |
    Users comparing platforms with vastly different performance levels (e.g., DuckDB vs
    Pandas) get a readable chart where all platforms are visible and directly comparable,
    rather than having fast platforms squished into invisible slivers.

