id: arm-hyperscaler-comparison-benchmarks
title: "[ARM Series] Run hyperscaler ARM comparison (Graviton 4 vs Cobalt 100 vs Axion)"
worktree: blog-content
priority: Medium
status: Not Started
category: Blog Revision
description: |
  Run identical benchmarks across all three hyperscaler ARM platforms to
  transform the hyperscaler-comparison.md draft from architecture speculation
  into a data-driven comparison.

  Currently the post makes workload recommendations based on architecture
  theory ("V2's higher IPC helps latency-sensitive work") without testing.
  We need to replace speculation with measurements.

  This is a unique opportunity - no one has published reproducible benchmark
  comparisons of Graviton 4 vs Cobalt 100 vs Axion. We can be first.

  Reference draft: _blog/arm-performance/drafts/hyperscaler-comparison.md

metadata:
  tags:
  - arm-performance
  - graviton
  - cobalt
  - axion
  - cloud-benchmarking
  - cross-cloud
  - blog-data
  estimated_effort: "3-4 hours"
  budget_allocated: "$40-60 estimated (AWS + Azure + GCP)"
  created_date: "2025-12-15"

  related:
  - snowflake-gen2-comparison-benchmarks
  migration_review_required: true
impact:
  business_value: |
    First-to-market with reproducible cross-hyperscaler ARM benchmarks.
    Establishes BenchBox as the source for cloud platform comparisons.
    Demonstrates multi-cloud benchmarking capability.
  user_impact: |
    Gives users concrete data for multi-cloud ARM decisions. Provides
    reproducible methodology they can run on their own accounts.
    Replaces vendor marketing with independent measurements.

technical_requirements:
  dependencies:
  - "AWS account with EC2 access (c8g instances)"
  - "Azure account with Cobalt 100 VMs (Dpsv6 series)"
  - "GCP account with Axion access (C4A instances)"
  - "BenchBox installed on each platform"
  constraints:
  - "Use equivalent vCPU count (64) for fair comparison"
  - "Identical benchmark configuration across all platforms"
  - "Document all regional variations"
  compatibility: |
    All platforms run Ubuntu 22.04 LTS with ARM64 architecture.
    DuckDB ARM64 builds available for all three.

files_affected:
  modified:
  - "_blog/arm-performance/drafts/hyperscaler-arm-comparison.md"

success_metrics:
- "All 6 benchmark runs complete (3 platforms × 2 benchmarks)"
- "Query-level comparison table generated"
- "Price-performance calculated for each platform"
- "Draft restructured to be results-first"
- "Workload recommendations backed by data"

open_questions:
- "Should we include ClickBench for single-table scan comparison?"
- "Do we have Azure and GCP credentials configured?"
- "Which regions give best pricing for ARM instances?"

