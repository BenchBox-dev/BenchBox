impact:
  business_value: |
    First-to-market with reproducible cross-hyperscaler ARM benchmarks.
    Establishes Oxbow/BenchBox as the source for cloud platform comparisons.
    Demonstrates multi-cloud benchmarking capability.
  user_impact: |
    Gives users concrete data for multi-cloud ARM decisions. Provides
    reproducible methodology they can run on their own accounts.
    Replaces vendor marketing with independent measurements.

technical_requirements:
  dependencies:
    - "AWS account with EC2 access (c8g instances)"
    - "Azure account with Cobalt 100 VMs (Dpsv6 series)"
    - "GCP account with Axion access (C4A instances)"
    - "BenchBox installed on each platform"
  constraints:
    - "Use equivalent vCPU count (64) for fair comparison"
    - "Identical benchmark configuration across all platforms"
    - "Document all regional variations"
  compatibility: |
    All platforms run Ubuntu 22.04 LTS with ARM64 architecture.
    DuckDB ARM64 builds available for all three.

