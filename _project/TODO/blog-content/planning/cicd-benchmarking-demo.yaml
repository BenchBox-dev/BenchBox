description: |
  Add a practical BenchBox-based example to the CI/CD benchmarking post.

  The post argues for continuous benchmarking to detect platform regressions
  but doesn't demonstrate how to do it. Adding a concrete BenchBox workflow
  example would strengthen the argument and showcase BenchBox capabilities.

  The example should show:
  1. Running a baseline benchmark
  2. Running a comparison benchmark
  3. Detecting and reporting differences

  Reference draft: _blog/business-of-analytics/drafts/p3.4-cicd-benchmarking.md

