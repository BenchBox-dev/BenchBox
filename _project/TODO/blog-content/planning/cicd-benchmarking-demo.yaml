        - summary: "Run baseline benchmark"
          done: false
          subtasks:
            - summary: "benchbox run --platform duckdb --benchmark tpch --scale 1 --output baseline"
              done: false
        - summary: "Run comparison benchmark"
          done: false
          subtasks:
            - summary: "benchbox run --platform duckdb --benchmark tpch --scale 1 --output current"
              done: false
