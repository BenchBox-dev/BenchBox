id: arm-graviton-generations-benchmarks
title: "[ARM Series] Run Graviton generations benchmark suite (G2/G3/G4)"
worktree: blog-content
priority: Medium-High
status: Not Started
category: Blog Revision
description: |
  Run comparative benchmarks across AWS Graviton generations (G2, G3, G4) to
  transform the graviton-generations.md draft from an architecture summary
  into a data-driven benchmark analysis.

  Currently the post cites AWS marketing claims ("+25% general compute",
  "+2x floating point") without independent verification. We need to replace
  these vendor numbers with our own measurements.

  This aligns with the style guide principle: "Lead with data, not opinions...
  Every claim should be backed by benchmark results with specific numbers,
  reproducible methodology."

  Reference draft: _blog/arm-performance/drafts/graviton-generations.md

