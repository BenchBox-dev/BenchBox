impact:
  business_value: |
    Transforms the post from a vendor spec summary (what WikiChip does) into
    original benchmark analysis (unique Oxbow value). Validates or refutes
    AWS's performance claims with independent data.
  user_impact: |
    Gives users reproducible commands to verify Graviton performance on their
    own accounts. Provides concrete upgrade guidance based on benchmark patterns.

technical_requirements:
  dependencies:
  - "AWS account with EC2 access"
  - "Ability to launch c6g, c7g, c8g instance families"
  - "BenchBox installed on each instance"
  constraints:
  - "Use identical vCPU count (64) for fair comparison"
  - "Same scale factors across all runs"
  - "Document instance launch time and region"

files_affected:
