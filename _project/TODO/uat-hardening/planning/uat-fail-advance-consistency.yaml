id: uat-fail-advance-consistency
title: "Make FAIL-and-advance vs abort semantics consistent: report-without-execute, explorer-smoke failures, startup-failed accounting, teardown abort policy"
worktree: uat-hardening
priority: Medium
status: Not Started
category: "Error Handling / Consistency"

description: |
  Four inconsistencies in the abort/advance decision matrix, verified on
  develop @ fc31f3604:

  1. REPORT WITHOUT EXECUTE SILENTLY SUCCEEDS: validate and package abort
     when execute has not run (orchestrator.py:369-372, :408-411) but
     report proceeds with empty rows (`cells = ... if execute_outcome else
     []`, orchestrator.py:460) and exits 0 -- an empty report reads as a
     clean sweep.

  2. EXPLORER SMOKE IS BOTH TOO LOUD AND TOO QUIET: empty/malformed corpus
     raises uncaught RuntimeError (phases/explorer_smoke.py:305, :343; no
     try in run_sweep's branch, orchestrator.py:447-457) -- a crash with no
     abort artifacts. Meanwhile a missing `node` binary returns
     skipped-with-exit-0 (explorer_smoke.py:160-169) -- a sweep on a
     machine without Node silently drops all browser coverage. Both ends
     need structured results: corpus problems become a structured phase
     failure (abort artifacts emitted); node-missing becomes a recorded
     skip that downstream accounting can see (explorer_smoke_status in the
     sidecar) instead of an invisible exit 0.

  3. STARTUP-FAILED INDISTINGUISHABLE FROM UNREACHABLE: managed compose-up
     failure routes cells into skipped_unreachable (execute.py:176-186) --
     correct advance semantics (#700), but accounting cannot distinguish
     "stack failed to start" from "TCP probe found nothing listening"; the
     distinction survives only in uat_lifecycle.log. Add a separate
     startup_failed count to ExecuteOutcome and the accounting sidecar.

  4. BROKEN STACK DEFEATS ITS OWN ADVANCE: after startup-failed,
     started=True is set unconditionally (execute.py:315-320) so the
     finally teardown runs; if `compose down` on that same broken stack
     also fails, teardown_abort_reason becomes a GLOBAL abort
     (execute.py:236-241) -- the advance-past-broken-stack intent
     (comment at execute.py:176-185) is defeated by the same broken
     stack's teardown. Policy fix: teardown failure aborts only for stacks
     that STARTED successfully (a healthy stack we cannot tear down is a
     real resource-leak emergency); teardown failure after startup-failed
     records a lifecycle event and advances.

prior_art:
  - "tests/uat/phases/execute.py:176-186 -- the #700 FAIL-and-advance pattern; findings 3/4 refine it, keeping its shape. Extend."
  - "tests/uat/orchestrator.py:_emit_abort_artifacts -- structured-abort machinery the explorer-smoke failure path should flow through instead of raising raw RuntimeError. Reuse."
  - "cells.jsonl.accounting.json sidecar (written via the cells_io module after uat-execute-path-unification) -- where startup_failed and explorer_smoke_status counters land. Extend."

work:
  - id: w1
    summary: "Report phase aborts (like validate/package) when execute is absent from the sweep run; standalone `make uat-report` from cells.jsonl unaffected"
    status: pending
    needs: []
  - id: w2
    summary: "Explorer-smoke corpus errors become a structured phase failure with abort artifacts; node-missing becomes a recorded sidecar skip with a prominent warning, not an invisible exit 0"
    status: pending
    needs: []
  - id: w3
    summary: "Split startup_failed out of skipped_unreachable: new counter on ExecuteOutcome, sidecar, and report accounting footer; report exit code treats startup_failed like unreachable (nonzero)"
    status: pending
    needs: []
  - id: w4
    summary: "Teardown-failure policy: global abort only when the stack had started successfully; startup-failed stacks record the teardown failure as a lifecycle event and advance; tests for both directions"
    status: pending
    needs: [w3]

deferred:
  - summary: "phases: list order/duplicate validation at config load"
    reason: "Config-load validation is consolidated in uat-config-schema-spec-realignment to keep schema changes in one PR."

deps:
  needs: [uat-execute-path-unification]

must_preserve:
  - "#700 semantics: compose-up failure never aborts the whole sweep."
  - "#699 semantics: dask cluster death stays FAIL-and-advance."
  - "Healthy-stack teardown failure remains a global abort (resource-leak emergency)."
  - "Standalone make uat-report over an existing cells.jsonl keeps working without an execute phase in the same process."

approach: |
  Four small, independent behavior fixes; w3 touches the accounting
  identity so update test_report_accounting.py's identity assertions in
  the same commit. The sidecar gains fields -- additive only, and the
  missing-sidecar default (estimated flag) behavior from #902 stays.

anti_patterns:
  - "DO NOT fold startup_failed into the fail count -- it is an environment condition, not a cell failure; it gets its own counter and its own exit-code contribution."
  - "DO NOT make node-missing a hard failure -- macOS operator machines legitimately lack node for non-explorer sweeps; visibility, not blockage."

verification:
  - description: "Abort/advance decision-matrix regression tests"
    command: "uv run -- python -m pytest tests/uat/test_orchestrator.py tests/uat/test_phases.py tests/uat/test_explorer_smoke.py tests/uat/test_report_accounting.py -q"
    expected_output: "pass, including report-without-execute abort, corpus-failure structured abort, startup_failed accounting, teardown-policy both directions"

scope_limit:
  only_modify:
    - "tests/uat/orchestrator.py"
    - "tests/uat/cells_io.py"
    - "tests/uat/phases/execute.py"
    - "tests/uat/phases/explorer_smoke.py"
    - "tests/uat/phases/report.py"
    - "tests/uat/_cli.py"
    - "tests/uat/test_orchestrator.py"
    - "tests/uat/test_phases.py"
    - "tests/uat/test_explorer_smoke.py"
    - "tests/uat/test_report.py"
    - "tests/uat/test_report_accounting.py"

