context_sections:
  "Background and Motivation": |
    The current v1.1 schema evolved organically and accumulated significant issues:
    - Platform info appears in 4 different locations
    - Timing data is split across results.timing and phases.setup.*.duration_ms
    - Query details use 7 lines per query when 1 line suffices
    - Many null-filled error fields that are rarely used

    Analysis of 4 different benchmark result files revealed the need to support:
    - Multi-iteration runs (Data Vault with 3 iterations)
    - Query subsets (ClickHouse with specific queries)
    - Multiple streams (throughput testing)
    - Different query ID formats (numeric, descriptive strings)
    - TPC-specific metrics (power_at_size, geometric_mean)
    - Statistical percentiles (p90, p95, p99, stdev)

  "Technical Context": |
    Key design decisions:
    1. Query plans → separate companion file ({run_id}_plans.json)
    2. SQL text → omit entirely (available in benchmark source)
    3. Phase details → flatten into main file
    4. Tuning → platform.tuning summary + optional companion file

    Compact query format: {"id": "Q1", "ms": 632.9, "rows": 100}
    With optional fields: {"id": "1", "ms": 189.2, "rows": 4, "iter": 1, "stream": 1}

