id: results-explorer-release-gate-reconciliation-after-contract-fixes
title: "Reconcile Results Explorer release gates after contract-level fixes"
worktree: results-explorer-contract-followup
priority: Critical
status: Blocked
category: Testing and Quality Assurance

description: |
  The comprehensive post-remediation run still left the Results Explorer
  Chromium e2e gate red with 60 passing tests, 6 failures, 10 skipped tests, and
  23 unrun tests. Several failures are likely stale assertions, but others map
  to real product regressions: missing Matrix receipt/detail links, disabled-row
  selection assumptions, mobile density, stale corpus-summary copy, changed sort
  semantics, and result-detail column label changes.

  This TODO is the final reconciliation gate after the identity/link, trend,
  metric/scope, and home/theme TODOs are implemented. It must classify every
  failing assertion as either a product bug or a stale test, update tests only
  when product intent is documented, and block completion until automated and
  browser evidence agree.

deps:
  needs:
  - results-explorer-public-run-identity-and-receipt-reachability
  - results-explorer-trend-chart-point-identity-and-same-day-semantics
  - results-explorer-metric-display-precision-and-scope-copy
  - results-explorer-home-theme-and-responsive-density-contract

blockers:
- date: "2026-05-12"
  work: [w1, w2, w3, w4, w5]
  reason: "Contract TODOs that define expected identity, trend, metric/scope, and home/theme behavior must land before the release gate can classify e2e failures as stale tests or product bugs."
  unblock: "Complete all dependency TODOs and rerun the release gate from the same checked SHA."

work:
- id: w0
  summary: "Reproduce and classify every current release-gate failure"
  status: pending
  notes: |
    Run the Results Explorer build, unit tests, and Chromium e2e gate on the
    checked SHA. For each failure, record:
      - test file and assertion;
      - route and control involved;
      - observed behavior;
      - expected behavior under the documented product contract;
      - classification as product bug, stale test, fixture/data issue, or
        environment flake;
      - owner TODO or fix PR.
    The known failure list to classify includes Matrix receipt/detail link
    assertions, disabled-row compare selection, responsive first-row budget,
    stale corpus-summary copy, benchmark platform sort order, and result-detail
    median-column label expectations.

- id: w1
  summary: "Route product defects through dependency TODOs before changing tests"
  needs: [w0]
  status: pending
  notes: |
    For failures classified as product bugs, stop the gate and return the issue
    to the relevant dependency TODO or create a focused follow-up if no
    dependency owns it. This gate should not patch production UI code directly
    except by resuming a dependency TODO. Do not weaken tests first. At minimum,
    verify the fixes for:
      - Matrix and Ranks result-detail/receipt reachability;
      - compare selection logic that skips disabled rows or explains why a row
        cannot be selected;
      - mobile home density under the accepted budget;
      - result-detail metric labels that match the rendered data.

- id: w2
  summary: "Update stale tests to assert documented product contracts"
  needs: [w0, w1]
  status: pending
  notes: |
    For failures classified as stale tests, update selectors and assertions to
    match the documented contract. Examples:
      - platform sort tests should assert the chosen deterministic order for
        base names versus variant names;
      - result-detail tests should assert `Median latency` if that is the
        accepted label, including units elsewhere;
      - home smoke tests should assert current scope/corpus copy, not removed
        legacy strings;
      - compare selection tests should select the first enabled row or assert
        disabled-state recovery copy.
    Decision gate: every test edit must cite the product contract it now
    enforces in code comments, helper names, or PR notes.

- id: w3
  summary: "Add missing contract regression tests for new issues"
  needs: [w1, w2]
  status: pending
  notes: |
    Add or extend tests for:
      - public run identity consistency across row, tray, detail, chart, and
        receipt surfaces;
      - Matrix/Ranks detail link availability;
      - trend point identity and duplicate-day semantics;
      - result-detail scan precision versus exact audit precision;
      - leaderboard ranked/unranked/total scope copy;
      - home theme/corpus-summary/responsive density contract.

- id: w4
  summary: "Run the full Results Explorer release gate"
  needs: [w3]
  status: pending
  notes: |
    Run the same release-gate commands used for the failing review. Capture
    command status, counts, and failure tails under
    `_project/verification-logs/results-explorer-release-gate-reconciliation-after-contract-fixes/`.
    Decision gate: this TODO cannot move to DONE with failing Chromium e2e,
    typecheck, build, or targeted unit tests unless the failure is documented as
    an external/environment issue with a separate follow-up.

- id: w5
  summary: "Perform browser acceptance on every Results Explorer route"
  needs: [w4]
  status: pending
  notes: |
    Restart the local dev server and manually/browser-automate:
      - Leaderboards filters, sorting, comparison entrypoint, theme, mobile
        density, and scope copy;
      - Benchmarks index and one benchmark detail page across Matrix, Ranks,
        List, chart tabs, benchmark switcher, scale switcher, selection, detail
        links, and receipts;
      - Platforms index and one platform detail page across filters, trend,
        chart tabs, platform switcher, selection, detail links, and receipts;
      - Compare empty builder, share URL, baseline selector, warning links,
        chart tabs, selected cards, and result links;
      - Query Workbench facets, visible columns, SQL disclosure, exports,
        sorting, row detail links, and compare selection;
      - Result detail breadcrumb, compare action, receipt/audit data, metric
        labels, and navigation back to related benchmark/platform pages.
    Click every visible button/link/control at least once unless it is external
    or destructive. Record remaining defects with root cause, blind spot, and
    deeper consideration.

- id: w6
  summary: "Write the final closure artifact"
  needs: [w5]
  status: pending
  notes: |
    Write a compact audit artifact at
    `_project/audits/results-explorer-release-gate-reconciliation-after-contract-fixes-<date>.md`
    containing checked SHA, command summary, e2e counts, browser acceptance
    matrix, closed issue mapping, and any remaining P2/P3 follow-ups. Decision
    gate: any unresolved P0/P1 defect blocks completion and must become a new
    TODO or reopen the relevant dependency TODO.

prior_art:
- "results-explorer/e2e/ contains the failing Chromium e2e gate."
- "results-explorer/src/pages/__tests__/ and results-explorer/src/components/__tests__/ contain route and component expectations that may be stale."
- "_project/DONE/results-explorer-followup-todo-review/planning/results-explorer-followup-remediation-release-gate.yaml captured the previous release gate structure."
- "The dependency TODOs in this worktree define the new identity, trend, metric/scope, and home/theme contracts."

must_preserve:
- "Do not make failing tests less specific without tying them to documented product intent."
- "Do not mark this gate complete until the browser route matrix and automated tests agree."
- "Do not use skipped or unrun tests as evidence that behavior is fixed."
- "Do not ignore disabled controls, stale labels, or missing links as mere test brittleness without route evidence."

approach: |
  Treat the red release gate as a contract reconciliation problem. Classify each
  failure, fix product defects first, update only stale tests, then rerun the
  full gate and complete a route-by-route browser acceptance pass.

anti_patterns:
- "DO NOT update snapshots or selectors before classifying product behavior."
- "DO NOT rely on one route's passing test to close a cross-route contract."
- "DO NOT leave Chromium e2e red with only manual spot checks."
- "DO NOT close P0/P1 issues into deferred work without explicit user approval."

verification:
- description: "Results Explorer unit tests pass"
  command: "cd results-explorer && npm test -- --run"
  expected_output: "all Results Explorer unit/component tests pass"
- description: "Results Explorer build passes"
  command: "cd results-explorer && npm run build"
  expected_output: "production build completes successfully"
- description: "Chromium e2e release gate passes"
  command: "cd results-explorer && npx playwright test --project=chromium"
  expected_output: "Chromium e2e has zero unexpected failures"
- description: "Release-gate evidence is captured"
  command: "rg -n \"PASS|FAIL|classification|browser acceptance|remaining defects\" _project/verification-logs/results-explorer-release-gate-reconciliation-after-contract-fixes/ _project/audits/"
  expected_output: "logs and audit artifact record the final gate outcome"

scope_limit:
  only_modify:
  - "results-explorer/e2e/"
  - "results-explorer/src/pages/__tests__/"
  - "results-explorer/src/components/__tests__/"
  - "results-explorer/src/lib/__tests__/"
  - "_project/verification-logs/results-explorer-release-gate-reconciliation-after-contract-fixes/"
  - "_project/audits/results-explorer-release-gate-reconciliation-after-contract-fixes-*.md"
  do_not_modify:
  - "results-explorer/public/data/"
  - "benchmark_runs/"
  - "benchbox/core/explorer_pipeline/"

success_metrics:
- "Every previously failing e2e assertion is classified and resolved as either fixed product behavior or an updated contract test."
- "Chromium e2e, build, and targeted unit/component tests pass."
- "Browser acceptance covers every Results Explorer page and visible control."
- "Remaining issues, if any, are P2/P3 with explicit follow-up TODOs."

metadata:
  tags:
  - results-explorer
  - release-gate
  - e2e
  - contract-tests
  estimated_effort: "Medium-Large (2-3 days)"
  created_date: "2026-05-12"

impact:
  business_value: |
    Converts a red, ambiguous release gate into reliable evidence that the
    Results Explorer is safe to ship.
  user_impact: |
    Users get end-to-end behavior that matches the visible UI promises across
    leaderboards, benchmarks, platforms, compare, query, and result detail.
  technical_debt: |
    Replaces stale UI expectations and uncovered contracts with route-level
    regression coverage.
