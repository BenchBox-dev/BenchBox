id: results-explorer-trend-chart-point-identity-and-same-day-semantics
title: "Fix trend chart point identity and same-day run semantics"
worktree: results-explorer-contract-followup
priority: High
status: Not Started
category: Data Integrity

description: |
  Platform detail trend charts can render multiple observations for the same
  platform and date while every point title repeats the identity of the first
  run in the series. On `/results/p/duckdb/`, the chart showed three points
  whose titles all referenced the same DuckDB result even though they came from
  different rows.

  This is not just a tooltip bug. The current time-series contract groups by
  platform ID and uses `run_date` as the x-axis, but the read model can contain
  multiple same-day submissions with different result IDs and no time-of-day
  ordering. The UI must decide how to represent duplicate-day observations
  before drawing lines that imply a chronology that the data may not provide.

deps:
  needs:
  - results-explorer-public-run-identity-and-receipt-reachability

work:
- id: w0
  summary: "Revalidate trend evidence and duplicate-day cohorts"
  status: pending
  notes: |
    On the current snapshot, capture:
      - one platform detail trend route with duplicate same-day runs, such as
        `/results/p/duckdb/`;
      - each rendered SVG point's `data-result-id`, title text, x position, and
        date;
      - SQL counts of platform/cohort/date groups with more than one result;
      - sparse-trend empty-state text including the `runin` copy regression.
    Store findings in
    `_project/verification-logs/results-explorer-trend-chart-point-identity-and-same-day-semantics/w0.md`.
    Decision gate: if no duplicate-day cohorts exist in the checked snapshot,
    keep the point-level identity tests using synthetic fixtures and record that
    the product risk is latent rather than currently visible.

- id: w1
  summary: "Choose and document duplicate-day trend semantics"
  needs: [w0]
  status: pending
  notes: |
    Decide how the UI treats multiple runs for the same platform/cohort/date
    before changing the chart. Acceptable outcomes include:
      - hide the line chart for duplicate-day series and show a compact
        duplicate-run table;
      - aggregate duplicate-day points by a named policy such as latest
        published run, best valid run, or median, while exposing the run count;
      - render duplicate-day points as distinct observations only if the read
        model includes a real timestamp or deterministic sequence field.
    Decision gate: do not jitter points or connect duplicate-day runs with a
    line unless the policy explains the implied ordering and tie handling.

- id: w2
  summary: "Make trend point titles and accessibility text point-specific"
  needs: [w1]
  status: pending
  notes: |
    Update `TimeSeries` so each point title and accessible label is built from
    that point's result identity, date, and metric value, not from the first
    entry in the series. If the component only receives series-level metadata,
    extend the narrow chart entry shape to carry the minimum fields needed for
    point-level identity under the public run-identity contract.

- id: w3
  summary: "Implement the chosen duplicate-day display policy"
  needs: [w1]
  status: pending
  notes: |
    Apply the duplicate-day policy consistently on platform detail and any chart
    panel using `TimeSeries`. If aggregation is chosen, show the aggregation
    policy and duplicate count. If chart suppression is chosen, show a compact
    state that explains why a trend line is unavailable and gives access to the
    underlying runs. If distinct points are chosen, use a data-backed sequence
    field rather than layout-only jitter.

- id: w4
  summary: "Fix sparse trend copy and empty-state grammar"
  needs: [w1]
  status: pending
  notes: |
    Fix the `1 published runin this comparable cohort` copy by making the space
    explicit and adding a regression test for singular and plural trend
    empty-state text.

- id: w5
  summary: "Add trend semantics tests and browser evidence"
  needs: [w2, w3, w4]
  status: pending
  notes: |
    Add tests that cover:
      - point titles use the point's result ID, not the first series result ID;
      - duplicate same-day inputs follow the chosen display policy;
      - sparse trend copy is grammatical for one run and multiple runs;
      - chart titles remain unique when two platform names are the same.
    Browser-check one normal trend, one duplicate-day trend or fixture route,
    and one sparse trend.

prior_art:
- "results-explorer/src/components/TimeSeries.tsx groups by platform ID and currently builds series labels from the first entry."
- "results-explorer/src/lib/chartRegistry.ts defines the narrow historical entry shape consumed by TimeSeries."
- "results-explorer/src/pages/PlatformIndex.tsx builds platform detail trend cohorts and sparse trend copy."
- "results-explorer/src/components/ChartPanel.tsx can render TimeSeries on benchmark/chart routes."
- "results-explorer/src/lib/runIdentity.ts provides public run labels but needs point-level source data."

must_preserve:
- "Trend charts must not imply a chronological ordering that is not present in the data."
- "Point titles and aria text must identify the actual point/result being inspected."
- "Sparse or duplicate-day states must still let users inspect underlying result rows."
- "The fix must not drop valid historical data silently."

approach: |
  Treat trend rendering as a data-contract issue first and an SVG issue second.
  Decide the duplicate-day semantics, then make TimeSeries consume point-level
  identity data and render only claims the read model can support.

anti_patterns:
- "DO NOT fix repeated titles by appending array indexes with no user-visible meaning."
- "DO NOT jitter duplicate dates unless the jitter corresponds to a real timestamp or documented sequence."
- "DO NOT aggregate duplicate runs without naming the aggregation policy."
- "DO NOT suppress trend charts without giving users a path to the underlying runs."

verification:
- description: "TimeSeries and chart smoke tests pass"
  command: "cd results-explorer && npm test -- --run src/components/__tests__/charts.smoke.test.tsx"
  expected_output: "TimeSeries tests include point-level identity and duplicate-day semantics"
- description: "Platform detail tests cover trend empty states"
  command: "cd results-explorer && npm test -- --run src/pages/__tests__/PlatformIndex.test.tsx"
  expected_output: "platform trend duplicate/sparse-state tests pass"
- description: "Browser evidence confirms trend point identity"
  command: "rg -n \"PASS|FAIL|TimeSeries|duplicate-day|point title|runin\" _project/verification-logs/results-explorer-trend-chart-point-identity-and-same-day-semantics/"
  expected_output: "verification log includes trend route evidence"

scope_limit:
  only_modify:
  - "results-explorer/src/components/TimeSeries.tsx"
  - "results-explorer/src/components/__tests__/charts.smoke.test.tsx"
  - "results-explorer/src/lib/chartRegistry.ts"
  - "results-explorer/src/lib/runIdentity.ts"
  - "results-explorer/src/lib/__tests__/runIdentity.test.ts"
  - "results-explorer/src/pages/PlatformIndex.tsx"
  - "results-explorer/src/pages/__tests__/PlatformIndex.test.tsx"
  - "results-explorer/src/components/ChartPanel.tsx"
  - "_project/verification-logs/results-explorer-trend-chart-point-identity-and-same-day-semantics/"
  do_not_modify:
  - "benchmark_runs/"
  - "results-explorer/public/data/"

success_metrics:
- "Every trend point title identifies the actual result represented by that point."
- "Duplicate same-day trend data follows a documented, tested display policy."
- "Sparse trend empty-state copy is grammatical and actionable."
- "Trend charts no longer make unsupported chronological claims."

metadata:
  tags:
  - results-explorer
  - trend
  - charts
  - data-contract
  estimated_effort: "Medium (1-2 days)"
  created_date: "2026-05-12"

impact:
  business_value: |
    Prevents trend charts from making misleading historical claims about
    benchmark runs.
  user_impact: |
    Users can trust that chart points, labels, and tooltips refer to the run
    they are actually inspecting.
  technical_debt: |
    Clarifies the boundary between read-model historical data and chart display
    semantics.
