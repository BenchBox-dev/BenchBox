impact:
  business_value: |
    Enables microbenchmarking of DataFrame libraries (Polars, Pandas, PySpark) on
    136 isolated operations. This provides granular performance insights beyond
    full TPC-H queries, helping users identify specific bottlenecks.
  user_impact: |
    Users can run: `benchbox run --platform polars-df --benchmark read_primitives`
    to get detailed performance profiles of Polars across aggregations, filters,
    window functions, and more.
  technical_debt: |
    Establishes the pattern for DataFrame expansion of other primitives benchmarks,
    creating reusable infrastructure for future work.

