title: "Implement DataFrame Version of Read Primitives Benchmark"
worktree: dataframe-expansion
priority: High
status: Not Started
category: Core Functionality
description: |
  Implement DataFrame (Polars, Pandas, PySpark, DataFusion) versions of all 136 Read
  Primitives queries. This benchmark tests fundamental database read operations and is
  the ideal candidate for DataFrame expansion - it uses the TPC-H schema (already
  supported by DataFrame loaders) and covers operations that map well to DataFrame APIs.

  The Read Primitives catalog includes queries across 29 categories:
  - Aggregation (13 queries): COUNT, SUM, AVG, COUNT DISTINCT, GROUP BY
  - Filter (10 queries): WHERE clauses, predicate pushdown
  - Optimizer (13 queries): Subquery decorrelation, join reordering, constant folding
  - Array (9 queries): ARRAY operations, UNNEST, array aggregations
  - String (11 queries): LIKE, CONCAT, SUBSTRING, string functions
  - Order By (8 queries): Sorting, TOP-N, ORDER BY ALL
  - Window (6 queries): ROW_NUMBER, RANK, LAG/LEAD, aggregate windows
  - Qualify (6 queries): QUALIFY clause for window filtering
  - Shuffle (5 queries): Data redistribution patterns
  - Group By (5 queries): GROUP BY ALL, GROUP BY ROLLUP/CUBE
  - And 19 more categories with 1-4 queries each

  Implementation follows the established TPC-H DataFrame pattern using:
  - Expression family (Polars, PySpark, DataFusion): ctx.col(), ctx.lit(), lazy expressions
  - Pandas family (Pandas, Modin, Dask, cuDF): df['column'], boolean indexing, eager ops

context_sections:
  "Background and Motivation": |
    Read Primitives is a microbenchmark testing isolated database operations without
    the complexity of full TPC-H queries. It's ideal for:
    - Identifying performance bottlenecks in specific operations
    - Comparing optimizer effectiveness across platforms
    - Testing modern SQL features (QUALIFY, MIN_BY, ARRAY, JSON)

    DataFrame support enables the same granular analysis for expression-based and
    pandas-based data processing libraries.

  "Technical Context": |
    The existing implementation pattern from TPC-H DataFrame support serves as the
    template. Key files:
    - `benchbox/core/tpch/dataframe_queries.py` - 22 TPC-H queries, both families
    - `benchbox/core/dataframe/query.py` - DataFrameQuery, QueryRegistry classes
    - `benchbox/core/dataframe/context.py` - DataFrameContext for table access

    The Read Primitives queries are defined in:
    - `benchbox/core/read_primitives/catalog/queries.yaml` - 136 SQL queries

    Each SQL query needs two implementations:
    1. expression_impl: Uses ctx.col(), ctx.lit(), method chaining
    2. pandas_impl: Uses df['col'], boolean indexing, .groupby()

  "Implementation Challenges": |
    Some query categories have limited DataFrame support and may need skip_platforms:

    **Well-Supported (all platforms):**
    - aggregation, filter, groupby, orderby, shuffle, predicate, topn, count, limit

    **Expression-Family Only:**
    - qualify (QUALIFY clause - Polars, PySpark, DataFusion only)
    - lambda (higher-order functions - Polars, PySpark only)
    - timeseries (ASOF JOIN - Polars, PySpark only)

    **Limited/Platform-Specific:**
    - fulltext (text search - platform-specific implementations)
    - json, struct, map (semi-structured - varies by platform)

    **SQL-Only (skip for DataFrame):**
    - optimizer (tests SQL optimizer behavior, not applicable to DataFrame)

