title: "Implement DataFrame Version of Write Primitives Benchmark"
worktree: dataframe-expansion
priority: High
status: Not Started
category: Core Functionality
description: |
  Implement DataFrame versions of Write Primitives benchmark operations. This benchmark
  tests fundamental write operations: INSERT, UPDATE, DELETE, BULK_LOAD, MERGE, DDL,
  and TRANSACTION operations.

  DataFrame platforms have extensive write capabilities that map to these operations:

  **PySpark + Delta Lake:**
  - INSERT → df.write.mode("append").saveAsTable()
  - UPDATE → DeltaTable.update()
  - DELETE → DeltaTable.delete()
  - MERGE → DeltaTable.merge()
  - DDL → spark.sql() for schema operations

  **PySpark + Iceberg:**
  - INSERT → df.writeTo().append()
  - UPDATE → Row-level updates via MERGE
  - DELETE → Row-level deletes
  - MERGE → df.writeTo().overwritePartitions()

  **Polars:**
  - INSERT → write_parquet() with append
  - BULK_LOAD → scan_parquet() + write_parquet()
  - File-level operations (no row-level UPDATE/DELETE)

  **All DataFrame Platforms:**
  - BULK_LOAD → read + write with compression, partitioning, sorting
  - Physical layout tuning (row groups, dictionary encoding)

context_sections:
  "Background and Motivation": |
    Write Primitives tests INSERT, UPDATE, DELETE, MERGE, BULK_LOAD, DDL, and
    TRANSACTION operations. These are NOT "SQL-only" - DataFrame platforms,
    especially Spark-based ones with Delta Lake or Iceberg, have full support
    for these operations.

    The existing SQL implementation uses staging tables derived from TPC-H schema.
    DataFrame implementations can follow similar patterns using table formats.

  "Technical Context": |
    Current Write Primitives implementation:
    - `benchbox/core/write_primitives/benchmark.py` - Main benchmark class
    - `benchbox/core/write_primitives/operations.py` - WriteOperationsManager
    - Uses TPC-H data as foundation via get_data_source_benchmark() returning "tpch"

    DataFrame write infrastructure exists:
    - `benchbox/core/dataframe/write_config.py` - DataFrameWriteConfiguration
    - Supports: compression, sorting, partitioning, row groups, repartitioning
    - Platform-specific: PySpark has partitionBy, bucketBy, sortBy

    Related TODO:
    - `dataframe-maintenance-operations.yaml` covers TPC-H/TPC-DS maintenance
    - Write Primitives is the microbenchmark version of similar operations

  "Platform Capability Matrix": |
    | Operation   | Delta Lake | Iceberg | Polars | Pandas | Dask |
    |-------------|------------|---------|--------|--------|------|
    | INSERT      | ✓ append   | ✓       | ✓ file | ✓ file | ✓    |
    | UPDATE      | ✓ row      | ✓ row   | ✗      | ✗      | ✗    |
    | DELETE      | ✓ row      | ✓ row   | ✗      | ✗      | ✗    |
    | MERGE       | ✓          | ✓       | ✗      | ✗      | ✗    |
    | BULK_LOAD   | ✓          | ✓       | ✓      | ✓      | ✓    |
    | DDL         | ✓ SQL      | ✓ SQL   | ✗      | ✗      | ✗    |
    | TRANSACTION | ✓ ACID     | ✓ ACID  | ✗      | ✗      | ✗    |

    Row-level operations require Delta Lake or Iceberg table formats.
    File-level operations work on all platforms.

