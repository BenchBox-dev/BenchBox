title: "Implement DataFrame Version of AI Primitives Benchmark"
worktree: dataframe-expansion
priority: Medium
status: Not Started
category: Core Functionality
description: |
  Implement DataFrame versions of AI Primitives benchmark operations. This benchmark
  tests AI/ML database operations including vector similarity search, embeddings,
  and ML inference capabilities.

  Unlike Read Primitives, AI Primitives is more specialized and platform-dependent.
  DataFrame libraries have varying support for vector operations:
  - Polars: Native vector operations, good NumPy interop
  - PySpark: MLlib integration, vector columns
  - Pandas: NumPy/scikit-learn integration
  - DataFusion: Limited AI/ML support

  This TODO focuses on the subset of AI operations that can be meaningfully
  implemented across DataFrame platforms.

context_sections:
  "Background and Motivation": |
    AI/ML workloads are increasingly run on DataFrame platforms:
    - Feature engineering pipelines (Pandas, Polars)
    - Distributed model training (PySpark MLlib)
    - Vector similarity for recommendations

    Testing these operations across platforms enables fair comparison of
    AI/ML performance characteristics.

  "Technical Context": |
    The AI Primitives benchmark (`benchbox/core/ai_primitives/`) tests:
    - Vector similarity search (cosine, euclidean, dot product)
    - Embedding operations
    - ML function integration (inference, scoring)

    DataFrame implementations will use:
    - Expression family: Native vector operations where available
    - Pandas family: NumPy arrays for vector math

    Key challenge: Many AI operations in SQL databases use proprietary extensions
    (pgvector, ClickHouse array functions, Snowflake ML) that don't have direct
    DataFrame equivalents.

  "Scope Constraints": |
    This implementation focuses on operations portable across DataFrame platforms:
    - Vector math (dot product, cosine similarity, euclidean distance)
    - Array operations (normalization, aggregation)
    - Basic ML operations (softmax, sigmoid, normalization)

    Excluded (SQL-only or platform-specific):
    - Database-native vector indexes (HNSW, IVF)
    - Proprietary ML functions (Snowflake Cortex, Databricks ML)
    - GPU-accelerated operations (unless using cuDF)

