  - "benchbox run --platform pandas-df still works correctly"

approach: |
  Follow the ModinDataFrameAdapter pattern in benchbox/platforms/dataframe/modin_df.py
  as the closest reference - Modin is also a Pandas drop-in replacement extending
  PandasFamilyAdapter. The key difference is the import: use `import fireducks.pandas as fpd`
  instead of `import modin.pandas as mpd`.

  FireDucks uses lazy execution internally with automatic materialization, so most
  Pandas operations should work transparently. However, test for edge cases where
  lazy evaluation might cause unexpected behavior (e.g., timing of side effects,
  error reporting). If materialization control is needed, FireDucks provides
  `fireducks.pandas.materialize()` to force eager evaluation.

  Start with Phase 1 (core adapter), then registration (Phase 2), then testing
  (Phase 3). Keep the adapter minimal - leverage Pandas API compatibility rather
  than adding FireDucks-specific features.

anti_patterns:
  - "DO NOT modify PandasFamilyAdapter base class to accommodate FireDucks - because it would risk breaking other Pandas-family adapters - extend and override in fireducks_df.py instead"
  - "DO NOT add FireDucks-specific query implementations - because FireDucks is Pandas API compatible - reuse existing pandas_impl queries"
  - "DO NOT import fireducks at module level without try/except - because it is an optional dependency - follow the FIREDUCKS_AVAILABLE pattern from other adapters"

