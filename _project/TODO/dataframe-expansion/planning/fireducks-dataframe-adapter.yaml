context_sections:
  "FireDucks Architecture": |
    FireDucks is a compiler-accelerated DataFrame library that converts Python
    DataFrame operations to an optimized intermediate representation (IR) for
    execution. Key architectural features:
    - Lazy evaluation: Operations build a computation graph, executed only when
      results are needed (similar to Spark/Dask but transparent to users)
    - Compiler optimization: IR is optimized by a custom compiler before execution
    - Multithreading: Automatic parallel execution across available cores
    - Pandas API compatibility: `import fireducks.pandas as pd` is all that's needed

  "Integration Pattern": |
    FireDucks integration follows the same pattern as Modin:
    1. Import: `import fireducks.pandas as fpd` (instead of `import pandas as pd`)
    2. All Pandas operations work identically: fpd.read_csv(), fpd.DataFrame(), etc.
    3. Results are Pandas-compatible DataFrames
    4. No API changes needed in query implementations

    The adapter should be thin - mostly delegating to fireducks.pandas with the
    same method implementations as PandasDataFrameAdapter, differing only in the
    import source and platform_name.

  "Performance Characteristics": |
    - 20x+ speedup over vanilla Pandas (documented benchmarks)
    - Compiler-optimized execution with automatic query optimization
    - Multithreaded by default (leverages all available cores)
    - Lazy evaluation reduces unnecessary intermediate computations
    - Memory-efficient through compiler-level optimization
    - Best performance on larger datasets where compiler overhead is amortized
