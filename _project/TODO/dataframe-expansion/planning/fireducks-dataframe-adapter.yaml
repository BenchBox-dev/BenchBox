impact:
  business_value: |
    FireDucks represents the emerging category of compiler-accelerated DataFrame
    libraries. Supporting it expands BenchBox's coverage of the Pandas-compatible
    ecosystem and provides users a way to benchmark high-performance Pandas
    alternatives with zero code changes to their queries.
  user_impact: |
    Users can compare FireDucks performance against vanilla Pandas, Modin, and
    other Pandas-family libraries using identical TPC-H workloads. This enables
    data-driven decisions about DataFrame library selection.
  technical_debt: |
    Clean implementation following established PandasFamilyAdapter patterns.
    Since FireDucks is API-compatible with Pandas, the adapter should be
    straightforward with minimal custom logic.

