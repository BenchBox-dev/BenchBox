title: "Add FireDucks DataFrame platform support"
worktree: dataframe-expansion
priority: Medium-High
status: Not Started
description: |
  Implement a FireDucks DataFrame adapter for BenchBox, enabling TPC-H benchmark
  execution using the FireDucks library. FireDucks is a compiler-accelerated
  DataFrame library developed by NEC that provides 100% Pandas API compatibility
  with significant performance improvements (20x+ speedup over vanilla Pandas).

  FireDucks belongs to the Pandas family since it is a drop-in Pandas replacement
  using the same API: string-based column access (df['column']), boolean indexing,
  dict-based aggregation, etc. The only change required is the import statement:
  `import fireducks.pandas as pd` instead of `import pandas as pd`.

  Current State:
  - BenchBox has PandasFamilyAdapter base class with Pandas, Modin, cuDF, Dask members
  - PandasDataFrameAdapter is the reference implementation
  - ModinDataFrameAdapter is a good template for "drop-in replacement" adapters
  - TPC-H queries have pandas_impl implementations that should work unmodified

  Value Proposition:
  - 20x+ speedup over vanilla Pandas via compiler optimization
  - Zero learning curve - 100% Pandas API compatible
  - Lazy execution under the hood with automatic optimization
  - Multithreaded execution for parallel performance
  - BSD 3-Clause license (permissive, compatible with BenchBox MIT)
  - Active development by NEC (released v1.4.4, Dec 2025)
  - Growing community adoption for data analysis workloads

  Reference: https://fireducks-dev.github.io/docs/user-guide/01-intro/

category: Platform Enhancement

