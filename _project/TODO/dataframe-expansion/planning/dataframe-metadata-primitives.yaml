impact:
  business_value: |
    Enables benchmarking of metadata operations on DataFrame platforms,
    particularly important for data lakehouse architectures using Delta Lake
    or Iceberg where metadata performance affects query planning.
  user_impact: |
    Users can run: `benchbox run --platform pyspark-df --benchmark metadata_primitives`
    to benchmark catalog listing and table introspection on Spark.
  technical_debt: |
    Creates unified metadata introspection interface that abstracts platform
    differences. Establishes patterns for catalog integration that can be
    reused by data governance and lineage tracking features.

