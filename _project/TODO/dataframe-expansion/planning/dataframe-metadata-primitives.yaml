title: "Implement DataFrame Version of Metadata Primitives Benchmark"
worktree: dataframe-expansion
priority: Medium
status: Not Started
category: Core Functionality
description: |
  Implement DataFrame versions of Metadata Primitives benchmark operations. This
  benchmark tests metadata introspection operations: schema discovery, column
  introspection, table statistics, and query introspection.

  DataFrame platforms have metadata capabilities through various APIs:

  **PySpark:**
  - spark.catalog.listDatabases(), listTables(), listColumns()
  - spark.sql("SHOW TABLES"), spark.sql("DESCRIBE TABLE")
  - Delta Lake: DESCRIBE HISTORY, DESCRIBE DETAIL
  - Iceberg: metadata tables (snapshots, manifests, files)

  **Polars:**
  - df.schema, df.dtypes, df.describe()
  - Limited catalog capabilities (file-based, no central catalog)

  **Pandas:**
  - df.dtypes, df.info(), df.describe()
  - No catalog capabilities

  The benchmark should focus on operations that are meaningful across platforms,
  with platform-specific extensions for lakehouse metadata.

context_sections:
  "Background and Motivation": |
    Metadata Primitives tests INFORMATION_SCHEMA queries, SHOW/DESCRIBE commands,
    and catalog introspection. These operations are critical for:
    - Data catalog integration
    - Schema discovery and IDE autocomplete
    - BI tool connectivity
    - Data governance workflows

    While the SQL implementation uses INFORMATION_SCHEMA views, DataFrame platforms
    have equivalent capabilities through catalog APIs and metadata tables.

  "Technical Context": |
    Current Metadata Primitives implementation:
    - `benchbox/core/metadata_primitives/benchmark.py` - Main benchmark class
    - `benchbox/core/metadata_primitives/queries.py` - Query manager
    - Tests schema discovery, column introspection, table statistics

    Complexity testing capability:
    - Wide tables (100-1000+ columns)
    - Nested view hierarchies
    - Complex data types (ARRAY, STRUCT, MAP)
    - Large catalogs (100-500+ tables)

    DataFrame platforms expose metadata through:
    - PySpark: spark.catalog API + SQL interface
    - Delta Lake: delta.tables.DeltaTable.detail(), history()
    - Iceberg: metadata tables accessible via SQL
    - Polars/Pandas: schema introspection methods

  "Platform Capability Matrix": |
    | Operation              | PySpark | Delta Lake | Iceberg | Polars | Pandas |
    |------------------------|---------|------------|---------|--------|--------|
    | List tables            | ✓       | ✓          | ✓       | ✗      | ✗      |
    | List columns           | ✓       | ✓          | ✓       | ✓      | ✓      |
    | Column types           | ✓       | ✓          | ✓       | ✓      | ✓      |
    | Table statistics       | ✓       | ✓          | ✓       | ✗      | ✗      |
    | Row counts             | ✓       | ✓          | ✓       | ✓*     | ✓*     |
    | Table history          | ✗       | ✓          | ✓       | ✗      | ✗      |
    | File metadata          | ✗       | ✓          | ✓       | ✗      | ✗      |
    | Partition info         | ✓       | ✓          | ✓       | ✗      | ✗      |

    *Polars/Pandas require loading data to count rows (not catalog operation)

