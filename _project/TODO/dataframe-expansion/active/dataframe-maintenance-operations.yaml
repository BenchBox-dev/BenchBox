title: "Implement DataFrame Maintenance Operations for TPC-H/TPC-DS"
worktree: dataframe-expansion
priority: Medium-High
status: In Progress
category: Core Functionality
description: |
  Implement maintenance operations (INSERT/UPDATE/DELETE equivalents) for DataFrame
  platforms, enabling full TPC-H and TPC-DS compliance in DataFrame mode.

  Currently, `get_maintenance_operations_sql()` only supports SQL mode. When users
  run `--platform polars-df --benchmark tpch --phases maintenance`, no error is raised
  and the maintenance phase silently does nothing useful.

  DataFrame platforms like Spark (Delta Lake, Iceberg), Polars, and others support
  write operations that can implement TPC maintenance semantics:
  - Delta Lake: MERGE, UPDATE, DELETE operations
  - Iceberg: Row-level deletes, upserts
  - Polars: write_parquet() with append/overwrite modes
  - Parquet files: Partition-based updates

  This work involves:
  1. Adding validation to error when maintenance+dataframe is attempted (short-term fix)
  2. Designing a unified maintenance abstraction that works for both SQL and DataFrame
  3. Implementing platform-specific maintenance operations

context_sections:
  "Background and Motivation": |
    The TPC-H and TPC-DS benchmarks include maintenance tests (RF1/RF2 for TPC-H,
    DM1-DM4 for TPC-DS) that test INSERT/UPDATE/DELETE performance. These are
    currently only implemented for SQL mode via database connections.

    As DataFrame platforms mature with features like Delta Lake and Iceberg,
    they can support equivalent maintenance operations. This enables full TPC
    compliance testing on DataFrame platforms.

  "Technical Context": |
    Current code path in dryrun.py:
    ```python
    if execution_mode == "dataframe":
        return self._extract_dataframe_queries(...)  # Short-circuits before maintenance check
    ```

    The maintenance check happens AFTER this return, so DataFrame mode never
    reaches the maintenance extraction code.

    For actual execution, `dataframe_runner.py` only implements load and execute
    (SELECT query) phases - no maintenance phase exists.

