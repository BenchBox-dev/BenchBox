    - BTS data is authoritative for US aviation
    - Kaggle datasets provide convenient pre-processing
    - OpenSky offers global data but requires academic access
    - Consider geographic queries with airport coordinates
    - Rich temporal dimension for time-series patterns

must_preserve:
  - "Existing NYC Taxi benchmark interface unchanged"
  - "BaseBenchmark contract unchanged"
  - "Platform registry backward compatible"

anti_patterns:
  - "DO NOT hardcode BTS download URLs — because BTS periodically changes endpoints — use configuration-driven URL templates"
  - "DO NOT download real flight data in unit tests — because files are large and BTS rate-limits — use synthetic test fixtures"

verification:
  - description: "Flight data benchmark module imports"
    command: "uv run -- python -c \"from benchbox.core.flightdata import FlightDataBenchmark; print('OK')\""
    expected_output: "OK"
  - description: "Unit tests pass"
    command: "uv run -- python -m pytest tests/unit/core/flightdata/ -v --tb=short"
    expected_output: "all tests pass"

scope_limit:
  only_modify:
    - "benchbox/core/flightdata/"
    - "tests/unit/core/flightdata/"
  do_not_modify:
    - "benchbox/core/nyctaxi/"
    - "benchbox/core/runner.py"

