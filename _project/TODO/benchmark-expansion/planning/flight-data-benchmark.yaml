  - '@benchbox-maintainers'
  tags:
  - benchmark
  - real-world
  - flight-data
  - bts
  - time-series
  - transportation
  estimated_effort: 2-3 weeks
  created_date: "2026-01-12"
  dependencies:
  - Existing NYC Taxi benchmark pattern (benchbox/core/nyctaxi/) for downloader/schema design
  - BaseBenchmark class (benchbox/core/base.py) for benchmark integration
