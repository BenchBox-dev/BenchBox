  migration_review_required: true
must_preserve:
- "BaseBenchmark interface contract unchanged"
- "Existing spatial query support in NYC Taxi benchmark unaffected"

anti_patterns:
- "DO NOT add DuckDB-specific extension loading to BaseBenchmark — because it breaks other platforms — handle spatial extension
  loading in the DuckDB platform adapter"
- "DO NOT require PostGIS for unit tests — because CI has no PostgreSQL server — mock spatial operations"

