metadata:
  owners:
  - '@benchbox-maintainers'
  tags:
  - primitives
  - benchmark
  - geospatial
  - geography
  - geometry
  - st_functions
  - h3
  estimated_effort: 3-4 weeks
  dependencies:
  - Read Primitives benchmark (reference implementation)
  - DuckDB spatial extension
  related_todos:
  - specialized-geospatial/planning/geospatial-benchmark-support-postgis-integration.yaml (separate - PostGIS adapter)
  notes: |
    - ClickHouse only supports H3, not ST_* functions
    - BigQuery uses GEOGRAPHY only (spherical), no planar GEOMETRY
    - DuckDB requires extension loading at session start
    - Consider separate H3-only benchmark for broader platform support

must_preserve:
  - "BaseBenchmark interface contract unchanged"
  - "Existing spatial query support in NYC Taxi benchmark unaffected"

anti_patterns:
  - "DO NOT add DuckDB-specific extension loading to BaseBenchmark — because it breaks other platforms — handle spatial extension loading in the DuckDB platform adapter"
  - "DO NOT require PostGIS for unit tests — because CI has no PostgreSQL server — mock spatial operations"

