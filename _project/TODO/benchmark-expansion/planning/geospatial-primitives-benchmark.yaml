title: Geospatial Primitives Benchmark - ST_* Functions and Spatial Operations
worktree: benchmark-expansion
category: Benchmark Development
priority: Low
status: Not Started
description: |
  Create a new Geospatial Primitives benchmark to test cross-platform spatial SQL
  functions. This benchmark covers ST_* functions, GEOGRAPHY/GEOMETRY types, and
  spatial operations that are increasingly important for location-based analytics.

  This differs from the specialized-geospatial TODO (PostGIS integration) by:
  - Focusing on OLAP platforms with native geospatial support (Snowflake, BigQuery, DuckDB)
  - Testing SQL-level primitives, not a new adapter
  - Using synthetic/generated geospatial data, not requiring PostGIS

  Use cases covered:
  - Distance calculations (point-to-point, point-to-polygon)
  - Spatial predicates (contains, intersects, within)
  - Geometry transformations (buffer, simplify, union)
  - Spatial aggregations (convex hull, clustering)
  - Geospatial joins

context_sections:
- name: Platform Support Matrix
  summary: |
    | Feature | Snowflake | BigQuery | DuckDB | Databricks | ClickHouse |
    |---------|-----------|----------|--------|------------|------------|
    | **GEOGRAPHY type** | ✅ | ✅ | ✅ (spatial ext) | ✅ | ❌ |
    | **GEOMETRY type** | ✅ | ❌ (GEOGRAPHY only) | ✅ | ✅ | ❌ |
    | **ST_POINT** | ✅ | ✅ ST_GEOGPOINT | ✅ | ✅ | ❌ |
    | **ST_DISTANCE** | ✅ | ✅ | ✅ | ✅ | ❌ |
    | **ST_CONTAINS** | ✅ | ✅ | ✅ | ✅ | ❌ |
    | **ST_INTERSECTS** | ✅ | ✅ | ✅ | ✅ | ❌ |
    | **ST_WITHIN** | ✅ | ✅ | ✅ | ✅ | ❌ |
    | **ST_DWITHIN** | ✅ | ✅ | ✅ | ✅ | ❌ |
    | **ST_BUFFER** | ✅ | ✅ | ✅ | ✅ | ❌ |
    | **ST_AREA** | ✅ | ✅ | ✅ | ✅ | ❌ |
    | **ST_LENGTH** | ✅ | ✅ | ✅ | ✅ | ❌ |
    | **ST_UNION** | ✅ | ✅ ST_UNION_AGG | ✅ | ✅ | ❌ |
    | **ST_CONVEXHULL** | ✅ | ✅ | ✅ | ✅ | ❌ |
    | **ST_CENTROID** | ✅ | ✅ | ✅ | ✅ | ❌ |
    | **ST_SIMPLIFY** | ✅ | ❌ | ✅ | ✅ | ❌ |
    | **ST_ASTEXT/WKT** | ✅ | ✅ | ✅ | ✅ | ❌ |
    | **ST_GEOGFROMTEXT** | ✅ | ✅ | ✅ | ✅ | ❌ |
    | **H3 Functions** | ✅ | ✅ | ✅ | ✅ | ✅ |

    Note: ClickHouse has H3 functions but no native geometry types
    Note: DuckDB requires loading the spatial extension

- name: Function Categories
  summary: |
    1. **Point Operations** - ST_POINT, ST_X, ST_Y, ST_GEOGPOINT
    2. **Distance & Proximity** - ST_DISTANCE, ST_DWITHIN, nearest neighbor
    3. **Spatial Predicates** - ST_CONTAINS, ST_INTERSECTS, ST_WITHIN, ST_COVERS
    4. **Geometry Transformations** - ST_BUFFER, ST_SIMPLIFY, ST_CENTROID
    5. **Spatial Aggregations** - ST_UNION, ST_CONVEXHULL, ST_COLLECT
    6. **Area & Length** - ST_AREA, ST_LENGTH, ST_PERIMETER
    7. **Format Conversion** - ST_ASTEXT, ST_ASBINARY, ST_GEOGFROMTEXT
    8. **H3 Indexing** - H3_LATLNG_TO_CELL, H3_CELL_TO_BOUNDARY (cross-platform)

- name: Data Generation Strategy
  summary: |
    Since TPC-H doesn't include geospatial data, we need to generate test data:

    1. **Synthetic Points**: Generate random lat/lng within bounding boxes
       - Customer locations (use n_nationkey to assign regions)
       - Supplier locations
       - Order shipping origins/destinations

    2. **Derived from TPC-H**: Add geospatial columns to existing tables
       - Nation polygons (simplified country boundaries)
       - Region bounding boxes
       - Supplier warehouse locations (random within nation)

    3. **Test Geometries**: Standard test shapes
       - Unit square, unit circle
       - Grid of points
       - Overlapping polygons for predicate testing

    Alternative: Use TPC-H with synthetic geo columns added at benchmark setup time

- name: Design Considerations
  summary: |
    - **Extension Loading**: DuckDB requires LOAD spatial; handle gracefully
    - **Coordinate Systems**: Default to WGS84 (EPSG:4326) for GEOGRAPHY
    - **Precision**: Floating-point comparison tolerance for distances
    - **Performance Focus**: Spatial indexing significantly affects performance
    - **Skip unsupported**: ClickHouse skips all geo queries (H3 only separate)

tasks:
- phase: "Phase 1: Architecture Design"
  items:
  - summary: Design geospatial primitives benchmark architecture
    done: false
    details: |
      - Define GeoQuery dataclass (similar to PrimitiveQuery)
      - Determine data generation strategy (synthetic vs derived)
      - Design for cross-platform coordinate system handling
      - Plan extension loading (DuckDB spatial)

  - summary: Create catalog YAML schema for geospatial queries
    done: false
    details: |
      - id, category, sql fields
      - variants dict for platform-specific syntax (ST_GEOGPOINT vs ST_POINT)
      - skip_on list for unsupported platforms (clickhouse)
      - requires_extension field for DuckDB spatial loading
      - coordinate_system field (default: WGS84)

  - summary: Design test data generation
    done: false
    details: |
      Option A: Add geo columns to TPC-H staging tables
      - Add customer_location GEOGRAPHY to customer
      - Add supplier_location GEOGRAPHY to supplier
      - Generate random points within nation bounding boxes

      Option B: Separate geo test tables
      - geo_points: id, location GEOGRAPHY, category
      - geo_polygons: id, shape GEOGRAPHY, name
      - geo_lines: id, path GEOGRAPHY, length_km

- phase: "Phase 2: Core Implementation"
  items:
  - summary: Create benchbox/core/geo_primitives/ module structure
    done: false
    details: |
      - __init__.py
      - catalog/__init__.py
      - catalog/loader.py (GeoCatalogLoader)
      - catalog/queries.yaml (geospatial query definitions)
      - benchmark.py (GeoPrimitivesBenchmark class)
      - generator.py (geospatial data generation)
      - schema.py (test table definitions)

  - summary: Implement GeoCatalog loader
    done: false
    details: |
      - Parse geo-specific fields (requires_extension, coordinate_system)
      - Handle extension loading for DuckDB
      - Validate coordinate system specifications

  - summary: Implement geospatial data generator
    done: false
    details: |
      - Generate random points within bounding boxes
      - Create test polygons (nations, regions)
      - Generate test lines (shipping routes)
      - Support different scale factors

  - summary: Implement GeoPrimitivesBenchmark class
    done: false
    details: |
      - Inherit from BaseBenchmark pattern
      - Handle extension loading (DuckDB)
      - Setup: create and populate geo test tables
      - Execute geo queries with timing capture
      - Teardown: drop geo test tables

- phase: "Phase 3: Query Catalog Development"
  items:
  - summary: Implement Point Operations queries (5+ queries)
    done: false
    details: |
      - geo_point_create: Create points from lat/lng
      - geo_point_extract_x: Extract longitude
      - geo_point_extract_y: Extract latitude
      - geo_point_from_wkt: Parse from WKT string
      - geo_point_to_wkt: Convert to WKT string

      Example (Snowflake):
      ```sql
      SELECT
          c_custkey,
          ST_POINT(-122.4194, 37.7749) as sf_location,
          ST_X(customer_location) as cust_lng,
          ST_Y(customer_location) as cust_lat
      FROM customer_geo
      LIMIT 100;
      ```

  - summary: Implement Distance & Proximity queries (6+ queries)
    done: false
    details: |
      - geo_distance_points: Distance between two points
      - geo_distance_point_polygon: Distance to polygon boundary
      - geo_dwithin_radius: Points within radius
      - geo_nearest_neighbor: Find N nearest points
      - geo_distance_matrix: Pairwise distances (small set)
      - geo_shipping_distance: Distance between supplier and customer

      Example (Snowflake):
      ```sql
      SELECT
          s.s_suppkey,
          c.c_custkey,
          ST_DISTANCE(s.supplier_location, c.customer_location) / 1000 as distance_km
      FROM supplier_geo s
      CROSS JOIN customer_geo c
      WHERE c.c_nationkey = s.s_nationkey
      LIMIT 1000;
      ```

  - summary: Implement Spatial Predicates queries (6+ queries)
    done: false
    details: |
      - geo_contains_point: Point within polygon
      - geo_intersects_polygons: Polygon overlap
      - geo_within_region: Points within region polygon
      - geo_covers_area: Polygon covers another
      - geo_touches_boundary: Geometries touch
      - geo_disjoint_check: Geometries don't intersect

      Example (Snowflake):
      ```sql
      SELECT
          c.c_custkey,
          n.n_name
      FROM customer_geo c
      JOIN nation_geo n
          ON ST_CONTAINS(n.nation_polygon, c.customer_location)
      LIMIT 100;
      ```

  - summary: Implement Geometry Transformation queries (5+ queries)
    done: false
    details: |
      - geo_buffer_point: Create buffer around point
      - geo_simplify_polygon: Simplify complex polygon
      - geo_centroid: Calculate centroid
      - geo_envelope: Bounding box
      - geo_convexhull: Convex hull of points

      Example (Snowflake):
      ```sql
      SELECT
          n_nationkey,
          ST_CENTROID(nation_polygon) as nation_center,
          ST_AREA(nation_polygon) / 1e6 as area_sq_km
      FROM nation_geo;
      ```

  - summary: Implement Spatial Aggregation queries (4+ queries)
    done: false
    details: |
      - geo_union_regions: Union of multiple polygons
      - geo_collect_points: Collect points into multipoint
      - geo_convexhull_customers: Convex hull of customer locations
      - geo_extent_suppliers: Bounding box of all suppliers

      Example (BigQuery):
      ```sql
      SELECT
          c_mktsegment,
          ST_UNION_AGG(customer_location) as segment_coverage,
          COUNT(*) as customer_count
      FROM customer_geo
      GROUP BY c_mktsegment;
      ```

  - summary: Implement Area & Length queries (4+ queries)
    done: false
    details: |
      - geo_area_nation: Area of nation polygons
      - geo_length_route: Length of shipping route
      - geo_perimeter_region: Perimeter of region
      - geo_area_buffer: Area of buffered point

  - summary: Implement H3 Indexing queries (4+ queries)
    done: false
    details: |
      - geo_h3_index: Convert point to H3 cell
      - geo_h3_boundary: Get H3 cell boundary
      - geo_h3_neighbors: Get neighboring cells
      - geo_h3_aggregation: Aggregate by H3 cell

      Note: H3 has broader support (including ClickHouse)

      Example (Snowflake):
      ```sql
      SELECT
          c_custkey,
          H3_LATLNG_TO_CELL(ST_Y(customer_location), ST_X(customer_location), 7) as h3_cell
      FROM customer_geo
      LIMIT 100;
      ```

- phase: "Phase 4: Platform Variants"
  items:
  - summary: Add Snowflake geospatial variants
    done: false
    details: |
      - Standard ST_* function syntax
      - GEOGRAPHY and GEOMETRY both supported
