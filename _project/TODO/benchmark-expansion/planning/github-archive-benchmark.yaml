      - Parallel downloads for efficiency
      - Resume capability for large ranges

  - summary: Implement NDJSON to Parquet conversion
    done: false
    details: |
      - Parse nested JSON structures
      - Flatten actor and repo structures
      - Handle payload as JSON column or extract
      - Partition by date for efficient queries

  - summary: Implement platform data loading
    done: false
    details: |
