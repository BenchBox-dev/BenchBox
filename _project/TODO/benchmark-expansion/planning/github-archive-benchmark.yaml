  dependencies:
  - Existing NYC Taxi benchmark pattern (benchbox/core/nyctaxi/) for downloader design
  - BaseBenchmark class (benchbox/core/base.py) for benchmark integration
  - ClickBench benchmark (benchbox/core/clickbench/) for JSON handling patterns
  notes: |
    - Data continuously updated hourly
    - JSON payload handling is key design decision
    - ClickHouse demo provides query pattern reference
