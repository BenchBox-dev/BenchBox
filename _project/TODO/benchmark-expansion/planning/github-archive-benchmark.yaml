  migration_review_required: true
must_preserve:
- "Existing ClickBench JSON handling patterns unchanged"
- "BaseBenchmark interface contract unchanged"

anti_patterns:
- "DO NOT implement pre-2015 Timeline API format — because the schema is incompatible with post-2015 and adds complexity with
  no benefit — document as out-of-scope"
- "DO NOT download from gharchive.org in unit tests — because the service rate-limits and files are 50MB+ per hour — use synthetic
  test fixtures"

verification:
- description: "GitHub Archive benchmark module imports"
  command: "uv run -- python -c \"from benchbox.core.github_archive import GitHubArchiveBenchmark; print('OK')\""
  expected_output: "OK"
- description: "Unit tests pass"
  command: "uv run -- python -m pytest tests/unit/core/github_archive/ -v --tb=short"
  expected_output: "all tests pass"

scope_limit:
  only_modify:
  - "benchbox/core/github_archive/"
  - "tests/unit/core/github_archive/"
  do_not_modify:
  - "benchbox/core/clickbench/"
  - "benchbox/core/runner.py"

success_metrics:
- Hourly file download and parsing working
- 20+ analytical queries covering all categories
- Scale factors from 0.01 (~10MB) to 100.0 (~100GB) working
- JSON payload extraction efficient on DuckDB
- Trend queries under 30 seconds for SF=1.0 (~1GB, ~15M events)
