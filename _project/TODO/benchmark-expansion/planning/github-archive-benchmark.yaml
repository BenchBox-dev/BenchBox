title: GitHub Archive Benchmark - Developer Activity Analytics Workload
worktree: benchmark-expansion
category: Benchmark Development
priority: Medium
status: Not Started
description: |
  Implement a GitHub Archive benchmark using the GH Archive dataset, which records
  the public GitHub timeline since 2011. This benchmark provides a realistic
  event-driven analytics workload with nested JSON structures, enabling performance
  testing of aggregations, trend analysis, and semi-structured data processing.

  GitHub Archive is excellent for benchmarking because:
  - Massive scale: 7.5+ billion events, continuously growing
  - Real developer activity with natural distributions
  - Event-driven schema with nested JSON payloads
  - Multiple access methods (BigQuery, ClickHouse, direct download)
  - Rich analytical patterns: trending repos, developer metrics, language trends

  Use cases covered:
  - Repository trending and popularity analysis
  - Developer activity and contribution metrics
  - Programming language ecosystem trends
  - Open source project health metrics
  - Event-based time-series analysis

context_sections:
- name: Data Sources
  summary: |
    **Primary Sources:**
    | Source | Access | Update | Cost | Scale |
    |--------|--------|--------|------|-------|
    | gharchive.org | HTTP download | Hourly | Free | Full history |
    | BigQuery | SQL query | Hourly | Free 1TB/mo | Full history |
    | ClickHouse Demo | Pre-loaded | Hourly | Free | 3.1B+ events |

    **Download Pattern:**
    ```
    https://data.gharchive.org/YYYY-MM-DD-H.json.gz
    Example: https://data.gharchive.org/2025-01-12-15.json.gz
    ```

    **Recommended for BenchBox:**
    - Direct download for reproducible benchmarks
    - BigQuery for development/testing
    - ClickHouse demo for query pattern reference

- name: Schema Structure
  summary: |
    **Core Event Schema:**
    | Field | Type | Description |
    |-------|------|-------------|
    | id | STRING | Unique event ID |
    | type | STRING | Event type (22+ types) |
    | actor | STRUCT | User performing action |
    | repo | STRUCT | Target repository |
    | payload | JSON | Event-specific data (nested) |
    | public | BOOLEAN | Always true (public events) |
    | created_at | TIMESTAMP | Event timestamp |

    **Actor Structure:**
    - id, login, display_login, gravatar_id, url, avatar_url

    **Repo Structure:**
    - id, name (owner/repo), url

    **Payload Structure (varies by event type):**
    - PushEvent: commits[], size, distinct_size, ref, head, before
    - PullRequestEvent: action, number, pull_request{}
    - IssuesEvent: action, issue{}
    - WatchEvent: action (always "started" = star)

- name: Event Types
  summary: |
    **22+ Event Types:**

    | Category | Events | Description |
    |----------|--------|-------------|
    | Code | PushEvent, CreateEvent, DeleteEvent | Code changes |
    | PRs | PullRequestEvent, PullRequestReviewEvent | Code review |
    | Issues | IssuesEvent, IssueCommentEvent | Issue tracking |
    | Social | WatchEvent, ForkEvent, MemberEvent | Engagement |
    | Releases | ReleaseEvent | Version publishing |
    | Wiki | GollumEvent | Documentation |
    | Comments | CommitCommentEvent | Code discussion |

    **Event Distribution (typical):**
    - PushEvent: ~50% of all events
    - WatchEvent: ~15%
    - PullRequestEvent: ~10%
    - IssuesEvent: ~5%
    - Others: ~20%

- name: Data Volumes
  summary: |
    **Historical Scale:**
    | Metric | Value |
    |--------|-------|
    | Total events | 7.5+ billion |
    | Monthly volume | ~30 million events |
    | Unique repos | 164 million |
    | Unique users | 34 million |
    | Download size | 75 GB (compressed) |
    | Loaded size | 200+ GB |

    **Time-Based Scale Factors:**
    | Period | Events | Compressed | Loaded |
    |--------|--------|------------|--------|
    | 1 day | 1-2M | 10-20 MB | 50-100 MB |
    | 1 week | 7-14M | 70-140 MB | 350-700 MB |
    | 1 month | 30M | 300 MB | 1-2 GB |
    | 1 year | 360M+ | 3.6 GB | 15-20 GB |
    | Full history | 7.5B+ | 75+ GB | 200+ GB |

- name: Query Workload Categories
  summary: |
    **Repository Trends (5+ queries):**
    - Trending repos by star growth
    - Most-starred repositories
    - Fastest growing projects
    - Fork rate analysis
    - Activity by programming language

    **Developer Activity (4+ queries):**
    - Top contributors by commits
    - Active developers by repo
    - Collaboration patterns
    - Geographic/timezone distribution

    **Language Ecosystem (4+ queries):**
    - Language popularity trends
    - Framework adoption rates
    - Ecosystem health metrics
    - Language migration patterns

    **Project Health (4+ queries):**
    - PR merge rates
    - Issue response time
    - Release frequency
    - Community engagement

    **Time-Series Analysis (4+ queries):**
    - Activity by hour/day/week
    - Seasonal patterns
    - Event type distribution over time
    - Growth trends

- name: Scale Factor Design
  summary: |
    **TPC-aligned scale factors (SF=1 ≈ 1GB raw data):**

    GitHub generates ~30M events/month (~1-2 GB). Scale factors use
    time-based subsetting to maintain event coherence.

    | Scale | Period | Events | Size (Raw) | Use Case |
    |-------|--------|--------|------------|----------|
    | 0.01 | ~6 hours | ~500K | ~10 MB | CI/testing |
    | 0.1 | ~2 days | ~4M | ~100 MB | Development |
    | 1.0 | ~2 weeks | ~15M | ~1 GB | Standard |
    | 10.0 | ~5 months | ~150M | ~10 GB | Large scale |
    | 100.0 | ~4 years | ~1.5B | ~100 GB | Extended |
    | Full | All (2015+) | ~7.5B+ | ~200+ GB | Maximum |

    **Scaling Strategy:**
    - Time-based (contiguous periods) for trend analysis
    - Recent data preferred for relevance
    - Hourly files allow fine-grained control
    - Post-2015 data only (Events API format)

tasks:
- phase: "Phase 1: Data Infrastructure"
  items:
  - summary: Design data acquisition approach
    done: false
    details: |
      - Implement hourly file downloader from gharchive.org
      - Support date range specification
      - Handle gzip decompression
      - Convert NDJSON to Parquet for efficiency

  - summary: Create gharchive module structure
    done: false
    details: |
      - benchbox/core/gharchive/__init__.py
      - benchbox/core/gharchive/schema.py
      - benchbox/core/gharchive/downloader.py
      - benchbox/core/gharchive/queries.py
      - benchbox/core/gharchive/benchmark.py

  - summary: Implement schema definitions
    done: false
    details: |
      - Events table with JSON payload column
      - OR flattened table with sparse columns per event type
      - Consider ClickHouse approach (flattened for performance)

  - summary: Design payload extraction strategy
    done: false
    details: |
      Options:
      A) Keep payload as JSON, extract at query time
      B) Pre-extract common fields into separate columns
      C) Create separate tables per event type

      Trade-offs: A is flexible but slower, B/C are faster but more complex

  - summary: Handle 2015 schema change (Timeline API → Events API)
    done: false
    details: |
      GitHub Archive changed schema in March 2015:
      - Pre-2015: Timeline API format (different event structure)
      - Post-2015: Events API format (current structure)

      Options:
      A) Only support post-2015 data (simpler, recommended for MVP)
      B) Create schema adapter for pre-2015 events
      C) Document limitation and allow future extension

      Recommendation: Option A for initial implementation, document
      pre-2015 as out-of-scope with future enhancement path

