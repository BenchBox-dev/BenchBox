metadata:
  owners:
  - '@benchbox-maintainers'
  tags:
  - benchmark
  - real-world
  - wikipedia
  - time-series
  - high-cardinality
  - web-traffic
  estimated_effort: 2-3 weeks
  created_date: "2026-01-12"
  dependencies:
  - Existing NYC Taxi benchmark pattern (benchbox/core/nyctaxi/) for downloader design
  - BaseBenchmark class (benchbox/core/base.py) for benchmark integration
  notes: |
    - Data continuously updated hourly (24-48h lag)
    - Title encoding requires careful handling (URL-encoded in raw data)
    - Consider English-only subset for smaller scale and reduced cardinality
    - Clickstream integration is out of scope (documented as future enhancement)
    - Clear timezone effects in traffic patterns

  migration_review_required: true
must_preserve:
- "BaseBenchmark interface contract unchanged"

anti_patterns:
- "DO NOT assume ASCII-safe page titles — because Wikipedia titles contain arbitrary Unicode and URL-encoded characters —
  always decode and handle UTF-8 correctly"
- "DO NOT download Wikimedia dumps in unit tests — because hourly files are 50MB+ compressed — use synthetic pageview data"

verification:
- description: "Wikipedia benchmark module imports"
  command: "uv run -- python -c \"from benchbox.core.wikipedia_pageviews import WikipediaPageviewsBenchmark; print('OK')\""
  expected_output: "OK"
- description: "Unit tests pass"
  command: "uv run -- python -m pytest tests/unit/core/wikipedia_pageviews/ -v --tb=short"
  expected_output: "all tests pass"

scope_limit:
  only_modify:
  - "benchbox/core/wikipedia_pageviews/"
  - "tests/unit/core/wikipedia_pageviews/"
  do_not_modify:
  - "benchbox/core/runner.py"

success_metrics:
- Hourly file download and parsing working
- 20+ analytical queries covering all categories
- Scale factors from 0.01 (~10MB) to 100.0 (~100GB) working
- High-cardinality queries efficient on DuckDB
- Top-pages queries under 10 seconds for SF=1.0 (~1GB, ~50M rows)
