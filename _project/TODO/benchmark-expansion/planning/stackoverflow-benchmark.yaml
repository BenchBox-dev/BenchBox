metadata:
  owners:
  - '@benchbox-maintainers'
  tags:
  - benchmark
  - real-world
  - stackoverflow
  - olap
  - multi-table
  estimated_effort: 3-4 weeks
  created_date: "2026-01-12"
  dependencies:
  - Existing NYC Taxi benchmark pattern (benchbox/core/nyctaxi/) for downloader/schema design
  - BaseBenchmark class (benchbox/core/base.py) for benchmark integration
  - TPC-H benchmark (benchbox/core/tpch/) for multi-table join patterns
  notes: |
    - ClickHouse has pre-loaded dataset for reference
    - BigQuery offers free 1TB/month for development
    - Body/Text fields require text search for some queries
    - Read-only workload (no INSERT/UPDATE testing)
    - Highly skewed distribution (power-law on reputation, views)

  migration_review_required: true
must_preserve:
- "BaseBenchmark interface contract unchanged"
- "Platform registry backward compatible"

anti_patterns:
- "DO NOT parse XML dumps at benchmark runtime — because XML parsing is 10-100x slower than Parquet reads — always pre-convert
  to Parquet in the data generation phase"
- "DO NOT require internet access for benchmark execution — because air-gapped environments exist — only the data acquisition
  phase should download"

verification:
- description: "StackOverflow benchmark module imports"
  command: "uv run -- python -c \"from benchbox.core.stackoverflow import StackOverflowBenchmark; print('OK')\""
  expected_output: "OK"
- description: "Unit tests pass"
  command: "uv run -- python -m pytest tests/unit/core/stackoverflow/ -v --tb=short"
  expected_output: "all tests pass"

scope_limit:
  only_modify:
  - "benchbox/core/stackoverflow/"
  - "tests/unit/core/stackoverflow/"
  do_not_modify:
  - "benchbox/core/runner.py"

success_metrics:
- All 7 tables loadable with referential integrity
- 20+ analytical queries covering all categories
- Scale factors from 0.01 (~10MB) to 100.0 (~100GB) working
- DuckDB integration tests passing
- Query execution under 30 seconds for SF=1.0 (~1GB, ~3.5M rows)
