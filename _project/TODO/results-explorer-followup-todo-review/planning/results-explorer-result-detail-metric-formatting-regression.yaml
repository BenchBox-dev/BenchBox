id: results-explorer-result-detail-metric-formatting-regression
title: "Restore Result Detail metric-formatting precision and unit contract after shared formatter rollout"
worktree: results-explorer-followup-todo-review
priority: Critical
status: Not Started
category: User Experience

description: |
  The follow-up remediation release gate caught a post-merge regression in the
  full Results Explorer frontend suite. `ResultDetail.test.tsx` now fails after
  the shared metric-formatting rollout because the canonical result summary no
  longer exposes exact power-score precision, and the median/raw duration table
  contract no longer matches the rendered labels.

  This is a release-blocking evidence issue, not just stale tests: Result
  Detail is the route where users inspect an individual benchmark receipt, so
  compact leaderboard/table formatting must not erase exact score evidence or
  make raw timing units ambiguous.

deps:
  needs:
  - results-explorer-metric-formatting-contract

work:
- id: w0
  summary: "Reproduce and classify the Result Detail formatter failures"
  status: pending
  notes: |
    Rerun `cd results-explorer && npm test -- --run src/pages/__tests__/ResultDetail.test.tsx`
    on the checked post-metric-formatting tree. Capture the failure output in
    `_project/verification-logs/results-explorer-result-detail-metric-formatting-regression/w0.log`.
    Classify which failures are true product-contract defects versus tests that
    should be updated to the shared metric-formatting contract.

- id: w1
  summary: "Restore exact result-summary score evidence without reintroducing noisy dense-table decimals"
  needs: [w0]
  status: pending
  notes: |
    Result Detail should expose exact power-score precision in the canonical
    result summary or an equally explicit detail-only affordance. Do not revert
    compact score formatting on leaderboards, benchmark/platform tables, or
    compare cards.

- id: w2
  summary: "Align median/raw duration labels with the displayed timing units"
  needs: [w0]
  status: pending
  notes: |
    The default median table and expanded raw-query table must have headers that
    agree with their values. If values use dynamic `ms`/`s` formatting, use
    semantic headers such as `Median latency` and `Duration`; if raw table
    values are guaranteed milliseconds, keep explicit `(ms)` copy.

- id: w3
  summary: "Update focused tests for exact precision and unit-label behavior"
  needs: [w1, w2]
  status: pending
  notes: |
    Update or add Result Detail tests so they fail on missing exact score
    evidence, stale unit labels, or a regression back to noisy dense-table
    decimals.

- id: w4
  summary: "Rerun release-gate automated checks affected by the fix"
  needs: [w3]
  status: pending
  notes: |
    Rerun:
      - `cd results-explorer && npm test -- --run src/pages/__tests__/ResultDetail.test.tsx`;
      - `cd results-explorer && npm test -- --run`;
      - `cd results-explorer && npm run typecheck`;
      - `cd results-explorer && npm run build`.
    Capture logs under
    `_project/verification-logs/results-explorer-result-detail-metric-formatting-regression/`.

prior_art:
- "results-explorer/src/pages/ResultDetail.tsx owns the result summary, median display-timing table, and expanded raw query table."
- "results-explorer/src/pages/__tests__/ResultDetail.test.tsx contains the failing median-first and exact score precision contract tests."
- "results-explorer/src/lib/metricFormatters.ts centralizes compact/exact power score and dynamic latency formatting."
- "_project/verification-logs/results-explorer-followup-remediation-release-gate/w2-frontend-tests.log captures the release-gate failure."

must_preserve:
- "Leaderboard, benchmark, platform, query, and compare surfaces must keep compact large power-score formatting."
- "Result Detail must preserve exact score evidence for receipt-level inspection."
- "Timing headers must match the rendered timing unit contract."
- "Raw sort/comparison values must remain numeric and unrounded."

approach: |
  Treat Result Detail as a detail/receipt surface, not a dense leaderboard
  surface. Preserve compact shared formatting where it improves scanning, but
  expose exact power-score evidence where users inspect a single result.

anti_patterns:
- "DO NOT globally revert `fmtScore` to exact formatting."
- "DO NOT silence the failing tests without deciding the detail-route contract."
- "DO NOT add source changes outside Result Detail, shared formatter helpers, or focused tests unless reproduction proves the issue is shared."

verification:
- description: "Result Detail formatter regression tests pass"
  command: "cd results-explorer && npm test -- --run src/pages/__tests__/ResultDetail.test.tsx"
  expected_output: "ResultDetail tests pass"
- description: "Full Results Explorer frontend suite passes"
  command: "cd results-explorer && npm test -- --run"
  expected_output: "all frontend tests pass"
- description: "Typecheck and build pass"
  command: "cd results-explorer && npm run typecheck && npm run build"
  expected_output: "both commands exit 0"

scope_limit:
  only_modify:
  - "results-explorer/src/pages/ResultDetail.tsx"
  - "results-explorer/src/pages/__tests__/ResultDetail.test.tsx"
  - "results-explorer/src/lib/metricFormatters.ts"
  - "results-explorer/src/lib/__tests__/metricFormatters.test.ts"
  - "results-explorer/src/utils.ts"
  - "results-explorer/src/__tests__/utils.test.ts"
  - "_project/verification-logs/results-explorer-result-detail-metric-formatting-regression/"
  - "_project/TODO/results-explorer-followup-todo-review/planning/results-explorer-result-detail-metric-formatting-regression.yaml"
  do_not_modify:
  - "benchbox/"
  - "results-explorer/public/data/"

success_metrics:
- "Result Detail exposes exact power-score evidence while dense routes keep compact formatting."
- "Median/raw timing headers agree with rendered values."
- "The release-gate full frontend suite no longer fails in ResultDetail tests."

metadata:
  tags:
  - results-explorer
  - result-detail
  - metrics
  - release-blocker
  estimated_effort: "Small (under 0.5 day)"
  created_date: "2026-05-12"

impact:
  business_value: |
    Restores trust in detail-route evidence before declaring the remediation
    batch complete.
  user_impact: |
    Users inspecting a single result can see exact score evidence and
    unambiguous timing units.
  technical_debt: |
    Clarifies the distinction between compact dense-table formatting and
    receipt-level exact evidence.
