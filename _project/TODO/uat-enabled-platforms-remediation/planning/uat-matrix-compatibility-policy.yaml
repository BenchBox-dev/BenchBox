id: uat-matrix-compatibility-policy
title: "UAT: add explicit platform-benchmark compatibility rules and run accounting"
worktree: uat-enabled-platforms-remediation
priority: High
status: Not Started
category: Testing and Quality Assurance

description: |
  The 2026-05-12 enabled-platform run enumerated a broad set of enabled-platform
  cells but did not provide durable accounting for "all possible benchmarks" by
  platform. The local enumeration path reports 57 candidate cells per platform
  across 22 public benchmarks and three scale rungs, while the observed
  `matrix_summary.tsv` contains 96 executed cells because early failure
  behavior and scale filtering stopped many candidates before execution.

  UAT needs a first-class compatibility gate: every benchmark excluded for a
  platform must have an explicit rule id, source evidence, and justification.
  Everything else must run, and the report must distinguish executed, passed,
  failed, timed out, compatibility-pruned, and ladder-pruned cells.

deps:
  needs:
    - uat-pg-extension-auth-propagation

work:
  - id: w0
    summary: "Recompute current candidate and observed cell accounting"
    status: pending
    notes: |
      Re-run or script the enumeration for `lakesail`, `pg-duckdb`,
      `pg-mooncake`, and `timescaledb` on the current branch, and compare it to
      the 2026-05-12 artifact counts. Commit only a compact summary if durable
      evidence is needed; keep raw enumeration output under `/tmp` or
      `BENCHBOX_OUTPUT_DIR`.

  - id: w1
    summary: "Define the platform-benchmark compatibility data model"
    needs: [w0]
    status: pending
    notes: |
      Add or extend a registry-backed rule model for platform/benchmark
      compatibility. A rule must include platform, benchmark, rule id, status
      such as `blocked` or `experimental`, a human-readable reason, and source
      evidence. Prefer reusing SQL compatibility registry patterns before
      adding a new convention.

  - id: w2
    summary: "Apply compatibility rules during UAT enumeration and reporting"
    needs: [w1]
    status: pending
    notes: |
      Update enumeration so compatibility-pruned cells are emitted with reasons
      and not silently dropped. Update matrix/report outputs to show candidate,
      executed, compatibility-pruned, early-stop-pruned, passed, failed, and
      timed-out counts per platform and benchmark.

  - id: w3
    summary: "Add coverage-sweep mode that attempts every non-blocked cell"
    needs: [w2]
    status: pending
    notes: |
      The enabled-platform UAT config must be able to run all non-blocked
      benchmarks for each enabled platform. If early-stop behavior remains for
      short developer smoke runs, it must be disabled or separately accounted
      for in coverage sweeps.

  - id: w4
    summary: "Document the rule format and update existing UAT docs"
    needs: [w2]
    status: pending
    notes: |
      Document how to add a platform/benchmark incompatibility rule, what
      evidence is acceptable, and how a compatibility-pruned cell appears in
      UAT reports.

deferred:
  - summary: "Add broad feature-level optimizer rewrites for every SQL dialect"
    reason: "This TODO only creates compatibility/run-accounting policy; platform-specific SQL fixes are separate."

prior_art:
  - "tests/uat/phases/enumerate.py:1-86 -- current UAT enumeration filters dataframe vs SQL-only and scale metadata, but has no SQL-platform benchmark gate"
  - "tests/uat/matrix.py:220-419 -- registry-driven benchmark resolution and argv generation"
  - "benchbox/core/benchmark_registry.py:93-260 -- public benchmark metadata and scale options used by UAT"
  - "benchbox/sql_compat/registry.py -- existing compatibility rule registration pattern to reuse or deliberately supersede"
  - "docs/compat/skip-reference.md -- existing documented skip/block vocabulary"
  - "docs/compat/capability-matrix.md:13-39 -- platform capability report generated from compatibility metadata"
  - "tests/uat/phases/report.py -- UAT report generation path that should expose pruned and executed counts"

must_preserve:
  - "Do not exclude a benchmark solely because it failed in one UAT run; each exclusion needs explicit incompatibility evidence"
  - "Existing small UAT smoke configs can retain fast early-stop behavior if coverage sweeps get complete accounting"
  - "Benchmark registry public metadata remains the source for public benchmark discovery"

approach: |
  Treat compatibility pruning as data, not control-flow folklore. Reuse the
  existing SQL compatibility registry if it can represent platform/benchmark
  gates cleanly; otherwise add the smallest dedicated UAT compatibility layer
  and document why the SQL registry was not a good fit.

anti_patterns:
  - "DO NOT hard-code a list of benchmarks to skip inside `enumerate.py` without rule ids and source evidence"
  - "DO NOT count early-stop-pruned cells as passed, failed, or compatibility-pruned"
  - "DO NOT let the enabled-platform coverage sweep silently stop after the first failure on a platform"

verification:
  - description: "UAT enumeration/report unit coverage passes"
    command: "uv run -- python -m pytest tests/uat/test_matrix.py tests/uat/test_phases.py tests/uat/test_report.py -m fast -q"
    expected_output: "passes with tests for compatibility-pruned and early-stop-pruned accounting"
  - description: "Compatibility metadata validates and generated docs stay current"
    command: "uv run -- python _project/scripts/reference_usage_audit.py --summary && uv run -- python -m pytest tests/unit/core/sql_compat tests/unit/sql_compat -m fast -q"
    expected_output: "passes or produces only documented non-blocking compatibility-doc warnings"
  - description: "Coverage-sweep config enumerates all non-blocked cells for enabled platforms"
    command: "BENCHBOX_OUTPUT_DIR=~/Developer/benchmark_runs make uat-sweep CONFIG=tests/uat/configs/uat-enabled-platforms-enumeration.yaml"
    expected_output: "Report shows candidate, executed, compatibility-pruned, and early-stop-pruned counts for lakesail, pg-duckdb, pg-mooncake, and timescaledb"

scope_limit:
  only_modify:
    - "tests/uat/"
    - "benchbox/sql_compat/"
    - "benchbox/core/benchmark_registry.py"
    - "docs/compat/"
    - "docs/operations/uat-framework.md"
  do_not_modify:
    - "benchmark_runs/"
    - "benchbox/platforms/"
    - "benchbox/core/*/queries.py"

metadata:
  owners:
    - joeharris76
  tags:
    - uat
    - compatibility
    - matrix
    - reporting
  estimated_effort: Large
  created_date: "2026-05-12"
  last_updated: "2026-05-12T00:00:00"

impact:
  business_value: |
    Makes enabled-platform UAT decision-ready: missing coverage is visible and
    justified instead of inferred from failures or absent rows.
  user_impact: |
    Users and maintainers can tell which benchmark/platform combinations are
    supported, blocked, or still failing.
  technical_debt: |
    Replaces implicit matrix pruning with auditable compatibility metadata.

success_metrics:
  - "Each excluded platform/benchmark pair has a rule id, reason, and source evidence"
  - "Enabled-platform reports include candidate, executed, pruned, passed, failed, and timed-out counts"
  - "Coverage sweeps attempt every non-blocked benchmark for lakesail, pg-duckdb, pg-mooncake, and timescaledb"

open_questions:
  - question: "Should benchmark compatibility rules live in `benchbox/sql_compat` or under `tests/uat`?"
    gating: true
    affects: [w1, w2, w4]
    default: "Reuse `benchbox/sql_compat` only if it can express benchmark gates without coupling runtime code to UAT-only policy"
