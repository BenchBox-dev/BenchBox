id: uat-enabled-platforms-full-sweep-release-gate
title: "UAT: rerun enabled-platform full sweep and publish compact release-gate summary"
worktree: uat-enabled-platforms-remediation
priority: Critical
status: Blocked
category: Testing and Quality Assurance

description: |
  After auth propagation, explicit compatibility rules, LakeSail remediation,
  timeout hardening, and Explorer external-corpus smoke are implemented, rerun
  the corrected enabled-platform UAT for `lakesail`, `pg-duckdb`, `pg-mooncake`,
  and `timescaledb`.

  The goal is not merely a green command. The release gate must prove that every
  non-compatibility-blocked benchmark runs for each enabled platform, validation
  is clean wherever validators exist, packaging/report phases complete, Explorer
  smoke passes against the packaged corpus, and any excluded benchmark has a
  durable compatibility rule.

deps:
  needs:
    - uat-pg-extension-auth-propagation
    - uat-matrix-compatibility-policy
    - lakesail-benchmark-sql-compatibility-remediation
    - uat-timeout-enforcement-hardening
    - uat-explorer-smoke-external-corpus

work:
  - id: w0
    summary: "Prepare the final enabled-platform UAT config and run directory"
    status: done
    notes: |
      Added `tests/uat/configs/uat-enabled-platforms-full.yaml` and ran with
      `BENCHBOX_OUTPUT_DIR=/Users/joe/Developer/benchmark_runs`. Raw logs and
      browser artifacts remained under the run root.

  - id: w1
    summary: "Run the full enabled-platform sweep sequentially"
    needs: [w0]
    status: done
    notes: |
      Ran all non-compatibility-blocked benchmarks for `lakesail`,
      `pg-duckdb`, `pg-mooncake`, and `timescaledb` with Docker managed
      sequentially and early-stop disabled. Docker lifecycle was clean.

  - id: w2
    summary: "Validate result integrity, packaging, reports, and Explorer smoke"
    needs: [w1]
    status: done
    notes: |
      Checked `matrix_summary.tsv`, `validator_rollup.tsv`,
      `uat_lifecycle.log`, package output, and `playwright_smoke.log`.
      Explorer external-corpus smoke passed. Matrix accounting reported
      88 candidates, 84 executed, 4 compatibility-pruned, 33 passed,
      50 failed, and 1 timed out. The timed-out cell was
      `timescaledb/tpchavoc` at the configured 600s timeout.

  - id: w3
    summary: "Commit a compact durable UAT summary"
    needs: [w2]
    status: done
    notes: |
      Added `_project/audits/uat-enabled-platforms-full-release-gate-2026-05-13.md`
      with command, checked SHA, run path, counts, compatibility-pruned cells,
      validator rollup summary, and remaining failures. No raw logs,
      screenshots, browser reports, or generated binary evidence were committed.

  - id: w4
    summary: "Remediate remaining PG extension and TimescaleDB red cells"
    needs: [w3]
    status: pending
    notes: |
      The release gate is blocked, not complete. This pass added
      evidence-backed benchmark gates for PostgreSQL-family
      `ai_primitives`, `read_primitives`, and `vector_search`; fixed
      `flightdata` PostgreSQL ROUND rendering; fixed `datavault` interval
      substitution; and fixed PostgreSQL COPY handling for TPC-DS `.dat`
      trailing nullable fields.

      Targeted pg-duckdb UAT evidence under
      `/Users/joe/Developer/benchmark_runs/logs/uat_pg_duckdb_fixcheck_20260513/`:
      `flightdata` and `datavault` now pass and are submittable.
      `tpcds` now passes load validation but remains PARTIAL with
      Q36/Q70/Q86/Q90 failed.

      A follow-up pass fixed AMPLab HAVING aliases and PostgreSQL CSV
      empty-string preservation for ClickBench; targeted `pg-duckdb/amplab`
      and `pg-duckdb/clickbench` now pass. PostgreSQL-family Parquet loading
      now streams Parquet through COPY, and canonical JoinOrder omits FK
      constraints by default because the IMDb dataset has dangling references.
      Targeted `pg-duckdb/joinorder` now reaches query execution but timed out
      at 600s. Targeted `pg-duckdb/tpcds_obt` no longer hits temp-file disk
      exhaustion, but failed after the preceding timeout with a closed socket.
      Docker Desktop reported a project-scoped containerd metadata I/O error
      while removing the pg-duckdb stack, so further live reruns should start
      after Docker is healthy.

      After Docker Desktop was restarted and the stale container removed,
      targeted `pg-duckdb/metadata_primitives` passed with the guarded
      `large_catalog_column_count` query, and targeted `pg-duckdb/tpcdi`
      passed with PostgreSQL query rendering for date arithmetic, boolean
      comparisons, and alias references.

      Remaining PG extension and TimescaleDB failures still need per-log
      clustering from
      `/Users/joe/Developer/benchmark_runs/logs/uat_enabled_platforms_full_20260513/`
      and either fixes or evidence-backed compatibility rules.

deferred:
  - summary: "Run cloud/live platform UAT"
    reason: "The requested enabled platforms are local Docker-managed platforms; cloud/live sweeps require separate approval."
  - summary: "Cut release after green enabled-platform gate"
    reason: "The 2026-05-13 full gate is blocked by 50 failed cells and one timeout."

prior_art:
  - "docs/operations/uat-framework.md -- long-running UAT command, logging, and cleanup expectations"
  - "/Users/joe/Developer/benchmark_runs/logs/uat_enabled_today_platforms_20260512/command-status.json -- prior corrected run returned 2 after 1036.4s"
  - "/Users/joe/Developer/benchmark_runs/logs/uat_enabled_today_platforms_20260512/matrix_summary.tsv -- prior run had 13 passed and 83 failed executed cells"
  - "/Users/joe/Developer/benchmark_runs/logs/uat_enabled_today_platforms_20260512/validator_rollup.tsv -- prior clean validation only covered 13 LakeSail result bundles"
  - "/Users/joe/Developer/benchmark_runs/logs/uat_enabled_today_platforms_20260512/uat_lifecycle.log -- prior Docker lifecycle succeeded for targeted platforms"
  - "/Users/joe/Developer/benchmark_runs/logs/uat_enabled_today_platforms_20260512/playwright_smoke.log -- prior Explorer smoke build passed but route smoke failed"

must_preserve:
  - "Raw UAT evidence remains under `/Users/joe/Developer/benchmark_runs` or `/tmp`, not committed"
  - "Only explicitly justified compatibility rules may exclude benchmark/platform combinations"
  - "Docker stacks run sequentially and are torn down through project targets"
  - "No live cloud tests run without explicit approval"

approach: |
  Treat this as the integration gate for the remediation chain. First prove the
  matrix and compatibility accounting are correct, then run the full sweep, then
  commit only the compact durable facts needed for release readiness.

anti_patterns:
  - "DO NOT accept a green run that skipped failed benchmarks without compatibility rules"
  - "DO NOT commit raw `cells.jsonl`, screenshots, Playwright reports, command logs, or binary result bundles"
  - "DO NOT run multiple Docker stacks concurrently or use global Docker prune commands"

verification:
  - description: "Full enabled-platform UAT sweep completes with explicit coverage accounting"
    command: "BENCHBOX_OUTPUT_DIR=~/Developer/benchmark_runs make uat-sweep CONFIG=tests/uat/configs/uat-enabled-platforms-full.yaml"
    expected_output: "`command-status.json` returns 0, or any nonzero exit is tied only to explicitly accepted compatibility-blocked cells"
  - description: "Validator rollup and matrix accounting are clean"
    command: "test -n \"$BENCHBOX_UAT_RUN_DIR\" && uv run -- python - <<'PY'\nimport os\nfrom pathlib import Path\nrun = Path(os.environ['BENCHBOX_UAT_RUN_DIR'])\nfor name in ['matrix_summary.tsv', 'validator_rollup.tsv', 'uat_lifecycle.log', 'playwright_smoke.log']:\n    print(name, (run / name).exists())\nPY"
    expected_output: "All required summary artifacts exist; matrix counts match every candidate/executed/pruned cell"
  - description: "Planning/TODO schema and graph remain valid after summary updates"
    command: "uv run --project _project/scripts -- python _project/scripts/validate_todo.py --all && uv run --project _project/scripts -- python _project/scripts/todo_cli.py check-graph"
    expected_output: "passes"
  - description: "Final branch passes project preflight before PR"
    command: "make pr-preflight"
    expected_output: "passes"

scope_limit:
  only_modify:
    - "tests/uat/configs/"
    - "_project/audits/"
    - "_project/TODO/uat-enabled-platforms-remediation/"
    - "docs/operations/uat-framework.md"
  do_not_modify:
    - "benchmark_runs/"
    - "results-explorer/playwright-report/"
    - "results-explorer/test-results/"
    - "docker/"
    - "benchbox/platforms/"

