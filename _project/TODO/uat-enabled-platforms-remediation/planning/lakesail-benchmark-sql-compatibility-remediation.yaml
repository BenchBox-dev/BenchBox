impact:
  business_value: |
    Turns LakeSail from a partial platform into a fully characterized enabled
    platform with explicit support and incompatibility boundaries.
  user_impact: |
    Users get a reliable LakeSail benchmark matrix rather than discovering
    benchmark-specific parser/load failures at runtime.
  technical_debt: |
    Moves one-off Spark SQL gaps into tested compatibility helpers and documented
    platform capability metadata.

success_metrics:
  - "All fixable LakeSail benchmarks in the enabled-platform matrix run at the smallest supported scale"
  - "Any remaining LakeSail exclusions have explicit compatibility rules with source evidence"
  - "Validator rollup is clean for every LakeSail result bundle with an available validator"

open_questions:
  - question: "Should LakeSail division-by-zero behavior be fixed by query rewrite or session-level ANSI settings?"
    gating: true
    affects: [w2]
    default: "Use query-level semantics-preserving rewrites unless a platform-wide setting is proven safe across validators"
  - question: "Is Vector Search required to use native vector operators, or can LakeSail run a list/array fallback with equivalent semantics?"
    gating: true
    affects: [w1, w4]
    default: "Implement an equivalent list/array fallback if current LakeSail supports it and validation can prove correctness"
