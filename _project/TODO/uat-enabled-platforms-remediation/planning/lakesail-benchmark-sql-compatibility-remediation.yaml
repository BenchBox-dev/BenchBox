id: lakesail-benchmark-sql-compatibility-remediation
title: "LakeSail: remediate benchmark SQL, DDL, and load compatibility surfaced by UAT"
worktree: uat-enabled-platforms-remediation
priority: Critical
status: Not Started
category: Platform Expansion

description: |
  The 2026-05-12 enabled-platform UAT run proved the LakeSail adapter can
  complete several benchmarks: `validator_rollup.tsv` is clean for TPC-H, SSB,
  H2O DB, AMPLab, and JoinOrder. The same run failed 17 LakeSail cells across
  benchmark-specific SQL, DDL, data loading, and capability gaps.

  Representative artifact evidence from
  `/Users/joe/Developer/benchmark_runs/logs/uat_enabled_today_platforms_20260512/cells.jsonl`:
  TPC-DS hit Spark/LakeSail division-by-zero; TPC-DS OBT rejected quoted alias or
  interval syntax around `order count`; metadata primitives rejected `KEY` in
  DDL; vector search rejected `FLOAT[128]`; read primitives rejected
  `APPROX_TOP_K`; TPC-DI and write/transaction primitives missed expected
  staging or mixed-case tables; ClickBench hit non-nullable column load issues;
  CoffeeShop rejected colon-prefixed SQL/data syntax; TPCHavoc and TPCH skew
  tried to read generated CSV compatibility paths as directories.

  Fix all benchmark combinations that can run on current LakeSail. Only add a
  compatibility exclusion after a targeted repro proves the current platform
  lacks the required feature and the rule includes explicit source evidence.

deps:
  needs:
    - uat-matrix-compatibility-policy

work:
  - id: w0
    summary: "Revalidate and cluster current LakeSail failures"
    status: pending
    notes: |
      Re-run a targeted LakeSail UAT subset or parse current artifacts on the
      implementation branch. Produce a compact failure matrix with benchmark,
      phase, first error, and likely fix owner. Do not commit raw cells/logs.

  - id: w1
    summary: "Harden LakeSail DDL normalization for benchmark schemas"
    needs: [w0]
    status: pending
    notes: |
      Add focused DDL rewrite coverage for metadata primitives, TSBS devops,
      NYCTaxi, FlightData, DataVault, and Vector Search. Cover actual benchmark
      CREATE TABLE statements through the same helper path LakeSail uses, not
      synthetic one-line DDL only.

  - id: w2
    summary: "Repair or gate LakeSail query syntax/function gaps"
    needs: [w0]
    status: pending
    notes: |
      Address TPC-DS division-by-zero semantics, TPC-DS OBT alias/interval
      syntax, read primitive `APPROX_TOP_K`, and any other query-time failure
      proven by w0. Prefer dialect-aware rewrites with validator-backed
      semantics. If a function has no current LakeSail equivalent, create an
      explicit compatibility rule rather than a hidden skip.

  - id: w3
    summary: "Fix LakeSail data loading and generated-source path handling"
    needs: [w0]
    status: pending
    notes: |
      Investigate and fix TPC-DI mixed-case table load gaps, write and
      transaction primitive staging tables, ClickBench nullable column loading,
      CoffeeShop colon/dialect parsing, and TPCHavoc/TPCH skew CSV
      compatibility path handling. Keep fixes in shared Spark/LakeSail loading
      helpers only when Spark semantics also require them.

  - id: w4
    summary: "Resolve AI primitives and vector search support posture"
    needs: [w1, w2]
    status: pending
    notes: |
      AI primitives currently fail before schema creation because the benchmark
      lacks a `get_create_tables_sql` path for SQL adapters. Vector search
      currently fails at `FLOAT[128]` DDL. Implement SQL-compatible execution if
      current LakeSail supports the required semantics; otherwise add explicit,
      documented compatibility exclusions.

  - id: w5
    summary: "Run LakeSail regression suite and validator-backed UAT subset"
    needs: [w1, w2, w3, w4]
    status: pending
    notes: |
      Run focused unit tests for every rewrite/load fix, then a managed LakeSail
      UAT subset containing each previously failing benchmark at the smallest
      meaningful scale. Finish with validator rollup checks for every benchmark
      that produces a result bundle.

deferred:
  - summary: "Optimize LakeSail performance for large scale rungs"
    reason: "This TODO targets correctness and compatibility first; performance tuning comes after all possible benchmarks run."

prior_art:
  - "benchbox/platforms/lakesail.py:508-540 -- LakeSail schema creation path calls Spark DDL helpers with `source_dialect='duckdb'`"
  - "benchbox/platforms/_spark_helpers.py:209-251 -- `optimize_spark_table_definition()` currently strips constraints and appends USING but does not cover all observed DDL constructs"
  - "benchbox/platforms/_spark_helpers.py:373-450 -- Spark schema creation loop used by LakeSail"
  - "benchbox/platforms/base/spark_execution_mixin.py:205-372 -- Spark/LakeSail load path and CSV compatibility temporary-path handling"
  - "benchbox/platforms/base/spark_execution_mixin.py:440-524 -- query failure path for Spark-family adapters"
  - "tests/unit/platforms/test_lakesail_adapter.py:221-235 -- current minimal LakeSail DDL helper coverage"
  - "tests/unit/platforms/test_lakesail_coverage.py:721-752 -- current minimal LakeSail USING-clause coverage"
  - "docs/platforms/lakesail.md:42-51 -- LakeSail Docker data-path mirroring requirements"
  - "docs/compat/capability-matrix.md:128-132 -- current LakeSail compatibility rules cover only DDL optimize"
  - "docs/compat/skip-reference.md -- compatibility skip/block documentation pattern"

must_preserve:
  - "Existing clean LakeSail benchmarks remain clean: TPC-H, SSB, H2O DB, AMPLab, and JoinOrder"
  - "Query rewrites preserve benchmark semantics and validator expectations; do not change canonical benchmark SQL globally to fit one platform"
  - "Spark helper changes must not regress Spark, Databricks, or other Spark-family adapters"
  - "Benchmark exclusions require explicit compatibility rules with evidence, not ad hoc conditionals"

approach: |
  Work by failure cluster and add regression tests before broad sweeps. Prefer
  the existing SQL compatibility registry and Spark helper paths over adding
  LakeSail-only special cases. Treat load failures as hard correctness issues
  once their root cause is known, because later validation errors often hide the
  original load defect.

anti_patterns:
  - "DO NOT skip the 17 failing LakeSail benchmarks just because the 2026-05-12 run failed them"
  - "DO NOT add broad string replacements that only match the captured failing query text"
  - "DO NOT modify generated raw UAT artifacts under `benchmark_runs/` or commit result bundles"
  - "DO NOT weaken validators to make LakeSail appear clean"

verification:
  - description: "LakeSail platform unit coverage passes"
    command: "uv run -- python -m pytest tests/unit/platforms/test_lakesail_adapter.py tests/unit/platforms/test_lakesail_coverage.py -q"
    expected_output: "passes with added cases for every DDL/query/load helper change"
  - description: "Spark-family regression coverage passes"
    command: "uv run -- python -m pytest tests/unit/platforms/test_spark_adapter.py tests/unit/platforms/test_spark_helpers.py tests/unit/platforms/test_spark_csv_dialect_resolver.py -q"
    expected_output: "passes with Spark-family helper coverage intact"
  - description: "Previously failing LakeSail benchmarks run in managed UAT"
    command: "BENCHBOX_OUTPUT_DIR=~/Developer/benchmark_runs make uat-sweep CONFIG=tests/uat/configs/uat-lakesail-failing-benchmarks.yaml"
    expected_output: "Every non-compatibility-blocked LakeSail benchmark produces a result bundle and validator rollup is clean where validators exist"
  - description: "SQL compatibility docs reflect any explicit LakeSail exclusions"
    command: "uv run -- python -m pytest tests/unit/core/sql_compat tests/unit/sql_compat -m fast -q && uv run -- python _project/scripts/reference_usage_audit.py --summary"
    expected_output: "passes with documented LakeSail compatibility rules for any blocked benchmarks"

