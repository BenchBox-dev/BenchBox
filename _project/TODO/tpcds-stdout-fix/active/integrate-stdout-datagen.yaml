# TPC-DS stdout data generation fix - BenchBox integration
# Location: _project/TODO/tpcds-stdout-fix/planning/integrate-stdout-datagen.yaml

title: "Integrate stdout datagen with compression and format pipelines"
worktree: tpcds-stdout-fix
priority: High
status: Not Started
category: Core Functionality

description: |
  With the fixed TPC-DS binaries supporting stdout output via -FILTER Y,
  update BenchBox data generation modules to leverage streaming output
  for direct compression and open table format writing.

  Benefits:
  - Eliminate intermediate .dat files for large scale factors
  - Stream directly to compressed formats (zstd, gzip, lz4)
  - Stream directly to Parquet/ORC/Iceberg without disk staging
  - Reduce disk I/O and storage requirements
  - Enable parallel table generation with better resource utilization

context_sections:
  "Current Data Generation Flow": |
    1. dsdgen writes .dat files to disk
    2. BenchBox reads .dat files
    3. Converts/loads to target platform
    4. Cleanup .dat files

  "New Streaming Flow": |
    1. dsdgen -FILTER Y streams to stdout
    2. BenchBox pipes directly to:
       a) Compression (zstd/gzip) → file
       b) Parquet writer → file or cloud storage
       c) Platform loader (direct ingest)
    3. No intermediate files needed

  "Implementation Considerations": |
    - Need to handle sales/returns table pairs (returns skipped in FILTER mode)
    - Consider adding returns support to dsdgen later
    - Parallel table generation possible since each table is independent
    - Must preserve existing file-based flow as fallback

