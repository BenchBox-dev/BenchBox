# TPC-DS stdout data generation fix - Testing
# Location: _project/TODO/tpcds-stdout-fix/planning/test-stdout-datagen.yaml

title: "Add regression tests for TPC-DS stdout data generation"
worktree: tpcds-stdout-fix
priority: High
status: Not Started
category: Testing and Quality Assurance

description: |
  Create comprehensive tests to validate the TPC-DS stdout fix and prevent
  future regressions. Tests must cover:

  1. Binary-level tests (dsdgen accepts -FILTER Y and outputs to stdout)
  2. Integration tests (BenchBox can use streaming datagen)
  3. Backward compatibility (file-based generation still works)
  4. Data validation (stdout output matches file output)

  These tests should run in CI to catch any regressions if the TPC source
  is updated in the future.

context_sections:
  "Test Categories": |
    Unit Tests:
    - Binary wrapper correctly passes -FILTER Y flag
    - Streaming parser handles pipe input correctly
    - Compression pipeline produces valid output

    Integration Tests:
    - End-to-end stdout datagen for small table
    - Stdout vs file output data equivalence
    - Streaming to compressed file works
    - Streaming to Parquet works

    Regression Tests:
    - Binary accepts FILTER (not _FILTER) parameter
    - Stdout produces data (not empty or error)
    - File-based generation unaffected

  "Test Data": |
    Use small tables for fast tests:
    - date_dim (73,049 rows at SF1) - deterministic, good for validation
    - time_dim (86,400 rows at SF1) - small and fast
    - ship_mode (20 rows at SF1) - tiny, fastest

    Use SCALE 1 minimum (fractional causes segfault)
    Use fixed RNGSEED for reproducibility

