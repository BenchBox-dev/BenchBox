open_questions:
- "Should we auto-detect Lakehouse vs Warehouse and warn/switch?"
- "How to handle benchmark runs that expect to load data (fail fast vs skip)?"
- "Should --skip-load be required or just recommended for this platform?"
- "Can we query Delta Lake metadata (V-Order, file count) via SQL?"

context_sections:
  "Fabric Lakehouse vs Warehouse": |
    Microsoft Fabric offers two primary data storage patterns:

    **Lakehouse** (this adapter):
    - Storage: OneLake with Delta Lake format
    - Write access: Spark only (notebooks, jobs)
    - Query access: SQL Analytics Endpoint (T-SQL, READ-ONLY)
    - Best for: Data lake patterns, ML workloads, flexible schema

    **Warehouse** (existing adapter: fabric_warehouse.py):
    - Storage: OneLake with proprietary format
    - Write access: Full T-SQL DDL/DML
    - Query access: Full T-SQL
    - Best for: Traditional DW patterns, full SQL control

    Both use Entra ID auth and share OneLake storage layer.

  "SQL Analytics Endpoint Details": |
    The Lakehouse SQL Analytics Endpoint provides:
    - Automatic Delta Lake to SQL table mapping
    - T-SQL query syntax (Synapse-compatible subset)
    - Read-only access to Delta tables
    - Automatic schema inference from Delta metadata

    Endpoint pattern: {workspace-guid}.sql.azuresynapse.net
    (Note: different from Warehouse endpoint pattern)

  "Recommended BenchBox Workflow": |
    For complete Fabric Lakehouse benchmarking:

    1. **Data Loading** (Fabric Spark adapter):
       ```bash
       benchbox run --platform fabric-spark --benchmark tpch \
         --phases generate,load --scale 1
       ```

    2. **Query Benchmarking** (this adapter):
       ```bash
       benchbox run --platform fabric-lakehouse --benchmark tpch \
         --phases power,throughput --skip-load --scale 1
       ```

    This separates concerns and matches real enterprise patterns.

  "Error Message Design": |
    When users attempt write operations, provide actionable guidance:

    ```
    ReadOnlyPlatformError: Fabric Lakehouse SQL endpoint is read-only.

    Cannot execute: CREATE TABLE customer (...)

    To load data into Fabric Lakehouse, use the Fabric Spark platform:
      benchbox run --platform fabric-spark --benchmark tpch --phases generate,load

    Then run queries with:
      benchbox run --platform fabric-lakehouse --benchmark tpch --phases power --skip-load
    ```
