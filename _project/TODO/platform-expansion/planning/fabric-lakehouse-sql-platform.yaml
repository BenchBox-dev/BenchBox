impact:
  business_value: |
    Enables benchmarking of Microsoft Fabric Lakehouse SQL workloads, which is
    a common enterprise pattern:
    - Data engineers load via Spark
    - Analysts/BI tools query via SQL endpoint
    - This matches real-world usage patterns

    Combined with Fabric Spark Notebooks adapter, provides complete Fabric
    Lakehouse coverage.
  user_impact: |
    Users with pre-loaded Fabric Lakehouse data can benchmark query performance
    without needing to re-implement data loading. Workflow:
    1. Load data once via Fabric Spark (or existing ETL pipelines)
    2. Run repeated benchmark queries via this adapter
    3. Compare against Fabric Warehouse or other platforms
  technical_debt: |
    Clean implementation. Can share authentication logic with fabric_warehouse.py.
    The read-only constraint is explicit and enforced, not a hack.

technical_requirements:
  constraints:
  - "READ-ONLY: No DDL or DML operations supported (Fabric limitation)"
  - "Data must be pre-loaded via Fabric Spark Notebooks"
  - "Requires Entra ID authentication (no SQL auth)"
  - "Same-region connectivity required"
  dependencies:
  - "pyodbc (ODBC Driver 18 for SQL Server)"
  - "azure-identity (Entra ID authentication)"
  compatibility: |
    - Python 3.10+
    - Microsoft Fabric F2 capacity or higher
    - ODBC Driver 18 for SQL Server
    - SQLGlot 'tsql' dialect

