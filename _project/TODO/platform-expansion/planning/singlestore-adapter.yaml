title: "Add SingleStore Platform Adapter"
worktree: platform-expansion
priority: Medium
status: Not Started
category: Platform Expansion
description: |
  Add support for SingleStore (formerly MemSQL), a distributed SQL database designed
  for real-time analytics and transactions with both row and column storage.

  SingleStore is notable for:
  - Real-time analytics with sub-second query latency
  - Distributed architecture with horizontal scaling
  - MySQL wire protocol compatibility
  - Native Python SDK with 10x faster data reading than PyMySQL
  - Cloud (Helios) and self-managed deployment options

  Reference: https://docs.singlestore.com/

context_sections:
  "Technical Background": |
    SingleStore uses MySQL wire protocol but has significant extensions for:
    - Columnstore tables (optimized for analytics)
    - Rowstore tables (optimized for transactions)
    - Hash and reference tables for distributed joins
    - Pipeline ingestion for streaming data

    The official Python SDK (singlestoredb) provides:
    - DB-API 2.0 compliance
    - C extension for 10x faster reads than PyMySQL
    - Support for both Helios (cloud) and self-managed

  "Connection Options": |
    1. singlestoredb (official, recommended) - pip install singlestoredb
    2. PyMySQL (pure Python, slower)
    3. mysql-connector-python
    4. ODBC driver

