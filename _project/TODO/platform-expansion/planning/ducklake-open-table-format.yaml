# DuckLake Open Table Format Support
#
# Location: _project/TODO/platform-expansion/planning/ducklake-open-table-format.yaml

title: "Add DuckLake Open Table Format Support"
worktree: platform-expansion
priority: Medium-High
status: Not Started
category: Platform Expansion
description: |
  Implement DuckLake open table format support on par with existing Delta Lake
  and Iceberg implementations. DuckLake is DuckDB's native open table format
  that provides ACID transactions, time travel, and schema evolution.

  This integration follows the established pattern for open table formats in
  BenchBox, including:
  - Format converter for TBL to DuckLake conversion
  - Format capability registration with platform support matrix
  - Maintenance operations for ACID workloads
  - CLI integration for the convert command
  - Comprehensive test coverage

context_sections:
  "Background and Motivation": |
    DuckLake is an emerging open table format from the DuckDB ecosystem that
    offers several advantages:
    - Native DuckDB integration with optimal performance
    - ACID transaction support
    - Time travel and snapshot isolation
    - Schema evolution capabilities
    - Designed for analytical workloads

    Adding DuckLake support enables users to:
    - Benchmark DuckLake vs Delta Lake vs Iceberg on compatible platforms
    - Test DuckLake's native DuckDB performance advantages
    - Evaluate DuckLake for production analytical workloads

  "Technical Context": |
    BenchBox's open table format framework is built on:
    - BaseFormatConverter abstract class (benchbox/utils/format_converters/base.py)
    - FormatCapability registry (benchbox/platforms/base/format_capabilities.py)
    - Maintenance operations (benchbox/platforms/dataframe/*_maintenance.py)
    - Manifest v2 multi-format tracking

    Existing implementations to reference:
    - delta_converter.py: 190 LOC, uses deltalake library
    - iceberg_converter.py: 320 LOC, uses pyiceberg library
    - delta_lake_maintenance.py: 400+ LOC for ACID operations
    - iceberg_maintenance.py: 400+ LOC for ACID operations

    DuckLake integration will likely use the ducklake Python library and
    follow the same architectural patterns.

