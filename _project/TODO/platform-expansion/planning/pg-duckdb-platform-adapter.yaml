id: pg-duckdb-platform-adapter
title: "Add pg_duckdb Platform Adapter for DuckDB-Accelerated PostgreSQL Analytics"
worktree: platform-expansion
priority: Medium-High
status: Not Started
category: Platform Expansion
description: |
  Add a pg_duckdb platform adapter that enables benchmarking PostgreSQL with
  the pg_duckdb extension installed. pg_duckdb embeds DuckDB's vectorized
  analytical engine inside PostgreSQL, accelerating OLAP queries by up to
  1500x on certain workloads without requiring SQL changes.

  This adapter should inherit from PostgreSQLAdapter (following the TimescaleDB
  pattern) and add pg_duckdb-specific configuration: enabling the extension,
  setting GUC parameters like duckdb.force_execution, configuring thread counts
  for parallel scans, and optionally connecting to MotherDuck for hybrid queries.

  Key benchmarking scenarios:
  - pg_duckdb on regular PostgreSQL heap tables (row-oriented, DuckDB execution)
  - pg_duckdb vs vanilla PostgreSQL (same data, same queries, different engine)
  - pg_duckdb vs native DuckDB (comparing embedded vs standalone)
  - pg_duckdb with MotherDuck cloud offload (deployment mode: motherduck)

  The adapter should support TPC-H, TPC-DS, and ClickBench benchmarks, which
  are the most relevant OLAP workloads for pg_duckdb's acceleration capabilities.

context_sections:
  "Background and Motivation": |
    pg_duckdb (https://github.com/duckdb/pg_duckdb) is an open-source PostgreSQL
    extension built by DuckDB Labs and MotherDuck that embeds DuckDB's columnar
    vectorized execution engine inside PostgreSQL. It reached v1.0 production
    readiness and is now supported by managed providers (DigitalOcean, Neon,
    Supabase).

    Key capabilities:
    - Transparent query acceleration via duckdb.force_execution GUC
    - No SQL changes needed for existing queries on heap tables
    - Data lake integration (Parquet, Iceberg, Delta Lake on S3/GCS/Azure)
    - MotherDuck integration for cloud-based hybrid queries
    - Parallel table scanning with configurable thread count

    Performance characteristics:
    - Up to ~4x faster than PostgreSQL with full indexes on TPC-H
    - Up to 1500x faster on specific TPC-DS queries vs unindexed PostgreSQL
    - Row-oriented storage limits: no columnar compression benefits on heap tables
    - Best results on analytical scans, aggregations, and joins

  "Technical Context": |
    pg_duckdb connects via standard PostgreSQL wire protocol (psycopg2), so
    connection management, COPY loading, and SQL dialect are identical to
    PostgreSQL. The key differences are:

    1. Extension lifecycle: CREATE EXTENSION pg_duckdb in create_connection()
    2. GUC parameters: duckdb.force_execution, duckdb.threads_for_postgres_scan
    3. Deployment modes: self-hosted (default) and motherduck (cloud offload)
    4. MotherDuck mode: SET duckdb.motherduck_token, hybrid local+cloud queries
    5. Data lake queries: duckdb.read_parquet(), duckdb.read_csv() functions

    The adapter inherits PostgreSQLAdapter's COPY-based loading, EXPLAIN ANALYZE
    plan capture, and postgres SQL dialect. Only extension setup and GUC
    configuration need to be added.

    Design consideration: pg_duckdb conflicts with pg_mooncake (shared
    libduckdb.so). These extensions cannot coexist in the same PostgreSQL
    instance. The adapter should document this constraint.

