    - pg-duckdb
    - olap
    - duckdb
  estimated_effort: "3-4 days"
  created_date: "2026-02-14"

impact:
  business_value: |
    Enables head-to-head benchmarking of pg_duckdb against vanilla PostgreSQL,
    native DuckDB, and other OLAP platforms. This is highly relevant given
    pg_duckdb's growing adoption on managed PostgreSQL providers and its unique
    position as an in-process analytical accelerator.
  user_impact: |
    Users can benchmark pg_duckdb with a single command:
    benchbox run --platform pg-duckdb --benchmark tpch --scale 1
    And compare directly against --platform postgresql and --platform duckdb.

files_affected:
  added:
    - "benchbox/platforms/pg_duckdb.py"
    - "benchbox/core/tuning/generators/pg_duckdb.py"
    - "tests/unit/platforms/test_pg_duckdb_adapter.py"
    - "docs/platforms/pg_duckdb.md"
  modified:
    - "benchbox/core/platform_registry.py"
    - "benchbox/platforms/__init__.py"

technical_requirements:
  dependencies:
    - "psycopg2-binary>=2.9.0 (existing, shared with PostgreSQL adapter)"
    - "PostgreSQL 14+ with pg_duckdb extension installed"
  constraints:
    - "Requires pg_duckdb extension pre-installed on PostgreSQL server"
    - "Conflicts with pg_mooncake — cannot coexist in same instance"
    - "MotherDuck mode requires MOTHERDUCK_TOKEN environment variable"
    - "Thread count tuning requires superuser or pg_duckdb role"
  compatibility: |
    PostgreSQL 14-18 with pg_duckdb 1.0+. Standard psycopg2 driver — no
    additional Python dependencies. MotherDuck integration is optional.

must_preserve:
  - "PostgreSQLAdapter.load_data() COPY pipeline unchanged — pg_duckdb inherits it directly"
  - "PostgreSQLAdapter.execute_query() return format unchanged — pg_duckdb only overrides configuration"
  - "All existing PostgreSQL adapter tests pass: uv run -- python -m pytest tests/unit/platforms/test_postgresql_adapter.py -v"
  - "Platform registry autodiscovery for all existing platforms unaffected"

approach: |
  Follow the TimescaleDB pattern (benchbox/platforms/timescaledb.py) which extends
  PostgreSQLAdapter with extension-specific lifecycle hooks:

  1. Create PgDuckDBAdapter(PostgreSQLAdapter) in benchbox/platforms/pg_duckdb.py
  2. Override create_connection() to verify/install pg_duckdb extension and set GUCs
  3. Override configure_for_benchmark() to set duckdb.force_execution=true and
     thread configuration based on benchmark type (OLAP vs mixed)
  4. Add MotherDuck deployment mode with token-based authentication
  5. Register in platform_registry.py with metadata (category: "olap-accelerator",
     platform_family: "pg_duckdb", deployment_modes: self-hosted + motherduck)
  6. Add CLI config builder in __init__.py following TimescaleDB pattern

  For the DDL generator (benchbox/core/tuning/generators/pg_duckdb.py), extend
  PostgreSQLDDLGenerator. pg_duckdb works with standard PostgreSQL DDL — the
  generator mainly needs to handle index recommendations (pg_duckdb benefits
  less from B-tree indexes since it bypasses them for analytical scans).

anti_patterns:
  - "DO NOT add a new SQL dialect for pg_duckdb — because pg_duckdb uses standard PostgreSQL SQL parsed by DuckDB internally — reuse POSTGRES_DIALECT from the PostgreSQL adapter"
  - "DO NOT require pg_duckdb for the PostgreSQL adapter — because they are separate platforms — pg_duckdb adapter is its own class that happens to inherit from PostgreSQLAdapter"
  - "DO NOT try to install pg_duckdb via CREATE EXTENSION in production — because extension installation requires server admin privileges — only verify it exists and raise a clear error if missing"
  - "DO NOT add data lake query support in the initial implementation — because it requires S3/GCS credentials and Parquet file management — defer to a separate work item"

verification:
  - description: "pg_duckdb adapter module imports without error"
    command: "uv run -- python -c \"from benchbox.platforms.pg_duckdb import PgDuckDBAdapter; print('import OK')\""
    expected_output: "import OK"
  - description: "All existing platform tests still pass"
    command: "uv run -- python -m pytest tests/unit/platforms/ -v --tb=short"
    expected_output: "all tests pass, 0 failures"
  - description: "pg_duckdb unit tests pass"
    command: "uv run -- python -m pytest tests/unit/platforms/test_pg_duckdb_adapter.py -v --tb=short"
    expected_output: "all tests pass, 0 failures"
  - description: "Platform registry lists pg-duckdb"
    command: "uv run -- python -c \"from benchbox.core.platform_registry import PlatformRegistry; print('pg-duckdb' in PlatformRegistry.list_platforms())\""
    expected_output: "True"

scope_limit:
  only_modify:
    - "benchbox/platforms/pg_duckdb.py"
    - "benchbox/platforms/__init__.py"
    - "benchbox/core/platform_registry.py"
    - "benchbox/core/tuning/generators/pg_duckdb.py"
    - "tests/unit/platforms/test_pg_duckdb_adapter.py"
    - "docs/platforms/pg_duckdb.md"
  do_not_modify:
    - "benchbox/platforms/postgresql.py"
    - "benchbox/platforms/duckdb.py"
    - "benchbox/platforms/timescaledb.py"
    - "benchbox/core/runner.py"

