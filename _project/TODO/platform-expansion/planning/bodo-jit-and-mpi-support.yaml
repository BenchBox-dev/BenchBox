id: bodo-jit-and-mpi-support
title: "Add @bodo.jit Compilation and MPI Distributed Execution to Bodo Adapter"
worktree: platform-expansion
priority: Low
status: Not Started
category: Platform Expansion
description: |
  The Bodo DataFrame adapter currently uses Pandas-compatible I/O only.
  @bodo.jit is Bodo's core value proposition — auto-parallelization of Pandas
  code via JIT compilation. MPI multi-node execution is the next tier.

  Deferred from bodo-dataframe-platform (completed 2026-02-09). The initial
  adapter established the Pandas-compatible baseline; these items add the
  performance-differentiating features.

  Note: the Bodo adapter source file does not currently exist in the codebase
  (only __pycache__ artifacts remain). The adapter may need to be recreated
  or the DONE item may have been completed as research-only.

context_sections:
  "Bodo JIT Context": |
    @bodo.jit decorates Python functions to compile them with LLVM. This enables:
    - Automatic parallelization of Pandas operations
    - Native compilation (10-100x speedup on large data)
    - Type inference at compile time
    Complexity: JIT warmup time, strict type requirements, compilation caching.

  "MPI Context": |
    Bodo uses MPI (mpiexec) for multi-node execution. Requires:
    - MPI runtime (OpenMPI or MPICH)
    - Cluster configuration (hostfile, SSH keys)
    - Data partitioning strategy

