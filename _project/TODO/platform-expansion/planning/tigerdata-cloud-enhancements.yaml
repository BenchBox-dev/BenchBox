id: tigerdata-cloud-enhancements
title: "TigerData Cloud Enhancements"
worktree: platform-expansion
priority: Low
status: Not Started
category: Platform Expansion
description: |
  Follow-up enhancements for the TigerData cloud deployment mode
  (timescaledb:cloud), split from completed timescaledb-cloud-deployment.

  The core rebrand and cloud connection logic is done. These items improve
  security posture, connection flexibility, and test confidence but require
  a live TigerData account to implement and verify.

context_sections:
  "Background": |
    The timescaledb:cloud deployment mode was implemented and rebranded to
    TigerData in timescaledb-cloud-deployment (completed 2026-02-17).
    All unit-testable code paths are covered. These enhancements need
    external infrastructure (paid TigerData account) or design decisions
    (CA cert distribution) that were out of scope for the rebrand work.

  "Current State": |
    - Cloud mode works with TIGERDATA_* env vars (TIMESCALE_* fallback)
    - SSL enforced via sslmode=require
    - Service URL parsing validates postgres:// scheme
    - Direct connection mode only (port 5432 default)
    - 18 unit tests covering all code paths

metadata:
  tags:
  - platform-adapter
  - timescaledb
  - tigerdata
  - cloud
  - enhancements
  estimated_effort: "1-2 days"
  created_date: "2026-02-17"
