id: clickhouse-tpchavoc-q6-decimal-bug
title: "Fix ClickHouse QueryTransformer stripping leading zeros from decimal literals (tpchavoc Q6)"
worktree: platform-expansion
category: Core Functionality
priority: Medium-High
status: Not Started
description: |
  tpchavoc Q6 fails on ClickHouse with syntax error on ".06 - 0.01" — the source
  in benchbox/core/tpchavoc/variant_sets/q06.py contains "0.06" (with leading zero),
  but a query transformation step strips the leading zero, producing ".06" which is
  invalid ClickHouse syntax.

  This is a bug in the SQL transformation pipeline, not the query file itself.
  The ClickHouse QueryTransformer class needs investigation for numeric literal handling.

  Q5 and Q13 failures in tpchavoc are covered by other TODOs (join memory tuning
  and timeout respectively).

work:
  - id: w1
    summary: "Find the ClickHouse QueryTransformer code that handles numeric literals — grep for decimal/numeric transformation logic"
    status: pending

  - id: w2
    summary: "Fix the leading-zero stripping bug in the transformer"
    needs: [w1]
    status: pending

  - id: w3
    summary: "Add unit test with decimal literals like 0.06 to prevent regression"
    needs: [w2]
    status: pending

files_affected:
  modified:
    - "benchbox/platforms/clickhouse/query_transformer.py"
    - "benchbox/platforms/clickhouse/adapter.py"

must_preserve:
  - "Other numeric literal transformations continue to work correctly"
  - "Queries that don't use small decimals remain unaffected"

anti_patterns:
  - "DO NOT strip leading zeros from decimal literals — because ClickHouse rejects bare '.06' as invalid syntax — preserve '0.06' form"
  - "DO NOT apply numeric normalization that changes the string representation of valid SQL literals — because downstream engines may have strict parsing — only transform function names and syntax"

approach: |
  Search the ClickHouse adapter for QueryTransformer or query rewriting logic.
  The bug likely involves a regex or string replacement that inadvertently strips
  leading zeros from decimal numbers like 0.06 → .06. Check query_transformer.py
  first, then adapter.py for any pre-execution SQL munging.

verification:
  - description: "Decimal literal 0.06 preserved through transformation"
    command: "uv run -- python -m pytest tests/ -v -k 'clickhouse and (transform or decimal)'"
    expected_output: "Tests pass confirming 0.06 is not stripped to .06"

