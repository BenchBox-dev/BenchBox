must_preserve:
- "All existing platform adapter tests pass: uv run -- python -m pytest tests/unit/platforms/ -v --tb=short"
- "Platform registry autodiscovery continues working for all existing platforms"
- "DuckDB adapter behavior unchanged when SiriusDB extension is not loaded"

anti_patterns:
- "DO NOT modify existing adapter files - because SiriusDB is additive - create a new siriusdb.py file"
- "DO NOT require GPU for unit tests - because CI has no GPU hardware - mock GPU initialization and test CPU fallback path"
- "DO NOT modify benchbox/platforms/duckdb.py - because SiriusDB extends DuckDB via extension loading - inherit from DuckDBAdapter
  and override only GPU-specific methods"

verification:
- description: "New adapter imports correctly"
  command: "uv run -- python -c \"from benchbox.platforms.siriusdb import SiriusDBAdapter; print('import OK')\""
  expected_output: "import OK"
- description: "Unit tests pass"
  command: "uv run -- python -m pytest tests/unit/platforms/test_siriusdb.py -v --tb=short"
  expected_output: "all tests pass, 0 failures"
- description: "Existing platform tests unaffected"
  command: "uv run -- python -m pytest tests/unit/platforms/ -v --tb=short"
  expected_output: "all tests pass, 0 failures"
- description: "DuckDB adapter unaffected"
  command: "uv run -- python -m pytest tests/unit/platforms/test_duckdb_adapter.py -v --tb=short"
  expected_output: "all tests pass, 0 failures"

scope_limit:
  only_modify:
  - "benchbox/platforms/siriusdb.py"
  - "tests/unit/platforms/test_siriusdb.py"
  do_not_modify:
  - "benchbox/platforms/duckdb.py"
  - "benchbox/core/runner.py"

