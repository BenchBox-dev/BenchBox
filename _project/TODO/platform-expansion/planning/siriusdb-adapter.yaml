title: "Add SiriusDB (GPU-Native SQL Engine) Platform Adapter"
worktree: platform-expansion
priority: Medium
status: Not Started
category: Platform Expansion
description: |
  Add support for SiriusDB, a GPU-native SQL engine that accelerates analytical queries
  by offloading execution to graphics processors via DuckDB integration.

  SiriusDB is notable for:
  - 10x faster than DuckDB, 60x faster than ClickHouse at same hardware cost
  - Integrates with DuckDB via Substrait query format
  - Built on NVIDIA CUDA-X libraries (cuDF)
  - Plug-and-play with CPU fallback when GPU unavailable
  - Ideal for TPC benchmark acceleration

  Reference: https://www.sirius-db.com, https://github.com/sirius-db/sirius

context_sections:
  "Technical Background": |
    SiriusDB works as a DuckDB extension that offloads query execution to GPU:
    1. Load sirius.duckdb_extension into DuckDB
    2. Initialize GPU buffer: gpu_buffer_init('1 GB', '2 GB')
    3. Execute queries - Sirius intercepts and runs on GPU
    4. Falls back to CPU for unsupported operations

    Python usage:
    ```python
    import duckdb
    con = duckdb.connect('database.duckdb', config={"allow_unsigned_extensions": "true"})
    con.execute("load '/path/to/sirius.duckdb_extension'")
    con.execute("call gpu_buffer_init('1 GB', '2 GB')")
    ```

  "Hardware Requirements": |
    - NVIDIA Volta or newer GPU (compute capability 7.0+)
    - CUDA 11.2+
    - Ubuntu 20.04+
    - Sufficient GPU memory for data and intermediate results

  "Benchmark Performance": |
    On TPC-H SF 100:
    - 10x faster than DuckDB
    - 60x faster than ClickHouse
    - At equivalent hardware rental cost

