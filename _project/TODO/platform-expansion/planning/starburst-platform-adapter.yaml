files_affected:
  modified:
    - "benchbox/core/platform_registry.py"
    - "benchbox/platforms/__init__.py"
  added:
    - "benchbox/platforms/starburst.py"
    - "benchbox/platforms/credentials/starburst.py"
  removed: []

dependencies:
  related:
    - "_project/DONE/platform-expansion/active/deployment-factory-integration.yaml"
    - "_project/DONE/platform-expansion/active/deployment-config-inheritance.yaml"

technical_requirements:
  dependencies:
    - "trino-python-client (existing)"
  constraints:
    - "Requires Starburst Galaxy account for testing"
    - "OAuth authentication for Galaxy"

must_preserve:
  - "All existing platform adapter tests pass: uv run -- python -m pytest tests/unit/platforms/ -v --tb=short"
  - "Platform registry autodiscovery continues working for all existing platforms"
  - "Existing Trino adapter unchanged"

anti_patterns:
  - "DO NOT modify existing adapter files — because Starburst is additive — create a new starburst.py file"
  - "DO NOT duplicate Trino query logic — because Starburst IS Trino with managed features — inherit and only override authentication and catalog handling"
  - "DO NOT add trino-python-client as a new dependency — because it is already an existing dependency — reuse the existing installation"

verification:
  - description: "New adapter imports correctly"
    command: "uv run -- python -c \"from benchbox.platforms.starburst import StarburstAdapter; print('import OK')\""
    expected_output: "import OK"
  - description: "Unit tests pass"
    command: "uv run -- python -m pytest tests/unit/platforms/test_starburst.py -v --tb=short"
    expected_output: "all tests pass, 0 failures"
  - description: "Existing platform tests unaffected"
    command: "uv run -- python -m pytest tests/unit/platforms/ -v --tb=short"
    expected_output: "all tests pass, 0 failures"
  - description: "Trino adapter unaffected"
    command: "uv run -- python -m pytest tests/unit/platforms/test_trino_adapter.py -v --tb=short"
    expected_output: "all tests pass, 0 failures"

scope_limit:
  only_modify:
    - "benchbox/platforms/starburst.py"
    - "benchbox/platforms/credentials/starburst.py"
    - "tests/unit/platforms/test_starburst.py"
  do_not_modify:
    - "benchbox/platforms/trino.py"
    - "benchbox/platforms/duckdb.py"
    - "benchbox/core/runner.py"

success_metrics:
  - "Starburst adapter passes connection test"
  - "TPC-H benchmark runs successfully at scale 1"
  - "Results are comparable with vanilla Trino"
  - "OAuth authentication works for Galaxy"
  - "Error messages are actionable"

open_questions:
