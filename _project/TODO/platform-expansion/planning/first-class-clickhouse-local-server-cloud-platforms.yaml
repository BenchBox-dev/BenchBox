  estimated_effort: "4-6 days"
  created_date: "2026-04-11"

impact:
  business_value: |
    Makes the ClickHouse product story legible. Users can reason about local
    embedded benchmarking, real self-hosted server benchmarking, and managed
    cloud benchmarking without guessing which driver or infrastructure path a
    single overloaded `clickhouse` name actually means.
  user_impact: |
    Users get explicit platform names, correct install guidance, and real local
    server validation. Docker users and self-hosted users will target
    `clickhouse-server` directly instead of relying on ambiguous defaults.
  technical_debt: |
    Removes one of the repo's messiest platform boundary leaks: mixed client
    contracts, mixed dependency stories, and mixed reporting labels hiding under
    one platform name.

