open_questions:
  - "Should bare `clickhouse` resolve to `clickhouse-server`, emit a hard error, or remain a deprecation alias only in specific CLI/config surfaces?"
  - "Should the split introduce two thin top-level adapter modules (`clickhouse_local.py` and `clickhouse_server.py`) or keep registration pointed at wrapper classes inside the existing `benchbox/platforms/clickhouse/` package?"
  - "Should product docs become three separate ClickHouse pages (`clickhouse-local`, `clickhouse-server`, `clickhouse-cloud`) or one family page plus dedicated local/server/cloud sub-guides?"
