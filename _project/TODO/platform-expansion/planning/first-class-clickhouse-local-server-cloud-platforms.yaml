    command: "uv run -- python -m pytest tests/unit/core/test_platform_registry.py tests/unit/core/test_platform_registration_alignment.py tests/unit/platforms/test_adapter_factory_deployment.py tests/unit/cli/test_platform.py tests/unit/cli/test_platform_setup_ux.py -q"
    expected_output: "All targeted registry and CLI tests pass with the new ClickHouse platform names"
  - description: "ClickHouse adapter and platform-info tests pass after the local/server split and connection-contract cleanup"
    command: "uv run -- python -m pytest tests/unit/platforms/test_clickhouse_adapter.py tests/unit/platforms/test_clickhouse_deployment_mode.py tests/unit/platforms/test_platform_info.py tests/unit/platforms/test_clickhouse_cloud_coverage.py -q"
    expected_output: "All targeted ClickHouse unit tests pass with no regressions in local, server, or cloud paths"
  - description: "Legacy selectors, deprecation warnings, and compatibility guidance are explicit instead of silently preserving old naming drift"
    command: "uv run -- python -m pytest tests/unit/platforms/test_clickhouse_deployment_mode.py tests/unit/platforms/test_clickhouse_diagnostics.py tests/unit/cli/test_example_argument_parser.py tests/unit/cli/test_platform.py -q"
    expected_output: "Legacy `clickhouse`, `clickhouse:local/server`, and old `mode`/`embedded` inputs are either supported via explicit deprecation behavior or fail with clear migration guidance"
  - description: "Historical config payloads and result/platform labels remain readable during the migration window"
    command: "uv run -- python -m pytest tests/unit/core/results/test_platform_info.py tests/unit/platforms/test_platform_info.py tests/unit/core/test_platform_registration_alignment.py -q"
    expected_output: "Historical ClickHouse labels and config payloads remain readable while canonical writes and reporting use the new platform names"
  - description: "Embedded ClickHouse benchmark slices still pass under the new `clickhouse-local` identity"
    command: "uv run -- python -m pytest tests/integration/test_clickhouse_local_cross_platform.py tests/integration/test_ssb_clickhouse_integration.py -q"
    expected_output: "Local chDB integration tests pass when chdb is installed"
  - description: "Real ClickHouse server Docker tests validate schema creation, data loading, representative query execution, and platform-info capture via `clickhouse-server`"
    command: "make test-docker-clickhouse"
    expected_output: "Docker-backed ClickHouse tests pass against a real server with more than trivial connectivity checks"
  - description: "A migration note documents the canonical names, accepted legacy selectors, deprecation messaging, and the alias-removal follow-up"
    command: "rg -n -- 'clickhouse-local|clickhouse-server|clickhouse-cloud|deprecated|compatibility alias|legacy selector' README.md docs/platforms/"
    expected_output: "README/docs contain one clear migration note or table covering canonical names, accepted legacy selectors, and the alias-removal follow-up"
  - description: "Product docs no longer teach bare `clickhouse` or `clickhouse:local/server` as the canonical public selectors"
    command: "rg -n -- 'clickhouse:local|clickhouse:server|--platform clickhouse\\b' README.md docs/ benchbox/cli/"
    expected_output: "No primary docs or CLI help examples present bare `clickhouse` or colon deployment syntax as the canonical selector; any remaining matches are migration notes only"

