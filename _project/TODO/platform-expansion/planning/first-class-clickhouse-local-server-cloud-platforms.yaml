id: first-class-clickhouse-local-server-cloud-platforms
title: "Split ClickHouse into first-class clickhouse-local, clickhouse-server, and clickhouse-cloud platforms"
worktree: platform-expansion
category: Core Functionality
priority: High
status: Not Started
deps:
  needs:
  - migrate-clickhouse-firebolt-deployment
  - standardize-clickhouse-deployment-mode-contract
description: |
  BenchBox currently treats ClickHouse as one base platform with mixed local/server
  behavior, while ClickHouse Cloud is already a separate first-class platform. That
  design leaves the public contract and the implementation boundary out of sync:

  - `clickhouse` defaults to chDB local execution, but multiple registry/install
    surfaces still present it as the `clickhouse-driver` platform
  - local and server execution use materially different client contracts, yet they
    are forced through one adapter boundary
  - result, dependency, and CLI surfaces partially collapse `clickhouse` and `chdb`
    while other code already treats `chdb` as a distinct label
  - the real ClickHouse Docker path exists, but its tests only validate connectivity
    and trivial query execution rather than benchmark-level schema/load/query behavior

  The new public naming contract must be three first-class platform identifiers:

  - `clickhouse-local` — chDB embedded/in-process ClickHouse
  - `clickhouse-server` — Docker-backed or self-hosted remote ClickHouse via `clickhouse-driver`
  - `clickhouse-cloud` — managed ClickHouse Cloud via `clickhouse-connect`

  Under this contract, bare `clickhouse` is no longer the canonical server-facing
  name. If it remains temporarily accepted, it must be a compatibility alias with
  explicit deprecation behavior rather than the primary documented selector.

  This work turns the naming split into a real architectural split. It should create
  clear platform registration, dependency, packaging, testing, and documentation
  boundaries while preserving shared ClickHouse SQL/tuning/workload logic underneath.

  This TODO builds on the compatibility groundwork from
  `standardize-clickhouse-deployment-mode-contract`, but it supersedes that item's
  remaining docs/help/test cleanup. The end-state is not "keep
  `clickhouse:local/server` but make it cleaner"; the end-state is explicit
  first-class platform names with legacy selectors handled only as migration
  compatibility inputs.

context_sections:
  "Research Findings": |
    Code review found three structural problems that argue for first-class platform
    names instead of a single mixed `clickhouse` platform:

    1. `benchbox/platforms/clickhouse/metadata.py` expects `connection.query()` for
       local mode and `connection.cursor()` for server mode, but the actual local and
       server clients created by the adapter expose `execute()` instead. The single
       adapter boundary is masking incompatible APIs.

    2. `benchbox/core/platform_registry.py`, `benchbox/platforms/base/adapter.py`,
       `pyproject.toml`, README install guidance, and E2E platform detection still
       model `clickhouse` primarily around `clickhouse-driver`, even though the
       default deployment is local chDB.

    3. chDB already leaks into internal labels such as DDL generator routing and cost
       categorization, which means the codebase already wants a distinct local
       identity even though platform registration never completed that split.

  "Implementation Goal": |
    Replace the mixed base-platform story with three explicit first-class platform
    names and make Docker-backed ClickHouse server validation part of the required
    acceptance criteria, not an optional follow-up.

  "Relationship To Existing TODOs": |
    Treat `standardize-clickhouse-deployment-mode-contract` as completed
    compatibility groundwork, not the final public contract. Its completed work
    units provide the deployment normalizer and adapter/config cleanup this item
    can reuse, while its remaining docs/help/test work is superseded here because
    it still assumes `clickhouse:local/server` remains the primary UX.

work:
  - id: w1
    summary: "Publish the migration contract so `clickhouse-local`, `clickhouse-server`, and `clickhouse-cloud` are canonical and bare `clickhouse` is compatibility-only"
    status: pending
    notes: |
      Inventory every surface that currently exposes `clickhouse`, `clickhouse:local`,
      `clickhouse:server`, `mode=local`, or `embedded`. Encode one explicit
      migration decision before touching code: bare `clickhouse` remains accepted
      only as a deprecating compatibility alias, with documented scope and
      removal follow-up.

  - id: w2
    summary: "Register `clickhouse-local` as a first-class platform in registry, lazy imports, and platform-listing surfaces"
    needs: [w1]
    status: pending
    notes: |
      Local chDB needs its own public identity instead of leaking through mixed
      `clickhouse` naming or internal `chdb` labels.

  - id: w3
    summary: "Register `clickhouse-server` as a first-class platform in registry, lazy imports, and platform-listing surfaces"
    needs: [w1]
    status: pending
    notes: |
      Server ClickHouse must stop inheriting the canonical public name from the
      mixed base platform. Capability metadata, availability checks, and family
      relationships should make the server identity explicit.

  - id: w4
    summary: "Wire adapter factory, platform defaults, and CLI selector resolution so the new names are canonical and legacy selectors route through compatibility handling"
    needs: [w2, w3]
    status: pending
    notes: |
      Registration alone is not enough. The runtime entry points must default to
      `clickhouse-local` or `clickhouse-server` explicitly, while old selectors
      either warn-and-map or fail with clear migration guidance.

  - id: w5
    summary: "Refactor the ClickHouse runtime boundary into explicit local/server wrappers over shared internals and fix mode-specific connection/metadata contracts"
    needs: [w4]
    status: pending
    notes: |
      Shared SQL transformation, workload, and tuning code can stay shared, but the
      public adapter/client contract must stop pretending chDB and clickhouse-driver
      are interchangeable. Fix metadata/version capture and connection handling as
      part of this split.

  - id: w6
    summary: "Align dependency/install, cost, DDL, result-label, and database naming surfaces that still conflate `clickhouse` and chDB"
    needs: [w4, w5]
    status: pending
    notes: |
      This includes dependency validation, install guidance, CLI database detection,
      cost categorization, DDL generator aliases, result/reporting labels, and any
      path or database naming helpers that assume one mixed ClickHouse identity.

  - id: w7
    summary: "Rewrite CLI help, README, and platform docs to teach the explicit platform names and ship one migration note/deprecation table"
    needs: [w1, w4, w6]
    status: pending
    notes: |
      Product docs must stop teaching base `clickhouse`, auto-detect wording, or
      old deployment-mode syntax as the primary path. The migration note should
      define accepted legacy selectors, deprecation messaging, and the planned
      alias-removal follow-up.

  - id: w8
    summary: "Add compatibility coverage for legacy selectors, deprecation warnings, and historical config/result readability"
    needs: [w1, w4, w6]
    status: pending
    notes: |
      If aliases are kept temporarily, test them explicitly and emit deprecation
      messaging. Historical result artifacts and config files should remain readable
      during the migration window.

  - id: w9
    summary: "Upgrade `clickhouse-server` Docker validation from connectivity smoke to a real benchmark slice with schema/load/query/platform-info assertions"
    needs: [w5, w6]
    status: pending
    notes: |
      Existing Docker tests only prove connectivity. Acceptance for this item
      requires a real ClickHouse server path test that catches contract drift
      between `clickhouse-server` and `clickhouse-local`.

  - id: w10
    summary: "Run targeted verification, retire overlapping ClickHouse naming TODOs, and leave only post-deprecation alias removal as follow-up"
    needs: [w7, w8, w9]
    status: pending
    notes: |
      Close or supersede overlapping ClickHouse naming TODOs once the new platform
      split is in place so the backlog reflects the new contract rather than the
      old deployment-mode framing.

deferred:
  - summary: "Remove temporary `clickhouse` compatibility aliases entirely after one deprecation window"
    reason: "Existing configs, docs links, and historical habits may still rely on bare `clickhouse`; the first pass should migrate reads and messaging before hard removal"
  - summary: "Backfill or rewrite historical result artifacts so old `clickhouse` labels are normalized to new platform names in archived datasets"
    reason: "Runtime read compatibility matters immediately; bulk artifact migration can follow once the live platform contract is stable"

