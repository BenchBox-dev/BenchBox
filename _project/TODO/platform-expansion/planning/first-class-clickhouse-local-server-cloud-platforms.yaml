open_questions:
  - "How long should bare `clickhouse` remain accepted after deprecation messaging lands, and should that window be release-count-based or date-based?"
  - "Should the split introduce two thin top-level adapter modules (`clickhouse_local.py` and `clickhouse_server.py`) or keep registration pointed at wrapper classes inside the existing `benchbox/platforms/clickhouse/` package?"
  - "Should product docs become three separate ClickHouse pages (`clickhouse-local`, `clickhouse-server`, `clickhouse-cloud`) or one family page plus a dedicated migration note and local/server/cloud sub-guides?"
