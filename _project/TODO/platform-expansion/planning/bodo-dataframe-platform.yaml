open_questions:
  - "Which Bodo edition to target — community (free) or enterprise? Community edition may have scale or feature limitations."
  - "Should the adapter support @bodo.jit compilation of query functions, or only use Bodo's Pandas-compatible I/O? JIT compilation adds complexity but is Bodo's main value proposition."
  - "How to handle MPI initialization in the adapter — should the adapter manage mpi4py setup, or require the user to launch with mpiexec?"
