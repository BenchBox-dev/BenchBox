id: bodo-dataframe-platform
title: "Bodo DataFrame Platform Adapter"
worktree: platform-expansion
priority: Medium
status: Not Started
category: Platform Expansion
description: |
  Implement Bodo as a new DataFrame platform adapter in the Pandas family.
  Bodo is a high-performance computing engine that provides automatic
  parallelization and optimization of Python/Pandas code using Numba JIT
  compilation. It enables distributed execution of Pandas workloads across
  multiple cores and nodes without requiring code changes.

  The adapter should extend PandasFamilyAdapter, following the same pattern
  used by Modin, Dask, and cuDF adapters. Since Bodo provides a Pandas-compatible
  API, the majority of functionality is inherited from the base class, with
  overrides needed primarily for I/O operations and distributed initialization.

context_sections:
  "Background and Motivation": |
    Bodo represents a distinct approach to DataFrame acceleration:
    - Compiles Pandas code to optimized MPI-parallel binaries via Numba
    - Achieves near-native performance without API changes
    - Targets HPC-style parallelism (multi-core, multi-node)
    - Useful benchmark comparison point against Polars, Dask, and Modin

    Adding Bodo enables users to compare JIT-compiled Pandas performance
    against other parallelization strategies (Ray/Modin, task graphs/Dask,
    Rust-native/Polars) on identical benchmark workloads.

  "Technical Context": |
    Bodo uses a decorator-based JIT compilation model:
    - Functions decorated with @bodo.jit are compiled and parallelized
    - Pandas I/O functions (read_csv, read_parquet) are intercepted for
      distributed reads
    - Data is automatically partitioned across MPI ranks
    - Results are gathered on rank 0 for output

    Key differences from plain Pandas:
    - I/O must go through Bodo-aware functions for parallelism
    - Not all Pandas operations are supported (subset coverage)
    - Requires MPI runtime (mpi4py) for multi-process execution
    - Type inference happens at compile time (stricter than Pandas)

work:
  - id: w1
    summary: "Create BodoDataFrameAdapter in benchbox/platforms/dataframe/bodo_df.py"
    status: pending
    notes: >
      Extend PandasFamilyAdapter. Override read_csv and read_parquet with
      Bodo-compatible implementations. Implement platform_name, get_platform_info,
      and BODO_AVAILABLE flag. Handle Bodo-specific type conversions and limitations.
      Use modin_df.py as the closest reference implementation.

  - id: w2
    summary: "Register Bodo in adapter_factory, platform_registry, and platform_checker"
    needs: [w1]
    status: pending
    notes: >
      Add to dataframe __init__.py exports, adapter_factory.py mapping,
      platform_registry.py metadata, and platform_checker.py DATAFRAME_PLATFORMS.

  - id: w3
    summary: "Create unit tests in tests/unit/platforms/dataframe/test_bodo_df.py"
    needs: [w1]
    status: pending
    notes: >
      Test import availability check, adapter instantiation (mocked),
      data loading methods (mocked), platform info and metadata.
      Verify existing dataframe tests still pass.

  - id: w4
    summary: "Create platform spec documentation in _project/specs/platforms/bodo.md"
    needs: [w1, w2, w3]
    status: pending
    notes: "Document Bodo-specific requirements, limitations, and usage."

deferred:
  - summary: "@bodo.jit compilation of query functions"
    reason: >
      JIT compilation is Bodo's main value proposition but adds significant complexity.
      Start with Bodo's Pandas-compatible I/O only; add JIT support as a follow-up
      once the basic adapter is validated.
  - summary: "MPI multi-node distributed execution"
    reason: >
      Multi-node execution requires mpiexec launch and cluster setup.
      Initial adapter targets single-node multi-core parallelism only.

