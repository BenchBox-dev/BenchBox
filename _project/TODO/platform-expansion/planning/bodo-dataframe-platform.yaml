  modified:
    - "benchbox/platforms/dataframe/__init__.py"
    - "benchbox/platforms/adapter_factory.py"
    - "benchbox/core/platform_registry.py"
    - "benchbox/platforms/dataframe/platform_checker.py"
  added:
    - "benchbox/platforms/dataframe/bodo_df.py"
    - "tests/unit/platforms/dataframe/test_bodo_df.py"
    - "_project/specs/platforms/bodo.md"
  removed: []

must_preserve:
  - "PandasFamilyAdapter base class interface and all existing method signatures unchanged"
  - "Existing Pandas-family adapters (pandas_df, modin_df, dask_df, cudf_df, fireducks_df) continue to pass their test suites"
  - "adapter_factory.py mapping for existing platforms returns same adapter classes"
  - "Platform registry backward compatible with existing platform names"

approach: |
  Follow the pattern established by ModinDataFrameAdapter in
  benchbox/platforms/dataframe/modin_df.py (~500 lines). These are thin
  adapters that:
  1. Extend PandasFamilyAdapter with platform-specific I/O overrides
  2. Use try/except import for availability detection (BODO_AVAILABLE flag)
  3. Override read_csv, read_parquet, to_datetime, and timedelta_days
  4. Inherit all query execution, aggregation, and validation from the base class

  Start with modin_df.py as the closest reference since Modin also provides
  a Pandas-compatible API with a different execution backend.

anti_patterns:
  - "DO NOT modify PandasFamilyAdapter — because Bodo is just another consumer of the base class — keep all Bodo-specific code in bodo_df.py"
  - "DO NOT require Bodo installation for unit tests — because Bodo has heavy dependencies (MPI, Numba) not available in CI — mock bodo imports in tests"
  - "DO NOT add @bodo.jit decorators directly in adapter methods — because the adapter must work with or without JIT — handle JIT compilation optionally"
  - "DO NOT add bodo as a required project dependency — because it is an optional platform — use conditional imports with BODO_AVAILABLE flag"

verification:
  - description: "Bodo adapter imports correctly when bodo is available"
    command: "uv run -- python -c \"from benchbox.platforms.dataframe.bodo_df import BodoDataFrameAdapter; print('import OK')\""
    expected_output: "import OK (or ImportError if bodo not installed)"
  - description: "Bodo recognized as a DataFrame platform"
    command: "uv run -- python -c \"from benchbox.platforms import is_dataframe_platform; print(is_dataframe_platform('bodo-df'))\""
    expected_output: "True"
  - description: "Bodo appears in available platform list"
    command: "uv run -- python -c \"from benchbox.platforms import list_available_dataframe_platforms; print('bodo-df' in list_available_dataframe_platforms())\""
    expected_output: "True"
  - description: "Unit tests pass"
    command: "uv run -- python -m pytest tests/unit/platforms/dataframe/test_bodo_df.py -v --tb=short"
    expected_output: "all tests pass, 0 failures"
  - description: "Existing dataframe tests unaffected"
    command: "uv run -- python -m pytest tests/unit/platforms/dataframe/ -v --tb=short"
    expected_output: "all tests pass, 0 failures"

