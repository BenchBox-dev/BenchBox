context_sections:
  "LakeSail Sail Architecture": |
    LakeSail Sail is a Rust-based Spark replacement built on DataFusion:

    Client Side:
    - Standard PySpark client connects via Spark Connect protocol
    - No client-side code changes required from existing Spark applications

    Server Side:
    - Sail server implements Spark Connect protocol
    - Translates DataFrame/SQL operations to DataFusion logical plans
    - DataFusion optimizer produces optimized physical plans
    - Execution on Rust workers (single-host or distributed)

    Execution Modes:
    - Local: Multi-threaded runtime on single host
    - Distributed: Cluster of Rust workers for scale-out

  "Performance Claims (TPC-H SF100)": |
    LakeSail published TPC-H SF100 benchmarks showing:
    - ~4x faster execution across 22 queries vs Apache Spark
    - 94% lower hardware costs (AWS r8g.4xlarge instances)
    - Significantly lower peak memory usage
    - Zero shuffle spill during execution

    These claims should be validated with BenchBox benchmarking at various
    scale factors to provide independent verification.

  "Spark Connect Protocol": |
    Spark Connect (introduced in Spark 3.4) decouples client from server:
    - Client sends logical plans to server via gRPC
    - Server executes and returns results
    - Enables language-agnostic clients and pluggable servers

    Sail implements the server side, accepting standard PySpark client
    connections. This means:
    - No special client library needed
    - Existing PySpark code works unchanged
    - Can compare same code on Spark vs Sail

  "Implementation Strategy": |
    Recommended approach leverages existing patterns:

    1. Start with spark.py as reference (SQL mode)
    2. Modify connection to target Sail server endpoint
    3. Reuse most query execution logic (Spark Connect handles details)
    4. Add Sail-specific configuration options

    For DataFrame mode:
    1. Start with pyspark_df.py as reference
    2. Same expression API works (PySpark Column/DataFrame)
    3. Add Sail server connection configuration

    Key difference from standard Spark adapters:
    - Connection goes to Sail server, not SparkSession.builder
    - May need specific Spark Connect configuration for Sail endpoint

  "Comparison with Existing Spark Platforms": |
    BenchBox already supports several Spark-based platforms:

    | Platform | Type | Connection |
    |----------|------|------------|
    | spark.py | SQL | Direct SparkSession |
    | pyspark/ | SQL | SparkSessionManager |
    | pyspark_df.py | DataFrame | SparkSessionManager |
    | databricks | SQL | Databricks Connect |
    | **lakesail** | SQL + DataFrame | Spark Connect to Sail |

    LakeSail uses Spark Connect like Databricks Connect, but targets
    the Sail server instead of Databricks runtime.
