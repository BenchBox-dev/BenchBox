approach: |
  Follow the LakeSail adapter as the structural template, and the
  Apache Spark adapter for local-mode session construction. Concretely:

    1. New file benchbox/platforms/velox.py defines VeloxAdapter
       inheriting (SparkDataLoadMixin, SparkQueryExecutionMixin,
       PlatformAdapter), mirroring LakeSail's class layout.

    2. Two deployment modes via a `deployment` config field:
         - "local":   builds a SparkSession (classic or Spark-Connect via
                      pysail-style in-process server is NOT applicable
                      here; use pyspark.sql.SparkSession.builder.master
                      'local[*]'). Adds Gluten jar to spark.jars and
                      classpath, sets plugin + off-heap + columnar shuffle.
         - "remote":  treats the endpoint as a pre-configured Spark-Connect
                      server (mirror LakeSail _parse_endpoint / _is_server
                      _reachable). Does NOT auto-start a server.

    3. Config knobs (CLI + --platform-option):
         deployment        = local | remote          (default local)
         endpoint          = sc://host:port          (remote only)
         gluten_jar_path   = /abs/path/to/bundle.jar (local only; required)
         gluten_version    = 1.4.0                    (informational; surfaced in platform_info)
         offheap_size      = 8g                       (default conservative)
         shuffle_partitions, adaptive_enabled, driver_memory, app_name,
         table_format, spark_config, disable_cache     (identical to LakeSail)

    4. `_get_spark_conf()` merges LakeSail-style base conf with Gluten-
       mandatory keys; in remote mode the conf is advisory (the server
       already has it — send only what Spark-Connect respects).

    5. `_create_spark_session()`:
         - local:  SparkSession.builder.master('local[*]')
                     .config('spark.plugins', 'org.apache.gluten.GlutenPlugin')
                     .config('spark.jars', gluten_jar_path)
                     .config('spark.driver.extraClassPath', gluten_jar_path)
                     .config('spark.executor.extraClassPath', gluten_jar_path)
                     .config('spark.memory.offHeap.enabled', 'true')
                     .config('spark.memory.offHeap.size', offheap_size)
                     .config('spark.shuffle.manager',
                             'org.apache.spark.shuffle.sort.ColumnarShuffleManager')
                     .getOrCreate()
         - remote: SparkSession.builder.remote(endpoint) + conf overlay.

    6. `get_platform_info()` reports: deployment mode, gluten_version,
       gluten_jar_path (redacted), offheap_size, Spark version, PySpark
       version, and (best-effort) backend fingerprint:
         - EXPLAIN a trivial query, look for 'VeloxColumnar' nodes to
           confirm Velox is actually active; store `velox_active: bool`.

    7. Query plan capture (`get_query_plan`) uses EXPLAIN EXTENDED (as
       LakeSail does) and additionally greps for Velox columnar nodes so
       the get_query_plan MCP tool can show native-vs-fallback.

    8. Fallback telemetry (stretch, in w-series): hook into Spark logs
       or Gluten metrics (SparkListener) to count JVM-fallback
       operators per query and attach to BenchmarkResults query metadata.

    9. Dependency + registry wiring (four touchpoints, mirroring LakeSail):
         - pyproject.toml extra "velox" pins pyspark==3.5.x (matching the
           bundle jar); the jar itself is NOT packaged.
         - utils/dependencies.py adds DependencyInfo("velox", ...) with
           packages=["pyspark"] and an extra `external_artifacts` note
           pointing to docs/platforms/velox_jar_setup.md.
         - platforms/__init__.py: register "VeloxAdapter" in the lazy
           adapter map (mirroring the "LakeSailAdapter" entry at line 89),
           add "velox" (and optional "gluten-velox") to the platform-name
           lookup, add availability constant entry for
           list_available_platforms().
         - platforms/adapter_factory.py: register the Velox dispatch entry
           so get_platform_adapter("velox", **config) resolves.
         - At the bottom of velox.py, define `_build_velox_config` and
           call PlatformHookRegistry.register_config_builder("velox", ...)
           exactly as LakeSail does (credential loading, driver_package
           = "pyspark", platform_fields listing Velox-specific knobs).

   10. Jar provisioning helper (small utility in benchbox/platforms/velox
       or a scripts/ helper): given gluten_version + spark_version + arch,
       prints the canonical jar URL (Apache dist mirror) and checksum.
       Do NOT auto-download during benchmark runs (supply-chain risk);
       provide an opt-in `benchbox fetch-velox-jar` CLI later if demanded.

   11. Validation strategy for first PR: run TPC-H Q1, Q6, Q3, Q9 at
       SF 0.01 under local mode with a prebuilt 1.4.0 jar on a Linux
       container, assert 'VeloxColumnar' nodes appear in EXPLAIN for
       at least Q1/Q6. This becomes the single live_integration test;
       all other tests use mocked pyspark like existing LakeSail tests.

anti_patterns:
- "DO NOT auto-download the Gluten bundle jar inside the adapter — because
  silent network fetches during benchmark runs are a supply-chain and
  reproducibility hazard — require the user to supply `gluten_jar_path`
  (or pre-stage via an explicit, documented CLI command)."
- "DO NOT subclass LakeSailAdapter or SparkAdapter — because Velox is a
  distinct deployment shape with required conf that would leak into those
  adapters if inherited — create a new VeloxAdapter that reuses the Spark
  mixins directly, following the LakeSail file as a structural template."
- "DO NOT silently omit spark.shuffle.manager=ColumnarShuffleManager —
  because forgetting it forfeits most of the Velox shuffle speedup and
  produces misleading benchmark numbers — fail fast with a clear error if
  the user overrides it to a non-columnar value while deployment=local."
- "DO NOT require Velox jar for unit tests — because CI runners don't have
  the ~150MB native bundle and may not be Linux — mock SparkSession and
  gate live integration tests behind the `live_integration` + Linux markers."
- "DO NOT edit benchbox/platforms/lakesail.py or benchbox/platforms/spark.py
  — because Velox is additive and those adapters must remain byte-identical
  to avoid regressing existing benchmarks — all new code lives in velox.py
  and the small registration deltas in __init__.py / dependencies.py."
- "DO NOT pin pyspark to a version outside the Gluten-supported set
  (3.2.2 / 3.3.1 / 3.4.4 / 3.5.5 as of 1.4.x) — because the native bundle
  is ABI-coupled to the Spark minor version — expose `gluten_version` and
  validate pyspark version matches on session creation."

verification:
- description: "Adapter module imports cleanly without Gluten jar present"
  command: "uv run -- python -c \"from benchbox.platforms.velox import VeloxAdapter; print('import OK')\""
  expected_output: "import OK"
- description: "Platform registry exposes 'velox' via list_available_platforms()"
  command: "uv run -- python -c \"from benchbox.platforms import list_available_platforms; assert 'velox' in list_available_platforms(); print('registered')\""
  expected_output: "registered"
- description: "adapter_factory dispatches 'velox' to VeloxAdapter class"
  command: "uv run -- python -c \"from benchbox.platforms.adapter_factory import get_adapter_class; cls = get_adapter_class('velox'); assert cls.__name__ == 'VeloxAdapter'; print('dispatch OK')\""
  expected_output: "dispatch OK"
- description: "Unit tests for new adapter pass (mocked SparkSession)"
  command: "uv run -- python -m pytest tests/unit/platforms/test_velox_adapter.py -q"
  expected_output: "exit code 0"
- description: "All existing platform unit tests still pass (exit 0)"
  command: "uv run -- python -m pytest tests/unit/platforms/ -q"
  expected_output: "exit code 0"
- description: "LakeSail and Spark adapter tests specifically unaffected"
  command: "uv run -- python -m pytest tests/unit/platforms/test_lakesail.py tests/unit/platforms/test_spark_adapter.py -q"
  expected_output: "exit code 0"
- description: "Dependency introspection reports velox extra"
  command: "uv run -- python -c \"from benchbox.utils.dependencies import DEPENDENCIES; assert 'velox' in DEPENDENCIES; print('dep OK')\""
  expected_output: "dep OK"
- description: "Lint + typecheck clean on new file"
  command: "uv run ruff check benchbox/platforms/velox.py && uv run ty check benchbox/platforms/velox.py"
  expected_output: "exit code 0"
- description: "Live smoke (Linux only, gated by live_integration marker): TPC-H Q1 at SF 0.01 reports velox_active=True"
  command: "uv run -- python -m pytest tests/integration/platforms/test_velox_live.py::test_tpch_q1_velox_active -m live_integration -q"
  expected_output: "exit code 0 (test asserts platform_info['velox_active'] is True and row count matches TPC-H Q1 expected)"

