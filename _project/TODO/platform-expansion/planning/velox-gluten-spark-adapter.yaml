deferred:
- summary: "SparkListener-based fallback-operator counter attached to per-query metadata in BenchmarkResults"
  reason: "Would require editing SparkQueryExecutionMixin (violates scope_limit) or adding a new mixin; valuable for honest benchmarking but not blocking v1. Split into its own TODO after v1 lands and we see how often users hit fallback in practice."
- summary: "GPU variant (Velox + NVIDIA cuDF) as separate 'velox-gpu' adapter"
  reason: "Track NVIDIA/Velox cuDF GA before committing to a GPU adapter; keep CPU Velox as baseline first."
- summary: "Managed Spark integrations (EMR, Dataproc, Fabric native execution)"
  reason: "Config hooks only, no lifecycle management in v1. Spin out per-provider items if user demand appears."
- summary: "Automatic jar provisioning CLI (`benchbox fetch-velox-jar`)"
  reason: "Supply-chain and reproducibility risk — document the Apache mirror URL + checksum instead; add only if users ask."
- summary: "Arm64 live CI matrix entry"
  reason: "Prebuilt aarch64 bundle jars exist but we have no aarch64 CI runners today; add when infra is available."
- summary: "Iceberg / Hudi / Delta read acceleration coverage"
  reason: "Gluten supports these formats but each needs its own validation pass; separate from core adapter work."
