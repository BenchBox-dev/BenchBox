success_metrics:
- "VeloxAdapter runs TPC-H SF 0.01 end-to-end in local mode on a Linux host with a supplied 1.4.0 bundle jar"
- "platform_info reports velox_active=True and the correct gluten_version"
- "EXPLAIN output for at least 2 TPC-H queries contains VeloxColumnar* nodes"
- "Measured speedup on TPC-H SF 1 (local mode, 8 cores, 16GB) vs benchbox/platforms/spark.py with same data and tuning is >=1.5x geomean — sanity check, not a pass/fail gate"
- "Zero regression in existing Spark or LakeSail adapter tests"
- "Docs clearly explain: (a) how to get the jar, (b) how to pick gluten/spark version pair, (c) known fallback caveats"

open_questions:
- "Adapter/alias naming: 'velox' (engine-centric), 'gluten-velox' (plugin-centric), or both?  CLI precedent favors short names (duckdb, sqlite) — leaning 'velox' primary with 'gluten-velox' alias."
- "Do we ship a jar fetcher helper in v1, or defer until users ask?  Leaning defer — document the Apache mirror URL and checksum instead."
- "Should 'remote' mode be in v1 or split to a follow-up item?  Probably v1 — it is nearly free given LakeSail's Spark-Connect plumbing."
- "Do we want a GPU variant (Velox + cuDF) as a separate adapter ('velox-gpu') or a config flag on the same adapter?  Defer — watch NVIDIA Velox/cuDF GA timeline first."
- "Validation mode default: 'exact' or 'loose'?  Start 'loose' for TPC-DS due to known Velox decimal/timestamp edge cases; revisit per-query after smoke runs."
- "Do we need a second live test matrix entry (Arm64) in v1?  Defer unless user has aarch64 CI."

