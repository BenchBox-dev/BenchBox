must_preserve:
- "Existing Spark adapter (benchbox/platforms/spark.py) behavior unchanged when Velox jar / plugin not configured"
- "Existing LakeSail adapter (benchbox/platforms/lakesail.py) behavior unchanged — Velox adapter must be a new file, not a subclass modifying LakeSail"
