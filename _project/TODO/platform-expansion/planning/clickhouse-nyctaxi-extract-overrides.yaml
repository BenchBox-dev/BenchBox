id: clickhouse-nyctaxi-extract-overrides
title: "Add ClickHouse dialect overrides for nyctaxi EXTRACT functions"
worktree: platform-expansion
category: Platform Expansion
priority: Medium-High
status: Not Started
description: |
  12 query failures across nyctaxi on ClickHouse due to unsupported EXTRACT variants:
  - rush-hour-analysis: EXTRACT(HOUR FROM ts) and EXTRACT(EPOCH FROM interval)
  - weekday-weekend-comparison: EXTRACT(DOW FROM ts)
  - trips-by-day-of-week: EXTRACT(DOW FROM ts)

  ClickHouse equivalents:
  - EXTRACT(HOUR FROM ts) → toHour(ts)
  - EXTRACT(DOW FROM ts) → toDayOfWeek(ts) % 7
  - EXTRACT(EPOCH FROM (ts2 - ts1)) → dateDiff('second', ts1, ts2)

  Part of Pattern B (EXTRACT rewrite) which also affects coffeeshop.

work:
  - id: w1
    summary: "Create ClickHouse override for rush-hour-analysis query using toHour() and dateDiff('second', ...)"
    status: pending

  - id: w2
    summary: "Create ClickHouse override for weekday-weekend-comparison using toDayOfWeek() % 7"
    status: pending

  - id: w3
    summary: "Create ClickHouse override for trips-by-day-of-week using toDayOfWeek() % 7"
    status: pending

  - id: w4
    summary: "Verify all 3 overrides are loaded correctly by the query manager"
    needs: [w1, w2, w3]
    status: pending

files_affected:
  added:
    - "benchbox/core/nyctaxi/queries/clickhouse_sql/rush-hour-analysis.sql"
    - "benchbox/core/nyctaxi/queries/clickhouse_sql/weekday-weekend-comparison.sql"
    - "benchbox/core/nyctaxi/queries/clickhouse_sql/trips-by-day-of-week.sql"

must_preserve:
  - "Base nyctaxi queries unchanged — other platforms use standard EXTRACT syntax"
  - "Override queries return identical column names, types, and row semantics"

anti_patterns:
  - "DO NOT modify base query files — because other platforms depend on standard SQL EXTRACT — create clickhouse_sql/ overrides instead"
  - "DO NOT use toDayOfWeek() directly as DOW replacement — because ClickHouse returns 1=Monday while SQL standard DOW is 0=Sunday — apply % 7 adjustment"

approach: |
  Check the existing nyctaxi query structure for override patterns. Create
  clickhouse_sql/ subdirectory with 3 query files using ClickHouse-native
  date/time functions. The SQL logic stays the same; only the function calls change.

verification:
  - description: "ClickHouse nyctaxi overrides load and use native date functions"
    command: "uv run -- python -m pytest tests/ -v -k 'nyctaxi and clickhouse'"
    expected_output: "Tests pass confirming toHour/toDayOfWeek/dateDiff overrides"

