metadata:
  tags:
    - platform-adapter
    - timescaledb
    - cloud
    - deployment-modes
  estimated_effort: "2 days"
  created_date: "2026-01-14"

impact:
  business_value: |
    Enables comparison of self-hosted vs managed TimescaleDB, particularly
    valuable for time-series workload benchmarking.
  user_impact: |
    Users can benchmark TimescaleDB Cloud alongside self-hosted TimescaleDB
    using the same benchmark suite.

files_affected:
  modified:
    - "benchbox/platforms/timescaledb.py"
    - "benchbox/core/platform_registry.py"
  added:
    - "benchbox/platforms/credentials/timescaledb_cloud.py"
  removed: []

dependencies:
  related:
    - "_project/DONE/platform-expansion/active/deployment-factory-integration.yaml"

technical_requirements:
  dependencies:
    - "psycopg2 or asyncpg (existing)"
  constraints:
    - "Requires TimescaleDB Cloud account for testing"
    - "SSL connection required"

must_preserve:
  - "All existing platform adapter tests pass: uv run -- python -m pytest tests/unit/platforms/ -v --tb=short"
  - "Platform registry autodiscovery continues working for all existing platforms"
  - "Existing self-hosted TimescaleDB mode unchanged"
  - "Existing TimescaleDB unit tests continue to pass"

anti_patterns:
  - "DO NOT break existing self-hosted TimescaleDB mode — because self-hosted users depend on current behavior — add cloud as an additional deployment option"
  - "DO NOT require cloud credentials for self-hosted mode — because self-hosted users connect directly — gate cloud configuration behind deployment mode checks"
  - "DO NOT remove existing connection logic — because the self-hosted path is stable and tested — add cloud connection as a separate code path"

verification:
  - description: "Cloud credentials module imports correctly"
    command: "uv run -- python -c \"from benchbox.platforms.credentials.timescaledb_cloud import *; print('import OK')\""
    expected_output: "import OK"
  - description: "TimescaleDB adapter unit tests pass"
    command: "uv run -- python -m pytest tests/unit/platforms/test_timescaledb_adapter.py -v --tb=short"
    expected_output: "all tests pass, 0 failures"
  - description: "Existing platform tests unaffected"
    command: "uv run -- python -m pytest tests/unit/platforms/ -v --tb=short"
    expected_output: "all tests pass, 0 failures"

scope_limit:
