id: timescaledb-cloud-deployment
title: "TimescaleDB Cloud Deployment Mode"
worktree: platform-expansion
priority: Medium
status: Not Started
category: Platform Expansion
description: |
  Add TimescaleDB Cloud deployment mode to the existing TimescaleDB adapter,
  enabling benchmarking of Timescale's managed cloud service via the
  timescaledb:cloud syntax.

context_sections:
  "Background and Motivation": |
    Timescale Cloud is Timescale's managed PostgreSQL service with TimescaleDB:
    - Fully managed TimescaleDB instances
    - Automatic scaling and maintenance
    - Cloud-native features (continuous aggregates, compression)
    - PostgreSQL wire protocol compatibility

    Adding cloud support enables users to compare self-hosted TimescaleDB
    performance with the managed service.

  "Technical Context": |
    TimescaleDB Cloud uses standard PostgreSQL wire protocol, so connection
    handling is similar to self-hosted. Key differences:
    - Connection string format (cloud hostnames)
    - SSL requirements
    - Authentication (password, certificates)
    - Service tier configuration

metadata:
  tags:
  - platform-adapter
  - timescaledb
  - cloud
  - deployment-modes
  estimated_effort: "2 days"
  created_date: "2026-01-14"

  related:
  - deployment-factory-integration
  migration_review_required: true
impact:
  business_value: |
    Enables comparison of self-hosted vs managed TimescaleDB, particularly
    valuable for time-series workload benchmarking.
  user_impact: |
    Users can benchmark TimescaleDB Cloud alongside self-hosted TimescaleDB
    using the same benchmark suite.

files_affected:
  modified:
  - "benchbox/platforms/timescaledb.py"
  - "benchbox/core/platform_registry.py"
  added:
  - "benchbox/platforms/credentials/timescaledb_cloud.py"
  removed: []
technical_requirements:
  dependencies:
  - "psycopg2 or asyncpg (existing)"
  constraints:
  - "Requires TimescaleDB Cloud account for testing"
  - "SSL connection required"

must_preserve:
- "All existing platform adapter tests pass: uv run -- python -m pytest tests/unit/platforms/ -v --tb=short"
- "Platform registry autodiscovery continues working for all existing platforms"
- "Existing self-hosted TimescaleDB mode unchanged"
- "Existing TimescaleDB unit tests continue to pass"

anti_patterns:
- "DO NOT break existing self-hosted TimescaleDB mode — because self-hosted users depend on current behavior — add cloud as
  an additional deployment option"
- "DO NOT require cloud credentials for self-hosted mode — because self-hosted users connect directly — gate cloud configuration
  behind deployment mode checks"
- "DO NOT remove existing connection logic — because the self-hosted path is stable and tested — add cloud connection as a
  separate code path"

verification:
- description: "Cloud credentials module imports correctly"
  command: "uv run -- python -c \"from benchbox.platforms.credentials.timescaledb_cloud import *; print('import OK')\""
  expected_output: "import OK"
- description: "TimescaleDB adapter unit tests pass"
  command: "uv run -- python -m pytest tests/unit/platforms/test_timescaledb_adapter.py -v --tb=short"
  expected_output: "all tests pass, 0 failures"
- description: "Existing platform tests unaffected"
  command: "uv run -- python -m pytest tests/unit/platforms/ -v --tb=short"
  expected_output: "all tests pass, 0 failures"

scope_limit:
  only_modify:
  - "benchbox/platforms/timescaledb.py"
  - "benchbox/platforms/credentials/timescaledb_cloud.py"
  - "benchbox/core/platform_registry.py"
  - "tests/unit/platforms/test_timescaledb_adapter.py"
  do_not_modify:
  - "benchbox/platforms/postgresql.py"
  - "benchbox/platforms/duckdb.py"
  - "benchbox/core/runner.py"

success_metrics:
- "timescaledb:cloud connects successfully"
- "TPC-H benchmark runs at scale 0.1"
- "Results comparable with self-hosted TimescaleDB"
- "SSL connection works correctly"
