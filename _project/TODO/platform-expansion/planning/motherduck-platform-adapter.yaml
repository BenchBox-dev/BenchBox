title: "MotherDuck Platform Adapter"
worktree: platform-expansion
priority: High
status: Not Started
category: Platform Expansion
description: |
  Implement MotherDuck platform adapter as the first "distinct service name"
  deployment variant. MotherDuck is DuckDB's managed cloud offering, providing
  serverless DuckDB with cloud storage integration.

  This adapter inherits DuckDB's SQL dialect and benchmark compatibility while
  implementing MotherDuck-specific authentication and connection handling.

context_sections:
  "Background and Motivation": |
    MotherDuck represents an important benchmark target:
    - Serverless cloud data warehouse built on DuckDB
    - Direct comparison with local DuckDB performance
    - Cloud-native features (sharing, collaboration, hybrid queries)

    As a distinct service (not just "DuckDB in the cloud"), MotherDuck gets its
    own platform name rather than a deployment mode suffix (duckdb:cloud).

  "Technical Context": |
    MotherDuck connection uses the DuckDB Python library with a special
    connection string: `md:database_name` or `md:?motherduck_token=TOKEN`.

    Key differences from local DuckDB:
    - Token-based authentication (MOTHERDUCK_TOKEN env var)
    - Database lives in MotherDuck cloud
    - Data can be loaded via MotherDuck's cloud storage
    - Hybrid queries can access both local and cloud data

