context_sections:
  "Managed Doris Ecosystem": |
    Multiple commercial offerings built on Apache Doris by core contributors:

    **VeloDB** (velodb.io) - Founded May 2023 by original Doris contributors
    - 50% of Doris PMC and committers onboard
    - Products: VeloDB Cloud (fully managed), VeloDB Enterprise (on-premise)
    - Available on AWS, GCP, Azure
    - Decoupled storage-compute architecture with elastic scaling
    - Hosts Apache Doris Summit

    **SelectDB** (selectdb.com) - Built by core Doris developers
    - Cloud-native real-time data warehouse service
    - Available on multiple cloud providers
    - ApsaraDB for SelectDB on Alibaba Cloud (ranks top in ClickBench)
    - 50% lower TCO claimed vs self-managed

    Both vendors remain major contributors to the open-source Apache Doris
    project. For BenchBox, self-hosted Doris should work with any managed
    service using standard MySQL protocol (port 9030).

  "Doris vs StarRocks": |
    Apache Doris and StarRocks share common ancestry (Doris was the original,
    StarRocks forked in 2020). Key differences today:
    - Doris: Apache governance, larger community, more enterprise features
    - StarRocks: Faster release cycle, more aggressive optimization focus
    - Both: MySQL protocol, similar DDL, Stream Load API

    BenchBox supporting both enables meaningful comparison.

  "Performance Positioning": |
    Apache Doris claims strong performance in OLAP workloads:
    - Vectorized execution engine (Doris 2.0+)
    - Columnar storage with efficient compression
    - Cost-based query optimizer
    - Real-time data ingestion support

    Independent BenchBox verification provides objective comparison.

  "Data Loading Strategy": |
    Recommended approach for BenchBox:
    1. Stream Load (HTTP PUT) for CSV files - primary method
    2. Broker Load for cloud storage (S3, HDFS) scenarios
    3. INSERT INTO SELECT for transformations
    4. Standard INSERT for small datasets/testing

    Stream Load endpoint: http://{fe_host}:8030/api/{database}/{table}/_stream_load

  "Table Model Selection": |
    Doris supports multiple table models:
    - Duplicate: All rows stored, best for append-only logs
    - Aggregate: Pre-aggregated on key columns, good for metrics
    - Unique: Deduplication on key columns, good for updates
    - Primary: Merge-on-read with updates, good for CDC

    For TPC-H: Duplicate model recommended for most tables.
