title: "Add Apache Doris MPP OLAP platform support"
worktree: platform-expansion
priority: Medium-High
status: Not Started
description: |
  Integrate Apache Doris as a supported BenchBox platform. Apache Doris is an
  Apache Top-Level Project providing a high-performance real-time analytical
  database. It's the upstream project from which StarRocks was forked, with
  continued active development and strong adoption (12K+ GitHub stars, used by
  Xiaomi, ByteDance, Baidu, JD.com, and 4000+ enterprises globally).

  Technical fit analysis:
  - SQLGlot has official 'doris' dialect support (verified)
  - MySQL protocol connectivity via PyMySQL (port 9030)
  - Full TPC-H (22 queries) and TPC-DS (99 queries) compatibility
  - Competitive performance in OLAP workloads
  - Multiple data loading options (Stream Load, Broker Load, INSERT)
  - Vectorized execution engine and columnar storage

  Strategic value:
  - Major Apache project with strong community and enterprise adoption
  - Enables side-by-side comparison with StarRocks (shared heritage)
  - Real-time analytics focus complements batch OLAP platforms
  - Multiple managed cloud options: VeloDB Cloud, SelectDB Cloud, ApsaraDB for SelectDB

  Note: Apache Doris and StarRocks share common ancestry but have diverged
  significantly. Both are valuable benchmarking targets for different user bases.

category: Platform Expansion

