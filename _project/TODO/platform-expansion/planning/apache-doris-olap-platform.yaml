    Apache Doris is a top-level Apache project with massive adoption in China
    and growing international presence. Supporting it expands BenchBox's
    relevance to a large user base and enables comparative analysis with
    StarRocks (shared heritage, different evolution paths).
  user_impact: |
    Users running Apache Doris deployments can benchmark their systems with
    industry-standard TPC-H/TPC-DS workloads. Comparative analysis against
    StarRocks, ClickHouse, and other platforms becomes straightforward.
  technical_debt: |
    Clean implementation following established patterns (very similar to
    StarRocks adapter due to shared heritage). No technical debt expected.

