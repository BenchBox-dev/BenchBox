title: "Platform Deployment Factory Integration"
worktree: platform-expansion
priority: High
status: Not Started
category: Core Functionality
description: |
  Integrate deployment mode awareness into the adapter factory, enabling routing
  to appropriate adapters based on deployment mode (local, self-hosted, managed).

  This extends the existing _normalize_platform_name() pattern that handles the
  -df suffix for DataFrame mode, adding support for :deployment suffix parsing
  (e.g., clickhouse:cloud, firebolt:core).

context_sections:
  "Background and Motivation": |
    The adapter factory currently handles SQL/DataFrame mode selection via the
    -df suffix pattern. This work extends that pattern to handle deployment modes
    using a colon separator, enabling intuitive platform+deployment specification.

  "Technical Context": |
    Current _normalize_platform_name() returns tuple[str, bool] for (base_name, df_mode).
    We extend this to tuple[str, bool, str | None] for (base_name, df_mode, deployment).

    The get_adapter() function gains a deployment parameter and passes deployment_mode
    through config to adapters.

