impact:
  business_value: |
    pg_mooncake represents a new category: columnar-native PostgreSQL. It
    enables comparison of PostgreSQL's row storage vs true columnar storage
    within the same database engine, which is a unique benchmarking scenario.
    Its top-10 ClickBench ranking makes it directly comparable to specialized
    OLAP engines.
  user_impact: |
    Users can benchmark pg_mooncake columnstore performance with:
    benchbox run --platform pg-mooncake --benchmark tpch --scale 1
    And compare against --platform postgresql, --platform duckdb, and
    --platform clickhouse-cloud.

