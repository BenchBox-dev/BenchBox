    - "PostgreSQL 15+ with pg_mooncake extension installed"
  constraints:
    - "Requires pg_mooncake extension pre-installed on PostgreSQL server"
    - "Conflicts with standalone pg_duckdb — cannot coexist in same instance"
    - "Not all PostgreSQL data types supported on columnstore tables"
    - "Object storage mode requires S3/GCS credentials"
  compatibility: |
    PostgreSQL 15-18 with pg_mooncake. Standard psycopg2 driver — no
    additional Python dependencies. Object storage backend is optional.

must_preserve:
  - "PostgreSQLAdapter.load_data() COPY pipeline unchanged — pg_mooncake inherits it but COPY targets columnstore tables"
  - "PostgreSQLAdapter.execute_query() return format unchanged"
  - "All existing PostgreSQL adapter tests pass: uv run -- python -m pytest tests/unit/platforms/test_postgresql_adapter.py -v"
  - "Platform registry autodiscovery for all existing platforms unaffected"

approach: |
  Follow the TimescaleDB pattern (benchbox/platforms/timescaledb.py) with key
  differences in schema creation:

  1. Create PgMooncakeAdapter(PostgreSQLAdapter) in benchbox/platforms/pg_mooncake.py
  2. Override create_connection() to verify pg_mooncake extension is installed
  3. Override create_schema() to modify DDL: add "USING columnstore" to
     CREATE TABLE statements. This is the critical difference — tables must use
     the columnstore access method for pg_mooncake to activate.
  4. Inherit load_data() from PostgreSQLAdapter — COPY works on columnstore
     tables but internally creates Parquet files
  5. Override configure_for_benchmark() for pg_mooncake-specific GUCs
  6. Register in platform_registry.py with metadata (category: "olap-columnstore",
     platform_family: "pg_mooncake")

  For the DDL generator (benchbox/core/tuning/generators/pg_mooncake.py),
  extend PostgreSQLDDLGenerator and add USING columnstore to all CREATE TABLE
  statements. Handle unsupported data types by mapping them to supported types
  or raising clear errors.

  Storage configuration:
  - Default: local disk (simplest for benchmarking)
  - Optional: S3/GCS backend via mooncake.default_bucket GUC
  - CLI flags: --mooncake-storage=local|s3 --mooncake-bucket=<url>

anti_patterns:
  - "DO NOT modify the PostgreSQL adapter's create_schema() — because pg_mooncake needs USING columnstore only for its own tables — override in the pg_mooncake adapter class"
  - "DO NOT try to ALTER existing heap tables to columnstore in-place — because pg_mooncake requires CREATE TABLE ... USING columnstore — create tables with columnstore from the start"
  - "DO NOT silently fall back to heap tables on unsupported types — because this would produce misleading benchmark results — raise a clear error listing which columns have unsupported types"
  - "DO NOT bundle or install pg_mooncake via the adapter — because extension installation requires server admin privileges and Docker setup — only verify it exists and raise a clear error if missing"

verification:
  - description: "pg_mooncake adapter module imports without error"
    command: "uv run -- python -c \"from benchbox.platforms.pg_mooncake import PgMooncakeAdapter; print('import OK')\""
    expected_output: "import OK"
  - description: "All existing platform tests still pass"
    command: "uv run -- python -m pytest tests/unit/platforms/ -v --tb=short"
    expected_output: "all tests pass, 0 failures"
  - description: "pg_mooncake unit tests pass"
    command: "uv run -- python -m pytest tests/unit/platforms/test_pg_mooncake_adapter.py -v --tb=short"
    expected_output: "all tests pass, 0 failures"
  - description: "Platform registry lists pg-mooncake"
    command: "uv run -- python -c \"from benchbox.core.platform_registry import PlatformRegistry; print('pg-mooncake' in PlatformRegistry.list_platforms())\""
    expected_output: "True"

