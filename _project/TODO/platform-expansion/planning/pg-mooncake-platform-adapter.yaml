id: pg-mooncake-platform-adapter
title: "Add pg_mooncake Platform Adapter for Columnstore Analytics in PostgreSQL"
worktree: platform-expansion
priority: Medium-High
status: Not Started
category: Platform Expansion
description: |
  Add a pg_mooncake platform adapter that enables benchmarking PostgreSQL with
  the pg_mooncake extension installed. pg_mooncake adds native columnstore
  tables (Iceberg/Delta Lake backed, Parquet storage) with DuckDB-powered
  vectorized execution to PostgreSQL, achieving top-10 ClickBench performance.

  Unlike pg_duckdb which accelerates queries on regular heap tables,
  pg_mooncake uses a custom "columnstore" table access method (CREATE TABLE ...
  USING columnstore) that stores data in Parquet format with Iceberg metadata.
  This gives true columnar compression (5:1 to 20:1) and DuckDB-native
  execution on columnar data.

  This adapter should inherit from PostgreSQLAdapter and override schema
  creation to use columnstore tables, handle the different data loading path
  (COPY into columnstore creates Parquet files), and configure pg_mooncake-
  specific GUC parameters.

  Key benchmarking scenarios:
  - pg_mooncake columnstore vs PostgreSQL heap tables (same queries)
  - pg_mooncake vs native DuckDB (columnar vs columnar)
  - pg_mooncake vs ClickHouse (ClickBench comparison — pg_mooncake is top 10)
  - pg_mooncake with object storage backend (S3/GCS) vs local disk

context_sections:
  "Background and Motivation": |
    pg_mooncake (https://github.com/Mooncake-Labs/pg_mooncake) is a PostgreSQL
    extension from Mooncake Labs that adds native columnstore tables with
    vectorized execution powered by DuckDB. It cracked the top 10 on ClickBench
    and is supported by managed providers like Neon.

    Architecture:
    - pg_moonlink: Iceberg-native data ingestion engine (WAL-based replication)
    - pg_duckdb (bundled): DuckDB execution engine for columnstore queries
    - Parquet storage with Iceberg or Delta Lake metadata
    - Data stored in object storage (S3/GCS/Azure) or local disk

    Key differences from pg_duckdb:
    - pg_mooncake uses its own columnstore storage format (USING columnstore)
    - True columnar compression (5:1 to 20:1 ratios)
    - Data is stored as Parquet files, not in PostgreSQL's heap
    - Supports INSERT/UPDATE/DELETE with transactional integrity on columnstore
    - Conflicts with standalone pg_duckdb (shared libduckdb.so)

    Limitations:
    - Not all PostgreSQL features supported on columnstore tables
    - Converting existing heap tables requires CREATE + COPY workflow
    - Active development — some data types may not be supported yet

  "Technical Context": |
    pg_mooncake connects via standard PostgreSQL wire protocol (psycopg2).
    The critical difference is in DDL and data loading:

    1. Schema creation: ALTER TABLE ... SET ACCESS METHOD columnstore OR
       CREATE TABLE ... USING columnstore (replaces standard heap tables)
    2. Data loading: COPY works but creates Parquet files internally
    3. Storage: metadata in PostgreSQL catalog, data in Parquet/Iceberg format
    4. Execution: queries on columnstore tables route through DuckDB engine
    5. Object storage: optional S3/GCS/Azure backend for Parquet files

    The adapter needs to:
    - Override create_schema() to use columnstore table access method
    - Handle storage configuration (local vs object storage)
    - Verify pg_mooncake extension is installed
    - Configure mooncake-specific GUC parameters
    - Handle limitations gracefully (unsupported data types, features)

    IMPORTANT: pg_mooncake bundles its own pg_duckdb fork — it conflicts with
    the standalone pg_duckdb extension. Cannot coexist in the same instance.
    This means separate PostgreSQL instances for pg_duckdb vs pg_mooncake benchmarks.

