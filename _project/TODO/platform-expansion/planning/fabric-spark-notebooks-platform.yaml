impact:
  business_value: |
    Microsoft Fabric is Microsoft's unified analytics platform with growing
    enterprise adoption. Supporting Fabric Spark enables:
    - Complete Fabric ecosystem coverage (Warehouse already supported)
    - Lakehouse benchmarking (currently blocked per fabric_warehouse.py notes)
    - Comparison between Fabric Warehouse vs Fabric Spark performance
    - Delta Lake optimization testing (V-Order, Z-Order, etc.)
  user_impact: |
    Users running Microsoft Fabric can benchmark both their SQL-based Warehouse
    and Spark-based Lakehouse workloads. This enables:
    - Apples-to-apples comparison within Fabric ecosystem
    - Informed decisions about Warehouse vs Lakehouse for specific workloads
    - Performance validation of Fabric Spark vs other managed Spark services
  technical_debt: |
    Clean implementation following established patterns. Can share OneLake
    upload logic with fabric_warehouse.py to avoid duplication.

technical_requirements:
  constraints:
  - "Requires Microsoft Fabric workspace with Spark capability"
  - "Requires Entra ID authentication (service principal or managed identity)"
  - "Livy API endpoint must be accessible from client"
  - "Remote execution only (no local Spark session)"
  dependencies:
  - "azure-identity (Entra ID authentication)"
  - "azure-storage-file-datalake (OneLake access)"
  - "requests (Livy REST API)"
  compatibility: |
    - Python 3.10+
    - Microsoft Fabric F2 capacity or higher
    - Spark 3.4+ (Fabric default runtime)
    - SQLGlot 'spark' dialect

