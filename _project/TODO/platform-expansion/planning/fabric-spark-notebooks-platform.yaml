context_sections:
  "Fabric Lakehouse Architecture": |
    Microsoft Fabric Lakehouse combines:
    - OneLake (unified data lake storage)
    - Delta Lake (table format with ACID transactions)
    - Spark runtime (data processing engine)
    - SQL Analytics Endpoint (read-only SQL access - NOT for data loading)

    The existing FabricWarehouseAdapter targets SQL-based Warehouse items.
    This adapter targets Spark-based Lakehouse items with full read/write.

  "Livy API Overview": |
    Apache Livy provides REST API for Spark job submission:
    - POST /sessions - Create new Spark session
    - GET /sessions/{id} - Get session status
    - POST /sessions/{id}/statements - Submit Spark code
    - GET /sessions/{id}/statements/{stmtId} - Get statement result
    - DELETE /sessions/{id} - Terminate session

    Fabric Livy endpoint: https://{workspace}.dev.azuresynapse.net/livyApi/versions/2019-11-01-preview/sparkPools/{pool}/

  "OneLake Path Formats": |
    Spark access to OneLake uses abfss:// protocol:
    - abfss://{workspace}@onelake.dfs.fabric.microsoft.com/{item}.Lakehouse/Tables/{table}
    - abfss://{workspace}@onelake.dfs.fabric.microsoft.com/{item}.Lakehouse/Files/{path}

    Delta tables are stored under /Tables/, raw files under /Files/.

  "V-Order Optimization": |
    Fabric-specific columnar optimization:
    - Improves parquet read performance by 10-50%
    - Enabled via: spark.conf.set("spark.sql.parquet.vorder.enabled", "true")
    - Only available in Fabric Spark runtime

  "Related Platforms": |
    Existing Spark-related adapters:
    - spark.py: Generic Apache Spark (local, YARN, K8s)
    - databricks.py: Databricks managed Spark (if exists)
    - snowpark_connect.py: Snowflake Snowpark (DataFrame API)

    This adapter follows similar patterns but uses Livy for remote execution
    instead of direct SparkSession.
