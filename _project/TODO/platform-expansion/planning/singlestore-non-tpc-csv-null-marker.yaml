id: singlestore-non-tpc-csv-null-marker
title: "SingleStore: set csv_null_marker for nyctaxi/clickbench/amplab before smoke tests"
worktree: platform-expansion
priority: Medium
status: Not Started
category: Platform Expansion
description: |
  nyctaxi, clickbench, and amplab benchmarks do not set csv_null_marker in their
  generator manifest metadata.  SingleStore LOAD DATA INFILE in strict mode requires
  NULL DEFINED BY to handle nullable integer columns; without it, empty fields hit
  error 1264 "Out of range value for column".

  nyctaxi sets csv_null_marker=None explicitly (core/nyctaxi/benchmark.py:294);
  clickbench sets csv_null_marker=None (core/clickbench/generator.py:390); amplab
  sets nothing.  nyctaxi at minimum has nullable integer columns and will fail as
  soon as a SingleStore smoke test runs against it.

  This is pre-existing — not introduced by the CSV-loading work — but was surfaced
  during that review.  Address before pointing SingleStore smoke tests at these
  benchmarks.

context_sections:
  "Root cause": |
    resolve_csv_dialect path (c) / (b) defaults csv_null_marker to None for non-TPC
    files.  SingleStore _load_data_infile only emits NULL DEFINED BY when
    dialect.null_marker is not None.  Nullable columns in non-TPC benchmarks will
    produce a load failure in strict mode.

  "Fix": |
    Add csv_null_marker="" to each benchmark's write_generator_manifest() call so
    manifest path (a) wins and the dialect carries an explicit null marker.  Verify
    with a dry-run or unit test that the dialect resolves correctly for each benchmark.

files_affected:
  modified:
    - benchbox/core/nyctaxi/benchmark.py
    - benchbox/core/clickbench/generator.py

metadata:
  tags:
