impact:
  business_value: |
    Users can install only the cloud provider dependencies they need rather
    than installing everything. Reduces dependency bloat and installation
    conflicts for single-cloud users.
  user_impact: |
    Clear installation path for each cloud provider:
    - AWS users: `uv add benchbox --extra cloud-spark-aws`
    - GCP users: `uv add benchbox --extra cloud-spark-gcp`
    - Azure users: `uv add benchbox --extra cloud-spark-azure`
    - Multi-cloud: `uv add benchbox --extra cloud-spark`

files_affected:
  modified:
    - pyproject.toml
    - docs/installation.md

context_sections:
  "Platform Status (Complete)": |
    All cloud Spark adapters are implemented and registered:

    AWS (boto3):
    - benchbox/platforms/aws/glue_adapter.py
    - benchbox/platforms/aws/emr_serverless_adapter.py
    - benchbox/platforms/aws/athena_spark_adapter.py

    GCP (google-cloud-*):
    - benchbox/platforms/gcp/dataproc_adapter.py
    - benchbox/platforms/gcp/dataproc_serverless_adapter.py

    Azure (azure-*):
    - benchbox/platforms/azure/synapse_spark_adapter.py
    - benchbox/platforms/azure/fabric_spark_adapter.py

  "Current pyproject.toml State": |
    The `cloud-spark` extra only has Databricks deps:
    ```toml
    cloud-spark = [
        "databricks-sql-connector>=2.0.0",
        "databricks-sdk>=0.20.0",
        "databricks-connect>=14.0.0; python_version >= '3.10'",
        "cloudpathlib>=0.15.0",
        # Future: AWS Glue, EMR, Dataproc, Synapse Spark, Fabric Spark
    ]
    ```

    Missing provider-specific extras entirely.

  "Target pyproject.toml State": |
    ```toml
    # Provider-specific cloud Spark groups
    cloud-spark-aws = ["boto3>=1.34.0"]
    cloud-spark-gcp = ["google-cloud-dataproc>=5.0.0", "google-cloud-storage>=2.0.0"]
    cloud-spark-azure = ["azure-identity>=1.15.0", "azure-storage-file-datalake>=12.14.0", "requests>=2.31.0"]

    # All cloud Spark platforms
    cloud-spark = [
        # AWS (Glue, EMR Serverless, Athena Spark)
        "boto3>=1.34.0",
        # GCP (Dataproc, Dataproc Serverless)
        "google-cloud-dataproc>=5.0.0",
        "google-cloud-storage>=2.0.0",
        # Azure (Synapse Spark, Fabric Spark)
        "azure-identity>=1.15.0",
        "azure-storage-file-datalake>=12.14.0",
        "requests>=2.31.0",
        # Databricks
        "databricks-sql-connector>=2.0.0",
        "databricks-sdk>=0.20.0",
        "databricks-connect>=14.0.0; python_version >= '3.10'",
        "cloudpathlib>=0.15.0",
    ]
    ```

