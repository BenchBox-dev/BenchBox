id: cedardb-adapter
title: "Add CedarDB Platform Adapter"
worktree: platform-expansion
priority: Medium
status: Not Started
category: Platform Expansion
description: |
  Add support for CedarDB (formerly Umbra), a high-performance RDBMS that handles both
  OLAP and OLTP workloads with PostgreSQL wire protocol compatibility.

  CedarDB is notable for:
  - Blazingly fast analytical and transactional query execution
  - Full PostgreSQL SQL dialect and wire protocol compatibility
  - Strong ACID guarantees with MVCC
  - Works with existing PostgreSQL tools (psql, DBeaver, DataGrip)
  - Python connectivity via psycopg2/psycopg3 (PostgreSQL drivers)

  Reference: https://cedardb.com/docs/

context_sections:
  "Technical Background": |
    CedarDB uses PostgreSQL wire protocol, meaning we can likely reuse much of the
    PostgreSQL adapter pattern. Key differences may be in:
    - Query optimization hints
    - Bulk loading mechanisms
    - Platform-specific tuning options

  "Connection Details": |
    Python drivers: psycopg2, psycopg3 (standard PostgreSQL drivers)
    Connection string: Standard PostgreSQL format
    Default port: 5432 (configurable)

metadata:
  tags:
  - platform
  - sql
  - postgresql-compatible
  - olap
  - oltp
  - cedardb
  estimated_effort: Medium
  created_date: "2026-01-26"

technical_requirements:
  dependencies:
  - "psycopg2 or psycopg3 (PostgreSQL driver)"
  compatibility: |
    CedarDB supports PostgreSQL SQL dialect and wire protocol.
    Should work with existing PostgreSQL tooling.

files_affected:
