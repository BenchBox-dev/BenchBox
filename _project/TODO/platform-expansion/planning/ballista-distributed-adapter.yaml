  - datafusion
  - arrow
  - olap
  - ballista
  estimated_effort: Medium-High
  created_date: "2026-03-24"

deps:
  needs: []

technical_requirements:
  dependencies:
  - "ballista (PyPI package — Python bindings for Ballista)"
  - "pyarrow>=10.0.0 (already a project dependency)"
  compatibility: |
    Ballista uses the same DataFusion SQL dialect. All TPC-H query transformations
    from datafusion_query_transformer.py apply directly. TPC-DS compatibility
    depends on DataFusion's SQL coverage (same limitations as DataFusion adapter).

files_affected:
  added:
  - "benchbox/platforms/ballista.py"
  - "tests/unit/platforms/test_ballista_adapter.py"
  - "docs/platforms/ballista.md"
  modified:
  - "benchbox/platforms/__init__.py (add lazy import for BallistaAdapter)"
  - "benchbox/core/platform_registry.py (add ballista platform metadata)"
  - "pyproject.toml (add ballista optional dependency)"

must_preserve:
- "All existing DataFusion adapter tests pass: uv run -- python -m pytest tests/unit/platforms/test_datafusion_adapter.py -v"
- "All existing platform adapter tests pass: uv run -- python -m pytest tests/unit/platforms/ -v --tb=short"
- "DataFusion query transformer behavior unchanged (reused, not forked)"
- "Platform registry autodiscovery continues working for all existing platforms"
- "DataFusion write transformer behavior unchanged (reused, not forked)"

anti_patterns:
- "DO NOT fork or modify DataFusionQueryTransformer — because Ballista uses the same DataFusion SQL dialect — import and reuse it directly"
- "DO NOT modify the existing DataFusion adapter — because Ballista is a separate platform — create a new ballista.py file"
- "DO NOT hardcode scheduler addresses — because deployment varies — make host:port configurable with sensible defaults"
- "DO NOT assume local filesystem access for data in distributed mode — because executors read from shared storage — support object storage URIs (s3://, gs://)"
- "DO NOT skip standalone mode support — because it enables CI testing without a cluster — support both standalone and remote deployment modes"

verification:
- description: "Ballista adapter imports correctly"
  command: "uv run -- python -c \"from benchbox.platforms.ballista import BallistaAdapter; print('import OK')\""
  expected_output: "import OK"
- description: "Unit tests pass"
  command: "uv run -- python -m pytest tests/unit/platforms/test_ballista_adapter.py -v --tb=short"
  expected_output: "all tests pass, 0 failures"
- description: "Existing platform tests unaffected"
  command: "uv run -- python -m pytest tests/unit/platforms/ -v --tb=short"
  expected_output: "all tests pass, 0 failures"
- description: "Platform registry lists ballista"
  command: "uv run -- python -c \"from benchbox.core.platform_registry import PlatformRegistry; r = PlatformRegistry(); print('ballista' in r.get_all_platforms())\""
  expected_output: "True"
- description: "Standalone mode smoke test (if ballista installed)"
  command: "uv run -- python -c \"from ballista import BallistaBuilder; ctx = BallistaBuilder().standalone().build(); df = ctx.sql('SELECT 1 AS x'); print(df.collect())\""
  expected_output: "Arrow batch with value 1"

scope_limit:
  only_modify:
  - "benchbox/platforms/ballista.py"
  - "tests/unit/platforms/test_ballista_adapter.py"
  - "benchbox/platforms/__init__.py"
  - "benchbox/core/platform_registry.py"
  - "pyproject.toml"
  - "docs/platforms/ballista.md"
  do_not_modify:
  - "benchbox/platforms/datafusion.py"
  - "benchbox/platforms/datafusion_query_transformer.py"
  - "benchbox/platforms/datafusion_write_transformer.py"
  - "benchbox/core/query_plans/parsers/datafusion.py"
  - "benchbox/core/runner/"

success_metrics:
- "BallistaAdapter passes TPC-H Q1, Q6, Q14 in standalone mode at SF 0.01"
- "Standalone mode works without external cluster infrastructure"
- "Remote mode connects to scheduler when host:port provided"
- "Query transformer reuse confirmed (no forked copies)"
- "Plan parser reuse confirmed (DataFusion EXPLAIN output is identical)"
- "Documentation complete with standalone and distributed examples"
- "Platform discoverable via benchbox run --platform ballista"

open_questions:
- "What is the minimum stable version of the `ballista` PyPI package to target?"
- "Does Ballista's Python BallistaBuilder API support configuration options like memory limits and target partitions?"
- "How mature are the Python bindings — are there known gaps vs the Rust API?"
- "Should we support a Docker Compose deployment mode for integration testing?"
- "Can Ballista register Delta Lake and Iceberg tables, or only Parquet/CSV?"
- "What is the performance overhead of standalone mode vs direct DataFusion?"

