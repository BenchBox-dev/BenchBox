id: ballista-distributed-adapter
title: "Add Apache DataFusion Ballista Distributed Query Platform Adapter"
worktree: platform-expansion
priority: Low
status: Not Started
category: Platform Expansion
description: |
  Add support for Apache DataFusion Ballista, a distributed SQL query engine built on
  Apache DataFusion and Apache Arrow. Ballista extends DataFusion's single-node execution
  to a distributed cluster architecture with a scheduler and multiple executor nodes.

  Ballista is notable for:
  - Distributed SQL execution across a cluster (scheduler + executors)
  - Built on DataFusion - same SQL dialect, same query planning, same Arrow-native execution
  - Python bindings built from source (BallistaBuilder and BallistaSessionContext APIs)
  - Supports Parquet, CSV, and other Arrow-compatible formats on shared storage
  - Kubernetes-native deployment with Helm charts
  - Standalone mode for single-machine testing
  - Columnar execution via Apache Arrow with query vectorization
  - Claims 2.9x speedup over Spark on TPC-H at 100GB scale factor

  Since Ballista uses DataFusion internally, the existing DataFusion adapter provides
  a strong foundation. The key differences are: (1) connection via BallistaBuilder to a
  remote scheduler instead of a local SessionContext, (2) data must reside on shared
  storage accessible to all executors (S3, GCS, HDFS, or shared filesystem), and
  (3) distributed execution semantics (partitioning, shuffles, task scheduling).

  IMPORTANT: The `ballista` name on PyPI is occupied by an UNRELATED package (a PyTorch
  helper). The Apache Ballista Python bindings are NOT published to PyPI as prebuilt
  wheels. Users must build from source using maturin from the main Ballista repo
  (apache/datafusion-ballista/python/). This significantly affects installation UX
  and CI integration.

  Reference: https://github.com/apache/datafusion-ballista
  Python bindings: https://github.com/apache/datafusion-ballista/tree/main/python

context_sections:
  "Technical Background": |
    Ballista uses the same DataFusion SQL dialect and query planner. The Python API
    exposes a `BallistaBuilder` that connects to a scheduler endpoint and returns a
    `SessionContext` compatible with DataFusion's API. This means:
    - Query transformer (datafusion_query_transformer.py) can be reused as-is
    - Write transformer (datafusion_write_transformer.py) needs adaptation for shared storage
    - Query plan parser (datafusion.py plan parser) can be reused as-is
    - SQL dialect target remains "datafusion"

    The Python bindings (built from source via maturin) provide two APIs:

    ```python
    # Older BallistaBuilder API:
    from ballista import BallistaBuilder
    ctx = BallistaBuilder().standalone()                    # Local standalone
    ctx = BallistaBuilder().remote("df://host:50050")       # Remote scheduler

    # Newer BallistaSessionContext API:
    from ballista import BallistaSessionContext
    ctx = BallistaSessionContext("df://localhost:50050")     # Remote scheduler

    ctx.sql("SELECT * FROM table")                          # Same DataFusion SQL API
    ```

    Known Python binding limitations (GitHub issue #1142):
    1. SessionConfig not propagated to cluster
    2. No custom Ballista configuration from Python
    3. No UDF serialization support
    4. New connection created per request (inefficient)
    5. Must build from source - no prebuilt PyPI wheels

  "Connection & Deployment": |
    Ballista supports multiple deployment modes relevant to benchmarking:

    1. **Standalone** (single process, scheduler + executor combined):
       - Best for CI testing and small-scale benchmarks
       - `BallistaBuilder().standalone().build()`
       - No external dependencies

    2. **Distributed** (separate scheduler + N executors):
       - `BallistaBuilder().remote("scheduler_host:50050").build()`
       - Scheduler default port: 50050
       - Requires shared storage for data files
       - Kubernetes Helm chart available for orchestration

    3. **Docker Compose** (multi-container local cluster):
       - Good for integration testing with multiple executors
       - Simulates distributed execution on a single machine

  "Data Loading Considerations": |
    Unlike single-node DataFusion where data files are local, Ballista executors need
    access to shared storage. Data loading strategy must account for:
    - Object storage paths (s3://, gs://, hdfs://) for distributed mode
    - Local filesystem paths for standalone mode (same as DataFusion adapter)
    - Table registration via `ctx.register_parquet()` or `ctx.register_csv()`
    - No COPY/INSERT support - data must be pre-staged as files
    - External table pattern from DataFusion adapter transfers directly

  "Adapter Architecture Decision": |
    Two viable approaches:

    Option A: **Standalone adapter** (ballista.py) that composes DataFusion adapter logic
    - Pro: Clean separation, independent evolution
    - Pro: Can handle distributed-specific concerns (shared storage, cluster config)
    - Con: Some code duplication with DataFusion adapter

    Option B: **Deployment mode on DataFusion adapter** (datafusion:distributed)
    - Pro: Maximum code reuse, minimal new code
    - Con: Conflates single-node and distributed concerns
    - Con: Connection setup is fundamentally different

    **Recommended: Option A** - Create a new `BallistaAdapter` class that reuses
    DataFusion's query/write transformers and plan parser, but has its own connection
    management and data loading logic. This follows the pattern used by ClickHouse
    (separate adapter, shared mixins).

metadata:
  tags:
    - platform
    - sql
    - distributed
    - datafusion
    - arrow
    - olap
    - ballista
  estimated_effort: Medium-High
  created_date: "2026-03-24"

deps:
  needs: []

technical_requirements:
  dependencies:
    - "ballista (built from source via maturin - NOT available on PyPI)"
    - "pyarrow>=10.0.0 (already a project dependency)"
    - "maturin (build tool, dev dependency only)"
    - "Rust toolchain (required to build ballista from source)"
  compatibility: |
    Ballista uses the same DataFusion SQL dialect. All TPC-H query transformations
    from datafusion_query_transformer.py apply directly. TPC-DS compatibility
    depends on DataFusion's SQL coverage (same limitations as DataFusion adapter).
    Version numbers are aligned with DataFusion (e.g., Ballista 50.x matches
    DataFusion 50.x). The DataFusion Python version must match the Ballista version.

files_affected:
  added:
    - "benchbox/platforms/ballista.py"
    - "tests/unit/platforms/test_ballista_adapter.py"
    - "docs/platforms/ballista.md"
  modified:
    - "benchbox/platforms/__init__.py (add lazy import for BallistaAdapter)"
    - "benchbox/core/platform_registry.py (add ballista platform metadata)"
    - "pyproject.toml (add ballista optional dependency)"

must_preserve:
  - "All existing DataFusion adapter tests pass: uv run -- python -m pytest tests/unit/platforms/test_datafusion_adapter.py -v"
  - "All existing platform adapter tests pass: uv run -- python -m pytest tests/unit/platforms/ -v --tb=short"
  - "DataFusion query transformer behavior unchanged (reused, not forked)"
  - "Platform registry autodiscovery continues working for all existing platforms"
  - "DataFusion write transformer behavior unchanged (reused, not forked)"

anti_patterns:
  - "DO NOT fork or modify DataFusionQueryTransformer - because Ballista uses the same DataFusion SQL dialect - import and reuse it directly"
  - "DO NOT modify the existing DataFusion adapter - because Ballista is a separate platform - create a new ballista.py file"
  - "DO NOT hardcode scheduler addresses - because deployment varies - make host:port configurable with sensible defaults"
  - "DO NOT assume local filesystem access for data in distributed mode - because executors read from shared storage - support object storage URIs (s3://, gs://)"
  - "DO NOT skip standalone mode support - because it enables CI testing without a cluster - support both standalone and remote deployment modes"

verification:
  - description: "Ballista adapter imports correctly"
    command: 'uv run -- python -c "from benchbox.platforms.ballista import BallistaAdapter; print(''import OK'')"'
    expected_output: "import OK"
  - description: "Unit tests pass"
    command: "uv run -- python -m pytest tests/unit/platforms/test_ballista_adapter.py -v --tb=short"
    expected_output: "all tests pass, 0 failures"
  - description: "Existing platform tests unaffected"
    command: "uv run -- python -m pytest tests/unit/platforms/ -v --tb=short"
    expected_output: "all tests pass, 0 failures"
  - description: "Platform registry lists ballista"
    command: 'uv run -- python -c "from benchbox.core.platform_registry import PlatformRegistry; r = PlatformRegistry(); print(''ballista'' in r.get_all_platforms())"'
    expected_output: "True"
  - description: "Standalone mode smoke test (if ballista installed)"
    command: 'uv run -- python -c "from ballista import BallistaBuilder; ctx = BallistaBuilder().standalone().build(); df = ctx.sql(''SELECT 1 AS x''); print(df.collect())"'
    expected_output: "Arrow batch with value 1"

scope_limit:
  only_modify:
    - "benchbox/platforms/ballista.py"
    - "tests/unit/platforms/test_ballista_adapter.py"
    - "benchbox/platforms/__init__.py"
    - "benchbox/core/platform_registry.py"
    - "pyproject.toml"
    - "docs/platforms/ballista.md"
  do_not_modify:
    - "benchbox/platforms/datafusion.py"
    - "benchbox/platforms/datafusion_query_transformer.py"
    - "benchbox/platforms/datafusion_write_transformer.py"
    - "benchbox/core/query_plans/parsers/datafusion.py"
    - "benchbox/core/runner/"

success_metrics:
  - "BallistaAdapter passes TPC-H Q1, Q6, Q14 in standalone mode at SF 0.01"
  - "Standalone mode works without external cluster infrastructure"
  - "Remote mode connects to scheduler when host:port provided"
  - "Query transformer reuse confirmed (no forked copies)"
  - "Plan parser reuse confirmed (DataFusion EXPLAIN output is identical)"
  - "Documentation complete with standalone and distributed examples"
  - "Platform discoverable via benchbox run --platform ballista"

open_questions:
  - "How should we handle the build-from-source requirement? Options: (a) document Rust/maturin setup, (b) pre-build wheels in CI, (c) vendor a wheel, (d) wait for official PyPI release"
  - "Should we target the BallistaBuilder API (older, more documented) or BallistaSessionContext (newer)?"
  - "Does the new-connection-per-request limitation (issue #1142) impact benchmark timing accuracy?"
  - "Should we support a Docker Compose deployment mode for integration testing?"
  - "Can Ballista register Delta Lake and Iceberg tables, or only Parquet/CSV/JSON?"
  - "What is the performance overhead of standalone mode vs direct DataFusion?"
  - "How do we handle DataFusion/Ballista version alignment in pyproject.toml when ballista isn't on PyPI?"

