    description: |
      Clone apache/datafusion-ballista, build Python bindings using maturin
      (requires Rust toolchain). Test BallistaBuilder standalone mode, document
      available configuration options, and verify API compatibility with DataFusion's
      SessionContext. Confirm that ctx.sql() returns compatible DataFrame objects.
      Document the build process for contributors and CI. Evaluate both
      BallistaBuilder and BallistaSessionContext APIs for suitability.
    status: pending

  - id: w2
    summary: "Create BallistaAdapter class with standalone and remote connection modes"
    description: |
      Create benchbox/platforms/ballista.py with BallistaAdapter extending PlatformAdapter.
      Implement create_connection() using BallistaBuilder for both standalone (local) and
      remote (scheduler) deployment modes. Reuse DataFusionConnectionCompat and
      DataFusionCursorCompat wrappers since the SessionContext API is identical.
      Add CLI arguments: --ballista-scheduler-host, --ballista-scheduler-port,
      --ballista-mode (standalone/remote), --ballista-data-dir.
    status: pending
    needs: [w1]

  - id: w3
    summary: "Implement data loading for standalone mode (local filesystem)"
    description: |
      Implement create_schema() and bulk_load_table() for standalone mode where data
      files are on the local filesystem. Reuse DataFusion's register_parquet/register_csv
      approach. Support the existing DataFusion write transformer for COPY-to-external-table
      conversion. This should closely mirror DataFusionAdapter's data loading logic.
    status: pending
    needs: [w2]

  - id: w4
    summary: "Implement data loading for distributed mode (shared storage)"
    description: |
      Extend data loading to support shared storage URIs (s3://, gs://, file://) for
