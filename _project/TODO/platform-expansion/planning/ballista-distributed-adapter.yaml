      storage prefix (--ballista-storage-prefix). Handle table registration with remote
      paths. This is the primary differentiator from the DataFusion adapter.
    status: pending
    needs: [w3]

  - id: w5
    summary: "Wire up query transformer and plan parser reuse"
    description: |
      Import and reuse DataFusionQueryTransformer for TPC-H query compatibility.
