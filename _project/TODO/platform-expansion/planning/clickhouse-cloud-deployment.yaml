id: clickhouse-cloud-deployment
title: "ClickHouse Cloud Deployment Mode"
worktree: platform-expansion
priority: Medium
status: In Progress
category: Platform Expansion
description: |
  Add ClickHouse Cloud deployment mode to the existing ClickHouse adapter,
  enabling benchmarking of ClickHouse's managed cloud service via the
  clickhouse:cloud syntax.

  This completes the ClickHouse platform family: local (chDB), server
  (self-hosted), and cloud (managed).

context_sections:
  "Background and Motivation": |
    ClickHouse Cloud is ClickHouse Inc's managed offering:
    - Fully managed ClickHouse clusters
    - Pay-per-query pricing model
    - Cloud-native storage and compute separation
    - OAuth and API key authentication

    Adding cloud support enables users to compare self-hosted ClickHouse
    performance with the managed service.

  "Technical Context": |
    ClickHouse Cloud uses the same wire protocol as self-hosted ClickHouse,
    so the adapter changes are primarily around:
    - Authentication (OAuth, API keys vs password)
    - Endpoint configuration (cloud hostnames)
    - Cloud storage for data loading
    - Result caching behavior

metadata:
  tags:
  - platform-adapter
  - clickhouse
  - cloud
  - deployment-modes
  estimated_effort: "2-3 days"
  created_date: "2026-01-14"

  related:
  - migrate-clickhouse-firebolt-deployment
  migration_review_required: true
impact:
  business_value: |
    Enables comparison of self-hosted vs managed ClickHouse, helping users
    make informed decisions about deployment options and cost tradeoffs.
  user_impact: |
    Users can benchmark ClickHouse Cloud alongside self-hosted ClickHouse
    using the same benchmark suite and methodology.

files_affected:
  modified:
  - "benchbox/platforms/clickhouse/adapter.py"
  - "benchbox/core/platform_registry.py"
  added:
  - "benchbox/platforms/credentials/clickhouse_cloud.py"
  removed: []
technical_requirements:
  dependencies:
  - "clickhouse-driver (existing)"
  constraints:
  - "Requires ClickHouse Cloud account for testing"
  - "Cloud storage (S3/GCS) required for data loading"

must_preserve:
- "All existing platform adapter tests pass: uv run -- python -m pytest tests/unit/platforms/ -v --tb=short"
- "Platform registry autodiscovery continues working for all existing platforms"
- "Existing clickhouse:server and chdb modes unchanged"
- "Existing ClickHouse unit and integration tests continue to pass"

anti_patterns:
- "DO NOT break existing ClickHouse self-hosted modes (server, chdb) — because self-hosted users must not be affected — add
  cloud mode as a new code path alongside existing modes"
- "DO NOT refactor existing ClickHouse connection logic — because server and chdb modes are stable — add cloud authentication
  as an additional branch"
- "DO NOT require cloud credentials for non-cloud modes — because self-hosted users should not need cloud configuration —
  gate cloud config behind deployment mode checks"

verification:
- description: "Cloud module imports correctly"
  command: "uv run -- python -c \"from benchbox.platforms.credentials.clickhouse_cloud import *; print('import OK')\""
  expected_output: "import OK"
- description: "ClickHouse adapter unit tests pass"
  command: "uv run -- python -m pytest tests/unit/platforms/test_clickhouse_adapter.py -v --tb=short"
  expected_output: "all tests pass, 0 failures"
- description: "Existing platform tests unaffected"
  command: "uv run -- python -m pytest tests/unit/platforms/ -v --tb=short"
  expected_output: "all tests pass, 0 failures"

scope_limit:
  only_modify:
  - "benchbox/platforms/clickhouse/"
  - "benchbox/platforms/credentials/clickhouse_cloud.py"
  - "benchbox/core/platform_registry.py"
  - "tests/unit/platforms/test_clickhouse_adapter.py"
  do_not_modify:
  - "benchbox/platforms/duckdb.py"
  - "benchbox/platforms/firebolt.py"
  - "benchbox/core/runner.py"

success_metrics:
- "clickhouse:cloud connects successfully"
- "Data loading via cloud storage works"
- "TPC-H benchmark runs at scale 0.1"
- "Results comparable with self-hosted ClickHouse"
- "Authentication works via API key and OAuth"
