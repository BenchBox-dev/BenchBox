id: questdb-timeseries-platform
title: "Add QuestDB time-series database platform support"
worktree: platform-expansion
priority: Medium
status: Not Started
description: |
  Integrate QuestDB as a supported BenchBox platform. QuestDB is a high-performance
  open-source time-series database (Apache 2.0 license) optimized for fast ingestion
  and SQL queries over time-series data. It has strong adoption in financial services,
  IoT, and observability use cases (14K+ GitHub stars).

  Technical fit analysis:
  - PostgreSQL wire protocol support (port 8812) - can use psycopg2/asyncpg
  - Standard SQL support with time-series extensions (SAMPLE BY, LATEST ON)
  - SQLGlot may need custom dialect or 'postgres' with adjustments
  - High-performance InfluxDB Line Protocol (ILP) ingestion endpoint
  - REST API for queries and data import (CSV upload)
  - Columnar storage with SIMD-optimized execution

  Strategic value:
  - Fills gap in time-series database coverage (alongside TimescaleDB, InfluxDB)
  - Enables benchmarking time-series specific workloads and ingestion rates
  - Growing adoption in real-time analytics and financial data scenarios
  - Complements existing OLAP platforms with specialized time-series focus

  Note: QuestDB's strengths are in time-series workloads; TPC-H/TPC-DS may not
  showcase its optimal use case. Consider time-series specific benchmarks as
  future enhancement.

category: Platform Expansion

metadata:
  tags:
  - questdb
  - timeseries
  - columnar
  - platform
  - postgres-protocol
  - ilp
  estimated_effort: Medium
  created_date: "2026-01-18"

  related:
  - timescaledb-cloud-deployment
  migration_review_required: true
impact:
  business_value: |
    QuestDB represents the growing time-series database market. Supporting it
    expands BenchBox's relevance to users in financial services, IoT, and
    observability who need to benchmark time-series workloads.
  user_impact: |
    Users running QuestDB deployments can benchmark their systems with
    TPC-H workloads and compare against other platforms. Future time-series
    specific benchmarks would further enhance value.
  technical_debt: |
    Clean implementation following established patterns. May require
    dialect investigation if postgres dialect needs customization.

technical_requirements:
  constraints:
  - "Requires QuestDB instance accessible on port 8812 (PG wire protocol)"
  - "REST API available on port 9000 for CSV imports"
  - "No embedded/local mode available (Docker recommended for testing)"
  - "Time-series focus may affect TPC query performance characteristics"
  dependencies:
  - "psycopg2 (PostgreSQL client for PG wire protocol)"
  - "requests (for REST API data import)"
  compatibility: |
    - Python 3.10+
    - QuestDB 7.0+ (recent stable version)
    - SQLGlot 23+ (postgres dialect or custom handling)

files_affected:
  modified:
  - benchbox/platforms/__init__.py
  - benchbox/core/platform_registry.py
  - pyproject.toml
  added:
  - benchbox/platforms/questdb.py
  - tests/unit/platforms/test_questdb_adapter.py
  - tests/integration/platforms/test_questdb_smoke.py
  - docs/platforms/questdb.md
  - examples/getting_started/sql/questdb_tpch.py

success_metrics:
- "QuestDB adapter passes all unit tests"
- "TPC-H SF=0.01 completes successfully with correct row counts"
- "Platform appears in CLI wizard and --help output"
- "Documentation published on docs site"

open_questions:
- "Does SQLGlot postgres dialect work for QuestDB or is custom dialect needed?"
- "Should we implement time-series specific benchmarks (ingestion rate, SAMPLE BY queries)?"
- "What partitioning strategy works best for TPC-H tables in QuestDB?"
- "Should we support QuestDB Cloud managed service?"

context_sections:
  "QuestDB Architecture": |
    QuestDB uses a columnar storage model optimized for time-series:
    - Designated timestamp column for time-based ordering
    - Partitioning by time intervals (DAY, MONTH, YEAR)
    - Symbol type for efficient low-cardinality string storage
    - SIMD-optimized query execution

  "Data Loading Options": |
    Multiple ingestion methods available:
    1. REST API /imp endpoint - CSV/JSON upload (recommended for BenchBox)
    2. InfluxDB Line Protocol - high-speed streaming ingestion
    3. PostgreSQL COPY command - standard PG bulk loading
    4. INSERT statements - standard SQL approach

  "Time-Series Extensions": |
    QuestDB extends SQL with time-series specific features:
    - SAMPLE BY: Time-based aggregation (e.g., SAMPLE BY 1h)
    - LATEST ON: Latest value per group
    - ASOF JOIN: Time-based joins for event correlation
    - Timestamp arithmetic and functions
