  summary: "Create migration benchmark script with heap load, conversion timing, and columnstore re-query"
  status: done

- id: w2
  summary: "Add storage size collection (pg_total_relation_size) before and after conversion"
  needs: [w1]
  status: done

- id: w3
  summary: "Output results in BenchmarkResults v2.0 format for use with PlatformComparison"
  needs: [w1]
  status: done
