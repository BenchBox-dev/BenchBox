context_sections:
  "Background and Motivation": |
    PostgreSQL is the world's most advanced open source relational database,
    widely used in enterprise environments. BenchBox already has a PostgreSQL
    adapter, but it hasn't been promoted to first-class status with full
    documentation, examples, and verified benchmark compatibility.

    First-class platforms in BenchBox have:
    - Dedicated documentation page
    - Example scripts for common benchmarks
    - CLI integration with platform-specific options
    - Tuning profiles for optimal performance
    - CI integration for regression testing

  "Technical Context": |
    **Current Implementation:**
    - File: benchbox/platforms/postgresql.py
    - Driver: psycopg2 (DB-API 2.0 compliant)
    - Bulk loading: COPY command for efficient data ingestion
    - SQLGlot dialect: "postgres" (fully supported)

    **PostgreSQL OLAP Tuning:**
    Key GUC parameters for analytical workloads:
    - work_mem: Memory for sorts/hashes (increase for OLAP)
    - shared_buffers: Buffer pool size
    - effective_cache_size: Planner hint for available cache
    - random_page_cost: Lower for SSDs
    - max_parallel_workers_per_gather: Parallel query execution

technical_requirements:
  constraints:
    - "Must work with PostgreSQL 12+ (current LTS versions)"
    - "psycopg2-binary or psycopg2 as driver (not psycopg3 yet)"
    - "COPY command required for bulk loading (not row-by-row INSERT)"
    - "Superuser not required but COPY FROM STDIN needs appropriate permissions"
  dependencies:
    - "psycopg2-binary>=2.9.0 (or psycopg2 with libpq)"
  compatibility: |
    PostgreSQL versions: 12, 13, 14, 15, 16, 17
    Docker testing: postgres:16-alpine image
    Cloud managed: AWS RDS, Azure Database, GCP Cloud SQL, Supabase

