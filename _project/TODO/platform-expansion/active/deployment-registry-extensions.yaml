title: "Platform Deployment Registry Extensions"
worktree: platform-expansion
priority: High
status: In Progress
category: Core Functionality
description: |
  Extend the PlatformRegistry to support deployment mode awareness, enabling BenchBox
  to model platforms with local/remote/managed variants (e.g., DuckDB → MotherDuck,
  ClickHouse local → ClickHouse Cloud).

  This is the foundational work that enables the deployment dimension architecture,
  following the successful pattern of the SQL/DataFrame split. The registry will
  declare deployment capabilities per platform, allowing the factory and CLI to
  route to appropriate adapters.

context_sections:
  "Background and Motivation": |
    BenchBox currently has no way to express relationships between platforms like:
    - DuckDB (local) → MotherDuck (managed cloud)
    - ClickHouse (chDB local) → ClickHouse Cloud (managed) → ClickHouse self-hosted
    - Trino (self-hosted) → Starburst (managed) → Athena (managed)

    Each variant would be a completely separate platform with no inheritance of
    SQL dialect, benchmark compatibility, or configuration. This makes it difficult
    to compare local vs cloud performance of the same engine.

  "Technical Context": |
    The existing SQL/DataFrame split provides the pattern to follow:
    - PlatformCapability dataclass with supports_sql, supports_dataframe, default_mode
    - Registry metadata declares capabilities
    - Factory routes based on mode

    We extend this with deployment awareness:
    - New DeploymentCapability dataclass
    - Extended PlatformCapability with deployment_modes dict
    - Platform family concept for dialect inheritance

