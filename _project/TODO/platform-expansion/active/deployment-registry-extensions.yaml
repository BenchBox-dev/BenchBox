metadata:
  tags:
    - architecture
    - platform-registry
    - deployment-modes
  estimated_effort: "3-4 days"
  created_date: "2026-01-14"

impact:
  business_value: |
    Enables systematic comparison of local vs cloud variants of the same database
    engine, a key differentiator for BenchBox. Users can benchmark DuckDB locally
    then compare with MotherDuck cloud with minimal configuration changes.
  user_impact: |
    Users gain the ability to select deployment modes via intuitive naming
    (clickhouse:cloud, firebolt:core) and compare performance across deployment
    variants with consistent benchmark methodology.
  technical_debt: |
    Establishes clean architectural foundation for deployment awareness, avoiding
    ad-hoc mode handling patterns currently in ClickHouse and Firebolt adapters.

