id: pg-extension-advanced-benchmarking
title: "Advanced pg_mooncake and pg_duckdb Benchmarking Features"
worktree: platform-expansion
priority: Medium-High
status: In Progress
category: Platform Expansion
description: |
  Advanced benchmarking features for PostgreSQL extension adapters that go
  beyond basic query execution.

  From pg-mooncake-platform-adapter (completed 2026-02-15):
  - Data type compatibility matrix documentation
  - Heap-to-columnstore migration benchmarking (measuring conversion overhead)

  From pg-duckdb-platform-adapter (completed 2026-02-15):
  - pg_duckdb vs native DuckDB automated comparison reports

  These are benchmarking enhancements, not integration tests (those are in
  cloud-integration-test-infrastructure).

context_sections:
  "pg_mooncake Type Evolution": |
    pg_mooncake is actively evolving; type support changes frequently across
    releases. A compatibility matrix would need to be version-tagged and
    maintained. The heap-to-columnstore migration benchmark measures the
    overhead of converting existing PostgreSQL heap tables to pg_mooncake's
    columnstore format.

  "pg_duckdb Comparison": |
    pg_duckdb runs DuckDB inside PostgreSQL. Comparing it to native DuckDB
    reveals the overhead of the PostgreSQL integration layer. This comparison
    needs structured output showing per-query timing differences.

metadata:
  tags:
  - pg-extensions
  - pg-mooncake
  - pg-duckdb
  - benchmarking
  - deferred-followup
  estimated_effort: "Small — 1-2 days"
  created_date: "2026-02-18"
  split_from_multiple:
  - pg-mooncake-platform-adapter
  - pg-duckdb-platform-adapter

files_affected:
  modified:
  - "benchbox/platforms/pg_mooncake.py"
  - "benchbox/platforms/pg_duckdb.py"

verification:
- description: "Existing pg_mooncake tests still pass after any changes"
  command: "uv run -- python -m pytest tests/unit/platforms/test_pg_mooncake_adapter.py -x -q"
  expected_output: "all tests pass, 0 failures"
- description: "Existing pg_duckdb tests still pass after any changes"
  command: "uv run -- python -m pytest tests/unit/platforms/test_pg_duckdb_adapter.py -x -q"
  expected_output: "all tests pass, 0 failures"

must_preserve:
- "pg_mooncake adapter: existing query execution, connection management, and TPC-H/TPC-DS run paths"
- "pg_duckdb adapter: existing query execution and schema load paths"

approach: |
  - For w1: emit the compatibility matrix as a YAML file at
    benchbox/platforms/pg_mooncake_type_compat.yaml, version-tagged. Read the
    pg_mooncake changelog/release notes for the version in use to enumerate
    supported column types. Do not modify the adapter itself.
  - For w2: add an optional MigrationPhase dataclass to benchbox/core/results/models.py
    (alongside existing SetupPhase fields). In pg_mooncake.py, add a run_migration_phase()
    method that executes ALTER TABLE ... SET ACCESS METHOD columnar, records wall time
    and storage delta, and returns a MigrationPhase instance or None. The runner skips
    this phase when not configured — use the NOT_RUN stub pattern (status="not_run",
    duration_ms=0) already present in benchbox/core/runner/runner.py (LifecyclePhases).
    Update _build_phases_block() in schema.py to conditionally include the migration
    phase using the "Omit Empty" principle.
  - For w3: add a NativeComparison dataclass to benchbox/core/results/models.py with
    a list of per-query delta entries {query_id, pg_duckdb_ms, duckdb_ms, delta_ms}.
    In pg_duckdb.py, add an optional run_native_comparison() method triggered by a
    --platform-option compare_native=true flag. Serialize via a new top-level
    "comparisons" key in schema.py using the "Omit Empty" pattern (omit if None).
    Do NOT add --compare-native as a top-level CLI flag — use the existing
    --platform-option K=V mechanism already in benchbox run.

anti_patterns:
- "DO NOT modify pg_mooncake or pg_duckdb connection/auth code — these are read-only
   enhancements; touching connection paths risks breaking live adapters with no
   benefit"
- "DO NOT hardcode type lists for w1 — pull from pg_mooncake release notes or a
   live information_schema query, so the matrix stays accurate across versions"

scope_limit:
  only_modify:
  - "benchbox/platforms/pg_mooncake.py"
  - "benchbox/platforms/pg_mooncake_type_compat.yaml"
  - "benchbox/platforms/pg_duckdb.py"
  - "benchbox/core/results/models.py"
  - "benchbox/core/results/schema.py"
  - "tests/unit/platforms/test_pg_mooncake_adapter.py"
  - "tests/unit/platforms/test_pg_duckdb_adapter.py"

work:
- id: w1
  summary: "Write pg_mooncake type compatibility matrix to pg_mooncake_type_compat.yaml
    — enumerate supported column types for the pinned version from release notes"
  status: done
  needs: []

- id: w2
  summary: "Add optional migration phase to pg_mooncake adapter — ALTER TABLE heap→columnar,
    record wall time and storage delta, emit as a phase result in the result bundle"
  status: done
  needs: []

- id: w3
  summary: "Add pg_duckdb vs native DuckDB comparison output — run identical TPC-H queries
    on both platforms, write per-query timing delta JSON into the result bundle"
  status: done
  needs: []
