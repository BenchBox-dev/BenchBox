  migration_review_required: true
impact:
  business_value: |
    Apache Doris is a top-level Apache project with massive adoption in China
    and growing international presence. Supporting it expands BenchBox's
    relevance to a large user base and enables comparative analysis with
    StarRocks (shared heritage, different evolution paths).
  user_impact: |
    Users running Apache Doris deployments can benchmark their systems with
    industry-standard TPC-H/TPC-DS workloads. Comparative analysis against
    StarRocks, ClickHouse, and other platforms becomes straightforward.
  technical_debt: |
    Clean implementation following established patterns (very similar to
    StarRocks adapter due to shared heritage). No technical debt expected.

technical_requirements:
  constraints:
  - "Requires Doris FE node accessible on port 9030 (MySQL protocol)"
  - "Stream Load requires access to FE/BE nodes (HTTP port 8030)"
  - "No embedded/local mode available (Docker recommended for testing)"
  dependencies:
  - "pymysql (Python MySQL client)"
  - "requests (for Stream Load HTTP API)"
  compatibility: |
    - Python 3.10+
    - Apache Doris 2.0+ (vectorized execution engine)
    - SQLGlot 23+ (official doris dialect)

files_affected:
  modified:
  - benchbox/platforms/__init__.py
  - benchbox/core/platform_registry.py
  - pyproject.toml
  added:
  - benchbox/platforms/doris.py
  - tests/unit/platforms/test_doris_adapter.py
  - tests/integration/platforms/test_doris_smoke.py
  - docs/platforms/doris.md
  - examples/getting_started/sql/doris_tpch.py

must_preserve:
- "All existing platform adapter tests pass: uv run -- python -m pytest tests/unit/platforms/ -v --tb=short"
- "Platform registry autodiscovery continues working for all existing platforms"
- "ClickHouse adapter's PyMySQL usage unaffected by Doris's PyMySQL dependency"

anti_patterns:
- "DO NOT modify existing adapter files — because Doris is additive — create a new doris.py file"
- "DO NOT create a shared DorisStarRocksBase class — because the projects have diverged and coupling creates fragile inheritance
  — implement independently"
- "DO NOT conflict with ClickHouse's PyMySQL usage — because both platforms use PyMySQL on different ports — ensure connection
  configuration is fully isolated"

verification:
- description: "New adapter imports correctly"
  command: "uv run -- python -c \"from benchbox.platforms.doris import DorisAdapter; print('import OK')\""
  expected_output: "import OK"
- description: "Unit tests pass"
  command: "uv run -- python -m pytest tests/unit/platforms/test_doris_adapter.py -v --tb=short"
  expected_output: "all tests pass, 0 failures"
- description: "Existing platform tests unaffected"
  command: "uv run -- python -m pytest tests/unit/platforms/ -v --tb=short"
  expected_output: "all tests pass, 0 failures"

scope_limit:
  only_modify:
  - "benchbox/platforms/doris.py"
  - "benchbox/platforms/credentials/doris.py"
  - "tests/unit/platforms/test_doris_adapter.py"
  do_not_modify:
  - "benchbox/platforms/clickhouse/"
  - "benchbox/platforms/starrocks.py"
  - "benchbox/core/runner.py"

success_metrics:
- "Doris adapter passes all unit tests"
- "TPC-H SF=0.01 completes successfully with correct row counts"
- "TPC-DS SF=1 completes all 99 queries"
- "Platform appears in CLI wizard and --help output"
- "Documentation published on docs site"

open_questions:
- "Should we support VeloDB Cloud and/or SelectDB Cloud APIs for managed deployments?"
- "Should we implement materialized view benchmarking as an advanced feature?"
- "What's the optimal colocate group configuration for TPC joins?"
- "Should we share code between Doris and StarRocks adapters given common heritage?"
- "Which cloud provider(s) should be prioritized for managed Doris testing (VeloDB on AWS, SelectDB, ApsaraDB)?"

context_sections:
  "Managed Doris Ecosystem": |
    Multiple commercial offerings built on Apache Doris by core contributors:

    **VeloDB** (velodb.io) - Founded May 2023 by original Doris contributors
    - 50% of Doris PMC and committers onboard
    - Products: VeloDB Cloud (fully managed), VeloDB Enterprise (on-premise)
    - Available on AWS, GCP, Azure
    - Decoupled storage-compute architecture with elastic scaling
    - Hosts Apache Doris Summit

    **SelectDB** (selectdb.com) - Built by core Doris developers
    - Cloud-native real-time data warehouse service
    - Available on multiple cloud providers
    - ApsaraDB for SelectDB on Alibaba Cloud (ranks top in ClickBench)
    - 50% lower TCO claimed vs self-managed

    Both vendors remain major contributors to the open-source Apache Doris
    project. For BenchBox, self-hosted Doris should work with any managed
    service using standard MySQL protocol (port 9030).

  "Doris vs StarRocks": |
    Apache Doris and StarRocks share common ancestry (Doris was the original,
    StarRocks forked in 2020). Key differences today:
    - Doris: Apache governance, larger community, more enterprise features
    - StarRocks: Faster release cycle, more aggressive optimization focus
    - Both: MySQL protocol, similar DDL, Stream Load API

    BenchBox supporting both enables meaningful comparison.

  "Performance Positioning": |
    Apache Doris claims strong performance in OLAP workloads:
    - Vectorized execution engine (Doris 2.0+)
    - Columnar storage with efficient compression
    - Cost-based query optimizer
    - Real-time data ingestion support

    Independent BenchBox verification provides objective comparison.

  "Data Loading Strategy": |
    Recommended approach for BenchBox:
    1. Stream Load (HTTP PUT) for CSV files - primary method
    2. Broker Load for cloud storage (S3, HDFS) scenarios
    3. INSERT INTO SELECT for transformations
    4. Standard INSERT for small datasets/testing

    Stream Load endpoint: http://{fe_host}:8030/api/{database}/{table}/_stream_load

  "Table Model Selection": |
    Doris supports multiple table models:
    - Duplicate: All rows stored, best for append-only logs
    - Aggregate: Pre-aggregated on key columns, good for metrics
    - Unique: Deduplication on key columns, good for updates
    - Primary: Merge-on-read with updates, good for CDC

    For TPC-H: Duplicate model recommended for most tables.
