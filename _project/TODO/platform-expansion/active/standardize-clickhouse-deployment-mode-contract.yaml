must_preserve:
- "Canonical ClickHouse deployment selection via `deployment_mode=local|server` continues working through the modern adapter-factory and platform-defaults path"
- "Legacy config inputs such as `mode=server` and `mode=embedded` remain readable during the transition, but are normalized to canonical values internally"
- "ClickHouse Cloud remains a separate platform family entry via `clickhouse-cloud`; this cleanup must not reintroduce cloud as a base ClickHouse deployment mode"

approach: |
  Start from the already-correct canonical surface in
  `benchbox/cli/platform_defaults.py` and the current ClickHouse platform option
  registration, then push that contract outward to older compatibility layers.
  Add one normalizer in the ClickHouse package, reuse it at the adapter and
  metadata boundary, and migrate helper outputs to canonical `deployment_mode`
  writes.

  Treat docs and tests as part of the contract, not cleanup afterthoughts. The
  CLI currently uses global `--mode` for execution mode, so ClickHouse docs must
  stop teaching deployment selection through that flag. Update tests to lock in
  both the canonical path and the temporary compatibility shims.

anti_patterns:
- "DO NOT globally rename `DeploymentCapability.mode` in `benchbox/core/platform_registry.py` — because that field represents a generic deployment category, not the ClickHouse adapter config key — only fix ClickHouse-specific selectors, examples, and docs"
- "DO NOT keep teaching `--mode=local` or `embedded mode` in ClickHouse docs/help text — because the global `--mode` flag now means execution mode and the old wording is actively misleading — use `deployment_mode` or `clickhouse:local/server` guidance instead"
- "DO NOT reintroduce `cloud` as a deployment mode on the base ClickHouse adapter — because the dedicated `clickhouse-cloud` platform is already the canonical managed-service entry point — keep cloud guidance separate"

verification:
- description: "Config and CLI tests cover canonical `deployment_mode` behavior plus legacy compatibility shims"
  command: "uv run -- python -m pytest tests/unit/core/test_config_utils.py tests/unit/cli/test_example_argument_parser.py tests/unit/cli/test_platform.py tests/unit/platforms/test_adapter_factory_deployment.py -q"
  expected_output: "All targeted config and CLI tests pass"
- description: "ClickHouse adapter, diagnostics, metadata, and local-mode tests pass with standardized deployment naming"
  command: "uv run -- python -m pytest tests/unit/platforms/test_clickhouse_adapter.py tests/unit/platforms/test_clickhouse_diagnostics.py tests/unit/platforms/test_clickhouse_local.py tests/unit/platforms/test_platform_info.py -q"
  expected_output: "All targeted ClickHouse unit tests pass"
- description: "Stale ClickHouse docs no longer teach deployment selection via the global `--mode` flag"
  command: "rg -n -- '--mode=local|--mode=server' docs/platforms/clickhouse-local-mode.md docs/platforms/deployment-modes.md docs/platforms/index.md"
  expected_output: "No matches"
- description: "Base-platform examples no longer present `clickhouse:cloud` as the ClickHouse deployment selector"
  command: "rg -n -- 'clickhouse:cloud' benchbox/cli/commands/run.py benchbox/cli/platform.py benchbox/core/platform_registry.py"
  expected_output: "No matches"

