open_questions:
- "Should diagnostics emit both `deployment_mode` and `mode` for one release, or switch immediately once tests/docs are updated?"
- "Should the legacy `--mode` alias in `benchbox/cli/config.py` emit a deprecation warning now, or remain silent until a broader CLI-compat cleanup?"
