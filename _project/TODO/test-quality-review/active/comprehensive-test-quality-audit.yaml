impact:
  business_value: |
    A clean, purposeful test suite improves developer velocity by:
    - Reducing CI time through elimination of low-value tests
    - Improving confidence that tests catch real regressions
    - Making it easier to identify what's actually tested vs. covered
    - Reducing maintenance burden of test code
  user_impact: |
    Contributors benefit from clearer testing standards and faster CI feedback.
    Fewer flaky or confusing tests makes debugging easier.
  technical_debt: |
    This audit directly addresses accumulated test technical debt. Over time,
    tests accumulate that test obvious things or duplicate coverage. This
    cleanup restores signal-to-noise ratio in the test suite.

success_metrics:
  - "Every test has a documented purpose (docstring or clear naming)"
  - "No tests asserting obvious facts (enum counts, len(list) == N for constants)"
  - "No duplicate tests covering identical behavior"
  - "CI time reduced or maintained despite coverage staying above 80%"
  - "Test quality guidelines documented and referenced in CONTRIBUTING.md"

open_questions:
  - "What's the threshold for 'trivial'? Tests with single assertEqual that doesn't test behavior?"
  - "Should we require mutation testing scores for new tests?"
  - "How aggressive should we be with removal vs. refactoring?"
  - "Should performance tests be moved to a separate workflow?"

context_sections:
  "Anti-Pattern Examples": |
    Examples of tests to identify and remove/refactor:

    1. Enum count tests:
       ```python
       def test_benchmark_type_count():
           assert len(BenchmarkType) == 5  # Breaks when adding new types
       ```

    2. Constant equality:
       ```python
       def test_default_scale_factor():
           assert DEFAULT_SCALE == 0.01  # Duplicates the constant definition
       ```

    3. Tautological tests:
       ```python
       def test_list_creation():
           items = create_items()
           assert isinstance(items, list)  # Already typed; compiler checks this
       ```

    4. Over-specification:
       ```python
       def test_query_format():
           q = generate_query(1)
           assert q.startswith("SELECT")
           assert "FROM" in q
           assert q.endswith(";")  # Tests format, not behavior
       ```

  "Good Test Characteristics": |
    Tests should:
    - Validate behavior that could break
    - Test edge cases and error conditions
    - Prevent known regressions
    - Document expected behavior through assertions
    - Be independent and deterministic
    - Fail if the behavior they test changes

