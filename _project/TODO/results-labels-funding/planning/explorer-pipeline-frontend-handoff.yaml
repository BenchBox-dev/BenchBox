id: "explorer-pipeline-frontend-handoff"
title: "Project funding into read-model views + render the funding chip/legend + e2e"
worktree: "results-labels-funding"
priority: "Medium"
status: "In Progress"
description: |
  Correction (2026-07-07): the explorer pipeline (`_project/scripts/explorer_pipeline/`)
  and the frontend (`results-explorer/`) ARE present in this checkout (they were
  materialized after the plan was written), so this is no longer a hand-off spec —
  it is real in-repo code. The pipeline half is already done and landed in PR
  #1021: ManifestEntry.funding + transformer read, the results.funding column in
  both DuckDBSnapshotBuilder DDLs, EXPLORER_READ_MODEL_VERSION 1->2, the vendor
  subtree -> vendor-supplied/public-vendor-reported derivation, and the
  vendor-supplied TrustBadge mapping.

  What remains is the funding *disclosure surface* the frontend renders. The
  read-model review found that `funding` is only in the base `results` table, NOT
  projected into the read-model VIEWS the frontend queries
  (`result_detail_metrics`, `platform_index_rows`). So the funding chip cannot
  read it yet. Remaining work: project funding into the relevant view(s), render
  a funding chip on cards/detail, add a legend row, and add e2e.

category: "Feature"

decision_gates:
  - id: G-READMODEL-COORD
    gate: >-
      How is the read_model_version bump coordinated with the pipeline populate so
      the DDL, contract.py, and the deployed DB never disagree?
    blocks: []
    outcome: >-
      RESOLVED (PR #1021): EXPLORER_READ_MODEL_VERSION bumped 1->2 in the SAME
      change that added the results.funding column + populate logic;
      test_explorer_build_contract.py + test_duckdb_browser_contract.py are the
      tripwires. Any FURTHER results-column change (e.g. none expected here — the
      view work below adds no base-table columns) would need another bump.

prior_art:
  - "_project/scripts/explorer_pipeline/duckdb_builder.py result_detail_metrics + platform_index_rows view DDLs — extend (add funding projection; the base results.funding column already exists)"
  - "docs/development/browser-duckdb-schema.sql result_detail_metrics (~169) + platform_index_rows (~263) views — extend (mirror the builder view change)"
  - "tests/unit/scripts/explorer_pipeline/test_duckdb_browser_contract.py EXPECTED_VIEWS — extend (add funding to whichever view(s) now project it; the results-table set already asserts funding)"
  - "results-explorer/src/components/TrustBadge.tsx + StatusBadge.tsx — reference (done vendor badge; reuse the StatusBadge/chip pattern for the funding chip)"
  - "docs/development/results-explorer-brand-ownership.md + results-explorer-token-scan.md — reference (chip color must use an approved design token; the token scan gate at tests/unit/scripts/test_scan_explorer_tokens.py will fail on ad-hoc colors)"
  - "benchbox/core/results/provenance.py FUNDING_SOURCES + display strings — reference (the chip's label/tooltip text; do not re-list the enum in TS)"

work:
  - id: w1
    summary: >-
      Pipeline populate + vendor derivation + read_model_version bump (results.funding
      column, transformer read, vendor subtree label, contract v2).
    notes: >-
      DONE in PR #1021. Kept here as the completed foundation the remaining
      units build on.
    status: done
  - id: w2
    summary: >-
      Project results.funding into the read-model view(s) the frontend queries
      (result_detail_metrics, and platform_index_rows if the index shows it).
    notes: >-
      Add funding to the view DDL in duckdb_builder.py AND browser-duckdb-schema.sql
      (bare-column projection, G-11 rule), and add funding to the matching
      EXPECTED_VIEWS set in test_duckdb_browser_contract.py. No new base-table
      column, so no read_model_version bump.

      DONE in PR #1080: r.funding added to result_detail_metrics in
      duckdb_builder.py + browser-duckdb-schema.sql; EXPECTED_VIEWS guards it.
    needs: [w1]
    status: done
  - id: w3
    summary: >-
      Render a funding chip on the detail page (ResultDetail.tsx), reading funding
      from result_detail_metrics; add a legend row explaining chip + vendor badge.
    notes: >-
      DONE: funding threaded through duckdbQueries.ts
      (RESULT_DETAIL_METRICS_COLUMNS + ResultDetailMetricsRow + the DetailResult
      mapping) and types.ts; new FundingChip.tsx renders via the StatusBadge
      primitive with a new StatusRole "funding" and a uniform `neutral` tone (a
      tone gradient would re-encode funding as a trust signal); 'unspecified'
      renders NO chip; formatFunding() added to displayLabels.ts. New
      ProvenanceLegend.tsx satisfies the hosted-results-contract legend rule and
      pulls its prose from trustLabelDescription()/fundingDescription() so it
      cannot drift from the badges. SCOPE: detail page only - see w5 for the
      card-level chip.
    needs: [w2]
    status: done
  - id: w4
    summary: >-
      Add results-explorer e2e (results-explorer/e2e/) for the funding chip +
      legend; update any legend-set smoke. Needs a node env.
    notes: >-
      DONE: results-explorer/e2e/routes/funding-disclosure.spec.ts covers chip
      render, chip omission on 'unspecified', neutral tone, trust/funding
      orthogonality, and the legend (reachable + expands to explain both axes).
      The browser fixture corpus gained its first funding-disclosing bundle: the
      `community` variant in scripts/generate-browser-fixtures.mjs now declares
      provenance.funding=employer, so community-submission + employer-funded
      proves the two axes are independent. Unit coverage in
      FundingChip.test.tsx, ProvenanceLegend.test.tsx, ResultDetail.test.tsx.
    needs: [w3]
    status: done
  - id: w5
    summary: >-
      Project funding into the card-level views and render the chip on the
      index/leaderboard/compare surfaces.
    notes: >-
      Deferred out of the w3/w4 PR (detail page only). The cards read
      platform_index_rows / benchmark_rankings / benchmark_matrix_cells, none of
      which project funding. Steps, mirroring exactly what PR #1080 did for
      result_detail_metrics: (1) add a BARE `r.funding` column reference to the
      relevant view DDL in _project/scripts/explorer_pipeline/duckdb_builder.py
      (no computed expression - G-11); (2) mirror it in
      docs/development/browser-duckdb-schema.sql; (3) add "funding" to the
      matching EXPECTED_VIEWS entry in
      tests/unit/scripts/explorer_pipeline/test_duckdb_browser_contract.py. No
      read_model_version bump - the base `results` table already has the column.
      Then render <FundingChip> in the card components and extend
      ProvenanceLegend to those pages (the hosted-results-contract legend rule
      applies to every page that shows the badges).
    needs: [w4]
    status: pending

must_preserve:
  - "test_explorer_build_contract.py + test_duckdb_browser_contract.py stay green."
  - "The DuckDB-in-browser read-only attach + bare-column view rule (G-11) is unchanged — no computation in views."
  - "Existing trust-badge rendering (maintainer/community/vendor) is unchanged; the funding chip is ADDITIVE and orthogonal to the trust badge."
  - "Design-token / stale-theme scans pass — no ad-hoc chip colors."

approach: |
  The pipeline + base-table column already exist, so this is purely the read
  surface: (1) project funding through the view(s) the frontend actually SELECTs
  (result_detail_metrics for the detail page; platform_index_rows only if the
  index card shows funding) - keep it a bare column reference, and mirror the
  change in both the builder DDL and the browser-duckdb-schema.sql doc plus the
  EXPECTED_VIEWS contract test; (2) add the funding chip component reading that
  column; (3) add a legend row; (4) e2e. Frontend unit/e2e tests require
  `npm install` in results-explorer/ (not available in every checkout) - run them
  where node is available.

anti_patterns:
  - "DO NOT add funding to a view as a computed expression - bare column reference only (G-11)."
  - "DO NOT re-list the funding enum or its display text in TypeScript - source it from the read model / a single generated table."
  - "DO NOT conflate the funding chip with the trust badge - they are orthogonal (a vendor result can be employer-funded)."
  - "DO NOT introduce a chip color outside the approved design tokens (token scan will fail)."

verification:
  - description: "Pipeline + build-contract + browser-contract tests pass (correct in-repo paths)"
    command: "uv run -- python -m pytest tests/unit/scripts/explorer_pipeline/ tests/unit/scripts/test_explorer_build_contract.py -q"
    expected_output: "all pass; read_model_version == 2"
  - description: "funding is projected into the detail view"
    command: "uv run -- python -m pytest tests/unit/scripts/explorer_pipeline/test_duckdb_browser_contract.py -q"
    expected_output: "EXPECTED_VIEWS asserts funding in result_detail_metrics"
  - description: "Frontend chip + token scan (where node is available)"
    command: "cd results-explorer && npx vitest run src/components; uv run -- python -m pytest tests/unit/scripts/test_scan_explorer_tokens.py -q"
    expected_output: "chip renders; token scan passes"
  - description: "e2e for funding chip + legend"
    command: "cd results-explorer && npm run test:e2e -- --grep 'funding'"
    expected_output: "chip + legend render"

scope_limit:
  only_modify:
    - "_project/scripts/explorer_pipeline/duckdb_builder.py (view DDLs only)"
    - "docs/development/browser-duckdb-schema.sql (view definitions only)"
    - "tests/unit/scripts/explorer_pipeline/test_duckdb_browser_contract.py"
    - "results-explorer/ (funding chip component, legend, e2e)"
  do_not_modify:
    - "benchbox/ (producer + CLI are items 1-3, done)"
    - "scripts/generate_corpus_inventory.py (item 4, done)"
    - "the results base-table DDL / read_model_version (already at v2; the view work adds no base column)"

impact:
  technical_debt: |
    Completes the user-visible half of the feature (funding disclosure surfaced in
    the UI). Until then funding is captured, validated, inventoried, and stored in
    the read model but not shown to explorer visitors.

success_metrics:
  - "A funded result shows its funding as a chip on the card + detail page; a legend explains it."
  - "result_detail_metrics projects funding and the contract test guards it."

deps:
  needs: ["corpus-inventory-and-read-model"]

delivery_loop:
  create: "Implement w2-w4 within scope_limit; view projection first, then chip, legend, e2e."
  review: "/code-review on the view diff; visual review of the chip; token scan."
  fix: "Resolve findings; re-run browser-contract + frontend tests."
  submit_pr: "PR vs develop using PULL_REQUEST_TEMPLATE.md; cross-link the merged provenance PR(s)."

metadata:
  tags: ["explorer", "read-model", "frontend", "funding", "chip", "e2e"]
