technical_requirements:
  constraints:
    - "Must maintain backward compatibility with existing tuning YAML format"
    - "DDL generation must be idempotent (same config → same DDL)"
    - "Must handle platforms that don't support certain tuning types gracefully"
    - "Generated DDL must pass platform-specific SQL parsers"
  dependencies:
    - "DuckDB 0.10+ for sorting support in table definitions"
    - "Delta Lake 2.0+ for CLUSTER BY support on Databricks"
    - "PostgreSQL 10+ for declarative partitioning"
  compatibility: |
    All generated DDL should be tested against:
    - Local platforms: DuckDB, PostgreSQL, SQLite
    - Cloud platforms: Snowflake, Databricks, BigQuery, Redshift (where credentials available)
    - Connector platforms: Trino/Presto with Hive, Iceberg, Delta connectors

success_metrics:
  - "100% of tuning YAML fields applied to DDL for supported platforms"
  - "All platforms have corresponding DDL generators implementing the protocol"
  - "Dry-run output shows exact DDL that will be executed"
  - "Integration tests pass on at least 5 platforms with actual databases"
  - "Query performance improves measurably on tuned vs untuned for TPC-H Q1, Q6"

open_questions:
  - "Should DDL generators be separate classes or methods on platform adapters?"
  - "How to handle platforms with automatic partitioning (Snowflake micro-partitioning)?"
  - "Should we support CTAS (CREATE TABLE AS SELECT) with tuning for some platforms?"
  - "How to validate that tuning was actually applied post-creation (introspect DDL)?"
  - "Should we generate Iceberg/Delta/Hudi-specific DDL for open table formats?"

impact:
  business_value: |
    Enables accurate performance benchmarking by ensuring tuning configurations
    are actually applied. Users can trust that "tuned" benchmark results reflect
    real platform optimization, not just labeled differently.

  user_impact: |
    - Users get predictable behavior: YAML config → DDL → table creation
    - --dry-run shows exactly what will be created
    - Performance comparisons between tuned/untuned are meaningful

  technical_debt: |
    Eliminates the current inconsistency where tuning configs are defined but
    not applied. Establishes a consistent pattern for DDL generation that
    can be extended to new platforms.

