# Physical Tuning #11: Integration, Testing & Dry-Run Enhancement
#
# Cross-cutting integration work after platform-specific generators are done.

title: "PT-11: Physical Tuning Integration, Testing & Dry-Run Enhancement"
worktree: "physical-tuning"
priority: "Medium"
status: "Not Started"
category: "Testing and Quality Assurance"

description: |
  Final integration work to ensure physical tuning is properly wired through
  the entire system, with comprehensive testing and enhanced dry-run output.

  ## Integration Goals

  1. **Tuning Config → DDL Flow**: Ensure tuning YAML reaches DDL generators
  2. **Dry-Run Enhancement**: Show exact DDL that will be executed
  3. **Result Recording**: Record applied tuning in benchmark results
  4. **Performance Validation**: Measure impact of tuning on query performance

  ## Why This Is Separate

  This TODO depends on all platform-specific DDL generators being complete.
  It handles cross-cutting concerns that span multiple platforms.

context_sections:
  "Current Dry-Run Output": |
    Current `--dry-run` shows:
    - Data generation plan
    - Table list
    - Query list

    **Missing**:
    - Actual CREATE TABLE DDL
    - Tuning clauses that will be applied
    - Platform-specific optimizations

  "Enhanced Dry-Run Output": |
    ```
    $ benchbox run --dry-run ./preview --platform redshift --benchmark tpch --tuning tuned

    ╭─ Dry Run: TPC-H on Redshift ─────────────────────────────────────────────╮
    │                                                                          │
    │ Scale Factor: 1.0                                                        │
    │ Tuning Config: examples/tunings/redshift/tpch_tuned.yaml                │
    │                                                                          │
    │ ══════════════════════════════════════════════════════════════════════  │
    │ DDL PREVIEW                                                              │
    │ ══════════════════════════════════════════════════════════════════════  │
    │                                                                          │
    │ CREATE TABLE lineitem (                                                  │
    │     l_orderkey BIGINT NOT NULL ENCODE az64,                              │
    │     l_partkey BIGINT NOT NULL ENCODE az64,                               │
    │     ...                                                                  │
    │ )                                                                        │
    │ DISTSTYLE KEY                                                            │
    │ DISTKEY (l_orderkey)                                                     │
    │ COMPOUND SORTKEY (l_shipdate, l_orderkey);                               │
    │                                                                          │
    │ -- Tuning Applied:                                                       │
    │ --   Distribution: KEY on l_orderkey                                     │
    │ --   Sort Key: COMPOUND on (l_shipdate, l_orderkey)                      │
    │ --   Encoding: az64 (numeric), lzo (varchar)                             │
    │                                                                          │
    │ CREATE TABLE region (...)                                                │
    │ DISTSTYLE ALL;                                                           │
    │                                                                          │
    │ -- Tuning Applied:                                                       │
    │ --   Distribution: ALL (dimension table)                                 │
    │                                                                          │
    │ ══════════════════════════════════════════════════════════════════════  │
    │ POST-LOAD OPERATIONS                                                     │
    │ ══════════════════════════════════════════════════════════════════════  │
    │                                                                          │
    │ VACUUM SORT ONLY lineitem;                                               │
    │ ANALYZE lineitem;                                                        │
    │                                                                          │
    ╰──────────────────────────────────────────────────────────────────────────╯
    ```

  "Result Recording": |
    Benchmark results should include applied tuning configuration:

    ```json
    {
      "benchmark": "tpch",
      "platform": "redshift",
      "tuning_config": {
        "mode": "tuned",
        "source_file": "examples/tunings/redshift/tpch_tuned.yaml",
        "applied_tunings": {
          "lineitem": {
            "distribution": "KEY(l_orderkey)",
            "sort_key": "COMPOUND(l_shipdate, l_orderkey)"
          },
          "region": {
            "distribution": "ALL"
          }
        },
        "config_hash": "abc123..."
      }
    }
    ```

    This enables:
    - Comparing tuned vs untuned runs
    - Reproducing exact configuration
    - Tracking tuning effectiveness over time

