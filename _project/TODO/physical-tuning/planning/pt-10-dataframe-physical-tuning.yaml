open_questions:
  - "Should write config be in same YAML as runtime config or separate file?"
  - "How to handle platforms that don't support partitioned writes?"
  - "Should we support Iceberg/Delta writes from DataFrame platforms?"

impact:
  business_value: |
    Enables DataFrame platforms to produce optimally-laid-out data files,
    improving downstream query performance regardless of which platform
    ultimately queries the data.

  user_impact: |
    Users can configure physical data layout without switching to SQL platforms.
    Especially valuable for Dask and PySpark users who expect partitioning.

