# Physical Tuning #10: DataFrame Platform Physical Tuning
#
# Extend DataFrame platforms to support write-time physical layout options.

title: "PT-10: DataFrame Platform Physical Tuning (Write-Time Layout)"
worktree: "physical-tuning"
priority: "Medium"
status: "Not Started"
category: "Core Functionality"

description: |
  Extend the DataFrame tuning system to support physical data layout options
  during the write phase (Parquet generation). Currently, DataFrame tuning only
  covers runtime options (threads, memory, streaming). This TODO adds write-time
  physical layout control.

  ## Current State Analysis

  ### Existing DataFrame Tuning (Runtime)
  The current system (`benchbox/core/dataframe/tuning/`) supports:
  - **Parallelism**: thread_count, worker_count, threads_per_worker
  - **Memory**: memory_limit, chunk_size, spill_to_disk, rechunk
  - **Execution**: streaming_mode, engine_affinity, lazy_evaluation
  - **Data Types**: dtype_backend, string_cache, auto_categorize
  - **I/O**: memory_pool, memory_map, pre_buffer, row_group_size
  - **GPU**: device_id, spill_to_host, pool_type

  ### Missing Physical Layout Options
  When DataFrames write to Parquet (during data preparation), there's no
  configuration for:
  - **Partitioning**: Hive-style partition directories
  - **Sorting**: Physical row order within files
  - **Row Group Size**: Control compression/scan efficiency
  - **Repartitioning**: Number of output files
  - **Column Encoding**: Dictionary, RLE, bit-packing per column

  ## Platform Capabilities

  | Platform | Partitioned Write | Sorted Write | Repartition | Row Group Size |
  |----------|-------------------|--------------|-------------|----------------|
  | Polars   | ✗ No              | ✓ sort()     | ✗ No        | ✓ Yes          |
  | Pandas   | ✗ No              | ✓ sort_values| ✗ No        | ✓ Yes          |
  | Dask     | ✓ to_parquet()    | ✗ Limited    | ✓ repartition | ✓ Yes        |
  | PySpark  | ✓ partitionBy()   | ✓ sortBy()   | ✓ repartition | ✓ Yes        |
  | cuDF     | ✗ No              | ✓ sort_values| ✗ No        | ✓ Yes          |
  | Modin    | ✗ No              | ✓ sort_values| ✗ No        | ✓ Via Pandas   |

  ## Why This Matters

  Physical layout affects:
  1. **Query performance**: Sorted data enables skip-scanning
  2. **Compression ratio**: Sorted columns compress better
  3. **Partition pruning**: Hive partitions reduce scan scope
  4. **Parallel reads**: Multiple files enable parallel loading

context_sections:
  "Current Write Flow": |
    Data preparation uses `convert_csv_to_parquet()` in `benchbox/core/dataframe/data_loader.py`:

    ```python
    def convert_csv_to_parquet(
        csv_path: Path,
        parquet_path: Path,
        schema: dict[str, str],
        compression: str = "zstd",
    ) -> tuple[bool, int]:
        # Uses PyArrow directly
        pq.write_table(
            table,
            parquet_path,
            compression=compression,
            use_dictionary=True,  # Fixed
        )
    ```

    **Limitations**:
    - No sorting before write
    - No partitioning
    - Row group size not configurable
    - No per-column encoding control

  "Proposed Architecture": |
    ```python
    @dataclass
    class DataFrameWriteConfiguration:
        """Physical layout options for DataFrame writes."""

        # Partitioning (Hive-style directories)
        partition_by: list[str] | None = None
        partition_strategy: Literal["value", "date_year", "date_month"] = "value"

        # Sorting (physical row order)
        sort_by: list[tuple[str, Literal["asc", "desc"]]] | None = None

        # File layout
        row_group_size: int | None = None  # Default ~128MB worth
        target_file_size_mb: int = 128
        repartition_count: int | None = None  # Number of output files

        # Compression
        compression: str = "zstd"
        compression_level: int | None = None

        # Encoding
        dictionary_columns: list[str] | None = None  # Explicit dict encoding
        skip_dictionary_columns: list[str] | None = None

    class DataFrameWriteTuningType(Enum):
        """Tuning types for DataFrame write operations."""
        PARTITION_BY = "partition_by"
        SORT_BY = "sort_by"
        ROW_GROUP_SIZE = "row_group_size"
        REPARTITION = "repartition"
        COMPRESSION = "compression"
    ```

  "YAML Configuration Example": |
    ```yaml
    # DataFrame write tuning (new section in tuning YAML)
    dataframe_write:
      # Sort data before writing (improves compression & scans)
      sort_by:
        - column: l_shipdate
          order: asc
        - column: l_orderkey
          order: asc

      # Partition into Hive-style directories (Dask/PySpark only)
      partition_by:
        - l_shipdate
      partition_strategy: date_month  # Creates year=YYYY/month=MM dirs

      # File layout
      row_group_size: 1048576  # ~1M rows per group
      target_file_size_mb: 256
      repartition_count: 8  # 8 output files

      # Compression
      compression: zstd
      compression_level: 3

    # Existing runtime tuning (unchanged)
    parallelism:
      thread_count: 8
    memory:
      chunk_size: 1000000
    ```

