impact:
  business_value: |
    Cloud users benchmarking with tuning configs will see CTAS-based sorted loading
    activated automatically where it is beneficial, and clear documentation where
    platform-specific alternatives (clustering, Z-ordering, VACUUM) are the correct path.
    Eliminates guesswork about why sorting did or didn't take effect.
  user_impact: |
    Snowflake, Athena, and possibly Synapse users may gain query performance improvements
    from physically ordered data. Databricks, BigQuery, ClickHouse, and Redshift users
    receive clear code-level documentation pointing to the correct tuning mechanism.
  technical_debt: |
    Research work units prevent incorrect implementations from shipping silently.
    Each platform's decision (support or intentionally unsupported) is recorded in code
    via comments, preventing future implementers from re-asking the same questions.

