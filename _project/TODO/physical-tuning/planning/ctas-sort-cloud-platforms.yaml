  - "Databricks Z_ORDERING TuningType support in apply_unified_tuning() is not affected"
  - "All existing cloud platform tests pass (no credential mocks broken)"
  - "Platforms returning None from _build_ctas_sort_sql produce no SQL execution side effects"

approach: |
  Research units (w1, w3, w5, w7, w9) can all run in parallel — they are read-only.
  Implementation follows research findings. Where the answer is "unsupported / return None",
  the implementation is 5-10 lines (override + docstring); prioritize getting the documentation
  right over speed.

  For cloud platforms that are unsupported: ensure the log_debug message from the base class
  apply_ctas_sort() clearly identifies WHICH condition caused the skip (no SQL returned vs
  no sort columns vs table not in config).

  Do not attempt live platform tests — unit tests with mocked connections are sufficient
  for verifying SQL generation. The verification commands use only unit tests.

anti_patterns:
  - "DO NOT implement CTAS sort for Snowflake on top of existing clustering — because
    Snowflake's Automatic Clustering already handles physical data ordering and a CTAS
    would recreate the table without the clustering metadata — if research confirms CTAS
    adds no value, return None"
  - "DO NOT use CTAS for Databricks/Delta Lake — because CTAS creates an unmanaged table
    losing Delta transactional metadata — the correct mechanism is OPTIMIZE ZORDER BY"
  - "DO NOT implement BigQuery CTAS sort — because BigQuery does not preserve row order
    and the sorted output would revert to arbitrary order on subsequent DML — use CLUSTER BY"
  - "DO NOT skip research units to save time — because incorrect assumptions for cloud
    warehouses could produce silently incorrect benchmark data — validate physical sort
    behavior before coding any SQL"

