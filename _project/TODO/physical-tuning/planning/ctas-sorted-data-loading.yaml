context_sections:
  "Background and Motivation": |
    DuckDB and other columnar databases use zone maps (min-max indexes) per
    data block for query pruning. Zone maps only work when data is sorted -
    unsorted data has min/max spanning the entire domain, preventing skipping.

    Experiments at SF3 showed:
    - Q6 (1-year date filter): 6.4x speedup with sorted data
    - Single-day filter: 18x speedup
    - 1-week range filter: 28x speedup
    - Geometric mean for selective queries: 5.8x

  "Technical Context": |
    DuckDB DDL generator (benchbox/core/tuning/generators/duckdb.py) already
    generates sort_by clauses and has generate_ctas_ddl() method. The gap is
    in benchbox/platforms/base/data_loading.py which uses INSERT INTO instead
    of CTAS for data loading.

    Key code paths:
    - DuckDBDDLGenerator.generate_tuning_clauses() → returns TuningClauses.sort_by
    - DuckDBDDLGenerator.generate_ctas_ddl() → returns CTAS SQL with ORDER BY
    - DataLoader.load() → currently uses INSERT INTO, needs CTAS option

