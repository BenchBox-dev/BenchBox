- "Platform-native tuning behavior (Snowflake clustering, Databricks Z-ORDER, BigQuery CLUSTER BY) remains available and testable"
- "Dry-run mode continues to capture all emitted SQL/actions without requiring live credentials"
- "benchbox compare remains compatible with result schema changes"

approach: |
  Build on PlatformAdapter.apply_ctas_sort and existing cloud adapter tuning hooks,
  but add an explicit strategy layer so sorted ingestion can be requested even on
  platforms previously marked as CTAS-sort unsupported.

  Start with strategy selection and capability gating, then implement platform
  execution paths one adapter at a time. Record selected strategy and overhead
  metrics in results for downstream comparison analysis.

  Keep all cloud-platform behavior opt-in for safety and to preserve current defaults.

anti_patterns:
- "DO NOT silently switch default cloud behavior to deep sort — because it can materially change runtime/cost — require explicit
  opt-in"
- "DO NOT overload existing CLUSTERING/Z_ORDERING semantics — because users need separate A/B dimensions — add a dedicated
  sorted-ingestion strategy control"
- "DO NOT mark a platform as supported without adapter-level tests — because dry-run regressions would be invisible — require
  platform-specific assertions"

