impact:
  business_value: |
    Enables evidence-based tuning decisions by quantifying when deep-sorted
    ingestion outperforms, underperforms, or complements platform-native features.
  user_impact: |
    Users can run repeatable A/B comparisons of sorted ingestion vs clustering,
    Z-ordering, partitioning, and sort-key approaches on the same benchmark/data.
  technical_debt: |
    Replaces implicit "unsupported" behavior with explicit strategy selection and
    capability-driven execution, reducing ambiguity in cloud tuning outcomes.

