context_sections:
  "Background and Motivation": |
    Experiments show 5-28x speedups for selective queries when data is
    properly sorted, enabling zone map (min-max index) pruning. However,
    generating sorted datasets requires post-processing that varies by
    platform. BenchBox should support this natively.

    The "Data Order Playbook" blog series documents:
    - Part 1: Pre-sorted data performance benefits
    - Part 2: Platform order preservation behavior
    - Part 3: Multi-dimensional clustering (Z-order, Hilbert)

    This TODO enables reproducible experiments for all three topics.

  "Technical Context": |
    Open table formats support various data organization features:
    - Parquet: Row group sorting, page-level statistics
    - Delta Lake: OPTIMIZE ZORDER, liquid clustering
    - Iceberg: Sort orders, hidden partitioning

    DuckDB's recent blog posts document Hilbert encoding outperforming
    Z-order for mixed workloads. BenchBox should support both.

    Key technical decisions:
    - Use PyArrow for Parquet writing with sorted data
    - Consider delta-rs for Delta Lake generation
    - Consider pyiceberg for Iceberg generation

technical_requirements:
  dependencies:
  - "pyarrow (Parquet writing)"
  - "delta-rs (optional: Delta Lake)"
  - "pyiceberg (optional: Iceberg)"
  constraints:
  - "Must preserve data correctness (same rows, just reordered)"
  - "Should support all TPC benchmarks, not just TPC-H"
  - "Row group size must be configurable for zone map experiments"
  - "Implementation is staged in this single item: Phase 1 Parquet baseline, Phase 2 clustering (Z-order/Hilbert), Phase 3
    Delta/Iceberg integration"
  - "Phase 3 integrations must reuse the core sorting/clustering abstractions validated in earlier phases"

success_metrics:
- "Can generate TPC-H Parquet files sorted by l_shipdate"
- "Sortedness metrics confirm expected data organization"
- "Z-order and Hilbert options produce correct interleaved ordering"
- "Generated files load correctly into target platforms"
- "Performance delta matches expectations from research"

decisions:
- question: "Should sorting happen during generation or as post-processing?"
  answer: "Post-processing. TPC compliance requires unmodified dbgen output. Sort as a separate step after TBL generation
    using PyArrow."
  decided: "2026-01-07"

open_questions:
- "How to handle very large scale factors (memory constraints)?"
- "Should we support platform-specific formats (DuckDB native)?"

must_preserve:
- "Existing TPC-H data generation produces identical output when sorting is not requested"
- "benchbox run --platform duckdb --benchmark tpch --scale 0.01 completes with same row counts"
- "No regression in data generation time for default (unsorted) path"

approach: |
  Post-process generated TBL/CSV files rather than modifying dbgen output.
  Use PyArrow's write_table() with sort_columns for Parquet output. New module
  benchbox/core/data_organization/ should be called by the existing generator
  pipeline after TBL generation, not replace it. Execute in three phases within
  this TODO: (1) Parquet sorted export + CLI/config wiring, (2) clustering and
  partition-aware strategies, (3) Delta Lake and Iceberg integrations using the
  same validated ordering abstractions and tests.

anti_patterns:
- "DO NOT modify dbgen binary output format — because TPC compliance requires unmodified dbgen output — sort as a post-processing
  step only"
- "DO NOT sort in-memory for SF>=10 — because lineitem at SF=10 is 6GB+ and will OOM — use PyArrow's chunked/streaming sort"
- "DO NOT make sorting the default — because unsorted data is needed for baseline benchmarks — require explicit opt-in via
  --data-format or tuning config"

verification:
- description: "Existing data generation tests pass"
  command: "uv run -- python -m pytest tests/ -k 'generator or datagen' -v --tb=short"
  expected_output: "all tests pass, 0 failures"
- description: "Sorted output is actually sorted"
  command: "uv run -- python -m pytest tests/ -k 'sorted or presorted' -v --tb=short"
  expected_output: "all tests pass"
- description: "Sorted and unsorted runs preserve identical row counts per TPC-H table"
  command: "uv run -- python -m pytest tests/integration/core/data_organization/test_presorted_generation.py -k 'row_count_equivalence'
    -v --tb=short"
  expected_output: "row_count_equivalence passes for all asserted tables"
- description: "Sorting key monotonicity is validated on generated Parquet output"
  command: "uv run -- python -m pytest tests/integration/core/data_organization/test_presorted_generation.py -k 'sortedness_metric
    or sort_key_monotonic' -v --tb=short"
  expected_output: "sortedness checks pass with no ordering violations"

