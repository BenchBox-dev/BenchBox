approach: |
  Work research units (w1, w3, w5, w7) first in parallel — they are read-only and independent.
  Then implement based on findings (w2, w4, w6 depend on their research units).
  For PostgreSQL, if the multi-statement list[str] return type is needed, extend apply_ctas_sort
  in the base class to handle it before implementing the PostgreSQL override.

  For DataFusion, check the existing _load_table_parquet() and _load_table_csv() methods to
  understand how the table is registered — CTAS sort requires the table to exist as a
  named relation that can be self-joined in SELECT * FROM {table_name}.

anti_patterns:
- "DO NOT assume DataFusion CTAS behavior matches DuckDB without verification — because DataFusion's table registration model
  (external tables vs in-memory) differs — verify that SELECT * FROM {table_name} is valid post-load before generating CTAS
  SQL"
- "DO NOT execute DROP TABLE without a preceding BEGIN transaction in PostgreSQL — because a crash between DROP and RENAME
  would leave the table destroyed — always wrap in a BEGIN/COMMIT block"
- "DO NOT skip the research work units (w1, w3, w5) to save time — because incorrect CTAS assumptions could silently produce
  unsorted data or corrupt the table — confirm physical sort behavior before coding"

