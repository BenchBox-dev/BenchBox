    comparable query speedups for selective workloads.
  user_impact: |
    DataFusion users gain 5-28x speedups for selective queries with minimal config change.
    PostgreSQL users gain physical sorting during load phase without manual post-load steps.
  technical_debt: |
    Each platform override is 3-8 lines; the centralized base class absorbs all boilerplate.
    The research work units (w1, w3, w5) prevent incorrect assumptions from being coded in.

