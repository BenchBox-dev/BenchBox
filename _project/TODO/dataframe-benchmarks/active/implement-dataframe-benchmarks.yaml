  business_value: |
    Significantly expands BenchBox's DataFrame benchmarking capability from 2 to 15+
    benchmarks. This enables comprehensive performance comparison between SQL databases
    and DataFrame libraries across diverse workloads including star-schema (SSB),
    real-world data (NYC Taxi, ClickBench), time-series (TSBS), and specialized
    patterns (DataVault, JoinOrder).
  user_impact: |
    Users can benchmark DataFrame libraries (Polars, Pandas, PySpark, etc.) against
    a much broader range of workloads. This is particularly valuable for:
    - Data engineers comparing SQL vs DataFrame approaches
    - Library maintainers benchmarking performance improvements
    - Organizations evaluating DataFrame library choices
  technical_debt: |
    Establishes patterns and templates that will make future DataFrame benchmark
    additions significantly easier. The shared infrastructure reduces per-benchmark
    implementation effort.

