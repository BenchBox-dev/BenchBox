  before implementing."
- "BLOCKER for Metadata Primitives: What subset can map to DataFrame schema introspection (df.dtypes, df.schema)? Likely exclude
  INFORMATION_SCHEMA queries."
- "Decide before Tier 2: Should we prioritize specific DataFrame platforms for initial testing? Recommendation: Polars (expression)
