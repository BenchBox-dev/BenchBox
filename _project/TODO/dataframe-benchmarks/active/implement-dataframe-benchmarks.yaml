id: implement-dataframe-benchmarks
title: "Implement DataFrame Support for All SQL-Only Benchmarks"
worktree: dataframe-benchmarks
priority: High
status: In Progress
description: |
  Extend BenchBox's DataFrame execution capability to all SQL-only benchmarks.

  Currently, only TPC-H (22 queries) and TPC-DS (99 queries) have DataFrame support.
  This initiative will add DataFrame implementations for the remaining 16 benchmarks
  (excluding only Transaction Primitives which require ACID guarantees), totaling
  approximately 700+ query/operation implementations across two execution families
  (expression-based and pandas-based).

  Key insight: DataFrames are NOT read-only. All major DataFrame libraries support
  write operations (to_parquet, write_csv, sink operations) and transformation
  patterns that map directly to SQL INSERT/UPDATE/DELETE/MERGE semantics. TPC-DI
  ETL operations and Write Primitives are actually IDEAL DataFrame workloads since
  Pandas/Polars/PySpark are the de facto ETL tools in the Python ecosystem.

  This enables users to benchmark DataFrame libraries (Polars, Pandas, PySpark,
  DataFusion, Modin, cuDF, Dask) against SQL databases using a broader range of
  workloads beyond the current TPC benchmarks.

  NOTE: This is a large tracking TODO. After Phase 1 completes, consider splitting
  Tiers 2-4 into per-tier TODOs with their own guardrails and verification.

category: Core Functionality

# ============================================================================
# IMPLEMENTATION GUARDRAILS
# ============================================================================

must_preserve:
- "DataFrameQuery API contract in benchbox/core/dataframe/query.py — constructor signature (query_id, query_name, description,
  categories, pandas_impl, expression_impl, sql_equivalent, skip_platforms) and execute(ctx, family) method"
- "DataFrameContext protocol in benchbox/core/dataframe/context.py — all 30+ methods (get_table, col, lit, window_*, union_all,
  scalar, etc.) must remain unchanged"
- "DataFrameContextImpl abstract base class in benchbox/core/dataframe/context.py — Generic[DF] typing and abstract method
  signatures"
- "TPC-H DataFrame query correctness — all 22 queries in benchbox/core/tpch/dataframe_queries.py must continue to produce
  correct results"
- "TPC-DS DataFrame query correctness — all 99 queries in benchbox/core/tpcds/dataframe_queries/queries.py must continue to
  produce correct results"
- "QueryRegistry class interface in benchbox/core/dataframe/query.py — register(), get(), list_queries(), filter_by_category()
  methods"
- "Platform adapter compatibility — all 8 adapters in benchbox/platforms/dataframe/ (polars_df, pandas_df, pyspark_df, datafusion_df,
  modin_df, cudf_df, dask_df) must work with new benchmark queries"
- "benchmark_registry.py BENCHMARK_METADATA — existing entries must not be modified beyond adding supports_dataframe: True"
- "TPC-H parameter system — TPCH_DEFAULT_PARAMS, get_tpch_parameters(), set_parameter_overrides() in benchbox/core/tpch/dataframe_queries.py"
- "TPC-DS parameter system — get_parameters() in benchbox/core/tpcds/dataframe_queries/parameters.py"

approach: |
  Follow the established TPC-DS modular pattern (not the older TPC-H single-file pattern):

  Reference implementation: benchbox/core/tpcds/dataframe_queries/
  ├── __init__.py           # Public API: get_tpcds_query(), list_tpcds_queries(), TPCDS_DATAFRAME_QUERIES
  ├── registry.py           # QueryRegistry("tpcds") instantiation and accessor functions
  ├── queries.py            # Dual-family implementations: q{N}_expression_impl + q{N}_pandas_impl
  ├── parameters.py         # get_parameters(query_id) for parameterized substitution
  ├── channel_helper.py     # Benchmark-specific helper (reusable pattern logic)
  └── rollup_helper.py      # Benchmark-specific helper

  For each new benchmark:
  1. Study the SQL queries in benchbox/core/{benchmark}/queries.py to understand schema, join patterns, and edge cases
  2. Create benchbox/core/{benchmark}/dataframe_queries/ directory following the TPC-DS structure
  3. Implement expression family first (ctx.col(), ctx.lit(), ctx.get_table() pattern) — see q3_expression_impl in tpcds/queries.py
  4. Implement pandas family second (string indexing, .merge(), .groupby() pattern) — see q3_pandas_impl in tpcds/queries.py
  5. Register via QueryRegistry("{benchmark_id}") and wrap each pair in DataFrameQuery()
  6. Set supports_dataframe: True in benchmark_registry.py BENCHMARK_METADATA
  7. Write tests following tests/unit/core/tpcds/test_tpcds_dataframe_queries.py pattern
  8. Validate each query against SQL results at SF=0.01

  Key pattern differences per benchmark:
  - Single-table benchmarks (ClickBench, H2ODB): No joins, simpler — skip helpers.py
  - Star-schema (SSB): Reuse TPC-H join patterns but with different key columns
  - Time-series (TSBS): Need date_trunc/time-bucket helpers
  - ETL (TPC-DI, Write Primitives): Need write operation helpers (to_parquet, concat)
  - Variant benchmarks (TPC-H Skew, TPC-Havoc): Maximize reuse of TPC-H impls

anti_patterns:
- "DO NOT copy TPC-H query implementations into other benchmarks verbatim — because each benchmark has different schema semantics,
  column names, and join patterns — analyze the benchmark's SQL queries first and translate the logical operations"
- "DO NOT add DataFrame queries without validating against SQL results — because silent correctness bugs accumulate and are
  hard to find later — validate every query against SQL output at SF=0.01 before committing"
- "DO NOT modify DataFrameQuery, DataFrameContext, or DataFrameContextImpl classes — because that risks breaking existing
  TPC-H/TPC-DS implementations and all 8 platform adapters — if new capabilities are needed, extend via subclass or helper
  functions"
- "DO NOT modify existing TPC-H/TPC-DS dataframe_queries files — because those are stable and tested — new benchmarks get
  their own isolated dataframe_queries/ directories"
- "DO NOT add benchmark-specific logic to platform adapters in benchbox/platforms/dataframe/ — because adapters must remain
  benchmark-agnostic — put benchmark-specific helpers in the benchmark's own dataframe_queries/helpers.py"
- "DO NOT implement all 700+ queries in a single pass — because review quality degrades with large changesets — implement
  one benchmark at a time with incremental commits and validation"

