# ============================================================================
# CONTEXT AND ARCHITECTURE
# ============================================================================

context_sections:
  "Current State": |
    DataFrame-Supported Benchmarks (2):
    - TPC-H: 22 queries, full dual-family implementation (2,376 lines)
    - TPC-DS: 99 queries, full dual-family implementation (579KB+)

    SQL-Only Benchmarks Requiring DataFrame Implementation (17):
    - SSB: 13 star-schema queries
    - ClickBench: 43 analytics queries
    - JoinOrder: 113 optimizer-testing queries
    - NYC Taxi: 25 real-world OLAP queries
    - TSBS DevOps: 18 time-series queries
    - H2ODB: 10 data science queries
    - AMPLab: 8 big data queries
    - CoffeeShop: 11 order analytics queries
    - TPC-DI: 38 ETL/transformation operations (Tier 2 - strong DataFrame fit)
    - TPC-DS-OBT: 17 single-table queries
    - TPC-Havoc: 220 query variants
    - TPC-H Skew: 22 skewed-data queries
    - DataVault: 22 Data Vault 2.0 queries
    - Read Primitives: 136 read operations
    - Write Primitives: 109 write operations (Tier 2 - strong DataFrame fit)
    - Metadata Primitives: 28 introspection queries (limited DataFrame applicability)
    - Transaction Primitives: 8 ACID operations (unsuitable - requires DB guarantees)

  "Architecture Pattern": |
    Each DataFrame-enabled benchmark requires:

    1. Directory structure:
       benchbox/core/{benchmark}/dataframe_queries/
       ├── __init__.py           # Public API exports
       ├── queries.py            # Dual-family implementations
       ├── registry.py           # QueryRegistry for discovery
       └── helpers.py            # Optional shared utilities

    2. Dual-family implementations for each query:
       - Expression family: Polars/PySpark/DataFusion (lazy evaluation)
       - Pandas family: Pandas/Modin/cuDF/Dask (eager evaluation)

    3. DataFrameQuery registration with:
       - query_id, query_name, description
       - categories (QueryCategory enum)
       - pandas_impl and expression_impl callables
       - sql_equivalent reference
       - skip_platforms list

    4. Registry update: supports_dataframe: True in benchmark_registry.py

  "Implementation Priorities": |
    Priority is based on query count, complexity, and user value:

    Tier 1 - High Value (recommended first):
    - SSB (13q): Simple star-schema, good starter benchmark
    - ClickBench (43q): Popular industry benchmark
    - NYC Taxi (25q): Real-world data, high user interest

    Tier 2 - Strong DataFrame Fit:
    - TPC-DI (38q): ETL transformations - DataFrames excel at this (SCD Type 2,
      dimension processing, fact aggregation). Pandas/Polars/Spark are ETL tools.
    - Write Primitives (109 ops): INSERT→concat/vstack, UPDATE→with_columns/assign,
      DELETE→filter, BULK_LOAD→read/write_parquet, MERGE→join+conditional columns.
      All major DataFrames support to_parquet/write_parquet output.
    - TSBS DevOps (18q): Time-series workloads
    - H2ODB (10q): Data science focus
    - AMPLab (8q): Established benchmark
    - CoffeeShop (11q): Simple analytics

    Tier 3 - Experimental/Variants:
    - TPC-H Skew (22q): Reuse TPC-H impls with skewed data
    - TPC-DS-OBT (17q): Simplified single-table variant
    - TPC-Havoc (220q): Query variants (may auto-generate)
    - DataVault (22q): Specialized modeling

    Tier 4 - Complex/Specialized:
    - JoinOrder (113q): High complexity, many joins
    - Read Primitives (136q): Foundation testing
    - Metadata Primitives (28q): Partial applicability - schema introspection
      (df.dtypes, df.schema) but not DB-specific INFORMATION_SCHEMA queries

    Unsuitable for DataFrames:
    - Transaction Primitives: Requires ACID guarantees that DataFrames don't provide

