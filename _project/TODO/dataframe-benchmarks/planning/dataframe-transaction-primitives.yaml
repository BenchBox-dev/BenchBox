title: "Implement DataFrame Version of Transaction Primitives Benchmark"
worktree: dataframe-benchmarks
priority: Medium
status: Not Started
category: Core Functionality
description: |
  Implement DataFrame versions of Transaction Primitives benchmark operations. This
  benchmark tests database transaction semantics: COMMIT, ROLLBACK, savepoints,
  isolation levels, and multi-statement transactions.

  DataFrame platforms with table formats have ACID transaction support:

  **Delta Lake (Full ACID):**
  - Atomic writes with automatic commit
  - Optimistic concurrency control
  - Time travel (query historical versions)
  - VACUUM for garbage collection
  - Isolation: serializable snapshot isolation

  **Iceberg (Full ACID):**
  - Atomic table operations
  - Snapshot isolation
  - Time travel via snapshots
  - Schema evolution with transactions
  - Partition evolution

  **PySpark (Spark SQL):**
  - Transaction support via Delta Lake or Iceberg
  - Streaming transactions (structured streaming)
  - Batch transaction patterns

  Platforms without transaction support (Polars, Pandas) should be skipped
  for transaction-specific operations.

context_sections:
  "Background and Motivation": |
    Transaction Primitives tests COMMIT, ROLLBACK, savepoints, isolation levels,
    and multi-statement transaction patterns. These are critical for:
    - Data consistency in concurrent environments
    - Error recovery and rollback scenarios
    - Understanding transaction overhead costs
    - Comparing ACID implementations across platforms

    While traditionally SQL-focused, modern table formats (Delta Lake, Iceberg)
    bring full ACID semantics to DataFrame platforms.

  "Technical Context": |
    Current Transaction Primitives implementation:
    - `benchbox/core/transaction_primitives/benchmark.py` - Main benchmark class
    - `benchbox/core/transaction_primitives/operations.py` - TransactionOperationsManager
    - Uses TPC-H data via get_data_source_benchmark() returning "tpch"

    Delta Lake transaction model:
    - Each write operation is atomic (implicit commit)
    - Optimistic concurrency: concurrent writes may conflict
    - Transaction log in _delta_log directory
    - Time travel: query any historical version

    Iceberg transaction model:
    - Snapshot-based isolation
    - Each table operation creates new snapshot
    - Atomic multi-table transactions via catalog
    - Schema/partition evolution as transactions

  "Platform Capability Matrix": |
    | Operation          | Delta Lake | Iceberg | Polars | Pandas | Dask |
    |--------------------|------------|---------|--------|--------|------|
    | Atomic writes      | ✓          | ✓       | ✗      | ✗      | ✗    |
    | Rollback           | ✓ restore  | ✓       | ✗      | ✗      | ✗    |
    | Isolation levels   | ✓ snapshot | ✓       | ✗      | ✗      | ✗    |
    | Concurrency ctrl   | ✓ OCC      | ✓ OCC   | ✗      | ✗      | ✗    |
    | Time travel        | ✓          | ✓       | ✗      | ✗      | ✗    |
    | Multi-stmt txn     | ✗*         | ✗*      | ✗      | ✗      | ✗    |
    | Savepoints         | ✗          | ✗       | ✗      | ✗      | ✗    |

    *Delta/Iceberg don't have explicit BEGIN/COMMIT - each operation is atomic.
    Multi-statement transactions require custom coordination.

