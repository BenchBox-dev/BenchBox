    Enables benchmarking of ACID transaction performance on DataFrame platforms
    using Delta Lake and Iceberg. Critical for data lakehouse architectures
    where transaction overhead affects data pipeline performance.
  user_impact: |
    Users can run: `benchbox run --platform pyspark-df --benchmark transaction_primitives`
    to benchmark ACID operations on Delta Lake tables.
  technical_debt: |
