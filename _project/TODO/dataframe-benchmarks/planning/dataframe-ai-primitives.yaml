impact:
  business_value: |
    Enables benchmarking of AI/ML operations on DataFrame platforms using local
    models (sentence-transformers, spaCy, TextBlob). Covers 8 of 16 AI Primitives
    queries without requiring cloud AI APIs.
  user_impact: |
    Users can run: `benchbox run --platform pyspark-df --benchmark ai_primitives`
    to benchmark embedding generation, sentiment analysis, and classification
    on local ML models.
  technical_debt: |
    Establishes ML model integration patterns for DataFrame platforms. Creates
    foundation for future AI benchmark expansions including LLM API integration
    for the remaining 8 generative/transform queries.

