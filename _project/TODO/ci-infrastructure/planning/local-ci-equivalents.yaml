title: "Ensure local equivalents exist for all CI workflow steps"
worktree: ci-infrastructure
priority: High
status: Not Started
description: |
  Every CI step in GitHub workflows should have a local equivalent that developers
  can run before pushing code. This prevents CI failures and speeds up development
  by catching issues locally.

  Currently, many CI steps can only be validated by pushing to GitHub and waiting
  for the workflow to complete. This is slow and wasteful of CI resources.

  This task audits all CI steps and ensures Makefile targets or scripts exist
  for local validation.

category: Testing and Quality Assurance

tasks:
  phases:
    - phase: "Phase 1: Audit CI Steps"
      done: false
      items:
        - summary: "Document all jobs in lint.yml and their local equivalents"
          done: false
          subtasks:
            - summary: "lint job: verify `make lint` matches CI"
              done: false
            - summary: "type check: verify `make typecheck` matches CI"
              done: false
