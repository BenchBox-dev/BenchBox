impact:
  business_value: |
    Reduces launch risk for the public Explorer by making the route matrix work
    on mobile and tablet, not only desktop.
  user_impact: |
    Users can navigate, filter, compare, and inspect rows without hidden actions
    or clipped data.
  technical_debt: |
    Converts responsive behavior from incidental page CSS into testable route
    contracts.
