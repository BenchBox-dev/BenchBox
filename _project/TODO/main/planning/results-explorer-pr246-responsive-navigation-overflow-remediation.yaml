id: results-explorer-pr246-responsive-navigation-overflow-remediation
title: "Address PR #246 mobile navigation, overflow, focus, and reachability findings"
worktree: main
priority: High
status: Not Started
category: Testing and Quality Assurance

description: |
  PR #246 found that the Results Explorer has cross-route responsive risks:
  Query disappears from the 390px secondary nav, dense tables clip columns and
  row actions, and chart/table affordances are inconsistent at mobile and
  tablet widths. These are not isolated CSS defects; they are route-level
  responsive contracts that must be specified, implemented, and regression
  tested.

  This TODO creates the integrated responsive remediation plan for the PR #246
  evidence. It should be worked alongside page-specific retheme items, but it
  owns the shared rules for navigation, horizontal scroll affordances, sticky
  first/action columns, card fallbacks, focus-visible semantics, and target
  reachability.

deps:
  needs:
    - results-explorer-retheme-theme-system-foundation

context_sections:
  evidence_source: |
    PR #246: https://github.com/joeharris76/BenchBox/pull/246
    Audit artifact:
    `_project/audits/results-explorer-hierarchy-usability-data-audit-20260507.md`
  findings: |
    Covers PR #246 findings U-1 and U-2, and provides shared responsive support
    for VH-1, DQ-3, DQ-4, and U-4.
  screenshots: |
    Baseline screenshots from PR #246:
    - `home-390.png`
