id: joinorder-replicated-imdb-scale-prototype
title: "Prototype replicated-IMDB scale-up for JOB scale-stress"
worktree: main
priority: Medium
status: Not Started
category: Benchmark Development

description: |
  Prototype the lowest-risk derived scale-up mode for JOB: offset-replicating
  the canonical IMDB tables by integer scale factor while preserving predicate
  values and consistently offsetting primary and foreign keys.

  This is an infrastructure and measurement baseline for future job_scale_stress
  work. It is not intended to model "IMDb got 10x larger" perfectly and must be
  labeled as replicated_imdb, not canonical_imdb.

deps:
  needs:
    - joinorder-scale-stress-decision-framework
    - track2-joinorder-stats-phase

context_sections:
  "Why start with replication": |
    Offset replication preserves canonical intra-replica correlations and gives
    a deterministic baseline for larger data volumes. It can validate archive
    scaling, loader behavior, stats/analyze phase measurement, result metadata,
    and comparison labeling before investing in profiled graph expansion.
  "Known limitation": |
    Replication creates disconnected copies of the same graph. It may distort
    compression, cache behavior, partitioning, and some optimizer heuristics.
    The prototype must measure and report those limitations, not hide them.

work:
  - id: w1
    summary: "Confirm licensing, stats-phase, and decision-framework prerequisites"
    status: pending
    notes: |
      Do not start implementation unless joinorder-scale-stress-decision-framework
      chooses replicated_imdb as an approved baseline. Copy the chosen prototype
      scope and success criteria from that decision note into this TODO before
      coding.

      Also confirm:
        - the IMDb/JOB data licensing decision allows the intended local or
          hosted derived-data workflow;
        - any required first-class stats/analyze phase TODO is completed or this
          prototype is explicitly narrowed to a measurement smoke that does not
          claim stats-maintenance conclusions; NOTE "completed" for
          publication-quality stale-stats conclusions means BOTH
          track2-joinorder-stats-phase (phase mechanics, DONE) AND
          track2-joinorder-stats-phase-controls (the reset/persist control) --
          the mechanics seed alone only supports the measurement-smoke path;
        - the scale-stress decision note contains exactly one `Stats phase gate:
          completed`, `Stats phase gate: smoke-only`, or `Stats phase gate:
          dependency:track2-joinorder-stats-phase` line; if the
          dependency gate is used, add that TODO to this item's `deps.needs`
          before coding;
        - result-bundle labels and manifest fields for replicated_imdb are
          already specified by the decision framework.

  - id: w2
    summary: "Map JOB primary keys, foreign keys, and lookup tables"
    needs: [w1]
    status: pending
    notes: |
      Build a table-by-table offset map from the canonical schema:
        - replicated entity/fact tables get PK offsets per replica,
        - FK columns pointing to replicated tables get matching offsets,
        - small lookup tables remain single-copy,
        - self references such as title.episode_of_id are offset,
        - dual references such as movie_link.movie_id and linked_movie_id are
          both offset.
      Document the map in the code or manifest so future schema changes cannot
      silently corrupt joins.

  - id: w3
    summary: "Implement a deterministic replicated_imdb archive builder"
    needs: [w2]
    status: pending
    notes: |
      Add a builder that reads a canonical dataset directory and writes a derived
      replicated_imdb dataset for integer SF values such as 2, 5, and 10. Keep
      predicate-bearing values unchanged. Record source dataset_version,
      replica factor, builder version, seed if any, and per-table checksums in
      the derived manifest.
      If hosted redistribution is not approved, the builder must be documented as
      a local user-run conversion path and must not produce a BenchBox-hosted
      derived archive.

  - id: w4
    summary: "Validate replicated cardinalities and predicate preservation"
    needs: [w3]
    status: pending
    notes: |
      Validate:
        - FK integrity,
        - row counts scale as expected,
        - predicate-domain frequencies scale as expected for fixed values,
        - null counts scale for replicated tables and remain unchanged for
          lookup tables,
        - the fixed 113 JOB queries' final result stays UNCHANGED from the
          canonical oracle (they are scalar MIN(...) aggregates, so
          value-identical offset replication returns the same one-row
          aggregate value -- do not expect an N-times final-result scaling),
        - the underlying predicate-match counts and important join-subgraph
          cardinalities (the actual measurement gates) scale by the replica
          count instead.
      Matches the decision framework's corrected oracle description
      (`_project/decisions/joinorder-scale-stress-decision-2026-06-30.md`,
      "Recommendation and prototype scope" / options table): "unchanged
      canonical final-result oracle" plus "underlying and join-subgraph
      cardinalities" scaling, not final-result cardinalities scaling N times.
      Use the canonical oracle artifacts produced by joinorder-canonical-foundation
      (specifically `_project/joinorder/reference_cardinalities.json` from foundation w11).

  - id: w5
    summary: "Run a narrow scale-stress comparison on local engines"
    needs: [w4]
    status: pending
    notes: |
      Run a narrow matrix, likely DuckDB and PostgreSQL first, at canonical SF=1
      and replicated SF=2. Capture load time, stats/analyze time, planning time,
      execution time, plan shape, and cardinality estimates where available.
      This is a measurement smoke, not a leaderboard.
      If first-class stats/analyze phase accounting is not yet implemented, the
      report must mark stats/analyze timing as unavailable or manually captured
      and must not use it as publication-quality evidence.

  - id: w6
    summary: "Write the prototype evaluation and decide whether to continue"
    needs: [w5]
    status: pending
    notes: |
      Write `_project/decisions/joinorder-replicated-imdb-prototype-<date>.md`.
      It must answer:
        - Does replicated_imdb reveal useful stats or physical-scale behavior?
        - Does replication introduce artifacts too large to accept?
        - Should BenchBox keep it as a derived baseline?
        - Should the next step be expanded_imdb graph generation,
          parameterized queries, or no further scale work?

deferred:
  - summary: "Profiled graph-expanded IMDB generator"
    reason: "Only worth implementing after replicated_imdb establishes baseline measurements and gaps."
  - summary: "Public result explorer support for replicated_imdb cohorts"
    reason: "Explorer work depends on final result-bundle metadata and prototype evaluation."
  - summary: "Cloud/distributed platform scale-stress matrix"
    reason: "Start local to validate semantics and measurement before spending cloud resources."

prior_art:
  - "benchbox/core/joinorder_synthetic/ (created by canonical-cutover w2-w4) — reuse: sibling module-and-registry-entry precedent for a derived/non-canonical joinorder workload; replicated module follows the same `surface: internal` registry pattern"
  - "benchbox/core/joinorder/ (canonical, post-cutover) — supersede location: replicated logic NEVER lives under canonical to keep the canonical/derived separation at the file-system boundary; replicated code is in benchbox/core/joinorder_replicated/"
  - "benchbox/core/benchmark_registry.py — extend: register `joinorder_replicated` as a separate benchmark id with surface=internal; do not add a 'derived mode' flag on canonical joinorder (silent canonical→derived selection is forbidden by must_preserve)"
  - "_project/joinorder/reference_cardinalities.json (foundation TODO) — reuse as oracle: w4 validates replicated query cardinalities by deriving expected scaled values from the canonical Postgres oracle, not by re-running queries on the replicated archive itself"
  - "benchbox/core/data_fetch + data_manifest.toml (foundation TODO) — reuse: derived archive carries its own data_manifest.toml with source_dataset_version pointing back to canonical; replicated builder writes a derived manifest with the same schema"
  - "benchbox/core/publishing/bundle_publisher.py (cutover w12 dataset_version field) — reuse: derived bundles record source canonical dataset_version, derived manifest hash, replica factor, builder version through the same manifest field surface"

must_preserve:
  - "Canonical joinorder remains SF=1 canonical_imdb and literature-comparable only."
  - "No hosted replicated_imdb archive may ship unless the IMDb/JOB data licensing decision explicitly approves derived archive redistribution (decision-framework w8 produces this)."
  - "replicated_imdb result bundles record source canonical dataset_version, derived manifest hash, replica factor, and builder version."
  - "Predicate-bearing values must not be suffixed or mutated in the replicated baseline."
  - "Lookup tables must not be duplicated unless the schema contract explicitly requires it."
  - "All replicated_imdb code lives under benchbox/core/joinorder_replicated/ — never in benchbox/core/joinorder/ — to enforce the canonical/derived separation at the module boundary."
  - "The benchmark identifier registered in benchmark_registry.py is `joinorder_replicated` (not `joinorder` with a derived mode flag); silent selection via canonical joinorder is forbidden."

approach: |
  Implement this as a derived archive builder in its own module
  (`benchbox/core/joinorder_replicated/`), not by teaching canonical
  JoinOrderGenerator to synthesize larger data. The module separation
  enforces the canonical/derived boundary at the file-system level —
  agents working on canonical joinorder cannot accidentally touch
  replicated logic and vice versa.

  Keep the implementation deterministic and manifest-driven. Use the
  canonical oracle artifacts (foundation TODO's
  `_project/joinorder/reference_cardinalities.json`) to prove expected
  query/cardinality scaling before interpreting engine performance.

  Result-bundle tagging: registered as `joinorder_replicated` in
  benchmark_registry.py with `surface: internal` (matching the
  joinorder_synthetic precedent — derived/research workloads stay
  hidden from the public explorer until promoted explicitly).

anti_patterns:
  - "DO NOT start implementation until licensing and stats/analyze phase prerequisites are resolved - because the prototype otherwise cannot produce shippable or interpretable scale-stress evidence."
  - "DO NOT suffix predicate string values to make rows unique - because JOB predicates depend on exact values - offset IDs instead."
  - "DO NOT duplicate lookup tables by default - because lookup predicates should remain stable and FKs can point to the same lookup rows - keep lookup tables single-copy."
  - "DO NOT publish replicated_imdb results as canonical JOB - because replicated components are an artificial derived scale mode - label result bundles accordingly."
  - "DO NOT run expensive cloud matrices during the prototype - because the first gate is semantic validity and local measurement - defer cloud until w6 approves continuation."

verification:
  - description: "Decision-framework approved replicated_imdb explicitly (not 'no scaled JOB' or other path)"
    command: "grep -hEc '^Recommendation: (replicated_imdb baseline|staged combination)' _project/decisions/joinorder-scale-stress-decision-*.md | awk '{ s += $1 } END { print s }'"
    expected_output: "1"
  - description: "Stats/analyze phase handling is decided with a concrete gate"
    command: "grep -hEc '^Stats phase gate: (completed|smoke-only|dependency:track2-joinorder-stats-phase)' _project/decisions/joinorder-scale-stress-decision-*.md | awk '{ s += $1 } END { print s }'"
    expected_output: "1"
  - description: "Stats/analyze dependency gate is reflected in prototype dependencies before coding"
    command: "! grep -hEq '^Stats phase gate: dependency:track2-joinorder-stats-phase' _project/decisions/joinorder-scale-stress-decision-*.md || rg -n 'track2-joinorder-stats-phase' _project/TODO/main/planning/joinorder-replicated-imdb-scale-prototype.yaml"
    expected_output: "no output unless dependency gate is selected; otherwise TODO references the dependency"
  - description: "Replicated archive builder produces deterministic output (re-run same input → same sha256)"
    command: "uv run -- python -m pytest tests/unit/core/joinorder_replicated/test_builder_determinism.py -q"
    expected_output: "all tests pass"
  - description: "FK integrity is validated across replicas"
    command: "uv run -- python -m pytest tests/unit/core/joinorder_replicated/test_fk_integrity.py -q"
    expected_output: "all tests pass"
  - description: "Predicate-bearing string values unchanged in derived archive (anti-pattern guard)"
    command: "uv run -- python -m pytest tests/unit/core/joinorder_replicated/test_predicate_preservation.py -q"
    expected_output: "all tests pass"
  - description: "Lookup tables remain single-copy (anti-pattern guard)"
    command: "uv run -- python -m pytest tests/unit/core/joinorder_replicated/test_lookup_table_singleton.py -q"
    expected_output: "all tests pass"
  - description: "Result bundles tagged replicated_imdb carry source canonical dataset_version"
    command: "uv run -- python -m pytest tests/unit/core/publishing/test_replicated_imdb_bundle_metadata.py -q"
    expected_output: "all tests pass"
  - description: "Prototype evaluation note covers all required questions (multi-file safe — sums section-header counts across any dated decision files)"
    command: "grep -hEc '^## (Useful stats or physical-scale|Replication artifacts|Keep as derived baseline|Next step)' _project/decisions/joinorder-replicated-imdb-prototype-*.md | awk '{ s += $1 } END { print s }'"
    expected_output: ">= 4"
  - description: "Prototype keeps TODO graph valid"
    command: "uv run --project _project/scripts -- python _project/scripts/todo_cli.py check-graph"
    expected_output: "Graph validation passed"
  - description: "This item validates individually"
    command: "uv run --project _project/scripts -- python _project/scripts/todo_cli.py validate _project/TODO/main/planning/joinorder-replicated-imdb-scale-prototype.yaml"
    expected_output: "is valid"

