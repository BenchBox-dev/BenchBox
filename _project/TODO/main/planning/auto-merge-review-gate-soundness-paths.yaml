id: auto-merge-review-gate-soundness-paths
title: "Require a review pass before squash-auto-merge for soundness-critical paths (comparator + plan parsers)"
worktree: main
priority: Medium
status: Not Started
category: Process and Workflow

description: |
  Nine numbered "PR review follow-up sweep" PRs landed this month fixing REAL
  defects on already-merged PRs - including comparator-soundness holes in a
  correctness gate (e.g. #862: the tie-aware comparator used a constant/literal
  column as the boundary-tie key, letting an arbitrary row-swap pass; #872/#878:
  unconditional multiset acceptance in the final ORDER BY group; #894: a Spark
  parser accepting an EXPLAIN-failure sentinel as a one-node plan). These landed up
  to ~3 weeks after merge because squash-auto-merge-on-CI-green makes human review a
  post-merge activity, not a merge precondition.

  Escaped defects cluster in a small set of files: the result comparator and the
  query-plan parsers. Require one approving review for PRs touching those paths
  before auto-merge, while leaving the cheap-merge default intact for everything
  else.

prior_art:
  - ref: ".github/CODEOWNERS (if present) / GitHub branch protection on develop"
    note: "The mechanism to require review on specific paths; if no CODEOWNERS exists, add one scoped to the soundness paths."
  - ref: "Makefile (pr-open target) / CLAUDE.md 'squash auto-merge is the default'"
    note: "make pr-open enables auto-merge automatically; it must NOT enable auto-merge when the diff touches the soundness paths."
  - ref: ".github/workflows/auto-merge-on-open.yml:3"
    note: "Backstop workflow auto-enables squash auto-merge for PRs opened outside make pr-open; it must honor the same soundness-path exception or it bypasses the local guard."
  - ref: "benchbox/core/tpchavoc/validation.py, benchbox/core/equivalence/, benchbox/core/query_plans/parsers/"
    note: "The escaped-defect-dense paths to gate."

work:
  - id: w1
    summary: "Add CODEOWNERS / branch-protection requiring one review on the soundness paths"
    status: pending
    needs: []
    notes: |
      Add a CODEOWNERS entry (and/or document the branch-protection rule) requiring
      one approving review for PRs touching benchbox/core/**/validation.py,
      benchbox/core/equivalence/**, and benchbox/core/query_plans/parsers/**. Keep
      all other paths on the existing auto-merge default.

  - id: w2
    summary: "Make pr-open skip auto-merge when the diff touches a soundness path"
    status: pending
    needs: [w1]
    notes: |
      Adjust the pr-open flow so it does NOT auto-enable squash auto-merge when the
      changed files intersect the soundness paths (diff --name-only against the path
      set). For those PRs, open without auto-merge so the required review gates the
      merge. Document the behavior in AGENTS.md/CLAUDE.md in the terse house style.

  - id: w3
    summary: "Gate the auto-merge-on-open backstop workflow on the same soundness-path predicate"
    status: pending
    needs: [w1]
    notes: |
      .github/workflows/auto-merge-on-open.yml currently runs `gh pr merge --auto
      --squash` UNCONDITIONALLY for every non-draft PR opened against develop. That is
      the GitHub-side backstop for PRs opened via the UI, `gh pr create`, or any path
      that skips `make pr-open`. While it stays unconditional it RE-ENABLES auto-merge
      on soundness-path PRs even when w2 opened them without it, defeating the
      review-before-auto-merge goal.

      Gate this workflow on the SAME soundness-path predicate w2 uses: detect whether
      the PR diff intersects the soundness paths (e.g. a paths/paths-ignore filter or
      a diff --name-only check in the job) and SKIP the `gh pr merge --auto --squash`
      step for those PRs. Keep the cheap auto-merge default for every non-soundness
      diff. The predicate MUST be the single shared source the regression test pins,
      so the local pr-open guard and this backstop never diverge.

must_preserve:
  - "The cheap squash-auto-merge default is unchanged for all non-soundness paths."
  - "No change to CI checks themselves; this adds a human-review precondition for a narrow path set."
  - "The local pr-open path and the GitHub auto-merge-on-open backstop use the same soundness-path predicate."

verification:
  - description: "Shared soundness-path predicate controls both auto-merge paths"
    command: "uv run -- python -m pytest tests/unit/test_auto_merge_soundness_paths.py -q"
    expected_output: "pr-open helper and auto-merge-on-open workflow both skip soundness-path diffs and still enable auto-merge for non-soundness diffs"

scope_limit:
  only_modify:
    - ".github/"
    - "Makefile"
    - "_project/scripts/"
    - "AGENTS.md"
    - "CLAUDE.md"
    # The verification step requires this regression test; allow the
    # implementer to add it without breaching the guardrail.
    - "tests/unit/test_auto_merge_soundness_paths.py"

success_metrics:
  - "PRs touching the comparator or plan parsers cannot squash-auto-merge without a review; everything else stays on the fast default."
  - "No PR creation path (make pr-open, gh pr create, GitHub UI, ready_for_review) can bypass the soundness-path review requirement."

