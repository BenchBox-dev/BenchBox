id: implement-pr-based-result-submission-workflow
title: "Implement PR-based community result submission workflow"
worktree: main
priority: Medium
status: In Progress
category: Core Functionality
deps:
  needs:
  - launch-results-explorer-acceptance-and-seed
description: |
  Phase 2 of the results platform: enable community contributions via a
  PR-based submission model. Instead of building a hosted API, contributors
  use `benchbox submit --output ./submission/` to package a result bundle
  with a submission manifest, then open a PR against this repository touching
  `results-data/`.

  GitHub Actions CI validates the submission (schema, hash, cohort, sanity).
  Maintainers review and merge. Merge triggers a rebuild of derived read
  models and redeployment of the explorer.

  This model uses GitHub as the auth, moderation, and audit layer — zero
  hosted services required. It scales to ~100s of submissions/month before
  maintainer review becomes a bottleneck.

  **Contingency:** This TODO should only be started after Phase 1 has launched
  and the explorer UX is validated with real users. If Phase 1 reveals that
  the data model or explorer architecture needs significant changes, those
  changes should be made before opening community contributions.

work:
- id: w1
  summary: "Design submission manifest schema and packaging format"
  status: done
  completed_note: "Implemented as part of benchbox submit (PR #44). Manifest includes tool version, timestamp, bundle file/hash, benchmark/platform/scale metadata, contributor info, and optional context/platform_notes."
  notes: |
    Define the submission package format:
    - Canonical schema-v2 bundle (required)
    - Companion files: .plans.json, .tuning.json (optional)
    - submission-manifest.json:
      - contributor: name/handle (from git config or explicit)
      - context: why this result is interesting (optional free text)
      - platform_notes: hardware/cloud context not captured in bundle
      - submission_date: ISO timestamp
    The package is a directory that can be directly committed to the data repo.

- id: w2
  summary: "Implement `benchbox submit --output` CLI command"
  needs: [w1]
  status: done
  completed_note: "Merged in PR #44. benchbox submit packages bundles with submission manifests, hash verification, contributor metadata, and PR instructions. See benchbox/cli/commands/submit.py"
  notes: |
    Add a CLI command that packages an existing exported result bundle into
    the submission format:
    1. Takes a result bundle path (or --last to use most recent)
    2. Prompts for optional contributor info and context
    3. Writes submission package to the specified output directory
    4. Prints instructions for opening a PR against the current results corpus location

    This command does NOT upload anything. It only packages locally.

- id: w3
  summary: "Build CI validation workflow for submission PRs"
  needs: [w1]
  status: pending
  notes: |
    Create a GitHub Actions workflow in this repo that runs on PRs touching
    `results-data/`:
    - Schema validation: bundle conforms to schema-v2
    - Hash verification: bundle content matches declared hash
    - Cohort compatibility: benchmark/scale/query-set are valid
    - Sanity checks: no absurd timings (e.g., 0ms for all queries),
      valid platform names, reasonable environment metadata
    - Diff summary: comment on PR with what would be added to the explorer

- id: w4
  summary: "Add trust labels to the explorer for community-submitted results"
  needs: [w3]
  status: pending
  notes: |
    Update the static build pipeline and explorer to show trust labels:
    - "Maintainer Run" badge for results generated by BenchBox CI
    - "Community Submitted" badge for results from merged PRs
    The source is determined by commit author or a field in the submission manifest.
    Badges appear on detail pages, browse pages, and compare views.

- id: w5
  summary: "Write contributor guidelines and submission documentation"
  needs: [w2, w3]
  status: pending
  notes: |
    Document:
    - How to generate and export benchmark results
    - How to use `benchbox submit --output`
    - How to open a submission PR
    - What the CI checks validate
    - What makes a good submission (full benchmark, stable environment, etc.)
    - Contribution license and data usage terms

metadata:
  tags:
  - results
  - explorer
  - phase-2
  - community
  - submission
  - pr-workflow
  estimated_effort: "Large"
  created_date: "2026-03-29"

impact:
  business_value: |
    Opens the results corpus to community contributions without the operational
    burden of a hosted API. Grows the dataset and community engagement.
  user_impact: |
    Users can contribute their own benchmark results and see them on the public
    explorer alongside maintainer results.

must_preserve:
- "Phase 1 explorer continues to work for maintainer-curated results"
- "The canonical schema-v2 bundle remains the submission artifact — no alternative format"
- "Existing benchbox run/export workflows are not modified"

approach: |
  Build on the Phase 1 foundation. The static build pipeline already transforms
  bundles into read models — Phase 2 just adds more bundles from community PRs.
  The `benchbox submit` command is a thin packaging layer, not a new code path.

anti_patterns:
- "DO NOT build a hosted API for Phase 2 — because PR-based submission is sufficient until volume demands it — avoid premature infrastructure"
- "DO NOT auto-merge community submissions without maintainer review — because unreviewed results degrade trust — require human approval"

verification:
- description: "benchbox submit --output packages a valid submission bundle"
  command: "uv run -- python -m pytest tests/unit/cli/commands/test_submit.py -q"
  expected_output: "All tests pass"
- description: "CI validation workflow catches invalid submissions"
  command: "uv run -- python -m pytest tests/unit/scripts/test_validate_submission.py -q"
  expected_output: "All tests pass"
- description: "Trust labels render correctly in the explorer"
  command: "cd results-explorer && npm run build && grep -l 'Community Submitted' dist/r/*/index.html | head -1"
  expected_output: "At least one detail page with community label"

scope_limit:
  only_modify:
  - "benchbox/cli/commands/submit.py"
  - "scripts/validate_submission.py"
  - "results-explorer/src/"
  - ".github/workflows/"
  - "docs/"
  - "tests/"
  do_not_modify:
  - "benchbox/core/results/exporter.py"
  - "benchbox/core/benchmark_registry.py"
