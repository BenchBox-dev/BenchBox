id: single-repo-migration-phase-9-decommission-archive
title: "Single-repo migration phase 9: decommission archived benchbox-private and retired private clone after 60-90 day soak"
worktree: main
priority: Low
status: Blocked
category: Release Tooling

deps:
  needs:
  - single-repo-migration-phase-8-first-post-migration-release

blockers:
- date: "2026-05-25"
  work: [w1, w2, w3, w4, w5, w6]
  reason: |
    Phase 9 is not ready. Its Phase 8 dependency is blocked, and the
    explicit Phase 9 soak has not reached the minimum 60 days. Phase 5
    completed on 2026-04-27, so the earliest 60-day checkpoint is
    2026-06-26; the 90-day upper checkpoint is 2026-07-26.
  evidence: |
    - `deps.needs` requires `single-repo-migration-phase-8-first-post-migration-release`.
    - PR #662 records Phase 8 as blocked on unresolved Phase 4 release recovery.
    - `_project/DONE/main/planning/single-repo-migration-phase-5-repo-flip.yaml` has `completed_date: "2026-04-27"`.
    - The TODO itself says default action is KEEP because deleting the archive is irreversible and costs nothing to defer.
  unblock: |
    Revisit on or after 2026-06-26, and only after Phase 8 or an
    approved recovery-release TODO such as `release-recovery-v0-3-1` has
    completed and been accepted as satisfying the release dependency. At
    that point audit the retired clone and external references before
    deciding whether to keep or delete the archived
    `joeharris76/benchbox-private` repo.

description: |
  Optional final cleanup. After enough time has passed (60-90 days post
  Phase 5) that you are confident no external link, fork, or PyPI
  consumer depends on the archived joeharris76/benchbox-private repo, and
  no in-flight work is hiding in the retired local clone, the archive can
  be deleted and the local clone removed.

  This is intentionally low priority and deferred. The archive costs
  nothing to keep; deleting it is irreversible. Default action is to
  leave it forever as a historical reference - this TODO exists only
  in case you want to clean up later.

  Note: under Option B there is no joeharris76/BenchBox-archive (no rename
  happened); the archive being decommissioned here is
  joeharris76/benchbox-private (the original private repo).

  Plan file: /Users/joe/.claude/plans/single-repo-migration.md (Phase 9).

work:
- id: w1
  summary: "Wait at least 60 days from Phase 5 (dev locus migration) before considering deletion"
  status: pending
  notes: |
    Calendar gate. Phase 5 sets the clock. Confirm by checking the
    Phase 5 completed_date when this item moves to in_progress.

- id: w2
  summary: "Audit the retired private clone for any uncommitted/unpushed work"
  status: pending
  notes: |
    cd /Users/joe/Developer/BenchBox.retired-20260427
    git status                        # any unstaged or staged work?
    git stash list                    # any stashed work?
    git branch -vv                    # any branch with [ahead N] vs upstream?
    Anything found here is potentially valuable lost work. Cherry-pick
    forward into the new dev locus before considering deletion.

- id: w3
  summary: "Audit external references to old URLs"
  status: pending
  notes: |
    Search for old repo URL patterns in places you control:
    blog posts, slides, papers, social profiles, talks, READMEs of
    other projects, etc.
    Patterns to check:
      - github.com/joeharris76/benchbox-private  (was the private)
    Update each to point at github.com/joeharris76/BenchBox.
    Note: Option B left joeharris76/BenchBox unchanged, so the public
    URL was always correct — only references to benchbox-private (which
    should not exist externally since the repo was private) need attention.

- id: w4
  summary: "Decide: delete the archived benchbox-private GitHub repo, or keep it"
  needs: [w1, w3]
  status: pending
  notes: |
    Two reasonable choices:
    - DELETE: GitHub UI -> Settings on joeharris76/benchbox-private ->
      Danger zone -> Delete this repository. Irreversible. Frees the
      repo name from your account.
    - KEEP: do nothing. The archive sits there forever as a frozen
      historical artefact. Costs zero.
    Default to KEEP unless there is a specific reason to delete (e.g.,
    embarrassing content discovered post-archive, or repo-name
    reclamation needed).
    Record the decision in _project/decisions/single-repo-migration.md
    as the final entry.

    If this phase opens a PR, the PR body must include the API surface
    diff section from `_project/specs/migration-api-surface-gate.md`
    before this work unit can be marked done. Use explicit `none` rows
    when the phase introduces no commands, console scripts, public Python
    imports, or file-system conventions.

- id: w5
  summary: "Decide: delete the retired private clone, or keep it"
  needs: [w2]
  status: pending
  notes: |
    rm -rf /Users/joe/Developer/BenchBox.retired-20260427
    Default action: delete after w2 confirms no lost work. Costs disk
    space; serves no purpose once the archive is verified.
    Skip if disk space is fine and you want a permanent local snapshot.

- id: w6
  summary: "Remove MIGRATION-NOTES.md from repo root if it was added in Phase 5"
  needs: [w4]
  status: pending
  notes: |
    If Phase 5 added a MIGRATION-NOTES.md, remove it now. The
    migration is no longer "recent" and the note clutters the repo
    root. Open a PR with the deletion.

verification:
- description: "Decision recorded in decisions doc"
  command: "grep -c 'phase 9\\|archive' _project/decisions/single-repo-migration.md"
  expected_output: "at least 1"
- description: "MIGRATION-NOTES.md removed if it existed"
  command: "test ! -f MIGRATION-NOTES.md && echo OK"
  expected_output: "OK"
- description: "Any Phase 9 PR includes the migration API surface diff gate"
  command: "gh pr view <phase-9-pr> --json body --jq '.body' | grep -c '## API surface diff'"
  expected_output: ">= 1, or this TODO records that no PR was opened"

success_metrics:
- "Any Phase 9 PR body includes an API surface diff section, or the DONE item records why no PR was opened and therefore no PR-body gate applied."

must_preserve:
- All git history on the canonical joeharris76/BenchBox repo is
  preserved (Option B never touched it; this phase doesn't either).
- Any external bookmarks to joeharris76/BenchBox continue to work
  (URL unchanged throughout the migration).

anti_patterns:
- DO NOT rush this - because the archive costs nothing to keep, and
  deletion is irreversible. The default action is to do nothing.
- DO NOT delete the retired private clone before w2 confirms no
  uncommitted/unpushed work exists - because that work is irrecoverable
  if the GitHub-side archive has also been deleted.
- DO NOT delete the archive if forks of benchbox-private exist (unlikely
  for a private repo) - because users who forked from the old URL will
  lose their fork's upstream.

scope_limit:
  only_modify:
  - _project/decisions/single-repo-migration.md  # record final decision
  - MIGRATION-NOTES.md  # remove if it was added
  - /Users/joe/Developer/BenchBox.retired-20260427/  # delete if w5 chooses delete
  notes: |
    GitHub UI changes only (potential archive deletion). No code
    changes in the canonical repo beyond the optional notes file removal.
