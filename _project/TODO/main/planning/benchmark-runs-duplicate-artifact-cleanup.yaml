id: benchmark-runs-duplicate-artifact-cleanup
title: "Audit and clean duplicate worktree-local benchmark_runs artifacts"
worktree: main
priority: Medium-High
status: Not Started
category: Testing and Quality Assurance

description: |
  Once output-root propagation and artifact guardrails are in place, audit and
  clean the already-written duplicate generated data from repo and pool
  worktrees.

  Known duplicate/generated locations from the 2026-06-01 investigation:

  - `/Users/joe/Developer/BenchBox/benchmark_runs`: about 6.2G, mostly
    `datagen/`, containing SF1 data for TPCH variants, Vector Search, H2ODB,
    SSB, Nyctaxi, ClickBench, and related benchmarks.
  - `/Users/joe/Developer/BenchBox.pool-01/benchmark_runs`: about 4.2G,
    mostly `datagen/`, with large files including `tpch_skew_sf1/lineitem.tbl`,
    `vector_search_sf1/vectors.csv.zst`, `h2odb_sf1/trips.tbl.zst`,
    `ssb_sf1/lineorder.tbl.zst`, `nyctaxi_1.0/trips.csv.zst`, and
    `clickbench_sf1/hits.csv.zst`.

  Cleanup must happen only after the root cause is fixed or protected, because
  otherwise the next UAT/corpus run can recreate the same duplicate data.
  Cleanup must also preserve any unique result bundles, manifests, or evidence
  that are not redundant with the shared root under `~/Developer/benchmark_runs`.

deps:
  needs:
    - benchmark-runs-output-root-propagation
    - benchmark-runs-local-artifact-guardrails

prior_art:
  - "docs/operations/uat-framework.md:Long-Running UAT — reuse shared-root conventions for durable UAT evidence"
  - "benchmark_runs/ repository ignore conventions — preserve generated data out of git"
  - "tests/uat validation/submission tooling — use existing manifest/result validators before discarding any non-datagen evidence"

work:
  - id: w0
    summary: "Confirm root-cause fix and guardrails are merged or active before deleting anything"
    status: pending
    notes: |
      Record the merged PR numbers or checked SHA(s). If either prerequisite is
      not available, stop after producing an audit report and do not delete data.
  - id: w1
    summary: "Inventory repo and pool worktree `benchmark_runs` directories"
    needs: [w0]
    status: pending
    notes: |
      Produce a compact inventory with path, size, newest mtime, file count,
      top large files, and whether each directory is datagen-only or contains
      result bundles/manifests. Raw command output stays in `/tmp`; the durable
      summary can go in a PR body, TODO note, or small markdown report.
  - id: w2
    summary: "Compare worktree-local artifacts against `~/Developer/benchmark_runs`"
    needs: [w1]
    status: pending
    notes: |
      Identify which generated data is redundant with the shared root and which
      evidence, if any, is unique. Preserve unique run results, manifests,
      lifecycle logs, and submission evidence before cleanup.
  - id: w3
    summary: "Request explicit approval for the exact cleanup operation"
    needs: [w2]
    status: pending
    notes: |
      Present the specific paths, byte counts, and preservation plan. Do not
      infer approval from this TODO alone because deletion is intentionally
      destructive.
  - id: w4
    summary: "Remove or archive only approved duplicate generated data"
    needs: [w3]
    status: pending
    notes: |
      Prefer removing redundant datagen-only directories. If unique evidence is
      found, move it to the approved shared root or an agreed archive location
      before deleting the duplicate worktree-local tree.
  - id: w5
    summary: "Verify no new worktree-local artifacts appear after a representative external-root smoke"
    needs: [w4]
    status: pending
    notes: |
      Run a lightweight external-root smoke after cleanup. Confirm the cleaned
      worktree-local path remains absent or unchanged and the shared root
      receives any expected generated artifacts.

must_preserve:
  - "No deletion happens until `benchmark-runs-output-root-propagation` and `benchmark-runs-local-artifact-guardrails` are merged or explicitly confirmed active."
  - "Unique result JSON, manifests, lifecycle logs, and submission evidence are preserved before any datagen cleanup."
  - "Cleanup commands are path-specific; no global filesystem prune or unbounded recursive deletion."
  - "Git-tracked files and pool worktree metadata are untouched."

approach: |
  Treat cleanup as a controlled operations task. First prove the root cause is
  fixed or guarded. Then inventory all repo and pool worktree local
  `benchmark_runs` trees, classify datagen-only duplicates versus durable
  result evidence, compare against the shared root, and ask for explicit
  approval with exact paths and byte counts before deletion. Finish with a
  representative external-root smoke to prove cleanup does not immediately
  regress.

anti_patterns:
  - "DO NOT run `rm -rf` from a parent directory or with a glob - cleanup must list exact approved paths."
  - "DO NOT delete result bundles or manifests just because they live under a duplicate root - classify and preserve unique evidence first."
  - "DO NOT clean before the output-root bug is fixed or guarded - that only frees space temporarily."
  - "DO NOT use Docker/system prune as part of this task - the target is BenchBox-generated filesystem data only."

verification:
  - description: "Inventory report covers every BenchBox clone/pool worktree with a local benchmark_runs tree"
    command: "find ~/Developer -maxdepth 2 -type d -name benchmark_runs -path '*BenchBox*' -print"
    expected_output: "all candidate local benchmark_runs paths are listed and classified"
  - description: "Cleanup approval names exact paths and byte counts"
    expected_output: "user approval explicitly covers each destructive path"
  - description: "Post-cleanup audit shows approved duplicate paths removed or reduced as expected"
    command: "du -sh /Users/joe/Developer/BenchBox/benchmark_runs /Users/joe/Developer/BenchBox.pool-*/benchmark_runs 2>/dev/null || true"
    expected_output: "approved duplicate datagen paths are absent or no longer contain redundant generated data"
  - description: "External-root smoke does not recreate worktree-local generated data"
    command: "BENCHBOX_OUTPUT_DIR=~/Developer/benchmark_runs uv run -- benchbox run --platform duckdb --benchmark tpch --scale 0.01 --queries Q1 --phases generate --non-interactive"
    expected_output: "shared root receives expected output; active worktree-local benchmark_runs remains absent or unchanged"

scope_limit:
  only_modify:
    - "_project/TODO/"
    - "_project/DONE/"
    - "docs/operations/uat-framework.md"
  do_not_modify:
    - "benchbox/"
    - "tests/"
    - "benchmark_runs/"

success_metrics:
  - "Duplicate worktree-local generated data is inventoried, classified, and cleaned only after explicit approval."
  - "Any unique non-datagen evidence is preserved in the shared root or an approved archive before deletion."
  - "A representative external-root smoke does not recreate local duplicate artifacts after cleanup."

