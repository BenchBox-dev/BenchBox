id: benchmark-api-and-core-boundary-cleanup
title: "Architecture hardening: classify benchmark APIs and reduce core boundary drift"
worktree: main
priority: Medium
status: "Not Started"
category: Core Architecture

deps:
  needs:
    - architecture-contract-map-and-support-taxonomy

description: |
  Benchmark APIs are split across tested top-level wrappers, a public
  benchbox.base.BaseBenchmark, a small remaining core.base_benchmark class,
  lazy registries, loaders, and benchmark-family code inside broad core/base
  mixins. The wrappers are not accidental; tests assert facade behavior. The
  cleanup target is the remaining ambiguous base/loader split and the lack of a
  benchmark-family extension boundary, not a wrapper purge.

  This item classifies benchmark API surfaces, retires or justifies the second
  base class, and prepares a benchmark-family plugin seam without a broad
  rewrite.

work:
  - id: w0
    summary: "Revalidate benchmark API surfaces, wrapper tests, registries, and core boundary issues"
    status: pending
    notes: |
      Commit a compact summary of checked SHA, BaseBenchmark classes,
      subclasses, wrapper tests, lazy registries, and loader entry points.

      Minimum evidence to re-check:
        - benchbox/base.py public BaseBenchmark and run_with_platform.
        - benchbox/core/base_benchmark.py legacy/secondary BaseBenchmark.
        - tests/unit/test_wrapper_facades_fast.py.
        - benchbox/__init__.py lazy benchmark registry.
        - benchbox/core/benchmark_loader.py.
        - docs/reference/backward-compatibility.md benchmark API entries.

  - id: w1
    summary: "Decision gate: define wrapper-vs-CLI-vs-loader public API contract"
    needs: [w0]
    status: pending
    notes: |
      Record whether benchbox.TPCH(...), benchbox.base.BaseBenchmark,
      BaseBenchmark.run_with_platform, CLI, MCP, and core loaders are public,
      beta-public, internal, deprecated, or generated.

      Do not collapse wrappers unless the decision explicitly deprecates a
      tested public facade and adds a migration path.

  - id: w2
    summary: "Retire, alias, or justify benchbox/core/base_benchmark.py"
    needs: [w1]
    status: pending
    notes: |
      The second base class must become one of:
        - removed after migrating remaining users,
        - thin compatibility alias with deprecation,
        - documented internal base with a distinct purpose and tests.

      Update docs/reference/backward-compatibility.md accordingly.

  - id: w3
    summary: "Reconcile benchmark registry, wrapper, and loader counts"
    needs: [w1]
    status: pending
    notes: |
      Add a generated or tested count check so wrappers, lazy registry entries,
      core loader discoverability, docs, and MCP/CLI surfaces cannot drift
      silently. The output should distinguish public wrapper availability from
      internal benchmark family support.

  - id: w4
    summary: "Design the benchmark-family plugin seam as an ADR before extraction"
    needs: [w1]
    status: pending
    notes: |
      Write a short ADR or design note describing where benchmark-family logic
      should live, what a family plugin owns, how phases are supplied, how
      result schema fields are shared, and how TPC-H/TPC-DS compatibility is
      preserved.

      Do not begin a large extraction in this TODO unless the seam is limited to
      interfaces and one pilot family.

  - id: w5
    summary: "Add an import-boundary check for core modules that depend on platform adapters"
    needs: [w4]
    status: pending
    notes: |
      Identify and either fix or explicitly exempt core-to-platform dependency
      inversions such as tuning code importing a specific platform adapter. The
      check should be narrow enough to avoid blocking intentional optional
      plugin registration.

deferred:
  - summary: "Split all of benchbox/core into engine and benchmark packages"
    reason: "Large structural refactor should follow the public API decision and plugin-seam ADR."
  - summary: "Remove all wrapper facades"
    reason: "Wrappers are tested as public facades unless explicitly deprecated."

metadata:
  tags:
    - benchmarks
    - api
    - core
    - plugins
  estimated_effort: "4-8 days"
  created_date: "2026-05-21"
  last_updated: "2026-05-21T00:00:00Z"

impact:
  business_value: |
    Keeps user-facing benchmark APIs stable while reducing internal extension
    cost for new benchmark families.
  user_impact: |
    Users and contributors know whether to rely on wrappers, CLI, MCP, or loader
    APIs.
  technical_debt: |
    Removes ambiguous base classes and starts turning core from a dumping ground
    into explicit engine and benchmark-family boundaries.

files_affected:
  modified:
    - "benchbox/base.py"
    - "benchbox/core/base_benchmark.py"
    - "benchbox/core/benchmark_loader.py"
    - "benchbox/core/__init__.py"
    - "benchbox/core/tuning/"
    - "benchbox/__init__.py"
    - "tests/unit/test_wrapper_facades_fast.py"
    - "docs/reference/backward-compatibility.md"
    - "docs/reference/public-contracts.md"
    - "docs/design/"

must_preserve:
  - "Do not break top-level wrapper facade tests unless an explicit deprecation path lands in the same PR."
  - "Do not move benchmark-family code in a way that changes result bundle shape."
  - "Do not introduce platform adapter imports into core engine modules."

approach: |
  Start with API classification and small ambiguity removals. Treat a
  benchmark-family plugin seam as a design gate before extraction, and use tests
  to keep wrappers, registries, and loaders aligned.

anti_patterns:
  - "DO NOT interpret duplicate wrapper reachability as accidental -- tests assert facade behavior -- classify first."
  - "DO NOT create a third benchmark base class while cleaning up two existing bases -- remove, alias, or justify the secondary base."
  - "DO NOT split core by moving files mechanically -- dependency direction and public API status must drive the boundary."

verification:
  - description: "Run wrapper facade and benchmark loader tests."
    command: "uv run -- python -m pytest tests/unit/test_wrapper_facades_fast.py tests -k 'benchmark_loader or base_benchmark' --tb=short"
    expected_output: "Wrapper and loader tests pass."
  - description: "Run import-boundary check added by this item."
    command: "uv run -- python -m pytest tests -k 'import_boundary or core_boundary' --tb=short"
    expected_output: "Core/platform dependency boundary tests pass or known exemptions are documented."

scope_limit:
  only_modify:
    - "benchbox/base.py"
    - "benchbox/core/base_benchmark.py"
    - "benchbox/core/benchmark_loader.py"
    - "benchbox/core/__init__.py"
    - "benchbox/core/tuning/"
    - "benchbox/__init__.py"
    - "tests/unit/test_wrapper_facades_fast.py"
    - "tests/unit/core/"
    - "tests/docs/"
    - "docs/reference/"
    - "docs/design/"
    - "_project/TODO/"
    - "_project/DONE/"
  do_not_modify:
    - "benchbox/platforms/"
    - "benchbox/mcp/"
    - "benchbox/sql_compat/"

prior_art:
  - "tests/unit/test_wrapper_facades_fast.py: existing wrapper contract tests -- preserve as public API evidence."
  - "docs/reference/backward-compatibility.md: existing base-class lifecycle entries -- update rather than invent separate lifecycle docs."
  - "docs/development/run-lifecycle-map.md: existing lifecycle documentation -- align any plugin seam with this flow."

success_metrics:
  - "Every benchmark API surface is classified in the contract map."
  - "The secondary BaseBenchmark has a documented lifecycle or is removed."
  - "Benchmark registry/wrapper/loader count drift is tested or generated."
  - "A benchmark-family plugin seam ADR exists before broad extraction."

open_questions:
  - "Should a new benchmark family be addable without editing platform base execution mixins?"
  - "Are top-level wrappers part of the long-term Python API or beta-public convenience facades?"
