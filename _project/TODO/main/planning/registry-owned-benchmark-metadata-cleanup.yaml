    command: "uv run -- python -m pytest tests/unit/cli/test_benchmark_manager_behavioral.py tests/unit/cli/test_benchmark_selection.py -q"
    expected_output: "Focused CLI benchmark manager tests pass after adding estimate metadata coverage."
  - description: "MCP discovery tests pass after docstring wording changes."
    command: "uv run -- python -m pytest tests/unit/mcp/test_discovery_tools.py -q"
    expected_output: "MCP discovery tests pass."
  - description: "Fast suite remains green after metadata changes."
    command: "uv run -- python -m pytest -m fast -q"
    expected_output: "Fast tests pass."

