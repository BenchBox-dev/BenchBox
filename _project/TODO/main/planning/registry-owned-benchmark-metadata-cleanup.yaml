    - "benchbox/platforms/"
    - "landing/"
    - "benchmark_runs/"

success_metrics:
  - "Every benchmark has registry-owned `estimated_time_range`, `base_memory_gb`, and `data_source` metadata."
  - "CLI estimate helpers contain no per-benchmark local dicts."
  - "Fresh registry import performs zero benchmark constructor probes for metadata."
  - "MCP benchmark info docstring no longer repeats a hand-maintained benchmark list."

open_questions:
  - "Should `base_memory_gb` represent generation memory, query execution memory, or current CLI guidance semantics? Preserve current CLI semantics unless a product decision says otherwise."
  - "Should the data-source runtime getter become deprecated after static metadata is validated?"
