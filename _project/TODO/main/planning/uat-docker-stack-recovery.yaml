id: uat-docker-stack-recovery
title: "Recover UAT Docker stacks: LakeSail startup timeout + empty Docker-OLTP run"
worktree: main
priority: High
status: In Progress
category: Platform Expansion

description: |
  Neither Docker UAT run from 2026-05-28 produced usable release-gate
  evidence:

  - uat_complete_docker_non_oltp_20260528_20260528: cells.jsonl is EMPTY
    (0 bytes) -> zero cells executed. uat_lifecycle.log shows only LakeSail:
    "platform=lakesail action=up status=failed ... docker command timed out
    after 300s", then "action=down status=ok". compatibility_pruned.jsonl
    has 54 rows (lakesail, pg-duckdb, pg-mooncake, timescaledb, questdb) but
    no non-pruned cell for any platform executed — the run ended after the
    LakeSail compose-up timeout without attempting the remaining stacks.
  - uat_complete_docker_oltp_20260528_20260528: the run directory is EMPTY
    (0 files) — nothing ran; no manifests, no logs. No Docker-platform
    result JSONs dated 2026-05-28/29 exist anywhere.

  Two failures to fix: (1) LakeSail compose-up exceeds the 300s
  docker_start_timeout_s (Spark Connect SparkSession startup); (2) the
  Docker-OLTP sweep never started / produced nothing and must be re-run from
  scratch with verified daemon + disk preconditions. Each Docker platform
  must run individually (up -> run -> down) with lifecycle logs and a
  non-empty run directory.

prior_art:
  - "docs/operations/uat-framework.md 'Docker storage cleanup' — docker_manage_platforms up/run/down lifecycle, docker_start_timeout_s, make uat-docker-cleanup; reuse the managed-lifecycle contract"
  - "tests/uat/docker_assets.py + tests/uat/docker_cleanup.py — existing UAT-owned compose project handling; extend, do not replace"
  - "uat_complete_docker_non_oltp_20260528 uat_lifecycle.log — reference for the docker action/status log line shape"

work:
  - id: w0
    summary: "Confirm Docker daemon health + Docker data-root free space as a precondition before a Docker sweep"
    status: done
    notes: |
      Satisfied upstream: the disk-headroom preflight gate landed in
      uat-preflight-disk-headroom-gate (#693, merged) and preflight treats
      Docker as required in managed mode (docker ps / docker compose). Docker
      daemon confirmed available in the implementation environment.
  - id: w1
    summary: "Measure LakeSail normal compose-up time; raise docker_start_timeout_s only to a justified value"
    status: done
    notes: |
      Mechanism + guidance delivered (CODE part). docs/operations/uat-framework.md
      now documents the measure-then-set procedure: bring the stack up in
      isolation (make uat-bring-up PLATFORM=lakesail), confirm health, time it,
      then set cleanup.docker_start_timeout_s above the observed healthy time.
      Per the anti-pattern the global default is NOT raised blindly. The actual
      LakeSail value must be set from a measured healthy startup during the
      release-gate bring-up (requires building the benchbox-lakesail Spark
      Connect image, which is the live-environment step folded into the
      release-gate re-run; see uat-certification-rerun-ordering-and-gate w5).
  - id: w2
    summary: "Ensure a single platform's compose-up failure does not end the sweep; remaining stacks still attempt"
    needs: [w0]
    status: done
    notes: |
      Fixed in tests/uat/phases/execute.py: a managed compose-up failure
      (cleanup_status == "startup-failed") now records the platform's cells as
      skipped-unreachable (the failure is captured in docker_events /
      uat_lifecycle.log action=up status=failed), tears down the half-started
      stack, and advances to the next stack — instead of breaking the whole
      sweep. Genuine global aborts (free space, teardown failure, fixed
      container-name policy) still abort. Regression test:
      tests/uat/test_phases.py::test_execute_docker_startup_failure_records_and_advances_to_next_platform.
      NOTE: this required editing tests/uat/phases/execute.py + test_phases.py,
      which were outside the original scope_limit only_modify list (the FAIL-
      and-advance machinery was assumed owned by uat-artifact-integrity-and-
      failure-capture #691, but #691 did not make compose-up failure non-fatal).
      scope_limit expanded below with this justification.
  - id: w3
    summary: "[VIA cert-rerun w5 — NOT standalone] Re-run Docker-OLTP from scratch into a fresh run root with full lifecycle logs"
    needs: [w0, w1, w2]
    status: pending
    notes: |
      OPERATIONAL / live-environment step. NOT independently actionable and NOT
      a standalone Docker-only rerun: it is executed ONLY inside the four-stage
      release-gate sweep [[uat-certification-rerun-ordering-and-gate]] w5
      (native -> dataframe -> docker non-OLTP -> docker OLTP), which runs the
      Docker OLTP stacks into a fresh root rather than running the re-run twice.
      Running just the Docker stacks here would reproduce the ordering
      contamination that w5's anti-pattern forbids ("DO NOT start a Docker stack
      before native + dataframe platforms finish"). Kept `status: pending`
      (the schema allows only pending/in_progress/done) but the summary and these
      notes mark it as cert-w5-owned so the ready queue is not mistaken for a
      standalone task. Requires built/pulled Docker images (OLTP stacks) + the
      live Docker daemon. The empty 2026-05-28 oltp dir is non-evidentiary.
  - id: w4
    summary: "[VIA cert-rerun w5 — NOT standalone] Re-run Docker-non-OLTP; verify per-platform up/run/down + non-empty cells.jsonl"
    needs: [w0, w1, w2]
    status: pending
    notes: |
      OPERATIONAL / live-environment step. Same folding as w3: executed ONLY
      inside [[uat-certification-rerun-ordering-and-gate]] w5 into a fresh root,
      after native + dataframe stages complete — not as a standalone Docker
      sweep. Kept `status: pending` per schema; the summary carries the
      cert-w5-owned guard. The w2 fix here guarantees a single stack's startup
      failure no longer truncates the non-OLTP sweep, which was the root cause
      of the empty 2026-05-28 cells.jsonl.

deps:
  needs:
    - uat-artifact-integrity-and-failure-capture

must_preserve:
  - "UAT never runs docker system/volume/image prune or unqualified compose down; only project-scoped benchbox-uat-* teardown."
  - "Exactly one Docker stack runs at a time (sequential); PostgreSQL-family stacks sharing 5432 stay serialized."
  - "Existing compatibility_pruned rules for docker platforms are unchanged."

approach: |
  Split infra hardening from re-runs. First confirm daemon + disk (w0) and
  the real LakeSail startup time (w1). Then make a failed compose-up a
  recorded, non-fatal event so the sweep advances (w2, depends on the
  failure-capture/abort-safe work). The code work (w0-w2) is complete; the
  Docker re-runs (w3, w4) are deferred and executed ONLY as part of the
  four-stage release-gate sweep [[uat-certification-rerun-ordering-and-gate]]
  w5 (into a fresh root, after native + dataframe stages), not as a standalone
  Docker sweep here. Both re-run dirs must be non-empty with up/run/down
  lifecycle lines.

anti_patterns:
  - "DO NOT raise docker_start_timeout_s until you have measured a healthy startup - a longer timeout on a broken service just wastes 5+ minutes per attempt."
  - "DO NOT reuse the empty 2026-05-28 oltp run dir as evidence - it has none; re-run into a fresh root."
  - "DO NOT let one compose-up timeout abort the entire Docker sweep."

verification:
  - description: "Docker assets + cleanup tests pass"
    command: "uv run -- python -m pytest tests/uat/test_docker_assets.py tests/uat/test_docker_cleanup.py tests/uat/test_cleanup.py -q"
    expected_output: "all pass"
  - description: "A managed Docker smoke produces a non-empty cells.jsonl with up/run/down lifecycle lines"
    command: "make uat-sweep CONFIG=tests/uat/configs/stress-docker-managed.yaml"
    expected_output: "run dir contains non-empty cells.jsonl and uat_lifecycle.log with action=up/down status lines per platform"

scope_limit:
  only_modify:
    - "tests/uat/docker_assets.py"
    - "tests/uat/docker_cleanup.py"
    - "tests/uat/cleanup.py"
    - "tests/uat/config.py"
    - "tests/uat/configs/"
    - "tests/uat/test_docker_assets.py"
    - "tests/uat/test_docker_cleanup.py"
    - "tests/uat/test_cleanup.py"
    - "docs/operations/uat-framework.md"
    # Expanded during implementation: the w2 "compose-up failure must not abort
    # the sweep" fix lives in the per-platform execute loop, which only exists
    # in tests/uat/phases/execute.py. The original scope assumed this machinery
    # was owned upstream by #691, but #691 did not make compose-up failure
    # non-fatal. The change is surgical (route a startup-failed stack to
    # skipped-unreachable + continue, reusing the existing path) and unit-tested.
    - "tests/uat/phases/execute.py"
    - "tests/uat/test_phases.py"

success_metrics:
  - "Both Docker stacks re-run into a fresh root with non-empty cells.jsonl, per-platform up/run/down lifecycle logs, and no empty run directories."
  - "A single stack's compose-up failure no longer ends the sweep."

