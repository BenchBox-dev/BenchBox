id: execution-harness-extraction-throughput-maintenance-combined
title: "Extend capability-based power-harness dispatch to throughput, maintenance, and combined tests"
worktree: main
priority: Medium
status: Not Started
category: Code Quality and Technical Debt

description: |
  Follow-up to structural-debt-base-layer-tpc-and-module-split (PR #914, DONE).
  #914's w1 success_metric — "platforms/base/execution.py carries no literal TPC
  benchmark names in its dispatch path" — was met ONLY for the power-test path:
  _execute_power_test (execution.py:682 on origin/develop) now dispatches via
  resolve_power_harness(benchmark_id) with zero literals. But _execute_throughput_test,
  _execute_maintenance_test, and _execute_combined_test still branch on literal
  `benchmark_id == "tpch"` / `== "tpcds"` (origin/develop execution.py ~713-779).
  The guard test test_power_dispatch_path_has_no_literal_tpc_benchmark_names
  inspects only _execute_power_test, so the broader metric reads as met when it is
  not. This item extends the capability-registry dispatch to the remaining three
  test types and broadens the guard test to all four.

  Behavior-preserving refactor: throughput/maintenance/combined carry stream/cursor
  and connection-factory wiring (the TPC-DS path uses connection_factory +
  _make_stream_cursor for thread-safe cursors); that wiring must be preserved
  exactly, as #914 did for the power path.

prior_art:
  - ref: "benchbox/core/power_harnesses.py"
    note: "resolve_power_harness + the per-benchmark power harness modules #914 introduced (core/tpch/platform_power.py, core/tpcds/platform_power.py). Extend this registry with throughput/maintenance/combined harness resolution; do not invent a parallel dispatch."
  - ref: "benchbox/platforms/base/execution.py:682"
    note: "The already-extracted _execute_power_test as the template: capability lookup, harness invocation, preserved connection/cursor wiring."
  - ref: "tests/unit/platforms/"
    note: "test_power_dispatch_path_has_no_literal_tpc_benchmark_names — broaden it to assert no literal TPC names across all four dispatch methods."

work:
  - id: w0
    summary: "Re-confirm the residual literals and the guard test scope on fresh develop"
    status: pending
    needs: []
    notes: |
      Grep execution.py for `benchmark_id == "tpc` and record each method + line
      (line numbers in this TODO are origin/develop at review time and will drift).
      Confirm the guard test currently inspects only _execute_power_test. Summarize
      in the PR body.

  - id: w1
    summary: "Extract throughput dispatch to capability resolution"
    status: pending
    needs: [w0]
    notes: |
      Move the TPC-H/TPC-DS throughput bodies behind a resolve_*_harness lookup,
      preserving stream/cursor and connection-factory wiring exactly. Per-benchmark
      bodies live under core/tpc{h,ds}/, mirroring the power split.

  - id: w2
    summary: "Extract maintenance dispatch to capability resolution"
    status: pending
    needs: [w0]
    notes: |
      Same treatment for _execute_maintenance_test, preserving the
      set_config_validation_mode call point and DML/refresh semantics.

  - id: w3
    summary: "Extract combined dispatch to capability resolution"
    status: pending
    needs: [w1, w2]
    notes: |
      _execute_combined_test composes power+throughput+maintenance; route it through
      the now-extracted harnesses. No literal benchmark_id branch should remain.

  - id: w4
    summary: "Broaden the guard test to all four dispatch methods and restore the strong metric"
    status: pending
    needs: [w3]
    notes: |
      Extend test_power_dispatch_path_has_no_literal_tpc_benchmark_names (or add a
      sibling) to assert no literal TPC names in throughput/maintenance/combined too.
      Then correct the #914 DONE success_metric back to the full-dispatch claim (or
      coordinate with holistic-review-followup-metadata-truth, which reworded it to
      the interim power-path-only wording).

must_preserve:
  - "Byte-identical benchmark execution: query order, stream/cursor wiring, connection_factory + _make_stream_cursor thread-safe semantics, set_config_validation_mode call point."
  - "Public dispatch entry points (_execute_throughput_test etc.) keep their signatures and call contracts."

anti_patterns:
  - "DO NOT change execution semantics while extracting — this is a structural move only, proven by unchanged results on the correctness/equivalence gates."
  - "DO NOT add a second dispatch mechanism; extend resolve_*_harness."

verification:
  - description: "No literal TPC names remain in any execution.py dispatch method"
    command: "uv run -- python -m pytest tests/unit/platforms/ -k literal_tpc_benchmark_names -q"
    expected_output: "guard test asserts power, throughput, maintenance, and combined dispatch carry no literal benchmark_id == tpch/tpcds branches"
  - description: "Benchmark execution is unchanged"
    command: "uv run -- python -m pytest tests -m fast -k 'execution or power or throughput or maintenance' -q"
    expected_output: "execution behavior unchanged; all green"

scope_limit:
  only_modify:
    - "benchbox/platforms/base/execution.py"
    - "benchbox/core/power_harnesses.py"
    - "benchbox/core/tpch/"
    - "benchbox/core/tpcds/"
    - "tests/unit/platforms/"
    - "tests/"

success_metrics:
  - "execution.py carries no literal TPC benchmark names in ANY of the four dispatch methods."
  - "The guard test covers all four methods, so the #914 headline metric is true rather than power-path-only."

deferred:
  - summary: "Generalize the harness registry to non-TPC benchmark families."
    reason: "Only TPC has multi-phase power/throughput/maintenance shapes today; generalization is speculative until a second family needs it."

