id: restore-lightweight-fast-test-lane-with-comprehensive-reclassification
title: "Restore lightweight fast test lane with comprehensive test reclassification"
worktree: main
priority: High
status: Identified
description: |
  The current pytest fast lane no longer behaves like a lightweight developer
  suite. On 2026-03-07, `uv run -- python -m pytest -m "fast" --tb=short`
  selects 13,256 of 15,051 collected tests and produces a visible 10-30 second
  system lock-up during startup under the default parallel settings.

  The root cause is classification drift, not a single broken test. The marker
  policy in tests/conftest.py currently defaults most unclassified unit tests to
  `fast`, so recent testing improvements silently expanded the fast lane far
  beyond its intended scope. This interacts badly with pytest-xdist startup and
  heavy import/setup work, but parallel execution itself is not the problem and
  must be preserved for the curated fast lane.

  This TODO restores the original intent of the fast suite by performing a
  comprehensive reclassification of tests, tightening default marker policy,
  preserving parallel fast execution, and adding guardrails so the lane cannot
  quietly bloat again. The outcome target is a truly lightweight parallel fast
  suite aligned with the prior expectation that fast runs stay under roughly
  80 seconds.

category: Testing & Quality

deps:
  needs: []

work:
  - id: w1
    summary: "Capture the current fast-lane baseline, marker census, and startup hot spots"
    status: pending

  - id: w2
    summary: "Change default marker policy so unclassified tests no longer auto-enter the fast lane"
    needs: [w1]
    status: pending

  - id: w3
    summary: "Perform comprehensive reclassification of explicit fast-marked tests across unit and integration suites"
    needs: [w1]
    status: pending

  - id: w4
    summary: "Replace drifting path exceptions with a maintained classification inventory for medium, slow, stress, and resource-heavy coverage"
    needs: [w2, w3]
    status: pending

  - id: w5
    summary: "Update developer commands and marker-validation tests to match the curated fast-lane contract while keeping parallel execution"
    needs: [w2, w3, w4]
    status: pending

  - id: w6
    summary: "Add regression guardrails that fail when fast-lane size, composition, or runtime exceed budget"
    needs: [w4, w5]
    status: pending

  - id: w7
    summary: "Verify the final fast lane against the historical runtime target and document the new classification boundaries"
    needs: [w6]
    status: pending

deferred:
  - summary: "Tune xdist worker counts or pytest startup internals after reclassification"
    reason: "Worker tuning is secondary. The primary fix is to shrink and curate the fast lane without removing parallelism."
  - summary: "Redesign the entire test taxonomy beyond fast/medium/slow/stress/resource_heavy"
    reason: "This item is focused on restoring the fast suite and adding guardrails, not a full marker-system redesign."

metadata:
  tags:
    - testing
    - pytest
    - performance
    - developer-experience
    - classification
  estimated_effort: "Large"
  created_date: "2026-03-07"
  last_updated: "2026-03-07T10:29:19-05:00"

impact:
  business_value: |
    Restores a usable local developer feedback loop and prevents the test suite
    from degrading workstation responsiveness whenever the fast lane is run.
  user_impact: |
    BenchBox contributors regain a fast, trustworthy smoke suite that can be
    run frequently during development without freezing the machine.
  technical_debt: |
    Removes marker-policy drift, reduces ambiguity in test classification, and
    establishes automated protections so future test additions do not silently
    expand the fast lane.

files_affected:
  modified:
    - tests/conftest.py
    - pytest.ini
    - Makefile
    - tests/unit/test_standardized_test_commands.py
    - tests/unit/
    - tests/integration/
    - scripts/analyze_test_timings.py
    - _project/scripts/todo_cli.py
  added:
    - _project/TODO/main/planning/restore-lightweight-fast-test-lane-with-comprehensive-reclassification.yaml
  removed: []

must_preserve:
  - "`uv run -- python -m pytest -m \"fast\" --tb=short` remains a parallel run; do not force `-n 0` as the primary fix."
  - "Broad unit coverage remains available through existing non-fast commands such as `test-unit`; reclassification must not hide tests from routine quality workflows."
  - "The resource-heavy/stress split in `test-all` continues to protect machines from known heavyweight suites."
  - "Existing explicit slow, stress, and resource_heavy coverage remains runnable after reclassification."

approach: |
  Start from measurement, not intuition. Use the existing marker census and
  `scripts/analyze_test_timings.py` to capture the current fast-lane contents,
  slowest selected tests, and startup-heavy files. Then tighten the default
  policy in `tests/conftest.py` so unclassified tests land in `medium` unless
  there is a specific reason they belong in `fast`.

  After the default policy changes, audit every explicit `@pytest.mark.fast`
  usage across `tests/unit` and `tests/integration`. Reclassify tests based on
  actual behavior: subprocess/CLI startup, benchmark data generation, heavy
  imports, table-format dependencies, cloud-adjacent fixtures, and expensive
  file or database setup should move out of `fast`. Keep `fast` for true smoke
  and lightweight developer-loop coverage.

  Finish by updating command expectations and adding an automated guardrail that
  checks both composition and runtime budget so future test additions cannot
  silently re-inflate the fast lane.

anti_patterns:
  - "DO NOT make `test-fast` single-process with `-n 0` — because that hides the classification regression instead of fixing it — keep parallel execution and reduce the lane size."
  - "DO NOT treat `unit` as equivalent to `fast` — because many unit tests have heavy startup, subprocess, import, or data-generation costs — classify by observed behavior instead."
  - "DO NOT rely on a small hand-maintained exception list alone — because new tests will keep drifting into `fast` — add a maintained inventory and validation guardrails."
  - "DO NOT move expensive tests out of fast without preserving another routine lane that still covers them — because that creates hidden coverage gaps — keep them reachable through `medium`, `slow`, `stress`, or `resource_heavy` workflows."

verification:
  - description: "Record current marker counts before edits"
    command: "uv run -- python -m pytest -n 0 -m \"fast\" --collect-only -q"
    expected_output: "Shows the pre-fix fast selection count for before/after comparison."
  - description: "Validate TODO structure and dependency graph after authoring this item"
    command: "uv run _project/scripts/validate_todo.py _project/TODO/main/planning/restore-lightweight-fast-test-lane-with-comprehensive-reclassification.yaml && uv run _project/scripts/todo_cli.py check-graph"
    expected_output: "Validation passes and the TODO dependency graph reports no errors."
  - description: "Confirm the curated fast lane remains parallel and completes within budget after implementation"
    command: "uv run -- python -m pytest -m \"fast\" --tb=short"
    expected_output: "Fast suite runs in parallel without the prior startup lock-up and returns to an acceptably lightweight runtime, targeting the historical sub-80-second budget."
  - description: "Confirm broad unit coverage is still available outside the fast lane"
    command: "uv run -- python -m pytest -m \"unit\" --tb=short --collect-only -q"
    expected_output: "Unit tests remain broadly selectable even after fast-lane pruning."

scope_limit:
  do_not_modify:
    - benchbox/
    - docs/
    - examples/

success_metrics:
  - "Fast-lane membership is reduced from the current 13,256 tests to a deliberately curated lightweight subset."
  - "The fast command remains parallel and no longer causes the visible 10-30 second system lock-up at startup."
  - "Every explicit `@pytest.mark.fast` use in the repo is reviewed and either justified or reclassified."
  - "Automated checks prevent future fast-lane growth beyond the agreed budget and composition rules."

open_questions:
  - "Should the maintained classification inventory live directly in `tests/conftest.py` or in a dedicated data file consumed by the collection hook?"
  - "What exact count and runtime ceilings should be enforced for the guardrail based on the final curated fast lane?"
