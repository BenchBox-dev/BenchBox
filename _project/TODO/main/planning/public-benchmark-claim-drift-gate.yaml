id: public-benchmark-claim-drift-gate
title: "Add a drift gate for public benchmark count and support claims"
worktree: main
priority: Medium-High
status: "Not Started"
category: Documentation and Contracts

deps:
  needs:
    - benchmark-support-status-and-discovery-policy

description: |
  PR #502 updated the public contract map and MCP docs, but review found other
  public surfaces that still carry hand-maintained benchmark breadth claims such
  as "22 benchmarks" or exact coverage counts. README has a registry-backed
  marker, but landing copy, architecture docs, CLI utility docs, and development
  docs can still drift from benchmark registry metadata and support-status
  policy.

  Add a compact drift gate for public benchmark count and support claims. The
  gate should distinguish authoritative registry-derived claims from editorial
  examples, and it should make stale exact counts visible before release. This
  work should not force all narrative docs to become generated; it should define
  where exact public claims are allowed and how they are checked.

work:
  - id: w0
    summary: "Inventory exact benchmark count, coverage, and support-claim text across public docs, landing pages, scripts, and generated docs sources"
    status: pending
    notes: |
      Search for phrases such as "22 benchmarks", "23 benchmark", "registered
      benchmarks", "supported benchmarks", "benchmark variety", and benchmark
      support/status vocabulary. Classify each hit as authoritative,
      registry-derived, editorial example, stale, generated output, or internal
      planning context. Exclude `docs/_build/` and generated index artifacts.

  - id: w1
    summary: "Define allowed claim classes and source-of-truth rules"
    needs: [w0]
    status: pending
    notes: |
      Extend the public contract map or a nearby developer doc with concrete
      rules: exact public counts must be registry-derived or checked; editorial
      examples may avoid exact totals; generated outputs must state their
      generator; internal TODO/DONE history does not create public contract.

  - id: w2
    summary: "Implement a focused drift check for benchmark count and support-status claims"
    needs: [w1]
    status: pending
    notes: |
      Prefer extending an existing lightweight docs/contract test over adding a
      broad fragile scanner. The check should cover durable public surfaces such
      as README markers, landing source copy, architecture docs, CLI reference
      docs, and result-integrity coverage docs. It should report file paths and
      the stale phrase or missing registry-derived marker.

  - id: w3
    summary: "Repair stale public claims or reword them as editorial examples"
    needs: [w2]
    status: pending
    notes: |
      Update exact count claims to derive from the registry-backed marker where
      practical. Where exact counts are not important, reword copy to avoid a
      brittle total. Do not update historical TODO/DONE files unless they are
      being used as current public documentation.

  - id: w4
    summary: "Wire the drift check into the narrowest existing verification lane"
    needs: [w2, w3]
    status: pending
    notes: |
      Place the check where maintainers already expect public contract drift to
      fail, such as a unit contract test or the existing PR public-contract gate.
      Keep failure output concise and redirect any large inventory output to
      `/tmp` or a generated local artifact that is not committed.

metadata:
  tags:
    - benchmarks
    - docs
    - public-contracts
    - drift-gate
  estimated_effort: "1-2 days"
  created_date: "2026-05-21"
  last_updated: "2026-05-21T00:00:00Z"

impact:
  business_value: |
    Prevents public-facing benchmark breadth claims from becoming stale after
    registry changes, reducing user confusion and release-note cleanup.
  user_impact: |
    Keeps docs and landing pages aligned with the actual benchmark registry and
    support taxonomy.
  technical_debt: |
    Moves count-claim checking from ad hoc review memory into a repeatable gate.

files_affected:
  modified:
    - ".github/workflows/pr.yml"
    - "README.md"
    - "landing/index.html"
    - "docs/reference/public-contracts.md"
    - "docs/reference/cli/utilities.md"
    - "docs/development/result-integrity-validation.md"
    - "docs/design/architecture.md"
    - "tests/unit/core/test_benchmark_api_contract.py"
    - "tests/unit/core/test_platform_registry.py"

prior_art:
  - ".github/workflows/pr.yml: public contract source-derived claim check - extend or mirror for benchmark claim fragments."
  - "tests/unit/core/test_benchmark_api_contract.py: benchmark API snapshot marker - reuse registry-derived counts for benchmark-specific assertions."
  - "tests/unit/core/test_platform_registry.py: README and platform docs count marker tests - reuse marker-check pattern for public benchmark claims."
  - "docs/reference/public-contracts.md: Count and Drift Policy - extend claim-class rules instead of scattering policy language."
  - "README.md: benchbox-registry-counts marker block - preserve as authoritative user-facing count source."

must_preserve:
  - "README registry count markers remain checked against runtime metadata."
  - "Historical DONE/TODO records are not rewritten just because they contain old count evidence."
  - "Generated docs under docs/_build remain excluded from source drift checks."
  - "Editorial benchmark examples can remain narrative if they avoid exact authoritative count claims."

approach: |
  Inventory first, then classify. Only after the claim classes are explicit,
  implement a narrow drift check that targets current public source files. Avoid
  a naive repository-wide grep gate that fails on historical evidence or build
  artifacts. Fix stale public claims in the same PR so the new gate lands green.

anti_patterns:
  - "DO NOT add a global grep that scans docs/_build or _project history - because historical/generated text will create noisy false positives - classify source paths first."
  - "DO NOT replace useful explanatory copy with generated blobs - because docs still need readable narrative - check exact counts and source-of-truth claims only."
  - "DO NOT make README the only checked surface - because landing and reference docs are also public - include the durable public source files found in w0."
  - "DO NOT hard-code counts in a new script without deriving expected values from the registry - because that recreates the drift problem - import registry helpers."

verification:
  - description: "Benchmark contract tests cover the new drift check."
    command: "uv run -- python -m pytest tests/unit/core/test_benchmark_api_contract.py tests/unit/core/test_platform_registry.py -q"
    expected_output: "All selected contract tests pass."
  - description: "Docs validation remains green after public claim edits."
    command: "make docs-validate"
    expected_output: "Documentation validation passes."
  - description: "PR public contract workflow snippet remains syntactically valid through the fast unit lane."
    command: "uv run -- python -m pytest -m fast -q"
    expected_output: "Fast tests pass."

scope_limit:
  only_modify:
    - ".github/workflows/pr.yml"
    - "README.md"
    - "landing/"
    - "docs/reference/"
    - "docs/development/result-integrity-validation.md"
    - "docs/design/architecture.md"
    - "tests/unit/core/test_benchmark_api_contract.py"
    - "tests/unit/core/test_platform_registry.py"
    - "_project/TODO/"
    - "_project/DONE/"
  do_not_modify:
    - "benchbox/platforms/"
    - "benchbox/core/runner/"
    - "benchmark_runs/"

success_metrics:
  - "Exact public benchmark count/support claims are either registry-derived, checked, or deliberately reworded as non-authoritative examples."
  - "The gate reports stale public benchmark claim paths with concise actionable output."
  - "Landing, README, and reference docs no longer rely on untested hand-maintained benchmark totals."

open_questions:
  - "Should landing/index.html continue to contain exact benchmark totals, or should it link to the registry-backed README/contract docs instead?"
  - "Should result-integrity spec coverage counts be generated from the validator spec registry rather than documented manually?"
