id: results-explorer-pr246-query-workbench-evidence-remediation
title: "Address PR #246 Query Workbench hierarchy, filters, and formatting findings"
worktree: main
priority: Medium-High
status: Not Started
category: Core Functionality

description: |
  PR #246 found that Query Workbench is functionally useful but still reads like
  an internal schema/debugging surface. Visible Columns is too prominent,
  mobile filters do not present as a predictable drawer workflow, raw schema
  names and values leak into public display, and numeric/date/null formatting
  diverges from the browse pages.

  This TODO converts those findings into a public-workbench remediation plan.
  The end state should preserve power-user filtering, SQL, URL state, and
  exports while making the default path straightforward: filter results,
  inspect rows, open details, and export selected visible fields.

deps:
  needs:
    - results-explorer-retheme-theme-system-foundation

context_sections:
  evidence_source: |
    PR #246: https://github.com/joeharris76/BenchBox/pull/246
    Audit artifact:
    `_project/audits/results-explorer-hierarchy-usability-data-audit-20260507.md`
  findings: |
    Covers PR #246 findings VH-5, U-4, and DQ-6. It also participates in U-1
    and U-2 through mobile nav and table overflow fixes.
  screenshots: |
    Baseline screenshots from PR #246:
    - `query-390.png`
    - `query-768.png`
    - `query-1280.png`
    - `query-1600.png`
    - `query-mobile-filter-drawer-390.png`
  related_existing_todos: |
    Stay aligned with `results-explorer-retheme-query-workbench` and
    `results-explorer-retheme-responsive-accessibility`.

work:
  - id: w1
    summary: "Define the Query Workbench public workflow and subordinate advanced controls"
    status: pending
    notes: |
      Make the default workflow explicit:
        - result count and active filters;
        - filter controls;
        - result rows;
        - row limit;
        - row detail action;
        - CSV/JSON export.

      Move schema and power-user controls behind secondary affordances:
        - Visible Columns;
        - SQL scratchpad;
        - Build SQL From Filters;
        - starter SQL queries.

  - id: w2
    summary: "Move Visible Columns out of the first desktop data slot"
    needs: [w1]
    status: pending
    notes: |
      The `query-1280.png` evidence shows Visible Columns above the table in
      the main desktop column. Move it below the table, into a disclosure, or
      into a compact configuration popover. Preserve schema-driven columns,
      URL/export behavior, and hidden `result_id` for row View links.

  - id: w3
    summary: "Redesign mobile filters as an explicit drawer workflow"
    needs: [w1]
    status: pending
    notes: |
      The `query-mobile-filter-drawer-390.png` evidence does not show a clear
      opened drawer state and leaves focus on `Build SQL From Filters`. Make
      the mobile filter trigger an explicit button with count/state. When open,
      the drawer must have a clear header, reset/apply controls, close action,
      focus trap, Escape behavior, and reachable checkbox targets.

  - id: w4
    summary: "Apply public display labels to query columns and facet values"
    needs: [w1]
    status: pending
    notes: |
      Replace raw schema-facing labels such as `scale_factor`, `geomean_ms`,
      `star_schema`, and `community-submission` in public table/filter contexts
      with display names from query/facet metadata. Raw schema names may remain
      in advanced SQL-only contexts, but the default result table and filters
      should read as product UI.

  - id: w5
    summary: "Normalize numeric, unit, date, null, and missing-value formatting"
    needs: [w4]
    status: pending
    notes: |
      Align Query table formatting with browse pages:
        - ms values and seconds values use deliberate units;
        - power score and geomean values use consistent precision;
        - dates avoid awkward wrapping at desktop width;
        - null, missing, no-run, and not-recorded values have distinct display;
        - metric direction is visible where benchmark values appear.

  - id: w6
    summary: "Retheme exports, row limit, advanced SQL, and starter queries"
    needs: [w2, w3, w5]
    status: pending
    notes: |
      Keep CSV/JSON export and SQL functionality, but make them subordinate to
      the primary browse path. Export actions should state selected-visible
      column behavior. Row limit controls should be predictable on mobile and
      desktop. Advanced SQL errors and result tables should use the same table
      and state primitives as the rest of the Explorer.

  - id: w7
    summary: "Add Query Workbench regression tests and recapture PR #246 evidence"
    needs: [w6]
    status: pending
    notes: |
      Add tests for facet URL round trip, drawer open/focus/close behavior,
      visible-column placement/export behavior, display labels, numeric/date
      formatting, hidden `result_id`, and SQL/export preservation. Recapture
      `/results/query` at 390px, 768px, 1280px, and 1600px, including the
      mobile filter drawer.

must_preserve:
  - "Query Workbench route `/results/query`."
  - "Shareable facet URL state."
  - "Schema-driven visible column list."
  - "CSV and JSON exports use exactly the user-visible selected columns."
  - "Hidden `result_id` remains available for row View links."
  - "SQL scratchpad remains read-only against the browser snapshot."

approach: |
  Design from the default public workflow first, then reinsert power features as
  advanced controls. Reuse existing query/facet metadata instead of hard-coding
  ad hoc labels. Keep URL and export contracts under test while changing visual
  hierarchy.

anti_patterns:
  - "DO NOT remove SQL/export power features; make them subordinate to the browse workflow."
  - "DO NOT expose raw schema labels in default public table/filter UI when display metadata exists."
  - "DO NOT make Visible Columns the first desktop analysis surface."
  - "DO NOT break mobile drawer focus trapping or URL state while retheming filters."
  - "DO NOT solve mobile overflow by hiding important row actions."

verification:
  - description: "Query page and facet tests pass"
    command: "cd results-explorer && npm test -- src/pages/__tests__/Query.test.tsx src/components/__tests__/FacetRail.test.tsx"
    expected_output: "all targeted Query tests pass"
  - description: "Query browser smoke passes"
    command: "cd results-explorer && npm run test:e2e:fixtures && npm run build && npx playwright test --project=chromium --grep query"
    expected_output: "Chromium query route smoke passes"
  - description: "Manual PR #246 Query recapture is clean"
    command: "echo 'Manual: recapture /results/query at 390, 768, 1280, 1600 plus mobile filter drawer and compare against PR #246 screenshots'"
    expected_output: "manual evidence shows VH-5, U-4, and DQ-6 resolved or explicitly deferred"

scope_limit:
  only_modify:
    - "results-explorer/src/pages/Query.tsx"
    - "results-explorer/src/components/FacetRail.tsx"
    - "results-explorer/src/lib/queryFilters.ts"
    - "results-explorer/src/lib/facetModel.ts"
    - "results-explorer/src/lib/facetDisplay.ts"
    - "results-explorer/src/lib/queryLabels.ts"
    - "results-explorer/src/lib/format.ts"
    - "results-explorer/src/pages/__tests__/Query.test.tsx"
    - "results-explorer/src/components/__tests__/FacetRail.test.tsx"
    - "results-explorer/e2e/"
    - "_project/audits/"
  do_not_modify:
    - "results-data/"
    - "benchbox/"

success_metrics:
  - "Visible Columns no longer occupies the first desktop data slot by default."
  - "Mobile filters open as a clear drawer with focus management and reset/apply controls."
  - "Default Query table/facet UI uses product labels instead of raw schema terms."
  - "Numeric, date, null, no-run, and missing values are formatted consistently with browse pages."
  - "CSV/JSON export, URL state, hidden `result_id`, and SQL scratchpad behavior remain intact."

metadata:
  tags:
    - results-explorer
    - pr246
    - query-workbench
    - filters
    - data-presentation
  estimated_effort: "Medium (~2 days)"
  created_date: "2026-05-07"

impact:
  business_value: |
    Makes Query Workbench credible as a public Explorer tool rather than an
    internal DuckDB/schema interface.
  user_impact: |
    Users can filter, inspect, and export result data without learning raw
    schema names or losing mobile controls.
  technical_debt: |
    Centralizes query display labels and formatting around reusable metadata
    instead of page-local string handling.
