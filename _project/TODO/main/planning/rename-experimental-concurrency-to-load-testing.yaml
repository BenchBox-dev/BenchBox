id: experimental-concurrency-promote-or-remove
title: "Decide promote-or-remove for the orphaned experimental concurrency load-test framework"
worktree: main
priority: Medium
status: Not Started
category: Core Functionality

description: |
  benchbox/experimental/concurrency/ is a full, well-tested concurrent
  load-testing framework that no user-facing path can reach:
  - executor.py: ConcurrentLoadExecutor (real ThreadPoolExecutor, per-stream
    connections, dynamic concurrency targeting, background psutil resource
    monitor, queue-wait + percentile-latency analysis).
  - patterns.py: Steady/Burst/RampUp/Spike/Step/Wave workload patterns.
  - pool_tester.py: ConnectionPoolTester (pool exhaustion/churn/under-load).
  - analyzer.py: ConcurrencyAnalyzer (queue/contention/scaling analysis).
  It has ~1,900 lines of real-thread unit tests (tests/unit/core/concurrency/)
  but is imported only within its own package -- no CLI command, orchestrator,
  or UAT config uses it. README/FAQ document benchbox.experimental as
  unsupported with no stability guarantees.

  This is a fork in the road, not a bug: either this framework is the intended
  future of realistic multi-user concurrency benchmarking (queue analysis,
  ramp/burst patterns -- things the spec-oriented throughput test does not do),
  in which case it should be wired into the CLI/UAT and promoted; OR it is
  research residue that should be removed to stop accruing test/maintenance cost.
  Its pool/session abstractions also overlap with
  throughput-independent-sessions-per-stream -- decide before that work
  reinvents them.

  Make an explicit, documented decision.

prior_art:
  - "benchbox/experimental/concurrency/__init__.py — the package surface to promote or delete."
  - "docs/design/future-state/isolate-experimental-core-subsystems/README.md — the design doc that moved this behind the experimental boundary; the decision record to update."
  - "docs/usage/faq.md:20 — the 'experimental is unsupported' caveat to keep consistent with the decision."
  - "benchbox/core/throughput/runner.py:StreamRunner — the spec-oriented executor this framework would complement (not replace)."

work:
  - id: w0
    summary: "Write a short decision doc: promote (wire into CLI/UAT) vs remove, with rationale and overlap analysis vs StreamRunner"
    status: pending
  - id: w1
    summary: "If PROMOTE: expose a CLI/experimental entrypoint and one example; keep behind the experimental flag"
    needs: [w0]
    status: pending
  - id: w2
    summary: "If REMOVE: delete the package and its tests, update docs/pyproject/coverage config, note in CHANGELOG"
    needs: [w0]
    status: pending

must_preserve:
  - "Whichever branch is chosen, docs must not claim an unreachable feature is supported."

anti_patterns:
  - "DO NOT leave it half-wired — because that is the current problem — the deliverable is a decision plus follow-through."

verification:
  - description: "Repo reflects the decision (either reachable+documented, or removed+clean)"
    command: "uv run -- python -m pytest tests/unit/core/concurrency/ -v"
    expected_output: "passes (promote) or removed with green suite (remove)"

scope_limit:
  only_modify:
    - "benchbox/experimental/concurrency/"
    - "tests/unit/core/concurrency/"
    - "docs/"
    - "pyproject.toml"
    - "CHANGELOG.md"

open_questions:
  - question: "Is realistic workload-pattern / queue-analysis concurrency a product goal, or is spec-throughput sufficient?"
    gating: true
    affects: ["w0"]
    default: "Keep isolated + explicitly documented as unsupported research; revisit if a user need appears."

metadata:
  tags: [concurrency, experimental, decision, tech-debt]
  estimated_effort: Small
  created_date: "2026-07-09"
