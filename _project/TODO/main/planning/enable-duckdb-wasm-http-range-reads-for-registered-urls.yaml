id: enable-duckdb-wasm-http-range-reads-for-registered-urls
title: "Enable DuckDB-WASM HTTP range-reads for URLs registered via registerFileURL"
worktree: main
priority: Medium
status: Identified
category: Performance

description: |
  The explorer attaches `results.duckdb` at
  `results-explorer/src/db.ts` via
  `registerFileURL("results.duckdb", url, DuckDBDataProtocol.HTTP, true)`
  followed by `ATTACH 'results.duckdb' AS bench (READ_ONLY)`. The RG-2
  gate for the canonical browser read model requires that a cold
  single-row lookup transfers ≤10% of the on-disk DB, i.e. DuckDB-WASM
  should use HTTP `Range:` requests rather than a single whole-file GET.

  In practice, with duckdb-wasm 1.32.0, the runtime's HTTP file-info
  defaults (`reliableHeadRequests=false`, `allowFullHttpReads=true`)
  short-circuit the Range probe even when `directIO=true` is passed to
  `registerFileURL`, and the runtime falls back to a single whole-file
  GET on ATTACH. There is no stable per-URL API to override those
  defaults from the main thread:

  - `db.open({filesystem: {reliableHeadRequests: true, allowFullHTTPReads: false}})`
    resets the WebFileSystem and breaks the already-registered URL.
  - `SET reliable_head_requests = true` affects only the httpfs extension
    HTTP client, not the runtime's built-in HTTP file reader.
  - The per-file `_globalFileInfo` object that carries these flags lives
    inside the DuckDB-WASM worker and is not reachable from the page.

  The e2e harness already serves the snapshot with `Accept-Ranges: bytes`
  and honours `Range: bytes=...` with `206 Partial Content` (see
  `results-explorer/scripts/serve-browser-tests.mjs` and
  `results-explorer/e2e/capability/range-read-budget.spec.ts`), so the
  moment the browser runtime starts issuing range reads, the RG-2
  byte-budget assertion can be re-introduced without any server change.

  Deliverables:
  1. Confirm the library-level behaviour against the current
     duckdb-wasm version at the time of work start (it may have
     gained a supported override by then).
  2. Pick a path from: (a) upgrade duckdb-wasm to a version that
     supports per-URL range-read flags, (b) patch the runtime via a
     supported entry point such as a config object accepted by
     `registerFileURL`, or (c) file an upstream issue/PR and pin to a
     build that includes the fix.
  3. Re-enable the byte-budget assertion in
     `results-explorer/e2e/capability/range-read-budget.spec.ts` using
     the server-side `/__test/transfers` accounting already in place.

deps:
  needs:
    - implement-results-explorer-browser-functional-tests

work:
  - id: w1
    summary: "Re-audit duckdb-wasm runtime flags and the HTTP file-reader code path for the current version"
    status: pending
    notes: |
      Read `@duckdb/duckdb-wasm` `src/bindings/runtime.ts` (or the
      shipped `duckdb-browser-eh.worker.js` if source is not vendored)
      and confirm whether `registerFileURL` / `DuckDBConfig.filesystem`
      now expose a supported way to set `reliableHeadRequests=true`
      and/or `allowFullHttpReads=false` per registered URL.

  - id: w2
    summary: "Pick an unblock path and prototype it"
    needs: [w1]
    status: pending
    notes: |
      Three candidate paths, in order of preference:

      1. Upgrade duckdb-wasm to a version that supports the override.
         Verify against the browser suite that `ATTACH` with a registered
         HTTP URL issues a HEAD probe followed by ranged GETs.
      2. Configure the flag via a supported runtime API (e.g. passing a
         `DuckDBConfig.filesystem` object to `db.open` *after* the URL
         is registered and before the first query, if the registration
         survives an open).
      3. File an upstream issue/PR and pin to a patched build.

      Prototype the winning path inside a branch; keep the rest of the
      explorer untouched so the RG-2 assertion is the sole change in
      the validation commit.

  - id: w3
    summary: "Re-enable the byte-budget assertion and close the RG-2 gate"
    needs: [w2]
    status: pending
    notes: |
      Replace the capability-only assertions in
      `results-explorer/e2e/capability/range-read-budget.spec.ts` with the
      original server-side transfer-log assertion: after a cold `goto`
      of `/results/` followed by `waitForDataLoaded`, the sum of
      `Content-Length` transfers under `/results/data/results.duckdb`
      must be ≤10% of the on-disk DB size, and at least one transfer
      must be a 206 ranged response.

must_preserve:
  - "`results-explorer/src/db.ts` continues to ATTACH the snapshot READ_ONLY and must not fall back to a JSON-only path."
  - "The test server's `Accept-Ranges`/`Range` handling in `results-explorer/scripts/serve-browser-tests.mjs` is not regressed."
  - "The server-side transfer log at `/__test/transfers` remains available for the re-enabled assertion."

approach: |
  Do not introduce a custom forked build of duckdb-wasm unless every
  other avenue fails. Prefer a library upgrade, then a supported config
  entry point, then an upstream fix. The goal is to keep the explorer's
  HTTP attach logic conventional so future maintainers do not carry a
  private patch.

anti_patterns:
  - "DO NOT monkey-patch `BROWSER_RUNTIME._globalFileInfo` from the page - because it lives inside the DuckDB-WASM worker and crosses a private API boundary - solve the problem via a supported configuration surface instead."
  - "DO NOT move the explorer off DuckDB-WASM's HTTP attach to regain range reads - because the canonical browser read model depends on it - fix the range-read path rather than replacing it."

verification:
  - description: "The TODO item itself validates cleanly"
    command: "uv run _project/scripts/validate_todo.py _project/TODO/main/planning/enable-duckdb-wasm-http-range-reads-for-registered-urls.yaml"
    expected_output: "Validation passes with no schema or DAG errors"
  - description: "After the fix lands, a cold explorer load transfers ≤10% of the snapshot"
    command: "cd results-explorer && npm run test:e2e:chromium -- --grep \"RG-2 range-read\""
    expected_output: "The byte-budget assertion is re-enabled and passes"

scope_limit:
  only_modify:
    - "results-explorer/package.json"
    - "results-explorer/package-lock.json"
    - "results-explorer/src/db.ts"
    - "results-explorer/e2e/capability/range-read-budget.spec.ts"
  do_not_modify:
    - "results-explorer/scripts/serve-browser-tests.mjs"
    - "results-explorer/public/data/"
    - "results-data/bundles/"

metadata:
  tags:
    - "results"
    - "explorer"
    - "duckdb-wasm"
    - "performance"
    - "http-range"
  estimated_effort: "Small"
  created_date: "2026-04-19"

impact:
  business_value: |
    Closes the RG-2 range-read gate so the explorer's cold-load
    bandwidth scales with query size, not database size - a prerequisite
    for the hosted results platform's public rollout at larger corpora.
  user_impact: |
    Faster first-meaningful-paint on cold loads once the corpus grows
    past the current seed size.
  technical_debt: |
    Removes a documented deviation from the canonical browser read
    model and deletes the capability-only RG-2 workaround in the
    e2e suite.
