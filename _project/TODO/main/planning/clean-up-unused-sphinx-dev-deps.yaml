id: clean-up-unused-sphinx-dev-deps
title: "Clean up unused Sphinx dev deps (sphinx-rtd-theme, sphinx-copybutton)"
worktree: main
priority: Low
status: Not Started
category: Code Quality and Technical Debt
description: |
  Two Sphinx-related deps are declared but inert:

  - `sphinx-rtd-theme>=3.1.0` (`pyproject.toml` line 487) — `docs/conf.py`
    sets `html_theme = "furo"`. The rtd theme is never loaded. Not
    referenced anywhere in repo source.
  - `sphinx-copybutton>=0.5.2` (`pyproject.toml` line 491) — `docs/conf.py`
    extensions list does **not** include `"sphinx_copybutton"`. The
    package is installed but Sphinx will not activate it.

  Two valid resolutions for each:
    A. Drop the declaration (removes installed-but-unused weight).
    B. Wire it up in `docs/conf.py` if the feature is actually wanted.

  Recommendation: drop both. If a future contributor wants copy buttons
  on code blocks, they can re-add the dep + extensions entry as a single
  reviewable change.

  Source for this finding: `docs/development/dependency-inventory.md` (F5
  and F6), produced by `audit-imported-dependencies-for-elimination`.

work:
  - id: w1
    summary: "Confirm sphinx-rtd-theme is not referenced in docs/, examples/, or any conf.py: `grep -rn 'sphinx_rtd_theme\\|rtd_theme' docs examples`."
    status: pending

  - id: w2
    summary: "Confirm sphinx-copybutton is not in `docs/conf.py:extensions`: read the file and verify."
    status: pending

  - id: w3
    summary: "Remove both lines from `[dependency-groups] dev` in pyproject.toml. Refresh uv.lock with `uv lock`."
    needs: [w1, w2]
    status: pending

  - id: w4
    summary: "Build docs locally to confirm no regression: `make docs` (or the project's docs build target)."
    needs: [w3]
    status: pending

deferred:
  - summary: "Wire up sphinx-copybutton if copy buttons are desired"
    reason: "Out of scope for this cleanup. If wanted, file a separate TODO for the docs feature add."

files_affected:
  modified:
    - "pyproject.toml"
    - "uv.lock"

must_preserve:
  - "`docs/conf.py` continues to use `html_theme = 'furo'`"
  - "Existing `extensions` list in `docs/conf.py` is unchanged (no addition or removal)"
  - "Docs build (`make docs` or equivalent) succeeds after the change"

approach: |
  Two-line removal in pyproject.toml. Verify by building the docs.

anti_patterns:
  - "DO NOT touch `docs/conf.py` extensions list — because the goal is removal, not feature work — file a separate TODO if copy buttons are wanted later"

verification:
  - description: "Both deps absent from pyproject"
    command: "uv run -- python -c \"import pathlib; t = pathlib.Path('pyproject.toml').read_text(); assert 'sphinx-rtd-theme' not in t, 'sphinx-rtd-theme still present'; assert 'sphinx-copybutton' not in t, 'sphinx-copybutton still present'; print('OK: both removed')\""
    expected_output: "OK: both removed"
  - description: "Docs build still succeeds (replace with project docs target)"
    command: "uv run -- python -c \"import importlib; m = importlib.import_module('sphinx'); print('sphinx importable:', m.__version__)\""
    expected_output: "sphinx importable: <version>"

scope_limit:
  only_modify:
    - "pyproject.toml"
    - "uv.lock"
  do_not_modify:
    - "docs/"
    - "benchbox/"

deps:
  needs: []

metadata:
  tags: ["maintenance", "supply-chain", "deps", "docs", "audit-followup"]
  estimated_effort: "Small (< 1 hour)"
  created_date: "2026-04-15"

impact:
  business_value: |
    Cleaner dev install — two fewer Sphinx packages that contribute nothing
    to the actual docs build.
  user_impact: |
    None for end users. Slightly faster `uv sync --group dev` for contributors.
  technical_debt: |
    Closes findings F5 and F6 from the dependency-inventory audit.

success_metrics:
  - "Both deps absent from pyproject after the change"
  - "Docs still build successfully"
