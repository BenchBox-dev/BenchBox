scope_limit:
  only_modify_note: |
    This TODO is a metadata refinement on top of an already-shipped
    subsystem. Do not touch rule decisions (action, payload), runtime
    code paths (resolver, plan, BaseDdlOptimizer dispatch), or any
    benchbox/core/ or benchbox/platforms/ code. Only the SupportLevel
    enum, rule reason strings, the linter, the generator, and the
    generated docs are in bounds.
  only_modify:
    - "benchbox/sql_compat/decision.py"
    - "benchbox/sql_compat/__init__.py"
    - "benchbox/sql_compat/_reason_conventions.py"
    - "benchbox/sql_compat/rules/"
    - "scripts/compat_lint.py"
    - "scripts/generate_compat_docs.py"
    - "docs/compat/"
    - "docs/development/adr/"
    - "tests/unit/sql_compat/"
  out_of_scope:
    - "Promotion of the reason-string lint from warn to error mode (separate follow-up after compliance)"
    - "Splitting SupportLevel further (e.g. SKIPPED_AUXILIARY) - the taxonomy is frozen at four outcomes for this TODO"
    - "Reworking the action vocabulary or payload dataclasses"
    - "Resolver, plan, or dispatch code changes"
    - "Anything in benchbox/core/ or benchbox/platforms/"
