scope_limit:
  only_modify_note: |
    The coverage stream (w2/w3) extends rule registrations and removes the
    legacy_bypass tuple in two specific benchmark files. The taxonomy
    stream (w4/w5) and the convention/doc work (w6/w7/w8) are confined to
    benchbox/sql_compat/ and adjacent tooling. Do not touch resolver,
    plan, or BaseDdlOptimizer dispatch shape. Do not change the
    _pk_lock_bypass_required function body beyond removing the
    legacy_bypass tuple. Do not modify any other benchbox/core/ or
    benchbox/platforms/ code; the audit artifact is a markdown file under
    _project/compat/, not platform-side instrumentation.
  only_modify:
    - "benchbox/sql_compat/decision.py"
    - "benchbox/sql_compat/__init__.py"
    - "benchbox/sql_compat/_reason_conventions.py"
    - "benchbox/sql_compat/rules/"
    - "benchbox/core/write_primitives/benchmark.py"
    - "benchbox/core/transaction_primitives/benchmark.py"
    - "scripts/compat_lint.py"
    - "scripts/generate_compat_docs.py"
    - "docs/compat/"
    - "docs/development/adr/"
    - "_project/compat/"
    - "tests/unit/sql_compat/"
  out_of_scope:
    - "Promotion of the reason-string lint from warn to error mode (separate follow-up after compliance)"
    - "Splitting SupportLevel further (e.g. SKIPPED_AUXILIARY) - the taxonomy is frozen at four outcomes for this TODO"
    - "Reworking the action vocabulary or payload dataclasses"
    - "Resolver, plan, or dispatch code changes"
    - "Changes to _pk_lock_bypass_required beyond removing legacy_bypass"
    - "Anything in benchbox/platforms/ adapter code (PK behavior is registry-side metadata, not adapter behavior)"
    - "Dataframe-mode primitives benchmarks - this TODO's PK coverage applies to SQL-mode write_primitives/transaction_primitives only"
