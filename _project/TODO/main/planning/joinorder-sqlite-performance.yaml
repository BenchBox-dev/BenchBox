id: joinorder-sqlite-performance
title: "Canonical JoinOrder SF=1 SQLite UAT exceeds corpus backfill timeout"
worktree: main
priority: Medium
status: Identified
category: Performance

description: |
  Canonical JoinOrder SF=1 UAT on SQLite loaded the canonical IMDb tables and
  executed successfully through query 75/113 in warmup, but did not complete
  within the 7200 second per-cell corpus backfill budget. SQLite should remain
  excluded from the supported canonical JoinOrder SF=1 corpus matrix until it
  has either a tuned execution path or a documented longer-running UAT lane.

  Evidence:
    /Users/joe/Developer/benchmark_runs/logs/uat_joinorder_canonical_corpus_20260512/sqlite_joinorder_1.0_20260512_202135.log

  Observed summary:
    - Tables loaded successfully.
    - Warmup progressed to query 75/113.
    - No result JSON was emitted, so there is no complete, submittable bundle.

