    expected_output: "Benchmark support-status, count, and discovery tests pass or skip only for missing optional MCP SDK."
  - description: "Run explorer pipeline tests if benchmark status is exported to explorer inputs."
    command: "uv run -- python -m pytest tests/unit/core/explorer_pipeline -k 'benchmark or read_model' --tb=short"
    expected_output: "Explorer benchmark label/read-model tests pass."
