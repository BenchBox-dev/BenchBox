must_preserve:
  - "Do not equate benchmark category with support_status without an explicit product decision."
  - "Do not hide, remove, or deprecate existing public benchmarks solely as a side effect of adding metadata."
  - "Do not treat supports_dataframe as support_status; it is a capability flag."
  - "Do not create a second benchmark catalogue outside benchbox/core/benchmark_registry.py."

approach: |
  Follow the platform support-status pattern, but keep the benchmark-specific
  policy honest: benchmark support depends on product guarantees, dataset
  contract, validation coverage, and public discovery promises, not just on
  whether the benchmark class imports.

anti_patterns:
  - "DO NOT mark every benchmark stable just because it is runnable -- support status should reflect docs, validation, data contract, and maintenance commitment."
  - "DO NOT make MCP or explorer invent their own benchmark support tiers -- they must consume registry metadata or documented helper output."
  - "DO NOT use support_status as a replacement for surface -- internal smoke benchmarks can remain runnable by explicit ID without becoming public discovery entries."

