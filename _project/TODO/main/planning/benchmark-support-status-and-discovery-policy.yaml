prior_art:
  - "docs/reference/public-contracts.md: public support taxonomy and drift-check ownership -- extend rather than creating separate status language."
  - "benchbox/core/platform_registry.py: platform support_status validation and summary helpers -- reuse the pattern, not the platform-specific metadata."
  - "benchbox/core/benchmark_registry.py: current benchmark metadata and discovery source of truth -- extend in place."
  - "tests/unit/core/test_benchmark_api_contract.py: existing wrapper/loader/registry count drift tests -- extend with support-status assertions."

success_metrics:
  - "Every benchmark metadata entry has exactly one valid support_status."
  - "Benchmark support_status is visibly distinct from surface and supports_dataframe."
  - "Benchmark count and support-status claims in docs/discovery are generated from or checked against benchmark registry metadata."
  - "MCP and explorer do not maintain independent benchmark support classifications."

open_questions:
  - "Which current public benchmarks should be stable versus beta before 1.0?"
  - "Should experimental benchmark families remain visible in default CLI/MCP discovery when marked experimental?"
