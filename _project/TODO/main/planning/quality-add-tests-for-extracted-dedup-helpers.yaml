id: quality-add-tests-for-extracted-dedup-helpers
title: "Add unit tests for 5 helpers extracted by the dedup consolidation"
worktree: main
priority: Low
status: In Progress
category: Code Quality and Technical Debt
description: |
  Code review of `quality-consolidate-duplicate-code-clusters` flagged
  test-coverage gaps for 5 of the 11 helpers extracted by that work.
  The dedup TODO shipped tests for 2 helpers
  (`test_credentials_helper.py`, `test_gcs_path.py`) but not the others.

  The 5 untested helpers are exercised indirectly via adapter / family
  tests, so there's no immediate behavioral risk — but isolated unit
  tests catch regressions earlier and document the helper contract.

  Helpers needing dedicated tests:
    - `benchbox/platforms/azure/_livy_mixin.py::LivyStatementMixin`
    - `benchbox/platforms/_spark_helpers.py::get_spark_query_plan`
    - `benchbox/platforms/dataframe/_result_helpers.py`
      (`build_success_result_dict` / `build_failure_result_dict`)
    - `benchbox/platforms/presto_trino_utils.py`
      (escape_insert_value / is_date_value / normalize_existing_files /
      load_file_batches / resolve_data_files)
    - `benchbox/core/schema_primitives.py::BaseSchemaTable`

deps:
  needs:
  - quality-consolidate-duplicate-code-clusters

work:
- id: w1
  summary: "Add tests for LivyStatementMixin: cover _execute_statement timing accumulation, _wait_for_statement passthrough,
    and the _get_headers/_ensure_session interface contract."
  status: done

- id: w2
  summary: "Add tests for get_spark_query_plan: cover normal plan capture, missing/closed connection, plan-string truncation."
  status: done

- id: w3
  summary: "Add tests for _result_helpers.build_success_result_dict / build_failure_result_dict: required-field presence,
    error-string handling, optional-metric defaults."
  status: pending

- id: w4
  summary: "Add tests for presto_trino_utils helpers: escape_insert_value (quote/escape edges), is_date_value (date detection),
    normalize_existing_files, load_file_batches, resolve_data_files."
  status: pending

- id: w5
  summary: "Add tests for BaseSchemaTable: schema parsing, primary-key + partitioning passthrough, CREATE TABLE statement
    formatting per backend hook."
  status: pending

files_affected:
  added:
  - "tests/unit/platforms/azure/test_livy_mixin.py"
  - "tests/unit/platforms/test_spark_helpers.py"
  - "tests/unit/platforms/dataframe/test_result_helpers.py"
  - "tests/unit/platforms/test_presto_trino_utils.py"
  - "tests/unit/core/test_schema_primitives_base.py"

must_preserve:
- "Existing tests for the 2 already-tested helpers (test_credentials_helper.py, test_gcs_path.py) — don't refactor them as
  part of this work"
- "Helper module signatures unchanged — tests only, no production-code edits"

approach: |
  Each helper gets its own test module. Use the existing
  `test_credentials_helper.py` / `test_gcs_path.py` patterns as templates.

  Mark all tests `pytest.mark.unit + pytest.mark.fast`. None of these
  helpers require external services or fixtures larger than dict/string
  inputs.

anti_patterns:
- "DO NOT modify the helper modules to make them easier to test — because that's scope creep — test the existing API as-is"
- "DO NOT use mocks for things that can be tested with real values — because mocks hide bugs — only mock external boundaries
  (HTTP, SDK calls)"
- "DO NOT bundle tests for multiple helpers into one module — because review needs to be bounded — one test module per helper"

verification:
- description: "All new test files pass"
  command: "uv run -- python -m pytest tests/unit/platforms/azure/test_livy_mixin.py tests/unit/platforms/test_spark_helpers.py
    tests/unit/platforms/dataframe/test_result_helpers.py tests/unit/platforms/test_presto_trino_utils.py tests/unit/core/test_schema_primitives_base.py
    -q"
  expected_output: "all tests pass"
- description: "Coverage of the 5 helper modules reaches ≥80%"
  command: "uv run -- python -m pytest --cov=benchbox/platforms/azure/_livy_mixin --cov=benchbox/platforms/_spark_helpers
    --cov=benchbox/platforms/dataframe/_result_helpers --cov=benchbox/platforms/presto_trino_utils --cov=benchbox/core/schema_primitives
    --cov-fail-under=80 tests/unit/ -q"
  expected_output: "passed (no 'FAIL Required test coverage of 80%' line in output)"

metadata:
  tags: ["quality-plan", "tests", "duplication-followup"]
  estimated_effort: "Small (1 day, ~5 small test modules)"
  created_date: "2026-04-13"
