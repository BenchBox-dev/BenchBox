id: throughput-timeout-leak-and-success-gates
title: "Mitigate timed-out stream leakage and reconcile divergent throughput success gates"
worktree: main
priority: Medium
status: Not Started
category: Core Functionality

description: |
  Two smaller robustness/consistency issues in the throughput executor.

  1. TIMED-OUT STREAM LEAK: StreamRunner.execute enforces per-stream timeout via
     `future.result(timeout=...)` but cannot cancel a running thread
     (benchbox/core/throughput/runner.py:87-113). A timed-out stream keeps
     executing in the background, still holding its connection and consuming
     CPU/server resources, while the executor records it as failed and moves on.
     During a long throughput run this means the reported TTT window can overlap
     zombie streams that are still hammering the DB -- skewing both the failed
     run's accounting and any subsequent phase (e.g. maintenance) that starts
     while zombies run. At minimum this should be surfaced; ideally streams
     should be cooperatively cancellable or isolated so a timeout actually stops
     work.

  2. DIVERGENT SUCCESS GATES: TPC-H throughput uses a configurable
     min_success_rate (default 0.99) (benchbox/core/tpch/throughput_test.py:38,
     135-137) while TPC-DS hardcodes 0.70
     (benchbox/core/tpcds/throughput_test.py:186, and again per-stream at :393).
     The divergence is documented as intentional
     (benchbox/core/throughput/runner.py:11-15 and
     docs/development/throughput-result-alignment.md) but 0.70 vs 0.99 is a large
     gap that changes whether a run is declared successful. Reconcile against the
     TPC-DS spec: make the TPC-DS gate configurable like TPC-H (keeping the
     spec-derived default) and document the spec citation for each threshold.

prior_art:
  - "benchbox/core/throughput/runner.py:StreamRunner.execute — timeout handling + the as_completed loop."
  - "benchbox/core/tpch/throughput_test.py:TPCHThroughputTestConfig.min_success_rate — the configurable-gate pattern to mirror for TPC-DS."
  - "benchbox/experimental/concurrency/executor.py — has a resource-monitor thread pattern usable to detect/report zombie streams."
  - "docs/development/throughput-result-alignment.md — documents the current divergence; update alongside any change."

work:
  - id: w1
    summary: "Surface timed-out (leaked) streams: annotate the result and log that background execution may continue"
    status: pending
  - id: w2
    summary: "Add a cooperative-cancellation or isolation option so a stream timeout can actually stop work (opt-in)"
    needs: [w1]
    status: pending
  - id: w3
    summary: "Make the TPC-DS throughput success gate configurable (spec-default) and cite the spec threshold for both benchmarks"
    status: pending

must_preserve:
  - "Default TPC-H gate stays 0.99; default TPC-DS gate stays its current spec value unless the spec says otherwise."
  - "as_completed accounting (streams_executed/successful/errors) semantics."

anti_patterns:
  - "DO NOT hard-kill threads — because Python cannot safely — prefer cooperative cancel / process isolation / explicit surfacing."

verification:
  - description: "Timeout path annotates leaked streams; TPC-DS gate is configurable"
    command: "uv run -- python -m pytest tests/unit/core/throughput/ tests/integration/test_throughput_corrections.py -v"
    expected_output: "timeout + gate tests pass"

scope_limit:
  only_modify:
    - "benchbox/core/throughput/runner.py"
    - "benchbox/core/tpcds/throughput_test.py"
    - "benchbox/core/tpch/throughput_test.py"
    - "docs/development/throughput-result-alignment.md"
    - "tests/unit/core/throughput/"
    - "tests/integration/"

metadata:
  tags: [concurrency, throughput, robustness, success-gate]
  estimated_effort: Medium
  created_date: "2026-07-09"
