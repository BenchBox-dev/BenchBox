title: "Improve test coverage for core benchmark modules to ≥50%"
worktree: main
priority: High
status: Not Started
category: Testing and Quality Assurance
description: |
  Multiple core benchmark modules are below 50% test coverage. These are the
  heart of BenchBox — the benchmark runners, generators, and query implementations.
  Each module needs targeted unit tests to reach at least 50% line coverage.

  Current coverage (from 2026-02-07 report, 53% overall):
    - core/tpcds: 25.8% (6,488 missing / 8,740 total)
    - core/tpch: 39.7% (1,923 missing / 3,188 total)
    - core/ssb: 29.6% (702 missing / 997 total)
    - core/clickbench: 34.9% (466 missing / 716 total)
    - core/amplab: 30.5% (422 missing / 607 total)
    - core/nyctaxi: 33.9% (585 missing / 885 total)
    - core/h2odb: 46.2% (213 missing / 396 total)
    - core/datavault: 45.2% (891 missing / 1,627 total)
    - core/read_primitives: 28.0% (1,723 missing / 2,394 total)
    - core/transaction_primitives: 30.8% (1,001 missing / 1,447 total)
    - core/metadata_primitives: 46.3% (1,013 missing / 1,886 total)
    - core/joinorder: 35.4% (275 missing / 426 total)

  Focus on benchmark.py, generator.py, and runner.py files first — these are
  the most testable units. DataFrame query files (dataframe_queries/queries.py)
  are large auto-generated-style modules; test a representative subset rather
  than aiming for full coverage on those.

