id: external-contributor-submission-dry-run
title: "Run a Phase 2 dry-run with one external trusted contributor"
worktree: main
priority: Medium-High
status: Not Started
category: Testing and Quality Assurance

deps:
  needs:
  - verify-ci-validation-workflow-end-to-end
  - verify-trust-badge-rendering-in-explorer
  - surface-contributor-onboarding-for-results

description: |
  Maintainer testing of the Phase 2 submission flow proves the technology
  works. A first external contributor walking through the docs unaided
  proves the *experience* works - different bar, different bugs. We need
  one human who has not seen the code to attempt a real submission and
  report back where they got stuck.

  This item recruits one trusted external user (not a maintainer, not a
  current Claude Code agent), watches them perform the full submission,
  captures friction points, and converts the friction list into actionable
  follow-up TODOs. Done before broader public promotion.

  Update 2026-04-28: an agent-proxy dry-run was performed via Claude
  Cowork as a doc-hardening pre-pass. It surfaced 11 friction items and
  produced 6 follow-up TODOs (`dry-run-followup-*.yaml` in this
  directory). See
  `_project/handoffs/external-dry-run-retrospective-2026-04-28.md` for
  the retrospective. The agent run does NOT close this TODO -- the
  human dry-run (w1-w5) is still required because Cowork structurally
  cannot exercise auth, push, PR open, CI validate, maintainer review,
  trust-label apply, or explorer redeploy. The agent run reduces the
  friction the eventual human contributor will hit.

  Update 2026-04-29: a SECOND agent-proxy dry-run was performed via
  Codex against PyPI `benchbox 0.2.1` on a clone of `published-results`.
  Each surface friction item the 2026-04-28 PR cluster (PRs #43-#46)
  pre-fixed was either not hit by Codex or hit-and-resolved-cleanly,
  validating the doc-hardening pre-pass. Critically, Codex reached one
  layer deeper than Cowork could and surfaced a release-blocker: the
  `published-results` validator's hash algorithm (per-directory) does
  not match `develop`'s writer (per-file), so any submission produced
  by current `benchbox submit` will fail CI on the documented PR target
  branch. Filed as
  `dry-run-followup-validator-hash-contract-mismatch.yaml` (Critical).
  Plus 7 polish items consolidated as
  `dry-run-followup-cli-ux-and-doc-polish-2026-04-29.yaml` (Medium).
  See `_project/handoffs/external-dry-run-retrospective-2026-04-29.md`
  for the retrospective + maintainer forensic.

  This TODO still does NOT close. The human dry-run remains required:
  (a) the Critical hash-contract fix must land + ship before recruiting
  a human, (b) only a human can validate the post-CI maintainer review
  and explorer redeploy (Step 5), and (c) public promotion timing
  depends on a frictionless human run.

work:
- id: w1
  summary: "Identify and recruit one external contributor"
  status: pending
  notes: |
    Criteria:
      - Familiar with running CLI tools and opening GitHub PRs
      - Has access to a SQL platform supported by BenchBox (DuckDB at minimum)
      - Willing to submit a real benchmark result and write a few
        sentences of feedback afterwards
      - Not currently working on BenchBox internals
    Reach out via the channel where target users live (data community
    Slack/Discord, Twitter, direct ask to a known data engineer). One
    contributor is enough for this iteration.

- id: w2
  summary: "Provide entry materials and minimal scaffolding"
  needs: [w1]
  status: pending
  notes: |
    Send the contributor:
      1. The link to `docs/contributing-results.md` (and only that link -
         do not coach them through the steps).
      2. The repo URL.
      3. A one-paragraph "what we'd love feedback on" note (not a script;
         just the framing).
    Critical: do NOT walk them through the steps in real time. Let them
    hit the docs cold. The friction points only surface if you don't
    smooth them.

- id: w3
  summary: "Observe and capture friction points without intervening"
  needs: [w2]
  status: pending
  notes: |
    Ask the contributor to keep notes on:
      - Steps they had to re-read or guess at
      - Errors they hit and how they resolved them
      - Tools/dependencies they didn't already have
      - Anything in the docs that turned out to be wrong/missing
    Intervene only if blocked for >30 minutes. Capture the timeline:
    when they started, when CI ran, when the PR landed.

- id: w4
  summary: "Review the resulting PR end-to-end and merge if valid"
  needs: [w3]
  status: pending
  notes: |
    The PR should:
      - Trigger validate-submission CI cleanly
      - Carry a community-submission trust label after merge
      - Render correctly in the explorer after redeploy
    Resolve any defects in this PR review like a normal review (don't
    skip the rigour because they're external; that defeats the test).

- id: w5
  summary: "Convert friction notes to follow-up TODOs"
  needs: [w3, w4]
  status: pending
  notes: |
    For each friction item, decide:
      - Doc fix (short edit to contributing-results.md → in-line in this
        TODO)
      - Tool/CLI fix (defect → file separate TODO with steps to reproduce)
      - Process gap (e.g., "no review SLA mentioned" → file under the
        Phase 2 ops runbook TODO)
    Write a short retrospective at
    `_project/handoffs/external-dry-run-retrospective-<date>.md`
    summarizing what worked, what didn't, and the resulting TODO list.

verification:
- description: "Retrospective file exists and lists at least 3 captured friction items"
  command: "test -f _project/handoffs/external-dry-run-retrospective-*.md && grep -c '^[-*] ' _project/handoffs/external-dry-run-retrospective-*.md"
  expected_output: ">= 3"
- description: "External contributor's PR is merged with community-submission trust label"
  command: "git log published-results --format='%s' | grep -i 'community'"
  expected_output: "at least one merge commit referencing the contribution"

success_metrics:
- "Submission terminal state: merged-to-published-results (PR opened, CI green, merge complete)"

must_preserve:
- The contributor's autonomy - no real-time hand-holding during the dry-run.
- Production review rigor - if the submission has defects, it is asked to be fixed, not silently merged.
- Phase 2's trust-label distinction - community submissions retain `community-submission`, never silently promoted.

anti_patterns:
- DO NOT pre-coach the contributor through the docs - because that hides the friction this dry-run exists to surface.
- DO NOT skip the external recruit and use another maintainer - because every maintainer already shares the curse of knowledge.
- DO NOT bundle defect fixes into this TODO - because mixing observation with implementation muddies the retrospective; file separate TODOs and keep this one focused on the dry-run experience.
- DO NOT interpret a frictionless human dry-run as evidence the human run was unnecessary - because the agent-proxy run on 2026-04-28 already pre-fixed obvious friction via the dry-run-followup-* TODOs - frictionless from a human is success of the prep, not redundancy of the test, and confirms the docs are now where they need to be.

scope_limit:
  only_modify:
  - _project/handoffs/external-dry-run-retrospective-*.md
  - docs/contributing-results.md  # only if w5 lists doc fixes
  - _project/TODO/main/planning/  # follow-up TODOs only
  do_not_touch:
  - benchbox/
  - results-explorer/
  - results-data/  # the contributor adds bundles via PR, not this TODO

metadata:
  tags:
  - results
  - contributor-experience
  - phase-2
  - dry-run
  - user-research
  estimated_effort: "Small"
  created_date: "2026-04-12"

impact:
  business_value: |
    Surfaces the experience defects that maintainer testing structurally
    cannot find, before public promotion makes those defects visible to
    everyone.
  user_impact: |
    The first wave of public contributors meet a workflow already
    debugged for the things humans-not-maintainers actually trip over.
