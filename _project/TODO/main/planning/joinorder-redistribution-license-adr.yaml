impact:
  business_value: |
    Turns an implicit redistribution liability (taken on as a side effect of the
    canonical cutover) into a recorded, reviewed decision. Surfaces any release
    blocker now rather than after a complaint.
  user_impact: |
    Users get clear, accurate licensing terms for the IMDb-derived data they
    download, and confidence that BenchBox's distribution of it is legitimate.
  technical_debt: |
    Replaces a generic "Used with permission" line with citation of the actual
    governing terms; documents the rationale so the debate doesn't recur.

success_metrics:
  - "An ADR exists recording the determination on whether BenchBox may re-host/redistribute the imdb_pg11-derived Parquet archive, with the governing IMDb + Dataverse terms quoted"
  - "DATA-LICENSE.md and docs/benchmarks/join-order.md cite the specific terms/conditions the ADR identified"
  - "If the conclusion is negative or conditional-not-met, a remediation TODO is filed and the release blocker is flagged to the user"

open_questions:
  - question: "Does the Harvard Dataverse deposit for DOI 10.7910/DVN/2QYZBT carry an open license that permits redistribution with attribution, or only a terms-of-use that restricts it?"
    gating: true
    affects: ["w2 success_metric: ADR determination"]
    default: "Treat as restrictive until the deposit's stated license proves otherwise; the safe remediation is fetch-from-Dataverse rather than BenchBox re-host"
  - "Does IMDb's data-use license distinguish 'used in a tool that is also used commercially' from 'commercial use of the data itself', and which side of that line does BenchBox fall on?"
