    expected_output: "TODO file validates; dependency graph check passes"
  - description: "Explorer pipeline tests remain green after DuckDB schema expansion"
    command: "uv run -- python -m pytest tests/unit/core/explorer_pipeline/ -q"
    expected_output: "all tests pass"
