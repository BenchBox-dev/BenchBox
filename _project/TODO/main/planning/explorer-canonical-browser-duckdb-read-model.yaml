success_metrics:
  - "A research gate closes all schema and migration-cut questions before the first code edit"
  - "Matrix, compare, and query surfaces read canonical interactive values from DuckDB rather than parallel JSON-specific logic"
  - "results.duckdb exposes the browser-side tables/views needed for cohort analysis, per-query graphing, and ad hoc SQL"
  - "Benchmark landing pages remain matrix-first while `/results/query` becomes a stronger secondary analyst surface"
  - "No regression in static hosting, shareable compare URLs, or read-only SQL safety"

open_questions:
  - "Should the first cut keep result-detail pages on per-result JSON, or migrate them onto the canonical DuckDB contract in the same implementation slice?"
  - "Which JSON artifacts remain bootstrap-only after the cutover: `manifest.json` only, or `benchmarks/*.json.gz` as a temporary compatibility layer as well?"
  - "Should `query_executions` ship in the first schema expansion, or is `query_display_timings` sufficient until detail-page/drill-down parity is ready?"
  - "Which DuckDB views should be documented as stable public browser contracts versus internal implementation details?"
  - "What is the acceptable startup/loading budget for DuckDB-backed benchmark pages, and do any pages still need a non-DuckDB bootstrap path for first paint?"

research_value:
  hypothesis: |
    A DuckDB-first browser read model will reduce cross-surface drift and make
    the explorer more credible and more powerful without changing the adopted
    matrix-first product shape.
  validation_approach: |
    Compare current explorer consumers, verify the CloudSpecs reference model,
    define the canonical DuckDB schema, then prove parity across matrix,
    compare, and SQL surfaces with automated tests before narrowing JSON usage.
  success_criteria: |
    All open questions are resolved before implementation; the final schema is
    explicit and testable; and automated parity tests show the same canonical
    values across the three interactive explorer surfaces.
