id: explorer-canonical-browser-duckdb-read-model
title: "Make DuckDB-WASM the canonical browser read model for explorer graphs and query workbench"
worktree: main
priority: High
status: Not Started
category: Core Functionality

description: |
  Revisit the results explorer strategy so the product stays matrix-first
  on benchmark landing pages while the CloudSpecs-style query surface
  remains a secondary analyst workbench. The current implementation is
  split-brain: the frontend already embeds DuckDB-WASM and `/results/query`
  executes SQL against `bench.results`, but most graph and compare surfaces
  still read from JSON artifacts while the pipeline snapshot only contains a
  thin `results` table.

  The target architecture is a static-first explorer where `results.duckdb`
  becomes the canonical interactive browser-side store for matrix views,
  compare flows, and ad hoc analysis, with `manifest.json` reduced to
  bootstrap/navigation and compatibility duties. This work must not proceed
  directly to code changes: the unresolved contract questions below must be
  closed by an explicit research gate before any implementation work starts.

  Verified current-state anchors:
    - `results-explorer/src/db.ts` attaches `/results/data/results.duckdb`
      with `ATTACH ... AS bench (READ_ONLY)`.
    - `results-explorer/src/pages/Query.tsx` already queries `bench.results`
      through DuckDB-WASM.
    - `benchbox/core/explorer_pipeline/duckdb_builder.py` currently emits
      only a `results` table plus `results_schema.json`, so most explorer
      graph pages still depend on JSON sidecars.

work:
  - id: w1
    summary: "Research gate: inventory current JSON vs DuckDB consumers, verify the CloudSpecs interaction/storage model, and close all open contract questions before implementation"
    status: pending
    notes: |
      Deliverables:
        1. A concrete call-site inventory for every explorer surface showing
           which pages/components currently read manifest JSON, benchmark
           summary JSON, detail JSON, or DuckDB.
        2. A schema decision record for the canonical browser DuckDB surface:
           required tables, required views, bootstrap JSON that remains, and
           which artifacts stay transitional.
        3. Resolution of every question in open_questions below, recorded in
           the TODO notes or a linked design note before any code edit begins.
        4. A migration order proving there is no period where matrix/compare
           and `/results/query` disagree on canonical timings.

  - id: w2
    summary: "Extend the explorer pipeline so results.duckdb contains the canonical browser tables and views needed by matrix, compare, and query surfaces"
    needs: [w1]
    status: pending
    notes: |
      Minimum expected artifacts:
        - `results`
        - `query_display_timings`
        - `query_executions`
        - `cohort_metadata`
        - `meta_leaderboard`
        - `short_ids`
      Plus stable browser-facing views for matrix and compare use cases.

  - id: w3
    summary: "Build a single frontend DuckDB access layer and schema contract tests so all interactive explorer reads go through one browser query path"
    needs: [w2]
    status: pending
    notes: |
      Consolidate TS-side data access around `results-explorer/src/db.ts`
      and small typed query helpers. No page should re-implement reduction or
      join logic ad hoc once this lands.

  - id: w4
    summary: "Migrate benchmark landing and compare surfaces to DuckDB-backed reads while preserving matrix-first UX and existing shareable URLs"
    needs: [w3]
    status: pending
    notes: |
      Benchmark pages remain the primary graph surface. `/results/query`
      remains secondary in product positioning, but all interactive values
      shown on both surfaces must come from the same DuckDB source of truth.

  - id: w5
    summary: "Expand the query workbench from result-row filtering into the canonical analyst surface with starter queries, cohort-aware templates, and download affordances"
    needs: [w4]
    status: pending
    notes: |
      Starter queries must cover common analyst questions across results,
      per-query timings, cohort comparisons, and trust/tuning breakdowns.
      Keep the SQL surface read-only.

  - id: w6
    summary: "Add parity, browser, and schema-contract exit gates proving matrix, compare, and SQL surfaces all agree on canonical values"
    needs: [w4, w5]
    status: pending
    notes: |
      Required parity assertions:
        - benchmark matrix query cell == compare query cell == SQL query result
        - ranking metric selection remains benchmark-family aware
        - read-only DuckDB enforcement still blocks DDL/DML from the workbench

  - id: w7
    summary: "Cut over documentation and transitional artifacts only after DuckDB-backed parity is proven and validated"
    needs: [w6]
    status: pending
    notes: |
      Narrow JSON artifacts only after additive migration succeeds. Update
      stale comments and contracts so the repo no longer describes DuckDB as
      scaffold-only when it is the canonical browser read model.

deferred:
  - summary: "Introduce any hosted API, authenticated query service, or server-side execution path"
    reason: "This TODO is static-first only; the proposed plan explicitly keeps the read path browser-side and read-only."
  - summary: "Make `/results/query` the default landing page for the explorer"
    reason: "The adopted product strategy keeps benchmark landing pages matrix-first and the query workbench secondary."
  - summary: "Remove all JSON artifacts in the first implementation slice"
    reason: "JSON outputs remain transitional until DuckDB-backed parity is demonstrated across existing surfaces."

