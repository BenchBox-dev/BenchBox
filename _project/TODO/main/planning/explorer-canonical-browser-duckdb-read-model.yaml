impact:
  business_value: |
    Gives BenchBox a results explorer with a credible single source of truth:
    benchmark pages answer the obvious comparison question immediately, while
    analyst users can ask deeper questions against the exact same embedded
    corpus.
  user_impact: |
    Users see one consistent set of values across Home, platform, benchmark,
    compare, detail, and ad hoc SQL instead of a mix of precomputed JSON
    artifacts and a thinner DuckDB workbench.
  technical_debt: |
    Removes the split-brain runtime model and stops treating beta-era JSON
    artifacts as long-lived public contracts for explorer metrics.

