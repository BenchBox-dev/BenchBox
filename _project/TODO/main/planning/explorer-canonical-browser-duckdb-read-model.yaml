open_questions:
  - "What is the minimal bootstrap JSON that remains after cutover, if any, and how is the no-metrics-in-JSON rule enforced in code and tests? (Plan recommendation: if `manifest.json` survives, it is route/navigation-only and never a metric carrier; everything else metric-bearing dies)"
  - "Which DuckDB tables or views are documented as stable browser contracts for Home, PlatformIndex, BenchmarkIndex, Compare, ResultDetail, and Query? (Plan recommendation: the ten canonical tables listed in w2)"
  - "Should Query schema discovery come from DuckDB introspection or a DuckDB-resident metadata table? (Plan recommendation: introspection first; upgrade to metadata table only if RG-1 measures it as hot-path)"
  - "What is the acceptable startup/loading budget for DuckDB-backed pages, and do we need a tiny non-metric route bootstrap for first paint? (Plan proposal: p50 <1500ms, p95 <3500ms per RG-1; if a route bootstrap exists it stays non-metric and subordinate to DuckDB)"
  - "Is `result_detail_metrics` a single EAV-style table (metric_group, metric_name, value_numeric/value_text/value_json) or a set of narrow tables (phases, validations, platform_info, environment, tuning, cost_breakdown) joined by a view of the same name? (Plan recommendation: narrow tables + join view, so dashboards read the view and analysts drill into the narrow tables)"
  - "Should the DuckDB-WASM build used by the workbench have `HTTPFS`, `INSTALL`, and `LOAD` extensions compiled out so user SQL cannot reach arbitrary network endpoints even under READ_ONLY attach?"

research_value:
  hypothesis: |
    A direct `committed JSON -> DuckDB` pipeline plus DuckDB-only explorer
    metric reads will eliminate cross-surface drift and make the results
    explorer materially more credible without changing the matrix-first
    product shape.
  validation_approach: |
    Inventory the current JSON consumers, define the canonical DuckDB schema,
    move every metric-bearing explorer surface onto DuckDB, and prove parity
    with automated tests before deleting metric JSON artifacts.
  success_criteria: |
    All contract questions are resolved before implementation; the final
    DuckDB schema is explicit and testable; and automated checks prove that
    explorer metrics come from DuckDB rather than runtime JSON fetches.
