  - "The research gate resolves the DuckDB-only explorer contract before the first code edit"
  - "Committed JSON result objects flow directly into DuckDB and no user-visible metric is served from JSON at runtime"
  - "Home, platform, benchmark, compare, detail, and query surfaces read canonical metrics from DuckDB"
  - "Any surviving bootstrap JSON is explicitly non-metric and covered by tests or static checks"
  - "Benchmark landing pages remain matrix-first and read-only SQL safety remains intact"

open_questions:
  - "What is the minimal bootstrap JSON that remains after cutover, if any, and how is the no-metrics-in-JSON rule enforced in code and tests?"
  - "Which DuckDB tables or views are documented as stable browser contracts for Home, PlatformIndex, BenchmarkIndex, Compare, ResultDetail, and Query?"
  - "Should Query schema discovery come from DuckDB introspection or a DuckDB-resident metadata table?"
  - "What is the acceptable startup/loading budget for DuckDB-backed pages, and do we need a tiny non-metric route bootstrap for first paint?"
  - "Should short-id resolution remain a tiny bootstrap map, or move fully behind DuckDB-backed helpers once routing queries are in place?"

research_value:
  hypothesis: |
    A direct `committed JSON -> DuckDB` pipeline plus DuckDB-only explorer
    metric reads will eliminate cross-surface drift and make the results
    explorer materially more credible without changing the matrix-first
    product shape.
  validation_approach: |
    Inventory the current JSON consumers, define the canonical DuckDB schema,
    move every metric-bearing explorer surface onto DuckDB, and prove parity
    with automated tests before deleting metric JSON artifacts.
  success_criteria: |
    All contract questions are resolved before implementation; the final
    DuckDB schema is explicit and testable; and automated checks prove that
    explorer metrics come from DuckDB rather than runtime JSON fetches.
