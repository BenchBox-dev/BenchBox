impact:
  business_value: |
    Gives BenchBox a clearer and more credible public results product:
    benchmark pages answer the obvious comparison question immediately,
    while analyst users can ask their own questions against the same
    embedded corpus without leaving the browser.
  user_impact: |
    Users get one consistent source of truth for matrix views, compare,
    and ad hoc SQL analysis instead of a split between precomputed JSON
    views and a thinner DuckDB workbench.
  technical_debt: |
    Retires the split-brain read model where JSON and DuckDB can drift,
    and turns browser-side DuckDB from an optional workbench feature into
    the canonical interactive data contract.

