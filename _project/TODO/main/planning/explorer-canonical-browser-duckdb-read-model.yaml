  - description: "Canonical DuckDB contract exists with the expected browser tables/views"
    command: "uv run -- python -c \"import duckdb; con=duckdb.connect('results-explorer/public/data/results.duckdb', read_only=True); names={r[0] for r in con.execute('PRAGMA show_tables').fetchall()}; required={'results','query_display_timings','query_executions','cohort_metadata','meta_leaderboard','short_ids'}; missing=required-names; assert not missing, missing\""
    expected_output: "no assertion failure"
  - description: "Cross-surface parity holds for canonical display values"
    command: "cd results-explorer && npm test -- duckdbReadModel"
    expected_output: "matrix, compare, and query parity tests pass"
  - description: "Read-only SQL enforcement still holds"
    command: "cd results-explorer && npm test -- Query"
    expected_output: "DDL/DML attempts fail; read-only SELECT flows still pass"
  - description: "Fast Python suite stays green after the migration"
    command: "uv run -- python -m pytest -m fast -q"
    expected_output: "all tests pass"

