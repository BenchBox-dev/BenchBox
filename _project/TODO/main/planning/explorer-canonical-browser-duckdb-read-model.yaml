must_preserve:
  - "Benchmark landing pages remain matrix-first default routes; `/results/query` stays a secondary analysis surface rather than the primary explorer entrypoint"
  - "DuckDB is always attached read-only in the browser; no implementation step may weaken `ATTACH ... (READ_ONLY)` or permit persistent mutation from the SQL workbench"
  - "Every user-visible metric, rank, aggregate, and detail timing shown in the explorer originates from DuckDB rather than JSON sidecars or TypeScript-only recomputation"
  - "Committed JSON result objects remain immutable source inputs; the browser does not fetch them directly for metric rendering"
  - "Any temporary compatibility scaffolding used during page-by-page migration is derived from the DuckDB contract and cannot define, override, or outlive user-visible metrics"
  - "Shareable compare flows remain available after cutover, but route convenience is subordinate to the DuckDB-only metric contract"
  - "The explorer remains static-hosted and browser-executed; no server API, auth dependency, or hosted query runtime is introduced by this TODO"

approach: |
  Follow a research-first but opinionated cutover, not an additive
  compatibility migration.

  First, inventory every runtime metric fetch and every pipeline artifact that
  currently feeds it. Then define the DuckDB schema and materializations that
  replace those paths. After the research gate, wire the explorer pipeline
  directly from committed JSON objects into DuckDB, move all metric surfaces
  onto typed DuckDB queries, and remove metric-bearing JSON outputs and
  loaders.

  Temporary parity checks are allowed as verification scaffolding, but JSON is
  not a second product contract. If a surface shows metrics to the user, those
  metrics must exist in DuckDB first.

anti_patterns:
  - "DO NOT start implementation before the research gate closes the schema and cutover details -- because this is a contract refactor across pipeline and UI -- lock the rules first and record them"
  - "DO NOT preserve beta-era JSON metric contracts just because they already exist -- because the explorer has not shipped and the current contract is wrong -- optimize for the correct canonical model, not compatibility theater"
  - "DO NOT keep separate canonical logic in JSON loaders and DuckDB helpers -- because that recreates the current drift risk -- move all interactive metric reads behind one DuckDB contract"
  - "DO NOT allow Home, PlatformIndex, BenchmarkIndex, Compare, or ResultDetail to keep metric reads outside DuckDB -- because that violates the core architecture goal -- migrate every metric-bearing surface"
  - "DO NOT recompute display reductions or ranking rules in TypeScript -- because the pipeline already owns those semantics -- persist canonical values in DuckDB and read them directly"
  - "DO NOT require derived user-visible metrics to equal verbatim JSON source fields -- because many visible values are canonical reductions or rollups computed by the pipeline -- prove final-value parity against DuckDB outputs and reference computations instead"
  - "DO NOT let bootstrap convenience justify metric-bearing `manifest.json` or `results_schema.json` sidecars -- because that silently recreates split-brain storage -- keep any surviving JSON bootstrap-only"
  - "DO NOT widen scope into CLI, hosted API, or submission-path changes -- because this TODO is about the static explorer read model only -- leave write-path contracts untouched"

