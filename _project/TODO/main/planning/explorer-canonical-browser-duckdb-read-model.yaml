must_preserve:
  - "Benchmark landing pages remain matrix-first default routes; `/results/query` stays a secondary analysis surface rather than the primary explorer entrypoint"
  - "DuckDB is always attached read-only in the browser; no implementation step may weaken `ATTACH ... (READ_ONLY)` or permit persistent mutation from the SQL workbench"
  - "Matrix, compare, and query surfaces continue to show the same reduced per-query timings; no TypeScript path may silently recompute a divergent reduction policy"
  - "Existing compare URLs and short-id resolution remain backward-compatible throughout the migration"
  - "The explorer remains static-hosted and browser-executed; no server API, auth dependency, or hosted query runtime is introduced by this TODO"

approach: |
  Follow a research-first, additive migration.

  First, inventory every current explorer read path and confirm exactly where
  JSON remains authoritative today. Use that to close the schema and cutover
  questions before editing code. After the research gate, extend the pipeline
  so the DuckDB snapshot contains the canonical browser tables/views while
  preserving existing JSON outputs.

  Migrate one surface at a time behind parity checks:
    1. pipeline/schema contract
    2. frontend typed DuckDB access layer
    3. benchmark matrix
    4. compare
    5. query workbench expansion
    6. transitional JSON narrowing

  Reuse the existing reduction policy and ranking registry from the explorer
  pipeline. Compute canonical values once in Python, persist them into DuckDB,
  and consume them directly in TypeScript. Do not move reduction or ranking
  decisions into browser code.

anti_patterns:
  - "DO NOT start implementation before the research gate closes the schema and migration-cut questions — because this is a contract refactor across pipeline and UI — resolve the unknowns first and record the decisions"
  - "DO NOT make `/results/query` the primary explorer landing flow — because the adopted product strategy is matrix-first on benchmark pages — keep query as the secondary analyst surface"
  - "DO NOT keep separate canonical logic in JSON loaders and DuckDB helpers — because that recreates the current drift risk — move interactive reads behind one DuckDB contract"
  - "DO NOT recompute display reductions or ranking rules in TypeScript — because the pipeline already owns those semantics — persist canonical values in DuckDB and read them directly"
  - "DO NOT drop benchmark/detail JSON artifacts in the same slice that introduces new DuckDB tables — because rollback and parity validation become impossible — cut over additively first"
  - "DO NOT widen scope into CLI, hosted API, or submission-path changes — because this TODO is about the static explorer read model only — leave write-path contracts untouched"

