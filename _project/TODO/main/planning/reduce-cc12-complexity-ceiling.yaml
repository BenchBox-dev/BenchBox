id: reduce-cc12-complexity-ceiling
title: "Reduce CC=12 complexity ceiling — exclude 6 inherent, refactor 14, lower warn to 12"
worktree: main
priority: Medium
status: Not Started
description: |
  Wave 4 of the complexity ratchet. After waves 1-3 (CC≥20, CC=14, CC=13), the
  current ceiling is CC=12 with 20 functions at that level and warn_complexity=13.

  Preliminary classification (to be verified in w1):
  - 6 inherent: domain-driven branching (TPC spec validation, measurement protocols,
    mode dispatch, analytical pattern detection, data loading sequences)
  - 14 refactorable: dict dispatch, helper extraction, data-driven config, dedup

  Goal: no non-excluded function at CC≥12, then lower warn_complexity from 13 to 12.

category: Code Quality and Technical Debt

deps:
  needs: []

work:
  - id: w1
    summary: "Verify preliminary classifications for all 20 CC=12 functions"
    status: pending
    note: |
      Read each function and its callers. Confirm or reclassify:

      Preliminary INHERENT (6):
      - run_official (cli/commands/run_official.py:75) — TPC spec validation with 3 orthogonal constraints
      - _generate_query_highlights (core/analysis/insights.py:447) — two distinct analytical patterns
      - _benchmark_query (core/dataframe/benchmark_suite.py:583) — measurement protocol with warmup/timing/memory interleave
      - _run_df_query (core/dataframe/benchmark_suite.py:1165) — benchmark sequencing (load → warmup → time)
      - _load_data (core/read_primitives/benchmark.py:483) — safe data loading with compatibility/schema/table/commit ordering
      - _execute_load_only_mode (core/runner/runner.py:331) — external vs native table mode dispatch

      Preliminary REFACTORABLE (14):
      - _output_summary_text (cli/commands/compare_plans.py:338) — dedup text/rich renderers
      - convert (cli/commands/convert.py:134) — consolidate error handling into validators
      - validate_config (cli/config.py:359) — dict dispatch for 10 repeated guards
      - generate_cli_command (cli/dryrun.py:30) — extend existing _VALUE_PARAMS pattern to all params
      - format_last_run_summary (cli/preferences.py:232) — field loop + extract _format_relative_time
      - _run_simple_wizard (cli/tuning.py:307) — extract platform feature enable loop
      - calculate_confidence_interval (core/analysis/statistics.py:163) — T_CRITICAL_VALUES lookup table
      - get_summary (core/dataframe/benchmark_suite.py:685) — extract speedup/winner helpers
      - run_dataframe_benchmark (core/metadata_primitives/benchmark.py:1282) — data-driven op dispatch
      - execute_complex_type_introspection (core/metadata_primitives/dataframe_operations.py:1617) — platform dispatch dict
      - detect_antipatterns (core/query_plans/insights.py:173) — table-driven rule checks
      - _parse_json_node (core/query_plans/parsers/duckdb.py:241) — operator dispatch dict
      - validate_power_test_results (core/tpc_metrics.py:120) — table-driven validation rules
      - parse_file (core/tpcdi/etl/customer_mgmt_processor.py:194) — action type dispatch dict

      Record in _project/analysis/complexity/classification-matrix.yaml.
      If any reclassifications occur, adjust w2 exclusion list and add/remove work units.

  - id: w2
    summary: "Add inherent-complexity CC=12 exclusions to pyproject.toml"
    status: pending
    needs: [w1]
    note: |
      Batch-add all confirmed inherent-complexity functions to exclude_functions
      following existing format: "file:function",  # CC — rationale
      Group under section header:
      # --- Required complexity at CC=12 (YYYY-MM-DD evaluation, wave 4) ---

  - id: w3
    summary: "Refactor _output_summary_text (CC 12->~6) — dedup text and Rich renderers"
    status: pending
    needs: [w2]
    note: |
      File: benchbox/cli/commands/compare_plans.py:338
      Pattern: Duplicated text building logic (lines ~340-362) and Rich rendering
      (lines ~381-417) produce the same data in two formats.
      Approach: Extract normalized data structure once, pass to separate
      _format_text() and _format_rich() helpers.

  - id: w4
    summary: "Refactor convert (CC 12->~7) — consolidate error handling into validators"
    status: pending
    needs: [w2]
    note: |
      File: benchbox/cli/commands/convert.py:134
      Pattern: Sequential error handling, logging config, and path validation
      create defensive nesting around a linear core (load → validate → convert → summarize).
      Approach: Move validation/error handling into _validate_convert_inputs() helper.

  - id: w5
    summary: "Refactor validate_config (CC 12->~5) — dict dispatch for repeated guards"
    status: pending
    needs: [w2]
    note: |
      File: benchbox/cli/config.py:359
      Pattern: 10 identical check-and-print guards varying only by config key and message.
      Approach: Define _VALIDATION_RULES = [(key, min_value, error_msg), ...] and
      replace 10 guards with a single loop over the rules list.

  - id: w6
    summary: "Refactor generate_cli_command (CC 12->~6) — extend data-driven param pattern"
    status: pending
    needs: [w2]
    note: |
      File: benchbox/cli/dryrun.py:30
      Pattern: 20+ parameter combinations with 3 recurring patterns (list flags,
      scalar params, boolean flags). _VALUE_PARAMS at line ~103 already handles
      some scalars.
      Approach: Extend _VALUE_PARAMS to cover all param types; replace per-param
      conditionals with a loop.

  - id: w7
    summary: "Refactor format_last_run_summary (CC 12->~6) — extract field loop and time formatter"
    status: pending
    needs: [w2]
    note: |
      File: benchbox/cli/preferences.py:232
      Pattern: Sequential conditional branches for each config field (tuning →
      phases → concurrency → timestamp) with identical get-format-append logic.
      Approach: Define field list with format lambdas; loop once. Extract
      _format_relative_time() for timestamp delta logic.

  - id: w8
    summary: "Refactor _run_simple_wizard (CC 12->~6) — extract platform feature enable loop"
    status: pending
    needs: [w2]
    note: |
      File: benchbox/cli/tuning.py:307
      Pattern: 4 platform-specific feature gates (Databricks, Snowflake, BigQuery,
      Redshift) with identical structure: confirm → enable → print.
      Approach: Define _PLATFORM_FEATURES = [(name, config_key, description), ...]
      and loop with shared _enable_platform_feature_interactive() helper.

  - id: w9
    summary: "Refactor calculate_confidence_interval (CC 12->~5) — t-critical lookup table"
    status: pending
    needs: [w2]
    note: |
      File: benchbox/core/analysis/statistics.py:163
      Pattern: Nested if/elif for confidence_level × sample_size → t-critical value
      creates 9 branches from 2 dimensions.
      Approach: Replace with T_CRITICAL_VALUES dict keyed by (confidence_level, n_range);
      use bisect or direct lookup.

  - id: w10
    summary: "Refactor get_summary (CC 12->~7) — extract speedup and winner helpers"
    status: pending
    needs: [w2]
    note: |
      File: benchbox/core/dataframe/benchmark_suite.py:685
      Pattern: Nested loops for geomean calculation, speedup matrix building, and
      query winner detection with repeated dict lookups.
      Approach: Extract _build_speedup_matrix(results) and _find_query_winners(results)
      helpers. Main function becomes: aggregate → build matrix → find winners → format.

  - id: w11
    summary: "Refactor run_dataframe_benchmark (CC 12->~6) — data-driven op category dispatch"
    status: pending
    needs: [w2]
    note: |
      File: benchbox/core/metadata_primitives/benchmark.py:1282
      Pattern: Branching on operation categories (schema_ops vs catalog_ops) with
      duplicated timing/result-tracking in each branch.
      Approach: Define op-type → handler mapping dict; extract common
      _execute_and_track(op, handler) for the shared timing/result pattern.

  - id: w12
    summary: "Refactor execute_complex_type_introspection (CC 12->~6) — platform dispatch dict"
    status: pending
    needs: [w2]
    note: |
      File: benchbox/core/metadata_primitives/dataframe_operations.py:1617
      Pattern: Three near-identical platform branches (Polars, Spark, Pandas) each
      calling a helper and collecting results.
      Approach: Define _TYPE_ANALYZERS = {"polars": _analyze_polars_type, ...};
      replace if-elif chain with dict lookup + uniform result collection.

  - id: w13
    summary: "Refactor detect_antipatterns (CC 12->~5) — table-driven rule checks"
    status: pending
    needs: [w2]
    note: |
      File: benchbox/core/query_plans/insights.py:173
      Pattern: Multiple independent checks (cross-join, join conditions, depth,
      multiple scans) each creating PlanInsight objects with repetitive structure.
      Approach: Define _ANTIPATTERN_RULES list of (check_fn, severity, description)
      tuples; iterate once and apply uniformly.

  - id: w14
    summary: "Refactor _parse_json_node (CC 12->~6) — operator dispatch dict"
    status: pending
    needs: [w2]
    note: |
      File: benchbox/core/query_plans/parsers/duckdb.py:241
      Pattern: elif chain mapping operator types to kwarg extraction logic
      (SCAN → table_name, FILTER → filter_expressions, etc.).
      Approach: Define _OPERATOR_EXTRACTORS = {OperatorType.SCAN: _extract_scan_kwargs, ...};
      replace elif chain with dict.get() lookup.

  - id: w15
    summary: "Refactor validate_power_test_results (CC 12->~6) — table-driven validation rules"
    status: pending
    needs: [w2]
    note: |
      File: benchbox/core/tpc_metrics.py:120
      Pattern: Repetitive range checks (scale factor, time, per-query time),
      benchmark-specific counts, and manual error message construction.
      Approach: Define _VALIDATION_RULES = [{"field": ..., "min": ..., "max": ...,
      "msg": ...}, ...]; loop once with generic _check_range() helper.

  - id: w16
    summary: "Refactor parse_file (CC 12->~6) — action type dispatch dict"
    status: pending
    needs: [w2]
    note: |
      File: benchbox/core/tpcdi/etl/customer_mgmt_processor.py:194
      Pattern: if-elif chain on action_type (NEW/UPDCUST → customer, ADDACCT → account,
      INACT → inactivate) dispatching to dedicated helpers.
      Approach: Define _ACTION_HANDLERS = {"NEW": _handle_customer, "ADDACCT":
      _handle_account, ...}; replace if-elif with dict lookup.

  - id: w17
    summary: "Lower warn threshold from 13 to 12 in pyproject.toml"
    status: pending
    needs: [w3, w4, w5, w6, w7, w8, w9, w10, w11, w12, w13, w14, w15, w16]
    note: |
      Once all CC=12 functions are either excluded or refactored to ≤11,
      update pyproject.toml: warn_complexity = 12.
      Verify: make complexity-check shows 0 warnings and 0 failures.

deferred:
  - id: d1
    summary: "Reassess work units after w1 classification verification"
    reason: |
      The 14 refactorable functions come from preliminary classification based on
      code reading. w1 may reclassify some as inherent (reducing refactoring scope)
      or identify additional refactoring targets missed by the automated scan.
      Update w3-w16 and w17 needs-edges accordingly.

verification:
  - description: "Complexity check passes with no functions at CC>=12"
    command: "make complexity-check"
    expected_output: "0 warnings, 0 failures"
  - description: "No non-excluded CC>=12 functions remain"
    command: "uv run -- python scripts/check_complexity.py 2>&1 | grep '^    1[2-9]\\|^    [2-9][0-9]' | grep -v '^  Module' | wc -l"
    expected_output: "0"
  - description: "No regressions in fast suite"
    command: "uv run -- python -m pytest -m fast -q"
    expected_output: "All fast tests pass"
  - description: "Lint passes"
    command: "uv run ruff check ."
    expected_output: "All checks passed"

must_preserve:
  - "All refactored functions must produce identical behavior — no semantic changes"
  - "Existing tests must continue to pass without modification"
  - "exclude_functions entries must include CC score and rationale comment"
  - "Excluded functions from prior complexity waves (CC≥20, CC=14, CC=13) remain untouched"
  - "Refactored helpers stay in the same module as their parent function"

approach: |
  w1: Read each CC=12 function, classify per guidelines established in prior waves
  (reduce-cyclomatic-complexity-violations, reduce-cc14-complexity-cluster,
  reduce-cc13-complexity-ceiling). Record in classification-matrix format.
  Reclassify if preliminary assessment was wrong.

  w2: Batch-add inherent entries to pyproject.toml under new section header.

  w3-w16: For each refactoring:
  1. Read the function and its callers/tests
  2. Extract private helper methods or define data-driven config in the same module
  3. Run focused tests + lint after each extraction
  4. Verify CC reduced via: uv run -- python scripts/check_complexity.py 2>&1 | grep function_name
  5. Commit per work unit

  w17: Update warn_complexity threshold and verify.

anti_patterns:
  - "DO NOT change public API signatures — because all targets are internal or private functions"
  - "DO NOT add new abstractions (base classes, protocols) — because extraction and dict dispatch alone achieve the CC target"
  - "DO NOT move code to new files — because helpers share private state with the parent function"
  - "DO NOT refactor functions classified as inherent — because their complexity reflects domain reality; use exclude_functions instead"
  - "DO NOT lower max_complexity (currently 20) — because the exclude list handles inherent complexity above the warn threshold; only warn_complexity should decrease"
  - "DO NOT create new test files for extracted helpers — because they are private and tested through existing call paths"

scope_limit:
  only_modify:
    - "pyproject.toml"
    - "_project/analysis/complexity/classification-matrix.yaml"
    - "benchbox/cli/commands/compare_plans.py"
    - "benchbox/cli/commands/convert.py"
    - "benchbox/cli/config.py"
    - "benchbox/cli/dryrun.py"
    - "benchbox/cli/preferences.py"
    - "benchbox/cli/tuning.py"
    - "benchbox/core/analysis/statistics.py"
    - "benchbox/core/dataframe/benchmark_suite.py"
    - "benchbox/core/metadata_primitives/benchmark.py"
    - "benchbox/core/metadata_primitives/dataframe_operations.py"
    - "benchbox/core/query_plans/insights.py"
    - "benchbox/core/query_plans/parsers/duckdb.py"
    - "benchbox/core/tpc_metrics.py"
    - "benchbox/core/tpcdi/etl/customer_mgmt_processor.py"
    # w1 may add files if reclassification discovers additional targets.
