id: joinorder-parquet-rebuild-determinism-decision
title: "JoinOrder canonical data rebuild determinism: choose byte-identical pinning or logical content-hash guarantee"
worktree: main
priority: Critical
status: Not Started
category: Testing and Quality Assurance

description: |
  Follow-up to `_project/joinorder/provenance-attestation.md` from the
  `joinorder-canonical-data-assurance` TODO. The 2026-05-12 rebuild check
  restored the canonical Dataverse pg_dump and rebuilt the Parquet archive
  twice with `_project/scripts/build_joinorder_data.py rebuild-local`.

  Result: the rebuild did not reproduce the committed `archive_sha256`, and the
  two local rebuilds did not match each other. `cast_info.parquet` differed
  between run 1 and run 2; `title.parquet` differed from the committed table
  hash in both runs. The conversion-fidelity harness passed, so the observed
  failure is byte-level rebuild determinism rather than a proven data-loss
  defect.

  This is release-relevant. BenchBox should not claim byte-identical rebuild
  reproducibility for canonical `joinorder` until this decision lands.

work:
  - id: w1
    summary: "Choose the integrity model: byte-identical artifact rebuild or logical content-hash rebuild"
    status: pending
    notes: |
      Option A: pin conversion harder until `rebuild-local` reproduces the
      committed archive byte-for-byte. Investigate deterministic row ordering,
      DuckDB/pyarrow/zstd versions, row group sizing, compression settings,
      dictionary encoding, and package metadata.

      Option B: explicitly define rebuild recovery as logical equivalence, not
      byte identity. Add order-independent table content hashes and update docs
      so runtime archive download still uses `archive_sha256`, while source
      rebuild validation proves row/content equivalence.

  - id: w2
    summary: "Implement the selected model in the build pipeline and manifest/docs"
    needs: [w1]
    status: pending
    notes: |
      If Option A wins, make `rebuild-local` deterministic and prove run1 ==
      run2 == committed archive. If Option B wins, add content-hash generation
      and verification, document the distinction from transport archive hashes,
      and keep the current release artifact hash pinned for downloads.

  - id: w3
    summary: "Verify against the full canonical source"
    needs: [w2]
    status: pending
    notes: |
      Re-run the full rebuild check from the cached/restored Dataverse source
      and capture a durable log under
      `/Users/joe/Developer/benchmark_runs/logs/`. Update
      `_project/joinorder/provenance-attestation.md` with the resolved result.

deferred:
  - summary: "Changing the public `joinorder` data URL"
    reason: "Owned by the licensing remediation TODO if BenchBox stops re-hosting the archive."

prior_art:
  - "_project/joinorder/provenance-attestation.md -- records the failed 2026-05-12 run1/run2 byte comparison"
  - "_project/scripts/build_joinorder_data.py:rebuild-local -- local-only rebuild command used for the failing check"
  - "benchbox/core/data_fetch/manifest.py -- documents and verifies manifest_hash, data_archive_hash, and archive_sha256 semantics"

must_preserve:
  - "Do not change the 113 canonical query corpus to solve artifact determinism"
  - "Do not rewrite committed reference cardinalities unless a separate data mismatch is proven"
  - "Keep runtime download verification by `archive_sha256` for the current released archive until a replacement artifact is deliberately published"

approach: |
  Treat this as a release decision, not a silent hash refresh. First decide
  whether BenchBox wants byte-identical rebuilds or a logical content-hash
  rebuild contract. Then implement that model with a full-source verification
  log and user-facing docs.

anti_patterns:
  - "DO NOT update table sha256 or archive_sha256 values merely to match a fresh rebuild"
  - "DO NOT keep saying the archive is byte-reproducible while `cast_info.parquet` is run-to-run nondeterministic"
  - "DO NOT drop the existing archive_sha256 transport verification; it still protects the published release asset"

verification:
  - description: "The determinism decision is recorded and implemented"
    command: "grep -i 'byte-identical\\|logical\\|content-hash\\|deterministic' _project/joinorder/provenance-attestation.md docs/benchmarks/join-order.md"
    expected_output: "docs state the selected rebuild guarantee"
  - description: "The full-source rebuild/content check passes under the selected model"
    command: "grep -i 'deterministic_rebuild=PASS\\|logical_content_rebuild=PASS' /Users/joe/Developer/benchmark_runs/logs/joinorder_*/* 2>/dev/null"
    expected_output: "a durable full-source log records the passing selected check"

scope_limit:
  only_modify:
    - "_project/scripts/build_joinorder_data.py"
    - "_project/joinorder/provenance-attestation.md"
    - "_project/joinorder/release-notes.md"
    - "benchbox/core/joinorder/data_manifest.toml"
    - "benchbox/core/data_fetch/"
    - "docs/benchmarks/join-order.md"
    - "tests/unit/core/joinorder/"
    - "tests/unit/scripts/test_build_joinorder_data.py"
  do_not_modify:
    - "benchbox/core/joinorder/queries.py"
    - "_project/joinorder/reference_cardinalities.json"
    - "_project/joinorder/tiny_reference_cardinalities.json"

metadata:
  owners:
    - joeharris76
  tags:
    - joinorder
    - issue-289
    - data-integrity
    - reproducibility
    - release-blocker
  estimated_effort: Medium
  created_date: "2026-05-12"
  last_updated: "2026-05-12T00:00:00"

impact:
  business_value: |
    Prevents BenchBox from overstating canonical JoinOrder rebuild guarantees
    and gives maintainers a clear path to resolve the release-risk gap.
  user_impact: |
    Users get an honest statement of whether they can rebuild the exact archive
    bytes or only verify logically equivalent canonical tables.
  technical_debt: |
    Replaces an implicit byte-reproducibility assumption with a tested,
    documented integrity model.

success_metrics:
  - "The selected rebuild guarantee is documented in the attestation and user docs"
  - "The build pipeline has a passing full-source check for the selected model"
  - "No manifest hashes are silently refreshed without a documented artifact decision"

open_questions:
  - question: "Should JoinOrder rebuild recovery target byte-identical archive reproduction or logical content equivalence?"
    gating: true
    affects: ["w1", "w2", "w3"]
    default: "Logical content equivalence, because the current Parquet writer path is byte-nondeterministic for at least `cast_info`"
