id: explorer-pipeline-meta-leaderboard-widening
title: "Explorer pipeline: widen MetaRank cells and emit results_schema.json"
worktree: main
priority: High
status: Not Started
category: Core Functionality

description: |
  Phase F of the Results Explorer strategy revision
  (plans/purring-jingling-petal-ultraplan).

  The master leaderboard (Phase B) and the query workbench (Phase C)
  both need pipeline-side surface additions before the UI work can
  land.

  1) `_build_meta_leaderboard` in
     `benchbox/core/explorer_pipeline/pipeline.py` already computes
     `metric_value` per platform per cohort (line 217) but drops it
     before the meta artifact is flattened (line 223, which keeps only
     `{rank, total}`). The Home master leaderboard needs the absolute
     value, the within-cohort speedup, and the primary metric/order so
     it can format cells in the three render modes (Times / Ranks /
     Speedup) without a second cohort lookup.

  2) The query workbench's column picker shouldn't hardcode the
     column list. `DuckDBSnapshotBuilder._COLUMNS` is already
     authoritative — emit it as `results_schema.json` next to
     `results.duckdb` so the frontend can consume it directly.

work:
  - id: w1
    summary: "Widen MetaRank cell shape to {rank, total, metric_value, speedup_vs_best, primary_metric, primary_order}"
    status: pending
    notes: |
      benchbox/core/explorer_pipeline/pipeline.py:_build_meta_leaderboard
      currently flattens each cell to {rank, total} at line 223. Keep
      rank/total and add:
        - metric_value: float | None (already computed at line 217)
        - speedup_vs_best: float | None
            * for latency-style metrics (primary_order == "asc"):
                best / value
            * for throughput/score metrics (primary_order == "desc"):
                value / best
          best = min or max of non-null metric_values in the cohort
        - primary_metric: str (e.g. "geomean_ms", "power_score")
        - primary_order: "asc" | "desc"
      Pull primary_metric/primary_order from get_ranking_config(benchmark)
      — pipeline.py line 142 already calls this for the summary build,
      reuse the result.

  - id: w2
    summary: "Update MetaRank Pydantic model in explorer_pipeline/models.py"
    needs: [w1]
    status: pending
    notes: |
      Widen MetaRank to include the new fields. Mark them Optional to
      remain backward-compatible with any cached artifacts (current
      consumers only read {rank, total}, so extra keys are safe).

  - id: w3
    summary: "Emit results_schema.json next to results.duckdb"
    status: pending
    notes: |
      benchbox/core/explorer_pipeline/duckdb_builder.py — after the
      DuckDB file is written, serialize _COLUMNS (name + type) as
      results_schema.json in the same output directory. No schema
      change; just persisting the already-authoritative column list
      so the frontend's column picker (Phase C) doesn't have to
      hardcode it.

      Shape:
        {"columns": [{"name": "...", "type": "..."}, ...]}

  - id: w4
    summary: "Pipeline unit tests for widened MetaRank and results_schema.json emission"
    needs: [w2, w3]
    status: pending
    notes: |
      - tests/unit/core/explorer_pipeline/test_meta_leaderboard.py (new):
        assert each cell has metric_value, speedup_vs_best,
        primary_metric, primary_order; check speedup math for a
        latency cohort (best = min) and a throughput cohort
        (best = max)
      - tests/unit/core/explorer_pipeline/test_duckdb_builder.py
        (extended): assert results_schema.json exists next to
        results.duckdb and lists the expected columns

files_affected:
  modified:
    - "benchbox/core/explorer_pipeline/pipeline.py"
    - "benchbox/core/explorer_pipeline/models.py"
    - "benchbox/core/explorer_pipeline/duckdb_builder.py"
    - "tests/unit/core/explorer_pipeline/test_duckdb_builder.py"
  added:
    - "tests/unit/core/explorer_pipeline/test_meta_leaderboard.py"
    - "results_schema.json (emitted artifact, not checked in)"

must_preserve:
  - "Existing frontend consumers that read only {rank, total} from MetaRank continue to work — extra keys are additive"
  - "DuckDB snapshot output (results.duckdb) byte-for-byte identical — this item only adds a sidecar"
  - "primary_metric / primary_order values match get_ranking_config() for every registered benchmark family"

approach: |
  w1/w2 form a pair: compute new fields in the pipeline, then widen
  the Pydantic model to surface them. w3 is independent (sidecar
  emission in duckdb_builder.py) so it can land in parallel. w4
  gates both with unit tests; regenerate any snapshot fixtures under
  tests/ that encode the narrower MetaRank shape.

  For speedup math, follow the plan's direction convention:
    - latency (asc): speedup = best_metric / cell_metric → > 1 means slower
    - throughput/score (desc): speedup = cell_metric / best_metric → < 1 means worse
  Both forms make the cohort best = 1.0, which is what the UI renders.

anti_patterns:
  - "DO NOT remove {rank, total} — because existing frontends depend on them — only add fields"
  - "DO NOT hardcode latency-vs-throughput logic — because RankingConfig.primary_order already encodes the direction — read it"
  - "DO NOT recompute best per cohort in a second pass — because the cohort iteration at pipeline.py:217 already has all values — fold speedup into that loop"

verification:
  - description: "Explorer pipeline unit tests green"
    command: "uv run -- python -m pytest tests/unit/core/explorer_pipeline/ -v"
    expected_output: "all pass, including new MetaRank and results_schema tests"
  - description: "Fast suite green (no regressions elsewhere)"
    command: "uv run -- python -m pytest -m fast -q"
    expected_output: "all green"
  - description: "End-to-end pipeline run emits widened artifacts"
    command: "uv run benchbox explorer build --data-dir results-data/ --output /tmp/explorer-out"
    expected_output: "/tmp/explorer-out/meta_leaderboard.json cells include metric_value/speedup_vs_best/primary_metric/primary_order; /tmp/explorer-out/results_schema.json exists"

scope_limit:
  only_modify:
    - "benchbox/core/explorer_pipeline/pipeline.py"
    - "benchbox/core/explorer_pipeline/models.py"
    - "benchbox/core/explorer_pipeline/duckdb_builder.py"
    - "tests/unit/core/explorer_pipeline/test_meta_leaderboard.py"
    - "tests/unit/core/explorer_pipeline/test_duckdb_builder.py"

impact:
  user_impact: |
    Enables two downstream UIs that users will actually see: the
    master leaderboard (absolute-value cells + speedup mode) and the
    query workbench column picker. Users get cross-benchmark
    numbers, not just cross-benchmark ranks.
  technical_debt: |
    Removes a planned frontend hardcoding of _COLUMNS by making the
    pipeline the single source of truth for the results snapshot
    schema. Meta-leaderboard cells stop dropping information that's
    already computed one pass earlier.

