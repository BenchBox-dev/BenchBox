impact:
  business_value: |
    Separates the binary/toolchain blocker from the higher-level methodology
    feature so the team can make a hard go/no-go decision on native unofficial
    TPC-DS support.
  user_impact: |
    Prevents contributors from spending time on a feature path that the shipped
    generator assets cannot currently support.
  technical_debt: |
    Converts an implicit generator assumption into an explicit toolchain project
    with testable exit criteria.
