  status: done

- id: w2
  summary: "SLICE 2a — Extract sorted_ingestion.py (sorted-ingestion capability/resolve/metadata + CTAS-sort helpers + state)."
  needs: [w1]
  status: done

- id: w3
  summary: "SLICE 2b — Extract tuning_config.py (effective config, validate_tuning_*, apply_unified_tuning, configure_for_benchmark)."
  needs: [w2]
  status: done

- id: w4
  summary: "SLICE 2c — Consolidate per-table tuning hooks into tuning.py (apply_table_tunings, supports_tuning_type, generate_tuning_clause)."
  needs: [w3]
  status: done

- id: w5
  summary: "SLICE 3a — Extract connection_lifecycle.py (test_connection, validate/require_dependencies, get_connection_from_pool,
    drop_database, handle_existing_database, check_database_exists*)."
  needs: [w4]
  status: done

- id: w10
  summary: "SLICE 3b — Extract connection_wrappers.py (DriverIsolationCapability, check_isolation_capability, PlatformAdapterConnection,
    _NoCloseProxy). Re-export from adapter.py."
  needs: [w5]
  status: done

- id: w6
  summary: "SLICE 4 — Extract data_loading.py (create_schema, load_data, external tables, _create_enhanced_* phase helpers)."
  needs: [w5]
  status: done

- id: w7
  summary: "SLICE 5 — Extract result_capture.py (plan capture, validate_loaded_data/row_counts, _collect_resource_utilization)."
  needs: [w6]
  status: pending

- id: w8
  summary: "SLICE 6 — Extract execution.py (execute_query, power/throughput/maintenance drivers; keep run_enhanced_benchmark
    on facade)."
  needs: [w7]
  status: pending

- id: w9
  summary: "Final cleanup — adapter.py contains only facade + re-exports. Verify ≤600 lines. Update docs/development/adapter-refactor-map.md."
  needs: [w8]
  status: pending

files_affected:
  modified:
  - "benchbox/platforms/base/adapter.py"
  added:
  - "benchbox/platforms/base/connection.py"
  - "benchbox/platforms/base/execution.py"
  - "benchbox/platforms/base/data_loading.py"
  - "benchbox/platforms/base/result_capture.py"
  - "benchbox/platforms/base/dialect_translation.py"
  - "benchbox/platforms/base/tuning.py"
  - "docs/development/adapter-refactor-map.md"

must_preserve:
- "ALL 73 adapter implementations import from `benchbox.platforms.base.adapter` unchanged"
- "Public protocol surface of PlatformAdapter (every @abstractmethod, every public attribute) is byte-identical"
- "Cross-platform validation suite (from quality-add-cross-platform-result-validation) passes after every slice"
- "Timing semantics (mono_time vs wall-clock) preserved exactly per timing policy"
- "All existing platform-specific tests pass after every slice (≥21,000 tests)"

approach: |
  This is a textbook vertical-slice refactor (SHARED/slicing-framework.md).
  For each slice:
    1. Move a cohesive group of methods to the new module
    2. Re-export from adapter.py: `from .connection import *` (with __all__)
    3. Run uv run -- python -m pytest -m fast -q  → must pass
    4. Run cross-platform validation suite        → must pass
    5. Commit with prefix `refactor(platforms/base):`
    6. Push, confirm CI green, then proceed to next slice

  ZERO adapter implementation file may be modified beyond import lines (and
  only if absolutely required, which it shouldn't be given re-exports).

anti_patterns:
- "DO NOT rename any public symbol — because 73 adapters depend on them — preserve names exactly even if they're imperfect"
- "DO NOT collapse multiple slices into one commit — because review and rollback need slice-level granularity — one commit
  per slice"
- "DO NOT modify adapter implementation files — because that's a different refactor — limit scope to base/"
- "DO NOT extract while adapters or tests are in flight on other branches — because merge conflicts will be brutal — coordinate
  timing"

scope_limit:
  only_modify:
  - "benchbox/platforms/base/"
  - "docs/development/adapter-refactor-map.md"
  do_not_modify:
  - "benchbox/platforms/clickhouse/"
  - "benchbox/platforms/duckdb/"
  - "benchbox/platforms/databricks/"
  - "benchbox/platforms/snowflake/"
  - "benchbox/platforms/redshift.py"
  - "(any other adapter implementation)"

verification:
- description: "Full fast test suite passes after every slice"
  command: "uv run -- python -m pytest -m fast -q"
  expected_output: "all tests pass"
- description: "Cross-platform validation passes"
  command: "uv run -- python -m pytest tests/integration/validation/test_cross_platform.py -v -m integration"
  expected_output: "PASS"
- description: "adapter.py final size ≤ 600 lines"
  command: "wc -l benchbox/platforms/base/adapter.py"
  expected_output: "≤ 600"
- description: "Platform registry still enumerates adapters after each slice"
  command: "uv run -- python -c 'from benchbox.core.platform_registry import PlatformRegistry; print(len(PlatformRegistry.get_available_platforms()))'"
  expected_output: "prints a positive platform count with no error"

