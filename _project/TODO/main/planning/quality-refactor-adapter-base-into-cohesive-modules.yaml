id: quality-refactor-adapter-base-into-cohesive-modules
title: "Refactor 5,158-line adapter base into cohesive sub-modules"
worktree: main
priority: Medium-High
status: Not Started
category: Code Quality and Technical Debt
description: |
  Quality plan Phase 3. benchbox/platforms/base/adapter.py is 5,158 lines —
  the single largest non-generated file in the repo and the foundation
  underlying all 73 adapter implementations. Its size makes review,
  navigation, and safe modification difficult; bugs here have maximum
  blast radius.

  Split by responsibility (NOT by size) into focused modules behind a
  re-export shim, so all 73 adapter implementations keep their imports
  unchanged. Vertical slices: extract one submodule per slice, run full
  cross-platform validation between slices, commit per slice.

  Proposed split:
    base/adapter.py          (Protocol/ABC only — ~400 lines)
    base/connection.py       (Connection lifecycle, retries — ~600 lines)
    base/execution.py        (Query execution, timing wrap — ~800 lines)
    base/data_loading.py     (Native + external table modes — ~900 lines)
    base/result_capture.py   (Status, errors, plans — ~600 lines)
    base/dialect_translation.py (sqlglot integration — ~700 lines)
    base/tuning.py           (Tuning hook resolution — ~500 lines)

deps:
  needs:
    - quality-add-cross-platform-result-validation
    - quality-make-timing-policy-ci-gate

work:
  - id: w1
    summary: "Map current adapter.py: list every public class/method with line ranges, callers, and proposed destination module — produce a refactor map at docs/development/adapter-refactor-map.md"
    status: pending

  - id: w2
    summary: "SLICE 1 — Extract connection.py (lifecycle + retries). Re-export from adapter.py. Run full test suite + cross-platform validation. Commit."
    needs: [w1]
    status: pending

  - id: w3
    summary: "SLICE 2 — Extract execution.py (query execution + timing). Same protocol as w2."
    needs: [w2]
    status: pending

  - id: w4
    summary: "SLICE 3 — Extract data_loading.py (native + external modes). Same protocol."
    needs: [w3]
    status: pending

  - id: w5
    summary: "SLICE 4 — Extract result_capture.py (status, errors, plans). Same protocol."
    needs: [w4]
    status: pending

  - id: w6
    summary: "SLICE 5 — Extract dialect_translation.py (sqlglot wrapping). Same protocol."
    needs: [w5]
    status: pending

  - id: w7
    summary: "SLICE 6 — Extract tuning.py (tuning resolver). Same protocol."
    needs: [w6]
    status: pending

  - id: w8
    summary: "Final cleanup — adapter.py contains only the Protocol/ABC. Verify ≤600 lines. Update docs/development/adapter-refactor-map.md as final state."
    needs: [w7]
    status: pending

files_affected:
  modified:
    - "benchbox/platforms/base/adapter.py"
  added:
    - "benchbox/platforms/base/connection.py"
    - "benchbox/platforms/base/execution.py"
    - "benchbox/platforms/base/data_loading.py"
    - "benchbox/platforms/base/result_capture.py"
    - "benchbox/platforms/base/dialect_translation.py"
    - "benchbox/platforms/base/tuning.py"
    - "docs/development/adapter-refactor-map.md"

must_preserve:
  - "ALL 73 adapter implementations import from `benchbox.platforms.base.adapter` unchanged"
  - "Public protocol surface of PlatformAdapter (every @abstractmethod, every public attribute) is byte-identical"
  - "Cross-platform validation suite (from quality-add-cross-platform-result-validation) passes after every slice"
  - "Timing semantics (mono_time vs wall-clock) preserved exactly per timing policy"
  - "All existing platform-specific tests pass after every slice (≥21,000 tests)"

approach: |
  This is a textbook vertical-slice refactor (SHARED/slicing-framework.md).
  For each slice:
    1. Move a cohesive group of methods to the new module
    2. Re-export from adapter.py: `from .connection import *` (with __all__)
    3. Run uv run -- python -m pytest -m fast -q  → must pass
    4. Run cross-platform validation suite        → must pass
    5. Commit with prefix `refactor(platforms/base):`
    6. Push, confirm CI green, then proceed to next slice

  ZERO adapter implementation file may be modified beyond import lines (and
  only if absolutely required, which it shouldn't be given re-exports).

anti_patterns:
  - "DO NOT rename any public symbol — because 73 adapters depend on them — preserve names exactly even if they're imperfect"
  - "DO NOT collapse multiple slices into one commit — because review and rollback need slice-level granularity — one commit per slice"
  - "DO NOT modify adapter implementation files — because that's a different refactor — limit scope to base/"
  - "DO NOT extract while adapters or tests are in flight on other branches — because merge conflicts will be brutal — coordinate timing"

scope_limit:
  only_modify:
    - "benchbox/platforms/base/"
    - "docs/development/adapter-refactor-map.md"
  do_not_modify:
    - "benchbox/platforms/clickhouse/"
    - "benchbox/platforms/duckdb/"
    - "benchbox/platforms/databricks/"
    - "benchbox/platforms/snowflake/"
    - "benchbox/platforms/redshift.py"
    - "(any other adapter implementation)"

verification:
  - description: "Full fast test suite passes after every slice"
    command: "uv run -- python -m pytest -m fast -q"
    expected_output: "all tests pass"
  - description: "Cross-platform validation passes"
    command: "uv run benchbox validate-results --reference duckdb --compare datafusion --benchmark tpch --scale 0.01"
    expected_output: "PASS"
  - description: "adapter.py final size ≤ 600 lines"
    command: "wc -l benchbox/platforms/base/adapter.py"
    expected_output: "≤ 600"
  - description: "All 73 adapters import successfully"
    command: "uv run -- python -c 'from benchbox.platforms import discover_all; discover_all()'"
    expected_output: "(no error)"

metadata:
  tags: ["quality-plan", "phase-3", "refactor", "high-blast-radius"]
  estimated_effort: "Medium-Large (1 week)"
  created_date: "2026-04-12"
