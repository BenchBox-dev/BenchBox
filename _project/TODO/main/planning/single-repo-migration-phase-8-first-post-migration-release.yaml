id: single-repo-migration-phase-8-first-post-migration-release
title: "Single-repo migration phase 8: cut the first release after deletion and docs cleanup"
worktree: main
priority: Medium-High
status: Completed
category: Release Tooling

deps:
  needs:
  - single-repo-migration-phase-4-test-release-with-new-flow
  - single-repo-migration-phase-6-delete-obsolete-tooling
  - single-repo-migration-phase-7-docs-cleanup

blockers:
- date: "2026-05-25"
  work: [w1, w2, w3, w4, w5, w6, w7]
  reason: |
    This release cannot start while its Phase 4 dependency is unresolved.
    Phase 4 has now been classified in PR #661 as blocked on the
    immutable `benchbox==0.3.0` wheel failing clean-install import smoke
    with `ModuleNotFoundError: No module named 'pandas'`. Phases 6 and 7
    are completed, but the failed Phase 4 release means this TODO should
    not be used as an implicit dependency bypass.
  evidence: |
    - `_project/TODO/main/active/single-repo-migration-phase-4-test-release-with-new-flow.yaml` is the explicit dependency in `deps.needs`.
    - PR #661 merged the Phase 4 blocker record to `develop`.
    - Live release evidence shows `v0.3.0` exists and PyPI lists `0.3.0`, but `release.yml` run `26160520298` concluded `failure`.
    - `uv run --isolated --no-project --with 'benchbox==0.3.0' -- python -c 'import benchbox; print(benchbox.__version__)'` fails with missing `pandas`.
  unblock: |
    Complete `release-recovery-v0-3-1`, then decide explicitly whether
    its `v0.3.1` release satisfies this Phase 8 release exercise or this
    TODO still needs a separate later post-migration release. Do not run
    a release from this TODO while Phase 4 remains blocked.

description: |
  End-to-end validation that the new flow works in the now-canonical
  single-repo state, with all old tooling deleted and all docs aligned.
  This is the first release where there is no fallback - the old
  automate_release.py is gone, and the retired private clone is no
  longer a viable working copy.

  If anything is still missing or broken in the new flow, this is where
  it surfaces. Fixes are quick because the surface area is small (a
  Makefile target, one workflow file, one changelog generator).

  Run from ~/Developer/benchbox-public (the new dev locus).

  Plan file: /Users/joe/.claude/plans/single-repo-migration.md (Phase 8).

work:
- id: w0
  summary: "Decide: is Phase 8 satisfied by the v0.3.1 recovery release, or is a separate release needed?"
  status: done
  notes: |
    release-recovery-v0-3-1 cuts and verifies v0.3.1 as the first real
    release on the new flow with no fallback — the exact exercise this phase
    was created to perform. Before any release work here, make the call
    explicit (record it in _project/decisions/single-repo-migration.md):
      - RETIRE: if the v0.3.1 recovery release already exercised the new flow
        end-to-end, move this TODO to DONE as "satisfied by v0.3.1" and skip
        w1-w7.
      - SEPARATE: if a distinct later validation release is still wanted,
        proceed to w1-w7 using v0.3.2+ (v0.3.1 is consumed by recovery).
    Mirrors the decision required by release-recovery-v0-3-1 w7; do not leave
    it implicit in the dependency graph.

    DECISION 2026-07-09 (maintainer-approved): RETIRE — Phase 8 is satisfied
    by the v0.3.1 recovery release. w1-w7 are deliberately skipped, not
    forgotten.

    Rationale: this phase exists to prove the new flow works end-to-end in the
    canonical single-repo state with no fallback. v0.3.1 did precisely that —
    `make release-cut VERSION=0.3.1` off `develop`, curation, squash-merge to
    `main` (`7550c423d`), tag, and `release.yml` run 29055922350 publishing to
    PyPI with green cross-platform install smoke — with `automate_release.py`
    already deleted (Phase 6) and docs aligned (Phase 7). Phase 4 closed the
    same day as recovery-complete. Cutting a v0.3.2 solely to re-run a passed
    exercise would add a public release with no user-facing content.

    The exercise did surface two real gaps, both recorded in
    _project/decisions/single-repo-migration.md (2026-07-09 amendment):
    `release-cut` does not perform the `-s ours` history alignment that a
    `vX.Y.Z -> main` PR needs, and the `validate-base` bootstrap failed to
    restore `auto_merge_soundness_paths`. The latter is fixed and
    regression-tested; the former remains a documented manual step.
    Recorded in _project/decisions/single-repo-migration.md, not left implicit.

- id: w1
  summary: "Confirm main is green and all migration phases are merged"
  needs: [w0]
  status: pending
  notes: |
    git checkout main && git pull
    Check the latest CI run is green: gh run list --branch main --limit 1
    Confirm Phase 6 deletions and Phase 7 docs are merged to main.

- id: w2
  summary: "Pick the next version (v0.3.2+, since v0.3.1 is the recovery release)"
  needs: [w0]
  status: pending
  notes: |
    git describe --tags --abbrev=0
    v0.3.1 is consumed by release-recovery-v0-3-1, so the next version here is
    v0.3.2 unless a new feature warrants a minor bump.

- id: w3
  summary: "Run make release VERSION=X.Y.Z"
  needs: [w1, w2]
  status: pending
  notes: |
    The release target now runs without any fallback. If it fails,
    the failure is in the new flow itself - not because of stale old
    code. Fix and retry.

- id: w4
  summary: "Review the release PR, edit changelog if needed, squash-merge"
  needs: [w3]
  status: pending
  notes: |
    By this point the changelog generator has been exercised at least
    once (Phase 4). Output should be reasonable. Spend a few minutes
    polishing the user-facing bullets.

    The release PR body must include the API surface diff section from
    `_project/specs/migration-api-surface-gate.md` before this work unit
    can be marked done:
      - New CLI commands
      - New console_script entry points
      - New public Python imports
      - New file-system conventions
      - Approval / ADR link for any non-empty entry

- id: w5
  summary: "Tag the merge commit, push, watch release.yml"
  needs: [w4]
  status: pending
  notes: |
    git checkout main && git pull
    git tag vX.Y.Z
    git push origin vX.Y.Z
    Watch release.yml run. Should complete green and publish to PyPI.

- id: w6
  summary: "Smoke test from PyPI in an isolated environment"
  needs: [w5]
  status: pending
  notes: |
    uv run --isolated --no-project --with 'benchbox==X.Y.Z' -- benchbox --help
    uv run --isolated --no-project --with 'benchbox==X.Y.Z' -- python -c 'import benchbox; print(benchbox.__version__)'
    Verify wheel contents have no maintainer scaffolding (Phase 1 excludes
    are still in effect).

- id: w7
  summary: "Declare migration complete; record retrospective notes"
  needs: [w6]
  status: pending
  notes: |
    Append a brief retrospective to _project/decisions/single-repo-migration.md:
      - What worked
      - What surprised
      - What would do differently
    Useful future-you reference if a similar migration ever comes up
    (it might not - but the discipline of writing it down is cheap).

verification:
- description: "PyPI has the new version"
  command: "uv run --isolated --with pip -- python -m pip index versions benchbox 2>&1 | head -1"
  expected_output: "shows the new version"
- description: "Wheel installs and imports cleanly from PyPI"
  command: "uv run --isolated --no-project --with 'benchbox==<version>' -- python -c 'import benchbox; print(benchbox.__version__)'"
  expected_output: "<version>"
- description: "release.yml succeeded"
  command: "gh run list --workflow=release.yml --limit 1 --json conclusion --jq '.[0].conclusion'"
  expected_output: "success"
- description: "No remaining references to deleted modules anywhere in the repo"
  command: "rg -l 'automate_release|prepare_release|benchbox-sync|benchbox\\.release\\.workflow' | wc -l"
  expected_output: "0 (or only this TODO file itself)"
- description: "Release PR includes the migration API surface diff gate"
  command: "gh pr view <release-pr> --json body --jq '.body' | grep -c '## API surface diff'"
  expected_output: ">= 1"

success_metrics:
- "The release PR body includes an API surface diff section covering new CLI commands, console_script entry points, public Python imports, file-system conventions, and approval/ADR status for every non-empty entry."

must_preserve:
- The new release flow is the ONLY release flow now. There is no
  fallback. If something breaks, fix it in the new flow.
- All previously published versions on PyPI remain installable; this
  release is purely additive.

anti_patterns:
- DO NOT resurrect deleted scripts as a "just in case" workaround -
  because the entire point of the migration was to delete them; if
  the new flow has a gap, fix the gap, do not regrow the old surface.
- DO NOT skip the smoke test (w6) - because release.yml going green
  proves the workflow ran, not that the wheel is functional; only a
  fresh pip install does.
- DO NOT release a marketing or major-feature version here unless it
  was already planned - because this release is a process validation,
  not a product event; keep the user-facing change small.

scope_limit:
  only_modify:
  - benchbox/__init__.py  # via update_version.py
  - pyproject.toml  # via update_version.py
  - CHANGELOG.md  # via generate_changelog_entry.py
  - docs/  # version markers via update_version.py
  - landing/  # version badge
  - _project/decisions/single-repo-migration.md  # retrospective notes
  notes: |
    No code changes beyond what any release would do, plus the
    retrospective in the decisions doc.
