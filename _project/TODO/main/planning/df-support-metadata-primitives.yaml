impact:
  business_value: |
    Enables metadata introspection benchmarking on DataFrame platforms. Schema
    discovery performance matters for data catalog integration, IDE autocomplete,
    and BI tool connectivity — measuring this on DataFrame platforms fills a gap
    in the current benchmark coverage.
  user_impact: |
    Users can run `benchbox run --platform polars-df --benchmark metadata_primitives`
    to measure schema introspection performance. PySpark users get catalog + lakehouse
    metadata benchmarking.

files_affected:
  modified:
    - benchbox/core/metadata_primitives/dataframe_operations.py
    - benchbox/core/metadata_primitives/benchmark.py
    - benchbox/core/benchmark_registry.py
  added:
    - tests/unit/core/metadata_primitives/test_dataframe_operations.py

must_preserve:
  - "MetadataPrimitivesBenchmark SQL execution path unchanged — all 62 SQL queries still work"
  - "Complexity testing DDL generation (wide tables, view hierarchies, large catalogs) still works for SQL mode"
  - "Platform-specific SQL variants (ClickHouse, Snowflake, BigQuery, DataFusion) unchanged"

approach: |
  This benchmark has 1821 lines of existing DataFrame operations code. The work is
  audit + integration + gap-filling, not greenfield.

  Follow the write_primitives operations manager pattern for PySpark catalog/lakehouse
  operations (stateful, sequential). For schema introspection operations that are
  independent and stateless (df.schema, df.describe()), consider using the QueryRegistry
  pattern instead — this enables the standard DataFrame runner to execute them.

  A hybrid approach may be best: QueryRegistry for Tier 1 schema introspection
  (works on all platforms), operations manager for Tier 2/3 catalog+lakehouse
  (PySpark only). The benchmark class exposes both via get_dataframe_queries()
  (returns Tier 1 registry) and get_dataframe_operations() (returns Tier 2/3 manager).

  Expect ~25-30% coverage in DataFrame mode vs SQL mode. This is acceptable because
  many SQL metadata queries (INFORMATION_SCHEMA, ACL, views) are inherently SQL
  constructs with no DataFrame equivalent.

implementation_order: |
  Implement THIRD or FOURTH (interchangeable with transaction-primitives). Both use
  the operations manager pattern (not QueryRegistry), so order between them doesn't
  matter. Implement after df-support-flightdata establishes the QueryRegistry reference
  pattern. All 5 DataFrame support TODOs modify benchmark_registry.py — sequential
  implementation avoids merge conflicts.

anti_patterns:
  - "DO NOT attempt to implement INFORMATION_SCHEMA queries in DataFrame mode — because DataFrames access metadata through native API (df.schema, spark.catalog), not SQL catalog tables — use platform-native introspection"
  - "DO NOT rewrite the existing 1821-line module from scratch — because significant work is already done — audit and complete what exists"
  - "DO NOT force 100% query parity with SQL mode — because ACL, view hierarchy, and constraint queries are inherently SQL-only — document the expected coverage gap clearly"

verification:
  - description: "Metadata Primitives reports supports_dataframe=True"
    command: "uv run -- python -c \"from benchbox.core.benchmark_registry import BENCHMARK_REGISTRY; print(BENCHMARK_REGISTRY['metadata_primitives']['supports_dataframe'])\""
    expected_output: "True"
  - description: "Operations module loads without error"
    command: "uv run -- python -c \"from benchbox.core.metadata_primitives.dataframe_operations import MetadataOperationType, MetadataOperationCategory; print(f'{len(MetadataOperationType)} ops, {len(MetadataOperationCategory)} categories')\""
    expected_output: "13 ops, 4 categories"
  - description: "Unit tests pass"
    command: "uv run -- python -m pytest tests/unit/core/metadata_primitives/ -v"
    expected_output: "all tests pass, 0 failures"

