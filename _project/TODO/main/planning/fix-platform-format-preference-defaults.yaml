id: fix-platform-format-preference-defaults
title: "Fix data format selection to always default to platform preferences"
worktree: main
priority: Critical
status: Not Started
description: |
  The manifest's format_preference field (persisted by previous --table-format
  conversion runs) takes priority over platform default preferences. This means
  if a user previously ran --table-format delta, ALL subsequent runs silently
  use delta format even without --table-format.

  Concrete failure: TPC-H SF1 on DuckDB fails because the existing manifest has
  format_preference: ["delta", "parquet", "iceberg", "tbl"] from a prior
  conversion. Delta entries are directories (is_directory: True), which the shard
  loader can't handle via the generic file path. Same root cause for
  read_primitives, write_primitives, and transaction_primitives (all share
  TPC-H SF1 data).

  Principle: BenchBox users should NEVER be surprised by the data format used
  for loading. Platform preferences should always drive default format selection.
  PLATFORM_FORMAT_PREFERENCES is already correctly configured (tbl first for
  SQL platforms, delta first for lakehouse platforms) — it's just not being used
  as the default.

  Two orthogonal changes:
  1. Always prefer platform defaults in native mode (one-line change)
  2. Thread explicit --table-format to DataSourceResolver so explicit user
     requests still override platform defaults for that run

category: Bug Fix

metadata:
  tags:
  - data-loading
  - format-selection
  - regression
  - duckdb
  estimated_effort: "Medium"
  created_date: "2026-04-07"
  source_review: "Stress test failures: duckdb/tpch, duckdb/read_primitives, duckdb/write_primitives, duckdb/transaction_primitives"

impact:
  user_impact: |
    4 benchmarks fail at SF1 on DuckDB. Users who previously ran --table-format
    conversions get silently wrong format selection on all future runs.
  maintainer_impact: |
    Clarifies the format selection contract: platform preferences are the
    default, manifest format_preference is only for recording conversion history.
  regression_risk: |
    Low. PLATFORM_FORMAT_PREFERENCES is already correctly configured for all
    36 platforms. The only behavioral change is that manifest preference no
    longer silently overrides platform defaults.

justification: |
  Users expect plain text (tbl) by default for SQL platforms. The current
  behavior violates this expectation silently. The fix aligns the code with
  the already-documented intent in format_capabilities.py comments:
  "SQL databases: text files (tbl) preferred."

deps:
  needs: []

work:
- id: w1
  summary: "Make _prefer_platform_defaults() return True for all native-mode platforms"
  status: pending
  needs: []
  description: |
    Change ManifestFileSource._prefer_platform_defaults() in data_loading.py
    (lines 252-258) to return True for ALL platforms in native mode, not just
    those in PREFER_PLATFORM_FORMAT_ORDER.

    Current:
      return normalized_mode == "native" and normalize_platform_key(platform_name) in PREFER_PLATFORM_FORMAT_ORDER

    New:
      return normalized_mode == "native"

    This makes the carefully curated PLATFORM_FORMAT_PREFERENCES table the
    actual default for all platforms. Add deprecation comment to
    PREFER_PLATFORM_FORMAT_ORDER in format_capabilities.py.
  files:
  - benchbox/platforms/base/data_loading.py
  - benchbox/platforms/base/format_capabilities.py

- id: w2
  summary: "Add requested_table_format attribute to PlatformAdapter base class"
  status: pending
  needs: []
  description: |
    Add self.requested_table_format: str | None = None to PlatformAdapter.__init__()
    in adapter.py (after line 278, alongside table_mode and external_format).
    This follows the established pattern for table_mode.
  files:
  - benchbox/platforms/base/adapter.py

- id: w3
  summary: "Set requested_table_format on adapter in the runner"
  status: pending
  needs: [w2]
  description: |
    In runner.py, after line 826 where table_format is extracted from options,
    set adapter.requested_table_format = table_format when adapter is not None
    and table_format is not None. This propagates the explicit CLI --table-format
    to the adapter so DataSourceResolver can use it.
  files:
  - benchbox/core/runner/runner.py

- id: w4
  summary: "Add requested_format parameter to ManifestFileSource and DataSourceResolver"
  status: pending
  needs: [w1]
  description: |
    In data_loading.py:
    - ManifestFileSource.__init__(): add requested_format: str | None = None
      parameter, store as self._requested_format
    - ManifestFileSource._try_manifest_v2(): before calling get_preferred_format(),
      if self._requested_format is set and exists in the table's available formats
      and in platform supported formats, use it directly as preferred_format
    - ManifestFileSource.read_format_hints(): apply same requested_format logic
    - DataSourceResolver.__init__(): add requested_format: str | None = None,
      pass through to ManifestFileSource constructor
  files:
  - benchbox/platforms/base/data_loading.py

- id: w5
  summary: "Pass requested_format from DataLoader and all DataSourceResolver call sites"
  status: pending
  needs: [w3, w4]
