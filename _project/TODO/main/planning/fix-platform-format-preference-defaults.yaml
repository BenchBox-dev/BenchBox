must_preserve:
- "PLATFORM_FORMAT_PREFERENCES table in format_capabilities.py — this is the source of truth for default format ordering per platform"
- "Conversion pipeline still updates manifest format_preference (conversion.py:236-239) — it just no longer drives default selection"
- "External table mode (table_mode='external') still uses manifest preference order (not platform defaults)"
- "--table-format CLI flag still works: explicit format requests override platform defaults for that run"
- "All 15 benchmarks that currently pass at SF1 on DuckDB continue to pass"

approach: |
  Follow the established pattern used for table_mode: attribute on adapter
  base class, set in runner, read in DataLoader/DataSourceResolver.

  The key insight is that PLATFORM_FORMAT_PREFERENCES is already correctly
  configured for all platforms. The fix is making it the actual default instead
  of a fallback behind manifest format_preference.

anti_patterns:
- "DO NOT remove delta/iceberg/parquet from DuckDB's supported formats — the platform genuinely supports them when explicitly requested"
- "DO NOT modify the conversion pipeline's manifest update logic — it correctly records what was converted, it just shouldn't drive default selection"
- "DO NOT add directory-globbing hacks to the shard loader — yesterday's failed approach tried to load delta parquet parts without delta metadata, which is semantically wrong"
- "DO NOT change manifest format_preference to always be ['tbl', ...] — lakehouse platforms (Databricks, Trino) legitimately default to delta/iceberg via their platform preferences"

verification:
- description: "DuckDB TPC-H SF1 passes (the primary failure)"
  command: "uv run benchbox run --platform duckdb --benchmark tpch --scale 1 --compression zstd:3 --quiet"
  expected_output: "Produces result JSON file, no DataLoadingError"
- description: "DuckDB primitives benchmarks pass"
  command: "uv run benchbox run --platform duckdb --benchmark read_primitives --scale 1 --compression zstd:3 --quiet && uv run benchbox run --platform duckdb --benchmark write_primitives --scale 1 --compression zstd:3 --quiet && uv run benchbox run --platform duckdb --benchmark transaction_primitives --scale 1 --compression zstd:3 --quiet"
  expected_output: "All three produce result JSON files"
- description: "Explicit --table-format still works"
  command: "uv run benchbox run --platform duckdb --benchmark tpch --scale 0.01 --table-format parquet --quiet"
  expected_output: "Produces result JSON using parquet format"
- description: "Unit tests pass"
  command: "uv run -- python -m pytest -m fast -q"
  expected_output: "All tests pass"

