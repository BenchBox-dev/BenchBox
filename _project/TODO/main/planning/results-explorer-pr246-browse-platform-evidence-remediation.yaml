    - "results-explorer/src/pages/PlatformIndex.tsx"
    - "results-explorer/src/components/QueryHeatmap.tsx"
    - "results-explorer/src/components/RankTable.tsx"
    - "results-explorer/src/components/TimeSeries.tsx"
    - "results-explorer/src/components/SparklineTable.tsx"
    - "results-explorer/src/lib/benchmarkLabels.ts"
    - "results-explorer/src/lib/format.ts"
    - "results-explorer/src/pages/__tests__/BenchmarkIndex.test.tsx"
    - "results-explorer/src/pages/__tests__/PlatformIndex.test.tsx"
    - "results-explorer/src/components/__tests__/QueryHeatmap.test.tsx"
    - "results-explorer/e2e/"
    - "_project/audits/"
  do_not_modify:
    - "results-data/"
    - "benchbox/"

success_metrics:
  - "Benchmark and platform pages show a discoverable compare affordance before row selection."
  - "Platform rows are grouped or labeled so mixed benchmark/scale cohorts are not implied to be directly comparable."
  - "Sparse platform trends either show enough data or clearly state the limitation."
  - "Star Schema/SSB naming is explicit, and `0 ms` values are replaced or explained."
  - "TPC-H, Star Schema, DuckDB, and DataFusion screenshots recapture cleanly at audited widths."

metadata:
  tags:
