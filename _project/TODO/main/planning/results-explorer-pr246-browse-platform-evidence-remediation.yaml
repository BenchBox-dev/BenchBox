id: results-explorer-pr246-browse-platform-evidence-remediation
title: "Address PR #246 benchmark and platform browse comparability findings"
worktree: main
priority: Medium-High
status: Not Started
category: Core Functionality

description: |
  PR #246 captured benchmark and platform browse issues after the route matrix
  rendered cleanly: compare selection is too implicit, platform trends have
  weak value when data is sparse, platform tables mix benchmark/scale cohorts
  without enough guardrails, and the Star Schema route displays SSB naming with
  many `0 ms` values that need explicit interpretation.

  This TODO turns those browse-page findings into a concrete plan for
  BenchmarkIndex, PlatformIndex, QueryHeatmap, trend sections, compare entry,
  and benchmark-specific data labels.

deps:
  needs:
    - results-explorer-retheme-theme-system-foundation
    - results-explorer-retheme-schema-cost-regression

context_sections:
  evidence_source: |
    PR #246: https://github.com/joeharris76/BenchBox/pull/246
    Audit artifact:
    `_project/audits/results-explorer-hierarchy-usability-data-audit-20260507.md`
  findings: |
    Covers PR #246 findings U-3, DQ-5, and DQ-7. It also reinforces DQ-2 where
    benchmark matrix cells inherit noisy badge and heatmap semantics.
  screenshots: |
    Baseline screenshots from PR #246:
    - `benchmark-tpch-390.png`
    - `benchmark-tpch-768.png`
    - `benchmark-tpch-1280.png`
    - `benchmark-tpch-1600.png`
