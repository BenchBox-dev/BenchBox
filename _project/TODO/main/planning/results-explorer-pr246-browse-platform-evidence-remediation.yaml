    - `platform-datafusion-1600.png`
  related_existing_todos: |
    Stay aligned with `results-explorer-retheme-browse-pages`,
    `results-explorer-retheme-leaderboard-semantics`, and
    `results-explorer-retheme-responsive-accessibility`.

work:
  - id: w1
    summary: "Reproduce benchmark and platform browse evidence after current data loads"
    status: pending
    notes: |
      Use the PR #246 screenshots to confirm current ownership and behavior in
      `BenchmarkIndex.tsx`, `PlatformIndex.tsx`, `QueryHeatmap.tsx`,
      `RankTable.tsx`, and trend/sparkline components. Confirm which routes
      have one-row cohorts, sparse trends, hidden compare actions, and mobile
      overflow.

  - id: w2
    summary: "Make compare selection visible before users select rows"
    needs: [w1]
    status: pending
    notes: |
      Benchmark and platform pages should show a persistent compare affordance,
      disabled state, or selected-result tray that explains the rule before the
      user knows to click checkboxes. Single selection should say that two or
      more comparable results are required. Incompatible selection should
      explain which dimension differs.

      Keep the selected-result language and route to Compare consistent across
      benchmark and platform pages.

  - id: w3
    summary: "Retheme benchmark matrix/list views around metric and badge clarity"
    needs: [w1]
    status: pending
    notes: |
      Apply the same metric/unit/direction and badge hierarchy rules as Home:
        - per-query values must keep units and timing precision clear;
        - heatmap meaning must be visible and high-contrast compatible;
        - trust and validation badges must not overpower timings;
        - missing, failed, no-run, and zero/sub-ms states must be distinct;
        - matrix/list/rank modes must have consistent labels and URL state.

  - id: w4
    summary: "Guard platform tables against invalid cross-cohort interpretation"
    needs: [w1]
    status: pending
    notes: |
      The platform table mixes benchmark families, scale factors, phases, and
      dates. Group or label rows so users do not read SSB, TPC-H SF0.01, and
      TPC-H SF0.1 as one comparable leaderboard. Primary metric labels should
      explain whether the value is a power score, geomean latency, or another
      benchmark-derived metric.

  - id: w5
    summary: "Replace low-information sparse trends with guarded sparse-data states"
    needs: [w4]
    status: pending
    notes: |
      For one or two observations, avoid large empty time-series plots that
      imply a meaningful trend. Use a compact sparse-data state, sparkline with
      explicit "limited observations" label, or hide the trend until enough
      points exist. Trend sections must name benchmark, scale, phase, metric,
      and unit.

  - id: w6
    summary: "Clarify Star Schema, SSB naming, and zero/sub-ms timing display"
    needs: [w3]
    status: pending
    notes: |
      The `/results/star_schema/` route may use `SSB` as the human-facing label,
      but the page must make the Star Schema Benchmark/SSB equivalence explicit.
      Values shown as `0 ms` need a formatting rule and visible explanation:
      use `<1 ms`, a precision footnote, or another non-misleading display if
      values are rounded below precision.

  - id: w7
    summary: "Polish browse empty, filtered-empty, and no-comparison states"
    needs: [w2, w3, w4, w5, w6]
    status: pending
    notes: |
      Ensure no-result, filtered-empty, one-platform, no-run, and not-comparable
      states are actionable. A one-row benchmark matrix or sparse platform
      history should tell users what can and cannot be inferred.

  - id: w8
    summary: "Add browse-page tests and recapture PR #246 route evidence"
    needs: [w7]
    status: pending
    notes: |
      Add targeted tests for compare affordance, benchmark labels, zero/sub-ms
      display, platform grouping, sparse trends, and mobile overflow. Recapture
      benchmark and platform screenshots at 390px, 768px, 1280px, and 1600px,
      including TPC-H list/high-contrast and Star Schema/SSB routes.

must_preserve:
  - "Benchmark route contract `/results/{benchmark}/?sf=...&phase=...`."
  - "Platform route contract `/results/p/{platform_id}/`."
  - "Existing row-selection to Compare flow and compact IDs where available."
  - "High-contrast heatmap toggle behavior."
  - "Sortable table behavior and receipt/detail links."

approach: |
  Treat benchmark and platform pages as one browse system. Reuse Home
  leaderboard semantics for heatmap, badges, units, and missing values. Add
  browse-specific guardrails for cross-benchmark, cross-scale, and sparse trend
  interpretation. Keep the pages dense, but make comparability boundaries
  visible.

anti_patterns:
  - "DO NOT hide compare entry until after users already know to select rows."
  - "DO NOT chart mixed benchmark/scale cohorts as a single comparable trend."
  - "DO NOT display rounded sub-ms values as `0 ms` without an explanation or alternative format."
  - "DO NOT make trust and validation badges visually dominate per-query timings."
  - "DO NOT make mobile users inspect large matrices without a scroll cue, sticky context, or card fallback."

verification:
  - description: "Benchmark and platform tests pass"
    command: "cd results-explorer && npm test -- src/pages/__tests__/BenchmarkIndex.test.tsx src/pages/__tests__/PlatformIndex.test.tsx src/components/__tests__/QueryHeatmap.test.tsx"
    expected_output: "all targeted tests pass"
  - description: "Benchmark/platform browser smoke passes"
    command: "cd results-explorer && npm run test:e2e:fixtures && npm run build && npx playwright test --project=chromium --grep \"benchmark|platform\""
    expected_output: "Chromium browser smoke passes for benchmark and platform routes"
  - description: "Manual PR #246 browse recapture is clean"
    command: "echo 'Manual: recapture benchmark and platform routes at 390, 768, 1280, 1600 plus TPC-H list/high-contrast and compare against PR #246 screenshots'"
    expected_output: "manual evidence shows U-3, DQ-5, and DQ-7 resolved or explicitly deferred"

