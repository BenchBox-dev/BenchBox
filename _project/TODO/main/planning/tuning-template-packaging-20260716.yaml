id: tuning-template-packaging-20260716
title: "Ship discoverable tuning templates with the installed package"
worktree: main
priority: Medium
status: Not Started
category: Core Functionality

description: |
  Deferred from tuning-docs-env-contract-fixes-20260712 (review finding N8):
  template auto-discovery is cwd-relative, so installed-package users silently
  hit the tuned-fallback path unless BENCHBOX_TUNING_PATH is set. Ship the
  examples/tunings templates as package resources and add a discovery tier
  (env path > cwd examples > packaged resources) so `--tuning tuned` works
  outside a repo checkout. Update the precedence doc written by #1178.

work:
  - id: w1
    summary: "Package templates as resources (pyproject data files or importlib.resources layout)"
    status: pending
    needs: []
  - id: w2
    summary: "Add packaged-resource tier to get_tuning_template_paths + tuning list; update docs/reference/cli/tuning.md precedence table"
    status: pending
    needs: [w1]
  - id: w3
    summary: "Tests: discovery works from a temp cwd with no repo checkout (simulated installed env)"
    status: pending
    needs: [w2]

deps:
  needs: []

must_preserve:
  - "Existing precedence for env path and cwd discovery (packaged tier is LAST)"
  - "Provenance records the packaged-template ref distinctly"

scope_limit:
  only_modify:
    - "benchbox/cli/tuning_resolver.py"
    - "pyproject.toml"
    - "benchbox/**"
    - "docs/reference/cli/tuning.md"
    - "tests/**"

verification:
  - description: "Simulated installed-env discovery test green"
    command: "uv run -- python -m pytest tests/unit/cli/test_tuning_resolution.py -q"
    expected_output: "All passing incl. packaged-tier tests"

prior_art:
  - "pyproject.toml existing package-data/include configuration - extend"
  - "benchbox/core/tuning/profiles/tpc.yaml: existing in-package YAML resource loaded at runtime - reuse loading pattern"

metadata:
  owners: ["benchbox-team"]
  tags: [tuning, packaging, discovery]
