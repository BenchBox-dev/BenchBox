    - docs/benchmarks/tsbs-devops.md
    - docs/benchmarks/nyctaxi.md
  do_not_modify:
    - benchbox/core/tpch/
    - benchbox/core/tpcds/
    - benchbox/core/ssb/
    - benchbox/core/clickbench/
    - benchbox/utils/compression_mixin.py

success_metrics:
  - "TSBS DevOps scales linearly: SF=10 produces ~9.3 GB (not ~93 GB)"
  - "FlightData and NYC Taxi log warnings when hitting their natural data ceilings"
  - "All doc scale-factor tables match actual code behavior"
  - "New test catches quadratic/non-linear scaling regressions"
  - "No regressions in existing test suite"

