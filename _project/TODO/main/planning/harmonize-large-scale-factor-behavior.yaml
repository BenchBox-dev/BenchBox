id: harmonize-large-scale-factor-behavior
title: "Harmonize scale factor behavior at large scale factors (SF 10, 100, 1000)"
worktree: main
category: "Core Functionality"
priority: Medium
status: "Not Started"
description: |
  Follow-on to harmonize-scale-factor-baselines (completed 2026-04-07). That TODO established
  SF=1 ≈ 1 GB baselines for all adjustable benchmarks. This TODO addresses three categories of
  issue discovered when reviewing how those baselines scale at SF 10, 100, and 1000:

  1. **Quadratic scaling (TSBS DevOps)** — both num_hosts and duration_days scale linearly with
     SF, so total rows grow as SF². SF=10 produces ~93 GB instead of ~9.3 GB. SF=100 produces
     ~9.2 TB instead of ~93 GB. This violates the "SF=N ≈ N GB" mental model.

  2. **Saturation ceilings (FlightData, NYC Taxi)** — these real-data benchmarks hit hard data
     ceilings and silently stop scaling. FlightData exhausts the BTS corpus (456 months) at
     SF≈11.12, capping at ~10.7 GB. NYC Taxi saturates sample_rate at 1.0 when SF≥10, capping
     at ~9.6 GB. Neither benchmark warns the user.

  3. **Documentation errors** — scale factor tables in CoffeeShop, TSBS DevOps, and NYC Taxi
     docs contain incorrect projections that don't match actual code behavior.

  The four purely-linear benchmarks (CoffeeShop, H2O.db, JoinOrder, AMPLab) scale correctly —
  no code changes needed for those, only the CoffeeShop doc fix.

context_sections:
  - name: "TSBS DevOps Quadratic Scaling"
    summary: |
      Code: benchbox/core/tsbs_devops/generator.py lines 94-95
        num_hosts = max(10, int(100 * SF))
        duration_days = max(1, int(2 * SF))
      Both dimensions multiply by SF → total rows ∝ SF².

      Projected sizes:
        SF=1:    100 hosts × 2 days     = ~0.93 GB ✓
        SF=10:   1,000 hosts × 20 days  = ~93 GB   (10× over expected)
        SF=100:  10,000 hosts × 200 days = ~9.2 TB  (100× over expected)
        SF=1000: 100,000 hosts × 2,000 days = ~916 TB

      Fix options:
        (a) Fix duration at 2 days, scale only hosts → linear in hosts
        (b) Use sqrt(SF) for each dimension so product is linear
        (c) Keep hosts primary with sub-linear days multiplier

      Option (a) is simplest and matches canonical TSBS scaling model (host count, not duration).
      The original harmonize TODO's w3 research gate asked "hosts, duration, or both?" — for
      linear scaling the answer is: scale hosts only, keep duration fixed.

      Additional low-SF note: max(10, ...) and max(1, ...) cause SF=0.01 and SF=0.1 to produce
      identical output (10 hosts, 1 day). Not critical but should be documented.

  - name: "FlightData Ceiling at SF≈11.12"
    summary: |
      Code: benchbox/core/flightdata/downloader.py lines 84-96
        months = min(max(1, round(41 * SF)), 456)
      BTS corpus spans Jan 1987 – Dec 2024 = 456 months. At SF≈11.12, all months are exhausted.

      Projected sizes:
        SF=1:    41 months  = ~1.0 GB  ✓
        SF=10:   410 months = ~9.6 GB  ✓ (near-linear)
        SF=100:  456 months = ~10.7 GB (saturated, 90% under expected)
        SF=1000: 456 months = ~10.7 GB (saturated, 99% under expected)

      No error or warning is raised. The min() silently caps.
      Fix: add warning log at minimum. Accept the ceiling — real-data benchmarks naturally cap.

  - name: "NYC Taxi Saturation at SF=10"
    summary: |
      Code: benchbox/core/nyctaxi/downloader.py (3 downloader classes)
        sample_rate = min(1.0, SF / 10)
      At SF≥10, sample_rate clamps to 1.0 — full available dataset.

      Projected sizes:
        SF=1:    sample_rate=0.1 → ~0.96 GB ✓
        SF=10:   sample_rate=1.0 → ~9.6 GB  ✓ (at ceiling)
        SF=100:  sample_rate=1.0 → ~9.6 GB  (saturated)
        SF=1000: sample_rate=1.0 → ~9.6 GB  (saturated)

      Same pattern as FlightData — silent saturation. Fix: warning log + documentation.

  - name: "Documentation Errors"
    summary: |
      CoffeeShop (docs/benchmarks/coffeeshop.md:231-237):
        Order Lines column shows ~25.5M at SF=1 (assumes 3 lines/order).
        Actual: 13.26M (1.56 lines/order per benchmark_specs.py deterministic pattern).
        All order_lines values ~2× overstated.

      TSBS DevOps (docs/benchmarks/tsbs-devops.md:354-360):
        SF=0.01/0.1: claims 2 days → actual is 1 day (max(1, ...) floor)
        SF=100: claims 1,000 hosts → actual is 10,000 hosts
        All data size projections assume linear scaling but actual is quadratic

      NYC Taxi (docs/benchmarks/nyctaxi.md:254-260):
        SF=100: claims ~960M trips / ~96 GB
        Actual: saturates at SF=10 (~9.6 GB for any SF≥10)

