id: drop-chdb-core-from-core-dependencies
title: "Drop chdb-core from [project] dependencies (transitive of optional chdb)"
worktree: main
priority: Medium
status: Not Started
category: Code Quality and Technical Debt
description: |
  `chdb-core>=26.1.0` is declared on line 49 of `pyproject.toml` as a CORE
  runtime dep. It has zero direct `import chdb_core` sites anywhere in
  `benchbox/`, `tests/`, `scripts/`, or `docs/`. `uv tree` shows that
  `chdb-core` is a dep of `chdb v4.1.6`, which itself lives in optional
  extras (`extras:all`, `extras:clickhouse-local`, `dep-group:dev`).

  Net effect today: every minimal install of benchbox pulls `chdb-core`
  (a sizeable C++-bundled package, ~tens of MB) even when the user did
  not ask for ClickHouse local mode. Moving `chdb-core` out of core deps
  trims the install footprint and keeps the optional/required boundary
  honest.

  Source for this finding: `docs/development/dependency-inventory.md` (F1),
  produced by `audit-imported-dependencies-for-elimination`.

work:
  - id: w1
    summary: "Confirm zero direct `chdb_core` imports in shipped source: `grep -rn 'chdb_core' benchbox tests scripts docs`. Document the result in the commit message."
    status: pending

  - id: w2
    summary: "Edit pyproject.toml: remove `chdb-core>=26.1.0` from `[project] dependencies`. Refresh uv.lock with `uv lock`."
    needs: [w1]
    status: pending

  - id: w3
    summary: "Run fast suite to confirm no regressions. Verify chdb-using extras still pull chdb-core transitively: `uv tree --depth 2 | grep -B1 chdb-core`."
    needs: [w2]
    status: pending

deferred:
  - summary: "Audit other transitive-only deps that may also be in core"
    reason: "Out of scope; covered by the parent audit-imported-dependencies-for-elimination."

files_affected:
  modified:
    - "pyproject.toml"
    - "uv.lock"

must_preserve:
  - "ClickHouse local extras (`extras:all`, `extras:clickhouse-local`, `dep-group:dev`) continue to install chdb (and therefore chdb-core)"
  - "No new explicit `import chdb_core` is introduced"
  - "Fast test suite green after the change"

approach: |
  Tiny, surgical change. Remove one line from pyproject.toml, refresh
  uv.lock, run fast tests. The risk is essentially zero because chdb-core
  is reachable via the existing chdb declarations in the extras that
  actually need it. If a future code path wants to import chdb_core
  directly, it should declare chdb (which transitively brings chdb-core)
  rather than depending on the leaked-into-core declaration.

anti_patterns:
  - "DO NOT add chdb to core deps to compensate — because that would defeat the optionality of ClickHouse — leave chdb in extras"
  - "DO NOT remove chdb-core from extras as well — because chdb depends on it transitively, and uv tree would re-add it; the only goal is dropping the redundant *core* declaration"

verification:
  - description: "chdb-core no longer in [project] dependencies"
    command: "uv run -- python -c \"import tomllib, pathlib; deps = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['dependencies']; assert not any('chdb-core' in d for d in deps), 'chdb-core still in core deps: ' + str([d for d in deps if 'chdb-core' in d]); print('OK: chdb-core removed from core')\""
    expected_output: "OK: chdb-core removed from core"
  - description: "Fast suite passes"
    command: "uv run -- python -m pytest -m fast -q"
    expected_output: "no failures"

scope_limit:
  only_modify:
    - "pyproject.toml"
    - "uv.lock"
  do_not_modify:
    - "benchbox/"
    - "tests/"
    - "scripts/"
    - ".github/workflows/"

deps:
  needs: []

metadata:
  tags: ["maintenance", "supply-chain", "deps", "audit-followup"]
  estimated_effort: "Small (< 1 hour)"
  created_date: "2026-04-15"

impact:
  business_value: |
    Trims minimal install footprint by removing a transitive-only dep from
    the core requirement set. Aligns the optional/required boundary with
    actual code paths.
  user_impact: |
    Faster `uv sync` / `pip install` for users who don't need ClickHouse
    local mode.
  technical_debt: |
    Closes finding F1 from the dependency-inventory audit.

success_metrics:
  - "Verification command 'OK: chdb-core removed from core' passes"
  - "Fast suite green after change"
  - "uv tree still shows chdb-core under chdb when clickhouse-local extra is installed"
