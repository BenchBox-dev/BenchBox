id: explorer-unified-chart-panel
title: "Explorer: unified <ChartPanel> driven by CHART_REGISTRY across all pages"
worktree: main
priority: High
status: Not Started
category: Core Functionality

description: |
  Phase D of the Results Explorer strategy revision
  (plans/purring-jingling-petal-ultraplan).

  The canonical CLI chart catalog lives in
  `benchbox/core/visualization/chart_types.py` (16 specs) and is
  mirrored web-side in `results-explorer/src/lib/chartRegistry.ts`.
  Every page currently hardcodes its own tab subset — BenchmarkIndex: 8,
  Compare: 6, ResultDetail: 1, Home: 0. The registry is unused at the
  call sites it was built for, which is how the drift between CLI and
  browser chart sets keeps appearing.

  Replace those ad-hoc tab clusters with a single `<ChartPanel>`
  component that walks `CHART_REGISTRY`, computes applicable chart IDs
  from `entry.requires` vs. the provided `ChartContext`, and dispatches
  to the existing chart components. Add a parity test asserting the
  web-side registry IDs are a subset of the CLI's
  `_CHART_TYPE_DISPATCH` keys so future drift trips CI.

work:
  - id: w1
    summary: "Extract applicableCharts(context) helper into chartRegistry.ts"
    status: pending
    notes: |
      The gating logic currently inlined in BenchmarkIndex.tsx:374-391
      and Compare.tsx:371-391 both walk requires[] against per-context
      capabilities. Lift into `applicableCharts(context: ChartContext)`
      in src/lib/chartRegistry.ts so the three contexts (summary /
      compare / detail) share one implementation.

  - id: w2
    summary: "Build <ChartPanel> that accepts ChartContext and renders the applicable registry slice"
    needs: [w1]
    status: pending
    notes: |
      New file: src/components/ChartPanel.tsx. Props shape per plan:
        type ChartContext =
          | { kind: "summary"; summary: BenchmarkSummary; historical?: ManifestEntry[] }
          | { kind: "compare"; results: DetailResult[]; artifact: ComparisonArtifact | null }
          | { kind: "detail";  detail: DetailResult; historical?: ManifestEntry[] };
      Renders a tab list of applicableCharts(context).map(id) and
      dispatches to the existing chart components in
      src/components/charts/. Missing capabilities hide the tab (not
      grayed-out).

  - id: w3
    summary: "CLI↔web parity test for registry IDs"
    needs: [w2]
    status: pending
    notes: |
      New file: src/__tests__/chartRegistry.parity.test.ts.
      Load the CLI dispatch keys from a JSON fixture generated by a
      small Python one-liner (or read them from the checked-in
      snapshot of _CHART_TYPE_DISPATCH). Assert
      `new Set(web_ids).isSubsetOf(cli_ids)` — web must not ship a
      chart the CLI can't produce (logical parity anchor per plan).

  - id: w4
    summary: "Migrate BenchmarkIndex.tsx to <ChartPanel>"
    needs: [w2, w3]
    status: pending
    notes: |
      Pass {kind:"summary", summary, historical}. Replace the tab
      cluster at lines 30, 370-435. One commit.

  - id: w5
    summary: "Migrate Compare.tsx to <ChartPanel>"
    needs: [w2, w3]
    status: pending
    notes: |
      Pass {kind:"compare", results, artifact}. Replace the tab
      cluster at lines 32, 448-525. One commit.

  - id: w6
    summary: "Migrate PlatformIndex.tsx to <ChartPanel>"
    needs: [w2, w3]
    status: pending
    notes: |
      Pass {kind:"summary", summary:null,
      historical:allPlatformResults} for trend + derived distribution
      views. One commit.

  - id: w7
    summary: "Migrate ResultDetail.tsx to <ChartPanel>"
    needs: [w2, w3]
    status: pending
    notes: |
      Pass {kind:"detail", detail}. Replaces the standalone
      QueryTimingChart with the full registry. Coordinate with
      explorer-result-detail-median-first (dep) so display_timings is
      the source of truth before this migration lands. One commit.

  - id: w8
    summary: "Add ChartPanel unit tests covering all three kinds"
    needs: [w4, w5, w6, w7]
    status: pending
    notes: |
      tests live in src/components/__tests__/ChartPanel.test.tsx. At
      minimum: each ChartContext kind renders the expected applicable
      tab set and hides tabs whose `requires` aren't satisfied.

files_affected:
  modified:
    - "results-explorer/src/lib/chartRegistry.ts"
    - "results-explorer/src/pages/BenchmarkIndex.tsx"
    - "results-explorer/src/pages/Compare.tsx"
    - "results-explorer/src/pages/PlatformIndex.tsx"
    - "results-explorer/src/pages/ResultDetail.tsx"
  added:
    - "results-explorer/src/components/ChartPanel.tsx"
    - "results-explorer/src/components/__tests__/ChartPanel.test.tsx"
    - "results-explorer/src/__tests__/chartRegistry.parity.test.ts"

must_preserve:
  - "All currently-visible chart tabs in BenchmarkIndex/Compare/ResultDetail continue to render for results that have the required data"
  - "chartRegistry.ts entry.requires gating semantics remain identical — centralization is mechanical"
  - "CLI _CHART_TYPE_DISPATCH behavior is untouched (web-side change only)"

approach: |
  Do w1 (extract helper) as a pure refactor first, land it, then w2
  (introduce ChartPanel alongside existing tab clusters without
  removing anything). Only after w3 parity test is green do w4-w7 page
  migrations happen — one page per commit so diffs stay reviewable.
  ResultDetail's migration (w7) must be coordinated with
  explorer-result-detail-median-first so display_timings is wired as
  the median source before ChartPanel's detail-kind context is
  consumed by chart components that used to pull from queries[].

anti_patterns:
  - "DO NOT introduce a second chart registry — because src/lib/chartRegistry.ts is already the mirror of the CLI — extend it in place"
  - "DO NOT regress visible tab sets on any page — because tab visibility drives user expectations — verify via Vitest snapshots page-by-page"
  - "DO NOT bundle multiple page migrations into one commit — because a rollback needs per-page granularity — one page per commit"

verification:
  - description: "Explorer typecheck + Vitest suites (including new parity test) stay green"
    command: "cd results-explorer && npm run typecheck && npm test"
    expected_output: "all green, chartRegistry.parity.test.ts passes"
  - description: "Every migrated page renders the expected applicable chart set"
    command: "cd results-explorer && npm run dev"
    expected_output: "BenchmarkIndex / Compare / PlatformIndex / ResultDetail all show full registry-driven tab sets; unsupported charts disappear (not grayed)"

deps:
  needs:
    - explorer-result-detail-median-first

impact:
  user_impact: |
    Every results page surfaces the full CLI chart catalog instead of
    a hand-picked subset. Users stop hitting "this chart exists in the
    CLI but not the web" surprises, and contributors adding a new
    chart type touch one registry instead of four page files.
  technical_debt: |
    Removes the per-page tab cluster duplication that has been the
    primary source of CLI↔web drift. Parity test turns future drift
    into a CI failure.

