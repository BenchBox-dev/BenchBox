id: benchmark-support-status-criteria-matrix
title: "Define auditable benchmark support-status promotion criteria"
worktree: main
priority: Medium-High
status: "Not Started"
category: Benchmark Architecture

deps:
  needs:
    - benchmark-support-status-and-discovery-policy

description: |
  PR #502 added registry-owned `support_status` for every benchmark, but the
  first assignment is still a product decision encoded as metadata rather than
  an auditable criteria matrix. The current counts are test-protected, but the
  repository does not yet explain why each benchmark is stable, beta,
  experimental, repo_only, deprecated, or document_only.

  Build a benchmark support-status criteria matrix that makes future promotions
  and demotions reviewable. The matrix should evaluate each benchmark against
  concrete product criteria: user docs coverage, result-integrity spec coverage,
  dataset/source contract, validation coverage, public discovery behavior,
  DataFrame coverage where claimed, known unsupported platform gaps, and
  maintenance commitment. The matrix should not duplicate the registry as a
  second source of truth; it should document the rationale and acceptance
  thresholds for changing the registry-owned status field.

work:
  - id: w0
    summary: "Re-read the benchmark registry, public contract map, benchmark docs, and result-integrity spec list before proposing criteria"
    status: pending
    notes: |
      Capture the checked SHA, current status counts, benchmark IDs, public IDs,
      and result-integrity spec coverage in the TODO or implementation PR body.
      Do not rely on the PR #502 review text alone; the criteria matrix must be
      based on the current tree at implementation time.

  - id: w1
    summary: "Define status-specific acceptance criteria for benchmark families"
    needs: [w0]
    status: pending
    notes: |
      Write criteria for stable, beta, experimental, repo_only, deprecated, and
      document_only. Include benchmark-specific dimensions that platform status
      did not need: official-vs-development scale factors, generated-vs-external
      datasets, canonical query coverage, result validation availability, docs
      depth, and whether DataFrame support is claimed for that benchmark.

  - id: w2
    summary: "Score every registry benchmark against the criteria and record status rationale"
    needs: [w1]
    status: pending
    notes: |
      Produce one row per benchmark with the current registry status, rationale,
      evidence pointers, and any promotion/demotion blockers. The matrix may live
      in a developer/reference doc, but the runtime status remains in
      `benchbox/core/benchmark_registry.py`.

  - id: w3
    summary: "Add tests or docs checks that keep the matrix synchronized with registry status values"
    needs: [w2]
    status: pending
    notes: |
      Add a focused test that fails when a benchmark status is added, removed, or
      changed without a corresponding criteria-matrix row or explicit rationale
      update. Prefer a simple parseable markdown table or YAML/JSON summary if
      the existing docs test patterns can check it cleanly.

  - id: w4
    summary: "Record concrete promotion candidates and blockers as deferred work, not as silent comments"
    needs: [w2]
    status: pending
    notes: |
      If the matrix shows that a beta benchmark is close to stable or that an
      experimental benchmark has unclear criteria, record follow-up TODOs or
      deferred entries with exact blockers. Do not change support_status values
      in this TODO unless the criteria evidence makes the change unambiguous.

metadata:
  tags:
    - benchmarks
    - contracts
    - support-status
    - docs-drift
  estimated_effort: "1-2 days"
  created_date: "2026-05-21"
  last_updated: "2026-05-21T00:00:00Z"

impact:
  business_value: |
    Makes benchmark support claims defensible for users who need to understand
    which benchmarks are safe for normal product use versus evaluation.
  user_impact: |
    Gives users and maintainers clear reasons for current benchmark status and
    concrete criteria for future promotions or demotions.
  technical_debt: |
    Reduces status churn risk by separating the registry source of truth from a
    reviewed rationale artifact that can be checked for drift.

files_affected:
  modified:
    - "benchbox/core/benchmark_registry.py"
    - "docs/reference/public-contracts.md"
    - "docs/benchmarks/"
    - "docs/development/result-integrity-validation.md"
    - "tests/unit/core/test_benchmark_api_contract.py"

prior_art:
  - "benchbox/core/benchmark_registry.py: BENCHMARK_METADATA support_status values - reuse as runtime source of truth."
  - "docs/reference/public-contracts.md: support taxonomy and count policy - extend criteria language rather than creating new status terms."
  - "docs/platforms/support-status.md: platform support-status rationale style - reuse the explanatory pattern, but adapt criteria to benchmark-specific evidence."
  - "docs/development/result-integrity-validation.md: integrity spec coverage list - use as one evidence dimension, not as the whole support decision."
  - "tests/unit/core/test_benchmark_api_contract.py: benchmark count and support-status drift tests - extend for matrix row coverage."

must_preserve:
  - "Runtime support_status values remain registry-owned in benchbox/core/benchmark_registry.py."
  - "Benchmark surface visibility remains independent of support_status."
  - "supports_dataframe remains a capability flag, not a proxy for support status."
  - "Current public benchmark discovery count remains unchanged unless a separate surface decision changes it."

approach: |
  Start from the current public contract taxonomy, then add benchmark-specific
  evidence dimensions. Use the registry to enumerate benchmark IDs and statuses.
  Cross-check docs and result-integrity spec coverage, then write a compact
  matrix that explains current status values without becoming a second runtime
  catalog. Add a drift check only after choosing a matrix format that can be
  parsed reliably.

anti_patterns:
  - "DO NOT use benchmark category as status rationale - because category is workload taxonomy, not product support - record criteria evidence instead."
  - "DO NOT mark a benchmark stable only because it imports or runs at smoke scale - because stable implies docs, validation, and maintenance commitment - require evidence rows."
  - "DO NOT duplicate the entire BENCHMARK_METADATA table in docs - because that creates a second catalog - document only status rationale and evidence pointers."
  - "DO NOT change DataFrame capability flags as part of criteria documentation - because capability and support status are separate contracts - file follow-up TODOs for capability gaps."

verification:
  - description: "Benchmark registry support-status contract remains green."
    command: "uv run -- python -m pytest tests/unit/core/test_benchmark_api_contract.py -q"
    expected_output: "All benchmark API contract tests pass."
  - description: "Docs validate after adding the criteria matrix."
    command: "make docs-validate"
    expected_output: "Documentation validation passes."
  - description: "TODO graph and schema remain valid if follow-up TODOs are added."
    command: "uv run --project _project/scripts -- python _project/scripts/todo_cli.py validate && uv run --project _project/scripts -- python _project/scripts/todo_cli.py check-graph"
    expected_output: "TODO validation and graph checks pass."

scope_limit:
  only_modify:
    - "benchbox/core/benchmark_registry.py"
    - "docs/reference/public-contracts.md"
    - "docs/benchmarks/"
    - "docs/development/result-integrity-validation.md"
    - "tests/unit/core/test_benchmark_api_contract.py"
    - "_project/TODO/"
    - "_project/DONE/"
  do_not_modify:
    - "benchbox/platforms/"
    - "benchbox/core/results/"
    - "benchbox/sql_compat/"

success_metrics:
  - "Every benchmark support_status has an auditable rationale row tied to concrete evidence."
  - "A status value change fails a focused check unless the criteria matrix is updated."
  - "Promotion/demotion blockers are recorded as explicit follow-up work instead of implicit reviewer memory."

open_questions:
  - "Should benchmark support criteria become a generated docs page once the registry has typed metadata?"
  - "Should result-integrity spec coverage be mandatory for stable status, or only for benchmarks whose result shape supports that validator?"
