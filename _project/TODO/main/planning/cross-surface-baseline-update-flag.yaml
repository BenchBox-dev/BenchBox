id: cross-surface-baseline-update-flag
title: "Build the --update-baseline flag/target promised by cross-surface known-divergence hygiene"
worktree: main
priority: Medium
status: Not Started
category: Developer Tooling

description: |
  Follow-up to cross-surface-known-divergence-baseline-hygiene (PR #903, DONE). The
  default-FAIL half (a known divergence that no longer reproduces fails the gate
  instead of silently passing) landed correctly. But the YAML also promised a
  maintenance affordance — a flag/Make target to drop a resolved baseline entry —
  and that was NOT built: removing a resolved known-divergence entry from the
  baseline is fully manual. Makefile was in the item's only_modify list but is
  untouched in the #903 diff. Manual baseline pruning is exactly the toil that lets
  baselines rot, so this completes the promised affordance.

prior_art:
  - ref: "benchbox/core/equivalence/cross_surface.py:1421"
    note: "The known-divergence baseline read/emit path from #903; the --update-baseline writer goes here, reusing the existing baseline file format and loader."
  - ref: "Makefile"
    note: "Existing cross-surface gate Make targets (correctness-gate region); add cross-surface-update-baseline next to them, matching their uv run invocation style."

work:
  - id: w0
    summary: "Re-confirm on fresh develop that no --update-baseline affordance exists and locate the live baseline path"
    status: pending
    needs: []
    notes: |
      grep Makefile for update-baseline (expect: absent) and locate the current
      known-divergence baseline read/emit site in cross_surface.py (line numbers in
      this TODO are origin/develop at review time and drift). Record the live
      file:line in the PR body before editing.

  - id: w1
    summary: "Add --update-baseline to the cross-surface gate CLI that drops only no-longer-diverging entries"
    status: pending
    needs: [w0]
    notes: |
      Implement the writer that rewrites the baseline file removing entries that no
      longer reproduce a divergence, preserving every still-live entry and the file's
      existing ordering/format. Must be a no-op (idempotent) on a second run when no
      entries changed. Reuse the #903 loader; do not fork the format.

  - id: w2
    summary: "Add a make cross-surface-update-baseline target"
    status: pending
    needs: [w0, w1]
    notes: |
      Wire a Makefile target invoking the flag, placed beside the existing
      correctness-gate / cross-surface targets and following their style.

  - id: w3
    summary: "Golden test: stale entry dropped, live entry preserved, second run idempotent"
    status: pending
    needs: [w1]
    notes: |
      Seed a baseline with one stale (now-resolved) and one live divergence; run
      --update-baseline; assert only the stale entry is removed and the live one is
      byte-preserved; assert a second run is a no-op. Mark fast.

must_preserve:
  - "The default gate behavior is unchanged: --update-baseline is an explicit opt-in writer, never invoked by the blocking gate run."
  - "A still-reproducing divergence is never removed; only entries that no longer diverge are dropped."

anti_patterns:
  - "DO NOT auto-prune the baseline as a side effect of the normal gate run — keep removal explicit and operator-driven."
  - "DO NOT reformat or reorder surviving baseline entries — minimal, surgical rewrite only."

verification:
  - description: "Update-baseline drops only resolved entries and is idempotent"
    command: "uv run -- python -m pytest tests/unit/equivalence/ -k update_baseline -q"
    expected_output: "stale entry removed, live entry preserved, second run no-op"

scope_limit:
  only_modify:
    - "benchbox/core/equivalence/cross_surface.py"
    - "benchbox/cli/"
    - "Makefile"
    - "tests/unit/equivalence/"
    - "tests/"

success_metrics:
  - "An operator can drop resolved known-divergence baseline entries with one command, with no manual file editing."
  - "The flag never removes a still-reproducing divergence and is idempotent."

deferred:
  - summary: "Auto-detect-and-PR stale baseline entries on a schedule."
    reason: "Out of scope; this item only provides the manual affordance. Automation is a separate hygiene item."

metadata:
  tags: [cross-surface, equivalence, baseline, developer-tooling, holistic-review-followup]
  estimated_effort: "Small"
  created_date: "2026-06-30"
  last_updated: "2026-06-30T00:00:00"
