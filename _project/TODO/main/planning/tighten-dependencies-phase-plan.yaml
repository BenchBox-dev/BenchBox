id: tighten-dependencies-phase-plan
title: "Parent: phased plan to tighten BenchBox dependency surface"
worktree: main
priority: Medium
status: Not Started
category: Code Quality and Technical Debt
description: |
  Umbrella TODO that sequences the dependency-tightening work emerging from
  the `audit-imported-dependencies-for-elimination` audit
  (`docs/development/dependency-inventory.md`).

  The audit flagged 6 of 76 packages (~8%) for elimination/relocation. Most
  of the realistic ceiling for tightening is unlocked not by individual
  flags, but by structural changes:

    - Moving internal tooling (`_project/scripts/`) out of the shipped
      manifest entirely (Phase 2).
    - Adding a CI guard so the audit doesn't decay (Phase 4).

  This parent TODO tracks all five phases. Phases 0 and 1 are already
  enumerated as standalone child TODOs (linked below). Phases 2 and 4
  are tracked as new child TODOs created alongside this parent. Phase 3
  is a deferred v0.3.0 milestone (breaking changes); recorded here for
  traceability rather than as an immediate child TODO.

  Realistic outcome after all five phases:
    - Core deps drop from 14 → 12 (−14%)
    - Dev dep group drops by ≥3 packages
    - Extras count drops ~10 (Phase 3, v0.3.0)
    - Future regressions caught by CI

work:
  - id: w1
    summary: "Phase 0 — execute the 5 ready follow-ups in order: sphinx-dev-deps → lxml → jsonschema → chdb-core → declare-undeclared. One PR each."
    status: pending
    notes: |
      Order: clean-up-unused-sphinx-dev-deps → drop-lxml-dev-dep-or-port-test-to-stdlib →
      move-jsonschema-out-of-core-runtime-deps → drop-chdb-core-from-core-dependencies →
      declare-undeclared-runtime-imports.

  - id: w2
    summary: "Phase 1 — fold into Phase 0's `declare-undeclared-runtime-imports` TODO (covers `pillow`, `ansi2html`, AI-primitives extras). No separate child TODO needed."
    status: pending
    needs: [w1]

  - id: w3
    summary: "Phase 2 — execute child TODO `extract-project-scripts-to-isolated-env` to give internal TODO/release tooling its own pyproject.toml so jsonschema/ruamel-yaml leave the main manifest entirely."
    status: pending
    needs: [w1]

  - id: w4
    summary: "Phase 4 — execute child TODO `add-dependency-audit-ci-guard` to promote the audit's AST scripts into a `make audit-deps` check wired into CI."
    status: pending
    needs: [w1, w3]

  - id: w5
    summary: "Phase 3 (deferred to v0.3.0) — deprecate plain-name extras (pandas/polars/modin/dask/pyspark/cudf) and the `databricks-connect` alias. Tracked in release plan, not as a near-term TODO."
    status: pending
    notes: |
      Cut order:
        1. Emit DeprecationWarning for the deprecated extras paths.
        2. Update extras:all and docs in lockstep.
        3. Remove aliases at v0.3.0.

deferred:
  - summary: "Migration off psycopg2-binary to psycopg3"
    reason: "Driver modernization — out of scope for an *elimination* audit. File separately when product is ready."
  - summary: "Removing `requests` declarations from extras:cloud-spark* / extras:questdb"
    reason: "Audit finding F4 documented these as intentional belt-and-suspenders; removal would silently break minimal Azure/QuestDB installs."
  - summary: "Splitting pyarrow between core and dataframe extras"
    reason: "120 import sites in core; the duplicate declaration in extras (pyproject.toml:105) is a version-floor artifact, not waste."

files_affected:
  modified: []  # this is a meta-TODO; child TODOs own the file changes

must_preserve:
  - "Each phase lands as its own reviewable PR (no megacommit)"
  - "Phase 0 children executed in the documented order to minimize blast radius"
  - "Phase 3 (breaking) is NOT executed without a v0.3.0 release window"

approach: |
  Sequencing matters more than scope. Phase 0 starts with zero-risk dead
  removals (sphinx pair, lxml) to build review confidence before touching
  `[project] dependencies` (jsonschema, chdb-core), which affect every
  install. Phase 2 then makes the jsonschema move structural rather than
  cosmetic. Phase 4 prevents regression. Phase 3 waits for a real release
  boundary.

anti_patterns:
  - "DO NOT bundle multiple phases into one PR — because reviewer surface and rollback granularity both suffer — keep one TODO per PR"
  - "DO NOT execute Phase 3 outside a v0.3.0 milestone — because plain-name extras may be pinned in user installs in the wild — needs deprecation window"
  - "DO NOT chase the remaining 70 KEEP entries looking for hidden fat — because the audit already verified each has a real owner — focus structural effort on Phase 2 and Phase 4"

verification:
  - description: "All Phase 0 child TODOs exist in planning/ or completed in DONE/"
    command: "uv run -- python -c \"import pathlib; planned = {p.stem for p in pathlib.Path('_project/TODO/main/planning').glob('*.yaml')}; done = {p.stem for p in pathlib.Path('_project/DONE/main/active').glob('*.yaml')}; required = {'clean-up-unused-sphinx-dev-deps', 'drop-lxml-dev-dep-or-port-test-to-stdlib', 'move-jsonschema-out-of-core-runtime-deps', 'drop-chdb-core-from-core-dependencies', 'declare-undeclared-runtime-imports'}; missing = required - (planned | done); assert not missing, 'Missing Phase 0 children: ' + str(missing); print('OK: all Phase 0 children present')\""
    expected_output: "OK: all Phase 0 children present"
  - description: "Phase 2 + Phase 4 child TODOs exist"
    command: "uv run -- python -c \"import pathlib; planned = {p.stem for p in pathlib.Path('_project/TODO/main/planning').glob('*.yaml')}; done = {p.stem for p in pathlib.Path('_project/DONE/main/active').glob('*.yaml')}; required = {'extract-project-scripts-to-isolated-env', 'add-dependency-audit-ci-guard'}; missing = required - (planned | done); assert not missing, 'Missing children: ' + str(missing); print('OK: Phase 2+4 children present')\""
    expected_output: "OK: Phase 2+4 children present"

scope_limit:
  only_modify:
    - "_project/TODO/main/planning/tighten-dependencies-phase-plan.yaml"
  do_not_modify:
    - "pyproject.toml"   # owned by child TODOs
    - "uv.lock"          # owned by child TODOs
    - "benchbox/"
    - "tests/"

deps:
  needs: []

metadata:
  tags: ["maintenance", "supply-chain", "deps", "audit-followup", "parent-todo"]
  estimated_effort: "Parent (phased; sum of children)"
  created_date: "2026-04-15"

impact:
  business_value: |
    Sequences the dependency-tightening work into reviewable phases,
    prevents the audit findings from decaying, and reserves breaking
    changes for a real release boundary.
  user_impact: |
    Smaller minimal install (Phase 0+2). Documented optional install paths
    (Phase 1). No silent regressions (Phase 4). Cleaner extras surface at
    v0.3.0 (Phase 3).
  technical_debt: |
    Closes the audit loop opened by `audit-imported-dependencies-for-elimination`.

success_metrics:
  - "All Phase 0 child TODOs reach Completed status"
  - "Phase 2 child TODO completes: jsonschema and ruamel-yaml absent from main pyproject.toml"
  - "Phase 4 child TODO completes: `make audit-deps` exists and runs in CI"
  - "Phase 3 scheduled against the v0.3.0 milestone (tracked in release plan, not as an open TODO)"
