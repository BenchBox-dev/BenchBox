id: tuning-drift-detection-persistence-widening-20260716
title: "Widen tuning drift-detection persistence: unique/check constraints and platform optimizations"
worktree: main
priority: Medium-High
status: Not Started
category: Core Functionality

description: |
  Residual from review finding R6, verified still present post-batch:
  TuningMetadataManager._as_benchmark_tunings (benchbox/core/tuning/metadata.py)
  persists only pk/fk flags + table tunings, dropping unique/check constraints
  and ALL platform optimizations. Reused-database drift detection is therefore
  blind to z-order/liquid/session-relevant drift. Widen the persisted record
  (schema-compatible: add typed rows or a config-hash-per-section) and the
  validate_unified_tunings comparison to cover the full UnifiedTuningConfiguration,
  feeding the richer result into the drift_check companion field added by the
  applied-ledger work.

work:
  - id: w1
    summary: "Extend the metadata persistence to cover unique/check constraints and platform optimizations"
    status: pending
    needs: []
  - id: w2
    summary: "Extend validate_unified_tunings comparison + drift_check payload; migration handling for old metadata tables"
    status: pending
    needs: [w1]
  - id: w3
    summary: "Tests: drift in a platform optimization (e.g. z_ordering toggled) is detected on reuse; old-format tables load without error"
    status: pending
    needs: [w2]

deps:
  needs: []

must_preserve:
  - "Existing benchbox_tuning_metadata tables written by older versions must still load (versioned or additive schema)"
  - "save failure remains non-fatal to the run"

scope_limit:
  only_modify:
    - "benchbox/core/tuning/metadata.py"
    - "benchbox/platforms/base/**"
    - "tests/**"

verification:
  - description: "Drift tests green incl. platform-optimization drift"
    command: "uv run -- python -m pytest tests/unit/core/tuning -q -k 'metadata or drift'"
    expected_output: "All passing"

