id: explorer-close-chart-type-coverage-gaps
title: "Close chart-type coverage gaps: percentile_ladder, cdf, rank_table, distribution_box, and 6 others"
worktree: main
priority: Medium-High
status: Not Started
category: Core Functionality

description: |
  The 2026-04-15 review found that the CLI registers **16 canonical
  chart types** in `benchbox/core/visualization/chart_types.py:17-45`,
  but the explorer implements only **6 visualization components**
  (QueryHeatmap, QueryTimingChart, GroupedQueryChart,
  NormalizedSpeedupChart, DivergingBarChart, MetaLeaderboard) —
  and only 3-4 of those have CLI counterparts that compute the same
  values. **10 CLI chart types have no explorer equivalent.**

  Missing chart types and their importance for benchmark credibility:

    | Chart                | Why it matters                                                   |
    |----------------------|------------------------------------------------------------------|
    | `percentile_ladder`  | Tail-latency P50/P90/P95/P99 — central to fair benchmark claims  |
    | `cdf_chart`          | Distribution shape — exposes "fast median, slow tail" patterns   |
    | `rank_table`         | Compact per-query ranking — denser than heatmap for many queries |
    | `distribution_box`   | Box-plot of per-query latencies — shows variance/outliers        |
    | `query_histogram`    | Per-query latency distribution                                   |
    | `time_series`        | Trend over runs — regression detection                           |
    | `cost_scatter`       | Cost vs performance — central to cloud-warehouse comparisons     |
    | `power_bar`          | Dedicated TPC Power@Size visual                                  |
    | `sparkline_table`    | Compact metrics summary with embedded micro-charts               |
    | `stacked_phase`      | Phase breakdown (load/warmup/power/throughput)                   |

  This item ports each missing chart type to the explorer in priority
  order. Every new chart consumes pipeline-emitted data
  (per `explorer-emit-comparison-artifact-from-pipeline` — extending
  the artifact emission as needed) and ships with a parity fixture
  (per `explorer-establish-cli-explorer-parity-tests`) so the math
  is verified against the canonical Python implementation from day one.

  Out of scope: building entirely NEW chart types that don't exist in
  the CLI either. Those should be evaluated and added to both sides
  through the canonical chart_types.py registry first.

work:
  - id: w1
    summary: "Tier-1 (tail-latency credibility): port `percentile_ladder` and `cdf_chart`"
    needs: []
    status: pending
    notes: |
      These two are the highest-impact missing charts because they
      directly answer the most common credibility question for a
      benchmark result: "what does the slow tail look like?"

      For each:
        1. Read the CLI implementation (textcharts package +
           result_plotter renderer wiring) to understand inputs
           and reduction logic.
        2. Add corresponding Python helper (or extend transformer.py)
           that emits per-query percentile arrays (`p50, p90, p95, p99`)
           into the BenchmarkSummary or DetailResult artifact.
        3. Add fixtures via the parity infrastructure.
        4. Build the Preact component (SVG) consuming the artifact.
        5. Wire into ResultDetail page (per-result percentiles) and
           Compare page (cross-result percentile ladder).
        6. Vitest tests + parity assertions.

      Suggested placement:
        - PercentileLadder: ResultDetail.tsx side panel + Compare.tsx
          tab alongside Speedup/Diverging/Grouped
        - CDFChart: Compare.tsx tab; per-result detail page

  - id: w2
    summary: "Tier-2 (compactness for large benchmarks): port `rank_table` and `distribution_box`"
    needs: []
    status: pending
    notes: |
      Rank table: per-query ranks (1..N) across platforms, optionally
      with arrow indicators (↑↓) showing rank changes. Useful for
      TPC-DS (99 queries) where the heatmap becomes unwieldy.

      Distribution box: per-query box plot showing min/Q1/median/Q3/max
      across all measurement runs (not just the median display value).
      Reveals platforms with high variance even if median looks good.

      Both consume data already in DetailResult.queries (raw per-sample
      timings) — minimal pipeline changes needed; just add reduction
      helpers to transformer.py and fixtures.

      Add as alternate views in Compare.tsx and on a new page or section
      "Per-query distribution" in ResultDetail.tsx.

  - id: w3
    summary: "Tier-3 (specialized): port `query_histogram`, `power_bar`, `stacked_phase`"
    needs: [w1, w2]
    status: pending
    notes: |
      query_histogram: per-query timing histogram across all platforms
        (the CLI auto-splits when query count > 33 — match that behavior).

      power_bar: dedicated visualization for TPC Power@Size — bigger=better
        (currently buried in Compare summary cards as a small dl row).
        Make it a first-class chart on BenchmarkIndex when power_score
        is the primary metric.

      stacked_phase: phase breakdown (load/warmup/power/throughput) as
        stacked bars per platform. Useful for TPC-H/TPC-DS where load
        and throughput phases matter for comparison fairness.

      All three are smaller individual ports — group them together.

  - id: w4
    summary: "Tier-4 (cross-cutting analytics): port `time_series`, `cost_scatter`, `sparkline_table`"
    needs: [w3]
    status: pending
    notes: |
      time_series: trend chart of geomean_ms / power_score over run_date,
        per platform. Surfaces regressions across releases. Lives on
        PlatformIndex.tsx (per-platform history) and a new
        BenchmarkIndex tab "Trends".

      cost_scatter: cost_usd vs power_score (or geomean_ms) — central
        for cloud DW comparisons (Snowflake/BigQuery/Athena/Databricks).
        Lives on BenchmarkIndex when cost_usd is populated for >0 results.
        Hide chart entirely when no cost data exists (don't render an
        empty axis).

      sparkline_table: compact metrics table with embedded micro-charts
        (one mini per-query trend per row). Compact alternative to the
        heatmap for the home page or platform overview.

  - id: w5
    summary: "Add an explorer chart-type registry mirroring `chart_types.py` and document the parity contract"
    needs: [w1, w2, w3, w4]
    status: pending
    notes: |
      Final integration step:
        - Create `results-explorer/src/lib/chartRegistry.ts` mirroring
          the canonical 16-entry list from
          benchbox/core/visualization/chart_types.py.
        - Each registry entry: `{ id, title, description, requires:
          DataRequirements, component: ComponentRef, cli_equivalent: str }`.
        - Add a meta-test that fails if the explorer registry diverges
          from the CLI registry (e.g. a new chart type added on one
          side without the other).
        - Update `docs/visualization-parity.md` (created by
          `explorer-establish-cli-explorer-parity-tests`) with the
          full chart-type matrix and the policy: "New chart types are
          added to chart_types.py first; explorer follows."

deferred:
  - summary: "Build entirely NEW chart types that don't exist in CLI either"
    reason: "Out of scope for this item. Those should be added to chart_types.py registry first via a separate planning round."
  - summary: "WebGL/Canvas rendering for high-density visualizations (e.g. histogram with thousands of points)"
    reason: "Premature optimization — SVG handles realistic data sizes; revisit if profiling shows pain points."
  - summary: "User-saveable chart configurations / dashboards"
    reason: "Product feature, not a coverage gap. Address after the chart catalog is complete."
  - summary: "Interactive drilldowns (click chart bar to filter table)"
    reason: "Cross-cutting UX work; better tackled as a focused interactivity item once all charts exist."

