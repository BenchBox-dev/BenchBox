id: extract-or-prune-publishing-subsystem
title: "Decide whether to extract, retain, or prune the generic publishing and permalink subsystem"
worktree: main
priority: Medium
status: Not Started
category: Architecture
description: |
  BenchBox includes a generic artifact-publishing and permalink subsystem under
  `benchbox/core/publishing`. It appears more general than the rest of the
  benchmark engine, and it is not obvious that the main runtime depends on it.

  This item plans a usage audit and decision process to determine whether the
  subsystem should remain internal, be extracted as a reusable library, or be
  removed as dead or unowned code.

metadata:
  tags:
  - architecture
  - publishing
  - cleanup
  - scope-review
  estimated_effort: "Small to Medium"
  created_date: "2026-03-12"
  source_review: "Orthogonal functionality review finding #6"

future_state:
  readme: "docs/design/future-state/extract-or-prune-publishing-subsystem/README.md"
  proposed_library_name: "artifactlinks"

impact:
  user_impact: |
    Likely low if the subsystem is truly unused by the main runtime. If it is
    user-facing anywhere, the main concern is avoiding regressions in export or
    publishing flows that users rely on.
  maintainer_impact: |
    Clarifies ownership of a currently ambiguous subsystem. The biggest value is
    eliminating maintenance burden for code that may not justify its footprint.
  packaging_impact: |
    Low to moderate. If extracted, there is new package overhead. If pruned,
    package size and complexity may shrink slightly.
  regression_risk: |
    Low to moderate, but only if the usage audit is accurate. The biggest risk
    is removing or moving code that is invoked indirectly through export paths or
    internal tooling.

justification: |
  Orphaned generic subsystems are a maintenance tax even when they are not
  actively breaking anything. This one should either earn its place through a
  clear owner and use case or leave the core product boundary.

cost_benefit_analysis:
  expected_benefits: |
    Medium. If the subsystem is unused, pruning it removes dead weight with
    relatively low risk. If it is genuinely reusable, extracting it can reduce
    BenchBox core sprawl and create a cleaner ownership boundary.
  expected_costs: |
    Low to medium. The audit itself is cheap, but extraction would add package
    and migration work. The main cost is the time needed to validate that no
    export or result-publication workflow depends on the current modules.
  recommendation: |
    Audit first and bias toward pruning if there are no active users. Do not
    extract purely for aesthetic reasons. Extraction is only justified if there
    is evidence of reuse or a near-term roadmap for it.

files_affected:
  modified:
  - "benchbox/core/publishing/"
  - "benchbox/core/results/exporter.py"
  - "benchbox/core/results/models.py"
  - "benchbox/core/results/filenames.py"
  - "benchbox/cli/commands/results.py"
  - "tests/unit/core/publishing/"
  - "tests/unit/cli/commands/test_results.py"
  - "tests/unit/test_results_exporter.py"
  - "tests/unit/core/results/test_exporter_timing_contract.py"
  - "tests/unit/core/results/test_serialization_limits.py"
  - "tests/unit/cli/test_run_export_consistency.py"
  - "docs/architecture/"
  - "pyproject.toml"
  added:
  - "_project/TODO/main/planning/"

work:
- id: w1
  summary: "Audit all runtime, CLI, test, and docs references to the publishing subsystem"
  status: pending
  notes: |
    Confirm whether the subsystem is active, latent, or effectively dead. Pay
    special attention to result export and artifact-generation paths.

- id: w2
  summary: "Review recent git history and roadmap notes to determine ownership and intended future use"
  needs: [w1]
  status: pending

- id: w3
  summary: "Map current usage into supported-user, internal-only, or unused cases and capture the evidence"
  needs: [w2]
  status: pending
  notes: |
    Make the eventual disposition evidence-based by separating documented user
    workflows from repo-internal helpers and unused code paths.

- id: w4
  summary: "Prepare a decision memo choosing retain-internal, extract, or prune"
  needs: [w3]
  status: pending
  notes: |
    The memo should include evidence of use, affected commands, migration risk,
    and the expected maintenance burden for each path.

- id: w5
  summary: "Create the selected follow-up implementation artifact and record the rejected alternatives explicitly"
  needs: [w4]
  status: pending
  notes: |
    If the decision is prune or extract, create a dedicated implementation TODO
    with file scope and verification. If the decision is retain-internal,
    publish an ownership note and review trigger instead of starting extraction.

- id: w6
  summary: "Validate that results export, artifact handling, and related documentation still match the chosen path"
  needs: [w5]
  status: pending

must_preserve:
- "Current result export behavior and artifact-generation flows that are part of supported user workflows"
- "Result schema compatibility unless an explicit deprecation path is approved"
- "A complete usage audit before any deletion or extraction decision is implemented"

approach: |
  Use the lowest-cost path consistent with the evidence. If the subsystem is not
  serving active users, prune it rather than extracting it. If it is serving a
  real need, define the narrowest viable boundary and avoid turning an internal
  helper into a package without a clear owner.

anti_patterns:
- "DO NOT extract the subsystem just because it looks generic, because package count should grow only when ownership and reuse justify it"
- "DO NOT delete it based on impression alone, because indirect export or reporting paths may still rely on it"
- "DO NOT couple the decision to unrelated result-schema changes, because that obscures whether the cleanup itself was safe"

verification:
- description: "Publishing subsystem tests and adjacent result-export coverage still pass after the chosen change"
  command: "uv run -- python -m pytest tests/unit/core/publishing/test_publishing_config.py tests/unit/core/publishing/test_permalink.py tests/unit/core/publishing/test_publisher.py tests/unit/core/publishing/test_artifacts.py tests/unit/cli/commands/test_results.py tests/unit/test_results_exporter.py -q"
  expected_output: "All tests pass"
- description: "Result-export timing and serialization contracts remain stable"
  command: "uv run -- python -m pytest tests/unit/core/results/test_exporter_timing_contract.py tests/unit/core/results/test_serialization_limits.py tests/unit/cli/test_run_export_consistency.py -q"
  expected_output: "All tests pass"

scope_limit:
  only_modify:
  - "benchbox/core/publishing/"
  - "benchbox/core/results/exporter.py"
  - "benchbox/core/results/models.py"
  - "benchbox/core/results/filenames.py"
  - "benchbox/cli/commands/results.py"
  - "tests/unit/core/publishing/"
  - "tests/unit/core/results/test_exporter_timing_contract.py"
  - "tests/unit/core/results/test_serialization_limits.py"
  - "tests/unit/cli/commands/test_results.py"
  - "tests/unit/cli/test_run_export_consistency.py"
  - "tests/unit/test_results_exporter.py"
  - "docs/architecture/"
  - "_project/TODO/main/planning/"
  - "pyproject.toml"
  do_not_touch:
  - "Benchmark execution logic"
  - "Platform adapters"
  - "Unrelated visualization or monitoring code"

open_questions:
- "Does any supported CLI command rely on permalinks or publisher configuration today?"
- "Is there a realistic second consumer for this subsystem outside BenchBox?"
- "Would a targeted prune unlock simpler result-export architecture elsewhere in the repo?"
