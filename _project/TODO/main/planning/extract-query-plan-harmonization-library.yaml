id: extract-query-plan-harmonization-library
title: "Extract query-plan normalization, diffing, and rendering into a reusable library boundary"
worktree: main
priority: High
status: Not Started
category: Architecture
description: |
  BenchBox contains a substantial query-plan subsystem covering normalized plan
  models, parser abstractions, comparison, visualization, and history tracking.
  Much of that logic is vendor-neutral and would make sense as a standalone
  query-plan library with BenchBox-specific capture adapters on top.

  This item plans an extraction that preserves current plan fingerprints,
  comparison semantics, CLI commands, and platform integrations while reducing
  how much generic plan-analysis logic lives inside BenchBox core.

metadata:
  tags:
  - architecture
  - extraction
  - query-plans
  - scope-review
  estimated_effort: "Large"
  created_date: "2026-03-12"
  source_review: "Orthogonal functionality review finding #4"

impact:
  user_impact: |
    If done correctly, users will keep the same compare-plans, show-plan, and
    history capabilities. The main user-facing change would be improved clarity
    around what BenchBox owns versus what is generic plan-analysis infrastructure.
  maintainer_impact: |
    Maintainers will need to manage a clear division between capture-time
    BenchBox adapters and reusable plan-analysis code. That is valuable, but it
    adds packaging and version-coordination work.
  packaging_impact: |
    A new standalone package or internal library boundary would need its own
    tests, docs, and release discipline. Compatibility shims may be necessary
    for any current imports.
  regression_risk: |
    High. Plan normalization and fingerprint stability are easy to break with
    small code moves. Any drift would invalidate historical comparisons or make
    platform-specific tests fail in non-obvious ways.

justification: |
  The query-plan subsystem is large enough and general enough to stand on its
  own. Extracting it would reduce BenchBox core complexity and create a reusable
  asset for plan inspection outside benchmarking. It is a strong opportunity,
  but only if semantic stability is treated as a hard requirement.

cost_benefit_analysis:
  expected_benefits: |
    High strategic value. A reusable plan-analysis library could support other
    tools, and BenchBox would become easier to reason about because platform
    capture code would no longer live beside generic comparison and rendering
    logic.
  expected_costs: |
    High. Query-plan semantics are subtle, and regression detection requires a
    broad fixture and parser test matrix. Packaging and documentation work are
    also non-trivial.
  recommendation: |
    Proceed in phases. First lock down plan-model and fingerprint contracts with
    tests. Then establish an internal library boundary. Publish externally only
    after historical result parity is proven.

files_affected:
  modified:
  - "benchbox/core/query_plans/"
  - "benchbox/core/results/query_plan_models.py"
  - "benchbox/core/results/"
  - "benchbox/cli/commands/"
  - "benchbox/mcp/"
  - "benchbox/platforms/"
  - "tests/unit/core/query_plans/"
  - "tests/unit/core/results/"
  - "tests/unit/cli/commands/"
  - "tests/unit/platforms/"
  - "pyproject.toml"
  - "docs/"
  added:
  - "benchbox_query_plans/"
  - "docs/architecture/"

work:
- id: w1
  summary: "Inventory the full query-plan surface from capture through normalization, storage, comparison, and rendering"
  status: pending
  notes: |
    Include CLI commands, result serialization, parser registries, and any MCP
    or visualization paths that consume normalized plans.

- id: w2
  summary: "Define the generic library boundary and separate it from BenchBox-specific capture adapters"
  needs: [w1]
  status: pending
  notes: |
    Generic components should include plan models, parser interfaces, diffing,
    history, and rendering. Capture and platform wiring likely remain local.

- id: w3
  summary: "Lock down fingerprint, serialization, and comparison contracts with explicit parity tests"
  needs: [w2]
  status: pending

- id: w4
  summary: "Prototype an internal package boundary and route BenchBox through it without changing user-facing behavior"
  needs: [w3]
  status: pending

- id: w5
  summary: "Validate platform parser coverage and historical result compatibility against the proposed boundary"
  needs: [w4]
  status: pending

- id: w6
  summary: "Prepare compatibility wrappers, migration notes, and ownership docs"
  needs: [w5]
  status: pending

- id: w7
  summary: "Complete extraction only after parity is demonstrated for CLI, parser, and serialization paths"
  needs: [w6]
  status: pending

must_preserve:
- "Normalized query-plan semantics and fingerprint behavior used by history and comparison features"
- "Current CLI and MCP plan-inspection workflows unless an explicit migration plan is documented"
- "Platform-specific capture logic stays attached to BenchBox unless and until a generic abstraction is proven"

approach: |
  Treat semantic stability as the primary requirement. Start by clarifying which
  parts are generic library code and which parts are BenchBox integration. Use
  an internal-first extraction and preserve exact serialization behavior before
  considering a public package.

anti_patterns:
- "DO NOT extract platform capture code just because it lives near generic plan logic, because those dependencies are BenchBox-specific and likely to reintroduce coupling"
- "DO NOT change normalized plan models or fingerprint algorithms during the move, because historical comparisons depend on their stability"
- "DO NOT rely on manual spot checks alone, because query-plan regressions require fixture-based parity coverage"

verification:
- description: "Core query-plan model, parser, comparison, and serialization tests continue to pass"
  command: "uv run -- python -m pytest tests/unit/core/query_plans tests/unit/core/results/test_query_plan_models.py tests/unit/core/results/test_query_plan_serialization.py -q"
  expected_output: "All tests pass"
- description: "CLI and platform plan-capture integrations retain current behavior"
  command: "uv run -- python -m pytest tests/unit/cli/commands/test_compare_plans_coverage.py tests/unit/cli/commands/test_plan_history_coverage.py tests/unit/cli/commands/test_show_plan_coverage.py tests/unit/platforms/test_duckdb_plan_capture.py -q"
  expected_output: "All tests pass"

scope_limit:
  only_modify:
  - "benchbox/core/query_plans/"
  - "benchbox/core/results/query_plan_models.py"
  - "benchbox/core/results/"
  - "benchbox/cli/commands/"
  - "benchbox/mcp/"
  - "benchbox/platforms/"
  - "tests/unit/core/query_plans/"
  - "tests/unit/core/results/"
  - "tests/unit/cli/commands/"
  - "tests/unit/platforms/"
  - "pyproject.toml"
  - "docs/"
  do_not_touch:
  - "Benchmark query text or SQL generation logic"
  - "Non-plan result schemas"
  - "Platform execution logic unrelated to plan capture hooks"

open_questions:
- "Should plan rendering stay with the plan library or remain in BenchBox to avoid duplicating visualization dependencies?"
- "Which parsers are generic enough to move immediately, and which are too coupled to current platform result shapes?"
- "Is there enough non-BenchBox demand to justify a public package rather than an internal library boundary?"
