id: results-explorer-pr246-home-leaderboard-evidence-remediation
title: "Address PR #246 Home leaderboard hierarchy and metric-semantics findings"
worktree: main
priority: High
status: Not Started
category: Core Functionality

description: |
  PR #246 added a focused Results Explorer audit for visual hierarchy,
  usability, and data-presentation quality. The Home leaderboard remains the
  public first read of BenchBox results, and the audit found that its focus
  state, metric context, filter/control hierarchy, heatmap, links, and badge
  treatments compete in ways that can mislead users.

  This TODO turns the PR #246 evidence into an implementation plan for Home and
  MetaLeaderboard. It should be executed with the existing retheme foundation,
  but the acceptance criteria here are deliberately screenshot-bound: the
  implementation is not done until the named PR #246 screenshots can be
  recaptured without the observed issues.

deps:
  needs:
    - results-explorer-retheme-theme-system-foundation

context_sections:
  evidence_source: |
    PR #246: https://github.com/joeharris76/BenchBox/pull/246
    Audit artifact:
    `_project/audits/results-explorer-hierarchy-usability-data-audit-20260507.md`
  findings: |
    Covers PR #246 findings VH-1, VH-2, DQ-1, and DQ-2.
  screenshots: |
    Baseline screenshots from PR #246:
    - `browser-use-home-live-fullpage.png`
    - `home-390.png`
    - `home-768.png`
    - `home-1280.png`
    - `home-1600.png`
    - `home-speedup-mobile-390.png`
    - `home-speedup-1280.png`
    - `benchmark-tpch-1280.png`
    - `benchmark-tpch-high-contrast-1280.png`
  related_existing_todos: |
    This item should stay aligned with
    `results-explorer-retheme-leaderboard-semantics`,
    `results-explorer-retheme-responsive-accessibility`, and
    `results-explorer-retheme-theme-system-foundation`. Do not create a second
    visual language for leaderboard controls or badges.

work:
  - id: w1
    summary: "Reproduce and annotate the PR #246 Home evidence before editing"
    status: pending
    notes: |
      Open the PR #246 audit and inspect the named screenshots at 390px, 768px,
      1280px, and 1600px. Record the current DOM/CSS owners for the observed
      Home issues:
        - initial active-looking blue ring on the first leaderboard cell;
        - duplicated dark filter/summary surfaces;
        - visually heavy `Avg rank over covered cohorts` control;
        - missing visible metric/unit/direction labels in cohort headers;
        - speedup ratios below `1.00x` without visible meaning;
        - trust and validation badges using similar green semantics inside
          quantitative cells.

  - id: w2
    summary: "Separate roving focus, keyboard focus, selected state, and analytical emphasis"
    needs: [w1]
    status: pending
    notes: |
      Update `MetaLeaderboard.tsx` so the first cell does not show a visible
      focus ring on initial render. Internal roving-grid coordinates may still
      exist, but the ring must be visible only after true keyboard focus enters
      the grid. Active mode, hovered cells, selected/clicked cells, best values,
      and focus-visible must have different visual treatments.

      Acceptance evidence:
      - recaptured `home-390.png` and `home-1280.png` equivalents show no
        initial blue ring before user input;
      - keyboard Tab/arrow traversal still exposes a clear focus-visible state;
      - screen-reader/ARIA grid behavior is not removed to fix styling.

  - id: w3
    summary: "Add visible metric, unit, phase, and direction labels to cohort headers"
    needs: [w2]
    status: pending
    notes: |
      Every cohort header must make the comparison contract visible without
      relying on title attributes. Include compact labels for benchmark, scale,
      phase, metric family, unit, and direction. Examples:
        - TPC-H SF0.01, power score, higher is better;
        - geomean latency, ms, lower is faster;
        - speedup, ratio, above `1.00x` is faster and below `1.00x` is worse.

      Keep labels short enough for 390px and 768px layouts. If the header
      becomes too dense, use an adjacent visible legend rather than hiding the
      meaning in tooltips.

  - id: w4
    summary: "Rebalance Home mode, sort, cohort, and filter controls"
    needs: [w3]
    status: pending
    notes: |
      Consolidate the active summary and cohort/filter selector into a single
      analytical toolbar. The toolbar should make the primary page action
      obvious: browse leaderboard, change metric mode, narrow cohorts, then
      inspect or compare results. The sort control should not visually dominate
      mode selection, especially on mobile.

      Preserve URL contracts for `?mode=ranks` and `?mode=speedup`.

  - id: w5
    summary: "Redesign quantitative cells so values outrank heat, links, and badges"
    needs: [w3]
    status: pending
    notes: |
      Define a cell hierarchy where the numeric value is the primary read,
      heatmap color is secondary, and trust/validation/source metadata is
      tertiary. Trust, validation, tuning, missing data, warning, and focus
      states must not all use the same green or blue visual semantics.

      Include a visible legend that explains heatmap meaning, missing runs,
      coverage, validation/trust glyphs, and speedup values below `1.00x`.

  - id: w6
    summary: "Add focused Home and MetaLeaderboard regression coverage"
    needs: [w2, w3, w4, w5]
    status: pending
    notes: |
      Add or update unit/a11y/e2e coverage for:
        - no initial visual focus ring before user input;
        - keyboard focus-visible appears after Tab/arrow entry;
        - cohort header labels include metric, unit, and direction text;
        - speedup legend explains below-`1.00x` values;
        - high-contrast mode still provides non-color meaning;
        - missing data remains distinct from zero or slow values.

  - id: w7
    summary: "Recapture PR #246 Home evidence and update the remediation notes"
    needs: [w6]
    status: pending
    notes: |
      Capture Home screenshots at 390px, 768px, 1280px, and 1600px in times,
      ranks, and speedup modes. Store evidence under `_project/audits/` and
      explicitly compare against the PR #246 filenames listed in this TODO.
      Any remaining Major issue must be fixed or represented by a follow-up
      TODO before this item is completed.

must_preserve:
  - "Existing `/results/` route and Home URL mode contract."
  - "Clickable cohort headers and receipt/result links."
  - "Keyboard navigation for the leaderboard grid."
  - "High-contrast/reduced-color path for leaderboard heatmaps."
  - "Coverage semantics: missing cohorts are not scored and remain visible separately."

approach: |
  Start from the existing Home and MetaLeaderboard tests, then make the smallest
  design-system-aligned changes that remove the PR #246 interpretation risks.
  Use shared tokens/primitives from the retheme foundation. Keep the dense
  data table scannable; do not trade metric clarity for a marketing-style
  layout.

anti_patterns:
  - "DO NOT hide metric direction in title attributes only; use visible text or a visible legend."
  - "DO NOT use focus rings to indicate best value, active mode, selected data, hover, or loaded state."
  - "DO NOT make trust, validation, computed, warning, and success states all green pills."
  - "DO NOT make missing runs look like zero-duration or slow-duration runs."
  - "DO NOT remove keyboard grid navigation while fixing focus styling."

verification:
  - description: "Home and MetaLeaderboard unit/a11y tests pass"
    command: "cd results-explorer && npm test -- src/components/__tests__/MetaLeaderboard.test.tsx src/components/__tests__/MetaLeaderboard.a11y.test.tsx src/pages/__tests__/Home.test.tsx"
    expected_output: "all targeted tests pass"
  - description: "Home browser smoke covers all modes"
    command: "cd results-explorer && npm run test:e2e:fixtures && npm run build && npx playwright test --project=chromium --grep home"
    expected_output: "Chromium Home smoke passes for times, ranks, and speedup modes"
  - description: "Manual PR #246 evidence recapture is clean"
    command: "echo 'Manual: recapture /results/ at 390, 768, 1280, 1600 in times/ranks/speedup and compare against PR #246 Home screenshots'"
    expected_output: "manual evidence shows VH-1, VH-2, DQ-1, and DQ-2 resolved or explicitly deferred"

scope_limit:
  only_modify:
    - "results-explorer/src/components/MetaLeaderboard.tsx"
    - "results-explorer/src/components/TrustBadge.tsx"
    - "results-explorer/src/components/TuningBadge.tsx"
    - "results-explorer/src/pages/Home.tsx"
    - "results-explorer/src/lib/chartMath.ts"
    - "results-explorer/src/components/__tests__/MetaLeaderboard.test.tsx"
    - "results-explorer/src/components/__tests__/MetaLeaderboard.a11y.test.tsx"
    - "results-explorer/src/pages/__tests__/Home.test.tsx"
    - "results-explorer/e2e/"
    - "_project/audits/"
  do_not_modify:
    - "results-data/"
    - "benchbox/"

success_metrics:
  - "No visible initial focus/selection ring in Home screenshots before keyboard input."
  - "Every Home cohort header or adjacent legend visibly communicates metric, unit, and direction."
  - "Speedup mode visibly explains that values below 1.00x are worse."
  - "Trust and validation badges are visually distinct and subordinate to numeric values."
  - "390px, 768px, 1280px, and 1600px Home captures remain scannable."

metadata:
  tags:
    - results-explorer
    - pr246
    - leaderboard
    - visual-hierarchy
    - data-presentation
  estimated_effort: "Medium (~2 days)"
  created_date: "2026-05-07"

impact:
  business_value: |
    Makes the public leaderboard credible as the first Results Explorer product
    surface.
  user_impact: |
    Users can understand what each leaderboard value means and which platform
    is actually better without guessing from color or badge noise.
  technical_debt: |
    Clarifies the semantic contract between leaderboard data, visual states,
    URL modes, and accessibility behavior.
