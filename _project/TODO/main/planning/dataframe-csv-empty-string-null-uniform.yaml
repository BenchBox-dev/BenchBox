id: dataframe-csv-empty-string-null-uniform
title: "Normalize empty-string-vs-null semantics across all DataFrame adapters on the CSV-direct load path"
worktree: main
priority: Medium-High
status: Not Started
category: Core Functionality

description: |
  The empty-string-vs-null contract is centralized at the Parquet conversion layer
  (data_loader.py, strings_can_be_null = null_marker is not None), and
  prefer_parquet=True is the default - so the DEFAULT path is consistent. But on the
  prefer_parquet=False CSV-direct path the contract is NOT uniform:
    - pandas_df.py:378 and polars_df.py:283 restore '' for empty fields when
      null_marker is None (dask/modin/cudf do likewise).
    - pyspark_df.py:461 returns directly after CSV load (Spark emits null for empty
      fields by default).
    - datafusion_df.py:511 documents null_marker as "Unused".
  So for a null-marker-less benchmark (e.g. ClickBench), a prefer_parquet=False run
  on PySpark or DataFusion emits NULL where the SQL reference (and the other
  adapters) emit "" - the exact Q6/Q17/Q18 divergence class the polars adapter's own
  comment warns about. It is non-default, hence latent, but it is a real
  cross-surface fidelity gap and will silently mis-compare if that path is exercised.

  Prefer a SINGLE shared post-coercion (so future adapters inherit it) over
  per-adapter patches.

prior_art:
  - ref: "benchbox/platforms/dataframe/pandas_df.py:378, polars_df.py:283"
    note: "The correct empty-string restoration (fillna('')/missing_utf8_is_empty_string) to generalize into one shared step."
  - ref: "benchbox/core/dataframe/data_loader.py:423"
    note: "The Parquet-layer contract (strings_can_be_null = null_marker is not None) - the canonical semantics the CSV-direct path must match."
  - ref: "benchbox/platforms/dataframe/benchmark_mixin.py / shared_loading.py"
    note: "Where a shared post-load coercion should live so PySpark/DataFusion inherit it without per-adapter code."
  - ref: "_project/analysis/joinorder-synthetic-cross-surface-divergences.md and clickbench-cross-surface-divergences.md"
    note: "Documents the null_marker root cause (resolve_csv_dialect) and the Q17/Q24/Q6/Q17/Q18 empty-string class."

work:
  - id: w1
    summary: "Add a shared null_marker-aware empty-string post-coercion on the CSV-direct path"
    status: pending
    needs: []
    notes: |
      Add one shared post-load step (in benchmark_mixin/shared_loading) that, when
      null_marker is None, restores '' for empty string-typed fields - applied
      uniformly across adapters, including PySpark (emptyValue/post-read restore) and
      DataFusion. Resolve null_marker via resolve_csv_dialect (the benchmark
      instance's marker), not a file-extension heuristic. Keep prefer_parquet=True
      behavior byte-unchanged.

  - id: w2
    summary: "Gate the fix: ClickBench cross-surface on PySpark/DataFusion with prefer_parquet=False"
    status: pending
    needs: [w1]
    notes: |
      Extend coverage to run a null-marker-less benchmark (ClickBench) cross-surface
      on PySpark and DataFusion with prefer_parquet=False and assert zero
      empty-string-vs-null divergences. Add a focused regression naming the Q6/Q17/
      Q18 pattern. Confirm JoinOrder (null_marker="") still nulls empties (must not
      regress the opposite direction).

must_preserve:
  - "prefer_parquet=True (default) load behavior is byte-unchanged for every adapter."
  - "JoinOrder and other null_marker='' benchmarks still map empty -> NULL; the fix is null_marker-driven, not a blanket empty->'' for all."
  - "The production DataFrame run path is reused, not forked; the change is additive."

anti_patterns:
  - "DO NOT patch only PySpark and DataFusion in isolation - centralize so future adapters inherit the contract."
  - "DO NOT hardcode empty->'' regardless of null_marker - that would break null_marker='' benchmarks."

verification:
  - description: "CSV-direct empty-string parity on the two lagging adapters"
    command: "run ClickBench cross-surface on pyspark+datafusion with prefer_parquet=False"
    expected_output: "0 empty-string-vs-null divergences; JoinOrder still nulls empties"

scope_limit:
  only_modify:
    - "benchbox/platforms/dataframe/"
    - "benchbox/core/dataframe/"
    - "tests/"

success_metrics:
  - "Empty-string-vs-null semantics are identical across all DataFrame adapters on both the parquet and CSV-direct paths."

metadata:
  tags: [dataframe, loader, fidelity, cross-surface, null-semantics]
  estimated_effort: "Medium"
