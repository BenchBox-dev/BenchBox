context_sections:
  "Background and Motivation": |
    The original publishing effort was completed as a standalone infrastructure worktree and then moved
    to DONE with a minimal record. Its implementation had real substance, but no product adoption followed.
    The current scope review therefore sees the module as dead code. This item captures the opposite path:
    if BenchBox wants result publishing and sharing, it must now finish the job and connect it to a real
    user workflow.

  "Technical Context": |
    BenchBox already has a mature canonical result path centered on `benchbox.core.results.exporter`.
    That path writes versioned result bundles, companion files, and powers existing `run`, `export`, and
    `results` commands. Any supported publishing capability should extend that path rather than duplicate it.

  "Research Findings": |
    Review findings behind this item:
    - DONE item: `_project/DONE/infrastructure-publishing/planning/automated-data-publishing-pipeline.yaml`
    - Genesis commit: `97138d3a5` (`feat: add automated data publishing pipeline`)
    - Current consumer scan: zero imports of `benchbox.core.publishing` outside its own package/tests
    - Product gap: no supported CLI/API path, no persistent publication state, no real permalink resolution
    - Execution quality: strong self-contained tests, but the feature stopped at prototype scope

technical_requirements:
  constraints:
  - "Published artifacts must be derived from the canonical schema-v2 result bundle"
  - "Publication metadata must survive process exit and support local plus cloud-path backends"
  - "Generated links/references must match actual backend capabilities"
  dependencies:
  - "Existing cloud path utilities in `benchbox.utils.cloud_storage`"
  - "Existing results/export/history CLI surfaces"
  compatibility: |
    Non-publishing users must not lose any current export or results functionality. Publishing should be
    additive, opt-in, and compatible with existing result files already stored under `benchmark_runs/results/`.

success_metrics:
- "A supported publish/share workflow exists for existing result bundles and is exercised by CLI and integration tests"
- "Published artifact metadata and retention state survive process restart"
- "Every emitted link/reference is truthful for its backend (public URL, storage URI, or explicit local reference)"
- "Canonical result export remains the single source of truth for result serialization"
- "The feature has at least one supported user-facing CLI path and is documented in CLI/help/docs"

open_questions:
- "Should the supported CLI surface be a top-level `benchbox publish` command or a `benchbox results` subcommand family?"
- "Should durable publication metadata live beside result bundles, under `benchmark_runs/published/`, or in a separate indexed store?"
- "Should cloud publishing support launch only for directly addressable/public roots first, with private resolver workflows deferred?"
- "Which prototype-only surfaces should be deleted outright once the supported publishing flow lands?"

