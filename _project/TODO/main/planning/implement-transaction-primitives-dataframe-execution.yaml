impact:
  business_value: |
    Enables transaction semantics benchmarking on lakehouse platforms (Delta Lake,
    Iceberg) via PySpark DataFrames. Currently broken — the system either raises
    NotImplementedError or (before the fix) emitted fabricated results.
  user_impact: |
    Users can run `benchbox run --platform pyspark-df --benchmark transaction_primitives`
    to measure Delta Lake/Iceberg ACID transaction overhead and compare with SQL databases.

