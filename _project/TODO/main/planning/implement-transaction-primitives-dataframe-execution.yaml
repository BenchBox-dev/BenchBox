must_preserve:
- TransactionPrimitivesBenchmark SQL execution path — all 23 SQL operations still work via OperationExecutor
- TPC-H staging table schema (txn_orders, txn_lineitem, txn_customer) unchanged
- Existing get_dataframe_operations() method at benchmark.py:1060 — it works correctly, use it
- Existing test_dataframe_operations.py tests — they test the operations manager and remain valid
- execute_dataframe_workload signature must match adapter call site (ctx, adapter, benchmark_config, query_filter, monitor, run_options) — keyword arguments, no underscore prefixes

approach: |
  Follow the metadata_primitives pattern (NOT write_primitives SQL parity pattern).

  metadata_primitives.execute_dataframe_workload (benchmark.py:1282-1342):
  - Extracts platform_name and spark_session from adapter/ctx
  - Calls self.run_dataframe_benchmark() which uses the operations manager natively
  - Converts operation results to the standard adapter dict format
  - Handles iteration counting and query_filter

  Transaction primitives should do the same:
  - Call self.get_dataframe_operations(platform_name, spark_session) (already exists, line 1060)
  - Iterate supported operations from the manager
  - Time each operation via the manager's execute_*() methods
  - Return results in adapter-compatible format

  The existing get_dataframe_operations() method validates the platform, creates the
  manager, and returns it. The new code just needs to call it and iterate.

anti_patterns:
- DO NOT emit result rows without calling an operation method — because this is exactly the
  phantom-data defect from the prior attempt. Every result row must come from a real
  manager.execute_*() call with measured timing.
- DO NOT use the SQL parity pattern (DuckDB intermediary) — because transaction semantics
  are platform-specific (Delta RESTORE, Iceberg snapshots). Routing through DuckDB tests
  DuckDB transactions, not the target platform's.
- DO NOT rename keyword parameters with underscore prefixes (_monitor, _run_options) —
  because the adapter passes them as keyword arguments by name. Renaming breaks the call
  site with TypeError. Use # noqa: ARG002 if linter complains.
- DO NOT flip supports_dataframe to True before execute_dataframe_workload is functional —
  because this is what the prior attempt did, creating a system that advertised a broken
  capability.
- DO NOT write tests that only verify object construction or config flags — because
  the prior attempt had 11 such tests and none caught the hollow implementation. Every
  test must verify execution behavior (method calls, non-zero times, correct result format).

verification:
- description: execute_dataframe_workload does not raise NotImplementedError
  command: >
    uv run -- python -c "
    from benchbox.core.transaction_primitives.benchmark import TransactionPrimitivesBenchmark;
    b = TransactionPrimitivesBenchmark();
    assert hasattr(b, 'execute_dataframe_workload');
    import inspect; src = inspect.getsource(b.execute_dataframe_workload);
    assert 'NotImplementedError' not in src, 'Still raises NotImplementedError';
    print('OK: execute_dataframe_workload has real implementation')
    "
  expected_output: "OK: execute_dataframe_workload has real implementation"
- description: execute_dataframe_workload calls get_dataframe_operations (source check)
  command: >
    uv run -- python -c "
    from benchbox.core.transaction_primitives.benchmark import TransactionPrimitivesBenchmark;
    import inspect; src = inspect.getsource(TransactionPrimitivesBenchmark.execute_dataframe_workload);
    assert 'get_dataframe_operations' in src, 'Does not delegate to get_dataframe_operations';
    print('OK: delegates to get_dataframe_operations')
    "
  expected_output: "OK: delegates to get_dataframe_operations"
- description: skip_dataframe_data_loading returns True
  command: >
    uv run -- python -c "
    from benchbox.core.transaction_primitives.benchmark import TransactionPrimitivesBenchmark;
    b = TransactionPrimitivesBenchmark();
    assert b.skip_dataframe_data_loading() is True;
    print('OK: skip_dataframe_data_loading returns True')
    "
  expected_output: "OK: skip_dataframe_data_loading returns True"
- description: Registry reports supports_dataframe True and num_queries 12
  command: >
    uv run -- python -c "
    from benchbox.core.benchmark_registry import BENCHMARK_REGISTRY;
    entry = BENCHMARK_REGISTRY['transaction_primitives'];
    assert entry['supports_dataframe'] is True, f'supports_dataframe={entry[\"supports_dataframe\"]}';
    assert entry['num_queries'] == 12, f'num_queries={entry[\"num_queries\"]}, expected 12';
    print('OK: supports_dataframe is True, num_queries is 12')
    "
  expected_output: "OK: supports_dataframe is True, num_queries is 12"
- description: Behavioral tests pass (not just instantiation tests)
  command: uv run -- python -m pytest tests/unit/core/transaction_primitives/test_dataframe_workload.py -v
  expected_output: all tests pass, 0 failures
- description: Existing operations manager tests still pass
  command: uv run -- python -m pytest tests/unit/core/transaction_primitives/ -v
  expected_output: all tests pass, 0 failures

