id: explorer-tokens-path-classifier-output
title: "Expose explorer-paths-needed from path_filter_decision so the explorer-tokens job stops booting on Python-only PRs"
worktree: main
priority: Low
status: Not Started
category: Quality

description: |
  PR #277 added the `explorer-tokens` PR-time job in
  `.github/workflows/pr.yml`. It is gated on
  `needs.ci-paths.outputs.needs-code-ci == 'true'`, which is true for any
  code-CI path (`benchbox/**`, `tests/**`, `scripts/**`, …), so the job
  boots a runner on every Python-only PR before its inner
  `Detect results-explorer/src changes` step short-circuits the scan.

  Add an `explorer-paths-needed` boolean output to
  `scripts/path_filter_decision.py` (mirror the existing
  `content-guard-needed` pattern) and switch the job's `if:` to use it.
  The inner detection step can then be removed.

  The classifier already has the matching pattern infrastructure;
  `results-explorer/**` is in `.github/path-filters.yml` `code-ci`. Add
  a new top-level rule key `explorer-tokens` (sibling of `safe-content`,
  `content-guard`, `code-ci`) matching exactly `results-explorer/src/**`.
  The classifier emits `explorer-paths-needed` (boolean) when any
  changed path matches that key; the PR-time job's `if:` switches from
  `needs.ci-paths.outputs.needs-code-ci` to
  `needs.ci-paths.outputs.explorer-paths-needed`. The inner
  `Detect results-explorer/src changes` step is then redundant and is
  removed in the same change.

deps: {}

work:
- id: w1
  summary: "Add explorer-tokens rule key to .github/path-filters.yml matching results-explorer/src/**"
  status: pending

- id: w2
  summary: "Extend path_filter_decision.py to compute explorer_paths and emit explorer-paths-needed"
  needs: [w1]
  status: pending

- id: w3
  summary: "Add unit tests under tests/unit/scripts/test_path_filter_decision.py for the new output"
  needs: [w2]
  status: pending

- id: w4
  summary: "Switch pr.yml explorer-tokens job to gate on explorer-paths-needed and drop the inner git diff detection step"
  needs: [w3]
  status: pending

must_preserve:
- "Existing ci-paths outputs (safe-content-only, needs-code-ci, content-guard-needed) and their semantics."
- "ci-required-result aggregator behavior — explorer-tokens skipped path still counts as success."

anti_patterns:
- "DO NOT widen the explorer-tokens scan rule beyond results-explorer/src/** — the gate's purpose is the retheme contract on the public surface, not the e2e/test fixtures."
- "DO NOT introduce a github-actions-side path filter (e.g. dorny/paths-filter) to gate the job — diverges from the existing path_filter_decision.py classifier idiom and creates two sources of truth for path classification."
- "DO NOT keep the inner `Detect results-explorer/src changes` step alongside the new outer `if:` — the whole point of moving the gate to the classifier is to remove the duplicate detection."

verification:
- description: "Classifier returns explorer-paths-needed=true when results-explorer/src changes"
  command: "uv run -- python -m pytest tests/unit/scripts/test_path_filter_decision.py -k explorer -v"
  expected_output: "all tests pass"
- description: "Workflow gate references the new classifier output"
  command: "grep -q 'outputs.explorer-paths-needed' .github/workflows/pr.yml"
  expected_output: "exit 0"
- description: "Inner detection step has been removed"
  command: "! grep -q 'Detect results-explorer/src changes' .github/workflows/pr.yml"
  expected_output: "exit 0"

scope_limit:
  only_modify:
  - "scripts/path_filter_decision.py"
  - "tests/unit/scripts/test_path_filter_decision.py"
  - ".github/path-filters.yml"
  - ".github/workflows/pr.yml"
  do_not_modify:
  - "_project/scripts/scan_explorer_tokens.py"
  - "results-explorer/src/"

metadata:
  tags:
  - quality
  - ci
  - results-explorer
  - tokenization
  estimated_effort: "Small (~half day)"
  created_date: "2026-05-08"

impact:
  business_value: |
    Saves a runner-minute per Python-only PR. Modest individually,
    additive across the PR queue.
  user_impact: |
    None directly. Faster PR feedback when the explorer-tokens job is
    correctly classified as not-needed.
  technical_debt: |
    Brings the explorer-tokens gate in line with the existing
    path-classifier idiom rather than carrying an inline git-diff
    detection step that duplicates the classifier's job.
