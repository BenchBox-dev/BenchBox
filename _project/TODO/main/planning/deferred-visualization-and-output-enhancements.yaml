id: deferred-visualization-and-output-enhancements
title: "Rich Output Formats — PNG, HTML/SVG, and Greyscale Chart Rendering"
worktree: main
priority: Medium-High
status: Not Started
category: User Experience
description: |
  Extends the visualization system beyond ASCII with richer output formats.
  Consolidates deferred work from 2 completed TODOs:

  - follow-up-visualization-template-chart-integration (completed 2026-02-18):
    Non-ASCII (PNG/HTML) equivalents for template chart bundles.
  - greyscale-ascii-visualization-fallbacks (completed 2026-02-17):
    Intermediate greyscale ColorMode (dim/bold ANSI tier) and HTML/SVG chart
    output format for MCP.

  The ASCII path is complete and functional with color, no-color, and
  structural-pattern fallbacks. These items are aspirational — implement only
  if user demand materializes.

context_sections:
  "Background": |
    The ASCII visualization system is fully implemented covering CLI, MCP, and
    --no-color use cases. These deferred items represent the next tier of
    visualization richness for users who need exportable or web-embeddable charts.

  "User Demand Signal": |
    No user requests for PNG/HTML/SVG output have been received as of 2026-02-18.
    These items should be re-evaluated when:
    - Users report ASCII charts are insufficient for their workflow
    - MCP web UIs become a primary consumption path
    - Blog/documentation needs programmatic chart generation

metadata:
  tags:
  - visualization
  - charts
