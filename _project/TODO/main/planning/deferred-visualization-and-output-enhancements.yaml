  - "benchbox/core/visualization/html_backend.py"

work:
- id: w1
  summary: "Add PNG chart rendering backend using matplotlib — CLI flag --format=png writes image files to output directory"
  status: pending
  notes: |
    Scope: CLI-only initially (benchbox visualize --format=png). Would add
    matplotlib as an optional dependency. Generates one PNG per chart type.
    MCP integration can follow as w1b if needed.

- id: w2
  summary: "Add HTML/SVG chart output format — self-contained HTML files with inline SVG for MCP web UIs and report embedding"
  status: pending
  notes: |
    Could use lightweight SVG generation (no heavy dependency) or matplotlib's
    SVG backend. Target: single self-contained HTML file per chart bundle.

- id: w3
  summary: "Add intermediate greyscale ColorMode (dim/bold ANSI) between full-color and structural-only"
  status: pending
  notes: |
    The structural-pattern approach already covers the primary use cases.
    This is a refinement for terminals that support bold/dim but not full
    ANSI color (rare but exists). Lowest priority of the three items.
