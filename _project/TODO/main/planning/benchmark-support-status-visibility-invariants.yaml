id: benchmark-support-status-visibility-invariants
title: "Harden benchmark support-status visibility invariants across public surfaces"
worktree: main
priority: Medium
status: "Not Started"
category: Benchmark Architecture

deps:
  needs:
    - benchmark-support-status-and-discovery-policy

description: |
  PR #502 added benchmark support status and exposed it on MCP discovery. The
  immediate review follow-up fixed CLI labeling for public benchmark listings
  and prevented MCP query-detail support-status leakage for internal/repo-only
  benchmarks. The broader invariant still needs a durable test matrix: future
  repo_only, document_only, deprecated, beta, and experimental benchmark entries
  should fail loudly if a public surface exposes or hides them contrary to the
  support taxonomy and `surface` policy.

  Add cross-surface invariant tests and policy documentation that prove
  `support_status`, `surface`, and `supports_dataframe` remain separate. The
  goal is not to change visibility for current benchmarks. The goal is to make
  future status additions safe and reviewable across CLI, MCP discovery, MCP
  query details, docs, and result/explorer inputs where applicable.

work:
  - id: w0
    summary: "Inventory current public, internal, and explicit-ID benchmark surfaces"
    status: pending
    notes: |
      Re-check CLI interactive listing, CLI explicit benchmark execution, MCP
      list_available, MCP get_benchmark_info, MCP get_query_details, resources,
      result publisher discovery, explorer ingestion, and result-integrity docs.
      Record which surfaces are discovery surfaces and which are explicit-ID
      execution or inspection surfaces.

  - id: w1
    summary: "Write a visibility policy table for support_status x surface x capability"
    needs: [w0]
    status: pending
    notes: |
      Specify expected behavior for stable, beta, experimental, repo_only,
      deprecated, and document_only when `surface` is public or internal. Include
      whether each should be listed by default, labeled, hidden, runnable by
      explicit ID, exposed over MCP discovery, exposed over MCP query details,
      and eligible for DataFrame routing if `supports_dataframe` is true.

  - id: w2
    summary: "Add synthetic invariant tests for future repo_only and document_only benchmark metadata"
    needs: [w1]
    status: pending
    notes: |
      Use patch.dict or small helper fixtures to create temporary benchmark
      metadata entries for repo_only, document_only, deprecated, beta, and
      experimental statuses. Assert discovery hiding, public labeling, and
      explicit-ID behavior according to the policy. Avoid importing heavy
      benchmark classes when metadata-only behavior is sufficient.

  - id: w3
    summary: "Extend CLI and MCP tests so non-stable public benchmarks are visibly labeled"
    needs: [w1]
    status: pending
    notes: |
      Keep the immediate CLI tests from the review fix, then broaden them to
      cover public beta and experimental cases in list trees, selection tables,
      preview panels, MCP list_available, MCP get_benchmark_info, and benchmark
      resources. Tests should check contract shape, not rich color styling.

  - id: w4
    summary: "Document explicit-ID exceptions and support-status exposure policy"
    needs: [w1, w2]
    status: pending
    notes: |
      If explicit-ID surfaces can inspect internal benchmarks, document what
      metadata may be returned and which support claims must be omitted. Keep the
      documentation aligned with the public contract map and MCP docs.

  - id: w5
    summary: "Run focused contract and MCP/CLI tests after invariant coverage lands"
    needs: [w2, w3, w4]
    status: pending
    notes: |
      Run the narrowest tests for benchmark registry, CLI benchmark manager, MCP
      discovery/resources/tool handlers, and any result/explorer path touched by
      the invariant work. Escalate to fast tests before PR submission.

metadata:
  tags:
    - benchmarks
    - support-status
    - surface-policy
    - mcp
    - cli
  estimated_effort: "1-2 days"
  created_date: "2026-05-21"
  last_updated: "2026-05-21T00:00:00Z"

impact:
  business_value: |
    Prevents future support-status additions from silently contradicting public
    discovery and MCP exposure promises.
  user_impact: |
    Keeps users from mistaking beta, experimental, repo-only, or document-only
    benchmarks for ordinary stable public support.
  technical_debt: |
    Converts cross-surface support-status behavior from review-memory into
    executable invariants.

files_affected:
  modified:
    - "benchbox/core/benchmark_registry.py"
    - "benchbox/cli/benchmarks.py"
    - "benchbox/mcp/tools/discovery.py"
    - "benchbox/mcp/tools/benchmark.py"
    - "benchbox/mcp/resources/registry.py"
    - "docs/reference/public-contracts.md"
    - "docs/reference/mcp.md"
    - "tests/unit/core/test_benchmark_api_contract.py"
    - "tests/unit/cli/test_benchmark_manager_behavioral.py"
    - "tests/unit/mcp/test_discovery_tools.py"
    - "tests/unit/mcp/test_mcp_tool_handlers.py"
    - "tests/unit/mcp/test_resources.py"

prior_art:
  - "benchbox/core/benchmark_registry.py:get_benchmark_surface and list_public_benchmark_ids - reuse for discovery visibility decisions."
  - "benchbox/core/benchmark_registry.py:get_benchmark_support_status and get_benchmark_registry_summary - reuse for status assertions."
  - "benchbox/cli/benchmarks.py: BenchmarkManager public benchmark filtering - extend tests without changing explicit-ID run behavior."
  - "benchbox/mcp/tools/discovery.py: public benchmark discovery filtering - reuse as MCP listing contract."
  - "benchbox/mcp/tools/benchmark.py: get_query_details benchmark_info - preserve explicit-ID compatibility while preventing unsupported support-status claims."
  - "tests/unit/core/test_registry_surface_field.py: patch.dict surface tests - reuse fixture pattern for synthetic status/surface combinations."

must_preserve:
  - "joinorder_synthetic remains runnable by explicit ID where it was already supported."
  - "joinorder_synthetic remains hidden from public discovery lists."
  - "Public beta and experimental benchmarks remain visible unless a separate surface/deprecation decision changes them."
  - "MCP discovery continues to expose support_status for public benchmarks."
  - "supports_dataframe continues to control DataFrame routing independently of support_status."

approach: |
  Treat `surface` as visibility, `support_status` as product support level, and
  `supports_dataframe` as capability. First write the policy table so tests have
  a clear target. Then add metadata-only fixture tests for future statuses and
  focused real-registry tests for current public beta/experimental and internal
  repo_only benchmarks. Keep explicit-ID behavior stable unless the policy table
  explicitly changes it.

anti_patterns:
  - "DO NOT hide all experimental benchmarks by changing support_status behavior alone - because visibility is controlled by surface - use explicit surface decisions for hiding."
  - "DO NOT expose repo_only or document_only support claims over MCP discovery - because the public taxonomy says those are not MCP-exposed - omit or filter claims on explicit-ID surfaces."
  - "DO NOT use supports_dataframe to infer support_status - because DataFrame support is a capability dimension - assert it separately."
  - "DO NOT build tests that depend on rich color codes - because styling is incidental - assert labels and fields."

