success_metrics:
  - "Synthetic tests prove repo_only and document_only benchmark support claims cannot leak onto public discovery surfaces."
  - "Public beta and experimental benchmarks are visibly labeled on CLI and MCP surfaces without changing discovery visibility."
  - "The policy table explains explicit-ID exceptions for internal benchmarks."

open_questions:
  - "Should deprecated public benchmarks remain listed with labels for one release window, or become hidden immediately after deprecation?"
  - "Should explicit-ID MCP query details return benchmark display/category metadata for repo_only benchmarks, or only query text and normalized identifiers?"
