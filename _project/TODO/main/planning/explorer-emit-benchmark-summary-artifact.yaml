id: explorer-emit-benchmark-summary-artifact
title: "Emit per-benchmark summary artifact for matrix leaderboard view"
worktree: main
priority: High
status: Not Started
category: Core Functionality

description: |
  The strategy review (2026-04-15) identified that the explorer's current
  data model — manifest.json (aggregate only) + details/{id}.json (one file
  per result) — cannot support a ClickBench-style Platform × Query matrix
  leaderboard without N parallel detail fetches assembled client-side. That
  approach is slow, fragile, and silently breaks when platforms run
  heterogeneous query subsets.

  This TODO introduces a third derived artifact shape emitted by the
  explorer pipeline:

      results-explorer/public/data/benchmarks/{benchmark}_sf{sf}_{phase}.json

  One file per (benchmark, scale_factor, phase) tuple, containing the full
  cross-platform query matrix pre-computed from already-loaded bundles (no
  extra I/O — the pipeline already has everything in memory during its
  single pass).

  Key schema decisions driven by the adversarial review:

  1. Key includes **phase** (not just benchmark/scale). The proposal that
     keyed on (benchmark, scale) alone silently collapses power vs
     throughput vs maintenance phases. Making phase part of the filename
     makes the scope of each matrix explicit and URL-addressable.

  2. Tuning_mode is a per-platform-row field, not an artifact-level filter.
     Two DuckDB rows with different tuning modes occupy different matrix
     rows; the UI labels them as such.

  3. Each row carries `power_score` (for TPC-H/TPC-DS), `geomean_ms`, and
     `cost_usd` so the UI can choose ranking metric per benchmark family
     without a second fetch.

  4. Sparse matrices: platforms that ran a subset of queries produce
     `null` in the missing cells, never crash the build.

  5. Artifacts are gzipped on write (`*.json.gz`). TPC-DS SF100 with 30
     platforms × 99 queries × throughput streams can reach 200-500KB raw;
     gzip cuts that ~5×. Loader handles both for local dev convenience.

deps:
  needs:
    - explorer-extend-manifest-and-pipeline

work:
  - id: w1
    summary: "Define BenchmarkSummary + PlatformRow Pydantic models in benchbox/core/explorer/models.py"
    status: pending
    notes: |
      BenchmarkSummary fields: benchmark, scale_factor, phase, query_ids
      (ordered), platforms (list of PlatformRow).

      PlatformRow fields: result_id, platform, platform_version,
      tuning_mode, tuning_hash, execution_mode, trust_label, run_date,
      power_score (nullable), geomean_ms, cost_usd (nullable),
      timings (dict query_id → ms, null per missing cell).

  - id: w2
    summary: "Extend ExplorerPipeline.run() to emit benchmarks/{b}_sf{sf}_{phase}.json.gz per (benchmark, scale, phase) tuple"
    needs: [w1]
    status: pending
    notes: |
      Zero additional disk I/O — accumulate from detail results already
      loaded in the single-pass scan. Phase values: "power" and
      "throughput" in Phase 1. Use the same sf_str formatting as existing
      manifest paths. Sort platforms by power_score (if present) else
      geomean_ms ascending so default rendering is ranked.

  - id: w3
    summary: "Write unit tests in tests/unit/core/explorer/test_benchmark_summary.py"
    needs: [w2]
    status: pending
    notes: |
      Cases: (a) normal multi-platform; (b) sparse query subset
      (platform missing Q17 → null cell); (c) mixed tuning modes produce
      distinct rows; (d) phase separation (power and throughput produce
      separate files); (e) gzip output is valid and round-trips.

  - id: w4
    summary: "Regenerate artifacts (uv run benchbox explorer build) and commit refreshed data/ tree"
    needs: [w2, w3]
    status: pending

files_affected:
  added:
    - "benchbox/core/explorer/models.py (BenchmarkSummary, PlatformRow additions)"
    - "tests/unit/core/explorer/test_benchmark_summary.py"
    - "results-explorer/public/data/benchmarks/*.json.gz (generated)"
  modified:
    - "benchbox/core/explorer/pipeline.py"

must_preserve:
  - "Existing manifest.json schema — new artifact is additive; do not remove or reshape manifest fields"
  - "Existing details/{id}.json per-result pages — detail page consumers must continue to work"
  - "ExplorerPipeline.run() remains a single pass over bundles — no extra bundle loads introduced"

approach: |
  The pipeline currently loads each bundle exactly once into memory to
  build manifest + details. Extend that same pass: maintain a dict
  keyed by (benchmark, scale_factor, phase) that accumulates platform
  rows as each bundle is processed. At the end of the pass, emit one
  BenchmarkSummary per key.

  Do not refactor the pipeline architecture for this change. Add the
  accumulator and the emission step. Nothing else.

  For phase handling: schema-v2 bundles already carry a `test_type`
  ("power" or "throughput"). Use that field to route each platform row
  into the right accumulator bucket. Bundles without an explicit
  test_type default to "power" (matches current CLI behavior).

anti_patterns:
  - "DO NOT fan out into additional bundle loads — because the pipeline is already O(N) bundles — use in-memory accumulation only"
  - "DO NOT collapse tuning modes into a single row per platform — because tuned vs notuning is a comparability-breaking dimension — each (platform, tuning_mode) gets its own row"
  - "DO NOT key the artifact on (benchmark, scale) alone — because it silently mixes power and throughput phases — include phase in the key"
  - "DO NOT default missing power_score to 0 — because that would sort broken results to the top — use null and document the fallback (geomean_ms)"

scope_limit:
  only_modify:
    - "benchbox/core/explorer/models.py"
    - "benchbox/core/explorer/pipeline.py"
    - "tests/unit/core/explorer/test_benchmark_summary.py"
    - "results-explorer/public/data/benchmarks/**"
  do_not_modify:
    - "results-explorer/src/**"
    - "benchbox/core/explorer/exporter.py"
    - "benchbox/cli/commands/explorer.py"

verification:
  - description: "Pipeline emits a summary artifact per (benchmark, scale, phase) tuple"
    command: "uv run -- python -m benchbox.cli explorer build --dry-run 2>&1 | grep -c 'benchmarks/.*_sf.*_.*\\.json'"
    expected_output: "non-zero integer matching unique (benchmark, scale, phase) count"
  - description: "Unit tests pass"
    command: "uv run -- python -m pytest tests/unit/core/explorer/test_benchmark_summary.py -v"
    expected_output: "all tests pass"
  - description: "Generated artifact round-trips through gzip + JSON"
    command: "uv run -- python -c 'import gzip, json; d = json.loads(gzip.open(\"results-explorer/public/data/benchmarks/tpch_sf0.01_power.json.gz\").read()); assert \"platforms\" in d and \"query_ids\" in d'"
    expected_output: "no assertion failure"

metadata:
  tags: ["results", "explorer", "matrix", "leaderboard", "pipeline"]
  estimated_effort: "Medium (1-2 days)"
  created_date: "2026-04-15"
