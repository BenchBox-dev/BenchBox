id: adapter-run-context-and-reuse-contract
title: "Architecture hardening: document adapter lifecycle and isolate run-scoped state if needed"
worktree: main
priority: Medium-High
status: "Not Started"
category: Platform Architecture

deps:
  needs:
    - architecture-contract-map-and-support-taxonomy

description: |
  Adapter instances currently behave as serial, run-scoped objects that hold
  connection state, plan-capture flags, dry-run state, execution metadata, and
  phase result caches. That is acceptable if documented and tested. It becomes
  fragile if service-mode reuse or concurrent execution is a near-term product
  goal.

  This item decides the adapter lifecycle contract, adds a sequential reuse
  regression test for the current model, and only introduces AdapterRunContext
  if the project chooses reusable/concurrent adapters.

work:
  - id: w0
    summary: "Revalidate adapter instance state and phase cache flow"
    status: pending
    notes: |
      Commit a compact summary of checked SHA, stateful adapter fields, reset
      points, and phase result cache usage.

      Minimum evidence to re-check:
        - benchbox/platforms/base/adapter.py constructor state.
        - benchbox/platforms/base/adapter.py run_benchmark state mutation/reset.
        - benchbox/platforms/base/execution.py phase result writes.
        - benchbox/platforms/base/result_capture.py phase result consumption/reset.
        - tests covering adapter reuse or concurrent execution, if any.

  - id: w1
    summary: "Decision gate: serial run-scoped adapters or reusable/concurrent adapters"
    needs: [w0]
    status: pending
    notes: |
      Record the lifecycle in docs/reference/public-contracts.md and adapter
      authoring docs. The decision must state:
        - May one adapter instance run multiple benchmarks sequentially?
        - May one adapter instance run concurrently?
        - Who owns connection lifecycle?
        - Are plan capture flags and dry-run settings per adapter or per run?
        - Are phase result caches allowed on self?

  - id: w2
    summary: "Implement the selected adapter lifecycle path"
    needs: [w1]
    status: pending
    notes: |
      If adapters are serial/run-scoped for now: add docs and a regression test
      proving a sequential second run does not reuse stale phase results, dry-run
      flags, skipped query state, or execution metadata from the first.

      The test may use a minimal fake adapter if real platforms would be too
      slow or dependency-heavy.

      If w1 chooses reusable/concurrent adapters: move per-run state into an
      AdapterRunContext passed through execution and result capture. Candidate
      fields: connection/run handle as appropriate, capture settings, dry-run
      state, phase caches, execution metadata, skipped query tracking, and
      validation options.

      This is a broad refactor; slice it by state group and keep compatibility
      shims only where needed for adapter subclasses.

  - id: w3
    summary: "Add adapter authoring guidance and subclass override guardrails"
    needs: [w2]
    status: pending
    notes: |
      Update docs/development/adapter-refactor-map.md and adding-new-platforms
      guidance to tell adapter authors where run-scoped state belongs, which
      fields are safe to mutate, and what tests new adapters must add.

deferred:
  - summary: "Make all existing adapters concurrency-safe"
    reason: "Only required if the lifecycle decision chooses concurrent adapter reuse."
  - summary: "Split every base mixin in this TODO"
    reason: "This item targets run-scoped state, not a broad adapter-base redesign."

metadata:
  tags:
    - adapters
    - lifecycle
    - concurrency
    - platform-authoring
  estimated_effort: "2-6 days depending on decision"
  created_date: "2026-05-21"
  last_updated: "2026-05-21T00:00:00Z"

impact:
  business_value: |
    Prevents hard-to-debug stale state if BenchBox grows toward service-mode or
    concurrent orchestration.
  user_impact: |
    Maintainers and platform authors know whether adapter instances are safe to
    reuse and under what conditions.
  technical_debt: |
    Turns implicit mutable adapter state into an explicit lifecycle contract.

files_affected:
  added:
    - "tests/unit/platforms/test_adapter_lifecycle.py"
  modified:
    - "benchbox/platforms/base/"
    - "docs/development/adapter-refactor-map.md"
    - "docs/development/adding-new-platforms.md"
    - "docs/reference/public-contracts.md"

must_preserve:
  - "Do not break existing adapter subclass override points documented in adapter-refactor-map.md."
  - "Do not require cloud/native optional dependencies for lifecycle tests."
  - "Do not promise concurrent adapter reuse unless tests prove the base path and representative adapters are safe."

approach: |
  Decide lifecycle before refactoring. If serial/run-scoped is the contract,
  document it and add sequential reuse protection. If reusable/concurrent is a
  product requirement, introduce a run context deliberately and slice the state
  migration.

anti_patterns:
  - "DO NOT introduce AdapterRunContext just because mutable state exists -- serial run-scoped adapters may be acceptable -- make the lifecycle decision first."
  - "DO NOT leave phase caches on self while claiming concurrency support -- that is the stale-state failure mode -- move caches into per-run context if concurrency is supported."
  - "DO NOT use live cloud platforms for lifecycle tests -- optional dependencies make the guard brittle -- use fake or local adapters."

verification:
  - description: "Run focused adapter lifecycle tests."
    command: "uv run -- python -m pytest tests/unit/platforms -k 'adapter_lifecycle or run_context' --tb=short"
    expected_output: "Adapter lifecycle tests pass."
  - description: "Run a fast local smoke benchmark if adapter base code changed."
    command: "uv run -- python -m pytest -m fast -k 'duckdb or dataframe' --tb=short"
    expected_output: "Fast local smoke tests pass."

scope_limit:
  only_modify:
    - "benchbox/platforms/base/"
    - "tests/unit/platforms/"
    - "docs/development/"
    - "docs/reference/public-contracts.md"
    - "_project/TODO/"
    - "_project/DONE/"
  do_not_modify:
    - "benchbox/sql_compat/"
    - "benchbox/mcp/"
    - "_project/scripts/explorer_pipeline/"

prior_art:
  - "docs/development/adapter-refactor-map.md: documents stable facade/subclass risk -- use this as guardrail before moving base responsibilities."
  - "benchbox/platforms/base/result_capture.py: existing phase cache consumption/reset -- target for regression coverage."
  - "tests/unit/platforms/: existing local/fake adapter test patterns -- prefer over live platform dependencies."

success_metrics:
  - "Adapter lifecycle is explicitly documented as serial/run-scoped or reusable/concurrent."
  - "A sequential reuse test guards stale phase state."
  - "Adapter authors have clear rules for run-scoped state."

open_questions:
  - "Is service-mode or concurrent execution a pre-1.0 requirement?"
  - "Should connection objects be per adapter or per run for local SQL platforms?"
