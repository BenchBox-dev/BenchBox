impact:
  business_value: |
    Makes chart additions predictable across CLI, MCP, Explorer, and exported
    APIs, reducing release risk when visualization features evolve.
  user_impact: |
    Users and agents stop seeing valid chart types that cannot render or cannot
    be discovered from a front-end surface.
  technical_debt: |
    Replaces hand-maintained parallel registries with one contract or a tested
    compatibility boundary.

