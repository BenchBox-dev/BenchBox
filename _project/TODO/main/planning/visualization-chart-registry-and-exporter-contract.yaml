id: visualization-chart-registry-and-exporter-contract
title: "Visualization hardening: make chart-type registration and exporter coverage one auditable contract"
worktree: main
priority: High
status: "Not Started"
category: Visualization

deps:
  needs:
    - architecture-contract-map-and-support-taxonomy

description: |
  Independent verification of the visualization architecture review confirmed
  that BenchBox has too many chart-type registration surfaces for one semantic
  chart addition. The local review at SHA a63ae1a76 found:

    - `benchbox/core/visualization/chart_types.py` declares 16 semantic chart
      specs and calls itself canonical.
    - `benchbox/core/visualization/ascii_runtime.py` has a separate 16-entry
      `_CHART_TYPE_DISPATCH` map that is the renderer path users actually hit.
    - `benchbox/core/visualization/exporters.py` has a separate 15-entry
      `_CHART_BUILDERS` map and already omits `power_bar`.
    - `benchbox/core/visualization/templates.py`, MCP suggestions, CLI help,
      MCP help/docstrings, discovery metadata, and Results Explorer registry
      files each carry chart-type knowledge.
    - The current registry test pins only CLI/MCP descriptions and templates
      against `ALL_CHART_TYPES`; it does not pin runtime dispatch, exporter
      builders, MCP suggestions, discovery metadata, or Explorer parity.

  This TODO defines the chart-type contract and then collapses or guards the
  drift-prone registries. The first implementation target is not a broad
  visualization rewrite: it is a durable add-one-chart workflow with tests that
  fail when a registered chart cannot render or cannot be discovered.

work:
  - id: w0
    summary: "Revalidate chart registries, textcharts version, and drift surfaces against the current branch"
    status: pending
    notes: |
      Before editing, rerun the evidence on the implementation branch and
      record checked SHA, textcharts version, registry counts, and mismatches in
      the PR body or TODO completion notes. Do not commit raw stdout.

      Required checks:
        - `uv run -- python - <<'PY'` snippet that imports
          `ALL_CHART_TYPES`, `CHART_TYPE_SPECS`,
          `ascii_runtime._CHART_TYPE_DISPATCH`, `exporters._CHART_BUILDERS`,
          `textcharts.commands.registry.REGISTRY`, and
          `importlib.metadata.version("textcharts")`; print counts and
          set differences.
        - `rg -n "_CHART_TYPE_DISPATCH|_CHART_BUILDERS|_build_chart_suggestions|CHART_TYPE_DESCRIPTIONS|SUPPORTED_CHART_TYPES|ALL_CHART_IDS|chartRegistry|performance_bar|power_bar" benchbox results-explorer tests --glob '*.py' --glob '*.ts' --glob '*.tsx' --glob '!build/**' --glob '!docs/_build/**' --glob '!.venv/**'`.
        - Inspect `benchbox/mcp/tools/discovery.py` for chart-type metadata
          separate from the visualization MCP tool.
        - Inspect `tests/unit/visualization/test_chart_type_registry.py`,
          `tests/unit/core/visualization/test_chart_generator.py`,
          `results-explorer/src/__tests__/chartRegistry.meta.test.ts`, and
          `results-explorer/src/__tests__/chartRegistry.parity.test.ts`.

      Decision gate: if current `origin/develop` already fixed any listed drift,
      update the implementation scope to preserve the new source of truth rather
      than reintroducing an older registry shape.

  - id: w1
    summary: "Define the semantic chart-type contract and add registry parity tests for renderer-critical maps"
    needs: [w0]
    status: pending
    notes: |
      Add or update tests so CI fails when:
        - `set(ascii_runtime._CHART_TYPE_DISPATCH) != set(ALL_CHART_TYPES)`;
        - templates reference an unregistered chart;
        - MCP chart descriptions are missing any registered chart;
        - Results Explorer `ALL_CHART_IDS` diverges from the Python registry;
        - discovery metadata claims a stale chart subset without documenting it
          as intentionally partial.

      The test should distinguish required coverage from intentionally partial
      surfaces. For example, discovery metadata may be allowed to expose a short
      "common chart types" list only if the code names it as partial and links
      to the full registry.

  - id: w2
    summary: "Choose and implement one source of truth for semantic chart specs and runtime render handlers"
    needs: [w1]
    status: pending
    notes: |
      Decide whether `chart_types.py` stays canonical with handler metadata
      attached elsewhere, or whether `_CHART_TYPE_DISPATCH` becomes canonical
      and derives `ALL_CHART_TYPES` and descriptions.

      Acceptable outcomes:
        - One registry object owns chart ID, description, `requires_two_results`,
          runtime render handler, and optional feature flags; or
        - A narrower first step keeps `chart_types.py` as metadata source but
          adds non-bypassable parity tests and removes misleading "canonical"
          language from any map that is not complete.

      Decision gate: adding a new result-aware semantic chart must require one
      primary registry edit plus targeted renderer/suggestion implementation,
      not hand-editing disconnected type lists.

  - id: w3
    summary: "Resolve the public `render_ascii_chart` exporter gap without silently breaking external callers"
    needs: [w1, w2]
    status: pending
    notes: |
      Treat `benchbox.core.visualization.render_ascii_chart` as a public or
      beta-public compatibility surface until the public-contract map says
      otherwise. Choose one path:
        - Keep it and fold `_CHART_BUILDERS` into the shared registry or a
          documented primitive-builder registry, including a deliberate answer
          for `power_bar`; or
        - Deprecate it with docs/tests and leave a compatibility window; or
        - Delete it only after maintainer confirmation that external embedder
          and notebook use is not a supported contract.

      If kept, add tests that explain why it may have fewer entries than
      result-aware `ALL_CHART_TYPES` if `power_bar` cannot be data-first.

  - id: w4
    summary: "Update Explorer, discovery metadata, and chart-count guards to follow the chosen contract"
    needs: [w2]
    status: pending
    notes: |
      Reconcile `results-explorer/src/lib/chartRegistry.ts`,
      `results-explorer/src/__tests__/chartRegistry.meta.test.ts`,
      `results-explorer/src/components/ChartPanel.tsx`, and
      `benchbox/mcp/tools/discovery.py` with the selected source-of-truth
      contract.

      Replace brittle count-only checks such as "expected 16 chart types" with
      checks that name missing and extra IDs. Count checks may remain only as a
      quick smoke signal after the bidirectional set comparison exists.

  - id: w5
    summary: "Document the add-one-chart workflow and public compatibility boundary"
    needs: [w3, w4]
    status: pending
    notes: |
      Add concise documentation near the registry or in
      `docs/reference/public-contracts.md` explaining:
        - semantic result-aware chart IDs vs raw textcharts primitive IDs;
        - which chart IDs are public CLI/MCP/Explorer contracts;
        - what files/tests must change for a new chart type;
        - whether `render_ascii_chart` is supported, deprecated, or internal;
        - how textcharts dependency updates are validated.

deferred:
  - summary: "Rewrite all ASCII renderer implementations"
    reason: "Renderer classes already live in textcharts; this TODO addresses BenchBox's registration and result-aware contract layer."
  - summary: "Remove Results Explorer chart components"
    reason: "Explorer has its own browser rendering surface; this TODO aligns IDs/contracts rather than replacing UI components with ASCII renderers."
  - summary: "Delete `render_ascii_chart` immediately"
    reason: "It is exported through `benchbox.core.visualization`; deletion needs a public-contract decision or compatibility window."

