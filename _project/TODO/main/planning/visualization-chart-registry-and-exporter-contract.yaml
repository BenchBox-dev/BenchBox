prior_art:
  - "benchbox/core/visualization/chart_types.py: current semantic chart metadata source - reuse or supersede deliberately."
  - "benchbox/core/visualization/ascii_runtime.py: runtime result-aware render dispatch - must be covered by the contract."
  - "benchbox/core/visualization/exporters.py: public data-first ASCII exporter - preserve, deprecate, or document partial coverage."
  - "benchbox/core/visualization/templates.py: chart bundles - keep validated against the registry."
  - "results-explorer/src/lib/chartRegistry.ts: browser chart registry - align ID parity without replacing UI components."
  - "benchbox/mcp/tools/discovery.py: MCP discovery metadata - decide whether partial chart lists are acceptable."
  - "textcharts.commands.registry.REGISTRY: external raw primitive registry - do not confuse primitive IDs with BenchBox semantic chart IDs."
  - "docs/reference/public-contracts.md: contract tier map - update for exported visualization APIs."

must_preserve:
  - "All existing chart IDs remain accepted by CLI and MCP unless a public-contract deprecation is documented."
  - "`power_bar` remains renderable from result-aware paths and remains included in templates that already reference it."
  - "Results Explorer chart ID parity stays synchronized with Python semantic chart IDs."
  - "Textcharts renderer imports remain lazy enough that command registration does not eagerly import heavy chart dependencies."
  - "Do not weaken current template validation."

approach: |
  Start with failing drift tests, then choose the smallest registry
  consolidation that makes those tests meaningful. Treat raw textcharts
  primitives and BenchBox semantic result-aware charts as different layers.
  Keep public/exported APIs compatible unless the contract map explicitly
  authorizes deprecation.

anti_patterns:
  - "DO NOT add another hand-maintained chart-type list to solve this."
  - "DO NOT make `chart_types.py` claim to be canonical if runtime dispatch can still drift silently."
  - "DO NOT delete `render_ascii_chart` only because in-repo production callers are absent; it is a lazy export."
  - "DO NOT derive BenchBox semantic chart IDs directly from textcharts primitive IDs without preserving names such as `performance_bar`, `query_heatmap`, and `power_bar`."

verification:
  - description: "Visualization registry parity tests pass."
    command: "uv run -- python -m pytest tests/unit/visualization/test_chart_type_registry.py tests/unit/core/visualization/test_chart_generator.py tests/unit/core/visualization/test_visualization_exporters.py -q"
    expected_output: "Registry, chart generator, and exporter compatibility tests pass with no chart-type drift."
  - description: "Results Explorer chart registry parity tests pass."
    command: "cd results-explorer && npm test -- --run src/__tests__/chartRegistry.meta.test.ts src/__tests__/chartRegistry.parity.test.ts"
    expected_output: "Explorer chart IDs match the Python semantic registry."
  - description: "Current registry runtime check has no unapproved drift."
    command: "uv run -- python - <<'PY'\nfrom benchbox.core.visualization.chart_types import ALL_CHART_TYPES\nfrom benchbox.core.visualization.ascii_runtime import _CHART_TYPE_DISPATCH\nprint(sorted(set(ALL_CHART_TYPES) - set(_CHART_TYPE_DISPATCH)))\nprint(sorted(set(_CHART_TYPE_DISPATCH) - set(ALL_CHART_TYPES)))\nPY"
    expected_output: "Both printed lists are empty."
  - description: "TODO graph remains valid after implementation."
    command: "uv run --project _project/scripts -- python _project/scripts/todo_cli.py validate && uv run --project _project/scripts -- python _project/scripts/todo_cli.py check-graph"
    expected_output: "TODO validation and graph checks pass."

