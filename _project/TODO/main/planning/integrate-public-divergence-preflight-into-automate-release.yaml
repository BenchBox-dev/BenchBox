must_preserve:
- The `cmd_status` CLI output remains usable (no breaking change for users running `benchbox-sync status` from the shell). Internal refactor only.
- The `compare_repos` function and `RepoComparison` dataclass (workflow.py:1048, :934) are unchanged - only consumed by the new function.
- The two-remote rule from CLAUDE.md - nothing in this work item should change push targets, default remotes, or the public/private rule.
- The existing source-side drift detection in `automate_release.py` (lines 1068, 1136-1140 - `sync_start_sha` and post-verify check) remains in place and unchanged.
- Default behaviour without `--allow-public-divergence` errs on the side of safety - aborting is the safe failure mode.

anti_patterns:
- DO NOT shell out to `benchbox-sync` as a subprocess - because the existing precedent (automate_release.py:43-49) already imports from benchbox.release; subprocess adds latency, hides errors, and complicates testing.
- DO NOT make check_public_repo_state mutate the target repo - because it is a preflight; even a fetch is questionable. Read-only only, so the user can rerun it safely as many times as they want.
- DO NOT change `cmd_push` or `cmd_pull` - because they are out of scope for this item; only `cmd_status` is being refactored to share logic with the new function.
- DO NOT default `--allow-public-divergence` to True - because the entire point is to fail loudly when external commits would be destroyed; opt-in is the safe default.
- DO NOT couple the divergence check to `--force-tag` - because they are different concerns (force-tag overwrites a local tag; divergence override accepts losing public commits); keep flags semantically distinct.

scope_limit:
  only_modify:
  - benchbox/release/sync.py
  - scripts/automate_release.py
  - tests/unit/release/test_release_sync_unit.py
  - tests/unit/test_release_scripts.py
  notes: |
    Do NOT touch:
    - benchbox/release/workflow.py (compare_repos and RepoComparison are stable)
    - scripts/prepare_release.py, finalize_release.py, build_release.py,
      verify_release.py (downstream of the new gate; no changes needed)
    - The HOLD_BACK_PATHS / ALLOWED_ROOT_FILES constants (orthogonal concern,
      handled in a separate TODO)
