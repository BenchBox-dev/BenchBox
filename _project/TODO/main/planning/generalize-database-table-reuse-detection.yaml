context_sections:
  Current Evidence: |
    As of 2026-05-26 on current develop, the original cited commit dbc84af27 is
    not resolvable in this checkout. Current code still shows the actionable
    pattern: ConnectionLifecycleMixin.handle_existing_database() sets
    database_was_reused=True immediately when skip_database_management=True;
    QuestDB overrides that path and checks expected table presence plus
    non-empty tables; InfluxDBSetupMixin.handle_existing_database() only warns
    for force_recreate=True; multiple live-test fixtures manually set
    skip_database_management=True on adapters outside QuestDB/InfluxDB.

  Adapter Compatibility Matrix: |
    | Adapter class | Current skip_database_management use | Required outcome |
    |---|---|---|
    | Base/default adapters | Base immediately marks reused | Preserve unless adapter explicitly opts into the hook |
    | QuestDBAdapter | Class sets skip_database_management=True and overrides handle_existing_database() | Migrate to the base hook while preserving table presence and non-empty checks |
    | InfluxDBAdapter | Setup override warns on force_recreate; live fixture sets skip_database_management=True | Preserve warning and add table-readiness validation through the hook |
    | Other live-test managed adapters | Fixtures may set skip_database_management=True for ClickHouse, Databend, PostgreSQL, Presto, Trino, Doris, SingleStore, and StarRocks | Do not start validating or connecting in the skip path unless those adapters opt in |

