impact:
  user_impact: |
    None - this is internal refactoring. The implementation must preserve
    existing runtime behavior for adapters that do not opt into the new hook.
  maintainer_impact: |
    Reduces duplication between QuestDB and InfluxDB adapters. Makes it
    easier for future managed-database adapters to get reuse detection right
    from the start.
  technical_debt: |
    Consolidates managed-database reuse decisions in the base lifecycle while
    keeping adapter-specific table-readiness checks local to the adapters that
    understand their metadata and row-presence semantics.

