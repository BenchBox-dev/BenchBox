id: dev-loop-step-3-ci-rebalance-and-strict-base-off
title: "Dev-loop simplification — Step 3: reduce non-required develop PR CI cost"
worktree: main
priority: High
status: In Progress
category: Core Functionality

description: |
  Step 0 invalidated the original strict-base diagnosis. `develop` has no
  classic branch protection object, and the active `develop-squash-only`
  ruleset already requires only `lint` and `test (ubuntu-latest, 3.12)`;
  `strict_required_status_checks_policy` is already `false`.

  The remaining load-bearing Step 3 work is CI-cost reduction, not branch
  protection. `.github/workflows/test.yml` still runs a broad non-required
  PR-tier workflow on pull requests to `develop`: a multi-version/OS test
  matrix, security, smoke/integration lanes, table-format checks, package
  install validation, parity, and non-blocking PySpark. The Step 0 baseline
  measured recent `Tests` runs at P50 16.70 minutes and P95 19.47 minutes.

  Replanned Step 3 should keep the existing required contexts unchanged and
  move or gate only non-required heavy lanes so ordinary `develop` PRs stop
  spending runner time on release-grade validation. Full validation must
  remain available through nightly and workflow_dispatch, and `main` PR/tag
  release coverage must remain release-grade.

  Designed-together follow-up: Step 3a (`dev-loop-step-3a-path-based-ci-skip`)
  remains valid after this replan. Step 3 reduces non-required job breadth for
  code PRs; Step 3a separately adds path-aware behavior for content-only PRs
  while preserving the already-minimal required contexts.

deps:
  needs:
    - dev-loop-step-0-verify-assumptions

work:
  - id: w1
    summary: "Reconfirm protection/ruleset state and classify PR-tier jobs by requirement status"
    status: done
    notes: |
      Start from `_project/decisions/dev-loop-verification-2026-04-30.md`,
      then re-read live GitHub state before editing workflows. Record:
        - Classic branch protection for `develop` remains absent or has no
          required-check drift.
        - Ruleset `develop-squash-only` still requires exactly `lint` and
          `test (ubuntu-latest, 3.12)`.
        - `strict_required_status_checks_policy` remains `false`.
        - Every job in `.github/workflows/test.yml` is classified as required,
          non-required PR-tier, push/main, label-gated, or manual/nightly.

      This is a gate for the rest of Step 3. If required contexts changed
      after Step 0, stop and re-evaluate rather than editing CI around stale
      assumptions.

      Implementation record (2026-04-30):
        - `gh api repos/joeharris76/BenchBox/branches/develop/protection`
          returned HTTP 404, so classic branch protection remains absent.
        - `gh api repos/joeharris76/BenchBox/rulesets/15611785` returned
          required status checks `lint` and `test (ubuntu-latest, 3.12)`;
          `strict_required_status_checks_policy` is `false`.
        - Required PR contexts: `lint` from `.github/workflows/lint.yml` and
          `test (ubuntu-latest, 3.12)` from the `Tests` matrix.
        - Non-required routine PR contexts in `.github/workflows/test.yml`:
          `test (ubuntu-latest, 3.10)`, `test (ubuntu-latest, 3.13)`,
          `test (macos-latest, 3.12)`, `test (windows-latest, 3.12)`,
          `test (windows-latest, 3.10)`, `check-test-patterns`, `security`,
          `integration-smoke` on Ubuntu and Windows, `integration-table-formats`,
          `test-package` on Ubuntu and Windows, `parity`, and `pyspark-tests`.
        - Label-gated/push-main context: `integration` runs on `push` or PRs
          carrying `run-integration`; it is skipped for ordinary develop PRs.
        - Manual/nightly broad validation does not exist yet; Step 3 must add
          it before removing non-required routine PR lanes.

  - id: w2
    summary: "Design the develop PR trigger policy for non-required test.yml jobs"
    status: done
    needs: [w1]
    notes: |
      Choose the smallest maintainable workflow shape that keeps the two
      required contexts stable. The default recommendation is:
        - Keep `lint` in its existing workflow.
        - Keep `test (ubuntu-latest, 3.12)` reporting under the existing Tests
          workflow/job identity for code PRs.
        - Remove, split, or job-gate non-required develop PR lanes from the
          routine `pull_request` path.
        - Preserve label-gated/manual execution for heavier checks when a PR
          intentionally needs them.

      Prefer a clear workflow split (`test.yml` for PR-tier required checks,
      `nightly.yml` for broad validation) over repeating fragile job-level
      conditions everywhere. If a split would break required check names,
      use targeted conditions instead and document why.

      Implementation record (2026-04-30):
        - Kept `.github/workflows/lint.yml` unchanged so the required `lint`
          context stays stable.
        - Replaced the broad `test` matrix with one explicit required job named
          `test (ubuntu-latest, 3.12)`, preserving the required context while
          avoiding matrix evaluation for routine develop PRs.
        - Added `compat-test` for non-required OS/Python combinations on
          main/push surfaces.
        - Added develop-PR gates to non-required `test.yml` jobs:
          `compat-test`, `check-test-patterns`, `security`,
          `integration-smoke`, `integration-table-formats`, `test-package`,
          `parity`, and `pyspark-tests`.
        - Left `integration` label-gated as-is so `run-integration` can still
          opt a PR into the heavier integration lane intentionally.

  - id: w3
    summary: "Move broad validation to nightly/workflow_dispatch without losing coverage"
    status: done
    needs: [w2]
    notes: |
      Add or update `.github/workflows/nightly.yml` so the jobs removed from
      routine develop PRs still run on:
        - `workflow_dispatch`
        - a low-contention nightly schedule

      The nightly/manual path should cover the multi-OS/Python matrix,
      integration smoke and table-format checks, package install validation,
      parity, security audit, and PySpark lane unless w1 finds a specific lane
      belongs somewhere else. Use existing commands and dependency setup from
      `test.yml`; do not invent a parallel test stack.

      If failure issue automation is added, keep it narrow and idempotent:
      one open issue per failing nightly class, labeled `incident:nightly-red`,
      with the run URL and failing job names. If that automation is too large
      for this PR, defer it explicitly and ensure nightly failures are still
      visible through GitHub notifications.

      Implementation record (2026-04-30):
        - Added `.github/workflows/nightly.yml` with `workflow_dispatch` and a
          daily 06:00 UTC schedule.
        - Nightly coverage includes the full OS/Python fast-test matrix,
          patch-safety check, security audit, integration smoke,
          table-format integration, full local integration, package install,
          parity, and non-blocking PySpark lanes.
        - Reused the existing `uv` setup and test commands from `test.yml`.
        - Deferred automatic issue creation to keep this PR scoped; failures
          remain visible through GitHub Actions notifications and manual
          workflow dispatch is available for reruns.

  - id: w4
    summary: "Preserve main PR and tag-release validation semantics"
    status: pending
    needs: [w2, w3]
    notes: |
      Audit `.github/workflows/test.yml`, `.github/workflows/nightly.yml`, and
      `.github/workflows/release.yml` after the split/gating work. Confirm
      `pull_request` to `main` and `push`/tag release paths still run
      release-grade coverage automatically, not only through nightly:
        - Full OS/Python compatibility coverage remains on a main/release path.
        - Package build/install validation remains on a main/release path.
        - Release-flow checks are unchanged.

      A comment in the workflow is acceptable when it prevents future drift,
      but avoid comment-only churn unless it clarifies a real branch-specific
      invariant.

  - id: w5
    summary: "Update agent docs for the replanned CI contract"
    status: pending
    needs: [w2, w3, w4]
    notes: |
      Update `CLAUDE.md` and `AGENTS.md` only where the workflow contract is
      wrong or incomplete. The guidance should say:
        - Develop required checks are already minimal: `lint` and
          `test (ubuntu-latest, 3.12)`.
        - Strict-base is already off for `develop`; do not describe Step 3 as
          a strict-base deployment.
        - Heavy non-required lanes moved out of routine develop PR execution
          remain available through nightly/workflow_dispatch or explicit labels.
        - `main` PRs and tag releases retain release-grade validation.
        - `make pr-refresh` remains an escape hatch for genuine branch drift;
          do not deprecate it solely because strict-base was already off.

  - id: w6
    summary: "Verify locally, review the change, and open the PR"
    status: pending
    needs: [w1, w2, w3, w4, w5]
    notes: |
      Run focused workflow/TODO validation first, then the repo preflight
      appropriate to the code touched. For workflow-only changes, at minimum:
        - YAML validation on edited workflow and TODO files
        - `uv run --project _project/scripts -- python _project/scripts/todo_cli.py check-graph`
        - `make pr-preflight`
        - `/code review W6` or equivalent adversarial review of the diff
        - `make pr-open`

      The PR description must state that no branch-protection or ruleset PATCH
      is part of Step 3 because Step 0 already proved the desired required
      contexts and strict-base setting are live on `develop`.

verification:
  - description: "Develop ruleset still has strict-base off with only the two lightweight required contexts"
    command: "gh api repos/joeharris76/BenchBox/rulesets/15611785 --jq '.rules[] | select(.type == \"required_status_checks\") | .parameters'"
    expected_output: "strict_required_status_checks_policy is false; required_status_checks are lint and test (ubuntu-latest, 3.12)"
  - description: "Classic branch protection is absent or has no conflicting required-check policy"
    command: "gh api repos/joeharris76/BenchBox/branches/develop/protection --jq '.required_status_checks' 2>/dev/null || echo classic-protection-not-configured"
    expected_output: "classic-protection-not-configured OR no broader/strict required checks"
  - description: "Routine develop PR Tests workflow no longer queues broad non-required lanes"
    command: "branch=$(git branch --show-current); run_id=$(gh run list --workflow test.yml --branch \"$branch\" --event pull_request --limit 1 --json databaseId --jq '.[0].databaseId'); gh run view \"$run_id\" --json jobs --jq '[.jobs[] | select(.conclusion != \"skipped\") | .name] | sort[]'"
    expected_output: "Only non-skipped required/lightweight develop PR job names, plus any explicitly documented lightweight umbrella/content jobs"
  - description: "Nightly/manual workflow exists and is active for broad validation"
    command: "gh workflow list --json name,state,path --jq '.[] | select((.name | test(\"nightly|Nightly\")) or (.path | test(\"nightly\")))'"
    expected_output: "nightly workflow exists and state is active"
  - description: "Main PR and release paths still expose full validation coverage"
    command: "rg -n 'pull_request:|branches:|main|tags:|matrix:|macos-latest|windows-latest|test-package|release' .github/workflows/test.yml .github/workflows/nightly.yml .github/workflows/release.yml"
    expected_output: "main/tag release validation paths and full validation lanes are present outside nightly-only execution"
  - description: "Agent docs describe the current CI contract without stale strict-base/deprecation claims"
    command: "rg -n 'strict-base|strict|required checks|nightly|workflow_dispatch|release-grade|pr-refresh' CLAUDE.md AGENTS.md"
    expected_output: "docs state strict-base is already off, required checks are minimal, nightly/manual carries heavy validation, and pr-refresh remains an escape hatch"

must_preserve:
  - "The develop required contexts remain exactly `lint` and `test (ubuntu-latest, 3.12)` unless a separate Step 3a deployment explicitly changes the ruleset required-check list"
  - "No Step 3 branch-protection or ruleset PATCH; Step 0 already found the intended strict-base and required-check state live"
  - "Full validation for main PRs and tag releases remains release-grade and must not be lightened as a side effect of reducing develop PR cost"
  - "Heavy checks removed from routine develop PR execution remain runnable through nightly/workflow_dispatch or an explicit opt-in label"
  - "`make pr-refresh` remains available as an escape hatch for real branch drift; Step 3 must not remove or deprecate it based on the stale strict-base premise"

approach: |
  Treat Step 3 as a workflow routing change. Required checks are already
  minimal, so the implementation should not touch GitHub protection/ruleset
  settings. The highest-risk design point is check-name stability: GitHub
  required contexts are name-sensitive, and Step 3a may later add an umbrella
  result check. Keep the existing required context names stable during Step 3
  unless the implementation deliberately leaves rulesets untouched and proves
  GitHub still reports the required checks.

  Prefer moving whole non-required lanes to a nightly/manual workflow over
  sprinkling branch conditions through every job. A split workflow makes
  ownership visible: routine develop PR checks prove fast code health, while
  nightly/manual checks preserve compatibility and release confidence. If a
  job must stay in `test.yml` for status-name compatibility, gate it narrowly
  and document the reason next to the condition.

anti_patterns:
  - "DO NOT patch develop branch protection or rulesets in Step 3 — because Step 0 already found strict-base false and required checks reduced — record the live state and leave it unchanged"
  - "DO NOT deprecate or remove `make pr-refresh` in Step 3 — because the old rationale was stale strict-base churn — keep it as a rare branch-drift escape hatch"
  - "DO NOT lighten main PR or tag-release validation — because main is release-only and tags publish artifacts — preserve release-grade coverage there"
  - "DO NOT delete heavy checks outright — because moved checks still catch compatibility regressions — keep them in nightly/workflow_dispatch or an explicit opt-in lane"
  - "DO NOT introduce many copy-pasted branch conditions without a design note — because future jobs will drift — prefer split workflows or a small documented condition pattern"
  - "DO NOT block Step 3 on Step 3a's path umbrella — because content-only skip is a separate follow-up — keep Step 3 scoped to non-required job cost"

scope_limit:
  only_modify:
    - ".github/workflows/test.yml"
    - ".github/workflows/nightly.yml (new or updated)"
    - ".github/workflows/release.yml (audit/comment only if needed)"
    - "CLAUDE.md (CI guidance only)"
    - "AGENTS.md (CI guidance only)"
    - "_project/TODO/main/planning/dev-loop-step-3-ci-rebalance-and-strict-base-off.yaml (replan only)"
  do_not_modify:
    - "GitHub branch protection / rulesets (read-only verification only)"
    - "Makefile pr-refresh, pr-open, pr-fanout, and worktree targets"
    - ".github/workflows/develop-post-merge.yml (Step 4 owns this)"
    - ".github/workflows/lint.yml unless w1 proves required-check naming requires it"
    - ".pre-commit-config.yaml (Step 1 owns pre-push gating)"
    - "tests/ (no product test changes for CI routing)"

deferred:
  - summary: "Step 3a path-aware required-check umbrella"
    reason: "Separate TODO already exists and must preserve the required contexts once Step 3's CI routing is stable."
  - summary: "Native GitHub Merge Queue migration"
    reason: "Step 6 territory, and Step 0 found no current strict-base re-CI pain plus no exposed merge-queue rule for this user-owned repository."
  - summary: "Self-hosted runner adoption"
    reason: "Could reduce cost, but adds operational burden. Revisit only if Step 5 runner-minute metrics justify it."

metadata:
  tags:
    - dev-loop
    - ci
    - workflows
  estimated_effort: "Medium (1-2h after replan; no branch-protection deployment)"
  created_date: "2026-04-30"

impact:
  user_impact: |
    Ordinary develop PRs should spend less time in non-required CI while still
    keeping the existing required `lint` and Ubuntu 3.12 fast-test gate. Agents
    should see less runner noise without needing any branch-protection change.
  business_value: |
    Reduces routine PR runner minutes by moving release-grade breadth to
    scheduled/manual validation, while preserving confidence for main and tag
    release paths.
  technical_debt: |
    Some compatibility regressions may be discovered on nightly/manual runs
    instead of on every develop PR. The mitigation is visibility: nightly must
    stay active, discoverable, and easy to re-run before risky merges.

success_metrics:
  - "P50 develop PR Tests workflow duration drops materially from the Step 0 baseline of 16.70 minutes"
  - "Develop required contexts remain `lint` and `test (ubuntu-latest, 3.12)` with strict-base false"
  - "Nightly/workflow_dispatch broad validation runs successfully and is visible to maintainers"
  - "No release workflow or main PR validation coverage is lost"

open_questions:
  - "Should nightly failure issue automation be included in Step 3 or deferred if it makes the PR too broad? Default: include only if small and idempotent."
  - "Should security audit remain on every develop PR despite being non-required? Default: classify in w1 and keep on PR only if current runtime/risk justifies it."
