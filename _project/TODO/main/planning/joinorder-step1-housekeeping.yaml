    contract coherent, and records the scale_factor breaking-change decision --
    small debts that otherwise linger and confuse the next contributor.
  user_impact: |
    Accurate CLI memory/time estimates for the now-large joinorder run; a
    coherent story for whether joinorder_synthetic shows up in the wizard; a
    clear migration note for anyone whose scripts passed a sub-scale.
  technical_debt: |
    Clears six small post-cutover loose ends; surfaces (without fixing) the
    data_fetch concurrent-download race for proper triage.

success_metrics:
  - "csv_delimiter/csv_null_marker and the stale generator comment are gone from the canonical JoinOrderBenchmark, with no load-path regression"
  - "benchbox/cli/benchmarks.py memory/time estimates for joinorder reflect the canonical dataset and joinorder_synthetic has its own entries"
  - "The interactive CLI wizard's handling of surface=internal is decided, implemented, tested, and the meaning of 'internal' is documented at get_benchmark_surface"
