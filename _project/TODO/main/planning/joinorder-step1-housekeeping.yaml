open_questions:
  - question: "Should the interactive `benchbox` CLI wizard hide surface=internal benchmarks (filter joinorder_synthetic), or is 'internal' defined as MCP/explorer-only?"
    gating: false
    affects: ["w3"]
    default: "Filter the wizard (option i) -- it matches MCP/explorer behavior and keeps the surface contract simple; joinorder_synthetic stays runnable by explicit --benchmark"
  - question: "Add a one-release warn-and-ignore deprecation shim for JoinOrder(scale_factor < 1), or just record the hard-raise as accepted for the beta?"
    gating: false
    affects: ["w6"]
    default: "Record the hard-raise as accepted (no shim) -- 0.2.x is beta and the alternative path (joinorder_synthetic) is documented"
