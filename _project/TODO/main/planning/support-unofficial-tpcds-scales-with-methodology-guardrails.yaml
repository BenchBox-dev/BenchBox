context_sections:
  "Key Findings": |
    The current codebase does not merely prefer official TPC-DS scales. It
    explicitly documents that the native generator crashes below 1.0 in the
    benchmark registry, benchmark runner, generator manager, and tests. The
    existing `examples/data/tpcds_sf001/` directory is only a placeholder, not
    usable bundled sample data.

    The wider system also assumes comparability too early: result building,
    schema export, CLI summaries, ranking queries, publication metadata, and
    report import do not model unofficial-vs-official TPC-DS as a first-class
    distinction.
  "Decision Boundaries": |
    This item is not approved to merge until Gate Zero documents whether native
    subscale generation is real and what the resulting table contract is. If the
    probe disproves the premise, implementation stops and the follow-up path is
    handled as separate work.

technical_requirements:
  constraints:
  - "Do not merge behavior changes before Gate Zero is documented."
  - "Keep official comparable TPC-DS behavior unchanged for existing workflows."
  - "Carry methodology/comparability through export, import, storage, ranking, and publication."
  - "Preserve existing scale token formatting; add an unofficial marker instead of a new token scheme."

success_metrics:
- "BenchBox can only produce unofficial TPC-DS scale artifacts after explicit user opt-in and after the native-generation path is empirically validated."
- "Unofficial TPC-DS runs are durably marked and isolated across JSON export, import, database storage, publication metadata, and historical rankings."
- "Official TPC metrics are suppressed or rendered non-comparable for unofficial TPC-DS runs, while official TPC-DS workflows remain unchanged."
- "Validation behavior for unofficial subscale runs matches the documented table contract derived from Gate Zero."

open_questions:
- "Do all bundled `dsdgen` binaries actually complete successfully at 0.01, 0.1, and 0.5, or do some platforms require a separate fallback project?"
- "For unofficial subscale runs, which TPC-DS tables are mandatory, optional-empty, or expected to be absent according to actual generator output?"
- "Should plain non-official `sf>=1` TPC-DS runs remain allowed by default outside `--official`, or should the new opt-in cover all non-official scales?"

research_value:
  hypothesis: |
    BenchBox can support unofficial TPC-DS scales for local developer workflows
    without corrupting official comparability, but only if the native data path
    is proven viable and the resulting methodology is carried through the full
    result/report/storage pipeline as a first-class distinction.
  validation_approach: |
    Use an empirical binary probe to establish feasibility, then implement the
    minimal cross-cutting changes required to persist and enforce that
    distinction across generation, validation, export, import, ranking, and
    publication.
  success_criteria: |
    The feature is considered proven only when the empirical probe is published,
    the result pipeline preserves methodology/comparability end-to-end, and no
    report, publication, or ranking surface can silently present unofficial
    TPC-DS runs as official comparable cohorts.
