id: uat-clickhouse-server-rc1-recovery
title: "Recover ClickHouse-server UAT RC-1 after confirmed localhost:9000 refusal"
worktree: main
priority: High
status: Identified
category: Platform Expansion

description: |
  RC-1 is the clickhouse-server UAT wipeout: the 2026-05-31 retry artifacts
  show 57/57 clickhouse-server cells failed with `terminal_state=no_json_nonzero`
  and empty `failure_tail`, so the original run did not expose the actionable
  error.

  Re-run on 2026-06-01 after the stderr-visible diagnostic fix confirmed the
  real failure for the smallest cell:

    BENCHBOX_OUTPUT_DIR=~/Developer/benchmark_runs \
      LOG_DIR=~/Developer/benchmark_runs/logs/clickhouse-server-rc1-repro-20260601 \
      TIMEOUT_S=90 make uat-cell PLATFORM=clickhouse-server BENCHMARK=tpch SCALE=0.01

  Result: failed in 33.96s, log
  `~/Developer/benchmark_runs/logs/clickhouse-server-rc1-repro-20260601/clickhouse-server_tpch_0.01_20260601_103610.log`
  captured `Code: 210. Connection refused (localhost:9000)`. `nc -vz
  localhost 9000` and `localhost 8123` also returned connection refused.

  The missing-extra hypothesis was checked and is not the observed failure in
  this worktree: `clickhouse-driver` is installed and the diagnostic reached
  the driver connection path. The UAT argv is still hardened separately so
  clickhouse-server uses its canonical uv extra instead of relying on whatever
  the current environment has installed.

  Follow-up live repro on 2026-06-01 found three additional server-specific
  blockers after Docker was healthy: the local compose stack required an
  explicit host-accessible password, the adapter selected `database=default`
  before creating it, and ClickHouse server mode attempted to load Docker-host
  paths through server-side `file()`, which is limited to
  `/var/lib/clickhouse/user_files`. After those fixes plus removal of
  session-resetting unsupported `SET` statements, the smallest live cell passed:

    CLICKHOUSE_HOST_PORT=19000 CLICKHOUSE_HTTP_HOST_PORT=18123 \
      BENCHBOX_OUTPUT_DIR=~/Developer/benchmark_runs \
      LOG_DIR=~/Developer/benchmark_runs/logs/clickhouse-server-rc1-repro-20260601 \
      TIMEOUT_S=600 make uat-cell PLATFORM=clickhouse-server BENCHMARK=tpch SCALE=0.01

  Result: passed in 10.24s with `submit_terminal_state=submittable`, log
  `~/Developer/benchmark_runs/logs/clickhouse-server-rc1-repro-20260601/clickhouse-server_tpch_0.01_20260601_114205.log`,
  and result
  `~/Developer/benchmark_runs/results/tpch_sf001_clickhouse_server_sql_20260601_114215_e1a77de5.json`.

  Post-fix corpus verification on 2026-06-01 ran the original 57-cell
  clickhouse-server non-OLTP surface under UAT-managed Docker lifecycle:

    CLICKHOUSE_HOST_PORT=19000 CLICKHOUSE_HTTP_HOST_PORT=18123 \
      BENCHBOX_OUTPUT_DIR=~/Developer/benchmark_runs \
      make uat-sweep CONFIG=/tmp/uat-clickhouse-server-rc1-corpus-20260601.yaml

  Artifacts:
    `~/Developer/benchmark_runs/logs/uat_clickhouse_server_rc1_corpus_20260601/matrix_summary.tsv`
    `~/Developer/benchmark_runs/logs/uat_clickhouse_server_rc1_corpus_20260601/cells.jsonl`
    `~/Developer/benchmark_runs/logs/uat_clickhouse_server_rc1_corpus_20260601/uat_lifecycle.log`
    `/tmp/uat-clickhouse-server-rc1-corpus-20260601.outer.log`

  The corpus executed all 57 candidate cells with no compatibility or
  early-stop pruning. Summary footer: `passed=15 failed=40 timed_out=2`,
  `run_status=COMPLETED`, `source_dirty=false`. Docker lifecycle recorded
  project-scoped clickhouse-server up/down success. The original RC-1 total
  wipeout is therefore fixed; remaining failures are benchmark-specific
  loader, DDL, query, data-availability, and timeout issues routed to
  follow-up TODOs.

prior_art:
  - "docs/operations/uat-local-provisioning.md: clickhouse-server is an automated Docker-backed platform at localhost:9000; use make uat-bring-up PLATFORM=clickhouse-server"
  - "docs/operations/uat-framework.md: managed Docker sweeps start project-scoped compose stacks and tear them down with docker_manage_platforms=true"
  - "tests/uat/docker_assets.py: clickhouse-server compose metadata and service port 9000 are already registered"
  - "tests/uat/matrix.py: platform uv extras are centralized in PLATFORM_UV_EXTRA"
  - "_project/TODO/main/planning/uat-docker-stack-recovery.yaml: broader Docker-stack recovery owns LakeSail/OLTP ordering and must not be duplicated"

work:
  - id: w0
    summary: "Preserve the diagnostic evidence and classify the observed failure"
    status: done
    notes: |
      Evidence points to an unavailable ClickHouse service on localhost:9000,
      not a query/DDL/data-load bug and not a missing driver in the current
      worktree. The diagnostic re-run also proved the stderr capture fix is
      effective for this failure class.
  - id: w1
    summary: "Make clickhouse-server UAT invocations self-contained on the canonical uv extra"
    status: done
    notes: |
      Update PLATFORM_UV_EXTRA so clickhouse-server cells run through
      `uv run --extra clickhouse-server --`, matching the platform's public
      installation contract and avoiding environment-dependent driver presence.
  - id: w2
    summary: "After Docker CLI is healthy, bring up the ClickHouse stack and rerun the smallest cell"
    needs: [w1]
    status: done
    notes: |
      Docker recovered after launching Docker Desktop. A UAT-owned compose
      project was run on alternate host ports (`19000/18123`) to avoid the
      existing debug container on `9000/8123`. The smallest server-backed cell
      now passes with a submittable manifest:

        ~/Developer/benchmark_runs/logs/clickhouse-server-rc1-repro-20260601/clickhouse-server_tpch_0.01_20260601_114205.log
        ~/Developer/benchmark_runs/results/tpch_sf001_clickhouse_server_sql_20260601_114215_e1a77de5.json

      Root causes fixed in the live path: local compose auth/port propagation,
      missing database bootstrap, host-local data loading for Docker-backed
      server mode, type conversion for clickhouse-driver INSERT batches, and
      legacy unsupported ClickHouse `SET` statements resetting session cache
      controls before validation.
  - id: w3
    summary: "If the smallest cell passes, rerun the clickhouse-server fast Docker corpus into a fresh run root"
    needs: [w2]
    status: done
    notes: |
      Completed on 2026-06-01 with a temporary corpus config at
      `/tmp/uat-clickhouse-server-rc1-corpus-20260601.yaml`. The config used
      UAT-managed Docker lifecycle, alternate host ports (`19000/18123`), the
      `clickhouse-server` platform include, all non-OLTP benchmarks, scales
      `0.01/0.1/1.0`, and `load,power` execution phases.

      Evidence:

        ~/Developer/benchmark_runs/logs/uat_clickhouse_server_rc1_corpus_20260601/matrix_summary.tsv
        ~/Developer/benchmark_runs/logs/uat_clickhouse_server_rc1_corpus_20260601/cells.jsonl
        ~/Developer/benchmark_runs/logs/uat_clickhouse_server_rc1_corpus_20260601/uat_lifecycle.log
        /tmp/uat-clickhouse-server-rc1-corpus-20260601.outer.log

      Matrix footer: 57 candidates, 57 executed, 15 passed, 40 failed,
      2 timed out, 0 compatibility pruned, 0 early-stop pruned,
      `run_status=COMPLETED`, `source_dirty=false`. Lifecycle logs show
      clickhouse-server Docker up/down succeeded and no UAT compose project
      remained after teardown. This satisfies the RC-1 metric: the platform no
      longer has a 57/57 total wipeout. Follow-up failures are tracked in
      `uat-clickhouse-server-loader-type-coverage`,
      `uat-clickhouse-server-ddl-compatibility`,
      `uat-clickhouse-server-query-compatibility`, and
      `uat-clickhouse-server-data-and-timeout-tail`.

deps:
  needs: []

must_preserve:
  - "Do not duplicate or undo uat-docker-stack-recovery's broader Docker lifecycle work."
  - "Do not run unqualified Docker cleanup; use UAT-owned project-scoped cleanup only."
  - "Keep ClickHouse server mode on native TCP port 9000 unless the compose mapping changes and the registry derives a new host port."

approach: |
  Treat this as a provisioning/lifecycle recovery, not a SQL compatibility
  fix. The first gate is service reachability on localhost:9000. Only after a
  healthy server-backed tpch SF=0.01 cell passes or fails later in the run
  should any ClickHouse adapter/query changes be considered.

anti_patterns:
  - "DO NOT hide the connection-refused failure as generic no_json_nonzero again; keep the diagnostic tail in the evidence."
  - "DO NOT mark RC-1 fixed from a clickhouse-local result; this TODO is specifically for clickhouse-server."
  - "DO NOT restart or prune the Docker daemon while other UAT agents are active without coordination."

verification:
  - description: "UAT argv uses the canonical clickhouse-server extra"
    command: "uv run -- python -m pytest tests/uat/test_matrix.py::test_uv_run_argv_clickhouse_server_uses_canonical_extra -q"
    expected_output: "test passes"
  - description: "ClickHouse server stack is reachable before rerunning the corpus"
    command: "BENCHBOX_OUTPUT_DIR=~/Developer/benchmark_runs make uat-bring-up PLATFORM=clickhouse-server && nc -vz localhost 9000"
    expected_output: "make succeeds and nc reports an open localhost:9000 endpoint"
  - description: "Smallest server-backed cell no longer fails at connection setup"
    command: "BENCHBOX_OUTPUT_DIR=~/Developer/benchmark_runs make uat-cell PLATFORM=clickhouse-server BENCHMARK=tpch SCALE=0.01"
    expected_output: "cell passes or fails later than connection setup with a captured ClickHouse-specific tail"

