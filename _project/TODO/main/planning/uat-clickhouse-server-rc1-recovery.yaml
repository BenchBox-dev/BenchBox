success_metrics:
  - "clickhouse-server UAT cells use `uv run --extra clickhouse-server --`."
  - "A fresh clickhouse-server tpch SF=0.01 UAT cell reaches a running service instead of localhost:9000 connection refused."
  - "A fresh clickhouse-server tpch SF=0.01 UAT cell passes with `submit_terminal_state=submittable`."
  - "The follow-up clickhouse-server corpus rerun produces non-empty cells.jsonl and no 57/57 platform wipeout."

