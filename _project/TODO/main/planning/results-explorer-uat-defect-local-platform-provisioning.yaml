id: results-explorer-uat-defect-local-platform-provisioning
title: "UAT defect: local platform provisioning readiness is unclear"
worktree: main
priority: "Medium"
status: "Not Started"
category: "Developer Experience"

description: |
  The UAT sweep skipped 870 TCP-backed SQL cells because local service ports were
  unreachable. Lakesail also failed every first-rung cell due missing `pysail`
  and no Sail server at `sc://localhost:50051`, and Modin failed immediately due
  missing runtime dependencies. These are environment/provisioning issues, not
  benchmark query failures, but the local user path does not make that boundary
  obvious enough.

work:
- id: w1
  summary: "Inventory exact provisioning checks for TCP services, Lakesail, and Modin"
  status: pending
- id: w2
  summary: "Add or improve readiness diagnostics and documentation"
  needs: [w1]
  status: pending
- id: w3
  summary: "Verify unreachable/missing-runtime paths are classified as environment skips"
  needs: [w2]
  status: pending

verification:
- description: "Platform readiness/help checks terminate and classify missing services cleanly."
  command: "uv run -- python -m pytest tests -k 'platform and readiness' -q"
  expected_output: "selected readiness tests pass"
- description: "Fast tests remain green."
  command: "uv run -- python -m pytest -m fast -q"
  expected_output: "all selected tests pass"

must_preserve:
- "The CLI must not start, stop, or mutate local services without explicit user action."
- "Missing optional runtimes remain non-fatal to base BenchBox installs."

anti_patterns:
- "DO NOT turn missing TCP services into benchmark failures -- because the benchmark was never run -- classify them as local environment readiness gaps."

metadata:
  tags: [uat, provisioning, local-platforms]
  created_date: "2026-05-03"
