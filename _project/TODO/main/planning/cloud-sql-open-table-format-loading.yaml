id: cloud-sql-open-table-format-loading
title: "Add delta loading to Redshift and BigQuery adapters"
worktree: main
priority: Medium
status: Not Started
description: |
  Redshift and BigQuery both support Delta Lake on the platform but their BenchBox
  adapters only load parquet/CSV.  These platforms were removed from DELTA_CAPABILITY
  in format_capabilities.py (commit 9be7d5b70) to prevent the fail-fast check from
  passing when loading would fail.

  Platform mechanisms:
  - Redshift: Delta via Redshift Spectrum + AWS Lake Formation.  Requires Glue catalog
    integration to register Delta tables as external tables.
  - BigQuery: Delta via BigLake external tables (GA since mid-2024).  Requires BigLake
    connection + external table definition pointing to GCS Delta directory.

  Both require significant cloud service integration beyond simple SQL.

category: Platform Expansion

deps:
  needs: []

work:
  - id: w1
    summary: "Add Delta loading to Redshift adapter via Spectrum + Glue"
    status: pending
    details: |
      Extend redshift.py load_data to detect Delta format (_delta_log/ marker) and
      register as Glue table + Spectrum external table.  Requires Glue client
      integration and IAM role configuration.

  - id: w2
    summary: "Add Delta loading to BigQuery adapter via BigLake"
    status: pending
    details: |
      Extend bigquery.py load_data to detect Delta format and create BigLake external
      table with DELTA format type.  Requires BigLake connection resource.

  - id: w3
    summary: "Re-register Redshift and BigQuery in format_capabilities.py"
    needs: [w1, w2]
    status: pending
    details: |
      After loading code is tested:
      - Add redshift and bigquery back to DELTA_CAPABILITY
      - Update PLATFORM_FORMAT_PREFERENCES to include delta
      - Update test_format_capabilities.py assertions

  - id: w4
    summary: "Unit tests for Redshift and BigQuery Delta loading"
    needs: [w1, w2]
    status: pending
    details: |
      Mock-based tests verifying format detection and SQL/API generation for Delta
      loading on both platforms.

deferred:
  - id: d1
    summary: "Integration tests with real Redshift/BigQuery instances"
    reason: "Requires cloud credentials and running instances"
  - id: d2
    summary: "Iceberg support for Redshift (via Spectrum) and BigQuery (via BigLake)"
    reason: "Lower priority than Delta; both platforms have evolving Iceberg support"

must_preserve:
  - "Redshift parquet/CSV COPY loading path must remain unchanged"
  - "BigQuery parquet GCS load job path must remain unchanged"
  - "format_capabilities.py fail-fast check: only re-register after loading code works"

approach: |
  Redshift Delta: Register Delta table in AWS Glue catalog, then create Redshift
  Spectrum external table referencing the Glue table.  Requires IAM role with Glue
  and S3 permissions.

  BigQuery Delta: Create BigLake external table with Delta format.  Requires BigLake
  connection resource and GCS bucket access.

  Both implementations are cloud-specific and require careful credential/permission
  handling.

anti_patterns:
  - "DO NOT register platforms in format_capabilities.py before loading code is tested -- because the fail-fast check will pass but load will fail at runtime -- implement and test first"
  - "DO NOT hardcode cloud credentials or ARNs -- because these vary per deployment -- use adapter config/credentials pattern"

verification:
  - description: "Redshift and BigQuery adapter tests pass"
    command: "uv run -- python -m pytest tests/unit/platforms/ -v -k 'redshift or bigquery' --no-header -q"
    expected_output: "All tests pass"
  - description: "Format capabilities tests pass with re-registered platforms"
    command: "uv run -- python -m pytest tests/unit/platforms/base/test_format_capabilities.py -v --no-header -q"
    expected_output: "All tests pass"

scope_limit:
  only_modify:
    - "benchbox/platforms/redshift.py"
    - "benchbox/platforms/bigquery.py"
    - "benchbox/platforms/base/format_capabilities.py"
    - "tests/unit/platforms/"
