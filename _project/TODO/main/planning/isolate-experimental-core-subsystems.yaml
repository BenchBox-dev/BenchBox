id: isolate-experimental-core-subsystems
title: "Move 5 experimental subsystems out of benchbox/core/ into an explicit experimental namespace"
worktree: main
priority: High
status: Not Started
category: Architecture
description: |
  Five subsystems live under `benchbox/core/` but are not in the supported
  benchmark registry, have no CLI integration, and are not exported from the
  main `benchbox` module:

  | Subsystem          | Path                          | External Consumers |
  |--------------------|-------------------------------|--------------------|
  | NL2SQL             | benchbox/core/nl2sql/         | Zero               |
  | AIML Functions     | benchbox/core/aiml_functions/ | Zero               |
  | Multi-Region       | benchbox/core/multiregion/    | Zero               |
  | GPU Infrastructure | benchbox/core/gpu/            | cudf.py (1)        |
  | Concurrency        | benchbox/core/concurrency/    | Zero               |

  Their placement under `core/` makes them look productized. Move them under
  `benchbox/experimental/` so the namespace signals their status.

  GPU is the only coupling wrinkle: `benchbox/platforms/cudf.py` imports from
  `benchbox.core.gpu`, so that import must be updated to
  `benchbox.experimental.gpu`.

metadata:
  tags:
  - architecture
  - experimental
  - scope-review
  estimated_effort: "Medium"
  created_date: "2026-03-12"
  source_review: "Orthogonal functionality review finding #2"

future_state:
  readme: "docs/design/future-state/isolate-experimental-core-subsystems/README.md"

impact:
  user_impact: |
    None for supported workflows. Experimental subsystems are not in the
    registry and have no CLI paths. Users who import them directly (unlikely)
    will need to update imports.
  maintainer_impact: |
    Clear rule for where prototypes live. Future experimental code goes under
    `benchbox/experimental/` instead of `benchbox/core/`.
  packaging_impact: |
    No dependency changes. The experimental namespace ships in the wheel
    alongside core. Public exports and registries are unaffected.
  regression_risk: |
    Low-moderate. The move is a rename operation. GPU → cudf.py is the only
    cross-module coupling. Tests under tests/unit/core/{nl2sql,aiml_functions,
    gpu,multiregion,concurrency}/ will need path updates.

justification: |
  Placing prototypes under the same namespace as supported benchmarks blurs
  the product boundary. A `benchbox.experimental` namespace makes the status
  explicit with minimal effort.

cost_benefit_analysis:
  expected_benefits: |
    High. The benchmark registry, package exports, and code layout become more
    coherent. Contributors gain a clear rule for where prototypes live.
  expected_costs: |
    Medium. Module renames ripple into tests and the cudf.py platform adapter.
    No compatibility shims needed because these modules have zero-to-one
    external consumers.
  recommendation: |
    Proceed. Rename the 5 directories, update cudf.py, update tests.

files_affected:
  modified:
  - "benchbox/platforms/cudf.py"
  - "tests/unit/core/nl2sql/"
  - "tests/unit/core/aiml_functions/"
  - "tests/unit/core/gpu/"
  - "tests/unit/core/multiregion/"
  moved:
  - from: "benchbox/core/nl2sql/"
    to: "benchbox/experimental/nl2sql/"
  - from: "benchbox/core/aiml_functions/"
    to: "benchbox/experimental/aiml_functions/"
  - from: "benchbox/core/multiregion/"
    to: "benchbox/experimental/multiregion/"
  - from: "benchbox/core/gpu/"
    to: "benchbox/experimental/gpu/"
  - from: "benchbox/core/concurrency/"
    to: "benchbox/experimental/concurrency/"
  added:
  - "benchbox/experimental/__init__.py"

work:
- id: w1
  summary: "Create benchbox/experimental/ and move the 5 subsystem directories"
  status: pending
  notes: |
    mkdir -p benchbox/experimental/
    git mv benchbox/core/{nl2sql,aiml_functions,multiregion,gpu,concurrency} benchbox/experimental/
    Add benchbox/experimental/__init__.py with a docstring marking this as
    experimental, unsupported code.

- id: w2
  summary: "Update all internal imports across the 5 subsystems and cudf.py"
  needs: [w1]
  status: pending
  notes: |
    Replace `from benchbox.core.{subsystem}` with
    `from benchbox.experimental.{subsystem}` in:
    - Each subsystem's internal imports
    - benchbox/platforms/cudf.py (the only external consumer)
    Verify with: grep -r 'from benchbox.core.\(nl2sql\|aiml_functions\|multiregion\|gpu\|concurrency\)' benchbox/

- id: w3
  summary: "Update test imports and paths"
  needs: [w2]
  status: pending
  notes: |
    Update tests/unit/core/{nl2sql,aiml_functions,gpu,multiregion}/ imports
    to reference the new experimental paths.

- id: w4
  summary: "Add a guard test preventing experimental modules from appearing in the public registry"
  needs: [w3]
  status: pending

must_preserve:
- "Supported benchmark registry and CLI behavior unchanged"
- "cudf.py platform adapter continues to work via updated import path"
- "All experimental subsystems remain importable via benchbox.experimental.*"

approach: |
  This is a rename operation, not an extraction. Move directories, update
  imports, update tests. No new packages, no compatibility shims.

anti_patterns:
- "DO NOT create a separate benchbox-experimental package — a namespace move within the repo is sufficient"
- "DO NOT add experimental modules to the public registry to avoid the move"
- "DO NOT delete experimental code without evaluation — the goal is isolation, not removal"

verification:
- description: "Supported benchmark API and registry tests still pass"
  command: "uv run -- python -m pytest tests/unit/test_standardized_benchmark_apis.py tests/unit/tpch/test_api_compatibility.py tests/unit/cli/test_benchmark_selection.py -q"
  expected_output: "All tests pass"
- description: "Public exports reflect only supported surfaces"
  command: "uv run -- python -m pytest tests/unit/cli/test_cli_package_exports.py tests/unit/test_cli_documentation.py -q"
  expected_output: "All tests pass"
- description: "No experimental subsystem imports remain under benchbox/core/"
  command: "grep -r 'from benchbox.core.\\(nl2sql\\|aiml_functions\\|multiregion\\|gpu\\|concurrency\\)' benchbox/ --include='*.py' | grep -v __pycache__"
  expected_output: "No output (zero matches)"
- description: "Experimental modules are importable from the new namespace"
  command: "uv run -- python -c 'from benchbox.experimental import nl2sql, aiml_functions, multiregion, gpu, concurrency'"
  expected_output: "Exit code 0"

scope_limit:
  only_modify:
  - "benchbox/core/nl2sql/"
  - "benchbox/core/aiml_functions/"
  - "benchbox/core/multiregion/"
  - "benchbox/core/gpu/"
  - "benchbox/core/concurrency/"
  - "benchbox/experimental/"
  - "benchbox/platforms/cudf.py"
  - "tests/unit/core/nl2sql/"
  - "tests/unit/core/aiml_functions/"
  - "tests/unit/core/gpu/"
  - "tests/unit/core/multiregion/"
  do_not_touch:
  - "Supported benchmark query logic"
  - "Platform adapters other than cudf.py"
  - "Benchmark result schemas"
  - "benchbox/core/benchmark_registry.py (experimental modules are not in it)"
