must_preserve:
  - "PostgreSQL COPY bulk load correctness: same rows loaded, no data truncation or loss. The copy_expert() → cursor.copy() rewrite must produce identical database state."
  - "Streaming behavior for large TPC-H files: use 64KB chunk reads in cursor.copy() context manager, NOT whole-file f.read(), to preserve memory profile at high scale factors."
  - "psycopg2.sql-based safe identifier quoting in TimescaleDB, pg_mooncake, pg_duckdb: sql.Identifier() and sql.SQL() calls MUST remain — they are SQL injection guards."
  - "connection.autocommit = True pattern in postgresql.py and redshift.py: this property is still writeable in psycopg3 — do NOT replace with psycopg.connect(autocommit=True) unless doing a full connection-creation refactor."
  - "Redshift fallback branch: psycopg3 replaces psycopg2 in the fallback only; the redshift-connector primary path is unchanged."
  - "All test fixtures remain functionally equivalent: mock.Mock() stubs must target the new import name (psycopg) and match the actual module structure post-migration."

approach: |
  Work unit sequencing:
  - w1 (research gate) runs first and may abort the migration if a platform blocker is found.
  - w2 (pyproject.toml + uv.lock) must land before w3-w8 so psycopg3 is available in the env.
  - w3 (psycopg2_mixin.py) is the shared foundation — must be correct before adapters change.
  - w4-w7 (adapters) depend on w3 but are independent of each other; can run in parallel.
  - w8 (scripts) depends only on w2; can run in parallel with w4-w7.
  - w9 (test mocks) runs after w4-w7, since mock targets depend on final import paths.
  - w10 (validation) is the final gate after w8 and w9.

  The copy_expert() rewrite (w4) is the only non-trivial change. Reference:
  https://www.psycopg.org/psycopg3/docs/basic/copy.html

anti_patterns:
  - "DO NOT use psycopg2-binary as a compatibility shim or alias after migration — because that reintroduces the package being replaced and confuses future audits — drop it completely."
  - "DO NOT use copy.write(f.read()) (whole-file read) in the copy_expert() replacement — because TPC-H lineitem at SF>=1 can exceed available RAM — always stream in 64KB chunks."
  - "DO NOT change the COPY SQL statement format or delimiter handling — because copy_expert() and cursor.copy() accept identical COPY FROM STDIN SQL; only the Python call pattern changes."
  - "DO NOT use bare psycopg (without [binary]) as the dependency — because that requires system-installed libpq headers, breaking installs on systems without PostgreSQL dev tools."
  - "DO NOT skip w1 (research gate) — because QuestDB pg_wire compatibility and psycopg2.extras vestigial status must be confirmed before committing to the migration path."

