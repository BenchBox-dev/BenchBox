id: migrate-psycopg2-to-psycopg3
title: "Migrate PostgreSQL driver from psycopg2-binary to psycopg3 (psycopg)"
worktree: main
priority: Medium
status: Not Started
category: Code Quality and Technical Debt
description: |
  psycopg2-binary has been in maintenance-only mode since 2022. psycopg3 (PyPI package:
  `psycopg`) is the designated successor from the same author (Daniele Varrazzo), built on
  the same libpq foundation with active development, better wheel coverage (consistent
  macOS ARM64 support), and native async support. psycopg2-binary bundles its own OpenSSL,
  triggering security-scanner false positives; psycopg3[binary] has the same bundling model
  but a cleaner, maintained build.

  BenchBox uses psycopg2 across one shared mixin, five platform adapters, two dev scripts,
  and four test files:

    Platform adapters:
      benchbox/platforms/base/psycopg2_mixin.py  — shared connection/cursor mechanics
      benchbox/platforms/postgresql.py            — most complex: copy_expert() bulk load
      benchbox/platforms/timescaledb.py           — psycopg2.sql for safe DDL composition
      benchbox/platforms/questdb.py               — inherits mixin; psycopg2.extras vestigial
      benchbox/platforms/pg_mooncake.py           — psycopg2.sql for GUC/DDL composition
      benchbox/platforms/pg_duckdb.py             — psycopg2.sql for GUC composition
      benchbox/platforms/redshift.py              — psycopg2 as fallback when redshift-connector absent

    pyproject.toml dependency declarations (4 sites):
      line 112: "psycopg2-binary>=2.9.0"  (extras:all)
      line 170: postgresql = ["psycopg2-binary>=2.9.0"]
      line 171: questdb = ["psycopg2-binary>=2.9.0", "requests>=2.28.0"]
      line 464: "psycopg2-binary>=2.9.0"  (dev group)

    Scripts: scripts/probe_mooncake_types.py, scripts/benchmark_mooncake_migration.py

    Tests:
      tests/unit/platforms/test_postgresql_adapter.py
      tests/unit/platforms/test_psycopg2_mixin.py
      tests/unit/core/test_platform_registry.py
      tests/integration/platforms/common.py

  The only non-trivial code change is postgresql.py's two `cursor.copy_expert()` calls
  (lines 500 and 505), which must be rewritten to use psycopg3's `cursor.copy()` context
  manager. The psycopg.sql module (sql.SQL, sql.Identifier, sql.Literal) has an IDENTICAL
  API to psycopg2.sql — no usage sites change beyond the import path.

  This item was deferred from the `tighten-dependencies-phase-plan` audit as
  "driver modernization — out of scope for an elimination audit. File separately when
  product is ready."

work:
  - id: w1
    summary: "RESEARCH GATE: verify psycopg2 selection rationale and psycopg3 wire-protocol compatibility for all 5 affected platforms before touching any code."
    status: pending
    notes: |
      Step 1 — Audit selection history:
        git log -S "psycopg2" --oneline | head -20
        git log --all --oneline --follow -- benchbox/platforms/postgresql.py | tail -20
        grep -rn "psycopg2" docs/ benchbox/ | grep -i "reason\|chose\|because\|requires\|must\|only\|note"

      Step 2 — Verify psycopg2.extras is unused (not just unimported):
        grep -rn "extras\." benchbox/platforms/postgresql.py benchbox/platforms/questdb.py
        Expected: no output. Both files import psycopg2.extras but do not use it — confirmed
        vestigial by the pre-migration audit.

      Step 3 — Platform compatibility verification:
        - PostgreSQL: psycopg3 is the canonical driver — no blocker expected
        - QuestDB: uses PostgreSQL wire protocol; confirm psycopg3 wire compatibility
          (QuestDB pg_wire docs: https://questdb.io/docs/develop/connect/)
        - TimescaleDB: standard PostgreSQL; confirm create_hypertable() / add_compression_policy()
          are plain SQL calls requiring no psycopg2-specific cursor extensions (they are)
        - pg_mooncake: verify GUC-setting via SET and ALTER TABLE ... SET ACCESS METHOD columnar
          work unchanged via psycopg3 (they are plain SQL)
        - pg_duckdb: verify SET duckdb.motherduck_token = ... GUC pattern; check pg_duckdb docs
          for any driver compatibility notes
        - Redshift: fallback path only (redshift-connector is preferred); psycopg3 is
          wire-compatible with Redshift's pg-protocol endpoint

      Step 4 — Wheel availability check:
        Confirm pre-built wheels exist for darwin-arm64, darwin-x86_64, linux-x86_64,
        windows-amd64 in psycopg[binary] on PyPI (psycopg 3.1+ has all four).

      GATE PASS criteria:
        - No selection rationale found that still applies
        - All 5 platforms confirmed wire-compatible with psycopg3
        - psycopg[binary] wheels confirmed for CI platforms
        - psycopg2.extras confirmed vestigial (zero usage sites)

      If any platform-specific blocker is found, stop and add it to deferred[] rather
      than proceeding.

  - id: w2
    summary: "Update pyproject.toml: replace psycopg2-binary>=2.9.0 with psycopg[binary]>=3.1 at all 4 declaration sites (lines 112, 170, 171, 464). Run uv lock."
    needs: [w1]
    status: pending
    notes: |
      Lines to change in pyproject.toml:
        112: "psycopg2-binary>=2.9.0"  →  "psycopg[binary]>=3.1"  (extras:all)
        170: postgresql = ["psycopg2-binary>=2.9.0"]  →  postgresql = ["psycopg[binary]>=3.1"]
        171: questdb = ["psycopg2-binary>=2.9.0", ...]  →  questdb = ["psycopg[binary]>=3.1", ...]
        464: "psycopg2-binary>=2.9.0"  →  "psycopg[binary]>=3.1"  (dev group)

      Use psycopg[binary], NOT bare psycopg. The [binary] extra ships pre-compiled libpq —
      same install model as psycopg2-binary. Bare psycopg requires a system libpq.

      After editing: uv lock
      Verify: uv run -- python -c "import psycopg; print('psycopg', psycopg.__version__)"

  - id: w3
    summary: "Migrate psycopg2_mixin.py: rename import psycopg2 → psycopg, update sql alias, consider renaming Psycopg2ConnectionMixin to PsycopgConnectionMixin."
    needs: [w2]
    status: pending
    notes: |
      Import block (lines 38-47):
        Before:
          try:
              import psycopg2
              from psycopg2 import sql as psql
          except ImportError:
              psycopg2 = None
              psql = None
        After:
          try:
              import psycopg
              from psycopg import sql as psql
          except ImportError:
              psycopg = None
              psql = None

      All `psycopg2` identifier references throughout the file → `psycopg`.

      Class rename: `Psycopg2ConnectionMixin` → `PsycopgConnectionMixin` leaks the old version
      in the public class name. Rename it here and update all six subclass declarations
      (postgresql.py, timescaledb.py, questdb.py, pg_mooncake.py, pg_duckdb.py). A __all__
      backward-compat alias can bridge the transition within this commit if needed.

      Verify:
        uv run -- python -c "from benchbox.platforms.base.psycopg2_mixin import Psycopg2ConnectionMixin; print('OK')"

  - id: w4
    summary: "Migrate postgresql.py: rename imports, rewrite copy_expert() → cursor.copy() with 64KB streaming, update version key and guard checks."
    needs: [w3]
    status: pending
    notes: |
      Change 1 — Import block (lines 46-49): drop psycopg2.extras (vestigial per w1), rename:
        try:
            import psycopg
        except ImportError:
            psycopg = None

      Change 2 — All psycopg2.connect() call sites (~lines 269, 302, 335, 703):
        psycopg2.connect(**params) → psycopg.connect(**params)
        Connection parameter keys (host, port, dbname, user, password, sslmode,
        connect_timeout, options) are identical in psycopg3 — no changes to param dict.

      Change 3 — COPY bulk load rewrite (lines 500 and 505):
        cursor.copy_expert() does not exist in psycopg3. Replace with cursor.copy() context
        manager. Both source paths open in text mode (mode="rt" or encoding="utf-8") so
        chunk is str; psycopg3 copy.write() accepts str for text-format COPY.
        Use 64KB chunk reads — NOT f.read() whole-file — to preserve memory profile for
        large TPC-H data files (lineitem at SF>=1 can exceed available RAM).

        Before (line 500, io.StringIO path):
          cursor.copy_expert(
              f"COPY {qualified_table} FROM STDIN WITH (FORMAT csv, DELIMITER '{delimiter}')",
              data_buffer,
          )
        After:
          with cursor.copy(
              f"COPY {qualified_table} FROM STDIN WITH (FORMAT csv, DELIMITER '{delimiter}')"
          ) as copy:
              while chunk := data_buffer.read(65536):
                  copy.write(chunk)

        Before (line 505, file object path):
          cursor.copy_expert(
              f"COPY {qualified_table} FROM STDIN WITH (FORMAT csv, DELIMITER '{delimiter}')",
              f,
          )
        After:
          with cursor.copy(
              f"COPY {qualified_table} FROM STDIN WITH (FORMAT csv, DELIMITER '{delimiter}')"
          ) as copy:
              while chunk := f.read(65536):
                  copy.write(chunk)

      Change 4 — Version references (lines 694-695 and 807-808):
        psycopg2.__version__ → psycopg.__version__
        Key "psycopg2_version" in platform_info dict → "psycopg_version"
        (Check benchbox/core/explorer_pipeline/ for pipeline consumption of this key
        before renaming — if it's in the schema, coordinate with the pipeline.)

      Change 5 — All `if psycopg2:` guards → `if psycopg:`

      Verify:
        uv run -- python -m pytest tests/unit/platforms/test_postgresql_adapter.py -q
        uv run -- python -c "from benchbox.platforms.postgresql import PostgreSQLPlatform; print('OK')"

