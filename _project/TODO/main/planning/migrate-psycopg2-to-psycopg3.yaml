impact:
  business_value: |
    Replaces a maintenance-only library with its actively maintained successor.
    Eliminates bundled-OpenSSL false positives from security scanners.
    Unblocks future use of psycopg3 async connections if BenchBox ever parallelizes
    benchmark execution across multiple database connections.
  user_impact: |
    No user-visible behavior changes. All five platforms continue to function
    identically post-migration.
  technical_debt: |
    Closes the psycopg2 migration deferral in tighten-dependencies-phase-plan.yaml.
    Removes a known stale dependency before it becomes a security or compatibility issue.

