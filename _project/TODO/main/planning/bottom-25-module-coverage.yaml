id: bottom-25-module-coverage
title: "Raise bottom 25 modules (all <42% coverage) to 80%"
worktree: main
priority: High
status: Not Started
description: |
  After completing non-dataframe-test-coverage, 25 modules remain below 42%
  coverage and were either not targeted by the previous TODO or only partially
  addressed. This plan brings each one individually to 80%+.

  Modules by current coverage (March 24 baseline, may be slightly higher by now):
  - 0%:  core/pg_extension_comparison (68 miss), platforms/azure/config_utils (22),
         platforms/credentials/shared (42)
  - 16%: utils/dependency_validation (83 miss) — w14 targeted 70% but tests are thin
  - 18%: platforms/databricks/dataframe_adapter (120 miss)
  - 19%: core/tuning/generators/doris (93 miss), core/coffeeshop/benchmark (88 miss)
  - 19%: core/tuning/generators/questdb (61 miss)
  - 20%: core/coffeeshop/schema (29 miss)
  - 22%: cli/commands/datagen (32 miss)
  - 23%: platforms/dataframe/pyspark_df (200 miss)
  - 27%: platforms/azure/spark_execution_utils (30 miss)
  - 29%: platforms/databend/__init__ (12 miss)
  - 31%: platforms/motherduck (99 miss)
  - 33%: cli/commands/run_official (33 miss), core/tpcdi/schema_extensions (22 miss)
  - 34%: platforms/bigquery (514 miss) — w21 gained stmts but not to 80%
  - 35%: platforms/databricks/adapter (618 miss) — same
  - 35%: mcp/__init__ (14 miss)
  - 36%: cli/system (17 miss)
  - 37%: platforms/redshift (639 miss)
  - 39%: tpch_skew (27 miss)
  - 40%: cli/commands/tuning_group (133 miss), platforms/snowflake (405 miss)
  - 41%: platforms/athena (360 miss)

  Testing philosophy: every test must assert on the actual output value or behavior
  (SQL string content, config field value, error message). No import-only tests,
  no assert-not-None, no mock.called checks in lieu of output assertions.

  Cloud platform SQL generation tests: always assert the generated SQL string
  contains specific clauses — COPY FROM S3, DISTRIBUTED BY, PARTITION BY, etc.

category: Testing & Quality

deps:
  needs:
  - non-dataframe-test-coverage

work:
- id: w1
  summary: "Test pg_extension_comparison pure functions (0% → 100%)"
  status: pending
  needs: []
  description: |
    benchbox/core/pg_extension_comparison.py: 68 stmts, 0% coverage.
    All pure functions — no I/O, no side effects. Full coverage achievable with
    dict fixture inputs.

    File to create: tests/unit/core/test_pg_extension_comparison.py

    Test _format_metric_section:
    - Normal case: both positive values → list with ratio line "2.00x"
    - baseline_value=None → returns []
    - extension_value=0 → returns inf ratio
    - baseline_value=0 → returns []

    Test _format_query_comparison_section:
    - Two queries with times → rows show speedup, summary shows geometric mean/max/min
    - One query fails (time=0) → shows "FAILED"
    - Empty query dicts → returns []
    - No common queries → returns []

    Test _format_summary_section:
    - Extension faster (speedup > 1) → "X is Y.1x faster" line
    - Baseline faster (speedup < 1) → reversed message
    - Equal times (speedup == 1) → "Performance is equivalent"
    - No total_execution_time fields → returns summary header only

    Test generate_comparison_report:
    - Full dict fixtures → assert "PostgreSQL Extension Comparison Report" in output
    - Assert "Benchmark: TPCH (SF 0.01)" line present
    - Assert geometric mean speedup line present when both have query_results

    Test _geometric_mean:
    - Empty list → 0.0
    - All zeros → 0.0
    - [2.0, 8.0] → 4.0 (geometric mean)
    - [1.0] → 1.0

- id: w2
  summary: "Test config builder pure functions: azure/config_utils + databend/__init__ (0%, 29% → 80%)"
  status: pending
  needs: []
  description: |
    benchbox/platforms/azure/config_utils.py: 22 stmts, 0% coverage.
    benchbox/platforms/databend/__init__.py: 17 stmts, 29% coverage.
    Both are config-builder functions that merge credentials + options + overrides
    into a DatabaseConfig. Testable by mocking CredentialManager.

    File to create: tests/unit/platforms/test_config_builders.py

    azure/config_utils.build_platform_config:
    - Mock CredentialManager.get_platform_credentials → returns {} (no saved creds)
    - Call with minimal args (platform_type, credential_key, display_name, driver_pkg,
      platform_fields=[], options={}, overrides={"benchmark": "tpch", "scale_factor": 1},
      info=None) → assert config.type == platform_type, config.name == default_display_name
    - Test option merge precedence: saved_creds has host="a", options has host="b",
      overrides has host="c" → config.host == "c"
    - Test info!=None path: info.display_name and info.driver_package used
    - Test platform_fields extraction: platform_fields=["host","port"],
      merged_options has these → config.host and config.port populated
    - Test driver_version: overrides has driver_version → config.driver_version set
    - Test driver_auto_install: options has "true" → config.driver_auto_install == True
    - Test database override: overrides["database"]="mydb" → config.database == "mydb"

    databend/__init__._build_databend_config:
    - Same mock-CredentialManager approach
    - Test all databend-specific fields: host, port, username, password, database,
      dsn, warehouse, ssl, disable_result_cache extracted from merged_options
    - Test saved_creds < options < overrides merge order
    - Test info=None → name="Databend", driver_package="databend-driver"

