metadata:
  tags:
  - testing
  - coverage
  - quality
  - cli
  - platforms
  - tuning
  estimated_effort: "Large (2-3 weeks across work units)"
  created_date: "2026-03-26"
  last_updated: "2026-03-26"
  coverage_baseline:
    date: "2026-03-24"
    note: "March 24 snapshot; some modules may have improved slightly by March 26 commits"

verification:
  command: |
    uv run -- python -m pytest -m "fast or medium" -n auto --strict-markers --tb=short \
      -p pytest_cov --cov=benchbox --cov-report=term -q --no-header 2>&1 \
      | grep -E "^(TOTAL|benchbox/)" | head -30
  expected: "Each targeted module shows >= 80% on its row; TOTAL >= 80%"

must_preserve:
- "All existing tests must continue to pass — new tests are additive only"
- "No assert-not-None, assert True, or hasattr-only assertions — every assertion must fail if the code under test is broken"
- "Cloud adapter tests must not require real credentials — mock at the connection boundary only"
- "SQL-generation assertions must check the actual SQL string content, not just that a method was called"
- "Test file names must describe the behavior being tested, not contain 'coverage'"

anti_patterns:
- "DO NOT test that a config field 'is not None' — because that can never fail once the field is populated — assert the actual value"
- "DO NOT mock internal helper functions to test a dispatcher — because you then test the mock, not the code — use real inputs and assert on real output"
- "DO NOT assert mock.called for SQL generation tests — because called=True doesn't verify the SQL is correct — always assert on the SQL string"
- "DO NOT write a test that only calls get_available_presets() and asserts len > 0 — because that can't catch a bug where a preset is removed — assert the specific preset names"
- "DO NOT test only the happy path for CLI wrappers — because error validation is where bugs live — test every exit(1) branch"

scope_limit:
  include:
  - "tests/ (new and modified test files only)"
  exclude:
  - "benchbox/ source code (no production changes)"
  - "pytest.ini or pyproject.toml (no config changes)"
