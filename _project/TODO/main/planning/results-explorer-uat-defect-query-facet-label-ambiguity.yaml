id: results-explorer-uat-defect-query-facet-label-ambiguity
title: "UAT defect: Query facet labels are ambiguous across environment and cost facets"
worktree: main
priority: "Medium"
status: "Not Started"
category: "User Experience"

description: |
  The W6 Playwright smoke had to use the exact accessible name `local 205`
  because a partial label match for Deployment `local` also matched Cost status
  `not_applicable_local`. This is a minor but real accessibility and automation
  rough edge in the Query facet rail.

work:
- id: w1
  summary: "Identify exact Query facet component files and label-generation helpers"
  status: pending
- id: w2
  summary: "Disambiguate accessible names without making visible labels noisy"
  needs: [w1]
  status: pending
- id: w3
  summary: "Add browser or component coverage for ambiguous facet labels"
  needs: [w2]
  status: pending

verification:
- description: "Results Explorer tests pass."
  command: "cd results-explorer && npm run test"
  expected_output: "vitest suite passes"
- description: "Targeted browser smoke can select Deployment local without strict-mode ambiguity."
  command: "cd results-explorer && npm run test:e2e:chromium -- --grep Query"
  expected_output: "Query browser coverage passes"

must_preserve:
- "Visible facet labels stay compact for dense desktop and mobile layouts."
- "Screen-reader accessible names remain descriptive enough to identify facet group and value."

anti_patterns:
- "DO NOT solve this by hiding cost or deployment facets -- because both are needed for corpus filtering -- disambiguate names instead."

metadata:
  tags: [uat, results-explorer, accessibility, facets]
  created_date: "2026-05-03"
