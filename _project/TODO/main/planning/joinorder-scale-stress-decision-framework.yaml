id: joinorder-scale-stress-decision-framework
title: "Design the JOB scale-stress benchmark decision framework"
worktree: main
priority: Medium-High
status: Not Started
category: Benchmark Development

description: |
  Define whether and how BenchBox should add a scaled JOB-derived benchmark for
  evaluating the interplay of optimizer statistics maintenance, predicate
  selectivity, cardinality estimation, planning limits, and physical execution
  thresholds at large data scales.

  This item is deliberately a decision framework, not an implementation. It
  should conclude with a recommendation on which scale-up path, if any, is worth
  prototyping after canonical JOB has a reliable dataset contract and oracle.
  The primary decision record is
  `_project/decisions/joinorder-scale-stress-decision-<date>.md`; licensing is
  captured separately in
  `_project/decisions/joinorder-scale-stress-licensing-<date>.md`.

deps:
  needs:
    - joinorder-canonical-foundation

context_sections:
  "Benchmark identity": |
    Canonical JOB evaluates optimizer/cardinality behavior on a fixed real
    correlated dataset. A scaled JOB-derived workload evaluates a related but
    different question: how optimizers behave as correlated predicates and join
    graphs grow past statistics, sampling, planning-time, memory, and
    distributed-execution thresholds.
  "Required distinction": |
    Any scale-up must be labeled derived, for example job_scale_stress,
    replicated_imdb, expanded_imdb, or parameterized_imdb. It must not publish
    as canonical joinorder and must not claim literature comparability.

work:
  - id: w0
    summary: "Collect evidence for optimizer and statistics failures at scale"
    status: pending
    notes: |
      Before choosing a scaled JOB-derived path, collect evidence that the target
      problem is real and distinct from canonical JOB. Include at least three of:
        - documented optimizer/cardinality/statistics failures that appear only
          or primarily at larger data scales;
        - BenchBox-local observations from prior large-scale runs;
        - engine documentation describing sampled, stale, partition, or
          incremental statistics limits;
        - academic or vendor papers on optimizer search, planning-time, or
          statistics-maintenance breakdowns at scale.
      The decision note must separate this evidence from the original JOB paper's
      fixed-dataset cardinality-estimation problem.

  - id: w1
    summary: "Write the benchmark question and non-goals"
    needs: [w0]
    status: pending
    notes: |
      Produce a short decision note that separates:
        - canonical JOB comparability,
        - physical scale stress,
        - statistics maintenance stress,
        - predicate selectivity drift,
        - optimizer search/planning-time limits,
        - distributed skew and spill behavior.
      Explicitly state that scaled JOB-derived results are not canonical JOB
      results.

  - id: w2
    summary: "Define scale semantics and workload labels"
    needs: [w1]
    status: pending
    notes: |
      Decide whether scale factor means total rows, title count, all major
      entity classes, bytes, or expected query cardinality. Define labels and
      result-bundle fields for at least:
        - canonical_imdb
        - replicated_imdb
        - expanded_imdb
        - parameterized_imdb
        - synthetic_schema
      Document how each label affects comparability and publication.

  - id: w3
    summary: "Specify statistics-maintenance phases and measurements"
    needs: [w1]
    status: pending
    notes: |
      Decide whether BenchBox needs a first-class stats/analyze phase before
      scale-stress work can be meaningful. The decision must cover:
        - no/default stats,
        - fresh sampled stats,
        - fresh full or high-quality stats where supported,
        - stale stats after loading additional scale,
        - incremental or partition stats where supported.
      Measurements should keep load, stats-build, planning, and execution time
      separate. Capture engine-specific stats metadata where available.

      Per-engine compatibility matrix (REQUIRED — addresses the
      "engines without ANALYZE" gap):
        | Engine | Has explicit ANALYZE? | Auto-stats on load? | Sampled mode? |
        | DuckDB | yes (ANALYZE)         | yes (background)    | n/a           |
        | PostgreSQL | yes (ANALYZE)     | no                  | yes           |
        | ClickHouse | partial (per-table) | yes (on insert)   | n/a           |
        | StarRocks | yes (ANALYZE TABLE)| no                  | yes           |
        | Spark | yes (ANALYZE TABLE)    | no                  | yes           |
      Concrete numbers TBD during implementation; bind them in the
      decision note. For engines without an explicit ANALYZE, the
      stats-phase wall-clock is reported as zero with `stats_mode:
      auto-on-load` recorded in result bundle metadata so the
      attribution is unambiguous.

      Measurement methodology (REQUIRED):
        - Cold cache vs warm cache: each phase begins with documented
          cache state (e.g., drop_caches before stats-build, no drop
          between stats-build and planning).
        - Per-engine knobs: explicit configuration per engine
          documented in the decision note (e.g., default_statistics_target
          for PostgreSQL, sample size for StarRocks).
        - Idempotence: re-running ANALYZE on already-analyzed data
          must produce the same plan (sanity check).
      If a first-class stats/analyze phase is required, the canonical
      slug for that follow-up TODO is
      `_project/TODO/main/planning/track2-joinorder-stats-phase.yaml`
      (seeded by joinorder-track2-groundwork w2; reuse rather than
      creating a separate `joinorder-statistics-phase-measurement.yaml`
      to avoid duplicate stewardship). Make any implementation prototype
      depend on that TODO before coding. The decision must identify
      required changes to runner phases, result bundles, platform
      adapter hooks, CLI phase parsing, and validation/reporting.
      The decision note must include exactly one machine-checkable line:
      `Stats phase gate: completed`, `Stats phase gate: smoke-only`, or
      `Stats phase gate: dependency:track2-joinorder-stats-phase`.
      Use `smoke-only` only when the prototype is explicitly narrowed so it
      cannot claim publication-quality stats-maintenance conclusions.

  - id: w4
    summary: "Compare scale-up implementation options"
    needs: [w2, w3]
    status: pending
    notes: |
      Compare at least these options:
        - offset replication of canonical IMDB,
        - predicate-preserving augmentation,
        - profiled graph expansion,
        - parameterized JOB-like query generation,
        - newer real IMDb snapshot if legally and technically viable.
      For each option, evaluate correlation fidelity, implementation cost,
      validation oracle availability, statistics-stress usefulness, and risk of
      misleading users.

  - id: w5
    summary: "Define validation gates for any scaled JOB-derived workload"
    needs: [w4]
    status: pending
    notes: |
      The validation gate must include:
        - FK integrity,
        - per-table row counts,
        - predicate-domain frequencies,
        - per-column null counts,
        - fixed-query result cardinalities,
        - pre-aggregate match counts,
        - important join-subgraph cardinalities,
        - q-error profile where a reference estimator or engine output exists,
        - plan shape and planning-time summaries.
      Non-empty checks are explicitly insufficient.

  - id: w6
    summary: "Decide fixed 113 queries versus parameterized JOB-like queries"
    needs: [w5]
    status: pending
    notes: |
      Decide whether the first scaled workload should:
        - keep the fixed 113 JOB queries and study what happens as the database
          grows around those fixed literals, or
        - generate parameterized JOB-like queries whose predicates are sampled
          from the scaled graph.
      If both are useful, define separate result labels and do not mix them in
      one leaderboard/cohort.

  - id: w7
    summary: "Produce a go/no-go recommendation and prototype scope"
    needs: [w6]
    status: pending
    notes: |
      End with a written recommendation:
        - no scaled JOB for now,
        - replicated_imdb baseline only,
        - expanded_imdb research prototype,
        - parameterized_imdb benchmark family,
        - or staged combination.
      The recommendation must name the smallest next prototype and its
      verification criteria.

      CI cost & infrastructure section (REQUIRED):
        - Estimated dataset size for each scale tier evaluated
          (e.g., replicated SF=2 ~ 3 GB Parquet, SF=10 ~ 15 GB)
        - Cache strategy: CI runner cache vs fresh download per run
          (size × runner-count × frequency = monthly bandwidth)
        - Download-failure handling: retry policy, fallback if
          hosted Release is unreachable, abort threshold
        - Cost ceiling per matrix run (rough $/run for cloud
          engine matrix if deferred from prototype)

      Licensing posture for derived workloads (REQUIRED):
        - State whether the chosen scale-up path requires fresh
          licensing review (e.g., redistributing a synthesized
          dataset created from canonical IMDb data may need its
          own DATA-LICENSE.md provenance trail).
        - For replicated_imdb specifically: derived archive carries
          source canonical dataset_version; redistribution posture
          inherits canonical's license review (foundation TODO's
          context_sections.Research Findings) unless transformation
          is material.
        - For parameterized_imdb: queries-only (no derived data
          archive) — no new license review needed.

  - id: w8
    summary: "Pin the licensing decision for the recommended scale-up path"
    needs: [w7]
    status: pending
    notes: |
      Output: `_project/decisions/joinorder-scale-stress-licensing-<date>.md`

      The recommended path from w7 may require its own licensing
      review (separate from the canonical foundation's). Pin it
      explicitly so future archive publishers don't have to
      re-derive the analysis:
        - Posture (low / ambiguous / high) for the derived form
        - Required attribution and disclaimers
        - Hosting model (GitHub Release / user-supplied path / both)
        - Takedown contact (inherits from canonical unless changed)

      If w7 chooses "no scaled JOB for now", still use the four headings above;
      each section may state that no derived archive is planned and licensing
      review re-opens when scale-stress work resumes. If the recommendation is
      replicated_imdb, the licensing note must also state whether the
      statistics/analyze phase blocker is satisfied, deferred with a narrower
      prototype scope, or represented by a new TODO that the prototype must
      depend on.

deferred:
  - summary: "Implement any scaled JOB generator"
    reason: "This item is the decision framework. Implementation belongs in a follow-up TODO after w7 chooses a path."
  - summary: "Implement first-class statistics/analyze phase accounting"
    reason: "This decision item must decide whether that is required and create a dedicated TODO if so."
  - summary: "Build dashboard/explorer UI for scale-stress metrics"
    reason: "Explorer work depends on final result-bundle fields and benchmark labels."

must_preserve:
  - "Canonical joinorder remains fixed to canonical_imdb SF=1 and is never silently replaced by derived scale modes."
  - "Derived workloads must report their data-generation strategy, dataset version, generator version, seed, and stats protocol."
  - "Query validation must use the canonical oracle contract from joinorder-canonical-foundation when applicable."
  - "A scaled JOB-derived prototype must not start until stats/analyze phase requirements are either satisfied or explicitly scoped out in the decision note."
  - "If w7 mutates the prototype TODO file, the prototype TODO must be quiescent (no in-progress work units) at the time of mutation; otherwise concurrent edits create lost-write risk."
  - "The scale-stress decision record and licensing record use distinct filename prefixes so verification commands cannot read the wrong document."

approach: |
  Treat this as an architecture/design gate. Read canonical JOB behavior, TPC-DS
  compliance labeling, result-bundle metadata, runner phase handling, and
  platform stats/analyze support before recommending implementation. The output
  should be a decision record plus an updated TODO for the chosen prototype.
  Write the main decision to
  `_project/decisions/joinorder-scale-stress-decision-<date>.md`; do not use
  the licensing filename prefix for the main architecture decision.

  Cross-TODO write coordination: w7 may update the prototype TODO file
  (`joinorder-replicated-imdb-scale-prototype.yaml`) to copy the chosen
  scope and success criteria. Before doing so, verify the prototype is
  quiescent: status: "Not Started" and no work units in_progress. If the
  prototype is in flight, w7 instead writes the recommendation to the
  decision note ONLY and lets the implementing agent on the prototype
  side update their own TODO at the next checkpoint.

anti_patterns:
  - "DO NOT proceed on intuition that optimizers fail at scale - because this benchmark must justify a distinct workload identity - collect documented examples or local evidence first."
  - "DO NOT call a scaled derived workload 'JOB' without a qualifier - because users may assume literature comparability - use explicit labels such as replicated_imdb or job_scale_stress."
  - "DO NOT choose offset replication only because it is easiest - because it may hide the statistics/predicate-selectivity problem - evaluate whether it answers the benchmark question."
  - "DO NOT build graph expansion before defining validation gates - because synthetic correlations can look plausible while destroying the JOB signal - define measurement gates first."
  - "DO NOT fold stats-build timing into load or query execution - because the core research question includes statistics maintenance - require separate stats/analyze phase accounting."

verification:
  - description: "Decision note covers all required sections (programmatic header check)"
    command: "grep -hEc '^## (Benchmark question|Scale semantics|Statistics phase|Scale-up options|Validation gates|Fixed vs parameterized|Recommendation|CI cost|Licensing posture)' _project/decisions/joinorder-scale-stress-decision-*.md | awk '{ s += $1 } END { print s }'"
    expected_output: ">= 9"
  - description: "Per-engine stats compatibility matrix lists 4+ engines"
    command: "grep -hEc '^\\| (DuckDB|PostgreSQL|ClickHouse|StarRocks|Spark) ' _project/decisions/joinorder-scale-stress-decision-*.md | awk '{ s += $1 } END { print s }'"
    expected_output: ">= 4"
  - description: "Workload labels (canonical_imdb, replicated_imdb, etc.) are defined with comparability rules"
    command: "grep -hEc 'canonical_imdb|replicated_imdb|expanded_imdb|parameterized_imdb|synthetic_schema' _project/decisions/joinorder-scale-stress-decision-*.md | awk '{ s += $1 } END { print s }'"
    expected_output: ">= 5"
  - description: "Stats/analyze prototype gate is concrete and machine-checkable"
    command: "grep -hEc '^Stats phase gate: (completed|smoke-only|dependency:track2-joinorder-stats-phase)' _project/decisions/joinorder-scale-stress-decision-*.md | awk '{ s += $1 } END { print s }'"
    expected_output: "1"
  - description: "Recommendation is explicit and unambiguous (one of 5 named choices, not 'maybe')"
    command: "grep -hEc '^Recommendation: (no scaled JOB|replicated_imdb baseline|expanded_imdb research|parameterized_imdb|staged combination)' _project/decisions/joinorder-scale-stress-decision-*.md | awk '{ s += $1 } END { print s }'"
    expected_output: "1"
  - description: "Validation gates section explicitly rejects non-empty-only checks"
    command: "grep -hEc 'non-empty (checks|results) (are )?insufficient|q-error|cardinalit' _project/decisions/joinorder-scale-stress-decision-*.md | awk '{ s += $1 } END { print s }'"
    expected_output: ">= 2"
  - description: "Licensing posture for derived workloads is recorded with required fields"
    command: "grep -hEc '^## (Posture|Hosting model|Attribution|Takedown contact)' _project/decisions/joinorder-scale-stress-licensing-*.md | awk '{ s += $1 } END { print s }'"
    expected_output: ">= 4"
  - description: "TODO graph remains valid"
    command: "uv run --project _project/scripts -- python _project/scripts/todo_cli.py check-graph"
    expected_output: "Graph validation passed"
  - description: "This item validates individually"
    command: "uv run --project _project/scripts -- python _project/scripts/todo_cli.py validate _project/TODO/main/planning/joinorder-scale-stress-decision-framework.yaml"
    expected_output: "is valid"

scope_limit:
  only_modify:
    - "_project/decisions/joinorder-scale-stress-decision-*.md"
    - "_project/decisions/joinorder-scale-stress-licensing-*.md"
    - "_project/TODO/main/planning/joinorder-scale-stress-decision-framework.yaml"
    - "_project/TODO/main/planning/joinorder-replicated-imdb-scale-prototype.yaml"
    - "_project/TODO/main/planning/track2-joinorder-stats-phase.yaml (canonical stats-phase follow-up slug; seeded by track2-groundwork w2 — referenced from this TODO's `Stats phase gate: dependency:` line, not created here)"
    - "docs/benchmarks/join-order.md"
    - "docs/development/"
  do_not_modify:
    - "benchbox/core/joinorder/"
    - "benchbox/cli/"
    - "results-data/bundles/"
    - "results-explorer/"

success_metrics:
  - "The decision note cites documented or local evidence for optimizer/statistics failures that appear at scale."
  - "The benchmark question for scale-stress JOB is written and clearly separated from canonical JOB."
  - "Scale-mode labels and result-bundle metadata are specified."
  - "Statistics-maintenance phases and required timings are specified, including any follow-up TODO needed for first-class stats/analyze phase accounting."
  - "A go/no-go recommendation selects the smallest next prototype and rejects at least one unsuitable option with rationale."

metadata:
  tags:
    - joinorder
    - job-scale-stress
    - optimizer-statistics
    - benchmark-design
    - issue-289
  estimated_effort: "Medium"
  created_date: "2026-05-09"

research_value:
  hypothesis: |
    A JOB-derived scaled benchmark can expose optimizer failures that are
    adjacent to, but distinct from, canonical JOB: statistics maintenance,
    stale or sampled stats, planning-time limits, and physical-plan threshold
    behavior under correlated predicate selectivity.
  validation_approach: |
    Compare scale-up strategies against canonical oracle artifacts and collect
    cardinality, q-error, plan-shape, stats-time, and execution telemetry before
    choosing an implementation path.
  success_criteria: |
    The chosen prototype has a clear workload identity, validation oracle,
    scale semantics, and stats protocol. If those cannot be defined, scaled JOB
    is deferred rather than shipped ambiguously.

impact:
  business_value: |
    Creates a disciplined path for a valuable optimizer-stress benchmark without
    diluting canonical JOB or publishing misleading results.
  technical_debt: |
    Prevents a second round of benchmark-validity debt by forcing scale
    semantics, statistics phases, and validation gates before implementation.
