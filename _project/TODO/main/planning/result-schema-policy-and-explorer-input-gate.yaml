  - "_project/DONE/main/planning/define-hosted-results-contract-and-governance-model.yaml: prior governance framing -- preserve trust/visibility separation."
  - "benchbox/core/results/normalizer.py: existing legacy normalization behavior -- preserve useful compatibility while centralizing version rules."

