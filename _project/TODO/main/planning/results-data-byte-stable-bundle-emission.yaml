id: results-data-byte-stable-bundle-emission
title: "Make bundle JSON emission byte-stable so manifest hashes survive normalizers"
worktree: main
priority: "Medium"
status: "Blocked"
category: "Core Functionality"

description: |
  The bundle emitter (`benchbox/core/results/exporter.py`) writes the primary
  result JSON and companion `.plans.json` / `.tuning.json` files without a
  canonical trailing-newline / whitespace policy. The submit manifest writer
  (`benchbox/cli/commands/submit.py`) then records SHA-256 hashes for the
  emitted bundle and companions. Tools that round-trip the file —
  pre-commit's `end-of-file-fixer` and `trailing-whitespace` hooks, GitHub's
  rich JSON viewer, editors that auto-save with a final newline — change
  bytes the manifest's `bundle_hash` SHA-256 was computed against.

  The W3 corpus-integration PR
  (`results-explorer-uat-corpus-integrate-validated-bundles`) hit this when
  staging 188 community-submission bundles into `results-data/bundles/`: the
  EOF-fixer added trailing newlines and broke every hash. The PR landed by
  excluding `results-data/bundles/*.json` from those hooks
  (`.pre-commit-config.yaml:106-118`). That fix is correct but it is a
  band-aid: any future submitter running a different tool, GitHub PR review
  flow, or editor that touches the bytes will hit the same wall, and the
  exclusion does not protect them.

  The durable fix is to emit the primary bundle and companion JSON files in a
  canonical byte-stable form (single serializer with a fixed trailing-newline
  policy and stable key ordering) AND compute `bundle_hash` and
  `companion_hashes` against that canonical form, so EOF-fixing /
  pretty-printing within the canonical form is a no-op.

  Originating blind-spot finding:
  `_project/blind-spots/2026-05-03-090105-mixed-tooling-data-pr-review-gap.md`.

work:
- id: w1
  summary: "Survey current bundle, companion, and manifest hash paths; define canonical form"
  status: done
  notes: |
    Search with `rg` for `json.dump` / `json.dumps`, `write_text`,
    `bundle_hash`, and `companion_hashes` under:
      - `benchbox/core/results/`
      - `benchbox/cli/commands/submit.py`
      - `tests/unit/test_results_exporter.py`
      - `tests/unit/cli/commands/test_submit.py`

    Decide a single canonical JSON byte form for primary bundles, plans
    companions, tuning companions, and generated manifests. Probable:
    `json.dumps(d, indent=2, sort_keys=True, ensure_ascii=False) + "\n"`.
    Document the chosen form and rationale in implementation notes or focused
    test names. Do not make code changes in this work unit.

    Implementation note: chosen canonical form is
    `json.dumps(payload, indent=2, sort_keys=True, ensure_ascii=False) + "\n"`,
    centralized in `benchbox/core/results/canonical_json.py`.

- id: w2
  summary: "Adopt the canonical form for primary and companion JSON emission"
  needs: [w1]
  status: done
  notes: |
    Add or reuse a single canonical serializer in `benchbox/core/results/`.
    Use it for:
      - primary result bundle JSON in `ResultExporter._export_json_v2`;
      - `.plans.json` companion output;
      - `.tuning.json` companion output.

    Add `tests/unit/test_results_exporter.py` coverage proving emitted primary
    and companion files include exactly one final newline, have stable key
    order, and are unchanged by an EOF-fixer-equivalent transform
    (`bytes.rstrip(b"\n") + b"\n"`).

- id: w3
  summary: "Align submit manifest hashes with canonical primary and companion bytes"
  needs: [w2]
  status: done
  notes: |
    Update `benchbox/cli/commands/submit.py` so `bundle_hash` and every entry
    in `companion_hashes` are computed from the exact canonical bytes that the
    submit flow copies or emits. Do not change the manifest schema or hash
    algorithm.

    Add `tests/unit/cli/commands/test_submit.py` coverage for:
      - primary `bundle_hash` surviving the EOF-fixer-equivalent transform;
      - `companion_hashes` for `.plans.json` and `.tuning.json` surviving the
        same transform;
      - hosted and PR-based manifest builders continuing to agree on the hash
        contract where applicable.

- id: w4
  summary: "Remove the pre-commit `results-data/bundles/*.json` exclusion"
  needs: [w3]
  status: pending
  notes: |
    Once W2 and W3 land, the bundle exclusion in `.pre-commit-config.yaml`
    becomes unnecessary. Remove it from both hooks:
      - `end-of-file-fixer` exclude at `.pre-commit-config.yaml:106-115`;
      - `trailing-whitespace` exclude at `.pre-commit-config.yaml:116-118`.

    Verify by running both hooks through `uv run -- pre-commit run ...` against
    at least one known-clean primary bundle and its `.manifest.json` sidecar.
    Re-run `scripts/validate_submission.py` against `results-data/bundles/`
    after the pre-commit dry-run; it must still report zero errors.

    Blocked after W1-W3 implementation: a read-only scan found 513 existing
    `results-data/bundles/*.json` primary/companion files without a final
    newline. Removing this exclusion now would let `end-of-file-fixer` rewrite
    those grandfathered hash-pinned bytes, violating this TODO's
    "DO NOT canonicalize already-checked-in bundles" guardrail. Leave W4
    pending until a separate legacy-bundle grandfather/backfill strategy exists.

verification:
- description: "Bundle hash survives a no-op normalization round-trip."
  command: "uv run -- python -m pytest tests/unit/test_results_exporter.py -k canonical_bundle -v"
  expected_output: "All canonical-bundle hash-stability tests pass."
- description: "Submit manifest primary and companion hashes survive no-op normalization."
  command: "uv run -- python -m pytest tests/unit/cli/commands/test_submit.py -k 'canonical or manifest or companion' -v"
  expected_output: "All canonical submit-manifest hash tests pass."
- description: "Existing checked-in bundles still validate after canonical writer changes."
  command: "uv run -- python scripts/validate_submission.py results-data/bundles/"
  expected_output: "Validated bundles report zero errors."
- description: "Pre-commit no longer needs the bundles exclusion."
  command: "uv run -- pre-commit run --all-files"
  expected_output: "No `results-data/bundles/*.json` files modified by EOF or trailing-whitespace hooks."

must_preserve:
- "All currently checked-in bundles in `results-data/bundles/` continue to validate against `validate_submission.py` before and after the canonicalization rollout."
- "Per-bundle manifest schema (PR #95) is not changed — only the hash-input bytes change."
- "`bundle_hash` and `companion_hashes` remain SHA-256 hex digests over file bytes; only the emitted bytes are made canonical."
- "Primary bundles, plans companions, and tuning companions are treated consistently."

approach: |
  Treat bundle and companion files as a binary contract. The `bundle_hash` and
  `companion_hashes` fields commit the writer to byte-stable output; honour
  that by emitting primary and companion JSON through a single canonical
  serializer and hashing the post-serialization bytes. Land in two PRs if
  needed: the writer/hash canonicalization first (W1-W3), then the pre-commit
  exclusion removal (W4) once the writer is in place and any in-flight bundles
  have been re-emitted or grandfathered.

anti_patterns:
- "DO NOT just restore the pre-commit exclusion as 'good enough' -- because every future tool that touches bundle bytes will re-trip the hash mismatch -- the durable fix is byte-stable emission."
- "DO NOT change the manifest's hash function or schema -- because external submitters may already have manifests on disk -- only change the writer side, then keep the same SHA-256 contract."
- "DO NOT canonicalize already-checked-in bundles in this TODO -- because that would break manifest hashes for currently-shipping bundles -- canonicalization applies to NEW emissions only; old bundles are grandfathered."
- "DO NOT canonicalize the primary bundle while leaving `.plans.json` or `.tuning.json` companions vulnerable -- because `companion_hashes` are validated by the same manifest path."

scope_limit:
  only_modify:
  - "benchbox/core/results/"
  - "benchbox/cli/commands/submit.py"
  - "tests/unit/test_results_exporter.py"
  - "tests/unit/cli/commands/test_submit.py"
  - ".pre-commit-config.yaml"
  - "_project/TODO/main/planning/results-data-byte-stable-bundle-emission.yaml"
  do_not_modify:
  - "results-data/bundles/"
  - "results-explorer/"
  - "scripts/validate_submission.py"

success_metrics:
- "EOF-fixer / trailing-whitespace pre-commit hooks no longer need to skip `results-data/bundles/`."
- "A new unit test demonstrates that the canonical bundle form survives a no-op whitespace normalization round-trip with hash unchanged."
- "A new submit-manifest test demonstrates that primary `bundle_hash` and companion hashes survive the same no-op normalization round-trip."
- "All currently checked-in bundles validate cleanly against `validate_submission.py` after the writer change (existing bundles are grandfathered, not rewritten)."

deferred:
- summary: "Backfill canonicalization for the existing 200 checked-in bundles"
  reason: "Rewriting checked-in bundles changes their hashes and breaks the audit trail tying them to specific submission events. Grandfather-only."

metadata:
  tags:
  - results-data
  - bundle-format
  - submission-flow
  - tooling
  estimated_effort: "Small (1 session)"
  created_date: "2026-05-03"

impact:
  business_value: |
    Removes a recurring trip-hazard in the submission flow — every future
    contributor PR avoids the W3 hash-mismatch detour.
  user_impact: |
    External submitters get a more forgiving submission flow that doesn't
    require maintainers to advise on byte-preservation tools.
  technical_debt: |
    Eliminates the `.pre-commit-config.yaml` exclusion as a permanent
    band-aid; reduces the surface where EOF normalization differs between
    submitter and reviewer environments.
