  description: |
    platforms/base/adapter.py: 2,171 stmts, 640 miss (67.9%).
    Target: push to 80% (~270 stmts gained).

    Use DuckDB adapter as concrete implementation:
    - _execute_with_retry: transient error retry with backoff
    - _format_results: result dict structure validation
    - _build_connection_string: string construction for different platforms
    - get_platform_info: engine name, version, features
    - Table management: create_schema, drop_schema with error paths
    - Plan capture: _capture_query_plan EXPLAIN output parsing
    - Error wrapping: PlatformError creation from various exception types
    - Query timeout: verify timeout parameter propagation
    - Result formatting: ensure timing fields are populated

    Existing tests: tests/unit/platforms/test_base_adapter.py — extend, not replace.

- id: w3
