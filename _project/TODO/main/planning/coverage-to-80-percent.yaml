  description: |
    platforms/dataframe/unified_frame.py: 1,633 stmts, 603 miss (58.7%).
    Target: push to 75% (~270 stmts gained).

    Prior work units (w2-w4 of dataframe-test-coverage TODO) covered column,
    filter, sort, aggregation, join, window, and expression operations.
    Remaining gaps:
    - String operations: contains, starts_with, ends_with, replace, concat
    - Date operations: year/month/day extraction, date_add, date_diff
    - Subquery operations: EXISTS, IN subquery, scalar subquery
    - CASE/WHEN with multiple branches and else
    - UNION/INTERSECT/EXCEPT set operations
    - DISTINCT and LIMIT/OFFSET
