deferred:
- summary: "TPC-DI ETL deep coverage (transformations.py, batch.py, scd_processor.py)"
  reason: "Requires full CDC/SCD pipeline infrastructure with staged incremental loads.
    2,226 missing statements but extremely high effort. Omitted from scope and deferred
    until TPC-DI ETL testing infrastructure is built."
- summary: "Cloud Spark adapters (EMR Serverless, Dataproc Serverless, Synapse Spark)"
  reason: "Require real cloud Spark sessions or complex mocking. Better covered by
    platform-live-integration-tests TODO."
- summary: "PySpark and LakeSail DataFrame adapters"
  reason: "Require external engines (Spark, LakeSail server). Config/validation logic
    was covered in dataframe-test-coverage w13; remaining gaps are engine-specific."
- summary: "Experimental modules (GPU benchmark, NL2SQL evaluator)"
  reason: "Experimental code changes frequently. Testing to 80% is wasted effort if
    modules are restructured. Cover after modules graduate from experimental."

metadata:
  tags:
  - testing
  - coverage
  - quality
  estimated_effort: "Large (2-3 weeks)"
  created_date: "2026-03-25"
  coverage_baseline:
    date: "2026-03-25"
    total_stmts: 109707
    total_miss: 27985
    total_pct: 71.4
    target_pct: 80.0
    gap_lines: 6044
  coverage_math: |
    Step 1 (w1 scope refinement): omit 3,526 untestable stmts → 76.3%
    Step 2 (w2-w11 targeted tests): cover ~3,928 lines → 80%+
    Budget: 2,465 stmts from core/cli/df + 730 cloud SQL + 450 cloud tier-2
            + 75 base + 190 utils = ~3,910 stmts

verification:
  command: |
    uv run -- python -m pytest -m "fast and not (slow or stress or resource_heavy or live_integration)" -n auto --strict-markers --tb=line -o "addopts=" -p pytest_cov --cov=benchbox --cov-report=term -q --no-header 2>&1 | grep -E "^(TOTAL|Required|WARNING)" | head -5
  expected: "TOTAL line shows >= 80% coverage; no WARNING about below threshold"

must_preserve:
- "All existing tests must continue to pass — new tests are additive"
- "Test suite speed: `make test-fast` must complete in < 90 seconds"
- "No `assert True`, `assert result is not None`, or `hasattr`-only assertions"
- "Cloud adapter tests must not require real credentials"
- "Coverage config in pyproject.toml remains source of truth for local dev"

anti_patterns:
- "DO NOT write import-only tests — because importing a module is not testing it —
  every test must call a function and assert on its output"
- "DO NOT add tests just to hit line coverage — because a test that can never fail
  is worse than no test — every test should fail if the code under test is broken"
- "DO NOT mock internal methods to test dispatchers — because you're testing mock
  wiring not behavior — use real DuckDB/Polars/DataFusion wherever possible"
- "DO NOT test cloud SQL generation by asserting mock.called — because that doesn't
  verify SQL correctness — assert the generated SQL string contains expected clauses"
- "DO NOT put 'coverage' in test filenames — because test names should describe what
  they verify — name after the behavior being tested"
- "DO NOT omit files from coverage just because they are hard to test — because that
  hides real gaps — only omit genuinely untestable code (external infrastructure,
  experimental, bulk mechanical translations)"

scope_limit:
  include:
  - "tests/ (new and modified test files)"
  - "pyproject.toml (coverage.run.omit, fail_under)"
  - ".coveragerc_core (CI alignment)"
  exclude:
  - "benchbox/ source code (no production changes)"
  - "pytest.ini (no changes to default test config)"

impact:
  business_value: |
    80% coverage with behavioral assertions provides high confidence for releases.
    The scope refinement (omitting TPC-DI ETL, experimental, ClickBench DF queries)
    is honest — these are genuinely untestable without infrastructure that doesn't
    exist yet. The remaining 3,928 lines are all testable with tools already in
    the project's dev dependencies.
  technical_debt: |
    Establishes coverage ratcheting at 80% that prevents regression. Aligns CI
    and local coverage measurement. Creates a clear policy for what gets omitted
    and why, preventing future debates about "coverage theater".
