id: audit-imported-dependencies-for-elimination
title: "Audit all imported dependencies and eliminate any not strictly required"
worktree: main
priority: Medium
status: Not Started
category: Code Quality and Technical Debt
description: |
  Systematic, evidence-based review of every dependency declared in the
  project with the goal of pruning anything that is not absolutely required.

  Motivation:
    - `pyproject.toml` declares ~15 core deps and ~50 optional-extra groups
      covering SQL platforms, cloud storage, DataFrame engines, benchmarks,
      docs, and MCP. Extras have accreted organically as platforms were
      added and it is no longer self-evident which imports are live, which
      are dead, and which are redundant with something already pulled in
      transitively.
    - Supply chain surface: every declared dep is an install target, a
      vulnerability surface, and a version-resolution constraint. Dropping
      unused deps shrinks install size, speeds CI, and reduces the matrix
      the release gate has to keep green.
    - Complements (does NOT replace) `review-dependency-upper-bounds-quarterly.yaml`.
      That item watches caps on *kept* deps for breakage; this item asks the
      prior question: does the dep belong in the manifest at all?

  Scope:
    - All `[project] dependencies`, `[project.optional-dependencies]`,
      `[dependency-groups]` in `pyproject.toml`.
    - Any `uv.sources` overrides, git pins, or platform markers.
    - Any runtime imports in `benchbox/`, `scripts/`, `tests/`, `docs/`
      that name a third-party package not declared in the manifest
      (the inverse check — declared-but-unused AND used-but-undeclared).

  Non-goals:
    - Not a version-bump exercise. Upper-bounds review is separate.
    - Not a rewrite of extras topology. Consolidation proposals are fine,
      but execution of breaking extras renames is out of scope and would
      be split into a follow-up.
    - Does NOT touch `_binaries/` bundled C++ binaries or dsdgen/dsqgen
      toolchain — those are artifacts, not Python deps.

  Deliverable:
    - A committed markdown inventory at
      `docs/development/dependency-inventory.md` listing every declared
      dep, its extras group(s), every source file that imports it, and
      a one-line justification for keeping it. Deps with no live imports
      or with justification "covered by <other dep>" are flagged as
      elimination candidates.
    - A short follow-up TODO (or set of TODOs) proposing concrete
      removals, gated on maintainer sign-off. No deps are deleted under
      this item — only inventoried and flagged.

work:
  - id: w1
    summary: "Enumerate every declared dep from pyproject.toml (core, all extras, dependency-groups, tool.uv.sources). Capture name, version spec, owning group(s), inline rationale."
    status: pending
    notes: |
      Parse `pyproject.toml` directly (tomllib) — do not use `uv pip list`
      because it surfaces transitives. Include env markers (python_version,
      sys_platform) in the captured row. Write raw table to
      `_project/scratch/dep-audit-raw.md`.

  - id: w2
    summary: "Build import-site map for each declared dep: Grep `import <name>` / `from <name>` across benchbox/, scripts/, tests/, docs/. Record every file:line that imports each dep."
    needs: [w1]
    status: pending
    notes: |
      Handle package-name vs import-name mismatches: pyyaml→yaml,
      psycopg2-binary→psycopg2, google-cloud-bigquery→google.cloud.bigquery,
      beautifulsoup4→bs4, pillow→PIL, etc. Maintain the pkg→import map in
      the inventory so future audits reuse it.

  - id: w3
    summary: "Inverse check: find third-party imports in source that are NOT declared in pyproject.toml. Classify as (a) truly undeclared, (b) transitive-reach, or (c) stdlib misidentified."
    needs: [w1]
    status: pending
    notes: |
      Ground truth for transitive reach is `uv tree`. Any "transitive-reach"
      finding is fragile and becomes a candidate for promotion to an explicit
      dep or removal of the dependent code path.

  - id: w4
    summary: "Classify each declared dep by purpose (Core / SQL-adapter / Cloud-storage / DataFrame / Benchmark / Dev-test / Docs / MCP) and identify the owning benchbox module(s)."
    needs: [w2]
    status: pending
    notes: |
      Flag deps declared across multiple extras groups where one group
      already transitively includes the other — consolidation candidates.

  - id: w5
    summary: "Produce elimination candidate list per dep: KEEP, FLAG-UNUSED, FLAG-REDUNDANT, or FLAG-DEAD-EXTRA. Each FLAG entry gets a one-line justification + evidence."
    needs: [w3, w4]
    status: pending
    notes: |
      Evidence = import-site count from w2, owner module from w4, overlap
      source for REDUNDANT. Verify plugin-style deps (ray for modin, entry-
      point-loaded backends) before flagging UNUSED.

  - id: w6
    summary: "Write docs/development/dependency-inventory.md — inventory table, elimination candidates with evidence, consolidation proposals, used-but-undeclared findings. Cross-link from AGENTS.md."
    needs: [w5]
    status: pending

  - id: w7
    summary: "Create follow-up TODOs for each actionable finding — one per elimination/consolidation cluster. Each follow-up carries its own verification and must_preserve. This item does not perform removals."
    needs: [w6]
    status: pending

deferred:
  - summary: "Actually remove any flagged deps from `pyproject.toml` / `uv.lock`"
    reason: "Out of scope for this audit — each removal is its own reviewable change with its own test surface. Tracked via the follow-up TODOs created in w7."
  - summary: "Bump upper bounds on kept deps"
    reason: "Covered by review-dependency-upper-bounds-quarterly.yaml."
  - summary: "Revisit extras naming / topology (e.g. `dataframe-pandas` vs `pandas` aliases)"
    reason: "Renames are breaking changes for existing installers; would require a deprecation cycle. Surface the duplication in the inventory but defer the rename work."

files_affected:
  added:
    - "docs/development/dependency-inventory.md"
    - "_project/scratch/dep-audit-raw.md"
  modified:
    - "AGENTS.md"

must_preserve:
  - "`pyproject.toml` is NOT modified by this audit — only inventoried"
  - "`uv.lock` is NOT regenerated as part of this work"
  - "Existing `review-dependency-upper-bounds-quarterly.yaml` scope stays intact — this audit explicitly complements, does not subsume"
  - "`scripts/check_dependency_bounds.py` behavior and CLI unchanged"
  - "No imports added, removed, or reordered in `benchbox/` source as part of the audit"

approach: |
  Research-only work — no behavior changes to the codebase. Produce an
  evidence-backed inventory and a set of follow-up implementation TODOs;
  maintainer decides which removals to authorize.

  Methodology:
    1. Source of truth for declared deps: parse `pyproject.toml` directly
       rather than relying on `uv pip list` (which includes transitive).
       Use `tomllib` in a small throwaway script under `_project/scratch/`
       if regex gets tangled by multi-line strings + env markers.
    2. Source of truth for import sites: `Grep` across the tree with the
       import-name (not package-name) for each dep. Maintain an explicit
       pkg→import-name map — there are several mismatches (pyyaml/yaml,
       psycopg2-binary/psycopg2, pillow/PIL, google-cloud-*/google.cloud.*,
       beautifulsoup4/bs4 if present). Record the map in the inventory so
       future audits reuse it.
    3. Transitive-reach classification uses `uv tree` output as ground
       truth. A dep is "transitively available" only if it appears in
       `uv tree` for a group that a live consumer module depends on.
    4. Ownership: tie every live import back to its owning benchbox
       module (e.g. `snowflake-connector-python` → `benchbox/platforms/snowflake/`).
       An extras group with zero live consumers is a FLAG-DEAD-EXTRA.
    5. Report format mirrors `docs/development/dependency-compatibility.md`
       so a reader can cross-reference cap rationale against usage.

anti_patterns:
  - "DO NOT remove any dep as part of this item — because each removal has its own test-surface and risk profile — surface as follow-up TODO instead"
  - "DO NOT rely on `uv pip list` as the source of truth for declared deps — because it includes transitives and masks which extras group owns a package — parse `pyproject.toml` directly"
  - "DO NOT assume package-name == import-name — because several deps don't match (pyyaml/yaml, psycopg2-binary/psycopg2, google-cloud-*/google.cloud.*) — maintain an explicit mapping"
  - "DO NOT conflate this audit with the quarterly upper-bounds review — because they answer different questions (keep-or-drop vs. cap-is-correct) — keep deliverables and follow-ups separate"
  - "DO NOT treat 'no imports found' as automatic grounds for removal — because plugin-style deps (e.g. ray for modin, some driver backends) can be imported dynamically via entry points — verify before flagging"

verification:
  - description: "Inventory document exists and lists every dep declared in pyproject.toml"
    command: "uv run -- python -c \"import tomllib, pathlib; d = tomllib.loads(pathlib.Path('pyproject.toml').read_text()); core = {s.split('>')[0].split('<')[0].split('=')[0].split(';')[0].strip() for s in d['project']['dependencies']}; extras = {s.split('>')[0].split('<')[0].split('=')[0].split(';')[0].split('[')[0].strip() for g in d['project']['optional-dependencies'].values() for s in g}; groups = {s.split('>')[0].split('<')[0].split('=')[0].split(';')[0].split('[')[0].strip() for g in d.get('dependency-groups', {}).values() for s in g if isinstance(s, str)}; all_deps = (core | extras | groups) - {''}; missing = [p for p in sorted(all_deps) if p.lower() not in pathlib.Path('docs/development/dependency-inventory.md').read_text().lower()]; print('MISSING:', missing) if missing else print('OK: all', len(all_deps), 'deps present in inventory')\""
    expected_output: "OK: all N deps present in inventory"
  - description: "No source files were modified under benchbox/"
    command: "git diff --name-only HEAD -- benchbox/ | wc -l"
    expected_output: "0"
  - description: "pyproject.toml and uv.lock are untouched by this work"
    command: "git diff --name-only HEAD -- pyproject.toml uv.lock | wc -l"
    expected_output: "0"
  - description: "Follow-up TODOs exist in planning/ for every FLAG-* entry in the inventory"
    command: "uv run -- python -c \"import re, pathlib; inv = pathlib.Path('docs/development/dependency-inventory.md').read_text(); flags = set(re.findall(r'FLAG-\\w+.*?\\b([a-z0-9][a-z0-9_-]+)\\b', inv, re.I)); todos = {p.name for p in pathlib.Path('_project/TODO/main/planning').glob('*depend*')}; print('flagged:', len(flags), 'follow-up TODOs:', len(todos))\""
    expected_output: "flagged count and follow-up TODO count both non-zero (manual cross-check in PR)"

scope_limit:
  only_modify:
    - "docs/development/dependency-inventory.md"
    - "_project/scratch/dep-audit-raw.md"
    - "AGENTS.md"
    - "_project/TODO/main/planning/"
  do_not_modify:
    - "pyproject.toml"
    - "uv.lock"
    - "benchbox/"
    - "scripts/"
    - "tests/"
    - "_binaries/"
    - ".github/workflows/"

deps:
  needs: []

metadata:
  tags: ["quality-plan", "maintenance", "supply-chain", "deps", "audit", "tech-debt"]
  estimated_effort: "Medium (1-2 days for inventory + report; follow-up removals tracked separately)"
  created_date: "2026-04-15"

impact:
  business_value: |
    Reduces install size, CI install time, and supply-chain surface. Every
    dep we don't ship is one fewer CVE to track, one fewer resolver conflict
    to untangle, and one fewer thing for contributors to learn.
  user_impact: |
    Faster `uv sync` / `pip install` for contributors and downstream users.
    Cleaner extras groups mean fewer "why did this pull in X?" surprises
    when installing a single-platform extra.
  technical_debt: |
    The extras topology in pyproject.toml has grown organically across
    ~50 groups. A documented inventory with owner-module attribution
    turns "what does this dep do?" from tribal knowledge into a
    searchable document.

success_metrics:
  - "Every dep declared in pyproject.toml appears in the inventory with at least one of: import-site list, owner module, or explicit 'transitive-only' classification"
  - "Used-but-undeclared imports are either zero or tracked by a follow-up TODO"
  - "Every FLAG-* entry in the inventory has a corresponding follow-up TODO in `_project/TODO/main/planning/`"
  - "Inventory is cross-linked from AGENTS.md Dependency section so future contributors find it"

open_questions:
  - "Should the inventory live under `docs/development/` (developer-facing) or `_project/` (internal process artifact)? Leaning developer-facing so contributors can see dep ownership."
  - "For DataFrame engines with overlapping install footprints (modin/dask/polars), is per-engine FLAG-REDUNDANT in scope, or does that need a separate product-level decision about which engines we support?"
  - "Do we treat `requests` (pulled in by several extras transitively and probably imported directly somewhere) as declared-via-transitive-reach, or does it graduate to an explicit core dep?"
