  modified:
    - "benchbox/core/explorer_pipeline/models.py"
    - "benchbox/core/explorer_pipeline/transformer.py"

must_preserve:
  - "Existing `platform` field on ManifestEntry and DetailResult — raw bundle string, unchanged for display/debugging"
  - "Existing `geomean_ms` field — raw-sample geomean preserved for backward compat; do not rename or remove"
  - "Existing manifest.json schema shape — this adds fields, does not remove or rename any existing keys"
  - "Existing `queries: list[QueryTiming]` on DetailResult — raw per-sample timings preserved for audit; display_timings is additive"

approach: |
  All changes are additive to the read model — no existing fields are
  removed or renamed. Add the new functions and fields, populate them
  in the existing `to_manifest_entry` and `to_detail_result` methods.

  The canonical order:
    1. Define models + constants (w3, w4) — no behavior, just schema
    2. Define pure functions (_platform_id, _query_display_ms, select_canonical_row)
    3. Wire into the transformer methods
    4. Test with fixtures that exercise the edge cases

  Do not change how existing fields are computed. The new fields are
  derived from the same bundle data, just with a different reduction.

anti_patterns:
  - "DO NOT rename geomean_ms to sample_geomean_ms — because it breaks any existing consumers reading that field — add display_geomean_ms alongside it"
  - "DO NOT strip the raw platform string from ManifestEntry — because it is needed for display and debugging — add platform_id as a new field"
  - "DO NOT use mean instead of median for display_ms reduction — because a single cold-cache outlier inflates the mean — use median for robustness"
  - "DO NOT hard-code 'maintainer-run' in query logic — because the eligibility rules must be the single source of truth — use is_ranking_eligible()"
  - "DO NOT apply canonical-row selection inside to_manifest_entry — because the transformer processes one bundle at a time — selection happens in the pipeline after all entries are loaded"

scope_limit:
  only_modify:
    - "benchbox/core/explorer_pipeline/models.py"
    - "benchbox/core/explorer_pipeline/transformer.py"
    - "tests/unit/core/explorer/test_read_model_contract.py"
  do_not_modify:
    - "benchbox/core/explorer_pipeline/pipeline.py"
    - "benchbox/core/explorer_pipeline/duckdb_builder.py"
    - "results-explorer/src/**"

