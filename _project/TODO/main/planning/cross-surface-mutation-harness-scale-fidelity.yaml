id: cross-surface-mutation-harness-scale-fidelity
title: "Mutation-sensitivity harness: build cells at each gate's own scale and cover H2O-DB (make the existing drift guard pass)"
worktree: main
priority: High
status: Not Started
category: Testing and Quality Assurance

description: |
  The cross-surface mutation-sensitivity suite measures whether each enforced
  gate's comparator actually catches a planted divergence. Two coupled defects make
  it test a DIFFERENT dataset than CI gates, and leave one enforced gate uncovered:

  1. Wrong scale. _build_gate_cell (tests/integration/test_cross_surface_mutation_
     sensitivity.py:269) builds every cell with the GLOBAL EQUIVALENCE_SCALE,
     ignoring the gate's own scale_factor. H2O-DB explicitly carries
     scale_factor=_H2ODB_SCALE because its generator base is the 10M-row small tier
     - the global 0.1 would emit ~1M rows (cross_surface.py:973 comment). So the
     mutation harness measures sensitivity on a dataset that does not match the
     enforced gate, and cannot host H2O-DB at all as written.

  2. Missing target. _TARGETS (test:100) lists ssb/amplab/coffeeshop/clickbench/
     joinorder_synthetic but OMITS h2odb, even though h2odb is enforced in GATES
     (cross_surface.py:973). The drift guard test_targets_cover_every_enforced_gate
     (test:332) already asserts set(_TARGETS) == set(GATES) - so it is (or should
     be) RED for h2odb. The work is to make that EXISTING guard pass and ensure its
     lane runs in CI, not to add a new guard.

prior_art:
  - ref: "tests/integration/test_cross_surface_mutation_sensitivity.py:332"
    note: "test_targets_cover_every_enforced_gate already asserts set(_TARGETS)==set(GATES). This item makes it pass; do not add a duplicate guard."
  - ref: "tests/integration/test_cross_surface_mutation_sensitivity.py:269"
    note: "_build_gate_cell uses gate.build(EQUIVALENCE_SCALE, ...). Change to gate.build(gate.scale_factor, ...) - scale_factor is part of the gate contract (CrossSurfaceGate dataclass default), so use it directly, NOT `gate.scale_factor or EQUIVALENCE_SCALE` (that re-leaks policy into the test)."
  - ref: "benchbox/core/equivalence/cross_surface.py:973"
    note: "h2odb gate definition with scale_factor=_H2ODB_SCALE and the ~100k-row bounded-cell rationale - pick an h2odb target query that is non-vacuous at that scale."
  - ref: "tests/integration/test_cross_surface_mutation_sensitivity.py:100"
    note: "_TARGETS map and the per-target caveat comments - add h2odb with a discriminating GROUP BY + ORDER BY query returning multiple non-NULL rows."

work:
  - id: w1
    summary: "Build each mutation cell at the gate's own scale_factor"
    status: pending
    needs: []
    notes: |
      Change _build_gate_cell to call gate.build(gate.scale_factor, tmp_path) so the
      mutation cell matches the enforced-gate cell. Use the dataclass default as the
      single source of truth; do not re-implement an `or EQUIVALENCE_SCALE` fallback.
      Re-verify the existing parametrized gates still build non-vacuous reference
      rows at their own scale.

  - id: w2
    summary: "Add a non-vacuous H2O-DB mutation target and make the drift guard green"
    status: pending
    needs: [w1]
    notes: |
      Pick an h2odb query (GROUP BY + ORDER BY) that returns multiple non-NULL rows
      at _H2ODB_SCALE (~100k rows), add it to _TARGETS, and confirm
      test_targets_cover_every_enforced_gate (test:332) and
      test_unmutated_target_is_green pass for h2odb. The unmutated cell must be
      non-empty and discriminating; each mutation kind (flip_comparator,
      drop_group_key, reverse_sort, drop_join) must be CAUGHT (and reverse_sort's
      documented order-blind miss for non-ORDER-BY shapes still holds where it
      legitimately should).

  - id: w3
    summary: "Confirm the mutation-sensitivity lane actually runs in CI"
    status: pending
    needs: [w2]
    notes: |
      The drift guard only protects if its lane executes. Confirm the integration
      lane that collects test_cross_surface_mutation_sensitivity.py runs in
      .github/workflows (or add it to the appropriate required job). If it is a
      slow/integration marker excluded from the default lane, ensure at least the
      lightweight set(_TARGETS)==set(GATES) guard runs in a required lane so a future
      gate promotion cannot silently skip mutation coverage.

must_preserve:
  - "Existing gate mutation cells stay non-vacuous and their planted-mutation catches are unchanged."
  - "No change to production gate behavior or to CrossSurfaceGate semantics - this is test-harness fidelity only (plus possibly a CI lane wiring)."

anti_patterns:
  - "DO NOT use `gate.scale_factor or EQUIVALENCE_SCALE` - rely on the dataclass default; the `or` form silently substitutes policy and defeats the contract."
  - "DO NOT pick an h2odb target that is vacuous (empty/all-NULL) at _H2ODB_SCALE - the sensitivity result would be meaningless (a BS3-vacuous pass)."

verification:
  - description: "Every enforced gate is mutation-covered at its own scale"
    command: "uv run -- python -m pytest tests/integration/test_cross_surface_mutation_sensitivity.py -q"
    expected_output: "test_targets_cover_every_enforced_gate passes (6 gates incl h2odb); all mutation kinds caught; unmutated targets green"

scope_limit:
  only_modify:
    - "tests/integration/test_cross_surface_mutation_sensitivity.py"
    - ".github/workflows/"

success_metrics:
  - "set(_TARGETS) == set(GATES) holds with h2odb included and the guard runs in CI."
  - "Mutation cells are built at each gate's enforced scale_factor."

