impact:
  business_value: |
    Unblocks four sketch follow-up TODOs in one architectural pass and
    prevents future platform-specific write_primitives work from
    rediscovering the same schema gap. Users get a cleaner path to
    cross-engine sketch coverage and DataFrame-mode sketch persistence.
  user_impact: |
    ClickHouse and PySpark sketch work can resume with explicit
    runtime contracts instead of catalog-only workarounds. Future
    benchmark authors get documented extension points for
    platform-specific validation and aggregate-state DataFrame ops.
  technical_debt: |
    Converts two blind spots into first-class model concepts. This
    avoids forcing validation dialect differences through operation
    overrides and avoids cramming aggregate-state DataFrame workflows
    into row-level mutation APIs.

