id: write-primitives-architecture-fixes
title: "Write Primitives: architecture fixes for sketch validation and DataFrame aggregate-state ops"
worktree: main
priority: Medium-High
status: "Not Started"
category: "Core Functionality"

description: |
  Fix two write_primitives architecture gaps that surfaced in the
  2026-05-02 sketch TODO batch:

  - SQL-mode validation queries cannot vary by platform, so a
    ClickHouse override for a sketch op can still fail by running a
    DuckDB-only `validation_query.sql` body on ClickHouse.
  - DataFrame-mode write operations are limited to row-level mutation
    shapes, so PySpark HLL persist/merge sketches cannot be expressed
    without expanding the execution model.

  These gaps blocked separate sketch TODOs, but they touch the same
  write_primitives schema, loader, execution, validation, docs, and
  test plumbing. A single fix-class TODO is cheaper and safer than two
  separate TODOs because it forces the validation contract and the
  DataFrame aggregate-state contract to be designed together, then
  updates the blocked sketch TODOs once the shared architecture is in
  place. Splitting this work would duplicate test scaffolding and
  likely leave the second pass re-opening decisions made by the first.

context_sections:
  "PR #133 Validation-query blind spot": |
    PR #133 (`chore/sketch-clickhouse-blockers`) captured the SQL
    validation gap in:

      - `_project/blind-spots/2026-05-02-155448-validation-query-no-per-platform-override.md`

    The finding is architectural, not a ClickHouse syntax detail:
    `WriteOperation.write_sql` supports platform overrides, but
    `WriteOperation.validation_queries[]` has only one SQL body and
    `_run_operation_validation` sends it directly to the active
    connection. Any sketch op whose validation uses DuckDB-only
    DataSketches functions needs `validation_query.platform_overrides`
    before a non-DuckDB implementation can land safely.

  "PR #136 DataFrame aggregate-state blind spot": |
    PR #136 (`chore/sketch-pyspark-blocker`) captured the DataFrame
    execution-model gap in:

      - `_project/blind-spots/2026-05-02-163132-write-primitives-dataframe-execution-model-no-sketch-shape.md`

    `WriteOperationType` currently models INSERT, BULK_LOAD, UPDATE,
    DELETE, MERGE, and TRANSACTION. Sketch persistence needs a
    different shape: build aggregate state by group, persist the state,
    read it back, merge the state, then extract a scalar. Add explicit
    `AGGREGATE_PERSIST` and `AGGREGATE_MERGE` operation types instead
    of forcing sketch work through row-level maintenance APIs.

  "Related but out of scope": |
    PR #133 also captured DuckDB community datasketches extension drift
    in `_project/blind-spots/2026-05-02-155524-duckdb-datasketches-extension-drift.md`.
    This TODO does not vendor or replace that extension. It should
    leave enough validation and op-type structure for a later extension
    stabilization TODO to proceed without another schema pass.

  "Blocked TODO dependency edges": |
    The TODO schema supports inbound dependencies through
    `deps.needs`; it does not support `deps.blocks`. The four sketch
    TODOs unblocked by this work should depend on this item:

      - `write-primitives-sketch-clickhouse-and-storage-metrics`
      - `write-primitives-sketch-pyspark-dataframe-surface`
      - `write-primitives-sketch-duckdb-cpc-req-families`
      - `write-primitives-sketch-parameter-sweeps`

    `write-primitives-sketch-cloud-verification` is intentionally not
    included because its primary remaining blocker is cloud credential
    access and per-engine runtime verification.

work:
  - id: w1
    summary: "Extend validation_queries schema with platform_overrides"
    status: pending
    notes: |
      Add optional `platform_overrides` support to each
      `ValidationQuery` entry, mirroring the operation-level override
      semantics:

        validation_queries:
          - id: scalar_bounds
            sql: "DuckDB/default SQL"
            platform_overrides:
              clickhouse: "ClickHouse SQL"
              redshift: null

      Implement in the catalog model and loader, and update
      `_run_operation_validation` so it resolves the active platform's
      validation SQL before execution. Preserve the current default
      behavior when no override exists. Define `null` override semantics
      explicitly: either skip that validation with a reason or inherit
      default SQL, but do not leave it ambiguous.

  - id: w2
    summary: "Add DataFrame aggregate-state write operation types"
    status: pending
    notes: |
      Extend `WriteOperationType` with `AGGREGATE_PERSIST` and
      `AGGREGATE_MERGE`, then add manager dispatch paths that can
      express sketch-shaped DataFrame work without abusing INSERT,
      MERGE, or maintenance hooks.

      The design should be analogous to read_primitives'
      `expression_impl` / `pandas_impl` registration pattern, but not
      copied blindly. Write-side aggregate-state ops need durable
      output paths, cleanup behavior, partition awareness, validation
      contracts, and skip/capability handling. PySpark HLL should be
      the first implementation target because it is the immediate
      blocked consumer.

  - id: w3
    summary: "Add focused tests and docs for both new extension points"
    needs: [w1, w2]
    status: pending
    notes: |
      Add unit tests for validation-query override resolution,
      including default inheritance, platform-specific SQL, and null
      behavior. Add DataFrame write-operation tests that prove the new
      aggregate-state operation types route through their own manager
      methods and do not reuse row-level maintenance operations.

      Update write_primitives developer docs so future catalog authors
      know when to use `validation_query.platform_overrides` and when
      to use aggregate-state DataFrame operation types.

  - id: w4
    summary: "Restore the four blocked sketch TODOs to ready follow-up state"
    needs: [w3]
    status: pending
    notes: |
      Once the code/docs/tests land, update these four TODOs:

        - `write-primitives-sketch-clickhouse-and-storage-metrics`
        - `write-primitives-sketch-pyspark-dataframe-surface`
        - `write-primitives-sketch-duckdb-cpc-req-families`
        - `write-primitives-sketch-parameter-sweeps`

      Confirm each has a `deps.needs` edge to this TODO, flip status
      from `Blocked` back to `Not Started`, and replace the prepended
      BLOCKED sections with concise "unblocked by
      write-primitives-architecture-fixes" notes. Do not alter their
      original implementation scopes except where needed to remove the
      hard-block language.

deferred:
  - summary: "DuckDB datasketches extension stabilization"
    reason: "PR #133's extension-drift blind spot is real, but vendoring or replacing DuckDB's community extension is a separate dependency-management decision from the write_primitives architecture fixes."
  - summary: "Cloud credential setup for sketch verification"
    reason: "`write-primitives-sketch-cloud-verification` remains blocked by live cloud access and per-engine runtime checks, not by the two schema/model gaps covered here."

