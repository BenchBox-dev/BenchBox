open_questions:
  - "Should a `validation_query.platform_overrides.<platform>: null` mean skip validation for that platform, or inherit the default SQL? Lean: explicit skip with a logged/result reason, because `null` operation overrides already mean unsupported on that platform."
  - "Should `AGGREGATE_PERSIST` and `AGGREGATE_MERGE` be separate operation types or one aggregate-state workflow type with phases? Lean: separate types, matching the persisted-state and merge/readback measurements users care about."
  - "Should aggregate-state DataFrame ops store intermediate state through the benchmark output directory only, or allow adapter-native temporary tables/views where available? Lean: use benchmark output paths first, then add adapter-native acceleration only after parity exists."
