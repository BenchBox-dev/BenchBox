must_preserve:
  - "Existing write_primitives operations without validation_query.platform_overrides validate exactly as they do today."
  - "Operation-level platform_overrides behavior remains unchanged."
  - "SQL write_primitives execution remains independent from DataFrame aggregate-state operation support."
  - "Existing DataFrame INSERT, BULK_LOAD, UPDATE, DELETE, MERGE, and TRANSACTION paths keep their current dispatch behavior and result contracts."
  - "Blocked sketch TODO scopes remain intact until their dedicated implementation PRs resume."

approach: |
  Implement the validation-query schema extension first because it is
  a narrow catalog/runtime change with clear unit-test coverage. Then
  add the DataFrame aggregate-state op types, designing the registration
  and dispatch API around the PySpark HLL consumer but keeping the
  shape engine-neutral enough for later Polars, DataFusion, or
  ClickHouse-style aggregate-state work.

  Treat the two fixes as one architectural pass: both require deciding
  how write_primitives expresses non-default runtime behavior without
  hiding it inside ad hoc SQL strings or engine-specific branches.
  Keep the implementation small, explicit, and documented.

anti_patterns:
  - "DO NOT solve validation-query portability by embedding CASE logic or dialect probes in SQL strings - because validation semantics belong in the catalog model - add explicit `validation_query.platform_overrides` and test resolution centrally."
  - "DO NOT make `validation_query.platform_overrides` silently skip validation unless `null` skip semantics are documented and tested - because a skipped validation can hide a broken op - require a clear reason in logs/results."
  - "DO NOT express aggregate-state DataFrame ops as INSERT or MERGE - because sketch persist/merge is not row-level mutation - add explicit `AGGREGATE_PERSIST` / `AGGREGATE_MERGE` types and route them separately."
  - "DO NOT copy read_primitives' `expression_impl` / `pandas_impl` shape without accounting for write-side cleanup, durability, validation, and partitioning - because write_primitives has lifecycle responsibilities read_primitives does not."
  - "DO NOT unblock or rewrite the four sketch TODOs before the architecture tests are green - because their BLOCKED state is a guardrail against repeating the failed implementation attempts."

