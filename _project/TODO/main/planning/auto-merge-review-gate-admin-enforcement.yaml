id: auto-merge-review-gate-admin-enforcement
title: "Make the soundness-path review gate enforceable at the repo layer, not just code"
worktree: main
priority: High
status: In Progress
category: Release Tooling

description: |
  Follow-up to auto-merge-review-gate-soundness-paths (PR #912, already DONE). The
  adversarial holistic-review found the gate is only half-real in production. The
  code side is correct and sound: pr-open (Makefile:1161) and the
  auto-merge-on-open.yml workflow share one predicate
  (_project/scripts/auto_merge_soundness_paths.py, invoked with --no-renames) and
  correctly WITHHOLD auto-merge enablement for PRs touching comparator/plan-parser
  soundness paths. But nothing ENFORCES a review: the develop ruleset
  `develop-squash-only` has required_approving_review_count: 0 and
  require_code_owner_review: false (verified via `gh api repos/.../rules/branches/develop`;
  legacy branch protection returns 404 "Branch not protected"). So a soundness-path
  PR can still be squash-merged with zero approvals — manually or by re-enabling
  auto-merge. The DONE item's success_metric ("PRs touching the comparator or plan
  parsers cannot squash-auto-merge without a review") is NOT met at the repo level.

  Two parts: (1) a CI meta-check that makes the gap LOUD and self-healing so it
  cannot silently regress once set; (2) the actual ruleset change, which requires
  a repo admin and is tracked here as the gating human action.

prior_art:
  - ref: "_project/scripts/auto_merge_soundness_paths.py"
    note: "The shared soundness-path predicate; the meta-check should reuse its SOUNDNESS_PREFIXES so the CI assertion and the auto-merge withholding agree on one source of truth."
  - ref: ".github/workflows/pr.yml:270"
    note: "Existing 'Oracle coverage map drift check' / drift-check step pattern in the lint job — model the ruleset meta-check on these gh-api-backed drift steps."
  - ref: "CODEOWNERS"
    note: "Owns the soundness globs (parsers/**, equivalence/**, **/validation.py); require_code_owner_review only triggers if an owner team/user is actually assigned to those paths — verify, do not assume."

work:
  - id: w0
    summary: "Re-confirm live ruleset state and CODEOWNERS ownership of soundness globs"
    status: done
    needs: []
    notes: |
      Capture `gh api repos/joeharris76/BenchBox/rulesets` and the develop ruleset
      detail; record required_approving_review_count and require_code_owner_review.
      Confirm CODEOWNERS assigns a real owner to parsers/**, equivalence/**,
      **/validation.py. Summarize (values + glob->owner) in the PR body.

  - id: w1
    summary: "Add a CI meta-check that fails when the develop ruleset lacks review enforcement"
    status: done
    needs: [w0]
    notes: |
      Add a step in an ALWAYS-required job (e.g. pr.yml lint / code-lint), never
      content-guard: content-guard is gated by content-guard-needed and skipped for
      code-only PRs (ci-required-result ignores it unless content paths changed), so
      a check placed there would let a code-only PR pass while review enforcement is
      absent - defeating this item's stated self-healing guarantee. The step queries
      the live develop ruleset via gh api and FAILS if require_code_owner_review !=
      true. required_approving_review_count is deliberately NOT part of this check:
      it is branch-wide, not CODEOWNERS-scoped, so asserting it here would gate
      every develop PR rather than just soundness-path ones (see
      ruleset_review_enforcement.py's module docstring). Reuse
      auto_merge_soundness_paths.py SOUNDNESS_PREFIXES for the path set it narrates.
      If a ruleset-read token is unavailable in CI, fall back to a documented manual
      release-runbook checklist item and record that decision.

  - id: w2
    summary: "Correct the DONE success_metric and document the admin runbook step"
    status: done
    needs: [w0]
    notes: |
      Amend _project/DONE/main/active/auto-merge-review-gate-soundness-paths.yaml
      success_metrics to state the code side is complete and the hard review
      precondition is enforced by the ruleset change tracked in THIS item (link by
      id). Add the exact ruleset PUT to the release/admin runbook (AGENTS.md or
      docs) so the human action is discoverable.

  - id: w3
    summary: "Verify enforcement end-to-end once the admin applies the ruleset change"
    status: pending
    needs: [w1, w2]
    notes: |
      After the deferred admin action lands: open a throwaway soundness-path PR with
      0 approvals and confirm it cannot be squash-merged (ruleset blocks it), and
      that the meta-check (w1) is green. Record evidence. This work unit stays
      pending until the admin action (deferred) completes.

must_preserve:
  - "The code-side withholding behavior (pr-open + auto-merge-on-open.yml shared predicate, --no-renames) is unchanged."
  - "Non-soundness-path PRs keep squash auto-merge on CI-pass; this item only hardens the soundness exception."

anti_patterns:
  - "DO NOT mark this Completed while the ruleset still shows review_count 0 / code-owner review false — that repeats the overstated DONE metric."
  - "DO NOT duplicate the soundness path list; the meta-check must read it from auto_merge_soundness_paths.py."

verification:
  - description: "Meta-check fails on an unenforced ruleset and passes on an enforced one"
    command: "uv run -- python -m pytest tests/unit/release/ -k ruleset_review_enforcement -q"
    expected_output: "asserts the check fails when review_count<1 or code-owner review false; passes otherwise"

scope_limit:
  only_modify:
    - ".github/workflows/pr.yml"
    - "_project/scripts/"
    - "tests/unit/release/"
    - "docs/"
    - "AGENTS.md"
    - "_project/DONE/main/active/auto-merge-review-gate-soundness-paths.yaml"

success_metrics:
  - "develop ruleset shows require_code_owner_review true (required_approving_review_count is deliberately not part of the target - it is branch-wide, not CODEOWNERS-scoped, so requiring it would gate every develop PR instead of just soundness-path ones)."
  - "A soundness-path PR with zero approvals cannot be squash-merged (w3 evidence)."
  - "The CI meta-check turns red if the ruleset enforcement is ever removed."

deferred:
  - summary: "Apply the develop ruleset change: require_code_owner_review=true."
    reason: "Requires a repo admin (gh api PUT on the ruleset); cannot be done by an agent PR. Tracked as the gating human action for w3."

metadata:
