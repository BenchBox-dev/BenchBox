id: move-todo-dag-tooling-out-of-benchbox
title: "Move the repo-local TODO DAG tooling into shared contributor infrastructure without breaking local workflows"
worktree: main
priority: Medium
status: Not Started
category: Supporting Infrastructure
description: |
  BenchBox carries substantial TODO management software under `_project/`,
  including a DAG-aware CLI, validation, and index generation. That tooling is
  useful, but it is orthogonal to BenchBox's product goal and appears closer to
  shared contributor infrastructure than benchmark functionality.

  This item plans a move to shared tooling while preserving the current TODO
  data model, local commands, and contributor workflows that depend on it.

metadata:
  tags:
  - contributor-tooling
  - todo
  - infrastructure
  - scope-review
  estimated_effort: "Medium"
  created_date: "2026-03-12"
  source_review: "Orthogonal functionality review finding #7"

impact:
  user_impact: |
    No end-user product impact is expected because the tooling is contributor
    facing. The main beneficiary is repo maintainability rather than runtime
    capability.
  maintainer_impact: |
    High contributor-workflow impact. Many instructions, skills, and habits
    currently assume the `_project/scripts/` commands. Migration must therefore
    prioritize command continuity.
  packaging_impact: |
    Low for end users, moderate for contributors. The main packaging question is
    whether the shared tooling is vendored, pinned as a dev dependency, or
    mirrored into the repo.
  regression_risk: |
    Moderate. The biggest risk is workflow disruption: broken agent guidance,
    invalid indexes, or contributors needing network access to manage TODOs.

justification: |
  This is software for maintaining the repository, not for benchmarking data
  platforms. Keeping it in BenchBox is defensible only if the repo is the long-
  term source of truth. If the same tooling is intended for multiple projects,
  it belongs in shared contributor infrastructure with BenchBox owning only its
  data, schema, and any repo-specific wrappers.

cost_benefit_analysis:
  expected_benefits: |
    Medium. Shared tooling reduces duplication across repos, makes BenchBox's
    root scope cleaner, and centralizes maintenance of the DAG logic.
  expected_costs: |
    Medium. Contributor docs, agent skills, wrappers, and local validation flows
    all need careful coordination. There is also a risk of creating a fragile
    external dependency for repo maintenance.
  recommendation: |
    Pursue this only with zero-network local wrappers and explicit version
    pinning. If the tooling cannot be shared without harming contributor
    reliability, keep it repo-local and instead document it as internal
    infrastructure.

files_affected:
  modified:
  - "_project/scripts/todo_cli.py"
  - "_project/scripts/validate_todo.py"
  - "_project/scripts/generate_indexes.py"
  - "_project/TODO_SCHEMA.yaml"
  - "_project/TODO_ENTRY_TEMPLATE.yaml"
  - ".codex/skills/todo/"
  - ".codex/skills/project-todo-sync/"
  - "AGENTS.md"
  - "pyproject.toml"
  added:
  - "devtools/"
  - "docs/contributor/"

work:
- id: w1
  summary: "Inventory every invocation of TODO tooling across scripts, AGENTS instructions, skills, docs, and CI"
  status: pending
  notes: |
    The migration plan must account for human and agent workflows, not just the
    Python entry points.

- id: w2
  summary: "Choose the target ownership model for shared TODO tooling and document versioning and update rules"
  needs: [w1]
  status: pending
  notes: |
    Compare vendored shared tooling, same-repo shared package, and pinned dev
    dependency models. Prefer the option with the least operational fragility.

- id: w3
  summary: "Design compatibility wrappers so `_project/scripts/*.py` commands keep working during and after the move"
  needs: [w2]
  status: pending
  notes: |
    Command continuity is a hard requirement because the repo, skills, and
    contributor guidance depend on these paths today.

- id: w4
  summary: "Move the shared logic while keeping the BenchBox TODO data model, schema, and indexes repo-owned"
  needs: [w3]
  status: pending

- id: w5
  summary: "Update contributor docs, skills, and local automation to reflect the new ownership boundary"
  needs: [w4]
  status: pending

- id: w6
  summary: "Prove parity by running validation, graph checks, and index generation through the compatibility path"
  needs: [w5]
  status: pending

- id: w7
  summary: "Remove duplicated in-repo logic only after wrapper-based parity is stable"
  needs: [w6]
  status: pending

must_preserve:
- "The current TODO data format, schema, and distributed file layout under `_project/TODO/`"
- "Offline, local execution of TODO commands with no network requirement"
- "Existing contributor and agent command paths until replacement wrappers are documented and verified"

approach: |
  Move logic, not workflow. BenchBox should continue to own its TODO data and
  repo-specific rules while shared tooling owns generic DAG behavior. Keep local
  wrapper commands so contributors and agents do not have to relearn the tool
  surface during the migration.

anti_patterns:
- "DO NOT require network access for routine TODO operations, because contributor infrastructure must remain reliable offline"
- "DO NOT change the TODO schema and the tooling location in the same step, because that makes regressions harder to isolate"
- "DO NOT break `_project/scripts/*.py` command paths before updating AGENTS instructions and skill wrappers, because that would destabilize current workflows immediately"

verification:
- description: "TODO schema validation still passes through the local command path"
  command: "uv run _project/scripts/validate_todo.py _project/TODO"
  expected_output: "Exit code 0"
- description: "DONE items still validate through the local command path after wrapper changes"
  command: "uv run _project/scripts/validate_todo.py _project/DONE"
  expected_output: "Exit code 0"
- description: "TODO graph validation still passes through the migrated wrapper path"
  command: "uv run _project/scripts/todo_cli.py check-graph"
  expected_output: "Exit code 0"
- description: "Index generation still succeeds through the migrated wrapper path"
  command: "uv run _project/scripts/generate_indexes.py"
  expected_output: "Exit code 0"

scope_limit:
  only_modify:
  - "_project/scripts/todo_cli.py"
  - "_project/scripts/validate_todo.py"
  - "_project/scripts/generate_indexes.py"
  - "_project/TODO_SCHEMA.yaml"
  - "_project/TODO_ENTRY_TEMPLATE.yaml"
  - ".codex/skills/todo/"
  - ".codex/skills/project-todo-sync/"
  - "AGENTS.md"
  - "docs/contributor/"
  - "pyproject.toml"
  - "devtools/"
  do_not_touch:
  - "Benchmark runtime code under `benchbox/`"
  - "User-facing CLI behavior unrelated to contributor tooling"
  - "Benchmark result formats"

open_questions:
- "Is there already a canonical shared home for this DAG tooling outside BenchBox?"
- "Should BenchBox keep thin wrappers indefinitely to protect contributor muscle memory?"
- "Which parts of `_project/` are truly generic tooling versus BenchBox-specific policy and data?"
