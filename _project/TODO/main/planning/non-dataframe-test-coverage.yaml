deferred:
- summary: "TPC-DI ETL coverage (transformations.py 1,053 miss, batch.py 882 miss)"
  reason: "TPC-DI ETL is 1,935 missing statements but requires complex DataFrame fixtures simulating CDC, SCD, and batch processing.
    High effort, niche benchmark. Cover after 80% overall target is reached."
- summary: "Experimental module coverage (723 miss, 75.3%)"
  reason: "Experimental code changes frequently. Testing to 80% is wasted effort if modules are restructured. Cover after
    modules graduate from experimental."
- summary: "Cloud Spark staging/session coverage (base/cloud_spark/ 175 miss)"
  reason: "Requires Spark session mocking which is fragile. Better covered by platform-live-integration-tests TODO with real
    Spark clusters."
- summary: "Remaining cloud platform adapters (firebolt, questdb, trino, etc.)"
  reason: "The top 6 cloud adapters in w20-w22 cover the most-used platforms. Remaining adapters can be covered incrementally
    after the 80% target."

metadata:
  tags:
  - testing
  - coverage
  - quality
  - core
  - cli
  - platforms
