  created_date: "2026-03-23"
  last_updated: "2026-03-23"
  coverage_baseline:
    date: "2026-03-23"
    core_logic: {stmts: 53636, miss: 12629, pct: 76.5}
    cli: {stmts: 10627, miss: 3123, pct: 70.6}
    cloud_platforms: {stmts: 18235, miss: 7409, pct: 59.4}
    local_platforms: {stmts: 1998, miss: 618, pct: 69.1}
    utils: {stmts: 4734, miss: 991, pct: 79.1}

verification:
  command: |
    uv run -- python -m pytest -m "fast and not (slow or stress or resource_heavy or live_integration)" -n auto --strict-markers --tb=short -o "addopts=" -p pytest_cov --cov=benchbox --cov-report=term -q --no-header 2>&1 | grep -E "^(TOTAL|Required|WARNING)" | head -5
  expected: "TOTAL line shows >= 80% coverage; no WARNING about below threshold"

must_preserve:
- "All existing tests must continue to pass — new tests are additive"
- "Test suite speed: `make test-fast` must complete in < 60 seconds"
- "No `assert True`, `assert result is not None`, or `hasattr`-only assertions in new tests"
- "Coverage config in pyproject.toml remains the source of truth for local dev"
- "Cloud adapter tests must not require real credentials — mock at connection boundary only"

anti_patterns:
- "DO NOT write import-only tests — because importing a module is not testing it — every test must call a function and assert
  on its output"
- "DO NOT mock internal methods to test dispatchers — because you're testing mock wiring not behavior — use real DuckDB/DataFusion/Polars
  wherever possible"
- "DO NOT add tests just to hit line coverage — because a test that can never fail is worse than no test — every test should
  fail if the code under test is broken"
- "DO NOT test cloud SQL generation by asserting mock.called — because that doesn't verify SQL correctness — assert the generated
  SQL string contains expected clauses"
- "DO NOT put 'coverage' in test filenames — because test names should describe what they verify — name after the behavior
  being tested"

scope_limit:
  include:
  - "tests/ (new and modified test files)"
  - "pyproject.toml (fail_under ratchet, coverage.run.omit)"
  - ".coveragerc_core (CI coverage scope alignment)"
  exclude:
  - "benchbox/ source code (no production changes)"
  - "pytest.ini (no changes to default test config)"
  - "tests/unit/platforms/dataframe/ (covered by dataframe-test-coverage TODO)"
  - "tests/unit/core/dataframe/ (covered by dataframe-test-coverage TODO)"

impact:
  business_value: |
    Protects the core product path: benchmark runners, data generators,
    platform adapters, and CLI user experience. 80% coverage with behavioral
    assertions means releases can be cut with confidence.
  technical_debt: |
    Closes coverage gaps across all non-DataFrame subsystems. Establishes
    coverage ratcheting at 80% that prevents regression. Aligns CI and
    local coverage measurement.
