id: non-dataframe-test-coverage
title: "Increase core, CLI, platform, and utils test coverage to 80%"
worktree: main
priority: High
status: In Progress
description: |
  Non-DataFrame coverage gaps across 4 categories totaling ~11,500 missing
  statements. These are higher ROI than DataFrame queries because they protect
  the core product (runners, generators, registry), CLI user experience, and
  platform adapters.

  Category breakdown (excluding DataFrame subsystem):
  - Core logic: ~12,629 miss at 76.5% (runners, generators, base adapter, ETL)
  - CLI: 3,123 miss at 70.6% (commands, config, output)
  - Cloud platforms: 7,409 miss at 59.4% (SQL generation, credentials)
  - Local platforms: 618 miss at 69.1% (DuckDB, DataFusion, Polars SQL)
  - Utils: 991 miss at 79.1% (validation, compilation, execution)

  Target: ~9,500 additional statements covered, bringing non-DF code from
  ~72% to ~82%. Combined with DataFrame TODO and coverage scope changes,
  this reaches the 80% overall target.

  Note: TPC-DI ETL (transformations.py 1,053 miss + batch.py 882 miss = 1,935
  stmts) is deferred due to high effort and niche usage. This caps core_logic
  at ~79% even if all other core files hit 85%. The overall 80% target is still
  achievable because other categories (utils, local platforms) will exceed 85%.

  All core/local/utils work is testable with real engines (DuckDB, DataFusion).
  CLI is testable via Click CliRunner. Cloud platforms test SQL generation and
  config logic without credentials.

category: Testing & Quality

deps:
  needs:
  - fix-coverage-theater

