impact:
  business_value: |
    Converts a silent, upstream-version-coupled correctness risk (aggregate
    arithmetic on DataFusion silently falling back to unchanged expressions
    when the AST-extraction hack breaks) into a loud, attributable failure,
    so a future DataFusion upgrade that changes error-message text is caught
    immediately rather than surfacing as a confusing downstream query error.
  user_impact: |
    DataFusion users running aggregate-arithmetic queries get either correct
    results or a clear error naming the DataFusion version and unrecognized
    format, instead of a silent behavior change or an opaque DataFusion-level
    failure.
  technical_debt: |
    Addresses the module's own self-documented fragility
    (unified_frame.py:19-23, "may not work if the error message format
    changes") with either a structural replacement or, at minimum, a loud
    failure mode plus regression test.

files_affected:
  modified:
    - "benchbox/platforms/dataframe/unified_frame.py"
  added:
    - "tests/unit/platforms/dataframe/test_unified_frame_datafusion_ast.py"

must_preserve:
  - "Aggregate-arithmetic expressions that currently work correctly against the pinned DataFusion version continue to produce identical results after the hardening change."
  - "The fallback-to-unchanged-expression behavior for genuinely unsupported patterns (not a format-parsing failure) is preserved for cases where DataFusion itself does not support the pattern - only the format-mismatch case should now raise loudly, not every extraction miss."

prior_art:
  - "benchbox/platforms/dataframe/unified_frame.py:_get_datafusion_ast_string (2313) and its existing basic sanity check ('Alias'/'BinaryExpr'/'AggregateFunction' in error_str) - reuse and tighten this existing check into a hard assertion rather than adding a parallel validation path."
  - "datafusion-tbl-trailing-delimiter-load.yaml - a prior TODO in this same platform area that replaced ad hoc/fragile per-caller logic with a shared, version-aware helper; follow its pattern of pinning behavior to a documented, tested version and adding a regression test for the failure mode."

approach: |
  Start by re-confirming the currently pinned DataFusion version still
  matches the tested 43.0.0 format (w0) - if it has already drifted, treat
  this as more urgent. Land the loud-failure guard (w1) first since it is
  small, safe, and immediately converts a silent risk into a visible one.
  Only then investigate whether a structural, non-text-parsing alternative
  exists in the installed datafusion bindings (w2); if none exists, the loud
  guard plus regression test (w1+w3) is an acceptable durable mitigation on
  its own.

anti_patterns:
  - "DO NOT silently widen the sanity-check keyword list to accept more error formats speculatively - only change behavior in response to a confirmed installed-version format, verified by w0."
  - "DO NOT remove the fallback-to-unchanged-expression behavior entirely - it is the correct response for genuinely unsupported aggregate-arithmetic patterns (a DataFusion limitation, not a parsing failure); only the format-mismatch branch should become a hard failure."
  - "DO NOT couple the fix to a specific DataFusion patch version - pin the check to the sanity-check keywords and the tested major version documented in the module docstring, so minor version bumps within the same AST-format generation don't spuriously fail."

verification:
  - description: "Existing DataFusion aggregate-arithmetic tests still pass"
    command: "uv run -- python -m pytest tests -k 'datafusion and aggregate' --tb=short"
    expected_output: "all DataFusion aggregate-arithmetic tests pass"
  - description: "New test proves a changed error format now fails loudly instead of silently degrading"
    command: "uv run -- python -m pytest tests/unit/platforms/dataframe/test_unified_frame_datafusion_ast.py -v"
    expected_output: "test passes: simulated format change raises an attributable error naming the DataFusion version"

scope_limit:
  only_modify:
    - "benchbox/platforms/dataframe/unified_frame.py"
    - "tests/unit/platforms/dataframe/"
  do_not_modify:
    - "benchbox/platforms/dataframe/expression_family.py"
    - "benchbox/platforms/dataframe/protocol.py"

success_metrics:
  - "_get_datafusion_ast_string raises a clear, attributable error when the installed DataFusion version's error-message format does not match the expected sanity-check keywords, instead of silently falling back."
  - "A regression test simulates a changed error-message format and asserts the loud failure fires."
  - "The module docstring's fragility warning is updated to reflect the new failure mode (loud error vs. silent format-change risk) or removed if w2 replaces the text-parsing mechanism entirely."

open_questions:
  - "Does the installed datafusion Python package expose any structural (non-error-text) way to inspect an Expr's operator/AST that w2 could use instead of intentionally triggering and parsing an exception? Needs direct investigation of the installed datafusion version's Python API surface before deciding whether w2 is feasible now or remains future work."
