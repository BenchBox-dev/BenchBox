id: unified-frame-error-parsing-hardening
title: "Replace DataFusion error-message-text parsing in unified_frame.py with a version/capability check"
worktree: main
priority: Medium
status: "Not Started"
category: Platform Expansion

description: |
  Architecture review (Work Area E, structural remediation) found that
  `benchbox/platforms/dataframe/unified_frame.py:19-23`'s module docstring
  self-admits a fragile design: DataFusion support "includes experimental
  AST parsing for handling aggregate arithmetic expressions... tested with
  DataFusion 43.0.0 and may not work with other versions if the error
  message format changes."

  The actual mechanism, `_get_datafusion_ast_string()`
  (unified_frame.py:2313 onward), deliberately calls
  `expr.rex_call_operator()` expecting it to THROW, then parses the AST
  representation back out of the exception's string text (comment at
  line ~2334: "the error message contains the AST like: 'Catch all
  triggered in get_operator_name: Alias(BinaryExpr...)'"). It does a basic
  sanity check (`"Alias" in error_str or "BinaryExpr" in error_str or
  "AggregateFunction" in error_str`) before trusting the parsed text, and
  falls back to passing expressions through unchanged if extraction fails
  (per the module docstring) - which can then surface as a downstream
  DataFusion error for unsupported aggregate-arithmetic patterns rather than
  a clear, attributable failure at the point where the format assumption
  broke.

  This is a genuine upstream-coupling risk: a DataFusion release that
  changes `rex_call_operator()`'s error text format would silently degrade
  aggregate-arithmetic support without a clear signal pointing at this file.

work:
  - id: w0
    summary: "Re-validate current DataFusion pinned/installed version against the tested format"
    status: pending
    notes: |
      Run `uv run -- python -c "import datafusion; print(datafusion.__version__)"`
      and check pyproject.toml's datafusion version constraint. Confirm
      whether the installed/pinned version still matches "tested with
      43.0.0" or has already drifted - if it has drifted, this TODO is more
      urgent than Medium and the w1 sanity-check assertion should fail loudly
      today, not just in a future upgrade.

  - id: w1
    summary: "Add a version-pinned guard that fails loudly on an unrecognized error format"
    needs: [w0]
    status: pending
    notes: |
      At minimum, make `_get_datafusion_ast_string()` raise a clear,
      attributable exception (naming the installed DataFusion version and
      the unrecognized error text) when the sanity check
      ("Alias"/"BinaryExpr"/"AggregateFunction" in error_str) fails, instead
      of silently returning None and falling through to unchanged-expression
      behavior. This converts a silent correctness-adjacent degradation into
      a loud, debuggable failure - the honest minimum bar even before a
      better mechanism is built.

  - id: w2
    summary: "Investigate a capability probe or structural API replacing text parsing"
    needs: [w1]
    status: pending
    notes: |
      Check whether the installed `datafusion` Python package (or its
      underlying Rust `datafusion-expr`/substrait bindings) exposes any
      structural way to inspect an Expr's AST (e.g. a `to_variant()`,
      `__repr__`-based structural parse, or a lower-level expr-tree walk)
      that does not depend on triggering and parsing an intentional error.
      If one exists for the currently pinned version, replace the
      error-message parsing with it. If not, keep the w1 loud-failure guard
      as the durable mitigation and record why a structural alternative
      isn't available yet (open_questions).

  - id: w3
    summary: "Add a test simulating a changed DataFusion error-message format"
    needs: [w1]
    status: pending
    notes: |
      Add a unit test that monkeypatches/mocks `expr.rex_call_operator()`
      (or a stand-in double) to raise an exception with a DIFFERENT text
      format (missing "Alias"/"BinaryExpr"/"AggregateFunction"), and asserts
      `_get_datafusion_ast_string()` now raises the loud, attributable error
      from w1 instead of silently returning None. This is the regression
      test that proves the hardening actually fires when the upstream format
      changes, without needing to wait for an actual DataFusion upgrade.

