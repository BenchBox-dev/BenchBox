id: add-dependency-audit-ci-guard
title: "Promote dependency audit AST scripts to a CI guard against re-introduction of unused deps"
worktree: main
priority: Medium
status: Not Started
category: Code Quality and Technical Debt
description: |
  The `audit-imported-dependencies-for-elimination` audit was driven by
  two methodology scripts currently parked under `_project/scratch/`
  (gitignored):
    - `parse_deps.py` — tomllib-based dep enumeration from pyproject.toml
    - `scan_imports.py` — AST walker over benchbox/, scripts/, tests/,
      docs/conf.py, docs/_static/

  Without a check, the audit's "70 KEEP, 6 FLAG-*" snapshot decays. New
  unused deps drift in; new top-level imports go undeclared. This TODO
  promotes those scripts into a real CI guard so the audit stays current
  for free.

  Source: parent TODO `tighten-dependencies-phase-plan` (Phase 4) and
  `docs/development/dependency-inventory.md` Methodology section.

work:
  - id: w1
    summary: "Move the two scripts from `_project/scratch/` (gitignored) to a tracked location: `_project/scripts/dependency_audit/parse_deps.py` and `scan_imports.py`. Add an `__init__.py` if needed."
    status: pending

  - id: w2
    summary: "Add a `check_deps.py` driver that runs the AST scan and fails on unexpected unused declarations or undeclared imports."
    needs: [w1]
    status: pending
    notes: |
      Fail conditions:
        (a) declared package with 0 import sites AND 0 plugin/CLI use AND
            not on a transitive-only allowlist;
        (b) imported top-level module not declared and not on the
            guarded-optional allowlist.

  - id: w3
    summary: "Create two allowlist data files alongside the scripts; cross-reference against `dependency-inventory.md` so they mirror the audit's exemptions."
    needs: [w2]
    status: pending
    notes: |
      Files:
        - `plugin_cli_allowlist.yaml` — pytest-*, ruff, ty, tox, mutmut,
          codespell, sphinx-*, furo, pygments, etc.
        - `guarded_optional_allowlist.yaml` — cudf, cupy, cuml,
          sentence_transformers, torch, spacy, textblob, pysail, dask_sql,
          flightsql, influxdb3.

  - id: w4
    summary: "Add a `make audit-deps` target invoking the driver. Should exit non-zero on any violation, with a human-readable diff of unexpected packages or undeclared imports."
    needs: [w2, w3]
    status: pending

  - id: w5
    summary: "Wire `make audit-deps` into the existing CI lint job (`.github/workflows/`). Should run alongside `make lint` and `make typecheck` — pure Python AST, fast."
    needs: [w4]
    status: pending

  - id: w6
    summary: "Run the new check locally against current main; confirm it passes (i.e. agrees with the audit's KEEP/FLAG verdict). If it disagrees, reconcile the allowlists."
    needs: [w5]
    status: pending

  - id: w7
    summary: "Update `docs/development/dependency-inventory.md` Methodology section to point at the tracked scripts and to document `make audit-deps` as the canonical re-run mechanism."
    needs: [w6]
    status: pending

deferred:
  - summary: "Auto-PR new findings (e.g. open a TODO when a new unused dep is detected)"
    reason: "Out of scope for the initial guard; the failing CI check is sufficient signal."
  - summary: "Extend the scan to detect over-pinned version bounds"
    reason: "Different problem domain — covered by `review-dependency-upper-bounds-quarterly`."

files_affected:
  added:
    - "_project/scripts/dependency_audit/__init__.py"
    - "_project/scripts/dependency_audit/parse_deps.py"
    - "_project/scripts/dependency_audit/scan_imports.py"
    - "_project/scripts/dependency_audit/check_deps.py"
    - "_project/scripts/dependency_audit/plugin_cli_allowlist.yaml"
    - "_project/scripts/dependency_audit/guarded_optional_allowlist.yaml"
  modified:
    - "Makefile"
    - ".github/workflows/<lint job>.yml"
    - "docs/development/dependency-inventory.md"
    - ".gitignore"  # un-ignore the moved scripts if needed

must_preserve:
  - "Existing `make lint` / `make typecheck` / `make test-fast` targets unchanged"
  - "CI runtime impact <30s for the new check (it's pure AST, no installs)"
  - "Allowlists explicitly mirror the documented exemptions in `dependency-inventory.md` — no silent drift"
  - "Check fails closed: any unexpected new dep or undeclared import causes CI red"

approach: |
  Make the audit a check, not a one-off doc. The two scripts already exist
  and are proven; promoting them is mostly file moves + an allowlist
  surface + a Makefile target + a CI job hook.

  The allowlists are the load-bearing design choice. They MUST mirror the
  inventory doc's exemptions exactly, and a comment in each allowlist
  entry should reference the audit finding or transitive-via annotation
  that justifies it.

anti_patterns:
  - "DO NOT make the check warning-only — because warnings get ignored in CI noise — fail the build"
  - "DO NOT bake the allowlists into the script source — because future audits need to update them without code review of the scanner — keep them as data files"
  - "DO NOT extend the scope to version-bound checking — because that's a different problem domain — keep this TODO focused on declared/imported parity"

verification:
  - description: "make audit-deps target exists"
    command: "grep -q '^audit-deps:' Makefile && echo 'OK: target present' || echo 'MISSING'"
    expected_output: "OK: target present"
  - description: "Driver exists and is executable"
    command: "uv run -- python _project/scripts/dependency_audit/check_deps.py --help | head -1"
    expected_output: "non-empty help output"
  - description: "Check passes against current main"
    command: "uv run -- make audit-deps"
    expected_output: "no failures"
  - description: "Check fails when an unused dep is introduced (synthetic test)"
    command: "uv run -- python -c \"import subprocess, tempfile, pathlib, shutil; src = pathlib.Path('pyproject.toml').read_text(); patched = src.replace('[project]', '[project]\\n# synthetic test', 1); print('Manual: temporarily add a fake dep and re-run make audit-deps to confirm the check fails. Expected: non-zero exit.')\""
    expected_output: "manual verification step printed"

scope_limit:
  only_modify:
    - "_project/scripts/dependency_audit/"
    - "Makefile"
    - ".github/workflows/"
    - "docs/development/dependency-inventory.md"
    - ".gitignore"
  do_not_modify:
    - "pyproject.toml"   # this TODO adds a check, not a fix
    - "uv.lock"
    - "benchbox/"
    - "tests/"

deps:
  needs:
    - "tighten-dependencies-phase-plan"

metadata:
  tags: ["maintenance", "supply-chain", "deps", "ci", "audit-followup", "regression-guard"]
  estimated_effort: "Medium (4-6 hours: script promotion + allowlist + Makefile + CI hook + reconcile)"
  created_date: "2026-04-15"

impact:
  business_value: |
    Prevents the 70 KEEP / 6 FLAG audit snapshot from decaying. Future
    unused deps caught at PR time, not by a future audit cycle.
  user_impact: |
    Indirect: cleaner long-term install footprint because the dependency
    surface stops growing silently.
  technical_debt: |
    Converts a one-off audit into a continuous check. Without this, every
    future "tighten deps" TODO has to re-discover the same findings.

success_metrics:
  - "`make audit-deps` exists and runs in <30s"
  - "CI lint job invokes the check"
  - "Check passes against current main (agrees with inventory doc)"
  - "Check fails when a synthetic unused dep is introduced (manually verified)"
  - "Methodology section of dependency-inventory.md points at the tracked scripts"
