id: release-finalize-pretag-ci-wait
title: "Make release-finalize wait for release-required checks before tagging"
worktree: main
priority: Critical
status: Not Started
category: Release Tooling

deps:
  needs:
    - release-required-main-pr-test-contract

description: |
  `make release-finalize` currently squash-merges the release PR, immediately
  fast-forwards local `main`, creates tag `vX.Y.Z`, and pushes the tag. That
  means push-to-main workflow jobs, including the integration job that runs on
  `main` pushes, cannot complete before the tag fires `.github/workflows/release.yml`.

  After `release-required-main-pr-test-contract` creates a pre-merge required
  release context, `release-finalize` must be hardened so operators cannot
  mistake post-merge/push-to-main checks for pre-publish evidence. This TODO
  owns the final release-command sequencing and operator messaging.

work:
  - id: w0
    summary: "Re-validate current release-finalize sequencing and available required-check APIs"
    status: pending
    notes: |
      Capture raw output under `/tmp/release-finalize-pretag-w0/` and commit
      only a compact summary in PR body or TODO notes.

      Required commands:
        - `sed -n '817,830p' Makefile`
        - `gh pr view --help | sed -n '1,120p'` if `gh` is available
        - `gh pr checks --help | sed -n '1,160p'` if `gh` is available

      Decision gate:
        - If `release-finalize` has already been changed to wait for
          release-required checks before tagging, update this TODO with the
          commit and convert remaining work into tests/docs only.

  - id: w1
    summary: "Add a non-polling precondition check that release PR required contexts are green before merge"
    needs: [w0]
    status: pending
    notes: |
      Before `gh pr merge --squash`, verify the release PR has the expected
      release-required status context and that it is successful.

      Acceptable implementation:
        - Query `gh pr view` / `gh pr checks` once.
        - Fail with a clear message if `release-required-result` is missing,
          pending, skipped unexpectedly, or failed.
        - Do not poll inside `release-finalize`; pending is a terminal local
          state that tells the operator to wait in GitHub Actions.

      Decision gate:
        - Do not merge if the stable required context is absent. Absence means
          the ruleset/workflow contract is broken, not that release can proceed.

  - id: w2
    summary: "Prevent tag push from depending on post-merge push-to-main checks"
    needs: [w1]
    status: pending
    notes: |
      Update release docs and command output to say explicitly:
        - push-to-main jobs are post-merge signals,
        - release publication depends on the release PR required result, not on
          jobs that start after `main` advances,
        - if post-merge `main` checks fail after a tag, recovery is a patch
          release or incident process, not pretending the release was blocked.

      Decision gate:
        - Do not add a wait for push-to-main integration after merge and before
          tagging as the primary safety mechanism. The correct safety mechanism
          is pre-merge `release-required-result`; waiting after merge still
          leaves an awkward merged-but-untagged release state.

  - id: w3
    summary: "Add Makefile/release-guide tests for finalize preconditions and messaging"
    needs: [w1, w2]
    status: pending
    notes: |
      Add fast tests that parse `Makefile` and release docs to prove:
        - `release-finalize` checks for `release-required-result` before merge,
        - command output no longer implies generic "CI green" without naming the
          required release context,
        - docs distinguish pre-merge required checks from post-merge push checks.

  - id: w4
    summary: "Run an explicit dry-run or mocked-shell verification of release-finalize failure modes"
    needs: [w3]
    status: pending
    notes: |
      Use a mocked shell/script test where possible; do not create tags or merge
      real PRs during unit verification.

      Required failure modes:
        - required context missing,
        - required context pending,
        - required context failed,
        - no release PR found,
        - successful path reaches the existing tag commands only after the
          precondition passes.

deferred:
  - summary: "Auto-watch pending release PR checks inside `release-finalize`"
    reason: "Polling can make local command behavior ambiguous; initial hardening should fail fast and let GitHub Actions be the source of pending state."

prior_art:
  - "Makefile:release-finalize — extend existing two-command release flow instead of replacing it with a separate script"
  - "docs/operations/release-guide.md:release flow — update operator-facing release sequencing"
  - ".github/RELEASE_PR_TEMPLATE.md:After CI green checklist — reuse as human release checkpoint"

must_preserve:
  - "`release-finalize` still refuses to proceed when no open `vX.Y.Z -> main` PR exists."
  - "`release-finalize` still creates and pushes the public version tag only after the release PR has merged."
  - "No command in tests actually pushes tags, merges PRs, or publishes packages."

approach: |
  Keep the Makefile flow, but make its preconditions explicit and testable.
  Use one-shot `gh` inspection rather than long local polling. Treat missing
  required contexts as a contract failure that blocks local finalization.

anti_patterns:
  - "DO NOT add a local sleep/poll loop that waits for push-to-main integration after merge - because publication safety must happen before merge."
  - "DO NOT bypass `gh pr merge` errors with `|| true` - because failed merge must stop tag creation."
  - "DO NOT create test tags or temporary release branches in automated tests."
  - "DO NOT claim `release.yml` is a correctness gate - it is the tag publish pipeline."

verification:
  - description: "Release-finalize command-shape tests pass"
    command: "uv run -- python -m pytest tests/unit/test_release_infrastructure.py -q"
    expected_output: "all tests pass"
  - description: "Release docs name pre-merge required context and post-merge caveat"
    command: "for path in docs/operations/release-guide.md .github/RELEASE_PR_TEMPLATE.md; do grep -q \"release-required-result\" \"$path\" || exit 1; done && grep -q \"post-merge\" docs/operations/release-guide.md"
    expected_output: "release-required-result is present in both release docs surfaces and post-merge caveat is present in release-guide"
  - description: "TODO graph remains valid"
    command: "uv run --project _project/scripts -- python _project/scripts/todo_cli.py check-graph && uv run --project _project/scripts -- python _project/scripts/validate_todo.py _project/TODO/main/planning/release-finalize-pretag-ci-wait.yaml"
    expected_output: "exit 0"

scope_limit:
  only_modify:
    - "Makefile"
    - "docs/operations/release-guide.md"
    - ".github/RELEASE_PR_TEMPLATE.md"
    - "tests/unit/test_release_infrastructure.py"
    - "_project/TODO/main/planning/release-finalize-pretag-ci-wait.yaml"
  do_not_modify:
    - ".github/workflows/release.yml"
    - "benchbox/"
    - "pyproject.toml"

success_metrics:
  - "`release-finalize` cannot merge/tag when `release-required-result` is missing, pending, or failed."
  - "Release docs no longer let operators treat post-merge push-to-main integration as pre-publish evidence."
  - "All new release-finalize safeguards are covered by fast tests or mocked shell tests."

open_questions:
  - question: "Should `release-finalize` require exactly `release-required-result`, or accept a documented list of equivalent contexts during transition?"
    gating: true
    affects: ["w1", "success_metrics: finalization blocks missing required context"]
    default: "Require exactly `release-required-result` after the upstream release-required-contract TODO lands."

