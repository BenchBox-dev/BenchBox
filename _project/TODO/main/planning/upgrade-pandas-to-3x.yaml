id: upgrade-pandas-to-3x
title: "Upgrade pandas to 3.x after modin compat and Python 3.10 gates clear"
worktree: main
priority: Low
status: Not Started
category: Code Quality and Technical Debt
description: |
  pandas 3.0.2 is available on PyPI but cannot be safely bumped yet.
  A compatibility evaluation (2026-04-22) found two hard blockers that must
  clear before the actual lock bump begins, plus two targeted code fixes needed before
  the lock bump lands.

  ── HARD BLOCKERS (do not proceed until both are resolved) ──────────────────

  1. modin 0.37.1 requires `pandas<2.4,>=2.2`.
     `uv lock --upgrade-package pandas` fails to resolve because modin's upper
     bound (`<2.4`) and pandas 3.x are mutually exclusive. No modin release
     beyond 0.37.1 exists as of 2026-04-22 that relaxes this cap. Modin is a
     first-class BenchBox platform (benchbox/platforms/dataframe/modin_df.py,
     extras modin / dataframe-pandas-family / all) - silently excluding it
     from the resolved environment is not acceptable.
     Watch: https://github.com/modin-project/modin/releases

  2. pandas 3.0 requires Python ≥ 3.11.
     BenchBox declares `requires-python = ">=3.10,<3.15"`. Bumping pandas
     would silently break Python 3.10 users. Either (a) raise the project
     minimum to 3.11 (requires a separate decision and full CI matrix change)
     or (b) confirm that pandas can remain at 2.x for Python 3.10 via
     environment markers - and verify uv resolves that correctly.

  ── PRE-FLIGHT CODE FIXES (required before lock bump, no behaviour change) ──

  3. pandas_df.py:145-155 - `pd.options.mode.copy_on_write` assignment.
     In pandas 3.0 this option is deprecated and a no-op. The current code
     sets it unconditionally (guarded only by `pandas_version >= (2, 0)`).
     Fix: add an upper guard `pandas_version < (3, 0)` so the assignment is
     skipped on 3.x where CoW is always active.

  4. TPC-DI ingest + ETL datetime resolution.
     pandas 3.0 defaults to microsecond resolution for datetime parsing
     (vs. nanoseconds in 2.x). Any code in `tpcdi/benchmark.py`,
     `tpcdi/tools/file_parsers.py`, or `tpcdi/etl/transformations.py` that reads
     or normalizes date/time values via pd.read_csv / pd.read_fwf /
     pd.read_json / pd.to_datetime and then converts to int64 or compares values
     numerically can produce 1000× different results under 3.x. Audit and add
     explicit `dtype_backend`, `parse_dates=False`, or explicit resolution
     normalization where the downstream code is resolution-sensitive. (CoW
     in-place mutation audit was clean - no fixes needed there.)

  ── EVALUATION SUMMARY ───────────────────────────────────────────────────────

  Evaluated 2026-04-22. pandas 3.x breaking changes cross-referenced against
  BenchBox codebase:
  - DataFrame.swapaxes / append / Index.format() - not used, no impact.
  - groupby/resample keyword changes - not used in DataFrame platform layer.
  - datetime-unit changes in read/normalize paths - affects the TPC-DI ingest
    and ETL pipeline only (item 4).
  - CoW mandatory - in-place mutation audit clean; only item 3 needs a guard.
  Estimated effort once gates clear: 1-2 days.

work:
  - id: w1
    summary: "Confirm modin ≥ X.Y ships with pandas ≥ 3.0 support - update pyproject.toml modin lower-bound and run `uv lock --upgrade-package modin pandas` to verify resolver accepts it"
    status: pending

  - id: w2
    summary: "Decide Python 3.10 stance: either raise requires-python to '>=3.11' (separate PR) or add a pandas environment marker so 3.10 stays on 2.x; confirm uv resolves correctly in both cases before proceeding"
    needs: [w1]
    status: pending

  - id: w3
    summary: "Add `pandas_version < (3, 0)` upper guard to the `pd.options.mode.copy_on_write` block in benchbox/platforms/dataframe/pandas_df.py:~145 (defensive pre-work; can land before the lock bump)"
    status: pending

  - id: w4
    summary: "Audit the full TPC-DI datetime ingest/ETL path for resolution sensitivity; fix explicit dtype_backend / parse_dates / normalization where needed"
    status: pending

  - id: w5
    summary: "Run `uv lock --upgrade-package pandas`, run `uv run -- python -m pytest -m fast -q` and confirm only pre-existing failures appear (no new pandas-related failures)"
    needs: [w2, w3, w4]
    status: pending

  - id: w6
    summary: "Run targeted pandas/modin/dask/tpcdi suite: `uv run -- python -m pytest tests/unit/platforms/dataframe/ tests/unit/core/tpcdi/ -n 0 -q` - green or explain any new failures before committing"
    needs: [w5]
    status: pending

files_affected:
  modified:
    - "benchbox/platforms/dataframe/pandas_df.py"
    - "benchbox/core/tpcdi/benchmark.py"
    - "benchbox/core/tpcdi/tools/file_parsers.py"
    - "benchbox/core/tpcdi/etl/transformations.py"
    - "pyproject.toml"

must_preserve:
  - "modin platform fully functional after bump (benchbox run --platform modin-df --benchmark tpch works)"
  - "TPC-DI date/time correctness - no silent 1000x resolution change in datetime → int conversions"
  - "Python 3.10 users either still supported (via marker) or explicitly told the minimum raised"
  - "Fast test suite baseline: currently 19 pre-existing failures - bump must not add new failures"

approach: |
  Gate-first for the actual pandas bump, not for every defensive code change.
  Items 3 and 4 are pre-flight guards and may land before w1/w2 if helpful,
  but do not attempt the lock bump (w5) until both gates are resolved. Keep
  the pre-flight changes minimal. The lock bump (w5) is the verification step,
  not the starting point.

  For the modin gate: watch modin's GitHub releases page and pyproject.toml
  `install_requires` for `pandas` upper bound removal. A `pandas<3` → `pandas>=3`
  change in modin's metadata is the signal.

  For the Python gate: the cleanest option is to raise the project minimum to
  3.11 in a separate, clearly-scoped commit before this item starts - that
  avoids environment-marker complexity in pyproject.toml.

anti_patterns:
  - "DO NOT run `uv lock --upgrade-package pandas` before w1 and w2 are done - because the resolver will either fail (modin conflict) or silently install an environment that breaks 3.10 users"
  - "DO NOT assume the CoW audit applies to future TPC-DS query additions - because new DataFrames created from slice operations (df[mask]) are copy-on-write in 3.x; always use .copy() on slice results before mutation"
  - "DO NOT change datetime parsing behaviour as part of this item - because read_csv format changes affect result correctness not just performance; audit and preserve existing semantics"

verification:
  - description: "modin platform still functional after pandas 3.x bump"
    command: "uv run -- python -m pytest tests/unit/platforms/dataframe/test_modin_df.py -n 0 -q"
    expected_output: "All tests pass, 0 new failures"
  - description: "pandas platform and family adapters fully green"
    command: "uv run -- python -m pytest tests/unit/platforms/dataframe/test_pandas_df.py tests/unit/platforms/dataframe/test_pandas_family_adapters.py -n 0 -q"
    expected_output: "All tests pass, 0 new failures"
  - description: "TPC-DI datetime correctness"
    command: "uv run -- python -m pytest tests/unit/core/tpcdi/ -n 0 -q"
    expected_output: "All tests pass, 0 new failures"
  - description: "Full fast smoke suite - no new failures beyond the 19 pre-existing baseline"
    command: "uv run -- python -m pytest -m fast -q"
    expected_output: "Same 19 pre-existing failures; 0 new failures"

scope_limit:
  only_modify:
    - "benchbox/platforms/dataframe/pandas_df.py"
    - "benchbox/core/tpcdi/benchmark.py"
    - "benchbox/core/tpcdi/tools/file_parsers.py"
    - "benchbox/core/tpcdi/etl/transformations.py"
    - "pyproject.toml"
    - "tests/unit/platforms/dataframe/"
    - "tests/unit/core/tpcdi/"

deferred:
  - summary: "Audit pandas 3.1+ changes (DataFrame constructor string dtype inference, future removals)"
    reason: "Scope creep - 3.0 compat is the goal here; track 3.1+ removals in the next quarterly bounds review."
  - summary: "Upgrade Modin to leverage pandas 3.x-native features (CoW-aware internals, future copy elision)"
    reason: "Performance optimization, not a compatibility fix - belongs in a dedicated Modin platform improvement item once 3.x compat is confirmed."

