id: reconcile-docs-from-spec-gap-analysis
title: "Reconcile documentation gaps found in archived spec review"
worktree: main
priority: Medium-High
status: Not Started
category: Documentation
description: |
  Commit 35212ca4e23ba11ee01dfcacbdc7deec383073c8 removed ~140 archived spec files
  that were superseded by docs/benchmarks/ and docs/platforms/. A post-deletion gap
  analysis comparing the deleted specs against the current docs found 11 doc pages
  with missing, incorrect, or incomplete content.

  Findings are grouped by severity:
  - P1: Factually wrong content in docs (must be verified against code before editing)
  - P2: Significant functional gaps (entire features or API surfaces undocumented)
  - P3: Notable omissions (useful but not blocking)

  CRITICAL RULE: Every work unit has a research gate. Run the stated verification
  commands FIRST to establish ground truth from the implementation. Never edit docs
  solely based on what the spec said — specs were the source of divergence in several
  cases (e.g. coffeeshop: spec said 50M orders, code says 8.5M, docs are correct).

work:
  # ── P1: CORRECTNESS ERRORS ──────────────────────────────────────────────────

  - id: w1
    summary: "Fix transaction-primitives.md: correct get_all_operations() count (8 → 23) and add missing API methods"
    status: pending
    notes: |
      RESEARCH GATE (run before editing):
        # Verify operation count
        python3 -c "
        import yaml
        ops = yaml.safe_load(open('benchbox/core/transaction_primitives/catalog/operations.yaml'))
        print('op count:', len(ops.get('operations', ops)))
        "
        # Verify get_operations_by_category exists
        grep -n "def get_operations_by_category" benchbox/core/transactional/benchmark_base.py
        # Verify cleanup_auxiliary_files exists
        grep -n "def cleanup_auxiliary_files" benchbox/core/transaction_primitives/benchmark.py

      EDITS NEEDED in docs/benchmarks/transaction-primitives.md:
        1. API reference section: change "Get all available operations (8 total)" to "Get all
           available operations (23 total)". The operations.yaml has 23 entries — confirmed.
        2. Add `get_operations_by_category(category)` method signature to API Reference:
           defined in benchbox/core/transactional/benchmark_base.py:182. Returns dict of
           operations matching the given category string.
        3. Add `cleanup_auxiliary_files()` method signature to API Reference:
           defined in benchbox/core/transaction_primitives/benchmark.py. Call after teardown
           to remove any generated temp files.
        4. Platform support section: the spec listed MySQL, Snowflake, Databricks, and
           Redshift. Before adding these to the docs, check
           `benchbox/core/benchmark_registry.py` and `benchbox/core/results/benchmark_specs.py`
           to confirm which platforms are registered for transaction_primitives. Only document
           platforms that have registered adapters; flag others as "planned".

  - id: w2
    summary: "Fix amplab.md: verify and correct row count table and PageRank value range"
    status: pending
    notes: |
      RESEARCH GATE (run before editing):
        # Check generator for canonical row counts
        grep -n "SF1\|scale_factor\|row_count\|rankings\|uservisit\|document" \
          benchbox/core/amplab/generator.py benchbox/core/amplab/benchmark.py 2>/dev/null | head -30
        # Check schema for row count annotations
        grep -n "row_count\|rankings\|uservisit\|document" \
          benchbox/core/amplab/schema.py 2>/dev/null | head -20
        # Check pagerank range
        grep -n "pagerank\|page_rank\|1000\|10000" \
          benchbox/core/amplab/generator.py 2>/dev/null | head -20

      RESOLUTION RULE:
        - If code says SF=1 → Rankings=100K: update docs (currently 250K)
        - If code says SF=1 → Rankings=250K: spec was wrong, docs are correct — no change
        - Same logic for UserVisits, Documents, and PageRank range (1–1,000 vs 1–10,000)
        - Document the formula (not just the SF=1 value) so all scale factors are derivable

  - id: w3
    summary: "Fix tpc-ds-obt.md: correct '99 queries' claim and document excluded query categories"
    status: pending
    notes: |
      RESEARCH GATE (run before editing):
        # Count actual query files
        find benchbox/core/tpcds_obt/ -name "*.sql" -o -name "*.yaml" 2>/dev/null | wc -l
        # Check the query registry / catalog
        grep -rn "query_id\|excluded\|skip\|unsupported" \
          benchbox/core/tpcds_obt/ 2>/dev/null | head -30
        # Check benchmark_specs.py for obt query list
        grep -A5 "tpcds_obt\|tpc_ds_obt" benchbox/core/results/benchmark_specs.py 2>/dev/null | head -20

      EDITS NEEDED in docs/benchmarks/tpc-ds-obt.md:
        - If query count < 99: replace "Same 99 queries" with the actual count and explain
          which categories are excluded (inventory-fact, external-dimension-lookup, etc.)
          with a one-line reason for each exclusion category.
        - If query count = 99: spec was wrong, no change needed.

  - id: w4
    summary: "Fix tsbs-devops.md: verify disk table schema and duration scaling behavior"
    status: pending
    notes: |
      RESEARCH GATE (run before editing):
        # Get disk table column list from schema
        grep -n "disk\|reads_merged\|writes_merged\|sectors\|io_time\|weighted" \
          benchbox/core/tsbs_devops/schema.py 2>/dev/null | head -30
        # Check duration scaling formula
        grep -n "duration\|days\|scale_factor\|max(" \
          benchbox/core/tsbs_devops/generator.py benchbox/core/tsbs_devops/benchmark.py 2>/dev/null | head -20

      RESOLUTION RULE:
        - disk table: document ALL columns present in schema.py. Spec listed 14; docs have 7.
          Add any missing columns with their types and a one-line description.
        - Duration: if generator uses `max(1, SF)` days: correct docs (currently claims "fixed
          2 days"). If generator uses a fixed duration: spec was wrong, keep docs as-is.
        - Either way, add a note that disk/net metrics are cumulative counters requiring delta
          computation between samples (verify this is accurate by checking query patterns in
          benchbox/core/tsbs_devops/queries.py).

  - id: w5
    summary: "Fix metadata-primitives.md: reconcile ACL platform tiers and document tier definitions"
    status: pending
    notes: |
      RESEARCH GATE (run before editing):
        # Find ACL support detection or tier assignments in code
        grep -rn "acl\|ACL\|tier\|snowflake\|bigquery\|databricks" \
          benchbox/core/metadata_primitives/ 2>/dev/null | grep -i "support\|tier\|full\|partial\|none" | head -20
        # Check which platforms have registered ACL operations
        grep -rn "acl_operations\|acl_queries\|acl_support" \
          benchbox/core/metadata_primitives/ 2>/dev/null | head -20

      RESOLUTION RULE:
        - The spec placed Snowflake/BigQuery in Tier 3 (no SQL-level ACL introspection);
          the docs mark them "Full". Code is ground truth. Correct whichever is wrong.
        - Add the three-tier definition to the docs platform table:
          Tier 1 = full SQL-level ACL introspection, Tier 2 = partial, Tier 3 = none.
          Only add this if the tier concept is reflected in the actual implementation.

  # ── P2: SIGNIFICANT FUNCTIONAL GAPS ─────────────────────────────────────────

  - id: w6
    summary: "Fix nyctaxi.md: document the spatial query layer (benchbox/core/nyctaxi/spatial.py)"
    status: pending
    notes: |
      RESEARCH GATE (run before editing):
        # Confirm spatial.py API surface
        grep -n "^def \|^class " benchbox/core/nyctaxi/spatial.py
        # Count spatial queries
        grep -c '"category": "spatial"' benchbox/core/nyctaxi/spatial.py 2>/dev/null || \
          grep -c "spatial" benchbox/core/nyctaxi/spatial.py
        # Check benchmark-option integration
        grep -n "spatial" benchbox/core/nyctaxi/benchmark.py | head -20
        # Check CLI registration
        grep -rn "spatial" benchbox/cli/ 2>/dev/null | head -10

      EDITS NEEDED in docs/benchmarks/nyctaxi.md:
        The entire spatial layer is absent. Add a new "Spatial Queries" section covering:
        1. Overview: spatial queries require a platform extension (DuckDB Spatial,
           PostGIS, ClickHouse geo, BigQuery GIS, etc.)
        2. A platform support table sourced from `check_spatial_support()` return values
           (benchbox/core/nyctaxi/spatial.py:780)
        3. Query categories as defined in spatial.py (spatial-distance-top-routes,
           spatial-borough-centroids, spatial-radius-search, etc.)
        4. API reference entries for:
           - `get_spatial_queries(platform: str) -> dict` (spatial.py:681)
           - `get_spatial_create_table_sql(dialect: str) -> str` (spatial.py:715)
           - `check_spatial_support(platform: str) -> dict` (spatial.py:780)
        5. `TAXI_ZONE_CENTROIDS` reference data description (spatial.py:21)
        6. CLI option: check benchbox/cli/ and benchmark.py for how spatial is toggled
           (--benchmark-option spatial=true/false or equivalent). Only document what
           is actually wired — if the option doesn't exist yet, note it as planned.

  - id: w7
    summary: "Fix tpc-di.md: reconcile query catalog naming and add FinWire format documentation"
    status: pending
    notes: |
      RESEARCH GATE (run before editing):
        # Get definitive query list and naming from code
        find benchbox/core/tpcdi/ -name "*.sql" -o -name "*.yaml" 2>/dev/null | head -20
        grep -rn "query_id\|VQ\|AQ\|EQ\|V[0-9]\|A[0-9]\|DQ" \
          benchbox/core/tpcdi/ 2>/dev/null | head -30
        # Check FinWire parser
        find benchbox/core/tpcdi/ -name "*.py" | xargs grep -ln "finwire\|FinWire\|fixed.width" 2>/dev/null
        # Check pandas dependency
        grep -rn "import pandas\|from pandas" benchbox/core/tpcdi/ 2>/dev/null | head -5

      EDITS NEEDED in docs/benchmarks/tpc-di.md:
        1. Query catalog: the spec (VQ/AQ/EQ, 30 queries) and docs (V/A/DQ, 16 queries)
           diverge significantly. Use the actual SQL files and/or YAML catalog in the
           codebase as the ONLY source of truth. Rewrite the query catalog section to
           match what is actually implemented.
        2. FinWire format: if benchbox/core/tpcdi/ contains a FinWire parser, add a
           "FinWire Format" section explaining: what FinWire is (TPC-DI's proprietary
           fixed-width flat file format), what files it parses, and that it requires
           the pandas dependency for fixed-width reading.
        3. SCD Type 2 validation: if validation queries exist in tpcdi/, describe the
           validation methodology (effective/expiry date chain checks).
        4. If pandas is imported, add it to the prerequisites section.

  - id: w8
    summary: "Fix tpc-h.md: add official composite metrics (QphH@Size) and RF1/RF2 maintenance test"
    status: pending
    notes: |
      RESEARCH GATE (run before editing):
        # Check if composite metric calculation is implemented
        grep -rn "QphH\|qph\|composite\|Power@Size\|Throughput@Size\|geometric" \
          benchbox/core/tpch/ 2>/dev/null | head -20
        # Check maintenance test (RF1/RF2) implementation
        grep -rn "RF1\|RF2\|refresh\|maintenance\|insert.*order\|delete.*order" \
          benchbox/core/tpch/ 2>/dev/null | head -20
        # Check DataFrame query coverage
        find benchbox/core/tpch/ -name "*.py" | xargs grep -ln "dataframe\|DataFrame" 2>/dev/null
        # Check DuckDB thread safety caveat
        grep -rn "thread\|concurrent\|in.memory" benchbox/core/tpch/ 2>/dev/null | head -10

      EDITS NEEDED in docs/benchmarks/tpc-h.md:
        1. Only add QphH@Size / composite metrics section if the code actually computes
           these values (check BenchmarkResults fields in benchbox/core/results/). If not
           implemented, note them as "TPC-H official metrics — not computed by BenchBox."
        2. Only add RF1/RF2 section if maintenance phase operations are implemented in the
           codebase. Check benchbox/core/tpch/maintenance.py or equivalent.
        3. DataFrame coverage: if all 22 queries have DataFrame equivalents, add a one-liner
           noting this to the DataFrame platform row in the platform support table.
        4. Thread safety caveat: if the DuckDB in-memory limitation is real and code-confirmed,
           add a callout box to the DuckDB platform section.

  - id: w9
    summary: "Fix tpc-ds.md: add QphDS metric, throughput permutation modes, and maintenance ops"
    status: pending
    notes: |
      RESEARCH GATE (run before editing):
        # Check QphDS implementation
        grep -rn "QphDS\|composite\|geometric\|Power@Size\|Throughput@Size" \
          benchbox/core/tpcds/ 2>/dev/null | head -20
        # Check throughput permutation modes
        grep -rn "permut\|stream\|order\|sequential\|random" \
          benchbox/core/tpcds/ 2>/dev/null | grep -iv "import\|comment" | head -20
        # Check maintenance operations
        find benchbox/core/tpcds/ -name "maintenance*" -o -name "*refresh*" 2>/dev/null
        grep -rn "maintenance\|INSERT\|UPDATE\|DELETE" \
          benchbox/core/tpcds/ 2>/dev/null | grep -v ".pyc\|#" | head -20
        # Check --allow-unofficial-scale handling
        grep -rn "allow.unofficial\|unofficial_scale" benchbox/ 2>/dev/null | head -5

      EDITS NEEDED in docs/benchmarks/tpc-ds.md:
        1. Composite metric: same rule as TPC-H — only document if computed by BenchBox.
        2. Throughput permutation: if code implements multiple stream ordering modes, add
           a brief explanation with the mode names.
        3. Maintenance operations: if INSERT/UPDATE/DELETE maintenance ops are implemented,
           add a "Maintenance Phase" section describing what runs between power and throughput.
        4. --allow-unofficial-scale: confirm the flag name via
           `grep -rn "allow.unofficial" benchbox/cli/` then add a note to the scale factor
           section: "SF < 1 requires --allow-unofficial-scale flag (uses patched dsdgen)."

  - id: w10
    summary: "Fix datavault.md: add SHA1 hash algorithm and ValidationReport API object"
    status: pending
    notes: |
      RESEARCH GATE (run before editing):
        # Verify hash algorithm list
        grep -rn "sha1\|sha256\|md5\|hash_algo\|SUPPORTED_HASH" \
          benchbox/core/datavault/ 2>/dev/null | head -20
        # Confirm ValidationReport dataclass
        grep -rn "class ValidationReport\|ValidationReport\|validate_loads" \
          benchbox/core/datavault/ 2>/dev/null | head -20
        # Get ValidationReport fields
        grep -A15 "class ValidationReport" benchbox/core/datavault/ -r 2>/dev/null
        # Check ETL source file naming pattern
        grep -rn "shard\|_04d\|csv.gz\|naming" benchbox/core/datavault/generator.py 2>/dev/null | head -10

      EDITS NEEDED in docs/benchmarks/datavault.md:
        1. If sha1 is in SUPPORTED_HASH or equivalent list: add it to the Hash Algorithms
           section between md5 and sha256 (alphabetical or by security level).
        2. If ValidationReport class exists: add it to the API Reference section with all
           confirmed fields (hub_count, link_count, sat_count, etc. — verify each field
           name by reading the actual dataclass definition).
        3. ETL source file naming: if sharding pattern is in the code, add a note in the
           Data Generation section: "Source files are sharded as {entity}_{N:04d}.csv.gz."

  # ── P3: NOTABLE OMISSIONS ────────────────────────────────────────────────────

  - id: w11
    summary: "Fix tsbs-devops.md (P3): expand disk table schema and add counter semantics note"
    status: pending
    needs: [w4]
    notes: |
      Depends on w4 research findings. After w4 verifies the disk schema from code,
      update the schema table in docs/benchmarks/tsbs-devops.md to include all columns
      found in benchbox/core/tsbs_devops/schema.py.

      Also add a note under the disk and net table schemas: "These metrics are cumulative
      counters — compute delta between consecutive samples for rate values." Only add this
      if it is confirmed accurate by checking the actual data generation and any query
      examples in benchbox/core/tsbs_devops/.

  - id: w12
    summary: "Fix tpc-di.md (P3): add SCD Type 2 validation methodology section"
    status: pending
    needs: [w7]
    notes: |
      Depends on w7 research findings. If SCD Type 2 validation queries were confirmed to
      exist in the tpcdi codebase, add a "Validation Approach" section to
      docs/benchmarks/tpc-di.md describing:
      - That the benchmark validates SCD Type 2 correctness by checking effective/expiry
        date chains for no gaps and no overlaps
      - The specific tables where SCD Type 2 semantics are tested (DimCustomer, DimAccount,
        DimSecurity, etc. — use actual table names from the code)

  - id: w13
    summary: "Fix P3 omissions from w8/w9 research: tpc-h thread safety and tpc-ds --allow-unofficial-scale"
    status: pending
    needs: [w8, w9]
    notes: |
      Batch fix for P3 items whose research was already performed in w8 and w9.

      1. docs/benchmarks/tpc-h.md — DuckDB thread safety caveat:
         Confirmed or denied in w8. If confirmed, add to DuckDB platform notes.

      2. docs/benchmarks/tpc-ds.md — --allow-unofficial-scale for SF<1:
         Confirmed or denied in w9. If confirmed, add to Scale Factor section.

  - id: w14
    summary: "Fix P3 omissions: coffeeshop regional_weight, clickbench CSV semantics, metadata-primitives tier legend"
    status: pending
    needs: [w5]
    notes: |
      Batch fix for remaining P3 items. Run research gate for each before editing.

      1. docs/benchmarks/coffeeshop.md — dim_locations.regional_weight column:
         RESEARCH GATE:
           grep -n "regional_weight" benchbox/core/coffeeshop/schema.py benchbox/core/coffeeshop/generator.py
         If the column exists in the schema, add it to the dim_locations schema table
         with a one-line description: "Relative weight used by the sales distribution
         generator to bias orders toward high-traffic locations."
         NOTE: the docs are CORRECT on SF=1 order count (8.5M); the spec was wrong.
         Do NOT change the order count — generator.py:57 confirms SF1_ORDER_COUNT = 8_500_000.

      2. docs/benchmarks/clickbench.md — CSV empty-string preservation:
         RESEARCH GATE:
           grep -rn "empty\|''\|empty_string\|csv.*null\|null.*csv" \
             benchbox/core/clickbench/ 2>/dev/null | head -10
         If empty-string preservation logic exists in the CSV loader, add a callout in
         the "Loading Data" section: "The CSV loader preserves empty strings as empty
         (not NULL). ClickBench result validation uses string equality (= '') which
         requires this behavior."

      3. docs/benchmarks/metadata-primitives.md — tier model definition:
         Confirmed or denied in w5. If tier concept exists in code, add a legend row
         below the platform table defining Tier 1 / 2 / 3 meanings.

verification:
  - description: "Fast benchmark tests still pass after docs edits"
    command: "uv run -- python -m pytest tests/ -k 'transaction_primitives or nyctaxi or coffeeshop or amplab or datavault or tpcds or tpcdi' -m fast -q --tb=no 2>&1 | tail -5"
    expected_output: "passed"
  - description: "No broken links introduced in docs"
    command: "cd docs && make linkcheck 2>&1 | grep -c 'broken' || echo '0'"
    expected_output: "0"

scope_limit:
  only_modify:
    - "docs/benchmarks/transaction-primitives.md"
    - "docs/benchmarks/amplab.md"
    - "docs/benchmarks/tpc-ds-obt.md"
    - "docs/benchmarks/tsbs-devops.md"
    - "docs/benchmarks/metadata-primitives.md"
    - "docs/benchmarks/nyctaxi.md"
    - "docs/benchmarks/tpc-di.md"
    - "docs/benchmarks/tpc-h.md"
    - "docs/benchmarks/tpc-ds.md"
    - "docs/benchmarks/datavault.md"
    - "docs/benchmarks/coffeeshop.md"
    - "docs/benchmarks/clickbench.md"
  do_not_modify:
    - "benchbox/"
    - "tests/"

anti_patterns:
  - "DO NOT copy text from the archived spec into the doc verbatim — because specs were
     sometimes incorrect (see coffeeshop SF order count discrepancy). Always verify against
     the implementation first."
  - "DO NOT skip the research gate for P1 items — because the gap analysis agent found
     cases where the spec was wrong and the docs were correct. Running the grep commands
     takes 30 seconds; writing incorrect docs takes hours to fix."
  - "DO NOT document 'planned' platform support as if it is current — because the
     transaction-primitives spec listed MySQL/Snowflake/Databricks, but those adapters
     may not be registered in benchmark_registry.py. Only document what is wired up."
  - "DO NOT batch all edits into a single commit — because if one finding turns out to
     be wrong, a granular commit history makes it easy to revert just that edit."

must_preserve:
  - "Existing accurate content in each doc page — edits should ADD missing information,
     not replace correct existing descriptions"
  - "The correct SF=1 order count in coffeeshop.md (8.5M) — DO NOT change this to 50M
     even though the spec said 50M; the code (generator.py:57) is authoritative"
  - "All heading hierarchy and tag frontmatter in each .md file"
