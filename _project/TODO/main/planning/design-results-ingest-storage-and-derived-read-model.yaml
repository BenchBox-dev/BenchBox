  - read-model
  - architecture
  estimated_effort: "Large"
  created_date: "2026-03-29"

impact:
  business_value: |
    Gives BenchBox a buildable platform architecture instead of a vague notion
    of "upload results and analyze them on the site".
  user_impact: |
    Users get stable result pages and responsive public browsing without waiting
    on a browser to parse every raw submission directly.
  technical_debt: |
    Establishes the boundary between immutable source artifacts and rebuildable
    derived projections before implementation creates a tangled hybrid.

must_preserve:
- "Raw schema-v2 bundles and companion files remain immutable source artifacts"
- "The public explorer can be rebuilt from stored source artifacts plus durable metadata"

approach: |
  Use a split write/read architecture. Store raw bundles once, normalize into
  durable metadata, and publish rebuildable read models for the explorer.
  Prefer static-friendly public reads and keep authenticated mutations behind
  the hosted service boundary.

anti_patterns:
- "DO NOT make the explorer query arbitrary raw uploads as its primary data source -- because that couples UX latency and safety to uncurated artifacts -- serve derived read models"
- "DO NOT collapse object storage keys, submission IDs, and public result URLs into one identifier -- because retries, rebuilds, and public permalinks have different lifecycles -- separate them explicitly"

