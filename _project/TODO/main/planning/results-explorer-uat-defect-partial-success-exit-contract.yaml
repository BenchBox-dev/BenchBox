id: results-explorer-uat-defect-partial-success-exit-contract
title: "UAT defect: passed cells hide query-level failures"
worktree: main
priority: "High"
status: "Not Started"
category: "Testing and Quality Assurance"

description: |
  The Results Explorer UAT sweep found cells that were recorded as passed even
  though the run log reported query-level failures. Examples include
  `spark_tpchavoc_0.1_20260502_205516.log:5910`, which reported 203 passed and
  17 failed queries, and `pandas-df_read_primitives_1.0_20260502_211633.log:145`,
  which reported completion with failures.

  A cell should not be eligible for publication or leaderboard display as a
  clean pass when any query in the requested phase failed.

work:
- id: w1
  summary: "Trace the run-result status contract and list exact owned files"
  status: pending
  notes: |
    Before editing, identify the code path that converts per-query failures into
    process exit status, result JSON status, and submission/Explorer eligibility.
    Record exact files owned by the implementation in this TODO.
- id: w2
  summary: "Make partial query failures explicit and non-clean-pass"
  needs: [w1]
  status: pending
- id: w3
  summary: "Add regression coverage for mixed pass/fail query outcomes"
  needs: [w2]
  status: pending

verification:
- description: "Targeted regression test proves query-level failures do not publish as clean passes."
  command: "uv run -- python -m pytest tests -k 'partial and query and failure' -q"
  expected_output: "selected tests pass"
- description: "Fast suite remains green."
  command: "uv run -- python -m pytest -m fast -q"
  expected_output: "all selected tests pass"

must_preserve:
- "Fully successful runs still export and submit as clean passed results."
- "Query-level failure diagnostics remain visible in logs and result artifacts."

anti_patterns:
- "DO NOT silently drop failed query rows -- because users need failure evidence -- preserve diagnostics while changing pass/fail eligibility."
- "DO NOT widen this into benchmark-specific fixes -- because the bug is the status contract -- fix the shared result/status path."

metadata:
  tags: [uat, results-explorer, result-contract]
  created_date: "2026-05-03"
