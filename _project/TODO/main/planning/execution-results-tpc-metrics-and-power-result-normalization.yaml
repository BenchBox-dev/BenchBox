success_metrics:
  - "There is exactly one production TPC metrics calculator import path."
  - "Power-test result conversion has one helper for normal query results and one helper for error sentinels."
  - "TPC metric tests cover all formulas previously covered by the legacy module."
  - "No exported result payload changes are introduced by the cleanup."

open_questions:
