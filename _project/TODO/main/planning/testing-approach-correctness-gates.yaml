success_metrics:
  - "Develop PRs have at least one bounded real local benchmark correctness gate for code-impacting changes."
  - "The new gate asserts completion, phase coverage, query cardinality, and expected-results row counts where the selected case supports them."
  - "`make lint-markers` or its replacement explicitly runs the marker-strategy tests."
  - "The repository has an explicit policy for medium tests, backed by a ratchet or documentation check."
  - "Known low-signal coverage-padding and stale test-doc artifacts are removed or replaced with behavioral coverage."
  - "Release docs clearly separate routine PR gates, release canary evidence, stress tests, live cloud tests, and UAT."

open_questions:
  - question: "Which local benchmark/platform pair provides the best PR-gated correctness oracle without unacceptable runtime?"
    gating: true
    affects: ["w1"]
    default: "Prefer the smallest case that preserves stored expected-results row-count validation; use smaller smoke coverage only with an explicit tradeoff note."
  - question: "Should `medium` become a first-class CI lane or be retired as a marker?"
    gating: true
    affects: ["w3"]
    default: "Promote correctness-relevant medium tests into explicit lanes and stop treating medium as an implicit guarantee."

