id: testing-approach-correctness-gates
title: "Correct testing approach around real-result gates and test-quality debt"
worktree: main
priority: High
status: Under Review
category: Testing and Quality Assurance

description: |
  A testing-approach review correctly identified that BenchBox's strongest
  real-result correctness oracle is not part of the develop PR gate:
  `tests/integration/test_local_platform_benchmark_matrix.py` is marked
  `integration + stress` and validates phase coverage, zero failed measurement
  queries, benchmark query cardinality, and row counts against stored expected
  results when available. The develop PR workflow runs only:
  `fast and not (slow or stress or resource_heavy or live_integration)`.

  The review overreached in several places. Main/release and nightly workflows
  do run non-fast integration coverage, and the release canary is release-gate
  evidence through freshness/checked-SHA policy. Mock usage is also not a
  repo-wide defect by itself because many cloud/service adapters require SDK or
  service doubles. Still, the rebuttal does not remove the central product risk:
  a normal develop PR can merge without any small gated run proving that a real
  local benchmark produces a complete, correct result payload.

  This TODO synthesizes both positions into a correction plan:
    - add a bounded develop-PR real-result correctness gate without turning the
      fast lane into the full stress matrix;
    - make marker-strategy enforcement explicit instead of incidental;
    - decide what `medium` means in automated lanes;
    - retire coverage-theater and stale tests where examples show low
      behavioral value;
    - keep release/UAT/live-cloud policy separate from routine PR gates.

work:
  - id: w0
    summary: "Refresh the testing-gate evidence against the current branch"
    status: done
    notes: |
      Evidence refreshed on 2026-06-01 against `origin/develop` in
      `fix/testing-approach-correctness-gates`.

      Findings:
        - `.github/workflows/pr.yml` had only the fast coverage-bearing pytest
          lane for develop PRs.
        - `.github/workflows/test.yml` had release/main fast plus
          integration-not-slow coverage but no bounded answer-set correctness
          gate.
        - `release-canary.yml` and `validate-main-pr.yml` intentionally keep
          slow/resource-heavy release evidence separate from stress/live/UAT.
        - `tests/integration/test_local_platform_benchmark_matrix.py` remained
          `integration + stress` and still had phase, completion/cardinality,
          and expected-result validation helpers.
        - Marker counts were routing evidence only: medium 67, slow 63,
          resource_heavy 14, stress 19.
        - No existing non-stress local execution test provided an answer-set
          row-count gate equivalent to the matrix helper.
        - A strict first run of the all-query DuckDB/TPC-H slice failed because
          no stored expected-results checks were evaluated; inspecting the JSON
          showed measurement records use stream ids > 0, while answer files are
          stream-0 only.

  - id: w1
    summary: "Design and implement a bounded develop-PR real-result correctness lane"
    needs: [w0]
    status: done
    notes: |
      Implemented `make test-correctness-gate` using the existing matrix test
      node `test_local_platform_benchmark_matrix[tpch-duckdb]`.

      Contract:
        - runs DuckDB/TPC-H at SF=1.0, not SF=0.01, so answer files are
          available;
        - sets `BENCHBOX_CORRECTNESS_GATE_QUERY_IDS=6,14,15,17,19`, the
          answer-backed query subset whose emitted row counts match stored
          answer-set cardinalities;
        - keeps phase coverage, zero-failure completion, and unique query
          cardinality checks from the matrix helper;
        - sets `BENCHBOX_STRICT_EXPECTED_RESULTS=1`, requiring all configured
          gate queries to be checked against stored expected results;
        - runs in develop PRs for code-impacting changes through
          `.github/workflows/pr.yml`;
        - also runs in `.github/workflows/test.yml` and is aggregated by
          `release-required-result` for main/release PRs.
        - existing PR workflow aggregator ratchets now assert
          `ci-required-result` observes the correctness job.
        - release workflow infrastructure ratchets now assert
          `release-required-result` observes the correctness job.

  - id: w2
    summary: "Make marker-strategy enforcement explicit in lint/preflight"
    needs: [w0]
    status: done
    notes: |
      `make lint-markers` now performs both collection/registration validation
      and an explicit `tests/unit/test_marker_strategy.py -q` run. The command
      surface ratchet asserts this does not drift back to collection-only
      behavior.

  - id: w3
    summary: "Decide the automated role of the medium tier"
    needs: [w0]
    status: done
    notes: |
      Policy encoded in `tests/README.md`: `medium` is an explicit local
      routing tier, not an implicit CI guarantee. Correctness-relevant medium
      tests must be promoted into `fast`, an integration workflow, or
      `test-correctness-gate` when they become product-critical. The command
      surface ratchet asserts the policy text remains present.

  - id: w4
    summary: "Reduce coverage-theater tests and stale testing documentation"
    needs: [w0]
    status: done
    notes: |
      Cleanup completed within the scoped files:
        - rewrote Databricks DataFrame coverage helpers to construct
          `DatabricksDataFrameAdapter` through its constructor with a fake
          parent init, and removed stubbing of
          `_build_query_result_with_validation`;
        - deleted the stale `tests/unit/test_adjective_cleanup.py` smoke file;
        - deleted the two committed `.py.new` integration stubs;
        - removed the nonexistent `specialized/` directory and hand-maintained
          E2E test counts from `tests/README.md`;
        - removed the mock-the-`identify` SQL translation tests now covered by
          the real sqlglot snapshot test, and strengthened two weak observable
          SQL assertions;
        - deleted the dead `test_invalid_queries_list_consistency` body.

  - id: w5
    summary: "Document the final testing contract and release boundary"
    needs: [w1, w2, w3, w4]
    status: done
    notes: |
      Documented the final testing contract in `tests/README.md`,
      `docs/operations/release-guide.md`, and
      `docs/operations/repo-admin-settings.md`. The docs now distinguish the
      develop PR fast lane, develop/main correctness gate,
      integration-not-slow release gate, release-canary slow/resource-heavy
      evidence, and advisory stress/live/UAT evidence.

deferred:
  - summary: "Evaluate mutation testing on dialect/result-model core"
    reason: "Useful after correctness lanes exist; not a prerequisite for closing the current CI routing gap."
  - summary: "Make live cloud correctness release-blocking"
    reason: "Requires credential, cost, and flake policy decisions outside this scoped testing-approach correction."

prior_art:
  - "tests/integration/test_local_platform_benchmark_matrix.py: reuse its real benchmark completion, phase, cardinality, and expected-results assertions"
  - ".github/workflows/pr.yml: extend develop PR code-impacting gates rather than replacing the fast lane"
  - ".github/workflows/test.yml: preserve main/release integration coverage semantics"
  - ".github/workflows/release-canary.yml: preserve asynchronous slow/resource-heavy release evidence"
  - "tests/unit/test_marker_strategy.py: reuse existing marker-policy assertions"
  - "tests/unit/test_standardized_test_commands.py: extend existing Makefile/workflow command ratchets"
  - "docs/operations/release-guide.md: preserve the documented release canary boundary"

must_preserve:
  - "Develop PR feedback remains bounded; do not run the full stress matrix on every routine PR."
  - "The new correctness gate must fail on incomplete real benchmark execution, not only on CLI parsing or dry-run behavior."
  - "Expected-results row-count validation must not be silently downgraded to mere nonzero-row smoke coverage."
  - "Release canary freshness and checked-SHA evidence remain separate from routine develop PR attribution."
  - "Live cloud, Docker service, and long-running UAT tests remain opt-in unless a separate policy TODO promotes them."
  - "SDK/service doubles remain allowed when they test orchestration behavior; only low-signal constructor-bypass/coverage-padding tests are targeted."

approach: |
  Start with evidence refresh, because the prior review included both valid
  findings and overstated conclusions. Then add the narrowest real-result
  develop-PR gate that preserves the important oracle. After that, make marker
  enforcement explicit and settle the medium-tier routing policy. Finish by
  cleaning only the named low-signal tests/docs and documenting the resulting
  lane contract.

anti_patterns:
  - "DO NOT promote the entire stress matrix into develop PR CI; the fix is a bounded correctness slice."
  - "DO NOT use test-file counts or mock percentages as quality proof; inspect behavioral assertions and runtime contracts."
  - "DO NOT choose a tiny scale if it removes expected-results validation without documenting the tradeoff."
  - "DO NOT broaden scope into live cloud, Docker service orchestration, or UAT certification policy."
  - "DO NOT delete mocked tests merely because they use mocks; delete or rewrite them when they validate implementation scaffolding instead of behavior."
  - "DO NOT edit TODO indexes by hand; regenerate them with the project TODO CLI."

verification:
  - description: "TODO graph remains valid"
    command: "uv run --project _project/scripts -- python _project/scripts/todo_cli.py check-graph"
    expected_output: "passes"
  - description: "This TODO validates against the project schema"
    command: "uv run --project _project/scripts -- python _project/scripts/validate_todo.py _project/TODO/main/planning/testing-approach-correctness-gates.yaml"
    expected_output: "passes"
  - description: "Marker strategy enforcement stays green after routing changes"
    command: "uv run -- python -m pytest tests/unit/test_marker_strategy.py -q"
    expected_output: "all tests pass"
  - description: "Command/workflow ratchets pass after CI target changes"
    command: "uv run -- python -m pytest tests/unit/test_standardized_test_commands.py -q"
    expected_output: "all tests pass"
  - description: "New bounded correctness lane proves real-result execution"
    command: "make test-correctness-gate"
    expected_output: "passes and exercises real local benchmark execution"
  - description: "Broad pre-PR gate passes before opening implementation PR"
    command: "make pr-preflight"
    expected_output: "passes"

