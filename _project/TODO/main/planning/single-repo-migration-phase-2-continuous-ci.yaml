id: single-repo-migration-phase-2-continuous-ci
title: "Single-repo migration phase 2: continuous CI on push to main and every PR"
worktree: main
priority: High
status: Not Started
category: Release Tooling

deps:
  needs:
  - single-repo-migration-phase-0-audit

description: |
  Today, automate_release.py:run_ci_checks runs lint, format, type-check,
  and fast tests at release time. That makes "release" the first time any
  CI failure surfaces - turning a publication event into a debugging
  session. Goal: CI becomes ambient. Every push to main and every PR runs
  the same checks. main is always green; release never re-runs CI.

  Once continuous CI is in place, the release-time CI gate in
  automate_release.py is dead code (and gets deleted in Phase 6).

  Under Option B, this workflow file is added on private and lands on
  public via the Phase 4 final sync (alongside everything else). The
  no-op verification commit happens on public after Phase 4. Branch
  protection is configured in Phase 5 once dev locus is on the public
  clone.

  Plan file: /Users/joe/.claude/plans/single-repo-migration.md (Phase 2).

work:
- id: w1
  summary: "Inventory existing GitHub Actions workflows"
  status: pending
  notes: |
    ls .github/workflows/
    Identify which workflow currently runs lint+tests (likely test.yml or
    similar). Read it. Note which checks it already runs and on which
    triggers.

- id: w2
  summary: "Extend or create a CI workflow that runs the four release-time checks"
  needs: [w1]
  status: pending
  notes: |
    Triggers: push to main, pull_request to main.
    Jobs (mirror automate_release.py:582-608):
      1. uv run ruff check .
      2. uv run ruff format --check .
      3. uv run ty check
      4. uv run -- python -m pytest -m "fast and not (slow or stress or
         resource_heavy or live_integration)" --cov=benchbox
         --cov-fail-under=70 --ignore=tests/unit/platforms/dataframe/test_pyspark_df.py
         --ignore=tests/unit/platforms/pyspark
    Use ubuntu-latest. Set up uv via astral-sh/setup-uv@v3.
    Cache uv dependencies for speed.

- id: w3
  summary: "Push a no-op commit on public AFTER Phase 4 to confirm the workflow runs green"
  needs: [w2]
  status: pending
  notes: |
    Cannot be tested on private (private has no equivalent CI workflow
    setup that mirrors public). The verification happens after Phase 4
    lands the workflow on public:
      cd ~/Developer/benchbox-public
      git commit --allow-empty -m "chore: trigger CI"
      git push origin main  # or via PR if branch protection is already on
    Watch the workflow. If it fails, fix on a branch, PR, merge.
    If existing main is not green after Phase 4, surface that here -
    it is better to discover this now than during the v0.3.1 release
    (Phase 8).

- id: w4
  summary: "Document branch protection settings in decisions doc (apply in Phase 5)"
  needs: [w3]
  status: pending
  notes: |
    Branch protection cannot be tested against a private repo without
    affecting the maintainer's own pushes. Record the intended settings
    so they can be applied in Phase 5 without re-deciding:
      - Require PR before merging
      - Require status checks to pass: select the CI workflow from w2
      - Require linear history
      - Allow squash-merge only (disable merge commits and rebase-merge)
      - Block force pushes
      - Block deletions
    Solo maintainer note: do NOT require approving review (you would
    block yourself).

verification:
- description: "CI workflow file exists and runs all four checks"
  command: "grep -E 'ruff check|ruff format|ty check|pytest' .github/workflows/test.yml | wc -l"
  expected_output: "at least 4"
- description: "CI workflow triggers on push and pull_request"
  command: "grep -E 'push:|pull_request:' .github/workflows/test.yml | wc -l"
  expected_output: "at least 2"
- description: "Workflow runs green on a no-op commit"
  command: "gh run list --workflow=test.yml --limit 1 --json conclusion --jq '.[0].conclusion'"
  expected_output: "success"

must_preserve:
- automate_release.py is unchanged in this phase; its run_ci_checks still
  runs at release time. Removing it from the release path is Phase 6.
- The exclusion list (PySpark tests etc.) matches automate_release.py
  exactly so behaviour is consistent across both gates during the
  transition.
- Test execution order or markers are not changed; only WHEN the tests
  run changes.

anti_patterns:
- DO NOT remove run_ci_checks from automate_release.py in this phase -
  because the release pipeline is still in use; removing the gate before
  ambient CI is proven creates a window of no checks at all.
- DO NOT add new test categories or coverage thresholds - because the
  goal is parity with today's release-time CI, not to expand it; raise
  the bar in a separate item if needed.
- DO NOT skip w3 (no-op commit verification) - because YAML workflow
  changes that never run are a known footgun; only a real run proves
  the syntax and triggers are correct.

scope_limit:
  only_modify:
  - .github/workflows/test.yml  # or whichever is the main CI file
  - _project/decisions/single-repo-migration.md  # branch protection appendix
  notes: |
    Do NOT modify automate_release.py, source code, or test files.
    This phase only adds the ambient CI surface.
