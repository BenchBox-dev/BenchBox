id: uat-certification-rerun-ordering-and-gate
title: "UAT release-gate re-run: enforce ordering, fresh root, and an explicit approval gate"
worktree: main
priority: High
status: In Progress
category: Testing and Quality Assurance

description: |
  Once the framework and defect fixes land, a clean release-gate sweep must
  be run — and its ordering and approval criteria must be explicit, because
  the 2026-05-28/29 evidence had two structural problems beyond cell
  failures:

  - Ordering: the docker non-OLTP run started 2026-05-28 23:14, but a
    native-execution dataframe sweep ran afterwards (2026-05-29 01:17-07:50).
    A Docker stack began before all native/dataframe platforms had completed,
    so cross-run release-gate value is compromised.
  - Completeness: no run reached validate/package/explorer_smoke/report; no
    matrix_summary.tsv or validator_rollup.tsv exists for any run.

  Release-gate re-run contract:
    1. native SQL platforms first
    2. dataframe (native-execution) platforms second
    3. Docker non-OLTP stacks third
    4. Docker OLTP stacks last
  Run sequentially, one platform at a time; lifecycle logs must prove native
  completion before any Docker stack starts. Use a FRESH run root (not the
  failed 2026-05-28 dirs), BENCHBOX_OUTPUT_DIR=~/Developer/benchmark_runs,
  a recorded seed, non-OLTP scales 0.01/0.1/1, OLTP scale 0.01.

  APPROVAL GATE — APPROVE only if every non-blocked locally-testable platform
  reaches the report phase and all required, non-pruned cells pass. HOLD if
  ANY of: missing manifests, missing commit SHA, DuckDB reference failures,
  a Docker zero-cell run, a hung platform, or a NO_JSON without error text.

  CHARTER-VOCABULARY RECONCILIATION (decided 2026-05-31 by
  [[uat-certification-wording-charter-decision]], Path A): "certification" is
  NOT a chartered term in _project/specs/uat-framework.md;
  the chartered name is "release-gate orchestration". This work owns the
  renamed release-gate surface (tests/uat/configs/release-gate-0{1,2,3}-*.yaml,
  tests/uat/phases/report.py:release_gate_ordering_violations,
  tests/uat/test_config.py, and the docs "Release-gate re-run" section), so
  the rename to release-gate-orchestration vocabulary landed WITH this change
  rather than as a competing PR (which would break test_config.py and collide
  here). Do not introduce a standing cert-operations surface beyond the named
  evidence artifacts.

prior_art:
  - "docs/operations/uat-framework.md 'Sequential platform execution' + 'Cross-scale coverage assertion (opt-in)' — reuse the report.cross_scale_coverage_min_pairs teeth; extend the doc with the ordering + approval-gate runbook"
  - "tests/uat/configs/ historical + template configs — clone a template for the release-gate config rather than authoring from scratch"
  - "tests/uat/phases/report.py REPORT_HEADER / footer — the report-phase artifact the approval gate reads"

work:
  - id: w1
    summary: "Author/refresh the release-gate config(s) cloned from a template: scales 0.01/0.1/1 (non-OLTP), 0.01 (OLTP), recorded seed, fresh run root"
    status: done
    notes: |
      Three stage-ordered configs cloned from uat-enabled-platforms-full.yaml:
      release-gate-01-native-dataframe.yaml (groups native-sql+dataframe, 0.01/0.1/1),
      release-gate-02-docker-nonoltp.yaml (docker-fast, 0.01/0.1/1),
      release-gate-03-docker-oltp.yaml (docker-slow, 0.01). Numeric prefixes +
      runbook encode the run order. Fresh-root + recorded-seed are documented in
      the configs and runbook (config schema has no seed field; the operator
      records BENCHBOX_SEED). Validated in tests/uat/test_config.py.
  - id: w2
    summary: "Add an ordering assertion/lint: native completes before any Docker stack starts, provable from lifecycle logs"
    status: done
    notes: |
      report.parse_docker_up_events + report.release_gate_ordering_violations:
      parse Docker action=up timestamps from each stage's uat_lifecycle.log and
      flag any that precede the native+dataframe completion boundary. Stage 1 is
      Docker-free (docker_manage_platforms=false), so it emits no action=up
      events. Tested in tests/uat/test_report.py. Cross-stage order is also
      enforced by the runbook (separate sequential invocations).
  - id: w3
    summary: "Encode the APPROVE/HOLD gate as a checklist + optional report teeth (cross_scale_coverage_min_pairs)"
    needs: [w1]
    status: done
    notes: |
      cross_scale_coverage_min_pairs armed in all three configs (report-phase
      teeth: a floor breach forces a non-zero report exit). APPROVE/HOLD
      checklist written in the runbook.
  - id: w4
    summary: "Write the release-gate runbook section in docs/operations/uat-framework.md"
    needs: [w1, w2, w3]
    status: done
    notes: |
      "Release-gate re-run" section added: four-stage ordering, fresh root +
      seed, one-stack-at-a-time, measure-then-set Docker timeout, the ordering-
      check snippet, the cross-scale teeth, and the APPROVE/HOLD gate checklist.
  - id: w5
    summary: "Execute the full release-gate re-run into a fresh root and confirm every config reaches the report phase"
    needs: [w4]
    status: pending
    notes: |
      OPERATIONAL / live-environment sign-off step (deferred; not runnable in the
      implementation sandbox). Requires all platforms incl. built/pulled Docker
      stacks (LakeSail Spark image etc.) and a long multi-stage sweep. This is
      where [[uat-docker-stack-recovery]] w3/w4 (the Docker re-runs) are
      executed; they are marked "VIA cert-rerun w5 — NOT standalone" there so
      they are not picked up as an independent Docker-only sweep.
      Required terminal artifacts per run: cells.jsonl, compatibility_pruned.jsonl,
      resume.json (if aborted), matrix_summary.tsv, validator_rollup.tsv,
      uat_lifecycle.log, final report with COMPLETED footer + commit SHA. The
      code scaffolding (configs, ordering check, gate teeth, runbook) is in place
      so this becomes a run-and-evaluate step.

deps:
  needs:
    - uat-artifact-integrity-and-failure-capture
    - uat-preflight-disk-headroom-gate
    - uat-native-dataframe-compatibility-rules
    - uat-cross-engine-dataframe-defects
    - uat-duckdb-reference-triage
    - uat-docker-stack-recovery

must_preserve:
  - "execute.parallel_platforms stays hard-rejected; one platform / one Docker stack at a time."
  - "The 2026-05-28/29 run dirs are retained as failed-evidence reference, not reused as the release-gate root."
  - "preserve_datagen:true; datagen reuse and reuse-aware pruning are unchanged."

approach: |
  This is the integration/sign-off item: it should be worked LAST, after the
  five upstream fixes merge (see deps). Clone a config template, encode the
  four-stage ordering and scales, add a lightweight ordering check and the
  approval-gate checklist (reuse cross_scale_coverage_min_pairs for teeth),
  document the runbook, then execute into a fresh root. The deliverable is a
  COMPLETED report per config with a commit SHA — the artifact the original
  review found missing.

anti_patterns:
  - "DO NOT start a Docker stack before native + dataframe platforms finish - that contaminated the 2026-05-28 evidence."
  - "DO NOT resume into the failed 2026-05-28 dirs - treat them as non-evidentiary; use a fresh root."
  - "DO NOT APPROVE on a partial run - the gate requires the report phase to complete with all required non-pruned cells green."

verification:
  - description: "Config validation + report-teeth tests pass"
    command: "uv run -- python -m pytest tests/uat/test_config.py tests/uat/test_report.py -q"
    expected_output: "all pass; cross_scale_coverage teeth exercised"
  - description: "Release-gate re-run reaches report phase for every config"
    command: "make uat-sweep CONFIG=<release-gate-config.yaml>"
    expected_output: "each run dir has matrix_summary.tsv + validator_rollup.tsv + a COMPLETED report footer with commit SHA"

scope_limit:
  only_modify:
    - "tests/uat/configs/"
    - "tests/uat/config.py"
    - "tests/uat/test_config.py"
    - "tests/uat/phases/report.py"
    - "tests/uat/test_report.py"
    - "docs/operations/uat-framework.md"

success_metrics:
  - "A full release-gate sweep runs in the required order from a fresh root, every config reaches the report phase, and the APPROVE/HOLD gate is evaluable from the artifacts alone."
  - "Lifecycle logs prove native completion before any Docker stack starts."

