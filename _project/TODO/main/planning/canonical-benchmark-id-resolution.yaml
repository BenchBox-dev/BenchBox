success_metrics:
  - "Every runtime benchmark identity checked by the parity test equals the canonical registry ID."
  - "Direct `TPCHSkewBenchmark` and `VectorSearchBenchmark` construction no longer creates default paths/logger names using collapsed IDs."
  - "Unknown benchmark IDs fail before class loading with a clear error."

open_questions:
  - "Should deprecated-base benchmarks be migrated first, or should the deprecated base temporarily consume the same registry-backed identity resolver?"
  - "Should result metadata expose both `benchmark_id` and `data_source` when a benchmark intentionally reuses another benchmark's generated data?"
