  added:
    - "tests/unit/core/explorer_pipeline/test_comparison_artifact.py"
    - "tests/parity/fixtures/comparison_artifact_*.json"
  modified:
    - "benchbox/core/explorer_pipeline/models.py"
    - "benchbox/core/explorer_pipeline/transformer.py"
    - "benchbox/core/explorer_pipeline/pipeline.py"
    - "benchbox/cli/commands/explorer.py"
    - "results-explorer/src/manifest.ts"
    - "results-explorer/src/pages/Compare.tsx"
    - "results-explorer/src/components/NormalizedSpeedupChart.tsx"
    - "results-explorer/src/components/DivergingBarChart.tsx"
    - "results-explorer/src/components/QueryTimingChart.tsx"
    - "results-explorer/src/types.ts"

must_preserve:
  - "Existing `DetailResult` model and per-detail JSON file emission — Compare must still work via the fallback path during rollout"
  - "Existing `BenchmarkSummary` artifact format and emission — this work adds a parallel artifact, does not modify the summary"
  - "Existing `ComparabilityBanner` UI — only the warning generation moves server-side; the component contract is unchanged"
  - "Comparison URL format `?ids=id1,id2` — short-id resolution behavior unchanged"
  - "RANKING_METRIC_BY_FAMILY registry — the artifact reads from it but does not modify"

approach: |
  Schema-first: define the Pydantic model (w1) before any logic, so the
  explorer team can stub the consumer in parallel. Build the disambiguator
  (w2) before the artifact builder (w3) because the builder calls it.
  Wire the CLI subcommand (w4) before refactoring Compare (w5) so the
  artifact actually exists to fetch. Pipeline pre-emission for popular
  combinations (w8) layers on top of the subcommand and is independent
  of the explorer refactor.

  Speedup definition: use `slowest / this` per query (matches the current
  Compare.tsx breakdown table at line 392) for the `speedup_vs_slowest_per_row`
  field. For the per-baseline view (NormalizedSpeedupChart), the artifact
  provides the raw `display_ms_per_row` and the chart picks the baseline
  index — this is the one piece of computation that cannot be pre-emitted
  because the user picks the baseline interactively.

  HOWEVER: the speedup math `baseline_ms / this_ms` becomes a 3-line
  reduce in the chart, calling the parity-tested `speedupRatio` helper.
  Definition is unified, drift impossible.

  The `ComparisonArtifact` schema field names mirror the explorer types
  exactly to avoid translation layer bugs (Compare.tsx already uses
  `display_timings`, `display_geomean_ms` from DetailResult — the
  artifact uses the same names).

anti_patterns:
  - "DO NOT emit comparison artifacts for every N-way combination — because the combinatorics explode (100 results = millions) — emit on-demand via CLI subcommand, pre-emit only popular combinations"
  - "DO NOT remove the per-detail fallback in Compare.tsx during rollout — because pre-emitted artifacts will not exist for every combination users click — keep the fallback and log when it fires"
  - "DO NOT compute platform display labels in two places — because that recreates the parity bug we just fixed — disambiguate once in the pipeline and ship the result in the artifact"
  - "DO NOT change the `geomean_ms` semantics — because legacy consumers depend on the raw-sample geomean — `display_geomean_ms` is the canonical comparison value, `geomean_ms` is preserved for audit"
  - "DO NOT skip the `schema_version` field on ComparisonArtifact — because explorer must reject artifacts written by an incompatible older pipeline — version field is mandatory and explorer hard-fails on mismatch"
  - "DO NOT emit comparability_warnings as free-form strings — because the explorer needs to apply formatting/severity — use a structured `{kind, severity, message}` shape if extending, but for v1 mirror the existing string output of buildComparabilityWarnings exactly"

