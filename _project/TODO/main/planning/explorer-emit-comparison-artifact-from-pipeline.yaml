verification:
  - description: "ComparisonArtifact Pydantic model exists with the documented fields"
    command: "grep -n 'class ComparisonArtifact' benchbox/core/explorer_pipeline/models.py"
    expected_output: "class defined with schema_version, rows, query_cells, comparability_warnings, ranking_primary_metric"
  - description: "Disambiguator produces unique labels"
    command: "uv run -- python -m pytest tests/unit/core/explorer_pipeline/test_transformer.py::test_disambiguate_platform_labels -v"
    expected_output: "passes for single, duplicate, and triple-collision cases"
  - description: "Comparison artifact builder unit tests pass"
    command: "uv run -- python -m pytest tests/unit/core/explorer_pipeline/test_comparison_artifact.py -v"
    expected_output: "all cases pass"
  - description: "CLI subcommand emits a valid artifact"
    command: "benchbox explorer build-comparison --ids <id1>,<id2> --out /tmp/cmp.json && uv run -- python -c 'import json; from benchbox.core.explorer_pipeline.models import ComparisonArtifact; ComparisonArtifact.model_validate(json.load(open(\"/tmp/cmp.json\")))'"
    expected_output: "no exception — artifact validates against schema"
  - description: "Compare.tsx prefers artifact when available"
    command: "cd results-explorer && npm test -- Compare"
    expected_output: "tests cover both artifact-present and fallback paths"
  - description: "No two definitions of speedup remain in Compare.tsx"
    command: "grep -n 'slowestPrimary / primary\\|slowest / fastest' results-explorer/src/pages/Compare.tsx"
    expected_output: "zero matches — both replaced with `row.speedup_vs_slowest_per_row` from the artifact"
  - description: "Full Python and Vitest suites pass"
    command: "uv run -- python -m pytest -m fast -q && cd results-explorer && npm test"
    expected_output: "all tests pass"

deps:
  needs:
    - explorer-establish-cli-explorer-parity-tests
    - explorer-unify-visualization-foundations

success_metrics:
  - "Compare.tsx contains zero arithmetic on `display_ms` values for the artifact path (only renders pre-computed numbers)"
  - "Same `(id1, id2, id3)` URL produces byte-identical numbers in CLI export and explorer render"
  - "Two results with same platform but different driver versions render with distinct labels"
  - "Comparison artifacts pre-emitted for the top-N popular combinations load in <100ms (single fetch vs N fetches)"

