id: quality-add-dependency-upper-bounds-policy
title: "Add upper bounds on highest-risk dependencies and document policy"
worktree: main
priority: Medium
status: Not Started
category: Code Quality and Technical Debt
description: |
  Quality plan Phase 4e. The audit found pyproject.toml uses minimum-version
  pinning with no upper bounds (e.g., `sqlglot>=20.0.0`). For libraries with
  history of breaking changes in minor releases, this is a supply-chain risk:
  a `uv sync` on a fresh checkout in 6 months may install a sqlglot version
  that breaks dialect translation silently.

  Add upper bounds to the highest-risk dependencies (those with breaking
  history, or those whose API is deeply integrated into BenchBox internals).
  Document the policy in AGENTS.md so the rule survives the conversation.

work:
  - id: w1
    summary: "Identify 5-8 highest-risk deps (breaking minor releases, deep API integration, no semver guarantee). Candidates: sqlglot, pydantic, click, duckdb, pyarrow."
    status: pending

  - id: w2
    summary: "Add upper bounds to those deps in pyproject.toml: e.g., `sqlglot>=20.0.0,<30.0.0`. Pick bounds wide enough not to constrain users but narrow enough to catch breaking jumps."
    needs: [w1]
    status: pending

  - id: w3
    summary: "Run `uv lock --upgrade` and `uv run -- python -m pytest -m fast -q` to confirm no regression"
    needs: [w2]
    status: pending

  - id: w4
    summary: "Document the dependency-bounds policy in AGENTS.md: when to add an upper bound, when to bump it, the review process for major bumps"
    needs: [w3]
    status: pending

  - id: w5
    summary: "Add `_project/TODO/main/planning/review-dependency-upper-bounds-quarterly.yaml` as a quarterly maintenance reminder"
    needs: [w4]
    status: pending

files_affected:
  modified:
    - "pyproject.toml"
    - "uv.lock"
    - "AGENTS.md"
  added:
    - "_project/TODO/main/planning/review-dependency-upper-bounds-quarterly.yaml"

must_preserve:
  - "All current tests pass after lock refresh"
  - "Optional extras' platform-specific deps still install correctly via `uv sync --extra <name>`"
  - "Minimum versions remain valid (don't accidentally bump min above what's tested)"

approach: |
  Conservative bounds: pin to the next major version. For libraries on a
  rapid-major cadence (sqlglot ships majors quarterly), pin to `<current+2`.
  Document each bound's rationale inline as a TOML comment.

  For pydantic specifically, the v1→v2 migration was painful; we're on v2,
  so `<3.0.0` is safe and gives runway.

anti_patterns:
  - "DO NOT pin to exact versions — because that breaks transitive resolution for users — upper bounds only"
  - "DO NOT add bounds to every dep — because maintenance burden grows linearly — only the highest-risk 5-8"
  - "DO NOT bump bounds reactively when CI breaks — because that's exactly the signal we wanted — investigate the breaking change first"

verification:
  - description: "uv resolves lockfile cleanly"
    command: "uv lock --check"
    expected_output: "(no errors)"
  - description: "Fast test suite passes"
    command: "uv run -- python -m pytest -m fast -q"
    expected_output: "all tests pass"
  - description: "Optional extras still install"
    command: "uv sync --extra duckdb --extra clickhouse-server"
    expected_output: "(no errors)"

metadata:
  tags: ["quality-plan", "phase-4", "supply-chain", "deps"]
  estimated_effort: "Small (4-6 hours)"
  created_date: "2026-04-12"
