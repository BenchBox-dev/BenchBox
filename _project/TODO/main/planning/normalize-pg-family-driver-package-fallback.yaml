id: normalize-pg-family-driver-package-fallback
title: "Normalize driver_package fallback string across pg-family config builders"
worktree: main
priority: Low
status: Not Started
category: Code Quality
description: |
  Inconsistency surfaced during review of commit 495efcaa8 (psycopg3 migration
  completion). The pg-family `_build_*_config` builders disagree on the fallback
  value used for `driver_package` when `info` is None:

    - postgresql.py, timescaledb.py, cedardb.py, pg_duckdb.py, pg_mooncake.py
      all fall back to `"psycopg"` (bare distribution name).
    - questdb.py:1415 falls back to `"psycopg[binary]"` (with extras marker).

  In practice the fallback is rarely hit because PlatformRegistry.get_platform_info()
  returns a populated `info` for every registered platform, so `info.driver_package`
  wins. But the divergence is a latent footgun: if anything ever consumes
  driver_package as a pip-style requirement string vs. an import-name string,
  the two forms behave differently. The bare name `"psycopg"` is correct for
  `importlib.import_module()`; the bracketed form is only valid for pip/uv
  install commands.

  Action: pick one form (recommend bare `"psycopg"` since `driver_package` is
  used elsewhere as an import target) and normalize questdb.py to match. Audit
  any consumer of `DatabaseConfig.driver_package` to confirm import-name vs
  requirement-string usage before changing.

work:
- id: w1
  summary: "Audit consumers of DatabaseConfig.driver_package to determine intended semantics"
  status: pending
  notes: |
    grep for `driver_package` references across benchbox/. Determine whether
    consumers expect a pip requirement (`psycopg[binary]>=3.1`) or an import
    name (`psycopg`). The DatabaseConfig field is Optional[str] with no
    docstring distinguishing the two.

- id: w2
  summary: "Normalize questdb.py fallback to match pg-family convention"
  status: pending
  notes: |
    benchbox/platforms/questdb.py:1415 — change
      driver_package = info.driver_package if info else "psycopg[binary]"
    to
      driver_package = info.driver_package if info else "psycopg"
    (assuming w1 confirms import-name semantics).

success_criteria:
- All pg-family builders use identical fallback string for driver_package
- DatabaseConfig.driver_package field gets a docstring clarifying its semantics
