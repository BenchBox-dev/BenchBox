id: cross-surface-comparator-boundary-tie-soundness
title: "Cross-surface comparator: make the final-tie-group guard boundary-aware (one-visible-row LIMIT ties)"
worktree: main
priority: Low
status: In Progress
category: Testing and Quality Assurance

description: |
  Follow-up spun out of PR #878 (review-sweep pass 3) and the order-aware
  comparator landed in #872. It records a known, accepted limitation in the
  shared cross-surface SQL<->DataFrame validator so it is tracked rather than
  forgotten.

  `ResultValidator.validate_results_exact(order_aware=True, tie_aware=True)`
  (benchbox/core/tpchavoc/validation.py, `_validate_order_aware`) partitions the
  returned rows into consecutive same-order-key groups and, for the FINAL group
  under a trailing `LIMIT`, tolerates a membership difference as an
  equally-valid tie pick across the LIMIT cutoff. #878 tightened that acceptance
  to require a genuine tie of `len(orig_rows) >= 2` rows sharing the final key,
  so a deterministic single-row final-group difference is CAUGHT instead of
  masked.

  Codex review on #878 (discussion r3462372977) correctly observed the residual
  edge: when a `LIMIT` cuts mid-tie, a legitimate boundary tie can leave exactly
  ONE of the tied rows visible (keys `10, 5a, 5b` with `LIMIT 2` -> `[10, 5]`).
  Two surfaces picking different `5` rows is valid SQL, but the `>= 2` guard now
  flags it as a mismatch.

  The root cause is fundamental: from the TRUNCATED result alone, a one-visible-
  row boundary tie and a genuine unique-final-key value change (e.g.
  `(2,"good")` vs `(2,"bad")`) are structurally identical - same final order
  key, differing non-key column, a single row in the group. The comparator
  cannot distinguish them without signal from outside the LIMIT.

  Accepted tradeoff (decided on #878): land the `>= 2` guard as-is. Its failure
  mode is a LOUD false positive (a gate fails when it should not), which is
  recoverable and safer than the prior behavior (#872 accepted ALL final-group
  differences, silently MASKING real single-row value bugs). All five enforced
  cross-surface gates currently pass (0 unclassified divergent), so the false
  positive is latent and data-dependent, not an active breakage.

prior_art:
  - ref: "PR #872"
    note: "Introduced the order-aware/tie-aware comparator; original final-group accept was unconditional (masked single-row value bugs)."
  - ref: "PR #878 + Codex discussion r3462372977"
    note: "Tightened the ORDER-BLIND boundary heuristic (_is_tie_ambiguous_boundary) to require len(...) >= 2 worst-kept rows; surfaced the one-visible-row boundary-tie false-positive edge documented here."
  - ref: "self-review follow-up (this branch)"
    note: "The order-AWARE path (_validate_order_aware) was MISSING the same >= 2 guard - its final-group accept was unconditional (`if i == last_index and tie_aware`), so a deterministic single-row final-group value bug was masked there even though the order-blind path caught it. Added `and len(orig_rows) >= 2` so both paths are consistent; regression tests test_order_aware_rejects_unique_last_row_change / _accepts_genuine_boundary_tie_swap. The one-visible-row FP below now applies to BOTH paths, and w1's boundary probe should fix both."
  - ref: "benchbox/core/tpchavoc/validation.py:_validate_order_aware"
    note: "The guard site (now `if i == last_index and tie_aware and len(orig_rows) >= 2`)."

work:
  - id: w1
    summary: "Give the comparator a boundary-tie probe so a one-visible-row final tie is not a false positive"
    status: done
    notes: |
      DONE for the ORDER-AWARE path (the principled case). Implemented the first
      candidate approach: cross_surface._boundary_tied_past_limit re-runs each
      trailing-LIMIT query's SQL reference at `LIMIT N+1` and reports whether the
      first dropped row shares the final kept row's resolved order-key value
      (True = genuinely tied past the cutoff; False = the final group is complete /
      untruncated; None = not applicable / unanswerable). The gate threads it as
      validate_results_exact(boundary_tie_past_limit=...), which REPLACES the
      order-aware `>= 2` heuristic with the precise signal: a one-visible-row tie
      that is tied past the cutoff is now ACCEPTED (the false positive is gone),
      AND a >= 2-visible COMPLETE final group that differs is now CAUGHT (a false
      negative the heuristic masked). None falls back to the `>= 2` heuristic, so
      the change is additive; TPC-Havoc (no order_aware) stays byte-identical (440
      cells, 0 divergent). Regression tests: comparator
      (test_boundary_probe_* in test_tpchavoc_validation_coverage) and the probe
      itself (TestBoundaryTiedPastLimitProbe in test_cross_surface). All five
      enforced gates stay green.

      RESIDUAL (smaller, separate): the ORDER-BLIND boundary heuristic
      (_is_tie_ambiguous_boundary, used only when the ORDER BY does not resolve to
      result columns - e.g. ORDER BY a non-projected column, or SELECT *) cannot
      consume the result-column probe and keeps its own `>= 2` guard, so its
      one-visible-row false positive remains. It affects only the minority of
      gated queries with an unmappable ORDER BY and is latent (all gates pass).

deferred:
  - summary: "Extend the boundary-tie probe to the order-BLIND heuristic (unmappable ORDER BY / SELECT *)"
    reason: "The LIMIT N+1 probe needs a resolved order-key column to compare; order-blind queries have none, so they keep the `>= 2` heuristic and its one-visible-row false positive. Minority of gated queries, latent (all gates pass). A fix would need a different probe (e.g. compare full first-dropped vs last-kept rows, or derive the boundary column from the order-blind heuristic's monotonic-column pick)."
  - summary: "Reworking the gate to compare untruncated result sets generally"
    reason: "Out of scope - changing query shape (dropping LIMITs) would change what the cross-surface gate measures; the probe in w1 is the targeted, additive fix."
