id: sync-workflow-stale-branch-cleanup
title: "Clean up stale auto-mirror branches/PRs after sync workflow runs in prod"
worktree: main
priority: "Low"
status: "Blocked"
category: "Operations"

deps:
  needs:
  - published-results-slim-down-and-corpus-mirror

description: |
  The `sync-results-data-to-published.yml` workflow that landed in W4 of
  `published-results-slim-down-and-corpus-mirror` opens a fresh draft PR
  named `auto/results-mirror-<develop-SHA8>` for every develop push that
  changes corpus paths. Old auto-mirror PRs and branches accumulate over
  time — the workflow has no cleanup mechanism today.

  Wait for the workflow to run in production for one or two months, then
  decide what cleanup looks like based on actual cadence and PR volume.
  As of the 2026-05-26 TODO review, live GitHub state showed the first
  matching auto-mirror PR was opened on 2026-05-06, so the earliest
  one-month review point is 2026-06-06. Keep this TODO Blocked until
  that date, then run W0/W1 against current GitHub state before designing
  cleanup.

work:
- id: w0
  summary: "Revalidate the 2026-06-06 production-window gate"
  status: pending
  notes: |
    Earliest start is 2026-06-06 based on the first observed
    auto/results-mirror PR date from the 2026-05-26 TODO review. On or
    after that date, re-run the GitHub PR/branch queries and record the
    first observed auto-mirror PR date in the PR body. If the first date
    has changed, keep at least one full month of production runtime before
    proceeding to W1.

- id: w1
  summary: "Revalidate the calendar gate and audit auto-mirror PR/branch accumulation"
  needs: [w0]
  status: pending
  notes: |
    Do not start before 2026-06-06 unless the first auto-mirror PR date
    is rechecked and proves an earlier full-month window. Run:
    `gh pr list --base published-results --state all --search "head:auto/results-mirror-"`
    and `gh api repos/joeharris76/BenchBox/git/matching-refs/heads/auto/results-mirror`.
    Count PRs by status (open/draft, open ready-for-review, merged,
    closed-without-merge) and count matching branches. Decide whether
    cleanup is needed based on observed cadence.

- id: w2
  summary: "Implement cleanup if needed"
  needs: [w1]
  status: pending
  notes: |
    If audit surfaces meaningful accumulation, extend the sync workflow
    (or add a sibling scheduled workflow) to:
      - Close stale auto-mirror draft PRs older than N days where a newer
        auto-mirror PR exists for the same series.
      - Delete the corresponding auto-named branch.
    Skip merged or human-edited (label `needs-review` or non-draft) PRs.

verification:
- description: "One-month production window has elapsed before cleanup design begins"
  command: "uv run -- python -c \"from datetime import datetime, timezone; raise SystemExit(0 if datetime.now(timezone.utc).date().isoformat() >= '2026-06-06' else 1)\""
  expected_output: "exit 0 on or after 2026-06-06"
- description: "No superseded auto-mirror draft PR older than the 30-day staleness window remains open"
  command: "gh pr list --base published-results --state open --search 'head:auto/results-mirror- draft:true' --json createdAt --jq '[.[] | select((now - (.createdAt|fromdateiso8601)) > 2592000)] | length'"
  expected_output: "0 after cleanup runs — older superseded auto-mirror drafts are closed; the newest mirror per series may remain open"
- description: "Auto-mirror branches on origin do not grow unbounded"
  command: "git ls-remote origin 'refs/heads/auto/results-mirror-*' | wc -l"
  expected_output: "<= the configured retention count chosen in w2 (bounded; not monotonically increasing across runs)"

prior_art:
- ".github/workflows/sync-results-data-to-published.yml — the W4 workflow that opens the auto-mirror draft PRs; EXTEND it with a cleanup step (preferred) rather than introducing a new module"
- ".github/workflows/nightly.yml, .github/workflows/release-canary.yml — existing `schedule:`-triggered workflows; REUSE their cron + gh-cli idiom if a sibling cleanup workflow is added instead of extending the W4 workflow"

must_preserve:
- "Auto-mirror PRs that a maintainer has flipped from draft to ready-for-review must NOT be auto-closed."
- "Auto-mirror PRs labelled by a maintainer (e.g. `keep`, `needs-review`) must NOT be auto-closed."

approach: |
  Defer the implementation until production cadence is known. The
  workflow's draft-only design means stale PRs are visible but
  non-blocking; cleanup is a quality-of-life improvement, not a
  correctness requirement.

anti_patterns:
- "DO NOT auto-close auto-mirror PRs that have been opened for less than the configured staleness window -- because the maintainer may be in the middle of reviewing -- gate cleanup on age + draft status + presence of a newer mirror PR for the same series."

scope_limit:
  only_modify:
  - ".github/workflows/sync-results-data-to-published.yml"
  - ".github/workflows/sync-stale-mirror-cleanup.yml"
  - "_project/TODO/main/planning/sync-workflow-stale-branch-cleanup.yaml"
  do_not_modify:
  - "results-data/"
  - "scripts/validate_submission.py"
  - "scripts/generate_corpus_inventory.py"

success_metrics:
- "Auto-mirror draft PR backlog stays under a reasonable threshold (defined per audit) without manual intervention."

deferred:
- summary: "Cleanup of pre-W4 manual mirror branches"
  reason: "Pre-W4 there were no auto-mirror branches to clean up; this TODO scope is bounded to branches the workflow itself creates."

metadata:
  tags:
  - operations
  - sync-workflow
  - published-results
  estimated_effort: "Small (1 session) once audit data is in hand"
  created_date: "2026-05-03"

impact:
  business_value: |
    Reduces visual noise in the GitHub PR list against `published-results`,
    making it easier for maintainers to spot real contributor PRs.
  user_impact: |
    Indirect — keeps the contributor experience clean.
  technical_debt: |
    Without cleanup, the workflow's open-PR list grows unbounded.
