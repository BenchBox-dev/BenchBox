id: resolve-results-explorer-brand-ownership
title: "Resolve whether the results explorer lives under BenchBox or Oxbow Research"
worktree: main
priority: High
status: Not Started
category: Core Functionality
deps:
  needs:
  - define-results-platform-product-and-launch-strategy
description: |
  The results explorer could live under the BenchBox brand (benchbox.dev/results/)
  or the Oxbow Research brand (a separate domain/subsite). This decision affects:

  - **Domain and hosting**: benchbox.dev vs a separate Oxbow Research property
  - **Curation authority**: who curates and is responsible for published results
  - **Visual identity**: BenchBox design system vs Oxbow Research design system
  - **Submission model** (Phase 2+): who can submit, under which brand's trust
  - **Business positioning**: is the explorer a BenchBox feature or a standalone
    Oxbow Research product that happens to use BenchBox data

  This must be resolved before frontend scaffolding begins because it determines
  the domain, base URL, design tokens, and navigation structure.

work:
- id: w1
  summary: "Define what Oxbow Research is and how it relates to BenchBox"
  status: pending
  notes: |
    Clarify: is Oxbow Research a parent brand, a sibling product, a company
    entity, or something else? What is its existing web presence (if any)?
    What does it publish beyond BenchBox?

- id: w2
  summary: "Evaluate the tradeoffs of each brand placement"
  needs: [w1]
  status: pending
  notes: |
    BenchBox placement:
    - Pro: explorer drives traffic to the tool, integrated brand, simpler deployment
    - Con: explorer is tied to BenchBox's scope and identity

    Oxbow Research placement:
    - Pro: broader positioning, can encompass results beyond BenchBox
    - Con: separate domain/hosting, split brand awareness, more infrastructure

- id: w3
  summary: "Make the decision and document rationale"
  needs: [w2]
  status: pending
  notes: |
    Record the decision as an ADR or in the strategy memo. Update all downstream
    TODOs with the resolved domain, base URL, and design direction.

metadata:
  tags:
  - results
  - explorer
  - phase-1
  - brand
  - decision
  estimated_effort: "Small"
  created_date: "2026-03-30"

impact:
  business_value: |
    Wrong brand placement wastes engineering effort (rebuilding under a different
    domain) and dilutes brand awareness. Getting this right before building
    avoids costly rework.
  user_impact: |
    Users get a coherent brand experience from the start — the explorer feels
    like it belongs where it lives.

must_preserve:
- "The strategy memo must be updated with the resolved brand decision"
- "All downstream TODOs must reflect the chosen domain and identity"

approach: |
  This is a product/business decision, not a technical one. Gather the relevant
  context about Oxbow Research, evaluate tradeoffs, and make a clear call.

scope_limit:
  only_modify:
  - "_project/analysis/"
  - "_project/TODO/"
