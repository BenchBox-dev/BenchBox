  - fix-read-primitives-datafusion-df

work:
- id: w1
  summary: "Evaluate TPC-DS-OBT feasibility — design denormalization step for DataFrame loading pipeline"
  status: pending
  notes: |
    Most tractable of the deferred benchmarks. Needs a pre-query step to
    create the OBT (One Big Table) from standard TPC-DS tables.

- id: w2
  summary: "Design write-operation adapter layer for DataFrame platforms (INSERT/UPDATE/DELETE semantics)"
  status: pending
  notes: |
    Prerequisite for TPC-DI and Write Primitives DataFrame support.
    Fundamentally different from read-query model. May need new adapter interface.

- id: w3
  summary: "Evaluate Read Primitives DataFrame approach — catalog-driven query generation with different architecture"
  status: pending

- id: w4
  summary: "Monitor DataFusion releases for string_to_array, array_sum, array_distinct fixes — update adapter when resolved"
  status: pending
  notes: |
    DataFusion v50 gaps. Check each major release for resolution.
    Completion criteria: all three functions work natively in DataFusion Python
    bindings, or we implement UDF workarounds. Close this unit when the
    DataFusion DataFrame adapter can run all Read Primitives queries that
    currently use split_part proxies.
    Track at: https://github.com/apache/datafusion/issues

deferred:
- summary: "TPC-Havoc and JoinOrder DataFrame implementations"
  reason: "These benchmarks test SQL optimizer behavior (syntax rewriting, join ordering) which is meaningless for DataFrame execution. Likely never applicable to DataFrame mode."
