must_preserve:
  - "No source-code behavior change — YAML, Makefile comments, and AGENTS.md text only."
  - "Validator and graph stay green after the DONE-YAML edits."

anti_patterns:
  - "DO NOT touch executable Makefile recipe lines — comment text only for w3."
  - "DO NOT reopen or re-run the merged items; this only corrects their recorded metadata."

verification:
  - description: "Amended DONE YAMLs still validate and the graph is intact"
    command: "uv run --project _project/scripts -- python _project/scripts/validate_todo.py --all && uv run --project _project/scripts -- python _project/scripts/todo_cli.py check-graph"
    expected_output: "all files valid; no cycles/dangling refs"

scope_limit:
  only_modify:
    - "_project/DONE/main/active/"
    - "Makefile"
    - "AGENTS.md"

success_metrics:
  - "No DONE item from the holistic-review effort carries a count, scope list, or metric that contradicts its merged diff."
  - "Makefile comments match actual gate enforcement; AGENTS.md records the guard+wiring close-out rule."

deferred:
  - summary: "Broader audit of metric truthfulness across all historical DONE items."
    reason: "Scope to the holistic-review effort; a full DONE-corpus audit is separate."

