id: joinorder-trino-primary-key-ddl
title: "Strip JoinOrder primary-key constraints from Trino CREATE TABLE DDL"
worktree: main
priority: Low
status: Not Started
category: Platform Compatibility

description: |
  The JoinOrder Presto DDL remediation added `strip_primary_keys()` to
  `PrestoAdapter._optimize_table_definition()` after Presto rejected benchmark
  CREATE TABLE statements that carried PRIMARY KEY metadata. Trino has a
  parallel `_optimize_table_definition()` path and currently does not call the
  shared helper. If Trino becomes a canonical JoinOrder target, the same DDL
  failure shape may recur.

  This is not release-blocking for the JoinOrder remediation batch because the
  reviewed target was Presto, not Trino. Keep it as a scoped follow-up unless a
  Trino JoinOrder UAT failure makes it urgent.

work:
  - id: w1
    summary: "Confirm Trino connector behavior for PRIMARY KEY metadata"
    status: pending
    notes: |
      Re-check Trino memory and Hive/Iceberg connector CREATE TABLE behavior
      with a minimal statement containing both inline and table-level PRIMARY
      KEY metadata. If current Trino accepts the metadata, document that and
      close this as no-op.

  - id: w2
    summary: "Apply the shared primary-key stripping helper if Trino rejects the metadata"
    needs: [w1]
    status: pending
    notes: |
      If Trino rejects PRIMARY KEY metadata, import `strip_primary_keys` from
      `benchbox.platforms.base.ddl_helpers` and call it before memory/Hive
      connector-specific rewrites, mirroring the Presto order.

  - id: w3
    summary: "Add focused Trino optimizer regression coverage"
    needs: [w2]
    status: pending
    notes: |
      Cover inline `id INTEGER PRIMARY KEY` and table-level
      `PRIMARY KEY (id, coalesce(other_id, 0))` inputs. Keep the test focused
      on Trino DDL optimization and avoid requiring a live Trino server.

verification:
  - description: "Trino DDL optimizer unit coverage passes"
    command: "uv run -- python -m pytest tests/unit/platforms/test_trino_adapter.py -q"
    expected_output: "passes"
  - description: "Shared DDL helper regression coverage still passes"
    command: "uv run -- python -m pytest tests/unit/platforms/base/test_ddl_helpers.py -q"
    expected_output: "passes"
  - description: "TODO graph remains valid"
    command: "uv run --project _project/scripts -- python _project/scripts/todo_cli.py check-graph && uv run --project _project/scripts -- python _project/scripts/todo_cli.py validate _project/TODO/main/planning/joinorder-trino-primary-key-ddl.yaml"
    expected_output: "passes"

prior_art:
  - "benchbox/platforms/presto.py: Presto strips PRIMARY KEY metadata before connector-specific rewrites"
  - "benchbox/platforms/base/ddl_helpers.py: shared balanced-parenthesis `strip_primary_keys()` helper"
  - "tests/unit/platforms/test_presto_adapter.py: focused adapter optimizer coverage without a live server"

must_preserve:
  - "Do not change the canonical JoinOrder schema, query set, row counts, or reference cardinalities"
  - "Do not remove FOREIGN KEY metadata unless a Trino-specific failure proves it is necessary"
  - "Keep SDK imports lazy and do not require a live Trino server for unit coverage"

approach: |
  Treat this as connector compatibility hardening, not a broad Trino adapter
  refactor. First prove whether Trino still rejects PRIMARY KEY metadata in the
  relevant connector modes. Only then mirror the narrow Presto helper ordering.

anti_patterns:
  - "DO NOT factor Presto and Trino DDL optimization into a new shared abstraction unless multiple non-PK rewrites also converge"
  - "DO NOT use broad regex rewrites in the adapter when `strip_primary_keys()` already handles nested parentheses"
  - "DO NOT run live Trino/cloud tests without explicit approval"

scope_limit:
  only_modify:
    - "benchbox/platforms/trino.py"
    - "tests/unit/platforms/test_trino_adapter.py"
    - "_project/TODO/main/planning/joinorder-trino-primary-key-ddl.yaml"

metadata:
  tags:
    - joinorder
    - trino
    - ddl
    - follow-up
  estimated_effort: "Small"
  created_date: "2026-05-16"
