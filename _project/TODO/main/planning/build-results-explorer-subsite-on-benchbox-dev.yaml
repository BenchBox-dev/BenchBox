metadata:
  tags:
  - results
  - website
  - frontend
  - explorer
  - benchbox-dev
  estimated_effort: "Large"
  created_date: "2026-03-29"

impact:
  business_value: |
    Gives BenchBox a public product surface for results discovery and comparison
    rather than only a CLI and raw artifact files.
  user_impact: |
    Readers can browse, compare, and deep-link to public results without using
    the CLI or manually opening JSON exports.
  technical_debt: |
    Establishes a dedicated explorer boundary instead of trying to overload the
    docs stack with product UI concerns.

must_preserve:
- "Landing page, docs, and blog remain deployable under the existing GitHub Pages workflow until the new explorer is proven"
- "Explorer result pages link back to the canonical raw bundle and do not invent a second source of truth"

approach: |
  Build the explorer as a standalone subsite under the BenchBox public domain.
  Prefer static or precomputed routes for canonical result pages, then add
  richer browser-side interactivity on top of the derived read model.

anti_patterns:
- "DO NOT hide the canonical raw bundle behind a UI-only representation -- because reproducibility matters -- make the underlying bundle downloadable from result pages"
- "DO NOT use hash-only routing for canonical public result URLs -- because stable shareable pages matter for a benchmark site -- use real result paths or pre-rendered files"

files_affected:
