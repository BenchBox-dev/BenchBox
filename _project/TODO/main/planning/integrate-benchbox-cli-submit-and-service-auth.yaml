id: integrate-benchbox-cli-submit-and-service-auth
title: "Integrate BenchBox CLI submission flow and service authentication"
worktree: main
priority: Medium-High
status: In Progress
category: Core Functionality
deps:
  needs:
    - define-results-platform-product-and-launch-strategy
    - define-hosted-results-contract-and-governance-model
    - design-results-ingest-storage-and-derived-read-model
description: |
  BenchBox already has strong local run/export/history workflows, but it does
  not have a supported hosted submission flow. This item adds the hosted CLI
  contract, authentication model, and status/reporting flow for sending
  canonical result bundles to BenchBox services.

  The critical product rule is that hosted submission should not overload the
  semantics of local artifact publication. `benchbox publish` and
  `benchbox submit` must stay distinct so users know whether they are copying
  files to storage or uploading results into the hosted platform.

  **Phase assignment:** Phase 2-3. Phase 2 uses a simpler PR-based submission
  model (`benchbox submit --output` packages a bundle for PR contribution).
  The full hosted API + auth flow described here is Phase 3, contingent on
  submission volume exceeding what PR-based review can handle.

work:
  - id: w1
    summary: "Sketch the CLI surface: draft `benchbox submit --help` output and config key names"
    status: done
    notes: |
      Output landed at `_project/research/submit-cli-surface.md`
      (2026-04-27). Full --help text for the extended command with
      --service and --output as auto-selecting modes (preserves v0.2.x
      behavior exactly). Two new config sections (service, submission)
      with a deprecated-alias migration plan for the existing
      submit_to_service / service_url placeholders. Separate
      `benchbox auth` command tree for token management; keychain-first
      storage with encrypted-file fallback. --dry-run semantics for both
      modes documented. Out-of-scope-for-launch list (--watch, web UI,
      OAuth) explicit.

  - id: w2
    summary: "Map submit to existing result export surfaces - identify reuse points in exporter and results CLI"
    needs: [w1]
    status: done
    notes: |
      Output landed at `_project/research/submit-reuse-points.md`
      (2026-04-27). Reuse table covers bundle loading, manifest
      construction, companion resolution, history persistence — all
      from Phase 2's existing surfaces. The canonical schema-v2 bundle
      is what the service receives; no second wire format. Net-new
      modules enumerated (HTTP transport, idempotency-key persistence,
      auth store, auth CLI, service-mode submit handler). Composition
      seam: existing `benchbox submit` entry point dispatches to
      PR-packaging or hosted-service path based on flags / config.

  - id: w3
    summary: "Implement `benchbox submit` command skeleton with --dry-run and local validation"
    needs: [w1, w2]
    status: done
    notes: |
      Landed 2026-04-27 in commit df621a787:
        - --service / --visibility / --idempotency-key / --wait flags
          on the existing `benchbox submit` command.
        - New `_dispatch_service_mode` handler.
        - --service --dry-run validates the bundle locally, prints
          the upload preview (URL, hash, companions, visibility,
          idempotency key, wait), and returns 0 with no credentials.
        - --service without --dry-run surfaces a clear "not yet
          implemented" message and exits 1, since w4-w7 (auth,
          upload, status polling) need the real hosted ingest API
          to integrate against.
        - 8 new unit tests in tests/unit/cli/commands/test_submit.py
          cover dry-run path, default URL, custom URL passthrough,
          visibility flag + rejection, idempotency-key passthrough,
          not-implemented refusal, and the unchanged PR-package
          default behavior.

  - id: w4
    summary: "Implement authentication: token fetch, local keychain storage, and refresh flow"
    needs: [w3]
    status: done
    notes: |
      On first submit, prompt for token. Store securely (keyring or encrypted
      file). On subsequent runs, load token from storage. Handle 401 by prompting
      for re-auth rather than hard-failing. Do not store plaintext tokens in
      config files.

      Landed 2026-05-01:
        - Added `benchbox auth login/status/refresh/logout`.
        - Added `benchbox.cli.submit_auth` with env-token precedence,
          OS-keyring storage, hidden prompt fetch, keyring overwrite refresh,
          and token-redacted auth status.
        - Wired non-dry-run `benchbox submit --service` to resolve auth before
          the still-placeholder upload path. `--service --dry-run` remains
          credential-free.
        - `/code review W4` found and fixed two auth-flow issues: refresh now
          refuses to hide a replacement keyring token behind an active env
          override, and logout reports "not found" accurately before deleting.

  - id: w5
    summary: "Implement upload, status polling, retries, and idempotent re-submit"
    needs: [w4]
    status: pending
    notes: |
      POST the canonical schema-v2 bundle. Poll for async processing status
      (accepted → validated → published). Retry on transient errors (5xx,
      network). Re-submit with same bundle must be idempotent - service returns
      the existing hosted URL rather than creating a duplicate.

  - id: w6
    summary: "Connect hosted result URL and submission history into `benchbox results --submitted`"
    needs: [w5]
    status: pending
    notes: |
      After a successful submission, persist the hosted URL in local history.
      `benchbox results --submitted` lists past submissions with their hosted
      URLs. Builds on the existing results history surfaces without modifying
      the exporter.

  - id: w7
    summary: "Write unit and integration tests for the full hosted submission flow"
    needs: [w5, w6]
    status: pending
    notes: |
      Unit tests: CLI flag parsing, dry-run output, auth token storage/retrieval.
      Integration tests: full submit flow with a mock service (httpretty or
      respx). Cover retry, idempotency, and 401 re-auth paths.

  - id: w8
    summary: "Update CLI reference docs and add hosted-submission walkthrough"
    needs: [w6, w7]
    status: pending
    notes: |
      Update docs/CLI_REFERENCE.md and docs/reference/cli/ with submit command
      docs. Add a how-to page covering the end-to-end workflow:
      run → export → submit → track hosted URL.

metadata:
  tags:
    - results
    - cli
    - auth
    - submission
    - api
  estimated_effort: "Large"
  created_date: "2026-03-29"

impact:
  business_value: |
    Creates the user-facing bridge from BenchBox CLI runs to the hosted results
    platform.
  user_impact: |
    Users can submit canonical result bundles directly from BenchBox and track
    what happened to the submission.
  technical_debt: |
    Prevents the current placeholder service settings from staying as dead or
    misleading configuration surface.

must_preserve:
  - "`benchbox run`, `benchbox export`, and `benchbox results` remain valid for users who never interact with the hosted platform"
  - "Hosted submission uploads the canonical schema-v2 bundle instead of a second bespoke payload shape"

approach: |
  Build hosted submission on top of existing export/history surfaces, not as a
  parallel runner. Submission should work for already-exported results first,
  then compose naturally with the run lifecycle.

anti_patterns:
  - "DO NOT hide hosted submission inside generic export or results flags -- because users need to understand when they are invoking a networked service -- expose a first-class submit surface"
  - "DO NOT bypass the existing exporter when sending hosted submissions -- because that creates incompatible local vs hosted artifacts -- submit the canonical bundle"

verification:
  - description: "Submit command skeleton is importable and --help works"
    command: "uv run -- python -m benchbox submit --help 2>&1 | grep -c 'submit'"
    expected_output: "1"
  - description: "Submit unit tests pass"
    command: "uv run -- python -m pytest tests/unit/cli/commands/test_submit.py -q"
    expected_output: "All tests pass"
  - description: "Submit integration tests pass against mock service"
    command: "uv run -- python -m pytest tests/integration/test_hosted_submission.py -q"
    expected_output: "All tests pass"

