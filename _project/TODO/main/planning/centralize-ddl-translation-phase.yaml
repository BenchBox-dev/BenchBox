id: centralize-ddl-translation-phase
title: "Centralize DDL translation: introduce ddl_compile phase and schema IR"
worktree: main
priority: High
status: Identified
category: "Core Functionality"
description: |
  Eliminate split DDL ownership across three layers (benchmarks, base helpers, adapters) by introducing
  a first-class ddl_compile phase and structured schema IR. Currently, benchmarks emit target-dialect SQL,
  base helpers "compile" by double-translating, and adapters patch final SQL via regex/string rewrites.

  This architectural gap allows benchmark-level platform patches to persist despite the phase-aware pipeline.
  The solution is to make DDL generation a first-class concern in the compatibility phase model, not ad-hoc.

created_date: "2026-04-22"
last_updated: "2026-04-22T00:00:00"

work:
  - id: w1
    summary: "Extend CompatibilityContext with DDL fields and normalize all benchmark schemas to BaseSchemaTable IR"
    status: pending
    notes: |
      Add object_name, statement_kind, source_dialect, target_dialect to CompatibilityContext.
      Normalize vector_search, nyctaxi, tsbs_devops, write_primitives, read_primitives dict-based schemas.
      This is the prerequisite for all downstream work.

  - id: w2
    summary: "Add ddl_compile as first-class phase in compatibility registry"
    status: pending
    needs: [w1]
    notes: |
      Update CompatibilityResolver.build_plan() to sequence: schema_emit → ddl_compile → ddl_optimize → execute.
      Ensure existing query_id planning path for query execution remains unchanged.

  - id: w3
    summary: "Create central type mapping system and move _EMBEDDING_TYPE_MAP from benchmarks"
    status: pending
    needs: [w1]
    notes: |
      Create compatibility/transformers/ddl_compiler.py with structured type mapping (Vector, Timestamp, Decimal).
      Move _EMBEDDING_TYPE_MAP from vector_search into central renderer.
      Only type rendering in this unit; defer storage/physical rewrites to w5.

  - id: w4
    summary: "Refactor benchmarks to emit logical schema only (remove all dialect branches)"
    status: pending
    needs: [w1, w3]
    notes: |
      vector_search: remove dialect branches, emit Vector(dim, type) semantics only
      nyctaxi: remove ClickHouse MergeTree clauses, emit partition_intent
      tsbs_devops: remove TimescaleDB create_hypertable, emit time_series_intent
      write_primitives: remove PK dialect branches, let compiler handle capability gating
      Results must be bit-for-bit identical before/after.

  - id: w5
    summary: "Move adapter _optimize_table_definition() methods to central registry transformers"
    status: pending
    needs: [w2, w3, w4]
    notes: |
      ClickHouse, StarRocks, Databricks, Firebolt, Databend, Redshift, PostgreSQL.
      Extract regex/rewrite logic into compatibility/transformers/{platform}_ddl.py modules.
      Remove platform_transform_fn hook from _execute_schema_statements().
      Move existing rewrites as-is; do NOT optimize during move.

  - id: w6
    summary: "Audit remaining dialect branches and document design in ADR"
    status: pending
    needs: [w5]
    notes: |
      Run compat_lint.py to confirm zero benchmark-level patches.
      Update sql_compat/inventory.py and scripts/compat_lint.py to handle map-based renderers.
      Create docs/development/adr/ document explaining ddl_compile phase design.

deferred:
