    reason: "Out of scope; implement after core pipeline is working"
  - summary: "Support dataframe mode DDL generation through same pipeline"
    reason: "Can be added after SQL path is complete"
  - summary: "Integration with results-explorer for DDL tracking"
    reason: "Separate feature; deferred to results platform work"

