approach: |
  Follow CompatibilityResolver pattern from benchbox/sql_compat/resolver.py for phase sequencing.
  Use BaseSchemaTable model from benchbox/core/schema_primitives.py as IR foundation.
  Mirror the hook dispatch pattern in _execute_schema_statements() (benchbox/platforms/base/data_loading.py:2399)
  for transformer routing.

  Sequence work vertically: w1 foundation, then w2+w3 in parallel (phase + compiler system),
  then w4-w7 (per-benchmark refactor, parallelizable), then w8-w13 (per-adapter extraction,
  parallelizable), then w14 (final adapter + hook removal), finally w15 (audit/docs).

  For w4-w7 benchmark migration: read current dialect-aware implementations first (vector_search:48,
  nyctaxi:250, tsbs_devops:171, write_primitives:352), extract intent semantics, emit as part of
  schema IR instead of SQL strings.

  Each work unit should be 1-4 hours and produce an independently committable change.

anti_patterns:
  - "DO NOT add dialect branches during migration — because that perpetuates the split ownership model we're eliminating — all platform-specific logic must route through the compiler"
  - "DO NOT use query_id as proxy for table names — because that's an abstraction mismatch causing context confusion — add proper object_name/statement_kind fields"
  - "DO NOT keep get_create_tables_sql(dialect=...) variant methods — because that's the architectural root cause of split ownership — have benchmarks emit logical schema only"
  - "DO NOT add new dialect branches to benchmarks as a staging compromise — because staged compromises calcify and perpetuate the exact split ownership we're eliminating — commit dialect decisions to the compiler from the start"
  - "DO NOT invent new transformations during w5 — move existing rewrites as-is, then optimize separately"
  - "DO NOT refactor query execution path in parallel — stay focused on DDL pipeline only"

