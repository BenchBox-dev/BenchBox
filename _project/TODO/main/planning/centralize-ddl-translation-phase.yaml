id: centralize-ddl-translation-phase
title: "Centralize DDL translation: introduce ddl_compile phase and schema IR"
worktree: main
priority: High
status: Identified
category: "Core Functionality"
description: |
  Eliminate split DDL ownership across three layers (benchmarks, base helpers, adapters) by introducing
  a first-class ddl_compile phase and structured schema IR. Currently, benchmarks emit target-dialect SQL,
  base helpers "compile" by double-translating, and adapters patch final SQL via regex/string rewrites.

  This architectural gap allows benchmark-level platform patches to persist despite the phase-aware pipeline.
  The solution is to make DDL generation a first-class concern in the compatibility phase model, not ad-hoc.

created_date: "2026-04-22"
last_updated: "2026-04-22T00:00:01"

