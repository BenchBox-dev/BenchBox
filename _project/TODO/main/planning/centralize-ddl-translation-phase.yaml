context_sections:
  "Root Cause Analysis": |
    Benchmarks own dialect branches (vector_search:48, nyctaxi:250, tsbs_devops:171, write_primitives:352).
    Base helper asks for target-dialect SQL then translates again from duckdb (double-compilation).
    Adapters patch final SQL via _optimize_table_definition() regex/string rewrites (7 platforms).
    CompatibilityContext only has query_id, forcing overloading for table names ("tags").
    Actual dialect compilation lives ad-hoc in _create_schema_with_tuning(), not in registry.
    Result: translation ownership split across layers, preventing true centralization.

  "Why This Matters": |
    Phase-aware pipeline is incomplete for DDL. Query execution is properly phased (query selection → execution).
    But DDL generation bypasses the registry: schema_emit exists but doesn't own dialect compilation.
    ddl_optimize exists but can't optimize what it doesn't see (hidden in adapter methods).
    The hook in _execute_schema_statements() (platform_transform_fn) is an architectural admission that
    DDL is still patched late, not planned centrally.

  "Target End State": |
    Benchmarks emit only logical schema: columns, PK/FK intent, partition intent, clustering intent,
    vector dimensions/types, time-series intent. Zero platform names, zero dialect branches.

    ddl_compile phase owns all dialect translation: type mapping, rendering, platform capability gating.

    Adapters are mostly environment setup and statement execution, not DDL surgery.

    All DDL generation flows through single compiler pipeline in base code, visible to registry/planning.

