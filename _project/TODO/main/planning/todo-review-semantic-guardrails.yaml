id: todo-review-semantic-guardrails
title: "TODO review guardrails: catch conditional work, weak shell checks, and domain-confused evidence"
worktree: main
priority: Medium
status: "Not Started"
category: Developer Tooling

description: |
  Follow-up from the PR 719 TODO review L2 audit. The review found defects that
  schema validation did not catch:

  - mutually exclusive work units encoded as normal pending work, even though the
    TODO lifecycle has no skipped/waived work status;
  - verification commands whose shell semantics can produce ambiguous output;
  - missing `prior_art` on TODOs that add new modules, file locations, or
    conventions;
  - evidence wording that uses one label for different domains, such as local
    Docker host port vs adapter service/container port.

  These are review-framework blind spots. Capture them as reusable TODO-review
  guardrails so future TODO reviews fail the pattern directly instead of relying
  on reviewer memory.

prior_art:
  - "_project/scripts/validate_todo.py — extend for machine-checkable semantic TODO rules when reliable"
  - "_project/TODO_SCHEMA.yaml — reuse existing work/status schema; do not add a skipped status casually"
  - "/Users/joe/.skill-sync/skills/todo/SKILL.md review action — update reviewer guidance through the canonical skill source, not generated mirrors"
  - "_project/TODO/main/planning/uat-certification-rerun-ordering-and-gate.yaml — reuse as a positive example with prior_art and concrete verification"

work:
  - id: w0
    summary: "Re-validate the PR 719 review gaps against current TODO tooling"
    status: pending
    notes: |
      Inspect validate_todo.py, TODO_SCHEMA.yaml, todo_cli.py completion logic,
      and the todo skill review guidance. Record which guardrails can be
      machine-checked and which belong in reviewer guidance.

  - id: w1
    summary: "Add the machine-checkable guardrails"
    needs: [w0]
    status: pending
    notes: |
      Candidate checks: pending work notes that use branch-selection language
      without a single completion path; verification commands with known
      ambiguous shell constructs; TODOs adding new modules, env vars, file
      locations, or conventions without prior_art. Prefer conservative warnings
      when false positives are likely.

  - id: w2
    summary: "Update TODO-review guidance for judgement-based guardrails"
    needs: [w0]
    status: pending
    notes: |
      Add review guidance for same-label/different-domain evidence claims,
      especially infrastructure facts like host port vs service port where the
      correct fix is explicit modeling rather than forcing one value.

  - id: w3
    summary: "Add regression fixtures/tests for the new guardrails"
    needs: [w1, w2]
    status: pending
    notes: |
      Add focused tests or fixture TODOs covering conditional work units, missing
      prior_art, ambiguous verification commands, and the allowed replacement
      pattern: one required implementation work unit plus deferred unchosen path.

deferred:
  - summary: "Introduce a skipped/waived work status"
    reason: "That would alter TODO lifecycle semantics; this item should first enforce the current model."

metadata:
  tags:
    - todo
    - review
    - guardrails
    - l2-audit
  estimated_effort: "Small"
  created_date: "2026-05-31"
  last_updated: "2026-05-31T00:00:00Z"

impact:
  technical_debt: |
    Converts PR 719 review blind spots into repeatable TODO-review checks so
    schema-valid but semantically unimplementable TODOs are caught earlier.

must_preserve:
  - "Existing valid TODOs with normal decision work remain valid."
  - "The current work-unit completion model is not changed unless separately chartered."

approach: |
  Separate deterministic checks from reviewer judgement. Add conservative
  tooling where the pattern is structurally detectable, and update review
  guidance where semantic context is required.

anti_patterns:
  - "DO NOT add a broad skipped status just to paper over mutually exclusive work units."
  - "DO NOT make fragile keyword checks fail large classes of valid TODOs without a clear escape hatch."
  - "DO NOT edit generated skill mirrors directly; update the canonical source if skill guidance changes."

verification:
  - description: "TODO semantic guardrail tests pass"
    command: "uv run -- python -m pytest -k 'todo and semantic_guardrail' -q"
    expected_output: "0 failures"
  - description: "TODO graph and schema validation remain clean"
    command: "uv run --project _project/scripts -- python _project/scripts/todo_cli.py check-graph && uv run --project _project/scripts -- python _project/scripts/validate_todo.py --all"
    expected_output: "graph validation passed and all TODO/DONE files valid"

scope_limit:
  only_modify:
    - "_project/scripts/validate_todo.py"
    - "_project/TODO_SCHEMA.yaml"
    - "_project/TODO/ or _project/DONE/ test fixtures if needed"
    - "/Users/joe/.skill-sync/skills/todo/SKILL.md for canonical review guidance, followed by make skill-sync"
  do_not_modify:
    - ".agents/skills/ or .codex/skills/ generated mirrors directly"
    - "benchbox/ runtime code"
    - "tests/uat/ runtime behavior"

success_metrics:
  - "Conditional pending work-unit patterns are rejected or warned before implementation."
  - "Ambiguous verification command patterns are caught by tooling where reliable."
  - "TODO-review guidance explicitly covers same-label/different-domain evidence claims."
