id: todo-skill-evidence-durability-conventions
title: "Add evidence-durability conventions to the TODO schema and review skill"
worktree: main
priority: Medium
status: Not Started
category: Tooling and Workflow

description: |
  Two related blind-spots flagged that TODOs whose safety predicate rests
  on external/transient evidence (upstream behavior, harness output,
  dependency-resolved version) have no schema-level mechanism to record
  or verify the evidence durability:

  - `2026-05-04-074634` -- the /todo review rubric scores write-time
    quality, not implement-time freshness. A TODO that sits in planning/
    for weeks may have evidence that has silently rotted.
  - `2026-05-04-083819` -- W0 verification-only commits cite evidence in
    free-text commit messages; a reviewer landing the PR days later
    cannot replay it.

  This TODO adds two thin conventions:

  1. Optional `freshness_check` block in the TODO schema, OR a strong-
     convention "w0: re-validate evidence" first work unit for upstream-
     dependent items.
  2. A `_project/verification-logs/<todo-id>/<work-id>.log` committed-
     artifact convention for verification-only commits.

closes_blind_spots:
  - 2026-05-04-074634-todo-implement-time-freshness-drift
  - 2026-05-04-083819-w0-evidence-replay-drift

work:
  - id: w1
    summary: "Decide schema vs convention path; document decision"
    status: pending
    notes: |
      Choose between (a) adding `freshness_check:` as a new optional
      field in `_project/TODO_ENTRY_TEMPLATE.yaml` + `validate_todo.py`,
      or (b) elevating "w0: re-validate research evidence" to a strong
      naming convention enforced by the /todo review rubric only.
      Decision criterion: is the value worth the schema/validator churn,
      or is review-time enforcement enough? Record the chosen path and
      rationale in this TODO before w2 starts.

  - id: w2
    summary: "Implement chosen freshness-check mechanism"
    needs: [w1]
    status: pending
    notes: |
      If schema path: add `freshness_check:` field, extend
      `validate_todo.py`, document in TODO_ENTRY_TEMPLATE.yaml.
      If convention path: extend `.claude/skills/todo/SKILL.md` review
      rubric with a "freshness" axis that fires on TODOs whose
      `description` cites upstream evidence; require a `w0:` work unit
      with a runnable `verification` command.

  - id: w3
    summary: "Add `_project/verification-logs/` convention for verification-only commits"
    needs: [w1]
    status: pending
    notes: |
      Create `_project/verification-logs/README.md` documenting:
      "commit captured stdout under
      `_project/verification-logs/<todo-id>/<work-id>.log` for
      verification-only work units." Add a `.gitkeep` so the path
      exists even when empty. Update `.claude/skills/code/SKILL.md`
      (debug/iterate notes) to point at the convention for evidence-
      only commits.

  - id: w4
    summary: "Apply the convention to one in-flight TODO as a reference example"
    needs: [w2, w3]
    status: pending
    notes: |
      Pick one current TODO whose work units include re-running an
      external harness (e.g. a `track-upstream-platform-workarounds`
      child item) and apply the new convention as a worked example.
      Reference the example from the TODO_ENTRY_TEMPLATE comment so the
      next author finds it immediately.

verification:
  - description: "TODO_ENTRY_TEMPLATE documents the chosen mechanism"
    command: "grep -E 'freshness_check|verification-logs' _project/TODO_ENTRY_TEMPLATE.yaml"
    expected_output: "matches >= 1"
  - description: "validate_todo accepts an example TODO using the new field/convention"
    command: "uv run --project _project/scripts -- python _project/scripts/validate_todo.py --all"
    expected_output: "exit 0"
  - description: "verification-logs directory and README exist"
    command: "test -f _project/verification-logs/README.md"
    expected_output: "exit 0"

must_preserve:
  - "Existing TODO files validate against the unchanged schema (the new field is optional)."
  - "/todo review rubric existing axes (clarity / completeness / actionability / freshness / guardrails / work-breakdown) are unchanged in name and weight."

anti_patterns:
  - "DO NOT make the freshness_check field required -- backwards-incompatible schema changes break every existing TODO file."
  - "DO NOT capture verification logs that contain secrets or local-machine paths -- the convention is for upstream-evidence transcripts (e.g. `pip show sqlglot`, harness stdout), not for runtime traces."

scope_limit:
  only_modify:
    - "_project/TODO_ENTRY_TEMPLATE.yaml"
    - "_project/scripts/validate_todo.py"
    - "_project/verification-logs/"
    - ".claude/skills/todo/SKILL.md"
    - ".claude/skills/code/SKILL.md"

metadata:
  tags:
    - todo-system
    - skills
    - blind-spot-followup
  estimated_effort: "Medium"
  created_date: "2026-05-05"

impact:
  technical_debt: |
    TODOs gated on upstream-evidence assertions (workaround retirements,
    deprecation cleanups, dependency-floor bumps) currently rely on free-
    text commit messages and reviewer memory. Adding a thin persistence
    convention makes evidence replayable post-hoc and makes drift (e.g.
    a new sqlglot major releases between TODO write and TODO implement)
    catchable at PR review time, not at incident time.
