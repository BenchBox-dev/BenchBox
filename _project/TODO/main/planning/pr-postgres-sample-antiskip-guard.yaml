id: pr-postgres-sample-antiskip-guard
title: "Back-port nightly's anti-skip guard to pr.yml's non-blocking postgres-integration sample"
worktree: main
priority: Medium
status: Not Started
category: Testing and Quality Assurance

description: |
  `nightly.yml`'s live-postgres job has two anti-skip guards
  (nightly.yml:205-236): one that fails outright if the service container
  never becomes reachable (so `skip_unless_docker_service` cannot silently
  green a required gate), and one that greps the pytest summary line for
  `N passed` so an all-skipped run cannot pass either. Neither guard exists
  in `pr.yml`'s `postgres-integration` job. That job is already
  `continue-on-error: true` (pr.yml:552) and explicitly documented as a
  non-blocking second-engine equivalence SAMPLE (pr.yml:550-552,
  pr.yml:587-591), so this item does not propose making it blocking. The
  problem is narrower: today, "service never came up, 0 tests ran" and
  "service came up, tests ran and passed" both render as a green
  `continue-on-error` check with no visible distinction, so a silently
  all-skipped sample looks identical to a real pass in the PR checks UI.

work:
  - id: w1
    summary: "Add service-reachability wait step to pr.yml's postgres-integration job"
    status: pending
    notes: |
      Port the `pg_isready`-polling step from nightly.yml:205-220 into
      pr.yml's `postgres-integration` job (pr.yml:544-602), before the
      "Run PostgreSQL live integration tests" step. Because the job stays
      `continue-on-error: true`, a failure here surfaces as a distinctly
      red (not green) non-blocking check in the PR checks list rather than
      a silent skip disguised as green.

  - id: w2
    summary: "Add all-skipped guard to both pytest invocations in the job"
    needs: [w1]
    status: pending
    notes: |
      Port the `tee` + `grep -Eq '[0-9]+ passed'` pattern from
      nightly.yml:222-236 to both pytest steps in pr.yml's
      `postgres-integration` job: the "Run PostgreSQL live integration
      tests" step (pr.yml:582-585) and the "Run TPC-Havoc PostgreSQL
      variant-equivalence sample" step (pr.yml:592-602). Keep
      `continue-on-error: true` on the job - the guard changes what
      "the sample didn't actually run" looks like (red instead of green),
      it does not change whether the job blocks the merge.

deps:
  needs: []

must_preserve:
  - "postgres-integration stays continue-on-error: true - this item does not promote it to a blocking gate (that's a separate, larger decision given the job's own comment calling it a non-blocking sample, pr.yml:550-552)."
  - "The DuckDB SQL correctness-gate job remains the sole hard blocker for SQL correctness, per pr.yml:550-552, 610-611, 650-651 comments."
  - "nightly.yml's own anti-skip guard (nightly.yml:205-236) is left untouched; this is a back-port, not a refactor of the shared logic into one place."

approach: |
  Small, mechanical port: copy nightly.yml:205-220 (reachability wait) and
  nightly.yml:222-236 (all-skipped grep guard) into pr.yml's
  postgres-integration job, adjusting only for the two pytest invocations
  that exist there (live integration tests, then the TPC-Havoc equivalence
  sample) versus nightly's single invocation. No shared script extraction
  needed for this scope - keep the two workflow files independently
  readable.

anti_patterns:
  - "DO NOT flip continue-on-error to false as part of this change - because that's a separate blocking-promotion decision with its own stability bar (see graduate-browser-smoke-to-blocking-gates.yaml for the pattern such a promotion should follow) - keep this item scoped to visibility only."
  - "DO NOT extract the guard into a shared composite action or script in this pass - because the two call sites differ (one vs two pytest invocations) and a premature abstraction risks under-covering the second - inline copies are fine at this scale."
  - "DO NOT add the guard only to the first pytest step and skip the TPC-Havoc equivalence step - because an all-skipped equivalence sample is exactly the kind of silent gap this item exists to close - guard both invocations."

verification:
  - description: "Job fails visibly (while staying non-blocking) when postgres never becomes reachable"
    command: "Temporarily misconfigure the postgres service port in a scratch branch's pr.yml, open a PR, observe the postgres-integration check"
    expected_output: "postgres-integration shows failed/red in PR checks (continue-on-error keeps ci-required-result green)"
  - description: "Job fails visibly when the live test file is renamed so the test collects zero items"
    command: "git mv tests/integration/platforms/test_postgresql_live.py tests/integration/platforms/test_postgresql_live.py.bak on a scratch branch, open a PR"
    expected_output: "postgres-integration fails on the all-skipped grep guard, not silently green"
  - description: "Normal PR still passes the sample with a real green"
    command: "gh pr checks <any-normal-develop-pr>"
    expected_output: "postgres-integration shows success"

scope_limit:
  only_modify:
    - ".github/workflows/pr.yml"
  do_not_modify:
    - ".github/workflows/nightly.yml"
    - "Makefile"
    - "tests/integration/platforms/test_postgresql_live.py"
    - "tests/integration/platforms/test_tpchavoc_postgres_equivalence.py"

prior_art:
  - "nightly.yml:205-220 reachability-wait step — reuse verbatim"
  - "nightly.yml:222-236 tee + grep all-skipped guard — reuse pattern, apply to two call sites instead of one"

metadata:
  owners:
    - joeharris76
  tags:
    - ci
    - postgres
    - develop-pr-gate
    - anti-skip
  estimated_effort: Small
  created_date: "2026-07-03"

impact:
  business_value: |
    Makes a silently-all-skipped postgres equivalence sample visibly
    distinct from a real pass in the PR checks UI, without changing the
    job's non-blocking status - closes a false-confidence gap cheaply.
  technical_debt: |
    Removes a nightly/PR-time inconsistency where the same class of bug
    (service never came up) is guarded in one workflow and not the other.

success_metrics:
  - "An all-skipped or service-down postgres-integration run on a PR shows red in the checks list, not green."
  - "ci-required-result's pass/fail semantics are unchanged (postgres-integration remains outside the required set)."
