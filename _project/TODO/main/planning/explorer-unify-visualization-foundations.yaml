must_preserve:
  - "QueryHeatmap visual output — colorForCell/lightnessForCell return values must not change"
  - "Compare URL format `?ids=id1,id2,...` — short-id resolution behavior unchanged"
  - "ComparabilityBanner UI and `buildComparabilityWarnings` API — only consumers change, not the warning generation"
  - "Existing 36 Vitest tests + Python fast suite — all must still pass"
  - "QueryHeatmap row selection / Compare URL building — touched only to read from chartTheme, not behavior change"

approach: |
  Foundation-first, then refactor, then test:
    1. chartTheme.ts (w1) — pure constants, zero risk
    2. Speedup unification (w2) — single API replaces three call sites;
       parity items will pick this up automatically when they land
    3. Responsive SVG (w3) — independent component-level refactor
    4. Error UX (w4) — independent of the chart work
    5. Primary metric (w5) — depends on the speedup unification because
       it changes what "primary" means in the same code path
    6. Memoization (w6) — final polish, only after refactors settle
    7. Tests (w7) — cover all of the above with regression cases

  Coordinate with `explorer-establish-cli-explorer-parity-tests` and
  `explorer-emit-comparison-artifact-from-pipeline`: this item creates
  the central `chartTheme.ts` + speedup helpers. The parity item will
  add fixture coverage for those helpers; the comparison-artifact item
  will deliver pre-computed values that flow through the same helpers.

anti_patterns:
  - "DO NOT keep the `slowestPrimary / primary` definition in summary cards while changing the breakdown table — because that recreates the dual-definition bug elsewhere — fix all three call sites in one commit"
  - "DO NOT leave inline color constants in any chart component — because that defeats the centralization purpose — every color comes from chartTheme.ts, no exceptions"
  - "DO NOT solve responsive SVG by adding CSS `width: 100%` only — because preserveAspectRatio=none stretches the geometry — must use measured width with a real ResizeObserver"
  - "DO NOT fall back to `phaseFilter` (=power) in BenchmarkIndex.tsx:81 when phases is empty — because that re-introduces the original bug — guard the useEffect so no request fires until phases resolves"
  - "DO NOT couple primary-metric awareness to a hardcoded benchmark whitelist — because RANKING_METRIC_BY_FAMILY already exists in Python — surface it through the artifact contract OR mirror it once in lib/ranking.ts with a comment pointing to the canonical Python source"
  - "DO NOT add `useMemo` everywhere as a stylistic preference — because excessive memoization adds its own overhead — only memo where profiler shows the work is hot"

