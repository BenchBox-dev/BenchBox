id: explorer-unify-visualization-foundations
title: "Unify visualization foundations: dual-speedup bug, theme constants, error UX, responsive SVG"
worktree: main
priority: High
status: Not Started
category: Core Functionality

description: |
  The 2026-04-15 review identified a cluster of foundational issues in
  the results explorer that share the same root cause: visualization
  primitives are defined inline per component instead of shared. These
  bugs produce inconsistent UX today and block clean follow-on work
  (chart-coverage expansion, parity tests, comparison artifacts).

  Five distinct problems, fixable as one coordinated change:

  **Issue 1 — Dual definition of "speedup" on the Compare page.**
  Summary cards (Compare.tsx:225) compute `slowest_primary / primary`
  (a "vs slowest" spread). Per-query breakdown table (Compare.tsx:392)
  computes `slowest / fastest` (within-query spread). Speedup chart
  (NormalizedSpeedupChart.tsx:57) computes `baseline / this`
  (per-baseline ratio). All three render with the same "x" label.
  Users see contradictory numbers on the same page.

  **Issue 2 — Color/style constants duplicated across 4 files.**
  `COMPARE_COLORS` / `CHART_COLORS` (`["#3b82f6","#10b981","#f59e0b","#ef4444"]`)
  defined in Compare.tsx:17, NormalizedSpeedupChart.tsx:22,
  DivergingBarChart.tsx:11, QueryTimingChart.tsx:18. Plus magic numbers
  `LOG2_MIN/MAX`, `MAX_DELTA_PCT=300`, `GRID_STOPS=[0.25,0.5,1,2,4]`
  scattered without a single source.

  **Issue 3 — "Failed to Decode Data" error is opaque and misleading.**
  When a benchmark artifact is missing, Vite serves the SPA HTML
  fallback (HTTP 200), `DecompressionStream` then throws
  "Failed to Decode Data" (manifest.ts:81-87). Users see this on the
  TPC-H Results page (the user's screenshot of 2026-04-15) when the
  page loads before the manifest filter has resolved the phase.
  Three sub-problems: (a) BenchmarkIndex.tsx:84 useEffect fires before
  `phases` resolves; (b) error message gives no clue what happened;
  (c) Vite SPA fallback is detected as "decode error" rather than 404.

  **Issue 4 — SVG charts have hardcoded viewBox dimensions.**
  NormalizedSpeedupChart.tsx:69 (`viewBox="0 0 600 …"`),
  DivergingBarChart.tsx:91 (`viewBox="0 0 600 …"`),
  QueryTimingChart.tsx:58 (`viewBox="0 0 800 …"`),
  GroupedQueryChart (`viewBox="0 0 900 …"`). All use
  `preserveAspectRatio="none"` so on wide screens text squishes and
  bar widths look wrong. This is a primary visual contributor to the
  user's "sub-par visualizations" complaint.

  **Issue 5 — Compare uses `geomean_ms` ignoring per-benchmark primary metric.**
  Compare.tsx:151-156 hardcodes `getPrimary(r) = r.geomean_ms`. For
  benchmarks where `power_score` is the primary metric (defined in
  RANKING_METRIC_BY_FAMILY), the speedup math runs on the wrong axis.
  Already exposed via BenchmarkSummary.ranking.primary_metric for the
  heatmap (QueryHeatmap.tsx:102-107) — Compare needs to consume the
  same registry.

work:
  - id: w1
    summary: "Create `results-explorer/src/lib/chartTheme.ts` consolidating colors, scales, and chart constants"
    status: pending
    notes: |
      Single export point for:
        export const PALETTE = ["#3b82f6", "#10b981", "#f59e0b", "#ef4444"];
        export const HEAT_MIN_RATIO = 1;
        export const HEAT_MAX_RATIO = 10;
        export const SPEEDUP_LOG2_MIN = Math.log2(0.2);
        export const SPEEDUP_LOG2_MAX = Math.log2(5);
        export const SPEEDUP_GRID_STOPS = [0.25, 0.5, 1, 2, 4];
        export const DIVERGING_MAX_PCT = 300;
        export const FASTER_FILL = "#22c55e";
        export const SLOWER_FILL = "#ef4444";
        export function paletteColor(index: number): string { ... }

      Replace duplicates in Compare.tsx:17, NormalizedSpeedupChart.tsx:22,
      DivergingBarChart.tsx:11, QueryTimingChart.tsx:18 with imports.

  - id: w2
    summary: "Unify the speedup definition: pick `slowest / this` for cross-result, `baseline / this` for per-baseline; rename so the contract is visible in the API"
    status: pending
    notes: |
      Two distinct concepts deserve two distinct names — but only TWO,
      not THREE:

        - **`vsSlowestRatio(thisMs, slowestMs)`** — used by summary cards
          and breakdown table. Always `>= 1`. Labelled "vs slowest" in UI.
          Replaces both the dual definitions in Compare.tsx:225 and :392.

        - **`vsBaselineRatio(thisMs, baselineMs)`** — used by
          NormalizedSpeedupChart only. Can be < 1 or > 1. Labelled
          "vs <baseline name>" in UI.

      UI labels MUST always include the comparison target so users
      cannot read "1.5x" without knowing what it is relative to.

      Both functions live in `chartMath.ts` (created by
      `explorer-establish-cli-explorer-parity-tests` w1) when it lands
      first; if this item lands first, create them here and let the
      parity item adopt them.

  - id: w3
    summary: "Refactor SVG charts to use responsive viewBox + padding strategy instead of fixed `0 0 600` boxes"
    needs: [w1]
    status: pending
    notes: |
      Pattern: switch from `viewBox="0 0 600 H"` + `preserveAspectRatio="none"`
      to a measured layout:
        - Use `useResizeObserver` (or a small inline ResizeObserver hook
          in `lib/useElementSize.ts`) to read the parent container width
        - Set `viewBox="0 0 ${width} ${H}"` with the measured width
        - Drop `preserveAspectRatio="none"` so text and bar widths scale
          consistently
        - Honor a min-width to prevent crushing on mobile (use horizontal
          scroll if below)

      Apply to: NormalizedSpeedupChart.tsx, DivergingBarChart.tsx,
      QueryTimingChart.tsx (both QueryTimingChart and GroupedQueryChart).
      QueryHeatmap is HTML table-based and not affected.

      Add visual regression coverage: a Vitest test that mounts each
      chart at three widths (400, 800, 1600) and asserts the SVG
      `viewBox` width attribute matches the container width. Snapshot
      the resulting SVG attributes (not pixel comparison).

  - id: w4
    summary: "Improve missing-artifact UX in `manifest.ts` and `BenchmarkIndex.tsx`"
    status: pending
    notes: |
      Three changes:

      (a) `manifest.ts` `getBenchmarkSummary`: detect HTML fallback
          before attempting to decompress:
            const ct = res.headers.get("content-type") || "";
            if (ct.includes("text/html")) {
              throw new Error(
                `No benchmark data available for ${benchmark} SF ${sf} phase ${phase}. ` +
                `Try a different phase or scale factor.`
              );
            }

      (b) `BenchmarkIndex.tsx:84` useEffect — guard the request:
            if (!manifest || phases.length === 0) return;
            // also guard against effectivePhase being a stale value
            // when phases just resolved

      (c) `BenchmarkIndex.tsx:294-296` — when summaryError matches the
          "No benchmark data available" pattern, surface as an
          informational empty state ("No data for this combination —
          try another phase") instead of an amber error banner. Other
          errors (network, gzip-of-truncated-artifact) keep the amber
          banner with the underlying error text.

  - id: w5
    summary: "Make Compare.tsx primary-metric-aware via RANKING_METRIC_BY_FAMILY"
    needs: [w2]
    status: pending
    notes: |
      Compare.tsx:151-156 currently hardcodes `geomean_ms`. Replace:
        function getPrimary(r): number | null {
          const metric = primaryMetricFor(r.benchmark);
          return metric === "power_score" ? r.power_score : r.display_geomean_ms;
        }

      Where `primaryMetricFor` reads from the same registry the
      QueryHeatmap consumes (BenchmarkSummary.ranking.primary_metric).
      For Compare we need a manifest-scope lookup since DetailResult
      does not carry the ranking config — add a small frontend mirror
      of RANKING_METRIC_BY_FAMILY in `lib/ranking.ts` OR have the
      pipeline emit it on each DetailResult/ComparisonArtifact (preferred
      if the comparison artifact item lands first).

      Update summary card label dynamically: "Power Score" or "Geomean
      query time" depending on the primary metric. Keep the secondary
      metric visible as a deemphasized row.

  - id: w6
    summary: "Centralize chart memoization helpers — `useMemo` for `colMins` in QueryHeatmap and similar hot paths"
    needs: [w1]
    status: pending
    notes: |
      Touch-up pass after the foundational changes:
        - QueryHeatmap.tsx:93-99 — wrap `colMins` in `useMemo` keyed on
          `summary` (the `for` loop runs every render today; it spreads
          across `query_ids.length × platforms.length`)
        - DivergingBarChart.tsx:73-79 (`sorted`, `medianDelta`) — also
          `useMemo` if the chart re-renders on baseline change

      Each memoization must be measured with a quick perf check (browser
      profiler on a 100-platform × 99-query case) and only kept if it
      changes render time meaningfully — do not pile on memoization for
      its own sake.

  - id: w7
    summary: "Add Vitest coverage for the foundational changes"
    needs: [w2, w3, w4, w5]
    status: pending
    notes: |
      New tests:
        - `chartTheme.test.ts` — palette has 4 distinct colors,
          paletteColor(i) wraps correctly, no exports collide
        - `Compare.test.tsx` — summary card and breakdown table
          numbers agree (regression test for the dual-speedup bug)
        - `Compare.test.tsx` — for a benchmark where primary_metric is
          "power_score", the speedup math uses power_score not geomean
        - `BenchmarkIndex.test.tsx` — when manifest has a benchmark with
          test_type only "standard", page loads "standard" phase artifact
          successfully (regression for the user-reported "Failed to
          Decode Data" symptom)
        - `BenchmarkIndex.test.tsx` — when getBenchmarkSummary throws the
          "No benchmark data available" message, the page shows the
          informational empty state (not amber error banner)
        - Visual smoke: each refactored chart renders at 3 viewport
          widths without throwing

deferred:
  - summary: "Replace SVG with Canvas/WebGL for very large heatmaps (>500 platforms)"
    reason: "Premature — current SVG handles realistic corpus sizes fine; revisit if pages get sluggish at scale"
  - summary: "Server-side rendering of charts for SEO"
    reason: "Tracked separately in vite.config.ts NOTE about pre-rendering — out of scope for this foundational pass"
  - summary: "Off-scale indicator for diverging-bar values clamped at 300%"
    reason: "Nice-to-have polish; ship after the foundational architecture is unified — chart coverage gaps are higher priority"

