    command: "grep -rn '\\[\"#3b82f6\"' results-explorer/src/ --include='*.tsx' --include='*.ts' | grep -v chartTheme.ts"
    expected_output: "zero matches outside chartTheme.ts"
  - description: "No three-way speedup divergence on Compare page"
    command: "grep -nE 'slowestPrimary / primary|slowest / fastest|baselineMs / t' results-explorer/src/pages/Compare.tsx"
    expected_output: "all three replaced with vsSlowestRatio / vsBaselineRatio helper calls"
  - description: "manifest.ts detects HTML fallback"
    command: "grep -n 'text/html' results-explorer/src/manifest.ts"
    expected_output: "explicit content-type guard added"
  - description: "BenchmarkIndex guards useEffect against empty phases"
    command: "grep -n 'phases.length === 0' results-explorer/src/pages/BenchmarkIndex.tsx"
    expected_output: "guard added inside the summary-loading useEffect"
  - description: "All SVG charts use measured width"
    command: "grep -nE 'viewBox=\"0 0 (600|800|900)' results-explorer/src/components/"
    expected_output: "zero matches — all replaced with template-literal viewBox"
  - description: "Compare honors per-benchmark primary metric"
    command: "grep -nE 'r\\.geomean_ms[^_]' results-explorer/src/pages/Compare.tsx"
    expected_output: "no remaining hardcoded geomean_ms in getPrimary; uses primaryMetricFor"
  - description: "All Vitest tests pass"
    command: "cd results-explorer && npm test"
    expected_output: "all tests pass; new tests cover speedup-unification, primary-metric-awareness, responsive viewBox, and error UX"
  - description: "TypeScript still compiles"
    command: "cd results-explorer && npm run typecheck"
    expected_output: "0 errors"

