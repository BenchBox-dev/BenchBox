id: joinorder-data-fetch-from-dataverse-remediation
title: "JoinOrder canonical data redistribution remediation: stop BenchBox re-hosting or obtain explicit permission"
worktree: main
priority: Critical
status: Not Started
category: Core Functionality

description: |
  Follow-up to `_project/decisions/joinorder-canonical-data-licensing-2026-05-12.md`.
  The ADR concluded that BenchBox should not treat its current GitHub Release
  re-host of `joinorder-imdb-2013-v1.tar.zst` as clearly permitted. Harvard
  Dataverse declares the `imdb_pg11` deposit for DOI `10.7910/DVN/2QYZBT` as
  `CC0 1.0`, but IMDb's current dataset terms and the JOB paper describe the
  underlying IMDb data as non-commercial and restrict republishing /
  repurposing.

  This is release-blocking for canonical `joinorder`: before release, either
  remove BenchBox-hosted redistribution from the default data path, obtain
  written permission covering BenchBox's redistribution and commercial
  benchmarking context, or switch to a bring-your-own-data flow.

work:
  - id: w1
    summary: "Choose the remediation path and record the release decision"
    status: pending
    notes: |
      Recommended default: fetch Dataverse file id 3590041 (`imdb_pg11`)
      directly from Harvard Dataverse and convert/verify locally, so BenchBox no
      longer redistributes an IMDb-derived data archive. Alternative acceptable
      exits are explicit written permission or a documented BYO-data path.

  - id: w2
    summary: "Implement the selected data path without changing canonical query semantics"
    needs: [w1]
    status: pending
    notes: |
      For the Dataverse path, update the joinorder data-fetch/build pipeline so
      first run downloads `imdb_pg11` from Dataverse, verifies the Dataverse MD5
      and pinned pg_dump SHA256, restores/converts to Parquet locally, then
      verifies the existing table row counts and hashes. Cache under BenchBox's
      normal data directory. Do not change the 113 canonical queries or the
      `--scale 1` public contract.

  - id: w3
    summary: "Surface the governing terms and user-facing first-run posture"
    needs: [w1]
    status: pending
    notes: |
      Update DATA-LICENSE.md, docs, and any first-run data-fetch notice so users
      see the Dataverse DOI, IMDb attribution, IMDb non-commercial restriction,
      and the fact that BenchBox is not redistributing the converted data.

  - id: w4
    summary: "Verify integrity, docs, and regression coverage"
    needs: [w2, w3]
    status: pending
    notes: |
      Run the joinorder data-fetch/unit coverage, docs validation, and the
      manifest/provenance checks needed to prove that the replacement path still
      yields the canonical 21-table / 113-query JOB dataset.

deferred:
  - summary: "Seek formal legal review of IMDb / Dataverse terms"
    reason: "This TODO removes the engineering redistribution risk; formal legal review remains a project-owner decision."

prior_art:
  - "_project/decisions/joinorder-canonical-data-licensing-2026-05-12.md -- release-risk decision that creates this remediation"
  - "benchbox/core/joinorder/data_manifest.toml -- current BenchBox-hosted archive URL and pinned source/archive hashes"
  - "_project/scripts/build_joinorder_data.py -- existing restore/convert/verify pipeline to reuse instead of creating a parallel path"
  - "benchbox/core/data_fetch/ -- existing manifest download/cache/verification helper path"

must_preserve:
  - "Public `joinorder` remains canonical IMDb 2013 / JOB-only at `--scale 1`"
  - "The 113 query texts and reference cardinality files remain unchanged unless a separate data mismatch is proven"
  - "The IMDb attribution string remains visible in DATA-LICENSE.md and user-facing docs"

approach: |
  Prefer removing BenchBox redistribution from the runtime data path over adding
  a terms checkbox around the current GitHub Release asset. Fetching directly
  from Dataverse preserves canonical source provenance and reduces release risk,
  even if first-run setup becomes heavier.

anti_patterns:
  - "DO NOT keep the current BenchBox-hosted archive as the unqualified default without written permission"
  - "DO NOT silently weaken the canonical data contract to avoid a heavy first run"
  - "DO NOT modify the canonical query corpus as part of licensing remediation"

verification:
  - description: "Release decision and remediation path are recorded"
    command: "grep -i 'Dataverse\\|redistribut\\|permission\\|BYO' _project/decisions/joinorder-canonical-data-licensing-2026-05-12.md _project/TODO/main/planning/joinorder-data-fetch-from-dataverse-remediation.yaml"
    expected_output: "ADR and TODO both state the selected remediation path and alternatives"
  - description: "Runtime data path no longer depends on BenchBox-hosted redistribution unless explicit permission was obtained"
    command: "grep -R \"releases/download/data%2Fjoinorder\" -n benchbox/core/joinorder benchbox/core/data_fetch || echo CLEAN"
    expected_output: "CLEAN, or a documented permission-backed exception"
  - description: "JoinOrder canonical tests and docs still pass"
    command: "uv run -- python -m pytest tests/unit/core/joinorder tests/unit/core/test_joinorder_benchmark.py -q && make docs-validate"
    expected_output: "passes"

scope_limit:
  only_modify:
    - "benchbox/core/joinorder/"
    - "benchbox/core/data_fetch/"
    - "_project/scripts/build_joinorder_data.py"
    - "_project/joinorder/"
    - "_project/decisions/"
    - "docs/benchmarks/join-order.md"
    - "tests/unit/core/joinorder/"
    - "tests/unit/core/test_joinorder_benchmark.py"
  do_not_modify:
    - "benchbox/core/joinorder/queries.py"
    - "_project/joinorder/reference_cardinalities.json"
    - "_project/joinorder/tiny_reference_cardinalities.json"

metadata:
  owners:
    - joeharris76
  tags:
    - joinorder
    - issue-289
    - licensing
    - data-fetch
    - release-blocker
  estimated_effort: Large
  created_date: "2026-05-12"
  last_updated: "2026-05-12T00:00:00"

impact:
  business_value: |
    Removes or explicitly clears the release risk identified by the canonical
    data licensing ADR before BenchBox ships a public canonical JOB data path.
  user_impact: |
    Users receive a data path whose licensing posture is explicit and whose
    provenance still traces to the canonical Dataverse/JOB source.
  technical_debt: |
    Replaces an implicit GitHub Release re-hosting assumption with a recorded,
    auditable data acquisition design.

success_metrics:
  - "BenchBox no longer re-hosts the IMDb-derived canonical JoinOrder archive by default, or written permission for that re-host is recorded"
  - "DATA-LICENSE.md and docs clearly state the Dataverse DOI, IMDb attribution, and any use restrictions"
  - "Canonical joinorder data verification still proves 21 tables, 74,190,187 rows, and the 113-query reference workload"

open_questions:
  - question: "Should BenchBox fetch and convert Dataverse `imdb_pg11` on first run, or require users to provide it explicitly?"
    gating: true
    affects: ["w1", "w2", "w3"]
    default: "Fetch directly from Dataverse and convert locally"
