id: joinorder-data-fetch-from-dataverse-remediation
title: "JoinOrder canonical data distribution hardening: permission or optional Dataverse/BYO path"
worktree: main
priority: High
status: Not Started
category: Core Functionality

description: |
  Follow-up to `_project/decisions/joinorder-canonical-data-licensing-2026-05-12.md`.
  The ADR concluded that BenchBox should not describe its GitHub Release re-host
  of `joinorder-imdb-2013-v1.tar.zst` as clearly permitted for broad commercial
  redistribution. Harvard Dataverse declares the `imdb_pg11` deposit for DOI
  `10.7910/DVN/2QYZBT` as `CC0 1.0`, but IMDb's current dataset terms and the JOB
  paper describe the underlying IMDb data as non-commercial and restrict
  republishing / repurposing.

  The project-owner decision is to accept the residual redistribution risk for
  this 2013 academic benchmark dataset and keep the verified BenchBox-hosted
  Parquet archive as the default fast path. This TODO is therefore not
  release-blocking for canonical `joinorder`; it tracks optional hardening such
  as written permission, an explicit direct-Dataverse conversion path, or a
  documented BYO-data path.

work:
  - id: w1
    summary: "Choose whether to pursue any hardening path"
    status: pending
    notes: |
      Default runtime remains the BenchBox-hosted Parquet archive. Acceptable
      hardening exits are: seek written permission, add an explicit advanced
      direct-Dataverse restore/convert path, document a BYO-data path, or record
      that the accepted-risk posture remains sufficient for now.

  - id: w2
    summary: "Implement the selected optional path without changing canonical query semantics"
    needs: [w1]
    status: pending
    notes: |
      If an advanced Dataverse path is selected, update the joinorder
      data-fetch/build pipeline so an explicit command downloads `imdb_pg11`
      from Dataverse, verifies the Dataverse MD5 and pinned pg_dump SHA256,
      restores/converts to Parquet locally, then verifies the existing table row
      counts and hashes. Cache under BenchBox's normal data directory. Do not
      make this heavy restore/convert path the silent first-run default without a
      separate product decision. Do not change the 113 canonical queries or the
      `--scale 1` public contract.

  - id: w3
    summary: "Surface the governing terms and selected posture"
    needs: [w1]
    status: pending
    notes: |
      Update DATA-LICENSE.md, docs, and any first-run data-fetch notice so users
      see the Dataverse DOI, IMDb attribution, IMDb non-commercial restriction,
      and the fact that BenchBox keeps the verified hosted archive as an
      accepted-risk fast path unless a later hardening decision changes it.

  - id: w4
    summary: "Verify integrity, docs, and regression coverage"
    needs: [w2, w3]
    status: pending
    notes: |
      Run the joinorder data-fetch/unit coverage, docs validation, and the
      manifest/provenance checks needed to prove that any selected optional path
      still yields the canonical 21-table / 113-query JOB dataset.

deferred:
  - summary: "Seek formal legal review of IMDb / Dataverse terms"
    reason: "This TODO tracks engineering/product hardening; formal legal review remains a project-owner decision."

prior_art:
  - "_project/decisions/joinorder-canonical-data-licensing-2026-05-12.md -- accepted-risk decision that creates this optional hardening follow-up"
  - "benchbox/core/joinorder/data_manifest.toml -- current BenchBox-hosted archive URL and pinned source/archive hashes"
  - "_project/scripts/build_joinorder_data.py -- existing restore/convert/verify pipeline to reuse instead of creating a parallel path"
  - "benchbox/core/data_fetch/ -- existing manifest download/cache/verification helper path"

must_preserve:
  - "Public `joinorder` remains canonical IMDb 2013 / JOB-only at `--scale 1`"
  - "The 113 query texts and reference cardinality files remain unchanged unless a separate data mismatch is proven"
  - "The IMDb attribution string remains visible in DATA-LICENSE.md and user-facing docs"

approach: |
  Preserve the current BenchBox-hosted Parquet default unless written permission
  or a separate product decision changes the data-delivery model. Treat direct
  Dataverse conversion as an explicit advanced/maintainer path because it
  preserves canonical source provenance but imposes a poor first-run experience.

anti_patterns:
  - "DO NOT make direct Dataverse restore/convert the silent default first-run user experience without separate product approval"
  - "DO NOT remove the current fast Parquet path in this TODO unless the replacement UX is explicitly accepted"
  - "DO NOT silently weaken the canonical data contract to avoid a heavy first run"
  - "DO NOT modify the canonical query corpus as part of licensing hardening"

verification:
  - description: "Accepted-risk decision and optional hardening paths are recorded"
    command: "grep -i 'Dataverse\\|redistribut\\|permission\\|BYO' _project/decisions/joinorder-canonical-data-licensing-2026-05-12.md _project/TODO/main/planning/joinorder-data-fetch-from-dataverse-remediation.yaml"
    expected_output: "ADR and TODO both state that the current fast path is accepted risk and list optional hardening alternatives"
  - description: "Runtime fast path remains intentional unless a later PR changes it"
    command: "grep -R \"releases/download/data%2Fjoinorder\" -n benchbox/core/joinorder benchbox/core/data_fetch || echo CLEAN"
    expected_output: "Current manifest URL is still present, or a later approved replacement documents the UX tradeoff"
  - description: "JoinOrder canonical tests and docs still pass"
    command: "uv run -- python -m pytest tests/unit/core/joinorder tests/unit/core/test_joinorder_benchmark.py -q && make docs-validate"
    expected_output: "passes"

scope_limit:
  only_modify:
    - "benchbox/core/joinorder/"
    - "benchbox/core/data_fetch/"
    - "_project/scripts/build_joinorder_data.py"
    - "_project/joinorder/"
    - "_project/decisions/"
    - "docs/benchmarks/join-order.md"
    - "tests/unit/core/joinorder/"
    - "tests/unit/core/test_joinorder_benchmark.py"
  do_not_modify:
    - "benchbox/core/joinorder/queries.py"
    - "_project/joinorder/reference_cardinalities.json"
    - "_project/joinorder/tiny_reference_cardinalities.json"

metadata:
  owners:
    - joeharris76
  tags:
    - joinorder
    - issue-289
    - licensing
    - data-fetch
    - risk-hardening
  estimated_effort: Large
  created_date: "2026-05-12"
  last_updated: "2026-05-12T19:20:00"

impact:
  business_value: |
    Tracks optional ways to reduce the residual redistribution risk identified
    by the canonical data licensing ADR without blocking the public canonical JOB
    data path or degrading the default user experience.
  user_impact: |
    Users keep the fast verified Parquet download by default. Environments with
    stricter redistribution requirements can later receive a documented
    permission-backed, direct-Dataverse, or BYO alternative.
  technical_debt: |
    Keeps the accepted-risk GitHub Release re-hosting assumption explicit and
    auditable while leaving room for a stricter acquisition design.

success_metrics:
  - "BenchBox's current fast Parquet default is documented as an accepted-risk project decision, or written permission for that re-host is recorded"
  - "DATA-LICENSE.md and docs clearly state the Dataverse DOI, IMDb attribution, and any use restrictions"
  - "Canonical joinorder data verification still proves 21 tables, 74,190,187 rows, and the 113-query reference workload"

open_questions:
  - question: "Should BenchBox pursue written permission, add an optional direct-Dataverse/BYO path, or leave the accepted-risk posture as-is for now?"
    gating: false
    affects: ["w1", "w2", "w3"]
    default: "Leave the current fast path as-is and pursue permission or optional fallback only if the risk posture changes"
