id: joinorder-canonical-data-assurance
title: "JoinOrder canonical data assurance: external checksum attestation, deterministic rebuild, conversion fidelity, manifest hash naming"
worktree: main
priority: High
status: Not Started
category: Testing and Quality Assurance

description: |
  Follow-up to the merged canonical-JOB foundation (issue #289 Step 1; PRs #332,
  #339, #341, #350 code and #369 docs). A post-merge code review + blind-spot
  audit found that the "this is canonical JOB data, reproducibly built, with
  integrity verification" claim has thinner anchors than it appears:

    1. `_project/joinorder/reference_cardinalities.json` is committed, so the
       "113/113 aggregate row hashes matched" oracle result proves future builds
       do not DRIFT -- it does not independently prove the data is canonical JOB.
       The per-table sha256 values and `data_archive_hash` in
       `benchbox/core/joinorder/data_manifest.toml` were generated by the same
       build script that produced the Parquet, so verifying the archive against
       them is circular. The only genuinely external anchor is
       `[provenance] pg_dump_sha256 = 1390a764ee76d03d80fd6743ec7a6e5f22493411967582e4f1ecc2e282c1a59c`
       (and the build log's `md5: df3e976b235288005cb410cea09a115f`), and nobody
       has confirmed those match the checksums Harvard Dataverse PUBLISHES for
       DOI 10.7910/DVN/2QYZBT, file id 3590041 (`imdb_pg11`).

    2. "Reproducible canonical data": the recovery story if the GitHub release
       asset disappears is "rebuild from `_project/joinorder/build-inputs` +
       `_project/scripts/build_joinorder_data.py` + the Dataverse source". But
       Parquet output bytes depend on writer version, compression level,
       row-group sizing, dictionary encoding, and row order. `[provenance]
       duckdb_version = "1.3.2"` is pinned, which suggests the authors know this
       matters -- but the rebuild has not been shown to produce the
       byte-identical archive matching `archive_sha256 = 669c97ce...`. If it is
       not deterministic, the manifest's committed sha256 values are
       un-regenerable and the integrity story needs to switch from
       archive-hash to per-table content verification.

    3. Conversion fidelity is only validated where the 113 JOB queries look.
       Row-count + file-sha256 prove the FILE is stable; they do not prove the
       Postgres -> Parquet conversion preserved NULL-vs-empty-string (the
       retired CSV path needed `csv_null_marker=""` precisely because of this),
       integer width (no int32 truncation on 36M-row `cast_info`, or on
       `name`/`title`/`char_name` ids), or UTF-8 round-trip of non-ASCII IMDb
       titles. Columns no JOB query references -- `md5sum`, `phonetic_code`,
       `name_pcode_*`, `series_years`, `imdb_index`, the nullable int columns --
       are entirely unvalidated.

    4. `data_manifest.toml` carries `archive_sha256`, `data_archive_hash`, and
       `manifest_hash` with no inline explanation of what each one is the hash
       OF (the `.tar.zst` file? the extracted tar? the concatenated table
       contents? the manifest itself?). This is a footgun for anyone touching
       the build pipeline later.

  Scope is the build/verification pipeline and provenance docs only. NO changes
  to the runtime benchmark (`benchbox/core/joinorder/benchmark.py`,
  `benchbox/joinorder.py`) or the shipped queries (`queries.py`). If any phase
  surfaces a genuine data mismatch (Phase 1 checksum disagreement, Phase 3
  fidelity defect), STOP and escalate -- that means the published archive is not
  canonical and the foundation needs rework, which is a separate decision.

  Related: `joinorder-redistribution-license-adr` (independent, also
  release-relevant), `joinorder-accessibility-and-comparability` (independent),
  `joinorder-step1-housekeeping` (independent). Step-2 work
  (`joinorder-track2-groundwork`, `joinorder-scale-stress-decision-framework`)
  is downstream of a trustworthy canonical foundation and benefits from this.

context_sections:
  "Where the evidence lives": |
    - Manifest: `benchbox/core/joinorder/data_manifest.toml` (`[provenance]`
      block: source_doi, retrieval_timestamp, pg_dump_sha256, postgres_image,
      duckdb_version, gregrahn_commit, script_git_sha).
    - Reference oracle: `_project/joinorder/reference_cardinalities.json`
      (full Postgres) and `_project/joinorder/tiny_reference_cardinalities.json`
      (DuckDB tiny fixture).
    - Build pipeline: `_project/scripts/build_joinorder_data.py` (subcommands
      include `verify-reference-results`; check for `restore-postgres`,
      build/convert subcommands). Build inputs under
      `_project/joinorder/build-inputs/` (queries + scripts).
    - Last validation logs:
      `/Users/joe/Developer/benchmark_runs/logs/joinorder_postgres_oracle_20260512T010726Z/`
      (restore-postgres.log shows Dataverse download with curl-reported
      `md5: df3e976b...` and `sha256: ac7e7c6d...` of the .part file plus the
      Dataverse metadata block; 21/21 tables, 74,190,187 rows).
    - Tests: `tests/unit/core/joinorder/test_canonical_queries.py`,
      `test_query_coverage.py`; `tests/unit/scripts/test_build_joinorder_data.py`.
    - Embedded `queries.py` is byte-identical to `build-inputs/queries/*.sql`
      for 109/113; 15a-15d differ only by an intentional `at` -> `at1` alias
      rename (covered by `test_query_15_avoids_reserved_alias_for_local_engines`).
  "Evidence durability": |
    The hashes and toolchain versions this TODO reasons about are PINNED in
    `benchbox/core/joinorder/data_manifest.toml` (the `[provenance]` block and
    the per-table `sha256`/`row_count` entries) -- those are durable in-repo.
    The "113/113 aggregate row hashes matched" / "21/21 tables / 74,190,187
    rows" claims come from an EPHEMERAL local log dir
    (`/Users/joe/Developer/benchmark_runs/logs/joinorder_postgres_oracle_*`)
    that a later reviewer will not have; the durable replacement is the
    fast-tier re-run (`verify-reference-results` against the committed
    `reference_cardinalities.json`, and the DuckDB tiny-fixture oracle test) and
    the `provenance-attestation.md` this TODO produces. `w0` below snapshots the
    current state so the pre-work baseline is captured before anything changes.
  "What 'STOP and escalate' means": |
    Phase 1 mismatch, Phase 2 Gate B (non-deterministic) where remediation needs
    a design call, or Phase 3 fidelity defect: do NOT paper over it in this
    TODO. Capture the finding (severity table / new TODO), notify the user, and
    pause. A non-canonical or lossy archive invalidates the #289 Step 1 closure
    and is out of scope for "assurance" cleanup.

work:
  - id: w0
    summary: "Re-validate + snapshot the current canonical-data evidence to _project/verification-logs/joinorder-canonical-data-assurance/w0.log before any change"
    status: pending
    notes: |
      Capture (so a later reviewer can see the pre-work baseline):
        - the `[provenance]` block + all per-table `sha256`/`row_count` from
          `benchbox/core/joinorder/data_manifest.toml`, and the computed sum of
          `row_count` (assert it equals 74190187);
        - `uv run -- python -m pytest tests/unit/core/joinorder tests/unit/scripts/test_build_joinorder_data.py -q` output
          (this exercises the 113-query tiny-fixture oracle and the build-script
          tests -- the durable, re-runnable stand-in for the ephemeral
          "113/113 matched" log);
        - `ls -la /Users/joe/Developer/benchmark_runs/logs/joinorder_postgres_oracle_*/ 2>/dev/null || echo '(oracle log dir not present)'`.
      Write all of it to `_project/verification-logs/joinorder-canonical-data-assurance/w0.log`.
      No code/data changes.

  - id: w1
    summary: "Phase 1: cross-check Dataverse-published checksums against the pinned pg_dump hashes; record attestation or escalate"
    needs: [w0]
    status: pending
    notes: |
      Retrieve the checksums Harvard Dataverse publishes for dataset DOI
      10.7910/DVN/2QYZBT, file id 3590041 (`imdb_pg11`). Dataverse exposes
      per-file checksums via the dataset landing page and the native API
      (e.g. `https://dataverse.harvard.edu/api/access/datafile/3590041?format=original`
      headers, or the dataset `:latest` metadata JSON which lists
      `dataFile.checksum.type` / `.value`, and `dataFile.md5`). Capture the
      retrieval method and the raw published values.

      Compare published values against:
        - `data_manifest.toml [provenance] pg_dump_sha256 = 1390a764ee76d03d80fd6743ec7a6e5f22493411967582e4f1ecc2e282c1a59c`
        - the build log's curl-reported `md5: df3e976b235288005cb410cea09a115f`
          and the Dataverse metadata block in
          `joinorder_postgres_oracle_20260512T010726Z/restore-postgres.log`.

      Output: new file `_project/joinorder/provenance-attestation.md` recording
      (a) the Dataverse DOI / file id / access URL, (b) retrieval date, (c) the
      published checksum type(s) and value(s), (d) the matched local values,
      (e) the gregrahn_commit pin and a one-line note that the SQL corpus is
      pinned to that commit. Add a pointer to this file from
      `_project/joinorder/migration-plan.md` and from
      `docs/benchmarks/join-order.md` "Data Source".

      GATE: if any published checksum does NOT match -> STOP, do not start w2/w3,
      escalate (the archive is not the canonical Dataverse pg_dump).

      If Dataverse no longer exposes a checksum for that file id, document that
      explicitly and treat the curl-captured md5/sha256 in the build log as the
      best-available anchor -- but flag it as a weaker guarantee in the
      attestation doc and in `open_questions`.

  - id: w2
    summary: "Phase 2: deterministic-rebuild check -- build the archive twice, diff bytes vs committed archive_sha256; record proof or trigger Gate B"
    needs: [w1]
    status: pending
    notes: |
      ANNOUNCE BEFORE RUNNING: this re-downloads the ~1.2 GB Dataverse pg_dump
      and runs a Postgres restore in Docker; expect ~10-20 min per build, two
      builds. State the command, expected runtime, and log path; tee output to
      `/tmp/joinorder-rebuild-check.log`. If a recent Dataverse download is
      already cached under `benchmark_runs/joinorder/`, reuse it for the source
      and only re-run the Parquet conversion twice (the conversion is the
      determinism-sensitive step).

      Run `_project/scripts/build_joinorder_data.py` end-to-end (or its build/
      convert subcommand) twice into clean work dirs. For each run compute the
      sha256 of the produced `joinorder-imdb-2013-v1.tar.zst` and of every
      extracted `*.parquet`. Compare run1 vs run2, and both vs the committed
      `archive_sha256 = 669c97ce7e9e7498c7ce0cad018153aa93a9b8eefff0f77e436d690f64ebc5fd`
      and the per-table sha256 values in `data_manifest.toml`.

      GATE A (byte-identical, matching committed values): record the
      reproducibility proof in `_project/joinorder/provenance-attestation.md`
      (the exact command, toolchain versions, the matched hashes) and add a
      `make`/script target or test note that re-runs the determinism check on
      demand. Done.

      GATE B (NOT byte-identical): STOP and escalate with a decision question
      (AskUserQuestion) between:
        (i) pin the conversion toolchain harder until deterministic -- pyarrow
            and duckdb versions, parquet `row_group_size`, `compression` /
            `compression_level`, dictionary encoding, deterministic row order
            (ORDER BY primary key before write), and pin them in
            `build_joinorder_data.py` + record in `[provenance]`; OR
        (ii) accept that the rebuild produces EQUIVALENT-not-IDENTICAL bytes:
             switch the integrity story so download verification is per-table
             content hash (logical row hash, order-independent) rather than
             `archive_sha256`, and update the manifest schema + docs to say so.
      Either path: update `docs/benchmarks/join-order.md` "Data Source" and
      `_project/joinorder/release-notes.md` to state the ACTUAL guarantee
      ("rebuild reproduces the byte-identical archive" vs "rebuild reproduces
      logically-equivalent tables verified by per-table content hash").

  - id: w3
    summary: "Phase 3: conversion-fidelity validation for columns outside the 113-query workload (NULL/empty, int width, UTF-8); wire into the oracle harness"
    needs: [w1]
    status: pending
    notes: |
      Add a check (a new `build_joinorder_data.py` subcommand, e.g.
      `verify-conversion-fidelity`, or a sibling helper) that runs against the
      restored Postgres + the converted Parquet and asserts agreement on the
      columns the 113 JOB queries never touch:
        - NULL vs empty string: for nullable `character varying` columns
          (`note`, `md5sum`, `phonetic_code`, `name_pcode_cf`, `name_pcode_nf`,
          `name_pcode_sf`, `surname_pcode`, `imdb_index`, `series_years`,
          `info`), confirm Postgres NULL maps to Parquet null (not "") and
          Postgres '' (if any) maps to "" -- COUNT(*) WHERE col IS NULL must
          match on both sides for each such column.
        - integer width: for every `integer` column on the large tables
          (`cast_info`, `name`, `title`, `char_name`, `movie_info`,
          `movie_keyword`, `person_info`) confirm MIN/MAX fit in int32 and the
          Parquet physical type is INT32 (or INT64 if any value exceeds int32)
          -- i.e. detect silent truncation either direction.
        - UTF-8 round-trip: pick rows with non-ASCII bytes in `title.title`,
          `name.name`, `aka_title.title`, `char_name.name`; compare the exact
          string (or a sha256 of the UTF-8 bytes) Postgres-side vs Parquet-side.
        - row-count parity: COUNT(*) per table matches `data_manifest.toml`
          `row_count` (already done in restore validation; assert it here too so
          the fidelity check is self-contained).
      Wire it into the same flow as `verify-reference-results` (so the heavy
      Postgres-oracle run exercises it), and add a reduced version to the
      DuckDB tiny-fixture test (`tests/unit/core/joinorder/test_canonical_queries.py`
      or a sibling) covering the int-width + null-vs-empty assertions on the
      tiny tables.

      Acceptance: the new check runs in the oracle flow and passes; the
      tiny-fixture variant is in `make test-fast`. GATE: if it surfaces a real
      mismatch -> STOP, escalate (the Parquet conversion is lossy).

  - id: w4
    summary: "Phase 4: clarify hash-field naming in data_manifest.toml + docs (archive_sha256 vs data_archive_hash vs manifest_hash); no behavior change"
    needs: [w0]
    status: pending
    notes: |
      Read `build_joinorder_data.py` to determine precisely what each field is
      the hash OF, then add inline `#` comments above each of `manifest_hash`,
      `data_archive_hash`, `archive_sha256` in `data_manifest.toml` stating:
      the input being hashed, the algorithm, and which verification step
      consumes it (download integrity vs content verification vs manifest
      integrity). Mirror a one-paragraph explanation in
      `docs/benchmarks/join-order.md` near the "Data Source" / "First Run"
      sections. No code or value changes -- comments and docs only. Run
      `make docs-validate` and the joinorder unit tests after.

deferred:
  - summary: "Cross-engine result equivalence (DuckDB-on-full-data == Postgres-on-full-data 113 hashes)"
    reason: "Out of scope for 'data assurance' (which is about the dataset itself); belongs to Step-2 cross-engine validation. The tiny-fixture test already covers DuckDB self-consistency."
  - summary: "Mirror the canonical archive to a second host (Zenodo / S3) for disaster recovery"
    reason: "Separate infra decision; gate on the Phase 2 outcome (if rebuild is deterministic, a mirror is less urgent)."

prior_art:
  - "_project/scripts/build_joinorder_data.py:verify-reference-results subcommand — extend with a verify-conversion-fidelity sibling; reuse its Postgres-container + Parquet-read plumbing rather than a standalone script"
  - "benchbox/core/data_fetch/ (load_manifest, fetch_data, manifest dataclass) — manifest already exposes per-table sha256/row_count; Phase 4 only annotates the existing fields, no schema change unless Phase 2 Gate B (ii) is chosen"
  - "_project/joinorder/migration-plan.md, _project/joinorder/release-notes.md — existing joinorder provenance/notes docs; the new provenance-attestation.md sits alongside them, link bidirectionally"
  - "_project/joinorder/tiny_reference_cardinalities.json + tests/fixtures/joinorder_canonical_tiny/ — existing tiny-fixture oracle; the reduced Phase 3 fidelity check extends test_canonical_queries.py against this fixture"

must_preserve:
  - "benchbox/core/joinorder/benchmark.py and benchbox/joinorder.py runtime behavior is untouched (scale_factor=1.0-only contract, archive fetch/verify path)"
  - "benchbox/core/joinorder/queries.py text is untouched (the embedded 113 canonical queries, including the 15a-15d at->at1 alias rename)"
  - "Existing test_canonical_queries.py / test_query_coverage.py / test_build_joinorder_data.py assertions keep passing; new assertions are additive"
  - "data_manifest.toml hash VALUES are untouched in Phase 4 (comments only); they change only if Phase 2 Gate B (ii) is explicitly chosen"

approach: |
  Sequence: w1 (cheap, network-only -- and a hard gate) first; w2/w3/w4 fan out
  after w1 passes. w2 is the expensive one (announce it, reuse cached Dataverse
  source if present, only re-run the determinism-sensitive Parquet conversion
  twice). w3 reuses the Postgres container that the oracle harness already
  stands up -- prefer adding a `build_joinorder_data.py` subcommand over a new
  script so it shares the restore/connect/read plumbing. w4 is doc/comment-only.
  Read `_project/scripts/build_joinorder_data.py` end-to-end before touching it;
  it already encodes the build steps and the meaning of each manifest hash.

anti_patterns:
  - "DO NOT regenerate or 'fix' any hash value in data_manifest.toml or reference_cardinalities.json to make a check pass — because a mismatch is the signal we are looking for — STOP and escalate instead"
  - "DO NOT re-download the 1.2 GB Dataverse archive without announcing it first (command, runtime, log path) — because the project's Output Discipline / Long-Running UAT rules require it and the download is metered"
  - "DO NOT add a standalone verification script — because build_joinorder_data.py already owns the Postgres-restore + Parquet-read plumbing — add a subcommand to it"
  - "DO NOT touch benchbox/core/joinorder/benchmark.py, benchbox/joinorder.py, or queries.py — because this TODO is build/verification/provenance only — runtime changes are a different decision"

verification:
  - description: "Provenance attestation doc exists and records matched Dataverse checksums"
    command: "ls -l _project/joinorder/provenance-attestation.md && grep -c '1390a764\\|df3e976b' _project/joinorder/provenance-attestation.md"
    expected_output: "file exists; both pinned hashes referenced with their Dataverse-published counterparts and a match/no-match verdict"
  - description: "Deterministic-rebuild result is recorded (proof, or Gate B decision + updated docs)"
    command: "grep -i 'rebuild\\|deterministic\\|byte-identical\\|equivalent' _project/joinorder/provenance-attestation.md docs/benchmarks/join-order.md"
    expected_output: "the attestation doc states whether the rebuild is byte-deterministic; join-order.md 'Data Source' states the actual integrity guarantee"
  - description: "Conversion-fidelity check exists and passes (fast variant)"
    command: "uv run -- python -m pytest tests/unit/core/joinorder -q"
    expected_output: "all pass, including the new null-vs-empty / int-width fidelity assertions on the tiny fixture"
  - description: "Manifest hash fields are documented; docs build clean"
    command: "grep -B1 -A0 'data_archive_hash\\|archive_sha256\\|manifest_hash' benchbox/core/joinorder/data_manifest.toml && make docs-validate"
    expected_output: "each hash field has an inline comment explaining what it hashes and which step consumes it; docs-validate passes"
  - description: "No runtime joinorder code changed"
    command: "git diff --name-only develop... | grep -E 'benchbox/core/joinorder/benchmark.py|benchbox/joinorder.py|benchbox/core/joinorder/queries.py' || echo CLEAN"
    expected_output: "CLEAN"

