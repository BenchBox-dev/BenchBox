impact:
  business_value: |
    Backs the public "canonical JOB, reproducibly built, integrity-verified"
    claim with an external anchor and a reproducibility proof. Without this, the
    claim rests on circular self-verification and an un-replayed build.
  user_impact: |
    Users relying on `joinorder` for optimizer benchmarking get a documented,
    externally-attested provenance chain and a recovery path if the release
    asset disappears. Catches any silent Parquet-conversion data loss before it
    skews results.
  technical_debt: |
    Removes the circular-verification smell and the un-explained triple-hash
    manifest fields; makes the build pipeline auditable by someone other than
    its author.

success_metrics:
  - "Dataverse-published checksum for file 3590041 is recorded and matched (or a documented best-effort fallback if Dataverse no longer publishes one)"
  - "The archive rebuild has been run twice and the result (byte-identical, or equivalent-with-content-hash) is documented in both the attestation doc and docs/benchmarks/join-order.md"
  - "A conversion-fidelity check covering null-vs-empty, integer width, and UTF-8 round-trip runs in the Postgres-oracle flow and (reduced) in make test-fast, and passes"
  - "Each of manifest_hash / data_archive_hash / archive_sha256 has an inline comment stating what it hashes and which verification step consumes it"

open_questions:
  - "Does Harvard Dataverse still publish a per-file checksum for DOI 10.7910/DVN/2QYZBT file 3590041, and is it md5 or sha256? (Phase 1 determines the strength of the external anchor.)"
  - question: "If the Parquet rebuild is not byte-deterministic, do we pin the toolchain harder (Gate B-i) or switch to per-table content-hash verification (Gate B-ii)?"
    gating: true
    affects: ["w2 success_metric: rebuild result documented"]
    default: "Document equivalent-not-identical + per-table content hash (B-ii) is the lower-risk default; pursue B-i only if the user wants byte-exact reproducibility"
