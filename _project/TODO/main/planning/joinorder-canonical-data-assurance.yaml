    - "_project/joinorder/provenance-attestation.md"
    - "_project/joinorder/migration-plan.md"
    - "_project/joinorder/release-notes.md"
    - "_project/verification-logs/joinorder-canonical-data-assurance/"
    - "benchbox/core/joinorder/data_manifest.toml"
    - "docs/benchmarks/join-order.md"
    - "tests/unit/core/joinorder/"
    - "tests/unit/scripts/test_build_joinorder_data.py"
    - "Makefile"
  do_not_modify:
    - "benchbox/core/joinorder/benchmark.py"
    - "benchbox/joinorder.py"
    - "benchbox/core/joinorder/queries.py"
    - "benchbox/core/joinorder/dataframe_queries.py"
    - "_project/joinorder/reference_cardinalities.json"
    - "_project/joinorder/tiny_reference_cardinalities.json"

