must_preserve:
- "Existing result bundles without normalized cost continue to load with explicit unavailable status."
- "Local/self-hosted platforms are not shown as cloud-cost comparable unless the cost scope explains what is included."
- "Visible metrics parity remains Python-canonical; TypeScript must not become the cost reference implementation."
- "Existing `cost_usd` consumers keep working through the read-only alias defined in w2 (alias is `None` outside `compute_only`
  normalized cost). Decision is locked in w2 before downstream wiring begins."

approach: |
  Start with the data contract, because UI cost work is not trustworthy until
  normalized provenance is present. Reuse the existing cost package and pricing
  version constants. In the explorer, prefer new fields and label every cost
  chart with model version and scope. Treat missing cost as a status, not as
  null-only UI absence.

anti_patterns:
- "DO NOT accept submitter-supplied total cost as leaderboard cost - because vendors can manipulate it - compute normalized
  cost from resource metadata and BenchBox pricing tables."
- "DO NOT collapse zero local compute cost and missing cloud cost into the same value - because users will misread price/performance
  - use explicit cost_status."
- "DO NOT hardcode regional prices in the frontend - because pricing provenance belongs in `benchbox.core.cost` - surface
  only emitted model fields."
- "DO NOT change cost rankings without visible methodology copy - because cost is high-stakes for vendor comparison - show
  model version and scope near every cost metric."

