# Tier 1 — Foundation (blocks subsequent work)
# ============================================================

- id: w1
  summary: "Promote every UAT YAML section to a typed dataclass; delete config.raw and apply_stress_overrides"
  needs: []
  status: pending
  notes: |
    Replaces the W3/W4 staging artifact in `tests/uat/config.py`. After
    this work unit, `UATConfig.raw: dict[str, Any]` does not exist;
    every YAML section has a typed dataclass (`PreflightConfig`,
    `ValidateConfig`, `PackageConfig`, `ExplorerSmokeConfig`,
    `ReportConfig`, `ScalesConfig`, `PlatformsConfig`,
    `BenchmarksConfig`, `CleanupConfig`).

    Concrete deletions:
      - `tests/uat/config.py:6-9` and `:140-143` W3/W4 comments.
      - `tests/uat/config.py:176-205` `apply_stress_overrides` function
        and its docstring lying about env vars.
      - All `config.raw.get("...") or {}` patterns at
        `_cli.py:303-305`, `orchestrator.py:66,107,145,154,157`,
        `phases/package.py:46,56`, `phases/enumerate.py:51-53`.
      - All scattered defaults (e.g. `5.0` GiB free at both
        `_cli.py:304` and `orchestrator.py:69`); each typed config
        owns its own default in one place.

    Concrete additions:
      - Each typed config dataclass uses `frozen=True` to prevent
        post-construction mutation.
      - `_cli.stress_main` builds the modified config via
        `dataclasses.replace(config, scales=replace(config.scales,
        override=scale))` etc. — no helper, no env-var translation in
        Python.
      - YAML validator at `config.py:84-91` rejects unknown sections
        AND unknown fields-within-sections.

    Deps: none (pure refactor inside config.py + read sites).

- id: w2
  summary: "Define PhaseResult ABC; every phase returns one; orchestrator drops inline exit-code logic"
  needs: []
  status: pending
  notes: |
    Removes the non-uniform exit-code conventions documented in F7 of
    the review.

    New ABC in `tests/uat/phases/__init__.py`:
        @dataclass(frozen=True)
        class PhaseResult:
            phase: str
            exit_code: int        # 0=ok, 1=fail, 2=abort
            aborted: bool = False
            abort_reason: str | None = None

    Each phase result dataclass extends or aliases this. Concrete:
      - `PreflightResult`: gains `exit_code` derived from `aborted`
        (no more `orchestrator.py:73` inline computation).
      - `ExecuteOutcome`: gains `exit_code()` derived from per-cell
        results (no more duplicate logic at `orchestrator.py:103` and
        `_cli.py:334`).
      - `ValidateResult`: keeps existing `exit_code()`; the
        `FileNotFoundError` raise in `validate.py:51` becomes
        `ValidateResult(aborted=True, abort_reason="rollup script
        missing")` — phases never raise for expected error states.
      - `PackageResult`: same change for `PackagePhaseError` raises at
        `package.py:42-43,49,51,59,83`.

    Orchestrator becomes:
        for phase in cfg.phases:
            result = PHASE_DISPATCH[phase](cfg, ...)
            phase_results[phase] = result
            if result.aborted:
                aborted_phase = phase
                abort_reason = result.abort_reason
                break

    Deps: none. Lands before W6 (centralize preflight) and W9
    (argparse subparsers) so they consume the unified contract.

