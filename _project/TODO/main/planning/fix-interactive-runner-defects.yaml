  command: "uv run -- python -m pytest tests/unit/cli/test_benchmark_manager_behavioral.py tests/unit/cli/test_interactive_dry_run.py tests/unit/cli/test_run_command_interactive_paths.py tests/unit/platforms/test_base_adapter.py -x -q"
  expected_output: "passed"

