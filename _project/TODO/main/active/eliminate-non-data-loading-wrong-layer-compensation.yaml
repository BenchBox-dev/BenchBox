impact:
  business_value: |
    Removes ambiguous ownership boundaries that make benchmark execution and
    platform configuration harder to reason about and easier to regress.
  user_impact: |
    Reduces the risk of silent wrong behavior, especially around benchmark
    routing, dry-run previews, persisted result identity, and platform database
    selection.
  technical_debt: |
    Replaces fallback-heavy live paths with explicit contracts, while keeping
    compatibility shims confined to true artifact-boundary code.

