id: eliminate-non-data-loading-wrong-layer-compensation
title: "Eliminate non-data-loading wrong-layer compensation across runner, dry-run, results, and platform config"
worktree: main
priority: High
status: In Progress
category: Core Functionality
description: |
  A targeted architectural review found 5 confirmed non-data-loading instances
  of wrong-layer compensation.

  Confirmed findings:
  1. SQL lifecycle omits canonical benchmark identity even though the caller
     already has it, so the base adapter infers benchmark type from benchmark
     object internals for routing, dialect selection, and row-count validation.
  2. Live result creation and export paths re-derive benchmark_id from
     benchmark names instead of receiving a caller-supplied canonical id.
  3. Dry-run query extraction and resource estimation ignore
     BenchmarkConfig.name and re-infer benchmark identity from benchmark
     object attributes.
  4. Doris resolves host/user/password/database in the config builder, then
     re-resolves env/defaults again in from_config() and __init__().
  5. SingleStore has the same duplicated connection/database ownership split.

  The fix is not to centralize more inference. The fix is to make the caller
  pass the context it already owns, then delete downstream compensation in the
  live execution path. Historical artifact compatibility fallbacks and
  legitimate owner-layer discovery are explicitly out of scope.

deps:
  needs: []

work:
- id: w1
  summary: "Define the canonical benchmark identity contract for live execution paths"
  status: done
  notes: |
    Contract documented in benchbox/core/schemas.py docstrings for both
    RunConfig and BenchmarkConfig.

    Ownership hierarchy (CLI -> persistence):
    - BenchmarkConfig.name  -> authoritative slug from CLI/orchestrator (e.g. "tpch")
    - RunConfig.benchmark   -> propagated copy; runner must populate from BenchmarkConfig.name
    - execution_metadata["benchmark_id"] -> normalised form written to results/export
    - display_name / wrapper class names -> presentation only, never routing inputs

    Fix sequence: runner populates RunConfig.benchmark (w2), adapter uses
    run_config["benchmark"] instead of sniffing (w3/w4), results/export consume
    explicit benchmark_id from execution_metadata (w5/w6), dry-run uses
    benchmark_config.name directly (w7).

- id: w2
  summary: "Thread benchmark identity through the SQL runner instead of stripping it before adapter.run_benchmark()"
  needs: [w1]
  status: done
  notes: |
    Update the SQL lifecycle so RunConfig carries benchmark=benchmark_config.name
    and the SQL path does not drop that field before calling the adapter.

    Primary files:
    - benchbox/core/runner/runner.py
    - benchbox/core/schemas.py

    Caller contract to enforce:
    - SQL path matches the DataFrame path in explicit benchmark context quality
    - platform_config/get_platform_config remains the owner of platform config,
      not benchmark identity backfilling inside adapters

- id: w3
  summary: "Remove base-adapter benchmark sniffing from live routing and validation"
  needs: [w2]
  status: done
  notes: |
    Replace active-path uses of benchmark._name / display_name / class-name
    inference with explicit benchmark identity from run_config or a directly
    passed benchmark_id argument for execution routing and validation.

    Primary files:
    - benchbox/platforms/base/adapter.py

    Specific call sites to clean up:
    - _get_benchmark_type()
    - _execute_power_test()
    - _execute_throughput_test()
    - _execute_maintenance_test()
    - _execute_combined_test()

    Preserve benchmark object access for legitimate benchmark behavior
    execution; only remove identity inference used to compensate for omitted
    caller context.

- id: w4
  summary: "Remove base-adapter benchmark sniffing from dialect selection and single-query execution"
  needs: [w2]
  status: done
  notes: |
    Clean up the remaining benchmark-identity inference in query selection and
    single-query execution paths.

    Primary file:
    - benchbox/platforms/base/adapter.py

    Specific call sites to clean up:
    - _get_dialect_queries()
    - _execute_single_query()

    Keep dialect and query execution behavior intact; only remove the need to
    sniff benchmark identity from wrapper internals.

- id: w5
  summary: "Make live result creation consume explicit benchmark_id instead of deriving it from names"
  needs: [w2]
  status: done
  notes: |
    Ensure live-created BenchmarkResults receive benchmark_id from
    execution_metadata produced by the runner/adapter path.

    Primary files:
    - benchbox/base.py
    - benchbox/core/results/result_factory.py
    - benchbox/core/results/models.py

    Required boundary decision:
    - Live execution paths must not rely on benchmark-name normalization
    - Historical artifact compatibility in benchbox/core/results/schema.py and
      loader utilities remains intact and must stay a compatibility boundary

- id: w6
  summary: "Make result export preserve explicit benchmark_id without name-derived drift"
  needs: [w5]
  status: done
  notes: |
    Ensure export code consumes the explicit benchmark_id already present on
    live-created results instead of re-normalizing from names.

    Primary file:
    - benchbox/core/results/exporter.py

    Preserve compatibility behavior for historical artifacts that enter through
    loader/schema boundaries rather than the live execution path.

- id: w7
  summary: "Refactor dry-run query extraction and estimation to use BenchmarkConfig.name instead of benchmark-object sniffing"
  needs: [w1]
  status: done
  notes: |
    DryRunExecutor already receives BenchmarkConfig and already uses it for
    platform-config injection. Extend that same explicit contract to query
    extraction, real-test dry-run execution, data-size estimation, and memory
    estimation.

    Primary file:
    - benchbox/core/dryrun.py

    Target behaviors:
    - TPC test-mode branching keys off benchmark_config.name / canonical id
    - dry-run estimates do not depend on wrapper class names or _name sniffing

- id: w8
  summary: "Make Doris config builder the single owner of standard CLI connection/env/default resolution"
  needs: [w1]
  status: pending
  notes: |
    Keep benchmark-aware database naming where benchmark/scale context first
    exists, but stop re-resolving host/port/http_port/username/password/database
    inside from_config() and __init__() for the standard config-built path.

    Primary files:
    - benchbox/platforms/doris.py
    - benchbox/cli/database.py
    - benchbox/cli/platform_hooks.py
    - benchbox/core/platform_config.py

    End state:
    - builder returns resolved DatabaseConfig
    - from_config() maps/resolves only benchmark-derived database naming that
      truly belongs there
    - __init__() consumes resolved values instead of repeating env/default logic

- id: w9
  summary: "Make SingleStore config builder the single owner of standard CLI connection/env/default resolution"
  needs: [w1]
  status: pending
  notes: |
    Apply the same ownership cleanup as Doris to SingleStore.

    Primary files:
    - benchbox/platforms/singlestore.py
    - benchbox/cli/database.py
    - benchbox/cli/platform_hooks.py
    - benchbox/core/platform_config.py

    End state:
    - no adapter-side env/database fallback in the standard config-aware path
    - explicit database overrides still win
    - generated benchmark-scoped database naming still works when no explicit
      database is provided

- id: w10
  summary: "Add regression tests for benchmark identity propagation across runner, adapter, dry-run, and results"
  needs: [w3, w4, w5, w6, w7]
  status: pending
  notes: |
    Add or extend tests for:
    - SQL runner propagates benchmark identity into adapter/results
    - dry run uses BenchmarkConfig.name for TPC branching and estimation
    - exporter/result paths use explicit benchmark_id without name-derived drift

    Primary test files:
    - tests/unit/core/test_runner_lifecycle.py
    - tests/unit/platforms/test_base_adapter.py
    - tests/unit/platforms/test_base_adapter_database_management.py
    - tests/unit/core/test_dryrun.py
    - tests/unit/core/test_dryrun_behavioral.py
    - tests/unit/test_cli_dryrun_real_execution.py
    - tests/unit/test_cli_dryrun_test_modes.py
    - tests/unit/core/results/test_builder.py
    - tests/unit/core/results/test_loader.py
    - tests/unit/core/results/test_normalizer.py
    - tests/unit/test_results_exporter.py
    - tests/unit/platforms/test_enhanced_benchmark_results.py

- id: w11
  summary: "Add regression tests for Doris and SingleStore config-ownership cleanup"
  needs: [w8, w9]
  status: pending
  notes: |
    Add or extend tests for:
    - Doris consumes builder-resolved config without env fallback duplication
    - SingleStore consumes builder-resolved config without env fallback duplication

    Primary test files:
    - tests/unit/platforms/test_doris_adapter.py
    - tests/unit/platforms/test_singlestore_adapter.py

- id: w12
  summary: "Run focused verification and post-fix audits to ensure only legitimate compatibility boundaries still use fallbacks"
  needs: [w10, w11]
  status: pending
  notes: |
    After tests pass, rescan the touched subsystems for:
    - active-path fallback logic around benchmark identity
    - duplicated env/default resolution across config builders, from_config(),
      and __init__() in Doris and SingleStore

    Explicitly confirm that the remaining fallbacks are limited to:
    - historical results compatibility / import boundaries
    - legitimate owner-layer discovery for platforms not covered by these
      confirmed findings

    Output:
    - append a short audit note to this TODO or the implementation summary
      naming any surviving allowed fallback sites and why they remain valid

