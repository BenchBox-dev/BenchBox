must_preserve:
- "DataFrame execution already receives benchmark_config explicitly and must not regress while SQL is brought to the same contract quality"
- "Data-only/result-object paths that intentionally set benchmark_id explicitly continue to work"
- "Historical artifact compatibility fallbacks in benchbox/core/results/schema.py and result-loading code remain intact"
- "Explicit CLI database/schema overrides still win over generated names for Doris and SingleStore"
- "Benchmark-derived Doris/SingleStore database naming still works when no explicit database is provided"
- "The original data-loading-only wrong-layer-compensation fixes remain untouched"

approach: |
  Fix the missing context at the caller boundary first, then remove the
  downstream compensation that existed only because the caller failed to pass
  that context.

  Implement in thin vertical slices:
  1. Benchmark identity contract and SQL runner propagation
  2. Base adapter routing and validation cleanup
  3. Base adapter dialect and single-query cleanup
  4. Live result creation and export cleanup
  5. Dry-run contract cleanup
  6. Doris config ownership cleanup
  7. SingleStore config ownership cleanup
  8. Regression tests and final audit

  Treat compatibility code as an explicit exception boundary. Live execution
  paths should become simpler; compatibility import/export paths may retain
  fallback behavior where they truly own legacy artifact adaptation.

anti_patterns:
- "DO NOT replace multiple sniffers with one centralized infer-benchmark helper -- because that preserves the wrong ownership boundary -- make callers pass benchmark identity explicitly"
- "DO NOT delete historical result compatibility fallbacks in schema/loader code -- because those are valid artifact-boundary shims -- remove only live-path dependence on them"
- "DO NOT let config builders and adapters both own env/default resolution for the same connection fields -- because that guarantees drift and split behavior across callers -- choose one owner per path"
- "DO NOT use display names, wrapper class names, or benchmark._name as the authoritative routing input once the caller already has benchmark_config.name -- because those representations have different semantics -- propagate the canonical id instead"

