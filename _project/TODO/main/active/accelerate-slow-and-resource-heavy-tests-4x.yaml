must_preserve:
- "`make test-all` still validates the complete intended coverage set across default + stress lanes, with no dropped assertions"
- "Full-fidelity benchmark executions for sqlite/pyspark/dask/tpc compliance remain available in explicit stress/nightly flows"
- "CLI behavior and output contracts tested in e2e suites remain unchanged for benchmark, phases, queries, tuning, validation,
  and dry-run options"
- "TPC-H/TPC-DS correctness checks and benchmark result schema validation semantics remain intact"

approach: |
  Follow a profiling-first workflow. For each heavy file, identify dominant costs
  (subprocess startup, data generation, full benchmark execution, real sleeps),
  then apply the smallest refactor that preserves the same assertion semantics.

  Reuse existing helper patterns in tests/e2e/conftest.py and
  tests/integration/_cli_e2e_utils.py to centralize CLI invocations and avoid
  duplicated subprocess runs. Keep one or a few true subprocess smoke tests per
  behavior class, then validate remaining parameter matrices via shared fixtures
  or in-process CLI runners where equivalent.

  For integration suites, convert repeated setup into module/session-scoped
  fixtures and keep exactly one full-fidelity path in stress. Preserve contract
  checks by ensuring smoke tests still execute the same public APIs.

anti_patterns:
- "DO NOT delete slow tests to hit timing goals -- because that silently reduces coverage -- move full-fidelity variants to
  stress and add equivalent smoke assertions in default lanes"
- "DO NOT loosen assertions to make tests pass faster -- because that reduces defect detection -- keep assertions and reduce
  redundant setup/execution only"
- "DO NOT introduce network/live credential dependency into default test-all -- because this destabilizes local and CI runs
  -- keep live tests explicitly gated"
- "DO NOT benchmark optimization success without before/after durations -- because regressions become unverifiable -- require
  a checked-in timing report"

verification:
- description: "Baseline runtime artifact exists for objective speedup comparison"
  command: "test -f _project/analysis/test-performance/resource-heavy-baseline-seconds.txt"
  expected_output: "Exit code 0"
- description: "Updated heavy-test selection remains valid"
  command: "uv run -- python -m pytest --collect-only -q -m \"resource_heavy and not stress\" -n 0 | wc -l"
  expected_output: "Command succeeds and returns a non-zero count"
- description: "Default fast lane remains green after refactor"
  command: "uv run -- python -m pytest -m \"not (stress or resource_heavy)\" --tb=short"
  expected_output: "Exit code 0"
- description: "Resource-heavy lane remains green in serial mode"
  command: "uv run -- python -m pytest -m \"resource_heavy and not stress\" -n 0 --tb=short"
  expected_output: "Exit code 0"
- description: "Full stress lane still exercises full-fidelity scenarios"
  command: "uv run -- python -m pytest -m \"stress\" -n 0 --tb=short"
  expected_output: "Stress tests execute without removed test coverage"
- description: "Timing target is met"
  command: "bash -lc 'base=$(cat _project/analysis/test-performance/resource-heavy-baseline-seconds.txt); cur=$(uv run --
    python -m pytest -m \"resource_heavy and not stress\" -n 0 -q 2>&1 | rg -o \"in [0-9]+\\.[0-9]+s\" | tail -n 1 | awk \"\
    {print \\\\$2}\" | tr -d s); BASE=\"$base\" CUR=\"$cur\" python -c \"import os; b=float(os.environ[\\\"BASE\\\"]); c=float(os.environ[\\\
    \"CUR\\\"]); s=b/c; print(f\\\"BASE={b:.2f}s CUR={c:.2f}s SPEEDUP={s:.2f}x\\\"); raise SystemExit(0 if s>=4.0 else 1)\"\
    '"
  expected_output: "Printed SPEEDUP value is >=4.00x and command exits 0"

