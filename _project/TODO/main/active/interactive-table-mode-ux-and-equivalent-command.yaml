id: interactive-table-mode-ux-and-equivalent-command
title: "Expose interactive table mode selection and include it in equivalent CLI command"
worktree: main
priority: High
status: In Progress
category: User Experience
description: |
  Interactive benchmark setup currently does not explicitly surface table mode
  (`native` vs `external`) even though `--table-mode` exists in CLI options.
  This creates ambiguity in wizard-driven runs and in the generated
  "Equivalent CLI command" preview.

  This TODO adds table mode to interactive UX and command rendering so users can:
  1) select or confirm table mode in wizard flow,
  2) see selected mode in preview output, and
  3) copy an equivalent command that includes `--table-mode`.

  The implementation must preserve existing non-interactive semantics and keep
  explicit CLI flags authoritative when provided.

work:
- id: w1
  summary: "Add interactive prompt helper for table mode selection in benchbox/cli/benchmarks.py"
  status: done

- id: w2
  summary: "Integrate table mode prompt into interactive run flow with explicit-CLI precedence"
  needs: [w1]
  status: done

- id: w3
  summary: "Extend dryrun.generate_cli_command signature and rendering to include --table-mode"
  status: done

- id: w4
  summary: "Update interactive preview table to show selected table mode and pass value into equivalent command generation"
  needs: [w3]
  status: done

- id: w5
  summary: "Persist table_mode in quick-restart save/load path and include mode hint in last-run summary when non-default"
  status: done

- id: w6
  summary: "Add/adjust tests for prompt behavior and generated command output in test_interactive_dry_run.py, including explicit
    --table-mode rendering expectations"
  needs: [w1, w3, w4]
  status: pending

- id: w7
  summary: "Add/adjust tests for run flow and preferences persistence in test_cli_data_load_modes.py and test_preferences_coverage.py,
    including explicit CLI precedence for --table-mode"
  needs: [w2, w5]
  status: pending

- id: w8
  summary: "Run targeted CLI test suite and ruff checks to verify behavior and formatting"
  needs: [w6, w7]
  status: pending

metadata:
  tags:
  - interactive-ux
  - cli
  - table-mode
  - reproducibility
  estimated_effort: Medium
  created_date: "2026-03-04"

files_affected:
  modified:
  - benchbox/cli/benchmarks.py
  - benchbox/cli/commands/run.py
  - benchbox/cli/dryrun.py
  - benchbox/cli/preferences.py
  - tests/unit/cli/test_interactive_dry_run.py
  - tests/unit/cli/test_cli_data_load_modes.py
  - tests/unit/cli/test_preferences_coverage.py

must_preserve:
- "Non-interactive and explicit CLI invocation behavior for --table-mode remains unchanged, including --table-mode external
  incompatibility with --tuning tuned"
- "Run announcement continues to include [external] only when table_mode is external"
- "Interactive preview continues to render existing Data Format/Compression/Phase fields without regressions"

approach: |
  Follow existing interactive prompt patterns in benchbox/cli/benchmarks.py
  (`prompt_data_format`, `prompt_output_location`) to add `prompt_table_mode`
  with a simple numbered choice and normalized return value.

  In benchbox/cli/commands/run.py, wire prompt invocation only in interactive
  wizard flow and only when table mode was not explicitly supplied on the CLI.
  Keep explicit user flags authoritative by checking Click parameter source
  before applying wizard-selected value.

  In benchbox/cli/dryrun.py, extend `generate_cli_command` and
  `display_interactive_preview` so the generated command always includes
  `--table-mode` for reproducibility, and preview table shows a "Table Mode"
  row.

  In benchbox/cli/preferences.py and run quick-restart save/load callsites,
  persist `table_mode` and surface a concise mode hint in quick restart summary
  for non-default mode to avoid hidden configuration reuse.

anti_patterns:
- "DO NOT override a user-provided --table-mode with interactive prompt output — because explicit CLI intent must win — skip
  prompting when table_mode came from CLI"
- "DO NOT leak interactive-only prompt behavior into --non-interactive paths — because CI workflows rely on deterministic
  flag-only behavior — keep prompt logic gated by TTY interactive flow"

verification:
- description: "Interactive dryrun command and preview include table mode and remain stable"
  command: "uv run -- python -m pytest tests/unit/cli/test_interactive_dry_run.py -q"
  expected_output: "all tests pass"
- description: "Equivalent command rendering explicitly includes --table-mode for both native and external interactive flows"
  command: "uv run -- python -m pytest tests/unit/cli/test_interactive_dry_run.py -q -k table_mode"
  expected_output: "all selected tests pass and assertions confirm '--table-mode native' and '--table-mode external' rendering"
- description: "Run-mode forwarding and table-mode compatibility checks still pass"
  command: "uv run -- python -m pytest tests/unit/cli/test_cli_data_load_modes.py -q"
  expected_output: "all tests pass"
- description: "Explicit CLI --table-mode value remains authoritative and is not overridden by interactive prompt selection"
  command: "uv run -- python -m pytest tests/unit/cli/test_cli_data_load_modes.py -q -k table_mode"
  expected_output: "all selected tests pass and assertions confirm explicit flag precedence"
- description: "Preferences save/load/summary behavior remains valid with table_mode persistence"
  command: "uv run -- python -m pytest tests/unit/cli/test_preferences_coverage.py -q"
  expected_output: "all tests pass"
- description: "Touched files satisfy lint rules"
  command: "uv run ruff check benchbox/cli/benchmarks.py benchbox/cli/commands/run.py benchbox/cli/dryrun.py benchbox/cli/preferences.py
    tests/unit/cli/test_interactive_dry_run.py tests/unit/cli/test_cli_data_load_modes.py tests/unit/cli/test_preferences_coverage.py"
  expected_output: "All checks passed"

scope_limit:
  only_modify:
  - benchbox/cli/benchmarks.py
  - benchbox/cli/commands/run.py
  - benchbox/cli/dryrun.py
  - benchbox/cli/preferences.py
  - tests/unit/cli/test_interactive_dry_run.py
  - tests/unit/cli/test_cli_data_load_modes.py
  - tests/unit/cli/test_preferences_coverage.py

success_metrics:
- "Interactive preview table always shows selected table mode and equivalent command always includes --table-mode for reproducible
  copy/paste"
- "When --table-mode is provided on CLI, wizard flow does not override it and execution metadata reflects the explicit value"
