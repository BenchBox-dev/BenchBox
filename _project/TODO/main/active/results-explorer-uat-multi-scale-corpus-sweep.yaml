- id: w2
  summary: "Build the run matrix from the registry (do not hardcode)"
  needs: [w1]
  status: done
  notes: |
    Read `scripts/local_stress_test.sh` for *knowledge*; do not invoke
    it. It is the authoritative source for:
      - platform groupings (FAST_NATIVE, FAST_DOCKER, SLOW_NATIVE,
        SLOW_DOCKER, DF_PLATFORMS)
      - SQL-only benchmarks (`SQL_ONLY_BENCHMARKS`)
      - per-platform port maps (`get_platform_port`) for TCP probing
      - per-platform `--platform-option` overrides
        (`get_platform_extra_opts`) -- pass these through on every
        invocation for that platform
      - per-platform CLI flags (`get_platform_cli_flags`) -- notably
        velox needs `--iterations 1`
      - per-platform uv extras (`get_platform_uv_extra`) --
        `clickhouse-local`, `singlestore`, `influxdb` require
        `uv run --extra <name> -- benchbox run ...`; all others use
        `--no-sync`.
    Then enumerate benchmarks live from the registry:
      uv run --no-sync -- python -c "
      from benchbox.core.benchmark_registry import (
          BENCHMARK_METADATA, get_benchmarks_by_category, get_categories,
      )
      import json
      print(json.dumps({
          c: list(get_benchmarks_by_category(c).keys())
          for c in get_categories()
      }, indent=2))
      print('SQL-only:', [
          i for i, m in BENCHMARK_METADATA.items()
          if not m.get('supports_dataframe', True)
      ])
      print('Min/max scales:', {
          i: (m.get('min_scale'), m.get('max_scale'))
          for i, m in BENCHMARK_METADATA.items()
      })
      "
    Respect each benchmark's `min_scale`/`max_scale`: skip 0.01, 0.1,
    or 1.0 rungs that fall outside the supported range. TPC-DS subscale
    (SF<1) requires the patched dsdgen bundled with BenchBox -- this
    is supported, just be aware.

- id: w3
  summary: "Execute the scale ladder with hard 10-minute per-run cap"
  needs: [w2]
  status: done
  notes: |
    For each viable (platform, benchmark) pair, run the scale ladder
    0.01 -> 0.1 -> 1.0. Stop ascending the ladder for that pair as
    soon as any of the following is true:
      - the previous scale failed (don't waste time on a larger scale
        of a broken pair);
      - the previous scale took longer than ~3 minutes wall-clock
        (10x scale typically means >=10x time; the next rung will
        likely blow the 10-minute cap);
      - the next scale violates the benchmark's metadata constraints.
    Hard cap each invocation at 10 minutes wall-clock with a real
    timeout (`timeout 600 ...` or `gtimeout 600 ...`). A run that hits
    the cap is "deferred -- too slow at this scale", not a failure to
    investigate.

    Invocation template (adapt per platform):
      timeout 600 uv run [--no-sync | --extra <extra>] -- \
        benchbox run \
          --platform <p> --benchmark <b> --scale <sf> \
          --phases load,power --non-interactive \
          [--platform-option ...]    # from get_platform_extra_opts
          [--iterations 1]           # velox only

    Capture stdout+stderr per run to a per-run log file under
    `~/Developer/benchmark_runs/logs/uat_<YYYYMMDD>/<platform>_<benchmark>_<sf>.log`.
    Record the result JSON path printed in the run output (matches
    `.../benchmark_runs/results/.*\.json`).

    Run platforms sequentially, never in parallel. Concurrent platform
    runs contaminate each other's timings, defeating the
    corpus-quality goal of this exercise.

    Include reuse-aware database cleanup in the runner. The cleanup
    boundary is the loaded database artifact, not the generated source
    data: keep `~/Developer/benchmark_runs/datagen/` directories while
    later platforms can reuse them, but delete platform-specific loaded
    database files under `~/Developer/benchmark_runs/databases/` once
    no remaining cell in the current platform/source group can consume
    them. In particular, do not delete `tpch_sf*` loaded databases
    immediately after `tpch`, because `read_primitives`,
    `write_primitives`, `transaction_primitives`, and `ai_primitives`
    reuse the TPC-H source data and, depending on the adapter path, can
    share the same loaded database namespace. Prefer cleanup after the
    whole platform finishes; if cleanup is needed mid-platform, only do
    it after all consumers for that source/scale have completed.

    Partial execution record (2026-05-02):
      - Log directory:
        `~/Developer/benchmark_runs/logs/uat_20260502/`.
      - Summary file:
        `~/Developer/benchmark_runs/logs/uat_20260502/matrix_summary.tsv`.
      - Sentinel file:
        `~/Developer/benchmark_runs/logs/uat_20260502/.sweep_start`.
      - Host had no `timeout`/`gtimeout`; W3 used a Perl
        process-group timeout wrapper with the required 600-second cap.
      - Partial result counts before the blocker: 46 passed, 1 failed,
        1 timed out, 1 blocked-disk.
      - Completed DuckDB through `vector_search` SF 1.0. Next cell is
        `duckdb/tpcds_obt` SF 1.0.
      - Hard blocker: before `duckdb/tpcds_obt` SF 1.0, `df -k
        ~/Developer/benchmark_runs` reported 41,432,632 KiB available,
        below the revised 40 GiB cutoff of 41,943,040 KiB. Do not
        resume W3 until the output volume has enough free space above
        that cutoff.
      - User override: do not use the 40 GiB free-space cutoff to stop
        work. Treat disk free space as telemetry unless available space
        falls below 5 GiB. Resume from `duckdb/tpcds_obt` SF 1.0 and
        only stop if free space drops below 5 GiB, a benchmark command
        actually fails due to disk exhaustion, or another hard runtime
        failure prevents the sweep driver itself from continuing.
      - Cleanup override: include reuse-aware cleanup as part of the
        W3 process so loaded local databases do not grow without
        bounds. Preserve reusable datagen inputs; prune only loaded DB
        files at safe reuse boundaries.
      - The first resume attempt was operator-interrupted to add this
        cleanup rule. Treat the resulting `duckdb/tpcds_obt` SF 1.0
        `exit=143` summary row as retriable operator interruption, not
        a benchmark defect.

    Completion record (2026-05-03):
      - Completed the full 1,530-cell latest-status candidate matrix:
        434 passed, 85 failed, 8 timed out, 133 skipped by scale-ladder
        pruning, and 870 skipped because TCP-backed platforms were not
        reachable locally.
      - Attempted 527 real benchmark cells under the 600-second cap.
        Recorded 434 passed cells. The summary captured 388 unique
        result JSON paths for those passed cells, and all captured
        paths exist. The 46 passed cells without captured result paths
        are early DuckDB rows from before the result-path extractor was
        improved; W5 should recover those from the logs/result
        directory before submission.
      - Log directory:
        `~/Developer/benchmark_runs/logs/uat_20260502/`.
      - Summary file:
        `~/Developer/benchmark_runs/logs/uat_20260502/matrix_summary.tsv`.
        Interpret this by latest `(platform, benchmark, scale)` row;
        it contains earlier duplicate retriable rows from the disk
        cutoff and operator-interruption resumes.
      - Database cleanup log:
        `~/Developer/benchmark_runs/logs/uat_20260502/database_cleanup_20260502.log`.
      - Reuse-aware cleanup preserved reusable datagen and pruned loaded
        local DB state only at safe boundaries. Notable cleanup actions:
        DuckDB after TPC-H-source consumers, ClickHouse Local at a
        mid-platform safe boundary and platform completion, SQLite at
