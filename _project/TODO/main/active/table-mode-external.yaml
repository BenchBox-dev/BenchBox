id: table-mode-external
title: "Add --table-mode external for external table / view-based query execution"
worktree: main
priority: High
status: "In Progress"
category: "Core Functionality"
description: |
  BenchBox currently materializes all benchmark data into engine-managed (native) tables:
  SQL platforms use CREATE TABLE + INSERT/COPY, while DataFrame platforms (Polars,
  DataFusion) already scan source files directly. Cloud platforms upload data to object
  storage and then COPY INTO native tables, discarding the staged format.

  Adding --table-mode gives explicit control over table creation strategy:
    - native (default): current behavior — CREATE TABLE + INSERT/COPY INTO
    - external: CREATE VIEW, CREATE EXTERNAL TABLE, or register external data source
      pointing to source files (local Parquet) or uploaded object storage paths

  External mode unlocks three capabilities:
    1. True apples-to-apples cross-engine comparisons — all engines read the same files
    2. Faster iteration by skipping the materialization step
    3. Benchmarking external table query performance — a real production data lake pattern

  For cloud platforms, data is still uploaded to object storage (S3, GCS, Azure Blob)
  during the load phase — but instead of COPY INTO native tables, the engine creates
  external table references pointing at the uploaded Parquet files.

  Platform readiness:

    Already external:  DataFusion (CREATE EXTERNAL TABLE), Polars (scan_parquet)
    View-based:        DuckDB (CREATE VIEW over read_parquet), MotherDuck (inherits)
    Cloud — trivial:   Athena (already external tables over S3 — skip CTAS step)
    Cloud — moderate:  Snowflake (external stages), BigQuery (external tables over GCS),
                       Redshift (Spectrum), Databricks (LOCATION-based tables),
                       ClickHouse Cloud (S3 engine), Azure Synapse (PolyBase)
    Cloud — federated: Trino + Presto (Hive connector external tables)
    Unsupported:       SQLite, PostgreSQL (no external table mechanism)

  Error if external is requested on a platform that doesn't support it.
  Incompatible with --tuning tuned (requires materialized tables).

work:
  # -- Foundation --
- id: w1
  summary: "Add supports_external_tables capability and create_external_tables() to PlatformAdapter base class"
  status: done
  notes: |
    Add supports_external_tables: bool = False class attribute.
    Add create_external_tables(benchmark, connection, data_dir) method with
    default raise NotImplementedError.
    Follow DriverIsolationCapability pattern for capability declaration.
    File: benchbox/platforms/base/adapter.py

- id: w2
  summary: "Add --table-mode CLI option to benchbox run command"
  needs: [w1]
  status: done
  notes: |
    Add as common option (Tier 2) with choices [native, external], default native.
    Pass through to benchmark_config.options['table_mode'].
    Validation: error if external + --tuning tuned.
    File: benchbox/cli/commands/run.py

- id: w16
  summary: "Finalize cloud external-mode semantics and validation boundaries"
  needs: [w2]
  status: done
  notes: |
    Resolve and document decision points before routing/platform rollout:
      - Cloud external mode means upload + external registration, no materialization
      - Validation split:
        - CLI parse-time: incompatible flag combinations
        - Runtime adapter checks: capability + staging_root / platform prerequisites
    Add focused tests for both validation surfaces.
    Files: benchbox/cli/commands/run.py, benchbox/core/runner/runner.py, tests/unit/

- id: w3
  summary: "Route load phase through external table creation when --table-mode external"
  needs: [w1, w2, w16]
  status: done
  notes: |
    In runner.py load path and _execute_load_only_mode():
    Check options.get('table_mode') == 'external'.
    Validate adapter.supports_external_tables (error with clear message if False).
    Call adapter.create_external_tables() instead of create_schema() + load_data().
    For cloud platforms: upload phase still runs, only materialization is skipped.
    File: benchbox/core/runner/runner.py

  # -- Local engines --
- id: w4
  summary: "Implement DuckDB + MotherDuck external tables with CREATE VIEW over read_parquet()"
  needs: [w1]
  status: done
  notes: |
    Set supports_external_tables = True on DuckDB adapter.
    Implement create_external_tables(): for each table in benchmark schema, find
    Parquet files in data_dir and execute:
      CREATE VIEW {table} AS SELECT * FROM read_parquet('{glob}')
    Return row counts via SELECT COUNT(*) FROM read_parquet(...).
    MotherDuck inherits from DuckDB — verify it works without additional changes.
    Also support Delta tables via DuckDB's delta extension read path.
    Files: benchbox/platforms/duckdb.py, benchbox/platforms/motherduck.py

- id: w5
  summary: "Wire DataFusion and Polars to declare supports_external_tables = True"
  needs: [w1]
  status: done
  notes: |
    DataFusion already uses CREATE EXTERNAL TABLE / register_parquet() — set flag
    and alias create_external_tables() to existing load path.
    Polars already uses pl.scan_parquet() — same treatment.
    Files: benchbox/platforms/datafusion.py, benchbox/platforms/polars_platform.py

  # -- Cloud platforms --
- id: w6
  summary: "Implement Athena external table mode (bypass CTAS materialization)"
  needs: [w1, w3]
  status: done
  notes: |
    Athena already creates external tables over S3 — it's the native model.
    Current load_data() uploads Parquet to S3 then runs CTAS to optimize/convert.
    External mode: upload to S3, create external table pointing at uploaded path,
    skip the CTAS conversion step. Data stays in uploaded Parquet format.
    Existing _convert_to_external_table() method is prior art for the DDL.
    Set supports_external_tables = True.
    File: benchbox/platforms/athena.py

- id: w7
  summary: "Add Athena unit tests for external mode CTAS bypass behavior"
  needs: [w6]
  status: done
  notes: |
    Add focused mocked tests verifying:
      - external mode skips CTAS conversion path
      - native mode keeps current CTAS behavior
      - capability flag is declared
    File: tests/unit/platforms/test_athena_adapter.py

- id: w8
  summary: "Implement Snowflake external table mode DDL path (external stage + external table)"
  needs: [w1, w3]
  status: done
  notes: |
    Current: PUT files to internal stage -> COPY INTO native tables.
    External mode: create named external stage pointing to cloud storage, then
    CREATE EXTERNAL TABLE referencing stage path with AUTO_REFRESH = FALSE
    for benchmark isolation. Keep native load path unchanged.
    Alternative approach (defer): Snowflake Iceberg tables.
    Set supports_external_tables = True.
    File: benchbox/platforms/snowflake.py

- id: w9
  summary: "Add Snowflake mocked unit tests for external mode SQL generation"
  needs: [w8]
  status: done
  notes: |
    Assert external stage creation, external table SQL, and native path isolation.
    File: tests/unit/platforms/test_snowflake_adapter.py

- id: w10
  summary: "Implement BigQuery external table mode DDL path (external table over GCS)"
  needs: [w1, w3]
  status: done
  notes: |
    Current: upload Parquet to GCS bucket -> bq load into native tables.
    External mode: upload to GCS, then CREATE EXTERNAL TABLE with
    OPTIONS(format='PARQUET', uris=['gs://bucket/path/*.parquet']).
    Reuse existing GCS upload infrastructure from load_data().
    Set supports_external_tables = True.
    File: benchbox/platforms/bigquery.py

- id: w11
  summary: "Add BigQuery mocked unit tests for external table SQL/URI generation"
  needs: [w10]
  status: done
  notes: |
    Assert GCS URI wiring, external table options, and native-path regression safety.
    File: tests/unit/platforms/test_bigquery_adapter.py

- id: w12
  summary: "Implement Redshift external table mode DDL path (Spectrum external schema + table)"
  needs: [w1, w3]
  status: pending
  notes: |
    Current: upload to S3 -> COPY INTO native tables.
    External mode: upload to S3, create external schema via Redshift Spectrum,
    then CREATE EXTERNAL TABLE referencing Parquet paths.
    Preserve current COPY behavior in native mode.
    Set supports_external_tables = True.
    File: benchbox/platforms/redshift.py

- id: w13
  summary: "Add Redshift mocked unit tests for Spectrum external schema/table DDL"
  needs: [w12]
  status: pending
  notes: |
