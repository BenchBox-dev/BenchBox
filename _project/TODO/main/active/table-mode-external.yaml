must_preserve:
- "DuckDBAdapter.load_data() continues to work unchanged when table_mode='native' (default)"
- "DataFusion and Polars load paths remain unchanged — only adding capability flag"
- "All existing benchbox run invocations without --table-mode produce identical results"
- "benchbox run --help output format and tier structure remain consistent"
- "Cloud platform upload/staging infrastructure remains intact — external mode reuses it"
- "Athena, Snowflake, BigQuery, Redshift load_data() paths unchanged in native mode"
- "Trino/Presto INSERT-based load path unchanged when staging_root is not configured"

approach: |
  Follow the existing capability pattern in PlatformAdapter (see DriverIsolationCapability
  for precedent on class-level capability declarations).

  For DuckDB: CREATE VIEW AS SELECT * FROM read_parquet('{path}/*.parquet'). Reuse data
  file discovery logic from DataLoader for Parquet glob patterns and Delta detection.

  For cloud platforms: reuse each platform's existing upload/staging infrastructure.
  The key change is what happens AFTER upload — instead of COPY INTO / CTAS into native
  tables, create external table references pointing at the uploaded location. Each
  platform has its own external table DDL:
    - Snowflake: CREATE EXTERNAL TABLE ... WITH LOCATION = @stage/path
    - Athena:    CREATE EXTERNAL TABLE ... LOCATION 's3://bucket/path/'
    - BigQuery:  CREATE EXTERNAL TABLE ... OPTIONS(uris=['gs://...'])
    - Redshift:  CREATE EXTERNAL TABLE via Spectrum external schema
    - Databricks: CREATE TABLE ... USING PARQUET LOCATION '{path}'
    - ClickHouse: CREATE TABLE ... ENGINE = S3('{url}', 'Parquet')
    - Trino/Presto: CREATE TABLE ... WITH (external_location = '{path}')
    - Synapse:   CREATE EXTERNAL TABLE via PolyBase external data source

  DataFusion and Polars already implement direct scanning — just declare the capability
  flag and wire through. No behavioral changes needed.

  The runner.py routing change should be minimal: check the flag, validate the capability,
  and call the alternate method. Keep existing load paths completely untouched.

  Implementation order: foundation (w1-w3) -> local engines (w4-w5) -> easiest cloud
  platform (w6 Athena, already external) -> remaining cloud platforms (w7-w13).

anti_patterns:
- "DO NOT modify existing load_data() paths — because native mode behavior must be preserved for all platforms — add a parallel
  create_external_tables() method instead"
- "DO NOT skip row count reporting — because downstream result validation depends on table_stats — use SELECT COUNT(*) or
  metadata queries to get counts without materialization"
- "DO NOT make external the default — because tuning, sorted ingestion, and CTAS optimization all require materialized tables
  — keep native as default, external as opt-in"
- "DO NOT bypass cloud upload for cloud platforms — because the engine needs data in object storage to create external tables
  — reuse existing upload infrastructure, only skip the materialization step"

verification:
- description: "Existing fast tests still pass"
  command: "uv run -- python -m pytest -m fast -q"
  expected_output: "all tests pass, 0 failures"
- description: "DuckDB external mode produces valid results"
  command: "benchbox run --platform duckdb --benchmark tpch --scale 0.01 --phases power --non-interactive --table-mode external"
  expected_output: "Benchmark completes successfully with query results"
- description: "DuckDB native mode still works (regression check)"
  command: "benchbox run --platform duckdb --benchmark tpch --scale 0.01 --phases power --non-interactive --table-mode native"
  expected_output: "Benchmark completes successfully with query results"
- description: "Unsupported platform gives clear error"
  command: "benchbox run --platform sqlite --benchmark tpch --scale 0.01 --phases power --non-interactive --table-mode external"
  expected_output: "Error message indicating SQLite does not support external table mode"
- description: "Incompatible flag combination gives clear error"
  command: "benchbox run --platform duckdb --benchmark tpch --scale 0.01 --phases power --non-interactive --table-mode external
    --tuning tuned"
  expected_output: "Error message indicating external table mode is incompatible with tuning"

scope_limit:
  do_not_modify:
