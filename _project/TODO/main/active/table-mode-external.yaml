- id: w19
  summary: "Implement ClickHouse Cloud external mode DDL path (S3 engine or view)"
  needs: [w1, w3]
  status: pending
  notes: |
    Current: INSERT statements via client.
    External mode: CREATE TABLE ... ENGINE = S3('url', 'Parquet') or
    CREATE VIEW over s3()/url() functions.
    Require staging_root/object path availability and emit clear guidance errors.
    Set supports_external_tables = True.
    File: benchbox/platforms/clickhouse_cloud.py

- id: w20
  summary: "Add ClickHouse mocked unit tests for S3-engine/view external mode"
