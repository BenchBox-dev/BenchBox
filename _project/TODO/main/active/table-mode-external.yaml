    File: tests/unit/platforms/test_redshift_adapter.py

- id: w17
  summary: "Implement Databricks external table mode DDL path (USING PARQUET LOCATION)"
  needs: [w1, w3]
  status: pending
  notes: |
    Current: COPY INTO from UC Volumes or cloud storage into managed tables.
    External mode: CREATE TABLE ... USING PARQUET LOCATION '{cloud_path}'.
    Reuse existing cloud upload and location resolution logic.
    Set supports_external_tables = True.
