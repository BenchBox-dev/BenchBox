deferred:
- summary: "Auto-detect external as default when platform already scans files directly"
  reason: "Start with explicit opt-in; consider making external the default for DataFusion/Polars after user feedback confirms
    stability"
- summary: "External table mode for Spark-based cloud platforms (Athena Spark, EMR Serverless, Dataproc, Glue)"
  reason: "Spark adapters use DataFrame-style loading with different adapter base class; handle after SQL platform support
    is stable"
- summary: "External table mode for niche SQL platforms (StarRocks, Doris, Databend, Firebolt, Fabric)"
  reason: "Lower user demand; add platform-by-platform based on user requests"

open_questions:
- "How does --table-mode external interact with the generate phase on cloud platforms? Data still needs to reach object storage
  — should external mode upload-but-skip-materialize automatically, or require a separate upload step?"
- "Should external be the default for Athena, since its tables are already external references to S3?"
- "For Snowflake, should we use external stages (simpler) or Iceberg Tables (newer, potentially better query performance on
  Parquet)?"
- "Should platforms that require staging_root for external mode validate at CLI parse time or defer to adapter.create_external_tables()?"

metadata:
  tags:
  - performance
  - cli
  - platform-adapter
  - cloud-platforms
  estimated_effort: "1-2 weeks"
  created_date: "2026-03-03"

impact:
  business_value: |
    Enables true apples-to-apples cross-engine benchmarking where all platforms
    read from the same source files. Critical for cloud platform benchmarking where
    external tables over object stores are a real production data lake pattern.
    Eliminates data materialization time for development and testing workflows.
  user_impact: |
    Users can benchmark external table query performance — a pattern used in
    production data lakes and lakehouses. The --table-mode flag gives explicit
    control over whether data is materialized into native tables or queried
    in-place. Faster iteration cycles for development and testing.
  technical_debt: |
    Aligns DuckDB's behavior with DataFusion and Polars, which already scan files
    directly. Standardizes external table support across cloud platforms that already
    have the upload infrastructure. Reduces the conceptual gap between SQL and
    DataFrame platform loading.

