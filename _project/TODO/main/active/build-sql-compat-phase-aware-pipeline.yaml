scope_limit:
  only_modify_note: |
    The listed directories are the allowed BLAST RADIUS for this
    workstream, not a license to refactor. Within these trees, only modify
    sites that appear in files_affected above OR sites surfaced by the w2
    inventory as unregistered compatibility decisions. Unrelated cleanup,
    reformatting, or drive-by refactors are out of scope and must be carved
    out into their own TODOs. If a file is not under one of the roots below
    AND is not newly surfaced by the w2 inventory as a compatibility site, it
    is out of bounds for this item.
  only_modify:
  - "benchbox/sql_compat/"
  - "benchbox/platforms/base/dialect_translation.py"
