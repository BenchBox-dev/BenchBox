context_sections:
  "Research Findings": |
    Review found that `BenchmarkResults` has flexible fields such as
    `platform_info`, `platform_metadata`, `system_profile`, and
    `execution_metadata`, but no normalized execution-environment contract.
    `schema._build_environment_block()` currently describes the BenchBox host
    process only. Local Docker-backed integration platforms connect through
    localhost ports and expose host/port/deployment hints, but not container
    image, OS/arch, Docker platform, resource limits, or volume/storage details.
    Cloud adapters collect useful metadata unevenly: Snowflake and BigQuery are
    relatively rich, Redshift and Athena expose some region/storage fields,
    Databricks captures warehouse shape but not normalized region, and
    ClickHouse Cloud/Firebolt are sparse. Export anonymization currently focuses
    on environment rather than platform/config metadata.

technical_requirements:
  constraints:
  - "All metadata collection must be outside measured query execution timing and must use monotonic timing policy only for
    any durations it reports."
  - "Docker and cloud metadata collection must be optional and best-effort; unavailable metadata is a result state, not a
    benchmark failure."
  - "Normalized fields must carry source/provenance when values can be requested, inferred, or observed."
  - "Public exports must redact or hash infrastructure identifiers and secrets consistently across platform, config, and execution
    metadata."
  - "Backward compatibility must preserve old result artifacts and existing result readers during migration."
  compatibility: |
    The first implementation should emit both old and new fields. Consumers can
    migrate to normalized fields over time, after which a separate compatibility
    cleanup can decide whether legacy aliases are retained or deprecated.

success_metrics:
- "A macOS client running a Docker-backed platform exports `client_host.os=Darwin` and `platform_runtime.runtime_type=docker_container`
  with Linux/container metadata when Docker inspection is available."
- "Every cloud adapter listed in this TODO emits normalized provider, region/location status, compute status, and storage
  status, even when some values are unavailable."
- "CLI `--platform-option` values that affect reproducibility appear in sanitized result metadata with provenance."
- "Anonymized JSON exports contain no raw secrets or obvious infrastructure identifiers from platform/config/execution metadata."
- "Existing result export tests and the fast test suite pass."

open_questions:
- "Should private/internal result export preserve raw infrastructure identifiers by default, or require an explicit opt-in
  flag?"
- "Should Docker runtime capture rely only on BenchBox-managed compose labels, or also attempt host-port matching for externally
  managed containers?"
- "Which cloud identifiers need stable hashes for grouping versus full redaction in public artifacts?"
- "Should normalized environment fields become required in a future result schema version after a compatibility window?"

