must_preserve:
- "Existing result JSON artifacts without normalized environment fields continue to load and export through the compatibility
  path."
- "Existing `platform_info`, `platform.config`, `system_profile`, `driver_metadata`, and `engine_version` consumers keep receiving
  equivalent data during the migration."
- "Benchmarks do not fail when Docker, cloud metadata APIs, or permissioned system introspection are unavailable; results
  must record unavailable metadata explicitly."
- "No benchmark timing path includes Docker or cloud metadata collection in the measured query execution duration."
- "Existing cloud adapters remain lazy about optional SDK imports and do not require cloud credentials during unit tests."
- "Anonymized exports never include raw passwords, tokens, private keys, access keys, credential file paths, or full connection
  strings."

approach: |
  Start with the result contract and tests, then wire producers. Do not try to
  infer Docker or cloud shape from platform name alone; record source and
  collection status for every normalized field. Reuse the existing
  `platform_info` output and `platform_config_utils` helpers where possible,
  but treat them as inputs to a normalized contract rather than the contract
  itself. Add Docker inspection as an optional metadata collection step outside
  measured benchmark timing. For cloud platforms, prefer observed metadata when
  permissions allow and fall back to sanitized requested config with
  `source="requested"` when observation is unavailable.

anti_patterns:
- "DO NOT represent localhost server adapters as native local database processes - because many localhost services are Docker-backed
  Linux runtimes on macOS - use `unknown` until Docker or explicit runtime metadata proves the substrate."
- "DO NOT add Docker inspection to measured query execution timing - because environment capture must not perturb benchmark
  timings - collect before/after measured phases and record collection status."
- "DO NOT persist raw platform options directly - because they can contain credentials and infrastructure identifiers - sanitize,
  classify, and apply anonymization before export."
- "DO NOT flatten cloud region, compute, and storage into adapter-specific `platform.config` only - because downstream consumers
  need stable cross-platform facets - emit normalized `platform.cloud`, `platform.compute`, and `platform.storage` blocks."
- "DO NOT fail a benchmark because cloud metadata APIs lack permission - because benchmark execution can still be valid -
  record unavailable metadata with the error class and continue."
- "DO NOT make every adapter implement a new required abstract method in one migration - because that creates a risky broad
  adapter change - add optional hooks and conservative defaults."

