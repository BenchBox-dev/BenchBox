  estimated_effort: "Large (6-10 days)"
  created_date: "2026-05-02"

impact:
  business_value: |
    Makes public and internal benchmark comparisons credible by exposing where
    the measured engine actually ran. Prevents local Docker-backed results from
    being misread as native macOS database performance and enables cloud-region
    and compute-shape analysis.
  user_impact: |
    Users can compare results with enough context to understand runtime type,
    containerization, cloud provider, region, warehouse/instance shape, storage
    layout, and cache/storage settings instead of guessing from platform name
    and localhost connection strings.
  technical_debt: |
    Replaces adapter-specific metadata fragments with a durable result contract
    while retaining raw metadata for compatibility and diagnostics.

