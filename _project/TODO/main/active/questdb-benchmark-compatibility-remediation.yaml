anti_patterns:
- "DO NOT rewrite comma JOINs with regex — because TPC-DS has deeply nested and aliased subqueries where regex will produce
  incorrect SQL — use SQLGlot AST traversal which understands query structure"
- "DO NOT gate write_primitives or tpcds_obt as permanently incompatible — because these are BenchBox adapter bugs, not QuestDB
  SQL limitations — fix the bugs in Phase 1 before deciding if they need gating"
- "DO NOT strip ALL constraints blindly — because datavault uses both FK and PK, and stripping them correctly (without altering
  column definitions) requires careful regex targeting the constraint clause, not the column list"
- "DO NOT add the dialect rewriter as a new SQLGlot dialect — because QuestDB is not a supported SQLGlot target and the rewriter
  only covers ~4 patterns — implement as a lightweight post-processing function, not a full dialect"
- "DO NOT implement the rewriter inside execute_sql_query() in sql_execution.py — because that file is shared across all platforms
  — put it in questdb.py or questdb_rewriter.py and call it only from QuestDBAdapter.execute_query()"

approach: |
  Phase 1 (w1–w6): stabilize without any SQL rewriting. Gate the 6 benchmarks
  that will always fail due to structural incompatibilities. Fix the 3 BenchBox
  adapter bugs (PK stripping, write_primitives path, tpcds_obt chunk size) so
  that schema-failing benchmarks can load and the adapter bugs don't confuse
  future debugging.

  Phase 2 (w7–w13): expand SQL coverage via a dedicated dialect rewriter in
  questdb_rewriter.py. Use SQLGlot AST (already a project dependency) for the
  comma-JOIN rewrite — split across w8 (foundation, 2-table case) and w9
  (multi-way/aliased/nested cases) — and regex for the simpler rewrites in w10
  (INTERVAL, SUBSTRING, CTE column list). Wire the rewriter into
  QuestDBAdapter.execute_query() in w11 as the last pre-execution step.

  The research gate (w1) is non-negotiable before writing any gating code (w2)
  so the mechanism fits the existing CLI architecture rather than introducing a
  new pattern that diverges from how supports_dataframe is enforced.

