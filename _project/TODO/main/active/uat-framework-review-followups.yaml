approach: |
  Work from the dependency graph, but treat W0 as the implementation gate.
  Revalidate current readers first, then land small PR-sized slices that remove
  an old surface in the same change that installs its replacement. Favor
  typed config and registry-owned metadata over extra compatibility layers.
  When current develop contradicts the 2026-05-05 review evidence, update this
  TODO and implementation plan instead of forcing stale deletes through code.

anti_patterns:
- "DO NOT delete cleanup fields that current UAT execution paths read or validate; stale orphan-field evidence must be corrected,
  not implemented."
- "DO NOT add a blanket `benchbox/cli/` diff-is-empty gate while W4 intentionally changes submit.py internals; guard user-visible
  CLI surface instead."
- "DO NOT create a second bundle-validation implementation under tests/ or scripts/ after extracting benchbox/validation/bundle.py."
- "DO NOT preserve old bash, frozen-config, raw-config, or duplicate-validator surfaces as compatibility shims unless the
  TODO is explicitly revised."
- "DO NOT rely on raw stdout transcripts as durable evidence; keep raw logs in /tmp, CI artifacts, or BENCHBOX_OUTPUT_DIR
  and commit compact summaries only."

