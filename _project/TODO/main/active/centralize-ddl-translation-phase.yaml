context_sections:
  "What Already Landed": |
    The active `build-sql-compat-phase-aware-pipeline` item already shipped the
    ADR, the frozen Phase enum, the registry/resolver, schema_emit rules for
    nyctaxi and tsbs_devops, and the StarRocks DDL_OPTIMIZE precedent. This
    TODO must build on that infrastructure instead of replacing it.

  "Why The Earlier Draft Was Wrong": |
    The earlier version assumed a pre-registry codebase and proposed a new
    `ddl_compile` phase, a new context model, a new transformers tree, and a
    repo-wide schema-IR migration. Those ideas conflict with the shipped ADR and
    were too large, too speculative, and insufficiently aligned with the
    current resolver and rule layout.

  "Actual Remaining Gap": |
    DDL ownership is still split because adapter-local CREATE TABLE rewrite
    methods remain outside the registry and base data loading still supports a
    late callback transform. Separately, some benchmark schema helpers still
    contain inline DDL policy or rendering logic that needs a final audit so
    centralized rules are the only place where compatibility policy lives.

  "Target End State": |
    `schema_emit` and `ddl_optimize` are the only compatibility phases that own
    DDL decisions. Benchmarks no longer carry platform-specific compatibility
    policy for DDL. Adapters keep runtime setup only. Base schema execution runs
    already-planned statements with no platform callback hook.

