approach: |
  Work inside the existing sql_compat architecture, not around it.

  1. Amend the active ADR and TODO notes first so the contract is explicit:
     DDL centralization is achieved with `schema_emit` plus `ddl_optimize`, not
     a new phase or a new resolver model.
  2. Use benchbox/sql_compat/rules/ddl_optimize/starrocks_ddl_rewrites.py as
     the implementation template for every remaining adapter-owned CREATE TABLE
     rewrite. Each adapter migration should produce a rule module plus adapter
     consumer cleanup in the same slice.
  3. Keep runtime-only behavior in adapters. Centralize only pure SQL rewrite
     logic; do not move catalog creation, connection/session setup, permissions,
     or other operational flow into the registry.
  4. After adapter parity is achieved, remove the base
     `platform_transform_fn` hook and then clean up residual benchmark-level
     policy branches. Do not begin with a speculative schema-IR migration:
     BaseSchemaTable is not rich enough today to justify that refactor here.
  5. Finish by tightening the inventory/lint/docs so new benchmark-level DDL
     monkey-patching becomes detectable and reviewable.

anti_patterns:
  - "DO NOT add a `ddl_compile` phase — because `schema_emit` and `ddl_optimize` already cover DDL ownership and are frozen in the ADR — route logical-to-dialect generation through `schema_emit` and post-generation surgery through `ddl_optimize`"
  - "DO NOT extend `CompatibilityContext` with object_name, statement_kind, source_dialect, or target_dialect in this item — because resolver specificity and plan caching are query-centric today — if statement metadata is required, amend the existing DDL payload contract first"
  - "DO NOT create a parallel `benchbox/sql_compat/transformers/` tree — because the shipped convention is `benchbox/sql_compat/rules/{phase}/` — add rule modules under the existing phase directories"
  - "DO NOT move adapter operational setup into the registry — because catalog selection, search_path/session state, permissions, and pre-drop behavior are runtime concerns — centralize only pure DDL statement rewrites"
  - "DO NOT promise a repo-wide schema-IR migration in this item — because the current schema primitives cannot yet express all benchmark semantics cleanly — capture any proven IR gap as a separate follow-on TODO"
  - "DO NOT leave benchmark-local DDL compatibility branches in place once equivalent rules exist — because shadowed inline logic defeats centralized ownership — delete them or reduce them to documented `@compat_local` rendering only"

