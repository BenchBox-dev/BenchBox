impact:
  business_value: |
    Completes the DDL portion of the sql_compat migration using the
    infrastructure already built, so DDL behavior becomes auditable and centrally
    owned instead of hidden in adapter callbacks and benchmark branches.
  user_impact: |
    Transparent to end users. The benefit is lower regression risk when adding
    or changing platforms because CREATE TABLE behavior is visible in the
    registry and covered by shared tests.
  technical_debt: |
    Removes late callback-based DDL surgery from adapters, narrows benchmark
    schema helpers to benchmark-intrinsic rendering only, and avoids a second
    competing DDL architecture. It also turns the remaining DDL gaps into
    explicit rule modules and documented ADR amendments instead of folklore.

