id: centralize-ddl-translation-phase
title: "Finish DDL centralization in existing sql_compat phases (retire adapter DDL hooks)"
worktree: main
priority: High
status: Identified
category: "Core Functionality"
description: |
  Follow-on / amendment plan for `build-sql-compat-phase-aware-pipeline`. The ADR,
  phase enum, registry, resolver, `schema_emit` rules, and the first
  `ddl_optimize` rule already exist. The remaining DDL gap is narrower and more
  concrete than the earlier draft assumed: many adapters still own late
  `CREATE TABLE` rewrites (`_optimize_table_definition()` or Databricks
  `_convert_to_delta_table()`), and base schema execution still exposes the
  `platform_transform_fn` callback.

  This item does NOT introduce a new `ddl_compile` phase, a new
  `CompatibilityContext` shape, or a parallel `benchbox/sql_compat/transformers/`
  tree. The frozen phase model is sufficient:
  - `schema_emit` owns logical-to-dialect DDL policy
  - `ddl_optimize` owns post-generation statement rewrites
  - adapter `create_schema()` overrides keep only operational setup

  Goal: finish central DDL ownership inside the shipped sql_compat architecture,
  retire late adapter monkey-patching, and remove residual benchmark-level DDL
  compatibility branches so benchmarks no longer need platform-specific
  compatibility policy at schema generation time. If
  `build-sql-compat-phase-aware-pipeline` is still active when this work starts,
  fold overlapping slices into that TODO rather than landing a competing design.

work:
  - id: w1
    summary: "Amend the existing ADR and active sql_compat TODO with the correct DDL-centralization target"
    status: pending
    notes: |
      Update docs/development/adr/adr-sql-compat-phase-aware-pipeline.md and, if
      needed, the remaining notes in _project/TODO/main/active/build-sql-compat-phase-aware-pipeline.yaml
      to record the real scope:
      - no new `ddl_compile` phase
      - no `CompatibilityContext` extension in this item
      - no parallel `sql_compat/transformers/` tree
      - remaining adapter-owned DDL hooks are the work to finish

      Enumerate the exact migration inventory here: ClickHouse, Databricks,
      Databend, Firebolt, Redshift, Azure Synapse, Snowflake, Presto, Trino,
      Spark, Lakesail, Velox, and Fabric Warehouse. If a DDL rewrite needs
      statement metadata beyond raw SQL (for example Fabric Warehouse's tuning-
      aware path), amend the existing `RewriteDDLPayload` / pipeline plumbing in
      the ADR first rather than overloading `CompatibilityContext`.

      REQUIRED before closing w1: explicitly resolve and document the Fabric
      Warehouse question from open_questions — "is raw SQL sufficient or does
      RewriteDDLPayload need a richer execution contract?" Record the decision
      and its rationale in the ADR amendment. This decision gates w14, which
      in turn gates the entire w15–w18 tail; leaving it open past w1 will stall
      the work.

  - id: w2
    summary: "Move ClickHouse CREATE TABLE rewriting under Phase.DDL_OPTIMIZE rule ownership"
    status: pending
    needs: [w1]
    notes: |
      Add a ClickHouse rule module under benchbox/sql_compat/rules/ddl_optimize/
