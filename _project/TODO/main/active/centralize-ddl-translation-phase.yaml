  - id: w18
    summary: "Tighten lint, inventory, tests, and ADR wording to lock in centralized DDL ownership"
    status: pending
    needs: [w17]
    notes: |
      Update benchbox/sql_compat/inventory.py and scripts/compat_lint.py so the
