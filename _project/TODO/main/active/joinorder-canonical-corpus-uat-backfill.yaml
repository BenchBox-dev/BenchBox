    - "_project/TODO/main/planning/joinorder-spark-dialect.yaml"
    - "_project/TODO/main/planning/joinorder-sqlite-performance.yaml"
    - "_project/TODO/main/planning/joinorder-presto-ddl.yaml"
    - "_project/analysis/joinorder-canonical-corpus-uat-2026-05-12.md"
    - "tests/uat/configs/uat-joinorder-canonical-corpus-20260512.yaml"
    - "results-data/bundles/"
    - "results-data/corpus-inventory.json"
  do_not_touch:
    - "benchbox/core/joinorder/"
    - "benchbox/core/joinorder_synthetic/"

