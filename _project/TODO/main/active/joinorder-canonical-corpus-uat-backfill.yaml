id: joinorder-canonical-corpus-uat-backfill
title: "Canonical JoinOrder SF=1 UAT and corpus backfill for Issue #289"
worktree: main
priority: High
status: In Progress
category: Testing and Quality Assurance

description: |
  Complete the post-cutover canonical JoinOrder UAT that was intentionally not
  covered by the prior smoke-only cutover. The public `joinorder` benchmark now
  points at canonical IMDb 2013 (`joinorder-imdb-2013-v1`) and exposes 113 SQL
  queries at scale 1 only, but `results-data/bundles/` currently has no
  canonical `joinorder` result bundles.

  This item defines the canonical SF=1 support matrix, runs full local UAT on
  included SQL platforms, validates every clean bundle, stages only complete
  canonical results into `results-data/bundles/`, regenerates the corpus
  inventory, and confirms the old invalid `joinorder_sf1_*` synthetic bundles
  are absent.

context_sections:
  "Durable exclusions": |
    - `_project/TODO/main/planning/joinorder-datafusion-dialect.yaml` excludes
      DataFusion SQL from canonical JoinOrder support until Parquet table
      registration preserves canonical column names.
    - `_project/DONE/main/planning/track2-joinorder-dataframe-coverage.yaml`
      cleared the prior DataFrame platform exclusion by adding translations for
      the remaining 100 canonical query IDs.
    - `_project/TODO/main/planning/joinorder-spark-dialect.yaml` excludes
      Spark SQL until canonical q33c passes.
    - `_project/TODO/main/planning/joinorder-sqlite-performance.yaml` excludes
      SQLite until SF=1 can complete in an accepted UAT lane.
    - `_project/TODO/main/planning/joinorder-presto-ddl.yaml` excludes Presto
      until canonical JoinOrder DDL is rewritten for Presto.
  "Matrix": |
    Included for this backfill: `duckdb`, `clickhouse-local`, and `lakesail`
    in SQL mode at scale 1.0.

work:
  - id: w1
    summary: "Claim clean worktree and record canonical JoinOrder UAT matrix"
    status: done
    notes: |
      Claimed `/Users/joe/Developer/BenchBox.pool-02` on
      `fix/issue-289-joinorder-uat-corpus` from current `origin/develop`.
      Matrix documented in
      `_project/analysis/joinorder-canonical-corpus-uat-2026-05-12.md`.
      UAT config:
      `tests/uat/configs/uat-joinorder-canonical-corpus-20260512.yaml`.

  - id: w2
    summary: "Run full end-to-end UAT for included canonical JoinOrder SQL platforms"
    needs: [w1]
    status: done
    notes: |
      Initial sweep command:
      `BENCHBOX_OUTPUT_DIR=~/Developer/benchmark_runs make uat-sweep CONFIG=tests/uat/configs/uat-joinorder-canonical-corpus-20260512.yaml`

      Targeted follow-up commands:
      `BENCHBOX_OUTPUT_DIR=~/Developer/benchmark_runs make uat-cell PLATFORM=presto BENCHMARK=joinorder SCALE=1 PHASES=load,power TIMEOUT_S=7200 LOG_DIR=~/Developer/benchmark_runs/logs/uat_joinorder_canonical_corpus_20260512`
      `BENCHBOX_OUTPUT_DIR=~/Developer/benchmark_runs make uat-bring-up PLATFORM=lakesail TIMEOUT_S=600 BENCHMARK_RUNS_DIR=~/Developer/benchmark_runs`
      `BENCHBOX_OUTPUT_DIR=~/Developer/benchmark_runs make uat-cell PLATFORM=lakesail BENCHMARK=joinorder SCALE=1 PHASES=load,power TIMEOUT_S=7200 LOG_DIR=~/Developer/benchmark_runs/logs/uat_joinorder_canonical_corpus_20260512`

      Logs:
      `~/Developer/benchmark_runs/logs/uat_joinorder_canonical_corpus_20260512/`

      Passed and eligible: DuckDB, ClickHouse Local, LakeSail.
      Excluded after evidence: SQLite timed out before completing warmup, Spark
      failed q33c, Presto failed DDL before load.

  - id: w3
    summary: "Validate UAT result bundles for 113-query coverage and dataset identity fields"
    needs: [w2]
    status: done
    notes: |
      Checked each passed result has:
        - `benchmark.id == "joinorder"`
        - `benchmark.scale_factor == 1.0`
        - `summary.queries.total == 339`
        - 339 measurement rows
        - 113 unique measurement query IDs
        - 113 unique warmup query IDs
        - zero failed query statuses
        - `dataset_version == "joinorder-imdb-2013-v1"`
        - manifest/data archive hashes matching
          `benchbox/core/joinorder/data_manifest.toml`

      Command:
      `uv run -- python _project/scripts/verify_joinorder_corpus_backfill.py --skip-corpus`

  - id: w4
    summary: "Copy only complete clean staged bundles and manifest sidecars to results-data/bundles"
    needs: [w3]
    status: done
    notes: |
      Source is the UAT local-stage submission directory under
      `~/Developer/benchmark_runs/submissions/uat_joinorder_canonical_corpus_20260512/`.
      Copied only the three bundles that passed w3 and
      `scripts/validate_submission.py`:
        - `joinorder_sf1_duckdb_sql_20260512_202135_4bd91dc4.json`
        - `joinorder_sf1_clickhouse_local_sql_20260512_223843_3d5d76b6.json`
        - `joinorder_sf1_lakesail_sql_20260512_225022_528b8c08.json`

  - id: w5
    summary: "Regenerate and verify corpus inventory and validators"
    needs: [w4]
    status: done
    notes: |
      Ran:
        - `uv run -- python scripts/generate_corpus_inventory.py --write`
        - `uv run -- python scripts/generate_corpus_inventory.py --check`
        - `uv run -- python _project/scripts/verify_joinorder_corpus_backfill.py --skip-staged`
        - `uv run -- python scripts/validate_submission.py results-data/bundles/`
        - `uv run -- python results-data/validate_corpus.py`

      JoinOrder corpus result: `joinorder SF=1.0` now has three platforms
      (`ClickHouse Local`, `DuckDB`, `LakeSail`) and is OK.

      Residual broader corpus gate: `results-data/validate_corpus.py` still
      exits nonzero because unrelated pre-existing cohorts are below the
      three-platform threshold: `tpcds@sf0.01`, `tpcds@sf0.1`, `tpcds@sf1`,
      `ai_primitives@sf1`, and `flightdata@sf1`.

  - id: w6
    summary: "Open PR to develop after explicit-path commit and make pr-preflight"
    needs: [w5]
    status: done
    notes: |
      Staged explicit paths only and did not use `git add -A`.
      Commit: `7ab8f4431 test(joinorder): backfill canonical corpus bundles`.
      Post-commit `make pr-preflight` passed.
      PR: https://github.com/joeharris76/BenchBox/pull/389

verification:
  - description: "TODO is valid"
    command: "for f in _project/TODO/main/active/joinorder-canonical-corpus-uat-backfill.yaml _project/TODO/main/planning/joinorder-spark-dialect.yaml _project/TODO/main/planning/joinorder-sqlite-performance.yaml _project/TODO/main/planning/joinorder-presto-ddl.yaml; do uv run --project _project/scripts -- python _project/scripts/todo_cli.py validate \"$f\" || exit 1; done"
    expected_output: "valid"
  - description: "No old invalid synthetic bundles remain under canonical joinorder name"
    command: "uv run -- python - <<'PY'\nimport json\nfrom pathlib import Path\nfor path in sorted(Path('results-data/bundles').glob('joinorder_sf1_*.json')):\n    if path.name.endswith(('.manifest.json', '.plans.json', '.tuning.json')):\n        continue\n    data = json.loads(path.read_text())\n    assert data['benchmark']['id'] == 'joinorder'\n    assert data['benchmark']['dataset_version'] == 'joinorder-imdb-2013-v1'\n    print(path.name)\nPY"
    expected_output: "3 canonical joinorder_sf1 bundle names only"
  - description: "Canonical JoinOrder staged bundles have full 113-query coverage and dataset identity fields"
    command: "uv run -- python _project/scripts/verify_joinorder_corpus_backfill.py"
    expected_output: "all canonical JoinOrder bundles pass"
  - description: "Corpus inventory is current"
    command: "uv run -- python scripts/generate_corpus_inventory.py --check"
    expected_output: "OK"
  - description: "Corpus validator passes"
    command: "uv run -- python results-data/validate_corpus.py"
    expected_output: "joinorder SF=1.0: 3 platforms [OK]; command still exits nonzero on unrelated pre-existing shallow cohorts"
  - description: "Submission validator has no errors"
    command: "uv run -- python scripts/validate_submission.py results-data/bundles/"
    expected_output: "0 error(s)"

must_preserve:
  - "Do not publish partial JoinOrder runs: included platforms require 113/113 query coverage."
  - "Do not restore old `joinorder_sf1_*` synthetic bundle names."
  - "Keep raw UAT logs under `~/Developer/benchmark_runs`, not in git."
  - "Do not change canonical JoinOrder runtime/query semantics in this corpus backfill."

anti_patterns:
  - "Do not include DataFusion SQL until `joinorder-datafusion-dialect` is resolved."
  - "Do not include DataFrame platform bundles with only 13 translated queries."
  - "Do not copy a staged bundle into `results-data/bundles/` before validating its manifest sidecar hash."
  - "Do not use `git add -A`."

