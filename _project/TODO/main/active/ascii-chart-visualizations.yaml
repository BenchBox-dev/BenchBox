impact:
  business_value: |
    ASCII visualizations transform BenchBox from a "generate HTML and open browser"
    tool into a truly terminal-native experience. This is especially valuable for:
    - LLM/MCP integration where agents can interpret text charts
    - CI/CD pipelines that want visual summaries in logs
    - Remote server administration without GUI access
    - Quick iteration during benchmark development

  user_impact: |
    Users can see performance charts instantly in their terminal without context
    switching to a browser. MCP users (Claude Code) can request and interpret
    benchmark visualizations directly in conversation.

