deferred:
- id: d1
  summary: "Add data_generation_version field to BenchmarkResults for change tracking"
  reason: >
    Currently, changing base constants silently invalidates comparisons between old and new
    SF=1 results. Adding a version field would allow detecting incompatible comparisons.
    Not needed in beta, but important for GA.
  undefer_when: BenchBox reaches GA or published-results branch accumulates comparison conflicts
- id: d2
  summary: "Add --force datagen auto-detection when base constants change"
  reason: >
    After changing base constants, users with cached datagen directories silently use stale
    data. Could add a manifest hash of base constants to detect staleness. Beta users can
    use --force datagen manually.
  undefer_when: User reports confusing results due to stale datagen cache
- id: d3
  summary: "Measure actual uncompressed sizes at SF=1 for all benchmarks"
  reason: >
    Current uncompressed estimates are calculated from row_count * bytes_per_row. Running
    each benchmark at SF=1 with --compression none would give exact measurements. Deferred
    because SF=1 generation takes significant time and disk space.
  undefer_when: Harmonization changes are complete and a precise audit is needed
