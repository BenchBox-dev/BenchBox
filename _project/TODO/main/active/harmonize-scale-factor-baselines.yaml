- id: w7
  summary: "AMPLab: increase base row counts to target ~1GB uncompressed at SF=1"
  status: pending
  needs: [w2]
  notes: >
    Apply the recommended base counts from w2 research gate.
    Expected change: benchbox/core/amplab/generator.py lines 72-74.

    If w2 identifies a published AMPLab tier that produces ~1GB, match that tier's row counts.
    Otherwise, multiply all base counts proportionally to reach ~1GB uncompressed.

    Steps:
    1. Apply constant changes from w2 findings
    2. Run datagen at SF=0.01 and verify all three tables generate correctly
