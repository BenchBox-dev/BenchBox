- id: w13
  summary: "Create comprehensive datagen size validation test suite"
  status: pending
  needs: [w1, w2, w3]
  notes: >
    Create tests/unit/generators/test_scale_factor_harmonization.py.

    This work item should be built incrementally: create the test file and scaffold after
    research gates complete, then add each benchmark's size assertion as its implementation
    (w4-w12) finishes. Do not wait for all implementations — add tests as benchmarks land.

    For each benchmark that was modified, create a test that:
    1. Generates data at SF=0.01 (fast, suitable for CI)
    2. Measures the uncompressed output size (use --compression none or measure before compression)
    3. Calculates the projected SF=1 size via linear extrapolation (SF=0.01 * 100)
    4. Asserts the projected SF=1 size is within 0.8-1.3GB (±30% tolerance for SF=0.01 extrapolation)

    For spec-locked benchmarks (TPC-DS, and any marked as such by research gates):
    1. Generate at SF=0.01 and verify data is valid
    2. Document the expected size as spec-compliant (no assertion on 1GB target)

    Mark all tests with @pytest.mark.slow (datagen even at SF=0.01 takes seconds per benchmark).
    Do NOT use @pytest.mark.fast for these.

    Also validate:
    - Each benchmark still generates all expected tables at SF=0.01
    - No empty tables
    - Row counts scale linearly with SF (generate at SF=0.01 and SF=0.02, verify ~2x ratio)

