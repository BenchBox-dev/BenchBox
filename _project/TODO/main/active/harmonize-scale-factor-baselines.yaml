- id: w8
  summary: "SSB: increase base row counts per research gate findings (if spec allows)"
  status: pending
  needs: [w1]
  notes: >
    Apply w1 research gate determination.

    IF w1 determines SSB spec defines SF=1 = 6M lineorders as mandatory:
    - Document ~720MB as spec-compliant in generator docstring
    - Mark this work item as "no change — spec-locked" and skip
    - Still create a datagen test that validates the spec-compliant size

    IF w1 determines SSB base counts are adjustable:
    - Increase base_lineorders from 6_000_000 to ~8_400_000 (and dimension tables proportionally)
    - Change in benchbox/core/ssb/generator.py lines 67-70
