id: harmonize-scale-factor-baselines
title: "Harmonize scale factor baselines: SF=1 should produce ~1GB uncompressed across all benchmarks"
worktree: main
category: Core Functionality
priority: High
status: Not Started
description: >
  BenchBox convention is SF=1 produces ~1GB of uncompressed data (TPC-H baseline: ~1GB at SF=1).
  An audit of benchmark_runs/datagen/ found severe deviations once compression state is accounted
  for. Key finding: generators with CompressionMixin (SSB, JoinOrder, CoffeeShop, ClickBench,
  AMPLab, H2O) write zstd-compressed data by default (CLI compress_data=True), while generators
  inheriting only VerbosityMixin (TSBS, FlightData, NYC Taxi) write uncompressed CSV. Comparing
  on-disk sizes without accounting for this is misleading.

  Corrected picture (estimated uncompressed sizes at SF=1):
    - TPC-DS:    ~1.0GB  (on-target, official dsdgen binary)
    - ClickBench: ~0.9GB (on-target, 1M wide rows)
    - SSB:        ~720MB (0.72x under)
    - TSBS:       466MB  (0.47x under, uncompressed on disk)
    - FlightData: 416MB  (0.42x under, uncompressed on disk)
    - AMPLab:     ~450MB (0.45x under)
    - NYC Taxi:   96MB   (0.10x under, uncompressed on disk)
    - H2O DB:     ~150MB (0.15x under)
    - CoffeeShop: ~6GB   (6x OVER target)
    - JoinOrder:  ~5GB   (5x OVER target)

  TPC-H is the baseline and must not be changed. TPC-DI is out of scope.
  We are in beta -- clean break, no fallback or versioning needed.

  Each benchmark requires a research gate: review the original published specification to determine
  if scale factor sizes are a hard requirement. If a published spec defines SF=1 row counts, we
  must not deviate. If the benchmark is a BenchBox original or the spec is silent on sizing, we
  can safely adjust. Where a published benchmark defines a standard sizing tier (e.g., H2O "small"
  = 10M rows), matching that sizing is valuable and should be preferred.

context_sections:
- name: Compression Asymmetry Discovery
  summary: >
    Generators WITH CompressionMixin (write zstd-compressed data by default via CLI):
      TPC-H, TPC-DS, SSB, JoinOrder, CoffeeShop, ClickBench, AMPLab, H2O DB
    Generators WITHOUT CompressionMixin (always write uncompressed CSV):
      TSBS DevOps, FlightData, NYC Taxi

    CLI defaults: compress_data=True, compression_type="zstd" (benchbox/cli/preferences.py:89-90).
    Generators without CompressionMixin ignore these settings silently.

    Adding CompressionMixin to the three uncompressed generators is in scope for this TODO,
    provided it does not violate the benchmark's published specification.

- name: Scale Factor Storage & Migration Impact
  summary: >
    scale_factor is stored in:
    - Result JSON: BenchmarkResults.scale_factor (float) in models.py:263
    - Result filenames: {benchmark}_{sfX}_{platform}_{timestamp}_{exec_id}.json
    - Datagen directories: {benchmark}_{sf}_data/
    - Database names: {benchmark}_{sf}_{config}.duckdb

    Changing base constants means old SF=1 data and new SF=1 data differ silently.
    Since we are in beta, this is a clean break -- no versioning or fallback needed.
    Users must regenerate data after this change. Expected results in
    benchbox/core/expected_results/ must be updated where applicable.

- name: Key Code Locations
  summary: >
    | Benchmark | Generator File | Scale Factor Line(s) |
    |-----------|---------------|---------------------|
    | SSB | core/ssb/generator.py | 67-71 (base_lineorders, base_customers, etc.) |
    | JoinOrder | core/joinorder/generator.py | 82-109 (base_row_counts dict) |
    | CoffeeShop | core/coffeeshop/generator.py | 338 (50_000_000 * scale_factor) |
    | TSBS | core/tsbs_devops/generator.py | 35-36 (DEFAULT_HOSTS, DEFAULT_DURATION_DAYS), 89-90 |
    | FlightData | core/flightdata/downloader.py | 93 (scale_factor * 17 months) |
    | NYC Taxi | core/nyctaxi/downloader.py | 356 (scale_factor / 100.0) |
    | AMPLab | core/amplab/generator.py | 72-74 (base_rankings, base_uservisits, base_documents) |
    | H2O DB | core/h2odb/generator.py | 71 (base_trips = 1000000) |
    | ClickBench | core/clickbench/generator.py | 57 (1_000_000 * scale_factor) |
    | TPC-DS | core/tpcds/generator/manager.py | Uses official dsdgen binary |

files_affected:
- change_type: Modified
  paths:
  - benchbox/core/coffeeshop/generator.py
  - benchbox/core/joinorder/generator.py
  - benchbox/core/ssb/generator.py
  - benchbox/core/tsbs_devops/generator.py
  - benchbox/core/flightdata/downloader.py
  - benchbox/core/nyctaxi/downloader.py
  - benchbox/core/amplab/generator.py
  - benchbox/core/h2odb/generator.py
  - benchbox/core/clickbench/generator.py
- change_type: New
  paths:
  - tests/unit/generators/test_scale_factor_harmonization.py

must_preserve:
- TPC-H generator unchanged -- it is the calibration baseline
- TPC-DS uses official dsdgen binary -- do not override its internal scale logic
- All existing query sets, schemas, and SQL files unchanged -- only row counts/volume change
- Benchmarks must still produce valid data at SF=0.01 (CI/testing scale)
- Generators with CompressionMixin continue compressing; adding compression to new generators must not break uncompressed-output mode (--compression none)
- Scale factor validation in base_benchmark.py (SF > 0, SF >= 1 must be integer) unchanged

anti_patterns:
- DO NOT introduce a global calibration multiplier layer that adjusts SF before passing to generators -- because this hides the actual row count relationship and makes debugging scale issues harder -- instead change the base constants directly in each generator
- DO NOT change row counts for benchmarks whose published specification defines SF=1 cardinalities -- because this makes BenchBox results incomparable to other implementations of the same benchmark -- instead document the deviation from 1GB as spec-compliant
- DO NOT change TPC-DS scale factor handling -- because it uses the official dsdgen binary and the TPC Council defines SF semantics -- accept ~1GB as already on target
- DO NOT add backwards-compatibility shims or legacy_scale_factor fields -- because we are in beta and a clean break is appropriate -- just change the constants and update tests
- DO NOT estimate uncompressed sizes by guessing compression ratios -- because generators have different compression states -- instead calculate from row_count * bytes_per_row or run with --compression none to measure directly

verification:
- description: All fast tests pass after all changes
  command: uv run -- python -m pytest -m fast -q
  expected_output: all pass, 0 failures
- description: Each modified benchmark generates data at SF=0.01 without error
  command: >
    for bench in ssb joinorder coffeeshop tsbs_devops flightdata nyctaxi amplab h2odb clickbench; do
      echo "=== $bench ===" && uv run -- benchbox run --platform duckdb --benchmark $bench --scale 0.01 --phases generate --dry-run;
    done
  expected_output: all dry runs complete without error
- description: New datagen size tests validate SF=1 uncompressed output within 10% of 1GB
  command: uv run -- python -m pytest tests/unit/generators/test_scale_factor_harmonization.py -v
  expected_output: all pass

scope_limit:
  only_modify:
  - benchbox/core/ssb/generator.py
  - benchbox/core/joinorder/generator.py
  - benchbox/core/coffeeshop/generator.py
  - benchbox/core/tsbs_devops/generator.py
  - benchbox/core/flightdata/downloader.py
  - benchbox/core/nyctaxi/downloader.py
  - benchbox/core/amplab/generator.py
  - benchbox/core/h2odb/generator.py
  - benchbox/core/clickbench/generator.py
  - tests/unit/generators/
  do_not_modify:
  - benchbox/core/tpch/
  - benchbox/core/tpcds/
  - benchbox/core/tpcdi/
  - benchbox/core/*/queries.py
  - benchbox/core/*/schema.py
  - benchbox/platforms/

success_metrics:
- All benchmarks produce 0.8-1.3GB uncompressed data at SF=1 (or are documented as spec-compliant exceptions)
- TSBS, FlightData, NYC Taxi gain CompressionMixin support (if spec allows)
- No regressions in existing test suite
- Each benchmark has a datagen test validating SF=1 output size

metadata:
  owners:
  - '@benchbox-maintainers'
  tags:
  - datagen
  - scale-factor
  - benchmarks
  - harmonization
  estimated_effort: 2-3 weeks
  created_date: '2026-04-07'
  dependencies: []
  notes: >
    Originated from audit of benchmark_runs/datagen/ directory sizes. The initial audit
    compared compressed and uncompressed on-disk sizes as equivalent, which was misleading.
    CoffeeShop and JoinOrder are actually OVER target (not under), while TPC-DS and ClickBench
    are already near target (not undersized). The corrected analysis drives this harmonization.

work:
# ============================================================================
# RESEARCH GATES — Must complete before any implementation
# ============================================================================
- id: w1
  summary: "Research gate: spec-governed benchmarks (TPC-DS, SSB, ClickBench)"
  status: pending
  notes: >
    For each benchmark, find and read the original published specification or paper:

    **TPC-DS** (likely already on target):
    - Read the TPC-DS specification (check _sources/tpc-ds/specification/ if available)
    - Confirm: SF=1 in TPC-DS produces ~1GB per the official spec
    - Determine: the 379MB compressed / ~1GB uncompressed finding — is this confirmed?
    - Decision: if confirmed on-target, mark TPC-DS as "no change needed, spec-compliant"

    **SSB (Star Schema Benchmark)**:
    - Find the original SSB paper (Pat O'Neil et al., 2007)
    - Key question: does the SSB spec define SF=1 = 6M lineorder rows as a hard requirement?
    - If yes: document SSB ~720MB as spec-compliant, mark as out-of-scope for harmonization
    - If the paper only uses 6M as an example but doesn't mandate it: safe to increase

    **ClickBench**:
    - Find the original ClickBench benchmark definition (ClickHouse team, GitHub)
    - The original uses 99,997,497 real records (a single fixed dataset, not scalable)
    - BenchBox uses synthetic generation with 1M base records — this is already a deviation
    - Since BenchBox's generator is custom and already ~0.9GB at SF=1: likely no change needed
    - If the ClickBench spec defines a standard dataset size, document compliance status

    **Output for each**: determination of "spec-locked" vs "adjustable" with citation.
    Record whether spec mandates specific row counts at SF=1 or just uses them as defaults.
    If adjustable, record the recommended target row counts for ~1GB uncompressed.

- id: w2
  summary: "Research gate: synthetic benchmarks (CoffeeShop, JoinOrder, AMPLab, H2O DB)"
  status: pending
  notes: >
    For each benchmark, determine if there is a published specification that constrains SF sizing:

    **CoffeeShop**:
    - Reference: https://github.com/JosueBogran/coffeeshopdatageneratorv2
    - This is a BenchBox-adapted benchmark inspired by a public generator, not a published spec
    - Likely fully adjustable — confirm no published paper defines 50M orders as canonical
    - Current: 50M orders → ~6GB uncompressed (6x over). Target: ~8M orders → ~1GB
    - Decision: determine exact base order count for ~1GB uncompressed output

    **JoinOrder (JOB)**:
    - Reference: "How Good Are Query Optimizers, Really?" (Leis et al., VLDB 2015)
    - The original JOB uses real IMDB data (~3.6GB). BenchBox uses synthetic IMDB-like data
    - Key question: does the paper define specific table cardinalities as part of the benchmark?
    - If yes (e.g., cast_info must be 36M rows for queries to be valid): cannot reduce
    - If the paper only requires "IMDB-scale" data: can reduce proportionally
    - Research whether reducing cardinality by 5x would change join order optimization behavior
    - Current: ~72M total rows → ~5GB uncompressed. Target: ~14M rows → ~1GB
    - Validate: at reduced cardinality, do JOB queries still exercise multi-way joins effectively?

    **AMPLab (Big Data Benchmark)**:
    - Reference: AMPLab Big Data Benchmark (UC Berkeley, 2013)
    - The original defines specific "tiny" (rank ~160K, uv ~200K), "1node" (rank ~18M, uv ~155M),
      "5nodes" tiers
    - Key question: does BenchBox's base_rankings=100K, base_uservisits=1M match a published tier?
    - If a published tier produces ~1GB: match that tier for SF=1
    - If no tier matches 1GB: adjustable (the benchmark is a synthetic generator)
    - Determine the recommended base counts to reach ~1GB uncompressed

    **H2O DB (db-benchmark)**:
    - Reference: https://github.com/h2oai/db-benchmark (H2O.ai, 2018)
    - The original defines tiers: 0.5GB, 5GB, 50GB
    - Key question: does the 0.5GB tier correspond to ~1M rows? What does 1GB correspond to?
    - The standard "small" tier uses 10M rows — matching this is valuable and important
    - If 10M rows produces ~1.5GB: use 10M anyway (matching a published sizing takes precedence)
    - If there is a tier that naturally produces ~1GB: prefer that
    - Determine the recommended base_trips value

    **Output for each**: "spec-locked" or "adjustable" determination with citation, plus the
    recommended new base constant value if adjustable.

    **Note**: This gate bundles 4 benchmarks. If any single benchmark's research proves complex
    (e.g., JOB paper analysis + join-plan validation), split it into a separate gate rather than
    blocking CoffeeShop/AMPLab/H2O implementations that may be straightforward.

- id: w3
  summary: "Research gate: real-data & time-series benchmarks (TSBS, FlightData, NYC Taxi) + compression"
  status: pending
  notes: >
    For each benchmark, review the published specification AND determine:
    (a) whether SF has a semantic meaning that should be preserved
    (b) whether adding CompressionMixin violates the spec
    (c) whether increasing data volume would change benchmark characteristics

    **TSBS DevOps**:
    - Reference: https://github.com/timescale/tsbs (TimescaleDB TSBS)
    - The original tsbs_generate_data uses configurable hosts and duration
    - Key question: does the TSBS spec define "100 hosts, 1 day" as canonical SF=1?
    - Key question: should we increase hosts (100→N), duration (1→N days), or both?
    - Increasing hosts changes cardinality (more distinct time series). Increasing days changes
      temporal coverage. These have different benchmark characteristics — determine which is
      preferred for join/aggregation query patterns used in BenchBox's TSBS query set
    - CompressionMixin: TSBS currently outputs uncompressed CSV. Adding compression is likely
      fine — the TSBS spec is about query patterns, not file format. Confirm.

    **FlightData**:
    - Reference: US Bureau of Transportation Statistics (BTS) dataset
    - No formal benchmark specification — this is a real-data analytics benchmark
    - Code comments claim SF=1 ≈ 1GB (downloader.py:91) but actual is 416MB uncompressed
    - Key question: is the 416MB from synthetic fallback or real BTS download?
    - If synthetic: the synthetic generator may undercount rows per month. Investigate.
    - If real: 17 months of BTS data may produce less than the 600K flights/month estimate
    - Determine: should multiplier change from 17 to ~41, or should bytes-per-flight increase?
    - CompressionMixin: FlightData outputs uncompressed CSV. Adding compression is safe.

    **NYC Taxi**:
    - Reference: NYC TLC Trip Record Data (public dataset)
    - No formal benchmark specification — this is a real-data analytics benchmark
    - Current: sample_rate = SF/100, so SF=1 = 1% sample → 96MB uncompressed
    - Key question: what sample rate produces ~1GB? Is SF=1 → 10% sample appropriate?
    - Changing divisor from 100 to 10 makes SF=1 = 10% sample, SF=10 = full dataset
    - Validate: this preserves reasonable SF semantics (SF=0.01 for CI still works)
    - CompressionMixin: NYC Taxi outputs uncompressed CSV. Adding compression is safe.

    **Output for each**: recommended constant change, compression decision, and any
    semantic meaning to preserve in documentation/comments.

# ============================================================================
# IMPLEMENTATIONS — Oversized benchmarks (reduce to ~1GB)
# ============================================================================
- id: w4
  summary: "CoffeeShop: reduce base order count to target ~1GB uncompressed at SF=1"
  status: pending
  needs: [w2]
  notes: >
    Apply the recommended base order count from w2 research gate.
    Expected change: benchbox/core/coffeeshop/generator.py line 338.
    Likely: 50_000_000 → value determined by research (~8M if no spec constraint).

