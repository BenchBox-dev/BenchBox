    6. Run fast tests to verify no regressions

# ============================================================================
# IMPLEMENTATIONS — Undersized synthetic benchmarks (increase to ~1GB)
# ============================================================================
- id: w6
  summary: "H2O DB: increase base_trips to match published tier targeting ~1GB at SF=1"
  status: pending
  needs: [w2]
  notes: >
    Apply the recommended base_trips from w2 research gate.
    Expected change: benchbox/core/h2odb/generator.py line 71.

    If w2 determines H2O's published 0.5GB tier = X rows and 1GB tier = Y rows, use Y.
    If H2O's "small" tier (10M rows) is the closest standard sizing, use 10M even if it
    produces ~1.5GB — matching a published sizing takes precedence over exact 1GB parity.

    Steps:
    1. Apply constant change from w2 findings
    2. Run datagen at SF=0.01 and verify output
    3. Create/update unit test for H2O DB datagen size validation (see w14)
    4. Update docstring in generator ("SF=1 = ~1M trips" → new value)
