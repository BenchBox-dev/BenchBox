    1. Apply constant change from w2 findings
    2. Run datagen at SF=0.01 and verify output is proportionally smaller
    3. Create/update unit test for CoffeeShop datagen size validation (see w14)
    4. Update any docstrings claiming "SF=1 = 50M orders"
    5. Run fast tests to verify no regressions

