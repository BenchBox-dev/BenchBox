id: coverage-current-bottom-25-modules-to-80pct-apr-2026
title: "Bring the current 25 lowest-coverage non-publishing modules to 80% fast-test coverage"
worktree: main
priority: Medium-High
status: In Progress
description: |
  Fresh baseline from `.coverage` rendered via `uv run -- python -m coverage json`
  at 2026-04-02 19:03:25 local time shows overall fast-lane coverage at 82.87%
  (88,387 / 106,663 measured statements).

  This ranking already excludes coverage-ignore lines from the denominator:
    - `[tool.coverage.run].omit` entries are not in the measured file set
    - `[tool.coverage.report].exclude_lines` and `pragma: no cover` are not in
      `num_statements`

  This plan also explicitly excludes the in-flight results-publishing surface:
    - `benchbox/core/publishing/**/*.py`
    - `benchbox/cli/commands/submit.py`

  Filtered bottom-25 modules and current gap to 80%:
    platforms/databricks/dataframe_adapter.py          23.57% ->  +89 lines
    platforms/spark.py                                 46.04% -> +133 lines
    platforms/credentials/redshift.py                  51.91% -> +118 lines
    core/transaction_primitives/dataframe_operations.py 56.45% -> +88 lines
    platforms/clickhouse/diagnostics.py                57.30% ->  +21 lines
    core/write_primitives/benchmark.py                 58.39% -> +105 lines
    core/tuning/generators/pg_mooncake.py              59.09% ->   +5 lines
    metadata_primitives.py                             59.38% ->   +7 lines
    core/tpcds/generator/manager.py                    59.63% ->  +45 lines
    core/ssb/generator.py                              59.78% ->  +55 lines
    platforms/databricks/credentials.py                60.22% ->  +37 lines
    core/tpcdi/etl/error_recovery.py                   60.34% ->  +58 lines
    core/datavault/benchmark.py                        60.49% ->  +32 lines
    experimental/gpu/benchmark.py                      60.87% ->  +40 lines
    platforms/base/cloud_spark/mixins.py               61.01% ->  +61 lines
    platforms/aws/glue_adapter.py                      61.15% ->  +49 lines
    platforms/dataframe/iceberg_maintenance.py         61.46% ->  +36 lines
    platforms/questdb.py                               61.61% ->  +94 lines
    experimental/aiml_functions/benchmark.py           61.66% ->  +36 lines
    platforms/lakesail.py                              61.68% ->  +62 lines
    core/coffeeshop/dataframe_queries/queries.py       61.81% ->  +47 lines
    platforms/firebolt.py                              62.17% -> +121 lines
    platforms/dataframe/expression_family.py           62.18% ->  +69 lines
    platforms/clickhouse_cloud.py                      62.41% ->  +75 lines
    core/amplab/dataframe_queries/queries.py           62.50% ->  +31 lines

  Total remaining gap across the filtered set: about 1,514 newly covered lines.

  Sequencing rules for this item:
  1. Harvest low-cost pure/helper wins first.
  2. Build reusable DataFrame and cloud-Spark fixtures before the adapters that
     depend on them.
  3. Keep heavyweight adapters isolated one per work unit when the branch
     surface is wide enough to justify dedicated review and rollback.
  4. Do not spend time on results-publishing code until its productization TODO
     stabilizes the public surface.

category: Testing & Quality

metadata:
  tags:
  - testing
  - coverage
  - fast-lane
  - module-floor
  estimated_effort: "Extra Large"
  created_date: "2026-04-02"
  source_review: "April 2, 2026 fast-lane coverage audit from /tmp/coverage_apr2.json"

impact:
  user_impact: |
    None directly. This is test-only work aimed at exposing latent regressions in
    weakly covered platform adapters and benchmark wrappers before they reach users.
  maintainer_impact: |
    Replaces the current "overall total is green, but local blind spots remain"
    situation with a per-module floor across the weakest measured files. This makes
    future refactors safer and reduces surprise gate failures.
  technical_debt: |
    The bottom of the coverage distribution is still concentrated in large adapter
    modules and shared DataFrame abstractions. This plan reduces that debt using
    hermetic fast tests instead of broadening ignore rules.

justification: |
  Overall coverage is healthy enough to pass the 80% gate, but the lower tail is
  still fragile: the weakest filtered module is at 23.57%, and 11 of the 25 files
  are below 60%. That distribution means routine adapter work can reintroduce
  regressions in branch-heavy code without materially moving the total.

  Raising the April 2, 2026 bottom-25 set to >=80% gives a stable per-module floor
  while explicitly avoiding the in-flight publishing surface and any lines already
  excluded by policy.

