scope_limit:
  only_modify:
  - "tests/unit/** for the named target modules"
  - "tests/integration/** only if a named unit explicitly calls for an existing helper adjustment"
  - "the named production modules only when a tiny test seam is unavoidable"
  - "_project/TODO/main/planning/coverage-current-bottom-25-modules-to-80pct-apr-2026.yaml"
  do_not_modify:
  - "benchbox/core/publishing/**"
  - "benchbox/cli/commands/submit.py"
  - "results-explorer/**"
  - "pyproject.toml coverage omit/exclude settings"
  - "unrelated production modules outside the 25-file target set"

success_metrics:
- "All 25 filtered target modules report >= 80% coverage in the post-wave fast-lane coverage JSON."
- "No new coverage-omit or coverage-ignore rules are introduced."
- "`make coverage-fast` passes after the final work unit."
- "The April 2, 2026 filtered ranking is exhausted and must be regenerated before opening any follow-up wave."
