- summary: "Results-publishing coverage work"
  reason: "Explicitly excluded from this item: `benchbox/core/publishing/**/*.py` and `benchbox/cli/commands/submit.py` are
    still in flight and should be planned against the publishing productization TODOs instead of this coverage wave."
- summary: "Coverage-ignored lines and omit-listed modules"
  reason: "Anything already excluded by `[tool.coverage.run].omit`, `[tool.coverage.report].exclude_lines`, or `pragma: no
    cover` is intentionally out of scope; this item targets only measured statements."

must_preserve:
- "All new tests stay in the fast lane: mark them `@pytest.mark.fast` when appropriate and keep every scenario hermetic."
- "No new coverage ignore rules, omit entries, or `pragma: no cover` annotations are added to hit the target."
- "Results-publishing code stays untouched in this item."
- "Assertions must verify actual SQL strings, config values, returned dataclasses, or error messages; import-only tests do
  not count."
- "Existing adapter behavior and public CLI/config contracts remain unchanged."

approach: |
  Use the April 2, 2026 filtered ranking as the fixed baseline for this wave.
  Sequence the work so shared fixture layers are built once and reused:
  DataFrame foundation (w2) before DataFrame transaction/query work (w3-w4),
  cloud-Spark mixins (w9) before Spark/LakeSail (w10-w11), and transaction
  semantics (w3) before the write-primitives benchmark paths (w18).

  Heavyweight adapters are intentionally isolated one module per work unit
  (w7-w16, w18-w19) so each implementation step can land as a single-purpose
  commit with module-local rollback.

  Extend existing coverage-focused test files wherever the repo already has them.
  Only add new dedicated test files when current coverage is scattered across generic
  test modules and a focused file will make the missing branches easier to own.
  Planned-new files are named explicitly with `Add ...`; existing files to be
  extended are named explicitly with `Extend ...`.

anti_patterns:
- "DO NOT add blanket import/smoke tests -- because they create coverage theater -- assert concrete outputs, SQL fragments,
  state transitions, and error text instead."
- "DO NOT use live cloud accounts, real Spark clusters, or real sockets to raise unit coverage -- because the fast lane must
  remain hermetic -- patch SDK clients, Spark builders, subprocesses, file I/O, and network probes."
- "DO NOT change coverage policy to make the denominator smaller -- because that hides risk rather than reducing it -- close
  the gap with executable tests."
- "DO NOT touch `benchbox/core/publishing/**`, `benchbox/cli/commands/submit.py`, or `results-explorer/` in this item -- because
  that surface is still moving -- keep those changes in the publishing stream."
- "DO NOT mix multiple heavyweight adapters into one implementation commit -- because diagnosis and rollback get harder --
  land one work unit at a time with module-local verification."

