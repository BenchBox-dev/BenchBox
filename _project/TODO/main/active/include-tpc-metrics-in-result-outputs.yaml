title: "Include TPC Metrics (Power@Size, Throughput@Size, QphH/QphDS@Size) in All Result Outputs"
worktree: main
priority: High
status: In Progress
category: Core Functionality

description: |
  TPC benchmark metrics (Power@Size, Throughput@Size, QphH@Size/QphDS@Size) are currently
  calculated correctly in power/throughput test runners and displayed in CLI output, but
  they are NOT propagated to BenchmarkResults or included in JSON result files.

  These metrics are a KEY DIFFERENTIATOR for BenchBox - they are the official TPC
  benchmark performance metrics that users need for comparison and reporting.

  Implementation uses `qph_at_size` as a single internal field, with the H/DS suffix
  only added for presentation/output based on benchmark type.

tasks:
  phases:
    - phase: "Phase 1: Schema and Model Updates"
      done: true
      items:
        - summary: "Use qph_at_size as single internal field in BenchmarkResults"
          done: true
        - summary: "Update _build_tpc_metrics() in schema.py to output qphh_at_size or qphds_at_size based on benchmark type"
          done: true
        - summary: "Update loader.py to read either qphh_at_size or qphds_at_size from JSON into qph_at_size"
          done: true
        - summary: "Update database.py to use qph_at_size field"
          done: true

    - phase: "Phase 2: Metric Propagation in Adapter"
      done: true
      items:
        - summary: "Cache power test result in _execute_tpch_power_test()"
          done: true
        - summary: "Cache power test result in _execute_tpcds_power_test()"
          done: true
        - summary: "Extract cached metrics when creating PowerTestPhase"
          done: true
        - summary: "Calculate composite metric (qph_at_size) before calling create_enhanced_benchmark_result"
          done: true

    - phase: "Phase 3: Result Creation Update"
      done: true
      items:
        - summary: "Update create_enhanced_benchmark_result() in base.py to accept and pass TPC metrics"
          done: true

    - phase: "Phase 4: Testing and Validation"
      done: true
      items:
        - summary: "Verify schema outputs qphh_at_size for TPC-H and qphds_at_size for TPC-DS"
          done: true
        - summary: "Update test_database.py to use qph_at_size"
          done: true
        - summary: "Update test_loader.py to use qph_at_size"
          done: true
        - summary: "All existing tests pass"
          done: true

metadata:
  tags:
    - tpc-metrics
    - results
    - json-output
    - tpc-h
    - tpc-ds
  estimated_effort: "2-3 days"
  created_date: "2026-01-25"

impact:
  business_value: |
    TPC metrics are the official benchmark performance metrics that enable users to
    compare BenchBox results with published TPC results and other benchmarking tools.
    Including these in all outputs is essential for BenchBox's value proposition.
  user_impact: |
    Users will have access to Power@Size, Throughput@Size, and QphH/QphDS@Size metrics
    in their JSON result files, enabling automated reporting, trend analysis, and
    comparison with industry benchmarks.

files_affected:
  modified:
    - "benchbox/core/results/models.py"
    - "benchbox/core/results/schema.py"
    - "benchbox/core/results/loader.py"
    - "benchbox/core/results/database.py"
    - "benchbox/platforms/base/adapter.py"
    - "benchbox/base.py"
    - "tests/unit/core/results/test_database.py"
    - "tests/unit/core/results/test_loader.py"

success_metrics:
  - "TPC-H JSON results contain tpc_metrics.power_at_size when power phase runs"
  - "TPC-H JSON results contain tpc_metrics.throughput_at_size when throughput phase runs"
  - "TPC-H JSON results contain tpc_metrics.qphh_at_size when both phases run"
  - "TPC-DS JSON results contain tpc_metrics.qphds_at_size when both phases run"
  - "Non-TPC benchmarks (SSB, ClickBench) do not include tpc_metrics block"
  - "All existing tests continue to pass"
