id: results-explorer-uat-defect-submit-dry-run-validation-parity
title: "UAT defect: submit dry-run misses hosted submission validation errors"
worktree: main
priority: "Medium-High"
status: "In Progress"
category: "Developer Experience"

description: |
  `benchbox submit --dry-run` exited 0 for
  `amplab_sf001_clickhouse_local_sql_20260502_185809_f2e17de5.json`, but the
  same packaged bundle later failed `scripts/validate_submission.py` because of
  the normalized-cost contract. This contradicts the hosted-results contract
  text that says dry-run runs client-side validations.

work:
- id: w1
  summary: "Compare submit dry-run validation with scripts/validate_submission.py"
  status: done
  notes: |
    Research 2026-05-03:
    - UAT evidence:
      `/Users/joe/Developer/benchmark_runs/results/amplab_sf001_clickhouse_local_sql_20260502_185809_f2e17de5.json`
      and the packaged copy under
      `/Users/joe/Developer/benchmark_runs/submissions/uat_20260502/bundle/`
      reproduce the drift.
    - `uv run -- python scripts/validate_submission.py <packaged-bundle>` exits
      1 with `Public leaderboard cost totals require normalized cost availability:
      cost.total_usd cannot accompany cost_status 'unavailable'`.
    - `uv run -- benchbox submit <result> --dry-run --output /tmp/benchbox-submit-dryrun-check`
      exits 0 and prints the PR-package preview; the dry-run writes no output
      files.
    - `uv run -- benchbox submit <result> --dry-run --service` exits 0 and
      prints the hosted upload preview with no credentials.
    - Divergence owner: `benchbox/cli/commands/submit.py` returns from both
      dry-run paths before running the shared `scripts.validate_submission`
      rules. The validator already owns the publish-blocking bundle contract;
      do not duplicate it.
    - Database cleanup checkpoint: this work unit created no database outputs.
      The only database-tree artifact was an empty
      `/Users/joe/Developer/benchmark_runs/databases/flightdata_sf1` directory,
      which was pruned. Reusable datagen under
      `/Users/joe/Developer/benchmark_runs/datagen` is preserved because it is
      shared across benchmarks such as TPC-H/read-primitives reuse.
- id: w2
  summary: "Make dry-run fail on the same publish-blocking bundle errors"
  needs: [w1]
  status: pending
  notes: |
    Owned files for implementation: `benchbox/cli/commands/submit.py` and this
    TODO file. Reuse/call `scripts.validate_submission.validate_bundles` and
    `format_summary`; do not move or fork `scripts/validate_submission.py`
    because `tests/integration/test_cross_branch_validator_contract.py` expects
    byte-identical validator code and fixture sync.
- id: w3
  summary: "Add CLI regression coverage for dry-run validation parity"
  needs: [w2]
  status: pending
  notes: |
    Owned files for tests: `tests/unit/cli/commands/test_submit.py`, plus this
    TODO file for status/verification notes. Add targeted CLI coverage for both
    PR-package dry-run and hosted dry-run rejecting a bundle that
    `scripts.validate_submission` rejects.

verification:
- description: "Dry-run rejects a known invalid bundle with the same validator error class."
  command: "uv run -- python -m pytest tests -k 'submit and dry_run and validation' -q"
  expected_output: "selected submit dry-run validation tests pass"
- description: "Submission validator still accepts valid bundles."
  command: "uv run -- python scripts/validate_submission.py results-data/bundles"
  expected_output: "valid committed bundles pass"

must_preserve:
- "Dry-run remains offline/local and does not upload results."
- "Valid result dry-runs still show the PR-ready package preview."

anti_patterns:
- "DO NOT duplicate divergent validation logic -- because drift caused this defect -- share or call the same validation rules
  where practical."

scope_limit:
  only_modify:
  - "_project/TODO/main/active/results-explorer-uat-defect-submit-dry-run-validation-parity.yaml"
  - "_project/DONE/main/active/results-explorer-uat-defect-submit-dry-run-validation-parity.yaml"
  - "benchbox/cli/commands/submit.py"
  - "tests/unit/cli/commands/test_submit.py"
  do_not_modify:
  - "scripts/validate_submission.py"
  - "tests/fixtures/published_results_validator.py"

metadata:
  tags: [uat, submission-flow, dry-run]
  created_date: "2026-05-03"
