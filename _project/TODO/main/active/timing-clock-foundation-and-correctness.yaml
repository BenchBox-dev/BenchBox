id: timing-clock-foundation-and-correctness
title: "Establish centralized clock module and fix timing correctness bugs"
worktree: main
priority: High
status: In Progress
category: Core Functionality
description: |
  Build the timing foundation for BenchBox runtime code by introducing a shared
  clock utility and fixing correctness-critical timing bugs discovered during
  adversarial review.

  This item covers the first implementation phase:
  1) Create centralized monotonic/wall-clock helpers in a reusable module.
  2) Fix the monotonic-to-wall-clock timestamp bug in core timing collection.
  3) Convert high-risk timeout/retry loops to monotonic elapsed logic.
  4) Migrate MCP benchmark elapsed calculations to monotonic timing.
  5) Stabilize resource-rate elapsed calculations with monotonic deltas.

  This phase is intentionally scoped to correctness and foundation APIs so later
  timing migrations can proceed with low ambiguity and low regression risk.

metadata:
  owners:
  - joe
  tags:
  - timing
  - monotonic
  - perf-counter
  - correctness
  - technical-debt
  estimated_effort: 2-3 days
  created_date: '2026-02-12'

impact:
  business_value: |
    Prevents incorrect timing metadata and timeout behavior in benchmark-critical
    paths, improving trustworthiness of reported results.
  technical_debt: |
    Removes fragmented timing patterns by creating a single runtime clock utility
    used by all subsequent timing refactors.

files_affected:
  modified:
  - benchbox/core/results/timing.py
  - benchbox/platforms/datafusion.py
  - benchbox/core/write_primitives/benchmark.py
  - benchbox/platforms/onehouse/onehouse_client.py
  - benchbox/mcp/tools/benchmark.py
  - benchbox/monitoring/profiler.py
  added:
  - benchbox/utils/clock.py
  - tests/unit/utils/test_clock.py
  - tests/unit/core/results/test_timing_collector.py

must_preserve:
- "All existing benchmark result schemas and export formats remain backward compatible"
- "DataFusion and write-primitives lock behavior remains owner-safe and reentrant"
- "Resource profiler timeline timestamps remain human-readable wall-clock values"

approach: |
  Introduce `benchbox/utils/clock.py` with explicit separation of concerns:
  monotonic elapsed timing (`mono_time`, `elapsed_seconds`, stopwatch/context)
  and wall-clock event timestamps (`utc_now`).

  Update correctness hotspots first, with targeted tests:
  - Replace perf_counter-to-datetime conversion bug in core results timing.
  - Replace timeout arithmetic in lock/poll loops with monotonic elapsed checks.
  - Keep persisted event timestamps in UTC wall clock where semantically required.

anti_patterns:
- "DO NOT derive datetime from perf_counter values — because perf_counter is process-relative — capture wall-clock timestamps
  separately"
- "DO NOT replace audit timestamps with monotonic values — because they are not globally meaningful — keep utc wall-clock
  for event logs"
- "DO NOT refactor broad runtime modules in this item — because this phase is correctness-first — defer wider migration to
  follow-up TODOs"

verification:
- description: "New timing utility unit tests pass"
  command: "uv run -- python -m pytest tests/unit/utils/test_clock.py -v"
  expected_output: "All tests pass"
- description: "Core timing collector regression test validates timestamp correctness"
  command: "uv run -- python -m pytest tests/unit/core/results/test_timing_collector.py -v"
  expected_output: "All tests pass and no monotonic-derived wall-clock timestamps"
- description: "DataFusion adapter lock tests remain green after timeout clock migration"
  command: "uv run -- python -m pytest tests/unit/platforms/test_datafusion_adapter.py -k working_dir_lock -q"
  expected_output: "Selected tests pass"
- description: "MCP benchmark tool timing tests pass after monotonic elapsed migration"
  command: "uv run -- python -m pytest tests/unit/mcp/test_benchmark_tools.py -k execution_time -q"
  expected_output: "Selected tests pass"

scope_limit:
  only_modify:
  - benchbox/utils/clock.py
  - benchbox/core/results/timing.py
  - benchbox/platforms/datafusion.py
  - benchbox/core/write_primitives/benchmark.py
  - benchbox/platforms/onehouse/onehouse_client.py
  - benchbox/mcp/tools/benchmark.py
  - benchbox/monitoring/profiler.py
  - tests/unit/utils/test_clock.py
  - tests/unit/core/results/test_timing_collector.py
  - tests/unit/platforms/test_datafusion_adapter.py
  - tests/unit/mcp/test_benchmark_tools.py

success_metrics:
- "No perf_counter values are converted using datetime.fromtimestamp in runtime timing paths"
- "Timeout loops in listed files use monotonic elapsed calculations"
- "Centralized clock module exists and is used by at least 3 runtime call sites"

