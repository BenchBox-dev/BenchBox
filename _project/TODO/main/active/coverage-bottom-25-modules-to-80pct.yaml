id: coverage-bottom-25-modules-to-80pct
title: "Bring the 25 lowest-coverage modules to 80% fast-test coverage"
worktree: main
priority: Medium-High
status: In Progress
description: |
  Current fast-test coverage sits at 80.04% (85,262 / 106,518 lines) — just 47
  covered lines above the 80% threshold. The buffer is dangerously thin: a single
  bad merge could drop us below the gate.

  This item systematically brings the 25 lowest-coverage modules up to ≥80% each,
  adding robustness to the overall coverage floor and reducing the risk of accidental
  regression below the gate.

  Coverage gaps (lines needed to reach 80% per module):
    databricks/dataframe_adapter.py      23.57% →  +89 lines
    dataframe/pyspark_df.py              28.06% → +145 lines
    azure/spark_execution_utils.py       34.78% →  +21 lines
    databricks/adapter.py                41.68% → +396 lines
    bigquery.py                          42.15% → +321 lines
    redshift.py                          42.98% → +435 lines
    spark.py                             46.04% → +133 lines
    snowflake.py                         46.43% → +245 lines
    dataframe/lakesail_df.py             48.94% →  +88 lines
    credentials/redshift.py              50.96% → +121 lines
    tpcds/generator/streaming.py         52.20% →  +57 lines
    motherduck.py                        52.60% →  +42 lines
    base/cloud_spark/staging.py          53.24% →  +99 lines
    tpchavoc/benchmark.py                53.51% →  +30 lines
    credentials/snowflake.py             54.26% →  +48 lines
    fabric_warehouse.py                  55.68% → +109 lines
    clickhouse/diagnostics.py            56.18% →  +21 lines
    transaction_primitives/dataframe_operations.py  56.18% →  +89 lines
    tpcdi/financial_data.py              56.33% →  +38 lines
    starburst.py                         56.73% →  +24 lines
    comparison/suite.py                  56.97% →  +56 lines
    results/anonymization.py             57.20% →  +59 lines
    write_primitives/benchmark.py        57.35% → +109 lines
    gcp/dataproc_adapter.py              58.14% →  +56 lines
    aws/athena_spark_adapter.py          58.66% →  +60 lines

  Total: ~2,891 new covered lines across 12 work units.

  All tests MUST carry the @pytest.mark.fast marker so they run in the fast lane.
  All external SDKs (databricks, pyspark, snowflake-connector, boto3, google-cloud,
  pyodbc, duckdb, requests) are mocked — no live connections.

category: Testing & Quality

metadata:
  tags:
  - testing
  - coverage
  - fast-lane
  estimated_effort: "Large"
  created_date: "2026-04-01"
  source_review: "Coverage gate buffer analysis — April 2026"

impact:
  user_impact: |
    None — test-only changes. No production code modified.
  maintainer_impact: |
    Raises the coverage floor substantially on the 25 weakest modules, reducing
    the risk that routine feature additions drop the project below the 80% gate.
    Future contributors get faster feedback loops on regressions in these adapters.
  regression_risk: |
    Very low. Only new test files are added (or existing test files extended).
    Production source code is never modified. All new tests must pass in the
    existing CI fast lane.

justification: |
  With only 47 covered lines separating the project from a broken coverage gate,
  the next non-trivial feature addition to any of these 25 modules could breach
  the threshold. Bringing each module to its own 80% floor provides ~2,891 lines
  of extra covered headroom and independently validates the adapter logic that is
  currently only exercised by slow integration tests (which don't count toward
  the gate).

