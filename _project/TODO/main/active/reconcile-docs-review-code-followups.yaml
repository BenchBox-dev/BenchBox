id: reconcile-docs-review-code-followups
title: "Reconcile three code-level inconsistencies surfaced by docs review"
worktree: main
priority: Medium-High
status: In Progress
description: |
  The reconcile-docs-from-spec-gap-analysis TODO was scoped to docs-only
  edits; verification of those doc edits against benchbox/ surfaced three
  code-level inconsistencies that were flagged but not fixed. Each is a
  small, independent cleanup. None are user-visible today — all would
  surface only if a user trusted the "wrong" source of truth (a Literal
  type, a helper predicate, or a code pattern) and hit the divergence.

  **C1 — datavault hash algorithm type vs runtime contract.**
  `benchbox/core/datavault/etl/hash_functions.py:16` declares
  `HashAlgorithm = Literal["md5", "sha1", "sha256"]`, but
  `benchbox/core/datavault/benchmark.py:56` pins
  `SUPPORTED_HASH_ALGORITHMS = ("md5",)` and the validator at L89–92
  raises ValueError on anything else. The error message explains the
  cause ("schema constraints"), so the fix is to narrow the Literal to
  match runtime — not widen the allowlist.

  **C2 — DuckDB ACL classification disagrees between two sources.**
  `benchbox/core/metadata_primitives/ddl.py:583` defines
  `no_acl = {"sqlite", "datafusion", "spark", "polars"}`, so
  `supports_acl("duckdb")` returns True. But the authoritative tier
  legend in `benchbox/core/metadata_primitives/catalog/queries.yaml:1435–1438`
  lists DuckDB in Tier 4 (None — no SQL-level ACL support), and the four
  other `supports_*` predicates (introspection, role_hierarchy,
  column_grants) all return False for DuckDB. Pick one authoritative
  source: either add `"duckdb"` to the `no_acl` set or update the yaml
  legend + metadata-primitives.md to match the predicate. The yaml is
  more consistent with reality (DuckDB is embedded, single-user, no
  practical GRANT/REVOKE), so adding `"duckdb"` to `no_acl` is the
  preferred direction.

  **N1 — throughput stream cursor helper inconsistently adopted.**
  `benchbox/platforms/base/execution.py` has five throughput paths that
  call `connection.cursor()` directly (lines 547, 673, 765, 854, 1534)
  and one (line 369) that uses the `_make_stream_cursor` wrapper. The
  wrapper falls back to `_NoCloseProxy` for connection types that don't
  implement `.cursor()`, so the direct-call paths will break for such
  adapters. Standardise on `_make_stream_cursor` across all six.

category: Architecture & Refactoring

work:
- id: w1
  summary: "C1 — narrow HashAlgorithm Literal in datavault/etl/hash_functions.py:16 to ('md5',) to match benchmark.py SUPPORTED_HASH_ALGORITHMS"
  status: done

- id: w2
  summary: "C2 — add 'duckdb' to no_acl set in metadata_primitives/ddl.py:583 so supports_acl('duckdb') returns False, matching
    the Tier 4 assignment in queries.yaml:1435-1438 and the other supports_* predicates"
  status: pending

- id: w3
  summary: "N1 — replace connection.cursor() with _make_stream_cursor(connection) at platforms/base/execution.py lines 547,
    673, 765, 854, 1534 for consistency with line 369"
  status: pending

metadata:
  tags:
  - refactoring
  - datavault
  - metadata-primitives
  - tpch
  - tpcds
  - consistency
  estimated_effort: "Small"
  created_date: "2026-04-16"
  source_review: "Verification review of reconcile-docs-from-spec-gap-analysis (commits 92e108470..9327bd9e0)"

impact:
  user_impact: |
    None today. Each issue is a latent divergence between two sources
    of truth; a user would only hit it by trusting the wrong source
    (typing against HashAlgorithm, calling supports_acl, or writing a
    platform adapter whose connection type doesn't expose .cursor()).
  maintainer_impact: |
    Removes three silent inconsistencies that made the docs review
    harder. After this, each concept has one authoritative source.

must_preserve:
- "DataVaultBenchmark hash validation continues to reject sha1/sha256 with the existing error message at benchmark.py:89-92"
- "All five throughput paths in execution.py continue to produce an object with a .execute() method (the _NoCloseProxy fallback
  preserves this for non-cursor-capable connections)"
- "supports_acl_introspection/role_hierarchy/column_grants predicates unchanged — only the no_acl set in supports_acl changes"

approach: |
  Three independent work units, no shared state. Each is a single-file
  edit plus test verification:
  - w1: change one Literal in hash_functions.py; re-run datavault tests
    to confirm no consumer was relying on the broader type.
  - w2: add one string to the no_acl set in ddl.py; re-run
    metadata_primitives tests to confirm no test pinned
    supports_acl("duckdb") to True. If any does, the test was encoding
    the bug and should update.
  - w3: mechanical replacement at five call sites; grep first for any
    other connection.cursor() patterns outside execution.py and skip
    those (scope is throughput paths only).

anti_patterns:
- "DO NOT widen SUPPORTED_HASH_ALGORITHMS to ('md5','sha1','sha256') for w1 — because the schema uses fixed-width BINARY(16)
  columns sized for MD5 and the error message explicitly cites 'schema constraints' — narrow the Literal instead"
- "DO NOT change supports_acl_introspection/role_hierarchy/column_grants for DuckDB in w2 — because those already correctly
  return False — only the no_acl set needs 'duckdb' added"
- "DO NOT refactor _make_stream_cursor's fallback behaviour in w3 — because the proxy is load-bearing for adapters without
  .cursor() — just adopt the helper at the five call sites"

verification:
- description: "datavault tests pass after Literal narrowing (w1)"
  command: "uv run -- python -m pytest tests/ -k datavault -m fast -q"
  expected_output: "all tests pass"
- description: "metadata_primitives tests pass after no_acl update (w2)"
  command: "uv run -- python -m pytest tests/ -k metadata_primitives -m fast -q"
  expected_output: "all tests pass"
- description: "throughput test suite passes after cursor helper adoption (w3)"
  command: "uv run -- python -m pytest tests/ -k 'throughput or tpch or tpcds' -m fast -q"
  expected_output: "all tests pass"
- description: "type check clean after Literal change (w1)"
  command: "uv run ty check benchbox/core/datavault/"
  expected_output: "no new errors introduced"

scope_limit:
  only_modify:
  - "benchbox/core/datavault/etl/hash_functions.py"
  - "benchbox/core/metadata_primitives/ddl.py"
  - "benchbox/platforms/base/execution.py"
  do_not_modify:
  - "docs/"
  - "benchbox/core/datavault/benchmark.py"
  - "benchbox/core/metadata_primitives/catalog/queries.yaml"

