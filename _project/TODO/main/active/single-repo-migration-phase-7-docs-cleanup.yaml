id: single-repo-migration-phase-7-docs-cleanup
title: "Single-repo migration phase 7: docs and meta-files reflect the new workflow"
worktree: main
priority: Medium-High
status: Not Started
category: Documentation

deps:
  needs:
  - single-repo-migration-phase-5-repo-flip

description: |
  Update every doc that references the old two-repo model. Write a short
  release guide that captures the new flow in one page.

  Can run in parallel with Phase 6 (deletion). Both depend only on the
  dev locus migration, not on each other.

  This phase lands as a normal PR on public from ~/Developer/benchbox-public.
  Squash-merge.

  Plan file: /Users/joe/.claude/plans/single-repo-migration.md (Phase 7).

work:
- id: w1
  summary: "Update CLAUDE.md - replace two-remote section with single-repo guidance"
  status: pending
  notes: |
    Phase 5 stripped the section as an interim step. Now write a
    proper replacement:
      ## Git workflow
      Single repo, single remote (origin -> joeharris76/BenchBox).
      Working clone at ~/Developer/benchbox-public (or your local
      equivalent — the previous private clone was retired in the
      Option B migration).
      Work on feature branches, open PRs against main, squash-merge.
      Releases: make release VERSION=X.Y.Z, then tag-push to publish.
      See docs/operations/release-guide.md for details.
    Update the Commands table to remove anything referencing the old
    release flow (automate_release.py etc. - those scripts are gone
    in Phase 6).

- id: w2
  summary: "Update AGENTS.md - same treatment"
  status: pending
  notes: |
    Strip the two-remote rule. Update the Release section to point
    to the new runbook. Keep dependency-bounds policy and other
    sections that are orthogonal to the migration.

- id: w3
  summary: "Update CONTRIBUTING.md"
  status: pending
  notes: |
    Update line 193 area ("Releases are handled by maintainers") to:
      "External contributions land via PR against main. Releases are
      cut by maintainers via the flow in
      docs/operations/release-guide.md."
    Add or extend a section explaining the squash-merge convention
    (each PR becomes one commit on main).

- id: w4
  summary: "Update README.md - URLs and any lingering private/public references"
  status: pending
  notes: |
    Update GitHub URL in any badge or link to point at
    joeharris76/BenchBox (already correct after the rename, but
    verify all badges, install instructions, and "view source"
    links).
    Check for "private" or "internal" in copy that no longer applies.

- id: w5
  summary: "Write docs/operations/release-guide.md (~300 words)"
  needs: [w1]
  status: pending
  notes: |
    Short, scannable. Sections:
      # Cutting a BenchBox release
      ## The flow
        1. make release VERSION=X.Y.Z (bumps version, drafts changelog,
           opens PR)
        2. Review the PR. Edit the changelog.
        3. Squash-merge.
        4. git tag vX.Y.Z && git push origin vX.Y.Z
        5. release.yml builds and publishes to PyPI.
      ## Recovering from common failures
        - CI fails on main: fix on a branch, PR, merge.
        - Wheel content is wrong: adjust pyproject.toml/MANIFEST.in
          excludes, cut a patch release.
        - PyPI publish fails: check trusted-publisher config, retry
          with the next patch version.
      ## Reference
        - Source: Makefile (release target),
          .github/workflows/release.yml,
          scripts/generate_changelog_entry.py.
    Style: myst markdown, frontmatter copyright header consistent
    with sibling docs/operations/results-phase-2-runbook.md.

- id: w6
  summary: "Add the new guide to docs/index.rst toctree under Contributing"
  needs: [w5]
  status: pending
  notes: |
    .. toctree::
       :maxdepth: 1
       :caption: Contributing

       contributing-results.md
       operations/release-guide.md
       operations/results-phase-2-runbook.md

- id: w7
  summary: "Replace docs/development/development.md release-prep stub with a redirect"
  needs: [w5]
  status: pending
  notes: |
    At line 99 area, the "Release Preparation Workflow" section is a
    stub. Replace its body with a single line:
      See [the release guide](../operations/release-guide.md) for the
      full maintainer workflow.
    Keep the heading so any inbound anchor links resolve.

- id: w8
  summary: "Build docs locally with -W and verify the new page"
  needs: [w6, w7]
  status: pending
  notes: |
    cd docs && uv run -- python -m sphinx -W -b html . _build/html
    Must complete with zero warnings. Open the rendered page and
    confirm:
      - Code blocks render with syntax highlighting
      - Internal links resolve
      - Toctree shows the new page in Contributing

verification:
- description: "Docs build with no warnings"
  command: "cd docs && uv run -- python -m sphinx -W -b html . _build/html"
  expected_output: "build succeeded"
- description: "CLAUDE.md no longer references CRITICAL two-remote rule"
  command: "grep -c 'private.*public.*remote' CLAUDE.md"
  expected_output: "0"
- description: "Release guide exists and is non-trivial"
  command: "test -f docs/operations/release-guide.md && wc -w docs/operations/release-guide.md"
  expected_output: "between 200 and 800 words"

must_preserve:
- All other docs (benchmarks, platforms, MCP server, getting-started)
  are unchanged. This phase only touches release-related docs and
  meta-files.
- docs/operations/results-phase-2-runbook.md (results publishing) is
  unchanged - it covers a different runbook.

anti_patterns:
- DO NOT duplicate the Makefile release target into the release
  guide - because the Makefile is canonical; the guide should
  reference and explain, not paste-and-replicate.
- DO NOT write a long history section - because the guide describes
  how to release TODAY; migration history belongs in MIGRATION-NOTES.md
  (if kept) or git history.
- DO NOT add screenshots - because they rot quickly and the existing
  docs are text-only; ASCII tables and code blocks are sufficient.

scope_limit:
  only_modify:
  - CLAUDE.md
  - AGENTS.md
  - CONTRIBUTING.md
  - README.md
  - docs/operations/release-guide.md  # new file
  - docs/index.rst
  - docs/development/development.md
  notes: |
    Do NOT modify any source code. This phase is documentation-only.
