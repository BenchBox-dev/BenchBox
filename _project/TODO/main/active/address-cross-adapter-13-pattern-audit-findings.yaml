id: address-cross-adapter-13-pattern-audit-findings
title: "Address cross-adapter 13-pattern audit findings (3 Critical, 22 Required, 8 Nit/Consider)"
worktree: main
priority: High
status: In Progress
category: Code Quality and Technical Debt

description: |
  A 13-pattern defect audit across 30 platform adapters (excluding the
  already-fixed spark/lakesail/velox triple), shared helpers in
  benchbox/platforms/base/, cloud_shared.py, presto_trino_utils.py,
  questdb_rewriter.py, datafusion_*.py rewriters, benchbox/sql_compat/,
  and all docker/*/ surfaced 33 actionable findings: 3 Critical, 22 Required,
  and 8 Nit/Consider. Those findings span the original 13-pattern catalogue
  plus 4 newly-named patterns (P14 stale-flag-coexistence,
  P15 reference-before-assignment, N1 COUNT(*) throughput inflation,
  N2 ABC contract divergence).

  The audit ran on commit 73f3a582e (post velox/lakesail/spark fixes for
  W8/W9/W10). The canonical fixes for patterns 1-13 already exist in
  benchbox/platforms/_spark_helpers.py (`_strip_balanced_paren_constraints`,
  the "import discipline" docstring block, the SparkLikeAdapterMixin)
  and benchbox/platforms/{spark,lakesail,velox}.py — implementers should
  port those patterns rather than reinvent.

  Work units are sequenced by blast radius and dependency order: Critical
  contract bugs first, then shared-helper drift (highest leverage), then
  destructive-op visibility, then the silent-throughput bug, then
  modularity-drift extractions, then the long tail of P1/P2 regex bugs
  in individual adapters.

  Audit report and pattern catalogue are in conversation context (not
  committed). This TODO is intended to be self-contained enough to start
  implementation, but every work unit must still confirm the cited snippet
  against the current file before editing because line numbers were captured
  at commit 73f3a582e.

work:
- id: w1
  summary: "C1 — Add per-statement rollback to timescaledb create_schema DDL loop"
  needs: []
  status: done
  notes: |
    timescaledb.py:378-393 — psycopg2 keeps the txn open after a failed
    cursor.execute. Add `connection.rollback()` in the except branch
    (mirror postgresql.py:440). Optional improvement: adopt the parent's
    FK-strip retry path instead of replacing it.
    Trigger: any benchmark whose first DDL stmt fails (extension-dependent
    type, missing role) — every subsequent stmt then raises
    InFailedSqlTransaction and warning-logs, so the whole schema silently
    fails.

- id: w2
  summary: "C2 — Fix pg_mooncake.create_schema signature mismatch with parent"
  needs: []
  status: done
  notes: |
    pg_mooncake.py:193-207 — current signature
    `create_schema(self, connection, schema_ddl, **kwargs)` does not match
    PostgreSQLAdapter.create_schema(self, benchmark, connection) -> float
    (verified at postgresql.py:422 and base/adapter.py:254).

    Refactor to override `_transform_create_statement` (the SingleStore
    pattern) so the columnstore USING clause is injected per-statement
    inside the parent's normal flow. Delete the broken create_schema
    override. Update tests/unit/platforms/test_pg_mooncake_*.py — current
    tests acknowledge they "can't call create_schema directly without a
    real connection," which is what masked the regression.

- id: w3
  summary: "C3 — Conform snowpark_connect.{create_schema,load_data,execute_query} to PlatformAdapter ABC"
  needs: []
  status: done
  notes: |
    snowpark_connect.py:291,314,385 vs spark.py:590,632,663.
    create_schema(self, schema_name=None) → must accept (benchmark, connection).
    load_data(self, tables, source_dir, file_format=...) → must accept
    (benchmark, connection, data_dir).
    execute_query(self, query, **kwargs) → must accept (connection, query,
    query_id, ...) and return the standard dict
    {query_id, stream_id, status, execution_time_seconds, ...}.

    If Snowpark Session replaces the "connection" arg, accept and ignore
    it positionally. The orchestrator's standard call site will TypeError
    on the current code.

- id: w4
  summary: "Shared helper P2 + P7 — base/ddl_helpers.py inline-REFERENCES + import-discipline docstring"
  needs: [w1, w2]
  status: done
  notes: |
    base/ddl_helpers.py:25-69 — `_FK_CLAUSE_RE` requires the table-level
    `FOREIGN KEY (...)` header. Add a second regex pass for inline
    `\s+REFERENCES\s+...` (mirroring questdb.py:670-675), normalize
    trailing commas, then DELETE questdb._strip_fk_constraints since the
    base helper now covers both forms.

    Also add the "Import discipline" paragraph from
    _spark_helpers.py:7-13 to the module docstring (callers:
    postgresql:19, singlestore:27, doris:35, questdb:28,
    databend/adapter:53, starrocks/workload:12 — all import by name).

    Verify against TPC-DS-style inline FK form
    (`cs_sold_date_sk INTEGER REFERENCES date_dim(d_date_sk)`).

- id: w5
  summary: "Lift balanced-paren constraint walker out of _spark_helpers.py into shared module"
  needs: [w4]
  status: done
  notes: |
    `_strip_balanced_paren_constraints` in _spark_helpers.py is the
    canonical fix for Pattern 1 (greedy `[^)]*` over balanced parens).
    Move it into benchbox/platforms/base/ddl_helpers.py (or a new
    benchbox/platforms/base/sql_paren_walker.py) and re-export from
    _spark_helpers.py for backward compat. This unblocks w11 — every
    adapter rewriter can then call the same balanced walker instead of
    rolling its own broken `\([^)]*\)` regex.

    Add unit tests with at least: `CHECK ((a>0) AND (b>0))`,
    `DECIMAL(10,2)`, `PARTITION BY (date_trunc('day',ts))`,
    `DEFAULT (now())`, `WITH (partitioning = ARRAY['bucket(x, 16)'])`.

- id: w6
  summary: "P11 cluster A — promote adapter destructive-op debug logs to info/warning"
  needs: []
  status: done
  notes: |
    Mechanical, low-risk adapter-local visibility changes. Promote
    `logger.debug` → `logger.info` (or log_operation_complete) at:
    - athena.py:1054 (DROP staging table)
    - athena.py:1070 (S3 staging delete)
    - redshift.py:1156-1158 (DROP TABLE)
    - azure_synapse.py:452-462 (DROP TABLE in schema recreate)
    - fabric_warehouse.py:741-742 (DROP TABLE)
    - presto.py:559 (DROP TABLE)
    - questdb.py:476-480 (pre-create DROP failures → warning, not info)

    Keep this PR limited to adapter-local logging sites. Shared helper
    and local-working-dir destructive operations are covered by w21.

- id: w21
  summary: "P11 cluster B — make shared-helper and local-dir destructive ops visible"
  needs: [w6]
  status: done
  notes: |
    Mechanical, low-risk shared/local cleanup visibility changes. Promote
    destructive operation logging at:
    - base/connection_lifecycle.py:255-275 (unlink/rmtree/drop_database)
    - datafusion.py:1450-1459 (shutil.rmtree(working_dir))
    - polars_platform.py:657-666 (mirror of datafusion)
    - presto_trino_utils.py:198-205 (add INFO between DROP and recreate
      in execute_schema_statements "already exists" handler)
    - base/psycopg2_mixin.py:67-85 (warning, not debug, on
      _get_existing_tables exception)

    Single PR, no behavior change beyond log output. QuestDB failed
    pre-create DROP attempts must stay warning-level per w6.

- id: w7
  summary: "N1 — Fix ClickHouse Cloud COUNT(*) throughput inflation in S3/GCS load loops"
  needs: []
  status: done
  notes: |
    clickhouse_cloud.py:676-682 (S3) and :816-822 (GCS) — loop assigns
    `total_rows_loaded = SELECT COUNT(*) FROM table` per iteration; the
    source comment acknowledges the bug. On rerun-into-non-empty-table,
    the count includes pre-existing rows and silently inflates throughput
    in published BenchmarkResults.

    Either TRUNCATE before the loop, or take COUNT(*) once after the
    loop and assign once. Add a regression test that loads two files
    into a non-empty table and asserts total_rows_loaded == sum of new
    file row counts only.

- id: w8
  summary: "P12 — Extract NoConstraintEnforcementMixin (cudf, datafusion, polars_platform)"
  needs: [w5]
  status: pending
  notes: |
    cudf.py:605-636 ≅ polars_platform.py:618-645 ≅ datafusion.py:1400-1435
    triplicate `apply_constraint_configuration` and
    `apply_platform_optimizations`; only the platform-name string differs.

    Add benchbox/platforms/base/no_constraint_enforcement_mixin.py with
    the parameterised methods (read self.platform_name). Update the three
    adapters to inherit. Update or delete the three duplicate test files.

- id: w9
  summary: "P12 — Extract _build_postgres_connection_kwargs helper for PG family from_config"
  needs: []
  status: done
  notes: |
    timescaledb.py:110-159 ≅ postgresql.py:154-201 ≅ pg_duckdb.py:124-181 ≅
    pg_mooncake.py:67-116 ≅ cedardb.py:73-119 — ~30 identical lines for
    host/port/username/password/schema/sslmode + database-naming.

    Add a class method `_build_postgres_connection_kwargs(cls, config)`
    on PostgreSQLAdapter that the four subclasses call. Concrete drift
    risk: pg_mooncake/cedardb already lack `enable_timescale` and
    `statement_timeout` while sharing the same parent __init__.

- id: w10
  summary: "P12 — Consolidate clickhouse_cloud S3 + GCS load paths into one helper"
  needs: [w7]
  status: pending
  notes: |
    clickhouse_cloud.py:579-712 (S3, 133 lines) vs :714-851 (GCS, 137
    lines) are 95% duplicate. Extract
    `_load_data_via_object_storage(provider_kind, ...)` that takes the
    storage SDK and the `INSERT FROM s3()`/`INSERT FROM gcs()` table
    function as parameters. Sequenced after w7 so the COUNT(*) fix
    propagates correctly.

- id: w11
  summary: "P1 cluster A — replace WITH/DDL option regex strippers with the balanced walker from w5"
  needs: [w5]
  status: done
  notes: |
    First balanced-walker migration slice. Sites and triggers:
    - athena.py:685 `\\s+WITH\\s*\\([^)]*\\)` → breaks on
      `WITH (partitioning = ARRAY['bucket(ws_sold_date_sk, 16)'])`
    - presto.py:852 + trino.py:852 (`WITH ([^)]*)`) → breaks on
      `WITH (partitioning = ARRAY[date_trunc('day', ts)])`

    Add unit tests covering each trigger. Keep adapter-specific PK/FK and
    ClickHouse/Fabric cases in w22/w23 so failures isolate cleanly.

- id: w22
  summary: "P1 cluster B — replace PK/FK regex strippers with the balanced walker from w5"
  needs: [w11]
  status: done
  notes: |
    Second balanced-walker migration slice. Sites and triggers:
    - duckdb.py:733-739 (table-level + inline FK) → breaks on
      `FOREIGN KEY (...) REFERENCES date_dim(d_date_sk) ON DELETE CASCADE`
    - firebolt.py:1055,1059-1064 (PK + FK) → breaks on composite PK with
      expression members `PRIMARY KEY ("a", coalesce(b,0))`

    Add unit tests covering each trigger.

- id: w23
  summary: "P1 cluster C — fix ClickHouse nullable and Fabric table-definition regex edge cases"
  needs: [w22]
  status: done
  notes: |
    Third balanced-walker migration slice. Sites and triggers:
    - clickhouse/workload.py:65-70 `Nullable\\([^)]+\\)\\s+NOT\\s+NULL`
      → silently breaks decimal-bearing TPC-DS tables for ALL clickhouse
      adapters (`Nullable(Decimal(38,0)) NOT NULL`)
    - clickhouse/workload.py:116 inline PK regex on parametrized types
    - fabric_warehouse.py:1218-1226 `_optimize_table_definition` uses
      str.replace after re.search → munges `CREATE TABLE IF NOT EXISTS orders`

    Add unit tests covering each trigger.

- id: w12
  summary: "P12 — Restore Presto/Trino symmetry: NOT NULL stripping, friendly connect error, qualified _load_table_data"
  needs: [w11]
  status: done
  notes: |
    Three asymmetric drift items between presto.py and trino.py:
    1. presto.py:847-854 strips NOT NULL for memory catalog; trino.py
       does NOT. Trino memory catalog also rejects NOT NULL.
    2. presto.py:633-635 uses bare `raise`; trino.py:640-647 calls
       `_build_friendly_connection_error`. Lift the helper to
       presto_trino_utils.py and use in both.
    3. trino.py:681-696 _load_table_data sends unqualified
       `INSERT INTO orders`; presto.py:669-697 prepends `catalog.schema.`.
       Promote to a shared helper that always qualifies.

    Starburst inherits via TrinoAdapter — no separate fix needed there.

- id: w13
  summary: "P3 — Fix motherduck `--platform-option token=<token>` advertised in docstring but not wired"
  needs: []
  status: done
  notes: |
    motherduck.py:56,116,135-138 — module docstring at :56 advertises
    `--platform-option token=<token>`, but `add_cli_arguments` registers
    `--motherduck-token`/`--motherduck-database` and `from_config` reads
    `motherduck_token`/`motherduck_database` keys (not `token`/`database`
    from options). Either (a) make from_config read both option keys
    AND the legacy ones, or (b) align the docstring with the actual flag.
    Prefer (a) — it's the migration path other adapters took.

- id: w14
  summary: "P15 — Fix snowflake.drop_database reference-before-assignment in exception handler"
  needs: []
  status: done
  notes: |
    snowflake.py:441-453 — `database` is referenced in the except branch
    but bound only after `_create_admin_connection(...)`. If
    connection-build raises, the handler raises NameError and masks the
    original. Move
    `database = connection_config.get("database", self.database)` to the
    top of the function before any callable that can raise.

- id: w15
  summary: "Add ABC-conformance test that introspects every concrete adapter's method signatures"
  needs: [w3]
  status: pending
  notes: |
    Defensive — prevents future N2 (ABC contract divergence). New test
    `tests/unit/platforms/test_abc_conformance.py` walks every concrete
    subclass of PlatformAdapter, asserts that
    {create_schema, load_data, execute_query, drop_database} match the
    ABC signature using `inspect.signature`. Snowpark Connect (after w3),
    pg_mooncake (after w2) should pass; failures mean someone diverged
    again.

- id: w16
  summary: "P11/P9 cluster — postgresql FK-strip silent retry + presto bare raise + cedardb per-table drop logs"
  needs: [w12, w21]
