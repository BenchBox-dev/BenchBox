- "Spark/lakesail/velox triple continues to pass tests/unit/platforms/test_{spark,lakesail,velox}_*.py — they are the canonical
  reference for patterns 1-13"
- "_strip_balanced_paren_constraints behavior in _spark_helpers.py is unchanged when lifted to base/ — re-export must keep
  import paths stable"
- "PostgreSQLAdapter.create_schema(self, benchmark, connection) -> float signature stays canonical for the entire PG family"
- "PlatformAdapter ABC method signatures stay stable; w15's conformance test enforces them going forward"
- "All currently-passing fast tests continue to pass: `uv run -- python -m pytest -m fast -q`"
- "Existing CLI invocations using legacy `--<adapter>-<flag>` flags continue to work where w17 keeps a shim (deprecation must
  not be a hard break)"

approach: |
  Sequence is deliberate and dependency-aware:
  - w1-w3 (Critical) ship first, individually. Each is a contract bug
    that breaks production and needs no shared infrastructure.
  - w4-w5 (shared-helper foundation) ship next. They are the leverage
    that makes w8/w11 mechanical instead of bespoke per-adapter.
  - w6 (P11 visibility cluster) and w7 (N1 throughput inflation) are
    independent of the foundation work — can ship in parallel with w4/w5.
  - w8/w9/w10 (modularity-drift extractions) ship after w4/w5.
  - w11/w22/w23/w12 (per-adapter regex fixes) ship after w5 in bounded
    adapter-family slices.
  - w13/w14 are independent one-liners.
  - w15 (ABC test) ships after w3 and gates future regressions.
  - w16/w17/w24/w25/w18/w19/w26/w20 are cleanup; ship last.

  Reference the canonical fixes already in the repo:
  - benchbox/platforms/_spark_helpers.py for balanced-paren walker,
    SparkLikeAdapterMixin, "Import discipline" docstring block
  - benchbox/platforms/{spark,lakesail,velox}.py for the lambda-capture
    pattern (w10-style), the on_pre_loop hook wiring, the
    --platform-option error message rewrite (P3 canonical fix)
  - docker/velox/docker-compose.yml for the canonical tmpfs pattern
    that w20 should mirror

  Grep before each work unit:
    git diff 73f3a582e -- <file>     # confirm file hasn't drifted from audit baseline
    grep -n '<exact snippet>' <file> # confirm line numbers
  Audit lines were captured at 73f3a582e; subsequent commits may shift them.

anti_patterns:
- "DO NOT skip w15 (ABC conformance test) — without it, the next snowpark_connect-style divergence will land silently, and
  the C3 fix becomes wasted work the moment someone adds a new adapter"
- "DO NOT batch the 3 Critical fixes into a single PR — each touches different test files and orthogonal failure modes; landing
  them separately keeps blast radius small if one regresses"
- "DO NOT 'fix' the deferred speculative items (FK column expressions, CTE column lists) — they are guarded by 'speculative'
  for a reason. The audit explicitly downgraded them. Re-evaluate only when a real failing benchmark surfaces."
- "DO NOT delete questdb._strip_fk_constraints in w4 without first running questdb integration tests — it carries inline-REFERENCES
  handling that the base helper does not yet have"
- "DO NOT change the PG adapter from_config signatures during w9 — only extract the duplicated body. Caller compatibility
  comes first."
- "DO NOT promote questdb.py:476-480 pre-create DROP failures to logger.info in w6 — the audit specifically calls for `warning`
  (failed destructive intent), not info"
