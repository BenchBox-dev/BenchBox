deferred:
- summary: "P1 (Consider) — base/ddl_helpers.py:28,31 inline `[^)]*` in FK column-list regex"
  reason: "Speculative — current TPC schemas don't use functional refs in column lists. Re-evaluate when a benchmark adds
    expressions inside REFERENCES col lists."
- summary: "P1 (Consider) — questdb_rewriter.py:451-454 CTE column-list `[^)]+`"
  reason: "Speculative — bare-identifier-only CTE column lists are universal. Will be addressed when the rewriter migrates
    to SQLGlot AST per its own design philosophy."
- summary: "P4 (Consider) — fabric_spark Iceberg classpath probe"
  reason: "Speculative — Fabric managed Spark runtime ships Iceberg JARs by default on supported runtime versions. Add probe
    only if a real failure surfaces."
- summary: "Audit duckdb/sqlite/snowflake docker dirs for P5"
  reason: "Most cloud DW and embedded engines have no local docker dir; the questdb finding (w20) was the only one in the
    audited set."

