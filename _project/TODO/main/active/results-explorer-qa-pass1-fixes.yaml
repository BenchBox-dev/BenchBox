impact:
  user_impact: |
    Two of the four bugs (B2, B3) make pages appear broken to a first-time
    visitor: empty rows on common platform pages, and a confusing empty
    state instead of a clear 404. B1 reduces the usefulness of the
    PlatformIndex tables (no way to re-sort by date or score). B4 is a
    silent dev-console issue today but signals real Preact reconciliation
    risk if the corpus grows.
  technical_debt: |
    The investigation work (w1, w2) closes two unknowns about the
    explorer's runtime contract that the team should not have to
    re-discover next QA round.

success_metrics:
  - "All four bugs (B1, B2, B3, B4) resolved with passing verification commands"
  - "Q1 has a recorded decision in w2 notes; test plan reflects it"
  - "QA test plan is checked in at docs/operations/results-explorer-qa.md"
