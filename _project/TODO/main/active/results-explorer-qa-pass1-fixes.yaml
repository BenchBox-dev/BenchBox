    Two of the four bugs (B2, B3) make pages appear broken to a first-time
    visitor: empty rows on common platform pages, and a confusing empty
    state instead of a clear 404. B1 reduces the usefulness of the
    PlatformIndex tables (no way to re-sort by date or score). B4 is a
    silent dev-console issue today but signals real Preact reconciliation
    risk if the corpus grows.
