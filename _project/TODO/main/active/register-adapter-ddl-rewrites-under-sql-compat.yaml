approach: |
  Reuse the existing pattern, do not invent. The registry, payloads,
  phases, and resolver all already exist. The work is registration +
  consolidation, not framework design.

  Reference implementations to copy from:
  - rules/ddl_optimize/starrocks_ddl_rewrites.py:25-45 — canonical
    RewriteDDLPayload registration shape.
  - rules/query_source/h2odb_variants.py:95-114 — canonical
    SelectVariantPayload (already covers SingleStore via mysql dialect).
  - benchbox/sql_compat/registry.py:176 — register() signature.
  - benchbox/sql_compat/decision.py:59-61 — RewriteDDLPayload definition.

  Order matters: w1 lands governance (no behaviour change), w2 audits,
  w3 extracts the shared FK-strip helper, w4 migrates adapters, w5 registers
  remaining transforms, w6 makes the contract explicit, w7 enforces.
  Tests and docs (w8, w9) can land in parallel with w6/w7 once their
  prerequisites are met.

  The fail-CI flip (w7) is the forcing function — it cannot succeed
  unless the entire codebase has zero unregistered DDL drift, so w2's
  audit must be exhaustive and w5 must address every entry.

anti_patterns:
- "DO NOT relocate SHARD KEY / SORT KEY / REFERENCE TABLE transformer logic out of singlestore.py — because the registry's
  design says 'register intent, implement locally' and starrocks/clickhouse/snowflake all follow this pattern — keep transformers
  in adapter, register their existence."
- "DO NOT write six slightly-different FK-strip regexes again — because that's exactly the duplication this TODO eliminates
  — call strip_foreign_keys() from the shared helper."
- "DO NOT flip compat_lint to fail-CI before w2 audit and w5 registration are complete — because that breaks CI for every
  contributor whose adapter has unrelated unregistered DDL regex — gating w7 on w2+w4+w5 is non-negotiable."
- "DO NOT touch the query_source rules (h2odb_variants.py, vector_search_variants.py) — because they're already correctly
  registered for the mysql dialect — out of scope."
- "DO NOT make transformer_id runtime-dispatched — because the existing rules deliberately use it as documentary metadata
  — preserve that design choice."
- "DO NOT skip the behavioural-equivalence test in w3 — because subtle regex drift across six adapters is exactly what this
  consolidation is trying to fix; without the test we may introduce new drift while removing old drift — corpus test is non-negotiable."

