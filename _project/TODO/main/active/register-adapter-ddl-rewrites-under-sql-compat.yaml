context_sections:
  "Why This Pairs With harmonize-bypass-adapters-with-manifest": |
    The manifest TODO addresses *data layout* drift (compression, format,
    CSV dialect) across four adapters. This TODO addresses *DDL text*
    drift across six adapters. Same family of problem (adapters bypass
    framework infrastructure and reinvent in slightly different ways),
