id: register-adapter-ddl-rewrites-under-sql-compat
title: "Register adapter DDL rewrites under sql_compat with shared FK-strip helper and fail-CI compat_lint"
worktree: main
priority: High
status: In Progress
category: Core Functionality

description: |
  Adapters perform DDL rewrites via inline regex without registering them
  under ``benchbox/sql_compat/``, bypassing the phase-aware compatibility
  registry that the framework uses for governance and ``compat_lint`` audit.

  Audit findings:

  - SingleStore (benchbox/platforms/singlestore.py) does **four** DDL
    rewrites with **zero** registered rules: FK strip
    (``_strip_foreign_keys``, L103-120), SHARD KEY injection
    (``_transform_create_statement``, L847-853), SORT KEY injection
    (L856-859), REFERENCE TABLE rewrite (L830-837), plus lowercase
    identifier normalization (L810-823, MySQL-family operational detail
    that stays inline).
  - **FK stripping is duplicated across six adapters** with slightly
    different regexes that have already drifted: SingleStore (L103-120),
    PostgreSQL (L117), Doris (L1435), StarRocks (workload.py L135),
    Databend (adapter.py L871), QuestDB (L482). Six implementations of the same intent.
  - Other adapters (StarRocks, ClickHouse, Snowflake, Spark, Trino,
    Redshift, Presto) DO have registered rule stubs in
    ``benchbox/sql_compat/rules/ddl_optimize/`` — so the pattern exists,
    SingleStore and a few others are simply skipping it.
  - ``benchbox/sql_compat/inventory.py`` (``compat_lint``) detects
    unregistered branching but doesn't fail CI today — so this drift is
    invisible.

  Pattern (verified by reading
  ``benchbox/sql_compat/rules/ddl_optimize/starrocks_ddl_rewrites.py:25-45``):
  a rule registers ``RewriteDDLPayload`` with a ``transformer_id`` for
  governance/audit. The adapter still implements the transformation locally
  via ``_optimize_table_definition()``. The registry advertises intent;
  ``compat_lint`` enforces that no adapter does an unregistered DDL rewrite.

  This TODO:
  1. Registers SingleStore's four DDL transforms under ``ddl_optimize``.
  2. Extracts a single shared ``strip_foreign_keys()`` helper and
     migrates all six duplicating adapters to call it.
  3. Audits every other adapter for unregistered DDL regex and registers
     them (or removes them) before flipping ``compat_lint`` to fail-CI.
  4. Promotes the implicit ``_optimize_table_definition()`` pattern to a
     documented ``DdlOptimizer`` Protocol in ``benchbox/platforms/base/``.
  5. Tightens ``compat_lint`` to **fail CI immediately** on unregistered
     DDL regex — strongest enforcement, per user direction.

  **Decisions baked in (confirmed with user before authoring):**

  - Sequential after ``harmonize-bypass-adapters-with-manifest`` (same
    adapter files, different code paths; lower merge-conflict risk).
  - Extract shared FK-strip helper and migrate all six adapters
    (SingleStore + PostgreSQL + Doris + StarRocks + Databend + QuestDB).
  - ``compat_lint`` flips to fail-CI in this TODO — no warn-only phase.
    Means w7 cannot land until w1-w5 have eliminated all drift across
    every adapter, not just the six in scope.

  Out of scope: query_source rules (h2odb Q9 PERCENTILE_CONT and
  vector_search variants are already correctly registered for ``mysql``
  dialect at ``rules/query_source/h2odb_variants.py:95-114`` and
  ``rules/query_source/vector_search_variants.py``); VECTOR type mapping
  (already in ``benchbox/core/vector_search/schema.py:_EMBEDDING_TYPE_MAP``);
  identifier lowercasing in SingleStore (genuine MySQL-family detail);
  SHARD KEY / SORT KEY / REFERENCE TABLE transformer relocation (registry
  says register, not relocate — they stay in singlestore.py).

work:
- id: w1
  summary: "Register SingleStore's four DDL transforms under sql_compat (governance-only, no behavior change)"
  status: done
  notes: |
    Create ``benchbox/sql_compat/rules/ddl_optimize/singlestore_ddl_rewrites.py``
    following the pattern in
    ``benchbox/sql_compat/rules/ddl_optimize/starrocks_ddl_rewrites.py``.

    Register four ``CompatibilityDecision`` entries with
    ``CompatAction.REWRITE_DDL`` and ``RewriteDDLPayload(transformer_id=...)``:

    1. ``ddl_optimize.singlestore.all.strip_foreign_keys`` — references
       the FK-strip helper that w3 will introduce
       (``transformer_id="singlestore_strip_foreign_keys"``). Reason:
       "SingleStore raises error 2752 when CREATE TABLE contains
       FOREIGN KEY clauses with referential actions."
    2. ``ddl_optimize.singlestore.all.inject_shard_key`` —
       ``transformer_id="singlestore_inject_shard_key"``. Reason:
       "SingleStore columnstore tables require SHARD KEY for
       distribution; injection mapped from _TPCH_SHARD_KEYS."
    3. ``ddl_optimize.singlestore.all.inject_sort_key`` —
       ``transformer_id="singlestore_inject_sort_key"``. Reason:
       "SingleStore columnstore SORT KEY drives analytical ordering;
       mapped from _TPCH_SORT_KEYS."
    4. ``ddl_optimize.singlestore.all.reference_table_for_dimensions``
       — ``transformer_id="singlestore_reference_table"``. Reason:
       "Small dimension tables (nation, region) benefit from REFERENCE
       TABLE replication to avoid broadcast joins."

    No adapter code changes in this commit. ``transformer_id`` strings
    name methods that currently exist in singlestore.py
    (_strip_foreign_keys, _transform_create_statement). w4 will rename
    / split them to match.

    **Decision gate:** before merging, run
    ``uv run --project _project/scripts -- python -m benchbox.sql_compat.inventory --platform singlestore``
    (or whatever the existing audit invocation is) and confirm the four
    new rules appear without changing any existing rule counts.

- id: w2
  summary: "Audit every adapter for inline DDL regex and produce a punch list"
  status: done
  notes: |
    Required before w7 (fail-CI enforcement) can land safely. If we
    flip compat_lint to fail-CI without this audit, every other
    adapter's unregistered regex breaks CI for unrelated contributors.

    For each file in benchbox/platforms/, find every:
      - ``re.sub`` / ``re.search`` / ``re.compile`` / ``re.match``
        with a pattern that touches CREATE TABLE / ALTER TABLE /
        column-type substitution / identifier transformation / DDL text.
      - Inline string replacement of DDL text (``stmt.replace("X", "Y")``).
      - Method named ``_optimize_table_definition`` /
        ``_transform_create_statement`` / ``_optimize_ddl`` / etc.

    Cross-reference each finding against rules currently registered
    in ``benchbox/sql_compat/rules/ddl_optimize/`` and
    ``benchbox/sql_compat/rules/schema_emit/``. Output:
    ``_project/audits/sql_compat_ddl_drift.md`` listing every entry as:
    [adapter, file:line, regex/operation, registered? Y/N, target
    rule_id if missing].

    The punch list size determines the breadth of w5 — if many entries
    surface in adapters not currently in our migration scope, we must
    register them all (or downgrade w7 to warn-only despite user
    preference) before fail-CI is safe.

    **Decision gate:** if punch list size > 30 unregistered transforms,
    pause and ask the user whether to expand scope or fall back to
    warn-only enforcement.

- id: w3
  summary: "Extract strip_foreign_keys() shared helper and behavioral-equivalence corpus tests"
  needs: [w1, w2]
  status: done
  notes: |
    Six adapters duplicate the FK-strip regex with drift. Build the
    single canonical helper that w4 will wire into each adapter.

    1. Add ``benchbox/platforms/base/ddl_helpers.py`` (or
       ``benchbox/sql_compat/transformers.py`` if the registry layer
       is the more natural home — defer choice to implementation,
       cite reason in the commit message). Public API:
       ``strip_foreign_keys(stmt: str) -> str`` covering all variants
       observed in the audit:
         - CONSTRAINT name FK (...) REFERENCES ... [ON DELETE/UPDATE ...]
         - bare FOREIGN KEY (...) REFERENCES ...
         - PRIMARY+FOREIGN compound (Doris pattern)
         - trailing-comma cleanup after removal
       Behavior is the UNION of what the six current implementations do.

    2. **Behavioural-equivalence test**: write
       ``tests/unit/sql_compat/test_strip_foreign_keys.py`` that runs
       each adapter's OLD regex (preserved as a private constant in the
       test) against a corpus of representative CREATE TABLE inputs
       (TPC-H, TPC-DS, datavault, ClickBench, custom edge cases with
       CONSTRAINT names, ON DELETE clauses, multi-FK, no-FK) and
       asserts the new shared helper produces the same output for each
       input × each old-regex pair. This guarantees zero behaviour
       drift during the migration.

    **Decision gate:** before declaring w3 done, run
    ``uv run -- python -m pytest tests/unit/sql_compat/test_strip_foreign_keys.py -q``
    All corpus comparisons must pass — green is the prerequisite for
    w4 to land safely.

- id: w4
  summary: "Migrate all six duplicating adapters to call strip_foreign_keys() helper"
  needs: [w3]
  status: done
  notes: |
    With the shared helper and corpus tests in place from w3, replace
    each adapter's local FK-strip with a single call:

      - benchbox/platforms/singlestore.py:103-120 →
        ``from benchbox.platforms.base.ddl_helpers import strip_foreign_keys``
      - benchbox/platforms/postgresql.py:117 → same
      - benchbox/platforms/doris.py:1435 → same (preserve PRIMARY KEY
        handling separately if needed; FK-only)
      - benchbox/platforms/starrocks/workload.py:135 → same
      - benchbox/platforms/databend/adapter.py:871 → same
      - benchbox/platforms/questdb.py:482-489 → same

    Each adapter migration is its own commit so individual reverts
    are possible if a regression surfaces in adapter-specific live
    tests.

    **Decision gate:** before declaring w4 done, run
    ``uv run -- python -m pytest tests/unit/platforms/test_singlestore_adapter.py tests/unit/platforms/test_postgresql_adapter.py tests/unit/platforms/test_doris_adapter.py tests/unit/platforms/test_starrocks_adapter.py tests/unit/platforms/test_databend_adapter.py tests/unit/platforms/test_questdb_adapter.py -q``
    and the four adapters' Docker stress tests where available. The
    shared helper must produce the same DDL the inline regexes did.

- id: w5
  summary: "Register every remaining unregistered DDL transform surfaced by w2 audit"
  needs: [w2]
  status: done
  notes: |
    Required precondition for w7 (fail-CI). Anything left unregistered
    becomes a CI break.

    For each entry in the w2 punch list:
      - If the transform is genuinely needed: register a
        ``RewriteDDLPayload`` rule under
        ``rules/ddl_optimize/{adapter}_ddl_rewrites.py`` (create if
        missing) with a descriptive rule_id and reason.
      - If the transform is dead code or an obsolete fix: delete it.

    Adapters where the audit is most likely to surface gaps (based on
    prior inspection):
      - PostgreSQL: FK strip (covered by w4) — confirm no other
        unregistered DDL ops.
      - Doris: type conversion (STRING→VARCHAR, ARRAY dimension strip),
        DISTRIBUTED BY HASH injection.
      - StarRocks: type conversion, PRIMARY KEY validation, DUPLICATE
        KEY rewrite, DISTRIBUTED BY (governance stub exists; check if
        it covers all transforms or just one).
      - QuestDB: any timestamp/symbol DDL fixes.
      - Databend: any.

    Each registration commit is small (one rule per commit if
    practical) so individual rules are revertible.

    **Decision gate:** after w5 completes, re-run the w2 audit
    script. The new "unregistered transforms" count must be zero.

- id: w6
  summary: "Promote _optimize_table_definition() to a documented DdlOptimizer Protocol"
  needs: [w1, w3, w5]
  status: pending
  notes: |
    Make the implicit pattern explicit so the next platform adapter
    (Velox, etc.) doesn't need to discover it through code-archaeology.

    1. Define ``DdlOptimizer`` Protocol in
       ``benchbox/platforms/base/ddl_optimizer.py``:
          class DdlOptimizer(Protocol):
              def optimize_table_definition(
                  self, stmt: str, table_name: str
              ) -> str: ...
    2. Provide a base ``BaseDdlOptimizer`` mixin that walks rules
       registered under ``Phase.DDL_OPTIMIZE`` for the adapter's
       platform name, and dispatches to adapter-implemented methods
       keyed on ``transformer_id``. Adapters opt in by inheriting the
       mixin and providing the ``transformer_id``-named methods.
    3. SingleStore is the canary: refactor
       ``_transform_create_statement`` to dispatch through the new
       mixin. Existing methods (FK strip is now the shared helper;
       SHARD/SORT/REFERENCE stay in adapter) become the registered
       transformer methods.
    4. Document the pattern in
       ``benchbox/sql_compat/README.md`` (create if missing) with the
       SingleStore example as the canonical "what good looks like".

    Other five adapters opt in opportunistically — not required for
    this TODO. The Protocol just makes the contract explicit.

    **Decision gate:** SingleStore unit tests still green after the
    refactor; live stress test still passes. If the dispatch indirection
    causes performance issues (DDL is one-time cost so unlikely), keep
    the inline path on a fast lane.

- id: w7
  summary: "Flip compat_lint to fail-CI on unregistered DDL regex"
  needs: [w4, w5, w6]
  status: pending
  notes: |
    The forcing function. Cannot land until w2's punch list is fully
    addressed by w4 and w5 (zero unregistered DDL transforms across
    every adapter, not just the six in our migration scope).

    1. Update ``benchbox/sql_compat/inventory.py`` so the audit walk
       exits non-zero when an unregistered DDL regex is found.
    2. Wire it into the existing CI / pre-commit lint stage. Example:
          uv run --project _project/scripts -- python -m benchbox.sql_compat.inventory --check-ddl-drift
       exits 1 on any drift.
    3. Run locally: zero exit code is the prerequisite. If the script
       still flags anything, return to w5 to register or remove.
    4. Add an integration smoke test in tests/integration/ that
       imports a known-clean adapter (post-migration SingleStore) and
       asserts compat_lint runs clean.

    **Decision gate:** before merging w7, run the audit script across
    the entire codebase one last time and paste the output (zero
    findings) into the PR description. If even one finding remains,
    either register it or fall back to warn-only and refile w7 as a
    separate TODO.

- id: w8
  summary: "Tests harmonized: registry + transform asserted together"
  needs: [w1, w3, w6]
  status: pending
  notes: |
    Existing DDL-shape tests in
    tests/unit/platforms/test_singlestore_adapter.py:1125-1199 assert
    output SQL only. Refactor to also assert the rule is registered:

       def test_singlestore_strip_fk_registered_and_applied(self):
           ctx = CompatibilityContext(
               platform="singlestore", phase=Phase.DDL_OPTIMIZE, ...
           )
           decisions = REGISTRY.resolve_all(ctx)
           assert any(
               d.rule_id == "ddl_optimize.singlestore.all.strip_foreign_keys"
               for d in decisions
           )
           # then assert transform output as before

    Plus new
    ``tests/unit/sql_compat/test_singlestore_rules.py`` covering each
    of the four registered SingleStore rules: rule_id format, payload
    type, transformer_id matches an actual method.

    Plus the behavioural-equivalence corpus from w3 stays as a
    regression test for the shared FK-strip helper.

- id: w9
  summary: "Document the 'register for governance, implement in adapter' pattern"
  needs: [w6]
  status: pending
  notes: |
    Create / update ``benchbox/sql_compat/README.md`` with:
      - One-paragraph explanation of the phase-aware registry.
      - The "register intent, implement locally" design choice and
        why (transformers are platform-specific code, but governance
        should be uniform).
      - SingleStore as the canonical example: rule file location,
        adapter method, compat_lint enforcement.
      - Checklist for adding a new platform: (1) register rules under
        ``rules/ddl_optimize/{platform}_ddl_rewrites.py``, (2)
        implement ``_optimize_table_definition`` (or inherit
        ``BaseDdlOptimizer``), (3) confirm
        ``compat_lint --platform=X`` runs clean.

    Also link from CLAUDE.md (or AGENTS.md per project convention) so
    onboarding agents find the pattern without reading source code.

deferred:
- summary: "Migrate adapter-specific transforms (SHARD/SORT/REFERENCE) into a runtime-dispatched registry"
  reason: |
    The audit confirms the framework's design choice: rules document
    intent for governance; transformers stay in adapter code because
    they're platform-specific. Runtime dispatch on transformer_id was
    explicitly NOT implemented in the existing rules. Out of scope.

- summary: "Generalize compat_lint to enforce QUERY_ADAPTER and SCHEMA_EMIT phases too"
  reason: |
    This TODO scopes enforcement to DDL_OPTIMIZE because that's where
    the band-aid drift surfaced. Other phases may have similar gaps;
    file a follow-up after this lands.

- summary: "Lowercase identifier handling for SingleStore (lower_case_table_names=0)"
  reason: |
    MySQL-family operational detail, not a cross-platform compat
    decision. Stays inline in singlestore.py.

- summary: "VECTOR type mapping consolidation"
  reason: |
    Already correctly placed in
    benchbox/core/vector_search/schema.py:_EMBEDDING_TYPE_MAP. Out of
    scope.

