  command: "test -f _project/specs/uat-framework.md"
  expected_output: "file exists; user approval recorded in W1 commit message or chat"
- description: "make uat-cell runs successfully for at least one (platform, benchmark, scale) cell"
  command: "make uat-cell PLATFORM=duckdb BENCHMARK=tpch SCALE=0.01"
  expected_output: "exit 0; result JSON path printed"
- description: "make uat-stress provides feature parity for the stress use case"
  command: "make uat-stress PLATFORM=duckdb BENCHMARK=tpch"
  expected_output: "exit 0 with the same set of result paths scripts/local_stress_test.sh would produce for the same inputs"
- description: "make uat-sweep dry-run against the 2026-05-02 replay config produces structurally-parallel TSV"
  command: "make uat-sweep CONFIG=tests/uat/configs/uat-2026-05-02.yaml DRY_RUN=1"
  expected_output: "matrix_summary.tsv with same columns and equivalent row count to the historical retrospective"
- description: "Fast tests still pass"
  command: "uv run -- python -m pytest -m fast -q"
  expected_output: "all selected tests pass"
- description: "scripts/local_stress_test.sh unchanged unless W11 explicitly delegates it"
  command: "git diff origin/develop -- scripts/local_stress_test.sh"
  expected_output: "no diff (default W11 outcome) OR a thin-delegation wrapper change explicitly approved"
- description: "User CLI surface unchanged"
  command: "git diff origin/develop -- benchbox/cli/"
  expected_output: "no diff"

must_preserve:
- "scripts/local_stress_test.sh continues to work as today's stress entrypoint until W11 explicitly migrates it -- because
  muscle memory is widespread and breaking this surface mid-framework-build invalidates the no-disruption promise"
- "benchbox user-facing CLI surface unchanged -- because UAT is dev tooling, not user surface; no benchbox uat subcommand,
  no new top-level commands"
- "scripts/validate_submission.py contract and exit codes unchanged -- because the validator is the source of truth; the framework
  wraps via uat_validator_rollup.py only"
- "scripts/uat_validator_rollup.py public CLI unchanged once it lands -- because that helper is owned by uat-template-validator-clean-rate-runner;
  the framework is a consumer"
- "_project/TODO_SCHEMA.yaml and _project/TODO_ENTRY_TEMPLATE.yaml unchanged -- because schema/template work is owned by uat-template-success-metric-terminal-state-and-gating"
- "results-data/ and origin/published-results corpus untouched -- because the framework dispatches submission, it does not
  curate corpus content"
- "Sequential platform execution discipline -- because UAT W3 line 222 explicitly forbids parallel platforms (timing contamination);
  code comments must reference this"

approach: |
  Spec-first. W1 is a HARD user-approval gate: no Python lands until
  `_project/specs/uat-framework.md` is reviewed and approved. This
  mirrors the methodology-remediation approach (W4 design gate before
  W5 implementation files).

  Vertical slices. Each work unit ships a runnable Make target with
  fast-test coverage before the next unit starts. W2-W3 establish
  the core (matrix machinery + single-cell runner); W4-W7 add phases;
  W8 reports; W9 orchestrates; W10 replays history; W11 documents.
  One PR per work unit; no monolithic delivery.

  Reuse aggressively:
    - `benchbox.core.benchmark_registry` (already imported via
      `python -c` from the bash script)
    - `scripts/uat_validator_rollup.py` (from validator-clean-rate
      TODO)
    - `benchbox submit` and `benchbox explorer build` (existing CLI)
    - `results-explorer/scripts/serve-browser-tests.mjs` (Playwright)

  Don't reuse:
    - `scripts/local_stress_test.sh` case statements as-is. Translate
      to canonical Python form in `tests/uat/matrix.py`. The bash
      script may opt in to delegate (W11 user choice) but that is
      not the default path.

  YAML configs live under `tests/uat/configs/` (tracked). Runtime
  artifacts (logs, bundles, TSVs) live under
  `~/Developer/benchmark_runs/uat_<date>/` (off-tree, as today).

anti_patterns:
- "DO NOT add a `benchbox uat` CLI subcommand -- because UAT is dev tooling, not user surface, and the package shipped on
  PyPI shouldn't carry sweep machinery -- expose via `make uat-*` targets only."
- "DO NOT reimplement validator wrapping -- because uat-template-validator-clean-rate-runner ships scripts/uat_validator_rollup.py
  for exactly this purpose -- the framework's validate phase invokes that helper as a subprocess."
- "DO NOT bundle methodology / TODO-template scope into this framework -- because Findings 1/2/3 have their own TODOs and
  a merged spec -- this TODO is about machinery drift only."
- "DO NOT modify benchbox/ source -- because the framework consumes benchbox as a library only, and platform/runner code is
  user-CLI territory -- import and subprocess only."
- "DO NOT remove scripts/local_stress_test.sh in this TODO -- because muscle memory is widespread and the W1 spec must explicitly
  authorise any deprecation cycle -- leave or thin-delegate; never delete in this TODO."
- "DO NOT run platforms in parallel under uat-execute -- because concurrent runs contaminate timings and corrupt the corpus
  (UAT W3 line 222) -- preserve the sequential discipline; document the anti-pattern in code comments referencing the source
  line."
- "DO NOT default cross_scale_coverage_min_pairs to enabled -- because the methodology spec scoped Finding 1 as convention-only
  and tooling teeth are opt-in -- the YAML field defaults off; sweep authors enable explicitly."
- "DO NOT skip the W1 spec gate -- because this TODO has 11 work units and an approved spec is the only reliable user-review
  point at this scale -- no Python lands until the spec is approved by the user."
- "DO NOT include UAT machinery in _project/scripts/ -- because the user has explicitly directed UAT to live in tests/ to
  avoid the mostly-untracked _project/ tree -- tests/uat/ is the only acceptable home."
- "DO NOT proceed past W4 if scripts/uat_validator_rollup.py has not landed -- because that helper is the source of truth
  for validation and reimplementing it would orphan the validator-clean-rate TODO -- surface the dep blocker to the user instead."

