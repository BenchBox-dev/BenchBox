impact:
  business_value: |
    Establishes a durable baseline where benchmark and CLI regressions are more
    likely to be caught by unit tests before release.
  technical_debt: |
    Replaces coarse overall coverage checks with active-scope module-level
    enforcement while keeping deferred high-complexity modules explicitly
    tracked for re-entry. Closes gaps in tuning, platform adapters, credentials,
    DataFrame adapters, utils, MCP, and visualization modules that were not
    covered by existing related TODOs.

