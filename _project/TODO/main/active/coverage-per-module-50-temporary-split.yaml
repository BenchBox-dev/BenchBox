    - "_project/TODO/main/planning/coverage-core-benchmarks.yaml"
    - "_project/TODO/main/planning/coverage-core-tpcdi.yaml"
    - "_project/TODO/main/planning/coverage-platforms.yaml"
    - "_project/TODO/main/planning/coverage-ci-enforcement.yaml"
  note: |
    This TODO supersedes the related coverage TODOs above by providing a
    consolidated, per-file implementation plan. The related TODOs remain as
    reference for category-specific context and anti-patterns but should not
    be implemented independently — use this TODO as the single execution plan.

must_preserve:
  - "Existing fast/unit test suite remains green with no live platform dependency"
  - "Current CLI command behavior and argument contracts remain unchanged"
  - "TPC-DI SQL/DataFrame ETL parity behavior verified by existing parity tests"
  - "Existing overall --cov-fail-under workflow remains available during migration"

approach: |
  Follow existing test patterns in tests/unit/{cli,core,tpcdi,platforms} and
  prefer fast unit tests with mocks over integration tests. Implement coverage
  lift in waves ordered by fastest impact (near-50% quick wins first, then
  medium-effort modules, then large modules requiring 5-10 tests each, then
  CLI, then TPC-DI). Recompute and checkpoint coverage after each wave using
  coverage.json plus the per-file checker to keep progress measurable.

  Naming convention: new files are named test_{module}_coverage.py when an
  existing test file covers the same source module. All tests marked
  @pytest.mark.fast and @pytest.mark.unit, pure mocks only.

  Within each phase, batches are independent and can be parallelized via
  Task agents. Each batch creates all its test files, then runs verification
  before proceeding to the next phase.

anti_patterns:
  - "DO NOT add integration tests that require cloud credentials or external services — because CI must run offline — use deterministic mocks/fakes"
  - "DO NOT raise coverage by weakening assertions — because it masks regressions — assert observable behavior and error-path contracts"
  - "DO NOT silently defer additional modules beyond the approved list — because scope creep undermines the gate — add any new deferment as explicit TODO update"
  - "DO NOT import heavy cloud SDKs at module level in test files — because they add 2-5s import overhead and may not be installed — use unittest.mock.patch or lazy imports"
  - "DO NOT test auto-generated SQL strings character-by-character — because SQL formatting changes would cause false failures — test query structure, table references, and parameters instead"

verification:
  - description: "Active-scope per-file checker reports and fails correctly"
    command: "uv run -- python scripts/check_per_file_coverage.py --min 50 --coverage-json coverage.json"
    expected_output: "No active-scope module below 50%, exit code 0"
  - description: "Fast coverage workflow remains green at project floor"
    command: "make ci-test"
    expected_output: "pytest fast suite passes and coverage gate remains >=50%"
  - description: "Targeted coverage wave tests pass"
    command: "uv run -- python -m pytest tests/unit -m fast --tb=short"
    expected_output: "all selected fast unit tests pass, 0 failures"
  - description: "Per-phase verification"
    command: "uv run -- python -m pytest tests -p pytest_cov --cov=benchbox --cov-report=term-missing:skip-covered -n auto -m 'not slow and not stress and not live_integration' --tb=short -q --benchmark-disable"
    expected_output: "no benchbox/ module below 50% in output"

success_metrics:
  - "Every active-scope benchbox/*.py module reaches >=50% coverage"
  - "Deferred-module list remains explicit and documented with re-entry criteria"
  - "Coverage-per-file workflow is reproducible in local CI path"
  - "~87 new test files with ~405 test functions, all @pytest.mark.fast"

