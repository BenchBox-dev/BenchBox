id: fix-manifest-validation-for-directory-based-formats
title: "Fix manifest validation for directory-based table formats (Delta, Iceberg, DuckLake)"
worktree: main
priority: High
status: In Progress
category: Core Functionality
description: |
  After converting TPC-H data to Delta format, every subsequent run triggers
  "⚠️ Manifest validation failed; regenerating benchmark data" even when nothing
  has changed. Data regeneration is unnecessary but takes ~10s at SF=1.

  ROOT CAUSE: Directory-based formats (Delta, Iceberg, DuckLake, partitioned Parquet)
  store a single directory path in the manifest entry (e.g., "lineitem/") with
  size_bytes computed as a recursive file sum via rglob("*"). But validation calls
  fp.stat().st_size on that directory path, which returns the inode size (~96 bytes
  on macOS/Linux) — never matching the stored recursive sum.

  This was masked when vortex (a regular file format) was at format_preference[0].
  The format_preference ordering fix (commit d643ccaca) moved delta to position 0,
  exposing the latent inconsistency.

  DESIGN ANALYSIS — Should we store individual files instead of directories?
  No. Delta/Iceberg/DuckLake tables are loaded as directories (e.g.,
  `deltatable('path/to/lineitem/')`), not by listing individual parquet files.
  The directory path IS the correct entry for downstream loaders. Storing individual
  files would break the loading contract and require changes to 6+ callers of
  get_table_files() plus all platform-specific data loading code.

  FIX STRATEGY: Make validation directory-aware. When a manifest entry path resolves
  to a directory, compute recursive file size (matching write-time calculation) instead
  of calling stat().st_size directly. Additionally, add an `is_directory` boolean to
  manifest entries so validation doesn't need to probe the filesystem to determine
  entry type. This future-proofs for any new directory-based formats.

  AFFECTED VALIDATION SITES (confirmed by code reading):
  1. runner.py:1175-1177 — _validate_manifest_if_present()
  2. data_validation.py:498 — table expectation validation
  3. data_validation.py:530 — unknown benchmark file validation

  AFFECTED FORMATS: delta, iceberg, ducklake, partitioned parquet — all use
  rglob("*") for size at write time but get stat().st_size at read time.

metadata:
  owners: []
  estimated_effort: "1-2 days"
  created_date: "2026-03-04"
  tags:
  - bug
  - manifest
  - data-formats
  - regression

impact:
  business_value: |
    Every Delta/Iceberg/DuckLake benchmark run wastes ~10s at SF=1 (and proportionally
    more at larger scale factors) regenerating data that hasn't changed. This is a
    correctness issue — the reuse path is broken for all directory-based formats.

work:
- id: w1
  summary: "Add _compute_entry_size() helper that handles both files and directories"
  status: done
  notes: |
    Create a shared helper function (in datagen_manifest.py or a manifest utils module)
    that computes the size of a manifest entry path:
      - If path is a regular file: return path.stat().st_size (current behavior)
      - If path is a directory: return sum(f.stat().st_size for f in path.rglob("*") if f.is_file())
    This matches exactly how size_bytes is computed at write time in delta_converter.py:158,
    iceberg_converter.py:283, ducklake_converter.py:218, and parquet_converter.py:322.

- id: w2
  summary: "Fix _validate_manifest_if_present() in runner.py to use the new helper"
  needs: [w1]
  status: done
  notes: |
    Replace the direct stat().st_size comparison at runner.py:1175-1177 with
    _compute_entry_size(fp). The check becomes:
      if not fp.exists() or _compute_entry_size(fp) != size:
          return False, None, True
    Keep the hasattr guards for cloud path compatibility.

- id: w3
  summary: "Fix data_validation.py size checks at lines 498 and 530"
  needs: [w1]
  status: done
  notes: |
    Same fix as w2 but in data_validation.py. Replace fp.stat().st_size with
    _compute_entry_size(fp) at both validation sites (line 498 for table expectations,
    line 530 for unknown benchmark validation).

- id: w4
  summary: "Add is_directory field to ConvertedFileEntry model and manifest serialization"
  needs: [w1]
  status: done
  notes: |
    Add optional `is_directory: bool = False` to ConvertedFileEntry in
    benchbox/core/manifest/models.py. Update _manifest_v2_to_dict() in
    benchbox/core/manifest/io.py to serialize this field (only when True,
    to avoid bloating existing manifests). This is forward-looking — validation
    can optionally use this hint instead of probing the filesystem. Existing
    manifests without the field default to False (file behavior).

- id: w5
  summary: "Set is_directory=True in all directory-based converters"
  needs: [w4]
  status: pending
  notes: |
    In _update_manifest_with_results() (conversion.py:220), detect whether
    output_file.is_dir() and set is_directory=True on the ConvertedFileEntry.
    This ensures newly-written manifests carry the directory flag.
    Affected converters: delta, iceberg, ducklake, partitioned parquet.

- id: w6
  summary: "Write unit tests for directory-based manifest validation"
  needs: [w2, w3]
  status: pending
  notes: |
    Add tests to tests/unit/core/test_runner_manifest_reuse.py:
    1. test_directory_entry_validates_successfully — create a manifest with a
       directory entry, populate it with files whose total size matches size_bytes,
       verify validation returns (True, manifest, True)
    2. test_directory_entry_size_mismatch_detected — same but add/remove a file
       so recursive sum differs, verify validation catches it
    3. test_file_entry_still_works — existing file-based validation unchanged

    Add parallel tests to tests/unit/utils/test_manifest_validation.py for the
    data_validation.py fix.

- id: w7
  summary: "Write unit test for _compute_entry_size helper"
  needs: [w1]
  status: pending
  notes: |
    Test the helper directly:
    1. Regular file → returns stat().st_size
    2. Directory with files → returns recursive sum
    3. Directory with nested subdirectories → includes all nested files
    4. Empty directory → returns 0
    5. Non-existent path → raises FileNotFoundError (or returns -1, match design)

- id: w8
  summary: "Integration test: Delta conversion → subsequent run reuses data"
  needs: [w2, w3, w5, w6]
  status: pending
  notes: |
    End-to-end test that:
    1. Generates TPC-H data at SF=0.01
    2. Converts to Delta format
    3. Runs again — verify data is reused (no "Manifest validation failed" warning)
    4. Verify benchmark completes without regeneration
    If an integration test fixture for delta conversion already exists in
    tests/integration/test_open_table_formats.py, extend it rather than creating
    a new file.

deferred:
- summary: "Optimize _compute_entry_size for large directories"
  reason: |
    For very large scale factors, rglob("*") during validation could be slow.
    Could cache file count + total size in manifest, or use a checksum.
    Not needed now — validation runs once per benchmark invocation.
- summary: "Backfill is_directory flag into existing manifests"
  reason: |
    Old manifests won't have is_directory. The helper probes the filesystem
    as fallback, so this is non-blocking. A migration script could be added
    later if desired.

must_preserve:
- "_validate_manifest_if_present() returns the same 3-tuple contract: (is_valid, manifest_dict_or_none, manifest_found)"
- "File-based format validation (parquet, vortex, tbl) continues to use exact stat().st_size comparison"
- "get_table_files() API and return format unchanged — all 6 callers unaffected"
- "ConversionResult.output_files continues to accept both file and directory Path objects"
- "ManifestV2 serialization remains backward-compatible (is_directory defaults to False)"
- "data_validation.py size checks for regular files remain exact (not relaxed)"

approach: |
  Follow the principle of least change: fix the validation inconsistency at the
  point of comparison rather than restructuring how manifest entries are stored.
  Directory-based entries are correct for data loading; only validation needs to
  be aware of the directory case.

  Implementation pattern: create a single _compute_entry_size(path: Path) -> int
  helper that mirrors exactly how converters compute size at write time. Use it
  in all 3 validation sites. Then optionally add is_directory to the manifest model
  for explicit signaling.

  Reference code for recursive size calculation:
    delta_converter.py:158
    iceberg_converter.py:278
    ducklake_converter.py:218

anti_patterns:
- "DO NOT store individual parquet files from inside delta/iceberg directories — because downstream loaders need the table
  directory path, not individual data files"
- "DO NOT skip size validation for directories entirely — because that would silently accept corrupted/incomplete data; use
  recursive sum instead"
- "DO NOT change the get_table_files() return format — because 6 callers depend on the current dict-list structure"
- "DO NOT use os.path.getsize on directories — because it returns inode size just like stat().st_size; must use rglob"

scope_limit:
  only_modify:
  - benchbox/utils/datagen_manifest.py
  - benchbox/core/runner/runner.py
  - benchbox/utils/data_validation.py
  - benchbox/core/manifest/models.py
  - benchbox/core/manifest/io.py
  - benchbox/core/runner/conversion.py
  - tests/unit/core/test_runner_manifest_reuse.py
  - tests/unit/utils/test_manifest_validation.py

