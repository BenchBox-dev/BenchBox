context_sections:
  "Full Analysis (2026-01-16)": |
    Comprehensive analysis of all ignored ty rules revealed that the original
    error estimates were significantly understated. Here are the actual findings:

    **Rules Now Enabled as Errors (56 total fixes):**
    | Rule | Fixed | Pattern |
    |------|-------|---------|
    | too-many-positional-arguments | 2 | Method signature corrections |
    | conflicting-declarations | 3 | Optional import patterns |
    | invalid-parameter-default | 11 | Added `| None` to param types |
    | unresolved-reference | 21 | Missing imports, TYPE_CHECKING |
    | not-iterable | 19 | Type narrowing, assertions |

    **Rules Remaining Ignored (architectural issues):**
    | Rule | Actual Hits | Root Cause |
    |------|-------------|------------|
    | call-non-callable | ~700 | Optional module imports, dynamic DataFrame APIs |
    | non-subscriptable | ~700 | Dynamic DataFrame APIs, Optional[dict] access |
    | invalid-method-override | 143 | Intentional LSP violations in benchmark hierarchy |
    | unsupported-operator | 184 | Dict counters without type annotations |
    | invalid-assignment | 463 | Literal type mismatches, Optional subscript |
    | invalid-argument-type | 763 | str vs Literal, Optional narrowing |
    | unresolved-attribute | 954 | Missing stubs, dynamic attrs, class methods |

    **Key Insight:** Most errors are in:
    - `unified_frame.py` (90+ per rule) - Intentional duck typing for DataFrame abstraction
    - `pyspark_df.py` (50+ per rule) - Dynamic PySpark API calls
    - `datafusion_df.py` (40+ per rule) - Dynamic DataFusion API calls
    - TPC-DI benchmark files - Dict counters without TypedDict
    - Platform adapters - Intentional method signature variations

  "Why These Rules Should Stay Ignored": |
    The remaining rules represent intentional design decisions:

    1. **Dynamic DataFrame Adapters** (~2,100 errors across 3 rules)
       - `UnifiedLazyFrame` uses duck typing to support Polars, PySpark, DataFusion
       - This is by design - type safety would require 3x code duplication
       - Alternative: Define Protocol classes (major refactoring)

    2. **Benchmark Inheritance** (143 invalid-method-override errors)
       - Different benchmarks have different `generate_data`, `run_benchmark` signatures
       - This is intentional polymorphism through duck typing
       - Alternative: Make base methods accept **kwargs (loses type info)

    3. **Dict Counter Patterns** (184 unsupported-operator errors)
       - `result["count"] += 1` where result is `dict[str, Any]`
       - Fix: Use TypedDict for all result dicts (major refactoring)

    4. **Optional Import Patterns** (~700 call-non-callable errors)
       - `if matplotlib is not None: matplotlib.pyplot.show()`
       - Type checker doesn't recognize the None guard
       - Fix: Add `# type: ignore[call-non-callable]` to 700+ lines (noise)

  "Recommended Path Forward": |
    Rather than adding 4,000+ `# type: ignore` comments, focus on:

    1. **Keep current rules enabled** - 5 rules as errors, 7 as ignore
    2. **Add types to new code** - All new functions should have full annotations
    3. **TypedDict for results** - Gradually add TypedDict to result dictionaries
    4. **Protocol classes** - Consider for platform adapters in future
    5. **Don't force LSP** - Accept intentional signature variations

    The current configuration provides value by catching:
    - Unresolved references (imports, typos)
    - Parameter default mismatches
    - Iteration over non-iterables
    - Conflicting declarations

    Without blocking intentional dynamic typing patterns.

impact:
  technical_debt: |
    Current state: 5 ty rules enabled as errors, 7 rules ignored (~4,000 errors)

    The ignored errors are NOT technical debt - they're false positives from
    intentional dynamic typing patterns. Adding type: ignore comments would
    actually create more debt (noise, maintenance burden).

  user_impact: |
    Type checking now catches:
    - Import errors (unresolved-reference)
    - None iteration bugs (not-iterable)
    - Parameter default bugs (invalid-parameter-default)

    While allowing intentional Python dynamism for DataFrame abstraction.

