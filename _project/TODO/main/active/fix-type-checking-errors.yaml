context_sections:
  "Root Cause Analysis": |
    The type errors fall into these root cause categories:

    1. **Missing Type Annotations** (~60% of errors)
       - Functions without return type hints
       - Parameters typed as implicit `Any`
       - Class attributes without type declarations
       Root cause: Code written before type checking was enforced

    2. **Dynamic Typing Patterns** (~20% of errors)
       - Dict/list access on unknown types (unresolved-attribute)
       - Optional values used without None checks
       - Generic containers without type parameters
       Root cause: Python's dynamic nature; need type guards

    3. **Inheritance Issues** (~10% of errors)
       - Subclass methods with different signatures
       - Abstract methods not properly decorated
       - Covariant/contravariant type issues
       Root cause: Organic codebase growth without LSP enforcement

    4. **External Dependencies** (~10% of errors)
       - Optional dependencies not installed (matplotlib, pynvml, mcp)
       - Missing type stubs for third-party packages
       - Conditional imports not understood by type checker
       Root cause: Need proper type: ignore comments or stubs

  "Current Ignored Rules": |
    **UPDATED 2026-01-16**: 4 rules enabled as errors (quick wins completed).

    Rules now set to "error" (FIXED):
    | Rule | Hits | Status |
    |------|------|--------|
    | too-many-positional-arguments | 2 | FIXED - enabled as error |
    | conflicting-declarations | 3 | FIXED - enabled as error |
    | invalid-parameter-default | 11 | FIXED - enabled as error |
    | unresolved-reference | 21 | FIXED - enabled as error |

    Rules still set to "ignore" (REMAINING):
    | Rule | Hits | Root Cause |
    |------|------|------------|
    | unresolved-attribute | 954 | Missing annotations, dynamic access |
    | invalid-argument-type | 763 | Missing param annotations |
    | invalid-assignment | 465 | Missing attribute annotations |
    | unsupported-operator | 184 | Dynamic typing patterns |
    | invalid-method-override | 144 | Inheritance issues |
    | non-subscriptable | 132 | Dynamic container access |
    | call-non-callable | 104 | Mock objects in tests |
    | not-iterable | 19 | Dynamic iteration |

  "Recommended Approach": |
    1. **Start with public API** - Add type annotations to all public functions
       in benchbox/__init__.py and benchbox/base.py first

    2. **Fix by module** - Work through one module at a time:
       - benchbox/core/config.py (foundational types)
       - benchbox/cli/ (user-facing code)
       - benchbox/platforms/ (adapter implementations)

    3. **Use pyright/mypy comments** - For intentional dynamic patterns:
       ```python
       result = dynamic_call()  # type: ignore[return-value]
       ```

    4. **Add Protocol classes** - For duck typing patterns:
       ```python
       class SupportsQuery(Protocol):
           def execute(self, sql: str) -> Any: ...
       ```

impact:
  technical_debt: |
    Current state: 12 ty rules ignored, ~2500 errors suppressed
    Target state: 0 rules ignored, all errors fixed or explicitly ignored with comments

    This is reducing the value of type checking to near zero - we're only
    catching syntax errors, not type errors.

  user_impact: |
    Better types will improve:
    - IDE autocomplete accuracy
    - Refactoring safety
    - API documentation (type hints as docs)
    - Bug detection before runtime

