    - ".github/workflows/ci.yml"

must_preserve:
  - "Existing chart visual output — extracting helpers must not change pixel-level rendering for the same input data"
  - "Existing `colorForCell` / `lightnessForCell` exported signatures from QueryHeatmap.tsx — these are imported elsewhere and tested"
  - "Vitest setup at `results-explorer/src/test/setup.ts` — append, do not replace"
  - "Existing 36-test Vitest suite continues to pass alongside the new parity suite"

approach: |
  Build foundation-first: extract pure helpers (w1) before generating
  fixtures (w2), because the fixture generator must mirror the exact
  signatures the helpers expose.

  Reuse the project's existing Python visualization functions where they
  exist as pure helpers — `core/visualization/ascii/heatmap.py` and
  siblings delegate to `textcharts`, but the pre-textcharts color/sort
  math may live in `result_plotter.py`. If a Python equivalent does not
  exist, ADD it (in Python) rather than picking a TS-only number, so
  parity is bidirectional.

  Fixture format mirrors the textcharts test pattern (if any) so future
  contributors recognize the convention. Keep fixtures small and readable
  — explicit `id` on each case is mandatory so failures are debuggable.

anti_patterns:
  - "DO NOT generate fixtures from the TS side — because that makes Python the follower, not the source of truth — Python (the canonical compute layer) emits, TS verifies"
  - "DO NOT use `toEqual` for floats in the parity suite — because IEEE-754 noise differs between Python and JS — use `Math.abs(a - b) < 1e-9` with explicit tolerance"
  - "DO NOT inline the math back into components after extraction — because that defeats the test contract — components import helpers, no exceptions"
  - "DO NOT skip cases for missing-data inputs (null/None) — because that is exactly where Python and JS often disagree (NaN vs null) — every helper must have at least one null-input case"
  - "DO NOT commit auto-regenerated fixtures without inspecting the diff — because the fixture IS the contract and silent regeneration hides drift — `make parity-check` must be run separately to detect diffs"

scope_limit:
  only_modify:
    - "results-explorer/src/lib/chartMath.ts"
    - "results-explorer/src/components/QueryHeatmap.tsx"
    - "results-explorer/src/components/NormalizedSpeedupChart.tsx"
    - "results-explorer/src/components/DivergingBarChart.tsx"
    - "results-explorer/src/pages/Compare.tsx"
    - "results-explorer/src/components/__tests__/QueryHeatmap.test.tsx"
    - "results-explorer/src/__tests__/parity/**"
    - "tests/parity/**"
    - "docs/visualization-parity.md"
    - "Makefile"
    - ".github/workflows/ci.yml"
  do_not_modify:
    - "benchbox/core/visualization/ascii/**"
    - "benchbox/core/visualization/result_plotter.py"
    - "benchbox/core/explorer_pipeline/**"

verification:
  - description: "Pure helper module exists and re-exports the documented functions"
    command: "grep -E 'export (function|const) (colorForCell|lightnessForCell|speedupRatio|deltaPct|sortByMagnitudeDesc|perQuerySpeedup|geomeanMs)' results-explorer/src/lib/chartMath.ts"
    expected_output: "all 7 named exports present"
  - description: "Fixture generator runs and produces one file per chart computation"
    command: "uv run -- python tests/parity/generate_visualization_fixtures.py --out tests/parity/fixtures && ls tests/parity/fixtures/*.json"
    expected_output: "at least 7 .json files matching the 7 helpers in w1"
  - description: "Vitest parity suite runs all fixture cases and passes"
    command: "cd results-explorer && npm test -- chartMath.parity"
    expected_output: "parity suite present, all cases pass"
  - description: "Make target detects fixture drift"
    command: "make parity-check"
    expected_output: "exit 0 when fixtures match, exit non-zero with diff when they don't"
  - description: "Existing QueryHeatmap unit tests still pass (refactored to use fixtures)"
    command: "cd results-explorer && npm test -- QueryHeatmap"
    expected_output: "all QueryHeatmap tests pass; no hardcoded color numbers remain in the test file"
  - description: "Full Vitest suite still passes (36 + new parity tests)"
    command: "cd results-explorer && npm test"
    expected_output: "all tests pass"

deps:
  needs: []

success_metrics:
  - "Every chart math helper in `chartMath.ts` has at least one parity fixture case"
  - "CI fails when a TS helper is changed without regenerating fixtures, AND when a Python helper is changed without re-running parity"
  - "Zero hardcoded expected color/speedup numbers remain in `*.test.tsx` files — they all flow through fixtures"

