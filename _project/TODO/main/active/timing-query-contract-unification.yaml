id: timing-query-contract-unification
title: "Unify runtime query timing contract to execution_time_seconds"
worktree: main
priority: High
status: In Progress
category: Core Functionality
description: |
  Standardize runtime query timing outputs to one canonical key,
  `execution_time_seconds`, and remove mixed-key result production in benchmark
  execution paths.

  This item addresses drift between parallel query execution implementations
  (SQL adapters, DataFrame expression family, DataFrame pandas family) and
  eliminates compatibility branching required solely because producers emit
  inconsistent timing keys.

  This TODO depends on the centralized clock foundation and applies its
  monotonic methodology to all benchmark-critical query execution producers.

deps:
  needs:
  - timing-clock-foundation-and-correctness

metadata:
  owners:
  - joe
  tags:
  - timing
  - result-contract
  - query-execution
  - normalization
  estimated_effort: 2-4 days
  created_date: '2026-02-12'

impact:
  business_value: |
    Eliminates ambiguity in runtime query timing fields, improving reliability
    of downstream metrics, dashboards, comparisons, and export tooling.
  technical_debt: |
    Removes duplicated compatibility logic caused by mixed key names from
    parallel query execution implementations.

files_affected:
  modified:
  - benchbox/platforms/dataframe/expression_family.py
  - benchbox/platforms/dataframe/pandas_family.py
  - benchbox/platforms/dataframe/benchmark_mixin.py
  - benchbox/platforms/base/adapter.py
  - benchbox/core/results/query_normalizer.py
  - benchbox/core/schemas.py
  - benchbox/core/results/schema.py
  - benchbox/core/results/exporter.py

must_preserve:
- "Query success/failure semantics and row_count behavior remain unchanged"
- "Existing benchmark result serialization remains compatible for external consumers"
- "DataFrame profiled execution continues to return detailed profile metadata"

approach: |
  First, update runtime query producers to emit `execution_time_seconds` using
  monotonic elapsed measurements. Then update internal consumers (normalizer,
  schema transform, exporters) to treat this key as canonical source.

  Convert ms output fields only at serialization boundaries; do not reintroduce
  ambiguous producer keys.

  Enforce `execution_time_seconds` as float in schema validation boundaries so
  serialization/deserialization does not silently truncate to integer values.

anti_patterns:
- "DO NOT keep emitting both execution_time and execution_time_seconds from runtime producers — because it preserves ambiguity
  — emit only canonical key"
- "DO NOT change external file schemas abruptly without conversion paths — because export/load compatibility matters — convert
  in normalizer/export layers"
- "DO NOT change query business logic while touching timing keys — because this item is contract-focused — isolate refactor
  to timing output and consumption"
- "DO NOT allow integer coercion/truncation for execution_time_seconds — because sub-second precision is required for benchmark
  fidelity — enforce float validation in schema boundaries"

verification:
- description: "DataFrame query execution tests validate canonical timing key output"
  command: "uv run -- python -m pytest tests/unit/platforms/dataframe/ -k 'execution_time or benchmark_mixin' -q"
  expected_output: "Selected tests pass with canonical timing key expectations"
- description: "Result normalizer and schema conversion tests pass with canonical timing key"
  command: "uv run -- python -m pytest tests/unit/core/results/ -k 'normalizer or schema or exporter' -q"
  expected_output: "Selected tests pass"
- description: "Fast runtime smoke remains green"
  command: "uv run -- python -m pytest -m fast -q"
  expected_output: "Fast marker tests pass"

scope_limit:
  only_modify:
  - benchbox/platforms/dataframe/expression_family.py
  - benchbox/platforms/dataframe/pandas_family.py
  - benchbox/platforms/dataframe/benchmark_mixin.py
  - benchbox/platforms/base/adapter.py
  - benchbox/core/results/query_normalizer.py
  - benchbox/core/schemas.py
  - benchbox/core/results/schema.py
  - benchbox/core/results/exporter.py
  - tests/unit/platforms/dataframe/
  - tests/unit/core/results/

success_metrics:
- "Runtime query producers use execution_time_seconds as canonical key"
- "Core result normalization and exporter paths consume canonical key without producer-side fallback coupling"
- "No benchmark-critical runtime path emits execution_time as canonical field"

