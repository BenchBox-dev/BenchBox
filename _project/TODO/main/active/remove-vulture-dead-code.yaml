id: remove-vulture-dead-code
title: "Remove dead code identified by vulture static analysis"
worktree: main
priority: High
status: In Progress
description: |
  A vulture analysis (80% confidence) identified 25 dead-code findings across
  3 categories. One of the unreachable-code findings is an active bug:
  `transformations.py._get_worker_pool_config` has `self.table_dependencies`
  initialization stranded after a `return` statement, making it unreachable —
  but the dict is read by `_get_topological_sort_order` at lines 2126/2130,
  which will raise AttributeError at runtime.

  Findings by category:
  - Unreachable code (3): duplicate returns/stranded init after return
  - Unused function parameters (12): 100%-confidence, params never read in body
  - Unused platform imports (10): 90%-confidence, need TYPE_CHECKING inspection

category: Testing & Quality

metadata:
  tags:
  - quality
  - dead-code
  - vulture
  estimated_effort: "Small"
  created_date: "2026-03-27"
  source_review: "vulture static analysis run 2026-03-27"

impact:
  user_impact: |
    None for parameter/import cleanup. The transformations.py bug (w1) could
    cause an AttributeError in TPC-DI ETL at runtime if topological sort is
    reached.
  maintainer_impact: |
    Cleaner codebase. Removes confusing dead parameter signatures and stray
    import noise. Prevents future confusion about whether stranded code is
    intentional.
  regression_risk: |
    Low for w2/w3 (no behavior change). Medium for w1 — moving init code back
    into __init__ changes when it runs; requires verifying no other call path
    already initializes table_dependencies.

justification: |
  The unreachable `table_dependencies` initialization is a latent bug: any
  TPC-DI workload that triggers `_get_topological_sort_order` without a prior
  successful `_get_worker_pool_config` call will crash. Unused parameters and
  imports are lower severity but degrade readability and confuse static
  analysis tooling.

work:
- id: w1
  summary: "Fix unreachable code — 3 instances including latent bug in transformations.py"
  status: done
  needs: []
  description: |
    Three locations with unreachable code to fix:

    1. benchbox/core/ssb/generator.py:183
       Duplicate `return file_paths` after a try/finally block that already
       returns at line 178. Delete the duplicate return.

    2. benchbox/core/tpcdi/etl/transformations.py:1658-1682
       LATENT BUG: `_get_worker_pool_config` returns at line 1656, leaving
       `self._configure_performance_settings()` and the full
       `self.table_dependencies = {...}` dict stranded as dead code.
       `table_dependencies` is read by `_get_topological_sort_order` at
       lines 2126/2130 — AttributeError at runtime if that path is hit.
       Fix: move the two statements (`_configure_performance_settings()` call
       and `table_dependencies` assignment) into `__init__`, before the
       method definitions. Verify no other path already sets this attribute.

    3. benchbox/platforms/databricks/adapter.py:674
       Duplicate `return elapsed_seconds(start_time)` after a try/except/finally
       block that either returns `duration` (line 665) or re-raises. Delete the
       duplicate return.
  files:
  - benchbox/core/ssb/generator.py
  - benchbox/core/tpcdi/etl/transformations.py
  - benchbox/platforms/databricks/adapter.py

- id: w2
  summary: "Fix unused function parameters — prefix with _ or implement (12 instances)"
  status: done
  needs: [w1]
  description: |
    12 function parameters declared but never read in their method bodies.
    For each: if the param is part of a public API or Protocol stub, rename to
    `_param` (signals intentional non-use to linters); if it was meant to
    affect behavior, implement it.

    Locations:
    - benchbox/cli/output.py:379           show_query_details (static method param)
    - benchbox/core/dataframe/protocols.py:330  *aggregations, **named_aggregations (Protocol stub)
    - benchbox/core/tpc_compliance.py:427  test_result (method param)
    - benchbox/core/tpc_metrics.py:590     include_details (static method param)
    - benchbox/core/tpcdi/source_generators.py:980  issue_rate (method param)
    - benchbox/core/tpcds/benchmark/runner.py:925-926  refresh_functions, data_maintenance
    - benchbox/core/tpcds_obt/query_conversion.py:950  dim_col
    - benchbox/core/tpch/maintenance_test.py:107  query_stream_duration
    - benchbox/platforms/fabric_warehouse.py:1182  constraint_configs

    For Protocol stubs (protocols.py), *args/**kwargs-style params are part of
    the interface definition — rename the concrete params to _aggregations /
    **_named_aggregations if the body is abstract.

    DO NOT rename params that are part of an overriding method that must match
    a base class signature — use `# noqa: ARG002` instead if rename would
    break override compatibility.
  files:
  - benchbox/cli/output.py
  - benchbox/core/dataframe/protocols.py
  - benchbox/core/tpc_compliance.py
  - benchbox/core/tpc_metrics.py
  - benchbox/core/tpcdi/source_generators.py
  - benchbox/core/tpcds/benchmark/runner.py
  - benchbox/core/tpcds_obt/query_conversion.py
  - benchbox/core/tpch/maintenance_test.py
  - benchbox/platforms/fabric_warehouse.py

