must_preserve:
- "transformations._get_topological_sort_order must be callable without AttributeError after w1"
- "TPC-DI ETL smoke test passes: uv run -- python -m pytest tests/unit/core/tpcdi/ -q"
- "No change to any public method signatures (rename params to _ only, never remove)"
- "Optional-dependency platform adapters still importable when dep is absent"

approach: |
  w1 first — it contains the only runtime-impacting bug. Read each file before
  editing. For transformations.py, grep the __init__ method to confirm
  table_dependencies isn't already set before adding the assignment.
  For w2, prefer `_param` rename over noqa comments; use noqa only when the
  param is required by a base class override signature. For w3, read each
  import site before deleting.

anti_patterns:
- "DO NOT remove function parameters from public methods — only rename to _ prefix. Removing breaks callers."
- "DO NOT add blanket noqa: F401 to suppress all platform imports — inspect each individually."
- "DO NOT batch all 3 work units into a single commit — commit each work unit separately so regressions are bisectable."

verification:
- description: "All unit tests pass after w1 (latent bug fix)"
  command: "uv run -- python -m pytest tests/unit/core/tpcdi/ tests/unit/core/ssb/ tests/unit/platforms/databricks/ -q"
  expected_output: "All tests pass, 0 errors"
- description: "Full fast test suite passes after each work unit"
  command: "make test-fast"
  expected_output: "All tests pass"
- description: "vulture confirms dead code removed"
  command: "uv run --with vulture vulture benchbox --min-confidence 80 --ignore-names issue_rate"
  expected_output: "Zero findings (issue_rate whitelisted: public kwarg used by tests)"
- description: "Lint clean after all changes"
  command: "uv run ruff check benchbox"
  expected_output: "All checks passed"

