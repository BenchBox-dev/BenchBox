metadata:
  tags:
  - "api-simplification"
  - "alpha-cleanup"
  - "breaking-change"
  - "compatibility-removal"
  estimated_effort: "Large"
  created_date: "2026-02-14"
  last_updated: "2026-02-14T00:00:00"

must_preserve:
- "Canonical benchmark execution paths (`benchbox run` with supported platforms/benchmarks) remain functional."
- "Core result generation and export for the canonical schema continue to work end-to-end."
- "Non-compatibility feature behavior (query execution correctness and validation semantics) is not changed beyond compatibility
  removal."

approach: |
  Use docs/reference/backward-compatibility.md as the single source of truth and process
  removals module-by-module in deterministic waves: core/platform/cli first, then tests,
  then docs. Prefer deleting code paths over redirecting aliases. When a legacy path and
  canonical path share logic, extract canonical behavior first, then remove branching.

anti_patterns:
- "DO NOT keep aliases with deprecation warnings — because this prolongs surface-area and maintenance cost — remove symbols
  outright in alpha."
- "DO NOT batch unverified removals across unrelated subsystems — because regression root-cause becomes opaque — validate
  each wave before proceeding."
- "DO NOT update only docs or only tests without deleting code branches — because stale compatibility paths will remain executable
  — delete implementation first then align tests/docs."

verification:
- description: "Backward-compatibility registry no longer contains active benchbox compatibility rows"
  command: "rg -n \"^\\| `benchbox/\" docs/reference/backward-compatibility.md"
  expected_output: "No output, or the registry page has been replaced by a historical note without active benchbox compatibility
    rows"
- description: "No compatibility-shim markers remain in production code"
  command: "rg -n \"backward compatibility|Backward compatibility|legacy compatibility|for backward compatibility|backward-compatible|LegacyGetTablesSource|compatibility
    alias\" benchbox"
  expected_output: "No matches representing compatibility shims"
- description: "Lint and formatting checks pass"
  command: "make ci-lint"
  expected_output: "All lint/format checks pass"
- description: "Type checks pass"
  command: "make typecheck-uv"
  expected_output: "Type checking passes with no errors"
- description: "Fast CI test profile passes"
  command: "make ci-test"
  expected_output: "Fast tests pass at project CI gate"

scope_limit:
  only_modify:
  - "benchbox/"
  - "tests/"
  - "docs/reference/backward-compatibility.md"
  - "docs/reference/index.md"
  - "_project/TODO/"
  - "_project/DONE/"
  do_not_modify:
  - "_sources/"
  - "_binaries/"
  - "benchmark_runs/"

success_metrics:
- "All compatibility rows in docs/reference/backward-compatibility.md are either removed from code or explicitly justified
  as non-shim and moved out of the registry."
- "No alias/re-export compatibility entries remain for alpha API surfaces in benchbox/core, benchbox/platforms, or benchbox/cli."
- "Repository CI profile used by test-fix (`make ci-lint && make ci-test`) passes after removals."

open_questions:
- "Should result-schema v1.x reader support be fully removed now or retained until a specific beta gate?"
- "Should the backward-compatibility registry remain as a historical record in docs, or be replaced by a breaking-changes
  policy page?"
