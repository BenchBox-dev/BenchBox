id: explorer-close-chart-type-coverage-gaps
title: "Close chart-type coverage gaps: percentile_ladder, cdf, rank_table, distribution_box, and 6 others"
worktree: main
priority: Medium-High
status: In Progress
category: Core Functionality

description: |
  The 2026-04-15 review found that the CLI registers **16 canonical
  chart types** in `benchbox/core/visualization/chart_types.py:17-45`,
  but the explorer implements only **6 visualization components**
  (QueryHeatmap, QueryTimingChart, GroupedQueryChart,
  NormalizedSpeedupChart, DivergingBarChart, MetaLeaderboard) —
  and only 3-4 of those have CLI counterparts that compute the same
  values. **10 CLI chart types have no explorer equivalent.**

  Missing chart types and their importance for benchmark credibility:

    | Chart                | Why it matters                                                   |
    |----------------------|------------------------------------------------------------------|
    | `percentile_ladder`  | Tail-latency P50/P90/P95/P99 — central to fair benchmark claims  |
    | `cdf_chart`          | Distribution shape — exposes "fast median, slow tail" patterns   |
    | `rank_table`         | Compact per-query ranking — denser than heatmap for many queries |
    | `distribution_box`   | Box-plot of per-query latencies — shows variance/outliers        |
    | `query_histogram`    | Per-query latency distribution                                   |
    | `time_series`        | Trend over runs — regression detection                           |
    | `cost_scatter`       | Cost vs performance — central to cloud-warehouse comparisons     |
    | `power_bar`          | Dedicated TPC Power@Size visual                                  |
    | `sparkline_table`    | Compact metrics summary with embedded micro-charts               |
    | `stacked_phase`      | Phase breakdown (load/warmup/power/throughput)                   |

  This item ports each missing chart type to the explorer in priority
  order. Every new chart consumes pipeline-emitted data
  (per `explorer-emit-comparison-artifact-from-pipeline` — extending
  the artifact emission as needed) and ships with a parity fixture
  (per `explorer-establish-cli-explorer-parity-tests`) so the math
  is verified against the canonical Python implementation from day one.

  Out of scope: building entirely NEW chart types that don't exist in
  the CLI either. Those should be evaluated and added to both sides
  through the canonical chart_types.py registry first.

work:
  # Per-chart workflow (apply uniformly to w1..w10):
  #   1. Read the CLI implementation (textcharts call site + reduction logic).
  #   2. Add Python helper / extend transformer.py to emit derived data
  #      via BenchmarkSummary or DetailResult.
  #   3. Generate parity fixture.
  #   4. Build SVG component using chartTheme.ts + useElementSize.
  #   5. Wire into the appropriate page (Compare/ResultDetail/BenchmarkIndex/PlatformIndex).
  #   6. Vitest unit + parity test.
  #   7. Manual smoke at 3 viewport widths.
  #
  # Tiering encoded via `needs`: w1/w2 (tail-latency) ship first; tier-2
  # depth (w3/w4) next; tier-3 specialized (w5/w6/w7) after; tier-4
  # cross-cutting (w8/w9/w10) last; w11 closes with the registry.

  - id: w1
    summary: "Port `percentile_ladder`: emit p50/p90/p95/p99 arrays + ladder SVG component"
    needs: []
    status: pending
    notes: |
      Tier 1 — highest-impact missing chart for tail-latency credibility.
      Placement: ResultDetail.tsx side panel + Compare.tsx tab alongside
      Speedup/Diverging/Grouped.

      Percentile method MUST match the Python reference exactly
      (numpy.percentile linear interpolation) — pre-compute in the
      pipeline and ship in the artifact, do not recompute in TS.

  - id: w2
    summary: "Port `cdf_chart`: emit CDF samples + SVG component"
    needs: []
    status: pending
    notes: |
      Tier 1 — distribution-shape companion to percentile_ladder.
      Placement: Compare.tsx tab + per-result detail page.
      Same pre-compute discipline: CDF samples emitted by Python.

  - id: w3
    summary: "Port `rank_table`: emit per-query rank matrix + table component"
    needs: []
    status: pending
    notes: |
      Tier 2 — per-query ranks (1..N) across platforms with optional
      ↑↓ rank-change arrows. Useful for TPC-DS (99 queries) where the
      heatmap becomes unwieldy. Add as alternate view alongside the
      heatmap; the heatmap stays the default.

      Rank ties are a known divergence risk (Python and JS sort
      algorithms differ silently) — fixture MUST cover ties.

  - id: w4
    summary: "Port `distribution_box`: emit min/Q1/median/Q3/max per query + box-plot component"
    needs: []
    status: pending
    notes: |
      Tier 2 — reveals platforms with high run-to-run variance even
      when median looks good. Consumes raw per-sample timings already
      in DetailResult.queries; reduction helper in transformer.py emits
      the five-number summary.
      Placement: alternate Compare view + ResultDetail
      "Per-query distribution" section.

  - id: w5
    summary: "Port `query_histogram`: emit binned histogram + SVG component (auto-split when query_count > 33)"
    needs: [w1, w2, w3, w4]
    status: pending
    notes: |
      Tier 3 — match the CLI auto-split behavior (when query count > 33
      the CLI splits into multiple panels). Bin edges decided in Python
      and shipped in the artifact so explorer cannot diverge.

  - id: w6
    summary: "Port `power_bar`: dedicated TPC Power@Size visualization (first-class on BenchmarkIndex)"
    needs: [w1, w2, w3, w4]
    status: pending
    notes: |
      Tier 3 — currently buried in Compare summary cards as a small dl
      row. Promote to a first-class chart on BenchmarkIndex when
      power_score is the primary metric for the benchmark family
      (consult lib/ranking.ts from explorer-unify-visualization-foundations).

  - id: w7
    summary: "Port `stacked_phase`: phase breakdown (load/warmup/power/throughput) stacked bars"
    needs: [w1, w2, w3, w4]
    status: pending
    notes: |
      Tier 3 — useful for TPC-H/TPC-DS where load and throughput phases
      matter for comparison fairness. Phase totals already in
      BenchmarkSummary; new component renders them as stacked bars
      per platform.

  - id: w8
    summary: "Port `time_series`: trend chart of geomean_ms / power_score over run_date, per platform"
    needs: [w5, w6, w7]
    status: pending
    notes: |
      Tier 4 — surfaces regressions across releases.
      Placement: PlatformIndex.tsx (per-platform history) + new
      BenchmarkIndex "Trends" tab.

      4-color PALETTE may be insufficient for many overlapping lines —
      extend chartTheme.ts with a dedicated TIME_SERIES_PALETTE if a
      contrast check fails.

  - id: w9
    summary: "Port `cost_scatter`: cost_usd vs power_score (or geomean_ms) scatter"
    needs: [w5, w6, w7]
    status: pending
    notes: |
      Tier 4 — central for cloud DW comparisons
      (Snowflake/BigQuery/Athena/Databricks).
      Placement: BenchmarkIndex when cost_usd is populated for >0
      results. Hide section entirely when no cost data exists
      (an empty scatter looks broken).

  - id: w10
    summary: "Port `sparkline_table`: compact metrics table with embedded micro-charts"
    needs: [w5, w6, w7]
    status: pending
    notes: |
      Tier 4 — compact alternative to the heatmap for the home page or
      platform overview. Each row carries a per-query trend mini-chart.

  - id: w11
    summary: "Add `chartRegistry.ts` mirroring chart_types.py + meta-test enforcing registry parity"
    needs: [w8, w9, w10]
    status: pending
    notes: |
      Final integration step:
        - Create `results-explorer/src/lib/chartRegistry.ts` mirroring
          the canonical 16-entry list from
          benchbox/core/visualization/chart_types.py.
        - Each registry entry: `{ id, title, description, requires:
          DataRequirements, component: ComponentRef, cli_equivalent: str }`.
        - Meta-test fails if the explorer registry diverges from the
          CLI registry (new chart type added on one side without the other).
        - Update `docs/visualization-parity.md` (created by
          `explorer-establish-cli-explorer-parity-tests`) with the
          full chart-type matrix and the policy: "New chart types are
          added to chart_types.py first; explorer follows."

deferred:
  - summary: "Build entirely NEW chart types that don't exist in CLI either"
    reason: "Out of scope for this item. Those should be added to chart_types.py registry first via a separate planning round."
  - summary: "WebGL/Canvas rendering for high-density visualizations (e.g. histogram with thousands of points)"
    reason: "Premature optimization — SVG handles realistic data sizes; revisit if profiling shows pain points."
  - summary: "User-saveable chart configurations / dashboards"
    reason: "Product feature, not a coverage gap. Address after the chart catalog is complete."
  - summary: "Interactive drilldowns (click chart bar to filter table)"
    reason: "Cross-cutting UX work; better tackled as a focused interactivity item once all charts exist."

