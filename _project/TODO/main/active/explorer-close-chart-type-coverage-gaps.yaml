verification:
  - description: "All 10 missing chart components exist as files"
    command: "ls results-explorer/src/components/{PercentileLadder,CDFChart,RankTable,DistributionBox,QueryHistogram,PowerBar,StackedPhase,TimeSeries,CostScatter,SparklineTable}.tsx"
    expected_output: "all 10 files present"
  - description: "Every new chart has a corresponding parity fixture"
    command: "ls tests/parity/fixtures/{percentile_ladder,cdf,rank_table,distribution_box,query_histogram,power_bar,stacked_phase,time_series,cost_scatter,sparkline_table}.json"
    expected_output: "all 10 fixtures present"
  - description: "Parity suite passes for all new charts"
    command: "cd results-explorer && npm test -- chartMath.parity"
    expected_output: "all 10 chart fixtures pass equivalence assertions"
  - description: "Explorer chartRegistry mirrors CLI chart_types"
    command: "cd results-explorer && npm test -- chartRegistry"
    expected_output: "registry-parity test passes — 16 entries on both sides, no divergence"
  - description: "Each new chart has Vitest unit coverage"
    command: "cd results-explorer && npm test -- 'PercentileLadder|CDFChart|RankTable|DistributionBox|QueryHistogram|PowerBar|StackedPhase|TimeSeries|CostScatter|SparklineTable'"
    expected_output: "tests cover empty data, single result, missing fields, and at least one realistic data shape per chart"
  - description: "Pipeline emits the new derived data fields"
    command: "uv run -- python -m pytest tests/unit/core/explorer_pipeline/ -v"
    expected_output: "tests cover percentile arrays, distribution stats, etc. as added to BenchmarkSummary / DetailResult"
  - description: "TypeScript compiles, full test suite green"
    command: "cd results-explorer && npm run typecheck && npm test && cd .. && uv run -- python -m pytest -m fast -q"
    expected_output: "all green"

