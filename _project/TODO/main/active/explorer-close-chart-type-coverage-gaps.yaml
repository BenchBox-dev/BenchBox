must_preserve:
  - "Existing 6 explorer chart components must continue to work — new charts add tabs/sections, do not replace existing visualizations"
  - "ResultDetail / BenchmarkIndex / PlatformIndex existing layouts and navigation patterns — additions are introduced as tabs or new sections, not page rewrites"
  - "BenchmarkSummary and DetailResult artifact backward compatibility — extensions add new fields, do not rename or remove existing ones"
  - "CLI chart_types.py registry as the single canonical source — explorer mirrors it, never the other way around"

approach: |
  Tier-by-tier (w1 → w4) so user-visible value lands in priority order.
  Tier 1 (percentile_ladder, cdf_chart) ships first because that's the
  highest-impact gap for benchmark credibility.

  Per-chart workflow (apply uniformly):
    1. Read the CLI implementation (find the textcharts call site,
       identify input shape and reduction).
    2. Decide where the math lives. Default: in
       `transformer.py`, emitted via the appropriate artifact
       (BenchmarkSummary for cross-platform; DetailResult for
       single-result). Avoid TS-side computation.
    3. Generate parity fixtures.
    4. Build the SVG component using `chartTheme.ts` constants and
       `useElementSize` for responsiveness.
    5. Wire into the appropriate page (Compare, ResultDetail,
       BenchmarkIndex, PlatformIndex).
    6. Vitest unit + parity test.
    7. Manual smoke at 3 viewport widths.

  This item is sequenced AFTER the foundational items
  (`explorer-establish-cli-explorer-parity-tests`,
  `explorer-emit-comparison-artifact-from-pipeline`,
  `explorer-unify-visualization-foundations`) because each new chart
  needs the parity fixtures, theme constants, and pipeline-emitted
  data structures those items deliver.

anti_patterns:
  - "DO NOT add a new chart in the explorer without a corresponding entry in chart_types.py — because that recreates the divergence we're trying to eliminate — extend the registry first if a new type is genuinely warranted"
  - "DO NOT compute percentiles in TS using `array.sort()[Math.floor(n*p)]` — because Python's numpy.percentile uses linear interpolation by default and the numbers will differ — read the CLI's exact percentile method and either match it in TS or pre-compute in Python and ship in artifact"
  - "DO NOT skip parity fixtures for 'simple' charts like rank_table — because rank ties are exactly the kind of edge case where Python and JS sort algorithms can differ silently — every chart gets a fixture"
  - "DO NOT render cost_scatter when cost_usd is null for all results — because an empty scatter plot looks broken — hide the section entirely with a small note about cost data availability"
  - "DO NOT replace the existing QueryHeatmap with rank_table on TPC-DS just because the heatmap is wide — because users have built mental models around the heatmap — add rank_table as an alternate view, let users switch"
  - "DO NOT reuse PALETTE colors for time_series lines without a contrast check — because 4 line colors must be distinguishable when overlapping — extend chartTheme.ts with a dedicated TIME_SERIES_PALETTE if the 4-color palette is insufficient"

