must_preserve:
  - "_project/scripts/ invocation path — `uv run --project _project/scripts` must continue to work; do not move any file under _project/scripts/"
  - "_project/config/timing_wall_clock_allowlist.json path — referenced verbatim in AGENTS.md line 64 and by timing_policy_check.py"
  - "_project/TODO_SCHEMA.yaml and _project/TODO_ENTRY_TEMPLATE.yaml paths — referenced in AGENTS.md and by validate_todo.py"
  - "_project/TODO/ and _project/DONE/ directory structure — the active project management system must remain intact"
  - "All git mv operations must use `git mv`, not shell cp+rm, to preserve file history"

approach: |
  Work in parallel where possible: w2 (archive clutter) and w3 (move ADRs) and w4 (move analysis docs)
  have no mutual dependencies and can be done in any order or simultaneously in one commit.
  w1 (research gate) must complete before w5. w6 (stale reference scan) must run after all moves.

  Rule of thumb for the research gate: if a file's last git commit is >90 days old AND no open
  TODO item explicitly depends on it, treat it as archivable. If a file is referenced by grep hits
  outside _project/, it is misplaced and should move to docs/.

  For reference updates: update live docs (docs/, results-data/, AGENTS.md) but do NOT update
  _project/handoffs/ — those are historical records where broken internal links are acceptable.

  Stage files explicitly by path (never `git add -A`). Use `git mv` not `cp` + `rm` for all
  file relocations to preserve history. Bundle w2 + w3 + w4 into a single commit if they have
  no reference-update entanglements; otherwise separate for clarity.

anti_patterns:
  - "DO NOT move _project/scripts/ or _project/config/ — because they form an intentionally isolated Python environment with `uv run --project _project/scripts` as the canonical invocation — moving them would break every command in CLAUDE.md and AGENTS.md"
  - "DO NOT use `git add -A` or `git add .` — because this repo has strict per-file staging policy and generated files could accidentally be staged — add each path explicitly"
  - "DO NOT bulk-move _project/specs/ without reading them first — because specs may be internal-only design notes that would be inappropriate to publish in docs/ — the research gate (w1) must answer this first"
  - "DO NOT update reference links inside _project/handoffs/ files — because those are historical records and patching them wastes time with no benefit — stale links in historical docs are acceptable"
  - "DO NOT archive or move PROJECT_TODO.yaml and PROJECT_DONE.yaml without git mv — because git rm + git add would lose file history — always use git mv even when moving to _archive/"
  - "DO NOT attempt to condense DATAFRAME_SUPPORT_MASTER.md into a short docs page without the research gate confirming it is still actively consulted — if it's unused, plain archiving is the right call"

verification:
