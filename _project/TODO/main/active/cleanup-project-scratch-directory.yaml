id: cleanup-project-scratch-directory
title: "Relocate canonical assets out of _project/ scratch area to proper homes"
worktree: main
priority: Medium-High
status: In Progress
category: Code Quality and Technical Debt

description: |
  The `_project/` directory was designed as a scratch/transient working area.
  A 2026-04-15 audit revealed it now contains a mix of intentional permanent
  assets and misplaced canonical ones:

  CONFIRMED CLUTTER (unambiguous — archive or delete):
    - 3 superseded monolithic TODO YAMLs totalling ~1.1 MB
      (PROJECT_TODO.yaml, PROJECT_DONE.yaml, PROJECT_TODO.yaml.before-fix)
    - 10 MB coverage.json (generated artifact, should not be tracked in git)
    - 2 timing report text files (generated output, reproducible)
    - 1 POC script (dataframe_poc.py, superseded by production code)
    - 1 one-off analysis artifact (reclassification.yaml)

  CONFIRMED MISPLACED (should live in docs/):
    - _project/adr/ — 2 ADRs belong in docs/development/adr/
    - _project/analysis/hosted-results-contract.md — live contract referenced by
      results-data/README.md and docs/operations/results-phase-2-runbook.md
    - _project/analysis/threat-model.md — canonical security doc
    - _project/analysis/benchbox-results-platform-strategy.md — active strategy doc

  OPEN QUESTIONS requiring a research gate (see w1):
    - _project/specs/ (30+ files, 1.7 MB) — authoritative or internal-only?
    - _project/DESIGN-integrated-task-management.md — stays near the TODO system
      it describes, or moves to docs/development/?
    - _project/PLATFORM_INTEGRATION_ROADMAP.md, RELEASE_PRIORITIZATION_v1.md,
      PRE_RELEASE_CHECKLIST.md — active agent reference artifacts or publishable docs?
    - _project/DATAFRAME_SUPPORT_MASTER.md + format-converter/query-plan docs —
      live architecture references or completed-milestone archives?
    - _project/handoffs/ — active context for in-flight work or historical records?

  INTENTIONALLY STAYS in _project/ (do not touch):
    - _project/scripts/ — isolated pyproject.toml prevents dependency leakage into
      the main wheel; invocation `uv run --project _project/scripts` is canonical
    - _project/config/ — config for the scripts above; co-located by design
    - _project/TODO_SCHEMA.yaml, TODO_ENTRY_TEMPLATE.yaml — used by validate_todo.py
    - _project/TODO/, _project/DONE/ — the active project management system
    - _project/scratch/, _project/notes/, _project/_archive/, _project/_trash/

work:
  - id: w1
    summary: "Research gate: read and classify the 5 ambiguous asset groups"
    status: done
    notes: |
      VERDICT Q1 — _project/specs/ → OPTION C: ARCHIVE. docs/benchmarks/ and
      docs/platforms/ are comprehensive (25+ and 50+ files respectively) and cover
      all the same benchmarks and platforms. specs/ has zero external references
      outside _project/. Decision: git mv _project/specs/ _project/_archive/specs/

      VERDICT Q2 — DESIGN-integrated-task-management.md → OPTION B: MOVE.
      Zero external references found (grep confirmed no hits outside the TODO file).
      Standalone architecture doc describing task system design. Move to
      docs/development/task-management-design.md.

      VERDICT Q3 — Roadmap/quality docs → OPTION C: ARCHIVE. PLATFORM_INTEGRATION_ROADMAP.md
      last commit Nov 2024. PRE_RELEASE_CHECKLIST.md and RELEASE_PRIORITIZATION_v1.md only
      referenced in completed DONE items (PROJECT_DONE.yaml, _project/DONE/). All describe
      completed pre-release planning. Archive to _project/_archive/.

      VERDICT Q4 — DATAFRAME_SUPPORT_MASTER.md + related → OPTION A: ARCHIVE. No open
      TODO depends on these files. Only self-referential _project/ links. No active
      implementation work references them. Archive to _project/_archive/.

      VERDICT Q5 — _project/handoffs/ → OPTION B: PARTIAL ARCHIVE. Most recent file
      (results-publishing-handoff-2026-04-04.md) was updated 2026-04-12 describing active
      Phase 2 results-publishing work (PR #53). Keep it active. Archive the other 3 older
      handoffs to _project/_archive/handoffs/.

  - id: w2
    summary: "Archive superseded monolithic YAMLs and delete generated artifacts"
    status: done
    notes: |
      No research gate required — these are unambiguously clutter.

      ARCHIVE with git mv (preserve history):
        git mv _project/PROJECT_TODO.yaml _project/_archive/PROJECT_TODO.yaml
        git mv _project/PROJECT_DONE.yaml _project/_archive/PROJECT_DONE.yaml
        git mv _project/PROJECT_TODO.yaml.before-fix _project/_archive/PROJECT_TODO.yaml.before-fix
        git mv _project/timing_report.txt _project/_archive/timing_report.txt
        git mv _project/timing_report_all.txt _project/_archive/timing_report_all.txt
        git mv _project/dataframe_poc.py _project/_archive/dataframe_poc.py
        git mv _project/reclassification.yaml _project/_archive/reclassification.yaml

      DELETE (generated, reproducible, not worth archiving):
        git rm _project/coverage.json

      GITIGNORE: check if _project/coverage.json is in .gitignore.
        grep "coverage.json" .gitignore
        If absent, add the line: _project/coverage.json

      POST-MOVE VERIFICATION:
        uv run --project _project/scripts -- python _project/scripts/todo_cli.py stats
        Expected: same item counts as before — confirms no TODO path breakage.

  - id: w3
    summary: "Move ADRs from _project/adr/ to docs/development/adr/"
    status: pending
    notes: |
      Source files (confirmed no production code dependency on these paths):
        _project/adr/0001-unified-platform-registration.md
        _project/adr/adr-textcharts-extraction.md

      Steps:
        mkdir -p docs/development/adr/
        git mv _project/adr/0001-unified-platform-registration.md docs/development/adr/0001-unified-platform-registration.md
        git mv _project/adr/adr-textcharts-extraction.md docs/development/adr/adr-textcharts-extraction.md

      UPDATE REFERENCES (exactly one external reference confirmed):
        File: _blog/building-benchbox/outlines/06-extracting-textcharts.md
        Search: grep -n "_project/adr" _blog/building-benchbox/outlines/06-extracting-textcharts.md
        Update the path from `_project/adr/adr-textcharts-extraction.md`
        to `docs/development/adr/adr-textcharts-extraction.md`.

      Also scan for any other references:
        grep -r "_project/adr" . --include="*.md" --include="*.rst" --include="*.yaml"
        Expected after fix: zero matches.

      Consider adding docs/development/adr/README.md (one line: "Architecture Decision Records")
      to make the directory self-documenting if it doesn't already have one.

  - id: w4
    summary: "Move 3 canonical analysis docs to proper docs/ locations"
    status: pending
    notes: |
      These 3 files are actively linked from outside _project/ and belong in docs/.
      Confirmed external references exist to all three.

      MOVE A — hosted-results-contract.md:
        git mv _project/analysis/hosted-results-contract.md docs/reference/hosted-results-contract.md
        Update references:
          grep -rn "hosted-results-contract" . --include="*.md" --include="*.rst"
          Files confirmed to reference it:
            - results-data/README.md
            - docs/operations/results-phase-2-runbook.md
            - _project/analysis/benchbox-results-platform-strategy.md (update in-place after move B)
            - _project/handoffs/ (do NOT update — historical records, broken links acceptable)

      MOVE B — threat-model.md:
        git mv _project/analysis/threat-model.md docs/reference/threat-model.md
        Update references:
          grep -rn "threat-model" . --include="*.md" --include="*.rst"
          Update any hits outside _project/handoffs/

      MOVE C — benchbox-results-platform-strategy.md:
        git mv _project/analysis/benchbox-results-platform-strategy.md docs/development/benchbox-results-platform-strategy.md
        Update references:
          grep -rn "benchbox-results-platform-strategy" . --include="*.md"
          Update any hits outside _project/handoffs/

      FINAL VERIFICATION:
        grep -r "_project/analysis/hosted-results-contract\|_project/analysis/threat-model\|_project/analysis/benchbox-results-platform-strategy" \
             . --include="*.md" --include="*.rst"
        Expected: zero matches (handoff internal links excluded from this check).

  - id: w5
    summary: "Execute research-gate decisions for specs, design docs, roadmaps, and handoffs"
    needs: [w1]
    status: pending
    notes: |
      Apply one of the classified actions per research gate outcome. The exact moves
      depend entirely on w1 findings — the options are specified here:

      FOR _project/specs/ — pick ONE:
        Option A (authoritative content not in docs/):
          For each unique spec file: git mv _project/specs/{name}.md docs/benchmarks/{name}.md
          OR git mv _project/specs/platforms/{name}.md docs/platforms/{name}.md
          Archive anything already covered: git mv _project/specs/{dup}.md _project/_archive/specs/{dup}.md
        Option B (internal design notes only):
          Write _project/specs/README.md: "Internal design notes — not published. See docs/ for authoritative content."
          No moves needed.
        Option C (superseded by public docs):
          git mv _project/specs/ _project/_archive/specs/

      FOR _project/DESIGN-integrated-task-management.md — pick ONE:
        Option A (agent navigation reference → stay in _project/): no action.
        Option B (publishable architecture doc → move):
          git mv _project/DESIGN-integrated-task-management.md docs/development/task-management-design.md
          grep -rn "DESIGN-integrated-task-management" . --include="*.md" --include="*.py" --include="*.yaml"
          Update any hits.

      FOR roadmap/quality docs (PLATFORM_INTEGRATION_ROADMAP.md, RELEASE_PRIORITIZATION_v1.md, PRE_RELEASE_CHECKLIST.md) — pick ONE:
        Option A (agent-facing action lists → stay in _project/): no action.
        Option B (publishable → merge/move to docs/development/):
          git mv each file to appropriate docs/ path.
        Option C (completed milestones → archive):
          git mv each file to _project/_archive/

      FOR _project/DATAFRAME_SUPPORT_MASTER.md + FORMAT_CONVERTER_*.md + query_plan_*.md — pick ONE per file:
        Option A (not consulted in >90 days, no open TODO dependency): git mv to _project/_archive/
        Option B (active reference → condense): Do NOT bulk-move the 67 KB master doc.
          Create a condensed docs/development/dataframe-support-architecture.md (key decisions only)
          and archive the master doc. This is non-trivial — only do this if clearly warranted.

      FOR _project/handoffs/ — pick ONE:
        Option A (all historical): git mv _project/handoffs/ _project/_archive/handoffs/
        Option B (most recent is active): git mv older handoffs individually to _project/_archive/handoffs/
          Leave the most recent 1-2 in _project/handoffs/.

  - id: w6
    summary: "Update AGENTS.md and any remaining stale cross-references"
    needs: [w3, w4, w5]
    status: pending
    notes: |
      Scan for any paths moved in w3, w4, w5 that still have stale references:

        grep -r "_project/adr" . --include="*.md" --include="*.rst" --include="*.py" --include="*.yaml"
        grep -r "_project/analysis/hosted-results-contract\|_project/analysis/threat-model\|_project/analysis/benchbox-results-platform-strategy" \
             . --include="*.md" --include="*.rst"

      If w5 moved specs/ or design docs, also run:
        grep -r "_project/specs\|_project/DESIGN-integrated-task-management\|_project/PLATFORM_INTEGRATION_ROADMAP\|_project/RELEASE_PRIORITIZATION\|_project/PRE_RELEASE_CHECKLIST" \
             . --include="*.md" --include="*.rst" --include="*.yaml"

      Fix every match that falls outside _project/handoffs/ (historical docs — broken links there are acceptable).
      If AGENTS.md references any moved file, update it. The timing_wall_clock_allowlist.json reference
      in AGENTS.md line 64 MUST NOT be changed (that file is not moving).

  - id: w7
    summary: "Validate TODO system integrity and commit all changes"
    needs: [w2, w3, w4, w5, w6]
    status: pending
    notes: |
      Run full validation suite:
        uv run --project _project/scripts -- python _project/scripts/validate_todo.py --all
        uv run --project _project/scripts -- python _project/scripts/todo_cli.py check-graph
        uv run --project _project/scripts -- python _project/scripts/generate_indexes.py

      Run fast tests to confirm nothing is broken:
        uv run -- python -m pytest -m fast -q

      Commit with explicit staging — DO NOT use git add -A:
        git add <each moved/modified file by path>
        git commit -m "chore(cleanup): relocate canonical assets out of _project/ scratch area"

      Commit message should list the major moves: ADRs, analysis docs, archived YAMLs,
      and note which research-gate decisions were made.

deferred:
  - summary: "Automate stale-reference detection via CI lint"
    reason: |
      A grep-based CI step could catch future cases where docs are created inside
      _project/ and linked from outside. Deferred because it requires writing a
      check_project_references.py script and wiring it into the Makefile — small
      enough to add as a follow-up TODO once this cleanup is done.
  - summary: "Compress or split DATAFRAME_SUPPORT_MASTER.md into topic-scoped reference docs"
    reason: |
      The 67 KB master doc is dense. Breaking it into per-topic pages in docs/
      would improve discoverability, but requires careful editing to avoid losing
      context. Deferred until the research gate confirms the doc is still actively
      consulted (if it's not, archiving is sufficient).

