    command: "uv run --project _project/scripts -- python _project/scripts/todo_cli.py stats"
    expected_output: "Item counts match pre-cleanup totals; no errors about missing schema or config files"
  - description: "No stale references to moved ADR paths"
    command: "grep -r '_project/adr' . --include='*.md' --include='*.rst' --include='*.yaml'"
    expected_output: "Zero matches"
  - description: "No stale references to moved analysis docs"
    command: "grep -r '_project/analysis/hosted-results-contract\\|_project/analysis/threat-model\\|_project/analysis/benchbox-results-platform-strategy' . --include='*.md'"
    expected_output: "Zero matches"
  - description: "Archived monolithic YAMLs are gone from _project/ root"
    command: "ls _project/PROJECT_TODO.yaml _project/PROJECT_DONE.yaml 2>&1"
    expected_output: "ls: cannot access (files no longer at root)"
  - description: "coverage.json absent from _project/ root"
    command: "ls _project/coverage.json 2>&1"
    expected_output: "ls: cannot access"
  - description: "Fast tests still pass"
    command: "uv run -- python -m pytest -m fast -q"
    expected_output: "All tests pass, no failures"
  - description: "TODO graph validation passes"
    command: "uv run --project _project/scripts -- python _project/scripts/todo_cli.py check-graph"
    expected_output: "No cycles or dangling dependency edges"

