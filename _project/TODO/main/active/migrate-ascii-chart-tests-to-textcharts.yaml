must_preserve:
- "BenchBox integration tests (ResultPlotter, ascii_runtime, exporters, templates, chart suggestions) remain in BenchBox"
- "textcharts tests import from `textcharts.*` directly, not through BenchBox shims"
- "BenchBox golden output snapshot tests continue to pass"
- "No test coverage gaps — every test moved to textcharts must pass there"

approach: |
  Incremental migration: move tests class-by-class, verify at each step.
  Start with core chart types (simplest imports), then edge cases, then
  advanced charts, then split the mixed classes last.

  Import rewriting is mechanical: `from benchbox.core.visualization.ascii.X import Y`
  becomes `from textcharts.X import Y`. The only complication is the 4 mixed
  classes that need splitting.

anti_patterns:
- "DO NOT delete tests from BenchBox before verifying they pass in textcharts — because
  a failed migration would leave both repos without coverage — always verify first."
- "DO NOT move tests that import BenchBox-specific fixtures (make_normalized_result) or
  modules (ascii_runtime, exporters, templates) — because these test integration logic
  that belongs in BenchBox — review each class carefully."
- "DO NOT batch-move all tests in one commit — because a single broken import rewrite
  would fail the entire migration — commit in logical groups (core types, edge cases,
  advanced charts, splits)."

scope_limit:
  only_modify:
  - "tests/unit/visualization/ascii/test_ascii_charts.py"
  - "~/Developer/textcharts/tests/"
  do_not_modify:
  - "benchbox/core/visualization/"
  - "benchbox/cli/"
  - "benchbox/mcp/"

