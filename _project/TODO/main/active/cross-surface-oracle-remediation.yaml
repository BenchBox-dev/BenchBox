      - "The clickbench analysis doc no longer claims 'no logic bugs'; it cites the fixed Q6/Q17/Q18."

  - id: w6
    summary: "Add a production-loader-path gate cell + harden the DDL parser and type maps (M4, L1, L2)"
    status: pending
    addresses: [M4, L1, L2, "review:MEDIUM M4", "review:LOW L1/L2"]
    progress: |
      PARSER SUB-PART DONE (L1, fix/dataframe-ddl-column-parser): replaced the
      naive column.split() in schema_utils.column_name/column_sql_type with a
      paren-aware, quote-aware DDL column parser (_split_ddl_column). It now
      preserves parenthesized precision/scale with internal commas/spaces
      (DECIMAL(10, 2), VARCHAR(255), NUMERIC(18, 4)), multi-word types
      (DOUBLE PRECISION, TIMESTAMP WITH/WITHOUT TIME ZONE, CHARACTER VARYING),
      and quoted/bracketed/backtick identifiers with internal spaces
      ("odd name", [odd name], `odd name`); trailing constraints (NOT NULL,
      DEFAULT ..., PRIMARY KEY, UNIQUE, CHECK(...), REFERENCES ...) are stripped
      from the type. Simple "name TYPE" behavior is byte-identical. New table-
      driven unit tests in tests/unit/core/dataframe/test_schema_utils_ddl_parser.py
      (59 cases). Verified: dataframe + joinorder unit suites (1298 passed),
      joinorder_synthetic and ssb cross-surface gates green (0 divergent),
      tpchavoc-equivalence-report unchanged (220 equivalent).
      STILL OPEN (do not close w6): the production-loader-path gate cell (M4
      loader bypass), the remaining raw-CSV adapter empty-string contract
      (Polars/modin/dask/cudf scan_csv), applying declared STRING dtypes on the
      production load path, and closing the joinorder_synthetic deferral. The
      loader PYARROW/polars/pandas type-map gaps (L2) were done in #857.
    notes: |
      The gate's loader bypass (dataframe_surface.py:74-125 materializes from typed
      DuckDB Arrow) means it cannot see production CSV->parquet dtype corruption.
        - Add a gate cell/mode that loads each gated benchmark through the REAL
          DataFrameDataLoader (CSV->parquet->read_parquet) and compares both dtypes
          and values to the SQL reference, so loader corruption is observable.
        - Carry the w1 empty-string->'' contract to the remaining raw-CSV adapters.
          w1 fixed the Parquet path (strings_can_be_null=False) and the pandas CSV
          path; Polars scan_csv / modin / dask / cudf still map an empty string
          field to null on their raw-CSV read, so prefer_parquet=False (or a
          CSV-recommending adapter) reintroduces the Q6/Q17/Q18 divergence on those
          surfaces. Thread declared column types into each adapter's read_csv and
          preserve '' for string columns, mirroring pandas_df.read_csv.
        - Harden schema_utils.column_name/column_sql_type (schema_utils.py:29-51):
          replace the naive column.split() with a paren-aware, quote-aware DDL
          column parser that handles DECIMAL(10, 2) (space after comma), quoted/
          spaced names, and multi-word types (DOUBLE PRECISION, TIMESTAMP WITH TIME
          ZONE, NOT NULL DEFAULT ...). Add unit tests for each shape.
        - Extend PYARROW_TYPE_MAP and the polars/pandas maps (data_loader.py:191-199)
          to cover TEXT, BIGINT, REAL, DOUBLE PRECISION, NUMERIC, BOOLEAN so declared
          string/numeric types are applied at conversion instead of inferred.
        - Apply declared STRING dtypes on the production load path (not just date-
          name suppression) so a leading-zero VARCHAR is not inferred as int.
      Re-verify the real DataFrame benchmark run still works (this is a loader fix,
      not gate-only special-casing).
    acceptance:
      - "A leading-zero VARCHAR ('007') and an all-empty TEXT column survive the production load path identical to the SQL reference (new test)."
      - "schema_utils parser unit tests pass for DECIMAL(p, s), quoted names, and multi-word types."
      - "joinorder_synthetic's 10 deferred dtype divergences are resolved on the production path (closes the #847 deferral)."

  - id: w7
    summary: "Stop overclaiming independence; document what the oracle actually proves (BS1)"
    status: done
    addresses: [BS1, "review:Blind Spot 1", "claim 1"]
    progress: |
      DONE: corrected the cross_surface.py module docstring and the
      dataframe_surface.py DATAFRAME_BACKENDS comment - they no longer claim "two
      independent implementations"; they state the oracle catches transcription
      (not conceptual) errors, and that ssb + most clickbench generate BOTH
      DataFrame backends from one DSL spec (no backend-vs-backend independence)
      while coffeeshop AND amplab hand-write a separate impl per backend (verified
      by inspecting the query modules - amplab is hand-written too, not only
      coffeeshop). Added the per-benchmark generated-vs-hand-written record at
      _project/analysis/cross-surface-oracle-independence.md.
    notes: |
      Correct the docstrings that assert "two independent implementations"
      (cross_surface.py:3-6) and "independent ... can diverge independently"
      (dataframe_surface.py:48-50). For SSB and ~40/43 ClickBench queries BOTH
      backends are generated from one DSL spec row, so they cannot diverge on logic
      - only on engine semantics; the only real independence is SQL-text vs DSL-spec
      (same author, same understanding). State plainly that the oracle catches
      TRANSCRIPTION errors, not CONCEPTUAL ones, for DSL-generated benchmarks.
      Record per gated benchmark whether its DataFrame surface is hand-written
      (coffeeshop) or generated (ssb, clickbench). Optional but recommended: for at
      least the enforced gates, ensure one surface is independently authored, or add
      a second independent reference (e.g. the upstream published ClickBench answer
      set) so the oracle is not just self-consistency.
    acceptance:
      - "Module docstrings accurately describe the independence the oracle has (and lacks) per benchmark."
      - "The coverage map / a doc records generated-vs-handwritten for each gated benchmark."

