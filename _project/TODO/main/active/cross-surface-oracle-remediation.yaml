  - "_project/analysis/oracle-coverage-map.md - the coverage/applicability map (guarded == GATES membership, the 12-gateable headline) the M1/M2 honesty fixes target."
  - "benchbox/core/equivalence/cross_surface.py - GATES vs STAGED_GATES, build_*_duckdb, find_cross_surface_divergences, count_executed_cells, run_gate, _report; the empty-RESULT guard belongs here."
  - "benchbox/core/equivalence/dataframe_surface.py - materialize_rows, fetch_reference_rows, find_surface_divergences, _normalize_value (lines 239-263), build_dataframe_contexts_from_specs (74-125); the loader-bypass and the None/NaN coercion live here."
  - "benchbox/core/tpchavoc/validation.py - ResultValidator.validate_results_exact (54-79) full-row sort; the order/tie-awareness change must not regress the TPC-Havoc gates that rely on it."
  - "benchbox/core/clickbench/dataframe_queries/queries.py - _make_group_pandas (groupby as_index=False, line 291), nunique op (206/285), _SCALAR_ROWS/_GROUP_ROWS/_SELECT_ROWS spec tables (394/404/433); the dropna/nunique null bugs are systemic to these factories."
  - "benchbox/core/ssb/dataframe_queries/queries.py - _QUERY_SPECS (158) and _make_expression_impl/_make_pandas_impl; both backends from one spec; SSB parameters that yield 6 empty results at SF=0.1."
  - "benchbox/core/dataframe/data_loader.py - PYARROW_TYPE_MAP (191-199), _extract_arrow_types (1373-1382), convert_csv_to_parquet strings_can_be_null=True (329), cache version (74); the production load path the gate bypasses."
  - "benchbox/core/dataframe/schema_utils.py - column_name (29-43) / column_sql_type (46-51) naive column.split() DDL parser (#846)."
