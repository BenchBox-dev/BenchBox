id: remediate-explorer-deploy-path-reconciliation
title: "Reconcile the 'explorer is built/served from main' docs with the release curation that strips it"
worktree: main
priority: Low
status: "In Progress"
category: Documentation

description: |
  Source: _project/audits/results-explorer-publication-adversarial-review.md
  (develop_sha fddedf26), findings §2.13 (Required) and §2.14 (Required).

  2026-07-06 RE-EVALUATION against PR #993 (branch-strategy migration):
  §2.14 / w3 was predicated on "the DEFAULT branch is the stripped release
  branch (main)". #993 Decision A switches the repo default_branch to `develop`,
  and Decision B renames main -> release. On `develop` the full tree exists
  (results-explorer/, _project/audits/, _project/scripts/ all present and their
  results-explorer-qa.md references resolve — verified 2026-07-06), so a reader
  on the default branch is NO LONGER sent to absent paths. The success metric
  "A reader on the default branch is not sent to paths that do not exist there"
  is satisfied by the default switch itself — no doc edit required. w3's fix is
  #993, not a curation change here. Priority dropped High -> Low accordingly.
  What remains is a LOW, optional residual: the QA doc still SHIPS to the
  (non-default) release branch referencing stripped paths — release-cut still
  `git rm -rf ... results-explorer`, and docs/operations/ is not stripped. Add
  operations/QA docs to release-cut's curation only if a clean release artifact
  is wanted; it is not a default-branch hazard. Close this item once #993 merges
  and the default_branch=develop switch (branch-rename-runbook.md step 2) is
  applied.

  §2.13 — results-phase-2-runbook.md:41-47 says the explorer "is built from
  main via docs.yml … publishes from main's view of results-data/," and
  contributing-results.md:108 promises an automatic explorer rebuild after a
  merge. But: docs.yml has no trigger on published-results and its deploy job
  requires push to main (:193), so §6's `gh workflow run docs.yml`
  (workflow_dispatch) builds but never deploys; Makefile:1070-1072 (release-cut)
  `git rm -rf results-data results-explorer` from every release branch, so those
  paths can never reach main; and docs.yml:79-84 documents that on main the
  explorer steps are a deliberate no-op (hashFiles empty). Net: a merged
  submission never reaches the public explorer via any automated path, and there
  is no automated flow from published-results back to develop/main.

  §2.14 — On the default branch (main), docs/operations/results-explorer-qa.md,
  adr-explorer-cli-surface.md, and a Makefile audit-sha-check target reference
  results-explorer/, _project/scripts/, _project/audits/ — all stripped from
  main by release-cut — and README.md:66 links benchbox.dev/results/. A reader
  landing on the default branch follows docs pointing at absent infrastructure.
  (CONTRIBUTING.md:44 does correctly say develop is the dev branch — the one
  mitigation that passes.)

  This item is decision-first: the fix depends on where the explorer is actually
  intended to build and deploy from. It cannot be a mechanical doc edit until
  that is settled (see open_questions).

work:
- id: w0
  summary: "Re-derive the current deploy reality and settle the intended source-of-truth branch for the explorer"
  status: done
  notes: |
    Confirm: (1) results-explorer/ has never existed on main
    (`git log origin/main -- results-explorer/` empty); (2) docs.yml deploy is
    main-push-only; (3) release-cut strips the paths. Then get the maintainer
    decision recorded in this item (open_questions) before any doc/workflow
    edit. Capture findings to /tmp and summarize.

- id: w1
  summary: "Make the runbook + contributing-results describe the real trigger and deploy path"
  needs: [w0]
  status: done
  notes: |
    Rewrite results-phase-2-runbook.md §1.3/§6 and
    contributing-results.md:108 to match the decided reality: state which
    branch builds and deploys the explorer, that workflow_dispatch builds but
    does not deploy, and how (or whether) a merged submission reaches the site.

- id: w2
  summary: "Fix the wiring so the documented path is actually achievable (if the decision requires it)"
  needs: [w0]
  status: pending
  notes: |
    Depending on w0's decision: either (a) stop stripping
    results-data/results-explorer in release-cut and let docs.yml deploy from
    main, or (b) add a deploy trigger/source for the branch that genuinely
    holds the explorer, or (c) document explicitly that the explorer is
    pre-launch / served out-of-band. Only one of these lands.

- id: w3
  summary: "Stop the default branch from shipping docs that reference stripped paths"
  needs: [w0]
  status: pending
  notes: |
    Either exclude the develop-only operations/QA docs and the
    audit-sha-check Make target from release-cut curation (as
    results-explorer/ and _project/ already are), or add a prominent
    "describes develop-only tooling" banner, or gate the README results link
    until the site is live. Keep only docs whose referenced paths survive
    release-cut.

    2026-07-06 RE-EVALUATION vs #993: the DEFAULT-branch half of this unit is
    resolved by #993 Decision A (default_branch -> develop): on develop every
    referenced path exists, so the default-branch reader is no longer misled.
    Effective once #993 merges and the manual default switch is applied. The
    only remaining piece is the OPTIONAL, Low residual: dev-only operations/QA
    docs still ship to the non-default `release` branch referencing stripped
    paths. If that clean-artifact cleanup is wanted, add
    `docs/operations/results-explorer-qa.md` (and peers) to release-cut's
    `git rm` curation list — but it is not a user-facing hazard once the
    default is develop.

prior_art:
- "Makefile:1070-1072 release-cut curation list — extend the exclusion set (or stop excluding) per the decision, rather than
  adding a parallel curation mechanism."
- "docs.yml:79-84 — the inline dormancy comment is the accurate description; align the runbook to it (or change the wiring),
  not vice versa."
- "docs/operations/release-guide.md + _project/decisions/single-repo-migration.md — the authoritative curation rationale;
  reconcile the docs against these."

must_preserve:
- "The single-repo migration model (develop is authoritative, main is release-only)."
- "Whatever the decision, CONTRIBUTING.md's correct 'develop is the dev branch' statement stays."

anti_patterns:
- "DO NOT edit the runbook to a new happy-path story without fixing the wiring - because the contradiction is between docs
  AND pipeline - reconcile both or the drift returns."
- "DO NOT unconditionally ship all operations docs on main - because they reference develop-only paths - curate or banner
  them."

verification:
- description: "No doc claims an automated explorer rebuild that the wiring cannot perform"
  command: "grep -n 'automatically rebuilds\\|built from .main.' docs/operations/results-phase-2-runbook.md docs/contributing-results.md"
  expected_output: "remaining statements match the decided, wired reality"
- description: "release-cut still strips the explorer/results paths (confirms the constraint the docs must respect)"
  command: "make -n release-cut | grep -nE 'git rm .*results-(data|explorer)'"
  expected_output: "the strip line is present (or, if the decision changed the wiring, it is intentionally gone)"
- description: "develop's tree contains the trees the QA doc references (necessary but NOT sufficient to close w3 — see the next check)"
  command: "for d in results-explorer _project/audits _project/scripts; do git cat-file -e origin/develop:$d 2>/dev/null && echo present:$d || echo ABSENT:$d; done"
  expected_output: "all present — the results-explorer/ and _project/ trees exist on develop, so a reader already ON develop is not sent to absent paths"
- description: "REQUIRED before closing w3: the repo's actual GitHub default_branch setting (not just develop's tree contents) has been switched to develop per #993/branch-rename-runbook.md step 2 — a reader lands on whatever branch GitHub actually serves as default, regardless of what any other branch's tree contains"
  command: "gh api repos/joeharris76/BenchBox --jq .default_branch"
  expected_output: "develop — if this still prints the release branch name, #993's manual default-branch switch has not been applied yet and w3 MUST stay open even though the prior tree-contents check passes"
- description: "Residual only (Low, optional): the QA doc still ships to the non-default release branch referencing stripped paths"
  command: "git show origin/main:docs/operations/results-explorer-qa.md 2>/dev/null | grep -cE 'results-explorer/|_project/scripts/|_project/audits/' || echo 'release branch not present locally'"
  expected_output: "non-zero is acceptable post-#993 (release branch is not the default); only fix if a clean release artifact is wanted via release-cut curation"

