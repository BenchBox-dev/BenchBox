id: results-explorer-pr246-final-evidence-gate
title: "Gate PR #246 remediation with full screenshot and finding closure evidence"
worktree: main
priority: High
status: Blocked
category: Testing and Quality Assurance

description: |
  PR #246 created the baseline evidence for Results Explorer visual hierarchy,
  usability, and data-presentation quality. After the route-specific remediation
  items are implemented, the team needs a final evidence gate that proves the
  same route and viewport matrix no longer exhibits the captured issues.

  This TODO owns the closeout pass. It should rerun the PR #246 methodology,
  recapture the full screenshot matrix, compare before/after evidence by
  finding ID, and ensure any residual Major issue has either been fixed or has a
  concrete follow-up TODO before release readiness is claimed.

deps:
  needs:
  - results-explorer-pr246-home-leaderboard-evidence-remediation
  - results-explorer-pr246-responsive-navigation-overflow-remediation
  - results-explorer-pr246-result-compare-evidence-remediation
  - results-explorer-pr246-browse-platform-evidence-remediation
  - results-explorer-pr246-query-workbench-evidence-remediation

blockers:
- date: "2026-05-10"
  work: [w5, w6, w7]
  reason: "Required Chromium browser smoke failed after final PR #246 screenshot capture passed: home mobile first-row threshold drift, single-id compare redirect contracts, PlatformIndex heading casing, Query deployment facet lookup, and Result Detail compare-link redirect contract."
  unblock: "Fix or deliberately re-scope the failing browser-smoke product/test contracts, rerun `cd results-explorer && npm run test:e2e:chromium`, then update the final report and complete w5-w7."

