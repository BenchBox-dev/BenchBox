    duplicating the same screenshot matrix.

work:
- id: w1
  summary: "Prepare the PR #246 closeout matrix and expected outcomes"
  status: done
  notes: |
    Build a checklist that maps every PR #246 finding to:
      - source screenshot filenames;
      - remediating TODO ID;
      - route;
      - viewport;
      - expected visual/interaction/data outcome;
      - automated and manual verification evidence.

    The matrix should explicitly include the full baseline screenshot set
    from this TODO.

- id: w2
  summary: "Run route cold-load checks with console and network capture"
  needs: [w1]
  status: done
  notes: |
    For every audited route, cold-load with the fixture-backed server and
    capture:
      - requested URL and final URL;
      - title and H1;
      - console errors/warnings;
      - non-2xx network failures;
      - raw internal error visibility;
      - app loaded state.

    No route can pass this gate with visible `Binder Error`, stack trace,
    undefined ID, blank loaded state, or unexpected console error.

- id: w3
  summary: "Capture the full before/after screenshot matrix"
  needs: [w2]
  status: done
  notes: |
    Recapture all routes at 390px, 768px, 1280px, and 1600px where practical,
    plus the focused states from PR #246:
      - Home times/ranks/speedup;
      - TPC-H matrix/list/high-contrast;
      - Star Schema/SSB;
      - DuckDB and DataFusion platform pages;
      - Result Detail chart section;
      - same-cohort Compare;
      - mixed-scale Compare;
      - Query Workbench and mobile filter drawer.

    Store raw after screenshots in CI artifacts, `/tmp`, or
    `BENCHBOX_OUTPUT_DIR`, then summarize the route/viewport matrix, checked
    SHA, PASS/FAIL result, and any relevant manifest counts in the final audit.
    Do not commit the screenshot batch.

- id: w4
  summary: "Perform finding-by-finding visual and interaction review"
  needs: [w3]
  status: done
  notes: |
    Review the recaptured evidence against every PR #246 finding:
      - visual hierarchy: first viewport purpose, primary action, control
        balance, receipt/card/table scan order;
      - usability: filters, navigation, URL state, row/detail/compare paths,
        focus visibility, mobile reachability;
      - data presentation: units, direction, badges, legends, ranks, speedup,
        axes, clipping, whitespace, formatting, and comparability guardrails.

    Any remaining Major issue blocks completion until fixed or represented by
    a new TODO with screenshot evidence.

- id: w5
  summary: "Run automated verification and browser smoke"
  needs: [w4]
  status: pending
  notes: |
    Run the broadest practical frontend checks:
      - typecheck;
      - unit/a11y tests;
      - build;
      - Chromium browser smoke.

    If a browser project or check is unavailable, document the reason in the
    final closeout report and state whether manual evidence compensates.

    2026-05-10: `npm run typecheck`, `npm test`, and `npm run build` passed.
    `npm run test:e2e:chromium` failed with 5 assertions, captured in
    `/tmp/results-explorer-pr246-final-e2e-chromium.log` and summarized in
    `_project/audits/results-explorer-pr246-remediation-final-2026-05-10.md`.

- id: w6
  summary: "Write the PR #246 remediation closeout report"
  needs: [w5]
  status: pending
  notes: |
    Create `_project/audits/results-explorer-pr246-remediation-final-<date>.md`
    with:
      - verdict: ready, partially ready, or not ready;
      - route and viewport matrix;
      - screenshot index;
      - console/network summary;
      - finding-by-finding closure table;
      - residual defects with severity and TODO owner;
      - explicit statement that PR #246 screenshots were used as baseline.

- id: w7
  summary: "Reindex TODOs and close the evidence loop"
  needs: [w6]
  status: pending
  notes: |
    Run TODO validation, graph check, and reindex. Confirm every residual
    release-blocking issue has a TODO and that the final closeout report links
    back to PR #246 evidence. Do not mark this item completed if any unowned
    Blocker or Major finding remains.

must_preserve:
- "PR #246 baseline audit and screenshots remain available as before evidence."
- "Every public route and share URL in the PR #246 route matrix."
- "Browser Use or equivalent live-browser inspection remains part of manual QA."
- "Final evidence is stored under `_project/audits/` and can be reviewed later."
- "No launch-ready verdict with visible raw internal errors or unowned Major findings."

approach: |
  Treat this as a release-quality evidence gate, not a prose summary. The output
  must let a reviewer trace each PR #246 finding from before screenshot, through
  remediation TODO, to after screenshot and verification result.

anti_patterns:
- "DO NOT substitute unit tests for visual and interaction QA on this evidence gate."
- "DO NOT ignore console or network errors because the screenshot looks acceptable."
- "DO NOT mark the Explorer ready while any PR #246 Major finding remains unowned."
- "DO NOT bury residual issues in prose; every release-blocking issue needs a concrete TODO."
- "DO NOT recapture only desktop screenshots; mobile and tablet evidence is required."

verification:
- description: "Frontend verification suite passes"
  command: "cd results-explorer && npm run typecheck && npm test && npm run build"
  expected_output: "all commands pass"
- description: "Chromium browser smoke passes"
  command: "cd results-explorer && npm run test:e2e:chromium"
  expected_output: "Chromium e2e checks pass or skipped browser reason is documented"
- description: "TODO graph and indexes are valid"
  command: |
    uv run --project _project/scripts -- python _project/scripts/todo_cli.py validate _project/TODO
    uv run --project _project/scripts -- python _project/scripts/todo_cli.py check-graph
    uv run --project _project/scripts -- python _project/scripts/todo_cli.py reindex
  expected_output: "TODO validation, graph check, and reindex all succeed"
- description: "Manual PR #246 final evidence matrix is complete"
  command: "echo 'Manual: compare all PR #246 baseline screenshots against final recaptures and record finding closure table'"
  expected_output: "final closeout report exists and owns every residual issue"

scope_limit:
  only_modify:
  - "_project/audits/"
  - "_project/TODO/"
  - "docs/operations/results-explorer-qa.md"
  - "results-explorer/e2e/"
  do_not_modify:
  - "results-data/bundles/"
  - "benchbox/"

success_metrics:
- "Every PR #246 screenshot is referenced in the final closeout matrix."
- "Every PR #246 finding has a resolved/deferred/owned status with evidence."
- "No unowned Major or Blocker visual hierarchy, usability, accessibility, or data-presentation issue remains."
- "The final report includes screenshot, console/network, route, viewport, and verification evidence."
- "TODO validation, graph check, and reindex pass after closeout."

