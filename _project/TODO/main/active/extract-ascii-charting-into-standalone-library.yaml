resolved_questions:
- question: "What should the public distribution and import name be?"
  answer: "`textcharts` (PyPI: textcharts, import: textcharts) — generic, memorable, no BenchBox branding"
- question: "Should the first release guarantee exact text output stability or only semantic stability?"
  answer: "Exact text parity — golden snapshot tests enforce byte-identical output before and after extraction"
- question: "Should compatibility shims remain for one major BenchBox release or two?"
  answer: "One stable release cycle — add deprecation warnings after first release, plan removal for next major"
- question: "Should the dispatch layer (ascii_runtime.py) move into the standalone library?"
  answer: "No — it contains BenchBox-specific NormalizedResult→chart data conversion. Standalone users construct chart objects
    directly."
