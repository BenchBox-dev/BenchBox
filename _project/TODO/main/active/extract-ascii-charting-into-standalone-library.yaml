id: extract-ascii-charting-into-standalone-library
title: "Extract BenchBox ASCII charting into `textcharts` standalone library with compatibility shims and staged rollout"
worktree: main
priority: High
status: In Progress
description: |
  BenchBox currently owns a mature ASCII charting implementation (15 chart types,
  595-line base module, zero external dependencies) under
  `benchbox/core/visualization/ascii/` plus runtime dispatch and adapters in
  CLI/MCP/export paths. We want to extract this into a reusable standalone Python
  library called `textcharts` (PyPI: `textcharts`, import: `textcharts`) without
  breaking existing BenchBox workflows.

  Key architecture decisions:
  - Library name: `textcharts` — generic, memorable, no BenchBox branding
  - Dispatch layer (`ascii_runtime.py`): stays in BenchBox — it contains
    domain-specific NormalizedResult→chart data conversion
  - Naming: standalone drops `ASCII` prefix (e.g. `BarChart` not `ASCIIBarChart`);
    BenchBox shims re-export with `ASCII*` aliases for compatibility
  - Only ONE coupling point to sever: `base.py:481` imports `format_scale_factor`

  The correct migration path is staged:
  1) Define and freeze charting API contracts first
  2) Decouple the single `format_scale_factor` import via optional Callable
  3) Complete BenchBox-internal API separation before extraction starts
  4) Extract charting primitives + renderers behind a compatibility shim
  5) Keep BenchBox-specific normalization/adaptation in BenchBox
  6) Validate text-output parity via golden snapshot tests before cutover
  7) Externalize packaging/release only after in-repo adoption is stable

  This TODO captures the full execution DAG required to minimize risk and avoid
  regressions in CLI output, MCP responses, and tests.

category: Core Functionality

gap_analysis:
  blockers:
  - gap: "`format_scale_factor` import in `base.py:481`"
    location: "benchbox/core/visualization/ascii/base.py"
    solution: "Accept optional `Callable[[float], str]` on `ASCIIChartOptions`; remove benchbox import"
  - gap: "No package metadata"
    solution: "Scaffold `pyproject.toml`, `py.typed`, LICENSE"
  - gap: "Internal imports use `benchbox.core.visualization.ascii.*`"
    location: "All 15 chart modules"
    solution: "Rewrite to `textcharts.*` relative imports during extraction"
  important_for_v010:
  - gap: "No custom palette support"
    impact: "Users stuck with Okabe-Ito 8-color palette"
    solution: "Add `palette: tuple[str, ...] | None` to options"
  - gap: "Dead `theme` parameter"
    impact: "`ASCIIChartOptions.theme` stored but never read by any renderer"
    solution: "Document as reserved for future use; defer implementation"
  - gap: "No documentation"
    solution: "README with chart gallery and API examples"
  - gap: "Data models not re-exported from `ascii/__init__.py`"
    solution: "Expand `__init__.py` to export all 16+ dataclasses and factory functions"
  nice_to_have_v020:
  - "Theme presets (dark, light, solarized)"
  - "`python -m textcharts` CLI entry point"
  - "Pluggable chart type registry"

work:
  # --- Phase A: Internal API Separation (in-tree, no new package) ---

- id: w1
  summary: "Expand ascii/__init__.py to export all data models, utilities, and factory functions"
  status: done
  notes: |
    Add to `benchbox/core/visualization/ascii/__init__.py` and `__all__`:
    - Data models: BarData, HistogramBar, BoxPlotSeries, LinePoint, ScatterPoint,
      ComparisonBarData, DivergingBarData, SummaryStats, PercentileData,
      SpeedupData, StackedBarData, StackedBarSegment, CDFSeriesData,
      SparklineTableData, SparklineColumn, RankTableData
    - Config/infra: ASCIIChartOptions, ColorMode, TerminalCapabilities, TerminalColors
    - Factory functions: from_query_results, from_heatmap_data, from_metrics,
      from_normalized_results
    This establishes the canonical public surface for the package.

- id: w18
  summary: "Decouple format_scale_factor — the only benchbox import inside ascii/"
  needs: [w1]
  status: pending
  notes: |
    The single coupling point: `base.py:481` does
    `from benchbox.utils.scale_factor import format_scale_factor`.
    Strategy:
    1. Add `scale_factor_formatter: Callable[[float], str] | None = None` to ASCIIChartOptions
    2. In `ASCIIChartBase._render_subtitle` (base.py:479-483): use
       `self.options.scale_factor_formatter(sf)` if set, else fallback to `f"SF={sf}"`
    3. Delete the `from benchbox.utils.scale_factor import format_scale_factor` line
    4. In `ascii_runtime.py` and `post_run_summary.py`: inject
       `options.scale_factor_formatter = format_scale_factor` before passing to charts

- id: w2
  summary: "Write extraction ADR covering boundaries, ownership, and migration strategy"
  needs: [w1]
  status: pending
  notes: |
    Explicitly separate concerns:
    - `textcharts` owns: chart primitives, rendering, terminal capabilities, color system
    - BenchBox owns: ascii_runtime.py (dispatch/NormalizedResult conversion),
      exporters.py, post_run_summary.py, chart_types registry, templates
    - Naming: standalone drops `ASCII` prefix (BarChart, ChartOptions, ChartBase);
      BenchBox shims re-export with `ASCII*` aliases

- id: w16
  summary: "Create ascii_api.py facade and migrate all external callers"
  needs: [w2, w18]
  status: pending
  notes: |
    Create `benchbox/core/visualization/ascii_api.py` that re-exports:
    - Everything from `ascii/__init__.py` (chart classes, data models, options, utils)
    - `render_ascii_chart_from_results` from `ascii_runtime.py`

    Then migrate these callers to import from `ascii_api` only:
    | File                                    | Deep imports to migrate | Count |
    | cli/commands/visualize.py               | ASCIIChartOptions, ascii_runtime | 2     |
    | mcp/tools/visualization.py              | ASCIIChartOptions, ascii_runtime | 2     |
    | core/visualization/chart_generator.py   | ASCIIChartOptions, ascii_runtime | 2     |
    | core/visualization/exporters.py         | 10+ chart classes, 10+ data models | ~20 |
    | core/visualization/post_run_summary.py  | 3 chart classes, 3 data models | 6     |

    Note: `ascii_runtime.py` itself is an allowed adapter and may continue
    importing directly from ascii/ submodules.

- id: w17
  summary: "Enforce internal API separation gate with automated boundary check"
  needs: [w16]
  status: pending
  notes: |
    Gate command (must return zero matches before extraction begins):
    ```
    rg -n "benchbox\.core\.visualization\.ascii" benchbox \
      | rg -v "^benchbox/core/visualization/(ascii/|ascii_runtime|ascii_api|exporters|post_run_summary|chart_generator)"
    ```
    Consider adding as a CI check or pre-commit hook to prevent backsliding.

- id: w19
  summary: "Create golden-output snapshot tests for all 15 chart types"
  needs: [w18]
  status: pending
  notes: |
    Create deterministic snapshot tests BEFORE extraction to establish parity baseline.
    - Fixed options: ASCIIChartOptions(use_color=False, use_unicode=True, width=80)
    - Store expected output as `.txt` files in `tests/fixtures/golden/ascii/`
    - One snapshot per chart type with representative data
    - Test file: `tests/contracts/visualization/test_ascii_golden_output.py`
    - These become the byte-for-byte parity check after extraction in w9.

- id: w14
  summary: "Eliminate cross-layer dependency cycles before extraction (core visualization must not import MCP helpers)"
  needs: [w16]
  status: pending
  notes: |
    Guard against regression of historical coupling where core visualization
    imported MCP tooling. Keep shared rendering utilities in neutral
    visualization modules and enforce direction checks in verification.

  # --- Phase B: Standalone Package Extraction ---

- id: w3
  summary: "Scaffold textcharts in-repo package with src layout"
  needs: [w17, w19]
  status: pending
  notes: |
    Create `packages/textcharts/` with src layout:
      packages/textcharts/
        pyproject.toml    # name="textcharts", version="0.1.0", python>=3.10, no deps
        README.md
        LICENSE           # MIT (match BenchBox)
        src/textcharts/
          __init__.py     # Public API surface
          py.typed
          base.py         # ChartBase, ChartOptions, TerminalColors, etc.
          bar_chart.py    # BarChart, BarData
          ... (all 15 chart modules)
        tests/
          test_charts.py
    This work starts only after internal API separation gates pass.

- id: w13
  summary: "Define textcharts public API and class naming"
  needs: [w3]
  status: pending
  notes: |
    `textcharts/__init__.py` exports:
    - ChartOptions (renamed from ASCIIChartOptions; original kept as alias)
    - ChartBase (renamed from ASCIIChartBase)
    - All chart classes without ASCII prefix: BarChart, Histogram, Heatmap,
      BoxPlot, LineChart, ScatterPlot, CDFChart, ComparisonBar, DivergingBar,
      SummaryBox, PercentileLadder, NormalizedSpeedup, StackedBar,
      SparklineTable, RankTable
    - All data models unchanged: BarData, HistogramBar, BoxPlotSeries, etc.
    - Utilities: TerminalColors, TerminalCapabilities, ColorMode,
      detect_terminal_capabilities
    - No dispatch/render() function — standalone users construct chart objects directly.

- id: w4
  summary: "Copy and port base runtime primitives (options, colors, terminal capabilities, shared helpers)"
  needs: [w13, w14]
  status: pending
  notes: |
    Copy `ascii/base.py` to `packages/textcharts/src/textcharts/base.py`.
    - Replace all `from benchbox.core.visualization.ascii.base import` with relative imports
    - `format_scale_factor` already decoupled in w18 (optional Callable)
    - Add `palette: tuple[str, ...] | None = None` to ChartOptions for custom palette support

- id: w5
  summary: "Port foundational chart renderers (bar, line, scatter, heatmap, box, histogram)"
  needs: [w4]
  status: pending
  notes: |
    Copy 6 modules to textcharts, rewrite imports:
    `from benchbox.core.visualization.ascii.base import` → `from textcharts.base import`
    Verify: `rg "benchbox" packages/textcharts/src/textcharts/{bar_chart,line_chart,scatter_plot,heatmap,box_plot,histogram}.py` returns nothing.

- id: w6
  summary: "Port advanced chart renderers (summary, comparison, diverging, percentile, normalized, stacked, cdf, rank, sparkline)"
  needs: [w5]
  status: pending
  notes: |
    Copy remaining 9 modules to textcharts, rewrite imports.
    After this step, all 15 chart types exist in textcharts.
    Gate: `rg "benchbox" packages/textcharts/` returns zero matches.

- id: w7
  summary: "Introduce BenchBox compatibility shim so old import paths continue to work"
  needs: [w6]
  status: pending
  notes: |
    Replace `benchbox/core/visualization/ascii/` contents with thin re-exports:
    ```python
    # benchbox/core/visualization/ascii/__init__.py
    from textcharts import BarChart as ASCIIBarChart, BoxPlot as ASCIIBoxPlot, ...
    ```
    Each submodule becomes a one-line re-export:
    ```python
    # benchbox/core/visualization/ascii/bar_chart.py
    from textcharts.bar_chart import *  # noqa: F401,F403
    ```
    `ascii_api.py` facade continues working unchanged (imports from ascii/
    which now delegates to textcharts).

- id: w8
  summary: "Add textcharts as BenchBox path dependency and verify adapter wiring"
  needs: [w7, w13, w14]
  status: pending
  notes: |
    In BenchBox `pyproject.toml`:
    ```toml
    dependencies = ["textcharts @ {root:uri}/packages/textcharts"]
    ```
    Run full BenchBox test suite to confirm compatibility shims work.

  # --- Phase B2: Validation ---

- id: w9
  summary: "Run golden-output parity tests and verify byte-identical rendering"
  needs: [w8]
  status: pending
  notes: |
    Run snapshot tests created in w19 against the extracted textcharts renderers.
    Must produce byte-identical output to pre-extraction baselines.
    Also verify no-color/unicode fallback paths via:
      uv run -- python -m pytest tests/unit/visualization/test_nocolor_rendering.py -q

- id: w10
  summary: "Run full quality gate for visualization and integration surfaces"
  needs: [w9]
  status: pending

  # --- Phase C: Packaging and Release ---

- id: w15
  summary: "Complete standalone packaging MVP (metadata, README with chart gallery, py.typed, sdist+wheel)"
  needs: [w10]
  status: pending
  notes: |
    README should include:
    - Quick start example for each chart type
    - Chart gallery with rendered ASCII output examples
    - API reference for ChartOptions and all data models
    - Terminal capability detection explanation
    Build verification: `cd packages/textcharts && uv build` (sdist + wheel)

- id: w11
  summary: "Publish first standalone release and switch BenchBox to versioned dependency"
  needs: [w15]
  status: pending
  notes: |
    1. Publish: `uv publish packages/textcharts/dist/*`
    2. Switch pyproject.toml: `dependencies = ["textcharts>=0.1.0"]`
    3. Remove path dependency wiring
    4. Run full test suite to confirm

- id: w12
  summary: "Deprecate temporary shims and complete documentation migration"
  needs: [w11]
  status: pending
  notes: |
    After at least one stable BenchBox release with the versioned dependency:
    - Add deprecation warnings to `benchbox/core/visualization/ascii/` shim modules
    - Plan removal for next major BenchBox version

