- id: w16
  summary: "Add tie-handling to _build_meta_leaderboard (pipeline.py:207-209)"
  status: pending
  notes: |
    _build_meta_leaderboard assigns ordinal ranks (enumerate → i+1) without
    detecting ties.  Two platforms with equal metric values get consecutive ranks
    (1, 2) instead of equal ranks (1, 1).  The computeRankTable() in chartMath.ts
    already implements dense rank with ties — the Python function should match.
    Fix: after sorting, scan for equal metric values and assign equal ranks.
    Only matters when two platforms genuinely tie on a summary metric (rare but
    possible for e.g. integer power_scores in small cohorts).
    Reference: computeRankTable in results-explorer/src/lib/chartMath.ts

