- "All existing Vitest tests pass"
- "build_comparison_artifact output unchanged — only internal data structure optimization"
- "PercentileLadder visual output — only legend swatch color changes"

verification:
- description: "No inline PHASE_COLORS in StackedPhase.tsx"
  command: "grep -n 'PHASE_COLORS\\s*=' results-explorer/src/components/StackedPhase.tsx"
  expected_output: "zero matches — PHASE_COLORS imported from chartTheme"
- description: "chartTheme exports PHASE_COLORS"
  command: "grep -n 'export.*PHASE_COLORS' results-explorer/src/lib/chartTheme.ts"
  expected_output: "one match"
- description: "No ?? '' fallback on benchmark"
  command: "grep -n 'benchmark ?? \"\"' results-explorer/src/pages/BenchmarkIndex.tsx"
  expected_output: "zero matches"
- description: "No hardcoded indigo in PercentileLadder legend"
  command: "grep -n '6366f1' results-explorer/src/components/PercentileLadder.tsx"
  expected_output: "zero matches"
- description: "All Vitest tests pass"
  command: "cd results-explorer && npm test"
  expected_output: "all tests pass"
- description: "Python tests pass"
  command: "uv run -- python -m pytest tests/unit/core/explorer_pipeline/ -q"
  expected_output: "all tests pass"

