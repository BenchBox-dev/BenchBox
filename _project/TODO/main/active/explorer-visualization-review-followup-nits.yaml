id: explorer-visualization-review-followup-nits
title: "Fix nit-level findings from explorer visualization code reviews (unify + a11y)"
worktree: main
priority: Low
status: Not Started
category: Code Quality

description: |
  Code review of `explorer-unify-visualization-foundations` found three nit-level
  issues that don't block the feature but should be cleaned up:

  **Nit 1 — `perQuerySpeedup` docstring has an incomplete sentence.**
  `chartMath.ts:163`: "Represents how much the slowest result for a given query
  is than the fastest." — missing "faster" before "than".

  **Nit 2 — `StackedPhase.tsx` `PHASE_COLORS` uses inline hex that overlaps PALETTE.**
  `StackedPhase.tsx:24-31` defines `PHASE_COLORS` with `#3b82f6`, `#10b981`,
  `#f59e0b`, `#ef4444` — the exact same values as `chartTheme.PALETTE` but
  defined independently.  The `explorer-unify-visualization-foundations` anti-pattern
  says "every color comes from chartTheme.ts, no exceptions."  StackedPhase was
  out of scope for that TODO, so this pre-existing violation was not fixed.
  The phase colors have different semantics from the platform palette (phases, not
  platforms), so the fix is to export `PHASE_COLORS` from `chartTheme.ts` rather
  than eliminating the distinction.

  **Nit 3 — `BenchmarkIndex.tsx:373` has an unnecessary `?? ""` defensive fallback.**
  `primaryMetricFor(s.benchmark ?? "")` — `BenchmarkSummary.benchmark` is required
  (always set by the pipeline), so `?? ""` is defensive noise.  The TypeScript
  type already guarantees it is not null.

  From explorer-heatmap-accessibility-and-tests review (2026-04-17):

  **Nit 4 — Keyboard navigation in `QueryHeatmap` is untested.**
  Roving tabindex and arrow-key navigation are implemented and correct
  (`QueryHeatmap.tsx:122-148`) but there is no unit test exercising `ArrowRight`/
  `ArrowDown` behavior.  Axe provides structural coverage but doesn't confirm
  that focus actually moves to the correct cell.

  **Nit 5 — `ranks` view doesn't distinguish "no data" errors from other errors.**
  `BenchmarkIndex.tsx:350` shows the amber banner for all errors in ranks view,
  including `NO_DATA_ERROR_PREFIX` errors.  The `matrix` view now shows an
  informational empty state for the same condition.  These should be consistent.

  **Nit 6 — `axe-helper.ts:38` uses an `as`-cast type escape.**
  `{ violations: critical } as typeof results` to satisfy `toHaveNoViolations`
  typing.  Low-risk in a test helper but worth a comment or a safer cast.

work:
- id: w1
  summary: "Fix incomplete sentence in perQuerySpeedup docstring (chartMath.ts:163)"
  status: pending
  notes: |
    Change:
      "Represents how much the slowest result for a given query is than the fastest."
    To:
      "Represents how much faster the slowest result for a given query is than the fastest."
    Or a cleaner rewrite:
      "Represents how many times the slowest result is relative to the fastest within a query."

- id: w2
  summary: "Move PHASE_COLORS from StackedPhase.tsx to chartTheme.ts"
  status: pending
  notes: |
    Add to chartTheme.ts:
      export const PHASE_LABELS: Record<string, string> = { ... }
      export const PHASE_COLORS: Record<string, string> = { ... }
      export const PHASE_ORDER: string[] = [ ... ]
    (Move all three since they're conceptually a unit.)
    Update StackedPhase.tsx to import from chartTheme.ts instead.
    No behavior change.

- id: w3
  summary: "Remove unnecessary ?? '' fallback in BenchmarkIndex.tsx:373"
  status: pending
  notes: |
    Change:
      primaryMetricFor(s.benchmark ?? "")
    To:
      primaryMetricFor(s.benchmark)
    BenchmarkSummary.benchmark is always set by the pipeline; the TypeScript
    type confirms it is string (not string | null | undefined).

- id: w4
  summary: "Add keyboard navigation unit test for QueryHeatmap roving tabindex"
  status: pending
  notes: |
    Add to QueryHeatmap.test.tsx (or a new keyboard.test.tsx):
      - fireEvent.keyDown(firstCell, { key: "ArrowRight" }) → next cell gets focus
      - fireEvent.keyDown(firstCell, { key: "ArrowDown" }) → cell below gets focus
      - ArrowLeft/ArrowUp at boundary → no change (no crash, no out-of-bounds)
    Use userEvent or fireEvent with vitest-dom matchers.
    Reference: WAI-ARIA grid pattern tests.

- id: w5
  summary: "Apply NO_DATA_ERROR_PREFIX informational empty state to ranks view in BenchmarkIndex.tsx"
  status: pending
  notes: |
    BenchmarkIndex.tsx:350 — ranks view error block:
      summaryError.startsWith(NO_DATA_ERROR_PREFIX) ? (informational empty state)
        : (amber banner)
    Mirrors the matrix view at line 325.  Add a test case covering the ranks
    view error path.

- id: w6
  summary: "Add clarifying comment to axe-helper.ts:38 type cast"
  status: pending
  notes: |
    The cast `{ violations: critical } as typeof results` is intentional —
    toHaveNoViolations only reads the violations field.
    Add a one-line comment:
      // toHaveNoViolations only reads .violations; the cast is safe.
    (Or use `satisfies Partial<typeof results>` if the jest-axe types support it.)

- id: w7
  summary: "Optimize O(n×m) query lookup in build_comparison_artifact (transformer.py:757)"
  status: pending
  notes: |
    transformer.py:754-760 — for each query_id, scans d.display_timings linearly
    to find the matching entry.  For TPC-DS (99 queries × 20 platforms) this is
    ~1,980 scans through a list of up to 99 items.
    Fix: build a per-detail lookup dict before the outer loop:
      timing_maps = [{dt.query_id: dt for dt in d.display_timings} for d in details]
    Then in the inner loop:
      timing = timing_maps[i].get(qid)
    No behavior change; reduces O(n×m×q) → O(n×m + n×q).

- id: w8
  summary: "Add progressive disambiguation cascade test (same driver_version + different execution_mode)"
  status: pending
  notes: |
    test_comparison_artifact.py tests each disambiguation level independently but
    has no test for the progressive case: two results with the same driver_version
    and DIFFERENT execution_mode — confirming the cascade stops at driver_version
    (the first differentiating field) and does NOT also append the execution_mode suffix.
    Add:
      def test_driver_version_stops_cascade_before_execution_mode():
          d1 = _make_detail("r1", ..., driver_version="1.2.0", execution_mode="sql")
          d2 = _make_detail("r2", ..., driver_version="1.2.0", execution_mode="dataframe")
          labels = _disambiguate_platform_labels([d1, d2])
          assert labels == ["DuckDB v1.2.0 (sql)", "DuckDB v1.2.0 (df)"]
    (driver_version alone doesn't disambiguate → cascade continues to execution_mode)

- id: w9
  summary: "Add CLI-level test for explorer_build_comparison file output path"
  status: pending
  notes: |
    benchbox/cli/commands/explorer.py has no test verifying the CLI subcommand
    writes the artifact to compare/<hash16>.json with the correct path computation.
    Add an integration or unit test (with tmp_path) that:
      - Calls _explorer_build_comparison_for_ids([r1, r2], output_dir=tmp_path)
        (or the CLI via click CliRunner)
      - Asserts file exists at tmp_path / "compare" / f"{hash16}.json"
      - Asserts JSON parses and schema_version == 2
    Mirrors the hash verification already present in test_comparison_artifact.py
    but at the CLI integration boundary.

- id: w10
  summary: "Replace hardcoded #6366f1 legend color in PercentileLadder.tsx with theme-derived neutral"
  status: pending
  notes: |
    PercentileLadder.tsx:86 — legend swatches use hardcoded `fill="#6366f1"` (Tailwind
    indigo-500).  The chart body uses paletteColor(ri) per platform, so the legend
    color doesn't match any platform.  The legend is showing opacity levels (P99→P50),
    not platform identity — use a neutral gray or paletteColor(0) so the legend is
    visually coherent with the chart.
    Change:
      fill="#6366f1"
    To:
      fill="#6b7280"  (Tailwind gray-500, neutral enough for an opacity-only legend)
    Or export a LEGEND_COLOR constant from chartTheme.ts if other legends need it.

- id: w11
  summary: "Harden chartRegistry meta-test to catch forward drift (new Python chart types)"
  status: pending
  notes: |
    results-explorer/src/__tests__/chartRegistry.meta.test.ts hardcodes CANONICAL_IDS.
    If chart_types.py grows a 17th entry, the meta-test passes until a human also
    updates CANONICAL_IDS.  The test only catches TS→Python divergence, not Python→TS.
    Fix: generate a CANONICAL_IDS fixture at test time by reading chart_types.py via
    a vite plugin or a pre-test script that writes `tests/parity/fixtures/chart_ids.json`
    during `make parity-fixtures`.  The meta-test then loads that file instead of
    hard-coding the list.
    Alternatively, add a Python smoke test that asserts len(ALL_CHART_TYPES) == 16
    so a new entry forces both files to be updated.

- id: w12
  summary: "Rename NewCharts.test.tsx to charts.smoke.test.tsx (or per-component files)"
  status: pending
  notes: |
    results-explorer/src/components/__tests__/NewCharts.test.tsx — "New" is relative
    to when the file was created; once these are established components the name is
    misleading.  Rename to charts.smoke.test.tsx or split into per-chart files
    alongside the component (e.g. PercentileLadder.test.tsx).
    No test content changes — rename only.

- id: w13
  summary: "Add parity fixtures for 6 pure-render chart types (query_histogram, power_bar, stacked_phase, time_series, cost_scatter, sparkline_table)"
  status: pending
  notes: |
    The explorer-close-chart-type-coverage-gaps TODO spec required parity fixtures for
    all 10 new chart types.  Only 4 were generated (percentile_ladder, cdf_ecdf, rank_table,
    box_stats).  The 6 pure-render charts have no TS math to verify but they do map
    pipeline-emitted fields to SVG — a fixture confirming field→visual mapping is useful
    for regression detection.
    For each missing chart, add a minimal fixture to tests/parity/fixtures/ and a
    corresponding test case in chartMath.parity.test.ts (or a new rendering.parity.test.ts)
    that checks field values appear in the rendered output.
    Low urgency — smoke tests in NewCharts.test.tsx already cover rendering crashes.

