open_questions:
- "What is the minimal bootstrap JSON that remains after cutover, if any, and how is the no-metrics-in-JSON rule enforced
  in code and tests? (Plan recommendation: if `manifest.json` survives, it is route/navigation-only, carries only whitelisted
  top-level keys per G-8, and is regenerated from DuckDB identities; everything else metric-bearing dies)"
- "Which DuckDB tables or views are documented as stable browser contracts for Home, PlatformIndex, BenchmarkIndex, Compare,
  ResultDetail, and Query? (Plan recommendation: the ten canonical tables listed in w2, with G-11 ensuring views are projection-only
  and never compute user-visible metrics)"
- "Should Query schema discovery come from DuckDB introspection or a DuckDB-resident metadata table? (Plan recommendation:
  introspection first; upgrade to metadata table only if RG-1 measures it as hot-path)"
- "What is the acceptable startup/loading budget for DuckDB-backed pages, and do we need a tiny non-metric route bootstrap
  for first paint? (Plan proposal: p50 <1500ms, p95 <3500ms per RG-1; if a route bootstrap exists it stays non-metric and
  subordinate to DuckDB)"
- "Is `result_detail_metrics` a single EAV-style table (metric_group, metric_name, value_numeric/value_text/value_json) or
  a set of narrow tables (phases, validations, platform_info, environment, tuning, cost_breakdown) joined by a view of the
  same name? (Plan recommendation: narrow tables + a G-11-compliant projection-only view of the same name, so dashboards read
  the view and analysts drill into the narrow tables)"
- "Which derived metrics currently live in `results-explorer/src/lib/{queryReduction,chartMath,ranking,compliance}.ts` have
  no canonical Python reference computation under `benchbox/core/explorer_pipeline/` or `benchbox/core/results/` today, and
  must therefore be ported into `benchbox/core/explorer_pipeline/` during W2 before their DuckDB column can be persisted?
  (Answered by the W1 compute-ownership note, deliverable 7.)"
- "Should `cohort_metadata` be keyed one-row-per-platform-per-cohort or one-row-per-result-per-cohort? (Resolved during W2
  contract-test work: W2b pins `PRIMARY KEY (cohort_key, result_id)` so publishable tuning/trust variants are not silently
  dropped; the Home UI does any variant collapsing. See W2b notes for evidence and the concurrent fix to the `_build_meta_leaderboard`
  `platform_agg` last-write-wins bug.)"

research_value:
  hypothesis: |
    A direct `committed JSON -> DuckDB` pipeline plus DuckDB-only explorer
    metric reads will eliminate cross-surface drift and make the results
    explorer materially more credible without changing the matrix-first
    product shape.
  validation_approach: |
    Inventory the current JSON consumers, define the canonical DuckDB schema,
    move every metric-bearing explorer surface onto DuckDB, and prove parity
    with automated tests before deleting metric JSON artifacts.
  success_criteria: |
    All contract questions are resolved before implementation; the final
    DuckDB schema is explicit and testable; and automated checks prove that
    explorer metrics come from DuckDB rather than runtime JSON fetches.
