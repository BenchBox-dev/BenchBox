must_preserve:
- "Every result trusted enough to publish appears in the DuckDB published-results dataset with its identity preserved (`result_id`,
  `tuning_mode`, `trust_label`); the pipeline never silently collapses, dedupes, or hides publishable variants — users must
  be able to compare across tuning levels AND trust levels from the same store"
- "Benchmark landing pages remain matrix-first default routes; `/results/query` stays a secondary analysis surface rather
  than the primary explorer entrypoint"
- "DuckDB is always attached read-only in the browser; no implementation step may weaken `ATTACH ... (READ_ONLY)` or permit
  persistent mutation from the SQL workbench"
- "Every user-visible metric, rank, aggregate, and detail timing shown in the explorer originates from DuckDB rather than
  JSON sidecars or TypeScript-only recomputation"
- "Committed JSON result objects remain immutable source inputs; the browser does not fetch them directly for metric rendering"
- "Raw JSON bundles under `public/data/bundles/` are a download-only affordance; no `src/pages/` or `src/components/` file
  fetches from `/results/data/bundles/` at runtime"
- "Any temporary bridge artifact used during W2–W4 page-by-page migration is regenerated from the same pipeline pass that
  writes DuckDB, never hand-patched, and cannot define, override, or outlive user-visible metrics"
- "Final-value parity for derived metrics is defined against the canonical Python reference computation in `benchbox/core/explorer_pipeline/`
  (with read-only imports from `benchbox/core/results/`), NOT against pre-calculated CLI JSON, current TS reduction libs,
  or bridge artifacts"
- "Shareable compare flows remain available after cutover, but route convenience is subordinate to the DuckDB-only metric
  contract"
- "The explorer remains static-hosted and browser-executed; no server API, auth dependency, or hosted query runtime is introduced
  by this TODO"

approach: |
  Follow a research-first but opinionated cutover, not an additive
  compatibility migration.

  First, inventory every runtime metric fetch and every pipeline artifact that
  currently feeds it. Then define the DuckDB schema and materializations that
  replace those paths. After the research gate, wire the explorer pipeline
  directly from committed JSON objects into DuckDB, move all metric surfaces
  onto typed DuckDB queries, and remove metric-bearing JSON outputs and
  loaders.

  Temporary parity checks are allowed as verification scaffolding, but JSON is
  not a second product contract. If a surface shows metrics to the user, those
  metrics must exist in DuckDB first.

anti_patterns:
- "DO NOT start implementation before the research gate closes the schema and cutover details -- because this is a contract
  refactor across pipeline and UI -- lock the rules first and record them"
- "DO NOT preserve beta-era JSON metric contracts just because they already exist -- because the explorer has not shipped
  and the current contract is wrong -- optimize for the correct canonical model, not compatibility theater"
- "DO NOT keep separate canonical logic in JSON loaders and DuckDB helpers -- because that recreates the current drift risk
  -- move all interactive metric reads behind one DuckDB contract"
- "DO NOT allow Home, PlatformIndex, BenchmarkIndex, Compare, or ResultDetail to keep metric reads outside DuckDB -- because
  that violates the core architecture goal -- migrate every metric-bearing surface"
- "DO NOT recompute display reductions, rankings, compliance classes, speedup ratios, or fastest/slowest spreads in TypeScript
  -- because the canonical Python reference computation in `benchbox/core/explorer_pipeline/` owns those semantics -- persist
  canonical values in DuckDB and read them directly"
- "DO NOT treat pre-calculated CLI JSON artifacts, current TS reduction libs, or any bridge artifact as the parity oracle
  -- because doing so freezes today's drift into tomorrow's contract -- define parity as `DuckDB read-path value == canonical
  Python reference computation in `benchbox/core/explorer_pipeline/` (with read-only imports from `benchbox/core/results/`)`,
  within the per-metric tolerance declared in `visible_metrics.yaml`"
- "DO NOT require derived user-visible metrics to equal verbatim JSON source fields -- because many visible values are canonical
  reductions or rollups -- prove final-value parity against the canonical Python reference computation instead"
- "DO NOT let bootstrap convenience justify metric-bearing `manifest.json` or `results_schema.json` sidecars -- because that
  silently recreates split-brain storage -- keep any surviving JSON bootstrap-only and enforce via a key-whitelist contract
  test"
- "DO NOT let `public/data/bundles/*.json` drift into a rendered metric path -- because bundles are committed JSON source
  inputs and a download-only affordance, not a runtime read source -- enforce via the G-8 second assertion that no `src/pages/`
  or `src/components/` file fetches `/results/data/bundles/`"
- "DO NOT delete metric-JSON emitters in W2 -- because Home/PlatformIndex/BenchmarkIndex/Compare/ResultDetail still read from
  them until W4 -- W2 is additive, W4 deletes each emitter in the same slice as its last consumer, W7 does the final sweep"
- "DO NOT tighten `db.ts` to reject on attach failure until the last manifest.ts consumer migrates -- because pages still
  on the JSON path rely on the soft failure path -- W3 keeps the fallback in place; W4 lands the hardening in the same slice
  that deletes `manifest.ts`"
- "DO NOT dedupe `cohort_metadata` rows by `(cohort_key, platform_id)` or hide publishable variants of the same platform in
  any canonical table -- because users must be able to compare across tuning levels and trust levels from the DuckDB store,
  and the pipeline is the wrong layer to decide which variant 'represents' a platform -- key `cohort_metadata` on `(cohort_key,
  result_id)`, carry `tuning_mode`/`trust_label`/`short_id` alongside, and let the UI decide any display-time collapsing"
- "DO NOT rely on dict last-write-wins inside `_build_meta_leaderboard` `platform_agg` when the same `platform_id` ranks more
  than once in the same cohort -- because the second write clobbers the better rank with a worse one and poisons `avg_rank`
  for the Home meta-leaderboard -- compare ranks on write and keep the best (or rely on best-first iteration order with `setdefault`)"
- "DO NOT widen scope into CLI, hosted API, or submission-path changes -- because this TODO is about the static explorer read
  model only -- leave write-path contracts untouched"
- "DO NOT add new reduction code under `benchbox/core/results/` -- because this TODO's scope_limit keeps that tree read-only
  -- add new reductions under `benchbox/core/explorer_pipeline/` and import existing utilities read-only from `benchbox/core/results/`
  as needed"

