    summary: "Make the cross-surface comparator tie-aware for top-N queries (clears ClickBench's 27 tie-ambiguous cells)"
    needs: [w3]
    status: done
    notes: |
      DONE. Made ResultValidator.validate_results_exact opt-in tie_aware (additive,
      default False so the TPC-Havoc gates are byte-unchanged). Chose option (b) (a
      tie-aware comparator) over (a) (the ClickBench SQL queries are also the perf
      queries, so adding tie-breaker ORDER BY columns would pollute the benchmark)
      and over weakening to set-equality.

      MECHANISM: the relaxation engages ONLY after the strict sorted-positional
      comparison fails, and accepts a divergence iff it is exactly an ambiguous
      top-N boundary tie - deterministically, independent of run-to-run tie
      reordering:
        - the differing rows are the multiset difference each way (the swapped tie
          members); the rest are byte-identical (the deterministic remainder);
        - there must be an order-key column c that is monotonic across the
          reference result (the ORDER BY key is; a grouped non-key column is not),
          whose value on EVERY swapped row equals the reference's boundary value
          original[-1][c] (stable even when tied rows reorder), the boundary value
          occurs >=2 times (a genuine tie, not a unique last row), and is an
          extreme (min/max) of the column.
      So a real value-misplacement bug outside the tie (wrong order-key value,
      wrong non-key value on a determined row, wrong row count, unique-last-row
      change) puts a non-boundary value into the swap and still FAILS. The
      cross-surface gate passes tie_aware=True; TPC-Havoc keeps the default.

      An EARLIER attempt inferred the key by splitting on all monotonic columns
      jointly; DuckDB's non-deterministic tie order made a non-key column
      (SearchPhrase) coincidentally monotonic in ~1/3 of runs, so the gate was
      flaky. The multiset-difference + boundary-value formulation is order-stable
      (the count column always qualifies); verified 5 consecutive clean runs.

      Q18 (`... GROUP BY ... LIMIT 10` with NO ORDER BY over ~97k groups) is the
      one genuinely order-less query - any 10 rows are valid and the two surfaces
      pick different subsets (both verified subsets of the full grouped result).
      It is the last-resort option (c): classified in clickbench's
      known_divergences with justification, NOT masked (the tie-aware comparator
      handles every ORDER BY ... LIMIT case; only this order-less LIMIT needs a
      baseline entry).

      EVIDENCE: make clickbench-cross-surface-equivalence-report 27 -> 0
      unclassified (Q18's 1-2 classified cells aside), stable across 5 runs; ssb
      26/26, amplab 16/16, coffeeshop 22/22, joinorder_synthetic 26/26 all 0
      divergent on the tie_aware path; TPC-Havoc SQL 220/220 and DataFrame 440/440
      unchanged (default strict path); a planted REAL ClickBench defect (Q1 count
      +1000) still flags Q1_expression+Q1_pandas; 80 tpchavoc+equivalence unit
      tests pass (6 new tie_aware cases lock accept/reject behavior). Files:
      benchbox/core/tpchavoc/validation.py, benchbox/core/equivalence/cross_surface.py.
      Original triage below.

      PREREQUISITE for promoting ClickBench STAGED_GATES->GATES (w4). Surfaced and
      triaged during w3 ClickBench burn-down (PR #848; detail in
      _project/analysis/clickbench-cross-surface-divergences.md).

      ROOT CAUSE (verified by direct SQL-vs-DataFrame set/count comparison): the 27
      remaining ClickBench divergences are NOT logic bugs. The DataFrame computes
      CORRECT aggregates; the gate's comparator (ResultValidator.validate_results_exact
      in benchbox/core/tpchavoc/validation.py) sorts both sides then compares
      row-by-row, so for `ORDER BY <col> ... LIMIT N` queries whose ties span the
      LIMIT cutoff it reports a false divergence: SQL and the DataFrame each keep a
      different (equally valid) subset of the tied rows. E.g. Q32/Q33 top-10 are all
      count=1 (thousands of count-1 groups; LIMIT 10 keeps an arbitrary 10); Q16's
      count distribution 4,4,4,4,4,4,3,3,3,3 is IDENTICAL on both surfaces, only the
      tied rows reorder/swap at the boundary.

      FIX (gate/validator-level, NOT 27 per-query ClickBench changes - pick one):
        (a) append a deterministic total-order tie-breaker (remaining columns / a
            stable key) to the ORDER BY on BOTH surfaces before comparison, or
        (b) make the comparator tie-aware: compare the MULTISET of rows sharing the
            boundary order-key value instead of position-by-position, or
        (c) classify genuinely tie-ambiguous queries as accepted/justified
            divergences (last resort - prefer a real total order).
      Reuse, do not fork, ResultValidator; keep it able to catch genuine
      value-misplacement bugs (do not weaken to set-equality across all columns).

      VERIFY: after the fix, `make clickbench-cross-surface-equivalence-report` drops
      from 27 divergent cells to only the w9 loader-dtype residue (Q17/Q24), and a
      planted real ClickBench defect still fails the gate (no masking).

  - id: w9
    summary: "Apply schema column TYPES (not just names) when loading the DataFrame surface (clears joinorder_synthetic's 10 dtype cells)"
    needs: [w5, w6]
    status: done
    notes: |
      DONE. Made the production DataFrame loader apply the schema's declared column
      TYPES (and DuckDB-matching empty-field semantics) instead of per-file
      inference. Three loader-layer fixes, all additive, no per-query changes:

        1. SQL-type -> Arrow-type map was incomplete. The CSV->Parquet conversion
           (the Polars/expression path, which reads read_parquet) only typed the
           handful of names in SchemaMapper.PYARROW_TYPE_MAP (VARCHAR/CHAR/INTEGER/
           DATE/...), so declared TEXT/STRING/BIGINT/NUMERIC/... columns fell
           through to PyArrow inference - an all-NULL TEXT column (joinorder
           movie_companies.note) inferred as Null, a numeric-looking TEXT column
           (movie_info_idx.info ratings) as float64. Added
           SchemaMapper.sql_type_to_pyarrow() covering every SQL type family
           (TEXT/STRING/CHAR -> string, INT family -> int64, DECIMAL/FLOAT family
           -> float64, DATE -> date32, TIMESTAMP/DATETIME -> timestamp[us]) and
           routed _extract_arrow_types through it. Cleared the 6 Polars
           "expected String type" cells (1a/1b/5a/8a/9a/10a) and the float64-vs-str
           cells (4a/12a).
        2. Pandas reads CSV, not Parquet (its recommended_data_format is CSV), so
           the Parquet fix did not reach it. read_csv now (a) reads declared text
           columns as object (so numeric-looking text is not inferred float64) and
           (b) parses a declared DATE/TIMESTAMP column as temporal even when its
           NAME does not match the date-suffix heuristic (ClickBench
           ClientEventTime TIMESTAMP was read as a raw string vs DuckDB's datetime).
           Date detection is now TYPE-aware (extends the w6 numeric-exclusion).
        3. Empty-string vs NULL (ClickBench Q17/Q24): the DataFrame surface emitted
           None where the SQL surface emits "". Root cause was the per-benchmark
           CSV null_marker, NOT dtype: DuckDB resolves nullstr via
           resolve_csv_dialect (ClickBench null_marker=None -> empty kept "";
           JoinOrder null_marker="" -> empty -> NULL), while the DataFrame path
           always nulled empties (coincidentally matching JoinOrder, diverging from
           ClickBench). Threaded the SAME resolved null_marker into both surfaces:
           the Parquet conversion sets strings_can_be_null = (null_marker is not
           None); pandas restores "" on declared string columns when null_marker is
           None; pandas load_table now resolves null_marker via resolve_csv_dialect
           (not the file-extension heuristic) so JoinOrder still nulls empties.
           Bumped the DataFrame Parquet cache v3->v4 (conversion rules changed).

      EVIDENCE:
        - make joinorder-synthetic-cross-surface-equivalence-report: 26/26, 0
          divergent (was 16/26). Deterministic (seeded generator).
        - make clickbench-cross-surface-equivalence-report: Q24 fully cleared (both
          backends); Q17's empty-string/dtype residue cleared - Q17's remaining
          divergence is the tie-ambiguous top-N (ORDER BY COUNT(*) DESC LIMIT 10,
          different tied UserIDs per backend), which is w8's domain, not w9. Overall
          clickbench 27 -> 22 divergent; the 22 are exactly the w8 tie-ambiguous set.
        - Enforced gates unaffected: ssb 26/26, amplab 16/16, coffeeshop 22/22, all
          0 divergent (their null_marker is "" or .tbl, or None with no compared
          empties). tpchavoc SQL gate 220/220 and DataFrame gate 440/440, 0
          divergent (the latter uses DuckDB->Arrow, unaffected).
        - 1863 tests/unit/core/dataframe + core/equivalence + platforms/dataframe
          pass. ruff clean; no new ty diagnostics. Real benchbox-run DataFrame load
          path re-verified (data loads via the production loader unchanged; the
          NOT_RUN CLI query-selection quirk pre-exists on develop).
      Files: benchbox/core/dataframe/data_loader.py (sql_type_to_pyarrow,
      _get_null_markers, null_marker threading, cache v4),
      benchbox/platforms/dataframe/pandas_df.py (string-col dtype, type-aware date
      parse, empty-string restore), benchbox/platforms/dataframe/pandas_family.py
      (resolve_csv_dialect for the benchmark-instance null_marker). Original plan
      below.

      PREREQUISITE for promoting joinorder_synthetic STAGED_GATES->GATES (w4) and for
      ClickBench Q17/Q24 (empty-string-vs-None). DEFERRED by user decision
      (2026-06-21) to keep that session focused; it remains REQUIRED for w4 and is
      tracked here so it is not lost. Detail:
      _project/analysis/joinorder-synthetic-cross-surface-divergences.md and the
      Q17/Q24 exception in clickbench-cross-surface-divergences.md.

      ROOT CAUSE: the production DataFrame loader applies column NAMES from the schema
      (get_benchmark_schema_columns, fixed in #846 to parse DDL-string columns) but
      then TYPE-INFERS dtypes per file rather than applying the schema's declared
      column TYPES. So columns whose content looks numeric, or is null-heavy, get the
      wrong dtype and the query's comparisons fail. joinorder_synthetic: 10 cells -
      "expected String type" (Polars) on 1a/1b/5a/8a/9a/10a; "string vs numeric" on
      4a/12a. ClickBench: SQL emits "" where the DataFrame emits None (Q17 col 1,
      Q24 col 14) - same null/dtype materialization issue. NOTE the divergence
      reproduces on the read_parquet path (the loader converts CSV->parquet via
      DataFrameDataLoader, then read_parquet), NOT read_csv - an earlier CSV-layer
      schema_overrides attempt was on the wrong layer and was reverted (#847); the
      fix must apply schema types on the parquet/materialization path the loader
      actually uses.

      FIX (loader-layer, not per-query): apply the schema column TYPES when loading
      the DataFrame surface (types are available from
      benchbox/core/dataframe/schema_utils.py column_sql_type), so a column declared
      VARCHAR/TEXT loads as string and INTEGER as int instead of relying on per-file
      dtype inference. Reuse the production loader/adapters (benchbox/platforms/
      dataframe/, benchbox/core/dataframe/data_loader.py); keep the change additive
      and re-verify the normal DataFrame benchmark run path (must_preserve).

      VERIFY: `make joinorder-synthetic-cross-surface-equivalence-report` reaches
      26/26 (from 16/26); ClickBench Q17/Q24 clear; dataframe/equivalence unit tests
      stay green.

deferred:
  - summary: "Cross-surface equivalence on a second engine"
    reason: "Cross-engine sampling is its own discipline (see tpchavoc-cross-dialect-equivalence-sampling); keep these gates DuckDB-bounded first."
  - summary: "Benchmarks that ship only one surface"
    reason: "Cross-surface cannot apply; their oracle gap is owned by benchmark-correctness-oracle-coverage-map."

must_preserve:
  - "The TPC-Havoc SQL and DataFrame gates stay green with empty KNOWN_DIVERGENCES and unchanged behavior."
  - "benchbox run default (execution-only) behavior is unchanged for every benchmark; the gates are additive."
  - "ResultValidator tolerance/checksum semantics are unchanged; reuse, do not fork, the comparator and the DuckDB SQL-reference data builder."
  - "The production DataFrame loader/adapters are reused, not forked; any change there (w6) is a genuine loader bug fix that keeps the real DataFrame run path working (re-verify the DataFrame benchmark run), never gate-only special-casing."

approach: |
  Generalize the proven TPC-Havoc DataFrame gate rather than inventing a new
  comparator: extract a shared harness (w0), inventory applicability (w1), stand
  up a production-faithful DataFrame-loading substrate (w5) and fix the loader
  bugs it surfaces (w6), re-base ssb onto it (w7), then land report-mode across
  the ungated dual-surface benchmarks (w2), burn down (w3), and flip bounded CI
  gates with fast-lane companions (w4). SQL is the live reference for its own
  DataFrame surface; no hand-maintained answer keys; the DataFrame surface runs
  on its real production data path so divergences are real, not dtype artifacts.

anti_patterns:
  - "DO NOT write a new result comparator or data builder - because the TPC-Havoc harness already does this - generalize and reuse it."
  - "DO NOT execute DataFrame queries OR load their data via a bespoke path - because the gate must reflect the real product run path - use the DataFrame runner/mixin for query dispatch AND the production loader/adapters for data loading (w5)."
  - "DO NOT gate a full platform matrix - because routine PRs must stay cheap - one bounded small-SF DuckDB cell per benchmark."
  - "DO NOT silence a real divergence by adding it to the baseline - because the baseline is for intentional differences only - fix the wrong surface."

verification:
  - description: "Generalized harness reproduces the existing TPC-Havoc DataFrame gate result"
    command: "make tpchavoc-dataframe-equivalence-report"
    expected_output: "still 0 divergent (re-expressed on the shared harness, unchanged)"
  - description: "A new dual-surface gate fails when one surface is deliberately broken"
    command: "introduce a wrong projection in one SSB DataFrame query, run the SSB cross-surface gate"
    expected_output: "gate FAILS (non-zero), naming the divergent query"

scope_limit:
  only_modify:
    - "benchbox/core/"
    - "benchbox/platforms/dataframe/"  # added 2026-06-18: the gate now loads
      # DataFrame contexts via the real production loader (the reference adapters
      # live here), and w6 fixes loader correctness bugs it surfaces. Edit the
      # SHARED loader/adapters only for genuine bugs (e.g. the type-blind date
      # heuristic); keep changes additive and re-verify the DataFrame run path.
    - "tests/"
    - ".github/workflows/"
    - "Makefile"

open_questions:
  - question: "Should the shared harness live in a new benchbox/core module (e.g. core/equivalence/) with TPC-Havoc re-exporting from it, or stay under tpchavoc with others importing it?"
    gating: true
    affects: ["w0 placement"]
    default: "New core/equivalence/ module owning the benchmark-agnostic harness; tpchavoc equivalence.py / dataframe_equivalence.py become thin benchmark-specific wrappers re-exporting it, so their public entry points and gates are unchanged."
  - question: "For benchmarks whose DataFrame and SQL surfaces intentionally differ in presentation (e.g. LIMIT/top-N or column aliasing), is set-equality after the existing top-N normalization sufficient, or do some need per-benchmark normalization?"
    gating: false
    affects: ["w1 normalization", "w3 classification"]
    default: "Reuse the TPC-Havoc strip_top_n / validator normalization; add per-benchmark normalization only where w2 evidence shows an intentional, defensible presentational difference."
    resolution: |
      RESOLVED (2026-06-18, user decision): COLUMN ORDER/ALIASING differences ->
      align the surfaces (make the two surfaces project the same column order),
      rather than reorder in the comparator. The comparison stays positional
      (validate_results_exact), which keeps it able to catch value-misplacement
      bugs. First instance: SSB Q2.x SQL was reprojected to
      (d_year, p_brand1, sum(lo_revenue) as revenue) to match the DataFrame
      surface's natural group-keys-first order (#815). Evidence that drove this:
      Codex flagged Q2 as a positional mismatch; the SF=0.1 gate had only passed
      because Q2 returns 0 rows at that scale (a vacuous pass), so the divergence
      was latent. For each future benchmark, confirm column order aligns (or align
      one surface to the other, presentation-only) before gating.

  - question: "How should the gate materialize DataFrame inputs - via DuckDB->Arrow (the TPC-Havoc template) or via the production DataFrame loader - given the impls' dtype expectations differ per benchmark?"
    gating: true
    affects: ["data-path for all gates beyond ssb"]
    default: "Use DuckDB->Arrow (the proven TPC-Havoc template path); it is in-scope and shipped ssb."
    resolution: |
      RESOLVED (2026-06-18, FINAL - supersedes the interim decision below).
      Use the PRODUCTION DataFrame loader for dtype fidelity, and EXPAND
      scope_limit to include benchbox/platforms/dataframe/ so the loader's bugs
      can be fixed rather than worked around. Rationale: the gate's value is
      catching real SQL<->DataFrame divergences, and that requires the DataFrame
      surface to run on the SAME dtypes its production run uses; a DuckDB->Arrow
      shortcut with per-benchmark casts risks masking real impl bugs. Concrete
      plan added as work items w5 (production-loader substrate), w6 (fix loader
      correctness bugs it surfaces - first the type-blind pandas date heuristic
      that mis-parses ssb's INTEGER datekeys), w7 (re-base the ssb gate + harness
      onto it and re-verify). Discipline preserved: where an impl genuinely fails
      under its production dtypes (e.g. coffeeshop's date-vs-string compare),
      report it as a real divergence and fix the impl (w3) - only fix LOADER code
      where the loader itself is wrong, never to accommodate a wrong impl.

      INTERIM (2026-06-18, SUPERSEDED): had decided to keep the in-scope
      DuckDB->Arrow path and cast dtypes per benchmark to match production,
      because the production loader was then out of scope and errored on ssb.
      The user subsequently expanded scope to pursue the production loader
      directly; that interim approach is no longer in effect.

success_metrics:
  - "A single shared harness backs both the TPC-Havoc gates and the new cross-surface gates; no duplicated comparator/data-builder."
  - "Every dual-surface benchmark with no expected-results oracle has a bounded SQL<->DataFrame equivalence gate that is green on develop."
  - "Introducing a divergence into either surface of a gated benchmark fails CI."

