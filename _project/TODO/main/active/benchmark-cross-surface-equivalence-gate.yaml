      the only baseline entry is ClickBench Q18 (genuinely order-less LIMIT). The
      last in_progress reason was the ClickBench tie cells, which w8 cleared - so
      w3 closes with w8. Original plan below.

      For each divergence, determine which surface is wrong and fix it; verify the
      fix makes the two surfaces agree. Where a difference is intentional and
      defensible (e.g. a surface deliberately omits a presentational LIMIT),
      record it as a classified, justified known-divergence entry, mirroring the
      TPC-Havoc baseline discipline (default: empty baseline, every query matches).

      IN PROGRESS. ssb: no burndown required (0 divergences); baseline empty.

      amplab: 10 divergences, all the projection-faithfulness/dtype class (NOT a
      loader bug). Root cause: the amplab DataFrame impls compared the date-typed
      visitDate column to ISO-STRING literals ("2000-01-01"), which raises under
      the production loader's date32 dtype - i.e. the production amplab DataFrame
      run was itself broken for Q2/Q2a/Q3/Q4/Q5. Fixed the WRONG surface (the
      DataFrame impls), mirroring the TPC-H DataFrame queries whose date params are
      typed datetime.date objects: AMPLAB_DEFAULT_PARAMS (and the impl fallbacks)
      now carry date(2000,1,1)/date(2000,1,3) instead of strings, so the
      comparison succeeds on both backends. No gate-local cast, no loader change,
      no baseline entry. Verified against CANONICAL SQL (the gate), not a sibling
      DataFrame impl: 0/16 divergent, with Q2 (70 rows), Q2a (6), Q4 (100)
      meaningfully exercising the date filter+join (non-vacuous). baseline empty.

      clickbench: load-faithful gate WIRED (build_clickbench_duckdb), STAGED_GATES
      (NOT GATES), runnable via `make clickbench-cross-surface-equivalence-report`.

      BURN-DOWN PROGRESS (full detail:
      _project/analysis/clickbench-cross-surface-divergences.md):
        - DETERMINISM FIX (prerequisite): the ClickBench generator was UNSEEDED, so
          every run produced different data and top-N/tie-sensitive cells flipped
          divergence run-to-run (the gate was flaky). Added random.seed(42) in
          _generate_data_local (mirrors SSBDataGenerator); the gate is now
          deterministic (verified: two runs report the identical divergence set).
        - ALL 10 engine/error-category cells FIXED: added UnifiedStrExpr.replace
          (Q29) and UnifiedLazyFrame.slice (Q39-42) to the shared abstraction;
          compared EventDate to native date literals not strings (Q37-43); pandas
          `<> ''` filters now exclude NULL via .notna() to match SQL/Polars
          (Q25/27). 1129 dataframe/clickbench unit tests still pass.
        - REMAINING: 27 stable value-divergence cells across 14 queries. TRIAGE
          (verified by direct SQL-vs-DataFrame set/count comparison): these are
          mostly NOT logic bugs. The DataFrame computes CORRECT aggregates; the
          divergences are the gate's order-sensitive row-by-row comparison of
          tie-ambiguous top-N (`ORDER BY col ... LIMIT N` with ties spanning the
          cutoff). E.g. Q32/Q33 top-10 are all count=1 (thousands of count-1
          groups, LIMIT keeps an arbitrary 10); Q16 count distribution is IDENTICAL
          on both surfaces (only tied rows reorder). So the fix is GATE-LEVEL
          (deterministic total-order tie-breaker on both surfaces, OR a tie-aware
          validator, OR classify tie-ambiguous queries), NOT per-query ClickBench
          fixes. Exception: Q17/Q24 empty-string-vs-None is the deferred loader
          null/dtype materialization issue (see joinorder_synthetic). Detail:
          _project/analysis/clickbench-cross-surface-divergences.md.
      So ClickBench has ~no genuine DataFrame logic bugs; promote STAGED_GATES->GATES
      once the gate handles tie-ambiguity + the loader dtype fix lands (w4).
      joinorder_synthetic and the other registry-bearing benchmarks (per the
      corrected applicability sweep) are the next gates to wire.

      GENERATOR SEEDING AUDIT (_project/analysis/gateable-generator-seeding-audit.md):
      an unseeded generator makes any cross-surface gate flaky (as ClickBench was).
      Audited every gateable benchmark's generator. Most are seeded (ssb, amplab,
      h2odb, tpch_skew, tsbs_devops, clickbench) or RNG-free (coffeeshop static
      seed-data, read_primitives). FIX: joinorder_synthetic used unseeded random
      and is the next gate to wire - added random.seed(42) in its
      _generate_data_local; verified its data tables are now byte-identical across
      runs (the only residual file-byte diff is the manifest timestamp, which the
      gate does not read). The five external/derived-data benchmarks (datavault,
      flightdata, joinorder, nyctaxi, tpcds_obt) have no synthetic RNG; confirm
      their bounded data source is stable when wiring each.

      joinorder_synthetic: gate WIRED (build_joinorder_synthetic_duckdb, STAGED_GATES,
      `make joinorder-synthetic-cross-surface-equivalence-report`; 13 queries x 2
      backends). Wiring surfaced a SHARED DataFrame-loader bug: the production loader
      applies column names from get_benchmark_schema_columns, but that extractor did
      not understand joinorder_synthetic's schema shape (columns are raw DDL strings
      like "id INTEGER PRIMARY KEY") -> returned no columns -> every table loaded
      HEADERLESS, all 26 cells errored. Fixed schema_utils.py (column_name/
      column_sql_type) to parse DDL-string columns - a general fix benefiting any
      string-schema benchmark - dropping divergences 26 -> 10 (16 cells now pass;
      791 dataframe/equivalence unit tests still pass). REMAINING 10 cells are
      dtype-mismatch errors (loader applies column names but type-INFERS dtypes
      instead of applying schema types: "expected String type" on 1a/1b/5a/8a/9a/10a;
      "string vs numeric" on 4a/12a). Follow-up: apply schema column TYPES when
      loading the DataFrame surface (types now available from column_sql_type). Detail:
      _project/analysis/joinorder-synthetic-cross-surface-divergences.md.

