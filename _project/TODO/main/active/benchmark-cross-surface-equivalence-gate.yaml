id: benchmark-cross-surface-equivalence-gate
title: "Generalize the result-equivalence harness and gate SQL<->DataFrame equivalence for dual-surface benchmarks"
worktree: main
priority: High
status: In Progress
category: Testing and Quality Assurance

description: |
  TPC-Havoc now ships two result-equivalence gates that proved a discipline:
  execute a candidate query and a trusted reference over the SAME bounded
  small-SF DuckDB dataset and compare results live (order-insensitive, float-
  tolerant), with no hand-maintained expected answers. The SQL gate
  (benchbox/core/tpchavoc/equivalence.py) compares each SQL variant to canonical
  TPC-H; the DataFrame gate (benchbox/core/tpchavoc/dataframe_equivalence.py)
  compares each DataFrame variant to canonical TPC-H SQL. Together they found and
  fixed ~42 silent correctness defects.

  That discipline is currently TPC-Havoc-only, by construction. But ~14
  benchmarks ship a DataFrame query surface (amplab, clickbench, coffeeshop,
  datavault, flightdata, joinorder, nyctaxi, read_primitives, ssb, tpcds,
  tpcds_obt, tpch, tpch_skew, tsbs_devops) in ADDITION to their SQL surface, and
  nothing checks that the two surfaces agree. Worse, stored expected results
  exist for ONLY tpch and tpcds (benchbox/core/expected_results/tpch_results.py,
  tpcds_results.py) - so for every other dual-surface benchmark there is NO
  correctness oracle of any kind: SQL and DataFrame implementations both execute
  "green" while their results are unverified and may silently disagree.

  Cross-surface equivalence is the cheap, maintenance-free oracle for exactly
  this gap: SQL and DataFrame are independent implementations of the same logical
  query, so a divergence proves at least one is wrong - without needing a
  hand-curated answer key. This work generalizes the TPC-Havoc DataFrame-gate
  harness into a shared, benchmark-agnostic helper, then rolls out a bounded
  SQL<->DataFrame equivalence gate to the dual-surface benchmarks, SQL as the
  reference for its own DataFrame surface.

  Note: for tpch/tpcds the expected-results registry already validates each
  surface against a stored answer key (transitive equivalence), so they are
  lower priority here; the highest value is the dual-surface benchmarks with NO
  oracle today (ssb first - canonical and small - then clickbench, joinorder,
  coffeeshop, etc.).

prior_art:
  - "benchbox/core/tpchavoc/dataframe_equivalence.py - build_dataframe_contexts, materialize_rows, fetch_canonical_rows, find_dataframe_divergences, main; the template to generalize (it already compares a DataFrame result to a SQL reference on DuckDB)."
  - "benchbox/core/tpchavoc/equivalence.py - build_duckdb_with_tpch, find_divergences, strip_top_n, KNOWN_DIVERGENCES, main; the SQL-side harness and the empty-baseline fail-on-divergence pattern."
  - "tests/integration/test_tpchavoc_variant_equivalence.py - the fast default-lane regression companion; mirror it per gated benchmark."
  - "benchbox/core/expected_results/ (registry.py, tpch_results.py, tpcds_results.py) - the only existing correctness oracles; documents that coverage stops at tpch/tpcds."
  - "benchbox/core/runner/dataframe_runner.py and benchbox/platforms/dataframe/benchmark_mixin.py - how DataFrame queries actually execute and materialize; the gate must use the same execution path, not a bespoke one."
  - "benchbox/core/<bench>/dataframe_queries(.py or package) and <bench>/queries.py (or get_queries) for each dual-surface benchmark - the two surfaces to compare (note: some, e.g. ssb/tpcds/clickbench, ship dataframe_queries as a package directory rather than a single module)."

work:
  - id: w0
    summary: "Extract a benchmark-agnostic cross-surface equivalence harness from the TPC-Havoc DataFrame gate"
    status: done
    notes: |
      Factor the data-build + run-SQL + run-DataFrame + compare loop out of
      tpchavoc/dataframe_equivalence.py into a shared core helper parameterized by
      benchmark (DDL/data builder, SQL query accessor, DataFrame query accessor,
      validator). Re-express the existing TPC-Havoc DataFrame gate on top of it
      with NO behavior change (its gate must stay green and byte-equivalent in
      result). Reuse validate_variant_equivalence / the result validator and the
      DuckDB data builder; do not fork them.

      DONE: shared harness landed at benchbox/core/equivalence/dataframe_surface.py
      (build_dataframe_contexts, materialize_rows, fetch_reference_rows,
      find_surface_divergences, SurfaceDivergence, _normalize_value). The TPC-Havoc
      DataFrame gate (benchbox/core/tpchavoc/dataframe_equivalence.py) is now a thin
      wrapper over it: it injects the canonical-TPC-H reference, the variant/backend
      cell enumeration, and the reused validate_variant_equivalence comparator +
      build_duckdb_with_tpch data builder. Gate re-verified byte-equivalent:
      "checked 440 variant-backend cells - 0 divergent, 440 equivalent". Fast-lane
      tests/integration/test_tpchavoc_dataframe_variant_equivalence.py still passes;
      new fast-lane unit coverage at tests/unit/core/equivalence/.

  - id: w1
    summary: "Inventory dual-surface benchmarks and confirm SQL<->DataFrame query-id correspondence"
    needs: [w0]
    status: in_progress
    notes: |
      NOT YET COMPLETE — kept open so downstream work units that `needs: [w1]` are not
      unblocked with unverified query mappings: nyctaxi and tsbs still need independent
      mapping verification, and clickbench's SQL id set / construction is unconfirmed.
      Flip to done only once those three are verified.

      For each benchmark with both surfaces, confirm the SQL and DataFrame query
      sets cover the same logical queries (matching ids/keys) and can run on a
      shared DuckDB cell. Record which are in scope, which are single-surface
      (out of scope here - owned by benchmark-correctness-oracle-coverage-map),
      and any that need per-benchmark normalization (top-N/LIMIT, column order).

      IN PROGRESS. Surface scan (dataframe_queries module OR package) confirms a
      DataFrame surface for: amplab, clickbench, coffeeshop, datavault,
      flightdata, joinorder, joinorder_synthetic, nyctaxi, read_primitives, ssb,
      tpcds, tpcds_obt, tpch, tpch_skew, tsbs_devops, h2odb (+ tpchavoc). The
      ungated, no-expected-results dual-surface targets per the TODO are: ssb,
      clickbench, joinorder, coffeeshop, amplab, nyctaxi, flightdata, tsbs_devops,
      tpcds_obt, tpch_skew, read_primitives.

      Confirmed and gated: ssb - SQL get_queries() and the SSB_DATAFRAME_QUERIES
      registry both key by identical ids Q1.1..Q4.3 (13 queries, 1:1). Per-
      benchmark normalization finding: schema shape is heterogeneous - TPC-H/
      tpchavoc expose typed Table/Column objects, but ssb/amplab/coffeeshop/etc.
      expose dict-shaped TABLES. The shared harness now offers
      build_dataframe_contexts_from_specs((name, [(col, sql_type)])) so both
      shapes reuse one DuckDB->Arrow->register loop.

      VERIFIED id-correspondence + feasibility map for the ungated targets
      (probed SQL get_queries() vs each DataFrame registry's get_query_ids()):
        - ssb            13 ids, 1:1 (Q1.1..Q4.3)              GATED (#815).
        - coffeeshop     11 ids, 1:1                           ready; but DuckDB
            ->Arrow date32 contexts break its pandas impls (date-vs-string
            compare) -> needs the data-path decision below before gating.
        - flightdata     20 ids, 1:1 (friendly names)          ready; NOTE no
            synthetic generator module (uses real downloaded data) - confirm a
            bounded data source before gating.
        - read_primitives 157 SQL vs 152 DF                    gate the 152-id
            intersection (5 SQL-only ids have no DF impl).
        - amplab          8 ids, count matches; DF ids are Q-prefixed ('1'->'Q1')
            -> mechanical id normalization in the spec.
        - tpch_skew      22 ids, same; DF Q-prefixed ('1'->'Q1') -> same.
        - nyctaxi        25 ids; SQL friendly-names vs DF 'Q1'..'Q25'  -> AMBIGUOUS
            ordering map; needs independent verification of which SQL id == which
            Qn before asserting (do NOT guess).
        - tsbs_devops    18 ids; same friendly-name vs 'Qn' ambiguity as nyctaxi.
        - joinorder      113 ids, 1:1 string keys BUT scale_factor=1.0-only
            (canonical IMDb) -> does NOT fit the SF=0.1 bounded cell; use SF=1 or
            joinorder_synthetic, a separate decision.
        - clickbench     43 DF ids; benchmark construction differs (abstract base)
            -> confirm SQL id set + construction before gating.
        - tpcds_obt      (per source TODO) DF is a 3-query stub vs ~89 SQL - gate
            only the implemented intersection or defer.

  # --- Production-loader substrate (added 2026-06-18 after the user expanded
  # scope to pursue dtype-faithful DataFrame loading; see the data-path
  # open_question resolution). These precede the report/burndown/gate roll-out so
  # every benchmark is gated on the SAME data path its production DataFrame run
  # uses, not the DuckDB->Arrow shortcut. ssb (#815) currently uses DuckDB->Arrow
  # and is re-based in w7. ---
  - id: w5
    summary: "Build a production-faithful DataFrame-context substrate for the gate (reuse the real loader)"
    needs: [w1]
    status: done
    notes: |
      DONE. Added build_production_contexts() in core/equivalence/cross_surface.py:
      per backend it instantiates the real adapter and calls the new public
      BenchmarkExecutionMixin.load_benchmark_into_context() - the exact data path
      run_benchmark uses (_extract_benchmark_config + _load_data_phase, prefer_parquet
      default), stopping short of query execution. CrossSurfaceData now carries the
      benchmark instance + data_dir (not table_specs); the DuckDB SQL reference and
      both DataFrame backends read the SAME generated files. The comparator and the
      DuckDB SQL-reference builder are unchanged. (No new fork of the loader: the
      gate calls the production mixin.) Original plan below.

      Replace the gate's bespoke DuckDB->Arrow context-build
      (build_dataframe_contexts_from_specs) with one that loads each backend's
      DataFrame context via the REAL production loader, so the gate exercises the
      same data path (and dtypes) a production DataFrame run uses - honoring the
      "use the real runner/mixin path, not a bespoke one" anti-pattern for DATA
      LOADING as well as query execution.

      Reuse, do not fork: the reference adapters' load path
      (benchbox/platforms/dataframe/{polars_df,pandas_df}.py load_table /
      load_tables_from_data_source / _load_tables_into_context) and
      benchbox/core/dataframe/data_loader.py DataFrameDataLoader. Drive it with
      the benchmark's schema_info (column names/types) and the correct
      delimiter/trailing-delimiter/parquet handling that a bare
      load_tables_from_data_source call skips (this was the cause of the SSB
      mis-load). Generate data once; the SQL reference (DuckDB) and BOTH DataFrame
      backends must read the SAME generated data so "same bounded cell" still holds.
      Keep the comparator and the DuckDB SQL-reference builder reused (unchanged).

  - id: w6
    summary: "Fix production-loader correctness bugs surfaced by real benchmarks (now in-scope: benchbox/platforms/dataframe/)"
    needs: [w5]
    status: done
    notes: |
      DONE (#821). Made the Pandas loader's date-column inference TYPE-AWARE:
      _pandas_parse_date_columns now takes the schema column types and never
      treats a numeric-typed column as a date even if its name ends in date/time,
      so SSB's INTEGER lo_orderdate/lo_commitdate load as integers (real string
      dates like d_date VARCHAR still parse). Behavior is unchanged when types are
      absent. Threaded benchmark -> load_table -> _load_csv_files -> read_csv ->
      _pandas_parse_date_columns; abstract load_table signature made honest. SSB
      now loads via the production loader (gate 26/26). Routing coffeeshop through
      the real loader surfaced GENUINE divergences (date32-vs-string impl bugs,
      value mismatches, a KeyError) - logged for w2/w3 burndown, NOT masked.
      Original plan + diagnosis below.

      Driving the real loader over real benchmark data exposes loader defects the
      gate must not paper over. Known, reproduced:
        * Pandas adapter date heuristic: _pandas_parse_date_columns
          (benchbox/platforms/dataframe/pandas_df.py:62) infers date columns by
          NAME suffix only ("*date"/"*_date") with no type check, then
          _coerce_date_columns casts them to date32. SSB's lo_orderdate /
          lo_commitdate are INTEGER YYYYMMDD datekeys, so the loader tries to
          date-parse integers and raises ("month must be in 1..12"). Fix: gate
          date-coercion on the column's SCHEMA TYPE (thread schema_info types
          through), never the name alone, so integer datekeys load as integers.
      For each benchmark, confirm its impls run under the loader's production
      dtypes; where an impl genuinely fails under the dtype its production run
      uses (e.g. coffeeshop pandas impls compare a date column to a STRING
      literal), that is a REAL divergence/bug to report and burn down in w3 - do
      NOT add a gate-local cast to mask it. Only fix loader code where the LOADER
      is wrong (e.g. the type-blind date heuristic), not to accommodate a wrong impl.

  - id: w7
    summary: "Re-base the SSB gate (and the shared harness) onto the production-loader substrate; re-verify"
    needs: [w5, w6]
    status: done
    notes: |
      DONE. The SSB gate + its fast-lane test now build DataFrame contexts via
      build_production_contexts (w5); re-verified 26/26, 0 divergent at SF=0.1 and
      re-proved the planted-defect failure (corrupting Q1.1's expression impl
      flags exactly Q1.1_expression, no collateral) on the new substrate. The
      tpchavoc DataFrame gate is LEFT on its DuckDB->Arrow path (it is a
      variant-vs-canonical gate, not cross-surface) and re-confirmed green. The
      DuckDB->Arrow builder (build_dataframe_contexts_from_specs) remains in
      dataframe_surface for tpchavoc; only the cross-surface gate moved. Original
      plan below.

      Switch the merged SSB gate (#815) from DuckDB->Arrow to the w5 substrate and
      re-verify it stays green (26/26) under production dtypes; this is the
      reference example every later benchmark follows. Re-confirm the TPC-Havoc
      SQL + DataFrame gates are unchanged (the tpchavoc DataFrame gate may keep its
      own DuckDB->Arrow path - decide whether to migrate it too or leave it, since
      it is a variant-vs-canonical gate, not cross-surface). Update the fast-lane
      tests accordingly. Re-prove the planted-defect failure on the new substrate.

  - id: w2
    summary: "Run the cross-surface gate in report mode over the ungated dual-surface benchmarks and enumerate divergences"
    needs: [w5, w6, w7]
    status: in_progress
    notes: |
      Prioritize benchmarks with NO expected-results oracle: ssb, clickbench,
      joinorder, coffeeshop, amplab, nyctaxi, flightdata, tsbs_devops, tpcds_obt,
      tpch_skew, read_primitives. Report (benchmark, query, kind, deltas) without
      asserting. Capture stdout to /tmp and summarize counts in the PR/TODO.

      IN PROGRESS. ssb reported clean on the INTERIM DuckDB->Arrow substrate (#815):
      26 query-backend cells (13 queries x 2 backends) at SF=0.1, 0 divergent. This
      re-runs on the production-loader substrate (w5-w7); ssb is expected to stay
      clean but is re-confirmed there. Remaining ungated benchmarks are reported on
      the production substrate as each gate is built (now needs w5/w6/w7).

      amplab reported on the production substrate (SF=0.1, 16 query-backend cells =
      8 queries x 2 backends): 10/16 cells divergent on the FIRST report - exactly
      the date-vs-string defect class w6 predicted (the 5 queries touching the
      date32-typed uservisits.visitDate: Q2/Q2a/Q3/Q4/Q5, both backends), each
      raising "cannot compare date to a string value" under the production loader's
      dtypes. Burned down in w3 (see below); amplab now reports 0/16 divergent.

      APPLICABILITY SWEEP: a reproducible sweep
      (_project/scripts/cross_surface_applicability_sweep.py ->
      _project/analysis/cross-surface-applicability.md, locked by
      tests/unit/test_cross_surface_applicability.py) classifies the dual-surface
      UNGUARDED benchmarks by whether they ship a DataFrame query `QueryRegistry`
      (the registry the cross-surface gate builders consume directly) - the
      authoritative gate-applicability signal. `supports_dataframe` over-counts
      (it is a LOADING flag); the production query *resolver* under-counts (it
      misses per-benchmark `<BENCH>_DATAFRAME_QUERIES` registries - e.g. it
      returned 0 for coffeeshop, which #842 nonetheless gated). Registry detection
      fixes both.

      RESULT (16 unguarded candidates; coffeeshop already gated/excluded):
        - GATEABLE, ids overlap as-is (6): clickbench, flightdata, h2odb,
          joinorder, joinorder_synthetic, read_primitives (152/157 ids).
        - GATEABLE, needs id normalization first (6): amplab, datavault, nyctaxi,
          tpch_skew, tsbs_devops (ids Q-prefixed/friendly vs SQL ids), tpcds_obt
          (only 3 DF queries vs 89 SQL - partial).
        - w2 FALLBACK, NO DataFrame query registry (4): metadata_primitives,
          tpcdi, transaction_primitives, write_primitives. Only these four need a
          differential second-engine or curated expected-results oracle.
      So the cross-surface gate burn-down is ~12 benchmarks, not 2 (the earlier
      resolver-based "only 2" was wrong).

      CAVEAT proven during the sweep: a GENERIC build is not load-faithful (it
      loads DataFrame contexts without the schema/headers the production loader
      applies, yielding spurious "column not found" divergences), so enumerating
      REAL divergence counts requires a load-faithful per-benchmark builder like
      build_ssb_duckdb. That builder work is w3 (clickbench done; the other 11
      gateable benchmarks next, normalizing ids where the sweep flags it).

  - id: w3
    summary: "Burn down divergences (fix the wrong surface) or declare intentional ones"
    needs: [w2]
    status: in_progress
    notes: |
      For each divergence, determine which surface is wrong and fix it; verify the
      fix makes the two surfaces agree. Where a difference is intentional and
      defensible (e.g. a surface deliberately omits a presentational LIMIT),
      record it as a classified, justified known-divergence entry, mirroring the
      TPC-Havoc baseline discipline (default: empty baseline, every query matches).

      IN PROGRESS. ssb: no burndown required (0 divergences); baseline empty.

      amplab: 10 divergences, all the projection-faithfulness/dtype class (NOT a
      loader bug). Root cause: the amplab DataFrame impls compared the date-typed
      visitDate column to ISO-STRING literals ("2000-01-01"), which raises under
      the production loader's date32 dtype - i.e. the production amplab DataFrame
      run was itself broken for Q2/Q2a/Q3/Q4/Q5. Fixed the WRONG surface (the
      DataFrame impls), mirroring the TPC-H DataFrame queries whose date params are
      typed datetime.date objects: AMPLAB_DEFAULT_PARAMS (and the impl fallbacks)
      now carry date(2000,1,1)/date(2000,1,3) instead of strings, so the
      comparison succeeds on both backends. No gate-local cast, no loader change,
      no baseline entry. Verified against CANONICAL SQL (the gate), not a sibling
      DataFrame impl: 0/16 divergent, with Q2 (70 rows), Q2a (6), Q4 (100)
      meaningfully exercising the date filter+join (non-vacuous). baseline empty.

      clickbench: load-faithful gate WIRED (build_clickbench_duckdb), STAGED_GATES
      (NOT GATES), runnable via `make clickbench-cross-surface-equivalence-report`.

      BURN-DOWN PROGRESS (full detail:
      _project/analysis/clickbench-cross-surface-divergences.md):
        - DETERMINISM FIX (prerequisite): the ClickBench generator was UNSEEDED, so
          every run produced different data and top-N/tie-sensitive cells flipped
          divergence run-to-run (the gate was flaky). Added random.seed(42) in
          _generate_data_local (mirrors SSBDataGenerator); the gate is now
          deterministic (verified: two runs report the identical divergence set).
        - ALL 10 engine/error-category cells FIXED: added UnifiedStrExpr.replace
          (Q29) and UnifiedLazyFrame.slice (Q39-42) to the shared abstraction;
          compared EventDate to native date literals not strings (Q37-43); pandas
          `<> ''` filters now exclude NULL via .notna() to match SQL/Polars
          (Q25/27). 1129 dataframe/clickbench unit tests still pass.
        - REMAINING: 27 stable value-divergence cells across 14 queries (identical across 3 runs) (Q6, Q9,
          Q10, Q15-19, Q24, Q31-33, Q36, Q38) - per-query triage: empty-vs-None
          null materialization (Q17/Q24), large aggregate diffs (Q16/18/32/33/36 -
          dropped predicate/DISTINCT), and top-N tie-break ordering (Q9/10/38/15/31).
      Once those 26 are clean, promote STAGED_GATES->GATES + a blocking pr.yml step
      + fast-lane regression (w4). joinorder_synthetic and the other registry-bearing
      benchmarks (per the corrected applicability sweep) are the next gates to wire.

  - id: w4
    summary: "Promote to bounded CI gates and add fast-lane regressions"
    needs: [w3]
    status: in_progress
    notes: |
      One bounded small-SF DuckDB cell per gated benchmark, wired into the
      correctness-gate CI job and a Make target, mirroring
      tpchavoc-(dataframe-)equivalence-report. Add a medium-marker pytest per
      benchmark like tests/integration/test_tpchavoc_variant_equivalence.py.
      Prove each gate fails when a deliberate divergence is introduced into one
      surface.

      IN PROGRESS. Generic cross-surface gate landed at
      benchbox/core/equivalence/cross_surface.py (find_cross_surface_divergences,
      CrossSurfaceGate, GATES registry) reusing the shared harness +
      ResultValidator; the DataFrame side executes through the real
      DataFrameQuery.get_impl_for_family dispatch. First gated benchmark: ssb -
      `make ssb-cross-surface-equivalence-report` (added to the correctness-gate
      CI job in pr.yml), fast-lane tests/integration/test_ssb_cross_surface_equivalence.py
      (medium marker), and unit coverage tests/unit/core/equivalence/test_cross_surface.py.
      Verified the gate FAILS on a planted SSB defect (only Q1.1_expression
      diverges, no collateral).

      Second gated benchmark: amplab - `make amplab-cross-surface-equivalence-report`
      (added to the correctness-gate CI job in pr.yml beside ssb), fast-lane
      tests/integration/test_amplab_cross_surface_equivalence.py (medium marker).
      Registered build_amplab_duckdb in the GATES registry (maps SQL ids "1".."5"
      to DataFrame ids "Q1".."Q5"). Verified the gate FAILS on a planted amplab
      defect (Q4 expression total_revenue doubled -> only 4_expression diverges, no
