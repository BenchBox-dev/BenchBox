  expected_output: "no lint errors"
- description: "Dry-run migration reports expected DB moves and stale candidates without writing"
  command: "uv run -- python scripts/migrate_datagen_layout.py --dry-run"
  expected_output: "summary includes candidate database moves from datagen to databases"

