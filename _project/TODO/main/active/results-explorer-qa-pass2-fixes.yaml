impact:
  user_impact: |
    The cold-load empty-state flash (N1) is the most visible bug — a
    first-time visitor with a cleared cache sees an explorer that
    appears to have no data. Sortable index headers (B1 + S3.6) and
    URL-state validation (N2 + N3) are workflow papercuts that
    accumulate friction for any analyst trying to share a state-laden
    URL. Single-id Compare (N4) and missing document titles (N5)
    confuse browser-history navigation. Row-limit UI (N6) blocks
    larger ad-hoc queries. Together this pass closes the practical
    gaps before the explorer can be advertised externally.
  technical_debt: |
    Resolves the dead `?metric=` URL-param state on ResultDetail and
    Compare (Q1) so future readers don't re-discover it. Establishes a
    reusable `useDocumentTitle` hook + URL-validation pattern that the
    next page added to the explorer can adopt without bespoke code.

