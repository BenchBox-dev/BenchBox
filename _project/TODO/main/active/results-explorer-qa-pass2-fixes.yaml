must_preserve:
  - "B2 fix: /results/p/duckdb/ (4 rows) and /results/p/polars/ (2 rows) keep rendering — do not regress while restructuring PlatformIndex for click-sort"
  - "ResultDetail's existing in-page sort UI (button-in-th + sortArrow) keeps working unchanged after w3 is reused as the pattern source"
  - "PlatformIndex default sort (geomean_ms ascending, nulls last) remains the initial state when no header has been clicked"
  - "DuckDB-WASM single-attach behaviour: results.duckdb is fetched once per page-session, not per navigation (S10.3 currently P — must stay P)"
  - "NotFound page continues to render for genuinely unknown top-level routes (preact-router default) — w5 must narrow, not widen, the guard"
