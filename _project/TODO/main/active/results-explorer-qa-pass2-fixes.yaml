  - "Existing default sort on Query workbench (`run_date desc`) remains the initial state after w11 adds the row-limit toggle"

approach: |
  Investigate before patching. w1 and w2 are research/decision units
  that produce explicit outputs (root cause; delete-vs-implement
  decision). Run them first. Once they settle:

    Phase A (parallel-safe mechanical fixes):  w3, w4, w5, w7, w8, w9, w10, w11
    Phase B (depends on Phase A):              w12 (needs w2), w6 (needs w1)
    Phase C (depends on Phases A+B):           w13 docs, w14 e2e
    Phase D (acceptance gate):                 w15 re-run QA

  Reuse existing patterns:
    - Sort handlers: copy ResultDetail's `<th><button onClick=
      toggleSort()>` pattern verbatim (w3).
    - Stable Preact keys: every result row already has a `result_id` —
      use it directly (w4).
    - URL-state validation: `useUrlState` + `replaceState` on hydrate
      is the right shape for w7 + w8; consider extracting a small
      helper if both ship.
    - Document title: a tiny `useEffect`-based `useDocumentTitle`
      hook under `src/lib/` is sufficient — no need for a head-manager
      dependency (w10).
    - Loading-state gating: `Home.tsx`'s existing
      `if (!results) return <LoadingSpinner ... />` is the obvious
      surface for w6; just AND it with `metaLeaderboard !== null` if
      H1/H3 wins.

  Do NOT batch fixes into one mega-commit. Each work unit is its own
  commit per the skill's commit framework. Run lint + relevant tests
  per slice. Vertical slices: implement → test → verify → commit.

  For the failing cold-load (N1), do NOT skip the diagnosis step —
  jumping to a "just add a spinner" fix risks masking a deeper
  data-layer race that will resurface as soon as the corpus grows.

anti_patterns:
  - "DO NOT add the `?metric=` toggle UI before w2 records a decision — because there is no evidence it ever existed and the data layer already enforces a benchmark-derived default — gather git evidence first."
  - "DO NOT delete the existing default-sort logic on PlatformIndex or the existing `run_date desc` default on Query while extending them — because those are observable initial states — extend, do not replace."
  - "DO NOT widen w5's NotFound guard to top-level routes — because preact-router's `default` already handles those — guard only the `:benchmark/` slug match."
  - "DO NOT silently rewrite garbage URL state to defaults without a single visible replaceState — because users hand-edit URLs and a hidden coercion would feel broken — make the URL settle to a valid value within one tick."
  - "DO NOT special-case the cold-load fix to a single platform — because the bug is global empty-state-vs-loading-state confusion — find the gating bug and fix it for all platforms at once."
  - "DO NOT add a head-manager package (react-helmet-equivalent) for the document.title fix — because a 12-line `useDocumentTitle` hook does the entire job — keep the dependency surface flat."
  - "DO NOT batch unrelated fixes into one commit — because per-slice commits give the QA re-run (w15) a clean bisect target — one work unit, one commit."

