name: CI

# One workflow, six always-reporting unit results: core, explorer, results-data,
# docs, landing, and tooling. The classifier maps changed paths to units
# (.github/ci-units.yml); an untouched unit reports success immediately, and a
# touched unit must succeed in every job it required (a skipped required job
# fails the unit). There is deliberately no branch filter on pull_request, so a
# change opened against any base gets CI instead of an empty check list.

env:
  BENCHBOX_TEST_LOCK_WAIT_SECONDS: "0"

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  comment-policy:
    name: comment-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: false
          working-directory: ${{ runner.temp }}
          ignore-empty-workdir: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '20'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce comment and docstring policy
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          : "${BASE_REF:?BASE_REF is required}"
          installed="$(git ls-tree -r --name-only "$BASE_REF" -- \
            scripts/check_comment_policy.py scripts/comment_syntax.py scripts/comment_syntax_js.cjs \
            scripts/comment_payloads.py scripts/comment_execution.py scripts/comment_policy_entry.py \
            quality/comment-policy.json quality/comment-policy-requirements.txt \
            quality/comment-policy-package.json quality/comment-policy-package-lock.json)"
          if git cat-file -e "${BASE_REF}:scripts/run_comment_policy.py" 2>/dev/null; then
            git show "${BASE_REF}:scripts/run_comment_policy.py" > "$RUNNER_TEMP/comment-policy-runner.py"
          elif [ -z "$installed" ] && git merge-base --is-ancestor ed5c263c513ba65499f4918d3a7de607f280c65b "$BASE_REF"; then
            cp scripts/run_comment_policy.py "$RUNNER_TEMP/comment-policy-runner.py"
          else
            echo "Trusted comment-policy launcher is missing" >&2
            exit 1
          fi
          python -I "$RUNNER_TEMP/comment-policy-runner.py" --native-tests

  # Base guard: stacked PRs get CI from this workflow (no branch filter),
  # so an unsupported feature-branch base must fail loudly here instead of
  # sliding into develop unvalidated under a parent PR.
  base-guard:
    name: PR base branch is an integration branch
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          case "$BASE_REF" in
            develop|release|published-results)
              echo "Base branch '$BASE_REF' is an integration branch; the normal CI lanes apply."
              ;;
            *)
              echo "::error::PR base branch is '$BASE_REF', not develop, release or published-results."
              echo "Retarget this PR at develop, or fold the change into the parent PR."
              exit 1
              ;;
          esac

  # Classifier: shared with the legacy path rules, plus the six-unit ownership map.
  ci-paths:
    name: ci-paths
    runs-on: ubuntu-latest
    outputs:
      safe-content-only: ${{ steps.classify.outputs.safe-content-only }}
      needs-code-ci: ${{ steps.classify.outputs.needs-code-ci }}
      content-guard-needed: ${{ steps.classify.outputs.content-guard-needed }}
      skill-integrity-needed: ${{ steps.classify.outputs.skill-integrity-needed }}
      skill-integrity-only: ${{ steps.classify.outputs.skill-integrity-only }}
      changed-paths: ${{ steps.classify.outputs.changed-paths }}
      code-paths: ${{ steps.classify.outputs.code-paths }}
      unknown-paths: ${{ steps.classify.outputs.unknown-paths }}
      estimated-runner-minutes-saved: ${{ steps.classify.outputs.estimated-runner-minutes-saved }}
      packaging-needed: ${{ steps.classify.outputs.packaging-needed }}
      framing-needed: ${{ steps.classify.outputs.framing-needed }}
      heavy-needed: ${{ steps.heavy.outputs.heavy-needed }}
      viz-needed: ${{ steps.classify.outputs.viz-needed }}
      explorer-vitest-needed: ${{ steps.classify.outputs.explorer-vitest-needed }}
      explorer-paths-needed: ${{ steps.classify.outputs.explorer-paths-needed }}
      explorer-tokens-needed: ${{ steps.classify.outputs.explorer-tokens-needed }}
      site-theme-needed: ${{ steps.classify.outputs.site-theme-needed }}
      site-needed: ${{ steps.classify.outputs.site-needed }}
      unit-core: ${{ steps.units.outputs.unit-core }}
      unit-explorer: ${{ steps.units.outputs.unit-explorer }}
      unit-results-data: ${{ steps.units.outputs.unit-results-data }}
      unit-docs: ${{ steps.units.outputs.unit-docs }}
      unit-landing: ${{ steps.units.outputs.unit-landing }}
      unit-tooling: ${{ steps.units.outputs.unit-tooling }}
      code-tests-needed: ${{ steps.units.outputs.code-tests-needed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Validate TODO JSON/Git state contract
        # Bare python is intentional: this static guard is stdlib-only and
        # must run for every PR without tracker credentials or dependencies.
        run: python _project/scripts/todo_state_contract_check.py

      - name: Select release candidate
        id: release
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid event base SHA" >&2; exit 1; }
          git fetch --no-tags origin "$EVENT_BASE_SHA"
          python -I -S scripts/release_flow.py select --base-sha "$EVENT_BASE_SHA" --github-output "$GITHUB_OUTPUT"

      - name: Install uv for release checks
        if: steps.release.outputs.release-check-needed == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Check release content
        if: steps.release.outputs.release-check-needed == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release-version }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: make release-check VERSION="$RELEASE_VERSION" BASE_REF="$EVENT_BASE_SHA"

      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref || 'develop' }}:refs/remotes/origin/${{ github.base_ref || 'develop' }}"

      - name: Classify changed paths
        id: classify
        # Bare python is intentional: the classifier is stdlib-only so
        # content-only PRs do not pay a dependency-sync cost before deciding.
        run: |
          # Bind classification to the immutable pull-request event base. A
          # later develop merge may make this PR BEHIND, but must not change
          # the tree whose paths and manifest structure this run certifies.
          python scripts/path_filter_decision.py \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --json-out ci-path-decision.json \
            --lists-dir .ci-paths \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Classify merge units
        id: units
        # Bare python is intentional: stdlib-only, no dependency sync. The
        # classifier fails closed: a diff error or an unowned path runs core.
        run: |
          python scripts/ci_units.py \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --json-out ci-unit-decision.json \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload path decision
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-path-decision
          path: |
            ci-path-decision.json
            ci-unit-decision.json
          retention-days: 30

      - name: Decide heavy-tier need
        id: heavy
        # Bare python is intentional: stdlib-only, no dependency sync. The
        # event gate lives in the script (not a step `if:`): downstream jobs
        # read this output on every event, and references to a skipped
        # step's outputs do not evaluate reliably. Fail-closed: any lookup
        # error reports heavy-needed=true so the tier runs.
        run: |
          set -euo pipefail
          python scripts/heavy_tier_needed.py \
            --decision-in ci-path-decision.json \
            --event "${{ github.event_name }}" \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

  # Cross-platform TPC-H binary framing: the only pre-merge macOS/Windows
  # execution of the bundled dbgen framing guard. Pull requests run it when a
  # carve-out applies (soundness or packaging paths via the heavy-needed
  # output) or when the change touches test infrastructure or the bundled
  # binaries (the framing-needed output). Nightly retains the complete
  # three-platform matrix.
  tpch-binary-framing:
    name: TPC-H binary framing (${{ matrix.os }})
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.heavy-needed == 'true' || needs.ci-paths.outputs.framing-needed == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv sync --group dev

      - name: Verify bundled dbgen binaries emit clean framing
        run: uv run -- python -m pytest tests/unit/core/tpch/test_tpch_dbgen_framing_binaries.py -m 'unit or slow' -v

  content-guard:
    name: content-guard
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.content-guard-needed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref || 'develop' }}:refs/remotes/origin/${{ github.base_ref || 'develop' }}"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Recreate path lists
        # Bare python is intentional: the classifier is stdlib-only.
        run: |
          python scripts/path_filter_decision.py \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --json-out ci-path-decision.json \
            --lists-dir .ci-paths

      - name: Validate YAML hygiene
        shell: bash
        run: |
          if [ ! -s .ci-paths/yaml.txt ]; then
            echo "No YAML content paths changed."
            exit 0
          fi
          mapfile -t yaml_paths < .ci-paths/yaml.txt
          # The changed-path lists include deletions; a deleted file path passed
          # to check-yaml would fail the hook on a legitimate deletion-only PR
          # (mirrors the TODO-graph step's deleted-path skip below).
          existing_yaml_paths=()
          for yaml_path in "${yaml_paths[@]}"; do
            if [ -e "$yaml_path" ]; then
              existing_yaml_paths+=("$yaml_path")
            else
              echo "Skipping deleted YAML path: $yaml_path"
            fi
          done
          if [ ${#existing_yaml_paths[@]} -eq 0 ]; then
            echo "No existing YAML content paths to lint."
            exit 0
          fi
          uv run -- pre-commit run check-yaml --files "${existing_yaml_paths[@]}"

      - name: Validate artifact hygiene
        run: uv run -- python _project/scripts/artifact_hygiene_check.py --all-tracked

      - name: Validate markdown hygiene
        shell: bash
        run: |
          if [ ! -s .ci-paths/markdown.txt ]; then
            echo "No markdown content paths changed."
            exit 0
          fi
          mapfile -t markdown_paths < .ci-paths/markdown.txt
          # Skip deleted paths so a deletion-only markdown PR doesn't fail the
          # hook on a path that no longer exists (see the YAML step above).
          existing_markdown_paths=()
          for markdown_path in "${markdown_paths[@]}"; do
            if [ -e "$markdown_path" ]; then
              existing_markdown_paths+=("$markdown_path")
            else
              echo "Skipping deleted markdown path: $markdown_path"
            fi
          done
          if [ ${#existing_markdown_paths[@]} -eq 0 ]; then
            echo "No existing markdown content paths to lint."
            exit 0
          fi
          uv run -- pre-commit run markdownlint --files "${existing_markdown_paths[@]}"

      - name: Validate docs references
        shell: bash
        run: |
          if [ ! -s .ci-paths/docs.txt ]; then
            echo "No docs paths changed."
            exit 0
          fi
          make docs-validate

      - name: Validate public contract drift guard
        shell: bash
        run: |
          if [ ! -s .ci-paths/docs.txt ] && [ ! -s .ci-paths/markdown.txt ]; then
            echo "No docs or markdown paths changed."
            exit 0
          fi
          uv run -- python - <<'PY'
          from pathlib import Path

          contract = Path("docs/reference/public-contracts.md").read_text(encoding="utf-8")
          readme = Path("README.md").read_text(encoding="utf-8")

          forbidden_readme_count_claims = [
              "Twenty-Two Benchmarks",
              "SQL Platforms (",
              "DataFrame Platforms (",
          ]
          offenders = [phrase for phrase in forbidden_readme_count_claims if phrase in readme]
          if offenders:
              raise SystemExit(
                  "README.md has exact hand-maintained count claims; use registry-derived checks "
                  f"or mark them non-authoritative: {offenders}"
              )

          required_surfaces = [
              "CLI commands and documented options",
              "Top-level Python wrapper facades",
              "`benchbox.base.BaseBenchmark`",
              "`BaseBenchmark.run_with_platform`",
              "Adapter subclassing hooks and base mixins",
              "Platform registry metadata",
              "MCP tools",
              "Result JSON bundles",
              "Explorer read model and generated browser inputs",
              "Public submission validator behavior",
              "SQL compatibility rule catalog",
              "Generated compatibility docs",
              "`benchbox.experimental` namespace",
              "`_project` scripts, audits, and analysis artifacts",
              "TODO, DONE, and ADR/future-state docs",
          ]
          missing_surfaces = [surface for surface in required_surfaces if surface not in contract]
          if missing_surfaces:
              raise SystemExit(f"public-contracts.md missing required surfaces: {missing_surfaces}")

          required_statuses = [
              "`stable`",
              "`beta`",
              "`experimental`",
              "`repo_only`",
              "`deprecated`",
              "`document_only`",
          ]
          missing_statuses = [status for status in required_statuses if status not in contract]
          if missing_statuses:
              raise SystemExit(f"public-contracts.md missing support_status values: {missing_statuses}")

          from benchbox.core.benchmark_registry import list_benchmark_ids, list_loader_benchmark_ids
          from benchbox.core.platform_registry import PlatformRegistry
          from benchbox.core.results.schema import SCHEMA_VERSION

          platforms = PlatformRegistry.get_all_platform_metadata()
          sql_capable = sum(1 for item in platforms.values() if item.get("capabilities", {}).get("supports_sql"))
          dataframe_capable = sum(
              1 for item in platforms.values() if item.get("capabilities", {}).get("supports_dataframe")
          )
          dual_mode = sum(
              1
              for item in platforms.values()
              if item.get("capabilities", {}).get("supports_sql")
              and item.get("capabilities", {}).get("supports_dataframe")
          )

          source_fragments = [
              f"{len(list_benchmark_ids())} benchmark metadata entries",
              f"{len(list_loader_benchmark_ids())} loader-resolved IDs",
              f"{len(platforms)} platform metadata entries",
              f"{sql_capable} SQL-capable",
              f"{dataframe_capable} DataFrame-capable",
              f"{dual_mode} dual-mode",
              f"Current result schema version: `{SCHEMA_VERSION}`",
          ]
          missing_fragments = [fragment for fragment in source_fragments if fragment not in contract]
          if missing_fragments:
              raise SystemExit(f"public-contracts.md source-derived claims are stale: {missing_fragments}")
          PY

  skill-integrity:
    name: skill-integrity
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.skill-integrity-needed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate skill config, receipt, and tool pin
        # Stdlib-only and offline: checks skill-sync.conf shape and skill
        # selection, the committed receipt's approved source URLs, and the
        # vendored tools/skill-sync bytes against the pinned tool revision.
        run: python3 scripts/skill_sync_ci_policy.py validate --manifest skill-sync.conf

      - name: Clone skill sources to the configured checkout paths
        # The wrapper resolves every configured rev from these checkouts and
        # fails closed when one is absent, so a transient local SHA can never
        # pass: only published upstream commits survive this step.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/skill-home/Developer"
          git clone --quiet https://github.com/joeharris76/skill-sync-skills.git \
            "$RUNNER_TEMP/skill-home/Developer/skill-sync-skills"
          git clone --quiet https://github.com/joeharris76/todo-db.git \
            "$RUNNER_TEMP/skill-home/Developer/todo-db"
          git clone --quiet https://github.com/joeharris76/skill-sync.git \
            "$RUNNER_TEMP/skill-home/Developer/skill-sync"

      - name: Preview, apply, verify, and re-check the skill mirrors
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/skill-home"
          echo "--- preview (read-only) ---"
          sh tools/skill-sync preview
          echo "--- apply ---"
          sh tools/skill-sync apply
          echo "--- the committed snapshot must be untouched by apply ---"
          # Apply may only write gitignored paths (the agents mirror and the
          # curated-out blog skill). Any tracked modification means the PR's
          # committed snapshot drifted from its own config.
          test -z "$(git status --porcelain)"
          echo "--- verify the payload offline against its manifest ---"
          sh tools/skill-sync verify
          echo "--- second check must be clean ---"
          sh tools/skill-sync check

      - name: Enforce untracked mirror boundary
        run: sh scripts/check_untracked_skill_mirrors.sh

      - name: Audit instruction authority and PR commit identity
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 _project/scripts/agent_instruction_audit.py
          python3 _project/scripts/agent_instruction_audit.py --check-commit-range "$BASE_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install focused test dependencies
        run: uv sync --group dev

      - name: Run skill policy and instruction audit contracts
        run: |
          uv run -- python -m pytest \
            tests/unit/scripts/test_skill_sync_ci_policy.py \
            tests/unit/scripts/test_path_filter_decision.py \
            tests/unit/scripts/test_ci_lint_environment_boundary.py \
            tests/unit/scripts/test_agent_instruction_audit.py \
            -q

      - name: Validate tracked artifact hygiene
        run: uv run -- python _project/scripts/artifact_hygiene_check.py --all-tracked

  audit-sha:
    name: audit-sha
    needs: ci-paths
    if: ${{ contains(needs.ci-paths.outputs.changed-paths, '_project/audits/') || contains(needs.ci-paths.outputs.changed-paths, 'results-explorer/e2e/captures/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref || 'develop' }}
        run: git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Validate changed audit develop SHA stamps
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACMRT "origin/${{ github.base_ref || 'develop' }}...HEAD" \
            | grep -E '^_project/audits/.*\.md$' > /tmp/changed-audits.txt || true
          if [ ! -s /tmp/changed-audits.txt ]; then
            echo "No changed audit Markdown files to validate."
            exit 0
          fi
          ANCESTRY_REF="HEAD"
          while IFS= read -r audit_path; do
            make audit-sha-check FILE="$audit_path" AUDIT_SHA_TARGET_REF="origin/${{ github.base_ref || 'develop' }}" AUDIT_SHA_ANCESTRY_REF="$ANCESTRY_REF"
          done < /tmp/changed-audits.txt

  # Core: light tier.
  code-lint:
    name: lint
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.code-tests-needed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        run: |
          uv sync --group dev

      # --- Lint guards ------------------------------------------------
      # Every guard below is independent: `id: guard-*` (the naming
      # convention the `lint-guard-summary` step and
      # tests/system/test_ci_lint_parity.py both key off of) plus
      # `continue-on-error: true` so one guard's failure doesn't hide the
      # others' results behind a stopped job. The job as a whole still
      # fails iff any guard failed -- see the `lint-guard-summary` step,
      # which is what the `core` unit actually gates on. Setup steps
      # above (checkout/setup-python/setup-uv/install deps) are not
      # guards and carry neither `id: guard-*` nor `continue-on-error`.
      - name: Validate uv.lock revision against the PR base
        id: guard-uv-lock-revision
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: make uv-lock-revision-check

      - name: SQLGlot repro retirement check (runs repros on sqlglot upgrade)
        id: guard-sqlglot-repro-retirement
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: make sqlglot-repro-retirement-check

      - name: Stale _project/ reference check
        id: guard-project-references
        continue-on-error: true
        run: uv run -- python _project/scripts/check_project_references.py

      - name: Lint and format check with ruff
        id: guard-ruff
        continue-on-error: true
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check with ty
        id: guard-ty
        continue-on-error: true
        run: uv run ty check

      - name: Strict type check for quality-governance island
        id: guard-quality-governance-typecheck
        continue-on-error: true
        run: make quality-governance-typecheck

      - name: Validate test marker annotations
        id: guard-lint-markers
        continue-on-error: true
        run: make lint-markers

      - name: Validate import layering
        id: guard-lint-imports
        continue-on-error: true
        run: make lint-imports

      - name: Validate Windows antipatterns
        id: guard-windows-antipatterns
        continue-on-error: true
        run: make windows-antipatterns-check

      - name: Validate artifact hygiene
        id: guard-artifact-hygiene
        continue-on-error: true
        run: make artifact-hygiene

      - name: Validate agent instruction authority and efficiency
        id: guard-agent-instructions
        continue-on-error: true
        run: make agent-instructions-check

      # There is deliberately no CI counterpart to `make agent-identity-check`
      # (which ci-lint still runs locally). That target resolves identity from
      # git config, and on an ephemeral runner the config is the runner's own,
      # so the check can say nothing about what the branch carries. Supplying a
      # known-good identity to make it runnable only made it incapable of
      # failing, and a guard that cannot fail is worse than an absent one --
      # lint-guard-summary reports it as coverage. The commit-range guard below
      # is the real merge-time control: it reads the commits themselves.
      # Locally the identity IS the developer's or the agent's, so ci-lint and
      # the pre-commit hook keep enforcing it where the answer is meaningful.
      - name: Validate no agent authorship or attribution in PR commits
        id: guard-agent-commit-range
        continue-on-error: true
        run: make agent-commit-range-check

      - name: Timing policy (wall-clock allowlist)
        id: guard-timing-policy
        continue-on-error: true
        run: uv run -- python _project/scripts/timing_policy_check.py --strict

      - name: Fast lane ceiling
        id: guard-fast-lane-ceiling
        continue-on-error: true
        run: uv run -- python _project/scripts/fast_lane_ceiling_check.py --strict

      - name: Restore fast-lane develop baseline count
        # Not a guard itself (no `id: guard-*`/`continue-on-error` -- see the
        # naming-convention comment above): a cache miss here is not itself a
        # failure, but the delta guard below reports it as a blocking baseline
        # error. The key is the PR event's actual develop base SHA; a prefix
        # restore would compare the PR against an unrelated develop tip when
        # merges or baseline jobs complete out of order.
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: fast-lane-count.txt
          key: fast-lane-count-develop-${{ github.event.pull_request.base.sha }}

      - name: Fast lane ceiling delta vs develop
        # Pull requests only: in a merge group the delta is the sum of every
        # composed PR, so it would eject groups whose members each fit.
        if: github.event_name == 'pull_request'
        # Additive to guard-fast-lane-ceiling above, never a replacement: that
        # step enforces the absolute max_fast_tests ceiling unconditionally.
        # The pull-request lane requires the exact develop baseline so every
        # queued member proves its +150 per-PR delta before composition grace
        # is allowed. A missing cache fails closed instead of weakening that
        # prerequisite.
        id: guard-fast-lane-delta
        continue-on-error: true
        run: uv run -- python _project/scripts/fast_lane_ceiling_check.py --delta-check --develop-count-file fast-lane-count.txt --require-develop-baseline

      - name: UAT spec LOC table drift check
        # Mirrors the release-branch Lint gate (.github/workflows/lint.yml). The
        # develop PR path is the routine dev-flow gate, so without this a UAT
        # LOC/table doc that drifts from source could merge through a normal
        # develop PR, leaving the drift guard dependent on the local pre-commit
        # hook alone.
        id: guard-uat-loc-table
        continue-on-error: true
        run: uv run --project _project/scripts --no-sync -- python _project/scripts/uat_loc_table.py --check

      - name: Compatibility governance drift check
        id: guard-compat-docs
        continue-on-error: true
        run: make compat-docs-check

      - name: Platform manifest drift check
        id: guard-platform-manifest
        continue-on-error: true
        run: make platform-manifest-check

      - name: Oracle coverage map drift check
        id: guard-oracle-coverage-map
        continue-on-error: true
        run: make oracle-coverage-map-check

      - name: Pricing data drift check
        id: guard-pricing-data
        continue-on-error: true
        run: make pricing-data-check

      - name: Public contract drift check
        id: guard-public-contract-drift
        continue-on-error: true
        run: uv run -- python scripts/check_public_contract_drift.py

      - name: Dependency audit (no unused declarations)
        id: guard-audit-deps
        continue-on-error: true
        run: make audit-deps

      - name: Dependency inventory drift check
        id: guard-audit-raw
        continue-on-error: true
        run: make audit-raw-check

      - name: Release curation list drift check
        id: guard-release-curation
        continue-on-error: true
        run: uv run -- python scripts/check_release_curation.py

      - name: Untracked skill-mirror drift guard (cloud parity)
        # The agents mirror and the curated-out `blog` skill are deliberately
        # untracked: cloud is Claude-only and `blog` is published separately.
        # `skill-sync verify` checks payload bytes, not Git tracking state, so
        # it cannot catch these being force-added. Fail the build if any
        # become git-tracked.
        # Rationale: _project/decisions/claude-settings-cloud-ownership-2026-06-29.md
        id: guard-skill-mirror-drift
        continue-on-error: true
        run: sh scripts/check_untracked_skill_mirrors.sh

      - name: Duplicate code delta vs PR base
        # Fail only when this PR increases AST Type-2 duplicated lines vs the
        # merge-base with the PR base (not an absolute repo-wide ceiling).
        # Absolute ceiling remains `make duplicate-check` / pyproject threshold.
        id: guard-duplicate-delta
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: make duplicate-check-delta

      - name: Complexity policy and report
        # Keeps CC >=12 visible and fails stale/expired exception metadata or
        # unexcepted CC >20. Configured Ruff above remains the stricter
        # production-scope C901 gate (it fails CC >18); the mechanisms do not
        # share exceptions or silently weaken one another.
        id: guard-complexity-policy
        continue-on-error: true
        run: make complexity-check

      # --- Aggregator ---------------------------------------------------
      # Reports every guard's pass/fail in one CI cycle instead of stopping
      # at the first failure. Derives the guard set programmatically from
      # the `guard-*` id prefix (never hand-list ids here -- a guard added
      # above without the prefix silently escapes aggregation, which is
      # exactly what tests/system/test_ci_lint_parity.py now checks for).
      - name: lint-guard-summary
        id: lint-guard-summary
        if: always()
        env:
          STEPS_CONTEXT: ${{ toJSON(steps) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$STEPS_CONTEXT" > "$RUNNER_TEMP/steps_context.json"

          # FAIL CLOSED: the whole gate rests on this step's exit code, so a
          # jq parse failure or an empty guard set must fail the job -- never
          # fall through to "all passed" with zero guards inspected.
          ids=$(jq -r 'keys[] | select(startswith("guard-"))' "$RUNNER_TEMP/steps_context.json" | sort) || {
            echo "aggregator: jq failed to parse the steps context" >&2
            exit 1
          }
          if [ -z "$ids" ]; then
            echo "aggregator: no guard-* steps found in the steps context" >&2
            exit 1
          fi

          {
            echo "## Lint guard summary"
            echo
            echo "| Guard | Outcome |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for id in $ids; do
            outcome=$(jq -r --arg id "$id" '.[$id].outcome' "$RUNNER_TEMP/steps_context.json")
            if [ "$outcome" = "success" ]; then
              echo "| $id | ✅ success |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $id | ⚠️ $outcome |" >> "$GITHUB_STEP_SUMMARY"
              echo "FAILED: $id ($outcome)"
              failed=1
            fi
          done

          if [ "$failed" -eq 1 ]; then
            echo "One or more lint guards failed -- see the table above and the" \
              "per-step logs for details." >&2
            exit 1
          fi
          echo "All lint guards passed."

  code-test:
    name: test (ubuntu-latest, 3.12)
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.code-tests-needed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run cross-surface mutation target drift guard
        run: |
          uv run -- python -m pytest \
            tests/integration/test_cross_surface_mutation_sensitivity.py::test_targets_cover_every_enforced_gate \
            -m "slow" -n 0 --tb=short -q

      - name: Run cross-surface GATES Make/CI pinning guard
        run: |
          # Medium-marked ratchet, so the fast-lane selection below skips it;
          # invoke the node explicitly so a new GATES entry without its Make
          # target + correctness-gate CI step fails required CI.
          uv run -- python -m pytest \
            tests/unit/test_standardized_test_commands.py::TestMakefileCommands::test_cross_surface_gates_are_pinned_in_make_and_ci \
            -m "medium" -n 0 --tb=short -q

      - name: Run promoted h2odb mutation-catch reproducer (#901)
        run: |
          # #901's mutation-sensitivity catch assertions are slow-marked, so the
          # fast-lane selection below skips them; invoke the h2odb cell (the gate
          # whose scale fidelity #901 fixed: gate.scale_factor=0.01 matching
          # production) explicitly so a regression in its mutation catch fails
          # required CI instead of only at the main-release boundary (test.yml).
          # Bounded: the single load-bearing gate cell, not the full slow matrix.
          uv run -- python -m pytest \
            tests/integration/test_cross_surface_mutation_sensitivity.py \
            -m "slow" -n 0 -k "h2odb" --tb=short -q

      - name: Run promoted plan-capture-phase reproducers (#909)
        run: |
          # #909's connection-fencing and plan-identity reproducers are
          # medium-marked and otherwise run only in test.yml; invoke them here so
          # they execute in the required develop-PR gate, not one ring out.
          uv run -- python -m pytest \
            tests/integration/test_plan_capture_phase.py \
            -m "medium" -n 0 --tb=short -q

      - name: Run promoted TPC-DS power-test drain-before-commit reproducer
        run: |
          # This file is 100% slow-marked and otherwise never runs in ANY CI
          # workflow (make test-slow/test-stress are invoked by no workflow).
          # The TPC-H side of this exact fix (#1137/#1144: draining a raw
          # DB-API cursor must happen BEFORE commit(), some drivers reject/
          # invalidate commit() on unread SELECT results) is already required
          # via the fast-marked test_tpc_power_tests.py, but TPC-DS has a
          # separate, parallel implementation (benchbox/core/tpcds/power_test.py
          # _execute_one_query - the only call site TPCDSPowerTest.run() uses)
          # with no coverage anywhere. Bounded: the single reproducer node.
          uv run -- python -m pytest \
            tests/integration/test_tpcds_power_test.py \
            -m "slow" -n 0 -k "test_execute_one_query_drains_raw_cursor_before_commit" --tb=short -q

      - name: Run DuckLake in-process adapter integration tests
        run: |
          # Exercise cursor catalog scoping, ATTACH, catalog reuse, SQLite
          # catalog operation, and representative write primitives. The
          # service-dependent PostgreSQL and S3 cases remain live-only.
          # Bounded: one file, 8 tests at SF=0.01.
          uv run -- python -m pytest \
            tests/integration/test_ducklake_integration.py \
            -m "slow and not live_integration" -n 0 --tb=short -q

      - name: Run promoted DuckDB FK tuning load-ordering reproducers
        run: |
          # tuning-fk-load-ordering-fix-20260716: TPCHBenchmark.get_table_loading_order
          # derives a FK-topological load order so a tuned run with
          # foreign_keys.enabled really loads under real FK enforcement; without
          # it, DataLoader falls back to alphabetical order, which zeros out
          # every FK-dependent table under DuckDB constraint enforcement. This
          # file is 100% slow-marked and otherwise never runs in ANY CI
          # workflow. Bounded: one small (SF=0.01) file, 3 tests, ~5s.
          uv run -- python -m pytest \
            tests/integration/tuning/test_duckdb_fk_load_ordering.py \
            -m "slow" -n 0 --tb=short -q

      - name: Run promoted TPC-H power/throughput boundary-query (w0 defect) reproducers
        run: |
          # The w0 defect: with a custom (non-reference) seed at SF=1.0, TPC-H's
          # answer-set-boundary queries (Q11/16/18/20) came back falsely FAILED.
          # The shared validator exclusion is already unit-tested in the
          # required fast lane (test_validation_engine.py), but the
          # set_reference_seed_context() WIRING at each call site
          # (benchbox/core/tpch/power_test.py and .../throughput_test.py - two
          # separate production code paths) is not: breaking either site's
          # wiring is invisible to the unit test and only caught here. Both
          # files are 100% slow-marked and otherwise never run in ANY CI
          # workflow. Bounded: the single boundary_query reproducer node(s) in
          # each file, not the surrounding slow suites.
          uv run -- python -m pytest \
            tests/integration/test_tpch_power_test.py \
            -m "slow" -n 0 -k "boundary_query" --tb=short -q
          uv run -- python -m pytest \
            tests/integration/test_tpch_throughput_test.py \
            -m "slow" -n 0 -k "boundary_query" --tb=short -q

      - name: Run fast tests
        run: |
          # -p pytest_cov re-enables coverage plugin (disabled by default in pytest.ini)
          uv run -- python -m pytest tests -m "fast and not (slow or stress or resource_heavy or live_integration)" --tb=short --timeout=120 -p pytest_cov --cov=benchbox --cov-report=xml --cov-report=term-missing --cov-fail-under=70

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false  # Don't fail CI if Codecov upload fails (token may not be configured)
          token: ${{ secrets.CODECOV_TOKEN }}

  # Core: heavy tier (merge queue, plus soundness/packaging carve-outs from heavy_tier_needed.py).
  medium-collect:
    name: medium-collect
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.heavy-needed == 'true' && needs.ci-paths.outputs.unit-core == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Full history: the canary live-tree tests diff historical
          # regression commits, which a shallow checkout cannot resolve.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Collect the complete medium tier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p t2-artifacts
          BENCHBOX_TEST_TIER=t2 uv run -- python -m pytest --collect-only -q -n 0 \
            -m "medium and not (slow or stress or resource_heavy or live_integration)" \
            > t2-artifacts/medium-collect.txt
          count=$(grep -Eo '^[0-9]+/[0-9]+ tests collected' t2-artifacts/medium-collect.txt | tail -1 | cut -d/ -f1)
          test -n "$count"
          uv run -- python scripts/release_canary_sharding.py collect \
            --input t2-artifacts/medium-collect.txt \
            --nodeids-output t2-artifacts/medium-nodeids.txt \
            --summary-output t2-artifacts/medium-collection.json \
            --expected-count "$count" --shard-count 4 \
            --workflow ci.yml --job medium-collect \
            --marker-expression "medium and not (slow or stress or resource_heavy or live_integration)" \
            --checked-ref "${{ github.ref }}" --checked-sha "${{ github.sha }}"

      - name: Upload medium collection evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: t2-medium-nodeids-${{ github.sha }}
          path: t2-artifacts/
          if-no-files-found: error
          retention-days: 30

  medium-test:
    name: medium-test (shard ${{ matrix.shard_index }})
    needs: [ci-paths, medium-collect]
    if: ${{ !cancelled() && needs.medium-collect.result == 'success' && needs.ci-paths.outputs.heavy-needed == 'true' && needs.ci-paths.outputs.unit-core == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3]
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Full history: the canary live-tree tests diff historical
          # regression commits, which a shallow checkout cannot resolve.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Download medium collection evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: t2-medium-nodeids-${{ github.sha }}
          path: t2-artifacts

      - name: Partition the complete medium tier
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
        run: |
          uv run -- python scripts/release_canary_sharding.py shard \
            --input t2-artifacts/medium-nodeids.txt \
            --nodeids-output "t2-artifacts/shard-${SHARD_INDEX}-nodeids.txt" \
            --summary-output "t2-artifacts/shard-${SHARD_INDEX}-summary.json" \
            --shard-index "$SHARD_INDEX" --shard-count 4 \
            --workflow ci.yml --job medium-test \
            --marker-expression "medium and not (slow or stress or resource_heavy or live_integration)" \
            --collection-summary t2-artifacts/medium-collection.json --checked-sha "${{ github.sha }}"

      - name: Run medium speed tier
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
        run: |
          set -euo pipefail
          test -s "t2-artifacts/shard-${SHARD_INDEX}-nodeids.txt"
          mapfile -t node_ids < "t2-artifacts/shard-${SHARD_INDEX}-nodeids.txt"
          sample_resources() {
            while sleep 30; do
              echo "[resources $(date -u +%H:%M:%S)] $(free -m | awk '/Mem:/ {print "used_mb=" $3 " available_mb=" $7}') load=$(cut -d' ' -f1-3 /proc/loadavg)"
              ps -eo pid,rss,etimes,comm --sort=-rss | awk 'NR <= 4 {print "  " $0}'
            done
          }
          sample_resources &
          sampler=$!
          trap 'pkill -P "${sampler}" 2>/dev/null || true; kill "${sampler}" 2>/dev/null || true' EXIT
          BENCHBOX_TEST_TIER=t2 uv run -- python -m pytest \
            -m "medium and not (slow or stress or resource_heavy or live_integration)" \
            --tb=short --timeout=60 -n 5 --durations=25 \
            -p scripts.pytest_shard_evidence \
            --assigned-nodeids "t2-artifacts/shard-${SHARD_INDEX}-nodeids.txt" \
            --shard-evidence "t2-artifacts/shard-${SHARD_INDEX}-execution.json" \
            --checked-sha "${{ github.sha }}" "${node_ids[@]}"

      - name: Record kernel memory events for the medium shard
        if: always()
        shell: bash
        run: |
          free -m
          sudo dmesg -T 2>/dev/null | grep -iE 'out of memory|oom-kill|killed process' | tail -20 || true

      - name: Upload medium shard evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: t2-medium-shard-${{ matrix.shard_index }}-${{ github.sha }}
          path: t2-artifacts/
          if-no-files-found: error
          retention-days: 30

