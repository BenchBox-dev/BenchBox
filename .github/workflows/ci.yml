        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run the required local-engine cases
        run: make test-required-local-cases

  plan-capture-gate:
    name: plan-capture-gate
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.heavy-needed == 'true' && needs.ci-paths.outputs.unit-core == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run in-process plan-capture gate
        run: make plan-capture-gate

  datafusion-integration:
    name: datafusion-integration
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.heavy-needed == 'true' && needs.ci-paths.outputs.unit-core == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Non-blocking: this is the THIRD-engine equivalence SAMPLE, not a gate.
    # The DuckDB SQL gate (correctness-gate job) stays the hard blocker.
    # DataFusion is in-process (no service container), and its execution gaps
    # DIFFER from Postgres's, so this samples translation-induced divergence a
    # third engine over. continue-on-error keeps it a sample, not a blocker.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        run: uv sync --group dev

      # Third-engine equivalence SAMPLE plus the DataFusion .tbl trailing-delimiter
      # load regression. Both canonical and variants are translated to the
      # datafusion dialect and compared on the same in-process session (shared
      # translation cancels out); DATAFUSION_TPCHAVOC_SKIPS variants are excluded,
      # never marked equivalent. Both files are slow-marked, so -m "slow" selects
      # them (overriding the default fast-lane deselect).
      - name: Run TPC-Havoc DataFusion variant-equivalence sample and .tbl load regression
        run: |
          uv run -- python -m pytest \
            tests/integration/platforms/test_tpchavoc_datafusion_equivalence.py \
            tests/integration/platforms/test_datafusion_tbl_load.py \
            -m "slow" -n 0 --tb=short -v

  package-smoke:
    name: package-smoke
    needs: ci-paths
    # Path-filtered: only runs when packaging metadata changed (pyproject.toml,
    # MANIFEST.in, setup.py/cfg, benchbox/__init__.py, uv.lock). Steps below are
    # copied from nightly.yml's test-package job (ubuntu/3.12 leg only - the
    # full ubuntu+windows matrix stays nightly-only, see nightly.yml:261-311).
    if: ${{ needs.ci-paths.outputs.packaging-needed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Build package
        run: |
          uv build

      - name: Test package installation
        shell: bash
        run: |
          set -euo pipefail
          wheel_count=$(find dist -maxdepth 1 -name '*.whl' | wc -l | tr -d '[:space:]')
          if [ "$wheel_count" != "1" ]; then
            echo "::error::Expected exactly one wheel, found $wheel_count"
            find dist -maxdepth 1 -type f -print
            exit 1
          fi
          wheel=$(find "$PWD/dist" -maxdepth 1 -name '*.whl' -print -quit)
          tmpdir=$(mktemp -d)
          cd "$tmpdir"
          # Minimal-surface gate: a clean core install must import benchbox AND
          # must not pull pandas (optional engine/DataFrame dep). This is the
          # contract whose absence let v0.3.0 ship a broken clean install.
          uv run --isolated --no-project --with "$wheel" -- python -c "import importlib.util; import benchbox; assert importlib.util.find_spec('pandas') is None, 'core install must not pull pandas'; print('Package installation successful (minimal import surface)')"
          uv run --isolated --no-project --with "$wheel" -- benchbox --help

  dependency-audit:
    name: dependency-audit
    needs: ci-paths
    # Path-filtered on the same packaging group as package-smoke (pyproject.toml
    # / uv.lock changes are the common case that shifts the dependency graph).
    if: ${{ needs.ci-paths.outputs.packaging-needed == 'true' }}
    runs-on: ubuntu-latest
    env:
      # Comma-separated GHSA/CVE IDs for temporarily accepted false positives.
      # Keep empty unless triage is documented in the TODO item.
      # PYSEC-2026-3696..3699 and PYSEC-2026-3923 (sqlparse):
      # firebolt-sdk==1.18.5 requires sqlparse<0.6.0.
      # PYSEC-2026-3447 (setuptools MANIFEST.in exclusion bypass in sdist
      # builds, macOS-only): torch==2.11.0 requires setuptools<82 while the
      # fix needs >=83.0.0, so the lock cannot take the fix. Accepted because
      # the flaw only affects building sdists from projects with a malicious
      # MANIFEST.in on macOS; BenchBox builds its own project.
      PIP_AUDIT_IGNORE_VULNS: "PYSEC-2026-3696,PYSEC-2026-3697,PYSEC-2026-3698,PYSEC-2026-3699,PYSEC-2026-3923,PYSEC-2026-3447"
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run security audit
        run: |
          # `uvx pip-audit` runs pip-audit in its own isolated tool environment,
          # auditing pip-audit's dependencies, not BenchBox's. `uv run --with` layers
          # pip-audit onto the project environment `uv sync --group dev` just built,
          # so the dependency graph actually audited is the one pyproject.toml/uv.lock
          # produce.
          if [ -n "${PIP_AUDIT_IGNORE_VULNS}" ]; then
            IGNORE_ARGS=$(printf '%s' "${PIP_AUDIT_IGNORE_VULNS}" | tr ',' '\n' | sed '/^$/d;s/^[[:space:]]*//;s/[[:space:]]*$//;/^$/d;s/^/--ignore-vuln /' | tr '\n' ' ')
            uv run --with pip-audit -- pip-audit ${IGNORE_ARGS}
          else
            uv run --with pip-audit -- pip-audit
          fi

  # Explorer.
  explorer-tokens:
    name: explorer-tokens
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.explorer-paths-needed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref || 'develop' }}:refs/remotes/origin/${{ github.base_ref || 'develop' }}"

      - name: Run explorer token scan
        # Bare python is intentional: the scan is stdlib-only so this gate
        # does not pay a dependency-sync cost before deciding.
        run: make lint-explorer-tokens

  explorer-vitest:
    name: explorer-vitest
    needs: ci-paths
    # The Explorer contract includes frontend source/tests, package metadata,
    # read-model/build-contract code, curated inputs, and the fixture/publish
    # scripts. The path-filter group keeps unrelated Python-only PRs from
    # installing Node while ensuring every input Vitest can exercise is gated.
    if: ${{ needs.ci-paths.outputs.explorer-vitest-needed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: results-explorer/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Install explorer dependencies
        run: npm ci
        working-directory: results-explorer

      - name: Run Explorer Vitest suite
        run: npm test -- --run
        working-directory: results-explorer

  parity-check:
    name: parity-check
    needs: ci-paths
    # Path-filtered on results-explorer/viz source changes (see
    # tracker item `parity-check-develop-ring`). `make parity-check`
    # is Python-only (no npm/vitest install), measured at well under a second
    # locally, so it is cheap enough to block develop PRs.
    #
    # PROMOTED TO THE REQUIRED LANE 2026-07-05 (parity-check-promotion): the
    # job is now observed by the explorer unit via PARITY_CHECK_RESULT with
    # the package-smoke skipped-counts-as-pass rule, and continue-on-error is
    # dropped. Both promotion criteria met: (1) one green run on a real
    # GitHub runner (PR #973, run 28742318825 job 85227174150 - the runner's
    # `make parity-check` printed "fixtures match Python source"); (2) the
    # geomean_ms 2e-13 last-bit drift seen locally did NOT reproduce on the
    # runner, so it is a local libm transcendental-precision artifact, not a
    # fixture error - exact comparison is kept and the drift is documented in
    # tests/parity/README.md. Path-filtering stays: a non-viz PR skips this
    # job and passes via skipped-counts-as-pass.
    if: ${{ needs.ci-paths.outputs.viz-needed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Verify parity fixtures match Python source
        run: make parity-check

  explorer-e2e:
    needs: ci-paths
    name: Chromium (full suite, blocking)
    if: ${{ needs.ci-paths.outputs.unit-explorer == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: results-explorer/package-lock.json

      - name: Install explorer dependencies
        run: npm ci
        working-directory: results-explorer

      - name: Typecheck explorer e2e harness
        run: npm run typecheck:e2e
        working-directory: results-explorer

      - name: Audit frontend dependencies
        run: npm run audit:high
        working-directory: results-explorer

      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('results-explorer/package-lock.json') }}

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium
        working-directory: results-explorer

      - name: Run Chromium suite
        # Shared deterministic entrypoint: regenerate fixtures, rebuild dist,
        # then run the blocking Chromium project against the real server.
        run: npm run test:e2e:chromium
        working-directory: results-explorer

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-report-chromium
          path: |
            results-explorer/playwright-report
            results-explorer/test-results
          if-no-files-found: ignore
          retention-days: 3

  # Landing.
  site-theme-tokens:
    name: site-theme-tokens
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.site-theme-needed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref || 'develop' }}:refs/remotes/origin/${{ github.base_ref || 'develop' }}"

      - name: Run public site theme token scan
        # Bare python is intentional: the scan is stdlib-only so this gate
        # does not pay a dependency-sync cost before deciding.
        run: make lint-site-theme-tokens

  # Results data.
  results-data-check:
    name: results-data-check
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.unit-results-data == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Install dependencies
        run: uv sync --group dev
      - name: Corpus inventory is current
        run: uv run -- python scripts/generate_corpus_inventory.py --check
      - name: Corpus validation
        run: uv run -- python results-data/validate_corpus.py
      - name: Submission validator stays in sync
        # Judges this change, not external branch state: fail only when the
        # change touches the validator or its checker. Standing drift against
        # published-results is reported by submission-validator-drift-check.yml
        # (weekly and on develop pushes), so it cannot block unrelated changes.
        if: ${{ contains(needs.ci-paths.outputs.changed-paths, '.github/workflows/validate-submission.yml') || contains(needs.ci-paths.outputs.changed-paths, 'scripts/check_submission_validator_sync.py') }}
        run: |
          git fetch --no-tags --depth=1 origin published-results
          git show FETCH_HEAD:.github/workflows/validate-submission.yml \
            > /tmp/published-validate-submission.yml
          uv run -- python scripts/check_submission_validator_sync.py \
            --develop .github/workflows/validate-submission.yml \
            --published /tmp/published-validate-submission.yml
      - name: Corpus, submission, and explorer-pipeline contract tests
        run: |
          uv run -- python -m pytest -p no:cacheprovider -o addopts='' -q \
            tests/unit/scripts/test_generate_corpus_inventory.py \
            tests/unit/scripts/test_validate_submission.py \
            tests/unit/scripts/explorer_pipeline \
            tests/unit/workflows/test_corpus_trust_boundary.py \
            tests/unit/publication \
            tests/unit/explorer

  # Docs and landing: the public-site build and exact-base visual comparison.
  visual-inputs:
    needs: ci-paths
    name: Public-site visual inputs
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
      render_changed: ${{ steps.paths.outputs.render_changed }}
      source_sha: ${{ steps.paths.outputs.source_sha }}
      base_sha: ${{ steps.paths.outputs.base_sha }}
      baseline_candidates: ${{ steps.paths.outputs.baseline_candidates }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify site inputs and validate recovery source
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RECOVERY_SOURCE_SHA: ${{ inputs.baseline_source_sha }}
          CURRENT_SHA: ${{ github.sha }}
          CURRENT_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$CURRENT_SHA"
          if [ -n "$RECOVERY_SOURCE_SHA" ]; then
            if [ "$EVENT_NAME" != workflow_dispatch ] || [ "$CURRENT_REF" != refs/heads/develop ] || [[ ! "$RECOVERY_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Recovery requires a full lowercase SHA dispatched on develop."
              exit 1
            fi
            git fetch origin develop
            git merge-base --is-ancestor "$RECOVERY_SOURCE_SHA" origin/develop || {
              echo "::error::Recovery source must be an ancestor of protected develop."
              exit 1
            }
            SOURCE_SHA="$RECOVERY_SOURCE_SHA"
          fi
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          BASE_SHA="$PR_BASE_SHA"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" != pull_request ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'render_changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Missing exact PR base SHA."
            exit 1
          fi
          git cat-file -e "$BASE_SHA^{commit}" || {
            echo "::error::Exact base commit is unavailable."
            exit 1
          }
          # Preserve every former pull_request path-filter input. A change to
          # this list must explain which rendered dependency is being removed.
          # The build runs uv sync and npm ci, so the lockfiles pin the
          # rendered output as much as any source file. uv.lock and
          # results-explorer/package-lock.json must stay in this list.
          SITE_PATHS=(
            benchbox/ docs/ examples/ landing/ website/
            _project/scripts/explorer_pipeline/
            _project/scripts/explorer_publish.py
            _project/scripts/results_explorer_snapshot_invariants.py
            results-data/ results-explorer/ scripts/
            .github/workflows/ci.yml .github/workflows/docs.yml Makefile README.md pyproject.toml uv.lock
          )
          # The build (Sphinx warnings-as-errors, autodoc) keeps the broad list
          # above. The visual comparison captures only the routes below, so it
          # and the baseline ancestor walk use the narrow rendered-input list.
          # Keep this a subset of SITE_PATHS.
          RENDER_PATHS=(
            docs/ landing/ examples/ results-data/ results-explorer/ website/
            _project/scripts/explorer_pipeline/
            _project/scripts/explorer_publish.py
            _project/scripts/results_explorer_snapshot_invariants.py
            scripts/assemble_public_site.py scripts/generate_landing_quickstarts.py
            scripts/generate_query_docs.py scripts/generate_compat_docs.py
            benchbox/__init__.py benchbox/cli/ benchbox/core/platform_registry.py
            benchbox/core/benchmark_registry.py benchbox/platforms/manifest.py
            .github/workflows/ci.yml .github/workflows/docs.yml README.md pyproject.toml uv.lock
          )
          CHANGED_PATHS=$(git diff --name-only "$BASE_SHA"...HEAD -- "${SITE_PATHS[@]}")
          if [ -z "$CHANGED_PATHS" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
          RENDER_CHANGED_PATHS=$(git diff --name-only "$BASE_SHA"...HEAD -- "${RENDER_PATHS[@]}")
          if [ -z "$RENDER_CHANGED_PATHS" ]; then
            echo 'render_changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'render_changed=true' >> "$GITHUB_OUTPUT"
          fi
          # Baselines bound to the exact base come first. A first-parent
          # ancestor is also a valid baseline source when every public-site
          # input is byte-identical to the base, because it renders the same
          # site; this is the premise that lets unchanged trees skip the gate.
          # The walk stops at the first ancestor whose site inputs differ, so a
          # differently rendered tree is never used. This covers a base whose
          # predecessor changed no site inputs and therefore published nothing.
          CANDIDATES="$BASE_SHA"
          ANCESTORS=$(git rev-list --first-parent --max-count=25 "$BASE_SHA^" 2>/dev/null || true)
          for ANCESTOR in $ANCESTORS; do
            git diff --quiet "$ANCESTOR" "$BASE_SHA" -- "${RENDER_PATHS[@]}" || break
            CANDIDATES="$CANDIDATES $ANCESTOR"
          done
          echo "baseline_candidates=$CANDIDATES" >> "$GITHUB_OUTPUT"

  docs-build:
    needs: visual-inputs
    if: needs.visual-inputs.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.visual-inputs.outputs.source_sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Cache Sphinx build artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            docs/_build
          key: ${{ runner.os }}-sphinx-${{ hashFiles('docs/**', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-sphinx-

      - name: Build documentation
        # -W turns every Sphinx warning into a failure, including unknown
        # :doc: targets, so a broken cross-reference fails the docs unit
        # instead of shipping. --keep-going still reports every warning.
        run: |
          cd docs
          uv run sphinx-build -b html -W --keep-going . _build/html

      # --- Results Explorer ---
      # Steps gate on package.json as a sentinel so the workflow degrades
      # gracefully if the explorer directory is ever removed or renamed.
      # The curated release retains results-explorer/, results-data/, and the
      # three publication helpers under _project/scripts/. A release that
      # includes the application must carry the complete publication input set.
      - name: Validate results-explorer lockfile
        if: hashFiles('results-explorer/package.json') != ''
        run: |
          test -f results-explorer/package-lock.json || {
            echo "results-explorer/package-lock.json is required for npm ci" >&2
            exit 1
          }

      - name: Set up Node.js
        if: hashFiles('results-explorer/package.json') != ''
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: results-explorer/package-lock.json

      - name: Install results-explorer dependencies
        if: hashFiles('results-explorer/package.json') != ''
        run: npm ci
        working-directory: results-explorer

      - name: Verify curated Explorer publication inputs
        if: hashFiles('results-explorer/package.json') != ''
        run: |
          test -d results-data/bundles
          test -d _project/scripts/explorer_pipeline
          test -f _project/scripts/explorer_publish.py
          test -f _project/scripts/results_explorer_snapshot_invariants.py

      - name: Typecheck results-explorer
        if: hashFiles('results-explorer/package.json') != ''
        run: npm run typecheck
        working-directory: results-explorer

      - name: Build explorer data (static pipeline)
        if: hashFiles('results-explorer/package.json') != ''
        run: uv run -- python _project/scripts/explorer_publish.py build --data-dir results-data/ --output results-explorer/public/data/

      # Gate the built read model before it is bundled into the deployed site.
      - name: Validate explorer snapshot invariants
        if: hashFiles('results-explorer/package.json') != ''
        run: |
          test -s results-explorer/public/data/results.duckdb
          uv run -- python _project/scripts/results_explorer_snapshot_invariants.py results-explorer/public/data/results.duckdb

      - name: Build results-explorer
        if: hashFiles('results-explorer/package.json') != ''
        run: npm run build
        working-directory: results-explorer

      - name: Assemble public site
        run: uv run -- python scripts/assemble_public_site.py --site-dir site

      - name: Scan assembled site for privacy leaks
        run: uv run python scripts/publication/check_artifact_privacy.py site

      - name: Upload HTML artifacts
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          include-hidden-files: true

      # The visual job consumes the exact assembled tree without rebuilding it.
      # This is a short-lived transport artifact, not a publication baseline.
      - name: Upload assembled site for visual acceptance
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: public-site-assembled-${{ github.run_id }}
          path: site
          retention-days: 3

  public-site-visual-regression:
    name: Public-site visual regression
    if: ${{ needs.visual-inputs.outputs.render_changed == 'true' && github.event_name == 'pull_request' }}
    needs: [visual-inputs, docs-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.visual-inputs.outputs.source_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: results-explorer/package-lock.json

      - name: Download assembled site
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: public-site-assembled-${{ github.run_id }}
          path: site

      - name: Install explorer dependencies
        run: npm ci
        working-directory: results-explorer

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: results-explorer

      - name: Capture public site
        env:
          E2E_PAGES_SHAPED: "1"
          E2E_SITE_DIR: ${{ github.workspace }}/site
          PUBLIC_SITE_VISUAL_PHASE: capture
          PUBLIC_SITE_VISUAL_OUTPUT: ${{ runner.temp }}/public-site-visual-current
          PUBLIC_SITE_VISUAL_SOURCE_SHA: ${{ needs.visual-inputs.outputs.source_sha }}
        run: npm run test:e2e:public-site
        working-directory: results-explorer

      # When no baseline is bound to the exact base, the lookup also accepts the
      # nearest ancestor whose site inputs are byte-identical to the base.
      - name: Download visual baseline for base or site-equivalent ancestor
        id: baseline
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLIC_SITE_VISUAL_BASE_SHA: ${{ needs.visual-inputs.outputs.base_sha }}
          PUBLIC_SITE_VISUAL_BASELINE_CANDIDATES: ${{ needs.visual-inputs.outputs.baseline_candidates }}
          PUBLIC_SITE_VISUAL_BASELINE: ${{ runner.temp }}/public-site-visual-baseline
        run: node scripts/download-public-site-visual-baseline.mjs
        working-directory: results-explorer

      - name: Compare public site with exact base
        if: github.event_name == 'pull_request'
        env:
          E2E_PAGES_SHAPED: "1"
          E2E_SITE_DIR: ${{ github.workspace }}/site
          PUBLIC_SITE_VISUAL_PHASE: compare
          PUBLIC_SITE_VISUAL_OUTPUT: ${{ runner.temp }}/public-site-visual-current
          PUBLIC_SITE_VISUAL_BASELINE: ${{ runner.temp }}/public-site-visual-baseline
          PUBLIC_SITE_VISUAL_BASE_SHA: ${{ steps.baseline.outputs.baseline_sha }}
          PUBLIC_SITE_VISUAL_REQUIRE_BASELINE: "1"
          PUBLIC_SITE_VISUAL_SOURCE_SHA: ${{ needs.visual-inputs.outputs.source_sha }}
          PR_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
          APPROVED_HEAD_SHA: ${{ github.event_name == 'pull_request' && vars.APPROVED_HEAD_SHA || '' }}
          APPROVAL_REASON: ${{ github.event_name == 'pull_request' && vars.APPROVAL_REASON || '' }}
        run: npm run test:e2e:public-site
        working-directory: results-explorer

      - name: Upload protected-develop visual baseline
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: public-site-visual-baseline-${{ needs.visual-inputs.outputs.source_sha }}
          path: ${{ runner.temp }}/public-site-visual-current
          retention-days: 30

      - name: Upload visual diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: public-site-visual-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/public-site-visual-current
            results-explorer/test-results
            results-explorer/playwright-report
          if-no-files-found: ignore
          retention-days: 3

  site-build:
    name: site-build
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.site-needed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            results-explorer/package-lock.json
            website/package-lock.json

      - name: Install results-explorer dependencies
        run: npm ci
        working-directory: results-explorer

      - name: Build explorer data
        run: uv run -- python _project/scripts/explorer_publish.py build --data-dir results-data/ --output results-explorer/public/data/

      - name: Build results-explorer
        run: npm run build
        working-directory: results-explorer

      - name: Install website dependencies
        run: npm ci
        working-directory: website

      - name: Typecheck, audit and build website
        run: make site-check site-build

      - name: Scan website output for privacy leaks
        run: uv run python scripts/publication/check_artifact_privacy.py website/dist

  example-validation:
    needs: visual-inputs
    if: needs.visual-inputs.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Validate example file references
        run: uv run python scripts/validate_example_references.py

      - name: Check example file syntax
        run: uv run python scripts/check_example_syntax.py

      - name: Validate visualization screenshot sync
        run: uv run python scripts/validate_visualization_images.py

      - name: Check /prompts/ catalog is fresh
        # Fails if landing/prompts/catalog.generated.js is stale or invalid.
        # Must use the main project env (not --project _project/scripts) so
        # benchbox is importable; see landing-prompts-catalog-generator
        # decision and anti_patterns.
        run: uv run -- python scripts/generate_landing_quickstarts.py --check

      - name: Check for unsafe patch() string paths in tests
        run: uv run python scripts/check_patch_safety.py

  spellcheck:
    needs: visual-inputs
    if: needs.visual-inputs.outputs.changed == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Run codespell
        uses: codespell-project/actions-codespell@e3258cca84ce02b0bb36a3d41f2c18f719a0cc1a # v2.4.3
        with:
          ignore_words_file: .codespell-ignore.txt
          skip: "*.pyc,_build,*.json,*.lock,*.svg,*.min.js,*.min.css,_binaries,*.tpl,*.dst,*.tbl,_sources,benchmark_runs,*.dat,*.pdf,_project,_blog,htmlcov,.venv"

  # Unit result: core. Required by the merge ruleset; reports on every event and passes when untouched.
  core:
    name: core
    needs: [ci-paths, code-lint, code-test, medium-collect, medium-test, correctness-gate, required-local-cases, plan-capture-gate, tpch-binary-framing, datafusion-integration, package-smoke, dependency-audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the result helper
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/ci_unit_result.py
            scripts/release_canary_sharding.py
          sparse-checkout-cone-mode: false

      - name: Download complete medium shard evidence
        if: needs.ci-paths.outputs.heavy-needed == 'true' && needs.ci-paths.outputs.unit-core == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: t2-medium-*-${{ github.sha }}
          path: t2-evidence
          merge-multiple: false

      - name: Verify complete medium shard coverage
        if: needs.ci-paths.outputs.heavy-needed == 'true' && needs.ci-paths.outputs.unit-core == 'true'
        run: python scripts/release_canary_sharding.py verify-medium --artifacts t2-evidence --checked-sha "${{ github.sha }}"

      - name: Aggregate core result
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          python scripts/ci_unit_result.py \
            --unit core \
            --needs "$NEEDS_JSON" \
            --always ci-paths \
            --expect code-lint=${{ needs.ci-paths.outputs.code-tests-needed == 'true' }} \
            --expect code-test=${{ needs.ci-paths.outputs.code-tests-needed == 'true' }} \
            --expect medium-collect=${{ needs.ci-paths.outputs.heavy-needed == 'true' && needs.ci-paths.outputs.unit-core == 'true' }} \
            --expect medium-test=${{ needs.ci-paths.outputs.heavy-needed == 'true' && needs.ci-paths.outputs.unit-core == 'true' }} \
            --expect correctness-gate=${{ needs.ci-paths.outputs.heavy-needed == 'true' && needs.ci-paths.outputs.unit-core == 'true' }} \
            --expect required-local-cases=${{ needs.ci-paths.outputs.heavy-needed == 'true' && needs.ci-paths.outputs.unit-core == 'true' }} \
            --expect plan-capture-gate=${{ needs.ci-paths.outputs.heavy-needed == 'true' && needs.ci-paths.outputs.unit-core == 'true' }} \
            --expect tpch-binary-framing=${{ needs.ci-paths.outputs.heavy-needed == 'true' || needs.ci-paths.outputs.framing-needed == 'true' }} \
            --expect datafusion-integration=${{ needs.ci-paths.outputs.heavy-needed == 'true' && needs.ci-paths.outputs.unit-core == 'true' }} \
            --expect package-smoke=${{ needs.ci-paths.outputs.packaging-needed == 'true' }} \
            --expect dependency-audit=${{ needs.ci-paths.outputs.packaging-needed == 'true' }}

  # Unit result: explorer.
  explorer:
    name: explorer
    needs: [ci-paths, explorer-tokens, explorer-vitest, parity-check, explorer-e2e, visual-inputs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the result helper
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/ci_unit_result.py
          sparse-checkout-cone-mode: false

      - name: Aggregate explorer result
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          python scripts/ci_unit_result.py \
            --unit explorer \
            --needs "$NEEDS_JSON" \
            --always ci-paths \
            --expect explorer-tokens=${{ needs.ci-paths.outputs.explorer-paths-needed == 'true' }} \
            --expect explorer-vitest=${{ needs.ci-paths.outputs.explorer-vitest-needed == 'true' }} \
            --expect parity-check=${{ needs.ci-paths.outputs.viz-needed == 'true' }} \
            --expect explorer-e2e=${{ needs.ci-paths.outputs.unit-explorer == 'true' }} \
            --expect visual-inputs=${{ true }}

  # Unit result: results-data.
  results-data:
    name: results-data
    needs: [ci-paths, results-data-check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the result helper
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/ci_unit_result.py
          sparse-checkout-cone-mode: false

      - name: Aggregate results-data result
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          python scripts/ci_unit_result.py \
            --unit results-data \
            --needs "$NEEDS_JSON" \
            --always ci-paths \
            --expect results-data-check=${{ needs.ci-paths.outputs.unit-results-data == 'true' }}

  # Unit result: docs.
  docs:
    name: docs
    needs: [ci-paths, visual-inputs, docs-build, example-validation, spellcheck]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the result helper
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/ci_unit_result.py
          sparse-checkout-cone-mode: false

      - name: Aggregate docs result
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          python scripts/ci_unit_result.py \
            --unit docs \
            --needs "$NEEDS_JSON" \
            --always ci-paths \
            --expect visual-inputs=${{ true }} \
            --expect docs-build=${{ needs.visual-inputs.outputs.changed == 'true' }} \
            --expect example-validation=${{ needs.visual-inputs.outputs.changed == 'true' }} \
            --expect spellcheck=${{ needs.visual-inputs.outputs.changed == 'true' }}

  # Unit result: landing.
  landing:
    name: landing
    needs: [ci-paths, site-theme-tokens, visual-inputs, site-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the result helper
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/ci_unit_result.py
          sparse-checkout-cone-mode: false

      - name: Aggregate landing result
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          python scripts/ci_unit_result.py \
            --unit landing \
            --needs "$NEEDS_JSON" \
            --always ci-paths \
            --expect site-theme-tokens=${{ needs.ci-paths.outputs.site-theme-needed == 'true' }} \
            --expect visual-inputs=${{ true }} \
            --expect site-build=${{ needs.ci-paths.outputs.site-needed == 'true' }}

  # Unit result: tooling.
  tooling:
    name: tooling
    needs: [ci-paths, base-guard, content-guard, skill-integrity, audit-sha, comment-policy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the result helper
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/ci_unit_result.py
          sparse-checkout-cone-mode: false

      - name: Aggregate tooling result
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          python scripts/ci_unit_result.py \
            --unit tooling \
            --needs "$NEEDS_JSON" \
            --always ci-paths \
            --always comment-policy \
            --expect base-guard=${{ github.event_name == 'pull_request' }} \
            --expect content-guard=${{ needs.ci-paths.outputs.content-guard-needed == 'true' }} \
            --expect skill-integrity=${{ needs.ci-paths.outputs.skill-integrity-needed == 'true' }} \
            --expect audit-sha=${{ contains(needs.ci-paths.outputs.changed-paths, '_project/audits/') || contains(needs.ci-paths.outputs.changed-paths, 'results-explorer/e2e/captures/') }}
