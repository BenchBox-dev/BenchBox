name: Publication Availability Monitor

# Five-minute availability observations are retained as outcomes. Full content
# hashing, including DuckDB, runs hourly and after a publication transaction.
# This workflow reports unknown during an active transaction; it never turns a
# transition or a missing observation into healthy coverage.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  sample:
    name: Observe publication availability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout control-plane source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Fetch publication journal
        run: |
          set -euo pipefail
          git fetch origin refs/heads/publication:refs/heads/publication

      - name: Observe live routes
        id: probe
        run: |
          set -euo pipefail
          mkdir -p monitor
          uv run python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from scripts.publication import journal
          from scripts.publication.verify_live import verify_live

          state = journal.read_journal_state(Path("."), ref="publication")
          report = None
          if state.active_transaction_id:
              report = verify_live(
                  base_url="https://benchbox.dev",
                  endpoints=["/", "/docs/", "/docs/api.html", "/results/"],
                  availability_only=True,
                  timeout=60,
                  observation_origin="github-actions:publication-availability-monitor",
              ).to_dict()
              report["ok"] = False
              report["status"] = "unknown"
              report["deferred"] = (
                  f"in-flight transaction {state.active_transaction_id}; "
                  "content identity is unknown until transaction verification"
              )
              report["errors"].insert(0, "active transaction prevents a healthy content assertion")
          elif not state.durable_transaction_id:
              report = {
                  "ok": False,
                  "status": "unknown",
                  "probes": [],
                  "matched_checksums": {},
                  "errors": ["journal has no durable head"],
              }
          else:
              tx = journal.read_transaction(Path("."), state.durable_transaction_id, ref="publication")
              routes = (tx.attestation or {}).get("routes") or []
              checksums = {
                  route["path"]: route["sha256"]
                  for route in routes
                  if route.get("ok") and route.get("path") and route.get("sha256")
              }
              Path("monitor/expected-manifest.json").write_text(
                  json.dumps({"checksums": checksums}, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              full_content_check = datetime.now(timezone.utc).minute == 0
              report = verify_live(
                  base_url="https://benchbox.dev",
                  manifest_path=Path("monitor/expected-manifest.json"),
                  require_receipt=True,
                  require_complete_checksums=full_content_check,
                  availability_only=not full_content_check,
                  endpoints=None if full_content_check else ["/", "/docs/", "/docs/api.html", "/results/"],
                  timeout=60,
                  observation_origin="github-actions:publication-availability-monitor",
              ).to_dict()
              report["status"] = "healthy" if report["ok"] else "failed"
              report["content_check"] = "full" if full_content_check else "availability"
          Path("monitor/sample-report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          if not report.get("ok"):
              raise SystemExit("publication monitor recorded a non-healthy outcome")
          PY

      - name: Write observation receipt
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          try:
              report = json.loads(Path("monitor/sample-report.json").read_text())
          except FileNotFoundError:
              report = {"ok": False, "status": "unknown", "errors": ["observation produced no report"]}
          receipt = {
              "timestamp": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "run_id": "${{ github.run_id }}",
              "run_attempt": "${{ github.run_attempt }}",
              "ok": bool(report.get("ok")),
              "status": report.get("status", "unknown"),
              "content_check": report.get("content_check"),
              "deferred": report.get("deferred"),
              "probes": report.get("probes", []),
              "matched_checksums": report.get("matched_checksums", {}),
              "errors": report.get("errors", []),
          }
          Path("monitor/observation.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Upload observation receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-monitor-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: monitor/
          retention-days: 30
