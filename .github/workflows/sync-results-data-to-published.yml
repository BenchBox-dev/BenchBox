name: Sync results-data to published-results

# When `results-data/` changes on develop (e.g. a maintainer-run seed corpus
# refresh from `seed-corpus.yml`, or a UAT integration PR like #164), open a
# draft PR vs `published-results` mirroring the changed corpus content. The
# `published-results` branch is intentionally slim (corpus + a small set of
# vendored validators) per
# `docs/development/adr/adr-published-results-slim-corpus-branch.md`, so this
# workflow keeps it in sync with develop's authoritative `results-data/`
# without forcing maintainers to mirror by hand.
#
# Publication fixed-point precondition: develop's corpus must already be at
# the publication fixed point before any mirror branch is built or PR opened.
# The gate below is the same check as
# tests/unit/scripts/test_corpus_privacy_invariant.py::test_rederived_corpus_publishes_byte_identically_to_what_is_stored
# (AnonymizationManager + canonical_json_bytes over primary bundles). If
# re-anonymizing would rewrite stored bytes, this workflow fails loudly and
# does not open a mirror that would re-publish rewriteable content. When
# re-derivation is in flight on develop, the mirror waits on that fixed point
# automatically; once the precondition holds, the mirror runs unattended
# again. The gate runs on the content being mirrored (develop @ GITHUB_SHA),
# not on published-results.
#
# The mirror PR is intentionally a draft — it never auto-merges. Maintainers
# review and flip ready when the develop-side change is ready to be visible
# on the public corpus branch. Validator changes mirror both the thin
# `scripts/validate_submission.py` entrypoint and its shared
# `benchbox/validation/bundle.py` implementation.
#
# The mirror PR's author is this workflow's own GITHUB_TOKEN identity
# (github-actions[bot]). GitHub never starts `pull_request`-triggered workflow
# runs for events raised by GITHUB_TOKEN — documented recursion prevention,
# not something a trigger filter can work around — so `validate-submission.yml`
# never fires on this PR even though its `paths:` filter matches every file
# the PR touches. Left alone, the PR's statusCheckRollup is empty: not zero
# failures, zero checks. See #1542 and
# `docs/operations/results-phase-2-runbook.md` §1.2. The "Validate mirrored
# corpus content" / "Report validation as a commit status" steps below are the
# fix: this run validates the exact content it is about to propose and posts
# the result as a commit status on the mirror branch's head SHA. A commit
# status is a plain write via the Statuses API, not a workflow trigger, so it
# is unaffected by the GITHUB_TOKEN recursion rule and needs no new
# credential — `statuses: write` only widens the permissions already granted
# to the token this workflow already holds.

on:
  push:
    branches: [develop]
    paths:
      - "results-data/bundles/**"
      - "results-data/corpus-inventory.json"
      - "results-data/CORPUS_NOTES.md"
      - "results-data/SEED_CORPUS_SPEC.md"
      - "results-data/README.md"
      - "results-data/validate_corpus.py"
      - "scripts/validate_submission.py"
      - "benchbox/validation/bundle.py"
      - "scripts/generate_corpus_inventory.py"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: sync-results-to-published-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the triggering commit
        # Pin to ${{ github.sha }} (not `ref: develop`) so each run mirrors
        # the exact commit that triggered it. With concurrency.cancel-in-progress
        # set to false, an older queued run that picked up `develop`'s
        # current tip would mirror newer corpus content while still naming
        # the branch / PR with the older GITHUB_SHA, producing misattributed
        # or duplicate mirror PRs.
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0  # full history so we can switch branches and diff

      - name: Configure git identity
        run: |
          git config user.name  "benchbox-bot"
          git config user.email "benchbox-bot@users.noreply.github.com"

      - name: Detect drift between develop and published-results
        id: drift
        run: |
          # Fail loudly on a missing remote ref — silent fetch failure must
          # not be misread as "no drift". Use an explicit refspec so the
          # remote-tracking ref origin/published-results is created/updated
          # in this single-branch clone; a bare `git fetch origin published-results`
          # only populates FETCH_HEAD and leaves origin/published-results missing.
          git fetch origin published-results:refs/remotes/origin/published-results

          # Direct two-tree compare (no dots): `published-results` is an
          # orphan branch (W2 of the parent TODO force-pushed it to a fresh
          # commit with no merge-base with develop). Three-dot syntax
          # (`A...B`) walks from the merge-base, which doesn't exist for
          # unrelated histories and produces a misleading 1-path result.
          # Two-tree compare is independent of history topology.
          mapfile -t DIFFED < <(git diff --name-only origin/published-results "${GITHUB_SHA}" -- \
            'results-data/bundles' 'results-data/corpus-inventory.json' \
            'results-data/CORPUS_NOTES.md' 'results-data/SEED_CORPUS_SPEC.md' \
            'results-data/README.md' 'results-data/validate_corpus.py' \
            'benchbox/validation/bundle.py' \
            'scripts/validate_submission.py' 'scripts/generate_corpus_inventory.py')

          if [[ ${#DIFFED[@]} -eq 0 ]]; then
            echo "No drift between develop and published-results in mirrored paths."
            echo "has_drift=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Drift detected in ${#DIFFED[@]} path(s):"
          printf '  %s\n' "${DIFFED[@]}"
          echo "has_drift=true" >> "$GITHUB_OUTPUT"

          # Capture file count for the PR body
          {
            echo "diff_count=${#DIFFED[@]}"
          } >> "$GITHUB_OUTPUT"

      # Fixed-point gate: refuse to build or open a mirror when develop's
      # results-data would be rewritten by a second anonymization pass. Same
      # logic as test_rederived_corpus_publishes_byte_identically_to_what_is_stored
      # in tests/unit/scripts/test_corpus_privacy_invariant.py. Runs on the
      # develop checkout (content being mirrored) before any mirror branch is
      # created. uv/Python are installed here so the gate can import
      # AnonymizationManager; later validate steps reuse the same toolchain.
      - name: Install uv
        if: steps.drift.outputs.has_drift == 'true'
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        if: steps.drift.outputs.has_drift == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gate corpus publication fixed point
        if: steps.drift.outputs.has_drift == 'true'
        run: |
          set -euo pipefail
          # Inline equivalent of
          # test_rederived_corpus_publishes_byte_identically_to_what_is_stored.
          # Uses AnonymizationManager directly so this stays a corpus-domain
          # gate rather than develop's full test matrix.
          # Fails loud: a skipped/refused mirror must not look like success.
          uv run -- python - <<'PY'
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path

          from benchbox.core.results.anonymization import AnonymizationManager
          from benchbox.core.results.canonical_json import canonical_json_bytes

          RESULTS_DATA = Path("results-data")
          COMPANION_SUFFIXES = (".manifest.json", ".plans.json", ".tuning.json", ".applied.json")
          MIGRATION_MANIFEST = "path-privacy-migration.manifest.json"

          manager = AnonymizationManager()
          drifted: list[str] = []
          scanned = 0

          for path in sorted((RESULTS_DATA / "bundles").rglob("*.json")):
              if path.name.endswith(COMPANION_SUFFIXES) or path.name == MIGRATION_MANIFEST:
                  continue
              stored = path.read_bytes()
              payload = json.loads(stored.decode("utf-8"))
              if not isinstance(payload, dict):
                  continue
              scanned += 1
              if canonical_json_bytes(manager.anonymize_result_payload(payload)) != stored:
                  drifted.append(str(path))

          if not scanned:
              print(
                  "::error::No primary bundles scanned — publication fixed-point gate would be vacuous.",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          if drifted:
              print(
                  f"::error::Corpus is not at the publication fixed point "
                  f"({len(drifted)} bundle(s) would be rewritten by re-anonymization). "
                  f"Refusing to open a mirror that would rewrite published bytes. "
                  f"Same check as test_rederived_corpus_publishes_byte_identically_to_what_is_stored.",
                  file=sys.stderr,
              )
              for rel in drifted[:20]:
                  print(f"  {rel}", file=sys.stderr)
              raise SystemExit(1)

          print(f"Publication fixed point OK ({scanned} primary bundles).")
          PY

      - name: Build mirror branch
        if: steps.drift.outputs.has_drift == 'true'
        id: build
        run: |
          # Branch name is deterministic per develop SHA so re-runs on the
          # same commit replace rather than accumulate.
          MIRROR_BRANCH="auto/results-mirror-${GITHUB_SHA::8}"
          echo "mirror_branch=${MIRROR_BRANCH}" >> "$GITHUB_OUTPUT"

          # Start from current published-results
          git switch --force-create "${MIRROR_BRANCH}" origin/published-results

          # Apply the triggering commit's content for each mirrored path.
          #
          # results-data/bundles uses a **union overlay**, not a wipe:
          # community submissions can land on published-results only (they
          # target that branch, not develop). A prior wipe (`git rm -rf
          # results-data/bundles` then checkout develop) deleted those
          # published-only paths whenever develop was also ahead. Overlay
          # instead:
          #   - checkout develop's version of every path that exists on develop
          #     (overwrites shared / develop-ahead files)
          #   - leave paths that exist only on published-results intact
          # Develop-side deletions inside bundles therefore do NOT auto-
          # propagate; that is intentional — never delete public community
          # content from an automated mirror. FILE_PATHS still use per-path
          # apply (including removal when missing on the source commit).
          SOURCE_REF="${GITHUB_SHA}"
          # Directory trees that must union-overlay (never wipe).
          BUNDLES_DIR='results-data/bundles'
          # corpus-inventory.json is NOT blind-overlaid from develop: after a
          # union overlay the tree may still hold published-only community
          # bundles that develop's inventory does not list. Regenerate from the
          # post-overlay tree so validate --check can pass under mixed drift.
          FILE_PATHS=(
            'results-data/CORPUS_NOTES.md'
            'results-data/SEED_CORPUS_SPEC.md'
            'results-data/README.md'
            'results-data/validate_corpus.py'
            'benchbox/validation/bundle.py'
            'scripts/validate_submission.py'
            'scripts/generate_corpus_inventory.py'
          )

          if git cat-file -e "${SOURCE_REF}:${BUNDLES_DIR}" 2>/dev/null; then
            # Union overlay: checkout develop tree without removing published-only.
            # Do NOT `git rm -rf` the directory first.
            git checkout "${SOURCE_REF}" -- "${BUNDLES_DIR}"
          else
            # Source has no bundles tree — leave published intact rather than
            # wipe community submissions. Report so the PR review can decide.
            echo "Source commit has no ${BUNDLES_DIR}; leaving published tree intact (union overlay)."
          fi

          for path in "${FILE_PATHS[@]}"; do
            if git cat-file -e "${SOURCE_REF}:${path}" 2>/dev/null; then
              git checkout "${SOURCE_REF}" -- "${path}"
            else
              # File removed on the source commit — mirror the removal.
              git rm -f --quiet "${path}" 2>/dev/null || true
            fi
          done

          # Derive inventory from the unioned tree (published-only + develop).
          # Same uv/--no-project/--python 3.11 contract as the validate step.
          if [[ -d "${BUNDLES_DIR}" ]]; then
            uv run --no-project --python 3.11 -- python scripts/generate_corpus_inventory.py --write
            git add results-data/corpus-inventory.json
          fi

          if git diff --staged --quiet && git diff --quiet; then
            echo "After applying develop content, mirror branch matches"
            echo "published-results — nothing to commit."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add results-data scripts benchbox/validation || true

          # The heredoc body inherits the YAML block-scalar's 10-space
          # indentation — strip it before using the file as a commit message.
          # Pattern is coupled to this `run: |` block's indent depth; if the
          # workflow is re-indented in a future refactor, also adjust the
          # `{10}` count below.
          MSG_FILE=$(mktemp)
          cat > "${MSG_FILE}" <<MSG
          chore(corpus): mirror results-data changes from develop@${GITHUB_SHA::8}

          This is an auto-generated mirror PR. The develop-side push at
          ${GITHUB_SHA} changed paths under the slim-branch allowlist. This
          commit replays those changes against published-results so the slim
          branch tracks develop's authoritative results-data/.

          Maintainer review the diff and flip the PR ready to merge.
          MSG
          awk '{sub(/^[[:space:]]{10}/,""); print}' "${MSG_FILE}" > "${MSG_FILE}.clean"
          mv "${MSG_FILE}.clean" "${MSG_FILE}"
          git commit -F "${MSG_FILE}"
          rm -f "${MSG_FILE}"

          echo "has_changes=true" >> "$GITHUB_OUTPUT"

          # Push the mirror branch. The branch is auto-named per develop SHA
          # and only ever managed by this workflow, so force is acceptable;
          # use `--force-with-lease` to match the project convention and
          # catch the unlikely race where two concurrent runs targeting the
          # same SHA collide.
          PRE_COMMIT_ALLOW_NO_CONFIG=1 git push --force-with-lease origin "${MIRROR_BRANCH}"

      # w0: which checks genuinely protect a corpus-only branch. `published-results`
      # carries results-data/, a slim results-validation subset of benchbox/, and
      # docs — not the develop package or test suite. Reimporting develop's
      # lint/type/pytest matrix here would gate corpus content on checks that have
      # nothing to do with it (rejected by the ADR for the same reason it rejected
      # routing submissions through develop directly). The two checks that ARE
      # domain-appropriate after the publication fixed-point gate above are exactly
      # the ones `validate-submission.yml` already runs for a human-authored
      # submission PR: does each changed bundle pass schema/hash/privacy
      # validation, and is the generated inventory still current. Run precisely
      # those two, reusing the identical vendored scripts and the identical
      # `--no-project --python 3.11` invocation convention documented in
      # `adr-published-results-slim-corpus-branch.md`, so the mirror PR is judged
      # by the same bar a contributor PR would be. uv/Python were installed
      # earlier for the fixed-point gate and are reused here.
      - name: Validate mirrored corpus content
        # The working tree right now (after `git switch --force-create` and the
        # path-level checkouts above) IS the exact content the PR will present as
        # its diff — validating it here checks precisely what a reviewer would
        # see, not a proxy for it. `set -u`/`pipefail` without `-e`: a validator
        # failure must be captured as a reported state, not abort the job before
        # the PR / status steps below ever run.
        if: steps.drift.outputs.has_drift == 'true' && steps.build.outputs.has_changes == 'true'
        id: validate
        run: |
          set -uo pipefail

          CHANGED_BUNDLES=$(git diff --no-renames --name-only --diff-filter=ACMR origin/published-results HEAD -- \
            'results-data/bundles/*.json' 'results-data/bundles/**/*.json' \
            | grep -vi '\.plans\.json$' \
            | grep -vi '\.tuning\.json$' \
            | grep -vi '\.applied\.json$' \
            | grep -vi '\.manifest\.json$' \
            || true)

          STATE="success"
          DESCRIPTION="Corpus content validated before mirroring."

          if [[ -n "${CHANGED_BUNDLES}" ]]; then
            echo "Validating changed bundle(s):"
            printf '  %s\n' "${CHANGED_BUNDLES}"
            # No --require-manifest: this run IS the maintainer-run mirror that
            # validate-submission.yml's own "Validate bundles" step already
            # waives the sidecar requirement for (same auto/results-mirror-*
            # same-repo signal) — the seed-corpus, sidecar-less path is
            # legitimate here too, not a gap.
            #
            # --allow-partial-validation: the curated seed corpus intentionally
            # includes summary.validation=partial cohorts for compare depth.
            # Community submissions still require passed (validate-submission.yml
            # never passes this flag). Privacy leaks and inventory staleness
            # still fail closed below.
            if ! printf '%s\n' "${CHANGED_BUNDLES}" | xargs -d '\n' uv run --no-project --python 3.11 -- \
              python scripts/validate_submission.py --allow-partial-validation; then
              STATE="failure"
              DESCRIPTION="scripts/validate_submission.py rejected the mirrored bundle content."
            fi
          fi

          if [[ "${STATE}" == "success" ]]; then
            if ! uv run --no-project --python 3.11 -- python scripts/generate_corpus_inventory.py --check; then
              STATE="failure"
              DESCRIPTION="results-data/corpus-inventory.json is stale for the mirrored content."
            fi
          fi

          echo "state=${STATE}" >> "$GITHUB_OUTPUT"
          echo "description=${DESCRIPTION}" >> "$GITHUB_OUTPUT"

      - name: Report validation as a commit status on the mirror PR
        # This is the fix for Cause 1 (see the workflow-level comment above): a
        # commit status posted by THIS run, tied to the mirror branch's own head
        # SHA, is what makes the PR's statusCheckRollup non-empty. It must carry
        # the same condition as "Open or update draft PR" so every mirror PR gets
        # it, not just some.
        #
        # `always()`: without it, a step-level failure anywhere above (a flaky
        # `astral-sh/setup-uv`, a `git diff` error inside the validate step —
        # anything the validate step's own `set -uo pipefail` capture does not
        # convert into a reported state) skips every later step, so no status
        # AND no mirror PR. That would be a new way for the corpus mirror to
        # silently not exist, which is worse than the blind PR this change is
        # removing: develop's Corpus Drift Check would stay red with nothing
        # open to explain it. An unreachable verdict is reported as `error`.
        if: always() && steps.drift.outputs.has_drift == 'true' && steps.build.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: ${{ steps.validate.outputs.state }}
          DESCRIPTION: ${{ steps.validate.outputs.description }}
        run: |
          # Empty means the validate step never reached its `GITHUB_OUTPUT`
          # write. Never default this to `success`: an absent verdict is the
          # one case where the PR carries no evidence either way.
          STATE="${STATE:-error}"
          DESCRIPTION="${DESCRIPTION:-Validation did not complete; see the workflow run.}"
          SHA=$(git rev-parse HEAD)
          gh api "repos/${{ github.repository }}/statuses/${SHA}" \
            -f state="${STATE}" \
            -f context="corpus-mirror/validate-bundles" \
            -f description="${DESCRIPTION}" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Open or update draft PR
        # `always()` for the same reason as the status step above: the mirror PR
        # existing is what keeps develop's Corpus Drift Check actionable, so it
        # must not be collateral damage from a toolchain hiccup in the new
        # validation steps. Before those steps existed this could not happen.
        if: always() && steps.drift.outputs.has_drift == 'true' && steps.build.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIRROR_BRANCH: ${{ steps.build.outputs.mirror_branch }}
          DIFF_COUNT: ${{ steps.drift.outputs.diff_count }}
        run: |
          # Reuse an existing PR opened by this workflow against the same
          # mirror branch; otherwise open a new draft PR.
          EXISTING=$(gh pr list \
            --base published-results \
            --head "${MIRROR_BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          # Same indentation-stripping concern as the commit message above.
          BODY=$(cat <<EOF | awk '{sub(/^[[:space:]]{10}/,""); print}'
          Auto-mirror of develop's \`results-data/\` changes onto the slim
          \`published-results\` branch. Triggered by develop@\`${GITHUB_SHA::8}\`.

          **${DIFF_COUNT}** path(s) changed. Review the diff and flip the PR
          ready to merge when the develop-side change is ready to surface
          on the public corpus branch. This PR will not auto-merge.

          See [\`docs/development/adr/adr-published-results-slim-corpus-branch.md\`](https://github.com/${{ github.repository }}/blob/develop/docs/development/adr/adr-published-results-slim-corpus-branch.md)
          for the slim-branch design and
          [\`docs/operations/results-phase-2-runbook.md\`](https://github.com/${{ github.repository }}/blob/develop/docs/operations/results-phase-2-runbook.md)
          for the operating model.
          EOF
          )

          if [[ -z "${EXISTING}" ]]; then
            gh pr create \
              --draft \
              --base published-results \
              --head "${MIRROR_BRANCH}" \
              --title "chore(corpus): mirror results-data changes from develop@${GITHUB_SHA::8}" \
              --body "${BODY}"
          else
            echo "PR #${EXISTING} already open for ${MIRROR_BRANCH}; updating body."
            gh pr edit "${EXISTING}" --body "${BODY}"
          fi

      - name: Fail the run if mirrored content failed validation
        # Runs after the PR/status steps above on purpose: the PR must still
        # exist and carry the failing status for a maintainer to act on, not
        # disappear because this job stopped early.
        #
        # `!= 'success'` rather than `== 'failure'`: an empty state means the
        # validate step never produced a verdict, and a run that could not
        # determine whether the corpus is publishable must not be green.
        if: always() && steps.drift.outputs.has_drift == 'true' && steps.build.outputs.has_changes == 'true' && steps.validate.outputs.state != 'success'
        run: |
          echo "::error::Mirrored corpus content did not pass validation; see the corpus-mirror/validate-bundles status on the mirror PR for detail."
          exit 1

      - name: No-op summary
        if: steps.drift.outputs.has_drift != 'true' || steps.build.outputs.has_changes != 'true'
        run: echo "No mirror PR needed — develop and published-results are already in sync for the mirrored paths."
