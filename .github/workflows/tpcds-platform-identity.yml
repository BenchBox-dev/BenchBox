name: TPC-DS Platform Identity


on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "benchbox/_binaries/tpc-ds/**"
      - "benchbox/core/tpcds/c_tools.py"
      - "benchbox/core/tpcds/parameter_log.py"
      - "benchbox/core/tpcds/queries.py"
      - "benchbox/core/tpcds/streams.py"
      - "benchbox/core/tpcds/benchmark/**"
      - "benchbox/core/tpcds/generator/**"
      - "benchbox/utils/tpc_compilation.py"
      - "scripts/tpcds_platform_identity.py"
      - ".github/workflows/tpcds-platform-identity.yml"

permissions:
  contents: read

concurrency:
  group: tpcds-platform-identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest:
    name: TPC-DS manifest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: ${{ startsWith(matrix.os, 'windows') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
        include:
          - os: ubuntu-latest
            expected_arch: x64
          - os: ubuntu-24.04-arm
            expected_arch: arm64
          - os: macos-latest
            expected_arch: arm64
          - os: macos-15-intel
            expected_arch: x64
          - os: windows-latest
            expected_arch: x64
          - os: windows-11-arm
            expected_arch: arm64
            uv_sync_args: --no-dev --no-install-package pyarrow --no-install-package pandas
            uv_run_args: --no-sync
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync ${{ matrix.uv_sync_args }}

      - name: Require the expected architecture
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: >-
          uv run ${{ matrix.uv_run_args }} -- python -c
          'import os, platform, sys;
          families = {"x64": {"x86_64", "amd64"}, "arm64": {"arm64", "aarch64"}};
          expected = os.environ["EXPECTED_ARCH"];
          machine = platform.machine();
          sys.exit(None if machine.lower() in families[expected] else f"expected {expected} Python, got {machine}")'

      - name: Build the manifest
        run: uv run ${{ matrix.uv_run_args }} -- python scripts/tpcds_platform_identity.py manifest --out "manifest-${{ runner.os }}-${{ runner.arch }}.json"

      - name: Upload the manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: tpcds-manifest-${{ runner.os }}-${{ runner.arch }}
          path: manifest-*.json
          if-no-files-found: error
          retention-days: 30

  compare:
    name: Compare TPC-DS manifests
    needs: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Download the manifests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: tpcds-manifest-*
          path: manifests
          merge-multiple: true

      - name: Compare Linux and macOS
        run: python scripts/tpcds_platform_identity.py compare manifests/manifest-Linux-*.json manifests/manifest-macOS-*.json

      - name: Compare with Windows (advisory)
        continue-on-error: true
        run: |
          if ls manifests/manifest-Windows-*.json >/dev/null 2>&1; then
            python scripts/tpcds_platform_identity.py compare manifests/manifest-*.json
          else
            echo "No Windows manifest was produced; see the Windows manifest job."
          fi
