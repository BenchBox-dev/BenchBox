name: Fast-lane baseline

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-lane-baseline-${{ github.sha }}
  cancel-in-progress: false

jobs:
  record:
    name: record fast-lane count
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Count fast-lane tests
        run: |
          uv run -- python _project/scripts/fast_lane_ceiling_check.py --emit-fast-count > fast-lane-count.txt || echo "unknown" > fast-lane-count.txt
          cat fast-lane-count.txt

      - name: Cache fast-lane count
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: fast-lane-count.txt
          key: fast-lane-count-develop-${{ github.sha }}
