name: Fast-lane baseline

# Records the fast-lane collect count of each develop tip so the per-PR delta
# guard in ci.yml (`guard-fast-lane-delta`) can compare a pull request against
# the exact base commit it was cut from. The guard restores
# `fast-lane-count-develop-<base-sha>` and fails closed on a miss, so this
# workflow must run for every develop push. Caches written on a merge-queue ref
# are not visible to pull_request runs, which is why the entry is written here,
# on the develop ref itself. See docs/operations/fast-lane-budget.md.

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-lane-baseline-${{ github.sha }}
  cancel-in-progress: false

jobs:
  record:
    name: record fast-lane count
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Count fast-lane tests
        run: |
          uv run -- python _project/scripts/fast_lane_ceiling_check.py --emit-fast-count > fast-lane-count.txt || echo "unknown" > fast-lane-count.txt
          cat fast-lane-count.txt

      - name: Cache fast-lane count
        # Keyed on this commit so the PR lane's exact-key restore finds the
        # count for its own base SHA. A cache-service hiccup must not turn a
        # develop push red, but it does leave that base without a baseline, so
        # re-run this workflow with workflow_dispatch to repair it.
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: fast-lane-count.txt
          key: fast-lane-count-develop-${{ github.sha }}
