name: TPC-DS Staged Maturation Tracker

on:
  schedule:
    - cron: '0 11 * * 0'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tpcds-staged-maturation-tracker
  cancel-in-progress: false

jobs:
  tpcds-staged-report:
    name: tpcds-staged-report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: |
          uv venv
          uv sync --group dev

      - name: Run full-99 TPC-DS staged report
        id: report
        continue-on-error: true
        run: make tpcds-cross-surface-equivalence-report

      - name: Summarize maturation signal
        env:
          REPORT_OUTCOME: ${{ steps.report.outcome }}
        run: |
          echo "TPC-DS staged maturation report step outcome: ${REPORT_OUTCOME}. See the report step log for the passing-query count and any harness errors." >> "$GITHUB_STEP_SUMMARY"
