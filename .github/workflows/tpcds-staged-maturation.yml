name: TPC-DS Staged Maturation Tracker

# Weekly scheduled report (NOT a blocking gate): runs the full-99 TPC-DS
# staged cross-surface report at SF=0.01 (~13s wall) and records how many
# queries pass discriminating. Only Q38/Q88 pass today, so no honest 10-15
# query blocking subset exists yet. When the passing count reaches a
# reviewer-approved subset threshold, the blocking subset decision lands in
# a reviewed change — this workflow never promotes, prunes, or writes
# tracked files; it only reports.
#
# Soundness: read-only observability. No auto-merge, no baseline writes, no
# hosted tracker writes. The report goes to the job summary and log.

on:
  schedule:
    # Weekly, Sunday 11:00 UTC - after baseline autodetect (10:00), to avoid
    # runner contention. Routine low-priority maturation signal.
    - cron: '0 11 * * 0'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tpcds-staged-maturation-tracker
  cancel-in-progress: false

jobs:
  tpcds-staged-report:
    name: tpcds-staged-report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        run: |
          uv venv
          uv sync --group dev

      - name: Run full-99 TPC-DS staged report
        run: |
          make tpcds-cross-surface-equivalence-report || true

      - name: Summarize maturation signal
        run: |
          echo "TPC-DS staged maturation report complete. See log for passing-query count." >> "$GITHUB_STEP_SUMMARY"
