name: Pricing Data Drift Check

# The generated pricing tables in benchbox/core/cost/pricing_data.yaml are
# derived from the AWS Price List API and the Azure Retail Prices API, but the
# PR-blocking `guard-pricing-data` step only verifies the committed tables
# against the checked-in evidence (offline). This scheduled job performs the
# network-touching half: it re-pulls both vendor APIs into the evidence file
# and fails loudly when the regenerated tables move, so upstream drift
# surfaces here instead of silently aging in the tree. Unchanged upstream
# regenerates byte-identical output and the job stays green.

on:
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}
  # Also run when the generator, its inputs, or this workflow changes, so a
  # broken refresh surfaces the moment it lands on develop.
  push:
    branches:
      - develop
    paths:
      - "scripts/generate_pricing_data.py"
      - "benchbox/core/cost/pricing_data.yaml"
      - "benchbox/core/cost/pricing_vendor_evidence.yaml"
      - ".github/workflows/pricing-data-drift-check.yml"

permissions:
  contents: read

jobs:
  drift-check:
    name: Refresh vendor pricing evidence
    runs-on: ubuntu-latest
    steps:
      - name: Check out develop
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: develop
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Refresh evidence from the vendor APIs
        run: |
          uv run -- python scripts/generate_pricing_data.py --refresh

      - name: Fail on upstream drift
        run: |
          if git diff --exit-code -- benchbox/core/cost/pricing_data.yaml \
              benchbox/core/cost/pricing_vendor_evidence.yaml; then
            echo "Vendor pricing matches the recorded evidence."
          else
            echo "::error::Upstream vendor prices moved. Review the diff above, then run"
            echo "::error::'make pricing-data' locally after confirming the new list prices"
            echo "::error::and commit the refreshed evidence and tables together."
            exit 1
          fi
