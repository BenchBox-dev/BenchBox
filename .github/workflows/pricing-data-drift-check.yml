name: Pricing Data Drift Check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}
  push:
    branches:
      - develop
    paths:
      - "scripts/generate_pricing_data.py"
      - "benchbox/core/cost/pricing_data.yaml"
      - "benchbox/core/cost/pricing_vendor_evidence.yaml"
      - ".github/workflows/pricing-data-drift-check.yml"

permissions:
  contents: read

jobs:
  drift-check:
    name: Refresh vendor pricing evidence
    runs-on: ubuntu-latest
    steps:
      - name: Check out develop
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: develop
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Refresh evidence from the vendor APIs
        run: |
          uv run -- python scripts/generate_pricing_data.py --refresh

      - name: Fail on upstream drift
        run: |
          if git diff --exit-code -- benchbox/core/cost/pricing_data.yaml \
              benchbox/core/cost/pricing_vendor_evidence.yaml; then
            echo "Vendor pricing matches the recorded evidence."
          else
            echo "::error::Upstream vendor prices moved. Review the diff above, then run"
            echo "::error::'make pricing-data' locally after confirming the new list prices"
            echo "::error::and commit the refreshed evidence and tables together."
            exit 1
          fi
