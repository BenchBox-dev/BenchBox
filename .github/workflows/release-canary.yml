name: Release Canary

on:
  workflow_dispatch:
  schedule:
    # Daily 08:00 UTC so release-readiness can use a 48h freshness window.
    - cron: "0 8 * * *"

concurrency:
  group: release-canary-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  BENCHBOX_TEST_LOCK_WAIT_SECONDS: "0"
  RELEASE_CANARY_REF: develop
  RELEASE_CANARY_SHARD_COUNT: 6

jobs:
  collect-credential-free-non-fast:
    name: collect credential-free non-fast canary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      checked_sha: ${{ steps.checked-ref.outputs.checked_sha }}
      collected_count: ${{ steps.collect.outputs.collected_count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.RELEASE_CANARY_REF }}
          fetch-depth: 0

      - name: Record checked ref
        id: checked-ref
        run: echo "checked_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Collect credential-free non-fast tests
        id: collect
        shell: bash
        run: |
          set -o pipefail
          mkdir -p release-canary-artifacts
          rc=0
          uv run -- python -m pytest \
            --collect-only \
            -q \
            -n 0 \
            -m "(slow or resource_heavy) and not (stress or live_integration)" \
            | tee release-canary-artifacts/non-fast-collect.txt
          pipeline_status=("${PIPESTATUS[@]}")
          rc=${pipeline_status[0]}
          tee_rc=${pipeline_status[1]}
          if [ "$rc" != "0" ] || [ "$tee_rc" != "0" ]; then
            echo "::error::Credential-free non-fast test collection or log capture failed."
            exit 1
          fi
          count=$(grep -Eo '^[0-9]+/[0-9]+ tests collected' release-canary-artifacts/non-fast-collect.txt | tail -1 | cut -d/ -f1)
          if [ -z "$count" ]; then
            echo "::error::Could not parse collected non-fast canary count."
            exit 1
          fi
          uv run -- python scripts/release_canary_sharding.py collect \
            --input release-canary-artifacts/non-fast-collect.txt \
            --nodeids-output release-canary-artifacts/non-fast-nodeids.txt \
            --summary-output release-canary-artifacts/non-fast-collection-summary.json \
            --expected-count "$count" \
            --shard-count "$RELEASE_CANARY_SHARD_COUNT" \
            --checked-ref develop \
            --checked-sha "${CHECKED_SHA}" \
            --github-output "$GITHUB_OUTPUT"
        env:
          CHECKED_SHA: ${{ steps.checked-ref.outputs.checked_sha }}

      - name: Upload non-fast canary artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-canary-nodeids
          path: release-canary-artifacts/
          retention-days: 30

  credential-free-non-fast:
    name: credential-free non-fast canary (shard ${{ matrix.shard_number }}/6)
    runs-on: ubuntu-latest
    needs: [collect-credential-free-non-fast]
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_index: 0
            shard_number: 1
          - shard_index: 1
            shard_number: 2
          - shard_index: 2
            shard_number: 3
          - shard_index: 3
            shard_number: 4
          - shard_index: 4
            shard_number: 5
          - shard_index: 5
            shard_number: 6
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.collect-credential-free-non-fast.outputs.checked_sha }}
          fetch-depth: 0

      - name: Record setup start
        # Runs right after checkout (checkout wipes untracked workspace files,
        # so nothing can be recorded earlier). The setup interval therefore
        # covers artifact download, Python/uv install, uv sync, and
        # partitioning; checkout itself stays recoverable from step timings.
        # The stamp lives outside the uploaded artifact directory; only the
        # summary JSON carries the durations.
        #
        # The stamp is monotonic seconds since boot, not wall-clock time. An
        # NTP adjustment during the job would otherwise publish skewed or
        # negative durations, and these durations are what shard sizing is
        # supposed to be built on. This step runs before Python and uv are
        # installed, so benchbox.utils.clock.mono_time() is not reachable yet
        # and the monotonic source has to come straight from the kernel.
        shell: bash
        run: |
          setup_mono=""
          if [ -r /proc/uptime ]; then
            # `|| true`: read returns non-zero at EOF on an input without a
            # trailing newline, and errexit is still active in this step.
            read -r setup_mono _ < /proc/uptime || true
          fi
          echo "$setup_mono" > "${GITHUB_WORKSPACE}/.canary-setup-start-mono"

      - name: Download collected node IDs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-canary-nodeids
          path: release-canary-artifacts

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Partition node IDs
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
        run: |
          uv run -- python scripts/release_canary_sharding.py shard \
            --input release-canary-artifacts/non-fast-nodeids.txt \
            --nodeids-output "release-canary-artifacts/shard-${SHARD_INDEX}-nodeids.txt" \
            --summary-output "release-canary-artifacts/shard-${SHARD_INDEX}-summary.json" \
            --shard-index "$SHARD_INDEX" \
            --shard-count "$RELEASE_CANARY_SHARD_COUNT"

      - name: Run credential-free non-fast shard
        id: run-tests
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
        run: |
          set -o pipefail
          junit_xml="release-canary-artifacts/shard-${SHARD_INDEX}-junit.xml"
          # Monotonic seconds since boot, for the same reason as the setup
          # stamp: these two stamps bound test_seconds, and a wall clock that
          # NTP moves mid-job would publish a skewed or negative duration.
          # Python is installed by this point, but the stamp is read from the
          # kernel so it shares one time base with the setup stamp.
          mono_stamp() {
            local uptime_value=""
            if [ -r /proc/uptime ]; then
              read -r uptime_value _ < /proc/uptime || true
            fi
            echo "$uptime_value"
          }
          tests_start=$(mono_stamp)
          echo "$tests_start" > "${GITHUB_WORKSPACE}/.canary-tests-start-mono"
          mapfile -t node_ids < "release-canary-artifacts/shard-${SHARD_INDEX}-nodeids.txt"
          rc=0
          # GitHub runs `shell: bash` under errexit, so a failing pytest would
          # abort this step at the pipeline and skip the exit-code capture and
          # every piece of evidence below. errexit stays off from here on: this
          # step's result is decided by `exit "$rc"` alone, and a failure to
          # record evidence must not change that result.
          set +e
          if [ "${#node_ids[@]}" -eq 0 ]; then
            echo "No tests assigned to shard ${SHARD_INDEX}." | tee "release-canary-artifacts/shard-${SHARD_INDEX}-pytest.log"
          else
            uv run -- python -m pytest \
              -m "(slow or resource_heavy) and not (stress or live_integration)" \
              -n 0 \
              --tb=short \
              --maxfail=5 \
              --junitxml="$junit_xml" \
              "${node_ids[@]}" \
              2>&1 | tee "release-canary-artifacts/shard-${SHARD_INDEX}-pytest.log"
            # Read PIPESTATUS in a single assignment: reading the two elements
            # separately resets it after the first read.
            pipeline_status=("${PIPESTATUS[@]}")
            rc=${pipeline_status[0]}
            tee_rc=${pipeline_status[1]}
            if [ "$tee_rc" != "0" ]; then
              rc="$tee_rc"
            fi
          fi
          tests_end=$(mono_stamp)
          echo "$tests_end" > "${GITHUB_WORKSPACE}/.canary-tests-end-mono"
          # The JUnit report is best-effort evidence: a missing file must never
          # change the shard result, so fall back to a marked empty report.
          # Record which of the two happened, because a fallback report is
          # present but carries no durations; a consumer sizing shards from
          # these numbers must be able to tell them apart.
          #
          # A non-empty file is not sufficient. pytest exits 5 when it
          # collected nothing to run -- every node ID deselected by the marker
          # expression, or a typo'd path -- and still writes a well-formed,
          # non-empty report with no <testcase> in it. That report is genuine
          # evidence that pytest ran, so keep it, but it carries no durations
          # and must not be published as a capture.
          junit_captured="true"
          if [ ! -s "$junit_xml" ]; then
            junit_captured="false"
            cat > "$junit_xml" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <testsuite tests="0" errors="0" failures="0" skipped="0">
            <properties>
              <property name="junit_captured" value="false"/>
            </properties>
            <system-out>No per-test durations were captured for shard ${SHARD_INDEX}.</system-out>
          </testsuite>
          EOF
          elif ! grep -q "<testcase" "$junit_xml"; then
            junit_captured="false"
          fi
          echo "$junit_captured" > "${GITHUB_WORKSPACE}/.canary-junit-captured"
          echo "pytest_exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Write shard summary
        if: always()
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_COUNT: ${{ env.RELEASE_CANARY_SHARD_COUNT }}
          CHECKED_SHA: ${{ needs.collect-credential-free-non-fast.outputs.checked_sha }}
          COLLECTED_COUNT: ${{ needs.collect-credential-free-non-fast.outputs.collected_count }}
          PYTEST_EXIT_CODE: ${{ steps.run-tests.outputs.pytest_exit_code }}
        run: |
          assigned_count=""
          shard_nodeids="release-canary-artifacts/shard-${SHARD_INDEX}-nodeids.txt"
          if [ -f "$shard_nodeids" ]; then
            assigned_count=$(wc -l < "$shard_nodeids" | tr -d ' ')
          fi
          # Setup covers post-checkout preparation (artifact download, uv sync,
          # partitioning); test time covers pytest only. The stamps are
          # monotonic seconds since boot, so the differences are elapsed time
          # even if the runner's wall clock moves. A missing stamp degrades to
          # an empty field, never to a failed summary.
          setup_start=""
          tests_start=""
          tests_end=""
          if [ -f "${GITHUB_WORKSPACE}/.canary-setup-start-mono" ]; then
            setup_start=$(cat "${GITHUB_WORKSPACE}/.canary-setup-start-mono")
          fi
          if [ -f "${GITHUB_WORKSPACE}/.canary-tests-start-mono" ]; then
            tests_start=$(cat "${GITHUB_WORKSPACE}/.canary-tests-start-mono")
          fi
          if [ -f "${GITHUB_WORKSPACE}/.canary-tests-end-mono" ]; then
            tests_end=$(cat "${GITHUB_WORKSPACE}/.canary-tests-end-mono")
          fi
          # Durations are whole elapsed seconds, computed only when both stamps
          # are present. awk subtracts the floats and int() truncates, which is
          # what the previous integer arithmetic did and what "elapsed seconds"
          # should mean; rounding would silently inflate short intervals.
          setup_seconds=""
          test_seconds=""
          if [ -n "$setup_start" ] && [ -n "$tests_start" ]; then
            setup_seconds=$(awk -v a="$setup_start" -v b="$tests_start" 'BEGIN{printf "%d", int(b - a)}')
          fi
          if [ -n "$tests_start" ] && [ -n "$tests_end" ]; then
            test_seconds=$(awk -v a="$tests_start" -v b="$tests_end" 'BEGIN{printf "%d", int(b - a)}')
          fi
          junit_xml="release-canary-artifacts/shard-${SHARD_INDEX}-junit.xml"
          junit_present="false"
          if [ -s "$junit_xml" ]; then
            junit_present="true"
          fi
          # junit_present says a report file exists; junit_captured says it
          # holds real per-test durations. A shard whose test step never ran
          # leaves no marker, and anything other than an exact "true" degrades
          # to false, so the summary never claims durations it cannot back.
          junit_captured="false"
          if [ -f "${GITHUB_WORKSPACE}/.canary-junit-captured" ]; then
            junit_captured=$(cat "${GITHUB_WORKSPACE}/.canary-junit-captured")
          fi
          if [ "$junit_captured" != "true" ]; then
            junit_captured="false"
          fi
          cat > "release-canary-artifacts/shard-${SHARD_INDEX}-summary.json" <<EOF
          {
            "workflow": "release-canary.yml",
            "job": "credential-free-non-fast",
            "checked_ref": "develop",
            "commit_sha": "${CHECKED_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "shard_index": ${SHARD_INDEX},
            "shard_count": ${SHARD_COUNT},
            "marker_expression": "(slow or resource_heavy) and not (stress or live_integration)",
            "collected_count": "${COLLECTED_COUNT}",
            "assigned_count": "${assigned_count}",
            "pytest_exit_code": "${PYTEST_EXIT_CODE}",
            "setup_start_mono": "${setup_start}",
            "tests_start_mono": "${tests_start}",
            "tests_end_mono": "${tests_end}",
            "setup_seconds": "${setup_seconds}",
            "test_seconds": "${test_seconds}",
            "junit_xml": "shard-${SHARD_INDEX}-junit.xml",
            "junit_present": ${junit_present},
            "junit_captured": ${junit_captured}
          }
          EOF

      - name: Upload shard artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-canary-non-fast-shard-${{ matrix.shard_index }}
          path: release-canary-artifacts/
          retention-days: 30

  ruleset-drift:
    name: ruleset drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      drift_exit_code: ${{ steps.drift.outputs.drift_exit_code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.RELEASE_CANARY_REF }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Check ruleset and environment-protection drift
        id: drift
        shell: bash
        env:
          RULESET_DRIFT_TOKEN: ${{ secrets.RULESET_DRIFT_TOKEN }}
          RELEASE_READINESS_OVERRIDE_SHA: ${{ vars.RELEASE_READINESS_OVERRIDE_SHA }}
          RELEASE_READINESS_OVERRIDE_REASON: ${{ vars.RELEASE_READINESS_OVERRIDE_REASON }}
        run: |
          mkdir -p release-canary-artifacts
          rc=0
          uv run -- python scripts/ruleset_drift_check.py \
            --token "${RULESET_DRIFT_TOKEN}" \
            --require-bypass-actor-visibility \
            --output release-canary-artifacts/ruleset-drift.json \
            2>&1 | tee release-canary-artifacts/ruleset-drift.txt \
            || rc=${PIPESTATUS[0]}
          echo "drift_exit_code=$rc" >> "$GITHUB_OUTPUT"

      - name: Upload ruleset drift artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-canary-ruleset-drift
          path: release-canary-artifacts/
          retention-days: 30

      - name: Fail if ruleset drift was detected
        if: steps.drift.outputs.drift_exit_code != '0'
        run: |
          echo "::error::Ruleset or environment-protection drift check failed."
          exit 1

  pypi-latest-installability:
    name: pypi-latest installability canary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Deliberately no checkout step in this job: the point is to install
      # the *published* PyPI artifact, not build or import against local
      # source. Set up Python / uv here don't need a repo checkout.
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install and import PyPI-latest benchbox (no local source in sys.path)
        shell: bash
        run: |
          set -euo pipefail
          # Run from a scratch directory with no benchbox/ source tree
          # anywhere nearby. Running this from inside the checked-out repo
          # would silently import the local benchbox/ source directory
          # instead of the installed wheel (Python adds the script's
          # directory to sys.path), producing a false pass even when the
          # real PyPI artifact is broken -- exactly how v0.3.0's broken
          # clean import (missing pandas guard) went undetected for over a
          # month. See docs/operations/release-guide.md "Recovering from a
          # broken PyPI release". This reuses the same import + pandas-
          # absence assertion as nightly.yml's test-package job, just
          # against PyPI-latest instead of a freshly built local wheel.
          workdir=$(mktemp -d)
          cd "$workdir"
          uv run --isolated --no-project --with benchbox -- python -c "import importlib.util; import benchbox; assert importlib.util.find_spec('pandas') is None, 'core install must not pull pandas'; print(f'PyPI-latest BenchBox {benchbox.__version__} installed successfully (minimal import surface)')"

  release-canary-result:
    name: release-canary-result
    runs-on: ubuntu-latest
    needs:
      [
        collect-credential-free-non-fast,
        credential-free-non-fast,
        ruleset-drift,
        pypi-latest-installability,
      ]
    if: always()
    steps:
      - name: Write release canary summary
        env:
          COLLECTION_RESULT: ${{ needs.collect-credential-free-non-fast.result }}
          CHECKED_SHA: ${{ needs.collect-credential-free-non-fast.outputs.checked_sha }}
          NON_FAST_RESULT: ${{ needs.credential-free-non-fast.result }}
          RULESET_DRIFT_RESULT: ${{ needs.ruleset-drift.result }}
          PYPI_LATEST_RESULT: ${{ needs.pypi-latest-installability.result }}
          NON_FAST_COUNT: ${{ needs.collect-credential-free-non-fast.outputs.collected_count }}
          SHARD_COUNT: ${{ env.RELEASE_CANARY_SHARD_COUNT }}
        run: |
          mkdir -p release-canary-artifacts
          cat > release-canary-artifacts/release-canary-summary.json <<EOF
          {
            "workflow": "release-canary.yml",
            "checked_ref": "develop",
            "commit_sha": "${CHECKED_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "suite_families": ["slow", "resource_heavy"],
            "excluded_families": ["stress", "live_integration"],
            "marker_expression": "(slow or resource_heavy) and not (stress or live_integration)",
            "freshness_contract_hours": 48,
            "collection_result": "${COLLECTION_RESULT}",
            "non_fast_result": "${NON_FAST_RESULT}",
            "ruleset_drift_result": "${RULESET_DRIFT_RESULT}",
            "pypi_latest_installability_result": "${PYPI_LATEST_RESULT}",
            "non_fast_collected_count": "${NON_FAST_COUNT}",
            "non_fast_shard_count": "${SHARD_COUNT}"
          }
          EOF

      - name: Upload release canary summary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-canary-summary
          path: release-canary-artifacts/release-canary-summary.json
          retention-days: 30

      - name: Aggregate release canary result
        env:
          COLLECTION_RESULT: ${{ needs.collect-credential-free-non-fast.result }}
          NON_FAST_RESULT: ${{ needs.credential-free-non-fast.result }}
          RULESET_DRIFT_RESULT: ${{ needs.ruleset-drift.result }}
          PYPI_LATEST_RESULT: ${{ needs.pypi-latest-installability.result }}
        run: |
          set -euo pipefail
          failed=0
          for pair in \
            "collect-credential-free-non-fast=$COLLECTION_RESULT" \
            "credential-free-non-fast=$NON_FAST_RESULT" \
            "ruleset-drift=$RULESET_DRIFT_RESULT" \
            "pypi-latest-installability=$PYPI_LATEST_RESULT"; do
            name="${pair%%=*}"
            result="${pair#*=}"
            if [ "$result" != "success" ]; then
              echo "$name=$result"
              failed=1
            fi
          done
          if [ "$failed" != "0" ]; then
            exit 1
          fi
          echo "Release canary passed."

  release-canary-incident:
    # A red canary blocks every release PR, so it must reach an owner the day
    # it goes red instead of waiting to be found at release time. One open
    # issue tracks each red episode; the next green run closes it.
    # Release readiness reads this run's conclusion, so a failure here (for
    # example, a GitHub API error) must never turn a green canary red.
    name: release-canary-incident
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    needs:
      [
        collect-credential-free-non-fast,
        credential-free-non-fast,
        ruleset-drift,
        pypi-latest-installability,
        release-canary-result,
      ]
    if: ${{ always() && !cancelled() }}
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.RELEASE_CANARY_REF }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Download shard artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          pattern: release-canary-non-fast-shard-*
          path: release-canary-shards

      - name: Summarize canary run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKED_SHA: ${{ needs.collect-credential-free-non-fast.outputs.checked_sha }}
          COLLECTION_RESULT: ${{ needs.collect-credential-free-non-fast.result }}
          NON_FAST_RESULT: ${{ needs.credential-free-non-fast.result }}
          RULESET_DRIFT_RESULT: ${{ needs.ruleset-drift.result }}
          PYPI_LATEST_RESULT: ${{ needs.pypi-latest-installability.result }}
          AGGREGATE_RESULT: ${{ needs.release-canary-result.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          # An empty last-green SHA is valid; the summary then says no green run was found.
          last_green_sha="$(gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow release-canary.yml \
            --status success \
            --limit 1 \
            --json headSha \
            --jq '.[0].headSha // ""' || true)"
          uv run --no-project --python 3.12 -- python scripts/release_canary_incident.py \
            --artifacts-dir release-canary-shards \
            --job-result "collect-credential-free-non-fast=${COLLECTION_RESULT}" \
            --job-result "credential-free-non-fast=${NON_FAST_RESULT}" \
            --job-result "ruleset-drift=${RULESET_DRIFT_RESULT}" \
            --job-result "pypi-latest-installability=${PYPI_LATEST_RESULT}" \
            --job-result "release-canary-result=${AGGREGATE_RESULT}" \
            --run-url "${RUN_URL}" \
            --checked-sha "${CHECKED_SHA}" \
            --last-green-sha "${last_green_sha}" \
            --repo-url "${REPO_URL}" \
            --output release-canary-incident.json

      - name: Open, update, or close the incident issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          label="incident:release-canary-red"
          gh label create "${label}" \
            --repo "${GITHUB_REPOSITORY}" \
            --description "Release canary is red; release PRs are blocked" \
            --color B60205 >/dev/null 2>&1 || true

          state="$(jq -r '.state' release-canary-incident.json)"
          existing_issue_url="$(gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --label "${label}" \
            --json url \
            --jq '.[0].url // ""')"
          comment_file="$(mktemp)"
          jq -r '.comment' release-canary-incident.json > "${comment_file}"

          if [ "${state}" = "green" ]; then
            if [ -n "${existing_issue_url}" ]; then
              gh issue comment "${existing_issue_url}" --body-file "${comment_file}"
              gh issue close "${existing_issue_url}" --reason completed
              echo "Closed ${existing_issue_url}"
            fi
            exit 0
          fi

          if [ -n "${existing_issue_url}" ]; then
            gh issue comment "${existing_issue_url}" --body-file "${comment_file}"
            echo "Updated ${existing_issue_url}"
          else
            body_file="$(mktemp)"
            jq -r '.body' release-canary-incident.json > "${body_file}"
            gh issue create \
              --repo "${GITHUB_REPOSITORY}" \
              --title "$(jq -r '.title' release-canary-incident.json)" \
              --label "${label}" \
              --body-file "${body_file}"
          fi
