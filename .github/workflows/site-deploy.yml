name: Site Deploy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: preview rehearses on a local target, deploy publishes, rollback restores a retained generation
        required: true
        type: choice
        options:
          - preview
          - deploy
          - rollback
        default: preview
      rollback_receipt_run_id:
        description: run id of the site-deploy run whose receipt and artifact to restore (rollback only)
        required: false
        type: string
        default: ""
      rollback_phase:
        description: ui-first restores the explorer UI over the current snapshot, full restores the whole generation
        required: false
        type: choice
        options:
          - full
          - ui-first
        default: full
      bootstrap:
        description: allow a deploy when the newest github-pages deployment has no receipt, or when none has one
        required: false
        type: boolean
        default: false
      current_generation_unknown:
        description: rollback only, when the newest github-pages deployment has no receipt; current versions come from the live snapshot
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ inputs.mode == 'preview' && format('site-preview-{0}', github.run_id) || 'pages-deploy' }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      deployments: read
    outputs:
      action: ${{ steps.resolve.outputs.action }}
      trunk_sha: ${{ steps.resolve.outputs.trunk_sha }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_sha: ${{ steps.resolve.outputs.release_sha }}
      resolved_artifact: site-deploy-resolved-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Require develop for production modes
        if: inputs.mode != 'preview' && github.ref != 'refs/heads/develop'
        run: |
          echo "::error::deploy and rollback run only from develop"
          exit 1

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Resolve candidate and generation
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          ROLLBACK_RUN_ID: ${{ inputs.rollback_receipt_run_id }}
          ROLLBACK_PHASE: ${{ inputs.rollback_phase }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
          CURRENT_UNKNOWN: ${{ inputs.current_generation_unknown }}
        run: |
          set -euo pipefail
          args=(--mode "$MODE" --output out/resolved.json --rollback-phase "$ROLLBACK_PHASE")
          if [ "$MODE" = "rollback" ]; then
            case "$ROLLBACK_RUN_ID" in
              ''|*[!0-9]*) echo "::error::rollback needs a numeric rollback_receipt_run_id"; exit 1 ;;
            esac
            args+=(--rollback-run-id "$ROLLBACK_RUN_ID")
          fi
          if [ "$BOOTSTRAP" = "true" ]; then
            args+=(--bootstrap)
          fi
          if [ "$CURRENT_UNKNOWN" = "true" ]; then
            args+=(--current-unknown)
          fi
          python -m scripts.site_deploy resolve "${args[@]}"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: site-deploy-resolved-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/resolved.json
          if-no-files-found: ignore
          retention-days: 90

  build:
    needs: resolve
    if: needs.resolve.outputs.action == 'deploy' || (inputs.mode == 'preview' && needs.resolve.outputs.action == 'noop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      build_artifact: site-deploy-build-${{ github.run_id }}-${{ github.run_attempt }}
      site_artifact: site-deploy-artifact-${{ github.run_id }}-${{ github.run_attempt }}
      legacy_artifact: site-deploy-legacy-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      MODE: ${{ inputs.mode }}
      ROLLBACK_RUN_ID: ${{ inputs.rollback_receipt_run_id }}
      ROLLBACK_PHASE: ${{ inputs.rollback_phase }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.mode == 'rollback' && github.sha || needs.resolve.outputs.trunk_sha }}
          path: trunk
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        if: inputs.mode != 'rollback'
        with:
          ref: ${{ needs.resolve.outputs.release_sha }}
          path: release
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        if: inputs.mode != 'rollback'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: trunk/results-explorer/package-lock.json

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ${{ needs.resolve.outputs.resolved_artifact }}
          path: out

      - name: Install trunk dependencies
        working-directory: trunk
        run: uv sync --group dev

      - name: Build release documentation
        if: inputs.mode != 'rollback'
        working-directory: release
        run: |
          uv sync --group dev
          cd docs
          uv run sphinx-build -b html --keep-going . _build/html

      - name: Build trunk documentation
        if: inputs.mode != 'rollback'
        working-directory: trunk/docs
        run: uv run sphinx-build -b html --keep-going . _build/html

      - name: Build Results Explorer and snapshot
        if: inputs.mode != 'rollback'
        working-directory: trunk
        run: |
          set -euo pipefail
          (cd results-explorer && npm ci && npm run typecheck)
          uv run -- python _project/scripts/explorer_publish.py build --data-dir results-data/ --output results-explorer/public/data/
          test -s results-explorer/public/data/results.duckdb
          uv run -- python _project/scripts/results_explorer_snapshot_invariants.py results-explorer/public/data/results.duckdb
          (cd results-explorer && npm run build)

      - name: Assemble the single-ref site for the preview comparison
        if: inputs.mode == 'preview'
        working-directory: trunk
        run: uv run -- python scripts/assemble_public_site.py --site-dir ../site-legacy

      - name: Assemble routes
        if: inputs.mode != 'rollback'
        working-directory: trunk
        run: >-
          uv run -- python scripts/assemble_public_site.py
          --routes deploy/routes.yml
          --ref-root release=../release
          --ref-root trunk=.
          --site-dir ../site-build
          --work-dir ../routes-work
          --receipt-out ../out/route-assembly.json

      - name: Restore the retained generation
        if: inputs.mode == 'rollback'
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: trunk
        run: |
          set -euo pipefail
          python -m scripts.site_deploy fetch-run --run-id "$ROLLBACK_RUN_ID" --receipt-sha256 "$(jq -r '.rollback.receipt_sha256' out/resolved.json)" --receipt-dir restored/receipt --tree-dir restored/tree
          args=(--receipt restored/receipt/receipt.json --restored-tree restored/tree --phase "$ROLLBACK_PHASE" --resolved out/resolved.json --site-dir site-build --out-dir out)
          if [ "$ROLLBACK_PHASE" = "ui-first" ]; then
            current_run=$(jq -r '.deployed.run_id' out/resolved.json)
            python -m scripts.site_deploy fetch-run --run-id "$current_run" --receipt-sha256 "$(jq -r '.deployed.receipt_sha256' out/resolved.json)" --receipt-dir current/receipt --tree-dir current/tree
            args+=(--current-tree current/tree)
          fi
          python -m scripts.site_deploy rollback-prepare "${args[@]}"

      - name: Fetch the deployed snapshot
        run: |
          set -euo pipefail
          if [ "$(jq -r '.deployed != null' out/resolved.json)" = "true" ]; then
            curl -fsSL --retry 3 https://benchbox.dev/results/data/results.duckdb -o deployed.duckdb
          fi

      - name: Run gates
        working-directory: trunk
        run: |
          set -euo pipefail
          args=(--repo-root . --site-dir ../site-build --resolved ../out/resolved.json --assembly ../out/route-assembly.json --out-dir ../out)
          if [ -f ../deployed.duckdb ]; then
            args+=(--deployed-snapshot ../deployed.duckdb)
          fi
          if [ "$MODE" = "rollback" ]; then
            args+=(--corpus-sha "$(jq -r '.corpus_sha' ../out/restore.json)" --ui-version "$(jq -r '.ui_version' ../out/restore.json)")
          fi
          uv run -- python -m scripts.site_deploy gates "${args[@]}"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: site-deploy-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out
            !out/gate-work
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: site-deploy-artifact-${{ github.run_id }}-${{ github.run_attempt }}
          path: site-build
          include-hidden-files: true
          retention-days: 90

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: inputs.mode == 'preview'
        with:
          name: site-deploy-legacy-${{ github.run_id }}-${{ github.run_attempt }}
          path: site-legacy
          include-hidden-files: true
          retention-days: 7

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        if: inputs.mode != 'preview'
        with:
          path: site-build
          include-hidden-files: true

  deploy:
    needs: [resolve, build]
    if: inputs.mode != 'preview' && needs.resolve.outputs.action == 'deploy'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      actions: read
      deployments: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ${{ needs.resolve.outputs.resolved_artifact }}
          path: out

      - name: Recheck the deployed generation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.site_deploy recheck --resolved out/resolved.json

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

  probe:
    needs: [resolve, build, deploy]
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      deployments: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ${{ needs.build.outputs.build_artifact }}
          path: out

      - name: Probe production and write the receipt
        id: finalize
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ needs.build.outputs.site_artifact }}
        run: python -m scripts.site_deploy finalize --out-dir out --base-url https://benchbox.dev --artifact-name "$ARTIFACT_NAME"

      - name: Upload the receipt
        id: receipt_upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: site-deploy-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/receipt
          if-no-files-found: error
          retention-days: 90

      - name: Record the receipt on the deployment
        if: always() && steps.finalize.outcome == 'success' && steps.receipt_upload.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.site_deploy record --out-dir out --base-url https://benchbox.dev

  preview:
    needs: [resolve, build]
    if: inputs.mode == 'preview'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ${{ needs.build.outputs.build_artifact }}
          path: out

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ${{ needs.build.outputs.site_artifact }}
          path: site-build

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ${{ needs.build.outputs.legacy_artifact }}
          path: site-legacy

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run the preview drill
        run: uv run -- python -m scripts.site_deploy preview --site-dir site-build --legacy-site site-legacy --out-dir out --production-url https://benchbox.dev

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: site-deploy-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/preview-drill.json
            out/parity.json
            out/production-parity.json
            out/preview-receipts
            out/gates.json
            out/resolved.json
          if-no-files-found: ignore
          retention-days: 90
