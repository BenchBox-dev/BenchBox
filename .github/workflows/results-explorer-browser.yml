name: Results Explorer browser tests

on:
  push:
    # `develop` is included so the lane runs on the integration branch itself,
    # not only on PRs into it. Without it a squash-merge could land a
    # combination no PR ever exercised and develop would stay silently red
    # until the next explorer PR happened to rebuild.
    branches: [ release, develop ]
    paths:
      - 'results-explorer/**'
      - '_project/scripts/explorer_pipeline/**'
      - '_project/scripts/explorer_publish.py'
      - 'results-data/**'
      - '.github/workflows/results-explorer-browser.yml'
  pull_request:
    # Deliberately NO `paths:` filter. `Results Explorer browser gate` is a
    # required status check, and GitHub keeps a PR unmergeable forever waiting
    # on a required check that never reports. A path-filtered workflow simply
    # does not run, so it never reports, so every PR that touched nothing under
    # results-explorer/ would deadlock. The filtering moved into the
    # `explorer-changes` job below: the workflow always starts, the expensive
    # browser jobs skip when nothing relevant changed, and the gate job always
    # reports.
    branches: [ release, develop ]
  merge_group:
    branches: [ release, develop ]
  workflow_dispatch:

permissions:
  contents: read

# The browser suite is expensive - cancel superseded runs on the same branch.
concurrency:
  group: results-explorer-browser-${{ github.event_name == 'merge_group' && github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Replaces the `on.pull_request.paths` filter this workflow used to carry.
  # Same allowlist, evaluated as a job so the workflow always starts and the
  # required gate job below can always report a conclusion.
  explorer-changes:
    name: explorer-changes
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.detect.outputs.needed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Detect explorer-relevant changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          # Anything that is not a pull_request or merge_group (push, workflow_dispatch)
          # already passed the `on.push.paths` filter or was requested by hand,
          # so it always runs the suite.
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ github.event_name }}" != "merge_group" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA"...HEAD -- \
            'results-explorer/**' \
            '_project/scripts/explorer_pipeline/**' \
            '_project/scripts/explorer_publish.py' \
            'results-data/**' \
            '.github/workflows/results-explorer-browser.yml')
          if [ -n "$changed" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "explorer-relevant changed paths:"
          echo "${changed:-<none>}"

  # Develop-push certification: when the pushed SHA is queue-certified
  # (the merge queue already passed this exact tree, including its own
  # browser gate), the push re-run of the browser suite skips.
  # Always runs: downstream jobs read these outputs on every event, and
  # references to a skipped job's outputs do not evaluate reliably. The
  # script returns certified=false without any API call unless this is a
  # push to develop, so every other event runs the suite when needed.
  queue-certification:
    name: queue-certification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      certified: ${{ steps.certify.outputs.certified }}
      certifying_run_id: ${{ steps.certify.outputs.certifying_run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}

      - name: Look up merge-queue certification with browser gate
        id: certify
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Bare python is intentional: the lookup is stdlib-only and always
          # exits 0 (fail open), so this step never reds the workflow itself.
          python scripts/queue_certification.py \
            --sha "$TARGET_SHA" \
            --require-browser-gate \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

  # Blocking gate: Chromium runs the full suite. Every acceptance path
  # asserted in `results-explorer/e2e/` must stay green for the PR to merge.
  chromium:
    name: Chromium (full suite, blocking)
    needs: [ explorer-changes, queue-certification ]
    if: ${{ needs.explorer-changes.outputs.needed == 'true' && needs.queue-certification.outputs.certified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: results-explorer/package-lock.json

      - name: Install explorer dependencies
        run: npm ci
        working-directory: results-explorer

      - name: Typecheck explorer e2e harness
        run: npm run typecheck:e2e
        working-directory: results-explorer

      - name: Audit frontend dependencies
        run: npm run audit:high
        working-directory: results-explorer

      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('results-explorer/package-lock.json') }}

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium
        working-directory: results-explorer

      - name: Run Chromium suite
        # Shared deterministic entrypoint: regenerate fixtures, rebuild dist,
        # then run the blocking Chromium project against the real server.
        run: npm run test:e2e:chromium
        working-directory: results-explorer

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-report-chromium
          path: |
            results-explorer/playwright-report
            results-explorer/test-results
          if-no-files-found: ignore
          retention-days: 3

  # Non-blocking: Firefox runs the `@smoke` subset. Graduates to blocking
  # once flake data supports it (tracked by w9 of the parent TODO).
  firefox-smoke:
    name: Firefox (@smoke, non-blocking)
    needs: [ explorer-changes, queue-certification ]
    if: ${{ needs.explorer-changes.outputs.needed == 'true' && needs.queue-certification.outputs.certified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: results-explorer/package-lock.json

      - name: Install explorer dependencies
        run: npm ci
        working-directory: results-explorer

      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-firefox-${{ hashFiles('results-explorer/package-lock.json') }}

      - name: Install Playwright (Firefox)
        run: npx playwright install --with-deps firefox
        working-directory: results-explorer

      - name: Run Firefox smoke
        # Shared deterministic entrypoint: regenerate fixtures, rebuild dist,
        # then run the firefox project scoped to `@smoke` by Playwright config.
        run: npm run test:e2e:firefox
        working-directory: results-explorer

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-report-firefox
          path: |
            results-explorer/playwright-report
            results-explorer/test-results
          if-no-files-found: ignore
          retention-days: 3

  # Non-blocking: WebKit runs the `@smoke` subset. Graduates to blocking
  # once flake data supports it (tracked by w9 of the parent TODO).
  webkit-smoke:
    name: WebKit (@smoke, non-blocking)
    needs: [ explorer-changes, queue-certification ]
    if: ${{ needs.explorer-changes.outputs.needed == 'true' && needs.queue-certification.outputs.certified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: results-explorer/package-lock.json

      - name: Install explorer dependencies
        run: npm ci
        working-directory: results-explorer

      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-webkit-${{ hashFiles('results-explorer/package-lock.json') }}

      - name: Install Playwright (WebKit)
        run: npx playwright install --with-deps webkit
        working-directory: results-explorer

      - name: Run WebKit smoke
        # Shared deterministic entrypoint: regenerate fixtures, rebuild dist,
        # then run the webkit project scoped to `@smoke` by Playwright config.
        run: npm run test:e2e:webkit
        working-directory: results-explorer

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-report-webkit
          path: |
            results-explorer/playwright-report
            results-explorer/test-results
          if-no-files-found: ignore
          retention-days: 3

  # The single required status check for this workflow.
  #
  # It exists because the browser jobs are conditional: a required check that
  # never reports leaves a PR permanently unmergeable, so the thing GitHub
  # gates on must always run and always reach a conclusion. Chromium's own job
  # cannot do that - it is skipped on PRs that touch nothing relevant.
  #
  # Firefox and WebKit are deliberately absent from `needs`. They are advisory
  # (`continue-on-error: true`) and graduate individually per
  # docs/operations/browser-ci.md; wiring them here would promote them to
  # blocking as a silent side effect.
  browser-required-result:
    name: Results Explorer browser gate
    needs: [ explorer-changes, chromium, queue-certification ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Aggregate browser gate result
        env:
          CHANGES_RESULT: ${{ needs.explorer-changes.result }}
          CHROMIUM_RESULT: ${{ needs.chromium.result }}
          NEEDED: ${{ needs.explorer-changes.outputs.needed }}
          CERTIFIED: ${{ needs.queue-certification.outputs.certified }}
          CERTIFYING_RUN_ID: ${{ needs.queue-certification.outputs.certifying_run_id }}
        run: |
          python _project/scripts/browser_gate_aggregate.py
