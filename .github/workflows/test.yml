name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (ubuntu-latest, 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run linting
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run -- python scripts/check_windows_antipatterns.py

      - name: Run type checking
        run: |
          uv run ty check

      - name: Run fast tests
        run: |
          # -p pytest_cov re-enables coverage plugin (disabled by default in pytest.ini)
          uv run -- python -m pytest tests -m "fast and not (slow or stress or resource_heavy or live_integration)" --tb=short -p pytest_cov --cov=benchbox --cov-report=xml --cov-report=term-missing --cov-fail-under=70

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false  # Don't fail CI if Codecov upload fails (token may not be configured)
          token: ${{ secrets.CODECOV_TOKEN }}

  compat-test:
    name: compat-test (${{ matrix.os }}, ${{ matrix.python-version }})
    if: ${{ (github.event_name != 'pull_request' || github.base_ref != 'develop') && (github.event_name != 'pull_request' || github.base_ref != 'main' || !startsWith(github.head_ref, 'v')) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Additional compatibility coverage for main/push surfaces.
        # Develop PRs keep only the required Ubuntu 3.12 test job; broad
        # validation is covered by nightly/manual workflows.
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.10'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run linting
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run -- python scripts/check_windows_antipatterns.py

      - name: Run type checking
        run: |
          uv run ty check

      - name: Run fast tests
        run: |
          # -p pytest_cov re-enables coverage plugin (disabled by default in pytest.ini)
          uv run -- python -m pytest tests -m "fast and not (slow or stress or resource_heavy or live_integration)" --tb=short -p pytest_cov --cov=benchbox --cov-report=xml --cov-report=term-missing --cov-fail-under=70

  # Check for unsafe patch() string paths in test files.
  # Catches the pattern patch("benchbox.cli.commands.<module>.<attr>") where
  # <module> is re-exported by __init__.py under the same name, shadowing the
  # submodule and causing Python 3.10 failures or order-dependent 3.12 passes.
  check-test-patterns:
    if: ${{ github.event_name != 'pull_request' || github.base_ref != 'develop' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run patch safety check
        # Bare python is intentional: this job skips uv setup for speed since
        # check_patch_safety.py is stdlib-only (no third-party imports).
        run: python scripts/check_patch_safety.py

  # Security audit
  security:
    if: ${{ github.event_name != 'pull_request' || github.base_ref != 'develop' }}
    runs-on: ubuntu-latest
    env:
      # Comma-separated GHSA/CVE IDs for temporarily accepted false positives.
      # Keep empty unless triage is documented in the TODO item.
      # PYSEC-2026-87 (lxml): redshift-connector==2.1.13 pins lxml<=6.0.2, so
      # the fixed lxml 6.1.0 can't be resolved until upstream relaxes that
      # bound. See _project/TODO/main/planning/lxml-cve-pysec-2026-87-blocked-by-redshift-connector.yaml
      PIP_AUDIT_IGNORE_VULNS: "PYSEC-2026-87"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run security audit
        run: |
          if [ -n "${PIP_AUDIT_IGNORE_VULNS}" ]; then
            IGNORE_ARGS=$(printf '%s' "${PIP_AUDIT_IGNORE_VULNS}" | tr ',' '\n' | sed '/^$/d;s/^[[:space:]]*//;s/[[:space:]]*$//;/^$/d;s/^/--ignore-vuln /' | tr '\n' ' ')
            uvx pip-audit ${IGNORE_ARGS}
          else
            uvx pip-audit
          fi

  # Quick integration smoke tests - non-required on main/push; develop broad
  # validation runs through nightly/manual workflows.
  integration-smoke:
    if: ${{ (github.event_name != 'pull_request' || github.base_ref != 'develop') && (github.event_name != 'pull_request' || github.base_ref != 'main' || !startsWith(github.head_ref, 'v')) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run integration smoke tests
        run: |
          # Run platform smoke tests and fast integration tests (~46 tests)
          # These don't require external credentials and catch common issues
          uv run -- python -m pytest tests/integration -m "platform_smoke or (integration and fast)" --tb=short

  # Table-format dependency lane for main/push validation.
  # Nightly/manual workflows cover this lane for develop after Step 3.
  integration-table-formats:
    if: ${{ github.event_name != 'pull_request' || github.base_ref != 'develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run table-format integration tests
        run: |
          uv run -- python -m pytest -q tests/integration/core/data_organization/test_presorted_generation.py -m "requires_table_formats" --tb=short

  # Credential-free integration suite - release-required for main PRs and runs on main pushes.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run integration tests
        run: |
          uv run -- python -m pytest tests/integration -m "integration and not (slow or stress or resource_heavy or live_integration)" --tb=short --maxfail=5 --timeout=300

  correctness-gate:
    name: correctness-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run bounded real-result correctness gate
        run: make test-correctness-gate

  # Package build and install test — builds a fresh wheel from this branch to verify
  # the package is importable and the CLI entry point resolves. This is an independent
  # build from the wheel published by release.yml; it validates pre-merge correctness,
  # not artifact identity.
  test-package:
    if: ${{ github.event_name != 'pull_request' || github.base_ref != 'develop' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build package
        run: |
          uv build

      - name: Test package installation
        shell: bash
        run: |
          set -euo pipefail
          # Use bash on all platforms so glob expansion works cross-platform.
          # GitHub Actions Windows runners have Git Bash available.
          wheel_count=$(find dist -maxdepth 1 -name '*.whl' | wc -l | tr -d '[:space:]')
          if [ "$wheel_count" != "1" ]; then
            echo "::error::Expected exactly one wheel, found $wheel_count"
            find dist -maxdepth 1 -type f -print
            exit 1
          fi
          wheel=$(find "$PWD/dist" -maxdepth 1 -name '*.whl' -print -quit)
          tmpdir=$(mktemp -d)
          cd "$tmpdir"
          # Minimal-surface gate: a clean core install must import benchbox AND
          # must not pull pandas (optional engine/DataFrame dep). This is the
          # contract whose absence let v0.3.0 ship a broken clean install.
          uv run --isolated --no-project --with "$wheel" -- python -c "import importlib.util; import benchbox; assert importlib.util.find_spec('pandas') is None, 'core install must not pull pandas'; print('Package installation successful (minimal import surface)')"
          uv run --isolated --no-project --with "$wheel" -- benchbox --help

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-build-dist-${{ matrix.os }}
          path: dist/
          retention-days: 7  # Shorter retention for test artifacts

  release-readiness:
    name: release-readiness
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Check dependency upper bounds
        run: |
          mkdir -p release-artifacts
          uv run -- python scripts/check_dependency_bounds.py \
            --fail-on=cap-reached \
            --output release-artifacts/dependency-bounds.md

      - name: Check release branch curation
        run: |
          missing=0
          for forbidden in \
            _project \
            _blog \
            results-data \
            results-explorer \
            .claude \
            .codex \
            .gemini \
            .pre-commit-config.yaml \
            _benchbox_pytest_xdist_safety.py \
            todo.config.yaml \
            skill-sync.yaml \
            skill-sync.lock \
            .coveragerc_core \
            .dockerignore \
            .env.example \
            .mcp.json \
            AGENTS.md \
            CLAUDE.md \
            GEMINI.md \
            .github/workflows/results-explorer-browser.yml \
            .github/workflows/seed-corpus.yml \
            .github/workflows/sync-results-data-to-published.yml \
            .github/workflows/validate-submission.yml; do
            if [ -e "$forbidden" ]; then
              echo "::error::Release branch still contains curated path: $forbidden"
              missing=1
            fi
          done
          exit "$missing"

      - name: Upload dependency bounds report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-pr-dependency-bounds
          path: release-artifacts/dependency-bounds.md
          retention-days: 30

  release-required-result:
    name: release-required-result
    needs: [test, integration, correctness-gate, test-package, release-readiness]
    if: ${{ always() && github.event_name == 'pull_request' && github.base_ref == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate release-required result
        env:
          FAST_TEST_RESULT: ${{ needs.test.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          CORRECTNESS_RESULT: ${{ needs.correctness-gate.result }}
          PACKAGE_RESULT: ${{ needs.test-package.result }}
          RELEASE_READINESS_RESULT: ${{ needs.release-readiness.result }}
        run: |
          set -euo pipefail

          failed=0
          for pair in \
            "test (ubuntu-latest, 3.12)=$FAST_TEST_RESULT" \
            "integration=$INTEGRATION_RESULT" \
            "correctness-gate=$CORRECTNESS_RESULT" \
            "test-package=$PACKAGE_RESULT" \
            "release-readiness=$RELEASE_READINESS_RESULT"; do
            name="${pair%%=*}"
            result="${pair#*=}"
            if [ "$result" != "success" ]; then
              echo "$name=$result"
              failed=1
            fi
          done

          if [ "$failed" != "0" ]; then
            exit 1
          fi

          echo "Release-required checks passed."

  # CLI↔explorer visualization parity check.
  # Verifies that the checked-in JSON fixtures in tests/parity/fixtures/
  # match the current Python implementations, AND that the Vitest suite passes.
  # Skipped on Release v* PRs (curation + version bumps don't change fixtures).
  parity:
    if: ${{ (github.event_name != 'pull_request' || github.base_ref != 'develop') && (github.event_name != 'pull_request' || !startsWith(github.event.pull_request.title, 'Release v')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect results explorer
        id: explorer
        shell: bash
        run: |
          if [ -f results-explorer/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "results-explorer is absent; skipping explorer parity."
          fi

      - name: Set up Python
        if: steps.explorer.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        if: steps.explorer.outputs.present == 'true'
        uses: astral-sh/setup-uv@v4

      - name: Set up Node.js
        if: steps.explorer.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        if: steps.explorer.outputs.present == 'true'
        run: uv sync --group dev

      - name: Install Node dependencies
        if: steps.explorer.outputs.present == 'true'
        run: npm ci
        working-directory: results-explorer

      - name: Verify parity fixtures match Python source
        if: steps.explorer.outputs.present == 'true'
        run: make parity-check

      - name: Run Vitest parity suite
        if: steps.explorer.outputs.present == 'true'
        run: npm test -- --reporter=verbose
        working-directory: results-explorer

  # PySpark tests - requires Java, runs separately
  # Non-blocking: PySpark setup can be fragile
  pyspark-tests:
    if: ${{ github.event_name != 'pull_request' || github.base_ref != 'develop' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run PySpark tests
        run: |
          make test-pyspark
