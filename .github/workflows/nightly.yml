name: Nightly Validation

env:
  BENCHBOX_TEST_LOCK_WAIT_SECONDS: "0"
  BENCHBOX_TEST_TIER: t1

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: nightly-validation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: >-
      test (${{ matrix.os }}, ${{ matrix.python-version }})${{
      matrix.os == 'windows-latest' && ' (quarantine #2568)' || '' }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # Full compatibility matrix kept out of routine develop PRs.
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.11'

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run linting
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run -- python scripts/check_windows_antipatterns.py

      - name: Run type checking
        run: |
          uv run ty check

      - name: Run fast tests
        run: |
          # -p pytest_cov re-enables coverage plugin (disabled by default in pytest.ini)
          uv run -- python -m pytest tests -m "fast and not (slow or stress or resource_heavy or live_integration)" --tb=short --timeout=120 -p pytest_cov --cov=benchbox --cov-report=xml --cov-report=term-missing --cov-fail-under=70 --junitxml=junit-fast.xml

      - name: Upload fast test duration report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: fast-junit-report
          path: junit-fast.xml
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  slow-tier-observation:
    name: Slow tier observation
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    env:
      BENCHBOX_TEST_TIER: t3
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Report slow module coverage
        run: uv run -- python _project/scripts/report_slow_test_coverage.py

      - name: Observe non-credentialed slow tests
        run: |
          uv run -- python -m pytest tests -m "slow and not (stress or resource_heavy or live_integration)" -n 0 --tb=short --timeout=1200 --durations=20 --junitxml=junit-t3-slow.xml

      - name: Download fast test duration report
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: fast-junit-report
          path: duration-inputs
        continue-on-error: true

      - name: Refresh test duration artifact
        if: success()
        run: |
          test -f duration-inputs/junit-fast.xml
          test -f junit-t3-slow.xml
          uv run -- python _project/scripts/update_test_durations.py \
            --input duration-inputs/junit-fast.xml \
            --input junit-t3-slow.xml

      - name: Upload duration report and artifact
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: t3-test-durations
          path: |
            junit-t3-slow.xml
            duration-inputs/junit-fast.xml
            tests/fixtures/test_durations.json
          if-no-files-found: ignore

  duckdb-preview:
    name: DuckDB 2.0 preview compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # DuckDB packages the 2.0 alpha engine in the 1.6 Python preview series.
      DUCKDB_PREVIEW_VERSION: 1.6.0.dev379
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install BenchBox and the pinned DuckDB preview
        run: |
          uv sync --group dev --extra duckdb
          uv pip install --upgrade --prerelease=allow "duckdb==${DUCKDB_PREVIEW_VERSION}"

      - name: Verify preview identity
        run: |
          uv run --no-sync -- python - <<'PY'
          import os

          import duckdb

          package_version = duckdb.__version__
          engine_version = duckdb.connect(":memory:").execute("SELECT version()").fetchone()[0]
          print(f"DuckDB Python package: {package_version}")
          print(f"DuckDB engine: {engine_version}")
          if package_version != os.environ["DUCKDB_PREVIEW_VERSION"] or not engine_version.startswith("v2.0.0-"):
              raise SystemExit("installed DuckDB preview identity does not match the pinned 2.0 preview")
          PY

      - name: Run DuckDB compatibility suite
        run: |
          uv run --no-sync -- python -m pytest \
            tests/unit/core/query_plans/parsers/test_duckdb_parser_versions.py \
            tests/unit/platforms/test_duckdb_adapter.py \
            tests/unit/platforms/test_duckdb_behavioral.py \
            tests/unit/platforms/test_duckdb_introspection.py \
            tests/unit/platforms/test_duckdb_operations.py \
            tests/unit/platforms/test_duckdb_plan_capture.py \
            tests/unit/platforms/test_duckdb_real_connection.py \
            tests/unit/platforms/test_duckdb_sorted_loading.py \
            tests/unit/platforms/test_ducklake_adapter.py \
            tests/integration/test_duckdb_integration.py \
            tests/integration/test_ducklake_integration.py \
            -m "not live_integration" -n 0 --tb=short

  binary-framing:
    # Exercise each bundled TPC-H dbgen binary the runner can natively execute
    # and assert its rows carry no trailing '|' (-DEOL_HANDLING convention, see
    # PR #1056/#1069). The test skips foreign-arch binaries per-binary, so the
    # ubuntu/macos/windows runners together cover linux-x86_64, darwin-arm64,
    # windows-x86_64 and windows-arm64 (an x86_64 PE) natively. This is the only
    # lane that runs the slow framing guard, so binary drift is caught here.
    name: TPC-H binary framing guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv sync --group dev

      - name: Verify bundled dbgen binaries emit clean framing
        run: |
          uv run -- python -m pytest tests/unit/core/tpch/test_tpch_dbgen_framing_binaries.py -m slow -v

  check-test-patterns:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Run patch safety check
        run: uv run -- python scripts/check_patch_safety.py

  security:
    runs-on: ubuntu-latest
    env:
      # Comma-separated GHSA/CVE IDs for temporarily accepted false positives.
      # Keep empty unless triage is documented in the TODO item.
      PIP_AUDIT_IGNORE_VULNS: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run security audit
        run: |
          if [ -n "${PIP_AUDIT_IGNORE_VULNS}" ]; then
            IGNORE_ARGS=$(printf '%s' "${PIP_AUDIT_IGNORE_VULNS}" | tr ',' '\n' | sed '/^$/d;s/^[[:space:]]*//;s/[[:space:]]*$//;/^$/d;s/^/--ignore-vuln /' | tr '\n' ' ')
            uvx pip-audit ${IGNORE_ARGS}
          else
            uvx pip-audit
          fi

  sqlglot-generator:
    name: SQLGlot generated translation pilot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Validate generated-case disposition policy
        run: >-
          uv run -- python scripts/check_sqlglot_generator_known_failures.py
          --policy _project/sqlglot-upstream/generator-policy.json

      - name: Run deterministic generated translation cases
        id: generator
        shell: bash
        env:
          FAILURE_ARTIFACT: ${{ runner.temp }}/sqlglot-generator-failure.json
          SUMMARY_ARTIFACT: ${{ runner.temp }}/sqlglot-generator-summary.json
        run: |
          set +e
          uv run -- python _project/sqlglot-upstream/repros/generator.py \
            --seed "${GITHUB_RUN_ID}" \
            --source-dialect postgres \
            --target-dialect duckdb \
            --cases 1024 \
            --deadline-seconds 300 \
            --failure-artifact "${FAILURE_ARTIFACT}" \
            --summary-artifact "${SUMMARY_ARTIFACT}"
          status=$?
          set -e

          if [ "${status}" -eq 1 ]; then
            uv run -- python _project/sqlglot-upstream/repros/generator.py \
              --seed "${GITHUB_RUN_ID}" \
              --source-dialect postgres \
              --target-dialect duckdb \
              --failure-artifact "${FAILURE_ARTIFACT}" \
              --summary-artifact "${SUMMARY_ARTIFACT}" \
              --validate-advisory-evidence
            echo "::warning::SQLGlot generated translation case discovered; replay artifact uploaded and nightly remains red."
            exit "${status}"
          fi
          if [ "${status}" -ne 0 ]; then
            echo "::error::SQLGlot generator infrastructure or contract failure (exit ${status})."
            exit "${status}"
          fi

      - name: Upload generated translation evidence
        if: ${{ !cancelled() && steps.generator.outcome != 'skipped' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sqlglot-generator-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sqlglot-generator-summary.json
            ${{ runner.temp }}/sqlglot-generator-failure.json
          if-no-files-found: warn
          retention-days: 14

  integration-smoke:
    name: >-
      integration-smoke (${{ matrix.os }}, ${{ matrix.python-version }})${{
      matrix.os == 'windows-latest' && ' (quarantine #2569)' || '' }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    env:
      BENCHBOX_TEST_TIER: t2
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run integration smoke tests
        run: |
          uv run -- python -m pytest tests/integration -m "platform_smoke or (integration and fast)" --tb=short

  integration-table-formats:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BENCHBOX_TEST_TIER: t2
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run table-format integration tests
        run: |
          uv run -- python -m pytest -q tests/integration/core/data_organization/test_presorted_generation.py -m "requires_table_formats" --tb=short

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BENCHBOX_TEST_TIER: t3
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: benchbox
          POSTGRES_PASSWORD: benchbox
          POSTGRES_DB: benchbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Wait for PostgreSQL service to be reachable
        run: |
          # The live tests skip via skip_unless_docker_service when localhost:5432
          # is unreachable, and pytest exits 0 on an all-skipped run. That would
          # turn this REQUIRED gate green without ever exercising PostgreSQL plan
          # capture. Fail the step outright if the service container never came up.
          for attempt in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U benchbox >/dev/null 2>&1; then
              echo "PostgreSQL is reachable."
              exit 0
            fi
            echo "Waiting for PostgreSQL (attempt ${attempt}/30)..."
            sleep 2
          done
          echo "::error::PostgreSQL service never became reachable on localhost:5432; the live integration gate cannot be skipped silently."
          exit 1

      - name: Run PostgreSQL live integration tests
        run: |
          # --no-header keeps the summary line parseable; -p no:cacheprovider
          # avoids a stale cache masking collection. The grep guard fails the
          # step when the run collected/ran nothing but skips (e.g. every test
          # skipped despite a reachable service), so an all-skipped run cannot
          # green this required gate.
          set -o pipefail
          uv run -- python -m pytest tests/integration/platforms/test_postgresql_live.py \
            -m "live_postgresql" --tb=short -v -p no:cacheprovider \
            | tee /tmp/pg_live_output.txt
          if ! grep -Eq '[0-9]+ passed' /tmp/pg_live_output.txt; then
            echo "::error::PostgreSQL live integration tests produced no passing tests (all skipped or none collected); refusing to pass the gate."
            exit 1
          fi

  cloud-live-plan-capture:
    # Nightly-only live plan-capture verification for Snowflake, BigQuery,
    # Redshift, and MotherDuck.
    # The selected test classes run trivial SELECT 1 queries only (0 bytes
    # scanned on BigQuery, per-second XS warehouse floor on Snowflake, trivial
    # compute on Redshift and MotherDuck), so this job stays inside free-tier /
    # trial budgets. Unlike the postgres-integration gate above, an all-skipped
    # run stays green: until the cloud secrets below are configured, there are
    # no credentials and every test skips. Never move this to ci.yml:
    # PR-triggered cloud queries from arbitrary branches incur uncontrolled
    # billing.
    # Expected secret names match the env vars the conftest fixtures read:
    # REDSHIFT_HOST, REDSHIFT_USER, REDSHIFT_PASSWORD,
    # REDSHIFT_DATABASE (default "dev"), REDSHIFT_PORT (default "5439"),
    # MOTHERDUCK_TOKEN, MOTHERDUCK_DATABASE (default "benchbox_test").
    # Adding the secret values themselves is a repo-admin action outside the
    # PR; do not echo secret values in any step.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BENCHBOX_TEST_TIER: t3
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USERNAME: ${{ secrets.SNOWFLAKE_USERNAME }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
      BIGQUERY_PROJECT: ${{ secrets.BIGQUERY_PROJECT }}
      BIGQUERY_DATASET: ${{ secrets.BIGQUERY_DATASET }}
      REDSHIFT_HOST: ${{ secrets.REDSHIFT_HOST }}
      REDSHIFT_PORT: ${{ secrets.REDSHIFT_PORT || 5439 }}
      REDSHIFT_USER: ${{ secrets.REDSHIFT_USER }}
      REDSHIFT_PASSWORD: ${{ secrets.REDSHIFT_PASSWORD }}
      REDSHIFT_DATABASE: ${{ secrets.REDSHIFT_DATABASE }}
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      MOTHERDUCK_DATABASE: ${{ secrets.MOTHERDUCK_DATABASE || 'benchbox_test' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        run: |
          uv sync --group dev --extra snowflake --extra bigquery --extra redshift --extra duckdb

      - name: Write GCP service account key to temp file
        # BigQuery needs a file-based credential. The secret must hold the raw
        # JSON key content (not base64); it is never echoed, printed, or
        # uploaded as an artifact, living only in a runner temp file with
        # restrictive permissions for this job's run.
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -n "${GCP_SERVICE_ACCOUNT_KEY}" ]; then
            key_file="${RUNNER_TEMP}/gcp-service-account-key.json"
            printf '%s' "${GCP_SERVICE_ACCOUNT_KEY}" > "${key_file}"
            chmod 600 "${key_file}"
            echo "GOOGLE_APPLICATION_CREDENTIALS=${key_file}" >> "${GITHUB_ENV}"
          else
            echo "No GCP service account key configured; BigQuery tests will skip."
          fi

      - name: Run Snowflake, BigQuery, Redshift, and MotherDuck plan-capture live tests
        run: |
          # Only the plan-capture classes are selected as node ids -- never the
          # whole live modules, which would also run the heavy TPC-H load /
          # S3 COPY / warehouse-cost tests and break the billing guardrails.
          # The -m filter keeps selection to live-marked tests within those
          # classes; it is not a backstop for drifted node ids (a renamed
          # class fails loudly with exit code 4 instead of falling back to
          # marker selection). Skipping without credentials comes from the
          # modules' own skip conditions, which keep an unconfigured run
          # green.
          uv run -- python -m pytest \
            "tests/integration/platforms/test_snowflake_live.py::TestLiveSnowflakeQueryPlanCapture" \
            "tests/integration/platforms/test_bigquery_live.py::TestLiveBigQueryQueryPlanCapture" \
            "tests/integration/platforms/test_redshift_live.py::TestLiveRedshiftQueryPlanCapture" \
            "tests/integration/platforms/test_motherduck_live.py::TestLiveMotherDuckQueryPlanCapture" \
            -m "live_snowflake or live_bigquery or live_redshift or live_motherduck" --tb=short -v -p no:cacheprovider

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BENCHBOX_TEST_TIER: t2
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run integration tests
        run: |
          uv run -- python -m pytest tests/integration -m "integration and not (slow or stress or resource_heavy or live_integration)" --tb=short --maxfail=5 --timeout=300

  test-package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Build package
        run: |
          uv build

      - name: Test package installation
        shell: bash
        run: |
          set -euo pipefail
          wheel_count=$(find dist -maxdepth 1 -name '*.whl' | wc -l | tr -d '[:space:]')
          if [ "$wheel_count" != "1" ]; then
            echo "::error::Expected exactly one wheel, found $wheel_count"
            find dist -maxdepth 1 -type f -print
            exit 1
          fi
          wheel=$(find "$PWD/dist" -maxdepth 1 -name '*.whl' -print -quit)
          tmpdir=$(mktemp -d)
          cd "$tmpdir"
          # Minimal-surface gate: a clean core install must import benchbox AND
          # must not pull pandas (optional engine/DataFrame dep). This is the
          # contract whose absence let v0.3.0 ship a broken clean install.
          uv run --isolated --no-project --with "$wheel" -- python -c "import importlib.util; import benchbox; assert importlib.util.find_spec('pandas') is None, 'core install must not pull pandas'; print('Package installation successful (minimal import surface)')"
          uv run --isolated --no-project --with "$wheel" -- benchbox --help

      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nightly-test-build-dist-${{ matrix.os }}
          path: dist/
          retention-days: 7

  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Detect results explorer
        id: explorer
        shell: bash
        run: |
          if [ -f results-explorer/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "results-explorer is absent; skipping explorer parity."
          fi

      - name: Set up Python
        if: steps.explorer.outputs.present == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install uv
        if: steps.explorer.outputs.present == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Set up Node.js
        if: steps.explorer.outputs.present == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'

      - name: Install Python dependencies
        if: steps.explorer.outputs.present == 'true'
        run: uv sync --group dev

      - name: Install Node dependencies
        if: steps.explorer.outputs.present == 'true'
        run: npm ci
        working-directory: results-explorer

      - name: Audit frontend dependencies
        if: steps.explorer.outputs.present == 'true'
        run: npm run audit:high
        working-directory: results-explorer

      - name: Verify parity fixtures match Python source
        if: steps.explorer.outputs.present == 'true'
        run: make parity-check

      - name: Run Vitest parity suite
        if: steps.explorer.outputs.present == 'true'
        run: npm test -- --reporter=verbose
        working-directory: results-explorer

  website-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Detect website
        id: website
        shell: bash
        run: |
          if [ -f website/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "website is absent; skipping website audit."
          fi

      - name: Set up Node.js
        if: steps.website.outputs.present == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'

      - name: Install website dependencies
        if: steps.website.outputs.present == 'true'
        run: npm ci
        working-directory: website

      - name: Audit website dependencies
        if: steps.website.outputs.present == 'true'
        run: npm run audit:high
        working-directory: website

  scheduled-workflow-liveness:
    name: "scheduled-workflow-liveness (quarantine #2570)"
    # Guard for the release-canary-scheduled-activation TODO's failure class:
    # a workflow that declares `on.schedule` but is not on the DEFAULT branch
    # never registers and never runs — nothing red appears anywhere (this is
    # exactly how release-canary.yml sat dead while the repo's safety story
    # leaned on it). This job scans the DEVELOP tree (where scheduled
    # workflows are authored) and fails when any of them has no SCHEDULED
    # run within its cadence-derived window. Scheduled workflows execute from
    # the DEFAULT branch (develop, as of the 2026-07-08 default-branch switch),
    # which is where they are authored, so this guard is effective as soon as a
    # scheduled workflow merges to develop — there is no "until it lands on the
    # release branch" lag anymore. (Before the switch the default was main, so
    # a workflow stayed dark until a release carried it there; that gap is gone.)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout develop (scheduled workflows are authored there first)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: develop

      - name: Assert every scheduled workflow in the tree has a recent scheduled run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Bare python3 is intentional: stdlib-only, no uv sync needed for a
        # pure API check (same precedent as ci.yml's path classifier). The
        # schedule detection regex is scoped to the `on:` block to stay
        # stdlib-only without a YAML parser.
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          wf_dir = Path(os.environ.get("WORKFLOWS_DIR", ".github/workflows"))
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ.get("GITHUB_TOKEN", "")
          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")

          # `on:` block = from a top-level `on:` line to the next top-level key.
          on_block_re = re.compile(r"(?ms)^(?:\"on\"|'on'|on):[^\n]*\n(.*?)(?=^\S|\Z)")
          schedule_re = re.compile(r"(?m)^ {1,4}schedule:\s*(#.*)?$")
          cron_re = re.compile(r"(?m)^\s*-\s*cron:\s*['\"]?([^'\"#\n]+)")

          def cadence_window_days(cron_exprs: list[str]) -> int:
              """Generous liveness window from the most frequent cron.

              Daily-or-better -> 3 days; weekly (day-of-week bound) -> 9;
              monthly (day-of-month bound) -> 35; sparser (month bound,
              e.g. quarterly) -> 100. Coarse on purpose: this guard flags
              dead schedules, it does not audit punctuality.
              """
              windows = []
              for expr in cron_exprs:
                  fields = expr.split()
                  if len(fields) != 5:
                      continue
                  _minute, _hour, dom, month, dow = fields
                  if month != "*":
                      windows.append(100)
                  elif dom != "*":
                      windows.append(35)
                  elif dow != "*":
                      windows.append(9)
                  else:
                      windows.append(3)
              return min(windows) if windows else 3

          def latest_scheduled_run(workflow_file: str):
              """Latest schedule-event run, [] if none, None-sentinel via ValueError."""
              url = (
                  f"{api}/repos/{repo}/actions/workflows/{workflow_file}/runs"
                  "?per_page=1&event=schedule"
              )
              headers = {
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "benchbox-scheduled-workflow-liveness",
              }
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              last_err = None
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as resp:
                          return json.load(resp).get("workflow_runs", [])
                  except urllib.error.HTTPError as err:
                      if err.code == 404:
                          # Never registered => never ran (absent from default branch).
                          return []
                      if err.code in (401, 403):
                          print(f"::error::GitHub API auth/rate-limit failure ({err.code}) for {url}; cannot assess liveness.")
                          sys.exit(1)
                      last_err = err
                  except urllib.error.URLError as err:
                      last_err = err
                  time.sleep(5 * (attempt + 1))
              print(f"::error::GitHub API unreachable after retries for {url}: {last_err}")
              sys.exit(1)

          def _api_json(url: str):
              """GET *url* as JSON, or None on any failure.

              Every caller is a grace path: a failure here must never crash the
              liveness job, only decline to relax it.
              """
              headers = {
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "benchbox-scheduled-workflow-liveness",
              }
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as resp:
                      return json.load(resp)
              except (urllib.error.HTTPError, urllib.error.URLError, ValueError):
                  return None

          def _parse_ts(value):
              if not value:
                  return None
              try:
                  return datetime.fromisoformat(value.replace("Z", "+00:00"))
              except ValueError:
                  return None

          def workflow_registered_at(workflow_file: str):
              """Anchor date for the activation grace of a never-fired schedule.

              The grace exists for a scheduled workflow whose first cron fire is
              still pending: it has zero scheduled runs not because it is dead
              but because it has not had a chance to fire yet.

              This used to read ONLY the Actions API `created_at`, which is when
              the FILE first registered -- and that is the wrong date for a
              workflow that gains a cron later. `seed-corpus.yml` registered
              2026-04-02 as a dispatch-only workflow and gained
              `cron: "0 7 1 * *"` on 2026-08-21 in #1794. Its first scheduled
              fire is 1 September, but the grace was measured from April, so it
              was reported dead and took the whole liveness job red -- and would
              have stayed red until September no matter what anyone did.

              So take the LATER of file registration and the last commit that
              touched the workflow file. This path is only reached when a
              workflow has never had a scheduled run at all, so a recently
              edited file is far more likely to be newly scheduled than dead.
              """
              anchors = []

              payload = _api_json(f"{api}/repos/{repo}/actions/workflows/{workflow_file}")
              if isinstance(payload, dict):
                  anchors.append(_parse_ts(payload.get("created_at")))

              path = f".github/workflows/{workflow_file}"
              commits = _api_json(
                  f"{api}/repos/{repo}/commits?path={urllib.parse.quote(path)}&per_page=1"
              )
              if isinstance(commits, list) and commits:
                  commit = commits[0].get("commit", {}).get("committer", {})
                  anchors.append(_parse_ts(commit.get("date")))

              anchors = [a for a in anchors if a is not None]
              return max(anchors) if anchors else None

          dead: list[str] = []
          checked = 0
          for path in sorted(wf_dir.glob("*.yml")) + sorted(wf_dir.glob("*.yaml")):
              text = path.read_text(encoding="utf-8")
              on_block = on_block_re.search(text)
              if not on_block or not schedule_re.search(on_block.group(1)):
                  continue
              checked += 1
              window_days = cadence_window_days(cron_re.findall(on_block.group(1)))
              runs = latest_scheduled_run(path.name)
              if not runs:
                  # Activation grace: a workflow added within its own cadence
                  # window has not had a scheduled fire yet, so "no runs" is
                  # expected, not dead. This grace only RELAXES the check (it can
                  # never turn a live schedule red); worst case it tolerates a
                  # genuinely-dead brand-new workflow for one cadence window,
                  # after which the missing run trips the check normally.
                  registered = workflow_registered_at(path.name)
                  if registered is not None and datetime.now(timezone.utc) - registered <= timedelta(days=window_days):
                      print(
                          f"{path.name}: registered {registered.date()}, no scheduled "
                          f"run yet -- within its {window_days}-day activation grace."
                      )
                      continue
                  dead.append(
                      f"{path.name}: no scheduled runs at all -- absent from the "
                      "default branch, or its cron is disabled/never fires"
                  )
                  continue
              created = datetime.fromisoformat(runs[0]["created_at"].replace("Z", "+00:00"))
              if datetime.now(timezone.utc) - created > timedelta(days=window_days):
                  dead.append(
                      f"{path.name}: latest scheduled run {runs[0]['created_at']} is "
                      f"older than its {window_days}-day cadence window"
                  )
          if checked == 0:
              print("::error::No scheduled workflows found in the checked-out tree; the liveness scan itself is broken.")
              sys.exit(1)
          if dead:
              print(
                  "::error::Scheduled workflow(s) with no recent scheduled run detected "
                  "(see TODO release-canary-scheduled-activation and "
                  "docs/operations/repo-admin-settings.md 'Scheduled activation'):"
              )
              for line in dead:
                  print(f"::error::  {line}")
              sys.exit(1)
          print(f"All {checked} scheduled workflow(s) alive within their cadence windows.")
          PY

  throughput-uat:
    # Closes the throughput-uat-and-ci-coverage gap: concurrency previously had
    # zero UAT/CI coverage, so a regression that broke multi-stream execution
    # (or silently floored the requested stream count -- see
    # throughput-stream-count-wiring-defect) would have shipped green. This
    # job is the nightly-only real-DB/real-CLI lane; PR fast-lane runtime is
    # unaffected (see tests/uat/configs/uat-throughput-duckdb-nightly.yaml).
    # The Docker CedarDB cell below runs the same stream-count contract on a
    # client/server engine via INDEPENDENT_CONNECTION, with the cell managing
    # its own compose stack
    # (see tests/uat/configs/uat-throughput-cedardb-nightly.yaml).
    runs-on: ubuntu-latest
    # Cell budgets: DuckDB 900s + CedarDB 600s = 25 min worst case, plus
    # ~25 min headroom for checkout, deps, integration tests, Docker
    # startup/cleanup, and both assert steps.
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      cedardb_sweep_outcome: ${{ steps.cedardb-sweep.outcome }}
    env:
      # Throughput@Size floor: the DuckDB assert step derives the median from
      # the retained per-runner-class baselines downloaded just before it.
      # THROUGHPUT_FLOOR_MEDIAN, when set, overrides that median. Unset vars
      # evaluate to empty, which the assert step treats as unconfigured.
      THROUGHPUT_FLOOR_MEDIAN: ${{ vars.THROUGHPUT_FLOOR_MEDIAN }}
      THROUGHPUT_FLOOR_MAX_DROP_FRACTION: ${{ vars.THROUGHPUT_FLOOR_MAX_DROP_FRACTION }}
      THROUGHPUT_BASELINE_MIN_RECORDED_AT: ${{ vars.THROUGHPUT_BASELINE_MIN_RECORDED_AT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run real-DB throughput integration tests (DuckDB)
        run: |
          uv run -- python -m pytest tests/integration -k "throughput and duckdb" -m integration --tb=short -v

      - name: Run DuckDB throughput UAT cell (TPC-H SF1, run-official --streams 3)
        id: duckdb-sweep
        # Gated on the sweep's own exit code: the config's
        # `validator_clean_rate_floor: 1.0` plus the strict report exit
        # policy fail this step on any non-clean cell. The TPC-H
        # queries-11/16/18/20 seed-derivation defect that used to keep this
        # cell permanently red (and required a `continue-on-error: true`
        # here) was fixed in #1142 -- see the HISTORICAL NOTE on
        # `validate_throughput_metric` in tests/uat/throughput.py. Do NOT
        # re-add `continue-on-error` here; the step below is the
        # independent, defense-in-depth wiring check, not a substitute for
        # gating on this step's own exit code.
        run: |
          make uat-sweep CONFIG=tests/uat/configs/uat-throughput-duckdb-nightly.yaml

      - name: Run CedarDB throughput UAT cell (TPC-H SF1, run-official --streams 3)
        id: cedardb-sweep
        # Unlike DuckDB's SHARED_CURSOR fast path, CedarDB uses
        # INDEPENDENT_CONNECTION (a fresh connection per stream), so this cell
        # proves N concurrent independent sessions end to end via the
        # production CLI. The cell manages its own compose stack
        # (cleanup.docker_manage_platforms); no service container is needed.
        run: |
          make uat-sweep CONFIG=tests/uat/configs/uat-throughput-cedardb-nightly.yaml

      - name: Download retained Throughput@Size baselines
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          history="$HOME/Developer/benchmark_runs/throughput-baseline-history"
          mkdir -p "$history"
          if ! run_ids=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow nightly.yml --branch develop --event schedule --limit 30 \
            --json databaseId --jq ".[] | select(.databaseId != ${GITHUB_RUN_ID}) | .databaseId"); then
            echo "::warning::could not list prior nightly runs; the Throughput@Size floor stays observe-only"
            exit 0
          fi
          for run_id in ${run_ids}; do
            gh run download "${run_id}" --repo "$GITHUB_REPOSITORY" \
              --pattern 'throughput-baseline-duckdb-tpch-sf1-*' --dir "${history}/${run_id}" 2>/dev/null || true
          done
          echo "Downloaded $(find "$history" -name 'throughput-baseline-*.json' | wc -l) baseline record(s)"

      - name: Assert the requested stream count reached the driver and every stream succeeded
        if: ${{ !cancelled() }}
        run: |
          uv run -- python -m tests.uat.throughput assert \
            --cells-glob "$HOME/Developer/benchmark_runs/logs/uat_throughput_duckdb_nightly_*/cells.jsonl" \
            --platform duckdb --benchmark tpch --scale 1 --streams 3 \
            --evaluate-floor \
            --baseline-history "$HOME/Developer/benchmark_runs/throughput-baseline-history" \
            --baseline-out "$HOME/Developer/benchmark_runs/throughput-baseline"

      - name: Assert the CedarDB cell stream count and per-stream success
        if: ${{ !cancelled() }}
        run: |
          uv run -- python -m tests.uat.throughput assert \
            --cells-glob "$HOME/Developer/benchmark_runs/logs/uat_throughput_cedardb_nightly_*/cells.jsonl" \
            --platform cedardb --benchmark tpch --scale 1 --streams 3

      - name: Upload throughput UAT logs and results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: throughput-uat-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ~/Developer/benchmark_runs/logs/uat_throughput_*
            ~/Developer/benchmark_runs/results/tpch_sf1_*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Throughput@Size baseline record
        if: ${{ !cancelled() && steps.duckdb-sweep.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: throughput-baseline-duckdb-tpch-sf1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ~/Developer/benchmark_runs/throughput-baseline/
          if-no-files-found: ignore
          retention-days: 90

  throughput-uat-signal:
    name: throughput-uat-signal
    needs: throughput-uat
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Publish the throughput-uat commit status
        env:
          GH_TOKEN: ${{ github.token }}
          THROUGHPUT_UAT_RESULT: ${{ needs.throughput-uat.result }}
          CEDARDB_SWEEP_OUTCOME: ${{ needs.throughput-uat.outputs.cedardb_sweep_outcome }}
        run: |
          case "${THROUGHPUT_UAT_RESULT}" in
            success) state=success ;;
            cancelled) state=error ;;
            *) state=failure ;;
          esac
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context="nightly/throughput-uat" \
            -f description="throughput-uat ${THROUGHPUT_UAT_RESULT}; cedardb cell ${CEDARDB_SWEEP_OUTCOME:-not run}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  pyspark-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run PySpark tests
        run: |
          make test-pyspark

  green-unmerged-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: write
      # green_unmerged_sweep.py lists check runs (commits/{sha}/check-runs) for
      # every candidate PR. A job-level permissions map sets every unlisted
      # scope to "no access", so without these two the scheduled sweep 403s
      # before it can classify PRs or update its tracking issue.
      checks: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Run green-unmerged sweep
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run -- python _project/scripts/green_unmerged_sweep.py --apply

  ruleset-drift:
    name: ruleset-drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: develop
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Compare live governance with the runbook
        env:
          RULESET_DRIFT_TOKEN: ${{ secrets.RULESET_DRIFT_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/ruleset_drift_check.py \
            --token "${RULESET_DRIFT_TOKEN}" \
            --require-bypass-actor-visibility \
            --output ruleset-drift.json

      - name: Upload drift evidence
        if: always()
