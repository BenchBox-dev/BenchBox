name: Site Inputs

on:
  workflow_run:
    workflows: ["Trunk"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      parent_core_sha:
        description: "Base SHA for the validator_parity attestation (default: the newest bundled ancestor on develop)"
        required: false
        default: ""

concurrency:
  group: site-inputs
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: build bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'develop' &&
       github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Checkout trunk head
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Checkout develop
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Resolve SHAs
        id: shas
        env:
          DISPATCH_PARENT: ${{ inputs.parent_core_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          CORE_SHA="$(git rev-parse HEAD)"
          echo "core_sha=${CORE_SHA}" >> "$GITHUB_OUTPUT"
          RUN_IDS="$(gh run list --workflow site-inputs.yml --branch develop --status success --json databaseId --limit 10 -q '.[].databaseId')"
          BUNDLED_SHAS=""
          for RUN in $RUN_IDS; do
            NAMES="$(gh api "repos/${REPO}/actions/runs/${RUN}/artifacts" -q '.artifacts[] | select(.expired == false and (.name | startswith("site-inputs-"))) | .name | ltrimstr("site-inputs-")')"
            BUNDLED_SHAS="$(printf '%s\n%s' "$BUNDLED_SHAS" "$NAMES")"
          done
          if [ -n "$DISPATCH_PARENT" ]; then
            if ! git merge-base --is-ancestor "$DISPATCH_PARENT" "$CORE_SHA"; then
              echo "parent_core_sha ${DISPATCH_PARENT} is not an ancestor of ${CORE_SHA}" >&2
              exit 1
            fi
            if printf '%s\n' "$BUNDLED_SHAS" | grep -qx "$DISPATCH_PARENT"; then
              echo "parent_source=bundle" >> "$GITHUB_OUTPUT"
            elif [ -z "$(printf '%s' "$BUNDLED_SHAS" | tr -d '[:space:]')" ]; then
              echo "No unexpired develop bundle exists; using the dispatched parent ${DISPATCH_PARENT}." >> "$GITHUB_STEP_SUMMARY"
              echo "parent_source=dispatch" >> "$GITHUB_OUTPUT"
            else
              echo "no site-inputs bundle attested on parent ${DISPATCH_PARENT}" >&2
              exit 1
            fi
            echo "parent_sha=${DISPATCH_PARENT}" >> "$GITHUB_OUTPUT"
          else
            PREV=""
            for CANDIDATE in $BUNDLED_SHAS; do
              if [ "$CANDIDATE" != "$CORE_SHA" ] && git merge-base --is-ancestor "$CANDIDATE" "$CORE_SHA" 2>/dev/null; then
                PREV="$CANDIDATE"
                break
              fi
            done
            if [ -z "$PREV" ]; then
              echo "no unexpired develop bundle is an ancestor of ${CORE_SHA}; dispatch site-inputs.yml with parent_core_sha set to the last deployed core_sha" >&2
              exit 1
            fi
            echo "parent_sha=${PREV}" >> "$GITHUB_OUTPUT"
            echo "parent_source=bundle" >> "$GITHUB_OUTPUT"
          fi
          if [ "$IS_DISPATCH" = "true" ]; then
            CERTIFIED="$(gh run list --workflow trunk.yml --branch develop --status success --json headSha,event --limit 20 -q '[.[] | select(.event == "push") | .headSha] | .[]')"
            if ! printf '%s\n' "$CERTIFIED" | grep -qx "$CORE_SHA"; then
              echo "no successful trunk.yml push run on ${CORE_SHA}" >&2
              exit 1
            fi
          fi
          echo "certified_by=${RUN_ID:-dispatch}" >> "$GITHUB_OUTPUT"

      - name: Build and verify bundle
        env:
          CORE_SHA: ${{ steps.shas.outputs.core_sha }}
          PARENT_SHA: ${{ steps.shas.outputs.parent_sha }}
          PARENT_SOURCE: ${{ steps.shas.outputs.parent_source }}
          CERTIFIED_BY: ${{ steps.shas.outputs.certified_by }}
        run: |
          make site-inputs SITE_INPUTS_OUT=site-inputs-bundle \
            SITE_INPUTS_CORE_SHA="$CORE_SHA" \
            SITE_INPUTS_PARENT_SHA="$PARENT_SHA" \
            SITE_INPUTS_PARENT_SOURCE="$PARENT_SOURCE" \
            SITE_INPUTS_CERTIFIED_BY="$CERTIFIED_BY"

      - name: Pack bundle
        env:
          CORE_SHA: ${{ steps.shas.outputs.core_sha }}
        run: |
          tar -cf - site-inputs-bundle | zstd -19 -o "site-inputs-${CORE_SHA}.tar.zst"
          sha256sum "site-inputs-${CORE_SHA}.tar.zst" | tee bundle.sha256

      - name: Upload bundle artifact
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: site-inputs-${{ steps.shas.outputs.core_sha }}
          path: site-inputs-${{ steps.shas.outputs.core_sha }}.tar.zst
          retention-days: 90
          if-no-files-found: error

      - name: Dispatch to site repo
        id: dispatch
        if: vars.SITE_BRIDGE_ENABLED == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.SITE_BRIDGE_APP_ID }}
          private-key: ${{ secrets.SITE_BRIDGE_PRIVATE_KEY }}
          owner: BenchBox-dev
          repositories: benchbox-site

      - name: Send core-bundle dispatch
        if: vars.SITE_BRIDGE_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ steps.dispatch.outputs.token }}
          CORE_SHA: ${{ steps.shas.outputs.core_sha }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          DIGEST="$(cut -d' ' -f1 bundle.sha256)"
          gh api repos/BenchBox-dev/benchbox-site/dispatches \
            -f event_type='core-bundle' \
            -f client_payload[core_sha]="$CORE_SHA" \
            -f client_payload[run_id]="$RUN_ID" \
            -f client_payload[artifact_id]="$ARTIFACT_ID" \
            -f client_payload[digest]="sha256:$DIGEST"

      - name: Bridge disabled notice
        if: vars.SITE_BRIDGE_ENABLED != 'true'
        run: |
          {
            echo "Site bridge not enabled: bundle built and uploaded, dispatch skipped.";
            echo "Set the SITE_BRIDGE_ENABLED variable once the bridge App is installed.";
          } >> "$GITHUB_STEP_SUMMARY"
