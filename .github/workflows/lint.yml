name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Lint and format check with ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check with ty
        run: uv run ty check

      - name: Validate test marker annotations
        run: make lint-markers

      - name: Timing policy (wall-clock allowlist)
        run: |
          if [ -d _project ]; then
            uv run -- python _project/scripts/timing_policy_check.py --strict
          else
            echo "_project/ is absent on curated release branches; skipping timing policy check."
          fi

      - name: Compatibility docs drift check
        run: make compat-docs-check

      - name: Dependency audit (no unused declarations)
        run: |
          if [ -d _project ]; then
            make audit-deps
          else
            echo "_project/ is absent on curated release branches; skipping dependency audit."
          fi

      - name: Release curation list drift check
        run: |
          if [ -d _project ]; then
            uv run python scripts/check_release_curation.py
          else
            echo "_project/ is absent on curated release branches; skipping curation drift check."
          fi
