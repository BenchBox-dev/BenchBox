name: Lint

on:
  push:
    branches:
      - release
  pull_request:
    branches:
      - release

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Lint and format check with ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check with ty
        run: uv run ty check

      - name: Validate test marker annotations
        run: make lint-markers

      # The four steps below depend on _project/ dev tooling, which is curated
      # out of release branches; hashFiles guards make them skip there.
      - name: Timing policy (wall-clock allowlist)
        if: hashFiles('_project/scripts/timing_policy_check.py') != ''
        run: uv run -- python _project/scripts/timing_policy_check.py --strict

      - name: UAT spec LOC table drift check
        if: hashFiles('_project/scripts/uat_loc_table.py') != ''
        run: uv run --project _project/scripts --no-sync -- python _project/scripts/uat_loc_table.py --check

      - name: Compatibility docs drift check
        run: make compat-docs-check

      - name: Platform manifest drift check
        if: hashFiles('_project/scripts/platform_manifest.py') != ''
        run: make platform-manifest-check

      - name: Dependency audit (no unused declarations)
        if: hashFiles('_project/scripts/dependency_audit/check_deps.py') != ''
        run: make audit-deps

      - name: Dependency inventory drift check
        if: hashFiles('_project/scripts/dependency_audit/parse_deps.py') != ''
        run: make audit-raw-check

      - name: Release curation list drift check
        if: hashFiles('_project/decisions/single-repo-migration.md') != ''
        run: uv run python scripts/check_release_curation.py
