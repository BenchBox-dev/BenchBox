name: Lint

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Lint and format check with ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check with ty
        run: uv run ty check

      - name: Validate test marker annotations
        run: make lint-markers

      - name: Timing policy (wall-clock allowlist)
        run: uv run -- python _project/scripts/timing_policy_check.py --strict

      - name: Compatibility docs drift check
        run: make compat-docs-check

      - name: Dependency audit (no unused declarations)
        run: make audit-deps
