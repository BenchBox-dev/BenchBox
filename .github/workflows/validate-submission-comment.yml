name: Submission Validation Comment

on:
  workflow_run:
    workflows: ["Validate Submission"]
    types:
      - completed

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  comment:
    name: Post validation comment from trusted context
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request_target'
    steps:
      - name: Download validation comment artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: submission-validation-comment
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post or update the comment
        if: steps.download.outcome == 'success'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const fs = require('fs');

            if (!fs.existsSync('artifact/pr_comment.md')) {
              core.info('No submission-validation comment artifact; nothing to post.');
              return;
            }

            const headSha = context.payload.workflow_run.head_sha;
            const { data: associatedPRs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: headSha,
            });
            if (associatedPRs.length !== 1) {
              core.setFailed(
                `Expected exactly one PR associated with commit ${headSha}, found ${associatedPRs.length}; refusing to guess the comment target.`
              );
              return;
            }
            const prNumber = associatedPRs[0].number;

            const body = fs.readFileSync('artifact/pr_comment.md', 'utf8');
            const marker = '## Submission Validation';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c =>
              c.body.trimStart().startsWith(marker) &&
              (c.user.type === 'Bot' || c.user.login === 'github-actions[bot]')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body,
              });
            }
