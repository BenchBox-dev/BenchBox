name: Phase 3 Promotion Review

# Generate the Phase 2 -> Phase 3 promotion-metrics handoff on a calendar,
# not when a human remembers. Runs quarterly on the FIRST MONDAY of each
# quarter month and opens a PR with the report for the maintainer to
# interpret. The PR never auto-merges -- the one-paragraph-per-metric human
# judgement is the point (see
# `_project/analysis/phase-3-promotion-metrics.md`).
#
# Cadence is machine-checkable: the cron fires at 09:00 UTC on days 1-7 of
# Jan/Apr/Jul/Oct (every such day), and the `guard` job proceeds only when
# that day is a Monday. Days 1-7 always contain exactly one Monday, so this
# fires once per quarter without relying on day-of-month / day-of-week OR
# semantics. `workflow_dispatch` is available for manual recovery if the cron
# is missed.

on:
  schedule:
    - cron: '0 9 1-7 1,4,7,10 *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3-promotion-review
  cancel-in-progress: false

env:
  # If this workflow file ever lands on `main` (scheduled workflows only run
  # from the default branch), a scheduled run's implicit checkout ref is
  # `main`, not `develop` -- and `scripts/phase2_metrics.py` /
  # `_project/analysis/phase-3-promotion-metrics.md` only exist on `develop`
  # (release-cut strips `_project/` and dev-tooling scripts from `main`).
  # Same pattern as release-canary.yml's RELEASE_CANARY_REF.
  PHASE3_REVIEW_REF: develop

jobs:
  # First-Monday guard. Scheduled runs proceed only on Monday; manual
  # dispatch always proceeds.
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch -- proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%u)" = "1" ]; then
            echo "Scheduled run on Monday within the first 7 days of the quarter month -- proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Scheduled run, but $(date -u +%A) is not Monday -- skipping (cron fires days 1-7; this guard enforces first-Monday)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  review:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PHASE3_REVIEW_REF }}
          fetch-depth: 0  # full history so we can branch and push

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --group dev

      - name: Configure git identity
        run: |
          git config user.name  "benchbox-bot"
          git config user.email "benchbox-bot@users.noreply.github.com"

      - name: Generate promotion-metrics report
        id: gen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REVIEW_DATE="$(date -u +%Y-%m-%d)"
          REPORT="_project/handoffs/phase-3-review-${REVIEW_DATE}.md"
          echo "review_date=${REVIEW_DATE}" >> "$GITHUB_OUTPUT"
          echo "report=${REPORT}" >> "$GITHUB_OUTPUT"
          # Markdown default; the script appends the "Trend vs <date>" diff
          # against the most recent prior phase-3-review-*.md automatically.
          uv run -- python scripts/phase2_metrics.py --output "${REPORT}"

      - name: Open promotion-review PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_DATE: ${{ steps.gen.outputs.review_date }}
          REPORT: ${{ steps.gen.outputs.report }}
        run: |
          if [ -z "$(git status --porcelain -- "${REPORT}")" ]; then
            echo "Report ${REPORT} is unchanged -- nothing to open a PR for."
            exit 0
          fi
          BRANCH="auto/phase-3-review-${REVIEW_DATE}"
          git switch --force-create "${BRANCH}"
          git add "${REPORT}"
          git commit -m "chore(phase-3): quarterly promotion review ${REVIEW_DATE}"
          git push --force-with-lease origin "${BRANCH}"

          BODY=$(cat <<EOF
          Auto-generated quarterly Phase 2 -> Phase 3 promotion-metrics review for ${REVIEW_DATE}.

          **This PR does not auto-merge.** Per the procedure in
          \`_project/analysis/phase-3-promotion-metrics.md\`, the maintainer:

          1. Reviews each metric and writes a one-paragraph interpretation
             (sustained signal vs artifact) for any breached threshold.
          2. Reads the "Trend vs <date>" section for the two-consecutive-quarters
             hysteresis signal.
          3. Promotes the dependent Phase 3 design TODOs only if the decision
             rule is met, then merges; otherwise merges as the quarter's audit
             record (or closes if regenerating).

          Generated by \`scripts/phase2_metrics.py\` via
          \`.github/workflows/phase3-promotion-review.yml\`.
          EOF
          )

          # Idempotent for the manual-recovery path: re-dispatch on the same
          # day updates the existing PR rather than failing on a duplicate.
          EXISTING=$(gh pr list --base develop --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')
          if [ -n "${EXISTING}" ]; then
            echo "PR #${EXISTING} already open for ${BRANCH}; updating body."
            gh pr edit "${EXISTING}" --body "${BODY}"
          else
            gh pr create \
              --base develop \
              --head "${BRANCH}" \
              --title "chore(phase-3): quarterly promotion review ${REVIEW_DATE}" \
              --body "${BODY}"
          fi
