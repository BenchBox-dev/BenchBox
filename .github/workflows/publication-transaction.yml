name: Publication Transactions

"on":
  workflow_dispatch:
    inputs:
      kind:
        description: "Transaction kind: promotion or rollback"
        required: true
        type: choice
        options:
          - promotion
          - rollback
        default: promotion
      candidate_artifact_id:
        description: "Immutable candidate bundle artifact ID (required for promotion)"
        required: false
        default: ""
        type: string
      restore_transaction_id:
        description: "Durable transaction ID to restore (required for rollback)"
        required: false
        default: ""
        type: string
      failed_transaction_id:
        description: "Failed active transaction ID being restored (required for rollback)"
        required: false
        default: ""
        type: string
      barrier_evidence:
        description: "Affirmative provider activation barrier evidence JSON (required for rollback)"
        required: false
        default: ""
        type: string
      resume_transaction_id:
        description: "Prepared rollback transaction to resume after provider reconciliation"
        required: false
        default: ""
        type: string
      reconcile_transaction_id:
        description: "Active promotion transaction in recovery-required to reconcile forward"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare transaction permit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      permit_sha256: ${{ steps.prepare_tx.outputs.permit_sha256 }}
      transaction_id: ${{ steps.prepare_tx.outputs.transaction_id }}
      generation: ${{ steps.prepare_tx.outputs.generation }}
      kind: ${{ steps.inputs.outputs.kind }}
      develop_sha: ${{ steps.candidate.outputs.develop_sha }}
      published_results_sha: ${{ steps.candidate.outputs.published_results_sha }}
      candidate_artifact_id: ${{ steps.candidate.outputs.artifact_id || steps.prepare_tx.outputs.candidate_artifact_id }}
      candidate_site_tree_sha256: ${{ steps.prepare_tx.outputs.candidate_site_tree_sha256 }}
      candidate_archive_sha256: ${{ steps.prepare_tx.outputs.candidate_archive_sha256 }}
      candidate_parent_sha: ${{ steps.candidate.outputs.expected_parent_sha }}
      candidate_parent_generation: ${{ steps.candidate.outputs.expected_parent_generation }}
      artifact_id: ${{ steps.prepare_tx.outputs.artifact_id }}
    steps:
      - name: Checkout control-plane source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Fetch publication journal
        shell: bash
        run: |
          git fetch origin refs/heads/publication:refs/heads/publication || true

      - name: Validate dispatch inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "::error::publication transaction must be dispatched from develop"
            exit 1
          fi
          KIND="${{ inputs.kind }}"
          case "$KIND" in promotion|rollback) ;; *) echo "::error::unsupported transaction kind: $KIND"; exit 1 ;; esac
          if [ -z "${{ inputs.reconcile_transaction_id }}" ] && [ "$KIND" = "promotion" ]; then
            printf '%s' "${{ inputs.candidate_artifact_id }}" | grep -qE '^[1-9][0-9]*$' || {
              echo "::error::promotion requires one immutable candidate_artifact_id"
              exit 1
            }
          fi
          {
            echo "kind=$KIND"
            echo "candidate_artifact_id=${{ inputs.candidate_artifact_id }}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve and validate selected candidate before approval
        id: candidate
        if: steps.inputs.outputs.kind == 'promotion' && inputs.reconcile_transaction_id == ''
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ARTIFACT_ID: ${{ steps.inputs.outputs.candidate_artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate-validation
          gh api "repos/${{ github.repository }}/actions/artifacts/$CANDIDATE_ARTIFACT_ID" > candidate-validation/artifact.json
          PRODUCER_RUN_ID=$(jq -r '.workflow_run.id // empty' candidate-validation/artifact.json)
          test -n "$PRODUCER_RUN_ID" || { echo "::error::candidate artifact has no producing workflow run"; exit 1; }
          gh api "repos/${{ github.repository }}/actions/runs/$PRODUCER_RUN_ID" > candidate-validation/run.json
          gh api "repos/${{ github.repository }}/actions/artifacts/$CANDIDATE_ARTIFACT_ID/zip" > candidate-validation/candidate.zip
          EXPECTED_DEVELOP_SHA=$(git rev-parse refs/remotes/origin/develop)
          EXPECTED_PUBLISHED_RESULTS_SHA=$(git rev-parse refs/remotes/origin/published-results)
          STATE_JSON=$(git show refs/heads/publication:publication/transaction-state/state.json 2>/dev/null || echo '{}')
          EXPECTED_GENERATION=$(printf '%s' "$STATE_JSON" | jq -r '.next_generation // 1')
          DURABLE_ID=$(printf '%s' "$STATE_JSON" | jq -r '.durable_transaction_id // empty')
          EXPECTED_PARENT_SHA=""
          EXPECTED_PARENT_GENERATION=""
          if [ -n "$DURABLE_ID" ]; then
            PARENT_JSON=$(git show "refs/heads/publication:publication/transaction-state/transactions/$DURABLE_ID.json")
            EXPECTED_PARENT_SHA=$(printf '%s' "$PARENT_JSON" | jq -r '.attestation.source_commit // .content.develop_sha // empty')
            EXPECTED_PARENT_GENERATION=$(printf '%s' "$PARENT_JSON" | jq -r '.generation')
          fi
          PARENT_ARGS=()
          [ -z "$EXPECTED_PARENT_SHA" ] || PARENT_ARGS+=(--expected-parent-sha "$EXPECTED_PARENT_SHA")
          [ -z "$EXPECTED_PARENT_GENERATION" ] || PARENT_ARGS+=(--expected-parent-generation "$EXPECTED_PARENT_GENERATION")
          uv run python scripts/publication/candidate.py validate \
            --archive candidate-validation/candidate.zip \
            --output-dir candidate-validation/extracted \
            --artifact-id "$CANDIDATE_ARTIFACT_ID" \
            --artifact-metadata candidate-validation/artifact.json \
            --run-metadata candidate-validation/run.json \
            --expected-develop-sha "$EXPECTED_DEVELOP_SHA" \
            --expected-published-results-sha "$EXPECTED_PUBLISHED_RESULTS_SHA" \
            --expected-generation "$EXPECTED_GENERATION" \
            "${PARENT_ARGS[@]}" \
            --output-summary candidate-validation/summary.json
          jq -r '"artifact_id=" + (.artifact_id|tostring), "producer_run_id=" + .producer_run_id, "develop_sha=" + .develop_sha, "published_results_sha=" + .published_results_sha, "manifest_digest=" + .manifest_digest, "site_tree_sha256=" + .site_tree_sha256, "archive_sha256=" + .archive_sha256, "expected_parent_sha=" + (.expected_parent_sha // ""), "expected_parent_generation=" + ((.expected_parent_generation // "")|tostring)' candidate-validation/summary.json >> "$GITHUB_OUTPUT"

      - name: Prepare transaction permit
        id: prepare_tx
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transaction-artifacts
          if [ "${{ steps.inputs.outputs.kind }}" = "rollback" ] && [ -n "${{ inputs.barrier_evidence }}" ]; then
            printf '%s\n' "${{ inputs.barrier_evidence }}" > transaction-artifacts/barrier.json
            BARRIER_ARG="--barrier-evidence transaction-artifacts/barrier.json"
          else
            BARRIER_ARG=""
          fi

          if [ -n "${{ inputs.resume_transaction_id }}" ]; then
            uv run python scripts/publication/transaction_executor.py resume \
              --transaction-id "${{ inputs.resume_transaction_id }}" \
              --ref "publication" --repo-path "." \
              --output-permit transaction-artifacts/permit.json \
              --output-tx transaction-artifacts/tx.json
          elif [ -n "${{ inputs.reconcile_transaction_id }}" ]; then
            uv run python scripts/publication/transaction_executor.py reconcile \
              --transaction-id "${{ inputs.reconcile_transaction_id }}" \
              --ref "publication" --repo-path "." \
              --output-tx transaction-artifacts/tx.json
          else
            uv run python scripts/publication/transaction_executor.py prepare \
            --kind "${{ steps.inputs.outputs.kind }}" \
            --target-repo "${{ github.repository }}" \
            --target-env "github-pages" \
            --target-url "https://benchbox.dev" \
            --develop-sha "${{ steps.candidate.outputs.develop_sha || '0' }}" \
            --published-results-sha "${{ steps.candidate.outputs.published_results_sha || '0' }}" \
            --candidate-manifest-digest "${{ steps.candidate.outputs.manifest_digest || '0' }}" \
            --candidate-artifact-id "${{ steps.candidate.outputs.artifact_id || '' }}" \
            --candidate-archive-sha256 "${{ steps.candidate.outputs.archive_sha256 || '' }}" \
            --candidate-site-tree-sha256 "${{ steps.candidate.outputs.site_tree_sha256 || '' }}" \
            --candidate-parent-sha "${{ steps.candidate.outputs.expected_parent_sha || '' }}" \
            --candidate-parent-generation "${{ steps.candidate.outputs.expected_parent_generation || '' }}" \
            --restore-transaction-id "${{ inputs.restore_transaction_id }}" \
            --failed-transaction-id "${{ inputs.failed_transaction_id }}" \
            $BARRIER_ARG \
            --workflow-path ".github/workflows/publication-transaction.yml" \
            --workflow-sha "${{ github.sha }}" \
            --writer-run-id "${{ github.run_id }}" \
            --ref "publication" \
            --repo-path "." \
            --output-permit transaction-artifacts/permit.json \
            --output-tx transaction-artifacts/tx.json
          fi

      - name: Upload transaction permit artifact
        if: inputs.reconcile_transaction_id == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-permit-${{ steps.prepare_tx.outputs.transaction_id }}
          path: transaction-artifacts/
          retention-days: 7

  deploy:
    name: Execute publication transaction write
    needs: prepare
    if: inputs.reconcile_transaction_id == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.pages_deploy.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    outputs:
      deployment_id: ${{ steps.pages_deploy.outputs.deployment_id }}
      page_url: ${{ steps.pages_deploy.outputs.page_url }}
    steps:
      - name: Checkout control-plane source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Fetch publication journal
        shell: bash
        run: |
          git fetch origin refs/heads/publication:refs/heads/publication || true

      - name: Download transaction permit
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: publication-permit-${{ needs.prepare.outputs.transaction_id }}
          path: transaction-artifacts

      - name: Authenticate maintainer approval
        if: inputs.resume_transaction_id == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv run python scripts/publication/transaction_executor.py authenticate-approval \
            --permit transaction-artifacts/permit.json \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --repo "${{ github.repository }}" \
            --github-token "$GH_TOKEN" \
            --output-approval transaction-artifacts/approval.json

      - name: Materialize site bytes
        if: needs.prepare.outputs.kind == 'promotion'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.prepare.outputs.candidate_artifact_id }}
          EXPECTED_SITE_DIGEST: ${{ needs.prepare.outputs.candidate_site_tree_sha256 }}
          EXPECTED_ARCHIVE_DIGEST: ${{ needs.prepare.outputs.candidate_archive_sha256 }}
          EXPECTED_DEVELOP_SHA: ${{ needs.prepare.outputs.develop_sha }}
          EXPECTED_PUBLISHED_RESULTS_SHA: ${{ needs.prepare.outputs.published_results_sha }}
          EXPECTED_GENERATION: ${{ needs.prepare.outputs.generation }}
          EXPECTED_PARENT_SHA: ${{ needs.prepare.outputs.candidate_parent_sha }}
          EXPECTED_PARENT_GENERATION: ${{ needs.prepare.outputs.candidate_parent_generation }}
        run: |
          set -euo pipefail
          mkdir -p candidate-validation
          gh api "repos/${{ github.repository }}/actions/artifacts/$CANDIDATE_ARTIFACT_ID" > candidate-validation/artifact.json
          PRODUCER_RUN_ID=$(jq -r '.workflow_run.id // empty' candidate-validation/artifact.json)
          test -n "$PRODUCER_RUN_ID" || { echo "::error::candidate artifact has no producing run"; exit 1; }
          gh api "repos/${{ github.repository }}/actions/runs/$PRODUCER_RUN_ID" > candidate-validation/run.json
          gh api "repos/${{ github.repository }}/actions/artifacts/$CANDIDATE_ARTIFACT_ID/zip" > candidate-validation/candidate.zip
          PARENT_ARGS=()
          [ -z "$EXPECTED_PARENT_SHA" ] || PARENT_ARGS+=(--expected-parent-sha "$EXPECTED_PARENT_SHA")
          [ -z "$EXPECTED_PARENT_GENERATION" ] || PARENT_ARGS+=(--expected-parent-generation "$EXPECTED_PARENT_GENERATION")
          uv run python scripts/publication/candidate.py validate \
            --archive candidate-validation/candidate.zip \
            --output-dir candidate-validation/extracted \
            --artifact-id "$CANDIDATE_ARTIFACT_ID" \
            --artifact-metadata candidate-validation/artifact.json \
            --run-metadata candidate-validation/run.json \
            --expected-develop-sha "$EXPECTED_DEVELOP_SHA" \
            --expected-published-results-sha "$EXPECTED_PUBLISHED_RESULTS_SHA" \
            --expected-generation "$EXPECTED_GENERATION" \
            "${PARENT_ARGS[@]}" \
            --output-summary candidate-validation/summary.json
          SUMMARY_DIGEST=$(jq -r .site_tree_sha256 candidate-validation/summary.json)
          test "$SUMMARY_DIGEST" = "$EXPECTED_SITE_DIGEST" || {
            echo "::error::candidate site digest changed after approval"; exit 1;
          }
          SUMMARY_ARCHIVE=$(jq -r .archive_sha256 candidate-validation/summary.json)
          test "$SUMMARY_ARCHIVE" = "$EXPECTED_ARCHIVE_DIGEST" || {
            echo "::error::candidate archive digest changed after approval"; exit 1;
          }
          cp -R candidate-validation/extracted/site ./site
          mkdir -p candidate-receipts
          cp candidate-validation/extracted/candidate.json candidate-receipts/
          cp candidate-validation/extracted/desired-manifest.json candidate-receipts/
          cp candidate-validation/extracted/assembly-receipt.json candidate-receipts/

      - name: Record prepared reservation in journal CAS
        if: inputs.resume_transaction_id == ''
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/publication/transaction_executor.py record-prepared \
            --permit transaction-artifacts/permit.json \
            --approval transaction-artifacts/approval.json \
            --tx transaction-artifacts/tx.json \
            --ref "publication" \
            --repo-path "." \
            --output-tx transaction-artifacts/tx_prepared.json

      - name: Upload Pages artifact
        if: needs.prepare.outputs.kind == 'promotion'
        id: upload_pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          name: publication-pages-${{ needs.prepare.outputs.generation }}
          path: site

      - name: Retain candidate receipts for verification and audit
        if: needs.prepare.outputs.kind == 'promotion'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-candidate-receipts-${{ needs.prepare.outputs.transaction_id }}
          path: candidate-receipts/
          retention-days: 90

      - name: Record write intent in journal CAS
        id: start_write
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/publication/transaction_executor.py start-write \
            --transaction-id "${{ needs.prepare.outputs.transaction_id }}" \
            --ref "publication" \
            --repo-path "." \
            --pages-build-version "${{ github.sha }}" \
            --output-tx transaction-artifacts/tx_writing.json

      - name: Deploy to GitHub Pages via Pages adapter
        id: pages_deploy
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const { createDeployment, getDeploymentStatus, classifyDeploymentStatus } = require('./scripts/publication/pages.cjs');
            const deployedArtifactId = ${{ needs.prepare.outputs.kind == 'rollback' && needs.prepare.outputs.artifact_id || steps.upload_pages.outputs.artifact_id }};
            const result = await createDeployment({
              github,
              core,
              context,
              effect: {
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: deployedArtifactId,
                // The provider resolves pages_build_version as a commit, so
                // this must be a pushed commit (the run's source), never the
                // journal's dangling write-intent OID: an unresolvable
                // version makes the provider reject the create request.
                // Intent correlation stays in the journal's write record.
                pages_build_version: '${{ github.sha }}',
              }
            });
            const deploymentId = result.id || 'pages-deploy-${{ github.run_id }}';
            let status = 'PENDING';
            let terminal = false;
            let statusUrl = result.status_url || '';
            let pageUrl = result.page_url || 'https://benchbox.dev';
            let lastObserved = 'none';
            if (result.id) {
              // 60 x 10s = 10 minutes. GitHub Pages deployments normally reach a
              // terminal state in seconds, but CDN purge and file sync can lag.
              const maxPolls = 60;
              for (let i = 0; i < maxPolls; i++) {
                try {
                  const s = await getDeploymentStatus({
                    github,
                    context,
                    options: { owner: context.repo.owner, repo: context.repo.repo, deployment_id: result.id }
                  });
                  lastObserved = s.status;
                  const cls = classifyDeploymentStatus(s.status);
                  core.info(`Pages deployment poll ${i + 1}/${maxPolls}: provider status=${s.status} class=${cls}`);
                  if (cls === 'terminal-success') {
                    status = 'SUCCESS';
                    terminal = true;
                    if (s.page_url) pageUrl = s.page_url;
                    break;
                  } else if (cls === 'terminal-failure') {
                    status = 'FAILED';
                    terminal = true;
                    break;
                  }
                } catch (e) {
                  core.warning(`Status check warning: ${e.message}`);
                }
                await new Promise(r => setTimeout(r, 10000));
              }
            }
            if (!terminal) {
              status = 'FAILED';
              throw new Error(`Pages deployment ${deploymentId} did not reach a terminal state within the poll budget (last observed provider status: ${lastObserved})`);
            }
            core.setOutput('deployment_id', deploymentId);
            core.setOutput('status_url', statusUrl);
            core.setOutput('page_url', pageUrl);
            core.setOutput('deployed_artifact_id', deployedArtifactId);
            core.setOutput('status', status);
            if (status === 'FAILED') {
              throw new Error(`Pages deployment failed for ${deploymentId} (last observed provider status: ${lastObserved})`);
            }

      - name: Record write acknowledgement in journal CAS
        shell: bash
        run: |
          set -euo pipefail
          cat > transaction-artifacts/provider.json <<EOF
          {
            "id": "${{ steps.pages_deploy.outputs.deployment_id }}",
            "status_url": "${{ steps.pages_deploy.outputs.status_url }}",
            "status": "SUCCESS",
            "page_url": "${{ steps.pages_deploy.outputs.page_url }}",
            "artifact_id": "${{ steps.pages_deploy.outputs.deployed_artifact_id }}"
          }
          EOF
          uv run python scripts/publication/transaction_executor.py acknowledge-write \
            --transaction-id "${{ needs.prepare.outputs.transaction_id }}" \
            --provider-response transaction-artifacts/provider.json \
            --ref "publication" \
            --repo-path "." \
            --output-tx transaction-artifacts/tx_ack.json

      - name: Escalate failure if write failed
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/publication/transaction_executor.py record-failure \
            --transaction-id "${{ needs.prepare.outputs.transaction_id }}" \
            --code "POST_SEND_FAILURE" \
            --stage "post_send" \
            --reason "Provider deployment write failed" \
            --ref "publication" \
            --repo-path "." \
            --output-tx transaction-artifacts/tx_failed.json || true

  verify:
    name: Verify live publication endpoints
    needs: [prepare, deploy]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      !cancelled() &&
      (
        needs.deploy.result == 'success' ||
        (inputs.reconcile_transaction_id != '' && needs.deploy.result == 'skipped') ||
        (needs.deploy.result == 'failure' && needs.prepare.outputs.kind == 'promotion')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: publication-attestation
    steps:
      - name: Checkout control-plane source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Fetch publication journal
        shell: bash
        run: |
          git fetch origin refs/heads/publication:refs/heads/publication || true

      - name: Download candidate receipts
        if: needs.prepare.outputs.kind == 'promotion'
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: publication-candidate-receipts-${{ needs.prepare.outputs.transaction_id }}
          path: candidate-receipts

      - name: Materialize verification manifest
        shell: bash
        env:
          TRANSACTION_ID: ${{ needs.prepare.outputs.transaction_id }}
          KIND: ${{ needs.prepare.outputs.kind }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p transaction-artifacts
          if [ "$KIND" = "promotion" ]; then
            if [ ! -s candidate-receipts/desired-manifest.json ]; then
              mkdir -p candidate-receipts
              ARTIFACT_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=publication-candidate-receipts-$TRANSACTION_ID" --jq '.artifacts[0].id // empty')
              if [ -n "$ARTIFACT_ID" ]; then
                gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > candidate-receipts/receipts.zip
                unzip -q -o candidate-receipts/receipts.zip -d candidate-receipts/
                rm -f candidate-receipts/receipts.zip
              fi
            fi
            test -s candidate-receipts/desired-manifest.json || {
              echo "::error::candidate desired manifest missing in verify job"; exit 1;
            }
            test "$(jq -r '(.checksums // {}) | length' candidate-receipts/desired-manifest.json)" -gt 0 || {
              echo "::error::candidate desired manifest carries no per-route checksums; byte-equivalence verification would be HTTP-only"; exit 1;
            }
            cp candidate-receipts/desired-manifest.json transaction-artifacts/verification-manifest.json
          elif [ "$KIND" = "rollback" ]; then
            uv run python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.publication import journal
          tx = journal.read_transaction(Path('.'), os.environ['TRANSACTION_ID'], ref='publication')
          parent_id = (tx.restore_source or {}).get('parent_transaction_id')
          if not parent_id:
              raise SystemExit('rollback transaction missing restore_source parent_transaction_id')
          parent_tx = journal.read_transaction(Path('.'), parent_id, ref='publication')
          if not parent_tx.attestation or not parent_tx.attestation.get('routes'):
              raise SystemExit(f'parent transaction {parent_id} lacks live attestation routes for rollback verification')
          manifest = {
              'manifest_digest': tx.content.get('manifest_digest'),
              'checksums': {
                  r['path']: r['sha256']
                  for r in parent_tx.attestation['routes']
                  if r.get('sha256') and r.get('ok')
              }
          }
          with open('transaction-artifacts/verification-manifest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          PY
          else
            echo "::error::unrecognized transaction kind: $KIND"
            exit 1
          fi

      - name: Probe required live routes
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          TARGET_URL="${{ needs.deploy.outputs.page_url || 'https://benchbox.dev' }}"
          uv run python scripts/publication/verify_live.py \
            --base-url "$TARGET_URL" \
            --manifest transaction-artifacts/verification-manifest.json \
            --observation-origin github-actions:publication-transaction \
            --require-receipt \
            --require-complete-checksums \
            --timeout 60 \
            --json > transaction-artifacts/probe-report.json
          uv run python - <<'PY'
          import json
          report = json.load(open('transaction-artifacts/probe-report.json'))
          if not report.get('ok') or not report.get('probes'):
              raise SystemExit('live endpoint verification did not produce successful observations')
          if any(not probe.get('ok') for probe in report['probes']):
              raise SystemExit('one or more live endpoint observations failed')
          PY

      - name: Create and sign live receipt
        env:
          PUBLICATION_ATTESTOR_PRIVATE_KEY: ${{ secrets.PUBLICATION_ATTESTOR_PRIVATE_KEY }}
          TRANSACTION_ID: ${{ needs.prepare.outputs.transaction_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PUBLICATION_ATTESTOR_PRIVATE_KEY" || { echo "::error::attestor key is required"; exit 1; }
          uv run python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          from scripts.publication import journal
          from scripts.publication.transaction import canonical_json
          tx = journal.read_transaction(Path('.'), os.environ['TRANSACTION_ID'], ref='publication')
          report = json.load(open('transaction-artifacts/probe-report.json'))
          observation_digest = hashlib.sha256(canonical_json(report).encode()).hexdigest()
          receipt = {
              'schema_version': 1,
              'receipt_id': f"live-{tx.generation}-{tx.transaction_id}",
              'target': tx.target,
              'generation': tx.generation,
              'timestamp': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'manifest_digest': tx.content.get('manifest_digest'),
              'develop_sha': tx.content.get('develop_sha'),
              'published_results_sha': tx.content.get('published_results_sha'),
              'artifact': {
                  'archive_sha256': tx.artifact.get('archive_sha256'),
                  'site_tree_sha256': tx.artifact.get('site_tree_sha256'),
              },
              'artifact_digest': tx.artifact.get('archive_sha256') or tx.artifact.get('site_tree_sha256'),
              'observation_digest': observation_digest,
              'routes': report['probes'],
              'observation_origin': report['observation_origin'],
              'nonce': f"${{ github.run_id }}-${{ github.run_attempt }}",
              'freshness_window': '24h',
              'attestor': 'github-actions:publication-transaction',
              'signature_algorithm': 'ed25519',
              'prior_live_receipt_id': tx.parent_transaction_id,
              'receipt_run_id': "${{ github.run_id }}",
              'source_commit': tx.content.get('develop_sha'),
          }
          open('transaction-artifacts/live-receipt.json', 'w').write(json.dumps(receipt, sort_keys=True) + '\n')
          PY
          umask 077
          printf '%s' "$PUBLICATION_ATTESTOR_PRIVATE_KEY" > /tmp/publication-attestor-private-key.pem
          uv run python - <<'PY'
          import json
          from scripts.publication.reconciliation import canonical_live_receipt_payload
          receipt = json.load(open('transaction-artifacts/live-receipt.json'))
          open('/tmp/live-receipt-payload.json', 'wb').write(canonical_live_receipt_payload(receipt))
          PY
          openssl pkeyutl -sign -rawin -inkey /tmp/publication-attestor-private-key.pem -in /tmp/live-receipt-payload.json -out /tmp/live-receipt.sig
          SIGNATURE=$(base64 -w 0 /tmp/live-receipt.sig)
          rm -f /tmp/publication-attestor-private-key.pem /tmp/live-receipt-payload.json /tmp/live-receipt.sig
          SIGNATURE="$SIGNATURE" uv run python - <<'PY'
          import json, os
          path = 'transaction-artifacts/live-receipt.json'
          receipt = json.load(open(path))
          receipt['signature'] = os.environ['SIGNATURE']
          open(path, 'w').write(json.dumps(receipt, sort_keys=True) + '\n')
          PY

      - name: Record verification success in journal CAS
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/publication/transaction_executor.py record-verification \
            --transaction-id "${{ needs.prepare.outputs.transaction_id }}" \
            --probe-report transaction-artifacts/probe-report.json \
            --attestation transaction-artifacts/live-receipt.json \
            --challenge "challenge-${{ github.run_id }}" \
            --verifier-sha "${{ github.sha }}" \
            --github-token "$GH_TOKEN" \
            --ref "publication" \
            --repo-path "." \
            --output-tx transaction-artifacts/tx_verified.json

      - name: Upload attested live receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-live-receipt-${{ needs.prepare.outputs.generation }}
          path: transaction-artifacts/live-receipt.json
          retention-days: 90

      - name: Escalate failure if verification failed
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/publication/transaction_executor.py record-failure \
            --transaction-id "${{ needs.prepare.outputs.transaction_id }}" \
            --code "VERIFICATION_FAILURE" \
            --stage "verification" \
            --reason "Live endpoint verification failed" \
            --ref "publication" \
            --repo-path "." \
            --output-tx transaction-artifacts/tx_failed.json || true

  finalize:
    name: Finalize durable publication transaction
    needs: [prepare, deploy, verify]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      needs.verify.result == 'success' &&
      !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout control-plane source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Fetch publication journal
        shell: bash
        run: |
          git fetch origin refs/heads/publication:refs/heads/publication || true

      - name: Advance durable head in journal CAS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transaction-artifacts
          uv run python scripts/publication/transaction_executor.py finalize \
            --transaction-id "${{ needs.prepare.outputs.transaction_id }}" \
            --ref "publication" \
            --repo-path "." \
            --output-tx transaction-artifacts/tx_durable.json
