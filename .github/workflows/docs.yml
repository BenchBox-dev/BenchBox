name: Documentation

on:
  push:
    branches: [release, develop]
  workflow_dispatch:
    inputs:
      baseline_source_sha:
        description: "Protected develop ancestor to capture after a dropped push (40 lowercase hex characters)"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.event.pull_request.number) || format('docs-{0}-{1}', github.sha, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  visual-inputs:
    name: Public-site visual inputs
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
      source_sha: ${{ steps.paths.outputs.source_sha }}
      base_sha: ${{ steps.paths.outputs.base_sha }}
      baseline_candidates: ${{ steps.paths.outputs.baseline_candidates }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify site inputs and validate recovery source
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RECOVERY_SOURCE_SHA: ${{ inputs.baseline_source_sha }}
          CURRENT_SHA: ${{ github.sha }}
          CURRENT_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$CURRENT_SHA"
          if [ -n "$RECOVERY_SOURCE_SHA" ]; then
            if [ "$EVENT_NAME" != workflow_dispatch ] || [ "$CURRENT_REF" != refs/heads/develop ] || [[ ! "$RECOVERY_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Recovery requires a full lowercase SHA dispatched on develop."
              exit 1
            fi
            git fetch origin develop
            git merge-base --is-ancestor "$RECOVERY_SOURCE_SHA" origin/develop || {
              echo "::error::Recovery source must be an ancestor of protected develop."
              exit 1
            }
            SOURCE_SHA="$RECOVERY_SOURCE_SHA"
          fi
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          BASE_SHA="$PR_BASE_SHA"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" != pull_request ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Missing exact PR base SHA."
            exit 1
          fi
          git cat-file -e "$BASE_SHA^{commit}" || {
            echo "::error::Exact base commit is unavailable."
            exit 1
          }
          SITE_PATHS=(
            benchbox/ docs/ examples/ landing/ website/
            _project/scripts/explorer_pipeline/
            _project/scripts/explorer_publish.py
            _project/scripts/results_explorer_snapshot_invariants.py
            results-data/ results-explorer/ scripts/
            .github/workflows/docs.yml Makefile README.md pyproject.toml uv.lock
          )
          CHANGED_PATHS=$(git diff --name-only "$BASE_SHA"...HEAD -- "${SITE_PATHS[@]}")
          if [ -z "$CHANGED_PATHS" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
          CANDIDATES="$BASE_SHA"
          ANCESTORS=$(git rev-list --first-parent --max-count=25 "$BASE_SHA^" 2>/dev/null || true)
          for ANCESTOR in $ANCESTORS; do
            git diff --quiet "$ANCESTOR" "$BASE_SHA" -- "${SITE_PATHS[@]}" || break
            CANDIDATES="$CANDIDATES $ANCESTOR"
          done
          echo "baseline_candidates=$CANDIDATES" >> "$GITHUB_OUTPUT"

  build:
    needs: visual-inputs
    if: needs.visual-inputs.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.visual-inputs.outputs.source_sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Cache Sphinx build artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            docs/_build
          key: ${{ runner.os }}-sphinx-${{ hashFiles('docs/**', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-sphinx-

      - name: Generate documentation inputs
        run: make docs-generate

      - name: Build documentation
        run: |
          cd docs
          uv run sphinx-build -b html --keep-going . _build/html

      - name: Validate results-explorer lockfile
        if: hashFiles('results-explorer/package.json') != ''
        run: |
          test -f results-explorer/package-lock.json || {
            echo "results-explorer/package-lock.json is required for npm ci" >&2
            exit 1
          }

      - name: Set up Node.js
        if: hashFiles('results-explorer/package.json') != ''
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: results-explorer/package-lock.json

      - name: Install results-explorer dependencies
        if: hashFiles('results-explorer/package.json') != ''
        run: npm ci
        working-directory: results-explorer

      - name: Verify curated Explorer publication inputs
        if: hashFiles('results-explorer/package.json') != ''
        run: |
          test -d results-data/bundles
          test -d _project/scripts/explorer_pipeline
          test -f _project/scripts/explorer_publish.py
          test -f _project/scripts/results_explorer_snapshot_invariants.py

      - name: Typecheck results-explorer
        if: hashFiles('results-explorer/package.json') != ''
        run: npm run typecheck
        working-directory: results-explorer

      - name: Build explorer data (static pipeline)
        if: hashFiles('results-explorer/package.json') != ''
        run: uv run -- python _project/scripts/explorer_publish.py build --data-dir results-data/ --output results-explorer/public/data/

      - name: Validate explorer snapshot invariants
        if: hashFiles('results-explorer/package.json') != ''
        run: |
          test -s results-explorer/public/data/results.duckdb
          uv run -- python _project/scripts/results_explorer_snapshot_invariants.py results-explorer/public/data/results.duckdb

      - name: Build results-explorer
        if: hashFiles('results-explorer/package.json') != ''
        run: npm run build
        working-directory: results-explorer

      - name: Assemble public site
        run: uv run -- python scripts/assemble_public_site.py --site-dir site

      - name: Scan assembled site for privacy leaks
        run: uv run python scripts/publication/check_artifact_privacy.py site

      - name: Upload HTML artifacts
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site
          include-hidden-files: true

      - name: Upload assembled site for visual acceptance
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: public-site-assembled-${{ github.run_id }}
          path: site
          retention-days: 3

  public-site-visual-regression:
    name: Public-site visual regression
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'pull_request' && github.base_ref == 'develop')
    needs: [visual-inputs, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.visual-inputs.outputs.source_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: results-explorer/package-lock.json

      - name: Download assembled site
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: public-site-assembled-${{ github.run_id }}
          path: site

      - name: Install explorer dependencies
        run: npm ci
        working-directory: results-explorer

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: results-explorer

      - name: Capture public site
        env:
          E2E_PAGES_SHAPED: "1"
          E2E_SITE_DIR: ${{ github.workspace }}/site
          PUBLIC_SITE_VISUAL_PHASE: capture
          PUBLIC_SITE_VISUAL_OUTPUT: ${{ runner.temp }}/public-site-visual-current
          PUBLIC_SITE_VISUAL_SOURCE_SHA: ${{ needs.visual-inputs.outputs.source_sha }}
        run: npm run test:e2e:public-site
        working-directory: results-explorer

      - name: Download visual baseline for base or site-equivalent ancestor
        id: baseline
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLIC_SITE_VISUAL_BASE_SHA: ${{ needs.visual-inputs.outputs.base_sha }}
          PUBLIC_SITE_VISUAL_BASELINE_CANDIDATES: ${{ needs.visual-inputs.outputs.baseline_candidates }}
          PUBLIC_SITE_VISUAL_BASELINE: ${{ runner.temp }}/public-site-visual-baseline
        run: node scripts/download-public-site-visual-baseline.mjs
        working-directory: results-explorer

      - name: Compare public site with exact base
        if: github.event_name == 'pull_request'
        env:
          E2E_PAGES_SHAPED: "1"
          E2E_SITE_DIR: ${{ github.workspace }}/site
          PUBLIC_SITE_VISUAL_PHASE: compare
          PUBLIC_SITE_VISUAL_OUTPUT: ${{ runner.temp }}/public-site-visual-current
          PUBLIC_SITE_VISUAL_BASELINE: ${{ runner.temp }}/public-site-visual-baseline
          PUBLIC_SITE_VISUAL_BASE_SHA: ${{ steps.baseline.outputs.baseline_sha }}
          PUBLIC_SITE_VISUAL_REQUIRE_BASELINE: "1"
          PUBLIC_SITE_VISUAL_SOURCE_SHA: ${{ needs.visual-inputs.outputs.source_sha }}
          PR_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
          APPROVED_HEAD_SHA: ${{ github.event_name == 'pull_request' && vars.APPROVED_HEAD_SHA || '' }}
          APPROVAL_REASON: ${{ github.event_name == 'pull_request' && vars.APPROVAL_REASON || '' }}
        run: npm run test:e2e:public-site
        working-directory: results-explorer

      - name: Upload protected-develop visual baseline
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: public-site-visual-baseline-${{ needs.visual-inputs.outputs.source_sha }}
          path: ${{ runner.temp }}/public-site-visual-current
          retention-days: 30

      - name: Upload visual diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: public-site-visual-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/public-site-visual-current
            results-explorer/test-results
            results-explorer/playwright-report
          if-no-files-found: ignore
          retention-days: 3

  public-site-visual-required:
    name: Public-site visual acceptance
    if: always()
    needs: [visual-inputs, build, public-site-visual-regression]
    runs-on: ubuntu-latest
    env:
      INPUT_RESULT: ${{ needs.visual-inputs.result }}
      SITE_CHANGED: ${{ needs.visual-inputs.outputs.changed }}
      BUILD_RESULT: ${{ needs.build.result }}
      VISUAL_RESULT: ${{ needs.public-site-visual-regression.result }}
      EVENT_NAME: ${{ github.event_name }}
      BASE_REF: ${{ github.base_ref }}
    steps:
      - name: Require comparison for affected develop trees
        shell: bash
        run: |
          set -euo pipefail
          if [ "$INPUT_RESULT" != success ]; then
            echo "::error::Public-site input classification failed."
            exit 1
          fi
          if [ "$EVENT_NAME" = pull_request ] && [ "$BASE_REF" != develop ]; then
            exit 0
          fi
          if [ "$EVENT_NAME" != pull_request ]; then
            exit 0
          fi
          if [ "$SITE_CHANGED" = false ]; then
            echo 'No public-site input changed.'
            exit 0
          fi
          if [ "$SITE_CHANGED" != true ] || [ "$BUILD_RESULT" != success ] || [ "$VISUAL_RESULT" != success ]; then
            echo "::error::Changed public-site inputs require a successful build and exact-base visual comparison."
            exit 1
          fi

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    outputs:
      skipped: ${{ steps.independent.outputs.skipped }}
      skipped_deployment_id: ${{ steps.capture-deployment.outputs.deployment_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Check for independent publication ownership
        id: independent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE=false
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | select(.name | startswith("publication-live-receipt-")) | "\(.created_at) \(.id) \(.workflow_run.id)"' \
            | sort -r > independent-publication-runs.txt
          while read -r _CREATED_AT ARTIFACT_ID RUN_ID; do
            [ -n "${RUN_ID:-}" ] || continue
            RUN_META=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" \
              --jq '[.name, .status, .conclusion, .event, .head_branch] | @tsv')
            IFS=$'\t' read -r RUN_NAME RUN_STATUS RUN_CONCLUSION RUN_EVENT RUN_BRANCH <<< "$RUN_META"
            if [[ ( "$RUN_NAME" != "Publication Control Plane Deployment" && "$RUN_NAME" != "Publication Transactions" ) || "$RUN_STATUS" != "completed" || \
                  "$RUN_EVENT" != "workflow_dispatch" || "$RUN_BRANCH" != "develop" ]]; then
              continue
            fi
            rm -rf independent-receipt && mkdir independent-receipt
            gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > independent-receipt.zip
            unzip -q independent-receipt.zip -d independent-receipt
            if EXPECTED_RUN_ID="$RUN_ID" RUN_CONCLUSION="$RUN_CONCLUSION" python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from scripts.publication.reconciliation import verify_live_receipt_signature

          path = Path("independent-receipt/live-receipt.json")
          if not path.is_file():
              raise SystemExit(1)
          receipt = json.loads(path.read_text())
          valid, _ = verify_live_receipt_signature(receipt)
          target = receipt.get("target")
          target_host = target.get("host") if isinstance(target, dict) else target
          if isinstance(target, dict) and not target_host:
              base_url = target.get("base_url") or target.get("url")
              target_host = str(base_url or "").rstrip("/").split("://")[-1]
          if not valid or target_host != "benchbox.dev":
              raise SystemExit(1)
          receipt_run = (
              receipt.get("receipt_run_id")
              or receipt.get("artifact_run_id")
              or receipt.get("workflow_run_id")
              or receipt.get("writer_run_id")
          )
          if str(receipt_run) != os.environ["EXPECTED_RUN_ID"]:
              raise SystemExit(1)
          source_commit = receipt.get("source_commit") or receipt.get("develop_sha")
          if not re.fullmatch(r"[0-9a-f]{40}", str(source_commit or "")):
              raise SystemExit(1)
          if os.environ["RUN_CONCLUSION"] != "success":
              if not str(receipt.get("receipt_id", "")).startswith("rollback-"):
                  raise SystemExit(1)
              if not receipt.get("routes") or not all(route.get("ok") for route in receipt["routes"]):
                  raise SystemExit(1)
          PY
            then
              ACTIVE=true
              break
            fi
          done < independent-publication-runs.txt
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"
          if [ "$ACTIVE" = "true" ]; then
            echo "::notice::Independent publication owns Pages; skipping the legacy release deployment"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.independent.outputs.active != 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

      - name: Capture this run's skipped deployment record
        id: capture-deployment
        if: steps.independent.outputs.skipped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_STARTED=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}" \
            --jq '.run_started_at // .created_at // empty')
          if [ -z "${RUN_STARTED:-}" ]; then
            echo "::warning::Could not determine current run start time; skipping inactive marker."
            echo "deployment_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export SINCE="$RUN_STARTED"
          DEPLOYMENT_ID=$(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&sha=${{ github.sha }}&per_page=100" \
            --jq '[.[] | select(.ref == "release") | select(.created_at >= env.SINCE)] | sort_by(.created_at) | last | .id // empty')
          if [ -z "${DEPLOYMENT_ID:-}" ]; then
            echo "::warning::No release-ref github-pages deployment record found for this run; skipping inactive marker."
          fi
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"

  record-skipped-deployment:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release' && needs.deploy.outputs.skipped == 'true' && needs.deploy.outputs.skipped_deployment_id != ''
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      deployments: write
    steps:
      - name: Record skipped deployment
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ needs.deploy.outputs.skipped_deployment_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${{ github.repository }}/deployments/$DEPLOYMENT_ID/statuses" \
            -f state="inactive" \
            -F auto_inactive=false \
            -f description="Superseded: independent publication owns Pages; legacy release deployment skipped." \
            --jq '.state' > /dev/null
          echo "::notice::Legacy release deployment skipped and recorded as inactive; independent publication owns Pages."

  example-validation:
    needs: visual-inputs
    if: needs.visual-inputs.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Validate example file references
        run: uv run python scripts/validate_example_references.py

      - name: Check example file syntax
        run: uv run python scripts/check_example_syntax.py

      - name: Validate visualization screenshot sync
        run: uv run python scripts/validate_visualization_images.py

      - name: Check /prompts/ catalog is fresh
        run: uv run -- python scripts/generate_landing_quickstarts.py --check

      - name: Check for unsafe patch() string paths in tests
        run: uv run python scripts/check_patch_safety.py

  linkcheck:
    needs: visual-inputs
    if: needs.visual-inputs.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Generate documentation inputs
        run: make query-docs

      - name: Check documentation links
        run: |
          cd docs
          uv run sphinx-build -b linkcheck . _build/linkcheck

      - name: Upload linkcheck report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: linkcheck-report
          path: docs/_build/linkcheck

  spellcheck:
    needs: visual-inputs
    if: needs.visual-inputs.outputs.changed == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Run codespell
        uses: codespell-project/actions-codespell@e3258cca84ce02b0bb36a3d41f2c18f719a0cc1a
        with:
          ignore_words_file: .codespell-ignore.txt
          skip: "*.pyc,_build,*.json,*.lock,*.svg,*.min.js,*.min.css,_binaries,*.tpl,*.dst,*.tbl,_sources,benchmark_runs,*.dat,*.pdf,_project,_blog,htmlcov,.venv"
