name: Publication Watchdog

# The watchdog reads the journal and reports unresolved or stale operations.
# It never submits a Pages write, finalizes a transaction, or compensates an
# unknown provider outcome. An operator can start a fresh protected transaction
# after provider finality is established.

on:
  workflow_run:
    workflows:
      - "Publication Transactions"
      - "Publication Control Plane Deployment"
      - "Publication Preview Deploy (G2)"
    types:
      - completed
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-watchdog
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  scan:
    name: Scan and report publication state
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout trusted controller code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Fetch publication journal
        run: |
          set -euo pipefail
          git fetch origin refs/heads/publication:refs/heads/publication

      - name: Authenticate triggering workflow
        if: github.event_name == 'workflow_run'
        env:
          TRIGGER_REPO_ID: ${{ github.event.workflow_run.repository.id }}
          EXPECTED_REPO_ID: ${{ github.repository_id }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
        run: |
          set -euo pipefail
          test -z "$TRIGGER_REPO_ID" || test "$TRIGGER_REPO_ID" = "$EXPECTED_REPO_ID" || {
            echo "::error::triggering repository does not match this repository"
            exit 1
          }
          test "$TRIGGER_EVENT" != "pull_request" || {
            echo "Ignoring pull request producer run $TRIGGER_RUN_ID"
            exit 0
          }
          echo "Scanning completion of $TRIGGER_WORKFLOW_PATH run $TRIGGER_RUN_ID"

      - name: Run observational watchdog scan
        env:
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        run: |
          set -euo pipefail
          mkdir -p watchdog
          set +e
          uv run python scripts/publication/transaction_executor.py watchdog-scan \
            --repo-path . --ref publication --trigger-run-id "$TRIGGER_RUN_ID" --output-json watchdog/report.json
          scan_code=$?
          set -e
          test -s watchdog/report.json || {
            echo "::error::watchdog did not produce a report"
            exit "$scan_code"
          }
          cat watchdog/report.json
          status=$(jq -r '.status // "unknown"' watchdog/report.json)
          if [ "$status" = "stale_transaction" ] || [ "$status" = "corrupt_journal" ]; then
            echo "::error::publication watchdog requires operator reconciliation: $status"
            exit 1
          elif [ "$status" != "idle" ]; then
            echo "::warning::publication watchdog outcome: $status"
          fi

      - name: Upload watchdog report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: publication-watchdog-${{ github.run_id }}-${{ github.run_attempt }}
          path: watchdog/
          retention-days: 30
