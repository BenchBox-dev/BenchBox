name: Orphaned Commit Detector

# Scheduled backstop for the auto-merge-on-open stranding class of bug: a commit
# pushed to a feature branch AFTER its only PR already squash-merged and closed
# is never covered by any pull_request event, so its content silently never
# reaches develop (see _project/analysis/auto-merge-stranding-forensic.md). This
# happened three times in the results-explorer/publication remediation and was
# only caught by a manual adversarial re-review. This job catches the next one
# automatically.
#
# It compares, for every branch whose PR merged, the branch tip against the PR's
# pre-squash head reported by the GitHub API — squash-proof, no patch-id guess.
# Historical/resolved cases are allowlisted in
# _project/analysis/known-stranded-commits.txt; only a NEW orphan fails the run.

on:
  schedule:
    # Weekly, Monday 07:00 UTC (after the submission-validator drift check).
    - cron: "0 7 * * 1"
  workflow_dispatch: {}
  # Run on EVERY develop push, not just changes to the detector itself.
  #
  # The weekly schedule above is a backstop, not a guard: it leaves up to seven
  # days in which develop is silently missing a change that everyone believes
  # landed. That is not hypothetical - PR #1503 auto-merged carrying only its
  # first commit, and the orphan (b5c56ea9) was found by hand days before the
  # schedule would have fired. A develop push is exactly the moment a squash
  # merge can strand a commit, so check then.
  #
  # The job is read-only and finishes in ~1 minute; running it per merge is the
  # difference between catching a stranded commit in one build and in one week.
  # Every branch, not just develop.
  #
  # A develop-only trigger cannot catch this race, and that is worth spelling
  # out because it looks like it should. The stranding sequence is: PR merges
  # (develop push fires here) -> THEN the later commit is pushed to the feature
  # branch. At the moment the develop push runs, the orphan does not exist yet,
  # so the run that looks best-placed to catch it is structurally too early.
  # The push that creates the orphan is the push to the feature branch, so that
  # is the event to watch.
  #
  # The develop push is still useful - it catches orphans stranded by an
  # earlier merge - so both are covered by simply not filtering branches.
  #
  # Cost: a read-only ~1 minute job per push. That is the price of catching a
  # stranded commit at the moment it is created rather than up to a week later.
  push:

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    name: Detect orphaned commits on dead branches
    runs-on: ubuntu-latest
    steps:
      # Check out the pushed commit, NOT a hardcoded develop.
      #
      # The detector reads its allowlist and its own source from the checkout,
      # but compares branches against the remote, so the ref only decides
      # *which version of the allowlist* is in force. Pinning develop meant a
      # push that adds an allowlist entry was still judged by develop's older
      # allowlist - so a branch acknowledging an orphan could never make its own
      # run pass, and the check stayed red until after it merged. On the
      # schedule trigger this resolves to develop's head anyway.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all remote branches
        run: git fetch --no-tags origin "+refs/heads/*:refs/remotes/origin/*"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run detector
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: uv run -- python _project/scripts/detect_orphaned_commits.py
