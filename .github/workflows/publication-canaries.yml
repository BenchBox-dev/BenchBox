name: Publication Canaries & Drift Reconciliation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-canaries-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  availability_probe:
    name: Probe Live Publication Endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Prepare report directory
        run: mkdir -p diagnostic-reports

      - name: Probe live publication endpoints
        run: |
          uv run python scripts/publication/verify_live.py \
            --base-url https://benchbox.dev \
            --json > diagnostic-reports/availability-report.json
          cat diagnostic-reports/availability-report.json

      - name: Upload availability probe report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: availability-probe-report
          path: diagnostic-reports/availability-report.json
          retention-days: 7

  canaries:
    name: Run Publication Canaries and Drift Reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Prepare diagnostic report directory
        if: always()
        run: |
          mkdir -p diagnostic-reports
          echo "EVIDENCE_DIR=$RUNNER_TEMP/publication-evidence" >> "$GITHUB_ENV"

      - name: Run 4-way reconciliation and drift checks
        id: reconciliation
        run: |
          set -o pipefail
          rc=0
          uv run python scripts/publication/reconciliation.py \
            --manifest "${EVIDENCE_DIR}/desired-manifest.json" \
            --receipts-dir "${EVIDENCE_DIR}/reconciliation" \
            --json > diagnostic-reports/reconciliation-report.json || rc=$?
          cat diagnostic-reports/reconciliation-report.json || true
          if [ "$rc" -ne 0 ]; then
            echo "::error::reconciliation canary could not verify live publication (exit ${rc}); no fabricated pass"
          fi
          exit "$rc"

      - name: Run four-lane independence matrix verification
        id: independence
        if: always()
        run: |
          set -o pipefail
          rc=0
          uv run python scripts/publication/verify_independence_matrix.py \
            --receipts-dir "${EVIDENCE_DIR}/independence" \
            --json > diagnostic-reports/independence-matrix-report.json || rc=$?
          cat diagnostic-reports/independence-matrix-report.json || true
          if [ "$rc" -ne 0 ]; then
            echo "::error::independence canary could not verify recorded lane transitions (exit ${rc})"
          fi
          exit "$rc"

      - name: Audit operational receipts and capacity/retention
        id: operational_receipts
        if: always()
        run: |
          set -o pipefail
          rc=0
          uv run python scripts/publication/check_operational_receipts.py \
            --receipts-dir "${EVIDENCE_DIR}/operational" \
            --json > diagnostic-reports/operational-receipts-report.json || rc=$?
          cat diagnostic-reports/operational-receipts-report.json || true
          if [ "$rc" -ne 0 ]; then
            echo "::error::operational receipts canary could not verify real drill/capacity/retention evidence (exit ${rc})"
          fi
          exit "$rc"

      - name: Upload diagnostic canary reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: publication-canary-reports
          path: diagnostic-reports/
          retention-days: 7

  certification:
    name: Evaluate Five-Dimension Operational Certification
    needs: [availability_probe, canaries]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Prepare report directory
        run: mkdir -p diagnostic-reports

      - name: Download availability probe report
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: availability-probe-report
          path: diagnostic-reports
        continue-on-error: true

      - name: Download diagnostic canary reports
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: publication-canary-reports
          path: diagnostic-reports
        continue-on-error: true

      - name: Evaluate operational certification
        run: |
          uv run python scripts/publication/verify_live.py \
            --certify-reports-dir diagnostic-reports/ \
            --json > diagnostic-reports/certification-report.json || cert_rc=$?
          cat diagnostic-reports/certification-report.json || true
          exit "${cert_rc:-0}"
