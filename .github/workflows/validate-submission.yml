name: Validate Submission

on:
  pull_request:
    branches:
      - published-results
    paths:
      - "results-data/bundles/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate result bundles
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for diff

      - name: Reject validator or workflow changes in a submission PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Self-green defense: a corpus submission PR must only touch corpus
          # data. If it also modifies the validator, its shared implementation,
          # the inventory generator, or this workflow, it could run its OWN
          # doctored validator and pass itself. Validator/workflow changes belong
          # on develop (they reach this branch only via a maintainer-reviewed
          # mirror), never in a contributor submission PR.
          CHANGED_GUARD=$(git diff --name-only "$BASE_SHA"...HEAD -- \
            scripts/validate_submission.py \
            benchbox/validation/bundle.py \
            scripts/generate_corpus_inventory.py \
            .github/workflows/validate-submission.yml \
            || true)
          if [ -n "$CHANGED_GUARD" ]; then
            echo "::error::This submission PR modifies validator/workflow files, which is not allowed:"
            printf '%s\n' "$CHANGED_GUARD"
            echo "Revert these files and open a separate develop PR for validator/workflow changes."
            exit 1
          fi
          echo "No validator/workflow files changed - proceeding."

      - name: Reject non-maintainer vendor/ additions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          # The vendor-supplied trust label is RANKING-ELIGIBLE and is granted
          # purely by a bundle living under results-data/bundles/vendor/ (see
          # scripts/generate_corpus_inventory.py::_is_vendor_subtree). A community
          # contributor must not be able to self-grant that tier by dropping a
          # file there. Only maintainers may add under vendor/. This is the
          # ENFORCED half of the vendor-label governance; the manifest
          # result_source check in benchbox/validation/bundle.py is advisory only
          # (an attacker can omit result_source and the path alone grants the
          # label). author_association is set by GitHub from the actor's repo
          # relationship and cannot be set by PR content; fork PRs (how community
          # contributors submit) run this base-branch copy of the workflow, so the
          # gate cannot be edited away in the same PR.
          VENDOR_CHANGES=$(git diff --name-only "$BASE_SHA"...HEAD -- \
            'results-data/bundles/vendor/**' || true)
          if [ -n "$VENDOR_CHANGES" ]; then
            case "$AUTHOR_ASSOCIATION" in
              OWNER | MEMBER | COLLABORATOR)
                echo "Maintainer ($AUTHOR_ASSOCIATION) vendor/ addition - allowed."
                ;;
              *)
                echo "::error::This PR adds or modifies files under results-data/bundles/vendor/, which grants the ranking-eligible vendor-supplied label. Only maintainers may do this:"
                printf '%s\n' "$VENDOR_CHANGES"
                echo "Community submissions belong in results-data/bundles/ (not vendor/). Author association: ${AUTHOR_ASSOCIATION}."
                exit 1
                ;;
            esac
          fi
          echo "No non-maintainer vendor/ additions - proceeding."

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Find changed bundles
        id: changed
        run: |
          # Find new/modified bundle JSONs in this PR (exclude companions and metadata files).
          # Use the base SHA directly rather than a ref name for reliability.
          CHANGED=$(git diff --name-only --diff-filter=ACMR ${{ github.event.pull_request.base.sha }}...HEAD -- 'results-data/bundles/*.json' 'results-data/bundles/**/*.json' \
            | grep -v '\.plans\.json$' \
            | grep -v '\.tuning\.json$' \
            | grep -v 'corpus-inventory\.json$' \
            | grep -v '\.manifest\.json$' \
            | grep -v 'submission-manifest\.json$' \
            || true)

          # Detect changed manifest files separately. A manifest-only PR skips
          # both validate_submission.py and the corpus inventory check because
          # CHANGED stays empty — but manifests carry the bundle hash contract,
          # so a bad manifest edit can merge without verifying the hash. For each
          # changed manifest, derive its paired bundle path and add it to CHANGED
          # so the existing validation step covers manifest-only PRs too.
          # Include deletions (D): removing a manifest while leaving its paired
          # bundle is a contract change that must still trip validation and the
          # corpus inventory drift check, so a manifest removal cannot bypass it.
          CHANGED_MANIFESTS=$(git diff --name-only --diff-filter=ACMRD \
            ${{ github.event.pull_request.base.sha }}...HEAD -- \
            'results-data/bundles/*.json' 'results-data/bundles/**/*.json' \
            | grep '\.manifest\.json$' \
            || true)
          if [ -n "$CHANGED_MANIFESTS" ]; then
            while IFS= read -r manifest; do
              bundle="${manifest%.manifest.json}.json"
              # Only add if the paired bundle exists and is not already in CHANGED.
              # For a deleted manifest whose bundle remains, the bundle still
              # exists at HEAD and is added; if both were removed, there is no
              # bundle to validate (the bundle deletion is covered on its own).
              if git cat-file -e "HEAD:${bundle}" 2>/dev/null \
                  && ! printf '%s\n' "$CHANGED" | grep -qxF "$bundle"; then
                CHANGED="${CHANGED:+${CHANGED}$'\n'}${bundle}"
              fi
            done <<< "$CHANGED_MANIFESTS"
          fi

          if [ -z "$CHANGED" ]; then
            echo "No bundle files changed."
            echo "has_bundles=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changed bundles:"
            echo "$CHANGED"
            echo "has_bundles=true" >> "$GITHUB_OUTPUT"
            # Write to a file so we can pass multi-line to the script
            echo "$CHANGED" > /tmp/changed_bundles.txt
          fi

      - name: Validate bundles
        if: steps.changed.outputs.has_bundles == 'true'
        id: validate
        env:
          # Maintainer corpus mirrors are opened by sync-results-data-to-published.yml
          # on `auto/results-mirror-<sha>` branches and legitimately carry
          # maintainer-run bundles with no sidecar. Every other PR is a community
          # submission, which must include the manifest sidecar (its presence is
          # the community-submission trust signal). Require the sidecar unless
          # this is a maintainer mirror PR.
          #
          # The waiver gates on TWO signals, and `head.repo.fork` is the load-bearing
          # one: `github.head_ref` is attacker-controlled on fork PRs, so a branch
          # name alone (`auto/results-mirror-*`) is spoofable — anyone could open a
          # fork PR from a branch so named and drop `--require-manifest`, laundering
          # a community bundle into a maintainer-run (ranking-eligible) stamp. The
          # branch pattern only narrows *which* same-repo PRs qualify; the
          # `head.repo.fork == false` check (unforgeable — a fork PR cannot present
          # itself as same-repo) is what actually confines the waiver to the trusted
          # sync bot, whose mirror branches live on this repo. If both aren't
          # satisfied we fail closed and require the sidecar.
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          REQUIRE_MANIFEST="--require-manifest"
          if [ "$IS_FORK" = "false" ]; then
            case "$HEAD_REF" in
              auto/results-mirror-*) REQUIRE_MANIFEST="" ;;
            esac
          fi
          # Validate and generate PR comment in a single invocation.
          # --pr-comment writes the Markdown file; exit code reflects validation result.
          xargs -d '\n' uv run -- python scripts/validate_submission.py $REQUIRE_MANIFEST --pr-comment /tmp/pr_comment.md < /tmp/changed_bundles.txt \
            | tee /tmp/validation_output.txt

      - name: Check corpus inventory
        if: steps.validate.outcome == 'success'
        run: uv run -- python scripts/generate_corpus_inventory.py --check

      # Stage the validation comment as an artifact so the workflow_run companion
      # (validate-submission-comment.yml) can post it from the trusted base
      # context. Fork PRs run this workflow with a read-only GITHUB_TOKEN, so the
      # inline "Post PR comment" step below 403s for them — the companion is the
      # path that actually delivers the comment for external contributors.
      #
      # This artifact carries ONLY the comment body. It intentionally does NOT
      # carry a PR number: this workflow runs PR-supplied code before this step
      # (the validator/workflow-edit guard above is not exhaustive), so anything
      # written here is attacker-influenced, and the companion posts with a
      # writable token. The companion instead derives the target PR from
      # GitHub's own record of which PR the run's head commit belongs to.
      - name: Stage validation comment artifact
        if: steps.changed.outputs.has_bundles == 'true' && always()
        run: |
          mkdir -p /tmp/pr-comment-artifact
          if [ -f /tmp/pr_comment.md ]; then
            cp /tmp/pr_comment.md /tmp/pr-comment-artifact/pr_comment.md
          fi

      - name: Upload validation comment artifact
        if: steps.changed.outputs.has_bundles == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: submission-validation-comment
          path: /tmp/pr-comment-artifact/
          if-no-files-found: warn
          retention-days: 3

      # Same-repo fast path: post the comment inline with the writable token.
      # continue-on-error so a fork PR's read-only-token 403 here never turns a
      # passing validation red — the companion delivers the comment instead. On
      # same-repo PRs the companion later finds this comment by marker and updates
      # it in place (idempotent), so there is no duplicate.
      - name: Post PR comment (same-repo fast path)
        if: steps.validate.outcome != 'skipped' && always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/pr_comment.md', 'utf8');

            // Find and update existing comment, or create a new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '## Submission Validation';
            const existing = comments.find(c =>
              c.body.trimStart().startsWith(marker) &&
              (c.user.type === 'Bot' || c.user.login === 'github-actions[bot]')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: No bundles changed
        if: steps.changed.outputs.has_bundles == 'false'
        run: echo "No result bundles changed in this PR - skipping validation."
