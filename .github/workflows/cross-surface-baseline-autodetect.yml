name: Cross-Surface Baseline Auto-Prune

# Weekly maintenance job (cross-surface-baseline-stale-entry-autodetect).
#
# #903 made every enforced cross-surface SQL<->DataFrame equivalence gate
# (benchbox/core/equivalence/cross_surface.py GATES; run on every PR by
# pr.yml's correctness-gate job) FAIL a normal, blocking run when a
# known_divergences baseline entry stops reproducing - printing "GATE FAILURE
# - previously-known divergences now equivalent: [...]" and telling the
# operator to prune the stale entry in a reviewed change. #935 built the
# --update-baseline writer (`make cross-surface-update-baseline
# BENCHMARK=<gate>`) that does the actual prune, but invoking it stayed a
# fully manual step.
#
# This workflow automates NOTICING that condition across every enforced gate
# and opening a reviewable PR with the pruned baseline. It reimplements
# nothing: _project/scripts/cross_surface_baseline_autodetect.py only READS
# each gate's own resolved-key report and invokes the EXISTING
# run_gate(..., update_baseline=True) writer - see that script's module
# docstring. The blocking gate run (pr.yml, `make
# <gate>-cross-surface-equivalence-report`) is completely unmodified by this
# change and never prunes; this scheduled workflow is the ONLY path that ever
# writes benchbox/core/equivalence/cross_surface_baseline.yaml.
#
# Soundness note: that YAML lives under benchbox/core/equivalence/**, a
# CODEOWNERS soundness path (see _project/scripts/auto_merge_soundness_paths.py).
# auto-merge-on-open.yml already refuses to enable auto-merge for any PR whose
# diff touches that path, so the PR this workflow opens never auto-merges
# regardless of which identity authors it - and this workflow additionally
# never calls `gh pr merge --auto` itself. The maintainer reviews the diff
# (which can only ever DROP a no-longer-reproducing entry - see the writer's
# own contract in known_divergences_baseline.py) and merges by hand.
#
# Optional secret (never required for correctness, only for CI signal):
#   CROSS_SURFACE_BASELINE_PR_TOKEN = a fine-grained PAT (this repo; contents +
#     pull-requests: write) or GitHub App installation token.
# Rationale (mirrors todo-db-export.yml): GitHub does not trigger downstream
# workflows for events raised by the built-in GITHUB_TOKEN, so a PR opened
# with it never runs pr.yml and the maintainer sees no CI status on the diff
# before reviewing. A non-GITHUB_TOKEN identity makes pr.yml run so that
# signal is available. Without this secret the job still runs and still opens
# the PR - just without pr.yml firing on it; the PR still never auto-merges
# either way.

on:
  schedule:
    # Weekly, Sunday 10:00 UTC - after todo-db-export (09:00) and distinct
    # from the daily 03/06/08 UTC canaries, to avoid runner contention. This
    # is routine low-priority baseline hygiene, not a release-blocking check.
    - cron: '0 10 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cross-surface-baseline-autodetect
  cancel-in-progress: false

env:
  SUMMARY_PATH: _project/cross-surface-baseline-autodetect/summary.json
  PRUNE_BRANCH: chore/cross-surface-baseline-autoprune
  BASELINE_PATH: benchbox/core/equivalence/cross_surface_baseline.yaml

jobs:
  detect-and-prune:
    name: Detect + prune resolved cross-surface baseline entries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          # A non-default identity so this workflow's own push/PR events
          # (unlike the built-in GITHUB_TOKEN's) trigger pr.yml on the
          # opened PR - see the header note. Falls back to github.token when
          # the PAT is not provisioned; the job still runs either way.
          token: ${{ secrets.CROSS_SURFACE_BASELINE_PR_TOKEN || github.token }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --group dev

      - name: Detect resolved entries and prune via the existing writer
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${SUMMARY_PATH}")"
          uv run -- python _project/scripts/cross_surface_baseline_autodetect.py \
            --json-out "${SUMMARY_PATH}"

      - name: Surface gates needing manual attention
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f "${SUMMARY_PATH}" ]; then
            echo "detect step produced no summary - see the failing step above"
            exit 0
          fi
          uv run -- python - <<'PY'
          import json
          import os

          with open(os.environ["SUMMARY_PATH"], encoding="utf-8") as fh:
              summary = json.load(fh)

          for gate in summary.get("needs_attention", []):
              print(
                  f"::warning::{gate}: a resolved cross-surface baseline entry could not be "
                  "fully auto-pruned (a code-only ClassifiedDivergence entry, or another "
                  "failure on the same run) - see the job log above, and prune "
                  "benchbox/core/equivalence/cross_surface.py by hand if needed."
              )
          PY

      - name: Check for baseline changes
        id: diff
        run: |
          set -euo pipefail
          git add "${BASELINE_PATH}"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push prune branch
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "benchbox-bot"
          git config user.email "benchbox-bot@users.noreply.github.com"
          git fetch --no-tags origin "${PRUNE_BRANCH}:refs/remotes/origin/${PRUNE_BRANCH}" 2>/dev/null || true
          git checkout -B "${PRUNE_BRANCH}"
          git commit -m "chore(equivalence): prune resolved cross-surface baseline entries" \
            -m "Auto-generated by .github/workflows/cross-surface-baseline-autodetect.yml. Only known-divergence entries that no longer reproduce on the enforced gates were removed (via the existing make cross-surface-update-baseline writer); no still-reproducing entry is touched. Soundness-path PR: review the diff, then merge by hand - see the workflow header."
          git push --force-with-lease origin "${PRUNE_BRANCH}"

      - name: Open or update PR (never auto-merge - soundness path)
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CROSS_SURFACE_BASELINE_PR_TOKEN || github.token }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --base develop --head "${PRUNE_BRANCH}" --state open --json number --jq '.[0].number // empty')"
          body_file="$(mktemp)"
          {
            echo "Automated prune of resolved cross-surface known-divergence baseline entries."
            echo ""
            echo "\`_project/scripts/cross_surface_baseline_autodetect.py\` ran every enforced"
            echo "gate (\`benchbox/core/equivalence/cross_surface.py:GATES\`), read each gate's own"
            echo "\"previously-known divergences now equivalent\" report, and invoked the EXISTING"
            echo "\`--update-baseline\` writer (\`make cross-surface-update-baseline\`) to drop only"
            echo "entries that no longer reproduce. No still-reproducing entry is touched, and the"
            echo "blocking PR gate (\`make <gate>-cross-surface-equivalence-report\`) never prunes -"
            echo "this scheduled workflow is the only path that writes this file."
            echo ""
            echo "**This PR does not auto-merge.** \`benchbox/core/equivalence/**\` is a"
            echo "soundness-critical CODEOWNERS path; review the diff (it can only ever REMOVE a"
            echo "resolved entry - see the writer's own contract) and merge by hand."
            echo ""
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "${body_file}"
          if [ -z "${existing}" ]; then
            gh pr create --base develop --head "${PRUNE_BRANCH}" \
              --title "chore(equivalence): prune resolved cross-surface baseline entries" \
              --body-file "${body_file}"
          else
            echo "PR #${existing} already open for ${PRUNE_BRANCH}; updating body."
            gh pr edit "${existing}" --body-file "${body_file}"
          fi
          # Auto-merge is never enabled here, by design (soundness path) -
          # regardless of which token authored this PR.

      - name: No changes
        if: steps.diff.outputs.changed == 'false'
        run: echo "No resolved cross-surface baseline entries this run - nothing to prune."

      - name: Upload autodetect summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-surface-baseline-autodetect-summary
          path: ${{ env.SUMMARY_PATH }}
          retention-days: 30
