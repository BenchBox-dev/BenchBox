name: Develop post-merge

# Safety net for strict-checks-off and stale-PR flows alike: once a PR lands,
# run the same lightweight local gates against the actual develop tip. This is
# intentionally narrower than test.yml's full PR matrix so it does not turn
# every squash merge into the heavyweight optional suite.

on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: develop-post-merge-${{ github.sha }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run CI lint mirror
        run: make ci-lint

  fast-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run CI fast-test mirror
        run: make ci-test

  explorer-tokens:
    name: explorer-tokens
    # Re-run the token-scan gate against the merged develop tree so that a
    # squash race that reintroduces raw Tailwind palette literals trips the
    # auto-revert path even when each PR-time scan passed against its own
    # pre-merge tree. Stdlib-only so no dependency sync is required.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run explorer token scan
        run: make lint-explorer-tokens

      - name: Run public site theme token scan
        run: make lint-site-theme-tokens

  close-orphaned-prs:
    name: close-orphaned-prs
    needs: [lint, fast-test, explorer-tokens]
    # When a squash merge to develop lands one of several open PRs whose
    # branches share linear history (e.g. two worktrees produced overlapping
    # branches where one is a strict ancestor of the other), the squash hides
    # the original commit lineage and the unmerged-but-fully-contained PRs sit
    # open forever. GitHub's own auto-close heuristic does not fire on squash
    # merges.
    #
    # Detection: find the PR associated with this squash commit and recover
    # its original (un-squashed) branch tip via the GraphQL API. Any other
    # open PR whose head commit is a git ancestor of that tip has all of its
    # content already on develop and can be closed safely.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      MERGED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Close PRs whose branches are ancestors of the merged PR
        shell: bash
        run: |
          set -euo pipefail

          repo_name="${GITHUB_REPOSITORY#*/}"
          merged_pr_json="$(gh api graphql \
            -f owner="${GITHUB_REPOSITORY_OWNER}" \
            -f repo="${repo_name}" \
            -f oid="${MERGED_SHA}" \
            -f query='
              query($owner: String!, $repo: String!, $oid: GitObjectID!) {
                repository(owner: $owner, name: $repo) {
                  object(oid: $oid) {
                    ... on Commit {
                      associatedPullRequests(first: 1) {
                        nodes { number headRefOid url }
                      }
                    }
                  }
                }
              }
            ' \
            --jq '.data.repository.object.associatedPullRequests.nodes[0] // {}')"

          merged_pr_number="$(jq -r '.number // empty' <<<"${merged_pr_json}")"
          merged_pr_head="$(jq -r '.headRefOid // empty' <<<"${merged_pr_json}")"
          merged_pr_url="$(jq -r '.url // empty' <<<"${merged_pr_json}")"

          if [ -z "${merged_pr_head}" ]; then
            echo "No PR associated with ${MERGED_SHA} (direct push?). Nothing to do."
            exit 0
          fi
          echo "Merged PR #${merged_pr_number} head: ${merged_pr_head}"

          # The un-squashed branch tip is not on develop's linear history, so
          # fetch it explicitly via the pull ref.
          if ! git cat-file -e "${merged_pr_head}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin \
              "+refs/pull/${merged_pr_number}/head:refs/remotes/pull/${merged_pr_number}/head" \
              --quiet || {
                echo "Could not fetch merged PR's head ref; cannot detect orphans."
                exit 0
              }
          fi

          mapfile -t records < <(gh pr list \
            --base develop \
            --state open \
            --limit 200 \
            --json number,headRefOid,headRefName,isDraft \
            --jq '.[] | [.number, .headRefOid, .headRefName, (.isDraft|tostring)] | @tsv')

          if [ "${#records[@]}" -eq 0 ]; then
            echo "No open PRs targeting develop."
            exit 0
          fi

          closed_any=false
          for record in "${records[@]}"; do
            IFS=$'\t' read -r number oid headref isdraft <<<"${record}"

            # Skip the PR that was just merged (its branch may still appear
            # open momentarily in flaky API states).
            if [ "${number}" = "${merged_pr_number}" ]; then
              continue
            fi

            if ! git cat-file -e "${oid}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin \
                "+refs/pull/${number}/head:refs/remotes/pull/${number}/head" \
                --quiet 2>/dev/null \
                || { echo "PR #${number}: could not fetch head ${oid:0:12}; skipping."; continue; }
            fi

            if ! git merge-base --is-ancestor "${oid}" "${merged_pr_head}"; then
              echo "PR #${number}: head ${oid:0:12} is not an ancestor of merged PR #${merged_pr_number}; not orphaned."
              continue
            fi

            comment_body="Closing as superseded: this PR's head commit (\`${oid:0:12}\`) is an ancestor of merged PR ${merged_pr_url} (head \`${merged_pr_head:0:12}\`, squashed as ${MERGED_SHA}). Develop already contains every change from this branch."
            if gh pr close "${number}" --comment "${comment_body}"; then
              echo "PR #${number}: closed as orphan (head ${oid:0:12}, branch ${headref}, draft=${isdraft})."
              closed_any=true
            else
              echo "PR #${number}: gh pr close failed; leaving open." >&2
            fi
          done

          if [ "${closed_any}" = false ]; then
            echo "No orphaned PRs detected."
          fi

  auto-revert-on-failure:
    name: auto-revert-on-failure
    runs-on: ubuntu-latest
    needs: [lint, fast-test, explorer-tokens]
    if: ${{ always() && (needs.lint.result == 'failure' || needs.fast-test.result == 'failure' || needs.explorer-tokens.result == 'failure') }}
    outputs:
      auto-revert-pr-opened-at: ${{ steps.open-revert.outputs.auto-revert-pr-opened-at }}
      auto-revert-pr-url: ${{ steps.open-revert.outputs.auto-revert-pr-url }}
      conflict-issue-url: ${{ steps.open-revert.outputs.conflict-issue-url }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      FAILING_SHA: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open revert PR or conflict issue
        id: open-revert
        shell: bash
        run: |
          set -euo pipefail

          short_sha="${FAILING_SHA:0:12}"
          revert_branch="auto-revert/${short_sha}"

          gh label create incident:develop-red \
            --description "Develop post-merge failure with an automatic revert PR" \
            --color B60205 >/dev/null 2>&1 || true
          gh label create incident:develop-red-revert-conflict \
            --description "Develop post-merge failure where automatic revert conflicted" \
            --color D93F0B >/dev/null 2>&1 || true

          existing_pr_url="$(gh pr list \
            --state open \
            --base develop \
            --head "${revert_branch}" \
            --json url \
            --jq '.[0].url // ""')"
          if [ -n "${existing_pr_url}" ]; then
            echo "Revert PR already exists: ${existing_pr_url}"
            echo "auto-revert-pr-url=${existing_pr_url}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          repo_name="${GITHUB_REPOSITORY#*/}"
          pr_json="$(gh api graphql \
            -f owner="${GITHUB_REPOSITORY_OWNER}" \
            -f repo="${repo_name}" \
            -f oid="${FAILING_SHA}" \
            -f query='
              query($owner: String!, $repo: String!, $oid: GitObjectID!) {
                repository(owner: $owner, name: $repo) {
                  object(oid: $oid) {
                    ... on Commit {
                      associatedPullRequests(first: 1) {
                        nodes {
                          number
                          title
                          url
                          author {
                            login
                          }
                        }
                      }
                    }
                  }
                }
              }
            ' \
            --jq '.data.repository.object.associatedPullRequests.nodes[0] // {}')"

          pr_number="$(jq -r '.number // empty' <<<"${pr_json}")"
          pr_title="$(jq -r '.title // empty' <<<"${pr_json}")"
          pr_url="$(jq -r '.url // empty' <<<"${pr_json}")"
          pr_author="$(jq -r '.author.login // empty' <<<"${pr_json}")"

          if [ -z "${pr_number}" ]; then
            pr_label="commit ${short_sha}"
            pr_title="commit ${short_sha}"
            pr_url="${RUN_URL}"
          else
            pr_label="#${pr_number}"
          fi

          open_manual_action_issue() {
            local title="$1"
            local reason="$2"

            # Idempotency: if a re-run of this workflow lands on the
            # fallback path again for the same SHA (workflow re-run, retry
            # after manual intervention), reuse the existing open issue
            # instead of opening a duplicate. Match by SHA in the body via
            # the GitHub search index, scoped to the conflict label.
            existing_issue_url="$(gh issue list \
              --state open \
              --label incident:develop-red-revert-conflict \
              --search "${FAILING_SHA} in:body" \
              --json url \
              --jq '.[0].url // ""')"
            if [ -n "${existing_issue_url}" ]; then
              echo "Conflict issue already exists: ${existing_issue_url}"
              echo "conflict-issue-url=${existing_issue_url}" >> "${GITHUB_OUTPUT}"
              return 0
            fi

            body_file="$(mktemp)"
            cat > "${body_file}" <<EOF
          Develop went red after ${pr_label} landed, but the automatic revert could not open a revert PR.

          Reason: ${reason}

          Failing SHA: \`${FAILING_SHA}\`
          Failing run: ${RUN_URL}
          Originating PR: ${pr_url}
          Attempted revert branch: \`${revert_branch}\`

          A human needs to decide whether to revert a larger stack or fix forward.
          EOF

            issue_url="$(gh issue create \
              --title "${title}" \
              --body-file "${body_file}" \
              --label incident:develop-red-revert-conflict)"
            echo "conflict-issue-url=${issue_url}" >> "${GITHUB_OUTPUT}"
            echo "Opened conflict issue: ${issue_url}"
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin develop
          # Pull the existing remote revert ref (if any) so the
          # --force-with-lease check below has a real expected value
          # instead of relying on an implicit lease against a
          # remote-tracking ref that may not exist yet.
          git fetch --no-tags origin "${revert_branch}" || true
          git checkout -B "${revert_branch}" origin/develop

          if git revert --no-edit "${FAILING_SHA}"; then
            remote_lease="$(git rev-parse --verify --quiet "refs/remotes/origin/${revert_branch}" || true)"
            if [ -n "${remote_lease}" ]; then
              push_lease="--force-with-lease=${revert_branch}:${remote_lease}"
            else
              push_lease="--force-with-lease=${revert_branch}:"
            fi
            if ! git push "${push_lease}" origin "${revert_branch}"; then
              open_manual_action_issue \
                "Auto-revert could not push branch for develop red at ${short_sha}" \
                "The revert commit was created locally, but pushing \`${revert_branch}\` failed. This can happen if the offending commit changes workflow files and \`GITHUB_TOKEN\` lacks the \`workflows\` permission."
              exit 0
            fi

            body_file="$(mktemp)"
            cat > "${body_file}" <<EOF
          Develop went red after ${pr_label} landed.

          Failing SHA: \`${FAILING_SHA}\`
          Failing run: ${RUN_URL}
          Originating PR: ${pr_url}

          This PR reverts only the offending squash commit. Reviewers should decide whether to merge this revert or fix forward.
          EOF

            if ! revert_pr_url="$(gh pr create \
              --base develop \
              --head "${revert_branch}" \
              --title "Revert ${pr_title} (${pr_label}) - develop went red post-merge" \
              --body-file "${body_file}" \
              --label incident:develop-red)"; then
              open_manual_action_issue \
                "Auto-revert branch created but PR creation failed for ${short_sha}" \
                "The revert branch \`${revert_branch}\` was pushed, but \`gh pr create\` failed."
              exit 0
            fi

            if [ -n "${pr_author}" ]; then
              gh pr edit "${revert_pr_url}" --add-reviewer "${pr_author}" || true
            fi

            opened_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            {
              echo "auto-revert-pr-url=${revert_pr_url}"
              echo "auto-revert-pr-opened-at=${opened_at}"
            } >> "${GITHUB_OUTPUT}"
            echo "Opened revert PR: ${revert_pr_url}"
          else
            git revert --abort || true
            open_manual_action_issue \
              "Auto-revert conflict for develop red at ${short_sha}" \
              "The automatic \`git revert ${FAILING_SHA}\` conflicted."
          fi

  metrics:
    name: metrics
    runs-on: ubuntu-latest
    needs: [lint, fast-test, explorer-tokens, auto-revert-on-failure]
    if: ${{ always() }}
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      MERGED_SHA: ${{ github.sha }}
      RUN_ID: ${{ github.run_id }}
      LINT_RESULT: ${{ needs.lint.result }}
      FAST_TEST_RESULT: ${{ needs.fast-test.result }}
      EXPLORER_TOKENS_RESULT: ${{ needs.explorer-tokens.result }}
      AUTO_REVERT_PR_OPENED_AT: ${{ needs.auto-revert-on-failure.outputs.auto-revert-pr-opened-at }}
      AUTO_REVERT_PR_URL: ${{ needs.auto-revert-on-failure.outputs.auto-revert-pr-url }}
      CONFLICT_ISSUE_URL: ${{ needs.auto-revert-on-failure.outputs.conflict-issue-url }}
    steps:
      - name: Write dev-loop metrics JSON
        shell: bash
        run: |
          set -euo pipefail

          repo_name="${GITHUB_REPOSITORY#*/}"
          post_merge_red=false
          if [ "${LINT_RESULT}" = "failure" ] || [ "${FAST_TEST_RESULT}" = "failure" ] || [ "${EXPLORER_TOKENS_RESULT}" = "failure" ]; then
            post_merge_red=true
          fi

          pr_json="$(gh api graphql \
            -f owner="${GITHUB_REPOSITORY_OWNER}" \
            -f repo="${repo_name}" \
            -f oid="${MERGED_SHA}" \
            -f query='
              query($owner: String!, $repo: String!, $oid: GitObjectID!) {
                repository(owner: $owner, name: $repo) {
                  object(oid: $oid) {
                    ... on Commit {
                      associatedPullRequests(first: 1) {
                        nodes {
                          number
                          createdAt
                          mergedAt
                          labels(first: 20) {
                            nodes {
                              name
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            ' \
            --jq '.data.repository.object.associatedPullRequests.nodes[0] // {}')"

          jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100")"

          mkdir -p dev-loop-metrics
          jq -n \
            --argjson pr "${pr_json}" \
            --argjson jobs "${jobs_json}" \
            --arg post_merge_red "${post_merge_red}" \
            --arg auto_revert_pr_opened_at "${AUTO_REVERT_PR_OPENED_AT}" \
            --arg auto_revert_pr_url "${AUTO_REVERT_PR_URL}" \
            --arg conflict_issue_url "${CONFLICT_ISSUE_URL}" \
            'def null_if_empty: if . == "" then null else . end;
             def ts: fromdateiso8601;
             ($pr.createdAt // null) as $created_at |
             ($pr.mergedAt // null) as $merged_at |
             (if $post_merge_red == "true" then
                ([($jobs.jobs // [])[] |
                  select((.name == "lint" or .name == "fast-test" or .name == "explorer-tokens") and .conclusion == "failure" and .completed_at != null) |
                  .completed_at] | min // null)
              else null end) as $red_at |
             {
               merged_at: $merged_at,
               pr_number: ($pr.number // null),
               pr_open_to_merged_seconds: (
                 if $created_at != null and $merged_at != null then
                   (($merged_at | ts) - ($created_at | ts) | floor)
                 else null end
               ),
               post_merge_red: ($post_merge_red == "true"),
               develop_red_detected_at: $red_at,
               auto_revert_pr_opened_at: ($auto_revert_pr_opened_at | null_if_empty),
               time_to_revert_pr_seconds: (
                 if ($red_at != null and $auto_revert_pr_opened_at != "") then
                   (($auto_revert_pr_opened_at | ts) - ($red_at | ts) | floor)
                 else null end
               ),
               next_green_develop_run_at: null,
               time_to_recover_red_seconds: null,
               conflict_on_merge: ([($pr.labels.nodes // [])[].name] | any(test("conflict"; "i"))),
               orphaned_failed_pr: (($post_merge_red == "true") and (($pr.number // null) == null)),
               ci_runner_minutes: (
                 (([($jobs.jobs // [])[] |
                   select(.started_at != null and .completed_at != null) |
                   ((.completed_at | ts) - (.started_at | ts))]
                 | add) // 0) / 60
               ),
               auto_revert_pr_url: ($auto_revert_pr_url | null_if_empty),
               conflict_issue_url: ($conflict_issue_url | null_if_empty)
             }' > "dev-loop-metrics/${MERGED_SHA}.json"

          cat "dev-loop-metrics/${MERGED_SHA}.json"

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: dev-loop-metrics/*.json
          retention-days: 90
