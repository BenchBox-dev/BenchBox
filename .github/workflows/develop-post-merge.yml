name: Develop post-merge

# Safety net for strict-checks-off and stale-PR flows alike: once a PR lands,
# run the same lightweight local gates against the actual develop tip. This is
# intentionally narrower than test.yml's full PR matrix so it does not turn
# every squash merge into the heavyweight optional suite.
#
# Push is the primary trigger. GitHub has been observed to drop push delivery
# for consecutive develop merges (see docs/operations/develop-post-merge-gaps.md
# and the 2026-08-03 corpus-mirror gap), so a scheduled sweep is additive: it
# re-runs the lightweight tip gates within a bounded window when a per-push
# run was never created. It is not a replacement for push, and it does not
# paper over the gap with extra event types.
#
# Schedule path is gates-only and slim: lint + fast-test + explorer-tokens.
# medium-test (~40 min) and all mutation jobs (auto-revert, green-run-cleanup,
# close-orphaned-prs) stay on push / workflow_dispatch only.

on:
  push:
    branches: [develop]
  # Bound silent push-drop exposure. Hourly is enough to re-gate tip without
  # waiting for the next real merge; the gap detector (sibling workflow)
  # instruments which exact SHAs still lack a per-push run.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # Push (and manual dispatch) stay SHA-keyed so concurrent merges do not
  # cancel each other. Schedule uses a fixed group so a sweep never cancels
  # — and is never cancelled by — a push-triggered run for the same tip.
  # cancel-in-progress is true only for schedule so a newer sweep supersedes
  # a still-running older one; push runs never cancel each other.
  group: ${{ github.event_name == 'schedule' && 'develop-post-merge-schedule' || format('develop-post-merge-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'schedule' }}

jobs:
  lint:
    needs: sweep-coverage
    # Baseline cache writes must follow develop history order. A SHA-specific
    # workflow-level group does not serialize two pushes, so an older run can
    # save after a newer run and win the restore-prefix lookup.
    #
    # A covered tip skips the re-run on schedule only: the covering push run
    # already wrote this SHA's fast-lane-count cache entry, so the skip
    # leaves no baseline gap. Push and dispatch always run.
    if: ${{ github.event_name != 'schedule' || needs.sweep-coverage.outputs.covered != 'true' }}
    concurrency:
      group: develop-post-merge-lint-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # Default branch is develop, so schedule/dispatch already resolve to the
      # tip workflow + tip SHA. Pin ref explicitly so a future default-branch
      # rename cannot silently re-target this sweep.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run CI lint mirror
        run: make ci-lint

      - name: Persist fast-lane count for PR-lane delta guard
        # Feeds the pr.yml `code-lint` job's guard-fast-lane-delta step (see
        # docs/operations/fast-lane-budget.md): that guard restores this
        # cache entry to diff a PR's fast-lane collect count against
        # develop's own count, on top of the absolute ceiling that
        # guard-timing-policy already enforces above. This step must never
        # fail the post-merge job itself -- it always runs (`if: always()`,
        # independent of whether `make ci-lint` passed) and never propagates
        # a nonzero exit from the underlying collect.
        if: always()
        run: |
          uv run -- python _project/scripts/timing_policy_check.py --emit-fast-count > fast-lane-count.txt || echo "unknown" > fast-lane-count.txt
          cat fast-lane-count.txt

      - name: Cache fast-lane count
        # Well-known key on this push's SHA, so the PR lane's restore-keys
        # prefix match (fast-lane-count-develop-) always finds the most
        # recent develop count. continue-on-error: a cache-service hiccup
        # (or, in principle, a same-key collision) must not fail post-merge.
        if: always()
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: fast-lane-count.txt
          key: fast-lane-count-develop-${{ github.sha }}

      - name: Emit lint signature
        # Bare python is intentional: the signature builder is stdlib-only.
        # `job.status` already reflects the lint step above by this point;
        # lint has a single fallible step, so no per-step id is needed.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ job.status }}" = "failure" ]; then
            python scripts/post_merge_signature.py build --job lint --failed-step "Run CI lint mirror" --source-input "published-results=$(git ls-remote origin refs/heads/published-results | cut -f1)" --out signature.json
          else
            python scripts/post_merge_signature.py build --job lint --source-input "published-results=$(git ls-remote origin refs/heads/published-results | cut -f1)" --out signature.json
          fi

      - name: Upload lint signature
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: signature-lint
          path: signature.json
          retention-days: 14

  queue-certification:
    name: queue-certification
    # Always runs: downstream jobs read these outputs on every event, and
    # references to a skipped job's outputs do not evaluate reliably. The
    # script itself returns certified=false without any API call unless this
    # is a push to develop, so schedule and workflow_dispatch always run the
    # full gates and the manual dispatch stays the full-run escape hatch.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      certified: ${{ steps.certify.outputs.certified }}
      certifying_run_id: ${{ steps.certify.outputs.certifying_run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.sha }}

      - name: Look up merge-queue certification
        id: certify
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Bare python is intentional: the lookup is stdlib-only and always
          # exits 0 (fail open), so this step never reds the workflow itself.
          # Any API error, gap, ambiguity, or ineligible event runs the full
          # gates instead.
          python scripts/queue_certification.py \
            --sha "$TARGET_SHA" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Emit certified-skip signatures
        # Third-state representation (never a failure, never a fresh green
        # baseline): on a certified SHA, fast-test and medium-test do not
        # execute, so this job uploads their signature artifacts with kind
        # "certified" under the exact artifact names the auto-revert
        # signature check expects. Baseline selection walks back past
        # certified runs instead of diffing real failures against them.
        if: ${{ steps.certify.outputs.certified == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.certify.outputs.certifying_run_id }}"
          for gate_job in fast-test medium-test; do
            mkdir -p "certified/${gate_job}"
            python scripts/post_merge_signature.py build --job "${gate_job}" --certified-by "${RUN_ID}" \
              --source-input "published-results=$(git ls-remote origin refs/heads/published-results | cut -f1)" --out "certified/${gate_job}/signature.json"
          done

      - name: Upload fast-test certified signature
        if: ${{ steps.certify.outputs.certified == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: signature-fast-test
          path: certified/fast-test/signature.json
          retention-days: 14

      - name: Upload medium-test certified signature
        if: ${{ steps.certify.outputs.certified == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: signature-medium-test
          path: certified/medium-test/signature.json
          retention-days: 14

  sweep-coverage:
    name: sweep-coverage
    # Always runs: downstream jobs read these outputs on every event, and
    # references to a skipped job's outputs do not evaluate reliably. The
    # script itself returns covered=false without any API call unless this
    # is a schedule run, so push and workflow_dispatch always run the full
    # gates and the manual dispatch stays the full-run escape hatch.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      covered: ${{ steps.coverage.outputs.covered }}
      covering_run_id: ${{ steps.coverage.outputs.covering_run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.sha }}

      - name: Check whether the tip is already covered
        id: coverage
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Bare python is intentional: the lookup is stdlib-only and always
          # exits 0 (fail open), so this step never reds the workflow itself.
          # Any API error, gap, ambiguity, or uncovered tip runs the full
          # gates instead.
          python scripts/sweep_coverage.py \
            --sha "$TARGET_SHA" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

  fast-test:
    needs: [queue-certification, sweep-coverage]
    # Queue-certified pushes skip the re-run: the merge queue already passed
    # this exact SHA (certified by the run recorded in the step summary and
    # metrics). The lint job above still runs on every push: it writes the
    # fast-lane-count-develop-<sha> cache the PR guard restores. A covered
    # tip skips the re-run on schedule too: a success/failure push run (or
    # a queue certification) already gated this exact SHA, so the sweep
    # exits early with a step-summary note.
    if: ${{ (github.event_name != 'push' || needs.queue-certification.outputs.certified != 'true') && (github.event_name != 'schedule' || needs.sweep-coverage.outputs.covered != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run CI fast-test mirror
        env:
          # Picked up by `make ci-test`'s pytest invocation without touching
          # the Makefile or local developer behavior (PYTEST_ADDOPTS is only
          # set in this CI step's env).
          PYTEST_ADDOPTS: "--junitxml=fast-test-junit.xml"
        run: make ci-test

      - name: Emit fast-test signature
        # Bare python is intentional: the signature builder is stdlib-only.
        # Falls back to a job-failure descriptor if pytest crashed before
        # writing junit XML at all (e.g. a collection-time crash), left a
        # truncated/unparseable file behind (killed mid-write), or failed for
        # a reason junit never records (e.g. pytest-cov's --cov-fail-under
        # gate, where every testcase passes but the step still fails) - a
        # signature artifact must ALWAYS upload and must never look clean
        # when the job actually failed, or the auto-revert diff would
        # compare against a partial/false-clean current signature and could
        # wrongly suppress.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          JOB_FAILED_FLAG=""
          if [ "${{ job.status }}" = "failure" ]; then
            JOB_FAILED_FLAG="--job-failed"
          fi
          if [ -f fast-test-junit.xml ]; then
            python scripts/post_merge_signature.py build --job fast-test --junit fast-test-junit.xml \
              --failed-step "Run CI fast-test mirror (job failed with no testcase-level failures, e.g. coverage threshold)" \
              $JOB_FAILED_FLAG --source-input "published-results=$(git ls-remote origin refs/heads/published-results | cut -f1)" --out signature.json \
              || python scripts/post_merge_signature.py build --job fast-test --failed-step "Run CI fast-test mirror (junit xml unparseable)" --source-input "published-results=$(git ls-remote origin refs/heads/published-results | cut -f1)" --out signature.json
          else
            python scripts/post_merge_signature.py build --job fast-test --failed-step "Run CI fast-test mirror (no junit xml produced)" --source-input "published-results=$(git ls-remote origin refs/heads/published-results | cut -f1)" --out signature.json
          fi

      - name: Upload fast-test signature
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: signature-fast-test
          path: signature.json
          retention-days: 14

  explorer-tokens:
    name: explorer-tokens
    needs: sweep-coverage
    # Re-run the token-scan gate against the merged develop tree so that a
    # squash race that reintroduces raw Tailwind palette literals trips the
    # auto-revert path even when each PR-time scan passed against its own
    # pre-merge tree. Stdlib-only so no dependency sync is required. A
    # covered tip skips the re-run on schedule only; push and dispatch
    # always run.
    if: ${{ github.event_name != 'schedule' || needs.sweep-coverage.outputs.covered != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.sha }}

      - name: Run explorer token scan
        id: token-scan
        run: make lint-explorer-tokens

      - name: Run public site theme token scan
        id: theme-scan
        run: make lint-site-theme-tokens

      - name: Emit explorer-tokens signature
        # Bare python is intentional: the signature builder is stdlib-only.
        # Per-step ids above disambiguate which of the two scans failed
        # (the second step is skipped, not failed, if the first one fails).
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          failed_step=""
          if [ "${{ steps.token-scan.outcome }}" = "failure" ]; then
            failed_step="Run explorer token scan"
          elif [ "${{ steps.theme-scan.outcome }}" = "failure" ]; then
            failed_step="Run public site theme token scan"
          fi
          if [ -n "${failed_step}" ]; then
            python scripts/post_merge_signature.py build --job explorer-tokens --failed-step "${failed_step}" --source-input "published-results=$(git ls-remote origin refs/heads/published-results | cut -f1)" --out signature.json
          else
            python scripts/post_merge_signature.py build --job explorer-tokens --source-input "published-results=$(git ls-remote origin refs/heads/published-results | cut -f1)" --out signature.json
          fi

      - name: Upload explorer-tokens signature
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: signature-explorer-tokens
          path: signature.json
          retention-days: 14

  medium-test:
    name: medium-test
    # The medium speed tier (~81 files, `make test-medium`, Makefile:90-91) had
    # no CI consumer before this job - it only ran when a developer invoked it
    # locally. Measured locally at ~18 minutes (2 xdist workers), too slow for
    # the develop-PR-blocking lane, so it lands here for visibility/metrics.
    # See tracker item `medium-tier-ci-home`.
    #
    # PROMOTED 2026-07-06 (medium-tier-red-disposition-and-promotion): the
    # tier ran clean (green) on the real runner - develop-post-merge run
    # 28763663703, job 85283671051, "Run medium speed tier" success - once
    # its dispositioned failures were fixed: timeout markers for the 6 slow
    # data-gen/cross-surface tests (#977) and the pytest-ci.ini
    # filterwarnings marker sync (#994, the last remaining runner failure).
    # It is now a blocking post-merge lane wired into auto-revert-on-failure's
    # trigger, same as lint/fast-test/explorer-tokens (continue-on-error
    # dropped). The 44 tpch-extension "errors" reported earlier were
    # sandbox-only (egress proxy 403 on the extension download) and do not
    # occur on the runner.
    #
    # PR-LANE CONSUMER ADDED 2026-07-11 (medium-tier-pre-merge-lane): the tier
    # now also runs pre-merge as pr.yml's `medium-test` job, path-gated on
    # ci-paths' needs-code-ci output so docs/TODO-only PRs skip it. That job
    # is a plain `make test-medium` run with no signature/junit emission (the
    # PR lane does not feed auto-revert). This post-merge job stays the
    # blocking safety net for the residual gap the PR lane cannot see: a
    # stale-base squash race, where a PR's own merge-tree CI passes but the
    # eventual develop tip has a semantic conflict with another PR merged in
    # between (see the TODO description for the #1093/#1095/#1100 incident
    # this closes half of).
    #
    # SLIM SCHEDULE: medium-test is intentionally omitted on the hourly
    # schedule (push + workflow_dispatch only). The ~40 min tier would
    # otherwise cost ~24 full medium runs/day even when tip is already
    # push-covered; lint/fast-test/explorer-tokens still bound tip exposure.
    # Queue-certified pushes skip the re-run alongside fast-test; the
    # queue-certification job uploads the certified third-state signature.
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'push' || needs.queue-certification.outputs.certified != 'true') }}
    needs: queue-certification
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run medium speed tier
        env:
          # Picked up by `make test-medium`'s pytest invocation without
          # touching the Makefile or local developer behavior.
          PYTEST_ADDOPTS: "--junitxml=medium-test-junit.xml"
        run: make test-medium

      - name: Emit medium-test signature
        # Bare python is intentional: the signature builder is stdlib-only.
        # Same missing/unparseable-junit AND job-failed-but-junit-is-clean
        # fallbacks as fast-test: a signature artifact must always upload and
        # must never look clean when the job actually failed, or the
        # auto-revert diff could run on a partial/false-clean current
        # signature.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          JOB_FAILED_FLAG=""
          if [ "${{ job.status }}" = "failure" ]; then
            JOB_FAILED_FLAG="--job-failed"
          fi
          if [ -f medium-test-junit.xml ]; then
            python scripts/post_merge_signature.py build --job medium-test --junit medium-test-junit.xml \
              --failed-step "Run medium speed tier (job failed with no testcase-level failures)" \
              $JOB_FAILED_FLAG --source-input "published-results=$(git ls-remote origin refs/heads/published-results | cut -f1)" --out signature.json \
              || python scripts/post_merge_signature.py build --job medium-test --failed-step "Run medium speed tier (junit xml unparseable)" --source-input "published-results=$(git ls-remote origin refs/heads/published-results | cut -f1)" --out signature.json
          else
            python scripts/post_merge_signature.py build --job medium-test --failed-step "Run medium speed tier (no junit xml produced)" --source-input "published-results=$(git ls-remote origin refs/heads/published-results | cut -f1)" --out signature.json
          fi

      - name: Upload medium-test signature
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: signature-medium-test
          path: signature.json
          retention-days: 14

  close-orphaned-prs:
    name: close-orphaned-prs
    needs: [lint, fast-test, explorer-tokens, medium-test]
    # When a squash merge to develop lands one of several open PRs whose
    # branches share linear history (e.g. two worktrees produced overlapping
    # branches where one is a strict ancestor of the other), the squash hides
    # the original commit lineage and the unmerged-but-fully-contained PRs sit
    # open forever. GitHub's own auto-close heuristic does not fire on squash
    # merges.
    #
    # Detection: find the PR associated with this squash commit and recover
    # its original (un-squashed) branch tip via the GraphQL API. Any other
    # open PR whose head commit is a git ancestor of that tip has all of its
    # content already on develop and can be closed safely.
    #
    # Schedule path is gates-only: mutation jobs never run on schedule.
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      MERGED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.sha }}
          fetch-depth: 0

      - name: Close PRs whose branches are ancestors of the merged PR
        shell: bash
        run: |
          set -euo pipefail

          repo_name="${GITHUB_REPOSITORY#*/}"
          merged_pr_json="$(gh api graphql \
            -f owner="${GITHUB_REPOSITORY_OWNER}" \
            -f repo="${repo_name}" \
            -f oid="${MERGED_SHA}" \
            -f query='
              query($owner: String!, $repo: String!, $oid: GitObjectID!) {
                repository(owner: $owner, name: $repo) {
                  object(oid: $oid) {
                    ... on Commit {
                      associatedPullRequests(first: 1) {
                        nodes { number headRefOid url }
                      }
                    }
                  }
                }
              }
            ' \
            --jq '.data.repository.object.associatedPullRequests.nodes[0] // {}')"

          merged_pr_number="$(jq -r '.number // empty' <<<"${merged_pr_json}")"
          merged_pr_head="$(jq -r '.headRefOid // empty' <<<"${merged_pr_json}")"
          merged_pr_url="$(jq -r '.url // empty' <<<"${merged_pr_json}")"

          if [ -z "${merged_pr_head}" ]; then
            echo "No PR associated with ${MERGED_SHA} (direct push?). Nothing to do."
            exit 0
          fi
          echo "Merged PR #${merged_pr_number} head: ${merged_pr_head}"

          # The un-squashed branch tip is not on develop's linear history, so
          # fetch it explicitly via the pull ref.
          if ! git cat-file -e "${merged_pr_head}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin \
              "+refs/pull/${merged_pr_number}/head:refs/remotes/pull/${merged_pr_number}/head" \
              --quiet || {
                echo "Could not fetch merged PR's head ref; cannot detect orphans."
                exit 0
              }
          fi

          mapfile -t records < <(gh pr list \
            --base develop \
            --state open \
            --limit 200 \
            --json number,headRefOid,headRefName,isDraft \
            --jq '.[] | [.number, .headRefOid, .headRefName, (.isDraft|tostring)] | @tsv')

          if [ "${#records[@]}" -eq 0 ]; then
            echo "No open PRs targeting develop."
            exit 0
          fi

          closed_any=false
          for record in "${records[@]}"; do
            IFS=$'\t' read -r number oid headref isdraft <<<"${record}"

            # Skip the PR that was just merged (its branch may still appear
            # open momentarily in flaky API states).
            if [ "${number}" = "${merged_pr_number}" ]; then
              continue
            fi

            if ! git cat-file -e "${oid}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin \
                "+refs/pull/${number}/head:refs/remotes/pull/${number}/head" \
                --quiet 2>/dev/null \
                || { echo "PR #${number}: could not fetch head ${oid:0:12}; skipping."; continue; }
            fi

            if ! git merge-base --is-ancestor "${oid}" "${merged_pr_head}"; then
              echo "PR #${number}: head ${oid:0:12} is not an ancestor of merged PR #${merged_pr_number}; not orphaned."
              continue
            fi

            comment_body="Closing as superseded: this PR's head commit (\`${oid:0:12}\`) is an ancestor of merged PR ${merged_pr_url} (head \`${merged_pr_head:0:12}\`, squashed as ${MERGED_SHA}). Develop already contains every change from this branch."
            if gh pr close "${number}" --comment "${comment_body}"; then
              echo "PR #${number}: closed as orphan (head ${oid:0:12}, branch ${headref}, draft=${isdraft})."
              closed_any=true
            else
              echo "PR #${number}: gh pr close failed; leaving open." >&2
            fi
          done

          if [ "${closed_any}" = false ]; then
            echo "No orphaned PRs detected."
          fi

  auto-revert-on-failure:
    name: auto-revert-on-failure
    runs-on: ubuntu-latest
    # medium-test promoted into this trigger 2026-07-06 (see the medium-test
    # job's promotion note): the tier ran clean on the real runner after its
    # dispositioned failures were fixed (#977, #994), so a medium-test failure
    # now opens a (reviewable) revert PR, same as lint/fast-test/explorer-tokens.
    needs: [lint, fast-test, explorer-tokens, medium-test, queue-certification]
    # Schedule path is gates-only: never open revert PRs / issues from a sweep.
    # event_name must lead so always() cannot re-enable mutation on schedule.
    # A queue-certified skip never fires auto-revert: its gates report
    # 'skipped', and this explicit guard keeps the trigger off even if a
    # future edit changes how skipped results read here.
    if: ${{ github.event_name != 'schedule' && always() && (needs.lint.result == 'failure' || needs.explorer-tokens.result == 'failure' || (needs.queue-certification.outputs.certified != 'true' && (needs.fast-test.result == 'failure' || needs.medium-test.result == 'failure'))) }}
    outputs:
      auto-revert-pr-opened-at: ${{ steps.open-revert.outputs.auto-revert-pr-opened-at }}
      auto-revert-pr-url: ${{ steps.open-revert.outputs.auto-revert-pr-url }}
      conflict-issue-url: ${{ steps.open-revert.outputs.conflict-issue-url }}
      revert-suppressed: ${{ steps.revert-outcome.outputs.revert-suppressed }}
      new-failure-ids: ${{ steps.signature-decision.outputs.new-failure-ids }}
      incident-issue-url: ${{ steps.upsert-incident.outputs.incident-issue-url }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      FAILING_SHA: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.sha }}
          fetch-depth: 0

      - name: Download current run signature artifacts
        # continue-on-error: a missing artifact here (e.g. a gate job
        # crashed before its always()-run signature step) is one of the
        # fail-open triggers handled below, not a hard job failure.
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: signature-*
          path: current-signatures

      - name: Determine signature comparison outcome
        id: signature-decision
        shell: bash
        run: |
          set -euo pipefail

          # A revert is a positive-evidence outcome, never the default for a
          # missing artifact, comparison error, or unmappable failure.
          should_revert="false"
          # Left empty (not "[]") unless the diff below actually succeeds,
          # so a fail-open run reports new_failure_ids as "no data" (null in
          # the metrics JSON) rather than the misleading "computed zero".
          new_failure_ids_json=""
          fail_open_reason=""
          previous_run_url=""
          comparison_state="unknown"

          # Every external/parse command below is guarded (`if ! ...`) so a
          # failure sets fail_open_reason instead of aborting the step under
          # `set -e`: an aborted step would leave outputs unwritten and skip
          # the incident path. Each stage is skipped once fail_open_reason is
          # set, and an incomplete comparison stays red with an incident.

          # Merge the four gate jobs' per-job signature artifacts (one
          # subdirectory per artifact, downloaded above) into a single
          # combined signature for this run. Require ALL FOUR expected gate
          # artifacts, not just "at least one": if one gate crashes/times out
          # before its always()-run signature step can upload (or the upload
          # itself fails), the other three still leave signature.json files
          # behind, so a bare compgen glob check would silently diff a
          # partial current signature and could suppress a revert the missing
          # gate's real failure warranted.
          EXPECTED_SIGNATURE_JOBS=(lint fast-test explorer-tokens medium-test)
          missing_signatures=()
          for job in "${EXPECTED_SIGNATURE_JOBS[@]}"; do
            if [ ! -f "current-signatures/signature-${job}/signature.json" ]; then
              missing_signatures+=("${job}")
            fi
          done
          if [ "${#missing_signatures[@]}" -gt 0 ]; then
            fail_open_reason="Missing current-run signature artifact(s) for: ${missing_signatures[*]} (gate job crashed, timed out, or was cancelled before its signature could upload)."
          elif ! jq -s '{failure_ids: ([.[].failure_ids] | add | unique | sort), jobs: map({job, kind, failure_ids}), source_inputs: (map(.source_inputs // {}) | add // {})}' \
            current-signatures/*/signature.json > current-combined.json; then
            fail_open_reason="Could not combine this run's signature artifacts (malformed signature JSON)."
          fi

          if [ -z "${fail_open_reason}" ]; then
            # Walk completed develop-post-merge runs and pick the highest
            # run_number strictly below this run - that is the run to diff
            # against, whatever its outcome.
            #
            # Known limitation: with per-SHA concurrency (cancel-in-progress
            # false) two runs can be in flight at once, so the highest
            # COMPLETED run_number below ours may be older than our true
            # predecessor. Mis-selection errs toward reverting (an older
            # baseline makes more failures look new), which is the safe
            # direction.
            # The baseline is restricted to runs of the same event type:
            # scheduled runs omit medium tests, so a push run must never
            # diff against a scheduled lane set (or vice versa).
            # Certified-skip runs are walked back past: their signatures
            # carry kind "certified" with no failure IDs, so diffing real
            # failures against one would misblame this merge for older red.
            # A certified run is never a fresh green baseline that clears an
            # unrelated open incident either: only a real all-green run can
            # be the baseline a revert decision diffs against.
            if ! runs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/develop-post-merge.yml/runs?branch=develop&status=completed&per_page=20")"; then
              fail_open_reason="Could not list previous develop-post-merge runs via gh api."
            elif ! candidate_ids="$(jq -r --argjson current "${GITHUB_RUN_NUMBER}" --arg event "${{ github.event_name }}" \
              '[.workflow_runs[] | select(.run_number < $current and .event == $event)] | sort_by(.run_number) | reverse | .[0:8] | .[].id' \
              <<<"${runs_json}")"; then
              fail_open_reason="Could not parse the previous-runs listing."
            elif [ -z "${candidate_ids}" ]; then
              fail_open_reason="No previous completed develop-post-merge run was found on develop."
            else
              prev_run_id=""
              previous_run_url=""
              for candidate_id in ${candidate_ids}; do
                rm -rf previous-signatures
                if ! candidate_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_id}")"; then
                  fail_open_reason="Could not read candidate baseline run ${candidate_id} via gh api."
                  break
                fi
                candidate_url="$(jq -r '.html_url // empty' <<<"${candidate_json}")"
                if ! gh run download "${candidate_id}" --pattern 'signature-*' --dir previous-signatures 2>prev-download.log; then
                  fail_open_reason="Could not download the previous run's signature artifacts (likely expired retention): $(tail -n1 prev-download.log 2>/dev/null || true)"
                  break
                fi
                is_certified=false
                for sig in previous-signatures/signature-fast-test/signature.json previous-signatures/signature-medium-test/signature.json; do
                  if [ -f "${sig}" ] && jq -e '.kind == "certified"' "${sig}" >/dev/null 2>&1; then
                    is_certified=true
                    break
                  fi
                done
                if [ "${is_certified}" = "true" ]; then
                  echo "Baseline candidate ${candidate_id} is a certified skip; walking back."
                  continue
                fi
                prev_run_id="${candidate_id}"
                previous_run_url="${candidate_url}"
                echo "Previous run: ${previous_run_url} (id ${prev_run_id})"
                break
              done
              if [ -z "${fail_open_reason}" ] && [ -z "${prev_run_id}" ]; then
                fail_open_reason="Only certified-skip baselines were found; nothing real to diff against."
              fi
            fi
          fi

          if [ -z "${fail_open_reason}" ]; then
            if compgen -G "previous-signatures/*/signature.json" > /dev/null; then
              if ! jq -s '{failure_ids: ([.[].failure_ids] | add | unique | sort), jobs: map({job, kind, failure_ids}), source_inputs: (map(.source_inputs // {}) | add // {})}' \
                previous-signatures/*/signature.json > previous-combined.json; then
                fail_open_reason="Could not combine the previous run's signature artifacts (malformed signature JSON)."
              fi
            else
              fail_open_reason="The previous run's signature artifacts were empty or missing."
            fi
          fi

          if [ -z "${fail_open_reason}" ]; then
            if python3 scripts/post_merge_signature.py diff \
              --previous previous-combined.json \
              --current current-combined.json \
              --out diff.json; then
              if ! new_failure_ids_json="$(jq -c '.new_failure_ids' diff.json)" \
                || ! new_count="$(jq 'length' <<<"${new_failure_ids_json}")"; then
                new_failure_ids_json=""
                fail_open_reason="Could not read the diff output (diff.json)."
              elif [ "${new_count}" -eq 0 ]; then
                # Current run's failures are all already present in the
                # previous run's signature (identical-or-superset): develop
                # is persistently red for the same reason, not because of
                # this merge.
                should_revert="false"
                comparison_state="persistent"
              else
                # A new signature is necessary but not sufficient for a
                # revert. Attribution must still provide positive ownership
                # evidence before the revert step can run.
                should_revert="true"
                comparison_state="new"
              fi
            else
              fail_open_reason="scripts/post_merge_signature.py diff exited non-zero comparing this run to ${previous_run_url}."
            fi
          fi

          # Never silently suppress the red state on a comparison error. An
          # unresolved reason routes to an unknown-attribution incident; it
          # must not manufacture ownership from temporal adjacency.
          if [ -n "${fail_open_reason}" ]; then
            echo "Comparison incomplete: ${fail_open_reason}"
            should_revert="false"
            comparison_state="unknown"
          fi

          if [ "${should_revert}" = "true" ]; then
            revert_suppressed="false"
          else
            revert_suppressed="true"
          fi

          {
            echo "should-revert=${should_revert}"
            echo "revert-suppressed=${revert_suppressed}"
            echo "fail-open-reason=${fail_open_reason}"
            echo "previous-run-url=${previous_run_url}"
            echo "comparison-state=${comparison_state}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "new-failure-ids<<EOF_NEW_IDS"
            echo "${new_failure_ids_json}"
            echo "EOF_NEW_IDS"
          } >> "${GITHUB_OUTPUT}"

      - name: Attribute new failures to the blamed SHA
        id: attribute
        if: steps.signature-decision.outputs.comparison-state != 'persistent'
        shell: bash
        env:
          NEW_FAILURE_IDS: ${{ steps.signature-decision.outputs.new-failure-ids }}
          COMPARISON_STATE: ${{ steps.signature-decision.outputs.comparison-state }}
          COMPARISON_FAILURE: ${{ steps.signature-decision.outputs.fail-open-reason }}
        run: |
          set -euo pipefail
          if [ -z "${NEW_FAILURE_IDS}" ] || [ "${NEW_FAILURE_IDS}" = "null" ]; then
            failure_ids_json="[]"
          else
            failure_ids_json="${NEW_FAILURE_IDS}"
          fi

          # Capture the immutable PR association and live target before any
          # mutation. A missing API result is evidence loss, not permission to
          # fall back to the most recent merge.
          pr_json="{}"
          if ! pr_json="$(gh api graphql \
            -f owner="${GITHUB_REPOSITORY_OWNER}" \
            -f repo="${GITHUB_REPOSITORY#*/}" \
            -f oid="${FAILING_SHA}" \
            -f query='query($owner: String!, $repo: String!, $oid: GitObjectID!) { repository(owner: $owner, name: $repo) { object(oid: $oid) { ... on Commit { associatedPullRequests(first: 1) { nodes { number title url author { login } } } } } } }' \
            --jq '.data.repository.object.associatedPullRequests.nodes[0] // {}')"; then
            echo "Could not resolve the PR associated with ${FAILING_SHA}; recording unknown attribution."
            pr_json="{}"
          fi
          pr_author="$(jq -r '.author.login // empty' <<<"${pr_json}")"
          owner="${pr_author:-BenchBox-dev}"

          current_target_sha=""
          if ! current_target_sha="$(git ls-remote origin refs/heads/develop | cut -f1)"; then
            current_target_sha=""
          fi
          predecessor_sha="$(git rev-parse --verify --quiet "${FAILING_SHA}^1" || true)"
          # Comparison failures can leave current-combined.json absent or
          # malformed. Keep this attribution step alive with a safe,
          # explicit empty signature so the unknown incident is still
          # recorded; an empty signature can never create ownership evidence.
          empty_signature='{"failure_ids":[],"jobs":[],"source_inputs":{}}'
          current_signature="${empty_signature}"
          if [ -f current-combined.json ]; then
            if ! current_signature="$(jq -ce 'if type == "object" and ((.failure_ids // []) | type == "array") and ((.jobs // []) | type == "array") and ((.source_inputs // {}) | type == "object") then . else error("signature object has invalid fields") end' current-combined.json 2>/dev/null)"; then
              echo "Current combined signature is missing or malformed; using the safe unknown-attribution fallback."
              current_signature="${empty_signature}"
            fi
          fi

          previous_signature="${empty_signature}"
          if [ -f previous-combined.json ]; then
            if ! previous_signature="$(jq -ce 'if type == "object" and ((.failure_ids // []) | type == "array") and ((.jobs // []) | type == "array") and ((.source_inputs // {}) | type == "object") then . else error("signature object has invalid fields") end' previous-combined.json 2>/dev/null)"; then
              echo "Previous combined signature is malformed; using the safe evidence fallback."
              previous_signature="${empty_signature}"
            fi
          fi

          jq -n \
            --arg failing_sha "${FAILING_SHA}" \
            --arg run_url "${RUN_URL}" \
            --arg current_target_sha "${current_target_sha}" \
            --arg predecessor_sha "${predecessor_sha}" \
            --arg previous_run_url "${{ steps.signature-decision.outputs.previous-run-url }}" \
            --arg owner "${owner}" \
            --arg comparison_state "${COMPARISON_STATE}" \
            --arg comparison_failure "${COMPARISON_FAILURE}" \
            --argjson failure_ids "${failure_ids_json}" \
            --argjson failing_pr "${pr_json}" \
            --argjson current_signature "${current_signature}" \
            --argjson previous_signature "${previous_signature}" \
            '{
              evidence_version: 2,
              failing_sha: $failing_sha,
              run_url: $run_url,
              current_target_sha: $current_target_sha,
              failure_ids: $failure_ids,
              jobs: ($current_signature.jobs // []),
              failing_pr: $failing_pr,
              owner: $owner,
              source_inputs: ($current_signature.source_inputs // {}),
              predecessor_source_inputs: ($previous_signature.source_inputs // {}),
              predecessor_evidence: {
                run_url: $previous_run_url,
                sha: $predecessor_sha,
                signature: $previous_signature
              },
              comparison_state: $comparison_state,
              comparison_failure: $comparison_failure,
              proposed_revert: {inspected: false}
            }' > attribution-evidence.json

          python3 scripts/post_merge_signature.py attribute \
            --sha "${FAILING_SHA}" \
            --failure-ids <(printf '%s\n' "${failure_ids_json}") \
            --evidence attribution-evidence.json \
            --out attribution.json
          action="$(jq -r '.action' attribution.json)"
          echo "action=${action}" >> "${GITHUB_OUTPUT}"
          echo "incident-key=$(jq -r '.incident_key' attribution.json)" >> "${GITHUB_OUTPUT}"
          {
            echo "incident-artifact<<EOF_ATTRIBUTION"
            cat attribution.json
            echo "EOF_ATTRIBUTION"
          } >> "${GITHUB_OUTPUT}"
          echo "Attribution action: ${action}"

      - name: Finalize revert-suppressed for metrics
        id: revert-outcome
        # Always runs (even when the attribute step above was skipped) so the
        # job output below has a value in every case: the signature-decision
        # step's initial revert-suppressed value is based on comparison only;
        # the final value below also accounts for attribution. Metrics must
        # report a revert as suppressed unless positive ownership evidence
        # actually reaches the revert step.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          revert_suppressed="${{ steps.signature-decision.outputs.revert-suppressed }}"
          if [ "${{ steps.attribute.outputs.action }}" != "revert" ]; then
            revert_suppressed="true"
          fi
          echo "revert-suppressed=${revert_suppressed}" >> "${GITHUB_OUTPUT}"

      - name: Open revert PR or conflict issue
        id: open-revert
        if: steps.signature-decision.outputs.should-revert == 'true' && steps.attribute.outputs.action == 'revert'
        shell: bash
        env:
          FAIL_OPEN_REASON: ${{ steps.signature-decision.outputs.fail-open-reason }}
          NEW_FAILURE_IDS: ${{ steps.signature-decision.outputs.new-failure-ids }}
        run: |
          set -euo pipefail

          short_sha="${FAILING_SHA:0:12}"
          revert_branch="auto-revert/${short_sha}"

          if [ -n "${FAIL_OPEN_REASON}" ]; then
            signature_note="

          Signature comparison could not be completed, so this revert was opened conservatively (fail-open): ${FAIL_OPEN_REASON}"
          elif [ -n "${NEW_FAILURE_IDS}" ] && [ "${NEW_FAILURE_IDS}" != "[]" ]; then
            signature_note="

          New failure IDs vs the previous develop-post-merge run:
          $(jq -r '.[] | "- " + .' <<<"${NEW_FAILURE_IDS}")"
          else
            signature_note=""
          fi

          gh label create incident:develop-red \
            --description "Develop post-merge failure with an automatic revert PR" \
            --color B60205 >/dev/null 2>&1 || true
          gh label create incident:develop-red-revert-conflict \
            --description "Develop post-merge failure where automatic revert conflicted" \
            --color D93F0B >/dev/null 2>&1 || true

          existing_pr_url="$(gh pr list \
            --state open \
            --base develop \
            --head "${revert_branch}" \
            --json url \
            --jq '.[0].url // ""')"
          if [ -n "${existing_pr_url}" ]; then
            echo "Revert PR already exists: ${existing_pr_url}"
            echo "auto-revert-pr-url=${existing_pr_url}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          repo_name="${GITHUB_REPOSITORY#*/}"
          pr_json="$(gh api graphql \
            -f owner="${GITHUB_REPOSITORY_OWNER}" \
            -f repo="${repo_name}" \
            -f oid="${FAILING_SHA}" \
            -f query='
              query($owner: String!, $repo: String!, $oid: GitObjectID!) {
                repository(owner: $owner, name: $repo) {
                  object(oid: $oid) {
                    ... on Commit {
                      associatedPullRequests(first: 1) {
                        nodes {
                          number
                          title
                          url
                          author {
                            login
                          }
                        }
                      }
                    }
                  }
                }
              }
            ' \
            --jq '.data.repository.object.associatedPullRequests.nodes[0] // {}')"

          pr_number="$(jq -r '.number // empty' <<<"${pr_json}")"
          pr_title="$(jq -r '.title // empty' <<<"${pr_json}")"
          pr_url="$(jq -r '.url // empty' <<<"${pr_json}")"
          pr_author="$(jq -r '.author.login // empty' <<<"${pr_json}")"

          if [ -z "${pr_number}" ]; then
            pr_label="commit ${short_sha}"
            pr_title="commit ${short_sha}"
            pr_url="${RUN_URL}"
          else
            pr_label="#${pr_number}"
          fi

          open_manual_action_issue() {
            local title="$1"
            local reason="$2"

            # Idempotency: if a re-run of this workflow lands on the
            # fallback path again for the same SHA (workflow re-run, retry
            # after manual intervention), reuse the existing open issue
            # instead of opening a duplicate. Match by SHA in the body via
            # the GitHub search index, scoped to the conflict label.
            existing_issue_url="$(gh issue list \
              --state open \
              --label incident:develop-red-revert-conflict \
              --search "${FAILING_SHA} in:body" \
              --json url \
              --jq '.[0].url // ""')"
            if [ -n "${existing_issue_url}" ]; then
              echo "Conflict issue already exists: ${existing_issue_url}"
              echo "conflict-issue-url=${existing_issue_url}" >> "${GITHUB_OUTPUT}"
              return 0
            fi

            body_file="$(mktemp)"
            cat > "${body_file}" <<EOF
          Develop went red after ${pr_label} landed, but the automatic revert could not open a revert PR.

          Reason: ${reason}

          Failing SHA: \`${FAILING_SHA}\`
          Failing run: ${RUN_URL}
          Originating PR: ${pr_url}
          Attempted revert branch: \`${revert_branch}\`

          A human needs to decide whether to revert a larger stack or fix forward.
          EOF

            issue_url="$(gh issue create \
              --title "${title}" \
              --body-file "${body_file}" \
              --label incident:develop-red-revert-conflict)"
            echo "conflict-issue-url=${issue_url}" >> "${GITHUB_OUTPUT}"
            echo "Opened conflict issue: ${issue_url}"
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin develop
          # Pull the existing remote revert ref (if any) so the
          # --force-with-lease check below has a real expected value
          # instead of relying on an implicit lease against a
          # remote-tracking ref that may not exist yet.
          git fetch --no-tags origin "${revert_branch}" || true
          git checkout -B "${revert_branch}" origin/develop

          target_sha="$(git rev-parse --verify origin/develop || true)"
          if [ -z "${target_sha}" ] || [ "${target_sha}" != "${FAILING_SHA}" ]; then
            open_manual_action_issue \
              "Auto-revert not attempted for stale develop target ${short_sha}" \
              "The live develop target changed after attribution was computed (expected ${FAILING_SHA}, found ${target_sha:-missing}). Re-evaluate the failure against the current target; no stale revert was proposed."
            exit 0
          fi

          # Prepare the inverse without committing so the target state and the
          # exact proposed diff are visible before a retry/push/PR mutation.
          if git revert --no-commit "${FAILING_SHA}"; then
            proposed_revert_paths="$(git diff --name-only)"
            if [ -z "${proposed_revert_paths}" ] || ! git diff --check; then
              git revert --abort || git reset --hard HEAD
              open_manual_action_issue \
                "Auto-revert diff inspection failed for ${short_sha}" \
                "The live target was checked, but the proposed inverse diff was empty or failed git diff --check. No revert PR was opened."
              exit 0
            fi
            echo "Inspected proposed revert diff on develop@${target_sha}:"
            git diff --stat
            git diff --name-status
            git commit -m "Revert ${pr_title} (${pr_label}) - develop went red post-merge"
            remote_lease="$(git rev-parse --verify --quiet "refs/remotes/origin/${revert_branch}" || true)"
            if [ -n "${remote_lease}" ]; then
              push_lease="--force-with-lease=${revert_branch}:${remote_lease}"
            else
              push_lease="--force-with-lease=${revert_branch}:"
            fi
            if ! git push "${push_lease}" origin "${revert_branch}"; then
              open_manual_action_issue \
                "Auto-revert could not push branch for develop red at ${short_sha}" \
                "The revert commit was created locally, but pushing \`${revert_branch}\` failed. This can happen if the offending commit changes workflow files and \`GITHUB_TOKEN\` lacks the \`workflows\` permission."
              exit 0
            fi

            body_file="$(mktemp)"
            cat > "${body_file}" <<EOF
          Develop went red after ${pr_label} landed.

          Failing SHA: \`${FAILING_SHA}\`
          Failing run: ${RUN_URL}
          Originating PR: ${pr_url}
          ${signature_note}

          This PR reverts only the offending squash commit. Reviewers should decide whether to merge this revert or fix forward.
          EOF

            if ! revert_pr_url="$(gh pr create \
              --base develop \
              --head "${revert_branch}" \
              --title "Revert ${pr_title} (${pr_label}) - develop went red post-merge" \
              --body-file "${body_file}" \
              --label incident:develop-red)"; then
              open_manual_action_issue \
                "Auto-revert branch created but PR creation failed for ${short_sha}" \
                "The revert branch \`${revert_branch}\` was pushed, but \`gh pr create\` failed."
              exit 0
            fi

            if [ -n "${pr_author}" ]; then
              gh pr edit "${revert_pr_url}" --add-reviewer "${pr_author}" || true
            fi

            opened_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            {
              echo "auto-revert-pr-url=${revert_pr_url}"
              echo "auto-revert-pr-opened-at=${opened_at}"
            } >> "${GITHUB_OUTPUT}"
            echo "Opened revert PR: ${revert_pr_url}"
          else
            git revert --abort || true
            open_manual_action_issue \
              "Auto-revert conflict for develop red at ${short_sha}" \
              "The automatic \`git revert ${FAILING_SHA}\` conflicted."
          fi

      - name: Upsert develop-red incident issue
        id: upsert-incident
        # Persistent, unknown, stale, external-reference, transient, and
        # unmappable outcomes all share one owned incident path. Only the
        # positive code-regression outcome opens a revert PR.
        if: steps.signature-decision.outputs.should-revert == 'false' || steps.attribute.outputs.action == 'advisory'
        shell: bash
        env:
          PREVIOUS_RUN_URL: ${{ steps.signature-decision.outputs.previous-run-url }}
          COMPARISON_STATE: ${{ steps.signature-decision.outputs.comparison-state }}
          ATTRIBUTION_ACTION: ${{ steps.attribute.outputs.action }}
          INCIDENT_KEY: ${{ steps.attribute.outputs.incident-key }}
          ATTRIBUTION_ARTIFACT: ${{ steps.attribute.outputs.incident-artifact }}
        run: |
          set -euo pipefail

          gh label create incident:develop-red \
            --description "Develop post-merge failure requiring an owned action" \
            --color B60205 >/dev/null 2>&1 || true

          empty_signature='{"failure_ids":[],"jobs":[],"source_inputs":{}}'
          current_signature="${empty_signature}"
          if [ -f current-combined.json ]; then
            if ! current_signature="$(jq -ce 'if type == "object" and ((.failure_ids // []) | type == "array") and ((.jobs // []) | type == "array") and ((.source_inputs // {}) | type == "object") then . else error("signature object has invalid fields") end' current-combined.json 2>/dev/null)"; then
              echo "Current combined signature is missing or malformed; using the empty signature for the incident fallback."
              current_signature="${empty_signature}"
            fi
          else
            echo "Current combined signature is unavailable; using the empty signature for the incident fallback."
          fi
          current_failure_ids_json="$(jq -c '[.failure_ids[] | tostring] | unique | sort' <<<"${current_signature}")"
          current_incident_key="$(printf '%s' "${current_failure_ids_json}" | sha256sum | cut -c1-16)"
          incident_key="${INCIDENT_KEY}"
          if [ "${COMPARISON_STATE}" = "persistent" ] || [ -z "${incident_key}" ]; then
            incident_key="${current_incident_key}"
          fi
          artifact="${ATTRIBUTION_ARTIFACT}"
          if [ -z "${artifact}" ]; then
            artifact="$(jq -n \
              --arg key "${incident_key}" \
              --arg sha "${FAILING_SHA}" \
              --arg run "${RUN_URL}" \
              --arg prev "${PREVIOUS_RUN_URL}" \
              --argjson signature "${current_signature}" \
              '{schema_version: 2, incident_key: $key, failing_commit: {sha: $sha, run_url: $run}, failing_pr: {}, failure_ids: ($signature.failure_ids // []), jobs: ($signature.jobs // []), test_ids: ($signature.failure_ids // []), source_input_identities: {current: ($signature.source_inputs // {}), predecessor: {}}, predecessor_evidence: {run_url: $prev}, ownership_match: false, classification: "persistent-failure", action: "advisory", next_action: "Investigate the existing red incident; no new revert is needed.", owner: "BenchBox-dev", reasons: ["incident fallback uses the current combined failure signature"]}')"
          fi
          owner="$(jq -r '.owner // "BenchBox-dev"' <<<"${artifact}")"
          classification="$(jq -r '.classification // "unknown"' <<<"${artifact}")"
          next_action="$(jq -r '.next_action // "An owner must classify the evidence and choose fix-forward or a reviewed revert; keep develop red."' <<<"${artifact}")"
          artifact_summary="$(jq -c . <<<"${artifact}")"

          # One open incident issue per persistent-red episode: reuse it
          # across every run that repeats the same failure signature instead
          # of opening a new issue (or a revert PR) each time.
          existing_issue_url="$(gh issue list \
            --state open \
            --label incident:develop-red \
            --search "${incident_key} in:body" \
            --json url \
            --jq '.[0].url // ""')"

          comment_body="Develop post-merge incident update.

          Failing SHA: \`${FAILING_SHA}\`
          Failing run: ${RUN_URL}
          Classification: ${classification}
          Action: ${ATTRIBUTION_ACTION:-advisory}
          Owner: @${owner#@}
          Next action: ${next_action}

          Incident key: \`${incident_key}\`
          Evidence artifact: \`${artifact_summary}\`"

          if [ -n "${existing_issue_url}" ]; then
            gh issue comment "${existing_issue_url}" --body "${comment_body}"
            echo "incident-issue-url=${existing_issue_url}" >> "${GITHUB_OUTPUT}"
            echo "Updated existing incident issue: ${existing_issue_url}"
          else
            body_file="$(mktemp)"
            cat > "${body_file}" <<EOF
          Develop post-merge attribution requires an owned action.

          Failing SHA: \`${FAILING_SHA}\`
          Failing run: ${RUN_URL}
          Previous run: ${PREVIOUS_RUN_URL}

          Classification: ${classification}
          Action: ${ATTRIBUTION_ACTION:-advisory}
          Owner: @${owner#@}
          Next action: ${next_action}
          Incident key: \`${incident_key}\`

          Immutable evidence artifact:
          \`\`\`json
          ${artifact}
          \`\`\`
          EOF
            issue_url="$(gh issue create \
              --title "Develop is red: ${classification} attribution required" \
              --body-file "${body_file}" \
              --label incident:develop-red)"
            echo "incident-issue-url=${issue_url}" >> "${GITHUB_OUTPUT}"
            echo "Opened incident issue: ${issue_url}"
          fi

  green-run-cleanup:
    name: green-run-cleanup
    # Mirrors close-orphaned-prs' close-with-comment shape: when all four
    # gates are green, any open auto-revert/* PR or develop-red incident
    # issue left over from an earlier red streak is now stale - the failure
    # it tracked is resolved, so clear it instead of leaving it for a human
    # to notice and close by hand.
    needs: [lint, fast-test, explorer-tokens, medium-test]
    # Schedule path is gates-only: never close PRs/issues from a sweep.
    # event_name must lead so always() cannot re-enable mutation on schedule.
    if: ${{ github.event_name != 'schedule' && always() && needs.lint.result == 'success' && needs.fast-test.result == 'success' && needs.explorer-tokens.result == 'success' && needs.medium-test.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      MERGED_SHA: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.sha }}

      - name: Close stale auto-revert PRs and develop-red incidents
        shell: bash
        run: |
          set -euo pipefail

          current_target_sha="$(git ls-remote origin refs/heads/develop | cut -f1)"
          if [ -z "${current_target_sha}" ] || [ "${current_target_sha}" != "${MERGED_SHA}" ]; then
            echo "Develop moved from ${MERGED_SHA} to ${current_target_sha:-missing}; leaving incidents and revert PRs open."
            exit 0
          fi

          comment_body="Closing: develop is green again at ${RUN_URL} (\`${MERGED_SHA:0:12}\`)."

          mapfile -t pr_numbers < <(gh pr list \
            --state open \
            --base develop \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("auto-revert/")) | .number')

          if [ "${#pr_numbers[@]}" -eq 0 ]; then
            echo "No open auto-revert/* PRs to close."
          else
            for number in "${pr_numbers[@]}"; do
              if gh pr close "${number}" --comment "${comment_body}"; then
                echo "PR #${number}: closed (develop green)."
              else
                echo "PR #${number}: gh pr close failed; leaving open." >&2
              fi
            done
          fi

          for label in incident:develop-red incident:develop-red-revert-conflict; do
            mapfile -t issue_numbers < <(gh issue list \
              --state open \
              --label "${label}" \
              --json number \
              --jq '.[].number')

            if [ "${#issue_numbers[@]}" -eq 0 ]; then
              echo "No open ${label} issues to close."
              continue
            fi

            for number in "${issue_numbers[@]}"; do
              if gh issue close "${number}" --comment "${comment_body}"; then
                echo "Issue #${number} (${label}): closed (develop green)."
              else
                echo "Issue #${number} (${label}): gh issue close failed; leaving open." >&2
              fi
            done
          done

  metrics:
    name: metrics
    runs-on: ubuntu-latest
    needs: [lint, fast-test, explorer-tokens, medium-test, auto-revert-on-failure, queue-certification]
    if: ${{ always() }}
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      MERGED_SHA: ${{ github.sha }}
      RUN_ID: ${{ github.run_id }}
      LINT_RESULT: ${{ needs.lint.result }}
      FAST_TEST_RESULT: ${{ needs.fast-test.result }}
      EXPLORER_TOKENS_RESULT: ${{ needs.explorer-tokens.result }}
      # medium-test was promoted to a blocking gate 2026-07-06 (see its
      # promotion note): needs.medium-test.result now reflects real step
      # failures (continue-on-error dropped), so this var is live and does
      # flip post_merge_red like the other three gates.
      MEDIUM_TEST_RESULT: ${{ needs.medium-test.result }}
      AUTO_REVERT_PR_OPENED_AT: ${{ needs.auto-revert-on-failure.outputs.auto-revert-pr-opened-at }}
      AUTO_REVERT_PR_URL: ${{ needs.auto-revert-on-failure.outputs.auto-revert-pr-url }}
      CONFLICT_ISSUE_URL: ${{ needs.auto-revert-on-failure.outputs.conflict-issue-url }}
      NEW_FAILURE_IDS: ${{ needs.auto-revert-on-failure.outputs.new-failure-ids }}
      REVERT_SUPPRESSED: ${{ needs.auto-revert-on-failure.outputs.revert-suppressed }}
      CERTIFYING_RUN_ID: ${{ needs.queue-certification.outputs.certifying_run_id }}
    steps:
      - name: Write dev-loop metrics JSON
        shell: bash
        run: |
          set -euo pipefail

          repo_name="${GITHUB_REPOSITORY#*/}"
          post_merge_red=false
          if [ "${LINT_RESULT}" = "failure" ] || [ "${FAST_TEST_RESULT}" = "failure" ] || [ "${EXPLORER_TOKENS_RESULT}" = "failure" ] || [ "${MEDIUM_TEST_RESULT}" = "failure" ]; then
            post_merge_red=true
          fi

          pr_json="$(gh api graphql \
            -f owner="${GITHUB_REPOSITORY_OWNER}" \
            -f repo="${repo_name}" \
            -f oid="${MERGED_SHA}" \
            -f query='
              query($owner: String!, $repo: String!, $oid: GitObjectID!) {
                repository(owner: $owner, name: $repo) {
                  object(oid: $oid) {
                    ... on Commit {
                      associatedPullRequests(first: 1) {
                        nodes {
                          number
                          createdAt
                          mergedAt
                          labels(first: 20) {
                            nodes {
                              name
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            ' \
            --jq '.data.repository.object.associatedPullRequests.nodes[0] // {}')"

          jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100")"

          mkdir -p dev-loop-metrics
          jq -n \
            --argjson pr "${pr_json}" \
            --argjson jobs "${jobs_json}" \
            --arg post_merge_red "${post_merge_red}" \
            --arg auto_revert_pr_opened_at "${AUTO_REVERT_PR_OPENED_AT}" \
            --arg auto_revert_pr_url "${AUTO_REVERT_PR_URL}" \
            --arg conflict_issue_url "${CONFLICT_ISSUE_URL}" \
            --arg new_failure_ids "${NEW_FAILURE_IDS}" \
            --arg revert_suppressed "${REVERT_SUPPRESSED}" \
            --arg certifying_run_id "${CERTIFYING_RUN_ID}" \
            'def null_if_empty: if . == "" then null else . end;
             def ts: fromdateiso8601;
             ($pr.createdAt // null) as $created_at |
             ($pr.mergedAt // null) as $merged_at |
             (if $post_merge_red == "true" then
                ([($jobs.jobs // [])[] |
                  select((.name == "lint" or .name == "fast-test" or .name == "explorer-tokens" or .name == "medium-test") and .conclusion == "failure" and .completed_at != null) |
                  .completed_at] | min // null)
              else null end) as $red_at |
             {
               merged_at: $merged_at,
               pr_number: ($pr.number // null),
               pr_open_to_merged_seconds: (
                 if $created_at != null and $merged_at != null then
                   (($merged_at | ts) - ($created_at | ts) | floor)
                 else null end
               ),
               post_merge_red: ($post_merge_red == "true"),
               develop_red_detected_at: $red_at,
               auto_revert_pr_opened_at: ($auto_revert_pr_opened_at | null_if_empty),
               time_to_revert_pr_seconds: (
                 if ($red_at != null and $auto_revert_pr_opened_at != "") then
                   (($auto_revert_pr_opened_at | ts) - ($red_at | ts) | floor)
                 else null end
               ),
               next_green_develop_run_at: null,
               time_to_recover_red_seconds: null,
               conflict_on_merge: ([($pr.labels.nodes // [])[].name] | any(test("conflict"; "i"))),
               orphaned_failed_pr: (($post_merge_red == "true") and (($pr.number // null) == null)),
               ci_runner_minutes: (
                 (([($jobs.jobs // [])[] |
                   select(.started_at != null and .completed_at != null) |
                   ((.completed_at | ts) - (.started_at | ts))]
                 | add) // 0) / 60
               ),
               auto_revert_pr_url: ($auto_revert_pr_url | null_if_empty),
               conflict_issue_url: ($conflict_issue_url | null_if_empty),
               new_failure_ids: (($new_failure_ids | fromjson?) // null),
               revert_suppressed: ($revert_suppressed == "true"),
               queue_certified_by_run_id: (
                 if ($certifying_run_id | test("^[0-9]+$")) then
                   ($certifying_run_id | tonumber)
                 else null end
               )
             }' > "dev-loop-metrics/${MERGED_SHA}.json"

          cat "dev-loop-metrics/${MERGED_SHA}.json"

      - name: Upload metrics artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: metrics
          path: dev-loop-metrics/*.json
          retention-days: 90
