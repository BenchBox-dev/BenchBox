name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      test_pypi:
        description: 'Publish to Test PyPI instead of PyPI'
        required: false
        default: false
        type: boolean

jobs:
  # Note: ruleset main-release-only gates the release-cut PR on lint + test
  # before squash-merge to main, so the tag fired here has already been
  # CI-validated. The previous check-ci-passed JS poller was redundant.
  dependency-bounds:
    runs-on: ubuntu-latest
    outputs:
      report_path: ${{ steps.gate.outputs.report_path }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --group dev

      - name: Check dependency upper bounds (blocking + report)
        id: gate
        run: |
          mkdir -p release-artifacts
          report=release-artifacts/dependency-bounds.md
          uv run -- python scripts/check_dependency_bounds.py \
            --fail-on=cap-reached \
            --output "$report"
          echo "report_path=$report" >> "$GITHUB_OUTPUT"

      - name: Upload bounds report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-bounds-report
          path: release-artifacts/dependency-bounds.md
          retention-days: 90

  build:
    needs: dependency-bounds
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Extract version
        id: version
        run: |
          version=$(grep -E '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Build package with reproducible timestamp
        run: |
          # Use commit timestamp for reproducible builds
          # Anyone building from the same commit gets identical artifacts
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          echo "Building with SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          uv build

      - name: Check package
        run: uvx twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.test_pypi == 'true' && 'test-pypi' || 'pypi' }}
      url: ${{ github.event.inputs.test_pypi == 'true' && 'https://test.pypi.org/p/benchbox' || 'https://pypi.org/p/benchbox' }}
    permissions:
      id-token: write  # Required for trusted publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - name: Publish to Test PyPI
        if: github.event.inputs.test_pypi == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          attestations: false
          verbose: true

      - name: Publish to PyPI
        if: github.event.inputs.test_pypi != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          attestations: false
          verbose: true

  # Create GitHub Release with build artifacts attached
  github-release:
    needs: [publish, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - name: Create GitHub Release
        run: >
          gh release create "${{ github.ref_name }}"
          dist/*
          --title "BenchBox ${{ needs.build.outputs.version }}"
          --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Verify installation works across platforms after publishing
  test-installation:
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.12', '3.13']
        exclude:
          # Reduce matrix size - test latest Python only on Linux
          - os: windows-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.13'
    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Wait for package availability
        shell: bash
        run: sleep 60

      - name: Test installation from PyPI
        if: github.event.inputs.test_pypi != 'true'
        run: |
          pip install benchbox
          python -c "import importlib.util; import benchbox; assert importlib.util.find_spec('pandas') is None, 'published core wheel must not pull pandas'; print(f'BenchBox {benchbox.__version__} installed successfully (minimal import surface)')"
          benchbox --help

      - name: Test installation from Test PyPI
        if: github.event.inputs.test_pypi == 'true'
        run: |
          pip install -i https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ benchbox
          python -c "import importlib.util; import benchbox; assert importlib.util.find_spec('pandas') is None, 'published core wheel must not pull pandas'; print(f'BenchBox {benchbox.__version__} installed successfully (minimal import surface)')"
          benchbox --help

  # Delete old workflow artifacts to prevent confusion
  cleanup-artifacts:
    needs: test-installation
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete old release artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            // List artifacts older than 7 days with 'release-dist' or 'dist' name
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner,
              repo,
              per_page: 100,
            });

            const now = new Date();
            const sevenDaysAgo = new Date(now - 7 * 24 * 60 * 60 * 1000);

            for (const artifact of artifacts.data.artifacts) {
              const createdAt = new Date(artifact.created_at);
              // Delete old dist artifacts to prevent confusion
              if (createdAt < sevenDaysAgo &&
                  (artifact.name === 'dist' || artifact.name === 'release-dist' || artifact.name === 'test-dist')) {
                console.log(`Deleting old artifact: ${artifact.name} (${artifact.id}) from ${artifact.created_at}`);
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id,
                });
              }
            }
