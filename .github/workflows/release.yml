name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      test_pypi:
        description: 'Publish to Test PyPI instead of PyPI'
        required: false
        default: false
        type: boolean
      wheel_build_number:
        description: 'Optional wheel build tag for same-version repair wheels'
        required: false
        default: ''
        type: string

jobs:
  # Note: ruleset main-release-only gates the release-cut PR on lint + test
  # before squash-merge to main, so the tag fired here has already been
  # CI-validated. The previous check-ci-passed JS poller was redundant.
  dependency-bounds:
    runs-on: ubuntu-latest
    outputs:
      report_path: ${{ steps.gate.outputs.report_path }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --group dev

      - name: Check dependency upper bounds (blocking + report)
        id: gate
        run: |
          mkdir -p release-artifacts
          report=release-artifacts/dependency-bounds.md
          uv run -- python scripts/check_dependency_bounds.py \
            --fail-on=cap-reached \
            --output "$report"
          echo "report_path=$report" >> "$GITHUB_OUTPUT"

      - name: Upload bounds report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-bounds-report
          path: release-artifacts/dependency-bounds.md
          retention-days: 90

  build:
    needs: dependency-bounds
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Extract version
        id: version
        run: |
          version=$(grep -E '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Build package with reproducible timestamp
        env:
          WHEEL_BUILD_NUMBER: ${{ inputs.wheel_build_number }}
        run: |
          # Use commit timestamp for reproducible builds
          # Anyone building from the same commit gets identical artifacts
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          echo "Building with SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          rm -rf dist
          if [[ -n "$WHEEL_BUILD_NUMBER" ]]; then
            if [[ ! "$WHEEL_BUILD_NUMBER" =~ ^[0-9][A-Za-z0-9_.]*$ ]]; then
              echo "::error::wheel_build_number must start with a digit and contain only letters, digits, underscores, or dots."
              exit 1
            fi
            uv build --wheel \
              --config-setting=--build-option=--build-number \
              --config-setting=--build-option="$WHEEL_BUILD_NUMBER"
          else
            uv build
          fi

      - name: Check package
        run: uvx twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          retention-days: 30

  pre-publish-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Test wheel import and CLI before publish
        shell: bash
        run: |
          # --no-project plus a temp cwd prevents uv from syncing a checkout env.
          wheel="$(echo "$PWD"/dist/*.whl)"
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          uv run --isolated --no-project --with "$wheel" -- python -c "import benchbox; assert 'site-packages' in benchbox.__file__, benchbox.__file__; print(f'BenchBox {benchbox.__version__} imported from wheel')"
          uv run --isolated --no-project --with "$wheel" -- benchbox --help

  publish:
    needs: pre-publish-smoke
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.test_pypi == 'true' && 'test-pypi' || 'pypi' }}
      url: ${{ github.event.inputs.test_pypi == 'true' && 'https://test.pypi.org/p/benchbox' || 'https://pypi.org/p/benchbox' }}
    permissions:
      id-token: write  # Required for trusted publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - name: Publish to Test PyPI
        if: github.event.inputs.test_pypi == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          attestations: false
          verbose: true

      - name: Publish to PyPI
        if: github.event.inputs.test_pypi != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          attestations: false
          verbose: true

  # Create GitHub Release with build artifacts attached
  github-release:
    needs: [publish, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - name: Create or update GitHub Release
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            existing_assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
            for artifact in dist/*; do
              name="$(basename "$artifact")"
              if printf '%s\n' "$existing_assets" | grep -Fxq "$name"; then
                echo "Asset $name already exists; skipping."
              else
                gh release upload "$tag" "$artifact"
              fi
            done
          else
            gh release create "$tag" \
              dist/* \
              --title "BenchBox ${{ needs.build.outputs.version }}" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Verify installation works across platforms after publishing
  test-installation:
    needs: [publish, build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.12', '3.13']
        exclude:
          # Reduce matrix size - test latest Python only on Linux
          - os: windows-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.13'
    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Wait for package availability
        shell: bash
        run: sleep 60

      - name: Test installation from PyPI
        if: github.event.inputs.test_pypi != 'true'
        run: |
          pip install "benchbox==${{ needs.build.outputs.version }}"
          python -c "import benchbox; print(f'BenchBox {benchbox.__version__} installed successfully')"
          benchbox --help

      - name: Test installation from Test PyPI
        if: github.event.inputs.test_pypi == 'true'
        run: |
          pip install -i https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ "benchbox==${{ needs.build.outputs.version }}"
          python -c "import benchbox; print(f'BenchBox {benchbox.__version__} installed successfully')"
          benchbox --help

  # Delete old workflow artifacts to prevent confusion
  cleanup-artifacts:
    needs: test-installation
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete old release artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            // List artifacts older than 7 days with 'release-dist' or 'dist' name
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner,
              repo,
              per_page: 100,
            });

            const now = new Date();
            const sevenDaysAgo = new Date(now - 7 * 24 * 60 * 60 * 1000);

            for (const artifact of artifacts.data.artifacts) {
              const createdAt = new Date(artifact.created_at);
              // Delete old dist artifacts to prevent confusion
              if (createdAt < sevenDaysAgo &&
                  (artifact.name === 'dist' || artifact.name === 'release-dist' || artifact.name === 'test-dist')) {
                console.log(`Deleting old artifact: ${artifact.name} (${artifact.id}) from ${artifact.created_at}`);
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id,
                });
              }
            }
