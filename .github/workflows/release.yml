name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      test_pypi:
        description: 'Publish to Test PyPI instead of PyPI'
        required: false
        default: false
        type: boolean

jobs:
  # Note: ruleset release-only gates the release-cut PR on lint + test
  # before squash-merge to release, so the tag fired here is expected to have
  # already been CI-validated. verify-tag-on-release below enforces that
  # invariant in the workflow itself (rather than relying solely on the
  # out-of-band process of "nobody tags/dispatches from anywhere but release")
  # before any build/publish work starts. The previous check-ci-passed JS
  # poller was redundant with the ruleset and has been removed.
  verify-tag-on-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert release ref is release or an ancestor of release
        run: |
          git fetch origin release --quiet
          target_sha="${{ github.sha }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "Tag push ${{ github.ref_name }}: verifying $target_sha is an ancestor of origin/release"
          else
            echo "workflow_dispatch from ${{ github.ref }}: verifying $target_sha is origin/release or an ancestor of it"
          fi
          if ! git merge-base --is-ancestor "$target_sha" origin/release; then
            echo "::error::Ref $target_sha (${{ github.ref }}) is not origin/release or an ancestor of it. Refusing to build/publish."
            exit 1
          fi
          echo "OK: $target_sha is origin/release or an ancestor of it."

      - name: Assert tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package_version=$(grep -E '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          expected_tag="v${package_version}"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match package version '$package_version' (expected '$expected_tag')."
            exit 1
          fi
          echo "OK: release tag $RELEASE_TAG matches package version $package_version."

  verify-uat-charter:
    needs: verify-tag-on-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require a committed UAT charter or pointer
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            tests/uat/CHARTER.md
            _project/release-evidence/README.md
          )
          found=0
          for path in "${candidates[@]}"; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1 && test -s "$path"; then
              echo "Found committed UAT charter or pointer: $path"
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::Release ref contains neither a committed UAT charter nor a release-evidence pointer."
            exit 1
          fi

  dependency-bounds:
    needs: verify-tag-on-release
    runs-on: ubuntu-latest
    outputs:
      report_path: ${{ steps.gate.outputs.report_path }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --group dev

      - name: Check dependency upper bounds (blocking + report)
        id: gate
        run: |
          mkdir -p release-artifacts
          report=release-artifacts/dependency-bounds.md
          uv run -- python scripts/check_dependency_bounds.py \
            --fail-on=cap-reached \
            --output "$report"
          echo "report_path=$report" >> "$GITHUB_OUTPUT"

      - name: Upload bounds report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-bounds-report
          path: release-artifacts/dependency-bounds.md
          retention-days: 90

  build:
    needs: [verify-tag-on-release, verify-uat-charter, dependency-bounds]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Extract version
        id: version
        run: |
          version=$(grep -E '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Build package with reproducible timestamp
        run: |
          # Use commit timestamp for reproducible builds
          # Anyone building from the same commit gets identical artifacts
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          echo "Building with SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          uv build

      - name: Check package
        run: uvx twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          retention-days: 30

  publish:
    needs: [build, test-installation]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.test_pypi == 'true' && 'test-pypi' || 'pypi' }}
      url: ${{ github.event.inputs.test_pypi == 'true' && 'https://test.pypi.org/p/benchbox' || 'https://pypi.org/p/benchbox' }}
    permissions:
      id-token: write  # Required for trusted publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - name: Publish to Test PyPI
        # Decision: no ref-shape restriction here (unlike the real-PyPI step
        # below). Test PyPI publishing via workflow_dispatch from any ref is
        # the intended pre-release validation path and is lower risk by
        # design (test.pypi.org is not the real distribution channel);
        # verify-tag-on-release above still requires the dispatched ref be
        # release or an ancestor of it, which is sufficient here.
        if: github.event.inputs.test_pypi == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          attestations: false
          verbose: true

      - name: Publish to PyPI
        # Defense in depth alongside verify-tag-on-release: even if that job is
        # ever bypassed or miswired, this step alone refuses to publish to
        # real PyPI unless the triggering ref is an actual v* tag. A
        # workflow_dispatch from a branch (with the test_pypi input left at
        # its default false) can therefore never reach real PyPI.
        if: github.event.inputs.test_pypi != 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          attestations: false
          verbose: true

  # Create GitHub Release with build artifacts attached
  github-release:
    needs: [publish, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - name: Extract curated release notes
        run: >
          python3 scripts/generate_changelog_entry.py
          --version "${{ needs.build.outputs.version }}"
          --print-section
          > release-notes.md

      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          title="BenchBox ${{ needs.build.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --title "$title" --notes-file release-notes.md
          else
            gh release create "$tag" dist/* --title "$title" --notes-file release-notes.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Verify installation works across platforms before publishing. Installing
  # the uploaded wheel avoids PyPI propagation races and makes this a real
  # publication gate rather than a post-publication smoke test.
  test-installation:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.12', '3.13']
        exclude:
          # Reduce matrix size - test latest Python only on Linux
          - os: windows-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.13'
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test installation from built wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python -c "import importlib.util; import benchbox; assert importlib.util.find_spec('pandas') is None, 'published core wheel must not pull pandas'; print(f'BenchBox {benchbox.__version__} installed successfully (minimal import surface)')"
          benchbox --help

  # Delete old workflow artifacts to prevent confusion
  cleanup-artifacts:
    needs: [publish, test-installation]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete old release artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            // List artifacts older than 7 days with 'release-dist' or 'dist' name
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner,
              repo,
              per_page: 100,
            });

            const now = new Date();
            const sevenDaysAgo = new Date(now - 7 * 24 * 60 * 60 * 1000);

            for (const artifact of artifacts.data.artifacts) {
              const createdAt = new Date(artifact.created_at);
              // Delete old dist artifacts to prevent confusion
              if (createdAt < sevenDaysAgo &&
                  (artifact.name === 'dist' || artifact.name === 'release-dist' || artifact.name === 'test-dist')) {
                console.log(`Deleting old artifact: ${artifact.name} (${artifact.id}) from ${artifact.created_at}`);
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id,
                });
              }
            }
