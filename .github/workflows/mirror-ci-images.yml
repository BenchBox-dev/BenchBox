name: Mirror CI images

on:
  workflow_call:
    inputs:
      images:
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install registry copy tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | skopeo login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Copy pinned image if absent
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          case "$IMAGE" in
            clickhouse) compose=docker/clickhouse/docker-compose.yml; service=clickhouse ;;
            trino) compose=docker/trino/docker-compose.yml; service=trino ;;
            cedardb) compose=docker/cedardb/docker-compose.yml; service=cedardb ;;
            *) echo "::error::Unsupported mirror image: $IMAGE"; exit 1 ;;
          esac
          source=$(CLICKHOUSE_MEMORY_LIMIT=4g docker compose -f "$compose" config --format json | jq -r --arg service "$service" '.services[$service].image')
          if [[ "$source" == *@sha256:* ]]; then
            digest=${source##*@}
            destination="ghcr.io/benchbox-dev/$IMAGE@${digest}"
            copy_destination="ghcr.io/benchbox-dev/$IMAGE:digest-${digest#sha256:}"
          else
            tag=${source##*:}
            destination="ghcr.io/benchbox-dev/$IMAGE:$tag"
            copy_destination=$destination
          fi
          if ! skopeo inspect --raw "docker://$destination" > /dev/null; then
            skopeo copy --all --preserve-digests "docker://docker.io/$source" "docker://$copy_destination"
          fi
          skopeo inspect --raw "docker://$destination" > /dev/null
