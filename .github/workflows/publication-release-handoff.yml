name: Publication Release Handoff

# After a package release publishes, start a site publication candidate and
# its promotion transaction so a release cannot silently leave benchbox.dev
# on the previous version. This workflow never writes Pages itself: it only
# dispatches the candidate builder and the transaction workflow (which waits
# for the github-pages approval), and opens a tracked fallback issue when
# any step fails.
"on":
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to hand off (for example v0.4.2)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  handoff:
    name: Dispatch publication candidate and promotion for release
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      actions: write
      issues: write
    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG:-$INPUT_TAG}"
          printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::release handoff requires a vX.Y.Z tag, got: $TAG"
            exit 1
          }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          date -u +%Y-%m-%dT%H:%M:%SZ > handoff-start.txt
          echo "start=$(cat handoff-start.txt)" >> "$GITHUB_OUTPUT"

      - name: Dispatch publication candidate build
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DISPATCH_OUT=$(gh workflow run "Publication Control Plane Deployment" \
            --ref develop --field candidate_only=true)
          echo "$DISPATCH_OUT"
          # gh workflow run prints the created run URL when available; keep
          # it for correlation so a later unrelated deploy cannot be mistaken
          # for this handoff's candidate.
          CANDIDATE_URL=$(printf '%s\n' "$DISPATCH_OUT" | grep -oE 'https://github.com/[^ ]+/actions/runs/[0-9]+' | head -1 || true)
          echo "dispatch_url=${CANDIDATE_URL:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Wait for candidate bundle and dispatch promotion
        id: promote
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          START_ISO: ${{ steps.tag.outputs.start }}
          TAG: ${{ steps.tag.outputs.tag }}
          CANDIDATE_URL: ${{ steps.candidate.outputs.dispatch_url }}
        run: |
          set -euo pipefail
          # Monotonic deadline: SECONDS counts shell uptime, immune to wall
          # clock steps. START_ISO stays the audit timestamp for correlation.
          WAIT_SECONDS=7200
          CANDIDATE_RUN_ID=$(printf '%s\n' "$CANDIDATE_URL" | grep -oE '[0-9]+$' || true)
          RUN_ID=""
          while [ "$SECONDS" -lt "$WAIT_SECONDS" ]; do
            if [ -n "$CANDIDATE_RUN_ID" ]; then
              STATUS=$(gh api "repos/$REPO/actions/runs/$CANDIDATE_RUN_ID" --jq '{status, conclusion}' 2>/dev/null || true)
              if [ "$(printf '%s' "$STATUS" | jq -r .status)" = "completed" ] \
                && [ "$(printf '%s' "$STATUS" | jq -r .conclusion)" = "success" ]; then
                RUN_ID="$CANDIDATE_RUN_ID"
                break
              fi
            else
              RUN_ID=$(gh run list --workflow "publication-deploy.yml" --branch develop \
                --event workflow_dispatch --limit 10 \
                --json databaseId,status,conclusion,createdAt,headBranch \
                --jq "[.[] | select(.headBranch == \"develop\" and .status == \"completed\" and .conclusion == \"success\" and .createdAt >= \"$START_ISO\")] | first | .databaseId // empty")
              if [ -n "$RUN_ID" ]; then
                break
              fi
            fi
            sleep 120
          done
          test -n "$RUN_ID" || {
            echo "::error::no successful candidate build appeared within 120 minutes"
            exit 1
          }
          ARTIFACT_ID=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq "[.artifacts[] | select(.name == \"publication-candidate-$RUN_ID\" and .expired == false)] | first | .id // empty")
          test -n "$ARTIFACT_ID" || {
            echo "::error::candidate run $RUN_ID has no publication-candidate bundle artifact"
            exit 1
          }
          PROMOTE_OUT=$(gh workflow run "Publication Transactions" --ref develop \
            --field kind=promotion --field candidate_artifact_id="$ARTIFACT_ID")
          echo "$PROMOTE_OUT"
          PROMOTE_URL=$(printf '%s\n' "$PROMOTE_OUT" | grep -oE 'https://github.com/[^ ]+/actions/runs/[0-9]+' | head -1 || true)
          echo "promotion_url=${PROMOTE_URL:-unknown}" >> "$GITHUB_OUTPUT"
          {
            echo "## Publication handoff for $TAG"
            echo ""
            echo "Candidate run: $RUN_ID (artifact $ARTIFACT_ID)."
            echo "Promotion: ${PROMOTE_URL:-dispatched, URL unavailable}."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Observe promotion conclusion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PROMOTE_URL: ${{ steps.promote.outputs.promotion_url }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          PROMOTE_RUN_ID=$(printf '%s\n' "$PROMOTE_URL" | grep -oE '[0-9]+$' || true)
          test -n "$PROMOTE_RUN_ID" || {
            echo "::error::promotion dispatch for $TAG returned no run URL; cannot observe the result"
            exit 1
          }
          # Promotion waits on the github-pages approval, so observe with the
          # same monotonic budget rather than finishing green at dispatch.
          while [ "$SECONDS" -lt 7200 ]; do
            CONCLUSION=$(gh api "repos/$REPO/actions/runs/$PROMOTE_RUN_ID" --jq '{status, conclusion}' 2>/dev/null || true)
            STATUS=$(printf '%s' "$CONCLUSION" | jq -r .status)
            RESULT=$(printf '%s' "$CONCLUSION" | jq -r .conclusion)
            if [ "$STATUS" = "completed" ]; then
              if [ "$RESULT" = "success" ]; then
                echo "Promotion $PROMOTE_RUN_ID completed successfully."
                exit 0
              fi
              echo "::error::promotion $PROMOTE_RUN_ID concluded $RESULT"
              exit 1
            fi
            sleep 120
          done
          echo "::error::promotion $PROMOTE_RUN_ID did not conclude within 120 minutes"
          exit 1

      - name: Open tracked fallback issue when handoff fails
        if: failure() && steps.tag.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh label create publication --description "Site publication pipeline" 2>/dev/null || true
          gh issue create \
            --title "Publication handoff failed for $TAG" \
            --label "publication" \
            --body "The automatic publication handoff failed for release $TAG (run ${{ github.run_id }}).
          Promote the site manually: dispatch \`Publication Control Plane Deployment\` from \`develop\` with
          \`candidate_only=true\`, then run the promotion transaction from
          \`docs/operations/publication-deployer-soak-and-retirement.md\`."
