name: Seed Corpus

# NOTE: Actual benchmark runs require meaningful compute resources and wall-clock time.
# SF 0.01 / SF 0.1 jobs typically complete in a few minutes on a GitHub-hosted runner.
# SF 1.0 jobs (especially TPC-DS) may take 10-30+ minutes depending on the platform.
# ClickHouse Cloud jobs require CLICKHOUSE_CLOUD_HOST and CLICKHOUSE_CLOUD_PASSWORD secrets.

on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: "Run only this benchmark (leave blank to run all)"
        required: false
        default: ""
        type: string

jobs:
  generate-seed-corpus:
    name: "${{ matrix.benchmark }} / ${{ matrix.platform }} / sf${{ matrix.scale_factor }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # ClickHouse Cloud requires external credentials - skip gracefully when absent.
    # All other matrix entries are unconditional.
    continue-on-error: ${{ matrix.optional == true }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # TPC-H SF 0.01
          - benchmark: tpch
            platform: duckdb
            scale_factor: "0.01"
            extras: duckdb
          - benchmark: tpch
            platform: datafusion
            scale_factor: "0.01"
            extras: datafusion
          - benchmark: tpch
            platform: polars-df
            scale_factor: "0.01"
            extras: polars

          # TPC-H SF 0.1
          - benchmark: tpch
            platform: duckdb
            scale_factor: "0.1"
            extras: duckdb
          - benchmark: tpch
            platform: datafusion
            scale_factor: "0.1"
            extras: datafusion
          - benchmark: tpch
            platform: polars-df
            scale_factor: "0.1"
            extras: polars

          # TPC-H SF 1.0
          - benchmark: tpch
            platform: duckdb
            scale_factor: "1.0"
            extras: duckdb
          - benchmark: tpch
            platform: datafusion
            scale_factor: "1.0"
            extras: datafusion
          - benchmark: tpch
            platform: clickhouse-cloud
            scale_factor: "1.0"
            extras: clickhouse-cloud
            optional: true # requires CLICKHOUSE_CLOUD_HOST + CLICKHOUSE_CLOUD_PASSWORD secrets

          # TPC-DS SF 1 (integer-only scale factors - do not use fractional values)
          # polars-df is intentionally omitted because BenchBox does not ship a TPC-DS DataFrame adapter.
          - benchmark: tpcds
            platform: duckdb
            scale_factor: "1"
            extras: duckdb
          - benchmark: tpcds
            platform: datafusion
            scale_factor: "1"
            extras: datafusion

          # SSB SF 0.01
          - benchmark: ssb
            platform: duckdb
            scale_factor: "0.01"
            extras: duckdb
          - benchmark: ssb
            platform: datafusion
            scale_factor: "0.01"
            extras: datafusion
          - benchmark: ssb
            platform: polars-df
            scale_factor: "0.01"
            extras: polars

          # SSB SF 0.1
          - benchmark: ssb
            platform: duckdb
            scale_factor: "0.1"
            extras: duckdb
          - benchmark: ssb
            platform: datafusion
            scale_factor: "0.1"
            extras: datafusion
          - benchmark: ssb
            platform: polars-df
            scale_factor: "0.1"
            extras: polars

    # Skip matrix entries that don't match the requested benchmark (when provided).
    if: >
      github.event.inputs.benchmark == '' ||
      github.event.inputs.benchmark == matrix.benchmark

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install BenchBox
        run: uv sync --extra ${{ matrix.extras }}

      - name: Run benchmark
        env:
          CLICKHOUSE_CLOUD_HOST: ${{ secrets.CLICKHOUSE_CLOUD_HOST }}
          CLICKHOUSE_CLOUD_PASSWORD: ${{ secrets.CLICKHOUSE_CLOUD_PASSWORD }}
        run: |
          uv run benchbox run \
            --platform "${{ matrix.platform }}" \
            --benchmark "${{ matrix.benchmark }}" \
            --scale "${{ matrix.scale_factor }}" \
            --phases generate,load,power \
            --compression zstd:9

      - name: Locate result bundle
        id: locate
        shell: bash
        run: |
          # Default results dir is benchmark_runs/results/ relative to repo root.
          # Find the most recently modified schema-v2 JSON (excludes .plans.json / .tuning.json).
          RESULT=$(find benchmark_runs/results -maxdepth 1 -name "*.json" \
            ! -name "*.plans.json" ! -name "*.tuning.json" \
            -printf "%T@ %p\n" 2>/dev/null \
            | sort -rn | head -1 | awk '{print $2}')
          if [ -z "$RESULT" ]; then
            echo "ERROR: no result bundle found in benchmark_runs/results/" >&2
            exit 1
          fi
          echo "result_file=$RESULT" >> "$GITHUB_OUTPUT"
          echo "Found result bundle: $RESULT"

      - name: Stage bundle under results-data/
        shell: bash
        env:
          RESULT_FILE: ${{ steps.locate.outputs.result_file }}
        run: |
          DEST="results-data/bundles/${{ matrix.benchmark }}/${{ matrix.platform }}/sf${{ matrix.scale_factor }}"
          mkdir -p "$DEST"
          BASENAME=$(basename "$RESULT_FILE")
          cp "$RESULT_FILE" "$DEST/$BASENAME"

          # Copy companion files if they exist alongside the primary bundle.
          STEM="${RESULT_FILE%.json}"
          [ -f "${STEM}.plans.json" ] && cp "${STEM}.plans.json" "$DEST/" || true
          [ -f "${STEM}.tuning.json" ] && cp "${STEM}.tuning.json" "$DEST/" || true

          echo "Staged to: $DEST/$BASENAME"
        id: stage

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          # Artifact name must be unique per matrix entry.
          name: seed-bundle--${{ matrix.benchmark }}--${{ matrix.platform }}--sf${{ matrix.scale_factor }}
          path: results-data/bundles/${{ matrix.benchmark }}/${{ matrix.platform }}/sf${{ matrix.scale_factor }}/
          retention-days: 14

  create-pr:
    name: Open PR with seed corpus bundles
    runs-on: ubuntu-latest
    needs: generate-seed-corpus
    # Run even if some matrix jobs failed (continue-on-error jobs don't affect needs status,
    # but required jobs might fail - collect whatever succeeded).
    if: always()
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all bundle artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: seed-bundle--*
          path: results-data/bundles/
          merge-multiple: false

      - name: Flatten artifact subdirectories
        # download-artifact@v4 with merge-multiple: false creates one subdir per artifact.
        # The artifact name encodes benchmark/platform/sf, so we need to move files into
        # the correct nested path under results-data/bundles/.
        shell: bash
        run: |
          shopt -s nullglob
          for artifact_dir in results-data/bundles/seed-bundle--*/; do
            # Parse artifact name: seed-bundle--{benchmark}--{platform}--sf{scale}
            name=$(basename "$artifact_dir")
            # Strip prefix
            rest="${name#seed-bundle--}"
            benchmark="${rest%%--*}"; rest="${rest#*--}"
            platform="${rest%%--*}"; rest="${rest#*--}"
            # rest is now sf{scale}
            scale="${rest#sf}"

            dest="results-data/bundles/${benchmark}/${platform}/sf${scale}"
            mkdir -p "$dest"
            mv "$artifact_dir"* "$dest/" 2>/dev/null || true
            rmdir "$artifact_dir" 2>/dev/null || true
          done

      - name: Check for new bundles
        id: check
        shell: bash
        run: |
          git add results-data/bundles/
          if git diff --cached --quiet; then
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR branch and commit
        if: steps.check.outputs.no_changes == 'false'
        shell: bash
        run: |
          DATE=$(date -u +%Y%m%d)
          BRANCH="chore/seed-corpus-${DATE}-${{ github.run_number }}"
          git config user.name "benchbox-bot"
          git config user.email "bot@benchbox.dev"
          git checkout -b "$BRANCH"
          git commit -m "chore(data): add seed corpus bundles (run ${{ github.run_number }})"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
        id: commit

      - name: Open pull request
        if: steps.check.outputs.no_changes == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "chore(data): seed corpus bundles (run ${{ github.run_number }})" \
            --body "$(cat <<'EOF'
          ## Seed corpus update

          Automated PR from the \`seed-corpus\` workflow (run [${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})).

          ### Bundles included

          New or updated result bundles are committed under \`results-data/bundles/\`.
          Review the diff to confirm expected benchmark × platform × scale coverage.

          ### Trust label

          All bundles in this PR carry the \`maintainer-run\` / \`public-curated\` trust label.

          ### Merging

          Merge triggers the \`docs\` workflow which rebuilds the read model and
          redeploys the results explorer.
          EOF
          )" \
            --base main \
            --head "${{ steps.commit.outputs.branch }}"

      - name: No changes to commit
        if: steps.check.outputs.no_changes == 'true'
        run: echo "All generated bundles already exist in the repo - nothing to commit."
