name: oracle-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to check
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: oracle-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  oracle-review:
    name: oracle-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha || 'develop' }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Require the Codex connector's review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          REPO: ${{ github.repository }}
        run: python _project/scripts/oracle_review_check.py --repo "$REPO" --pr "$PR_NUMBER"
