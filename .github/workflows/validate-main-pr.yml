name: Validate main PR base

on:
  pull_request:
    branches:
      - main

concurrency:
  group: validate-main-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  validate-base:
    name: validate-base
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-release-branch PRs to main
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ "${HEAD_REF}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.+-]+)?$ ]]; then
            echo "Release branch '${HEAD_REF}' approved for merge into main."
            exit 0
          fi
          echo "::error::Only release branches matching 'vX.Y.Z' (optionally with a '-suffix') may merge into main. Got '${HEAD_REF}'."
          echo "::error::Open this PR against 'develop' instead, or cut a release branch via 'make release-cut VERSION=X.Y.Z'."
          exit 1

      - name: Checkout trusted release policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Fetch release refs for canary ancestor check
        run: |
          set -euo pipefail
          git fetch --prune origin develop
          git fetch --prune origin \
            "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/origin/pr-${{ github.event.pull_request.number }}-head"

      - name: Check release canary freshness
        id: release-readiness
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_CANARY_WORKFLOW: release-canary.yml
          RELEASE_CANARY_BRANCH: main
          RELEASE_CANARY_CHECKED_REF: develop
          RELEASE_CANARY_MAX_AGE_HOURS: "48"
          RELEASE_READINESS_OVERRIDE_SHA: ${{ vars.RELEASE_READINESS_OVERRIDE_SHA }}
          RELEASE_READINESS_OVERRIDE_REASON: ${{ vars.RELEASE_READINESS_OVERRIDE_REASON }}
        run: |
          if [ ! -f scripts/release_readiness_check.py ]; then
            # Trusted-base bootstrap: the readiness script ships to main with
            # this release, so the base checkout cannot have it yet. Mirror the
            # missing-workflow bootstrap path and run inline release evidence.
            echo "bootstrap_required=true" >> "$GITHUB_OUTPUT"
            echo "::warning::scripts/release_readiness_check.py is not on the trusted base yet; running inline release evidence."
            exit 0
          fi
          set +e
          uv run -- python scripts/release_readiness_check.py \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --bootstrap-on-missing-workflow
          rc=$?
          set -e
          if [ "$rc" = "0" ]; then
            exit 0
          fi
          if [ "$rc" != "20" ]; then
            exit "$rc"
          fi
          echo "bootstrap_required=true" >> "$GITHUB_OUTPUT"
          echo "::warning::release-canary.yml is not on the default branch yet; running inline release evidence."

      - name: Checkout release head for bootstrap evidence
        if: steps.release-readiness.outputs.bootstrap_required == 'true'
        uses: actions/checkout@v4
        with:
          # Inline bootstrap evidence must run against the release content
          # being validated; the trusted base cannot supply it while the
          # canary tooling has not shipped to main yet.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Bootstrap non-fast release evidence
        if: steps.release-readiness.outputs.bootstrap_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-canary-artifacts
          uv run -- python -m pytest \
            --collect-only \
            -q \
            -n 0 \
            -m "(slow or resource_heavy) and not (stress or live_integration)" \
            | tee release-canary-artifacts/non-fast-collect.txt
          count=$(grep -Eo '^[0-9]+/[0-9]+ tests collected' release-canary-artifacts/non-fast-collect.txt | tail -1 | cut -d/ -f1)
          if [ -z "$count" ]; then
            echo "::error::Could not parse collected non-fast bootstrap count."
            exit 1
          fi
          uv run -- python -m pytest \
            -m "(slow or resource_heavy) and not (stress or live_integration)" \
            -n 0 \
            --tb=short \
            --maxfail=5

      - name: Restore ruleset review enforcement helper for bootstrap
        if: steps.release-readiness.outputs.bootstrap_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # scripts/ruleset_drift_check.py imports the enforcement helper from
          # _project/scripts, but both the release head and the trusted main
          # base are curated (no _project/) once the release-cut curation
          # step removes it. Pull the helper from develop, which always has
          # it, so bootstrap evidence doesn't ModuleNotFoundError.
          if [ ! -f _project/scripts/ruleset_review_enforcement.py ]; then
            mkdir -p _project/scripts
            git show origin/develop:_project/scripts/ruleset_review_enforcement.py > _project/scripts/ruleset_review_enforcement.py
          fi

      - name: Bootstrap ruleset drift evidence
        if: steps.release-readiness.outputs.bootstrap_required == 'true'
        shell: bash
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
          RULESET_DRIFT_TOKEN: ${{ secrets.RULESET_DRIFT_TOKEN }}
          RELEASE_READINESS_OVERRIDE_SHA: ${{ vars.RELEASE_READINESS_OVERRIDE_SHA }}
          RELEASE_READINESS_OVERRIDE_REASON: ${{ vars.RELEASE_READINESS_OVERRIDE_REASON }}
        run: |
          set -euo pipefail
          mkdir -p release-canary-artifacts
          uv run -- python scripts/ruleset_drift_check.py \
            --token "${RULESET_DRIFT_TOKEN}" \
            --require-bypass-actor-visibility \
            --output release-canary-artifacts/ruleset-drift.json
