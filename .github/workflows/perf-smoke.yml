name: Performance Smoke

on:
  pull_request:
    branches: [main]

concurrency:
  group: perf-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf-smoke:
    # Skip when maintainer attaches the skip-perf-smoke label - reserved for
    # intentional baseline shifts or CI-runner flake triage.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-perf-smoke') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run DuckDB TPC-H SF=0.01 power phase
        run: |
          mkdir -p perf-smoke-output
          uv run benchbox run \
            --platform duckdb \
            --benchmark tpch \
            --scale 0.01 \
            --phases power \
            --non-interactive \
            --output perf-smoke-output

      - name: Locate current result file
        id: current
        run: |
          current=$(find benchmark_runs/results -name 'tpch_sf001_duckdb_sql_*.json' -print | sort | tail -1)
          if [[ -z "$current" ]]; then
            echo "No current result file produced by benchbox run." >&2
            exit 1
          fi
          echo "path=$current" >> "$GITHUB_OUTPUT"

      - name: Compare against baseline (fail on >10% regression)
        if: hashFiles('_project/baselines/perf_smoke_duckdb_tpch_001.json') != ''
        run: |
          uv run benchbox compare \
            _project/baselines/perf_smoke_duckdb_tpch_001.json \
            "${{ steps.current.outputs.path }}" \
            --fail-on-regression 10%

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-smoke-result
          path: ${{ steps.current.outputs.path }}
          retention-days: 14
