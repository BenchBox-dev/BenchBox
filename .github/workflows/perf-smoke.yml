name: Performance Smoke

on:
  pull_request:
    branches: [release]

concurrency:
  group: perf-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf-smoke:
    # Skip when maintainer attaches the skip-perf-smoke label - reserved for
    # intentional baseline shifts or CI-runner flake triage.
    # Also skip on Release v* PRs (curation + version bumps; nothing perf-affecting).
    if: |
      !contains(github.event.pull_request.labels.*.name, 'skip-perf-smoke')
      && !startsWith(github.event.pull_request.title, 'Release v')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run DuckDB TPC-H SF=0.01 power phase
        run: |
          mkdir -p perf-smoke-output
          uv run benchbox run \
            --platform duckdb \
            --benchmark tpch \
            --scale 0.01 \
            --phases power \
            --non-interactive \
            --output perf-smoke-output

      - name: Locate current result file
        id: current
        run: |
          current=$(find benchmark_runs/results -name 'tpch_sf001_duckdb_sql_*.json' -print | sort | tail -1)
          if [[ -z "$current" ]]; then
            echo "No current result file produced by benchbox run." >&2
            exit 1
          fi
          echo "path=$current" >> "$GITHUB_OUTPUT"

      - name: Compare against baseline (fail on >10% regression)
        run: |
          uv run benchbox compare \
            _project/baselines/perf_smoke_duckdb_tpch_001.json \
            "${{ steps.current.outputs.path }}" \
            --fail-on-regression 10%

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-smoke-result
          path: |
            ${{ steps.current.outputs.path }}
            _project/baselines/perf_smoke_duckdb_tpch_001.json
          retention-days: 14
