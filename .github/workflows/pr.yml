  postgres-integration:
    name: postgres-integration
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.needs-code-ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Non-blocking: service container startup can be flaky; failures surfaced as
    # warnings rather than a gate block to avoid spurious PR failures.
    continue-on-error: true
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: benchbox
          POSTGRES_PASSWORD: benchbox
          POSTGRES_DB: benchbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --group dev

      - name: Wait for PostgreSQL service to be reachable
        run: |
          # The live tests skip via skip_unless_docker_service when localhost:5432
          # is unreachable, and pytest exits 0 on an all-skipped run. That would
          # turn this non-blocking sample green without ever exercising PostgreSQL
          # plan capture, indistinguishable from a real pass in the PR checks UI.
          # Fail the step outright if the service container never came up so the
          # continue-on-error job surfaces as visibly red instead.
          for attempt in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U benchbox >/dev/null 2>&1; then
              echo "PostgreSQL is reachable."
              exit 0
            fi
            echo "Waiting for PostgreSQL (attempt ${attempt}/30)..."
            sleep 2
          done
          echo "::error::PostgreSQL service never became reachable on localhost:5432; the live integration sample cannot be skipped silently."
          exit 1

      - name: Run PostgreSQL live integration tests
        run: |
          # --no-header keeps the summary line parseable; -p no:cacheprovider
          # avoids a stale cache masking collection. The grep guard fails the
          # step when the run collected/ran nothing but skips (e.g. every test
          # skipped despite a reachable service), so an all-skipped run cannot
          # silently render as green in the PR checks UI.
          set -o pipefail
          uv run -- python -m pytest tests/integration/platforms/test_postgresql_live.py \
            -m "live_postgresql" --tb=short -v -p no:cacheprovider \
            | tee /tmp/pg_live_output.txt
          if ! grep -Eq '[0-9]+ passed' /tmp/pg_live_output.txt; then
            echo "::error::PostgreSQL live integration tests produced no passing tests (all skipped or none collected); refusing to report a silent pass."
            exit 1
          fi

      # Second-engine equivalence SAMPLE (non-blocking, see continue-on-error
      # above). The DuckDB SQL gate (correctness-gate job) stays the hard
      # blocker; this samples TPC-Havoc variant equivalence one engine over to
      # catch translation-induced divergence. Both canonical and variants are
      # translated to the postgres dialect and compared on this same instance.
      - name: Run TPC-Havoc PostgreSQL variant-equivalence sample
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: benchbox
          PGPASSWORD: benchbox
          PGDATABASE: benchbox_test
        run: |
          set -o pipefail
          uv run -- python -m pytest \
            tests/integration/platforms/test_tpchavoc_postgres_equivalence.py \
            -m "live_postgresql" -n 0 --tb=short -v -p no:cacheprovider \
            | tee /tmp/pg_tpchavoc_output.txt
          if ! grep -Eq '[0-9]+ passed' /tmp/pg_tpchavoc_output.txt; then
            echo "::error::TPC-Havoc PostgreSQL variant-equivalence sample produced no passing tests (all skipped or none collected); refusing to report a silent pass."
            exit 1
          fi

  datafusion-integration:
    name: datafusion-integration
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.needs-code-ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Non-blocking: this is the THIRD-engine equivalence SAMPLE, not a gate.
    # The DuckDB SQL gate (correctness-gate job) stays the hard blocker.
    # DataFusion is in-process (no service container), and its execution gaps
    # DIFFER from Postgres's, so this samples translation-induced divergence a
    # third engine over. continue-on-error keeps it a sample, not a blocker.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --group dev

      # Third-engine equivalence SAMPLE plus the DataFusion .tbl trailing-delimiter
      # load regression. Both canonical and variants are translated to the
      # datafusion dialect and compared on the same in-process session (shared
      # translation cancels out); DATAFUSION_TPCHAVOC_SKIPS variants are excluded,
      # never marked equivalent. Both files are slow-marked, so -m "slow" selects
      # them (overriding the default fast-lane deselect).
      - name: Run TPC-Havoc DataFusion variant-equivalence sample and .tbl load regression
        run: |
          uv run -- python -m pytest \
            tests/integration/platforms/test_tpchavoc_datafusion_equivalence.py \
            tests/integration/platforms/test_datafusion_tbl_load.py \
            -m "slow" -n 0 --tb=short -v

  clickhouse-integration:
    name: clickhouse-integration
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.needs-code-ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Non-blocking: this is the FOURTH-engine equivalence SAMPLE, not a gate.
    # The DuckDB SQL gate (correctness-gate job) stays the hard blocker.
    # ClickHouse runs in-process via chDB (clickhouse-local), no service container,
    # and is the first sampled engine on a NATIVE non-Postgres SQLGlot dialect, so
    # this samples translation-induced divergence through a different seam path.
    # Unlike the other three engines it is NOT systematic-zero - it surfaces real
    # engine-semantic result differences classified in CLICKHOUSE_KNOWN_DIVERGENCES.
    # continue-on-error keeps it a sample, not a blocker.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --group dev

      # Fourth-engine equivalence SAMPLE. Both canonical and variants are
      # translated to the NATIVE clickhouse dialect and compared on the same
      # in-process chDB instance (shared translation cancels out);
      # CLICKHOUSE_TPCHAVOC_SKIPS variants are excluded, never marked equivalent,
      # and the residue is classified against CLICKHOUSE_KNOWN_DIVERGENCES. The
      # live sweep is tpchavoc + slow-marked; `-m "tpchavoc"` with a pinned path
      # selects it (overriding the default fast-lane deselect).
      - name: Run TPC-Havoc ClickHouse variant-equivalence sample
        run: |
          uv run -- python -m pytest \
            tests/integration/platforms/test_tpchavoc_clickhouse_equivalence.py \
            -m "tpchavoc" -n 0 --tb=short -v

  explorer-tokens:
    name: explorer-tokens
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.explorer-paths-needed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref || 'develop' }}:refs/remotes/origin/${{ github.base_ref || 'develop' }}"

      - name: Run explorer token scan
        # Bare python is intentional: the scan is stdlib-only so this gate
        # does not pay a dependency-sync cost before deciding.
        run: make lint-explorer-tokens

  site-theme-tokens:
    name: site-theme-tokens
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.site-theme-needed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref || 'develop' }}:refs/remotes/origin/${{ github.base_ref || 'develop' }}"

      - name: Run public site theme token scan
        # Bare python is intentional: the scan is stdlib-only so this gate
        # does not pay a dependency-sync cost before deciding.
        run: make lint-site-theme-tokens

  package-smoke:
    name: package-smoke
    needs: ci-paths
    # Path-filtered: only runs when packaging metadata changed (pyproject.toml,
    # MANIFEST.in, setup.py/cfg, benchbox/__init__.py, uv.lock). Steps below are
    # copied from nightly.yml's test-package job (ubuntu/3.12 leg only - the
    # full ubuntu+windows matrix stays nightly-only, see nightly.yml:261-311).
    if: ${{ needs.ci-paths.outputs.packaging-needed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build package
        run: |
          uv build

      - name: Test package installation
        shell: bash
        run: |
          set -euo pipefail
          wheel_count=$(find dist -maxdepth 1 -name '*.whl' | wc -l | tr -d '[:space:]')
          if [ "$wheel_count" != "1" ]; then
            echo "::error::Expected exactly one wheel, found $wheel_count"
            find dist -maxdepth 1 -type f -print
            exit 1
          fi
          wheel=$(find "$PWD/dist" -maxdepth 1 -name '*.whl' -print -quit)
          tmpdir=$(mktemp -d)
          cd "$tmpdir"
          # Minimal-surface gate: a clean core install must import benchbox AND
          # must not pull pandas (optional engine/DataFrame dep). This is the
          # contract whose absence let v0.3.0 ship a broken clean install.
          uv run --isolated --no-project --with "$wheel" -- python -c "import importlib.util; import benchbox; assert importlib.util.find_spec('pandas') is None, 'core install must not pull pandas'; print('Package installation successful (minimal import surface)')"
          uv run --isolated --no-project --with "$wheel" -- benchbox --help

  dependency-audit:
    name: dependency-audit
    needs: ci-paths
    # Path-filtered on the same packaging group as package-smoke (pyproject.toml
    # / uv.lock changes are the common case that shifts the dependency graph).
    if: ${{ needs.ci-paths.outputs.packaging-needed == 'true' }}
    runs-on: ubuntu-latest
    env:
      # Comma-separated GHSA/CVE IDs for temporarily accepted false positives.
      # Keep empty unless triage is documented in the TODO item.
      # PYSEC-2026-87 (lxml): redshift-connector==2.1.13 pins lxml<=6.0.2, so
      # the fixed lxml 6.1.0 can't be resolved until upstream relaxes that
      # PYSEC-2026-3696..3699 (sqlparse): firebolt-sdk==1.18.5 requires sqlparse<0.6.0.
      PIP_AUDIT_IGNORE_VULNS: "PYSEC-2026-87,PYSEC-2026-3696,PYSEC-2026-3697,PYSEC-2026-3698,PYSEC-2026-3699"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run security audit
        run: |
          # `uvx pip-audit` runs pip-audit in its own isolated tool environment,
          # auditing pip-audit's dependencies, not BenchBox's. `uv run --with` layers
          # pip-audit onto the project environment `uv sync --group dev` just built,
          # so the dependency graph actually audited is the one pyproject.toml/uv.lock
          # produce.
          if [ -n "${PIP_AUDIT_IGNORE_VULNS}" ]; then
            IGNORE_ARGS=$(printf '%s' "${PIP_AUDIT_IGNORE_VULNS}" | tr ',' '\n' | sed '/^$/d;s/^[[:space:]]*//;s/[[:space:]]*$//;/^$/d;s/^/--ignore-vuln /' | tr '\n' ' ')
            uv run --with pip-audit -- pip-audit ${IGNORE_ARGS}
          else
            uv run --with pip-audit -- pip-audit
          fi

  explorer-vitest:
    name: explorer-vitest
    needs: ci-paths
    # The Explorer contract includes frontend source/tests, package metadata,
    # read-model/build-contract code, curated inputs, and the fixture/publish
    # scripts. The path-filter group keeps unrelated Python-only PRs from
    # installing Node while ensuring every input Vitest can exercise is gated.
    if: ${{ needs.ci-paths.outputs.explorer-vitest-needed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: results-explorer/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Install explorer dependencies
        run: npm ci
        working-directory: results-explorer

      - name: Run Explorer Vitest suite
        run: npm test -- --run
        working-directory: results-explorer

  parity-check:
    name: parity-check
    needs: ci-paths
    # Path-filtered on results-explorer/viz source changes (see
    # tracker item `parity-check-develop-ring`). `make parity-check`
    # is Python-only (no npm/vitest install), measured at well under a second
    # locally, so it is cheap enough to block develop PRs.
    #
    # PROMOTED TO THE REQUIRED LANE 2026-07-05 (parity-check-promotion): the
    # job is now observed by ci-required-result via PARITY_CHECK_RESULT with
    # the package-smoke skipped-counts-as-pass rule, and continue-on-error is
    # dropped. Both promotion criteria met: (1) one green run on a real
    # GitHub runner (PR #973, run 28742318825 job 85227174150 - the runner's
    # `make parity-check` printed "fixtures match Python source"); (2) the
    # geomean_ms 2e-13 last-bit drift seen locally did NOT reproduce on the
    # runner, so it is a local libm transcendental-precision artifact, not a
    # fixture error - exact comparison is kept and the drift is documented in
    # tests/parity/README.md. Path-filtering stays: a non-viz PR skips this
    # job and passes via skipped-counts-as-pass.
    if: ${{ needs.ci-paths.outputs.viz-needed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --group dev

      - name: Verify parity fixtures match Python source
        run: make parity-check

  publication-reconciliation:
    name: publication reconciliation
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.needs-code-ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run publication plan reconciliation (live tracker)
        env:
          TODO_DB_URL: ${{ secrets.TODO_DB_URL }}
          TODO_DB_RO_AUTH_TOKEN: ${{ secrets.TODO_DB_RO_AUTH_TOKEN }}
        run: |
          if [ -z "${TODO_DB_URL:-}" ] || [ -z "${TODO_DB_RO_AUTH_TOKEN:-}" ]; then
            echo "No tracker credentials (TODO_DB_URL/RO_AUTH_TOKEN) in this run; skipping live publication reconciliation (no live evidence)."
            exit 0
          fi
          uv run python scripts/publication/check_plan_reconciliation.py --todo-prefix independent-publication-

  audit-sha:
    name: audit-sha
    needs: ci-paths
    if: ${{ contains(needs.ci-paths.outputs.changed-paths, '_project/audits/') || contains(needs.ci-paths.outputs.changed-paths, 'results-explorer/e2e/captures/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref || 'develop' }}
        run: git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Validate changed audit develop SHA stamps
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACMRT "origin/${{ github.base_ref || 'develop' }}...HEAD" \
            | grep -E '^_project/audits/.*\.md$' > /tmp/changed-audits.txt || true
          if [ ! -s /tmp/changed-audits.txt ]; then
            echo "No changed audit Markdown files to validate."
            exit 0
          fi
          while IFS= read -r audit_path; do
            make audit-sha-check FILE="$audit_path" AUDIT_SHA_TARGET_REF="origin/${{ github.base_ref || 'develop' }}"
          done < /tmp/changed-audits.txt

  certification-identity:
    name: certification-identity
    needs: ci-paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record certification identity
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          SYNTHETIC_MERGE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          NEEDS_CODE_CI: ${{ needs.ci-paths.outputs.needs-code-ci }}
          SKILL_INTEGRITY_NEEDED: ${{ needs.ci-paths.outputs.skill-integrity-needed }}
          CONTENT_GUARD_NEEDED: ${{ needs.ci-paths.outputs.content-guard-needed }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          def git(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True).strip()

          head = os.environ["HEAD_SHA"]
          base = os.environ["BASE_SHA"]
          merge = os.environ["SYNTHETIC_MERGE_SHA"]
          files = [
              ".github/workflows/pr.yml",
              ".github/workflows/results-explorer-browser.yml",
              ".github/workflows/develop-ruleset-drift.yml",
          ]
          entries = {}
          for path in files:
              data = Path(path).read_bytes() if Path(path).is_file() else b""
              entries[path] = hashlib.sha256(data).hexdigest()
          fingerprint = hashlib.sha256(
              "\n".join(f"{path}={entries[path]}" for path in sorted(entries)).encode()
          ).hexdigest()
          needs_code_ci = os.environ["NEEDS_CODE_CI"] == "true"
          skill_integrity_needed = os.environ["SKILL_INTEGRITY_NEEDED"] == "true"
          content_guard_needed = os.environ["CONTENT_GUARD_NEEDED"] == "true"
          if needs_code_ci:
              certification_kind = "full"
          elif skill_integrity_needed:
              certification_kind = "skill_integrity"
          else:
              certification_kind = "content"
          selected_lanes = [
              lane
              for lane, selected in (
                  ("content", content_guard_needed),
                  ("product-code", needs_code_ci),
                  ("skill-integrity", skill_integrity_needed),
              )
              if selected
          ]
          record = {
              "pr_head_sha": head,
              "base_sha": base,
              "synthetic_merge_sha": merge,
              "synthetic_merge_tree": git("rev-parse", "HEAD^{tree}"),
              "workflow_fingerprint": fingerprint,
              "run_id": int(os.environ["RUN_ID"]),
              "certification_kind": certification_kind,
              "selected_lanes": selected_lanes,
          }
          Path("pr-certification-identity.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload certification identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-certification-identity
          path: pr-certification-identity.json
          if-no-files-found: warn
          retention-days: 30

  ci-required-result:
    name: ci-required-result
    needs: [ci-paths, tpch-binary-framing, content-guard, skill-integrity, code-lint, code-test, correctness-gate, plan-capture-gate, medium-test, explorer-tokens, site-theme-tokens, explorer-vitest, audit-sha, package-smoke, dependency-audit, parity-check, publication-reconciliation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate required result
        env:
          CI_PATHS_RESULT: ${{ needs.ci-paths.result }}
          TPCH_BINARY_FRAMING_RESULT: ${{ needs.tpch-binary-framing.result }}
          CONTENT_RESULT: ${{ needs.content-guard.result }}
          SKILL_INTEGRITY_RESULT: ${{ needs.skill-integrity.result }}
          LINT_RESULT: ${{ needs.code-lint.result }}
          TEST_RESULT: ${{ needs.code-test.result }}
          CORRECTNESS_RESULT: ${{ needs.correctness-gate.result }}
          PLAN_CAPTURE_RESULT: ${{ needs.plan-capture-gate.result }}
          MEDIUM_TEST_RESULT: ${{ needs.medium-test.result }}
          EXPLORER_TOKENS_RESULT: ${{ needs.explorer-tokens.result }}
          SITE_THEME_TOKENS_RESULT: ${{ needs.site-theme-tokens.result }}
          EXPLORER_VITEST_RESULT: ${{ needs.explorer-vitest.result }}
          AUDIT_SHA_RESULT: ${{ needs.audit-sha.result }}
          PACKAGE_SMOKE_RESULT: ${{ needs.package-smoke.result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          PARITY_CHECK_RESULT: ${{ needs.parity-check.result }}
          PUBLICATION_RECONCILIATION_RESULT: ${{ needs.publication-reconciliation.result }}
          CONTENT_GUARD_NEEDED: ${{ needs.ci-paths.outputs.content-guard-needed }}
          SKILL_INTEGRITY_NEEDED: ${{ needs.ci-paths.outputs.skill-integrity-needed }}
          NEEDS_CODE_CI: ${{ needs.ci-paths.outputs.needs-code-ci }}
          SAFE_CONTENT_ONLY: ${{ needs.ci-paths.outputs.safe-content-only }}
        run: |
          set -euo pipefail

          if [ "$CI_PATHS_RESULT" != "success" ]; then
            echo "ci-paths=$CI_PATHS_RESULT"
            exit 1
          fi

          if [ "$NEEDS_CODE_CI" = "true" ] && [ "$TPCH_BINARY_FRAMING_RESULT" != "success" ]; then
            echo "tpch-binary-framing=$TPCH_BINARY_FRAMING_RESULT"
            exit 1
          fi

          if [ "$CONTENT_GUARD_NEEDED" = "true" ] && [ "$CONTENT_RESULT" != "success" ]; then
            echo "content-guard=$CONTENT_RESULT"
            exit 1
          fi

          if [ "$SKILL_INTEGRITY_NEEDED" = "true" ]; then
            if [ "$SKILL_INTEGRITY_RESULT" != "success" ]; then
              echo "skill-integrity=$SKILL_INTEGRITY_RESULT"
              exit 1
            fi
          elif [ "$SKILL_INTEGRITY_RESULT" != "skipped" ] \
              && [ "$SKILL_INTEGRITY_RESULT" != "success" ]; then
            echo "unexpected skill-integrity result=$SKILL_INTEGRITY_RESULT"
            exit 1
          fi

          if [ "$AUDIT_SHA_RESULT" != "success" ] \
              && [ "$AUDIT_SHA_RESULT" != "skipped" ]; then
            echo "audit-sha=$AUDIT_SHA_RESULT"
            exit 1
          fi

          # package-smoke/dependency-audit are gated on the packaging path
          # filter. A "skipped" result (the filter did not match) counts as
          # success - a PR that never touched packaging paths must still
          # pass. A PR that DID touch those paths gets a real success/failure
          # result from the job itself, so this cannot silently green a
          # packaging regression (pr-gate-package-and-audit-promotion.yaml).
          if [ "$PACKAGE_SMOKE_RESULT" != "success" ] \
              && [ "$PACKAGE_SMOKE_RESULT" != "skipped" ]; then
            echo "package-smoke=$PACKAGE_SMOKE_RESULT"
            exit 1
          fi

          if [ "$DEPENDENCY_AUDIT_RESULT" != "success" ] \
              && [ "$DEPENDENCY_AUDIT_RESULT" != "skipped" ]; then
            echo "dependency-audit=$DEPENDENCY_AUDIT_RESULT"
            exit 1
          fi

          # parity-check is gated on the viz path filter with the same
          # skipped-counts-as-pass rule (promoted 2026-07-05,
          # parity-check-promotion): a non-viz PR skips it and passes, a
          # viz-touching PR gets a real success/failure so a CLI-vs-explorer
          # numeric parity regression now blocks merge instead of showing
          # red-but-mergeable.
          if [ "$PARITY_CHECK_RESULT" != "success" ] \
              && [ "$PARITY_CHECK_RESULT" != "skipped" ]; then
            echo "parity-check=$PARITY_CHECK_RESULT"
            exit 1
          fi

          if [ "$NEEDS_CODE_CI" = "true" ] && [ "$PUBLICATION_RECONCILIATION_RESULT" != "success" ]; then
            echo "publication-reconciliation=$PUBLICATION_RECONCILIATION_RESULT"
            exit 1
          fi

          if [ "$NEEDS_CODE_CI" = "false" ]; then
            if [ "$SKILL_INTEGRITY_NEEDED" = "true" ]; then
              echo "Skill-integrity-only PR; required skill checks passed and product CI was skipped."
            else
              echo "Content-only PR; applicable content checks passed and product CI was skipped."
            fi
            echo "safe-content-only=$SAFE_CONTENT_ONLY"
            exit 0
          fi

          # explorer-tokens is gated on explorer-paths-needed; when it runs it
          # must pass. A "skipped" result is still accepted defensively for a
          # path-filtered job that did not need to run.
          if [ "$EXPLORER_TOKENS_RESULT" != "success" ] \
              && [ "$EXPLORER_TOKENS_RESULT" != "skipped" ]; then
            echo "explorer-tokens=$EXPLORER_TOKENS_RESULT"
            exit 1
          fi

          # The public site theme scan has its own path group because its
          # inputs are broader than results-explorer/src/**. A matched group
          # must produce a real successful result before the required context
          # can pass.
          if [ "$SITE_THEME_TOKENS_RESULT" != "success" ] \
              && [ "$SITE_THEME_TOKENS_RESULT" != "skipped" ]; then
            echo "site-theme-tokens=$SITE_THEME_TOKENS_RESULT"
            exit 1
          fi

          # Explorer Vitest is path-filtered on the complete frontend/read-model
          # contract. A skipped result is intentional only when the contract
          # group did not match; a real failure must block the required context.
          if [ "$EXPLORER_VITEST_RESULT" != "success" ] \
              && [ "$EXPLORER_VITEST_RESULT" != "skipped" ]; then
            echo "explorer-vitest=$EXPLORER_VITEST_RESULT"
            exit 1
          fi

          if [ "$LINT_RESULT" = "success" ] \
              && [ "$TEST_RESULT" = "success" ] \
              && [ "$CORRECTNESS_RESULT" = "success" ] \
              && [ "$PLAN_CAPTURE_RESULT" = "success" ] \
              && [ "$MEDIUM_TEST_RESULT" = "success" ]; then
            echo "Code/infra PR; lint, fast tests, correctness gate, plan-capture gate, and medium tier passed."
            exit 0
          fi

          echo "code-lint=$LINT_RESULT code-test=$TEST_RESULT correctness-gate=$CORRECTNESS_RESULT plan-capture-gate=$PLAN_CAPTURE_RESULT medium-test=$MEDIUM_TEST_RESULT"
          exit 1

      - name: Record certification lane evidence
        if: always()
        env:
          CI_PATHS_RESULT: ${{ needs.ci-paths.result }}
          TPCH_BINARY_FRAMING_RESULT: ${{ needs.tpch-binary-framing.result }}
          CONTENT_RESULT: ${{ needs.content-guard.result }}
          SKILL_INTEGRITY_RESULT: ${{ needs.skill-integrity.result }}
          LINT_RESULT: ${{ needs.code-lint.result }}
          TEST_RESULT: ${{ needs.code-test.result }}
          CORRECTNESS_RESULT: ${{ needs.correctness-gate.result }}
          PLAN_CAPTURE_RESULT: ${{ needs.plan-capture-gate.result }}
          MEDIUM_TEST_RESULT: ${{ needs.medium-test.result }}
          EXPLORER_TOKENS_RESULT: ${{ needs.explorer-tokens.result }}
          SITE_THEME_TOKENS_RESULT: ${{ needs.site-theme-tokens.result }}
          EXPLORER_VITEST_RESULT: ${{ needs.explorer-vitest.result }}
          AUDIT_SHA_RESULT: ${{ needs.audit-sha.result }}
          PACKAGE_SMOKE_RESULT: ${{ needs.package-smoke.result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          PARITY_CHECK_RESULT: ${{ needs.parity-check.result }}
          NEEDS_CODE_CI: ${{ needs.ci-paths.outputs.needs-code-ci }}
          SKILL_INTEGRITY_NEEDED: ${{ needs.ci-paths.outputs.skill-integrity-needed }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          record = {
              "run_id": int(os.environ["RUN_ID"]),
              "pr_head_sha": os.environ.get("HEAD_SHA") or "",
              "base_sha": os.environ.get("BASE_SHA") or "",
              "needs_code_ci": os.environ.get("NEEDS_CODE_CI") or "",
              "skill_integrity_needed": os.environ.get("SKILL_INTEGRITY_NEEDED") or "",
              "lanes": {
                  "ci-paths": os.environ.get("CI_PATHS_RESULT") or "",
                  "tpch-binary-framing": os.environ.get("TPCH_BINARY_FRAMING_RESULT") or "",
                  "content-guard": os.environ.get("CONTENT_RESULT") or "",
                  "skill-integrity": os.environ.get("SKILL_INTEGRITY_RESULT") or "",
                  "code-lint": os.environ.get("LINT_RESULT") or "",
                  "code-test": os.environ.get("TEST_RESULT") or "",
                  "correctness-gate": os.environ.get("CORRECTNESS_RESULT") or "",
                  "plan-capture-gate": os.environ.get("PLAN_CAPTURE_RESULT") or "",
                  "medium-test": os.environ.get("MEDIUM_TEST_RESULT") or "",
                  "explorer-tokens": os.environ.get("EXPLORER_TOKENS_RESULT") or "",
                  "site-theme-tokens": os.environ.get("SITE_THEME_TOKENS_RESULT") or "",
                  "explorer-vitest": os.environ.get("EXPLORER_VITEST_RESULT") or "",
                  "audit-sha": os.environ.get("AUDIT_SHA_RESULT") or "",
                  "package-smoke": os.environ.get("PACKAGE_SMOKE_RESULT") or "",
                  "dependency-audit": os.environ.get("DEPENDENCY_AUDIT_RESULT") or "",
                  "parity-check": os.environ.get("PARITY_CHECK_RESULT") or "",
              },
          }
          Path("pr-certification-lanes.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload certification lane evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pr-certification-lanes
          path: pr-certification-lanes.json
          if-no-files-found: warn
          retention-days: 30
