name: Extension Smoke

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'benchbox/core/write_primitives/**'
      - 'benchbox/core/read_primitives/**'
      - 'scripts/duckdb_datasketches_smoke.py'
      - '.github/workflows/extension-smoke.yml'
  schedule:
    # Daily at 06:00 UTC catches upstream community-extensions rebuilds
    # even when no BenchBox PR exercises the relevant code paths.
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: extension-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  duckdb-datasketches:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install duckdb only
        run: uv sync --no-dev --no-install-project

      # Intentionally no extension cache: the point is to detect upstream rebuilds.
      - name: Run datasketches smoke
        run: uv run -- python scripts/duckdb_datasketches_smoke.py
