# Shared path rules for the develop PR CI classifier.
#
# The classifier fails closed: every changed path must match `safe-content`
# or the explicitly governed `skill-integrity` class before product code CI
# can be skipped. Any other non-code-ci path, including a new top-level area,
# is treated as unknown code. `safe-content` lists prose-only extensions, not
# directories. Directories like `docs/` and `_project/` mix prose with
# executable code (Sphinx config, extension modules, helper scripts) — those
# code paths must run lint/type/test like any other code.
safe-content:
  - "_project/blind-spots/**"
  - "_project/decisions/**"
  - "_project/handoffs/**"
  - "_project/notes/**"
  - "_project/research/**"
  - "_project/planning/**"
  # Historical machine-generated tracker snapshots. Data, not authored prose,
  # so they remain safe-content but NOT content-guard.
  - "_project/todo-db-export/**"
  - "_blog/**.md"
  - "_blog/**.rst"
  - "_blog/**.png"
  - "_blog/**.jpg"
  - "_blog/**.jpeg"
  - "_blog/**.gif"
  - "_blog/**.svg"
  - "_blog/**.json"
  - "docs/**.md"
  - "docs/**.rst"
  - "docs/**.txt"
  - "*.md"
  - "CLAUDE.md"
  - "AGENTS.md"

# Documentation-only changes are validated by the content guard. The guard
# patterns intentionally stay broader than `safe-content` so a docs change
# that touches both prose and Sphinx code still triggers docs-validate
# alongside the full PR tier.
content-guard:
  - "_project/blind-spots/**"
  - "_project/decisions/**"
  - "_project/handoffs/**"
  - "_project/notes/**"
  - "_project/research/**"
  - "_project/planning/**"
  - "_blog/**"
  - "docs/**"
  - "*.md"
  - "CLAUDE.md"
  - "AGENTS.md"

# Explicit code paths. Unknown paths also fall through to `code-ci` because
# the classifier fails closed when no `safe-content` pattern matches. The
# `docs/**.{py,js,css,html,jinja,j2}` and explicit `docs/conf.py` /
# `docs/Makefile` / `docs/_extensions/**` / `docs/_static/**` /
# `docs/_templates/**` patterns route the Sphinx machinery (which is
# executable Python and templates, not prose) through full lint/type/test.
code-ci:
  - "benchbox/**"
  - "tests/**"
  - "scripts/**"
  - "examples/**"
  - "landing/**"
  - "results-data/**"
  - "results-explorer/**"
  - "website/**"
  - "docker/**"
  - "_binaries/**"
  - "_sources/**"
  - "_project/scripts/**"
  - "_project/evals/agent-instructions/**"
  - "_project/config/**"
  - "_project/compat/**"
  - "docs/conf.py"
  - "docs/Makefile"
  - "docs/_extensions/**"
  - "docs/_static/**"
  - "docs/_templates/**"
  - "docs/**.py"
  - "docs/**.js"
  - "docs/**.css"
  - "docs/**.html"
  - "docs/**.jinja"
  - "docs/**.j2"
  - "docs/agent/**"
  # This Markdown file is executable CI input: audit-raw-check parses it as
  # the dependency allowlist/inventory, so prose-only routing is unsafe.
  - "docs/development/dependency-audit-raw.md"
  - "docs/operations/agent-instruction*.md"
  - "pyproject.toml"
  - "uv.lock"
  - "Makefile"
  - ".github/workflows/**"
  # Self-protection: editing the classifier rules must always receive full CI.
  - ".github/path-filters.yml"
  - ".pre-commit-config.yaml"
  - ".claude/commands/**"
  - ".claude/settings.json"
  - "CLAUDE.md"
  - "GEMINI.md"
  - "ANTIGRAVITY.md"
  - "AGENTS.md"
  - ".gitignore"
  - ".gitattributes"

# Extra path-filter groups (beyond the three core buckets above). Each key
# here becomes a `<group>-needed` boolean output from ci-paths, computed by
# path_filter_decision.py, so a ci.yml job can gate on
# `needs.ci-paths.outputs.<group>-needed == 'true'` without inventing a
# second classifier. Most extra groups only select an additional job. The
# skill-integrity group is also a first-class specialized class: when no
# explicit/unknown code path or structural manifest change exists, its paths
# are excluded from product CI and receive the dedicated integrity lane.

skill-integrity:
  - ".claude/skills/**"
  - "skill-sync.conf"
  - "tools/skill-sync"

# Packaging-metadata changes: build/install/audit signal (package-smoke,
# dependency-audit jobs in ci.yml) only needs to run when one of these
# changed. See tracker item `pr-gate-package-and-audit-promotion`.
packaging:
  - "pyproject.toml"
  - "MANIFEST.in"
  - "setup.py"
  - "setup.cfg"
  - "benchbox/__init__.py"
  - "uv.lock"

# Test-infrastructure inputs to the Windows and macOS binary framing job in
# ci.yml. Subprocess, file-lock, file-handle, HOME and plugin changes pass on
# Linux and fail only where a held lock file is unreadable and open files block
# directory cleanup. The job also runs for the bundled dbgen binaries and the
# framing test itself.
framing:
  - "tests/utilities/**"
  - "conftest.py"
  - "**/conftest.py"
  - "tests/plugins/**"
  - "tests/**/plugins/*"
  - "tests/fixtures/database_fixtures.py"
  - "tests/fixtures/test_data_fixtures.py"
  - "tests/fixtures/result_dict_fixtures.py"
  - "tests/fixtures/platform_fixtures.py"
  - "tests/fixtures/utility_fixtures.py"
  - "_benchbox_pytest_xdist_safety.py"
  - "scripts/local_validation.py"
  - "tests/duration_policy.py"
  - "pytest.ini"
  - "tests/unit/core/tpch/test_tpch_dbgen_framing_binaries.py"
  - "benchbox/__init__.py"
  - "benchbox/_binaries/tpc-h/**"
  - "_binaries/tpc-h/**"

# Results-explorer visualization / CLI<->explorer parity source changes:
# gates the parity-check job in ci.yml. See
# tracker item `parity-check-develop-ring`.
viz:
  - "results-explorer/**"
  - "tests/parity/**"
  - "_project/scripts/explorer_pipeline/**"

# Results Explorer unit-test contract. Keep this broader than the frontend
# source tree: read-model/build-contract, curated data, fixture generators,
# and publication workflow changes can all invalidate Vitest expectations.
explorer-vitest:
  - "results-explorer/**"
  - "_project/scripts/explorer_pipeline/**"
  - "_project/scripts/explorer_publish.py"
  - "results-data/**"
  - "scripts/generate_corpus_inventory.py"
  - "tests/parity/fixtures/**"
  - "tests/unit/core/tuning/fixtures/**"
  - ".github/workflows/ci.yml"
  - ".github/path-filters.yml"
  - "tests/unit/core/tuning/fixtures/tuning_mode_vocabulary.yaml"
  - "tests/parity/fixtures/chart_ids.json"

# Results Explorer source-only token contract. This intentionally stays
# narrower than explorer-vitest: the token scan is about the public source
# surface, not e2e fixtures, read-model inputs, or publication scripts.
explorer-tokens:
  - "results-explorer/src/**"

# Public site theme token contract. The scan reads these files directly, so it
# must run when any of them changes even if no Explorer source file changed.
site-theme:
  - "landing/shared/**"
  - "landing/style.css"
  - "docs/_static/custom.css"
  - "docs/_templates/page.html"
  - "results-explorer/index.html"

site:
  - "website/**"
  - "docs/**"
  - "landing/**"
  - "results-explorer/**"
  - "results-data/**"
  - "_project/scripts/explorer_pipeline/**"
  - "_project/scripts/explorer_publish.py"
  - "scripts/generate_query_docs.py"
  - "scripts/publication/check_artifact_privacy.py"
  - "Makefile"
  - "make/documentation.mk"
  - "pyproject.toml"
  - "uv.lock"
  - ".github/workflows/ci.yml"
  - ".github/path-filters.yml"
