# TEMPLATE — copy and edit for storage-constrained Docker UAT sweeps.
#
# Starts UAT-owned Docker compose projects for the docker-fast platform set and
# tears each project down with volumes at the platform switch. Switch to the
# broader docker group when you need every Docker-backed platform.

name: "stress-docker-managed"
description: "Storage-constrained Docker stress preset with UAT-owned compose lifecycle"

phases:
  - preflight
  - execute
  - report

platforms:
  groups: ["docker-fast"]

benchmarks:
  include: ["tpch"]

scales:
  rungs: [0.01]

execute:
  per_cell_timeout_s: 600
  early_stop_after_s: 180
  early_stop_on_failure: true
  phases_arg: "load,power"
  skip_unreachable: true
  parallel_platforms: false

preflight:
  free_space_min_gib: 5
  free_space_path: "~/Developer/benchmark_runs"
  docker_required: true

cleanup:
  preserve_datagen: true
  prune_databases: true
  docker_manage_platforms: true
  docker_platform_switch: "volumes"
  docker_project_prefix: "benchbox-uat"
  docker_start_timeout_s: 300
  docker_fixed_container_name_policy: "fail"

report:
  matrix_summary_tsv: "matrix_summary.tsv"

output:
  benchmark_runs_dir_template: "~/Developer/benchmark_runs"
  logs_dir_template: "~/Developer/benchmark_runs/logs/uat_docker_managed_{date}"
  submissions_dir_template: "~/Developer/benchmark_runs/submissions/{name}"
