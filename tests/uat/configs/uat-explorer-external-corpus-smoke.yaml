name: "uat-explorer-external-corpus-smoke"
description: "Small UAT run proving Explorer smoke derives routes from packaged result bundles"

phases:
  - preflight
  - execute
  - validate
  - package
  - explorer_smoke
  - report

platforms:
  include: ["duckdb"]

benchmarks:
  include: ["tpch"]

scales:
  rungs: [0.01]

execute:
  per_cell_timeout_s: 600
  early_stop_after_s: 1800
  early_stop_on_failure: true
  phases_arg: "load,power"
  skip_unreachable: true
  parallel_platforms: false

preflight:
  free_space_min_gib: 5
  free_space_path: "~/Developer/benchmark_runs"

cleanup:
  preserve_datagen: true
  prune_databases: true

validate:
  validator_clean_rate_floor: 1.0

package:
  submit_terminal_state: "local-stage"

explorer_smoke:
  playwright_browsers: ["chromium"]

report:
  matrix_summary_tsv: "matrix_summary.tsv"

output:
  benchmark_runs_dir_template: "~/Developer/benchmark_runs"
  logs_dir_template: "~/Developer/benchmark_runs/logs/uat_explorer_external_corpus_smoke_{date}"
  submissions_dir_template: "~/Developer/benchmark_runs/submissions/{name}"
