# TEMPLATE — canonical nightly-CI CedarDB throughput config; edited in
# place, not cloned per sweep. See _project/specs/uat-framework.md Section 9.
#
# Nightly real acceptance coverage for the throughput phase on a client/server
# engine that uses INDEPENDENT_CONNECTION (a fresh session per stream). The
# DuckDB cell (uat-throughput-duckdb-nightly.yaml) stays on the SHARED_CURSOR
# fast path and never exercises that capability. CedarDB inherits it from the
# PostgreSQL adapter, so this cell drives N concurrent independent sessions end
# to end through the production CLI, which the focused session-isolation tests
# (tests/integration/test_throughput_session_isolation.py) do not.
#
# Why CedarDB and not PostgreSQL: unindexed PostgreSQL cannot finish TPC-H SF1
# Q17 and Q20 within the cell (each ran past 600 s on a ubuntu runner), and the
# 64 MB default /dev/shm in a container breaks parallel queries Q4 and Q21.
# CedarDB ran the same workload on the same runner with 66 of 66 queries and 3
# of 3 streams succeeding.
#
# `benchbox run` has no `--streams` option; `benchbox run-official --streams N`
# is the CLI surface that forwards a requested stream count to the throughput
# driver. `run-official` requires a TPC-compliant scale factor, so SF=1 (the
# smallest allowed rung) is used. `streams: 3` is above the driver's 2-stream
# floor (`_resolve_requested_stream_count` in
# benchbox/platforms/base/execution.py), so the cell checks that the requested
# count was honored rather than that the floor happened to match.
#
# `seed: 20260709` matches the DuckDB cell's seed. TPC-H Q13's row count
# depends on its WORD1/WORD2 parameters (41 or 42 groups at SF1), and
# validation of that query under non-reference seeds is being made
# range-aware. Seed 20260711 yields 41 rows for Q13 in stream 1 and fails the
# fixed 42-row check on DuckDB and CedarDB alike, so it is an expectation
# difference, not an engine difference.
#
# `per_cell_timeout_s`/`early_stop_after_s` are 600 s. The measured ubuntu
# runner cell took 80 s: datagen about 35 s, load 44 s, throughput phase 2.6 s,
# validation and export the rest. 600 s is about 7 times that, enough for a
# slow runner and a cold datagen, and a hang fails in 10 minutes instead of
# consuming the lane. The job-level `timeout-minutes` still bounds the whole
# lane.
#
# The compose stack (docker/cedardb/docker-compose.yml) pins the image by
# digest and publishes the wire protocol on host port 5435, so the cell passes
# `port=5435`. Credentials and database come from the compose environment
# through `tests.uat.docker_assets`.
#
# Not run in the PR fast lane: invoke via `make uat-sweep
# CONFIG=tests/uat/configs/uat-throughput-cedardb-nightly.yaml` from the
# nightly workflow. This cell's `cleanup.docker_manage_platforms: true` brings
# the compose stack up and down itself.
name: "uat-throughput-cedardb-nightly"
description: "Nightly: real multi-stream throughput phase on CedarDB TPC-H SF1 (run-official --streams 3, INDEPENDENT_CONNECTION)"

phases:
  - preflight
  - execute
  - validate
  - report

platforms:
  include: ["cedardb"]

benchmarks:
  include: ["tpch"]

scales:
  rungs: [1]

execute:
  per_cell_timeout_s: 600
  early_stop_after_s: 600
  early_stop_on_failure: false
  phases_arg: "load,throughput"
  skip_unreachable: true
  parallel_platforms: false
  official: true
  streams: 3
  seed: 20260709
  extra_args:
    - "--platform-option"
    - "port=5435"

preflight:
  free_space_min_gib: 5
  free_space_path: "~/Developer/benchmark_runs"
  docker_required: true

cleanup:
  preserve_datagen: true
  prune_databases: true
  docker_manage_platforms: true
  docker_platform_switch: "volumes"
  docker_project_prefix: "benchbox-uat-tp-cedar"
  docker_start_timeout_s: 300
  docker_fixed_container_name_policy: "fail"

validate:
  validator_clean_rate_floor: 1.0

report:
  matrix_summary_tsv: "matrix_summary.tsv"

output:
  benchmark_runs_dir_template: "~/Developer/benchmark_runs"
  logs_dir_template: "~/Developer/benchmark_runs/logs/uat_throughput_cedardb_nightly_{date}"
  submissions_dir_template: "~/Developer/benchmark_runs/submissions/{name}"
