# TEMPLATE — small throughput-phase explorer coverage sweep. See
# _project/specs/uat-framework.md Section 9.
name: "uat-throughput-explorer-smoke"
description: "Throughput-phase explorer coverage: DuckDB TPC-H SF1 multi-stream cell through package and explorer smoke"

phases:
  - preflight
  - execute
  - validate
  - package
  - explorer_smoke
  - report

platforms:
  include: ["duckdb"]

benchmarks:
  include: ["tpch"]

scales:
  rungs: [1]

execute:
  per_cell_timeout_s: 900
  early_stop_after_s: 900
  early_stop_on_failure: false
  phases_arg: "load,throughput"
  skip_unreachable: true
  parallel_platforms: false
  official: true
  streams: 3
  seed: 20260926

preflight:
  free_space_min_gib: 5
  free_space_path: "~/Developer/benchmark_runs"
  docker_required: false

cleanup:
  preserve_datagen: true
  prune_databases: true
  docker_manage_platforms: false
  docker_platform_switch: "off"

validate:
  validator_clean_rate_floor: 1.0

package:
  submit_terminal_state: "local-stage"

explorer_smoke:
  playwright_browsers: ["chromium"]
  require_throughput_streams: 3

report:
  matrix_summary_tsv: "matrix_summary.tsv"

output:
  benchmark_runs_dir_template: "~/Developer/benchmark_runs"
  logs_dir_template: "~/Developer/benchmark_runs/logs/uat_throughput_explorer_smoke_{date}_{time}"
  submissions_dir_template: "~/Developer/benchmark_runs/submissions/{name}"
