# TEMPLATE — small throughput-phase explorer coverage sweep. See
# _project/specs/uat-framework.md Section 9.
#
# Covers the deferral gap from results-explorer-uat-multi-scale-corpus-sweep
# #259: that sweep ran `--phases load,power` only, so no explorer corpus
# exercised throughput-phase rendering. This config runs one real
# multi-stream throughput cell (DuckDB TPC-H SF1, run-official --streams 3,
# the same shape as the nightly throughput-uat cell) through the full
# package + explorer_smoke path so the browser smoke validates throughput
# bundles end to end.
#
# Not run in the PR fast lane: invoke via `make uat-sweep
# CONFIG=tests/uat/configs/uat-throughput-explorer-smoke.yaml`. Wall clock
# is roughly 10-15 minutes for the SF1 throughput cell, so the timeouts
# below match the nightly cell rather than the 10-minute load/power cap
# that originally deferred this coverage.
name: "uat-throughput-explorer-smoke"
description: "Throughput-phase explorer coverage: DuckDB TPC-H SF1 multi-stream cell through package and explorer smoke"

phases:
  - preflight
  - execute
  - validate
  - package
  - explorer_smoke
  - report

platforms:
  include: ["duckdb"]

benchmarks:
  include: ["tpch"]

scales:
  rungs: [1]

execute:
  per_cell_timeout_s: 900
  early_stop_after_s: 900
  early_stop_on_failure: false
  phases_arg: "load,throughput"
  skip_unreachable: true
  parallel_platforms: false
  official: true
  streams: 3
  seed: 20260926

preflight:
  free_space_min_gib: 5
  free_space_path: "~/Developer/benchmark_runs"
  docker_required: false

cleanup:
  preserve_datagen: true
  prune_databases: true
  docker_manage_platforms: false
  docker_platform_switch: "off"

validate:
  validator_clean_rate_floor: 1.0

package:
  submit_terminal_state: "local-stage"

explorer_smoke:
  playwright_browsers: ["chromium"]

report:
  matrix_summary_tsv: "matrix_summary.tsv"

output:
  benchmark_runs_dir_template: "~/Developer/benchmark_runs"
  # {time} keeps same-day reruns in separate log dirs: execute.py only
  # applies collision suffixing when the template contains {time}, so a
  # date-only template would overwrite the previous run's artifacts.
  logs_dir_template: "~/Developer/benchmark_runs/logs/uat_throughput_explorer_smoke_{date}_{time}"
  submissions_dir_template: "~/Developer/benchmark_runs/submissions/{name}"
