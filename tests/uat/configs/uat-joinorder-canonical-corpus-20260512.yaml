# TEMPLATE - canonical JoinOrder corpus backfill for Issue #289.
name: "uat-joinorder-canonical-corpus-20260512"
description: "Full canonical JoinOrder SF=1 UAT and local-stage corpus backfill"

phases:
  - preflight
  - execute
  - validate
  - package
  - report

dry_run: false

platforms:
  include:
    - duckdb
    - clickhouse-local
    - lakesail

benchmarks:
  include:
    - joinorder

scales:
  override: 1.0

execute:
  per_cell_timeout_s: 7200
  early_stop_after_s: 7200
  early_stop_on_failure: true
  phases_arg: "load,power"
  skip_unreachable: false

preflight:
  free_space_min_gib: 5
  free_space_path: "~/Developer/benchmark_runs"

cleanup:
  preserve_datagen: true
  prune_databases: true
  docker_manage_platforms: false
  docker_platform_switch: "off"

validate:
  validator_clean_rate_floor: 1.0

package:
  submit_terminal_state: "local-stage"

report:
  matrix_summary_tsv: "matrix_summary.tsv"
  cross_scale_coverage_min_pairs: null

output:
  benchmark_runs_dir_template: "~/Developer/benchmark_runs"
  logs_dir_template: "~/Developer/benchmark_runs/logs/uat_joinorder_canonical_corpus_20260512"
  submissions_dir_template: "~/Developer/benchmark_runs/submissions/uat_joinorder_canonical_corpus_20260512"
