# Release-gate re-run — STAGE 2 of 3: Docker non-OLTP stacks.
#
# Start ONLY after release-gate-01-native-dataframe.yaml has fully completed
# (its report reached the COMPLETED footer). The release-gate ordering check
# (tests/uat/phases/report.py::release_gate_ordering_violations) verifies that
# no Docker `action=up` in this stage's uat_lifecycle.log precedes the stage-1
# completion timestamp recorded in the runbook.
#
# UAT-managed Docker lifecycle: one stack at a time, project-scoped teardown
# only. A single stack's compose-up failure records FAIL and the sweep advances
# (see uat-docker-stack-recovery), so a slow/broken stack cannot empty the run.
name: "release-gate-02-docker-nonoltp"
description: "Release-gate stage 2: Docker non-OLTP stacks, scales 0.01/0.1/1"

phases:
  - preflight
  - execute
  - validate
  - package
  - explorer_smoke
  - report

platforms:
  groups: ["docker-fast"]

benchmarks:
  groups: ["all"]

scales:
  rungs: [0.01, 0.1, 1.0]

execute:
  per_cell_timeout_s: 1200
  early_stop_after_s: 86400
  early_stop_on_failure: false
  phases_arg: "load,power"
  skip_unreachable: true
  parallel_platforms: false

preflight:
  free_space_min_gib: 5
  free_space_path: "~/Developer/benchmark_runs"
  docker_required: true

cleanup:
  preserve_datagen: true
  prune_databases: true
  docker_manage_platforms: true
  docker_platform_switch: "volumes"
  docker_project_prefix: "benchbox-uat-gate"
  # Provisional: set from a measured healthy startup during bring-up (see the
  # "measure-then-set" guidance), especially for the LakeSail Spark Connect
  # service which exceeded the prior 300s default.
  docker_start_timeout_s: 300
  docker_fixed_container_name_policy: "fail"

validate:
  validator_clean_rate_floor: 1.0

report:
  matrix_summary_tsv: "matrix_summary.tsv"
  # Derivation (uat-release-gate-enforcement w4, 2026-07-12, develop @ acfb89922):
  # enumerate_cells_with_pruning over this config yields 64 pairs with every
  # rung (0.01/0.1/1.0) enumerable (83 raw pairs minus 19 whose registry scale
  # ladder omits a rung). floor = max(4, floor(0.8 * 64)) = 51. The 0.8 slack
  # absorbs a down docker stack without letting a mass regression sign off;
  # never set this to the eligible count exactly.
  cross_scale_coverage_min_pairs: 51

output:
  benchmark_runs_dir_template: "~/Developer/benchmark_runs"
  logs_dir_template: "~/Developer/benchmark_runs/logs/release_gate_02_docker_nonoltp_{date}"
  submissions_dir_template: "~/Developer/benchmark_runs/submissions/{name}"
