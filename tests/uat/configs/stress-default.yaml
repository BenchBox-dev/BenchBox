# TEMPLATE — copy and edit for sweep-specific runs.
#
# Default stress preset. Feature parity with scripts/local_stress_test.sh
# for the stress-test use case: one scale, no validate/package/explorer
# phases. PLATFORM=, BENCHMARK=, SCALE= make-vars override the matrix
# fields per the `apply_stress_overrides` contract documented in
# `_project/specs/uat-framework.md` Section 4.

name: "stress-default"
description: "Stress preset — verify 'does it run?' across the (platform, benchmark) matrix"

phases:
  - preflight
  - enumerate
  - execute
  - report

platforms:
  groups: ["sql"]

benchmarks:
  groups: ["all"]

scales:
  rungs: [0.01]

execute:
  per_cell_timeout_s: 600
  early_stop_after_s: 180
  early_stop_on_failure: true
  phases_arg: "load,power"
  skip_unreachable: true

preflight:
  free_space_min_gib: 5
  free_space_path: "~/Developer/benchmark_runs"

cleanup:
  preserve_datagen: true
  prune_databases: true
  # Default stress behavior matches the historical externally managed Docker flow:
  # UAT probes local TCP ports and skips unreachable Docker-backed platforms.
  docker_manage_platforms: false
  docker_platform_switch: "off"
  docker_project_prefix: "benchbox-uat"
  docker_start_timeout_s: 300
  docker_fixed_container_name_policy: "fail"

report:
  matrix_summary_tsv: "matrix_summary.tsv"

output:
  logs_dir_template: "~/Developer/benchmark_runs/logs/uat_stress_{date}"
  submissions_dir_template: "~/Developer/benchmark_runs/submissions/{name}"
