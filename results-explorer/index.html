<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/results/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BenchBox Results Explorer - browse, compare, and analyze public benchmark results across platforms." />
    <title>BenchBox Results Explorer</title>
    <script>
      (function () {
        try {
          var choice = localStorage.getItem("benchbox:theme") || "system";
          var dark = choice === "dark" || (choice === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.bbThemeChoice = choice;
          document.documentElement.dataset.bbTheme = dark ? "dark" : "light";
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
